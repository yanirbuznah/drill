ughly eight", "It lowers the attention cost from O(n^2) to O(n^2 / 8)", "It lets the layer attend to several distinct patterns at once", "It removes the need for the softmax normalization step"], "hint": "One softmax gives you one weighted average. How many do you want?", "explanation": "A single attention distribution can only produce one weighted average per token, so competing relations (syntactic neighbour, coreferent, nearby position) collide. Splitting into subspaces lets each head form its own distribution, and the outputs are concatenated and projected. Total parameters and FLOPs stay essentially the same since 8 * 64 = 512 — the common misconception is that heads add capacity.", "whyWrong": ["Head dimensions divide d_model, so the projection matrices keep the same total size.", "Total attention work is unchanged: eight heads each operating on one eighth of the dimension.", "Every head still applies its own softmax over the sequence positions."]}, "he": {"q": "מדוע להשתמש ב-8 heads בממד 64 במקום ב-head יחיד בממד 512?", "options": ["זה מכפיל את מספר הפרמטרים של השכבה בערך פי שמונה", "זה מוריד את עלות הקשב מ-O(n^2) ל-O(n^2 / 8)", "זה מאפשר לשכבה להתמקד בכמה תבניות שונות בו-זמנית", "זה מייתר את שלב הנרמול של ה-softmax"], "hint": "softmax אחד נותן לכם ממוצע משוקלל אחד. כמה אתם רוצים?", "explanation": "התפלגות קשב יחידה יכולה לייצר רק ממוצע משוקלל אחד לכל טוקן, ולכן יחסים מתחרים (שכן תחבירי, אזכור, מיקום סמוך) מתנגשים. פיצול לתת-מרחבים מאפשר לכל head לבנות התפלגות משלו, והפלטים משורשרים ומוקרנים. סך הפרמטרים וה-FLOPs נשאר כמעט זהה כי 8 * 64 = 512, והטעות הנפוצה היא לחשוב ש-heads מוסיפים קיבולת.", "whyWrong": ["ממדי ה-heads מחלקים את d_model, ולכן מטריצות ההיטל שומרות על אותו גודל כולל.", "סך עבודת הקשב אינו משתנה: שמונה heads, כל אחד על שמינית מהממד.", "כל head עדיין מפעיל softmax משלו על מיקומי הרצף."]}}, {"id": "arc-014", "area": "architectures", "topic": "causal-masking", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["transformer", "decoder", "masking"], "answer": 3, "en": {"q": "In a decoder-only language model, how is causal masking implemented?", "options": ["By deleting future tokens from the input sequence at each step", "By zeroing out the attention weights after the softmax", "By reversing the sequence so that future tokens come last", "By setting future-position scores to -inf before the softmax"], "hint": "Where in the attention pipeline must the mask act so the weights still sum to one?", "explanation": "The mask is added to the raw scores, sending disallowed positions to -inf so softmax maps them to exactly zero while the remaining weights still normalize to one. Zeroing after the softmax would leave the row un-normalized. This masking is what separates a decoder stack from an encoder stack, which attends bidirectionally.", "whyWrong": ["Deleting tokens would need a separate forward pass per position and destroy parallel training.", "Zeroing after the softmax leaves a row that sums to less than one and distorts the weighted average.", "Reversing the sequence only flips the direction of the leak; it does not prevent peeking ahead."]}, "he": {"q": "במודל שפה מסוג decoder-only, כיצד ממומש מיסוך סיבתי (causal masking)?", "options": ["על ידי מחיקת טוקנים עתידיים מרצף הקלט בכל צעד", "על ידי איפוס משקלי הקשב אחרי ה-softmax", "על ידי היפוך הרצף כך שהטוקנים העתידיים יופיעו בסוף", "על ידי קביעת ציוני המיקומים העתידיים ל--inf לפני ה-softmax"], "hint": "היכן בצינור הקשב חייב המסך לפעול כדי שהמשקלים עדיין יסתכמו ל-1?", "explanation": "המסך מתווסף לציונים הגולמיים ושולח מיקומים אסורים ל--inf, כך שה-softmax ממפה אותם בדיוק לאפס בעוד ששאר המשקלים עדיין מנורמלים לסכום 1. איפוס אחרי ה-softmax היה משאיר את השורה לא מנורמלת. המיסוך הזה הוא מה שמבדיל מחסנית decoder ממחסנית encoder, שבה הקשב דו-כיווני.", "whyWrong": ["מחיקת טוקנים תדרוש מעבר קדימה נפרד לכל מיקום ותהרוס את האימון המקבילי.", "איפוס אחרי ה-softmax משאיר שורה שסכומה קטן מ-1 ומעוות את הממוצע המשוקלל.", "היפוך הרצף רק הופך את כיוון הדליפה; הוא אינו מונע הצצה קדימה."]}}, {"id": "arc-015", "area": "architectures", "topic": "transformer-ffn", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["transformer", "ffn", "capacity"], "answer": 0, "en": {"q": "What is the position-wise feed-forward network in a Transformer block actually for?", "options": ["Per-token nonlinear feature transformation in a wider hidden space", "Mixing information between tokens that attention failed to capture", "Normalizing token representations before the next attention layer", "Compressing the sequence length before the next block runs"], "hint": "It sees exactly one token at a time. So what can it possibly do?", "explanation": "The FFN applies the same two-layer MLP independently at each position, usually expanding to 4 * d_model and back, so it adds nonlinear capacity and behaves like a per-token key-value memory. Attention moves information between tokens; the FFN transforms it. Because of the 4x expansion, the FFN holds roughly two thirds of a block's parameters.", "whyWrong": ["The FFN never sees other tokens, so it cannot mix information between positions at all.", "Normalization is done by dedicated LayerNorm layers, not by the feed-forward sublayer.", "Sequence length is preserved; the block returns a tensor with the same number of tokens."]}, "he": {"q": "לשם מה בעצם משמשת שכבת ה-feed-forward הפועלת לכל מיקום (position-wise) בבלוק Transformer?", "options": ["טרנספורמציה לא-לינארית של כל טוקן בנפרד במרחב חבוי רחב יותר", "ערבוב מידע בין טוקנים שמנגנון הקשב לא הצליח לתפוס", "נרמול ייצוגי הטוקנים לפני שכבת הקשב הבאה", "כיווץ אורך הרצף לפני הרצת הבלוק הבא"], "hint": "היא רואה בדיוק טוקן אחד בכל פעם. אז מה היא בכלל יכולה לעשות?", "explanation": "ה-FFN מפעיל את אותו MLP דו-שכבתי באופן בלתי תלוי בכל מיקום, בדרך כלל בהרחבה ל-4 * d_model וחזרה, ולכן הוא מוסיף קיבולת לא-לינארית ומתנהג כמעין זיכרון מפתח-ערך לכל טוקן. הקשב מעביר מידע בין טוקנים, וה-FFN מעבד אותו. בגלל ההרחבה פי 4, ה-FFN מחזיק כשני שלישים מפרמטרי הבלוק.", "whyWrong": ["ה-FFN אינו רואה טוקנים אחרים כלל, ולכן אינו יכול לערבב מידע בין מיקומים.", "הנרמול נעשה בשכבות LayerNorm ייעודיות ולא בתת-השכבה ה-feed-forward.", "אורך הרצף נשמר; הבלוק מחזיר טנזור עם אותו מספר טוקנים."]}}, {"id": "arc-016", "area": "architectures", "topic": "vae-reparameterization", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["vae", "reparameterization", "gradients"], "answer": 1, "en": {"q": "Why does a VAE sample z as mu + sigma * epsilon with epsilon ~ N(0, I) instead of sampling directly from N(mu, sigma^2)?", "options": ["It makes the KL term against the prior available in closed form", "It moves the randomness off the path the gradient has to travel", "It guarantees the latent posterior stays exactly Gaussian", "It reduces the variance of the reconstruction loss estimate"], "hint": "Can you backpropagate through a sampling operation?", "explanation": "Sampling is not differentiable with respect to its parameters, so gradients cannot reach the encoder. Writing z as a deterministic function of mu, sigma and an independent noise draw makes the path from loss to encoder differentiable, with epsilon treated as an input. That is the reparameterization trick, and it yields a low-variance pathwise gradient estimator.", "whyWrong": ["The closed-form KL follows from q and the prior both being Gaussian, regardless of how you sample.", "The Gaussian form is a modelling choice made by the encoder, not a consequence of the trick.", "It does cut gradient variance versus score-function estimators, but the reconstruction loss itself is unchanged; the reason it exists is differentiability."]}, "he": {"q": "מדוע VAE דוגם את z כ-mu + sigma * epsilon עם epsilon ~ N(0, I), במקום לדגום ישירות מ-N(mu, sigma^2)?", "options": ["זה מאפשר לבטא את איבר ה-KL מול ההתפלגות הפריורית בצורה סגורה", "זה מוציא את האקראיות מהמסלול שבו הגרדיאנט צריך לעבור", "זה מבטיח שההתפלגות הפוסטריורית הלטנטית תישאר גאוסיאנית בדיוק", "זה מקטין את השונות של אומדן הפסד השחזור"], "hint": "האם אפשר לגזור לאחור דרך פעולת דגימה?", "explanation": "דגימה אינה גזירה ביחס לפרמטרים שלה, ולכן גרדיאנטים אינם יכולים להגיע ל-encoder. כתיבת z כפונקציה דטרמיניסטית של mu, sigma ורעש בלתי תלוי הופכת את המסלול מההפסד ל-encoder לגזיר, כאשר epsilon נחשב לקלט. זהו ה-reparameterization trick, והוא נותן אומדן גרדיאנט מסלולי בעל שונות נמוכה.", "whyWrong": ["ה-KL הסגור נובע מכך ש-q וההתפלגות הפריורית שתיהן גאוסיאניות, ללא קשר לאופן הדגימה.", "הצורה הגאוסיאנית היא בחירת מודל של ה-encoder ולא תוצאה של הטריק.", "הוא אכן מקטין שונות ביחס לאומדני score-function, אך הפסד השחזור עצמו אינו משתנה; סיבת קיומו היא הגזירוּת."]}}, {"id": "arc-017", "area": "architectures", "topic": "posterior-collapse", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["vae", "kl-divergence", "elbo"], "en": {"q": "Your VAE reconstructs poorly and its KL term sits near zero. Explain what has happened and how you would fix it.", "hint": "What does a KL of zero say about q(z|x) relative to the prior?", "modelAnswer": "A KL near zero means the approximate posterior q(z|x) has collapsed onto the prior for every x, so the latent code carries no information about the input: this is posterior collapse. It happens when the decoder is expressive enough to model the data on its own, with a strong autoregressive decoder being the classic case, because the ELBO then rewards paying no KL cost at all. Remedies include KL annealing (warming the KL weight up from zero), free bits or a per-dimension KL floor, weakening or bottlenecking the decoder, and feeding z into every decoder layer. Note that a beta-VAE with beta above 1 pushes in the collapsing direction, so lowering beta can also help.", "rubric": ["Identifies posterior collapse: q(z|x) matches the prior and z is ignored by the decoder", "Explains the ELBO trade-off that makes collapse optimal when the decoder is strong", "Proposes at least two concrete fixes such as KL annealing, free bits, a weaker decoder or injecting z", "Notes that raising the KL weight (beta) makes it worse rather than better"]}, "he": {"q": "ה-VAE שלכם משחזר גרוע ואיבר ה-KL שלו קרוב לאפס. הסבירו מה קרה וכיצד הייתם מתקנים.", "hint": "מה אומר KL אפסי על q(z|x) ביחס להתפלגות הפריורית?", "modelAnswer": "KL קרוב לאפס פירושו שהפוסטריור המקורב q(z|x) קרס אל ההתפלגות הפריורית עבור כל x, ולכן הקוד הלטנטי אינו נושא מידע על הקלט: זהו posterior collapse. זה קורה כאשר ה-decoder חזק דיו כדי למדל את הנתונים בכוחות עצמו, כשה-decoder האוטורגרסיבי הוא המקרה הקלאסי, מפני שאז ה-ELBO מתגמל על אי-תשלום מחיר KL כלל. פתרונות אפשריים: KL annealing (הגדלה הדרגתית של משקל ה-KL מאפס), free bits או רצפת KL לכל ממד, החלשת ה-decoder או יצירת bottleneck, והזרמת z לכל שכבות ה-decoder. שימו לב ש-beta-VAE עם beta גדול מ-1 דוחף דווקא לכיוון הקריסה, ולכן הקטנת beta יכולה גם היא לעזור.", "rubric": ["מזהה posterior collapse: q(z|x) מתלכד עם הפריור וה-decoder מתעלם מ-z", "מסביר את ה-trade-off ב-ELBO שהופך את הקריסה לאופטימלית כשה-decoder חזק", "מציע לפחות שני תיקונים קונקרטיים כמו KL annealing, free bits, decoder חלש יותר או הזרקת z", "מציין שהעלאת משקל ה-KL (beta) מחמירה את המצב ולא מתקנת אותו"]}}, {"id": "arc-018", "area": "architectures", "topic": "mode-collapse", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["gan", "mode-collapse", "diversity"], "answer": 2, "en": {"q": "A GAN produces sharp but nearly identical faces no matter what input noise it is given. What is this, and what causes it?", "options": ["Vanishing gradients, because the discriminator is far too weak", "Overfitting, because the generator has memorized the training set", "Mode collapse, because the generator concentrates on outputs that fool D", "Posterior collapse, because the noise prior is too low-dimensional"], "hint": "The samples are good; the diversity is not.", "explanation": "Mode collapse is the generator mapping many z values onto a few outputs that currently defeat the discriminator, ignoring most of the data distribution. The minimax game carries no penalty for missing modes: the generator only needs samples that D accepts. Minibatch discrimination, unrolled GANs and WGAN-style objectives are common mitigations.", "whyWrong": ["Vanishing gradients in a GAN come from a discriminator that is too strong, and the symptom is poor samples, not sharp ones.", "Memorization would yield diverse copies of training images, not one output repeated.", "Posterior collapse is a VAE phenomenon; a GAN has no approximate posterior to collapse."]}, "he": {"q": "GAN מייצר פרצופים חדים אך כמעט זהים ללא תלות ברעש הקלט שהוא מקבל. מה זה, ומה הגורם?", "options": ["דעיכת גרדיאנטים, כי ה-discriminator חלש מדי", "התאמת יתר (overfitting), כי ה-generator שינן את סט האימון", "mode collapse, כי ה-generator מתרכז בפלטים שמצליחים להטעות את D", "posterior collapse, כי ממד הרעש הפריורי נמוך מדי"], "hint": "הדגימות טובות; המגוון לא.", "explanation": "mode collapse הוא מצב שבו ה-generator ממפה ערכי z רבים למעט פלטים שמנצחים כרגע את ה-discriminator, ומתעלם מרוב התפלגות הנתונים. במשחק המינימקס אין קנס על החמצת מודים: ל-generator די בכך שהדגימות יתקבלו על ידי D. minibatch discrimination, unrolled GAN ופונקציות מטרה בסגנון WGAN הם פתרונות נפוצים.", "whyWrong": ["דעיכת גרדיאנטים ב-GAN נובעת מ-discriminator חזק מדי, והתסמין הוא דגימות גרועות ולא חדות.", "שינון היה מייצר העתקים מגוונים של תמונות אימון, ולא פלט אחד שחוזר על עצמו.", "posterior collapse הוא תופעה מעולם ה-VAE; ל-GAN אין פוסטריור מקורב שיכול לקרוס."]}}, {"id": "arc-019", "area": "architectures", "topic": "wgan", "difficulty": 4, "type": "mcq", "hardnessSource": "recall", "tags": ["gan", "wgan", "lipschitz"], "answer": 3, "en": {"q": "What is the central change WGAN makes to the standard GAN setup?", "options": ["It replaces the generator's noise prior with a learned distribution", "It trains the discriminator to output calibrated probabilities", "It adds a reconstruction loss so the generator is autoencoder-like", "It estimates Wasserstein distance with a Lipschitz-constrained critic"], "hint": "The output layer loses its sigmoid, and the network gains a smoothness constraint.", "explanation": "WGAN swaps the Jensen-Shannon objective for the Wasserstein-1 distance in its Kantorovich-Rubinstein dual, which requires the critic to be 1-Lipschitz, enforced originally by weight clipping and later by a gradient penalty. The critic outputs an unbounded score rather than a probability, so it can be trained close to optimality and still give useful gradients when the two distributions barely overlap, which is exactly where the standard loss saturates.", "whyWrong": ["The noise prior stays a fixed distribution, usually Gaussian, exactly as in a standard GAN.", "The opposite: the critic drops the sigmoid and no longer produces a probability at all.", "There is no reconstruction term in WGAN; the adversarial game is kept intact."]}, "he": {"q": "מהו השינוי המרכזי ש-WGAN מכניס למערך ה-GAN הסטנדרטי?", "options": ["הוא מחליף את התפלגות הרעש של ה-generator בהתפלגות נלמדת", "הוא מאמן את ה-discriminator להוציא הסתברויות מכוילות", "הוא מוסיף הפסד שחזור כך שה-generator דומה ל-autoencoder", "הוא מעריך מרחק Wasserstein באמצעות critic עם אילוץ ליפשיץ"], "hint": "שכבת הפלט מאבדת את הסיגמואיד, והרשת מקבלת אילוץ חלקוּת.", "explanation": "WGAN מחליף את מטרת Jensen-Shannon במרחק Wasserstein-1 בצורתו הדואלית (Kantorovich-Rubinstein), הדורשת שה-critic יהיה 1-ליפשיץ, אילוץ שנאכף במקור בגזירת משקולות ובהמשך ב-gradient penalty. ה-critic מוציא ציון לא חסום ולא הסתברות, ולכן אפשר לאמן אותו קרוב לאופטימליות ועדיין לקבל גרדיאנטים שימושיים כשההתפלגויות כמעט אינן חופפות, בדיוק המצב שבו ההפסד הרגיל נכנס לרוויה.", "whyWrong": ["התפלגות הרעש נשארת התפלגות קבועה, בדרך כלל גאוסיאנית, בדיוק כמו ב-GAN רגיל.", "להפך: ה-critic נוטש את הסיגמואיד ואינו מפיק הסתברות כלל.", "אין ב-WGAN איבר שחזור; המשחק היריב נשמר כמות שהוא."]}}, {"id": "arc-020", "area": "architectures", "topic": "ddpm-vs-ddim", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["diffusion", "sampling", "ddim"], "answer": 0, "en": {"q": "You have a trained DDPM and want 50-step sampling instead of 1000. What does switching to DDIM sampling give you?", "options": ["A deterministic non-Markovian sampler reusing the same trained network", "A retrained model that uses a shorter forward noise schedule", "A stochastic sampler that injects fresh noise at all 50 steps", "A different training objective that predicts x0 instead of the noise"], "hint": "Does anything about training change?", "explanation": "DDIM keeps the same noise-prediction network and reinterprets the reverse process as a family of non-Markovian processes; the eta = 0 member is fully deterministic, so a sub-sequence of timesteps can be skipped without retraining. Determinism also makes the map from initial noise to image invertible, which is what enables latent interpolation and editing. DDPM ancestral sampling injects fresh noise each step and degrades badly when steps are dropped.", "whyWrong": ["No retraining happens: DDIM is purely a change of sampler on an already-trained model.", "The standard DDIM variant with eta = 0 injects no noise at all during sampling.", "The training objective stays noise prediction; DDIM does not alter it."]}, "he": {"q": "יש לכם DDPM מאומן ואתם רוצים דגימה ב-50 צעדים במקום 1000. מה נותן המעבר לדגימת DDIM?", "options": ["דוגם דטרמיניסטי ולא-מרקובי שמשתמש באותה רשת מאומנת", "מודל שאומן מחדש עם לוח רעש קדמי קצר יותר", "דוגם סטוכסטי שמזריק רעש חדש בכל 50 הצעדים", "פונקציית מטרה אחרת לאימון, שחוזה את x0 במקום את הרעש"], "hint": "האם משהו באימון בכלל משתנה?", "explanation": "DDIM שומר על אותה רשת שחוזה רעש ומפרש מחדש את התהליך ההפוך כמשפחה של תהליכים לא-מרקוביים; האיבר עם eta = 0 דטרמיניסטי לחלוטין, ולכן אפשר לדלג על תת-סדרה של צעדי זמן ללא אימון מחדש. הדטרמיניזם גם הופך את המיפוי מרעש התחלתי לתמונה להפיך, וזה מה שמאפשר אינטרפולציה ועריכה במרחב הלטנטי. דגימת DDPM מזריקה רעש חדש בכל צעד ומידרדרת מאוד כשמורידים צעדים.", "whyWrong": ["אין אימון מחדש: DDIM הוא שינוי של הדוגם בלבד על מודל שכבר אומן.", "הווריאנט הסטנדרטי של DDIM עם eta = 0 אינו מזריק רעש כלל בזמן הדגימה.", "מטרת האימון נשארת חיזוי הרעש; DDIM אינו משנה אותה."]}}, {"id": "arc-021", "area": "architectures", "topic": "classifier-free-guidance", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["diffusion", "guidance", "conditioning"], "en": {"q": "Explain classifier-free guidance in diffusion models: what is trained, what happens at sampling time, and what the guidance scale trades off.", "hint": "Two predictions at every step, one of which ignores the prompt.", "modelAnswer": "The same network is trained both conditionally and unconditionally by randomly dropping the conditioning, replacing it with a null token, for some fraction of training examples, typically around 10 percent. At sampling time both predictions are computed at each step and combined as eps_uncond + w * (eps_cond - eps_uncond), extrapolating away from the unconditional prediction and toward the conditional one. Raising w tightens prompt adherence and raises perceived sample quality, but reduces diversity and eventually produces oversaturated, artifact-heavy images. It replaces classifier guidance, which needed a separate classifier trained on noisy inputs at every noise level.", "rubric": ["Conditioning is randomly dropped during training so one model learns both conditional and unconditional scores", "Sampling combines the two predictions by extrapolation using a guidance scale", "Higher guidance trades diversity for prompt adherence, with artifacts at large scales", "Contrasts it with classifier guidance, which needs a separate noise-aware classifier"]}, "he": {"q": "הסבירו classifier-free guidance במודלי דיפוזיה: מה מאמנים, מה קורה בזמן הדגימה, ומה מאזן מקדם ההנחיה.", "hint": "שני חיזויים בכל צעד, אחד מהם מתעלם מה-prompt.", "modelAnswer": "מאמנים רשת אחת גם באופן מותנה וגם באופן לא-מותנה, על ידי השמטה אקראית של התנאי והחלפתו בטוקן ריק עבור חלק מדוגמאות האימון, בדרך כלל כ-10 אחוזים. בזמן הדגימה מחשבים בכל צעד את שני החיזויים ומשלבים אותם כ-eps_uncond + w * (eps_cond - eps_uncond), כלומר אקסטרפולציה הרחק מהחיזוי הלא-מותנה ולכיוון המותנה. הגדלת w מהדקת את ההיצמדות ל-prompt ומעלה את איכות הדגימות הנתפסת, אך מקטינה מגוון ובסופו של דבר מייצרת תמונות רוויות מדי ומלאות ארטיפקטים. השיטה מחליפה את classifier guidance, שדרש מסווג נפרד שאומן על קלטים רועשים בכל רמות הרעש.", "rubric": ["התנאי מושמט אקראית באימון כך שמודל אחד לומד ציון מותנה וגם לא-מותנה", "בדגימה משלבים את שני החיזויים באקסטרפולציה עם מקדם הנחיה", "הנחיה גבוהה מחליפה מגוון בהיצמדות ל-prompt, עם ארטיפקטים בערכים גבוהים", "משווה ל-classifier guidance, שדורש מסווג נפרד המודע לרעש"]}}, {"id": "arc-022", "area": "architectures", "topic": "mamba-ssm", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["mamba", "state-space", "long-context"], "en": {"q": "Mamba is described as a selective state-space model. What does selective mean, and what do you give up compared with attention?", "hint": "In an S4 layer the state transition does not depend on the input.", "modelAnswer": "Classical state-space layers such as S4 use time-invariant A, B and C matrices, so the recurrence is equivalent to a convolution and can be computed with an FFT, but the model cannot decide what to remember based on content. Mamba makes B, C and the timestep delta functions of the input, which gives content-based selection so the model can ignore or retain tokens, at the cost of losing time-invariance, so it is computed with a hardware-aware parallel scan instead. The payoff is O(n) training time and a constant-size state at inference, versus O(n^2) time and a KV cache that grows with context for attention. The cost is that all history is compressed into a fixed-size state, so exact recall of arbitrary earlier tokens is weaker than attention's, which is why hybrid attention-SSM stacks are common.", "rubric": ["Selective means the SSM parameters (B, C, delta) become input-dependent, enabling content-based filtering", "Input dependence breaks the convolution/FFT trick, so a parallel scan is used instead", "Gives linear-time training and constant-memory per-token inference versus attention's O(n^2) and growing KV cache", "A fixed-size state limits exact recall and copying, motivating hybrid architectures"]}, "he": {"q": "Mamba מתואר כמודל מרחב-מצבים סלקטיבי (selective state-space model). מה פירוש סלקטיבי, ועל מה מוותרים לעומת קשב?", "hint": "בשכבת S4 מעבר המצב אינו תלוי בקלט.", "modelAnswer": "בשכבות מרחב-מצבים קלאסיות כמו S4 המטריצות A, B ו-C קבועות בזמן, ולכן הרקורסיה שקולה לקונבולוציה שאפשר לחשב באמצעות FFT, אבל המודל אינו יכול להחליט מה לזכור לפי התוכן. Mamba הופך את B, C ואת צעד הזמן delta לפונקציות של הקלט, וכך מתקבלת בחירה תלוית-תוכן שמאפשרת למודל להתעלם מטוקנים או לשמר אותם, במחיר איבוד אי-התלות בזמן, ולכן החישוב נעשה בסריקה מקבילית (parallel scan) מותאמת חומרה. התמורה היא זמן אימון O(n) ומצב בגודל קבוע בזמן הסקה, לעומת זמן O(n^2) ו-KV cache שגדל עם ההקשר בקשב. המחיר הוא שכל ההיסטוריה נדחסת למצב בגודל קבוע, ולכן שליפה מדויקת של טוקנים קודמים שרירותיים חלשה יותר מאשר בקשב, ומכאן הפופולריות של מחסניות היברידיות המשלבות קשב ו-SSM.", "rubric": ["סלקטיבי פירושו שפרמטרי ה-SSM (B, C, delta) תלויים בקלט ומאפשרים סינון לפי תוכן", "התלות בקלט שוברת את הקונבולוציה/FFT, ולכן משתמשים ב-parallel scan", "מתקבל אימון בזמן לינארי והסקה בזיכרון קבוע לטוקן, לעומת O(n^2) ו-KV cache גדל בקשב", "מצב בגודל קבוע מגביל שליפה והעתקה מדויקות, ומכאן ארכיטקטורות היברידיות"]}}, {"id": "arc-023", "area": "architectures", "topic": "over-smoothing", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["gnn", "gcn", "depth"], "answer": 1, "en": {"q": "A 12-layer GCN does far worse at node classification than a 2-layer one, on both the training and test sets. Most likely cause?", "options": ["Overfitting caused by the many extra parameters in the deeper stack", "Over-smoothing: repeated averaging makes node features converge", "Exploding gradients accumulating through the message-passing steps", "A receptive field still too small to cover most of the graph"], "hint": "What does repeated averaging over a connected graph converge to?", "explanation": "Each GCN layer averages a node with its neighbors, so stacking layers acts like repeated diffusion; inside a connected component the representations converge toward each other and become indistinguishable. Training error rises too, which rules out overfitting. Residual or initial-feature connections, jumping knowledge, and PairNorm-style normalization are the usual counters.", "whyWrong": ["Overfitting would give low training error with high test error; here both are bad.", "The symptom of over-smoothing is features merging together, not updates diverging.", "Twelve hops reach far more of the graph than two do, so reach is not the limitation."]}, "he": {"q": "GCN בן 12 שכבות מתפקד הרבה יותר גרוע מ-GCN בן 2 שכבות בסיווג צמתים, גם על סט האימון וגם על סט המבחן. מה הסיבה הסבירה?", "options": ["התאמת יתר בגלל הפרמטרים הרבים הנוספים במחסנית העמוקה", "over-smoothing: מיצוע חוזר גורם למאפייני הצמתים להתכנס", "התפוצצות גרדיאנטים שמצטברת דרך צעדי העברת המסרים", "שדה קליטה שעדיין קטן מכדי לכסות את רוב הגרף"], "hint": "לאן מתכנס מיצוע חוזר ונשנה על גרף קשיר?", "explanation": "כל שכבת GCN ממצעת צומת עם שכניו, ולכן ערימת שכבות פועלת כמו דיפוזיה חוזרת; בתוך רכיב קשיר הייצוגים מתכנסים זה לזה והופכים לבלתי ניתנים להבחנה. גם שגיאת האימון עולה, וזה שולל התאמת יתר. חיבורים שאריתיים או חיבורים למאפיין ההתחלתי, jumping knowledge ונרמול בסגנון PairNorm הם המענים המקובלים.", "whyWrong": ["בהתאמת יתר שגיאת האימון נמוכה ושגיאת המבחן גבוהה; כאן שתיהן גרועות.", "התסמין של over-smoothing הוא מאפיינים שמתמזגים זה עם זה, לא עדכונים שמתבדרים.", "12 קפיצות מגיעות להרבה יותר מהגרף משתי קפיצות, ולכן הטווח אינו המגבלה."]}}, {"id": "arc-024", "area": "architectures", "topic": "gcn-vs-gat", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["gnn", "gat", "message-passing"], "answer": 2, "en": {"q": "In a single message-passing step, what does a GAT do that a GCN does not?", "options": ["It passes messages along each edge in both directions", "It updates the node states using a gated recurrent unit", "It learns a per-edge weight from the features of both endpoints", "It aggregates over two-hop neighborhoods within one layer"], "hint": "How is each neighbor's contribution weighted?", "explanation": "A GCN weights each neighbor by a fixed normalization derived from degrees, 1/sqrt(d_i * d_j), decided by graph structure alone. A GAT computes an attention score from the two endpoint feature vectors and softmax-normalizes it over the neighborhood, so the weights are learned and content-dependent. Both do one hop of message passing per layer.", "whyWrong": ["Both GCN and GAT are normally defined on graphs with edges in both directions; that is not the difference.", "Updating node states with a GRU characterizes Gated Graph Neural Networks, not GAT.", "A GAT layer is still one hop; reaching two hops requires stacking two layers."]}, "he": {"q": "בצעד יחיד של העברת מסרים (message passing), מה עושה GAT ש-GCN אינו עושה?", "options": ["מעביר מסרים לאורך כל קשת בשני הכיוונים", "מעדכן את מצבי הצמתים באמצעות יחידת GRU", "לומד משקל לכל קשת מתוך המאפיינים של שני קצותיה", "מאגד שכנויות בשתי קפיצות בתוך שכבה אחת"], "hint": "כיצד משוקללת התרומה של כל שכן?", "explanation": "GCN משקלל כל שכן בנרמול קבוע הנגזר מדרגות, 1/sqrt(d_i * d_j), שנקבע ממבנה הגרף בלבד. GAT מחשב ציון קשב משני וקטורי המאפיינים של קצות הקשת ומנרמל אותו ב-softmax על השכנוּת, ולכן המשקלים נלמדים ותלויי תוכן. שניהם מבצעים קפיצה אחת של העברת מסרים לכל שכבה.", "whyWrong": ["גם GCN וגם GAT מוגדרים בדרך כלל על גרפים עם קשתות בשני הכיוונים; זה אינו ההבדל.", "עדכון מצבי הצמתים באמצעות GRU מאפיין Gated Graph Neural Networks ולא GAT.", "שכבת GAT היא עדיין קפיצה אחת; כדי להגיע לשתי קפיצות צריך שתי שכבות."]}}, {"id": "arc-025", "area": "architectures", "topic": "vit-patching", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["vit", "patches", "transformer"], "answer": 0, "en": {"q": "How does a Vision Transformer turn a 224x224 image into a sequence for the encoder?", "options": ["Split into 16x16 patches, flatten each, and linearly project to d_model", "Feed every pixel as its own token with a learned positional embedding", "Run a CNN backbone and use its final pooled vector as a single token", "Slice the image into rows and treat each row as one token"], "hint": "196 tokens, not 50,176.", "explanation": "ViT-Base/16 cuts the image into non-overlapping 16x16 patches, giving (224/16)^2 = 196 of them, flattens each into 768 values and linearly projects it to the model dimension, then adds positional embeddings and a class token. Patching is what makes the quadratic attention cost tractable: one token per pixel would mean a sequence of length 50,176.", "whyWrong": ["One token per pixel gives a length-50,176 sequence and an attention matrix that is completely impractical.", "A single pooled vector discards exactly the spatial structure that attention is supposed to exploit.", "Whole rows as tokens gives 224 very long tokens and destroys local two-dimensional structure."]}, "he": {"q": "כיצד Vision Transformer הופך תמונה בגודל 224x224 לרצף עבור ה-encoder?", "options": ["מחלק ל-patches בגודל 16x16, משטח כל אחד ומקרין לינארית ל-d_model", "מזין כל פיקסל כטוקן נפרד עם positional embedding נלמד", "מריץ backbone קונבולוציוני ומשתמש בווקטור המכווץ הסופי כטוקן יחיד", "חותך את התמונה לשורות ומתייחס לכל שורה כטוקן"], "hint": "196 טוקנים, לא 50,176.", "explanation": "ב-ViT-Base/16 התמונה נחתכת ל-patches לא חופפים בגודל 16x16, כלומר (224/16)^2 = 196 כאלה, כל patch משוטח ל-768 ערכים ומוקרן לינארית לממד המודל, ואז מתווספים positional embeddings וטוקן class. ה-patching הוא מה שהופך את עלות הקשב הריבועית לסבירה: טוקן לכל פיקסל היה נותן רצף באורך 50,176.", "whyWrong": ["טוקן לכל פיקסל נותן רצף באורך 50,176 ומטריצת קשב בלתי מעשית לחלוטין.", "ווקטור מכווץ יחיד מוחק בדיוק את המבנה המרחבי שהקשב אמור לנצל.", "שורות שלמות כטוקנים נותנות 224 טוקנים ארוכים מאוד והורסות מבנה דו-ממדי מקומי."]}}, {"id": "arc-026", "area": "architectures", "topic": "unet-skips", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["unet", "segmentation", "skip-connections"], "answer": 1, "en": {"q": "Why does U-Net concatenate encoder feature maps into the matching decoder stage?", "options": ["To reduce the number of channels the decoder has to process", "To restore high-resolution spatial detail lost during downsampling", "To force the encoder and decoder to share the same weights", "To make the network invariant to the size of the input image"], "hint": "What does a segmentation mask need that a class label does not?", "explanation": "Downsampling builds semantic context but throws away precise localization, and segmentation needs a boundary at pixel resolution. The skip connections hand the decoder the pre-pooling, high-resolution activations, so upsampled semantics can be combined with sharp spatial detail. They shorten the gradient path too, but detail recovery is their purpose.", "whyWrong": ["Concatenation actually increases the channel count at the decoder stage.", "There is no weight sharing; the encoder and decoder have separate parameters.", "Input-size flexibility comes from the network being fully convolutional, not from the skips."]}, "he": {"q": "מדוע U-Net משרשרת מפות מאפיינים מה-encoder אל שלב ה-decoder המקביל?", "options": ["כדי להקטין את מספר הערוצים שה-decoder צריך לעבד", "כדי לשחזר פרטים מרחביים ברזולוציה גבוהה שאבדו בהקטנת הדגימה", "כדי לכפות שיתוף משקולות בין ה-encoder ל-decoder", "כדי להפוך את הרשת לחסינה לגודל תמונת הקלט"], "hint": "מה מסכת סגמנטציה צריכה שתווית מחלקה אינה צריכה?", "explanation": "הקטנת הדגימה בונה הקשר סמנטי אך מוותרת על מיקום מדויק, בעוד שסגמנטציה זקוקה לגבול ברזולוציית פיקסל. חיבורי הדילוג מוסרים ל-decoder את האקטיבציות ברזולוציה גבוהה מלפני ה-pooling, כך שאפשר לשלב סמנטיקה שהוגדלה בחזרה עם פרטים מרחביים חדים. הם גם מקצרים את מסלול הגרדיאנט, אבל מטרתם היא שחזור הפרטים.", "whyWrong": ["השרשור דווקא מגדיל את מספר הערוצים בשלב ה-decoder.", "אין שיתוף משקולות; ל-encoder ול-decoder פרמטרים נפרדים.", "הגמישות לגודל הקלט נובעת מכך שהרשת קונבולוציונית במלואה, ולא מחיבורי הדילוג."]}}, {"id": "arc-027", "area": "architectures", "topic": "siamese-contrastive", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["siamese", "contrastive", "metric-learning"], "en": {"q": "How would you build a system that decides whether two signatures come from the same person, given only a few examples per person?", "hint": "Do not train a classifier with one output unit per person.", "modelAnswer": "Train a Siamese network: one shared-weight encoder embeds each signature, and the decision is a distance or cosine similarity in that embedding space compared against a threshold. Train it with a contrastive loss on pairs, pulling same-person pairs together and pushing different-person pairs apart beyond a margin, or with a triplet loss on anchor/positive/negative triples using semi-hard negative mining. Because the model learns a metric rather than a fixed set of classes, a new person can be enrolled from a single reference sample with no retraining. The main practical concerns are mining hard negatives, which supply most of the learning signal, and calibrating the decision threshold on a held-out set.", "rubric": ["Shared-weight Siamese encoder producing embeddings, with the decision made by distance or similarity", "Contrastive or triplet loss with a margin over pairs or triples", "Metric learning generalizes to identities unseen in training, with no retraining to enroll someone", "Mentions hard-negative mining or threshold calibration as a practical concern"]}, "he": {"q": "כיצד הייתם בונים מערכת שמכריעה אם שתי חתימות שייכות לאותו אדם, כשיש רק דוגמאות בודדות לכל אדם?", "hint": "אל תאמנו מסווג עם נוירון פלט אחד לכל אדם.", "modelAnswer": "מאמנים רשת סיאמית (Siamese): encoder יחיד עם משקולות משותפות מטמיע כל חתימה, וההכרעה היא מרחק או דמיון קוסינוס במרחב ההטמעה מול סף. מאמנים עם contrastive loss על זוגות, שמקרב זוגות של אותו אדם ומרחיק זוגות של אנשים שונים מעבר לשוליים (margin), או עם triplet loss על שלשות של עוגן, חיובי ושלילי עם דגימת שליליים semi-hard. מכיוון שהמודל לומד מטריקה ולא קבוצת מחלקות קבועה, אפשר לרשום אדם חדש מדוגמה יחידה בלי אימון מחדש. השיקולים המעשיים העיקריים הם דגימת שליליים קשים, שמהם מגיע רוב אות הלמידה, וכיול סף ההכרעה על סט מוחזק.", "rubric": ["encoder סיאמי עם משקולות משותפות המייצר הטמעות, כשההכרעה לפי מרחק או דמיון", "contrastive או triplet loss עם margin על זוגות או שלשות", "למידת מטריקה מכלילה לזהויות שלא נראו באימון, ללא אימון מחדש לרישום אדם חדש", "מזכיר דגימת שליליים קשים או כיול סף כשיקול מעשי"]}}, {"id": "arc-028", "area": "architectures", "topic": "moe-routing", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["mixture-of-experts", "routing", "sparsity"], "answer": 2, "en": {"q": "In a sparse mixture-of-experts Transformer with top-2 routing, why is an auxiliary load-balancing loss needed?", "options": ["To stop the router's softmax temperature from drifting during training", "To ensure every expert receives gradients of the same magnitude", "Routing self-reinforces, so a few experts win all tokens and the rest starve", "To prevent the router from selecting more than two experts per token"], "hint": "What happens to an expert that gets slightly more traffic early on?", "explanation": "Router assignment is a rich-get-richer loop: an expert that starts marginally better receives more tokens, trains faster, and then gets chosen even more, while the rest stay undertrained and the model's effective capacity shrinks. The auxiliary loss penalizes the mismatch between the fraction of tokens sent to each expert and the router's mean probability for it, spreading traffic out. Balance also matters mechanically, since each expert has a fixed capacity and overflow tokens are dropped.", "whyWrong": ["Router temperature is not the failure mode; the problem is how tokens are distributed across experts.", "There is no requirement that gradients match in magnitude, only that all experts actually get used.", "The top-2 limit is enforced directly by the selection operation and needs no loss term."]}, "he": {"q": "ב-Transformer מסוג sparse mixture-of-experts עם ניתוב top-2, מדוע נדרש הפסד עזר לאיזון עומסים?", "options": ["כדי שטמפרטורת ה-softmax של ה-router לא תיסחף במהלך האימון", "כדי להבטיח שכל מומחה יקבל גרדיאנטים באותו סדר גודל", "הניתוב מחזק את עצמו, ולכן מעט מומחים זוכים בכל הטוקנים והשאר מורעבים", "כדי למנוע מה-router לבחור יותר משני מומחים לכל טוקן"], "hint": "מה קורה למומחה שמקבל מעט יותר תנועה בתחילת האימון?", "explanation": "הקצאת ה-router היא לולאה של העשיר מתעשר: מומחה שמתחיל מעט טוב יותר מקבל יותר טוקנים, מתאמן מהר יותר ואז נבחר עוד יותר, בעוד שהשאר נותרים לא מאומנים והקיבולת האפקטיבית של המודל מצטמצמת. הפסד העזר מעניש את הפער בין שיעור הטוקנים שנשלחו לכל מומחה לבין ההסתברות הממוצעת שה-router נותן לו, ומפזר את התנועה. האיזון חשוב גם טכנית, כי לכל מומחה יש קיבולת קבועה וטוקנים בעודף נזרקים.", "whyWrong": ["טמפרטורת ה-router אינה מצב הכשל; הבעיה היא אופן הפיזור של הטוקנים בין המומחים.", "אין דרישה שהגרדיאנטים יהיו שווים בגודלם, אלא רק שכל המומחים ינוצלו בפועל.", "מגבלת ה-top-2 נאכפת ישירות בפעולת הבחירה ואינה זקוקה לאיבר הפסד."]}}, {"id": "nlp-001", "area": "nlp", "topic": "bpe-tokenization", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["tokenization", "bpe", "subwords"], "answer": 0, "en": {"q": "How does Byte-Pair Encoding build its vocabulary during tokenizer training?", "options": ["It repeatedly merges the most frequent adjacent symbol pair into a new token", "It splits words at morpheme boundaries taken from a linguistic lexicon", "It keeps the N most frequent whole words and maps everything else to UNK", "It learns token boundaries jointly with the model, by gradient descent"], "hint": "Think of a compression algorithm that grows a table of frequent pairs.", "explanation": "BPE starts from characters (or bytes) and greedily merges the most frequent adjacent pair, adding the merged symbol to the vocabulary. Repeating this until a target vocabulary size gives frequent words as single tokens and rare words as sequences of subword pieces. The learned merge list is then replayed in the same order at inference time.", "whyWrong": ["BPE is purely statistical and consults no lexicon; its pieces often cut across real morphemes.", "That is a closed word-level vocabulary, exactly the OOV problem subwords were invented to remove.", "Tokenizer training is a separate, non-differentiable preprocessing step, not learned by backpropagation."]}, "he": {"q": "כיצד בונה אלגוריתם BPE את אוצר המילים (vocabulary) שלו בזמן אימון הטוקנייזר?", "options": ["הוא ממזג שוב ושוב את צמד הסמלים הסמוכים השכיח ביותר לטוקן חדש", "הוא מפצל מילים בגבולות מורפמות הלקוחים מלקסיקון לשוני", "הוא שומר את N המילים השלמות השכיחות ביותר וממפה את השאר ל-UNK", "הוא לומד את גבולות הטוקנים יחד עם המודל, בירידת גרדיאנט"], "hint": "חשבו על אלגוריתם דחיסה שבונה טבלה של צמדים שכיחים.", "explanation": "BPE מתחיל מתווים (או בייטים) וממזג בחמדנות את הצמד הסמוך השכיח ביותר, ומוסיף את הסמל הממוזג לאוצר המילים. חזרה על כך עד לגודל אוצר מילים מבוקש נותנת מילים שכיחות כטוקן יחיד ומילים נדירות כרצף של תת-מילים (subwords). רשימת המיזוגים הנלמדת מיושמת באותו סדר גם בזמן ההסקה.", "whyWrong": ["BPE הוא סטטיסטי לחלוטין ואינו מתייעץ עם לקסיקון; החיתוכים שלו לרוב אינם מתלכדים עם מורפמות אמיתיות.", "זהו אוצר מילים סגור ברמת מילים שלמות — בדיוק בעיית ה-OOV שתת-מילים באו לפתור.", "אימון הטוקנייזר הוא שלב עיבוד מקדים נפרד ולא גזיר, ואינו נלמד ב-backpropagation."]}}, {"id": "nlp-002", "area": "nlp", "topic": "wordpiece-vs-bpe", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["tokenization", "wordpiece", "bpe"], "answer": 3, "en": {"q": "WordPiece and BPE both build subwords by merging. Which pair does WordPiece choose to merge?", "options": ["The pair with the highest raw count, after a minimum-frequency filter", "The pair that most reduces the total number of characters in the corpus", "The pair with the lowest conditional entropy under a character n-gram model", "The pair maximizing corpus likelihood, i.e. freq(ab) divided by freq(a)*freq(b)"], "hint": "One of the two normalizes a pair's count by how common its two parts are on their own.", "explanation": "BPE greedily merges the most frequent adjacent pair. WordPiece instead picks the merge that most increases the likelihood of the corpus under a unigram-style model, which ranks candidates by freq(ab)/(freq(a)*freq(b)). Dividing by the parts' own frequencies favors pairs that co-occur more than chance, so very common characters do not dominate the merge list.", "whyWrong": ["That is essentially BPE's rule, and raw frequency is exactly what WordPiece normalizes away.", "Shorter encodings are a side effect of both algorithms, not WordPiece's merge criterion.", "No character n-gram entropy is involved; the score is a likelihood ratio built from counts."]}, "he": {"q": "גם WordPiece וגם BPE בונים תת-מילים על ידי מיזוג. איזה צמד בוחר WordPiece למזג?", "options": ["את הצמד בעל הספירה הגולמית הגבוהה ביותר, אחרי סינון סף שכיחות", "את הצמד שמקטין הכי הרבה את מספר התווים הכולל בקורפוס", "את הצמד בעל האנטרופיה המותנית הנמוכה ביותר תחת מודל n-gram של תווים", "את הצמד שממקסם את סבירות הקורפוס, כלומר freq(ab) חלקי freq(a)*freq(b)"], "hint": "אחד מהשניים מנרמל את ספירת הצמד לפי כמה שכיחים שני חלקיו בנפרד.", "explanation": "BPE ממזג בחמדנות את הצמד הסמוך השכיח ביותר. WordPiece, לעומת זאת, בוחר את המיזוג שמעלה הכי הרבה את הסבירות (likelihood) של הקורפוס תחת מודל יוניגרם, מה שמדרג מועמדים לפי freq(ab)/(freq(a)*freq(b)). החלוקה בשכיחויות של החלקים מעדיפה צמדים שמופיעים יחד יותר מהמקרי, כך שתווים שכיחים מאוד אינם משתלטים על רשימת המיזוגים.", "whyWrong": ["זהו למעשה הכלל של BPE, ושכיחות גולמית היא בדיוק מה ש-WordPiece מנרמל.", "קיצור הקידוד הוא תוצר לוואי של שני האלגוריתמים, ולא קריטריון המיזוג של WordPiece.", "אנטרופיה של מודל n-gram תווים אינה מעורבת; הציון הוא יחס סבירויות שנבנה מספירות."]}}, {"id": "nlp-003", "area": "nlp", "topic": "vocabulary-size", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["tokenization", "vocabulary", "tradeoffs"], "answer": 0, "en": {"q": "You grow a tokenizer's vocabulary from 32k to 256k entries. Which effect is real?", "options": ["Sequences get shorter, but the embedding and output softmax layers get much larger", "Sequences get shorter and total parameters drop, since fewer tokens are stored", "Sequences get longer, because rare words are now split more aggressively", "Attention cost per token grows quadratically with the vocabulary size"], "hint": "Count two things: tokens per sentence, and parameters per vocabulary entry.", "explanation": "A bigger vocabulary packs more text into each token, so sequences shorten and attention, which is quadratic in length, gets cheaper. The price is the V x d embedding matrix and the tied output projection, plus rarer tokens whose embeddings receive fewer updates. Choosing V is a trade between sequence length and vocabulary parameters plus softmax cost.", "whyWrong": ["Parameters grow rather than shrink: both the embedding and the output projection scale as V x d.", "Larger vocabularies split words less, not more; aggressive splitting is what a small vocabulary does.", "Attention cost depends on sequence length and model width, never on the vocabulary size."]}, "he": {"q": "אתם מגדילים את אוצר המילים של הטוקנייזר מ-32k ל-256k ערכים. איזו השפעה היא אמיתית?", "options": ["הרצפים מתקצרים, אך שכבות ה-embedding וה-softmax של הפלט גדלות משמעותית", "הרצפים מתקצרים ומספר הפרמטרים הכולל יורד, כי נשמרים פחות טוקנים", "הרצפים מתארכים, כי מילים נדירות מפוצלות כעת באגרסיביות רבה יותר", "עלות ה-attention לכל טוקן גדלה ריבועית עם גודל אוצר המילים"], "hint": "ספרו שני דברים: כמה טוקנים במשפט, וכמה פרמטרים לכל ערך באוצר המילים.", "explanation": "אוצר מילים גדול יותר דוחס יותר טקסט לכל טוקן, ולכן הרצפים מתקצרים וה-attention, שהוא ריבועי באורך, מוזיל. המחיר הוא מטריצת embedding בגודל V x d והטלת הפלט הקשורה אליה, ובנוסף טוקנים נדירים שה-embedding שלהם מתעדכן פחות. בחירת V היא איזון בין אורך הרצף לבין פרמטרי אוצר המילים ועלות ה-softmax.", "whyWrong": ["מספר הפרמטרים גדל ולא קטן: גם ה-embedding וגם הטלת הפלט מתנהגים כ-V x d.", "אוצר מילים גדול מפצל פחות ולא יותר; פיצול אגרסיבי אופייני דווקא לאוצר מילים קטן.", "עלות ה-attention תלויה באורך הרצף וברוחב המודל, ולעולם לא בגודל אוצר המילים."]}}, {"id": "nlp-004", "area": "nlp", "topic": "oov-handling", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["tokenization", "oov", "sentencepiece"], "answer": 2, "en": {"q": "A byte-level BPE tokenizer meets a word it never saw, in a script it barely saw. What happens?", "options": ["The word maps to a single UNK token and its identity is lost", "The tokenizer raises an error and the text has to be pre-cleaned", "It is encoded as several subword or raw-byte tokens, so nothing is unrepresentable", "The word is replaced by its nearest vocabulary neighbor in embedding space"], "hint": "What is the smallest unit the vocabulary is guaranteed to contain?", "explanation": "Byte-level BPE includes all 256 byte values as base symbols, so any UTF-8 text decomposes into known tokens and unseen words simply become longer token sequences. That removes UNK entirely, at the cost of poor compression, many tokens per word, for scripts underrepresented in the tokenizer's training data. SentencePiece gets the same guarantee through byte fallback.", "whyWrong": ["UNK belongs to word-level vocabularies; byte-level BPE has no UNK because every byte is in the vocabulary.", "Encoding never fails, since any byte string is covered by the base byte tokens.", "No nearest-neighbor substitution happens; tokenization is a deterministic merge process, not an embedding search."]}, "he": {"q": "טוקנייזר BPE ברמת בייטים נתקל במילה שלא ראה מעולם, בכתב שכמעט לא ראה. מה קורה?", "options": ["המילה ממופה לטוקן UNK יחיד וזהותה אובדת", "הטוקנייזר זורק שגיאה ויש לנקות את הטקסט מראש", "היא מקודדת לכמה טוקני תת-מילה או בייט גולמי, כך שאין דבר שלא ניתן לייצג", "המילה מוחלפת בשכן הקרוב אליה באוצר המילים במרחב ה-embedding"], "hint": "מהי היחידה הקטנה ביותר שמובטח שהיא נמצאת באוצר המילים?", "explanation": "BPE ברמת בייטים כולל את כל 256 ערכי הבייט כסמלי בסיס, ולכן כל טקסט UTF-8 מתפרק לטוקנים מוכרים, ומילים לא מוכרות פשוט הופכות לרצף טוקנים ארוך יותר. כך נעלם ה-UNK לגמרי, במחיר דחיסה גרועה — הרבה טוקנים למילה — עבור כתבים שיוצגו מעט באימון הטוקנייזר. SentencePiece משיג את אותה הבטחה באמצעות byte fallback.", "whyWrong": ["UNK שייך לאוצר מילים ברמת מילים; ל-BPE ברמת בייטים אין UNK כי כל בייט נמצא באוצר המילים.", "הקידוד לעולם לא נכשל, שכן כל מחרוזת בייטים מכוסה על ידי טוקני הבייט הבסיסיים.", "אין החלפה בשכן הקרוב; טוקניזציה היא תהליך מיזוג דטרמיניסטי ולא חיפוש במרחב embedding."]}}, {"id": "nlp-005", "area": "nlp", "topic": "word2vec", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["word2vec", "embeddings", "skip-gram"], "answer": 2, "en": {"q": "In word2vec, when would you prefer skip-gram over CBOW?", "options": ["When the corpus is huge and you want the fastest possible training", "When you need embeddings that change with the sentence context", "When the corpus is small and rare words matter", "When you want to model global co-occurrence counts explicitly"], "hint": "Which of the two produces more training examples per occurrence of a word?", "explanation": "Skip-gram predicts each context word from the center word, creating one training pair per context position, so a rare word gets several gradient updates per occurrence. CBOW averages the whole context into a single prediction, which is faster and smoother but lets frequent words dominate. Skip-gram is therefore the usual choice for small corpora and rare-word quality.", "whyWrong": ["CBOW is the faster of the two, since it makes one prediction per window rather than several.", "Both produce a single static vector per word type; context-dependence needs a contextual encoder.", "Explicit global co-occurrence counts are GloVe's design; word2vec streams local windows."]}, "he": {"q": "ב-word2vec, מתי תעדיפו skip-gram על פני CBOW?", "options": ["כשהקורפוס ענק ורוצים את האימון המהיר ביותר האפשרי", "כשצריך embeddings שמשתנים לפי ההקשר במשפט", "כשהקורפוס קטן ומילים נדירות חשובות", "כשרוצים למדל במפורש ספירות הופעה-משותפת גלובליות"], "hint": "מי מהשניים מייצר יותר דוגמאות אימון לכל הופעה של מילה?", "explanation": "skip-gram מנבא כל מילת הקשר מתוך מילת המרכז, ולכן נוצר זוג אימון לכל מיקום בהקשר ומילה נדירה מקבלת כמה עדכוני גרדיאנט לכל הופעה. CBOW ממצע את כל ההקשר לניבוי אחד — מהיר וחלק יותר, אבל מילים שכיחות משתלטות. לכן skip-gram הוא הבחירה הרגילה לקורפוסים קטנים ולאיכות במילים נדירות.", "whyWrong": ["CBOW הוא המהיר מבין השניים, כי הוא מבצע ניבוי אחד לכל חלון ולא כמה.", "שניהם מייצרים וקטור סטטי יחיד לכל מילה; תלות בהקשר דורשת מקודד הקשרי.", "ספירות הופעה-משותפת גלובליות מפורשות הן התכנון של GloVe; word2vec עובד על חלונות מקומיים."]}}, {"id": "nlp-006", "area": "nlp", "topic": "glove", "difficulty": 3, "type": "mcq", "hardnessSource": "recall", "tags": ["glove", "embeddings", "co-occurrence"], "answer": 0, "en": {"q": "What quantity does GloVe's training objective actually fit?", "options": ["The log of a word pair's global co-occurrence count, by weighted least squares", "The probability of a context word given a center word, via negative sampling", "The PMI between a word and the document it appears in, via truncated SVD", "The cosine similarity of a pair, against human similarity judgements"], "hint": "The name stands for 'global vectors' — which global statistic is being fitted?", "explanation": "GloVe builds the full word-word co-occurrence matrix X and fits w_i . w_j + b_i + b_j to log(X_ij) with a weighted least-squares loss that down-weights extremely frequent pairs. It therefore optimizes corpus-level statistics, and in particular ratios of co-occurrence probabilities, instead of streaming local windows as word2vec does.", "whyWrong": ["That is skip-gram with negative sampling, which never materializes a co-occurrence matrix.", "Truncated SVD of a PMI matrix describes LSA-style methods, and GloVe uses word-word, not word-document, counts.", "GloVe is fully unsupervised; human similarity ratings are used only to evaluate it afterwards."]}, "he": {"q": "לאיזה גודל בדיוק מתאימה (fits) פונקציית המטרה של GloVe?", "options": ["ללוג של ספירת ההופעה-המשותפת הגלובלית של זוג מילים, בריבועים פחותים משוקללים", "להסתברות של מילת הקשר בהינתן מילת מרכז, באמצעות negative sampling", "ל-PMI בין מילה למסמך שבו היא מופיעה, באמצעות SVD מקוצר", "לדמיון הקוסינוס של זוג מילים, מול שיפוטי דמיון אנושיים"], "hint": "השם הוא קיצור של global vectors — איזה גודל סטטיסטי גלובלי מותאם כאן?", "explanation": "GloVe בונה את מטריצת ההופעה-המשותפת המלאה בין מילים X, ומתאים את w_i . w_j + b_i + b_j ל-log(X_ij) בעזרת פונקציית ריבועים פחותים משוקללת שמורידה משקל לזוגות שכיחים מאוד. כלומר הוא ממטב סטטיסטיקות ברמת הקורפוס כולו, ובפרט יחסים בין הסתברויות הופעה-משותפת, במקום לעבוד על חלונות מקומיים כמו word2vec.", "whyWrong": ["זהו skip-gram עם negative sampling, שאינו בונה מטריצת הופעה-משותפת מפורשת כלל.", "SVD מקוצר על מטריצת PMI מתאר שיטות בסגנון LSA, ו-GloVe משתמש בספירות מילה-מילה ולא מילה-מסמך.", "GloVe הוא בלתי-מונחה לחלוטין; דירוגי דמיון אנושיים משמשים רק להערכה לאחר האימון."]}}, {"id": "nlp-007", "area": "nlp", "topic": "static-vs-contextual", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["embeddings", "polysemy", "contextual"], "answer": 1, "en": {"q": "Why can a static embedding table not represent the word 'bank' well?", "options": ["Because static vectors are too low-dimensional to encode word meaning", "Because one vector has to average all senses of the word", "Because static embeddings are trained without any neural network", "Because the tokenizer splits 'bank' into several subwords"], "hint": "How many vectors does the table store for one word type?", "explanation": "A static table stores exactly one vector per word type, so all senses of a polysemous word, river bank and central bank, collapse into a single averaged point. Contextual encoders compute the vector from the whole sentence, so the same word gets different representations in different contexts. This is the core motivation behind ELMo and BERT-style representations.", "whyWrong": ["Dimensionality is not the issue: even a 1000-dimensional single vector must still serve every sense.", "word2vec and GloVe are trained with shallow neural or matrix-factorization objectives; that is not the limitation.", "'bank' is common enough to be one token, and subword splitting would not create sense-specific vectors anyway."]}, "he": {"q": "מדוע טבלת embeddings סטטית אינה מייצגת היטב את המילה bank?", "options": ["כי לוקטורים סטטיים יש מימד נמוך מדי מכדי לקודד משמעות", "כי וקטור אחד נאלץ למצע את כל המובנים של המילה", "כי embeddings סטטיים מאומנים בלי שום רשת נוירונים", "כי הטוקנייזר מפצל את bank לכמה תת-מילים"], "hint": "כמה וקטורים שומרת הטבלה עבור מילה אחת?", "explanation": "טבלה סטטית שומרת וקטור אחד בדיוק לכל מילה, ולכן כל המובנים של מילה רב-משמעית — גדת נהר מול בנק — מתמזגים לנקודה ממוצעת אחת. מקודדים הקשריים מחשבים את הוקטור מתוך המשפט כולו, כך שאותה מילה מקבלת ייצוגים שונים בהקשרים שונים. זו המוטיבציה המרכזית לייצוגים בסגנון ELMo ו-BERT.", "whyWrong": ["המימד אינו הבעיה: גם וקטור יחיד במימד 1000 עדיין צריך לשרת את כל המובנים.", "word2vec ו-GloVe מאומנים עם פונקציות מטרה נוירוניות רדודות או פירוק מטריצות; לא זו המגבלה.", "bank שכיחה מספיק כדי להיות טוקן יחיד, ובכל מקרה פיצול לתת-מילים לא היה יוצר וקטורים לפי מובן."]}}, {"id": "nlp-008", "area": "nlp", "topic": "seq2seq-attention", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["seq2seq", "attention", "rnn"], "answer": 3, "en": {"q": "Which problem in encoder-decoder RNN translation did attention originally solve?", "options": ["Vanishing gradients inside the encoder RNN", "The high cost of the output softmax over a large vocabulary", "The lack of parallelism across time steps during training", "The fixed-size vector that had to carry the entire source sentence"], "hint": "Think about what exactly the decoder received in the original model, and how big it was.", "explanation": "In the original seq2seq model the decoder saw only the encoder's final hidden state, a fixed-size bottleneck whose quality collapsed on long sentences. Attention lets the decoder read a weighted combination of all encoder states at every step, so the information capacity no longer has to be constant in source length. Removing that bottleneck, not speed, was the stated motivation.", "whyWrong": ["Vanishing gradients were mainly addressed by LSTM and GRU gating; attention helps but was not the motivation.", "Softmax cost was attacked separately, with sampled softmax and hierarchical softmax.", "Parallelism across time arrived later, when the Transformer removed recurrence altogether."]}, "he": {"q": "איזו בעיה בתרגום מכונה מבוסס encoder-decoder עם RNN בא מנגנון הקשב (attention) לפתור במקור?", "options": ["היעלמות גרדיאנטים בתוך ה-RNN של המקודד", "העלות הגבוהה של ה-softmax בפלט על אוצר מילים גדול", "היעדר מקביליות על פני צעדי הזמן בזמן האימון", "הוקטור בגודל קבוע שנאלץ לשאת את כל משפט המקור"], "hint": "חשבו מה בדיוק קיבל המפענח במודל המקורי, ומה היה גודלו.", "explanation": "במודל seq2seq המקורי המפענח ראה רק את המצב החבוי האחרון של המקודד — צוואר בקבוק בגודל קבוע שאיכותו קרסה במשפטים ארוכים. מנגנון הקשב מאפשר למפענח לקרוא בכל צעד צירוף משוקלל של כל מצבי המקודד, כך שקיבולת המידע כבר אינה קבועה באורך המקור. הסרת צוואר הבקבוק, ולא מהירות, הייתה המוטיבציה המוצהרת.", "whyWrong": ["היעלמות גרדיאנטים טופלה בעיקר בשערי LSTM ו-GRU; קשב מסייע אך לא זו הייתה המוטיבציה.", "עלות ה-softmax טופלה בנפרד, בעזרת sampled softmax ו-hierarchical softmax.", "המקביליות על פני הזמן הגיעה מאוחר יותר, כשה-Transformer ויתר לגמרי על רקורסיה."]}}, {"id": "nlp-009", "area": "nlp", "topic": "beam-search", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["decoding", "beam-search", "machine-translation"], "answer": 1, "en": {"q": "A translation system's BLEU drops when you raise the beam width from 5 to 100. Most likely explanation?", "options": ["A bug: better search can only improve the decoding objective", "Wider beams find higher-likelihood but shorter, degenerate outputs", "The beam exceeded the vocabulary size, so candidates start repeating", "Wider beams increase the sampling variance of the output"], "hint": "Beam search optimizes likelihood. Ask whether likelihood is what BLEU rewards.", "explanation": "Wider beams really do find higher-probability sequences, but sequence log-probability is a sum of negative terms, so the model's true mode is often far too short or empty. This 'curse of beam search' is a mismatch between the search objective and translation quality, usually patched with length normalization or a coverage penalty. Better search exposing a flawed model is not a bug in the search.", "whyWrong": ["Search does improve the likelihood objective; the point is precisely that likelihood and BLEU disagree.", "Beam width and vocabulary size are unrelated, and a beam keeps distinct hypotheses by construction.", "Beam search is deterministic and does no sampling, so there is no variance to increase."]}, "he": {"q": "ציון ה-BLEU של מערכת תרגום יורד כשמגדילים את רוחב ה-beam מ-5 ל-100. מה ההסבר הסביר ביותר?", "options": ["באג: חיפוש טוב יותר יכול רק לשפר את פונקציית המטרה של הפענוח", "beam רחב יותר מוצא פלטים בעלי סבירות גבוהה יותר, אך קצרים ומנוונים", "ה-beam עבר את גודל אוצר המילים, ולכן המועמדים מתחילים לחזור על עצמם", "beam רחב יותר מגדיל את שונות הדגימה של הפלט"], "hint": "beam search ממטב סבירות (likelihood). שאלו את עצמכם אם זה מה ש-BLEU מתגמל.", "explanation": "beam רחב אכן מוצא רצפים בעלי הסתברות גבוהה יותר, אבל לוג-ההסתברות של רצף הוא סכום של איברים שליליים, ולכן ה-mode האמיתי של המודל הוא לרוב קצר מדי או ריק. תופעת ה-curse of beam search הזו היא אי-התאמה בין מטרת החיפוש לבין איכות התרגום, ומטופלת בדרך כלל בנרמול אורך או בקנס כיסוי (coverage). חיפוש טוב יותר שחושף מודל פגום אינו באג בחיפוש.", "whyWrong": ["החיפוש אכן משפר את מטרת הסבירות; הנקודה היא בדיוק שסבירות ו-BLEU אינם מסכימים.", "רוחב ה-beam וגודל אוצר המילים אינם קשורים, וה-beam שומר מטבעו השערות שונות זו מזו.", "beam search הוא דטרמיניסטי ואינו דוגם כלל, ולכן אין שונות שתגדל."]}}, {"id": "nlp-010", "area": "nlp", "topic": "generation-metrics", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["rouge", "bleu", "evaluation"], "answer": 0, "en": {"q": "A summarizer writes summaries twice as long as the references and its ROUGE-1 recall jumps. Why is that suspicious?", "options": ["ROUGE recall rewards covering reference n-grams, and longer output covers more", "ROUGE is computed over characters, so any length change moves it mechanically", "ROUGE applies a brevity penalty that misfires on over-long output", "ROUGE counts only 4-grams, which are denser in longer text"], "hint": "Ask which side of the precision/recall pair each metric is built on.", "explanation": "ROUGE-N recall is the fraction of reference n-grams that appear in the candidate, so simply emitting more text can only help it. That is why ROUGE should be reported as an F-measure or next to a length statistic. BLEU has the mirror-image weakness, being precision-based, which is exactly why it carries a brevity penalty.", "whyWrong": ["ROUGE-N works on word n-grams, and ROUGE-L on the longest common subsequence of words.", "The brevity penalty belongs to BLEU, and it penalizes output that is too short, not too long.", "ROUGE-1 counts unigrams here; the order n is chosen by the user, not fixed at 4."]}, "he": {"q": "מערכת תמצות מפיקה תקצירים ארוכים פי שניים מהייחוס, וציון ה-ROUGE-1 recall שלה מזנק. מדוע זה חשוד?", "options": ["ROUGE recall מתגמל כיסוי של n-gram מהייחוס, ופלט ארוך יותר מכסה יותר", "ROUGE מחושב על תווים, ולכן כל שינוי אורך מזיז אותו מכנית", "ROUGE מחיל קנס קיצור (brevity penalty) שמשתבש על פלט ארוך מדי", "ROUGE סופר רק 4-grams, שצפופים יותר בטקסט ארוך"], "hint": "שאלו איזה צד של הזוג דיוק/היזכרות (precision/recall) עומד בבסיס כל מדד.", "explanation": "ROUGE-N recall הוא שיעור ה-n-gram מתוך טקסט הייחוס שמופיעים במועמד, ולכן פליטת טקסט ארוך יותר יכולה רק לעזור לו. לכן נכון לדווח ROUGE כמדד F או לצד סטטיסטיקת אורך. ל-BLEU יש חולשה הפוכה בדיוק, כי הוא מבוסס דיוק — ובדיוק בגלל זה יש בו קנס קיצור.", "whyWrong": ["ROUGE-N עובד על n-gram של מילים, ו-ROUGE-L על תת-הסדרה המשותפת הארוכה ביותר של מילים.", "קנס הקיצור שייך ל-BLEU, והוא מעניש פלט קצר מדי ולא ארוך מדי.", "ROUGE-1 סופר כאן יוניגרמים; הסדר n נבחר על ידי המשתמש ואינו קבוע על 4."]}}, {"id": "nlp-011", "area": "nlp", "topic": "mlm-vs-causal-lm", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["mlm", "causal-lm", "pretraining"], "en": {"q": "BERT is pretrained with masked language modeling, GPT with next-token prediction. Explain how the two objectives differ and what each buys you.", "hint": "Think about which positions produce a loss, what context each prediction may see, and what you get for free at inference.", "modelAnswer": "MLM corrupts roughly 15% of positions and asks the model to reconstruct them, and every prediction may attend both left and right, which yields deeply bidirectional representations that are strong for classification, tagging and retrieval. Causal LM predicts every token from its left context only, so each sequence produces a full set of loss terms and the trained model is directly a generator. MLM is therefore less sample-efficient per token, since only the masked positions contribute loss, and it cannot generate autoregressively without extra machinery. MLM also has a train/test mismatch: the [MASK] token appears during pretraining but never downstream. In practice encoders are picked for understanding and embedding tasks, decoders for generation and in-context learning.", "rubric": ["MLM sees context on both sides; causal LM is strictly left-to-right", "MLM produces loss only on the masked subset, so fewer training signals per sequence", "Causal LM gives a ready-to-use generator, MLM does not", "The [MASK] token creates a pretrain/finetune mismatch", "Encoders suit classification and embeddings, decoders suit generation"]}, "he": {"q": "BERT מאומן מראש עם masked language modeling, ו-GPT עם ניבוי הטוקן הבא. הסבירו במה נבדלות שתי פונקציות המטרה ומה כל אחת מקנה.", "hint": "חשבו אילו מיקומים מייצרים loss, איזה הקשר כל ניבוי רשאי לראות, ומה מקבלים בחינם בזמן ההסקה.", "modelAnswer": "MLM משבש כ-15% מהמיקומים ומבקש מהמודל לשחזר אותם, וכל ניבוי רשאי להסתכל ימינה ושמאלה — וכך מתקבלים ייצוגים דו-כיווניים עמוקים, חזקים למשימות סיווג, תיוג ואחזור. Causal LM מנבא כל טוקן מההקשר השמאלי בלבד, ולכן כל רצף מייצר סט מלא של איברי loss והמודל המאומן הוא ישירות מחולל טקסט. לכן MLM יעיל פחות בניצול דוגמאות לכל טוקן, כי רק המיקומים הממוסכים תורמים ל-loss, והוא אינו יכול לחולל אוטורגרסיבית בלי מנגנון נוסף. ב-MLM יש גם אי-התאמה בין אימון להסקה: הטוקן [MASK] מופיע באימון המקדים ולעולם לא במשימת היעד. בפועל בוחרים מקודדים למשימות הבנה ו-embeddings, ומפענחים לחילול וללמידה בהקשר (in-context learning).", "rubric": ["MLM רואה הקשר משני הצדדים, ו-causal LM הוא משמאל לימין בלבד", "ב-MLM ה-loss מחושב רק על תת-הקבוצה הממוסכת, כלומר פחות אותות אימון לכל רצף", "Causal LM נותן מחולל מוכן לשימוש, ו-MLM לא", "הטוקן [MASK] יוצר אי-התאמה בין האימון המקדים לכיוונון העדין", "מקודדים מתאימים לסיווג ו-embeddings, מפענחים מתאימים לחילול"]}}, {"id": "nlp-012", "area": "nlp", "topic": "rag-failure-modes", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["rag", "retrieval", "chunking"], "en": {"q": "Your RAG system retrieves plausible-looking passages but the answers are still wrong. Name concrete chunking and retrieval failure modes, and how you would diagnose them.", "hint": "Separate 'the right passage was never retrieved' from 'it was retrieved and then misused'.", "modelAnswer": "First measure retrieval separately from generation: compute recall@k against annotated gold passages, because if the answer is not in the top-k no prompt change can fix it. Typical chunking faults are boundaries that split an answer in two, chunks so large that the one relevant sentence is diluted in the embedding, and chunks stripped of the section title or entity they refer to, so pronouns and references cannot be resolved. Typical retrieval faults are dense-only search missing exact identifiers or rare terms, which hybrid BM25 plus dense retrieval and a cross-encoder reranker fix, near-duplicate chunks crowding out the top-k, and stale or contradictory documents that the generator then trusts. If recall@k is high but answers are still wrong, the fault is in the reader: too many distracting passages, position effects in a long context, or no instruction to abstain when the context does not support an answer.", "rubric": ["Evaluate retrieval and generation separately, e.g. recall@k on gold passages", "Chunk boundaries can split or dilute the answer; use overlap and keep titles/metadata", "Dense-only retrieval misses exact terms; hybrid search plus reranking helps", "Duplicates, stale or contradictory documents poison the top-k", "If recall is fine, blame the reader: distractors, position effects, no abstention"]}, "he": {"q": "מערכת ה-RAG שלכם מאחזרת קטעים שנראים סבירים, אבל התשובות עדיין שגויות. מנו כשלים קונקרטיים בחלוקה לקטעים ובאחזור, וכיצד הייתם מאבחנים אותם.", "hint": "הפרידו בין המקרה שבו הקטע הנכון כלל לא אוחזר לבין המקרה שבו הוא אוחזר ונעשה בו שימוש שגוי.", "modelAnswer": "קודם כול מודדים אחזור בנפרד מחילול: מחשבים recall@k מול קטעי זהב מתויגים, כי אם התשובה אינה ב-top-k שום שינוי בפרומפט לא יציל אותה. כשלי חלוקה טיפוסיים הם גבולות שחוצים את התשובה לשניים, קטעים גדולים כל כך שהמשפט הרלוונטי היחיד נמהל ב-embedding, וקטעים שנותקו מכותרת הסעיף או מהישות שאליה הם מתייחסים, כך שאי אפשר לפענח כינויי גוף והפניות. כשלי אחזור טיפוסיים הם חיפוש צפוף (dense) בלבד שמפספס מזהים מדויקים או מונחים נדירים — נפתר בחיפוש היברידי של BM25 יחד עם dense ובדירוג מחדש עם cross-encoder — קטעים כמעט זהים שדוחקים את ה-top-k, ומסמכים מיושנים או סותרים שהמחולל מאמין להם. אם ה-recall@k גבוה והתשובות עדיין שגויות, האשם הוא בצד הקורא: יותר מדי קטעים מסיחים, אפקטים של מיקום בהקשר ארוך, או היעדר הנחיה להימנע מתשובה כשההקשר אינו תומך בה.", "rubric": ["מודדים אחזור וחילול בנפרד, למשל recall@k מול קטעי זהב", "גבולות קטעים עלולים לחצות או לדלל את התשובה; חפיפה ושמירת כותרות ומטא-דאטה עוזרות", "אחזור צפוף בלבד מפספס מונחים מדויקים; חיפוש היברידי ודירוג מחדש עוזרים", "כפילויות ומסמכים מיושנים או סותרים מרעילים את ה-top-k", "אם ה-recall תקין, האשם הוא הקורא: מסיחים, אפקטי מיקום, היעדר הימנעות מתשובה"]}}, {"id": "llm-001", "area": "llm", "topic": "attention-variants", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["attention", "gqa", "kv-cache"], "en": {"q": "Explain why grouped-query attention (GQA) exists. What does it change relative to MHA and MQA, and what does it cost?", "hint": "During decoding, what must be read out of memory for every single generated token?", "modelAnswer": "Autoregressive decoding is memory-bandwidth bound: for each new token the GPU reads all model weights and the entire KV cache, and that cache grows with batch size and sequence length. Multi-head attention stores one K and one V per head, which dominates memory at long context. Multi-query attention keeps a single K/V head shared by all query heads, shrinking the cache by the number of heads and speeding decoding a lot, at some cost in quality and training stability. GQA interpolates: query heads are split into g groups, each sharing one K/V head, so the cache shrinks by heads/g while keeping most of MHA's quality. In all three the query heads are unchanged, so attention FLOPs barely move; the win is in bytes moved, not arithmetic.", "rubric": ["Decoding is bandwidth-bound and KV cache traffic dominates", "MHA keeps one K/V per head, MQA shares a single K/V across all heads", "GQA groups query heads to share K/V, a tunable middle point", "Cache shrinks by the sharing factor, with a small quality cost", "Query heads and attention FLOPs are essentially unchanged"]}, "he": {"q": "הסבירו מדוע קיים grouped-query attention‏ (GQA). מה הוא משנה ביחס ל-MHA ול-MQA, ומה המחיר?", "hint": "בזמן פענוח, מה חייב להיקרא מהזיכרון עבור כל טוקן שנוצר?", "modelAnswer": "פענוח אוטורגרסיבי חסום ברוחב פס של זיכרון: עבור כל טוקן חדש ה-GPU קורא את כל משקלי המודל ואת כל ה-KV cache, וה-cache הזה גדל עם גודל האצווה ואורך הרצף. ב-multi-head attention נשמרים K ו-V לכל ראש, וזה מה ששולט בזיכרון בהקשרים ארוכים. ב-multi-query attention נשמר ראש K/V יחיד המשותף לכל ראשי השאילתה, וכך ה-cache מתכווץ פי מספר הראשים והפענוח מואץ מאוד — במחיר מסוים באיכות וביציבות האימון. GQA הוא פשרה: ראשי השאילתה מחולקים ל-g קבוצות, וכל קבוצה חולקת ראש K/V אחד, כך שה-cache מתכווץ פי heads/g תוך שמירה על רוב איכות ה-MHA. בכל שלוש הגרסאות ראשי השאילתה נשארים כשהיו, ולכן ה-FLOPs של ה-attention כמעט אינם משתנים; הרווח הוא בבייטים שמוזזים, לא בחשבון.", "rubric": ["פענוח חסום ברוחב פס וקריאת ה-KV cache שולטת בעלות", "ב-MHA יש K/V לכל ראש, ב-MQA ראש K/V יחיד משותף לכולם", "GQA מקבץ ראשי שאילתה שחולקים K/V — נקודת ביניים מכווננת", "ה-cache מתכווץ ביחס לגורם השיתוף, במחיר קטן באיכות", "מספר ראשי השאילתה ו-FLOPs של ה-attention כמעט אינם משתנים"]}}, {"id": "llm-002", "area": "llm", "topic": "kv-cache-size", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["kv-cache", "inference", "memory"], "answer": 2, "en": {"q": "A decoder has 32 layers and model dimension 4096, plain multi-head attention, fp16. For one sequence of 1024 tokens, how big is the KV cache?", "options": ["128 MiB", "256 MiB", "512 MiB", "1 GiB"], "hint": "Per layer you store two tensors of shape (tokens x d_model), at 2 bytes per entry.", "explanation": "The cache is 2 (K and V) x 32 layers x 1024 tokens x 4096 dims x 2 bytes = 536,870,912 bytes, that is 512 MiB. With MHA the heads partition d_model, so K and V together are exactly 2 x d_model per token per layer. And this is per sequence: a batch of 32 such requests already needs 16 GiB of cache alone.", "whyWrong": ["128 MiB is off by a factor of four, dropping both the K/V factor of 2 and the 2 bytes of fp16.", "256 MiB counts only K or only V, but both tensors have to be stored.", "1 GiB double-counts, for instance by assuming fp32 when the question specifies fp16."]}, "he": {"q": "למפענח יש 32 שכבות ומימד מודל 4096, multi-head attention רגיל, ב-fp16. עבור רצף אחד באורך 1024 טוקנים, מה גודל ה-KV cache?", "options": ["128 MiB", "256 MiB", "512 MiB", "1 GiB"], "hint": "בכל שכבה שומרים שני טנזורים בגודל (טוקנים x d_model), 2 בייטים לכל ערך.", "explanation": "גודל ה-cache הוא 2 (K ו-V) x 32 שכבות x 1024 טוקנים x 4096 מימדים x 2 בייטים = 536,870,912 בייטים, כלומר 512 MiB. ב-MHA הראשים מחלקים ביניהם את d_model, ולכן K ו-V יחד הם בדיוק 2 x d_model לכל טוקן בכל שכבה. וזה לרצף אחד: אצווה של 32 בקשות כאלה כבר דורשת 16 GiB ל-cache בלבד.", "whyWrong": ["‏128 MiB שגוי פי ארבעה — הוא מוותר גם על פקטור 2 של K/V וגם על 2 הבייטים של fp16.", "‏256 MiB סופר רק את K או רק את V, אבל צריך לשמור את שניהם.", "‏1 GiB סופר פעמיים, למשל בהנחת fp32 בעוד השאלה מציינת fp16."]}}, {"id": "llm-003", "area": "llm", "topic": "positional-encoding", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["rope", "alibi", "positional-encoding"], "answer": 3, "en": {"q": "Which statement about RoPE and ALiBi is correct?", "options": ["RoPE adds a learned vector per position; ALiBi adds a learned vector per head", "Both add their positional signal to the token embeddings before layer one", "RoPE is relative and ALiBi absolute, which is why ALiBi extrapolates so well", "RoPE rotates queries and keys by a position angle; ALiBi biases scores by distance"], "hint": "Ask where inside the attention computation each method intervenes.", "explanation": "RoPE applies a position-dependent rotation to q and k inside every attention layer, so their dot product depends on the relative offset. ALiBi leaves q and k untouched and subtracts a fixed per-head slope times the query-key distance from the attention logits. Both are relative schemes injected at attention time, unlike sinusoidal or learned absolute encodings, which are added to the input embeddings once.", "whyWrong": ["Neither uses a learned per-position vector, which describes learned absolute embeddings; ALiBi's slopes are fixed, not learned.", "Both act inside attention, on q/k or on the logits, not on the input embeddings.", "Both are relative schemes; ALiBi extrapolates thanks to its monotone distance penalty, not by being absolute."]}, "he": {"q": "איזו טענה על RoPE ועל ALiBi נכונה?", "options": ["‏RoPE מוסיף וקטור נלמד לכל מיקום; ALiBi מוסיף וקטור נלמד לכל ראש", "שניהם מוסיפים את אות המיקום ל-embeddings של הטוקנים לפני השכבה הראשונה", "‏RoPE הוא יחסי ו-ALiBi מוחלט, ולכן ALiBi מכליל כה טוב מעבר לאורך האימון", "‏RoPE מסובב שאילתות ומפתחות בזווית לפי מיקום; ALiBi מטה את הציונים לפי מרחק"], "hint": "שאלו היכן בתוך חישוב ה-attention כל שיטה מתערבת.", "explanation": "‏RoPE מפעיל סיבוב תלוי-מיקום על q ועל k בתוך כל שכבת attention, כך שמכפלתם הפנימית תלויה בהפרש המיקומים. ALiBi אינו נוגע ב-q וב-k, אלא מחסיר מהלוגיטים של ה-attention שיפוע קבוע לכל ראש כפול המרחק בין שאילתה למפתח. שניהם שיטות יחסיות המוזרקות בזמן ה-attention, בשונה מקידוד מיקום סינוסואידלי או נלמד מוחלט, שנוסף פעם אחת ל-embeddings של הקלט.", "whyWrong": ["אף אחד מהם אינו משתמש בוקטור נלמד לכל מיקום — זה תיאור של embeddings מוחלטים נלמדים; השיפועים של ALiBi קבועים ולא נלמדים.", "שניהם פועלים בתוך ה-attention, על q/k או על הלוגיטים, ולא על embeddings של הקלט.", "שניהם שיטות יחסיות; ALiBi מכליל בזכות קנס המרחק המונוטוני שלו, ולא משום שהוא מוחלט."]}}, {"id": "llm-004", "area": "llm", "topic": "flashattention", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["flashattention", "attention", "memory"], "answer": 1, "en": {"q": "What does FlashAttention actually change about attention?", "options": ["It approximates attention with a sparse pattern, cutting the FLOP count", "It computes the same result while never writing the n x n matrix to HBM", "It lowers the asymptotic cost from O(n^2 d) to O(n log n d)", "It caches attention outputs across decoding steps to skip recomputation"], "hint": "Is the numerical output any different from a naive implementation?", "explanation": "FlashAttention is exact: it tiles the computation and uses an online, streaming softmax so the full attention matrix stays in SRAM and is never materialized in HBM. FLOPs remain O(n^2 d); the speedup comes from being IO-aware on a memory-bound kernel, plus a large activation-memory saving that makes longer sequences trainable.", "whyWrong": ["It is exact rather than approximate; sparse and linear attention are the methods that cut FLOPs.", "The asymptotic arithmetic cost is unchanged; only HBM traffic and peak memory improve.", "Reusing past keys and values is the KV cache, an unrelated inference-time technique."]}, "he": {"q": "מה בעצם משנה FlashAttention במנגנון ה-attention?", "options": ["הוא מקרב את ה-attention בתבנית דלילה ובכך חוסך FLOPs", "הוא מחשב את אותה תוצאה בדיוק, בלי לכתוב אף פעם את מטריצת n x n ל-HBM", "הוא מוריד את הסיבוכיות האסימפטוטית מ-O(n^2 d) ל-O(n log n d)", "הוא שומר במטמון את פלטי ה-attention בין צעדי פענוח כדי לחסוך חישוב"], "hint": "האם התוצאה המספרית שונה בכלל ממימוש נאיבי?", "explanation": "‏FlashAttention הוא מדויק: הוא מחלק את החישוב לאריחים ומשתמש ב-softmax מקוון (streaming), כך שמטריצת ה-attention המלאה נשארת ב-SRAM ואינה נכתבת ל-HBM. מספר ה-FLOPs נשאר O(n^2 d); ההאצה מגיעה ממימוש מודע-IO של גרעין חסום-זיכרון, ובנוסף מחיסכון גדול בזיכרון אקטיבציות שמאפשר לאמן על רצפים ארוכים יותר.", "whyWrong": ["הוא מדויק ולא מקורב; attention דליל או ליניארי הן השיטות שחוסכות FLOPs.", "העלות החשבונית האסימפטוטית אינה משתנה; משתפרים רק תעבורת ה-HBM וצריכת הזיכרון המרבית.", "שימוש חוזר במפתחות ובערכים קודמים הוא ה-KV cache, טכניקה נפרדת בזמן הסקה."]}}, {"id": "llm-005", "area": "llm", "topic": "sliding-window-attention", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["sliding-window", "sparse-attention", "long-context"], "answer": 2, "en": {"q": "A 24-layer model uses sliding-window attention with a 512-token window in every layer. How far back can the last token's representation be influenced?", "options": ["512 tokens, since the window is a hard limit at every depth", "1024 tokens, one window for the keys and one for the values", "Up to roughly 24 x 512 tokens, because windows compose across layers", "Unbounded, since softmax gives every position some nonzero weight"], "hint": "Draw the receptive field of a stack of convolutions with a fixed kernel width.", "explanation": "Each layer lets a position attend 512 tokens back, but those positions already summarized their own 512-token windows, so the receptive field grows roughly linearly with depth, exactly like stacked convolutions: about layers x window, here 24 x 512 = 12,288 tokens. Information does travel far, but indirectly and with weakening fidelity, which is why such models often interleave a few global or full-attention layers.", "whyWrong": ["That is the per-layer attention span, not the model's receptive field; depth composes the windows.", "K and V are taken at the same positions, so there is no separate window for each.", "Outside the window the mask sets the score to -inf, so the weight is exactly zero, not merely small."]}, "he": {"q": "מודל בן 24 שכבות משתמש ב-sliding-window attention עם חלון של 512 טוקנים בכל שכבה. עד כמה אחורה יכול הייצוג של הטוקן האחרון להיות מושפע?", "options": ["‏512 טוקנים, כי החלון הוא מגבלה קשיחה בכל עומק", "‏1024 טוקנים, חלון אחד למפתחות ואחד לערכים", "עד בערך 24 x 512 טוקנים, כי החלונות מצטברים לאורך השכבות", "בלתי חסום, כי ה-softmax נותן לכל מיקום משקל חיובי כלשהו"], "hint": "ציירו את שדה הקליטה (receptive field) של ערימת קונבולוציות ברוחב גרעין קבוע.", "explanation": "כל שכבה מאפשרת למיקום להסתכל 512 טוקנים אחורה, אבל המיקומים ההם כבר סיכמו את החלונות שלהם עצמם, ולכן שדה הקליטה גדל בערך ליניארית עם העומק — בדיוק כמו בערימת קונבולוציות: בערך שכבות x חלון, כאן 24 x 512 = 12,288 טוקנים. המידע אכן נודד רחוק, אך בעקיפין ובנאמנות הולכת ופוחתת, ולכן מודלים כאלה משלבים לא פעם כמה שכבות גלובליות או attention מלא.", "whyWrong": ["זהו טווח ה-attention לכל שכבה ולא שדה הקליטה של המודל; העומק מרכיב את החלונות זה על זה.", "‏K ו-V נלקחים מאותם מיקומים בדיוק, ולכן אין חלון נפרד לכל אחד מהם.", "מחוץ לחלון המסכה קובעת את הציון ל-‎-inf, ולכן המשקל הוא אפס מדויק ולא רק קטן."]}}, {"id": "llm-006", "area": "llm", "topic": "moe-parameters", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["moe", "routing", "parameters"], "answer": 0, "en": {"q": "An MoE model has 8B parameters in shared components, plus 16 experts of 2B each, with top-2 routing. Total and active parameters per token?", "options": ["40B total, 12B active", "40B total, 40B active", "24B total, 12B active", "40B total, 10B active"], "hint": "Total counts every expert; active counts only the experts the router picks, plus all shared parts.", "explanation": "Total = 8B + 16 x 2B = 40B. Per token the router selects 2 experts, so active = 8B + 2 x 2B = 12B, and that active count is what sets the FLOPs per token. Memory must still hold all 40B, which is the central MoE trade: cheap compute for expensive memory. An auxiliary load-balancing loss is added so the router does not collapse onto a few favourite experts.", "whyWrong": ["That describes a dense model; the whole point of top-k routing is that most experts stay idle per token.", "24B counts only 8 of the 16 experts, but every expert counts toward the total parameter count.", "10B adds just one expert's 2B; top-2 routing activates two, giving 8B + 4B = 12B."]}, "he": {"q": "למודל MoE יש 8B פרמטרים ברכיבים המשותפים, ובנוסף 16 מומחים של 2B כל אחד, עם ניתוב top-2. מהו מספר הפרמטרים הכולל והפעיל
