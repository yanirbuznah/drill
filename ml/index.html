ually scales the estimates up early.", "The correction factor converges to 1, so it is the opposite of a decay schedule.", "Scale invariance comes from dividing by sqrt(v), which happens with or without bias correction."]}, "he": {"q": "מדוע Adam מחלק את שתי הערכות המומנטים שלו ב-(1 - beta^t) לפני השימוש בהן?", "options": ["כדי לחסום את גודל כל עדכון בקצב הלמידה", "כדי להקטין את קצב הלמידה האפקטיבי בהדרגה לאורך האימון", "כדי שהעדכון יהיה חסין לשינוי סקאלה כללי של הגרדיאנטים", "מפני ששני המומנטים מאותחלים ל-0 ולכן מוטים כלפי 0 בתחילת האימון"], "hint": "לאיזה ערך מאותחלים m ו-v, ומה זה עושה לממוצע אחרי שניים-שלושה צעדים בלבד?", "explanation": "שני הממוצעים הנעים מאותחלים לאפס, ולכן עבור t קטן הם מעריכים בחסר באופן שיטתי את המומנטים האמיתיים. החלוקה ב-(1 - beta1^t) וב-(1 - beta2^t) מסירה את ההטיה הזו, והתיקון שואף ל-1 ככל ש-t גדל. בלעדיו, ב-t = 1 היחס m/sqrt(v) שווה ל-(1-beta1)/sqrt(1-beta2), כלומר בערך 3.2 עם ערכי ברירת המחדל, במקום 1 כמתוכנן — ולכן הצעדים הראשונים בסקאלה שגויה לגמרי.", "whyWrong": ["החסימה נובעת מהיחס m/sqrt(v); תיקון ההטיה דווקא מגדיל את ההערכות בתחילת האימון.", "פקטור התיקון מתכנס ל-1, ולכן הוא ההפך מלוח דעיכה של קצב הלמידה.", "החסינות לסקאלה נובעת מהחלוקה ב-sqrt(v), שקורית עם או בלי תיקון הטיה."]}}, {"id": "dlf-006", "area": "dl-fundamentals", "topic": "adamw", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["adamw", "weight-decay", "optimizers"], "answer": 2, "en": {"q": "What exactly is decoupled in AdamW, compared with plain Adam plus an L2 term in the loss?", "options": ["The second moment is decoupled from the first and updates on its own schedule", "The decay hits only weight matrices, decoupling it from biases and norm gains", "The decay applies to the weights directly, not through the adaptive scaling", "The weight decay coefficient is decoupled from the learning-rate schedule"], "hint": "Follow an L2 penalty term through Adam's per-parameter division by sqrt(v).", "explanation": "An L2 term added to the loss becomes part of the gradient, so Adam divides it by sqrt(v) along with everything else — parameters with large gradient variance then receive far less decay than intended. AdamW instead subtracts lr * wd * w from the weights directly, outside the adaptive step, so every parameter gets the same relative shrinkage. That is why weight decay in AdamW behaves like classical decay and tunes predictably.", "whyWrong": ["Both moments update every step on the same schedule; nothing about them is decoupled.", "Excluding biases and norm parameters is a common practice, but it is orthogonal to what AdamW changed.", "Standard implementations still multiply the decay by the current scheduled learning rate."]}, "he": {"q": "מה בדיוק מנותק (decoupled) ב-AdamW לעומת Adam רגיל עם איבר L2 בתוך ה-loss?", "options": ["המומנט השני מנותק מהראשון ומתעדכן בקצב משלו", "הדעיכה חלה רק על מטריצות משקלים, ומנותקת מ-bias ומגורמי הנרמול", "הדעיכה מוחלת ישירות על המשקלים, לא דרך הסקיילינג האדפטיבי", "מקדם ה-weight decay מנותק מלוח קצב הלמידה"], "hint": "עקבו אחרי איבר עונש L2 כשהוא עובר את החלוקה של Adam ב-sqrt(v) לכל פרמטר.", "explanation": "איבר L2 שמתווסף ל-loss הופך לחלק מהגרדיאנט, ולכן Adam מחלק גם אותו ב-sqrt(v) כמו כל השאר — וכך פרמטרים עם שונות גרדיאנט גבוהה מקבלים הרבה פחות דעיכה מהמתוכנן. AdamW במקום זאת מחסיר lr * wd * w ישירות מהמשקלים, מחוץ לצעד האדפטיבי, כך שכל פרמטר מקבל את אותה התכווצות יחסית. זו הסיבה ש-weight decay ב-AdamW מתנהג כמו דעיכה קלאסית וקל יותר לכוונן אותו.", "whyWrong": ["שני המומנטים מתעדכנים בכל צעד באותו לוח זמנים; שום דבר בהם אינו מנותק.", "החרגת bias ופרמטרי נרמול היא נוהג מקובל, אך היא בלתי תלויה בשינוי שהציג AdamW.", "מימושים סטנדרטיים עדיין מכפילים את הדעיכה בקצב הלמידה הנוכחי לפי הלוח."]}}, {"id": "dlf-007", "area": "dl-fundamentals", "topic": "momentum", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["momentum", "nesterov", "sgd"], "answer": 0, "en": {"q": "How does Nesterov accelerated gradient differ from classical heavy-ball momentum?", "options": ["The gradient is evaluated at the look-ahead point, after the momentum step", "The momentum buffer is normalized by its own running second moment", "The momentum coefficient is annealed toward 0 as training proceeds", "The gradient is averaged over the last k steps instead of exponentially"], "hint": "Both methods use the same velocity buffer. The question is where the gradient is measured.", "explanation": "Classical momentum measures the gradient at the current parameters and then adds the velocity. Nesterov first applies the momentum step and measures the gradient at that look-ahead point, which yields a correction term that reacts to curvature one step earlier. In practice it damps overshoot in narrow valleys and often tolerates a slightly larger momentum coefficient.", "whyWrong": ["Normalizing by a running second moment is what RMSProp and Adam do, not Nesterov.", "Annealing momentum is an optional schedule choice and has nothing to do with the look-ahead.", "A k-step moving average is a different smoother and is not what Nesterov specifies."]}, "he": {"q": "במה שונה גרדיאנט מואץ של נסטרוב (Nesterov) ממומנטום קלאסי מסוג heavy-ball?", "options": ["הגרדיאנט מחושב בנקודת ההצצה קדימה, אחרי צעד המומנטום", "מאגר המומנטום מנורמל לפי המומנט השני הרץ של עצמו", "מקדם המומנטום דועך לכיוון 0 ככל שהאימון מתקדם", "הגרדיאנט ממוצע על פני k הצעדים האחרונים במקום ממוצע מעריכי"], "hint": "שתי השיטות משתמשות באותו מאגר מהירות. השאלה היא היכן נמדד הגרדיאנט.", "explanation": "במומנטום קלאסי מחשבים את הגרדיאנט בפרמטרים הנוכחיים ורק אז מוסיפים את המהירות. נסטרוב מבצע קודם את צעד המומנטום ומחשב את הגרדיאנט בנקודה שאליה הגענו, וכך מתקבל איבר תיקון שמגיב לעקמומיות צעד אחד מוקדם יותר. בפועל זה מרסן גלישה מעבר למינימום בעמקים צרים ולעיתים מאפשר מקדם מומנטום מעט גבוה יותר.", "whyWrong": ["נרמול לפי מומנט שני רץ הוא מה ש-RMSProp ו-Adam עושים, לא נסטרוב.", "דעיכת מקדם המומנטום היא בחירת לוח אופציונלית ואינה קשורה להצצה קדימה.", "ממוצע נע על k צעדים הוא מחליק אחר לגמרי ואינו מה שנסטרוב מגדיר."]}}, {"id": "dlf-008", "area": "dl-fundamentals", "topic": "lr-warmup", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["warmup", "learning-rate", "adam"], "answer": 3, "en": {"q": "Why do transformer recipes ramp the learning rate up over the first few thousand steps instead of starting at the peak value?", "options": ["To let batch norm running statistics settle before real training begins", "Because the loss surface is convex early on and needs small careful steps", "To give the input pipeline time to fill its shuffle buffer with data", "Early gradients are large and Adam's variance estimate is still unreliable"], "hint": "How many samples has the second-moment estimate seen at step 20?", "explanation": "At initialization the loss is steep and Adam's second-moment estimate is built from a handful of gradients, so its per-parameter step sizes are noisy. A large learning rate then produces huge, badly scaled updates that can wreck the initialization within a few steps. Warmup raises the LR gradually while the moment estimates stabilize; post-norm transformers need it far more than pre-norm ones.", "whyWrong": ["Transformers normalize with layer norm, which keeps no running statistics at all.", "Deep-network losses are non-convex from step one; convexity is not the reason.", "Data-loading timing has nothing to do with how large the optimizer's steps are."]}, "he": {"q": "מדוע מתכוני אימון של טרנספורמרים מעלים את קצב הלמידה בהדרגה לאורך אלפי הצעדים הראשונים במקום להתחיל בערך השיא?", "options": ["כדי לאפשר לסטטיסטיקות הרצות של batch norm להתייצב לפני האימון האמיתי", "מפני שמשטח ה-loss קמור בתחילת האימון ודורש צעדים קטנים וזהירים", "כדי לתת ל-pipeline של הנתונים זמן למלא את מאגר הערבוב", "הגרדיאנטים ההתחלתיים גדולים והערכת השונות של Adam עדיין לא אמינה"], "hint": "על כמה דגימות מבוססת הערכת המומנט השני בצעד 20?", "explanation": "באתחול משטח ה-loss תלול, והערכת המומנט השני של Adam מבוססת על קומץ גרדיאנטים בלבד, ולכן גדלי הצעד לכל פרמטר רועשים מאוד. קצב למידה גבוה מייצר אז עדכונים ענקיים ובסקאלה שגויה שעלולים להרוס את האתחול תוך צעדים בודדים. חימום (warmup) מעלה את קצב הלמידה בהדרגה בזמן שהערכות המומנטים מתייצבות; טרנספורמרים מסוג post-norm זקוקים לו הרבה יותר מאשר pre-norm.", "whyWrong": ["טרנספורמרים מנרמלים עם layer norm, שאינו מחזיק סטטיסטיקות רצות כלל.", "ה-loss של רשתות עמוקות אינו קמור כבר מהצעד הראשון; קמירות אינה הסיבה.", "עיתוי טעינת הנתונים אינו קשור לגודל הצעדים של האופטימייזר."]}}, {"id": "dlf-009", "area": "dl-fundamentals", "topic": "batch-size", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["batch-size", "learning-rate", "scaling"], "answer": 1, "en": {"q": "You move an SGD-with-momentum recipe from batch size 256 to batch size 1024, changing nothing else. What is the standard first adjustment?", "options": ["Divide the learning rate by 4, since each step now consumes 4x more data", "Multiply the learning rate by 4, adding warmup to survive the early steps", "Keep the learning rate and multiply the number of epochs by 4", "Keep the learning rate and multiply the momentum coefficient by 4"], "hint": "How does the noise in the averaged mini-batch gradient change when the batch gets bigger?", "explanation": "This is the linear scaling rule: with k times the batch size, use k times the learning rate so the total parameter movement per epoch stays comparable, and add warmup because that large LR is unstable at initialization. It works because averaging over more samples shrinks the gradient noise as 1/sqrt(B). Past a critical batch size the rule breaks down and returns diminish, and with Adam a sqrt scaling is often preferred.", "whyWrong": ["Larger batches give less noisy gradients, which permits larger steps rather than smaller ones.", "Running more epochs at the old LR throws away the speed the large batch was meant to buy.", "Momentum coefficients live in [0,1), so multiplying one by 4 is not even well defined."]}, "he": {"q": "אתם עוברים ממתכון SGD עם מומנטום בגודל batch של 256 ל-1024, בלי לשנות דבר אחר. מהו הכיוונון הראשון המקובל?", "options": ["לחלק את קצב הלמידה ב-4, כי כל צעד צורך פי 4 יותר נתונים", "להכפיל את קצב הלמידה ב-4, עם warmup כדי לשרוד את הצעדים הראשונים", "להשאיר את קצב הלמידה ולהכפיל את מספר האפוקים ב-4", "להשאיר את קצב הלמידה ולהכפיל את מקדם המומנטום ב-4"], "hint": "כיצד משתנה הרעש בגרדיאנט הממוצע של המיני-batch כשהוא גדל?", "explanation": "זהו כלל הסקיילינג הלינארי: כשמכפילים את גודל ה-batch פי k, מכפילים גם את קצב הלמידה פי k כדי שהתזוזה הכוללת של הפרמטרים לכל אפוק תישאר דומה, ומוסיפים warmup כי קצב הלמידה הגדול אינו יציב באתחול. זה עובד מפני שמיצוע על יותר דוגמאות מקטין את רעש הגרדיאנט כמו 1/sqrt(B). מעבר לגודל batch קריטי הכלל נשבר והתשואה פוחתת, ועם Adam נהוג לעיתים סקיילינג לפי שורש.", "whyWrong": ["batch גדול יותר נותן גרדיאנטים פחות רועשים, ולכן מאפשר צעדים גדולים יותר ולא קטנים.", "ריצת אפוקים נוספים בקצב הלמידה הישן מבזבזת בדיוק את המהירות שה-batch הגדול נועד להשיג.", "מקדם מומנטום נמצא בתחום [0,1), ולכן הכפלה שלו ב-4 אינה מוגדרת כלל."]}}, {"id": "dlf-010", "area": "dl-fundamentals", "topic": "batch-norm", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["batch-norm", "inference", "normalization"], "answer": 0, "en": {"q": "Which statistics does a batch norm layer use at inference time?", "options": ["Running estimates of mean and variance accumulated during training", "The mean and variance of the current test batch", "The mean and variance of the whole training set, recomputed after training", "Fixed values of 0 and 1, with only gamma and beta still applied"], "hint": "Ask whether a single prediction should depend on which other examples happen to sit in the same batch.", "explanation": "During training BN normalizes with the statistics of the current mini-batch, which would make a prediction depend on its batch-mates. At eval time it swaps in an exponential moving average of the mean and variance collected during training, turning the layer into a fixed affine map. Forgetting to switch the model to eval mode is a classic source of mysterious test-time behavior.", "whyWrong": ["That would make each prediction depend on the other test examples and would break batch-size-1 inference.", "An exact full-pass recomputation is possible but is not what standard BN implementations do.", "Skipping normalization entirely would not match the statistics the network was trained under."]}, "he": {"q": "באילו סטטיסטיקות משתמשת שכבת batch norm בזמן היסק (inference)?", "options": ["הערכות רצות של ממוצע ושונות שנצברו במהלך האימון", "הממוצע והשונות של ה-batch הנוכחי של הבדיקה", "הממוצע והשונות של כל סט האימון, שמחושבים מחדש בסוף האימון", "ערכים קבועים 0 ו-1, כשרק gamma ו-beta עדיין מוחלים"], "hint": "שאלו אם תחזית בודדת צריכה להיות תלויה בדוגמאות האחרות שבמקרה נמצאות באותו batch.", "explanation": "במהלך האימון BN מנרמל לפי הסטטיסטיקות של המיני-batch הנוכחי, מה שהיה גורם לתחזית להיות תלויה בדוגמאות שאיתה ב-batch. בזמן הערכה הוא מחליף אותן בממוצע נע מעריכי של הממוצע והשונות שנאספו באימון, והשכבה הופכת להעתקה אפינית קבועה. שכחה להעביר את המודל למצב eval היא מקור קלאסי להתנהגות מוזרה בזמן בדיקה.", "whyWrong": ["זה היה גורם לכל תחזית להיות תלויה בדוגמאות הבדיקה האחרות ושובר היסק על דוגמה בודדת.", "חישוב מדויק במעבר מלא על הנתונים אפשרי, אך אינו מה שמימושי BN הסטנדרטיים עושים.", "ויתור מוחלט על הנרמול לא היה תואם את הסטטיסטיקות שלפיהן הרשת אומנה."]}}, {"id": "dlf-011", "area": "dl-fundamentals", "topic": "batch-norm", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["batch-norm", "batch-size", "group-norm"], "answer": 3, "en": {"q": "Memory forces you to train with a per-GPU batch of 2 images. Why is batch norm a poor choice at that batch size?", "options": ["Its running statistics update too slowly to converge within the schedule", "Its gamma and beta parameters become unidentifiable at small batch", "Its memory overhead becomes large relative to the tiny activation tensors", "Statistics from 2 samples are far too noisy for stable normalization"], "hint": "How well can you estimate a variance from two numbers?", "explanation": "BN estimates a mean and variance from the examples in the batch, and with 2 samples those estimates have enormous variance — the normalization itself becomes a strong random perturbation, and the training-time statistics drift away from the running averages used at test time. Group norm, layer norm, or synchronizing BN statistics across devices are the standard fixes, which is exactly why detection and segmentation models moved to GroupNorm.", "whyWrong": ["The EMA momentum is just a hyperparameter; slow updating is not the core failure here.", "gamma and beta are ordinary learned parameters and remain perfectly identifiable.", "BN's memory overhead is small and is not what makes tiny batches fail."]}, "he": {"q": "מגבלת זיכרון מאלצת אתכם לאמן עם batch של 2 תמונות לכל GPU. מדוע batch norm הוא בחירה גרועה בגודל כזה?", "options": ["הסטטיסטיקות הרצות שלו מתעדכנות לאט מדי מכדי להתכנס בתוך לוח האימון", "הפרמטרים gamma ו-beta הופכים לבלתי ניתנים לזיהוי ב-batch קטן", "תקורת הזיכרון שלו נעשית גדולה ביחס לטנזורי האקטיבציה הזעירים", "סטטיסטיקות מ-2 דגימות רועשות מדי מכדי לאפשר נרמול יציב"], "hint": "עד כמה אפשר להעריך שונות היטב משני מספרים?", "explanation": "BN מעריך ממוצע ושונות מתוך הדוגמאות שב-batch, ועם 2 דגימות להערכות האלה שונות עצומה — הנרמול עצמו הופך להפרעה אקראית חזקה, והסטטיסטיקות בזמן האימון מתרחקות מהממוצעים הרצים שמשמשים בזמן בדיקה. הפתרונות המקובלים הם group norm, layer norm, או סנכרון סטטיסטיקות BN בין המכשירים, וזו בדיוק הסיבה שמודלים לזיהוי ולסגמנטציה עברו ל-GroupNorm.", "whyWrong": ["מקדם הממוצע הנע הוא היפר-פרמטר בלבד; עדכון איטי אינו הכשל המרכזי כאן.", "gamma ו-beta הם פרמטרים נלמדים רגילים ונשארים ניתנים לזיהוי לחלוטין.", "תקורת הזיכרון של BN קטנה ואינה מה שגורם ל-batch זעיר להיכשל."]}}, {"id": "dlf-012", "area": "dl-fundamentals", "topic": "normalization", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["rmsnorm", "layer-norm", "normalization"], "answer": 1, "en": {"q": "RMSNorm differs from LayerNorm mainly by dropping which step?", "options": ["The learned per-feature gain applied after normalizing", "Subtracting the mean before dividing by the scale", "Dividing by a measure of the activation magnitude", "The epsilon added inside the square root for stability"], "hint": "LayerNorm does two things to the feature vector. RMSNorm keeps only one of them.", "explanation": "LayerNorm re-centers by subtracting the mean and then re-scales by the standard deviation. RMSNorm skips the re-centering and divides by the root mean square of the features, keeping a learned gain. It is cheaper and empirically just as good, which is why most recent LLMs use it — the finding being that re-scaling, not re-centering, is what makes normalization help.", "whyWrong": ["RMSNorm keeps a learned per-feature gain; what it usually drops in addition is the bias.", "Dividing by the root mean square is precisely the step RMSNorm keeps.", "Both variants add an epsilon inside the square root for numerical safety."]}, "he": {"q": "RMSNorm שונה מ-LayerNorm בעיקר בכך שהוא מוותר על איזה שלב?", "options": ["גורם ההגבר הנלמד לכל פיצ'ר שמוחל אחרי הנרמול", "חיסור הממוצע לפני החלוקה בגורם הסקאלה", "החלוקה במדד לגודל האקטיבציות", "ה-epsilon שמתווסף בתוך השורש למען יציבות"], "hint": "LayerNorm עושה שני דברים לווקטור הפיצ'רים. RMSNorm שומר רק על אחד מהם.", "explanation": "LayerNorm ממרכז מחדש על ידי חיסור הממוצע ואז מנרמל סקאלה לפי סטיית התקן. RMSNorm מדלג על המרכוז ומחלק בשורש הממוצע הריבועי של הפיצ'רים, תוך שמירה על גורם הגבר נלמד. הוא זול יותר וטוב באותה מידה אמפירית, ולכן רוב מודלי השפה החדשים משתמשים בו — המסקנה היא שדווקא נרמול הסקאלה, ולא המרכוז, הוא מה שמועיל.", "whyWrong": ["RMSNorm שומר על גורם הגבר נלמד לכל פיצ'ר; מה שהוא בדרך כלל מוותר עליו בנוסף הוא ה-bias.", "החלוקה בשורש הממוצע הריבועי היא בדיוק השלב ש-RMSNorm כן שומר.", "שתי הגרסאות מוסיפות epsilon בתוך השורש לצורך יציבות נומרית."]}}, {"id": "dlf-013", "area": "dl-fundamentals", "topic": "pre-norm-post-norm", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["pre-norm", "residual", "layer-norm"], "en": {"q": "Contrast pre-norm and post-norm residual blocks in a deep transformer. Why did pre-norm become the default, and what do you give up by choosing it?", "hint": "Trace a gradient from the top of the stack down to the bottom in each layout and see what it gets multiplied by.", "modelAnswer": "Post-norm computes LN(x + Sublayer(x)), so every residual addition is immediately renormalized and the identity path is rescaled once per layer; gradients flowing down a deep stack are repeatedly multiplied by the LN Jacobian and by the sublayer weights, which makes very deep post-norm models hard to train without learning-rate warmup and careful initialization. Pre-norm computes x + Sublayer(LN(x)), which leaves a clean unnormalized identity highway running from the output back to the input, so gradient magnitudes stay well behaved, deep stacks train stably, and you can often use a larger learning rate and less warmup. The cost is that the residual stream grows in magnitude with depth, so later blocks contribute relatively less and effective depth is reduced, and at equal depth a well-tuned post-norm model sometimes reaches slightly better final quality. Practical designs therefore add a final LN at the top of a pre-norm stack, and variants such as sandwich or scaled normalization try to get both properties.", "rubric": ["Writes both forms explicitly: post-norm LN(x + f(x)) versus pre-norm x + f(LN(x)).", "Explains that pre-norm leaves an unnormalized identity path, keeping gradient flow stable in deep stacks.", "Notes that post-norm needs warmup and careful initialization and is harder to train at depth.", "Names a cost of pre-norm: a residual stream that grows with depth, later layers contributing less, or slightly worse final quality at equal depth.", "Mentions that pre-norm stacks add a final LayerNorm before the output head."]}, "he": {"q": "השוו בין בלוקים שאריתיים מסוג pre-norm ל-post-norm בטרנספורמר עמוק. מדוע pre-norm הפך לברירת המחדל, ועל מה מוותרים כשבוחרים בו?", "hint": "עקבו אחרי גרדיאנט מראש המחסנית עד לתחתיתה בכל אחד מהמבנים ובדקו במה הוא מוכפל.", "modelAnswer": "ב-post-norm הבלוק מחשב LN(x + Sublayer(x)), כך שכל חיבור שארית מנורמל מיד ומסלול הזהות עובר סקיילינג מחדש בכל שכבה; הגרדיאנט שיורד במחסנית עמוקה מוכפל שוב ושוב ביעקוביאן של ה-LN ובמשקלי תת-השכבה, ולכן קשה לאמן מודלי post-norm עמוקים מאוד בלי warmup ובלי אתחול זהיר. ב-pre-norm הבלוק מחשב x + Sublayer(LN(x)), וכך נשמר כביש מהיר של זהות לא מנורמל מהפלט חזרה לקלט, גדלי הגרדיאנטים נשארים סבירים, מחסניות עמוקות מתאמנות ביציבות, ולרוב אפשר קצב למידה גבוה יותר ופחות warmup. המחיר הוא שזרם השארית גדל בעוצמתו עם העומק, ולכן בלוקים מאוחרים תורמים יחסית פחות והעומק האפקטיבי קטן, ובעומק זהה מודל post-norm מכוונן היטב מגיע לעיתים לאיכות סופית מעט טובה יותר. לכן בפועל מוסיפים LN אחרון בראש מחסנית pre-norm, וגרסאות כמו sandwich או נרמול מסוקלל מנסות להשיג את שתי התכונות יחד.", "rubric": ["כותב במפורש את שתי הצורות: post-norm בתור LN(x + f(x)) מול pre-norm בתור x + f(LN(x)).", "מסביר ש-pre-norm משאיר מסלול זהות לא מנורמל ולכן שומר על זרימת גרדיאנט יציבה במחסניות עמוקות.", "מציין ש-post-norm דורש warmup ואתחול זהיר וקשה יותר לאימון בעומק גדול.", "מציין מחיר של pre-norm: זרם שארית שגדל עם העומק, תרומה קטנה יותר של שכבות מאוחרות, או איכות סופית מעט נחותה בעומק זהה.", "מזכיר שבמחסנית pre-norm מוסיפים LayerNorm אחרון לפני ראש הפלט."]}}, {"id": "dlf-014", "area": "dl-fundamentals", "topic": "dropout", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["dropout", "inference", "regularization"], "answer": 2, "en": {"q": "With standard inverted dropout at rate p = 0.2, what happens to the activations at test time?", "options": ["They are multiplied by 0.8 to match the training-time expected scale", "Units are still dropped, but at a much smaller rate", "Nothing — dropout is off, because training already divided by 0.8", "They are divided by 0.8 to compensate for the missing noise"], "hint": "The word inverted tells you at which phase the rescaling was already done.", "explanation": "Inverted dropout multiplies the surviving activations by 1/(1-p) during training, so the expected activation already matches the no-dropout case. At inference you simply disable dropout and change nothing else, which keeps predictions deterministic. The original formulation instead scaled by (1-p) at test time, but every modern framework uses the inverted version, which is why switching the model to eval mode is all you need.", "whyWrong": ["That is the original non-inverted scheme, which current frameworks no longer implement.", "Dropout noise is removed entirely at inference; predictions should not be random.", "Dividing again would inflate the activations by another factor of 1/0.8 on top of the training-time scaling."]}, "he": {"q": "עם dropout הפוך (inverted) סטנדרטי בקצב p = 0.2, מה קורה לאקטיבציות בזמן הבדיקה?", "options": ["הן מוכפלות ב-0.8 כדי להתאים לסקאלה הצפויה של זמן האימון", "יחידות עדיין מושמטות, אך בקצב נמוך בהרבה", "כלום — ה-dropout כבוי, כי באימון כבר חילקו ב-0.8", "הן מחולקות ב-0.8 כדי לפצות על הרעש החסר"], "hint": "המילה הפוך (inverted) מרמזת באיזה שלב כבר בוצע התיקון לסקאלה.", "explanation": "dropout הפוך מכפיל את האקטיבציות ששרדו ב-1/(1-p) במהלך האימון, ולכן התוחלת של האקטיבציה כבר תואמת למצב ללא dropout. בזמן היסק פשוט מכבים את ה-dropout ולא משנים דבר נוסף, וכך התחזיות נשארות דטרמיניסטיות. הניסוח המקורי דווקא הכפיל ב-(1-p) בזמן הבדיקה, אבל כל ספרייה מודרנית משתמשת בגרסה ההפוכה, ולכן די להעביר את המודל למצב eval.", "whyWrong": ["זו השיטה המקורית הלא-הפוכה, שספריות של היום כבר אינן מממשות.", "רעש ה-dropout מוסר לחלוטין בזמן היסק; התחזיות לא אמורות להיות אקראיות.", "חלוקה נוספת הייתה מנפחת את האקטיבציות בעוד פקטור של 1/0.8 מעל התיקון שנעשה באימון."]}}, {"id": "dlf-015", "area": "dl-fundamentals", "topic": "residual-connections", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["residual", "depth", "gradient-flow"], "answer": 0, "en": {"q": "Why do residual connections make very deep networks so much easier to optimize?", "options": ["The identity path adds a 1 to the local Jacobian, so gradients survive depth", "They reduce the parameter count, so there is simply less to overfit", "They force each block to learn an orthogonal transformation of its input", "They replace matrix products by additions, which are cheaper to differentiate"], "hint": "Differentiate y = x + F(x) with respect to x and look at what the backward pass gets multiplied by.", "explanation": "For y = x + F(x) we get dy/dx = I + dF/dx, so the backward signal has a route that is not multiplied down by the block's weights. A product of many such terms stays near 1 instead of decaying geometrically, which is what lets 100-layer stacks train. A useful reframing: each block only has to learn a correction to the identity, which is an easier function to represent than the full mapping.", "whyWrong": ["A skip connection adds no parameters, and it removes none either.", "Nothing in y = x + F(x) constrains F to be orthogonal or even well conditioned.", "The block's matrix multiplications are all still there; only a skip path is added around them."]}, "he": {"q": "מדוע חיבורי שארית (residual connections) מקלים כל כך על אופטימיזציה של רשתות עמוקות מאוד?", "options": ["מסלול הזהות מוסיף 1 ליעקוביאן המקומי, ולכן הגרדיאנטים שורדים את העומק", "הם מקטינים את מספר הפרמטרים, ולכן יש פחות מה להתאים יתר על המידה", "הם מכריחים כל בלוק ללמוד טרנספורמציה אורתוגונלית של הקלט שלו", "הם מחליפים מכפלות מטריצות בחיבורים, שזול יותר לגזור אותם"], "hint": "גזרו את y = x + F(x) לפי x ובדקו במה מוכפל המעבר אחורה.", "explanation": "עבור y = x + F(x) מתקיים dy/dx = I + dF/dx, ולכן לאות החוזר יש מסלול שאינו מוכפל ומוקטן על ידי משקלי הבלוק. מכפלה של הרבה איברים כאלה נשארת קרובה ל-1 במקום לדעוך גיאומטרית, וזה מה שמאפשר לאמן מחסניות של יותר מ-100 שכבות. ניסוח מועיל נוסף: כל בלוק צריך ללמוד רק תיקון לזהות, וזו פונקציה קלה יותר לייצוג מאשר ההעתקה המלאה.", "whyWrong": ["חיבור דילוג אינו מוסיף פרמטרים, אך גם אינו מסיר אף אחד.", "שום דבר ב-y = x + F(x) אינו מאלץ את F להיות אורתוגונלית או אפילו מותנית היטב.", "מכפלות המטריצות של הבלוק עדיין שם; רק נוסף סביבן מסלול דילוג."]}}, {"id": "dlf-016", "area": "dl-fundamentals", "topic": "regularization", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["l1", "l2", "sparsity"], "answer": 3, "en": {"q": "Why does L1 regularization drive weights to exactly zero while L2 only shrinks them?", "options": ["L1 is applied before the optimizer step while L2 is applied after it", "L1 uses a smaller effective coefficient, so its updates overshoot past zero", "L2 has no gradient at all near zero, so weights drift freely in that region", "L1's gradient has constant magnitude, so it keeps pushing even at tiny weights"], "hint": "Differentiate lambda*|w| and lambda*w^2 and compare the two at w = 0.001.", "explanation": "The gradient of lambda*|w| is lambda*sign(w) — the same size whether w is 0.5 or 0.001 — so small weights are pushed all the way to zero and pinned there. The gradient of lambda*w^2 is 2*lambda*w, which vanishes as w shrinks, so L2 approaches zero only asymptotically. That is why L1 yields sparse solutions and doubles as feature selection.", "whyWrong": ["Ordering inside the update step is an implementation detail, not the source of sparsity.", "The effect holds at any coefficient value; it comes from the shape of the penalty, not its size.", "L2's gradient 2*lambda*w exists everywhere; it merely becomes small near zero."]}, "he": {"q": "מדוע רגולריזציית L1 דוחפת משקלים לאפס מדויק בעוד L2 רק מכווצת אותם?", "options": ["L1 מוחלת לפני צעד האופטימייזר ואילו L2 אחריו", "ל-L1 מקדם אפקטיבי קטן יותר, ולכן העדכונים שלה חוצים את האפס", "ל-L2 אין גרדיאנט כלל ליד אפס, ולכן המשקלים נודדים שם בחופשיות", "לגרדיאנט של L1 יש גודל קבוע, ולכן הוא ממשיך לדחוף גם במשקלים זעירים"], "hint": "גזרו את lambda*|w| ואת lambda*w^2 והשוו ביניהם עבור w = 0.001.", "explanation": "הגרדיאנט של lambda*|w| הוא lambda*sign(w) — אותו גודל בין אם w שווה 0.5 או 0.001 — ולכן משקלים קטנים נדחפים עד לאפס ונשארים מקובעים שם. הגרדיאנט של lambda*w^2 הוא 2*lambda*w, שדועך יחד עם w, ולכן L2 מתקרבת לאפס רק אסימפטוטית. זו הסיבה ש-L1 מייצרת פתרונות דלילים ומשמשת גם כבחירת פיצ'רים.", "whyWrong": ["סדר הפעולות בתוך צעד העדכון הוא פרט מימוש ואינו מקור הדלילות.", "התופעה מתקיימת בכל ערך מקדם; היא נובעת מצורת העונש ולא מגודלו.", "הגרדיאנט של L2, שהוא 2*lambda*w, קיים בכל מקום; הוא פשוט קטן ליד אפס."]}}, {"id": "dlf-017", "area": "dl-fundamentals", "topic": "label-smoothing", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["label-smoothing", "calibration", "cross-entropy"], "answer": 2, "en": {"q": "Label smoothing with eps = 0.1 over 10 classes makes the target 0.91 for the true class and 0.01 for each of the other nine. What does that buy you?", "options": ["It reduces the number of parameters needed to fit the training labels", "It makes training provably robust to a mislabeled 1% of the dataset", "It stops logits from diverging and usually improves calibration", "It speeds convergence by enlarging the gradient at the correct class"], "hint": "Where is the minimum of cross-entropy when the target is exactly 1 versus 0.91?", "explanation": "With a hard target, cross-entropy is minimized only as the correct logit runs off toward infinity, which produces overconfident and badly calibrated models. A smoothed target has a finite optimum — a fixed gap between the correct logit and the rest — so the network stops inflating its margins. The known trade-off is that it compresses the class clusters and can hurt when that model is later used as a distillation teacher.", "whyWrong": ["Smoothing changes the targets, not the capacity of the model.", "It does temper label noise somewhat, but eps is not an estimate of the noise rate and nothing is proven.", "Near the optimum the gradient at the correct class becomes smaller, not larger."]}, "he": {"q": "החלקת תוויות (label smoothing) עם eps = 0.1 על 10 מחלקות הופכת את היעד ל-0.91 עבור המחלקה הנכונה ו-0.01 לכל אחת מהתשע האחרות. מה זה נותן?", "options": ["מקטין את מספר הפרמטרים הנדרש כדי להתאים לתוויות האימון", "הופך את האימון לחסין באופן מוכח ל-1% תוויות שגויות בנתונים", "מונע מה-logits להתבדר ובדרך כלל משפר את הכיול (calibration)", "מאיץ את ההתכנסות על ידי הגדלת הגרדיאנט במחלקה הנכונה"], "hint": "היכן נמצא המינימום של cross-entropy כשהיעד הוא בדיוק 1 לעומת 0.91?", "explanation": "עם יעד קשיח, ה-cross-entropy ממוזער רק כאשר ה-logit של המחלקה הנכונה שואף לאינסוף, ומכאן מודלים בטוחים מדי בעצמם ומכוילים גרוע. ליעד מוחלק יש מינימום סופי — פער קבוע בין ה-logit הנכון לשאר — ולכן הרשת מפסיקה לנפח את המרווחים. הפשרה הידועה היא שההחלקה מכווצת את אשכולות המחלקות ועלולה להזיק כשמשתמשים במודל כמורה בזיקוק ידע (distillation).", "whyWrong": ["ההחלקה משנה את התוויות, לא את הקיבולת של המודל.", "היא אמנם ממתנת רעש בתוויות, אבל eps אינו הערכה של שיעור הרעש ואין כאן שום הוכחה.", "ליד האופטימום הגרדיאנט במחלקה הנכונה נעשה קטן יותר, לא גדול יותר."]}}, {"id": "dlf-018", "area": "dl-fundamentals", "topic": "loss-functions", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["cross-entropy", "mse", "classification"], "answer": 1, "en": {"q": "Why is cross-entropy preferred over MSE on top of a softmax classifier?", "options": ["MSE is undefined for one-hot targets once there are more than two classes", "With softmax, cross-entropy's gradient is just (p - y), with no saturating factor", "MSE is not a proper scoring rule, so its minimizer is not the true probability", "Cross-entropy is convex in the network weights while MSE is not"], "hint": "Compute the gradient with respect to the logits for a confidently wrong prediction under each loss.", "explanation": "Softmax combined with cross-entropy gives dL/dlogits = p - y, so a confidently wrong prediction produces a gradient of magnitude close to 1. Pair softmax with MSE and the gradient picks up an extra softmax-derivative factor that goes to zero exactly when the model is confidently wrong, so those examples stop contributing. That saturation, not any definitional problem, is the practical killer.", "whyWrong": ["Squared error against a one-hot vector is perfectly well defined for any number of classes.", "Squared error is in fact a proper scoring rule — it is the Brier score.", "Neither loss is convex in the weights of a nonlinear network; convexity holds only in the logits."]}, "he": {"q": "מדוע מעדיפים cross-entropy על פני MSE מעל מסווג softmax?", "options": ["MSE אינו מוגדר עבור יעדי one-hot כשיש יותר משתי מחלקות", "עם softmax, הגרדיאנט של cross-entropy הוא פשוט (p - y), בלי גורם שנרווה", "MSE אינו כלל ניקוד תקין (proper scoring rule), ולכן המזעור שלו אינו ההסתברות האמיתית", "cross-entropy קמור במשקלי הרשת ואילו MSE אינו"], "hint": "חשבו את הגרדיאנט לפי ה-logits עבור תחזית שגויה ובטוחה בעצמה, תחת כל אחת מפונקציות ההפסד.", "explanation": "שילוב של softmax עם cross-entropy נותן dL/dlogits = p - y, ולכן תחזית שגויה ובטוחה בעצמה מייצרת גרדיאנט בגודל קרוב ל-1. לעומת זאת, שילוב softmax עם MSE מוסיף גורם של נגזרת ה-softmax ששואף לאפס בדיוק כשהמודל טועה בביטחון, ולכן הדוגמאות האלה מפסיקות לתרום. הרוויה הזו, ולא בעיה הגדרתית כלשהי, היא הכשל המעשי.", "whyWrong": ["שגיאה ריבועית מול וקטור one-hot מוגדרת היטב לכל מספר מחלקות.", "שגיאה ריבועית היא למעשה כלל ניקוד תקין — זהו ציון Brier.", "אף אחת מפונקציות ההפסד אינה קמורה במשקלים של רשת לא לינארית; הקמירות מתקיימת רק ב-logits."]}}, {"id": "dlf-019", "area": "dl-fundamentals", "topic": "focal-loss", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["focal-loss", "imbalance", "loss-functions"], "answer": 0, "en": {"q": "Focal loss multiplies cross-entropy by (1 - p_t)^gamma, where p_t is the probability given to the true class. What does raising gamma do?", "options": ["Down-weights already well-classified examples more aggressively", "Increases the loss on every example by the same constant factor", "Rebalances the classes according to their inverse frequency", "Sharpens the softmax so predicted probabilities become more extreme"], "hint": "Plug p_t = 0.99 and p_t = 0.2 into the modulating factor for gamma = 0 and gamma = 2.", "explanation": "The factor (1 - p_t)^gamma is near 0 for easy examples and near 1 for hard ones, and larger gamma widens that gap — at gamma = 2, an example with p_t = 0.9 has its loss cut by a factor of 100. It was designed for dense detection, where a flood of easy background anchors otherwise drowns out the rare foreground. The separate alpha term handles class frequency; gamma handles example difficulty.", "whyWrong": ["The factor depends on p_t, so it is anything but constant across examples.", "That is the role of the alpha weighting; gamma is about difficulty, not frequency.", "Focal loss reweights the loss terms and never touches the softmax itself."]}, "he": {"q": "focal loss מכפילה את ה-cross-entropy ב-(1 - p_t)^gamma, כאשר p_t היא ההסתברות שניתנה למחלקה הנכונה. מה עושה הגדלת gamma?", "options": ["מורידה במשקל, בצורה אגרסיבית יותר, דוגמאות שכבר מסווגות היטב", "מגדילה את ה-loss של כל דוגמה באותו פקטור קבוע", "מאזנת את המחלקות לפי השכיחות ההפוכה שלהן", "מחדדת את ה-softmax כך שההסתברויות החזויות נעשות קיצוניות יותר"], "hint": "הציבו p_t = 0.99 ו-p_t = 0.2 בגורם המווסת עבור gamma = 0 ועבור gamma = 2.", "explanation": "הגורם (1 - p_t)^gamma קרוב ל-0 עבור דוגמאות קלות וקרוב ל-1 עבור קשות, ו-gamma גדול יותר מרחיב את הפער — ב-gamma = 2, דוגמה עם p_t = 0.9 מקבלת loss קטן פי 100. הפונקציה תוכננה לזיהוי עצמים צפוף, שבו שיטפון של עוגני רקע קלים מטביע אחרת את הפריט הנדיר בחזית. איבר ה-alpha הנפרד מטפל בשכיחות המחלקות; gamma מטפל ברמת הקושי של הדוגמה.", "whyWrong": ["הגורם תלוי ב-p_t, ולכן הוא רחוק מלהיות קבוע בין דוגמאות.", "זה תפקידו של שקלול ה-alpha; gamma עוסק בקושי ולא בשכיחות.", "focal loss משנה את משקלי איברי ה-loss ואינה נוגעת ב-softmax עצמו."]}}, {"id": "dlf-020", "area": "dl-fundamentals", "topic": "softmax-temperature", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["softmax", "temperature", "entropy"], "answer": 3, "en": {"q": "You divide the logits by a temperature T before applying softmax. What happens to the output distribution as T grows large?", "options": ["It concentrates all its mass on the argmax class", "It is unchanged, because softmax is shift invariant", "Its entropy first rises and then collapses to zero", "It flattens toward the uniform distribution"], "hint": "What happens to the gaps between logits when you divide them all by 100?", "explanation": "Dividing by T shrinks the gaps between logits, so as T goes to infinity all logits tend to the same value and softmax approaches the uniform distribution; as T goes to 0 the gaps blow up and the output approaches a one-hot at the argmax. Note that softmax is invariant to adding a constant to all logits, not to scaling them — that shift invariance is exactly what makes the log-sum-exp trick of subtracting the max safe.", "whyWrong": ["That is the T approaching 0 limit, which is the opposite end of the range.", "Shift invariance concerns adding a constant; dividing rescales the gaps and does change the output.", "Entropy increases monotonically with T and does not collapse afterwards."]}, "he": {"q": "אתם מחלקים את ה-logits בטמפרטורה T לפני הפעלת softmax. מה קורה להתפלגות הפלט כאשר T גדל מאוד?", "options": ["היא מרכזת את כל המסה שלה במחלקת ה-argmax", "היא אינה משתנה, כי softmax חסין להזזה", "האנטרופיה שלה עולה תחילה ואז קורסת לאפס", "היא משתטחת לכיוון ההתפלגות האחידה"], "hint": "מה קורה לפערים בין ה-logits כשמחלקים את כולם ב-100?", "explanation": "החלוקה ב-T מכווצת את הפערים בין ה-logits, ולכן כאשר T שואף לאינסוף כל ה-logits שואפים לאותו ערך וה-softmax מתקרב להתפלגות האחידה; כאשר T שואף ל-0 הפערים מתפוצצים והפלט מתקרב ל-one-hot ב-argmax. שימו לב ש-softmax חסין להוספת קבוע לכל ה-logits, ולא לשינוי סקאלה — וחסינות ההזזה הזו היא בדיוק מה שמאפשר לחסר את המקסימום בטריק log-sum-exp בבטחה.", "whyWrong": ["זהו הגבול שבו T שואף ל-0, כלומר הקצה ההפוך של הטווח.", "חסינות להזזה עוסקת בהוספת קבוע; חלוקה משנה את הפערים ולכן כן משנה את הפלט.", "האנטרופיה עולה מונוטונית עם T ואינה קורסת לאחר מכן."]}}, {"id": "dlf-021", "area": "dl-fundamentals", "topic": "gradient-clipping", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["gradient-clipping", "exploding-gradients", "stability"], "answer": 2, "en": {"q": "Global-norm gradient clipping with threshold c is applied to a gradient whose norm happens to be 5c. What does it do?", "options": ["Clamps each coordinate of the gradient into the range [-c, c]", "Skips the update for this step and resets the optimizer state", "Scales the whole gradient vector by 1/5, keeping its direction", "Replaces this gradient with the one from the previous step"], "hint": "The name says global norm, not per-coordinate value.", "explanation": "Clip-by-global-norm rescales g to g * c / ||g|| whenever ||g|| exceeds c, so the update direction is preserved exactly and only the step length is capped. The other common variant, clip-by-value, clamps each coordinate independently and therefore does distort the direction, which is generally worse for language models. It is the standard defence against loss spikes caused by rare exploding-gradient batches.", "whyWrong": ["That is clip-by-value, a different operation that changes the update direction.", "Skipping updates on large-gradient steps is a separate heuristic, not what clipping does.", "Reusing a stale gradient is not part of any standard clipping rule."]}, "he": {"q": "גזירת גרדיאנטים לפי נורמה גלובלית עם סף c מופעלת על גרדיאנט שהנורמה שלו היא 5c. מה היא עושה?", "options": ["חוסמת כל קואורדינטה של הגרדיאנט לתחום [-c, c]", "מדלגת על העדכון בצעד הזה ומאפסת את מצב האופטימייזר", "מכפילה את כל וקטור הגרדיאנט ב-1/5, ושומרת על הכיוון", "מחליפה את הגרדיאנט הזה בגרדיאנט מהצעד הקודם"], "hint": "השם מדבר על נורמה גלובלית, לא על ערך לכל קואורדינטה.", "explanation": "גזירה לפי נורמה גלובלית ממירה את g ל-g * c / ||g|| בכל פעם ש-||g|| עובר את c, כך שכיוון העדכון נשמר בדיוק ורק אורך הצעד נחסם. הגרסה הנפוצה האחרת, גזירה לפי ערך, חוסמת כל קואורדינטה בנפרד ולכן כן מעוותת את הכיוון, ובדרך כלל היא גרועה יותר עבור מודלי שפה. זו ההגנה הסטנדרטית מפני קפיצות ב-loss שנגרמות מ-batch נדיר עם גרדיאנט מתפוצץ.", "whyWrong": ["זו גזירה לפי ערך, פעולה אחרת שכן משנה את כיוון העדכון.", "דילוג על עדכונים בצעדים עם גרדיאנט גדול הוא היוריסטיקה נפרדת ואינו מה שהגזירה עושה.", "שימוש חוזר בגרדיאנט ישן אינו חלק מאף כלל גזירה סטנדרטי."]}}, {"id": "dlf-022", "area": "dl-fundamentals", "topic": "mixed-precision", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["bf16", "fp16", "mixed-precision"], "answer": 1, "en": {"q": "Why is bf16 usually preferred over fp16 for training large models?", "options": ["bf16 has more mantissa bits, so gradient accumulations stay more accurate", "bf16 keeps fp32's 8 exponent bits, so it rarely needs loss scaling", "bf16 is stored in 8 bits, halving memory traffic compared with fp16", "bf16 supports denormal numbers in hardware while fp16 flushes them to zero"], "hint": "Both formats are 16 bits. The interesting question is how they split those bits.", "explanation": "bf16 and fp16 are both 16 bits wide, but bf16 spends 8 of them on the exponent, matching fp32's dynamic range, and only 7 on the mantissa, while fp16 has 5 exponent and 10 mantissa bits. Small gradients that underflow to zero in fp16 — the reason fp16 training needs loss scaling — stay representable in bf16. You pay in precision, which is why master weights, reductions and optimizer state are still kept in fp32.", "whyWrong": ["bf16 has fewer mantissa bits than fp16 (7 versus 10); dynamic range is what it gains.", "Both formats occupy exactly 16 bits, so memory traffic is identical.", "Denormal handling is an implementation detail here; the decisive property is exponent range."]}, "he": {"q": "מדוע בדרך כלל מעדיפים bf16 על פני fp16 לאימון מודלים גדולים?", "options": ["ל-bf16 יש יותר ביטים של מנטיסה, ולכן צבירת גרדיאנטים מדויקת יותר", "bf16 שומר על 8 ביטי המעריך (exponent) של fp32, ולכן כמעט לא נדרש loss scaling", "bf16 נשמר ב-8 ביטים, וכך חוצה את תעבורת הזיכרון לעומת fp16", "bf16 תומך במספרים תת-נורמליים בחומרה בעוד fp16 מאפס אותם"], "hint": "שני הפורמטים הם בני 16 ביט. השאלה המעניינת היא איך הם מחלקים את הביטים האלה.", "explanation": "גם bf16 וגם fp16 הם ברוחב 16 ביט, אבל bf16 מקצה 8 מהם למעריך, בדיוק כמו הטווח הדינמי של fp32, ורק 7 למנטיסה, בעוד ל-fp16 יש 5 ביטי מעריך ו-10 ביטי מנטיסה. גרדיאנטים קטנים שגולשים מטה לאפס ב-fp16 — הסיבה שאימון ב-fp16 דורש loss scaling — נשארים ניתנים לייצוג ב-bf16. המחיר הוא דיוק, ולכן משקלי המאסטר, פעולות הצבירה ומצב האופטימייזר עדיין נשמרים ב-fp32.", "whyWrong": ["ל-bf16 יש פחות ביטי מנטיסה מ-fp16 (7 מול 10); מה שהוא מרוויח הוא טווח דינמי.", "שני הפורמטים תופסים בדיוק 16 ביט, ולכן תעבורת הזיכרון זהה.", "טיפול במספרים תת-נורמליים הוא פרט מימוש כאן; התכונה המכריעה היא טווח המעריך."]}}, {"id": "dlf-023", "area": "dl-fundamentals", "topic": "gradient-accumulation", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["gradient-accumulation", "batch-norm", "large-batch"], "answer": 3, "en": {"q": "You replace one batch of 32 with 4 accumulated micro-batches of 8, averaging the losses correctly. Compared with the true batch of 32, what still differs?", "options": ["The optimizer now takes four times as many steps per epoch", "The accumulated gradient ends up four times larger before the step", "Dropout masks are now shared across the four micro-batches", "Batch norm normalizes using statistics from 8 samples, not 32"], "hint": "Accumulation is exact only when the loss decomposes into independent per-example terms.", "explanation": "Gradient accumulation reproduces a large-batch gradient exactly only when the loss is a sum of independent per-example terms. Batch norm violates that: each micro-batch is normalized by its own mean and variance, so the forward pass — and therefore the gradient — is not the one a real batch of 32 would produce. Layer norm and RMSNorm are per-example and accumulate faithfully, which is one more reason transformers tolerate accumulation so well.", "whyWrong": ["The optimizer steps once per accumulation cycle, so the number of steps per epoch is unchanged.", "Averaging the losses correctly is exactly what keeps the accumulated magnitude right.", "Each micro-batch samples its own dropout mask, just as each example would inside a big batch."]}, "he": {"q": "אתם מחליפים batch אחד של 32 בארבעה מיקרו-batch של 8 עם צבירת גרדיאנטים, וממצעים את ה-loss נכון. מה עדיין שונה לעומת batch אמיתי של 32?", "options": ["האופטימייזר מבצע כעת פי ארבעה יותר צעדים בכל אפוק", "הגרדיאנט הצבור יוצא גדול פי ארבעה לפני הצעד", "מסכות ה-dropout משותפות כעת לארבעת המיקרו-batch", "batch norm מנרמל לפי סטטיסטיקות של 8 דגימות ולא של 32"], "hint": "צבירה היא מדויקת רק כאשר ה-loss מתפרק לסכום של איברים בלתי תלויים לכל דוגמה.", "explanation": "צבירת גרדיאנטים משחזרת גרדיאנט של batch גדול במדויק רק כאשר ה-loss הוא סכום של איברים בלתי תלויים לכל דוגמה. batch norm מפר את התנאי הזה: כל מיקרו-batch מנורמל לפי הממוצע והשונות של עצמו, ולכן המעבר קדימה — ואיתו הגרדיאנט — אינו זה שהיה מתקבל מ-batch אמיתי של 32. layer norm ו-RMSNorm פועלים לכל דוגמה בנפרד ולכן נצברים בנאמנות, וזו עוד סיבה שטרנספורמרים סובלניים כל כך לצבירה.", "whyWrong": ["האופטימייזר מבצע צעד אחד לכל מחזור צבירה, ולכן מספר הצעדים באפוק אינו משתנה.", "מיצוע נכון של ה-loss הוא בדיוק מה ששומר על גודל הגרדיאנט הצבור.", "כל מיקרו-batch מגריל מסכת dropout משלו, בדיוק כפי שכל דוגמה הייתה מקבלת בתוך batch גדול."]}}, {"id": "dlf-024", "area": "dl-fundamentals", "topic": "double-descent", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["double-descent", "overparameterization", "bias-variance"], "en": {"q": "Describe the double descent phenomenon and explain what it implies for the classical bias-variance picture.", "hint": "Think about what the model is forced to do exactly at the point where it can just barely fit the training set.", "modelAnswer": "Classical theory predicts a U-shaped test error as a function of capacity: too little capacity underfits, too much overfits. Double descent says the curve has a second descent — test error rises to a sharp peak at the interpolation threshold, the capacity at which the model can just barely fit the training set exactly, and then falls again as capacity keeps growing, often ending below the classical sweet spot. The usual explanation is that at the threshold essentially one interpolating solution exists and it is forced to be wild and high-norm, whereas deep in the overparameterized regime many interpolating solutions exist and the optimizer's implicit bias selects a smooth, low-norm one. The same shape shows up along other axes: epoch-wise double descent as training time grows, and sample-wise, where adding data can transiently hurt near the threshold. The practical implication is that the rule bigger models overfit is not reliable — the classical U-curve describes only the underparameterized regime, and explicit regularization can flatten the peak away entirely.", "rubric": ["Describes the classical U-curve followed by a peak and then a second descent in test error.", "Locates the peak at the interpolation threshold, where capacity just suffices to fit the training data exactly.", "Explains the overparameterized regime via many interpolating solutions plus implicit regularization toward low-norm or smooth ones.", "Mentions at least one other axis along which it appears: epochs or number of training samples.", "Draws the implication that more capacity does not automatically mean more overfitting."]}, "he": {"q": "תארו את תופעת הירידה הכפולה (double descent) והסבירו מה היא אומרת על התמונה הקלאסית של הטיה מול שונות (bias-variance).", "hint": "חשבו מה המודל נאלץ לעשות בדיוק בנקודה שבה הוא בקושי מסוגל להתאים את סט האימון.", "modelAnswer": "התיאוריה הקלאסית מנבאת שגיאת בדיקה בצורת U כפונקציה של הקיבולת: קיבולת נמוכה מדי מביאה לתת-התאמה (underfitting) וגבוהה מדי להתאמת יתר (overfitting). ירידה כפולה אומרת שלעקומה יש ירידה שנייה — שגיאת הבדיקה עולה לשיא חד בסף האינטרפולציה, כלומר בקיבולת שבה המודל בקושי מצליח להתאים את סט האימון בדיוק, ואז יורדת שוב ככל שהקיבולת ממשיכה לגדול, ולעיתים קרובות מסתיימת מתחת לנקודת האופטימום הקלאסית. ההסבר המקובל הוא שבסף קיים בעצם פתרון מאינטרפולציה אחד בלבד והוא נאלץ להיות פרוע ובעל נורמה גבוהה, ואילו עמוק באזור העל-פרמטרי קיימים פתרונות מאינטרפולציה רבים וההטיה המשתמעת של האופטימייזר בוחרת פתרון חלק בעל נורמה נמוכה. אותה צורה מופיעה גם בצירים אחרים: ירידה כפולה לפי מספר האפוקים, ולפי מספר הדגימות, שבה הוספת נתונים עלולה להזיק זמנית ליד הסף. המסקנה המעשית היא שהכלל מודלים גדולים יותר עושים overfit אינו אמין — עקומת ה-U הקלאסית מתארת רק את האזור התת-פרמטרי, ורגולריזציה מפורשת יכולה להשטיח את השיא לגמרי.", "rubric": ["מתאר את עקומת ה-U הקלאסית ואחריה שיא ואז ירידה שנייה בשגיאת הבדיקה.", "ממקם את השיא בסף האינטרפולציה, שבו הקיבולת בדיוק מספיקה להתאמה מדויקת של נתוני האימון.", "מסביר את האזור העל-פרמטרי באמצעות ריבוי פתרונות מאינטרפולציה והטיה משתמעת לכיוון פתרון חלק בעל נורמה נמוכה.", "מזכיר לפחות ציר נוסף אחד שבו התופעה מופיעה: מספר אפוקים או מספר דגימות אימון.", "מסיק שהגדלת קיבולת אינה מובילה אוטומטית ליותר התאמת יתר."]}}, {"id": "dlf-025", "area": "dl-fundamentals", "topic": "learning-curves", "difficulty": 2, "type": "open", "hardnessSource": "trap", "tags": ["overfitting", "early-stopping", "diagnosis"], "en": {"q": "Training loss keeps dropping while validation loss bottomed out ten epochs ago and is now climbing. Walk through your diagnosis and the first three things you would try.", "hint": "Name the regime first, then separate fixes that add data from fixes that reduce effective capacity — and check accuracy, not only loss.", "modelAnswer": "A widening train-validation gap with validation loss actively rising is textbook overfitting: the model has enough capacity to memorize the training set and is now fitting noise. First I would confirm the gap is real — no leakage, no distribution shift between the splits — and note the epoch of the validation minimum, since restoring that checkpoint via early stopping is the free immediate fix. Then I would reduce effective capacity or add data: stronger augmentation or more labelled data, more weight decay or dropout, and a smaller or shorter-trained model. Crucially I would plot validation accuracy separately, because loss can rise purely from growing overconfidence on already-correct examples while accuracy stays flat — in that case the problem is calibration, and temperature scaling or label smoothing is the right response rather than shrinking the model. If instead both curves were high and flat, the diagnosis would be underfitting and every fix would be the opposite: more capacity, higher learning rate, longer training, less regularization.", "rubric": ["Names the regime as overfitting based on the diverging train and validation curves.", "Proposes early stopping or restoring the checkpoint at the validation minimum.", "Proposes reducing effective capacity or adding data: augmentation, weight decay, dropout, more data, smaller model.", "Distinguishes rising validation loss with flat accuracy (overconfidence and calibration) from a genuine drop in accuracy.", "Contrasts with the underfitting signature of both curves being high and flat, and its opposite remedies."]}, "he": {"q": "ה-loss על האימון ממשיך לרדת, בעוד ה-loss על הוולידציה הגיע לתחתית לפני עשרה אפוקים וכעת עולה. תארו את האבחון שלכם ואת שלושת הדברים הראשונים שתנסו.", "hint": "קודם כל שיימו את המצב, ואז הפרידו בין פתרונות שמוסיפים נתונים לבין פתרונות שמקטינים קיבולת אפקטיבית — ובדקו גם accuracy ולא רק loss.", "modelAnswer": "פער הולך וגדל בין אימון לוולידציה, כאשר ה-loss על הוולידציה ממש עולה, הוא התאמת יתר (overfitting) קלאסית: למודל יש מספיק קיבולת כדי לשנן את סט האימון והוא כעת מתאים את עצמו לרעש. קודם כל הייתי מוודא שהפער אמיתי — שאין דליפת מידע ואין הסטת התפלגות בין הפיצולים — ומסמן את האפוק שבו הוולידציה הגיעה למינימום, כי שחזור ה-checkpoint הזה באמצעות early stopping הוא הפתרון המיידי והחינמי. אחר כך הייתי מקטין קיבולת אפקטיבית או מוסיף נתונים: אוגמנטציה חזקה יותר או יותר נתונים מתויגים, יותר weight decay או dropout, ומודל קטן יותר או אימון קצר יותר. חשוב במיוחד לצייר בנפרד את ה-accuracy על הוולידציה, כי ה-loss יכול לעלות רק בגלל ביטחון יתר גובר בדוגמאות שכבר נכונות בזמן שה-accuracy נשאר יציב — ואז הבעיה היא כיול, והמענה הנכון הוא temperature scaling או label smoothing ולא הקטנת המודל. אילו שתי העקומות היו גבוהות ושטוחות, האבחנה הייתה תת-התאמה (underfitting) וכל הפתרונות היו הפוכים: יותר קיבולת, קצב למידה גבוה יותר, אימון ארוך יותר ופחות רגולריזציה.", "rubric": ["מזהה את המצב כהתאמת יתר על סמך התבדרות עקומות האימון והוולידציה.", "מציע early stopping או שחזור ה-checkpoint בנקודת המינימום של הוולידציה.", "מציע הקטנת קיבולת אפקטיבית או הוספת נתונים: אוגמנטציה, weight decay, dropout, יותר נתונים, מודל קטן יותר.", "מבחין בין עליית loss עם accuracy יציב (ביטחון יתר וכיול) לבין ירידה אמיתית ב-accuracy.", "משווה לחתימה של תת-התאמה, שבה שתי העקומות גבוהות ושטוחות, ולפתרונות ההפוכים שלה."]}}, {"id": "dlf-026", "area": "dl-fundamentals", "topic": "parameter-count", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["mlp", "parameter-count", "arithmetic"], "answer": 0, "en": {"q": "An MLP maps 10 inputs to a hidden layer of 32, then to a hidden layer of 16, then to 4 outputs, fully connected with a bias on every layer. How many trainable parameters?", "options": ["948", "896", "944", "980"], "hint": "Count each layer as in_features * out_features + out_features, then add the three layers up.", "explanation": "Layer 1 gives 10*32 + 32 = 352, layer 2 gives 32*16 + 16 = 528, and layer 3 gives 16*4 + 4 = 68. The total is 352 + 528 + 68 = 948. The weight matrices contribute 896 of those and the biases only 52, but forgetting that small remainder is the most common slip in an interview.", "whyWrong": ["That is the weight matrices alone — the 52 bias terms (32 + 16 + 4) are missing.", "That drops the 4 biases of the output layer while keeping the hidden ones.", "That is 32 too many; recheck 10*32, 32*16 and 16*4 one layer at a time."]}, "he": {"q": "רשת MLP ממפה 10 קלטים לשכבה חבויה של 32, משם לשכבה חבויה של 16, ומשם ל-4 פלטים, בחיבור מלא ועם bias בכל שכבה. כמה פרמטרים נלמדים יש בה?", "options": ["948", "896", "944", "980"], "hint": "ספרו כל שכבה כ-in_features * out_features + out_features, ואז חברו את שלוש השכבות.", "explanation": "השכבה הראשונה נותנת 10*32 + 32 = 352, השנייה 32*16 + 16 = 528, והשלישית 16*4 + 4 = 68. הסכום הוא 352 + 528 + 68 = 948. מטריצות המשקלים תורמות 896 מתוכם וה-bias רק 52, אבל שכחת השארית הקטנה הזו היא הפספוס הנפוץ ביותר בראיון.", "whyWrong": ["זו התרומה של מטריצות המשקלים בלבד — חסרים 52 איברי bias (32 + 16 + 4).", "כאן הושמטו 4 איברי ה-bias של שכבת הפלט בעוד אלה של השכבות החבויות נספרו.", "זה גדול ב-32 מהנכון; בדקו מחדש את 10*32, 32*16 ו-16*4 שכבה אחר שכבה."]}}, {"id": "arc-001", "area": "architectures", "topic": "conv-output-size", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["cnn", "stride", "padding"], "answer": 0, "en": {"q": "A 32x32 input goes through a conv layer with a 5x5 kernel, stride 2 and padding 1. What is the output spatial size?", "options": ["15x15", "16x16", "14x14", "13x13"], "hint": "Use floor((n + 2p - k)/s) + 1.", "explanation": "floor((32 + 2 - 5)/2) + 1 = floor(29/2) + 1 = 14 + 1 = 15, so the output is 15x15. The floor matters here: 29 is odd, so a stride of 2 simply discards the leftover row and column at the edge.", "whyWrong": ["16x16 assumes stride 2 just halves the input, ignoring the kernel size and the padding.", "14x14 is the result with no padding (p=0); the given padding of 1 buys one extra row and column.", "13x13 drops the +1 that counts the very first kernel position, not just the steps taken."]}, "he": {"q": "קלט בגודל 32x32 עובר בשכבת קונבולוציה עם גרעין 5x5, צעד (stride) 2 וריפוד (padding) 1. מה הגודל המרחבי של הפלט?", "options": ["15x15", "16x16", "14x14", "13x13"], "hint": "השתמשו בנוסחה floor((n + 2p - k)/s) + 1.", "explanation": "floor((32 + 2 - 5)/2) + 1 = floor(29/2) + 1 = 14 + 1 = 15, כלומר הפלט הוא 15x15. העיגול כלפי מטה חשוב כאן: 29 הוא אי-זוגי, ולכן צעד 2 פשוט מוותר על השורה והעמודה שנותרו בקצה.", "whyWrong": ["16x16 מניח שצעד 2 פשוט מחצה את הקלט, בלי להתחשב בגודל הגרעין ובריפוד.", "14x14 הוא התוצאה ללא ריפוד (p=0); הריפוד 1 מוסיף שורה ועמודה.", "13x13 מוותר על ה-+1 שסופר גם את מיקום הגרעין הראשון ולא רק את הצעדים."]}}, {"id": "arc-002", "area": "architectures", "topic": "receptive-field", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["cnn", "dilation", "receptive-field"], "answer": 1, "en": {"q": "A feature map passes through two 3x3 stride-1 convs with dilation 1, then a 3x3 conv with dilation 2. What is the receptive field of one output unit?", "options": ["7x7", "9x9", "11x11", "13x13"], "hint": "A 3x3 kernel with dilation d behaves like a kernel of size 1 + 2d.", "explanation": "Two 3x3 convs give a 5x5 receptive field (3, then 3 + 2). A 3x3 kernel with dilation 2 spans 5 pixels, so it adds 5 - 1 = 4, giving 5 + 4 = 9. With every stride equal to 1 the jump stays 1, so each layer just adds (effective kernel size - 1).", "whyWrong": ["7x7 treats the third layer as an ordinary 3x3 conv and ignores the dilation entirely.", "11x11 counts the dilation twice, as if the kernel spanned 7 pixels instead of 5.", "13x13 would need strides above 1; with stride 1 the receptive field grows additively, not multiplicatively."]}, "he": {"q": "מפת מאפיינים עוברת שתי קונבולוציות 3x3 עם צעד 1 ו-dilation 1, ואז קונבולוציה 3x3 עם dilation 2. מהו שדה הקליטה (receptive field) של יחידת פלט אחת?", "options": ["7x7", "9x9", "11x11", "13x13"], "hint": "גרעין 3x3 עם dilation בגודל d מתנהג כמו גרעין בגודל 1 + 2d.", "explanation": "שתי קונבולוציות 3x3 נותנות שדה קליטה 5x5 (3, ואז 3 + 2). גרעין 3x3 עם dilation 2 פורש 5 פיקסלים, ולכן מוסיף 5 - 1 = 4, כלומר 5 + 4 = 9. כשכל הצעדים הם 1 ה-jump נשאר 1, וכל שכבה פשוט מוסיפה (גודל גרעין אפקטיבי - 1).", "whyWrong": ["7x7 מתייחס לשכבה השלישית כקונבולוציה 3x3 רגילה ומתעלם לגמרי מה-dilation.", "11x11 סופר את ה-dilation פעמיים, כאילו הגרעין פורש 7 פיקסלים במקום 5.", "13x13 היה דורש צעדים גדולים מ-1; עם צעד 1 שדה הקליטה גדל חיבורית ולא כפלית."]}}, {"id": "arc-003", "area": "architectures", "topic": "one-by-one-conv", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["cnn", "channels", "bottleneck"], "answer": 2, "en": {"q": "What is the main thing a 1x1 convolution does in a CNN?", "options": ["It smooths each feature map spatially without changing depth", "It enlarges the receptive field of every layer that follows it", "It mixes information across channels and rescales channel depth", "It normalizes activations per channel before the nonlinearity"], "hint": "Think about what its kernel can see: one pixel, all channels.", "explanation": "A 1x1 conv is a learned linear map along the channel axis applied at each spatial position, so it mixes channels and can shrink or expand depth cheaply. That is exactly what Inception bottlenecks and MobileNet pointwise layers use it for. Its spatial receptive field is a single pixel.", "whyWrong": ["Spatial smoothing needs a kernel that spans more than one pixel; a 1x1 kernel has no spatial neighbours.", "The spatial receptive field does not grow at all, since the kernel covers exactly one position.", "Per-channel normalization is what batch norm does; a 1x1 conv has learned weights that mix channels."]}, "he": {"q": "מה עושה בעיקר קונבולוציית 1x1 ברשת קונבולוציה?", "options": ["מחליקה כל מפת מאפיינים מרחבית בלי לשנות את העומק", "מגדילה את שדה הקליטה של כל השכבות שבאות אחריה", "מערבבת מידע בין ערוצים ומשנה את עומק הערוצים", "מנרמלת אקטיבציות לכל ערוץ לפני הלא-לינאריות"], "hint": "חשבו מה הגרעין רואה: פיקסל אחד, כל הערוצים.", "explanation": "קונבולוציית 1x1 היא העתקה לינארית נלמדת על ציר הערוצים המופעלת בכל מיקום מרחבי, ולכן היא מערבבת ערוצים ויכולה להקטין או להגדיל עומק בזול. בדיוק לשם כך משתמשים בה ה-bottleneck של Inception והשכבות ה-pointwise של MobileNet. שדה הקליטה המרחבי שלה הוא פיקסל בודד.", "whyWrong": ["החלקה מרחבית דורשת גרעין שפורש יותר מפיקסל אחד; לגרעין 1x1 אין שכנים מרחביים.", "שדה הקליטה המרחבי אינו גדל כלל, כי הגרעין מכסה בדיוק מיקום אחד.", "נרמול לכל ערוץ הוא מה שעושה batch norm; לקונבולוציית 1x1 יש משקולות נלמדות שמערבבות ערוצים."]}}, {"id": "arc-004", "area": "architectures", "topic": "depthwise-separable", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["mobilenet", "parameter-count", "cnn"], "answer": 3, "en": {"q": "A depthwise-separable 3x3 conv maps 16 input channels to 32 output channels, with no bias. How many weights does it use in total?", "options": ["4,608", "800", "4,752", "656"], "hint": "Count the depthwise stage and the pointwise stage separately.", "explanation": "Depthwise: one 3x3 filter per input channel, so 3*3*16 = 144. Pointwise: a 1x1 conv from 16 to 32 channels, so 16*32 = 512. Total 144 + 512 = 656, about seven times fewer than the 4,608 of a standard 3x3 conv.", "whyWrong": ["4,608 = 3*3*16*32 is exactly the dense conv this factorization is meant to replace.", "800 applies the depthwise filters to the 32 output channels (3*3*32 + 512); depthwise acts on input channels.", "4,752 adds the depthwise weights on top of a full conv instead of replacing it."]}, "he": {"q": "קונבולוציית 3x3 מסוג depthwise-separable ממפה 16 ערוצי קלט ל-32 ערוצי פלט, ללא bias. בכמה משקולות היא משתמשת בסך הכול?", "options": ["4,608", "800", "4,752", "656"], "hint": "ספרו בנפרד את השלב ה-depthwise ואת השלב ה-pointwise.", "explanation": "depthwise: מסנן 3x3 אחד לכל ערוץ קלט, כלומר 3*3*16 = 144. pointwise: קונבולוציית 1x1 מ-16 ל-32 ערוצים, כלומר 16*32 = 512. סך הכול 144 + 512 = 656, פי שבעה בערך פחות מ-4,608 של קונבולוציה 3x3 רגילה.", "whyWrong": ["4,608 = 3*3*16*32 הוא בדיוק הקונבולוציה הצפופה שהפירוק הזה בא להחליף.", "800 מפעיל את מסנני ה-depthwise על 32 ערוצי הפלט (3*3*32 + 512); ה-depthwise פועל על ערוצי הקלט.", "4,752 מוסיף את משקולות ה-depthwise מעל קונבולוציה מלאה במקום להחליף אותה."]}}, {"id": "arc-005", "area": "architectures", "topic": "equivariance-invariance", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["cnn", "pooling", "invariance"], "answer": 3, "en": {"q": "Convolution is translation-equivariant, not translation-invariant. Which statement follows from that?", "options": ["Max pooling makes a conv layer exactly equivariant to any shift", "Equivariance means the output is unchanged when the input shifts", "Only fully connected layers can be equivariant to translation", "Shifting the input shifts the feature map by the same amount"], "hint": "Ask what happens to the feature map itself, not to the final class score.", "explanation": "Equivariance means: shift the input, and the feature map shifts identically. Invariance, an output that does not change, is produced later by pooling and global pooling, which throw position away. Confusing the two is the classic misconception: convolution preserves where things are, it does not discard location.", "whyWrong": ["Pooling moves toward invariance, and strided pooling is only approximately equivariant because of grid alignment.", "That is the definition of invariance; equivariance means the output transforms the same way the input did.", "A fully connected layer shares no weights across positions, so it is neither equivariant nor invariant by construction."]}, "he": {"q": "קונבולוציה היא שוות-ערך להזזה (translation-equivariant) ולא חסינה להזזה (invariant). מה נובע מכך?", "options": ["max pooling הופך שכבת קונבולוציה לשוות-ערך מדויקת לכל הזזה", "שוויון-ערך פירושו שהפלט אינו משתנה כאשר הקלט מוזז", "רק שכבות fully connected יכולות להיות שוות-ערך להזזה", "הזזה של הקלט מזיזה את מפת המאפיינים באותה מידה בדיוק"], "hint": "שאלו מה קורה למפת המאפיינים עצמה, לא לציון המחלקה הסופי.", "explanation": "שוויון-ערך פירושו: מזיזים את הקלט, ומפת המאפיינים מוזזת באותה מידה. חסינות, כלומר פלט שאינו משתנה, נוצרת רק בהמשך על ידי pooling ו-global pooling שמוותרים על המיקום. הבלבול בין השניים הוא הטעות הקלאסית: קונבולוציה שומרת היכן הדברים נמצאים, היא אינה מוחקת מיקום.", "whyWrong": ["pooling מקדם דווקא חסינות, ו-pooling עם צעד הוא שווה-ערך רק בקירוב בגלל היישור לרשת.", "זו ההגדרה של חסינות; שוויון-ערך פירושו שהפלט עובר את אותה טרנספורמציה כמו הקלט.", "בשכבה fully connected אין שיתוף משקולות בין מיקומים, ולכן היא לא שוות-ערך ולא חסינה מעצם הבנייה."]}}, {"id": "arc-006", "area": "architectures", "topic": "resnet-skip", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["resnet", "residual", "optimization"], "answer": 0, "en": {"q": "What observed problem originally motivated ResNet's skip connections?", "options": ["Deeper plain nets had higher training error than shallower ones", "Deeper plain nets overfit the training set far too aggressively", "Deep nets were unable to represent an identity mapping at all", "Batch norm made deep nets diverge without residual paths"], "hint": "Look at the training curve, not the test curve.", "explanation": "The paper reported a degradation problem: adding layers to a plain net raised training error, so it was an optimization failure, not overfitting. A residual block only has to learn F(x) = H(x) - x, and driving F toward zero recovers the identity, which is easy. Skips also give gradients a short path back.", "whyWrong": ["Overfitting would show up as low training error with high test error; here training error itself got worse.", "A plain net can in principle represent the identity; the trouble is that optimization fails to find it.", "Batch norm already handled convergence, and the degradation was observed in networks that used it."]}, "he": {"q": "איזו בעיה שנצפתה בפועל הניעה במקור את חיבורי הדילוג (skip connections) ב-ResNet?", "options": ["לרשתות רגילות עמוקות יותר הייתה שגיאת אימון גבוהה יותר מלרשתות רדודות", "רשתות רגילות עמוקות סבלו מהתאמת יתר (overfitting) חריפה לסט האימון", "רשתות עמוקות לא הצליחו לייצג כלל העתקת זהות", "batch norm גרם לרשתות עמוקות להתבדר ללא מסלולים שאריתיים"], "hint": "הסתכלו על עקומת האימון, לא על עקומת המבחן.", "explanation": "המאמר דיווח על בעיית ניוון (degradation): הוספת שכבות לרשת רגילה העלתה את שגיאת האימון, ולכן מדובר בכשל אופטימיזציה ולא בהתאמת יתר. בלוק שאריתי צריך ללמוד רק F(x) = H(x) - x, ודחיפת F לאפס משחזרת את הזהות, וזה קל. חיבורי הדילוג גם נותנים לגרדיאנטים מסלול קצר לאחור.", "whyWrong": ["התאמת יתר הייתה מתבטאת בשגיאת אימון נמוכה ושגיאת מבחן גבוהה; כאן שגיאת האימון עצמה החמירה.", "רשת רגילה יכולה בעיקרון לייצג זהות, אבל האופטימיזציה מתקשה למצוא אותה.", "batch norm כבר טיפל בהתכנסות, והניוון נצפה ברשתות שכן השתמשו בו."]}}, {"id": "arc-007", "area": "architectures", "topic": "efficientnet-scaling", "difficulty": 3, "type": "mcq", "hardnessSource": "recall", "tags": ["efficientnet", "scaling", "backbones"], "answer": 1, "en": {"q": "What does EfficientNet's compound scaling actually do?", "options": ["Scales depth first and width second, in separate training stages", "Scales depth, width and input resolution together by a fixed ratio", "Scales resolution only, holding FLOPs constant by pruning channels", "Searches a brand new architecture for each target compute budget"], "hint": "One coefficient, three dimensions.", "explanation": "Compound scaling raises depth, width and resolution simultaneously, with exponents tied to a single coefficient phi, so their ratio stays roughly constant as compute grows. The insight is that these dimensions are not independent: a higher-resolution input needs more layers for receptive field and more channels for the extra detail. The B0 base network came from a separate NAS search done once.", "whyWrong": ["The scaling is simultaneous across all three dimensions, not a sequence of separate stages.", "There is no pruning involved, and FLOPs deliberately grow as the coefficient increases.", "The architecture search was run once to produce B0; the larger variants come from scaling alone."]}, "he": {"q": "מה בעצם עושה ה-compound scaling של EfficientNet?", "options": ["מרחיב קודם עומק ואחר כך רוחב, בשלבי אימון נפרדים", "מרחיב עומק, רוחב ורזולוציית קלט יחד ביחס קבוע", "מרחיב רק את הרזולוציה ושומר על FLOPs קבוע באמצעות pruning של ערוצים", "מחפש ארכיטקטורה חדשה לגמרי לכל תקציב חישוב"], "hint": "מקדם אחד, שלושה ממדים.", "explanation": "compound scaling מגדיל עומק, רוחב ורזולוציה בו-זמנית, עם מעריכים הקשורים למקדם יחיד phi, כך שהיחס ביניהם נשמר בערך כשהחישוב גדל. התובנה היא שהממדים אינם בלתי תלויים: קלט ברזולוציה גבוהה דורש יותר שכבות לשדה קליטה ויותר ערוצים לפרטים הנוספים. רשת הבסיס B0 הגיעה מחיפוש NAS נפרד שנעשה פעם אחת.", "whyWrong": ["ההרחבה נעשית בו-זמנית בכל שלושת הממדים, לא ברצף של שלבים נפרדים.", "אין כאן pruning, וה-FLOPs דווקא גדלים ככל שהמקדם עולה.", "החיפוש הארכיטקטוני רץ פעם אחת כדי לייצר את B0; הווריאנטים הגדולים מתקבלים מהרחבה בלבד."]}}, {"id": "arc-008", "area": "architectures", "topic": "densenet", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["densenet", "feature-reuse", "backbones"], "answer": 2, "en": {"q": "How does a DenseNet block differ from a residual block?", "options": ["It adds the block's input to the output of every internal layer", "It replaces convolutions with 1x1 layers to save parameters", "It concatenates each layer's output onto the features of all earlier layers", "It reuses the same convolution weights across all layers in the block"], "hint": "Summing versus stacking.", "explanation": "DenseNet concatenates along the channel axis, so layer L receives the feature maps of every preceding layer as separate channels, whereas ResNet sums them into a single tensor. Concatenation keeps earlier features distinguishable and encourages reuse, which is why DenseNets can be narrow (a small growth rate) and still parameter-efficient. The cost is channel counts that grow linearly inside a block.", "whyWrong": ["Adding the input to the output is precisely what a residual block does, not the dense variant.", "DenseNet does use 1x1 bottlenecks, but the defining difference is concatenation, not kernel size.", "There is no weight sharing between layers in the block; each layer has its own parameters."]}, "he": {"q": "במה בלוק של DenseNet שונה מבלוק שאריתי (residual)?", "options": ["הוא מחבר את קלט הבלוק לפלט של כל שכבה פנימית", "הוא מחליף קונבולוציות בשכבות 1x1 כדי לחסוך בפרמטרים", "הוא משרשר את פלט כל שכבה למאפיינים של כל השכבות הקודמות", "הוא משתמש שוב באותן משקולות קונבולוציה בכל שכבות הבלוק"], "hint": "חיבור מול הערמה.", "explanation": "DenseNet משרשר (concatenate) על ציר הערוצים, כך ששכבה L מקבלת את מפות המאפיינים של כל השכבות שקדמו לה כערוצים נפרדים, בעוד ש-ResNet מחבר אותן לטנזור אחד. השרשור שומר על מאפיינים מוקדמים ניתנים להבחנה ומעודד שימוש חוזר, ולכן DenseNet יכולה להיות צרה (growth rate קטן) ועדיין חסכונית בפרמטרים. המחיר הוא מספר ערוצים שגדל לינארית בתוך הבלוק.", "whyWrong": ["חיבור הקלט לפלט הוא בדיוק מה שעושה בלוק שאריתי, לא הבלוק הצפוף.", "DenseNet אכן משתמשת ב-bottleneck של 1x1, אך ההבדל המהותי הוא השרשור ולא גודל הגרעין.", "אין שיתוף משקולות בין שכבות הבלוק; לכל שכבה פרמטרים משלה."]}}, {"id": "arc-009", "area": "architectures", "topic": "lstm-gru-gates", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["lstm", "gru", "rnn"], "en": {"q": "An interviewer asks: what problem do LSTM gates solve, and how does a GRU differ?", "hint": "Think about what happens to a gradient multiplied through many time steps.", "modelAnswer": "A vanilla RNN multiplies the same recurrent Jacobian at every step, so gradients shrink or blow up exponentially and long-range dependencies never get learned. An LSTM adds a cell state that is updated mostly additively, with a forget gate deciding what to keep, an input gate deciding what to write, and an output gate deciding what to expose; when the forget gate stays near 1 the gradient flows through the cell almost unattenuated. A GRU merges the cell and hidden state and uses two gates, update and reset, where the update gate does the job of forget and input together. GRUs have fewer parameters and often train faster with broadly similar accuracy, while an LSTM keeps a separate memory that can be gated independently of what it exposes.", "rubric": ["Names vanishing and exploding gradients over long sequences as the underlying problem", "Describes the additive cell state and the roles of the forget, input and output gates", "States that a GRU has update and reset gates and no separate cell state", "Notes the GRU is cheaper in parameters with broadly comparable performance"]}, "he": {"q": "מראיין שואל: איזו בעיה פותרים השערים (gates) ב-LSTM, ובמה GRU שונה?", "hint": "חשבו מה קורה לגרדיאנט שמוכפל לאורך צעדי זמן רבים.", "modelAnswer": "ב-RNN רגיל מוכפל אותו יעקוביאן רקורסיבי בכל צעד, ולכן הגרדיאנטים מתכווצים או מתפוצצים אקספוננציאלית ותלויות ארוכות-טווח כלל אינן נלמדות. ב-LSTM נוסף מצב תא (cell state) שמתעדכן בעיקר בחיבור, כאשר forget gate מחליט מה לשמר, input gate מחליט מה לכתוב ו-output gate מחליט מה לחשוף; כשה-forget gate קרוב ל-1 הגרדיאנט זורם דרך התא כמעט ללא דעיכה. ב-GRU מאוחדים מצב התא והמצב הנסתר ויש שני שערים בלבד, update ו-reset, כאשר ה-update ממלא יחד את תפקידי ה-forget וה-input. ל-GRU פחות פרמטרים והוא לרוב מתאמן מהר יותר בביצועים דומים, בעוד ש-LSTM שומר זיכרון נפרד שאפשר לשלוט בו בנפרד ממה שנחשף החוצה.", "rubric": ["מציין דעיכת והתפוצצות גרדיאנטים לאורך רצפים ארוכים כבעיה הבסיסית", "מתאר את מצב התא החיבורי ואת תפקידי השערים forget, input ו-output", "מציין של-GRU יש שערי update ו-reset ואין בו מצב תא נפרד", "מציין ש-GRU זול יותר בפרמטרים עם ביצועים דומים בגדול"]}}, {"id": "arc-010", "area": "architectures", "topic": "truncated-bptt", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["rnn", "bptt", "training"], "answer": 3, "en": {"q": "You train an RNN with truncated BPTT over chunks of 50 steps, carrying the hidden state across chunks. What is the main consequence?", "options": ["The hidden state cannot carry information beyond 50 steps", "The loss is biased because chunks are not independent samples", "Gradients explode more often than they would with full BPTT", "Dependencies longer than 50 steps receive no gradient signal"], "hint": "Separate the forward pass from the backward pass.", "explanation": "Carrying the hidden state forward means the network can still represent long context; what gets cut is the backward pass, so the model never receives gradient credit for dependencies spanning more than the truncation window. That is the standard confusion here: truncation limits the learning of long-range structure, not forward memory.", "whyWrong": ["The state is passed between chunks, so information does flow forward well past 50 steps.", "Chunk correlation is not the issue; the objective is still the sum of the per-step losses.", "Truncation shortens the product of Jacobians, which makes exploding gradients less likely, not more."]}, "he": {"q": "אתם מאמנים RNN עם truncated BPTT על מקטעים של 50 צעדים, ומעבירים את המצב הנסתר בין המקטעים. מה ההשלכה העיקרית?", "options": ["המצב הנסתר אינו יכול לשאת מידע מעבר ל-50 צעדים", "פונקציית ההפסד מוטה כי המקטעים אינם דגימות בלתי תלויות", "גרדיאנטים מתפוצצים לעיתים קרובות יותר מאשר ב-BPTT מלא", "תלויות ארוכות מ-50 צעדים אינן מקבלות אות גרדיאנט כלל"], "hint": "הפרידו בין המעבר קדימה למעבר אחורה.", "explanation": "העברת המצב הנסתר קדימה פירושה שהרשת עדיין יכולה לייצג הקשר ארוך; מה שנקטע הוא המעבר אחורה, ולכן המודל לעולם אינו מקבל זיכוי גרדיאנט על תלויות שנפרשות מעבר לחלון הקטיעה. זה הבלבול הרגיל כאן: הקטיעה מגבילה את הלמידה של מבנה ארוך-טווח, לא את הזיכרון קדימה.", "whyWrong": ["המצב מועבר בין המקטעים, ולכן מידע אכן זורם קדימה הרבה מעבר ל-50 צעדים.", "המתאם בין מקטעים אינו הבעיה; פונקציית המטרה עדיין סכום ההפסדים לכל צעד.", "הקטיעה מקצרת את מכפלת היעקוביאנים, ולכן היא מקטינה את הסיכוי להתפוצצות ולא מגדילה אותו."]}}, {"id": "arc-011", "area": "architectures", "topic": "scaled-dot-product", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["transformer", "attention", "softmax"], "answer": 0, "en": {"q": "In scaled dot-product attention, why are the QK^T scores divided by sqrt(d_k)?", "options": ["Dot products grow with d_k, pushing softmax into saturated regions", "It makes the attention weights sum to one across the sequence", "It compensates for the number of heads used in the layer", "It keeps the value vectors on the same scale as the queries"], "hint": "Think about the variance of a dot product between two random d_k-dimensional vectors.", "explanation": "If query and key entries are roughly independent with unit variance, their dot product has variance d_k, so scores scale like sqrt(d_k). Large scores make softmax nearly one-hot, and its gradient vanishes there. Dividing by sqrt(d_k) restores unit-scale logits and keeps gradients healthy.", "whyWrong": ["Softmax already normalizes the weights to sum to one, and the scaling does not change that.", "Each head is scaled by its own key dimension; the constant is not a correction for head count.", "Value vectors take no part in computing the scores at all."]}, "he": {"q": "במנגנון scaled dot-product attention, מדוע מחלקים את הציונים QK^T ב-sqrt(d_k)?", "options": ["מכפלות פנימיות גדלות עם d_k ודוחפות את ה-softmax לאזורי רוויה", "זה גורם למשקלי הקשב להסתכם ל-1 לאורך הרצף", "זה מפצה על מספר ה-heads שבשכבה", "זה שומר על וקטורי ה-value באותו סדר גודל כמו ה-queries"], "hint": "חשבו על השונות של מכפלה פנימית בין שני וקטורים אקראיים בממד d_k.", "explanation": "אם רכיבי ה-query וה-key בלתי תלויים בקירוב עם שונות 1, למכפלה הפנימית שלהם שונות d_k, ולכן הציונים בסדר גודל של sqrt(d_k). ציונים גדולים הופכים את ה-softmax לכמעט one-hot, ושם הגרדיאנט שלו מתאפס. החלוקה ב-sqrt(d_k) מחזירה את הלוגיטים לסדר גודל 1 ושומרת על גרדיאנטים בריאים.", "whyWrong": ["ה-softmax כבר מנרמל את המשקלים לסכום 1, והקנה מידה אינו משנה זאת.", "כל head מחולק בממד המפתח שלו; הקבוע אינו תיקון למספר ה-heads.", "וקטורי ה-value אינם משתתפים כלל בחישוב הציונים."]}}, {"id": "arc-012", "area": "architectures", "topic": "attention-complexity", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["transformer", "multi-head", "complexity"], "answer": 1, "en": {"q": "A Transformer layer with 8 heads processes one sequence of 512 tokens using full self-attention. How many attention scores does that layer compute?", "options": ["262,144", "2,097,152", "32,768", "4,194,304"], "hint": "Every head builds its own token-by-token matrix.", "explanation": "Each head produces an n x n score matrix: 512 * 512 = 262,144 entries, and 8 heads give 8 * 262,144 = 2,097,152. This n^2 growth per head is exactly why full attention costs O(n^2 * d) in both time and memory as the sequence gets longer.", "whyWrong": ["262,144 is a single head; the layer runs eight of them in parallel.", "32,768 = 512 * 64 counts one row per head dimension, not a full token-by-token matrix.", "4,194,304 would require 16 heads, but this layer has 8."]}, "he": {"q": "שכבת Transformer עם 8 heads מעבדת רצף אחד של 512 טוקנים בקשב עצמי מלא. כמה ציוני קשב מחשבת השכבה הזו?", "options": ["262,144", "2,097,152", "32,768", "4,194,304"], "hint": "כל head בונה מטריצה משלו בגודל טוקן על טוקן.", "explanation": "כל head מייצר מטריצת ציונים בגודל n x n: 512 * 512 = 262,144 איברים, ו-8 heads נותנים 8 * 262,144 = 2,097,152. הגידול הזה כמו n^2 לכל head הוא בדיוק הסיבה לכך שקשב מלא עולה O(n^2 * d) בזמן ובזיכרון ככל שהרצף מתארך.", "whyWrong": ["262,144 הוא head יחיד; בשכבה פועלים שמונה במקביל.", "32,768 = 512 * 64 סופר שורה אחת לכל ממד של head, ולא מטריצה מלאה של טוקן מול טוקן.", "4,194,304 היה דורש 16 heads, אבל בשכבה הזו יש 8."]}}, {"id": "arc-013", "area": "architectures", "topic": "multi-head-attention", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["transformer", "multi-head", "capacity"], "answer": 2, "en": {"q": "Why use 8 heads of dimension 64 instead of a single head of dimension 512?", "options": ["It multiplies the layer's parameter count by ro
