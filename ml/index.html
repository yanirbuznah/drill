n conditions on the true outcome or ignores it.", "explanation": "Demographic parity constrains only the approval rate P(yhat=1 | group) and says nothing about which people are approved. If the groups genuinely differ in repayment rates, equal approval rates force unequal error rates — typically more false positives in one group and more false negatives in the other. Equalized odds constrains TPR and FPR, equal opportunity constrains TPR only, and calibration is about what a score means.", "whyWrong": ["Equalized odds constrains error rates conditional on the true label, which an approval-rate constraint does not deliver.", "Equal opportunity is parity of true-positive rates; nothing here equalizes false positives.", "Calibration concerns the meaning of the scores, which an approval-rate constraint leaves untouched."]}, "he": {"q": "מלווה כופה שיעור אישורים זהה בין הקבוצות. איזה קריטריון הוגנות מתקיים בכך, ומה עדיין לא מובטח?", "options": ["שוויון דמוגרפי (demographic parity); שוויון בשיעורי השגיאה בין הקבוצות אינו מובטח", "Equalized odds; ומכאן ששוויון דמוגרפי נובע אוטומטית", "שוויון הזדמנויות (equal opportunity); ולכן גם שיעורי ההתראות השגויות שווים", "כיול בתוך כל קבוצה; ולכן ציון אומר עכשיו אותו דבר בכל קבוצה"], "hint": "שאלו האם הקריטריון מתנה בתוצאה האמיתית או מתעלם ממנה.", "explanation": "שוויון דמוגרפי מגביל רק את שיעור האישור P(yhat=1 | קבוצה) ולא אומר דבר על מי מאושר. אם הקבוצות באמת נבדלות בשיעורי ההחזר, שיעורי אישור זהים כופים שיעורי שגיאה שונים — בדרך כלל יותר התראות שגויות בקבוצה אחת ויותר החמצות באחרת. Equalized odds מגביל את TPR ואת FPR, שוויון הזדמנויות מגביל רק את TPR, וכיול עוסק במשמעות של הציון.", "whyWrong": ["Equalized odds מגביל שיעורי שגיאה בהינתן התווית האמיתית, וזה לא מה שאילוץ על שיעור אישורים מספק.", "שוויון הזדמנויות הוא שוויון בשיעורי הזיהוי הנכון; שום דבר כאן לא משווה את ההתראות השגויות.", "כיול עוסק במשמעות הציונים, ואילוץ על שיעור האישורים לא נוגע בה כלל."]}}, {"id": "rai-002", "area": "responsible-ai", "topic": "fairness-impossibility", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["fairness", "impossibility", "calibration"], "answer": 3, "en": {"q": "Two groups have genuinely different base rates of the outcome. Which combination is provably unattainable for any classifier that is not perfect?", "options": ["Demographic parity together with equal accuracy across the groups", "Equal opportunity (equal TPR) together with calibration within each group", "Demographic parity together with equal false-negative rates", "Group-wise calibration together with equal false-positive and false-negative rates"], "hint": "The theorem needs calibration plus BOTH error rates, not just one of them.", "explanation": "This is the Kleinberg-Mullainathan-Raghavan and Chouldechova impossibility result: when base rates differ, calibration within groups and equalized odds (both error rates equal) can hold together only for a perfect classifier. It is a mathematical fact rather than a modelling failure, so fairness work means choosing the criterion that matches the harm you care about and documenting that choice, instead of hoping to satisfy all of them.", "whyWrong": ["Equal accuracy is not one of the criteria in the theorem and can be arranged in several ways.", "Equal opportunity constrains only the true-positive rate, and that single constraint can coexist with calibration.", "Equal false-negative rates is again a single error constraint; the theorem needs both error rates plus calibration."]}, "he": {"q": "לשתי קבוצות יש שיעורי בסיס שונים באמת של התוצאה. איזה שילוב הוא בלתי אפשרי מתמטית עבור כל מסווג שאינו מושלם?", "options": ["שוויון דמוגרפי יחד עם דיוק זהה בין הקבוצות", "שוויון הזדמנויות (שוויון TPR) יחד עם כיול בתוך כל קבוצה", "שוויון דמוגרפי יחד עם שיעורי החמצה (FNR) זהים", "כיול לכל קבוצה יחד עם שיעורי התראות שגויות והחמצות זהים"], "hint": "המשפט דורש כיול ובנוסף את שני שיעורי השגיאה, לא רק אחד מהם.", "explanation": "זהו משפט האי-אפשרות של Kleinberg-Mullainathan-Raghavan ושל Chouldechova: כאשר שיעורי הבסיס שונים, כיול בתוך הקבוצות ו-equalized odds (שני שיעורי השגיאה שווים) יכולים להתקיים יחד רק עבור מסווג מושלם. זו עובדה מתמטית ולא כשל מידול, ולכן עבודת הוגנות פירושה לבחור את הקריטריון שמתאים לנזק שמדאיג אתכם ולתעד את הבחירה, במקום לקוות לקיים את כולם.", "whyWrong": ["דיוק זהה אינו אחד הקריטריונים במשפט, ואפשר להשיג אותו בכמה דרכים.", "שוויון הזדמנויות מגביל רק את שיעור הזיהוי הנכון, ואילוץ בודד כזה יכול להתקיים יחד עם כיול.", "שיעורי החמצה זהים הם שוב אילוץ שגיאה בודד; המשפט דורש את שני שיעורי השגיאה יחד עם כיול."]}}, {"id": "rai-003", "area": "responsible-ai", "topic": "proxy-variables", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["fairness", "proxies", "disparate-impact"], "answer": 1, "en": {"q": "A hiring model excludes gender entirely, yet selects far fewer women. What does this most likely demonstrate?", "options": ["The model is fair by construction, since the protected attribute was removed", "Proxy variables encode the attribute: disparate impact without disparate treatment", "Gender must be added back as a feature for the model to become unbiased", "A pipeline bug, since removing a feature cannot change group-level outcomes"], "hint": "What else on a CV correlates with the attribute you deleted?", "explanation": "'Fairness through unawareness' fails because correlated features — a women's college, a career gap, certain clubs or sports, a ZIP code — reconstruct the protected attribute. Disparate treatment means using the attribute; disparate impact means a disproportionate outcome regardless of intent, and it is the standard most anti-discrimination scrutiny applies. Detecting it requires measuring outcomes by group, so you often need the attribute for auditing even when you may not use it for prediction.", "whyWrong": ["Deleting the attribute prevents explicit use, but not its reconstruction from correlated features.", "Using the attribute directly is one debiasing strategy, but it is legally constrained and not automatic fairness.", "Removing a feature genuinely changes the fit, and the correlated features carry the information anyway."]}, "he": {"q": "מודל גיוס אינו כולל כלל את משתנה המגדר, ובכל זאת בוחר הרבה פחות נשים. מה זה מדגים ככל הנראה?", "options": ["המודל הוגן מעצם הבנייה, שהרי המאפיין המוגן הוסר לגמרי מהפיצ'רים", "משתני פרוקסי מקודדים את המאפיין: השפעה שונה בלי יחס שונה", "צריך להחזיר את המגדר כפיצ'ר כדי שהמודל יהפוך לבלתי מוטה לגמרי", "יש באג בצינור, כי הסרת פיצ'ר לא יכולה לשנות תוצאות ברמת הקבוצה"], "hint": "מה עוד בקורות חיים מתואם עם המאפיין שמחקתם?", "explanation": "'הוגנות באמצעות אי-ידיעה' נכשלת מפני שפיצ'רים מתואמים — מכללה לנשים, פער בקריירה, חוגים או ענפי ספורט מסוימים, מיקוד — משחזרים את המאפיין המוגן. יחס שונה פירושו שימוש במאפיין עצמו; השפעה שונה פירושה תוצאה לא פרופורציונלית ללא קשר לכוונה, וזה הסטנדרט שרוב הבחינה המשפטית מפעילה. כדי לזהות זאת חייבים למדוד תוצאות לפי קבוצה, ולכן לעיתים קרובות דרוש המאפיין לצורכי ביקורת גם כשאסור להשתמש בו לחיזוי.", "whyWrong": ["מחיקת המאפיין מונעת שימוש מפורש בו, אך לא את שחזורו מפיצ'רים מתואמים.", "שימוש ישיר במאפיין הוא אסטרטגיית הפחתת הטיה אחת, אך הוא מוגבל משפטית ואינו הוגנות אוטומטית.", "הסרת פיצ'ר אכן משנה את ההתאמה, והפיצ'רים המתואמים נושאים את המידע ממילא."]}}, {"id": "rai-004", "area": "responsible-ai", "topic": "interpretability", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["shap", "lime", "interpretability"], "answer": 2, "en": {"q": "Two features are strongly correlated and SHAP splits the credit roughly evenly between them. What is the correct reading?", "options": ["SHAP values are causal effects, so both features genuinely cause the outcome", "The even split proves the model is overfitting to redundant inputs", "Attributions describe this model's behavior, and correlated features share credit arbitrarily", "LIME would give the single correct attribution, because it fits a local linear model"], "hint": "Is the object being explained the data-generating process, or the fitted function?", "explanation": "SHAP explains the model, not the world: it distributes a prediction over the inputs according to the fitted function, so two nearly exchangeable features can each receive about half the credit and removing one may barely change the prediction. Attributions are also not causal — a feature can earn credit purely by correlating with the true driver. LIME has its own limits: it is sampling-dependent, locally linear, and can be unstable across runs for the same point.", "whyWrong": ["Attribution is not identification; credit can flow to a feature that merely correlates with the real cause.", "Credit sharing between correlated features happens even in a model that generalizes perfectly.", "LIME's explanation depends on its perturbation sampling and kernel width, and can vary between runs."]}, "he": {"q": "שני פיצ'רים מתואמים חזק, ו-SHAP מחלק ביניהם את הקרדיט בערך שווה בשווה. מהי הפרשנות הנכונה?", "options": ["ערכי SHAP הם אפקטים סיבתיים, ולכן שני הפיצ'רים באמת גורמים לתוצאה", "החלוקה השווה מוכיחה שהמודל בהתאמת יתר לקלטים יתירים", "הייחוסים מתארים את התנהגות המודל הזה, ופיצ'רים מתואמים חולקים קרדיט באופן שרירותי", "LIME היה נותן את הייחוס הנכון היחיד, כי הוא מתאים מודל לינארי מקומי"], "hint": "מה בעצם מוסבר כאן: תהליך יצירת הדאטה, או הפונקציה שנלמדה?", "explanation": "SHAP מסביר את המודל ולא את העולם: הוא מחלק חיזוי בין הקלטים לפי הפונקציה שנלמדה, ולכן שני פיצ'רים כמעט מתחלפים יכולים לקבל כל אחד כמחצית הקרדיט, והסרת אחד מהם כמעט לא תשנה את החיזוי. בנוסף הייחוסים אינם סיבתיים — פיצ'ר יכול לזכות בקרדיט רק בזכות מתאם עם הגורם האמיתי. גם ל-LIME יש מגבלות: הוא תלוי בדגימת ההפרעות, לינארי מקומית, ועלול להיות לא יציב בין הרצות עבור אותה נקודה.", "whyWrong": ["ייחוס אינו זיהוי סיבתי; קרדיט יכול לזרום לפיצ'ר שרק מתואם עם הגורם האמיתי.", "חלוקת קרדיט בין פיצ'רים מתואמים קורית גם במודל שמכליל מצוין.", "ההסבר של LIME תלוי בדגימת ההפרעות וברוחב הגרעין, והוא עשוי להשתנות בין הרצות."]}}, {"id": "rai-005", "area": "responsible-ai", "topic": "disparate-impact", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["fairness", "disparate-impact", "four-fifths"], "answer": 1, "en": {"q": "Group A: 30 of 100 applicants selected. Group B: 18 of 120 selected. What is the impact ratio, and does it clear the four-fifths rule?", "options": ["0.60 — it clears the rule comfortably", "0.50 — it fails the rule", "0.80 — it lands exactly on the threshold", "1.67 — the rule does not apply when the ratio exceeds 1"], "hint": "Compute the two selection rates first, then divide the smaller by the larger.", "explanation": "The selection rates are 30/100 = 0.30 and 18/120 = 0.15, so the impact ratio is 0.15/0.30 = 0.50. The four-fifths rule of thumb flags any ratio below 0.8 as evidence of adverse impact worth investigating. It is a screening heuristic and not proof of discrimination: small samples make it noisy, and clearing 0.8 does not by itself make a process lawful or fair.", "whyWrong": ["0.60 comes from dividing raw counts, 18/30, instead of comparing the two selection rates.", "0.80 is the threshold being tested, not the value that the two rates produce here.", "The ratio is defined as the disadvantaged group's rate over the highest rate, so it cannot exceed 1."]}, "he": {"q": "קבוצה A: 30 מתוך 100 מועמדים נבחרו. קבוצה B: 18 מתוך 120 נבחרו. מהו יחס ההשפעה (impact ratio), והאם הוא עומד בכלל ארבע חמישיות?", "options": ["0.60 — הוא עומד בכלל בנוחות", "0.50 — הוא נכשל בכלל", "0.80 — הוא נוחת בדיוק על הסף", "1.67 — הכלל אינו חל כאשר היחס גדול מ-1"], "hint": "חשבו קודם את שני שיעורי הבחירה, ואז חלקו את הקטן בגדול.", "explanation": "שיעורי הבחירה הם 30/100 = 0.30 ו-18/120 = 0.15, ולכן יחס ההשפעה הוא 0.15/0.30 = 0.50. כלל ארבע החמישיות מסמן כל יחס נמוך מ-0.8 כעדות להשפעה שלילית שראוי לחקור. זהו כלל אצבע לסינון ולא הוכחה להפליה: מדגמים קטנים הופכים אותו לרועש, ומעבר הסף 0.8 אינו הופך כשלעצמו תהליך לחוקי או להוגן.", "whyWrong": ["0.60 מתקבל מחלוקת המספרים הגולמיים, 18/30, במקום מהשוואת שני שיעורי הבחירה.", "0.80 הוא הסף שנבדק ולא הערך שמתקבל כאן משני השיעורים.", "היחס מוגדר כשיעור הקבוצה המוחלשת חלקי השיעור הגבוה ביותר, ולכן הוא לא יכול לעלות על 1."]}}, {"id": "rai-006", "area": "responsible-ai", "topic": "differential-privacy", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["privacy", "differential-privacy", "federated-learning"], "en": {"q": "Explain differential privacy's guarantee in plain terms, say whether federated learning alone provides it, and describe where the privacy-utility tradeoff bites hardest.", "hint": "Think about what changes in the output when one single person's record is added or removed.", "modelAnswer": "Differential privacy bounds how much the output distribution of an algorithm may change when one individual's record is added or removed: for any outcome the probabilities under neighboring datasets differ by at most a factor of e^epsilon, plus a small additive delta. The practical reading is that an adversary who already knows everything else learns almost nothing new about that one person, whatever side information they hold; smaller epsilon means more noise and stronger privacy. Federated learning alone does not provide this guarantee — it avoids centralizing raw data, but gradients and model updates leak information and are open to gradient inversion and membership inference, so DP-SGD (per-example gradient clipping plus calibrated noise) and secure aggregation are added on top. The tradeoff bites hardest exactly where data is scarce: rare classes, small subgroups and tail examples are the ones whose influence the noise erases, so private models tend to lose disproportionate accuracy on minorities — the same tension that makes memorized rare sequences both the privacy risk and the useful signal.", "rubric": ["States the guarantee: one individual's presence or absence changes the output distribution by at most e^epsilon (with delta)", "Describes epsilon as a privacy budget — smaller epsilon means more noise and stronger privacy", "Says federated learning alone is not DP, since updates and gradients leak (inversion, membership inference)", "Mentions DP-SGD (clipping plus noise) and/or secure aggregation as the way to obtain a guarantee", "Explains that the utility cost falls hardest on rare classes, small subgroups and tail examples"]}, "he": {"q": "הסבירו במילים פשוטות מהי ההבטחה של פרטיות דיפרנציאלית (differential privacy), האם למידה מבוזרת (federated learning) לבדה מספקת אותה, והיכן הפשרה בין פרטיות לתועלת כואבת ביותר.", "hint": "חשבו מה משתנה בפלט כאשר מוסיפים או מסירים רשומה של אדם בודד.", "modelAnswer": "פרטיות דיפרנציאלית חוסמת את מידת השינוי בהתפלגות הפלט של אלגוריתם כאשר מוסיפים או מסירים רשומה של אדם אחד: עבור כל תוצאה, ההסתברויות תחת שני דאטהסטים שכנים נבדלות לכל היותר בפקטור e^epsilon, בתוספת delta קטן. הפרשנות המעשית היא שיריב שכבר יודע את כל השאר לומד כמעט כלום חדש על אותו אדם, ולא משנה איזה מידע צדדי יש בידיו; epsilon קטן יותר פירושו יותר רעש ופרטיות חזקה יותר. למידה מבוזרת לבדה אינה מספקת את ההבטחה הזו — היא נמנעת מריכוז הדאטה הגולמי, אבל גרדיאנטים ועדכוני מודל מדליפים מידע וחשופים להיפוך גרדיאנט ולהתקפות חברוּת (membership inference), ולכן מוסיפים מעליה DP-SGD (חיתוך גרדיאנט לכל דוגמה יחד עם רעש מכויל) ו-secure aggregation. הפשרה כואבת ביותר בדיוק היכן שהדאטה דל: מחלקות נדירות, תת-קבוצות קטנות ודוגמאות זנב הן אלה שהרעש מוחק את השפעתן, ולכן מודלים פרטיים נוטים לאבד דיוק באופן לא פרופורציונלי על מיעוטים — אותה מתיחות שהופכת רצפים נדירים שנשננו גם לסיכון הפרטיות וגם לאות השימושי.", "rubric": ["מנסח את ההבטחה: נוכחות או היעדרות של אדם בודד משנה את התפלגות הפלט לכל היותר בפקטור e^epsilon (עם delta)", "מתאר את epsilon כתקציב פרטיות — epsilon קטן יותר פירושו יותר רעש ופרטיות חזקה יותר", "אומר שלמידה מבוזרת לבדה אינה DP, כי עדכונים וגרדיאנטים מדליפים (היפוך גרדיאנט, membership inference)", "מזכיר DP-SGD (חיתוך ורעש) ו/או secure aggregation כדרך להשיג הבטחה", "מסביר שמחיר התועלת נופל בעיקר על מחלקות נדירות, תת-קבוצות קטנות ודוגמאות זנב"]}}, {"id": "ops-001", "area": "mlops", "topic": "training-serving-skew", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["serving", "skew", "debugging"], "answer": 0, "en": {"q": "Your fraud model scores AUC 0.94 offline but far worse in production. Replaying the exact production inputs through the training feature pipeline reproduces 0.94. What is the most likely cause?", "options": ["Training-serving skew: the serving path computes features differently", "Concept drift: the feature-label relationship changed in production", "Overfitting: the model memorized the training set", "Covariate shift: production inputs come from a different distribution"], "hint": "The replay isolates one half of the pipeline from the other.", "explanation": "The replay uses the same production inputs but the training-time feature code, and it recovers the offline score. So the raw inputs are fine and the model is fine; the difference must live in how features are computed at serving time. That is exactly training-serving skew, and it is the most common reason a model looks great offline and fails live.", "whyWrong": ["Concept drift would also degrade the replay, since it is scored against the same production labels.", "Overfitting shows up as a gap between training and held-out offline scores, not between two serving paths.", "Covariate shift would change the replayed inputs too, so the replay would not recover 0.94."]}, "he": {"q": "מודל ההונאות שלכם מקבל AUC 0.94 אופליין אך גרוע בהרבה בפרודקשן. הרצה חוזרת של אותם קלטי פרודקשן דרך צינור הפיצ'רים של האימון משחזרת 0.94. מה הסיבה הסבירה ביותר?", "options": ["פער אימון-הגשה (training-serving skew): נתיב ההגשה מחשב פיצ'רים אחרת", "סחיפת מושג (concept drift): הקשר בין הפיצ'רים לתווית השתנה בפרודקשן", "התאמת יתר (overfitting): המודל שינן את סט האימון", "סחיפת התפלגות הקלט (covariate shift): קלטי הפרודקשן מגיעים מהתפלגות אחרת"], "hint": "ההרצה החוזרת מבודדת חצי אחד של הצינור מהחצי השני.", "explanation": "ההרצה החוזרת משתמשת באותם קלטי פרודקשן אך בקוד הפיצ'רים של זמן האימון, ומשחזרת את הציון האופליין. כלומר הקלטים הגולמיים תקינים והמודל תקין; ההבדל חייב להיות באופן שבו מחושבים הפיצ'רים בזמן ההגשה. זו בדיוק ההגדרה של training-serving skew, והסיבה הנפוצה ביותר למודל שנראה מצוין אופליין ונכשל בפרודקשן.", "whyWrong": ["סחיפת מושג הייתה פוגעת גם בהרצה החוזרת, שכן היא נמדדת מול אותן תוויות פרודקשן.", "התאמת יתר מתבטאת בפער בין ציון האימון לציון על סט מבחן אופליין, לא בין שני נתיבי הגשה.", "סחיפת התפלגות הקלט הייתה משנה גם את הקלטים בהרצה החוזרת, ולכן היא לא הייתה משחזרת 0.94."]}}, {"id": "ops-002", "area": "mlops", "topic": "inference-modes", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["batch-inference", "serving"], "answer": 3, "en": {"q": "Every night you must score all 8 million customers for a churn dashboard analysts read in the morning. No user request triggers the score. Which serving mode fits best?", "options": ["Online inference behind a low-latency REST endpoint", "Streaming inference, one prediction per event from a queue", "On-device inference embedded in the mobile app", "Batch scoring on a nightly schedule, written to a table"], "hint": "Ask what the latency requirement actually is when nobody is waiting.", "explanation": "Nothing is waiting on the prediction, the input set is known in advance, and the freshness requirement is one day. Batch scoring exploits all three: it amortizes model loading, uses large efficient batches, and writes results to a table the dashboard simply reads. A low-latency online service here buys nothing and costs a lot.", "whyWrong": ["An online endpoint adds availability and latency engineering for a job with no latency requirement.", "Streaming is for reacting to events as they arrive; here the trigger is a clock, not an event.", "On-device scoring cannot see the full customer table and does not feed an internal dashboard."]}, "he": {"q": "כל לילה עליכם לחשב ציון נטישה ל-8 מיליון לקוחות עבור דשבורד שאנליסטים קוראים בבוקר. שום בקשת משתמש לא מפעילה את החישוב. איזה מצב הגשה (serving) מתאים ביותר?", "options": ["הסקה מקוונת (online) מאחורי endpoint REST בהשהיה נמוכה", "הסקה בזרימה (streaming), חיזוי אחד לכל אירוע מתור", "הסקה על המכשיר (on-device), משובצת באפליקציה", "חישוב באצווה (batch scoring) בתזמון לילי, שנכתב לטבלה"], "hint": "שאלו מה בעצם דרישת ההשהיה כשאף אחד לא ממתין.", "explanation": "אף אחד לא ממתין לחיזוי, קבוצת הקלטים ידועה מראש, ודרישת הטריות היא יום אחד. חישוב באצווה מנצל את שלושת הדברים: הוא מפחית את עלות טעינת המודל, משתמש באצוות גדולות ויעילות, וכותב את התוצאות לטבלה שהדשבורד פשוט קורא. שירות מקוון בהשהיה נמוכה לא מוסיף כאן דבר ועולה הרבה.", "whyWrong": ["endpoint מקוון מוסיף עבודת זמינות והשהיה למשימה שאין לה בכלל דרישת השהיה.", "streaming נועד לתגובה לאירועים בזמן שהם מגיעים; כאן הטריגר הוא שעון ולא אירוע.", "הסקה על המכשיר לא רואה את טבלת הלקוחות המלאה ולא מזינה דשבורד פנימי."]}}, {"id": "ops-003", "area": "mlops", "topic": "serving-patterns", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["serving", "deployment", "architecture"], "answer": 2, "en": {"q": "You move a model out of a separate inference microservice and embed it directly in the application process. What is the main operational cost of this change?", "options": ["Per-request latency increases because of the extra process hop", "The model can no longer be monitored for drift", "Shipping a new model now requires redeploying the application", "Feature preprocessing must be rewritten for every request"], "hint": "Think about the release cycle, not the request path.", "explanation": "Embedding removes a network hop, so latency usually improves and the failure surface shrinks. What you lose is independent release cadence: the model version is welded to the application version, so every model update is an app deployment and a model rollback is an app rollback. Decoupling those lifecycles is the main reason model microservices exist.", "whyWrong": ["Embedding removes a network hop, so per-request latency typically drops rather than rises.", "Drift monitoring depends on logging inputs and predictions, which an embedded model does just as well.", "Preprocessing code moves along with the model; it does not need rewriting per request."]}, "he": {"q": "אתם מוציאים מודל ממיקרו-שירות הסקה נפרד ומשבצים אותו ישירות בתהליך האפליקציה. מהי העלות התפעולית העיקרית של השינוי?", "options": ["ההשהיה לכל בקשה עולה בגלל הקפיצה הנוספת בין תהליכים", "לא ניתן עוד לנטר את המודל לאיתור סחיפה (drift)", "שחרור מודל חדש מחייב כעת פריסה מחדש של האפליקציה", "יש לכתוב מחדש את עיבוד הפיצ'רים המקדים עבור כל בקשה"], "hint": "חשבו על מחזור השחרור (release), לא על נתיב הבקשה.", "explanation": "שיבוץ המודל מבטל קפיצת רשת, ולכן ההשהיה בדרך כלל משתפרת ומשטח הכשל מצטמצם. מה שמאבדים הוא קצב שחרור עצמאי: גרסת המודל מרותכת לגרסת האפליקציה, ולכן כל עדכון מודל הוא פריסת אפליקציה וכל rollback של מודל הוא rollback של האפליקציה. ניתוק מחזורי החיים הללו הוא הסיבה העיקרית לקיומם של מיקרו-שירותי מודל.", "whyWrong": ["השיבוץ מבטל קפיצת רשת, ולכן ההשהיה לכל בקשה בדרך כלל יורדת ולא עולה.", "ניטור סחיפה מסתמך על תיעוד קלטים וחיזויים, ומודל משובץ עושה זאת באותה מידה.", "קוד העיבוד המקדים עובר יחד עם המודל; אין צורך לכתוב אותו מחדש לכל בקשה."]}}, {"id": "ops-004", "area": "mlops", "topic": "dynamic-batching", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["gpu", "latency", "throughput"], "answer": 1, "en": {"q": "A GPU server enables dynamic batching with a 10 ms queue window. Traffic is light: about one request every 30 ms. What happens to p50 latency and to throughput?", "options": ["Latency drops and throughput rises, because batching is always more efficient", "Latency rises by up to the window; throughput barely changes", "Latency is unchanged; throughput falls because batches stay small", "Latency rises and throughput falls, since batching is pure overhead"], "hint": "Count how many requests actually land inside a 10 ms window at this arrival rate.", "explanation": "At one request per 30 ms, almost every window closes with a batch of one, so there is no batching gain and throughput is essentially unchanged. But each request still waits for the window to expire or the batch to fill, adding up to 10 ms. Dynamic batching trades latency for throughput, and that trade only pays off under load.", "whyWrong": ["Batching helps only when requests actually co-arrive, and at this arrival rate they do not.", "The queue window makes requests wait, so latency cannot be unchanged.", "Throughput does not fall: the server still handles every request as before, just slightly later."]}, "he": {"q": "שרת GPU מפעיל dynamic batching עם חלון תור של 10 מילישניות. התעבורה דלילה: בערך בקשה אחת כל 30 מילישניות. מה קורה להשהיית p50 ולתפוקה (throughput)?", "options": ["ההשהיה יורדת והתפוקה עולה, כי batching תמיד יעיל יותר", "ההשהיה עולה בעד גודל החלון; התפוקה כמעט לא משתנה", "ההשהיה לא משתנה; התפוקה יורדת כי האצוות נשארות קטנות", "ההשהיה עולה והתפוקה יורדת, כי batching הוא תקורה נטו"], "hint": "ספרו כמה בקשות באמת נכנסות לחלון של 10 מילישניות בקצב ההגעה הזה.", "explanation": "בקצב של בקשה אחת כל 30 מילישניות כמעט כל חלון נסגר עם אצווה בגודל 1, ולכן אין רווח מ-batching והתפוקה בעיקרון לא משתנה. אך כל בקשה עדיין ממתינה עד שהחלון פג או שהאצווה מתמלאת, ומוסיפה עד 10 מילישניות. dynamic batching מחליף השהיה בתפוקה, והעסקה הזו משתלמת רק תחת עומס.", "whyWrong": ["batching עוזר רק כשבקשות באמת מגיעות יחד, ובקצב ההגעה הזה זה לא קורה.", "חלון התור גורם לבקשות להמתין, ולכן ההשהיה לא יכולה להישאר ללא שינוי.", "התפוקה לא יורדת: השרת עדיין מטפל בכל בקשה כמו קודם, רק מעט מאוחר יותר."]}}, {"id": "ops-005", "area": "mlops", "topic": "inference-cost", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["cost", "capacity-planning", "gpu"], "answer": 1, "en": {"q": "One GPU sustains 40 requests/second within your latency budget. Peak traffic is 900 requests/second and you want 50% headroom above peak. GPUs cost $2 per hour. What is the hourly cost at peak capacity?", "options": ["$46 per hour", "$68 per hour", "$90 per hour", "$136 per hour"], "hint": "Apply the headroom first, then divide, then round up to whole GPUs.", "explanation": "Sizing for 50% headroom means provisioning for 1350 requests/second. At 40 per GPU that is 33.75 GPUs, and you cannot buy three quarters of a GPU, so 34. At $2 each that is $68 per hour. Note this is the peak bill: autoscaling down off-peak is where most of the real saving lives.", "whyWrong": ["$46 sizes for the raw 900 requests/second with no headroom at all, i.e. 23 GPUs.", "$90 corresponds to 45 GPUs, about 1800 requests/second, which is double the peak rather than 50% more.", "$136 comes from 68 GPUs, which doubles the peak requirement instead of adding 50%."]}, "he": {"q": "GPU אחד מחזיק 40 בקשות בשנייה בתוך תקציב ההשהיה שלכם. שיא התעבורה הוא 900 בקשות בשנייה ואתם רוצים 50% מרווח מעל השיא. עלות GPU היא 2$ לשעה. מהי העלות השעתית בקיבולת השיא?", "options": ["46$ לשעה", "68$ לשעה", "90$ לשעה", "136$ לשעה"], "hint": "הפעילו קודם את המרווח, אחר כך חלקו, ולבסוף עגלו כלפי מעלה ל-GPU שלמים.", "explanation": "מרווח של 50% פירושו הקצאה ל-1350 בקשות בשנייה. ב-40 בקשות לכל GPU זה 33.75 GPU, ואי אפשר לקנות שלושת רבעי GPU, ולכן 34. ב-2$ לכל אחד זה 68$ לשעה. שימו לב שזה חשבון השיא: רוב החיסכון האמיתי מגיע מ-autoscaling כלפי מטה מחוץ לשעות השיא.", "whyWrong": ["46$ מתאים ל-900 בקשות בשנייה ללא שום מרווח, כלומר 23 GPU.", "90$ מתאים ל-45 GPU, בערך 1800 בקשות בשנייה, שזה כפול מהשיא ולא 50% יותר.", "136$ נובע מ-68 GPU, כלומר הכפלת דרישת השיא במקום הוספת 50%."]}}, {"id": "ops-006", "area": "mlops", "topic": "monitoring", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["monitoring", "delayed-labels", "drift"], "answer": 2, "en": {"q": "Loan default labels only mature 12 months after scoring. Which monitoring signal gives the earliest usable warning that the deployed model may be degrading?", "options": ["Rolling AUC computed on matured outcomes", "The cross-validation score recorded at training time", "Shifts in the input feature and prediction score distributions", "The daily count of scoring requests served"], "hint": "You need a signal that does not wait for the truth to arrive.", "explanation": "With a 12-month label delay, any performance metric is a year stale by construction. Input drift and prediction drift require no labels at all, so they are the only signals available in the meantime. They are proxies rather than proof — drifted inputs do not always mean worse accuracy — but they are what lets you notice a change before the labels confirm it.", "whyWrong": ["Right in principle, but it can only be computed on scores that are already 12 months old.", "A number fixed at training time never changes, so it can never signal anything about production.", "Request volume tracks traffic and system health, not the quality of the predictions."]}, "he": {"q": "תוויות של חדלות פירעון בהלוואות מבשילות רק 12 חודשים אחרי מתן הציון. איזה אות ניטור נותן את האזהרה המוקדמת והשימושית ביותר לכך שהמודל בפרודקשן מתדרדר?", "options": ["AUC מתגלגל שמחושב על תוצאות שהבשילו", "ציון ה-cross-validation שנרשם בזמן האימון", "שינויים בהתפלגות פיצ'רי הקלט ובהתפלגות ציוני החיזוי", "מספר בקשות החיזוי היומי שהוגשו"], "hint": "אתם צריכים אות שלא ממתין לאמת שתגיע.", "explanation": "עם עיכוב תוויות של 12 חודשים, כל מדד ביצועים מיושן בשנה מעצם הגדרתו. סחיפת קלט (input drift) וסחיפת חיזוי (prediction drift) אינן דורשות תוויות כלל, ולכן הן האותות היחידים הזמינים בינתיים. הן פרוקסי ולא הוכחה — קלט שנסחף לא תמיד אומר דיוק נמוך יותר — אבל הן מה שמאפשר לשים לב לשינוי לפני שהתוויות מאשרות אותו.", "whyWrong": ["נכון עקרונית, אך ניתן לחשב זאת רק על ציונים שכבר בני 12 חודשים.", "מספר שנקבע בזמן האימון לעולם לא משתנה, ולכן הוא לא יכול לאותת דבר על פרודקשן.", "נפח הבקשות עוקב אחרי תעבורה ובריאות המערכת, לא אחרי איכות החיזויים."]}}, {"id": "ops-007", "area": "mlops", "topic": "drift-detection", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["drift", "ks-test", "false-alarms"], "answer": 3, "en": {"q": "You run a KS test for drift on each of 200 features, every hour, against a fixed reference window of 5 million rows. Alerts fire almost constantly. What is the most likely reason?", "options": ["The KS test cannot detect drift in continuous features", "The reference window is too old to represent the current data", "Only PSI, not KS, is valid for monitoring numeric features", "Huge samples plus 200 tests per hour make trivial shifts significant"], "hint": "Think about what a p-value does as n grows, and how many chances an hour gives you.", "explanation": "A KS test's power grows with sample size, so with millions of rows it rejects on differences far too small to affect the model. Multiply that by 200 features every hour and you also have a severe multiple-comparisons problem. The fix is to alert on effect size — a PSI or KS statistic threshold tied to observed model impact — with correction across features, not on raw p-values.", "whyWrong": ["KS is built precisely for continuous distributions; that is its primary use.", "A stale reference would produce persistent, consistent alerts rather than the noisy storm described.", "Both statistics are usable; the problem is thresholding on p-values instead of effect size, which switching statistic alone does not fix."]}, "he": {"q": "אתם מריצים מבחן KS לאיתור סחיפה על כל אחד מ-200 פיצ'רים, כל שעה, מול חלון ייחוס קבוע של 5 מיליון שורות. התראות נדלקות כמעט ברציפות. מה הסיבה הסבירה ביותר?", "options": ["מבחן KS אינו מסוגל כלל לזהות סחיפה בפיצ'רים רציפים", "חלון הייחוס ישן מדי ואינו מייצג את הנתונים הנוכחיים", "רק PSI, ולא KS, תקף לניטור פיצ'רים מספריים רציפים", "מדגמים ענקיים ו-200 מבחנים בשעה הופכים שינויים זניחים למובהקים"], "hint": "חשבו מה קורה ל-p-value כאשר n גדל, וכמה הזדמנויות נותנת שעה אחת.", "explanation": "העוצמה של מבחן KS גדלה עם גודל המדגם, ולכן עם מיליוני שורות הוא ידחה את השערת האפס על הבדלים קטנים מכדי להשפיע על המודל. הכפילו זאת ב-200 פיצ'רים בכל שעה ותקבלו גם בעיית השוואות מרובות חמורה. הפתרון הוא להתריע על גודל אפקט — סף על סטטיסטי PSI או KS שקשור להשפעה נמדדת על המודל — עם תיקון על פני הפיצ'רים, ולא על p-value גולמי.", "whyWrong": ["KS נבנה בדיוק עבור התפלגויות רציפות; זה השימוש המרכזי שלו.", "חלון ייחוס מיושן היה מייצר התראות עקביות ומתמשכות, ולא את סופת הרעש שתוארה.", "שני הסטטיסטים שמישים; הבעיה היא סף על p-value במקום על גודל אפקט, והחלפת הסטטיסטי לבדה לא פותרת זאת."]}}, {"id": "ops-008", "area": "mlops", "topic": "retraining-cadence", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["retraining", "triggers", "cost"], "answer": 2, "en": {"q": "Your team retrains the model every night 'because the data is fresh.' Which argument best supports switching to trigger-based retraining instead?", "options": ["Nightly retraining necessarily overfits the most recent data", "Trigger-based retraining removes the need for a held-out validation set", "Every retrain is a risky deploy, and none of them is justified by measured decay", "Scheduled jobs cannot incorporate labels that arrived the same day"], "hint": "A retrain is not free — ask what each one actually buys you.", "explanation": "Every retrain produces a new artifact that must be validated and deployed, and every deployment can regress. Without evidence that performance decays on a daily timescale, the nightly cadence buys nothing while adding change risk and compute cost. Triggers — a drift threshold, a measured performance drop, or a data-volume milestone — tie retraining to evidence instead of habit.", "whyWrong": ["A retrain on all available data is not inherently overfit to the newest slice.", "Any retraining scheme still needs held-out validation before a model is promoted.", "Scheduled jobs read whatever labels exist at run time, so label freshness is not the issue."]}, "he": {"q": "הצוות שלכם מאמן מחדש את המודל כל לילה 'כי הנתונים טריים'. איזה טיעון תומך הכי טוב במעבר לאימון מחדש מבוסס טריגרים?", "options": ["אימון לילי בהכרח מתאים יתר על המידה לנתונים האחרונים", "אימון מבוסס טריגרים מייתר את הצורך בסט ולידציה נפרד", "כל אימון מחדש הוא פריסה מסוכנת שאינה מוצדקת בדעיכה שנמדדה", "משימות מתוזמנות אינן יכולות לכלול תוויות שהגיעו באותו יום"], "hint": "אימון מחדש אינו חינם — שאלו מה כל אחד מהם באמת קונה לכם.", "explanation": "כל אימון מחדש מייצר ארטיפקט חדש שיש לאמת ולפרוס, וכל פריסה עלולה לגרום לרגרסיה. ללא ראיה שהביצועים דועכים בקנה מידה יומי, הקצב הלילי לא קונה דבר ומוסיף סיכון שינוי ועלות חישוב. טריגרים — סף סחיפה, ירידת ביצועים שנמדדה, או אבן דרך בנפח נתונים — קושרים את האימון מחדש לראיות במקום להרגל.", "whyWrong": ["אימון מחדש על כל הנתונים הזמינים אינו מותאם יתר על המידה לפלח החדש מעצם טבעו.", "כל שיטת אימון מחדש עדיין דורשת ולידציה על סט נפרד לפני קידום מודל.", "משימות מתוזמנות קוראות את התוויות שקיימות בזמן ההרצה, ולכן טריות התוויות אינה הבעיה."]}}, {"id": "ops-009", "area": "mlops", "topic": "deployment-strategies", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["deployment", "shadow", "canary"], "answer": 2, "en": {"q": "Which release strategy sends a copy of live production traffic to the new model while its predictions are logged and never returned to users?", "options": ["Canary release", "Blue-green deployment", "Shadow deployment", "Rolling update"], "hint": "One of these lets you measure a model on real traffic at zero user risk.", "explanation": "Shadow deployment (or 'dark launch') mirrors real requests to the candidate model and logs its outputs without returning them, so you get true production-distribution behaviour, latency and error rates at zero user risk. Its limit is that it cannot measure business impact, because nobody ever acts on those predictions.", "whyWrong": ["A canary serves the new model to a small slice of real users, so its predictions do reach people.", "Blue-green keeps two full environments and cuts all traffic over at once; nothing is mirrored.", "A rolling update gradually replaces instances, and every replaced instance serves live users."]}, "he": {"q": "איזו אסטרטגיית שחרור שולחת עותק של תעבורת פרודקשן חיה למודל החדש, כאשר החיזויים שלו מתועדים ולעולם לא מוחזרים למשתמשים?", "options": ["שחרור canary", "פריסת blue-green", "פריסת shadow", "עדכון מתגלגל (rolling update)"], "hint": "אחת מהן מאפשרת למדוד מודל על תעבורה אמיתית בסיכון אפס למשתמש.", "explanation": "פריסת shadow (או 'dark launch') משכפלת בקשות אמיתיות למודל המועמד ומתעדת את הפלטים שלו בלי להחזיר אותם, כך שמקבלים התנהגות אמיתית על התפלגות הפרודקשן, מדדי השהיה ושיעורי שגיאה בסיכון אפס למשתמש. המגבלה שלה היא שאי אפשר למדוד השפעה עסקית, כי אף אחד לא פועל לפי החיזויים האלה.", "whyWrong": ["canary מגיש את המודל החדש לפלח קטן של משתמשים אמיתיים, ולכן החיזויים שלו כן מגיעים לאנשים.", "blue-green מחזיקה שתי סביבות מלאות ומעבירה את כל התעבורה בבת אחת; שום דבר לא משוכפל.", "עדכון מתגלגל מחליף מכונות בהדרגה, וכל מכונה שהוחלפה מגישה משתמשים חיים."]}}, {"id": "ops-010", "area": "mlops", "topic": "ab-testing", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["ab-testing", "novelty-effect", "experimentation"], "answer": 0, "en": {"q": "An A/B test of a new recommender shows +8% CTR in week 1, +3% in week 2 and +1% in week 3, on the same fixed user cohorts. What is the most likely reading?", "options": ["A novelty effect is decaying; judge the test on the stabilized later weeks", "A sample ratio mismatch is corrupting the split; restart the experiment", "The treatment model is actively degrading; roll it back immediately", "This is weekly seasonality; report the week-1 lift as the true effect"], "hint": "What happens to users the first few times they see something unfamiliar?", "explanation": "Users click more on anything that looks new, and that curiosity decays over days to weeks — the novelty effect. With fixed cohorts and a monotone decay toward a small positive number, the honest estimate is the plateau, not the launch spike. Shipping on the week-1 number is one of the most common ways teams overstate an ML launch.", "whyWrong": ["A sample ratio mismatch shows up as unequal group sizes, which would not produce a smooth decay.", "The lift is still positive and settling toward a plateau, which is a bonus decaying, not the model degrading.", "Seasonality oscillates and hits control and treatment alike, so it largely cancels in the difference."]}, "he": {"q": "מבחן A/B של ממליץ חדש מראה 8%+ ב-CTR בשבוע 1, 3%+ בשבוע 2 ו-1%+ בשבוע 3, על אותן קבוצות משתמשים קבועות. מהי הפרשנות הסבירה ביותר?", "options": ["אפקט חידוש (novelty effect) דועך; יש לשפוט את המבחן לפי השבועות המאוחרים והיציבים", "יש חוסר איזון ביחס הדגימה (sample ratio mismatch); יש להתחיל את הניסוי מחדש", "מודל הטיפול מתדרדר באופן פעיל; יש לבצע rollback מיידי", "זו עונתיות שבועית; יש לדווח על העלייה של שבוע 1 כאפקט האמיתי"], "hint": "מה קורה למשתמשים בפעמים הראשונות שהם רואים משהו לא מוכר?", "explanation": "משתמשים מקליקים יותר על כל דבר שנראה חדש, והסקרנות הזו דועכת תוך ימים עד שבועות — אפקט החידוש. עם קבוצות קבועות ודעיכה מונוטונית לעבר מספר חיובי קטן, האומדן הכן הוא הרמה שאליה התייצב, ולא הקפיצה של ההשקה. שחרור על סמך המספר של שבוע 1 הוא אחת הדרכים הנפוצות ביותר שבהן צוותים מנפחים השקה של מודל.", "whyWrong": ["חוסר איזון ביחס הדגימה מתבטא בגדלים לא שווים של הקבוצות, ולא היה מייצר דעיכה חלקה כזו.", "העלייה עדיין חיובית ומתייצבת סביב רמה, כלומר בונוס שדועך ולא מודל שמתדרדר.", "עונתיות מתנדנדת ומשפיעה גם על הביקורת וגם על הטיפול, ולכן היא מתקזזת ברובה בהפרש ביניהם."]}}, {"id": "ops-011", "area": "mlops", "topic": "caching-cold-start", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["caching", "cold-start", "latency"], "answer": 0, "en": {"q": "Precomputed recommendations return from cache in 5 ms; a miss recomputes in 105 ms. The hit rate is 90%. What is the mean latency, and what happens for a brand-new user?", "options": ["15 ms; a new user always misses, so you need a fallback", "15 ms; a new user is served from the shared cache like anyone else", "55 ms; a new user always misses, so you need a fallback", "10 ms; a new user misses once and hits from then on"], "hint": "Weight the two paths by their probabilities, then ask what is in the cache before the user exists.", "explanation": "Mean latency is 0.9*5 + 0.1*105 = 4.5 + 10.5 = 15 ms. But the average hides the cold-start case: a user never seen before has no precomputed row, so they take the slow path — and the slow path often needs history they do not have. That is why cold start almost always needs an explicit fallback such as popularity or content-based recommendations.", "whyWrong": ["The cache is keyed per user, so a brand-new user has no entry to be served from.", "55 ms is the unweighted average of 5 and 105, ignoring the 90/10 split.", "10 ms is not the weighted mean, and the very first request still needs a fallback answer to return."]}, "he": {"q": "המלצות שחושבו מראש חוזרות מה-cache תוך 5 מילישניות; החטאה (miss) דורשת חישוב מחדש של 105 מילישניות. שיעור הפגיעות הוא 90%. מהי ההשהיה הממוצעת, ומה קורה למשתמש חדש לגמרי?", "options": ["15 מילישניות; משתמש חדש תמיד מחטיא, ולכן דרוש מנגנון גיבוי (fallback)", "15 מילישניות; משתמש חדש מוגש מה-cache המשותף כמו כולם", "55 מילישניות; משתמש חדש תמיד מחטיא, ולכן דרוש מנגנון גיבוי (fallback)", "10 מילישניות; משתמש חדש מחטיא פעם אחת ומאז פוגע"], "hint": "שקללו את שני המסלולים לפי ההסתברויות שלהם, ואז שאלו מה יש ב-cache עוד לפני שהמשתמש קיים.", "explanation": "ההשהיה הממוצעת היא 0.9*5 + 0.1*105 = 4.5 + 10.5 = 15 מילישניות. אבל הממוצע מסתיר את מקרה ההתחלה הקרה (cold start): משתמש שמעולם לא נראה אין לו שורה מחושבת מראש, ולכן הוא עובר במסלול האיטי — ולעיתים קרובות המסלול האיטי דורש היסטוריה שאין לו. לכן cold start כמעט תמיד מחייב גיבוי מפורש כמו המלצות פופולריות או מבוססות תוכן.", "whyWrong": ["ה-cache ממופתח לפי משתמש, ולכן למשתמש חדש לגמרי אין כלל רשומה להגיש ממנה.", "55 מילישניות הוא הממוצע הלא משוקלל של 5 ו-105, שמתעלם מהחלוקה 90/10.", "10 מילישניות אינו הממוצע המשוקלל, והבקשה הראשונה עצמה עדיין זקוקה לתשובת גיבוי."]}}, {"id": "ops-012", "area": "mlops", "topic": "point-in-time-joins", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["feature-store", "leakage", "point-in-time"], "answer": 3, "en": {"q": "A feature store builds training rows by joining each historical label to the feature value stored today. Offline AUC jumps to 0.97 while production stays at 0.71. What went wrong?", "options": ["The store refreshes daily, so serving features are stale relative to training", "The join silently dropped rows with nulls, shrinking the training set", "Training used a 30-day aggregation window and serving used a 7-day one", "Features were taken from after the label's timestamp, leaking the future"], "hint": "Ask when each number was true, not just what it equals.", "explanation": "A correct training row must use the feature value as it was at prediction time — a point-in-time, or as-of, join. Joining to today's value lets the model see aggregates that already contain the outcome it is supposed to predict, which inflates offline metrics and vanishes in production where only the past is available. Point-in-time correctness is the main reason feature stores keep timestamped history at all.", "whyWrong": ["Staleness would depress the offline and online scores together, not open a 26-point gap.", "Dropping null rows changes the sample and can bias it, but it does not manufacture predictive power.", "Mismatched windows are a skew bug that hurts production, but they would not lift offline AUC to 0.97."]}, "he": {"q": "feature store בונה שורות אימון על ידי חיבור (join) של כל תווית היסטורית לערך הפיצ'ר השמור היום. ה-AUC האופליין מזנק ל-0.97 בעוד שבפרודקשן הוא נשאר 0.71. מה השתבש?", "options": ["ה-store מתרענן פעם ביום, ולכן פיצ'רי ההגשה מיושנים ביחס לאימון", "ה-join השמיט בשקט שורות עם ערכים חסרים וכיווץ את סט האימון", "האימון השתמש בחלון צבירה של 30 יום וההגשה בחלון של 7 ימים", "הפיצ'רים נלקחו מזמן שאחרי חותמת הזמן של התווית, ודלפה מהם המידע העתידי"], "hint": "שאלו מתי כל מספר היה נכון, לא רק למה הוא שווה.", "explanation": "שורת אימון תקינה חייבת להשתמש בערך הפיצ'ר כפי שהיה בזמן החיזוי — זהו חיבור point-in-time (או as-of). חיבור לערך של היום מאפשר למודל לראות אגרגציות שכבר מכילות את התוצאה שהוא אמור לחזות, מה שמנפח מדדים אופליין ונעלם בפרודקשן שבו זמין רק העבר. נכונות point-in-time היא הסיבה המרכזית לכך ש-feature stores שומרים בכלל היסטוריה עם חותמות זמן.", "whyWrong": ["יישון היה מוריד יחד את הציון האופליין ואת הציון המקוון, ולא פותח פער של 26 נקודות.", "השמטת שורות עם ערכים חסרים משנה את המדגם ויכולה להטות אותו, אך היא לא מייצרת כוח חיזוי יש מאין.", "חלונות לא תואמים הם באג skew שפוגע בפרודקשן, אבל הם לא היו מרימים את ה-AUC האופליין ל-0.97."]}}, {"id": "ops-013", "area": "mlops", "topic": "reproducibility", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["reproducibility", "data-versioning", "seeds"], "answer": 1, "en": {"q": "Two engineers run the same training script at the same git commit with the same fixed seed, and get noticeably different models. What should you check first?", "options": ["Non-convexity of the loss, which makes results inherently random", "Whether they pulled the same snapshot of the training data", "Whether the model weights were randomly initialized", "Whether one of them used a different learning rate"], "hint": "Same code, same seed — so what else is an input to training?", "explanation": "Code and seed are pinned, so the remaining moving inputs are the data and the environment. A query like 'select * from events' run two hours apart returns different rows, and that alone changes the model. Reproducible ML requires the dataset to be versioned or snapshotted by content hash, and library and driver versions pinned, exactly like code.", "whyWrong": ["Non-convexity means many minima exist, but with identical data, code and seed you still land in the same one.", "Initialization is drawn from the seed, which is fixed and identical for both runs.", "The learning rate lives in the script, and both are running the same commit."]}, "he": {"q": "שני מהנדסים מריצים את אותו סקריפט אימון על אותו git commit עם אותו seed קבוע, ומקבלים מודלים שונים באופן ניכר. מה כדאי לבדוק ראשון?", "options": ["אי-קמירות (non-convexity) של פונקציית ההפסד, שהופכת את התוצאות לאקראיות מטבען", "האם הם משכו את אותו snapshot של נתוני האימון", "האם משקולות המודל אותחלו באקראי", "האם אחד מהם השתמש בקצב למידה שונה"], "hint": "אותו קוד, אותו seed — אז מה עוד מהווה קלט לאימון?", "explanation": "הקוד וה-seed מקובעים, ולכן הקלטים הנותרים שיכולים לזוז הם הנתונים והסביבה. שאילתה כמו 'select * from events' שרצה בהפרש שעתיים מחזירה שורות שונות, וזה לבדו משנה את המודל. ML משוחזר מחייב שסט הנתונים יהיה מגורסן או מצולם לפי hash של תוכן, ושגרסאות הספריות והדרייברים יקובעו, בדיוק כמו קוד.", "whyWrong": ["אי-קמירות אומרת שקיימים מינימומים רבים, אך עם נתונים, קוד ו-seed זהים עדיין נוחתים באותו אחד.", "האתחול נגזר מה-seed, שקבוע וזהה בשתי ההרצות.", "קצב הלמידה נמצא בסקריפט, ושניהם מריצים את אותו commit."]}}, {"id": "ops-014", "area": "mlops", "topic": "model-registry", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["registry", "ci-cd", "rollback"], "answer": 1, "en": {"q": "Why does a model registry store the training data version and code commit alongside every model artifact?", "options": ["It guarantees that each promoted model outperforms the one before it", "It makes any previously deployed model reproducible and safe to roll back to", "It removes the need for a separate staging environment", "It ensures the training and serving containers are byte-identical"], "hint": "Think about the worst night: production is broken and you need last week's model back.", "explanation": "A registry's job is to make a deployed model an auditable, addressable object: given a version you can say exactly which data and code produced it, rebuild it, and redeploy it in one step. Rollback is the point — the fastest fix for a bad model is almost always shipping the last known-good version, and that only works if it is still retrievable.", "whyWrong": ["A registry records what was promoted; it makes no claim about whether the new model is better.", "Staging exists to exercise the deployment path, and metadata does not replace that.", "Container identity comes from pinned images and dependency locks, not from registry metadata."]}, "he": {"q": "מדוע model registry שומר את גרסת נתוני האימון ואת ה-commit של הקוד לצד כל ארטיפקט מודל?", "options": ["זה מבטיח שכל מודל שמקודם עולה בביצועיו על קודמו", "זה הופך כל מודל שנפרס בעבר לניתן לשחזור ול-rollback בטוח", "זה מייתר את הצורך בסביבת staging נפרדת לבדיקות", "זה מבטיח שקונטיינרי האימון וההגשה זהים בדיוק"], "hint": "חשבו על הלילה הגרוע ביותר: פרודקשן שבור ואתם צריכים בחזרה את המודל של שבוע שעבר.", "explanation": "תפקיד ה-registry הוא להפוך מודל שנפרס לאובייקט ניתן לביקורת ולכתובת: בהינתן גרסה אפשר לומר בדיוק אילו נתונים ואיזה קוד ייצרו אותה, לבנות אותה מחדש ולפרוס אותה שוב בצעד אחד. ה-rollback הוא העיקר — התיקון המהיר ביותר למודל רע הוא כמעט תמיד שחרור הגרסה התקינה האחרונה, וזה עובד רק אם היא עדיין ניתנת לאחזור.", "whyWrong": ["ה-registry מתעד מה קודם; הוא אינו טוען דבר על כך שהמודל החדש טוב יותר.", "staging קיימת כדי להריץ ולבדוק את נתיב הפריסה, ומטא-דאטה אינה מחליפה זאת.", "זהות הקונטיינרים נובעת מ-images מקובעים ומנעילת תלויות, לא ממטא-דאטה של ה-registry."]}}, {"id": "ops-015", "area": "mlops", "topic": "incident-debugging", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["incident", "debugging", "monitoring"], "en": {"q": "Your production ranking model's business metric dropped 20% overnight, with no alert from the model monitor. Walk me through your first hour.", "hint": "Stop the bleeding before you find the cause, and suspect the pipeline before the model.", "modelAnswer": "First mitigate: if a deploy or a model version changed inside the window, roll back to the last known-good version and check whether the metric recovers, because diagnosis is far easier when users are no longer being harmed. Then build a timeline and line up deploys, feature pipeline runs, upstream schema changes and third-party outages against the exact hour the metric moved. Next inspect the data rather than the model: null rates, cardinality and ranges of the top features at serving time, plus the distribution of raw prediction scores, since a silent upstream join failure usually surfaces as a feature going all-null or all-default. Also test the assumption that it is the model at all: a 20% business drop with no model-side signal is very often a logging change, a traffic-mix shift, or a UI or upstream outage. Finally, reproduce it by scoring sampled real production requests through the training feature code and diffing against what serving actually produced.", "rubric": ["Mitigates first (rollback or traffic shift) before root-causing", "Correlates the timing with deploys, pipeline runs and upstream changes", "Checks feature-level data health (nulls, ranges, defaults) and the prediction score distribution", "Considers non-model causes: logging change, traffic mix, UI or upstream outage", "Reproduces serving-vs-training features on sampled real requests"]}, "he": {"q": "המדד העסקי של מודל הדירוג שלכם בפרודקשן צנח ב-20% בן לילה, ללא שום התראה ממערכת ניטור המודל. תארו את השעה הראשונה שלכם.", "hint": "עצרו את הדימום לפני שאתם מוצאים את הסיבה, וחשדו בצינור הנתונים לפני שאתם חושדים במודל.", "modelAnswer": "קודם כול מקטינים נזק: אם התרחשה פריסה או החלפת גרסת מודל בתוך החלון, מבצעים rollback לגרסה התקינה האחרונה ובודקים אם המדד מתאושש, כי האבחון קל בהרבה כשמשתמשים כבר לא נפגעים. אחר כך בונים ציר זמן ומיישרים מולו פריסות, הרצות של צינור הפיצ'רים, שינויי סכמה במקורות במעלה הזרם והשבתות של ספקים חיצוניים, ביחס לשעה המדויקת שבה המדד זז. בשלב הבא בודקים את הנתונים ולא את המודל: שיעורי ערכים חסרים, מונים של ערכים ייחודיים וטווחים של הפיצ'רים המובילים בזמן ההגשה, וכן את התפלגות ציוני החיזוי הגולמיים, שכן כשל join שקט במעלה הזרם מתבטא בדרך כלל בפיצ'ר שהופך כולו לריק או לערך ברירת מחדל. כדאי גם לבחון את ההנחה שמדובר במודל בכלל: ירידה עסקית של 20% ללא שום אות מצד המודל היא לעיתים קרובות שינוי בתיעוד, שינוי בהרכב התעבורה, או תקלה בממשק או במערכת במעלה הזרם. לבסוף משחזרים: מריצים בקשות פרודקשן אמיתיות שנדגמו דרך קוד הפיצ'רים של האימון ומשווים למה שההגשה באמת ייצרה.", "rubric": ["מקטין נזק תחילה (rollback או הסטת תעבורה) לפני חיפוש שורש הבעיה", "מקשר את התזמון לפריסות, להרצות צינור ולשינויים במעלה הזרם", "בודק בריאות נתונים ברמת הפיצ'ר (ערכים חסרים, טווחים, ברירות מחדל) ואת התפלגות ציוני החיזוי", "שוקל סיבות שאינן המודל: שינוי בתיעוד, הרכב תעבורה, ממשק או תקלה במעלה הזרם", "משחזר את הפער בין פיצ'רי ההגשה לפיצ'רי האימון על בקשות אמיתיות שנדגמו"]}}, {"id": "int-001", "area": "interview", "topic": "more-data-myth", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["bias-variance", "screening", "learning-curves"], "answer": 3, "en": {"q": "An interviewer asks: 'Does collecting more training data always improve test performance?' Which answer is sharpest?", "options": ["Yes — more data always reduces test error", "No — past a few thousand rows, extra data is wasted", "Yes, as long as the new data is i.i.d. with the original", "No — it fights variance, but not bias or label noise"], "hint": "Decompose the error before you answer.", "explanation": "Extra data mostly attacks the variance term. If the error is dominated by bias — the model class cannot express the target — or by irreducible label noise, more of the same data barely moves the curve; you need a better model, better features or better labels. Reading the learning curve tells you which regime you are in, and that is what the interviewer is listening for.", "whyWrong": ["This ignores bias and irreducible noise, neither of which more data touches.", "There is no universal saturation point; it depends on the model class and the task.", "The i.i.d. condition rules out distribution shift, but a bias-limited model still will not improve."]}, "he": {"q": "מראיין שואל: 'האם איסוף עוד נתוני אימון תמיד משפר את הביצועים על סט המבחן?' איזו תשובה היא החדה ביותר?", "options": ["כן — יותר נתונים תמיד מקטינים את שגיאת המבחן", "לא — מעבר לכמה אלפי שורות, נתונים נוספים מבוזבזים", "כן, כל עוד הנתונים החדשים בלתי תלויים ושווי התפלגות למקוריים", "לא — זה נלחם בשונות, אך לא בהטיה או ברעש בתוויות"], "hint": "פרקו את השגיאה לרכיביה לפני שאתם עונים.", "explanation": "נתונים נוספים תוקפים בעיקר את רכיב השונות (variance). אם השגיאה נשלטת על ידי הטיה (bias) — משפחת המודלים אינה מסוגלת לבטא את היעד — או על ידי רעש בלתי ניתן לצמצום בתוויות, עוד מאותם נתונים כמעט לא יזיז את העקומה; דרוש מודל טוב יותר, פיצ'רים טובים יותר או תוויות טובות יותר. קריאת עקומת הלמידה מגלה באיזה משטר אתם נמצאים, וזה מה שהמראיין מחכה לשמוע.", "whyWrong": ["התשובה מתעלמת מהטיה ומרעש בלתי ניתן לצמצום, ששניהם לא מושפעים מכמות הנתונים.", "אין נקודת רוויה אוניברסלית; היא תלויה במשפחת המודלים ובמשימה.", "תנאי אי-התלות ושוויון ההתפלגות שולל הסחת התפלגות, אך מודל שחסום על ידי הטיה עדיין לא ישתפר."]}}, {"id": "int-002", "area": "interview", "topic": "r-squared-trap", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["regression", "metrics", "screening"], "answer": 0, "en": {"q": "Two regression models are fit to the same target on the same training set. A gets training R^2 = 0.92, B gets 0.71. Why is 'A is better' unjustified?", "options": ["Training R^2 never decreases as you add predictors, so A may just be bigger", "R^2 is only defined for linear models, so comparing them is meaningless", "R^2 penalizes complexity, so B is actually the stronger model", "R^2 and MSE can rank models differently, so you should compare MSE instead"], "hint": "What happens to this number if you add a column of pure noise?", "explanation": "On the training set R^2 is a monotone function of the residual sum of squares, and adding any predictor — even random noise — can only reduce RSS. So a higher training R^2 may simply mean more parameters. The only comparison that means anything is on held-out data, and even then only if both models are scored on the same target and the same rows.", "whyWrong": ["R^2 is just 1 - RSS/TSS and is perfectly well defined for any regression fit, linear or not.", "Plain R^2 carries no complexity penalty; that is exactly what adjusted R^2 was invented for.", "For a fixed target and dataset, R^2 is a monotone transform of MSE, so the two cannot disagree."]}, "he": {"q": "שני מודלי רגרסיה מותאמים לאותו יעד על אותו סט אימון. מודל A מקבל R^2 של 0.92 על האימון, ומודל B מקבל 0.71. מדוע 'A טוב יותר' אינו מוצדק?", "options": ["R^2 על האימון אינו יורד כשמוסיפים משתנים, ולכן A אולי פשוט גדול יותר", "R^2 מוגדר רק למודלים לינאריים, ולכן ההשוואה חסרת משמעות", "R^2 מעניש על מורכבות, ולכן B הוא למעשה המודל החזק יותר", "R^2 ו-MSE יכולים לדרג מודלים אחרת, ולכן עדיף להשוות MSE במקום זאת"], "hint": "מה קורה למספר הזה אם מוסיפים עמודה של רעש טהור?", "explanation": "על סט האימון, R^2 הוא פונקציה מונוטונית של סכום ריבועי השאריות (RSS), והוספת כל משתנה מסביר — אפילו רעש אקראי — יכולה רק להקטין את RSS. לכן R^2 גבוה יותר על האימון עשוי פשוט לשקף יותר פרמטרים. ההשוואה היחידה שיש לה משמעות היא על נתונים שלא נראו, וגם אז רק אם שני המודלים נמדדים על אותו יעד ועל אותן שורות.", "whyWrong": ["R^2 הוא פשוט 1 - RSS/TSS ומוגדר היטב עבור כל התאמת רגרסיה, לינארית או לא.", "R^2 רגיל אינו כולל שום עונש על מורכבות; בדיוק לשם כך הומצא adjusted R^2.", "עבור יעד וסט נתונים קבועים, R^2 הוא טרנספורמציה מונוטונית של MSE, ולכן השניים לא יכולים לחלוק."]}}, {"id": "int-003", "area": "interview", "topic": "accuracy-followup", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["imbalance", "metrics", "screening"], "answer": 2, "en": {"q": "A candidate proudly reports 99% accuracy on a fraud classifier. What is the single most informative follow-up question?", "options": ["How many features did the final model use?", "Did you tune the hyperparameters with cross-validation?", "What does a predict-everything-as-legitimate baseline score?", "What decision threshold produced that number?"], "hint": "Before asking how good it is, ask what 'good' would even have to beat.", "explanation": "Fraud rates are usually well under 1%, so a model that predicts 'not fraud' for everything can score 99% or better while catching nothing at all. Asking for the majority-class baseline immediately reveals whether 99% is impressive or vacuous, and naturally moves the conversation toward precision, recall and cost-weighted metrics.", "whyWrong": ["Feature count says nothing about whether the headline number is meaningful.", "Tuning discipline matters, but a carefully tuned model can still report a meaningless metric.", "A fair question, but only worth asking once you know accuracy is the wrong metric here."]}, "he": {"q": "מועמד מדווח בגאווה על דיוק (accuracy) של 99% במסווג הונאות. מהי שאלת ההמשך האחת והמאירה ביותר?", "options": ["בכמה פיצ'רים השתמש המודל הסופי?", "האם כיוונת את ההיפר-פרמטרים באמצעות cross-validation?", "מה הציון של בסיס (baseline) שמנבא 'תקין' לכל עסקה?", "איזה סף החלטה הפיק את המספר הזה?"], "hint": "לפני שאתם שואלים כמה זה טוב, שאלו מה בכלל 'טוב' צריך לנצח.", "explanation": "שיעורי הונאה נמצאים בדרך כלל הרבה מתחת ל-1%, ולכן מודל שמנבא 'לא הונאה' לכל עסקה יכול לקבל 99% ומעלה בלי לתפוס דבר. שאלה על בסיס רוב המחלקות חושפת מיד אם 99% מרשים או ריק מתוכן, ומובילה באופן טבעי לשיחה על דיוק (precision), היזכרות (recall) ומדדים משוקללי עלות.", "whyWrong": ["מספר הפיצ'רים לא אומר דבר על כך שהמספר הראשי בעל משמעות.", "משמעת כיוונון חשובה, אבל מודל מכוונן היטב עדיין יכול לדווח מדד חסר משמעות.", "שאלה לגיטימית, אך שווה לשאול אותה רק אחרי שיודעים שדיוק הוא המדד הלא נכון כאן."]}}, {"id": "int-004", "area": "interview", "topic": "offline-online-gap", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["feedback-loops", "off-policy", "recsys"], "answer": 0, "en": {"q": "Your new recommender beats the incumbent when replayed on historical click logs, then underperforms it live. Which bias in the offline evaluation best explains this?", "options": ["Logs only contain feedback for items the old system chose to show", "The offline sample was too small to detect the true difference", "The two models were trained with different loss functions", "Click labels are noisier offline than they are in live traffic"], "hint": "Ask which items could ever have received a click in your logs.", "explanation": "Logged data is generated by the deployed policy, so it only contains feedback for items that policy surfaced. A model that recommends different items gets judged mostly on its overlap with the incumbent, which systematically flatters agreement and hides the value or harm of novel picks. Fixing it needs off-policy correction such as inverse propensity weighting, explicit exploration traffic, or an online test.", "whyWrong": ["Sample size affects the noise in the estimate, not its systematic direction.", "Different losses would shift both the offline and the online results in the same direction.", "The labels are the same logged clicks; they do not become noisier for being read offline."]}, "he": {"q": "הממליץ החדש שלכם מנצח את הקיים כשמריצים אותו מחדש על לוגים היסטוריים של קליקים, ואז מתפקד גרוע ממנו בפרודקשן. איזו הטיה בהערכה האופליין מסבירה זאת הכי טוב?", "options": ["הלוגים מכילים משוב רק על פריטים שהמערכת הישנה בחרה להציג", "המדגם האופליין היה קטן מכדי לזהות את ההבדל האמיתי", "שני המודלים אומנו עם פונקציות הפסד שונות", "תוויות הקליקים רועשות יותר אופליין מאשר בתעבורה החיה"], "hint": "שאלו אילו פריטים בכלל יכלו לקבל קליק בלוגים שלכם.", "explanation": "הנתונים המתועדים נוצרו על ידי המדיניות שהייתה בפרודקשן, ולכן הם מכילים משוב רק על פריטים שאותה מדיניות הציגה. מודל שממליץ על פריטים אחרים נשפט בעיקר לפי החפיפה שלו עם המערכת הקיימת, מה שמחמיא באופן שיטתי להסכמה איתה ומסתיר את התועלת או הנזק שבבחירות חדשות. התיקון דורש שיטות off-policy כמו שקלול הופכי להסתברות (IPW), תעבורת חקירה מפורשת, או מבחן מקוון.", "whyWrong": ["גודל המדגם משפיע על הרעש באומדן, לא על הכיוון השיטתי שלו.", "פונקציות הפסד שונות היו מזיזות גם את התוצאות האופליין וגם את המקוונות לאותו כיוון.", "התוויות הן אותם קליקים מתועדים; הן לא הופכות רועשות יותר מעצם כך שקוראים אותן אופליין."]}}, {"id": "int-005", "area": "interview", "topic": "baselines", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["baseline", "forecasting", "project-setup"], "answer": 1, "en": {"q": "You are starting a weekly demand-forecasting project for a retailer. What is the right first baseline to build?", "options": ["A gradient-boosted tree on all available features", "Repeat the same week from last year, adjusted for trend", "A small LSTM trained for a few epochs", "A ridge regression on one-hot encoded store and product IDs"], "hint": "The baseline's job is to be embarrassing to beat, not to be good.", "explanation": "A seasonal naive forecast costs an afternoon, needs no training infrastructure, and produces the number every later model must beat — plus an honest read on how much of the signal is plain seasonality. In many retail problems it is startlingly hard to beat, which is exactly the information you want before committing a quarter to modelling.", "whyWrong": ["A boosted tree is a fine second step, but it cannot tell you how much of the signal is trivial seasonality.", "An LSTM adds training and tuning cost before you know whether any of it is needed.", "Ridge on IDs learns per-series means but still needs a pipeline, and it ignores seasonality entirely."]}, "he": {"q": "אתם מתחילים פרויקט חיזוי ביקושים שבועי עבור רשת קמעונאית. מהו הבסיס (baseline) הראשון הנכון לבנות?", "options": ["עץ gradient boosting על כל הפיצ'רים הזמינים", "שכפול אותו שבוע משנה שעברה, בתיקון למגמה", "LSTM קטן שמאומן כמה epochs", "רגרסיית ridge על מזהי חנות ומוצר בקידוד one-hot"], "hint": "תפקידו של הבסיס הוא להיות מביך לניצחון, לא להיות טוב.", "explanation": "חיזוי naive עונתי עולה חצי יום עבודה, לא דורש תשתית אימון, ומייצר את המספר שכל מודל מאוחר יותר חייב לנצח — וגם קריאה כנה של כמה מהאות הוא פשוט עונתיות. בהרבה בעיות קמעונאות קשה להפתיע כמה קשה לנצח אותו, וזו בדיוק המידע שאתם רוצים לפני שאתם מתחייבים לרבעון של מידול.", "whyWrong": ["עץ boosting הוא צעד שני סביר, אבל הוא לא מספר לכם כמה מהאות הוא עונתיות טריוויאלית.", "LSTM מוסיף עלות אימון וכיוונון עוד לפני שאתם יודעים אם יש בכך צורך.", "ridge על מזהים לומד ממוצע לכל סדרה אך עדיין דורש צינור, והוא מתעלם לחלוטין מעונתיות."]}}, {"id": "int-006", "area": "interview", "topic": "when-not-to-use-ml", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["problem-framing", "business", "rules"], "answer": 3, "en": {"q": "Which of these is the WEAKEST candidate for a machine learning solution?", "options": ["Flagging suspicious payments among 3 million daily card transactions", "Routing free-text support tickets to the right internal team", "Forecasting next month's demand for 20,000 SKUs", "Deciding whether an order qualifies for free shipping under a published policy"], "hint": "One of these already has an exact, written-down answer.", "explanation": "Free shipping eligibility is defined by a policy someone wrote down: it is a deterministic rule with a known correct answer, so a model could only approximate it — less accurately, more expensively and far less auditably. ML earns its cost when the mapping from inputs to outputs is unknown, complex, and recoverable only from examples.", "whyWrong": ["Fraud patterns are unknown, adversarial and constantly changing — a textbook ML problem.", "Mapping free text to a team is a learned pattern that hand-written rules capture poorly.", "Demand depends on many interacting drivers with no closed-form rule to encode."]}, "he": {"q": "איזו מהבאות היא המועמדת החלשה ביותר לפתרון מבוסס למידת מכונה?", "options": ["סימון תשלומים חשודים מתוך 3 מיליון עסקאות כרטיס יומיות", "ניתוב פניות תמיכה בטקסט חופשי לצוות הפנימי הנכון", "חיזוי הביקוש בחודש הבא ל-20,000 מק\"טים", "הכרעה האם הזמנה זכאית למשלוח חינם לפי מדיניות מפורסמת"], "hint": "לאחת מהן כבר יש תשובה מדויקת וכתובה.", "explanation": "זכאות למשלוח חינם מוגדרת על ידי מדיניות שמישהו כתב: זהו כלל דטרמיניסטי עם תשובה נכונה ידועה, ולכן מודל יכול רק לקרב אותו — בדיוק נמוך יותר, בעלות גבוהה יותר ובשקיפות נמוכה בהרבה. למידת מכונה מצדיקה את עלותה כשההעתקה מקלטים לפלטים אינה ידועה, מורכבת, וניתנת לשחזור רק מדוגמאות.", "whyWrong": ["דפוסי הונאה אינם ידועים, יריביים ומשתנים כל הזמן — בעיית ML קלאסית.", "מיפוי טקסט חופשי לצוות הוא דפוס נלמד שכללים כתובים ידנית לוכדים בצורה גרועה.", "הביקוש תלוי בגורמים רבים שמשפיעים זה על זה, וללא נוסחה סגורה לקידוד."]}}, {"id": "int-007", "area": "interview", "topic": "model-not-learning", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["debugging", "training", "loss"], "answer": 2, "en": {"q": "A 10-class classifier's training loss sits flat at about 2.30 from step 0 and never moves. What is the first thing to try?", "options": ["Add dropout and weight decay to reduce overfitting", "Collect more labelled training data", "Try to drive the loss to zero on a single batch of 8 examples", "Increase depth so the model can express the target"], "hint": "2.30 is about ln(10) — what does that tell you the model is predicting?", "explanation": "A loss stuck at ln(10) = 2.303 means the model is emitting a uniform distribution: it is learning nothing at all. Overfitting one tiny batch is the fastest way to separate 'the optimization is broken' (bad learning rate, detached graph, frozen parameters, labels misaligned with inputs) from 'the data carries no signal'. If it cannot memorize 8 examples, the bug is in the code, not the dataset.", "whyWrong": ["Regularization fights overfitting, and this model is not fitting anything yet.", "More data cannot help a model that is not learning from the data it already has.", "Capacity is not the constraint when the loss has not moved from its initial value at all."]}, "he": {"q": "ההפסד באימון של מסווג ל-10 מחלקות תקוע על בערך 2.30 החל מצעד 0 ולא זז. מה הדבר הראשון שכדאי לנסות?", "options": ["להוסיף dropout ו-weight decay כדי להפחית התאמת יתר", "לאסוף עוד נתוני אימון מתויגים", "לנסות להוריד את ההפסד לאפס על אצווה בודדת של 8 דוגמאות", "להגדיל את העומק כדי שהמודל יוכל לבטא את היעד"], "hint": "2.30 הוא בערך ln(10) — מה זה מלמד על מה שהמודל מנבא?", "explanation": "הפסד שתקוע על ln(10) = 2.303 אומר שהמודל פולט התפלגות אחידה: הוא לא לומד דבר. התאמת יתר לאצווה זעירה אחת היא הדרך המהירה ביותר להפריד בין 'האופטימיזציה שבורה' (קצב למידה גרוע, גרף מנותק, פרמטרים קפואים, תוויות לא מיושרות לקלטים) לבין 'אין אות בנתונים'. אם המודל לא מצליח לשנן 8 דוגמאות, הבאג בקוד ולא בנתונים.", "whyWrong": ["רגולריזציה נלחמת בהתאמת יתר, והמודל הזה עדיין לא מתאים את עצמו לשום דבר.", "עוד נתונים לא יעזרו למודל שלא לומד מהנתונים שכבר יש לו.", "הקיבולת אינה האילוץ כאשר ההפסד כלל לא זז מהערך ההתחלתי שלו."]}}, {"id": "int-008", "area": "interview", "topic": "correlated-features", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["feature-selection", "collinearity", "misconception"], "answer": 3, "en": {"q": "A candidate says: 'These two features correlate at 0.95, so I dropped one — that can only help.' When is this clearly wrong?", "options": ["Always, because dropping any feature necessarily increases bias", "When the model is a decision tree, which cannot handle correlated inputs", "When the correlation was measured on the training set rather than the test set", "When their difference carries the signal, e.g. our price minus a competitor's"], "hint": "Two nearly identical numbers can still have a very informative gap.", "explanation": "Highly correlated does not mean redundant. If our price and a competitor's price move together but the margin between them drives churn, dropping either one destroys the feature the model actually needs. The misconception is treating correlation as a proxy for information content: collinearity inflates the variance of linear coefficients, but it does not mean one variable carries nothing the other lacks.", "whyWrong": ["Dropping a genuinely redundant feature can reduce variance at no bias cost at all.", "Trees handle correlated inputs fine; they simply split on whichever one helps at each node.", "Measuring correlation on the test set would itself be a leak, and it is not the issue here."]}, "he": {"q": "מועמד אומר: 'שני הפיצ'רים האלה מתואמים ב-0.95, אז השמטתי אחד מהם — זה יכול רק לעזור'. מתי זה בבירור שגוי?", "options": ["תמיד, כי השמטת פיצ'ר כלשהו בהכרח מגדילה את ההטיה", "כשהמודל הוא עץ החלטה, שאינו מסוגל להתמודד עם קלטים מתואמים", "כשהמתאם נמדד על סט האימון ולא על סט המבחן", "כשההפרש ביניהם הוא הנושא את האות, למשל המחיר שלנו פחות מחיר המתחרה"], "hint": "לשני מספרים כמעט זהים עדיין יכול להיות פער מאוד אינפורמטיבי.", "explanation": "מתאם גבוה אינו שקול לעודפות. אם המחיר שלנו ומחיר המתחרה נעים יחד אבל המרווח ביניהם הוא שמניע נטישה, השמטת אחד מהם הורסת בדיוק את הפיצ'ר שהמודל צריך. התפיסה השגויה היא להתייחס למתאם כאל פרוקסי לתוכן מידע: קולינאריות מנפחת את השונות של מקדמים לינאריים, אך אינה אומרת שמשתנה אחד לא נושא דבר שחסר לשני.", "whyWrong": ["השמטת פיצ'ר עודף באמת יכולה להקטין שונות בלי שום מחיר בהטיה.", "עצים מתמודדים היטב עם קלטים מתואמים; הם פשוט מפצלים לפי זה שעוזר בכל צומת.", "מדידת מתאם על סט המבחן היא בעצמה דליפה, וזו אינה הבעיה כאן."]}}, {"id": "int-009", "area": "interview", "topic": "open-ended-case", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["case-interview", "problem-framing", "churn"], "en": {"q": "In a case interview you are told: 'We want to use ML to reduce customer churn.' Walk me through how you would structure your first ten minutes.", "hint": "Before any model, find the decision the prediction is supposed to change.", "modelAnswer": "I would refuse to model anything until I know the decision: who acts on a churn score, what action they take, how many customers they can act on per week, and what a retained customer is worth against the cost of the intervention. That fixes the shape of the problem — a ranked list under a capacity constraint, not a calibrated probability for everyone. Then I define the label precisely: what counts as churn, over what horizon, measured from what point, and I check that every candidate feature was actually available at that point. Next I ask what data exists, how many churn events occur per month, and whether the label is even observable for the relevant segment. Only then do I propose a baseline, such as a tenure-and-usage heuristic, a primary offline metric like precision at the top k they can actually call, guardrails such as revenue and support load, and a live test with a holdout of untreated customers so we measure uplift rather than correlation.", "rubric": ["Starts from the business decision and the action taken, not from the model", "Defines the label and prediction horizon precisely, with an as-of feature cutoff", "Checks data availability, event volume and leakage before proposing methods", "Proposes a cheap baseline and a metric matched to the operational constraint (top-k capacity)", "Plans a live test with an untreated control so uplift, not correlation, is measured"]}, "he": {"q": "בראיון מקרה (case interview) אומרים לכם: 'אנחנו רוצים להשתמש ב-ML כדי להפחית נטישת לקוחות'. תארו כיצד תבנו את עשר הדקות הראשונות.", "hint": "לפני כל מודל, מצאו את ההחלטה שהחיזוי אמור לשנות.", "modelAnswer": "הייתי מסרב למדל משהו לפני שאני מבין את ההחלטה: מי פועל לפי ציון הנטישה, איזו פעולה הוא נוקט, בכמה לקוחות אפשר לטפל בשבוע, וכמה שווה לקוח שנשמר מול עלות ההתערבות. זה קובע את צורת הבעיה — רשימה מדורגת תחת אילוץ קיבולת, ולא הסתברות מכוילת לכל לקוח. אחר כך אני מגדיר את התווית בדיוק: מה נחשב נטישה, על פני איזה אופק זמן, נמדד מאיזו נקודה, ובודק שכל פיצ'ר מועמד באמת היה זמין באותה נקודה. בשלב הבא אני שואל אילו נתונים קיימים, כמה אירועי נטישה יש בחודש, והאם התווית בכלל נצפית עבור הפלח הרלוונטי. רק אז אני מציע בסיס, למשל היוריסטיקה של ותק ושימוש, מדד אופליין ראשי כמו precision ב-k העליונים שאליהם באמת אפשר להתקשר, מדדי שמירה (guardrails) כמו הכנסה ועומס תמיכה, ומבחן חי עם קבוצת ביקורת שלא מטופלת כדי שנמדוד uplift ולא מתאם.", "rubric": ["מתחיל מההחלטה העסקית ומהפעולה הננקטת, ולא מהמודל", "מגדיר בדיוק את התווית ואת אופק החיזוי, כולל נקודת חתך as-of לפיצ'רים", "בודק זמינות נתונים, נפח אירועים ודליפה לפני שהוא מציע שיטות", "מציע בסיס זול ומדד שמותאם לאילוץ התפעולי (קיבולת top-k)", "מתכנן מבחן חי עם קבוצת ביקורת לא מטופלת כדי למדוד uplift ולא מתאם"]}}, {"id": "int-010", "area": "interview", "topic": "system-design-fraud", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["system-design", "fraud", "serving"], "en": {"q": "Design a real-time card fraud detection system for 5,000 transactions per second. Cover the label, the features, the serving path, and how you would evaluate it.", "hint": "Two things dominate this design: the review team's capacity, and what happens to transactions you block.", "modelAnswer": "The label is 'confirmed fraud', which arrives from chargebacks weeks later and from manual review sooner, so training data is both delayed and biased: transactions we block never produce a ground-truth outcome, which makes naive retraining self-confirming. Features split into request-time attributes (amount, merchant category, country, device) and streaming aggregates such as spend and distinct-merchant counts for this card over the last minute, hour and 30 days, served from a feature store with point-in-time correct training joins and a streaming path that keeps the counters fresh within seconds. Serving is online and synchronous with a hard budget of roughly 50-100 ms at p99, so I would run a lightweight gradient-boosted model in-process or behind a colocated service, with a cached rule-based fallback if the model or the feature store times out. Evaluation is cost-based rather than accuracy-based: fix the alert volume at the review team's daily capacity and maximize recall at that budget, weighing fraud value caught against false-positive friction on good customers. In production I would monitor score distribution and feature freshness continuously, hold out a small unblocked control slice to keep labels unbiased, and retrain at a cadence that reflects how fast fraudsters adapt.", "rubric": ["Notes delayed and biased labels, including that blocked transactions never get outcomes", "Specifies streaming aggregate features and point-in-time correct training joins", "Gives a concrete latency budget, an online serving path, and a fallback when it fails", "Chooses a cost- or capacity-aware metric (recall at fixed alert volume) over accuracy", "Covers monitoring, adversarial adaptation and retraining cadence"]}, "he": {"q": "תכננו מערכת לזיהוי הונאות בכרטיסי אשראי בזמן אמת עבור 5,000 עסקאות בשנייה. התייחסו לתווית, לפיצ'רים, לנתיב ההגשה, ולאופן שבו תעריכו אותה.", "hint": "שני דברים שולטים בתכנון הזה: קיבולת צוות הבדיקה, ומה קורה לעסקאות שחסמתם.", "modelAnswer": "התווית היא 'הונאה מאושרת', שמגיעה מ-chargebacks כמה שבועות מאוחר יותר ומבדיקה ידנית מוקדם יותר, ולכן נתוני האימון גם מעוכבים וגם מוטים: עסקאות שחסמנו לעולם לא מייצרות תוצאת אמת, מה שהופך אימון מחדש נאיבי למאשש את עצמו. הפיצ'רים מתחלקים לתכונות זמן-בקשה (סכום, קטגוריית סוחר, מדינה, מכשיר) ולאגרגציות זרימה כמו סכום ההוצאה ומספר הסוחרים הייחודיים לכרטיס הזה בדקה, בשעה וב-30 הימים האחרונים, המוגשות מ-feature store עם חיבורי אימון נכונים מבחינת point-in-time ונתיב streaming ששומר על מוני העדכון טריים בתוך שניות. ההגשה מקוונת וסינכרונית עם תקציב קשיח של כ-50 עד 100 מילישניות ב-p99, ולכן הייתי מריץ מודל gradient boosting קל בתוך התהליך או מאחורי שירות שממוקם באותו מקום, עם גיבוי מבוסס כללים ב-cache אם המודל או ה-feature store חורגים מהזמן. ההערכה מבוססת עלות ולא דיוק: מקבעים את נפח ההתראות לקיבולת היומית של צוות הבדיקה וממקסמים recall בתקציב הזה, תוך שקלול שווי ההונאה שנתפסה מול החיכוך שנגרם ללקוחות טובים בהתראות שווא. בפרודקשן הייתי מנטר ברציפות את התפלגות הציונים ואת טריות הפיצ'רים, משאיר פלח ביקורת קטן שאינו נחסם כדי לשמור על תוויות לא מוטות, ומאמן מחדש בקצב שמשקף את מהירות ההסתגלות של הרמאים.", "rubric": ["מציין תוויות מעוכבות ומוטות, כולל כך שעסקאות שנחסמו לעולם לא מקבלות תוצאה", "מפרט פיצ'רים מבוססי אגרגציות זרימה וחיבורי אימון נכונים מבחינת point-in-time", "נותן תקציב השהיה קונקרטי, נתיב הגשה מקוון, וגיבוי למקרה כשל", "בוחר מדד מודע לעלות או לקיבולת (recall בנפח התראות קבוע) במקום דיוק", "מכסה ניטור, הסתגלות יריבית וקצב אימון מחדש"]}}, {"id": "int-011", "area": "interview", "topic": "explaining-to-stakeholders", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["communication", "interpretability", "boosting"], "en": {"q": "A VP with no technical background asks how your gradient-boosted model decides who gets a retention discount. Explain it without jargon, and say what you would show them.", "hint": "Explain the shape of the reasoning, then show evidence they can argue with.", "modelAnswer": "I would say the model is a large committee of very simple rules — each one a question like 'has this customer logged in this month?' — where every new rule is added specifically to fix the mistakes the earlier ones made, and the final score is their weighted vote. It does not decide anything: it ranks customers by how likely they look to leave, and we choose the cutoff based on how many discounts we can afford. Then I would show three things: the handful of factors that drive the score overall, two or three real customers with the specific reasons their score came out high, and the model's track record on last quarter's customers it had never seen. I would be explicit that these factors are patterns and not causes — a customer contacting support often is a signal of risk, not proof that support calls cause churn — and I would agree the cutoff with them in business terms, as a budget and an expected number of saves rather than a probability.", "rubric": ["Uses a concrete non-technical analogy for boosting: many small rules, each correcting earlier errors", "Distinguishes ranking from deciding, and puts the threshold in the stakeholder's hands", "Proposes showing global drivers plus individual case explanations", "Explicitly flags correlation versus causation and the model's limits", "Grounds the discussion in a business quantity (budget, expected saves) rather th
