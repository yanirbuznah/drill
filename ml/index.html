 לכל טוקן?", "options": ["‏40B סך הכול, 12B פעילים", "‏40B סך הכול, 40B פעילים", "‏24B סך הכול, 12B פעילים", "‏40B סך הכול, 10B פעילים"], "hint": "הסך הכול סופר את כל המומחים; הפעילים סופרים רק את המומחים שהנתב בוחר, בתוספת כל החלקים המשותפים.", "explanation": "סך הכול = 8B + 16 x 2B = 40B. לכל טוקן הנתב בוחר 2 מומחים, ולכן הפעילים = 8B + 2 x 2B = 12B, ומספר הפרמטרים הפעילים הוא שקובע את ה-FLOPs לכל טוקן. הזיכרון עדיין חייב להחזיק את כל 40B — זו העסקה המרכזית ב-MoE: חישוב זול תמורת זיכרון יקר. מוסיפים גם פונקציית עזר לאיזון עומסים (load balancing) כדי שהנתב לא יתכנס לכמה מומחים מועדפים.", "whyWrong": ["זה תיאור של מודל צפוף; כל הרעיון בניתוב top-k הוא שרוב המומחים אינם פעילים עבור טוקן נתון.", "‏24B סופר רק 8 מתוך 16 המומחים, אך כל מומחה נספר בסך הפרמטרים.", "‏10B מוסיף רק מומחה אחד של 2B; ניתוב top-2 מפעיל שניים, כלומר 8B + 4B = 12B."]}}, {"id": "llm-007", "area": "llm", "topic": "chain-of-thought", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["chain-of-thought", "test-time-compute", "prompting"], "answer": 2, "en": {"q": "Why does chain-of-thought prompting help on multi-step arithmetic and logic?", "options": ["It retrieves worked examples from the training corpus at run time", "It raises the effective temperature, exploring more candidate answers", "It spends more forward passes, letting intermediate results be written down", "It nudges the model's weights toward step-by-step reasoning"], "hint": "A transformer does a bounded amount of computation per token. How do you give it more?", "explanation": "A transformer performs a fixed amount of computation per generated token, so demanding the answer in one token caps the reasoning depth available. Emitting intermediate steps turns the context window into a scratchpad: each step conditions on the previous ones, and total test-time compute scales with the number of tokens produced. This is the basis of the wider test-time compute idea, including sampling several chains and voting.", "whyWrong": ["Nothing is retrieved; the model only conditions on the prompt and on tokens it has just generated.", "Decoding parameters are unaffected by the prompt, and extra randomness would hurt arithmetic.", "Prompting never updates weights; only finetuning changes the parameters."]}, "he": {"q": "מדוע prompting בסגנון chain-of-thought עוזר בחשבון ובלוגיקה רב-שלביים?", "options": ["הוא מאחזר דוגמאות פתורות מקורפוס האימון בזמן ריצה", "הוא מעלה את הטמפרטורה האפקטיבית ובוחן יותר תשובות מועמדות", "הוא משקיע יותר מעברים קדימה ומאפשר לרשום את התוצאות הביניים", "הוא מטה את משקלי המודל לכיוון חשיבה שלב-אחר-שלב"], "hint": "טרנספורמר מבצע כמות חישוב חסומה לכל טוקן. איך נותנים לו יותר?", "explanation": "טרנספורמר מבצע כמות חישוב קבועה לכל טוקן שנוצר, ולכן דרישה לתשובה בטוקן אחד חוסמת את עומק החשיבה האפשרי. פליטת שלבי ביניים הופכת את חלון ההקשר ל-scratchpad: כל שלב מותנה בקודמיו, וסך החישוב בזמן ההסקה גדל עם מספר הטוקנים שנוצרו. זה הבסיס לרעיון הרחב של test-time compute, ובכלל זה דגימת כמה שרשראות והצבעה ביניהן.", "whyWrong": ["שום דבר אינו מאוחזר; המודל מתנה רק על הפרומפט ועל הטוקנים שהוא עצמו יצר.", "פרמטרי הפענוח אינם מושפעים מהפרומפט, ואקראיות נוספת דווקא תזיק בחשבון.", "‏prompting לעולם אינו מעדכן משקלים; רק כיוונון עדין משנה את הפרמטרים."]}}, {"id": "llm-008", "area": "llm", "topic": "scaling-laws", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["scaling-laws", "chinchilla", "compute-optimal"], "answer": 0, "en": {"q": "Chinchilla-style compute-optimal training says that, for a fixed training compute budget, you should:", "options": ["Scale parameters and training tokens together, in roughly equal proportion", "Make the model as large as memory allows and train for a single epoch", "Fix the token budget and spend every extra unit of compute on parameters", "Grow the dataset while keeping the model small, since data is cheaper"], "hint": "Two knobs multiply into the compute budget; the finding was about their ratio, not either one alone.", "explanation": "With compute roughly 6 N D, the loss is minimized when N and D are scaled at about the same rate, which placed several earlier large models in the undertrained regime: too many parameters for too few tokens. Note this is optimal for training compute only; if inference cost matters, a smaller model trained past the Chinchilla ratio is usually the better deployment choice.", "whyWrong": ["That is the pre-Chinchilla habit the analysis criticized: very large models starved of data.", "Holding the data fixed while growing parameters is exactly the imbalance the scaling law rules out.", "The prescription is balance; shrinking the model far below the optimum wastes the budget too."]}, "he": {"q": "אימון אופטימלי-לחישוב בסגנון Chinchilla אומר שבתקציב חישוב אימון נתון כדאי:", "options": ["להגדיל את מספר הפרמטרים ואת מספר טוקני האימון יחד, בערך באותו יחס", "לבנות מודל גדול ככל שהזיכרון מרשה ולאמן אותו epoch אחד", "לקבע את תקציב הטוקנים ולהשקיע כל יחידת חישוב נוספת בפרמטרים", "להגדיל את מאגר הנתונים ולהשאיר את המודל קטן, כי נתונים זולים יותר"], "hint": "שני מדדים מוכפלים זה בזה לתקציב החישוב; הממצא נגע ליחס ביניהם ולא לאחד מהם בנפרד.", "explanation": "כאשר החישוב הוא בקירוב 6 N D, ה-loss ממוזער כאשר N ו-D גדלים בערך באותו קצב — מה שהציב כמה מודלים גדולים מוקדמים במשטר של תת-אימון: יותר מדי פרמטרים מול מעט מדי טוקנים. שימו לב שזו אופטימליות לחישוב האימון בלבד; אם עלות ההסקה חשובה, מודל קטן יותר שאומן מעבר ליחס Chinchilla הוא בדרך כלל בחירת הפריסה העדיפה.", "whyWrong": ["זה בדיוק ההרגל שקדם ל-Chinchilla וזכה לביקורת: מודלים ענקיים מורעבים מנתונים.", "קיבוע הנתונים תוך הגדלת הפרמטרים הוא בדיוק חוסר האיזון שחוק הסקיילינג פוסל.", "ההמלצה היא איזון; הקטנת המודל הרבה מתחת לאופטימום גם היא בזבוז של התקציב."]}}, {"id": "llm-009", "area": "llm", "topic": "training-stages", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["sft", "rlhf", "dpo"], "answer": 1, "en": {"q": "Match each training stage to what it optimizes. Which pairing is right?", "options": ["SFT maximizes a learned reward; RLHF maximizes the likelihood of demonstrations", "Pretraining maximizes next-token likelihood; SFT does the same on curated demonstrations", "RLHF maximizes the likelihood of preferred answers directly, with no reward signal", "DPO trains a reward model first, then samples from the policy to improve it"], "hint": "Which two stages are literally the same loss on different data?", "explanation": "Pretraining and SFT share one objective, cross-entropy on next-token prediction; only the data changes, from raw web text to curated instruction-response pairs. RLHF then maximizes a learned reward model with a KL penalty toward the SFT policy, which can express preferences no single demonstration can. DPO reaches a similar place with a closed-form loss on preference pairs, with no explicit reward model and no online sampling.", "whyWrong": ["The two are swapped: SFT is the likelihood stage and RLHF is the reward-maximizing one.", "RLHF is defined by its reward model; the reward-model-free preference loss is DPO.", "DPO's selling point is skipping both the separate reward model and the online sampling loop."]}, "he": {"q": "התאימו כל שלב אימון למה שהוא ממטב. איזו התאמה נכונה?", "options": ["‏SFT ממקסם תגמול נלמד; RLHF ממקסם את הסבירות של הדגמות", "אימון מקדים ממקסם סבירות של הטוקן הבא; SFT עושה בדיוק אותו דבר על הדגמות מתוקננות", "‏RLHF ממקסם ישירות את הסבירות של התשובות המועדפות, בלי אות תגמול", "‏DPO מאמן קודם מודל תגמול, ואז דוגם מהמדיניות כדי לשפר אותה"], "hint": "אילו שני שלבים הם ממש אותה פונקציית loss על נתונים שונים?", "explanation": "האימון המקדים ו-SFT חולקים פונקציית מטרה אחת — cross-entropy על ניבוי הטוקן הבא; רק הנתונים משתנים, מטקסט גולמי מהרשת לזוגות הוראה-תשובה מתוקננים. RLHF ממקסם לאחר מכן מודל תגמול נלמד עם קנס KL כלפי מדיניות ה-SFT, וכך אפשר לבטא העדפות ששום הדגמה בודדת אינה מבטאת. DPO מגיע למקום דומה עם loss בצורה סגורה על זוגות העדפה, בלי מודל תגמול מפורש ובלי דגימה מקוונת.", "whyWrong": ["השניים הוחלפו: SFT הוא שלב הסבירות ו-RLHF הוא זה שממקסם תגמול.", "‏RLHF מוגדר על ידי מודל התגמול שלו; ה-loss על העדפות בלי מודל תגמול הוא DPO.", "יתרון המכירה של DPO הוא בדיוק ויתור גם על מודל התגמול הנפרד וגם על לולאת הדגימה המקוונת."]}}, {"id": "llm-010", "area": "llm", "topic": "reward-model", "difficulty": 2, "type": "mcq", "hardnessSource": "recall", "tags": ["reward-model", "rlhf", "preferences"], "answer": 3, "en": {"q": "How is a standard RLHF reward model trained?", "options": ["Regression onto 1-5 human quality scores with a mean squared error loss", "Classification of responses as safe or unsafe, using the logit as the reward", "Distillation from a stronger model's token-level log-probabilities", "A pairwise ranking loss, maximizing log-sigmoid of the score gap"], "hint": "Humans are far more reliable at comparing two answers than at scoring one in isolation.", "explanation": "The standard recipe takes a base model with a scalar head and trains it on (chosen, rejected) pairs under the Bradley-Terry loss, -log sigmoid(r(chosen) - r(rejected)). Only reward differences are identified, so the absolute scale is arbitrary and scores are not comparable across prompts. Pairwise data is used because absolute human ratings are noisy and drift between annotators.", "whyWrong": ["Absolute numeric ratings are noisy and inconsistent between annotators, which is why comparisons are collected instead.", "A safety classifier is a separate component; a reward model scores general preference, not a binary label.", "That is distillation, a supervised objective that needs no human preference data at all."]}, "he": {"q": "כיצד מאומן מודל תגמול סטנדרטי ב-RLHF?", "options": ["רגרסיה על ציוני איכות אנושיים בסולם 1-5 עם loss של שגיאה ריבועית", "סיווג תשובות כבטוחות או לא בטוחות, כאשר הלוגיט משמש כתגמול", "זיקוק (distillation) מלוג-ההסתברויות ברמת הטוקן של מודל חזק יותר", "‏loss של דירוג זוגות, שממקסם log-sigmoid של הפרש הציונים"], "hint": "בני אדם אמינים הרבה יותר בהשוואה בין שתי תשובות מאשר במתן ציון לתשובה בודדת.", "explanation": "המתכון הסטנדרטי לוקח מודל בסיס עם ראש סקלרי ומאמן אותו על זוגות (נבחרת, נדחית) תחת loss מסוג Bradley-Terry, כלומר ‎-log sigmoid(r(נבחרת) - r(נדחית)). רק הפרשי התגמול מזוהים, ולכן הסקאלה המוחלטת שרירותית והציונים אינם ברי-השוואה בין פרומפטים שונים. משתמשים בנתונים זוגיים מפני שדירוגים מוחלטים של בני אדם רועשים ונודדים בין מתייגים.", "whyWrong": ["דירוגים מספריים מוחלטים רועשים ולא עקביים בין מתייגים, ולכן אוספים במקומם השוואות.", "מסווג בטיחות הוא רכיב נפרד; מודל תגמול מדרג העדפה כללית ולא תווית בינארית.", "זהו זיקוק — פונקציית מטרה מונחית שאינה זקוקה כלל לנתוני העדפה אנושיים."]}}, {"id": "llm-011", "area": "llm", "topic": "ppo-vs-dpo", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["dpo", "ppo", "alignment"], "en": {"q": "You have preference data and an SFT model. Argue for PPO versus DPO, and say what you give up with each.", "hint": "One of the two needs to sample from the policy during training. Think about what that enables and what it costs.", "modelAnswer": "DPO reparameterizes the KL-regularized RLHF objective so that the policy defines its own implicit reward, giving a plain supervised loss on (chosen, rejected) pairs: no reward model, no rollouts, a stable and much cheaper training loop with few moving parts. Its weakness is that it only ever learns from fixed offline pairs, so it cannot explore, cannot score new samples the current policy produces, and degrades when the preference data is off-distribution for that policy or when beta is mis-set. PPO keeps an explicit reward model, so it can score fresh on-policy generations, exploit best-of-n style signal, mix in rule-based or verifiable rewards, and hold a KL leash to the reference model. The price is a heavy system with several models in memory, real hyperparameter sensitivity, and reward hacking, where the policy exploits flaws in the reward model rather than improving. A common compromise is DPO first for cheap alignment, then online RL where a reliable or verifiable reward exists.", "rubric": ["DPO is offline and reward-model-free, derived from the same KL-regularized objective", "DPO is cheaper and more stable but cannot use on-policy samples or explore", "PPO's reward model can score new generations, enabling exploration and verifiable rewards", "PPO costs compute and complexity and risks reward hacking", "Both need regularization toward the reference policy (KL penalty or beta)"]}, "he": {"q": "יש לכם נתוני העדפה ומודל SFT. טענו בעד PPO מול DPO, ואמרו על מה מוותרים בכל אחד מהם.", "hint": "אחד מהשניים חייב לדגום מהמדיניות בזמן האימון. חשבו מה זה מאפשר ומה זה עולה.", "modelAnswer": "‏DPO מבצע פרמטריזציה מחדש של מטרת ה-RLHF המרוסנת ב-KL, כך שהמדיניות מגדירה בעצמה תגמול משתמע, ומתקבל loss מונחה פשוט על זוגות (נבחרת, נדחית): בלי מודל תגמול, בלי rollouts, ועם לולאת אימון יציבה וזולה בהרבה. החולשה שלו היא שהוא לומד רק מזוגות לא-מקוונים קבועים, ולכן אינו יכול לחקור, אינו יכול לדרג דגימות חדשות שהמדיניות הנוכחית מייצרת, ומידרדר כשנתוני ההעדפה אינם מהתפלגות המדיניות הזו או כשה-beta מכוון לא נכון. ב-PPO נשמר מודל תגמול מפורש, ולכן אפשר לדרג יצירות חדשות on-policy, לנצל אות בסגנון best-of-n, לשלב תגמולים מבוססי-חוקים או ניתנים לאימות, ולהחזיק רסן KL כלפי מודל הייחוס. המחיר הוא מערכת כבדה עם כמה מודלים בזיכרון, רגישות אמיתית להיפר-פרמטרים, ו-reward hacking שבו המדיניות מנצלת פגמים במודל התגמול במקום להשתפר. פשרה נפוצה היא DPO תחילה ליישור זול, ולאחר מכן RL מקוון היכן שקיים תגמול אמין או ניתן לאימות.", "rubric": ["‏DPO הוא לא-מקוון ובלי מודל תגמול, ונגזר מאותה מטרה מרוסנת ב-KL", "‏DPO זול ויציב יותר אך אינו יכול להשתמש בדגימות on-policy או לחקור", "מודל התגמול של PPO יכול לדרג יצירות חדשות, ומאפשר חקירה ותגמולים ניתנים לאימות", "‏PPO עולה בחישוב ובמורכבות ומסכן ב-reward hacking", "שניהם זקוקים לריסון כלפי מדיניות הייחוס (קנס KL או beta)"]}}, {"id": "llm-012", "area": "llm", "topic": "lora", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["lora", "qlora", "peft"], "answer": 1, "en": {"q": "Which claim about LoRA finetuning is accurate?", "options": ["It reduces inference latency, since fewer weights have to be multiplied", "It saves memory mainly by removing optimizer state and gradients for frozen weights", "It shrinks the base model, so a 70B model needs half the memory", "It must stay separate at inference and cannot be folded into the base weights"], "hint": "Count what an optimizer like Adam has to store for every trainable parameter.", "explanation": "LoRA freezes W and learns a low-rank update B A, so gradients and Adam's two moment buffers exist only for the small adapter, which is where most of the finetuning memory saving comes from. The frozen base weights are still fully resident, and activation memory is largely unchanged. QLoRA supplies the other half: hold the frozen base in 4-bit NF4 and train bf16 adapters on top of it.", "whyWrong": ["At inference B A can be merged into W for exactly the original cost; unmerged it is marginally slower.", "The base model is frozen, not compressed; shrinking it is QLoRA's 4-bit quantization, not LoRA.", "The update is a plain additive matrix, so merging W + B A into one weight matrix is standard practice."]}, "he": {"q": "איזו טענה על כיוונון עדין עם LoRA מדויקת?", "options": ["הוא מקטין את זמן ההשהיה בהסקה, כי צריך להכפיל פחות משקלים", "הוא חוסך זיכרון בעיקר בכך שאין מצב אופטימייזר וגרדיאנטים למשקלים הקפואים", "הוא מכווץ את מודל הבסיס, ולכן מודל 70B דורש חצי מהזיכרון", "הוא חייב להישאר נפרד בזמן הסקה ואי אפשר למזג אותו למשקלי הבסיס"], "hint": "ספרו מה אופטימייזר כמו Adam חייב לשמור עבור כל פרמטר בר-אימון.", "explanation": "‏LoRA מקפיא את W ולומד עדכון בדרגה נמוכה B A, ולכן גרדיאנטים ושני מאגרי המומנטים של Adam קיימים רק עבור המתאם הקטן — ומשם מגיע רוב החיסכון בזיכרון בכיוונון העדין. משקלי הבסיס הקפואים עדיין יושבים במלואם בזיכרון, וזיכרון האקטיבציות כמעט אינו משתנה. QLoRA מספק את החצי השני: להחזיק את הבסיס הקפוא ב-4 ביט NF4 ולאמן מעליו מתאמים ב-bf16.", "whyWrong": ["בזמן הסקה אפשר למזג את B A לתוך W ולקבל בדיוק את העלות המקורית; בלי מיזוג זה מעט איטי יותר.", "מודל הבסיס קפוא ולא דחוס; הכיווץ שייך לקוונטיזציה ב-4 ביט של QLoRA ולא ל-LoRA.", "העדכון הוא מטריצה חיבורית פשוטה, ולכן מיזוג W + B A למטריצת משקלים אחת הוא נוהג מקובל."]}}, {"id": "llm-013", "area": "llm", "topic": "quantization", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["quantization", "int8", "outliers"], "answer": 3, "en": {"q": "You quantize a 13B model to int8 per-tensor including activations and quality collapses, while int8 weight-only was fine. Most likely cause?", "options": ["Rounding error in the weights accumulating across layers", "int8 cannot represent negative values without a floating offset", "The embedding layer has to be kept in fp32 in any scheme", "A few activation channels carry huge outliers that stretch the scale"], "hint": "The difference between the two setups is which tensor got quantized, not how many bits were used.", "explanation": "Transformer activations contain a handful of channels whose magnitudes are orders larger than the rest; a single per-tensor scale then spends almost all int8 levels on those outliers and crushes everything else into a few values. Fixes keep outlier channels in higher precision (LLM.int8), migrate the difficulty into the weights (SmoothQuant), or quantize per-channel and per-token instead of per-tensor. Weight distributions are far better behaved, which is why weight-only quantization survives even at 4 bits.", "whyWrong": ["Weight rounding error is small and largely cancels, and weight-only int8 already proved the weights are fine.", "Signed int8 covers -128..127, and asymmetric schemes carry an integer zero-point anyway.", "Embeddings are usually among the easiest tensors to quantize, and that would not explain the weight-only success."]}, "he": {"q": "קוונטטתם מודל 13B ל-int8 ברמת טנזור כולל אקטיבציות והאיכות קרסה, בעוד שקוונטיזציה של משקלים בלבד ב-int8 עבדה מצוין. מה הסיבה הסבירה?", "options": ["שגיאת עיגול במשקלים שמצטברת לאורך השכבות", "‏int8 אינו יכול לייצג ערכים שליליים בלי היסט צף", "שכבת ה-embedding חייבת להישאר ב-fp32 בכל שיטה", "כמה ערוצי אקטיבציה בודדים נושאים חריגים ענקיים שמותחים את הסקאלה"], "hint": "ההבדל בין שתי ההגדרות הוא איזה טנזור קוונטט, ולא כמה ביטים שימשו.", "explanation": "באקטיבציות של טרנספורמרים יש קומץ ערוצים שגודלם גדול בסדרי גודל מכל היתר; סקאלה יחידה לכל הטנזור מבזבזת אז כמעט את כל רמות ה-int8 על החריגים האלה ומועכת את כל השאר לכמה ערכים בודדים. הפתרונות שומרים את ערוצי החריגים בדיוק גבוה יותר (LLM.int8), מעבירים את הקושי אל המשקלים (SmoothQuant), או מקוונטטים לכל ערוץ ולכל טוקן במקום לכל טנזור. התפלגות המשקלים מתנהגת הרבה יותר יפה, ולכן קוונטיזציה של משקלים בלבד שורדת אפילו ב-4 ביט.", "whyWrong": ["שגיאת העיגול במשקלים קטנה ובעיקר מתקזזת, וקוונטיזציית משקלים בלבד ב-int8 כבר הוכיחה שהמשקלים בסדר.", "‏int8 מסומן מכסה ‎-128..127, ובשיטות אסימטריות יש ממילא נקודת אפס שלמה.", "‏embeddings הם בדרך כלל מהטנזורים הקלים ביותר לקוונטיזציה, וזה גם לא היה מסביר את ההצלחה במשקלים בלבד."]}}, {"id": "llm-014", "area": "llm", "topic": "decoding-parameters", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["decoding", "top-p", "temperature"], "answer": 0, "en": {"q": "What is the difference between top-k and top-p (nucleus) sampling?", "options": ["top-k keeps a fixed number of tokens; top-p keeps a variable set covering mass p", "top-k samples k tokens and averages them; top-p sums all probabilities above p", "top-k is applied before the softmax, while top-p is applied after it", "top-k is deterministic, while top-p is stochastic"], "hint": "One threshold is a count, the other is an amount of probability mass.", "explanation": "top-k always keeps the k most likely tokens, which is too many when the distribution is peaked and too few when it is flat. top-p keeps the smallest set whose cumulative probability reaches p, so the candidate set adapts to the model's confidence at each step. Both renormalize before sampling, and both are usually combined with temperature, which rescales the logits first.", "whyWrong": ["Nothing is averaged: both methods truncate a candidate set and then sample exactly one token from it.", "Both operate on the probability distribution, that is, after the softmax has been applied.", "Both are stochastic; the deterministic choice is greedy decoding, which is top-k with k = 1."]}, "he": {"q": "מה ההבדל בין דגימת top-k לבין דגימת top-p (nucleus)?", "options": ["‏top-k שומר מספר קבוע של טוקנים; top-p שומר קבוצה משתנה שמכסה מסה p", "‏top-k דוגם k טוקנים וממצע אותם; top-p מסכם את כל ההסתברויות מעל p", "‏top-k מופעל לפני ה-softmax, ואילו top-p מופעל אחריו", "‏top-k הוא דטרמיניסטי, ואילו top-p הוא אקראי"], "hint": "סף אחד הוא ספירה, והשני הוא כמות של מסת הסתברות.", "explanation": "‏top-k שומר תמיד את k הטוקנים הסבירים ביותר — יותר מדי כשההתפלגות חדה ומעט מדי כשהיא שטוחה. top-p שומר את הקבוצה הקטנה ביותר שההסתברות המצטברת שלה מגיעה ל-p, כך שקבוצת המועמדים מסתגלת לביטחון של המודל בכל צעד. שניהם מנרמלים מחדש לפני הדגימה, ושניהם משולבים בדרך כלל עם טמפרטורה, שמשנה קודם את קנה המידה של הלוגיטים.", "whyWrong": ["שום דבר אינו ממוצע: שתי השיטות קוטמות קבוצת מועמדים ואז דוגמות ממנה טוקן אחד בדיוק.", "שתיהן פועלות על התפלגות ההסתברות, כלומר אחרי הפעלת ה-softmax.", "שתיהן אקראיות; הבחירה הדטרמיניסטית היא פענוח חמדני, שהוא top-k עם k = 1."]}}, {"id": "llm-015", "area": "llm", "topic": "speculative-decoding", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["speculative-decoding", "inference", "latency"], "answer": 2, "en": {"q": "Speculative decoding with a small draft model and correct verification changes what, exactly?", "options": ["Quality drops slightly, in exchange for a large latency win", "Total FLOPs drop, because the big model runs on fewer tokens", "Latency drops while the sampled output distribution stays unchanged", "Throughput rises, but only when the batch size is already large"], "hint": "The verification step is designed so the accept/reject rule preserves something exactly.", "explanation": "The draft model proposes several tokens, the target model scores them all in one parallel forward pass, and an accept/reject rule provably yields samples from the target model's own distribution. So outputs are distributionally identical to plain sampling from the target, and the win is wall-clock latency: memory-bound decoding verifies many tokens per weight read. It costs extra total FLOPs, and its benefit shrinks at large batch sizes.", "whyWrong": ["The whole point of the verification rule is that there is no quality loss; approximate variants are a separate choice.", "FLOPs go up: the draft model runs too, and rejected tokens are computed and then thrown away.", "It is the opposite: the gain is largest at small batch sizes, where decoding is memory-bandwidth bound."]}, "he": {"q": "מה בדיוק משנה פענוח ספקולטיבי עם מודל טיוטה קטן ואימות תקין?", "options": ["האיכות יורדת מעט, בתמורה לשיפור גדול בזמן ההשהיה", "סך ה-FLOPs יורד, כי המודל הגדול רץ על פחות טוקנים", "זמן ההשהיה יורד בעוד התפלגות הפלט הנדגם נשארת ללא שינוי", "התפוקה עולה, אבל רק כשגודל האצווה כבר גדול"], "hint": "שלב האימות תוכנן כך שכלל הקבלה/דחייה משמר משהו במדויק.", "explanation": "מודל הטיוטה מציע כמה טוקנים, מודל המטרה מדרג את כולם במעבר קדימה מקבילי אחד, וכלל קבלה/דחייה מבטיח הוכחית דגימה מהתפלגות מודל המטרה עצמו. לכן הפלטים זהים התפלגותית לדגימה רגילה ממודל המטרה, והרווח הוא בזמן ההשהיה בפועל: פענוח חסום-זיכרון מאמת הרבה טוקנים לכל קריאת משקלים. המחיר הוא יותר FLOPs כוללים, והתועלת מצטמצמת באצוות גדולות.", "whyWrong": ["כל הרעיון בכלל האימות הוא שאין אובדן איכות; גרסאות מקורבות הן בחירה נפרדת.", "מספר ה-FLOPs דווקא עולה: גם מודל הטיוטה רץ, וטוקנים שנדחו חושבו ונזרקו.", "ההפך הוא הנכון: הרווח גדול ביותר באצוות קטנות, שבהן הפענוח חסום ברוחב פס של זיכרון."]}}, {"id": "llm-016", "area": "llm", "topic": "prefill-vs-decode", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["inference", "batching", "throughput"], "en": {"q": "Describe the prefill and decode phases of LLM serving. What limits each, and how does batching affect latency versus throughput?", "hint": "One phase processes many tokens at once, the other one token at a time. Which hardware resource does each exhaust?", "modelAnswer": "Prefill pushes the whole prompt through the model in one parallel pass, so arithmetic intensity is high and it is compute-bound, with cost growing in prompt length and quadratically in the attention part. Decode then emits one token per step per sequence, reading all model weights and the whole KV cache to produce that single token, so it is memory-bandwidth bound and leaves the tensor cores mostly idle. Batching is the cure for decode: several sequences share one weight read, so throughput rises almost for free until KV cache memory runs out or the batch becomes compute-bound. The cost is latency, since a request waits to be scheduled and then competes for bandwidth, so time-to-first-token and inter-token latency both degrade as the batch grows. Real systems use continuous batching, a paged KV cache, and separate or prioritized scheduling of prefill and decode so a long prompt does not stall everyone else's token stream.", "rubric": ["Prefill is parallel over the prompt and compute-bound", "Decode produces one token at a time and is memory-bandwidth bound", "Batching amortizes the weight read and raises throughput", "KV cache memory bounds the achievable batch size", "Bigger batches trade per-request latency (TTFT / inter-token) for throughput"]}, "he": {"q": "תארו את שלבי ה-prefill וה-decode בהגשת מודל שפה. מה חוסם כל אחד מהם, וכיצד משפיעה עבודה באצוות על השהיה מול תפוקה?", "hint": "שלב אחד מעבד הרבה טוקנים בבת אחת, והשני טוקן בכל פעם. איזה משאב חומרה כל אחד ממצה?", "modelAnswer": "‏prefill מעביר את כל הפרומפט דרך המודל במעבר מקבילי אחד, ולכן עצימות החישוב גבוהה והוא חסום-חישוב, כשהעלות גדלה עם אורך הפרומפט וריבועית בחלק ה-attention. לאחר מכן decode פולט טוקן אחד בכל צעד לכל רצף, וקורא את כל משקלי המודל ואת כל ה-KV cache כדי לייצר את הטוקן הבודד הזה, ולכן הוא חסום ברוחב פס של זיכרון ומשאיר את ליבות הטנזור בטלות ברובן. עבודה באצוות היא התרופה ל-decode: כמה רצפים חולקים קריאת משקלים אחת, ולכן התפוקה עולה כמעט בחינם — עד שזיכרון ה-KV cache נגמר או שהאצווה הופכת חסומת-חישוב. המחיר הוא השהיה, כי בקשה ממתינה לתזמון ואז מתחרה על רוחב הפס, ולכן גם הזמן לטוקן הראשון וגם ההשהיה בין טוקנים מתדרדרים ככל שהאצווה גדלה. מערכות אמיתיות משתמשות ב-continuous batching, ב-KV cache מדופדף (paged), ובתזמון נפרד או מתועדף ל-prefill ול-decode כדי שפרומפט ארוך לא יתקע לכולם את זרם הטוקנים.", "rubric": ["‏prefill מקבילי על פני הפרומפט וחסום-חישוב", "‏decode מייצר טוקן אחד בכל פעם וחסום ברוחב פס של זיכרון", "עבודה באצוות מפזרת את עלות קריאת המשקלים ומעלה תפוקה", "זיכרון ה-KV cache חוסם את גודל האצווה האפשרי", "אצוות גדולות מחליפות השהיה לכל בקשה בתפוקה כוללת"]}}, {"id": "llm-017", "area": "llm", "topic": "hallucination", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["hallucination", "reliability", "grounding"], "answer": 1, "en": {"q": "Which statement about hallucination in LLMs is best supported?", "options": ["Greedy decoding removes it, since hallucination comes from sampling randomness", "It stems from a training objective that rewards plausible text, not truth", "It is a memory problem that a large enough context window resolves", "Reward models eliminate it, since annotators prefer factual answers"], "hint": "Ask what loss the model actually minimized, and whether that loss can see the world.", "explanation": "Next-token likelihood rewards fluent, distributionally plausible continuations; nothing in the objective checks a claim against the world, and the model has no calibrated sense of what it does not know. Sampling makes it worse, so temperature 0 reduces but does not remove hallucination, and preference training can even push toward confident answers. The real mitigations are grounding in retrieved evidence, trained abstention, and verification with tools.", "whyWrong": ["Greedy decoding still confidently produces false facts; randomness aggravates the problem rather than causing it.", "A longer context helps only when the right evidence is actually in it, and the model can still contradict it.", "Preference optimization can increase confident fabrication, because raters reward assertive, helpful-sounding answers."]}, "he": {"q": "איזו טענה על הזיות (hallucination) במודלי שפה נתמכת בצורה הטובה ביותר?", "options": ["פענוח חמדני מבטל אותן, כי ההזיות נובעות מהאקראיות שבדגימה", "הן נובעות מפונקציית מטרה שמתגמלת טקסט סביר, ולא אמת", "זו בעיית זיכרון שחלון הקשר גדול מספיק פותר", "מודלי תגמול מחסלים אותן, כי מתייגים מעדיפים תשובות עובדתיות"], "hint": "שאלו איזו פונקציית loss המודל באמת מזער, והאם היא מסוגלת בכלל לראות את העולם.", "explanation": "סבירות הטוקן הבא מתגמלת המשכים רהוטים וסבירים התפלגותית; שום דבר בפונקציית המטרה אינו בודק טענה מול העולם, ולמודל אין תחושה מכוילת של מה שאינו יודע. דגימה מחמירה את המצב, ולכן טמפרטורה 0 מפחיתה הזיות אך לא מבטלת אותן, ואימון על העדפות עלול אפילו לדחוף לתשובות בטוחות בעצמן. ההקלות האמיתיות הן עיגון בראיות מאוחזרות, אימון להימנעות מתשובה, ואימות בעזרת כלים.", "whyWrong": ["פענוח חמדני עדיין מייצר עובדות שקריות בביטחון מלא; האקראיות מחמירה את הבעיה ולא יוצרת אותה.", "הקשר ארוך יותר עוזר רק כשהראיה הנכונה באמת נמצאת בו, והמודל עדיין עלול לסתור אותה.", "מיטוב על העדפות עלול דווקא להגדיל בדיות בטוחות בעצמן, כי מתייגים מתגמלים תשובות נחרצות ושימושיות למראה."]}}, {"id": "llm-018", "area": "llm", "topic": "effective-context", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["long-context", "lost-in-the-middle", "retrieval"], "answer": 3, "en": {"q": "'Lost in the middle' names which observed behavior of long-context models?", "options": ["Attention entropy collapses in the middle layers of the network", "Positional encodings wrap around beyond the trained context length", "The middle of a generated answer degrades before its beginning and end", "Accuracy is highest for evidence at the start or end, and lowest in between"], "hint": "It is about where in the input the needed fact sits, not where in the network.", "explanation": "When the relevant document is placed at varying positions in a long prompt, accuracy follows a U-shape: models use evidence near the beginning or the end far better than evidence buried in the middle. It shows that advertised context length is not the same as effective context length, and it motivates reranking retrieved passages so the strongest evidence lands at the edges of the prompt.", "whyWrong": ["The effect is measured as task accuracy versus input position, not as a layerwise attention statistic.", "Failure beyond the trained length is a separate extrapolation problem; this happens well inside the window.", "It concerns the position of information in the prompt, not the shape of the generated output."]}, "he": {"q": "‏lost in the middle מתאר איזו התנהגות שנצפתה במודלים עם הקשר ארוך?", "options": ["האנטרופיה של ה-attention קורסת בשכבות האמצע של הרשת", "קידודי המיקום מתגלגלים מהתחלה מעבר לאורך ההקשר שבו אומן המודל", "אמצע התשובה שנוצרת מידרדר לפני ההתחלה והסוף שלה", "הדיוק הגבוה ביותר הוא כשהראיה בתחילת ההקשר או בסופו, והנמוך ביותר כשהיא באמצע"], "hint": "מדובר במקום שבו יושבת העובדה הדרושה בקלט, ולא במקום ברשת.", "explanation": "כשממקמים את המסמך הרלוונטי במיקומים משתנים בתוך פרומפט ארוך, הדיוק מתנהג כמו האות U: מודלים מנצלים ראיה בתחילת ההקשר או בסופו הרבה יותר טוב מראיה שקבורה באמצע. זה מראה שאורך ההקשר המוצהר אינו זהה לאורך ההקשר האפקטיבי, וזה המניע לדרג מחדש קטעים מאוחזרים כך שהראיה החזקה ביותר תיפול בקצוות הפרומפט.", "whyWrong": ["התופעה נמדדת כדיוק במשימה מול מיקום בקלט, ולא כסטטיסטיקה של attention לפי שכבות.", "כישלון מעבר לאורך שאומן הוא בעיית הכללה נפרדת; כאן זה קורה הרבה בתוך החלון.", "מדובר במיקום המידע בפרומפט, ולא בצורת הפלט שנוצר."]}}, {"id": "cvi-001", "area": "cv", "topic": "iou", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["detection", "iou", "metrics"], "answer": 2, "en": {"q": "Box A spans x from 0 to 4 and y from 0 to 4. Box B spans x from 2 to 6 and y from 2 to 6. What is IoU(A, B)?", "options": ["1/4 (0.25)", "1/8 (0.125)", "1/7 (0.143)", "1/2 (0.5)"], "hint": "Compute the intersection first, then union = areaA + areaB - intersection.", "explanation": "The overlap runs from 2 to 4 on both axes, so the intersection is 2*2 = 4. Each box has area 16, so the union is 16 + 16 - 4 = 28 and IoU = 4/28 = 1/7, about 0.143. Notice how fast IoU decays: the boxes overlap on half of each side yet land far below the usual 0.5 matching threshold.", "whyWrong": ["0.25 is 4/16, the intersection divided by one box's area, not by the union.", "0.125 is 4/32, which forgets to subtract the intersection when forming the union.", "0.5 is the one-dimensional overlap ratio (2 of 4 units per side); IoU is defined on areas, not sides."]}, "he": {"q": "תיבה A משתרעת על x מ-0 עד 4 ועל y מ-0 עד 4. תיבה B משתרעת על x מ-2 עד 6 ועל y מ-2 עד 6. מהו IoU(A, B)?", "options": ["1/4 (0.25)", "1/8 (0.125)", "1/7 (0.143)", "1/2 (0.5)"], "hint": "חשבו קודם את החיתוך, ואז איחוד = שטח A + שטח B - חיתוך.", "explanation": "החפיפה נמתחת מ-2 עד 4 בשני הצירים, ולכן שטח החיתוך הוא 2*2 = 4. שטח כל תיבה הוא 16, ולכן האיחוד הוא 16 + 16 - 4 = 28 ו-IoU = 4/28 = 1/7, בערך 0.143. שימו לב כמה מהר IoU יורד: התיבות חופפות בחצי מכל צלע ובכל זאת נמצאות הרבה מתחת לסף ההתאמה המקובל 0.5.", "whyWrong": ["0.25 הוא 4/16, כלומר החיתוך חלקי שטח תיבה אחת ולא חלקי האיחוד.", "0.125 הוא 4/32, חישוב ששוכח להחסיר את החיתוך בעת חישוב האיחוד.", "0.5 הוא יחס החפיפה החד-ממדי (2 מתוך 4 יחידות בכל צלע); IoU מוגדר על שטחים ולא על צלעות."]}}, {"id": "cvi-002", "area": "cv", "topic": "nms", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["detection", "nms", "postprocessing"], "answer": 1, "en": {"q": "What does non-maximum suppression (NMS) do in an object detector?", "options": ["Drops every detection whose confidence falls below a fixed threshold, ignoring overlap.", "Keeps the top-scoring box and removes lower-scoring boxes overlapping it above an IoU threshold.", "Zeroes activations below the channel maximum in each feature map before the head.", "Rescales class scores so that probabilities sum to one across all predicted boxes."], "hint": "It runs after the network, and it compares boxes to each other.", "explanation": "Dense detectors fire many nearby boxes on the same object. NMS sorts detections by score, keeps the best one, discards every remaining box whose IoU with it exceeds a threshold (commonly 0.5-0.7), and repeats. It is a de-duplication step over boxes, done per class, and it is orthogonal to confidence thresholding.", "whyWrong": ["Confidence thresholding is a separate step; NMS suppresses duplicates even when all of them are confident.", "That describes a pooling or activation operation inside the network, not a post-processing step over boxes.", "Normalizing scores across boxes is not part of NMS; each box keeps its own class probabilities."]}, "he": {"q": "מה עושה non-maximum suppression (NMS) בגלאי אובייקטים?", "options": ["מסיר כל זיהוי שהביטחון שלו נמוך מסף קבוע, בלי להתחשב בחפיפה.", "משאיר את התיבה בעלת הציון הגבוה ומסיר תיבות עם ציון נמוך יותר שחופפות לה מעל סף IoU.", "מאפס אקטיבציות שנמוכות מהמקסימום בכל ערוץ במפת המאפיינים לפני הראש.", "מנרמל את ציוני המחלקות כך שההסתברויות יסתכמו ל-1 על פני כל התיבות."], "hint": "זה קורה אחרי הרשת, וזה משווה תיבות אחת לשנייה.", "explanation": "גלאים צפופים מייצרים תיבות רבות וקרובות על אותו אובייקט. NMS ממיין את הזיהויים לפי ציון, שומר את הטוב ביותר, מסיר כל תיבה שה-IoU שלה מולו עובר סף (בדרך כלל 0.5-0.7), וחוזר על התהליך. זהו שלב ניקוי כפילויות בין תיבות, שמתבצע לכל מחלקה בנפרד ואינו תלוי בסינון לפי ביטחון.", "whyWrong": ["סינון לפי ביטחון הוא שלב נפרד; NMS מסיר כפילויות גם כשכולן בעלות ביטחון גבוה.", "זה מתאר פעולת pooling או אקטיבציה בתוך הרשת, ולא עיבוד-אחרי על תיבות.", "נרמול ציונים בין תיבות אינו חלק מ-NMS; כל תיבה שומרת על הסתברויות המחלקה שלה."]}}, {"id": "cvi-003", "area": "cv", "topic": "one-stage-vs-two-stage", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["detection", "anchors", "rpn"], "answer": 1, "en": {"q": "What genuinely separates a two-stage detector like Faster R-CNN from a one-stage detector like RetinaNet?", "options": ["Two-stage detectors use anchors, while one-stage detectors regress boxes straight from pixels.", "Two-stage proposes sparse regions, then classifies them; one-stage predicts densely in one pass.", "Two-stage detectors need no NMS, because the proposal stage already removes duplicates.", "Two-stage detectors train end-to-end, while one-stage detectors require alternating optimization."], "hint": "Ask where the candidate boxes that get classified come from.", "explanation": "Faster R-CNN uses a region proposal network to cut a dense anchor grid down to a few hundred proposals, then a second head classifies and refines each one. RetinaNet skips that filtering and classifies every anchor directly, which creates a huge foreground/background imbalance - the reason focal loss was introduced.", "whyWrong": ["RetinaNet is anchor-based too; the proposal stage, not the anchors, is the dividing line.", "Both families run NMS at the end, because proposals and anchors both produce duplicate boxes on one object.", "This reverses history: modern one-stage detectors train end-to-end, and it was early R-CNN variants that used alternating schedules."]}, "he": {"q": "מה באמת מבדיל בין גלאי דו-שלבי כמו Faster R-CNN לגלאי חד-שלבי כמו RetinaNet?", "options": ["גלאים דו-שלביים משתמשים ב-anchors, וגלאים חד-שלביים מרגרסים תיבות ישירות מהפיקסלים.", "הדו-שלבי מציע אזורים דלילים ואז מסווג אותם; החד-שלבי חוזה בצפיפות במעבר אחד.", "גלאים דו-שלביים אינם זקוקים ל-NMS, כי שלב ההצעות כבר מסיר כפילויות.", "גלאים דו-שלביים מתאמנים end-to-end, בעוד שחד-שלביים דורשים אופטימיזציה לסירוגין."], "hint": "שאלו מאיפה מגיעות תיבות המועמדות שעוברות סיווג.", "explanation": "ב-Faster R-CNN רשת ההצעות (RPN) מצמצמת רשת anchors צפופה למאות הצעות בודדות, ואז ראש שני מסווג ומעדן כל אחת מהן. RetinaNet מוותר על הסינון הזה ומסווג ישירות כל anchor, מה שיוצר חוסר איזון עצום בין רקע לחזית - בדיוק הסיבה שבגללה הוצג focal loss.", "whyWrong": ["גם RetinaNet מבוסס anchors; קו השבר הוא שלב ההצעות ולא ה-anchors.", "שתי המשפחות מריצות NMS בסוף, כי גם הצעות וגם anchors מייצרים תיבות כפולות על אותו אובייקט.", "זה הופך את ההיסטוריה: גלאים חד-שלביים מודרניים מתאמנים end-to-end, ודווקא גרסאות R-CNN המוקדמות אימנו לסירוגין."]}}, {"id": "cvi-004", "area": "cv", "topic": "map-pitfall", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["detection", "map", "evaluation"], "answer": 3, "en": {"q": "A team raises the detector's confidence threshold to cut false positives. The demo looks cleaner, but COCO mAP drops. Why?", "options": ["mAP rewards high scores directly, so compressing the score distribution lowers it.", "COCO averages over IoU 0.5 to 0.95, and score thresholding changes the IoU of the kept boxes.", "Filtering by score bypasses NMS, so remaining duplicates are counted as false positives.", "AP integrates precision over the whole recall range, so dropping low-score detections truncates recall."], "hint": "Think about what the precision-recall curve's right-hand tail is made of.", "explanation": "AP is the area under the precision-recall curve, obtained by sweeping the score threshold yourself; only the ranking of detections matters, not their absolute values. Low-confidence detections sit at the high-recall end of the curve, so deleting them chops off that tail and lowers AP. Pick an operating threshold for the product, but evaluate AP on unfiltered outputs.", "whyWrong": ["AP is invariant to any monotone rescaling of scores; it depends only on how detections are ranked.", "IoU is a geometric property of the predicted boxes and is unaffected by score filtering.", "NMS and confidence thresholding are independent steps; filtering low scores does not disable de-duplication."]}, "he": {"q": "צוות מעלה את סף הביטחון של הגלאי כדי לצמצם false positives. הדמו נראה נקי יותר, אבל mAP בסגנון COCO יורד. למה?", "options": ["mAP מתגמל ציונים גבוהים ישירות, ולכן כיווץ התפלגות הציונים מוריד אותו.", "COCO ממצע על IoU בין 0.5 ל-0.95, וסינון לפי ציון משנה את ה-IoU של התיבות שנשארו.", "סינון לפי ציון עוקף את NMS, ולכן כפילויות שנותרו נספרות כ-false positives.", "AP מחשב אינטגרל של precision על כל טווח ה-recall, ולכן זריקת זיהויים בעלי ציון נמוך קוטמת את ה-recall."], "hint": "חשבו ממה מורכב הזנב הימני של עקומת precision-recall.", "explanation": "AP הוא השטח מתחת לעקומת precision-recall, שמתקבלת מהזזת סף הציון על ידי המדד עצמו; רק סדר הדירוג של הזיהויים משנה, לא ערכיהם המוחלטים. זיהויים בעלי ביטחון נמוך יושבים בקצה ה-recall הגבוה של העקומה, ולכן מחיקתם קוטמת בדיוק את הזנב הזה ומורידה את AP. בחרו סף עבודה למוצר, אך מדדו AP על הפלט הלא מסונן.", "whyWrong": ["AP אינווריאנטי לכל שינוי סקאלה מונוטוני של הציונים; הוא תלוי רק בדירוג הזיהויים.", "IoU הוא תכונה גאומטרית של התיבות החזויות ואינו מושפע מסינון לפי ציון.", "NMS וסינון לפי ביטחון הם שלבים בלתי תלויים; סינון ציונים נמוכים אינו מבטל את הסרת הכפילויות."]}}, {"id": "cvi-005", "area": "cv", "topic": "segmentation-taxonomy", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["segmentation", "panoptic", "instance"], "answer": 0, "en": {"q": "A street photo has two overlapping cars and the road behind them. Which task labels every pixel with a class and also gives the two cars separate instance ids?", "options": ["Panoptic segmentation", "Semantic segmentation", "Instance segmentation", "Salient object segmentation"], "hint": "One of these was defined precisely to unify the other two.", "explanation": "Panoptic segmentation assigns every pixel a class and, for countable 'things' like cars, an instance id, while uncountable 'stuff' like road gets a class only. It was defined to unify semantic segmentation, which covers all pixels but no instances, with instance segmentation, which separates objects but ignores stuff.", "whyWrong": ["Semantic segmentation would merge the two overlapping cars into one connected 'car' region.", "Instance segmentation separates the cars but leaves stuff regions such as the road unlabeled.", "Salient object segmentation returns only the visually dominant foreground, with no class or instance structure."]}, "he": {"q": "בתמונת רחוב יש שתי מכוניות חופפות והכביש מאחוריהן. איזו משימה מתייגת כל פיקסל במחלקה וגם נותנת לשתי המכוניות מזהי מופע (instance) נפרדים?", "options": ["פילוח פנאופטי (panoptic segmentation)", "פילוח סמנטי (semantic segmentation)", "פילוח מופעים (instance segmentation)", "פילוח אובייקט בולט (salient object)"], "hint": "אחת מהן הוגדרה בדיוק כדי לאחד את שתי האחרות.", "explanation": "פילוח פנאופטי מקצה לכל פיקסל מחלקה, ולאובייקטים ספירים (things) כמו מכוניות גם מזהה מופע, בעוד שאזורי stuff כמו כביש מקבלים מחלקה בלבד. ההגדרה נוצרה כדי לאחד בין פילוח סמנטי, שמכסה את כל הפיקסלים אך ללא מופעים, לבין פילוח מופעים, שמפריד אובייקטים אך מתעלם מ-stuff.", "whyWrong": ["פילוח סמנטי היה מאחד את שתי המכוניות החופפות לאזור אחד מחובר של המחלקה מכונית.", "פילוח מופעים מפריד בין המכוניות אך משאיר אזורי stuff כמו הכביש ללא תיוג.", "פילוח אובייקט בולט מחזיר רק את החזית הדומיננטית ויזואלית, בלי מחלקות ובלי מבנה מופעים."]}}, {"id": "cvi-006", "area": "cv", "topic": "dice-loss", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["segmentation", "loss", "imbalance"], "answer": 2, "en": {"q": "Segmenting a lesion that covers about 0.5% of pixels, per-pixel cross entropy converges to predicting all background. Why does a Dice loss help?", "options": ["Dice adds an L2 penalty on predicted mask area, which forces the network to output some foreground.", "Dice is convex in the network output, so optimization cannot settle in the all-background solution.", "Dice is an overlap ratio over foreground only, so an all-background mask scores 0 regardless.", "Dice weights each pixel by its distance to the boundary, upweighting the thin lesion border."], "hint": "Ask what each loss does with the 99.5% of pixels that are correctly called background.", "explanation": "Cross entropy sums over pixels, so the overwhelming background term drowns out the lesion and the trivial all-background solution already has tiny loss. Dice = 2|P and G| / (|P| + |G|) only involves foreground pixels, so predicting nothing gives Dice 0 and a maximal loss. In practice people often sum Dice with cross entropy to keep per-pixel gradients well behaved.", "whyWrong": ["Dice has no area penalty term; it is purely an overlap ratio.", "Soft Dice is not convex in the network's outputs, and convexity is not what fixes the imbalance anyway.", "Distance weighting is a different idea (for example boundary or weighted-CE losses); plain Dice treats all foreground pixels alike."]}, "he": {"q": "בפילוח נגע שמכסה כ-0.5% מהפיקסלים, cross entropy לכל פיקסל מתכנס לניבוי רקע בכל התמונה. למה Dice loss עוזר?", "options": ["Dice מוסיף קנס L2 על שטח המסכה החזויה, שמכריח את הרשת לנבא מעט חזית.", "Dice קמור בפלט הרשת, ולכן האופטימיזציה אינה יכולה להיתקע בפתרון של רקע מלא.", "Dice הוא יחס חפיפה על פיקסלי חזית בלבד, ולכן מסכת רקע מלאה מקבלת ציון 0 בכל מקרה.", "Dice משקלל כל פיקסל לפי מרחקו מהגבול, ומעלה את משקל הגבול הדק של הנגע."], "hint": "שאלו מה כל פונקציית הפסד עושה עם 99.5% מהפיקסלים שסווגו נכון כרקע.", "explanation": "cross entropy מסכם על פני פיקסלים, ולכן איבר הרקע העצום מטביע את הנגע ולפתרון הטריוויאלי של רקע מלא כבר יש הפסד זעיר. Dice = 2|P חיתוך G| / (|P| + |G|) מערב רק פיקסלי חזית, ולכן ניבוי ריק נותן Dice 0 והפסד מקסימלי. בפועל נהוג לחבר Dice עם cross entropy כדי לשמור על גרדיאנטים יציבים ברמת הפיקסל.", "whyWrong": ["ב-Dice אין איבר קנס על שטח; זהו יחס חפיפה בלבד.", "soft Dice אינו קמור בפלטי הרשת, וקמירות ממילא אינה מה שפותר את חוסר האיזון.", "שקלול לפי מרחק הוא רעיון אחר (למשל boundary loss או CE משוקלל); Dice רגיל מתייחס לכל פיקסלי החזית באופן שווה."]}}, {"id": "cvi-007", "area": "cv", "topic": "flip-augmentation-keypoints", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["augmentation", "pose", "keypoints"], "answer": 0, "en": {"q": "You add horizontal flips to a human pose model. Overall loss looks fine, but accuracy on left/right joints collapses. What was forgotten?", "options": ["Keypoint indices must be swapped: the mirrored left wrist is now the right wrist.", "Keypoint coordinates must be renormalized to the [0,1] range after each flip.", "The flip must be applied to the heatmap targets instead of to the input image.", "A matching vertical flip is needed to keep the augmentation distribution symmetric."], "hint": "Ask what the label of a mirrored left hand actually is.", "explanation": "Horizontal flip is not label-preserving for pose: mirroring the image turns the left wrist into the right wrist, so the flip pair must be permuted in the label as well. Without the swap you train the model on contradictory left/right labels, which is why symmetric joints degrade while the overall loss stays plausible. The same care applies to test-time flip augmentation and to any chirality-sensitive task.", "whyWrong": ["A horizontal flip maps x to width - x, which keeps normalized coordinates in range; no renormalization is needed.", "The image and its targets must be flipped together; flipping only the target would break every joint, not just the symmetric ones.", "Vertical flips create upside-down people that never occur at test time and would not repair the left/right confusion."]}, "he": {"q": "הוספתם היפוך אופקי (horizontal flip) למודל הערכת תנוחה. ההפסד הכולל נראה תקין, אך הדיוק על מפרקי ימין ושמאל קורס. מה נשכח?", "options": ["יש להחליף את אינדקסי נקודות הציון: שורש כף יד שמאל המשוקף הוא כעת ימין.", "יש לנרמל מחדש את קואורדינטות נקודות הציון לטווח [0,1] אחרי כל היפוך.", "יש להחיל את ההיפוך על מפות החום (heatmaps) של היעד במקום על תמונת הקלט.", "נדרש גם היפוך אנכי תואם כדי לשמור על סימטריה בהתפלגות האוגמנטציה."], "hint": "שאלו מה בעצם התווית של יד שמאל משוקפת.", "explanation": "היפוך אופקי אינו שומר תווית במשימת תנוחה: שיקוף התמונה הופך את יד שמאל ליד ימין, ולכן יש להחליף גם את זוגות נקודות הציון בתווית. בלי ההחלפה המודל מתאמן על תוויות ימין/שמאל סותרות, ולכן דווקא המפרקים הסימטריים מתדרדרים בעוד ההפסד הכולל נראה סביר. אותה זהירות נדרשת גם באוגמנטציית היפוך בזמן בדיקה ובכל משימה רגישה לכיווניות.", "whyWrong": ["היפוך אופקי ממפה x ל-width פחות x ולכן קואורדינטות מנורמלות נשארות בטווח; אין צורך בנרמול מחדש.", "יש להפוך יחד את התמונה ואת היעד; היפוך היעד בלבד היה הורס את כל המפרקים ולא רק את הסימטריים.", "היפוך אנכי יוצר אנשים הפוכים שאינם מופיעים בזמן בדיקה, והוא ממילא לא היה מתקן את הבלבול בין ימין לשמאל."]}}, {"id": "cvi-008", "area": "cv", "topic": "cutmix", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["augmentation", "cutmix", "labels"], "answer": 3, "en": {"q": "CutMix pastes a 64x64 patch from a cat image into a 128x128 dog image. What soft target should the mixed sample get?", "options": ["1.0 cat, because the pasted patch decides the label", "0.5 dog and 0.5 cat, one share per source image", "0.75 cat and 0.25 dog, weighted by the pasted patch", "0.75 dog and 0.25 cat, weighted by pixel area"], "hint": "Work out what fraction of the 128x128 canvas the patch actually covers.", "explanation": "CutMix mixes labels in proportion to the pasted area: 64*64 / (128*128) = 4096 / 16384 = 0.25. So the target is 0.75 for the host class (dog) and 0.25 for the pasted class (cat). Getting this proportion right is the whole point: it makes the label consistent with the evidence actually visible in the image.", "whyWrong": ["A hard cat label would tell the model that a quarter-covered image is fully a cat, which is exactly the supervision CutMix avoids.", "An even split ignores the patch size; the same 50/50 target would then apply to a tiny patch and to half the image.", "This inverts the roles: the pasted patch covers 25% of the canvas, not 75%."]}, "he": {"q": "CutMix מדביק טלאי בגודל 64x64 מתמונת חתול לתוך תמונת כלב בגודל 128x128. איזה יעד רך (soft target) צריך לקבל הדגם המעורבב?", "options": ["1.0 חתול, כי הטלאי המודבק קובע את התווית", "0.5 כלב ו-0.5 חתול, חלק לכל תמונת מקור", "0.75 חתול ו-0.25 כלב, בשקלול לפי הטלאי המודבק", "0.75 כלב ו-0.25 חתול, בשקלול לפי שטח בפיקסלים"], "hint": "חשבו איזה שבר מהקנבס בגודל 128x128 הטלאי באמת מכסה.", "explanation": "CutMix מערבב תוויות ביחס לשטח המודבק: 64*64 / (128*128) = 4096 / 16384 = 0.25. לכן היעד הוא 0.75 למחלקה המארחת (כלב) ו-0.25 למחלקה המודבקת (חתול). דיוק ביחס הזה הוא כל העניין: הוא מתאים את התווית לראיות שבאמת נראות בתמונה.", "whyWrong": ["תווית קשיחה של חתול הייתה מלמדת שתמונה שרבע ממנה חתול היא חתול מלא, וזו בדיוק הפיקוח ש-CutMix נמנע ממנו.", "חלוקה שווה מתעלמת מגודל הטלאי; אותו יעד 50/50 היה חל גם על טלאי זעיר וגם על חצי תמונה.", "זה הופך את התפקידים: הטלאי המודבק מכסה 25% מהקנבס ולא 75%."]}}, {"id": "cvi-009", "area": "cv", "topic": "aspect-ratio-preprocessing", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["preprocessing", "resize", "serving"], "answer": 1, "en": {"q": "Training resized images to 640x640 with aspect-preserving letterbox padding. The serving pipeline uses a plain resize to 640x640. What happens?", "options": ["Nothing: convolutions are scale invariant, so the network sees equivalent features.", "Objects are stretched relative to training, and accuracy drops most on images far from square.", "Inference slows down, because plain resize leaves more non-zero pixels to convolve.", "Only the batch norm statistics shift, so recalibrating them on serving data restores accuracy."], "hint": "Draw what a 16:9 photo looks like under each of the two resize policies.", "explanation": "A plain resize squashes a 16:9 frame horizontally, so every object's aspect ratio differs from anything seen in training - a silent train/serve skew that no metric on the training set can catch. Convolutions are equivariant to translation, not to anisotropic scaling, so the features really do change. The fix is to share one preprocessing implementation between training and serving.", "whyWrong": ["Convolutions are not scale invariant, and they are certainly not invariant to stretching one axis more than the other.", "Compute in a conv net depends on tensor shape, not on how many pixels are non-zero; both inputs are 640x640.", "The shift is in the input geometry, not just in activation statistics; re-estimating batch norm cannot un-stretch the objects."]}, "he": {"q": "באימון שינו גודל תמונות ל-640x640 עם ריפוד letterbox ששומר על יחס הצדדים. בצנרת ההגשה משתמשים בשינוי גודל רגיל ל-640x640. מה יקרה?", "options": ["כלום: קונבולוציות אינווריאנטיות לסקאלה, ולכן הרשת רואה מאפיינים שקולים.", "אובייקטים נמתחים ביחס לאימון, והדיוק יורד בעיקר בתמונות שרחוקות מריבוע.", "ההסקה מואטת, כי שינוי גודל רגיל משאיר יותר פיקסלים שאינם אפס לקונבולוציה.", "רק סטטיסטיקות ה-batch norm זזות, ולכן כיול מחדש שלהן על נתוני ההגשה יחזיר את הדיוק."], "hint": "ציירו איך נראית תמונה ביחס 16:9 תחת כל אחת משתי מדיניות שינוי הגודל.", "explanation": "שינוי גודל רגיל מועך פריים 16:9 אופקית, ולכן יחס הצדדים של כל אובייקט שונה מכל מה שנראה באימון - הטיה שקטה בין אימון להגשה שאף מדד על סט האימון לא יתפוס. קונבולוציות אקוויוואריאנטיות להזזה, לא למתיחה אנאיזוטרופית, ולכן המאפיינים באמת משתנים. הפתרון הוא מימוש עיבוד-מקדים משותף אחד לאימון ולהגשה.", "whyWrong": ["קונבולוציות אינן אינווריאנטיות לסקאלה, ובוודאי לא למתיחה של ציר אחד יותר מהשני.", "החישוב ברשת קונבולוציה תלוי בצורת הטנזור ולא בכמות הפיקסלים שאינם אפס; שני הקלטים הם 640x640.", "השינוי הוא בגאומטריית הקלט ולא רק בסטטיסטיקות אקטיבציה; אמידה מחדש של batch norm לא תבטל את המתיחה."]}}, {"id": "cvi-010", "area": "cv", "topic": "imagenet-transfer", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["transfer-learning", "pretraining", "domain-shift"], "en": {"q": "An interviewer asks: when does ImageNet pretraining stop paying off, and what would you do instead?", "hint": "Think about how far the target images and the target decision are from photographs of everyday objects.", "modelAnswer": "ImageNet features transfer well when the target images look like natural photographs and the decision depends on object-level shape and texture. They transfer poorly when the input statistics are alien - single-channel or 16-bit medical scans, multispectral satellite imagery, microscopy, radar - or when the decision depends on fine, high-resolution detail that a 224-pixel object classifier never had to encode, such as a hairline crack or a few anomalous cells. Pretraining also stops mattering much once you have a large in-domain labeled set and can afford a long schedule; there it mainly speeds up convergence rather than raising the final ceiling. The better alternative is in-domain self-supervised pretraining on your own unlabeled images, or a foundation model trained on your modality, plus honest handling of channel count, resolution and normalization. I would settle it empirically: fine-tune from ImageNet, train from scratch and pretrain in-domain, and compare on a fixed validation split with the same budget.", "rubric": ["Names input-distribution gap (medical, satellite, microscopy, non-RGB channels) as a key failure case", "Notes tasks needing fine detail or high resolution, unlike object-level ImageNet semantics", "States that with enough in-domain labeled data pretraining mainly accelerates convergence rather than improving the final result", "Proposes in-domain self-supervised or modality-specific pretraining as the alternative", "Mentions deciding empirically with a controlled comparison rather than by default"]}, "he": {"q": "מראיין שואל: מתי אימון מקדים (pretraining) על ImageNet מפסיק להשתלם, ומה הייתם עושים במקום?", "hint": "חשבו כמה רחוקות תמונות היעד וההחלטה הנדרשת מצילומים של עצמים יומיומיים.", "modelAnswer": "מאפייני ImageNet עוברים היטב כשתמונות היעד דומות לצילומים טבעיים וההחלטה נשענת על צורה ומרקם ברמת אובייקט. הם עוברים גרוע כשסטטיסטיקת הקלט זרה - סריקות רפואיות בערוץ יחיד או ב-16 ביט, תמונות לוויין רב-ספקטרליות, מיקרוסקופיה, ראדאר - או כשההחלטה תלויה בפרט עדין ברזולוציה גבוהה שמסווג אובייקטים ב-224 פיקסלים מעולם לא נדרש לקודד, כמו סדק שערה בודדת או כמה תאים חריגים. בנוסף, כשיש סט מתויג גדול בתחום ואפשר להרשות לוח זמנים ארוך, ה-pretraining בעיקר מאיץ התכנסות ולא מעלה את התקרה. החלופה הטובה היא אימון מקדים self-supervised על התמונות הלא מתויגות שלכם, או מודל יסוד שאומן על אותה מודאליות, יחד עם טיפול נכון במספר הערוצים, ברזולוציה ובנרמול. הייתי מכריע אמפירית: fine-tuning מ-ImageNet, אימון מאפס ואימון מקדים בתחום, בהשוואה על אותו סט ולידציה ובאותו תקציב.", "rubric": ["מציין פער בהתפלגות הקלט (רפואי, לוויין, מיקרוסקופיה, ערוצים שאינם RGB) כמקרה כישלון מרכזי", "מציין משימות שדורשות פרטים עדינים או רזולוציה גבוהה, בשונה מסמנטיקה ברמת אובייקט ב-ImageNet", "מציין שעם מספיק נתונים מתויגים בתחום ה-pretraining בעיקר מאיץ התכנסות ולא משפר את התוצאה הסופית", "מציע אימון מקדים self-supervised בתחום או מודל ייעודי למודאליות כחלופה", "מזכיר הכרעה אמפירית בהשוואה מבוקרת ולא לפי ברירת מחדל"]}}, {"id": "cvi-011", "area": "cv", "topic": "vit-vs-cnn", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["vit", "cnn", "inductive-bias"], "en": {"q": "You have 40k labeled images. A colleague wants to train a ViT-B from scratch instead of fine-tuning a ResNet. How do you respond?", "hint": "Compare what each architecture already assumes about images before it sees any data.", "modelAnswer": "A CNN hard-codes locality, weight sharing and translation equivariance, plus a coarse-to-fine hierarchy, so it starts out already assuming most of what is true about images. A plain ViT assumes almost nothing beyond patch tokenization and a learned position embedding, so it has to discover spatial structure from data - which is why from scratch it needs far more images than 40k to catch up, and tends to overfit or plateau below a ResNet at that scale. The practical answer is not ViT versus CNN but scratch versus pretrained: a ViT pretrained on a large corpus and fine-tuned on 40k is usually competitive with or better than a fine-tuned ResNet. If they insist on training from scratch, strong augmentation and regularization recipes, or a hierarchical hybrid such as Swin or ConvNeXt, recover much of the missing bias. I would benchmark fine-tuned ResNet against fine-tuned ViT on the same split before committing.", "rubric": ["Names the CNN inductive biases: locality, translation equivariance, weight sharing, hierarchy", "States that ViT has weak spatial priors and therefore needs much more data or heavy augmentation", "Reframes the choice as pretrained versus from scratch, noting a pretrained ViT fine-tunes well on 40k", "Mentions a concrete mitigation (strong augmentation and regularization recipes, or a hierarchical or hybrid architecture)"]}, "he": {"q": "יש לכם 40 אלף תמונות מתויגות. עמית רוצה לאמן ViT-B מאפס במקום לעשות fine-tuning ל-ResNet. מה תגידו לו?", "hint": "השוו מה כל ארכיטקטורה כבר מניחה על תמונות עוד לפני שראתה נתונים.", "modelAnswer": "רשת קונבולוציה מקבעת בתוכה לוקאליות, שיתוף משקלים ואקוויוואריאנטיות להזזה, ובנוסף היררכיה מגס לעדין, ולכן היא מתחילה כשהיא כבר מניחה את רוב מה שנכון על תמונות. ViT רגיל כמעט אינו מניח דבר מעבר לחלוקה ל-patches ול-position embedding נלמד, ולכן עליו לגלות את המבנה המרחבי מהנתונים - ומכאן שאימון מאפס דורש הרבה יותר מ-40 אלף תמונות, ובסקאלה כזו הוא נוטה להתאמת יתר (overfitting) או לתקרה נמוכה מזו של ResNet. התשובה המעשית אינה ViT מול CNN אלא אימון מאפס מול מודל מאומן מראש: ViT שאומן מראש על קורפוס גדול ועובר fine-tuning על 40 אלף תמונות בדרך כלל שווה ל-ResNet מכוונן או טוב ממנו. אם בכל זאת מתעקשים על אימון מאפס, מתכוני אוגמנטציה ורגולריזציה חזקים או ארכיטקטורה היררכית או היברידית כמו Swin או ConvNeXt מחזירים חלק ניכר מההטיה החסרה. הייתי משווה ResNet מכוונן מול ViT מכוונן על אותו פיצול לפני ההחלטה.", "rubric": ["מציין את ההטיות המובנות ב-CNN: לוקאליות, אקוויוואריאנטיות להזזה, שיתוף משקלים והיררכיה", "מציין של-ViT יש הנחות מרחביות חלשות ולכן הוא דורש הרבה יותר נתונים או אוגמנטציה כבדה", "ממסגר מחדש את הבחירה כאימון מאפס מול מודל מאומן מראש, ומציין ש-ViT מאומן מראש מתכוונן היטב על 40 אלף תמונות", "מזכיר פתרון מעשי (מתכוני אוגמנטציה ורגולריזציה חזקים, או ארכיטקטורה היררכית או היברידית)"]}}, {"id": "cvi-012", "area": "cv", "topic": "mae-masking", "difficulty": 4, "type": "mcq", "hardnessSource": "recall", "tags": ["ssl", "mae", "masking"], "answer": 2, "en": {"q": "A masked autoencoder (MAE) masks roughly 75% of image patches, while BERT masks about 15% of tokens. What justifies the far higher ratio?", "options": ["Pixel reconstruction loss is noisier than cross entropy, so more masked patches are needed to cut gradient variance.", "Vision transformers overfit faster than language models, so the masking acts mainly as a regularizer.", "Neighbouring patches are highly redundant, so a low ratio is solvable by local interpolation, not semantics.", "Patches are continuous-valued, so the mask must exceed 50% for the reconstruction target to stay identifiable."], "hint": "Compare how much a missing word tells you versus how much a missing 16x16 patch tells you.", "explanation": "Language is dense in information: one missing word usually requires real understanding to recover. Images are spatially redundant, so a lightly masked patch can be filled in by copying its neighbours, and the model learns a low-level interpolator rather than semantics. A high mask ratio removes that shortcut, and it also makes MAE cheap, since the encoder only processes the roughly 25% visible patches.", "whyWrong": ["Gradient variance is not the motivation; masking more patches gives fewer visible ones and a harder, not less noisy, objective.", "Regularization is a side effect at best; the ratio is chosen to make the pretext task non-trivial.", "There is no identifiability threshold at 50%; contrastive and generative vision methods work at many mask ratios."]}, "he": {"q": "מודל masked autoencoder (MAE) מסתיר כ-75% מה-patches בתמונה, בעוד BERT מסתיר כ-15% מהטוקנים. מה מצדיק את היחס הגבוה בהרבה?", "options": ["הפסד שחזור פיקסלים רועש יותר מ-cross entropy, ולכן דרושים יותר patches מוסתרים כדי להקטין שונות בגרדיאנט.", "ויז'ן טרנספורמרים סובלים מהתאמת יתר מהר יותר ממודלי שפה, ולכן ההסתרה משמשת בעיקר כרגולריזציה.", "patches שכנים רדונדנטיים מאוד, ולכן יחס נמוך נפתר באינטרפולציה מקומית ולא בהבנה סמנטית.", "ערכי ה-patches רציפים, ולכן ההסתרה חייבת לעבור 50% כדי שיעד השחזור יישאר ניתן לזיהוי."], "hint": "השוו כמה מידע חסר במילה שהוסתרה לעומת patch חסר בגודל 16x16.", "explanation": "שפה צפופה במידע: שחזור מילה חסרה אחת בדרך כלל דורש הבנה אמיתית. תמונות רדונדנטיות מרחבית, ולכן patch שהוסתר בקושי ניתן להשלמה בהעתקה מהשכנים, והמודל לומד אינטרפולטור ברמה נמוכה במקום סמנטיקה. יחס הסתרה גבוה מבטל את הקיצור הזה, וגם מוזיל את MAE, שכן ה-encoder מעבד רק את כ-25% ה-patches הגלויים.", "whyWrong": ["שונות הגרדיאנט אינה המניע; הסתרת patches רבים יותר משאירה פחות מידע גלוי ומקשה על המשימה במקום להרגיע אותה.", "רגולריזציה היא לכל היותר תופעת לוואי; היחס נבחר כדי שמשימת העזר לא תהיה טריוויאלית.", "אין סף זיהוי ב-50%; שיטות ראייה ניגודיות וגנרטיביות עובדות במגוון יחסי הסתרה."]}}, {"id": "cvi-013", "area": "cv", "topic": "video-temporal", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["video", "action-recognition", "temporal"], "answer": 0, "en": {"q": "A per-frame classifier whose scores are averaged over the clip does well on many action benchmarks, but confuses 'opening a door' with 'closing a door'. Why?", "options": ["Average pooling over frames throws away order, and the two actions share the same frames in reverse.", "The backbone lacks capacity; a wider network would separate the classes from single frames.", "Average pooling saturates the softmax, so a few confident frames dominate the clip score.", "Motion information lives in the color channels, which per-frame normalization removes."], "hint": "Ask what changes about the clip if you play it backwards.", "explanation": "Averaging is a symmetric function of the frames, so the clip representation is identical for a video and its time reversal - the two classes are genuinely indistinguishable to that model. Many benchmarks hide this because scene and object context alone predicts the label. Fixing it needs an order-sensitive mechanism: temporal convolutions, optical flow, frame differences, or temporal attention with position information.", "whyWrong": ["No amount of capacity helps: a single frame from the middle of the action is genuinely ambiguous.", "Averaging softmax outputs smooths rather than saturates them, and this would not explain a directional confusion.", "Motion is a relation between frames, not a color property; it is not encoded in any single frame's channels."]}, "he": {"q": "מסווג ברמת פריים שממצעים את ציוניו על הקליפ משיג תוצאות טובות בהרבה מדדי זיהוי פעולות, אך מבלבל בין פתיחת דלת לסגירת דלת. למה?", "options": ["מיצוע על פריימים מאבד את הסדר, ולשתי הפעולות יש בדיוק אותם פריימים בסדר הפוך.", "לרשת הבסיס חסרה קיבולת; רשת רחבה יותר הייתה מפרידה בין המחלקות מפריים בודד.", "מיצוע מרווה את ה-softmax, ולכן כמה פריימים בטוחים שולטים בציון הקליפ.", "מידע התנועה נמצא בערוצי הצבע, שנרמול ברמת פריים מסיר."], "hint": "שאלו מה משתנה בקליפ אם מריצים אותו לאחור.", "explanation": "מיצוע הוא פונקציה סימטרית בפריימים, ולכן הייצוג של קליפ ושל היפוכו בזמן זהה לחלוטין - שתי המחלקות באמת בלתי נבדלות עבור מודל כזה. מדדים רבים מסתירים זאת כי הסצנה והאובייקטים לבדם מנבאים את התווית. התיקון דורש מנגנון רגיש לסדר: קונבולוציות בזמן, זרימה אופטית, הפרשי פריימים או קשב זמני עם מידע מיקום.", "whyWrong": ["שום תוספת קיבולת לא תעזור: פריים בודד מאמצע הפעולה באמת דו-משמעי.", "מיצוע פלטי softmax מחליק אותם ולא מרווה אותם, וזה ממילא לא היה מסביר בלבול כיווני.", "תנועה היא יחס בין פריימים ולא תכונת צבע; היא אינה מקודדת בערוצים של פריים בודד."]}}, {"id": "cvi-014", "area": "cv", "topic": "clip-zero-shot", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["clip", "vision-language", "zero-shot"], "answer": 3, "en": {"q": "In CLIP-style zero-shot classification, what plays the role of the classifier weights at inference time?", "options": ["A linear head fitted on a few labeled examples from the target dataset.", "The image encoder's final projection matrix, reused because the classes appeared during pretraining.", "The nearest pretraining image embeddings, retrieved from the training corpus at inference.", "The normalized text embeddings of the class prompts, scored against the image embedding by cosine similarity."], "hint": "Ask what object has one vector per class and is produced without touching any labeled image.", "explanation": "CLIP trains image and text encoders so that matching pairs have high cosine similarity. At test time you encode a prompt per class, and those normalized text vectors act exactly like rows of a linear classifier applied to the normalized image embedding, with a learned temperature. This is why prompt wording and prompt ensembling measurably move accuracy - you are literally editing the classifier weights.", "whyWrong": ["Fitting a head on labeled examples is linear probing or few-shot learning, not zero-shot classification.", "The image projection is shared across all classes and carries no class-specific information.", "CLIP does not retrieve from its pretraining data at inference; the corpus is not shipped with the model."]}, "he": {"q": "בסיווג zero-shot בסגנון CLIP, מה ממלא את תפקיד משקלי המסווג בזמן הסקה?", "options": ["ראש לינארי שהותאם על כמה דוגמאות מתויגות מסט היעד.", "מטריצת ההיטל האחרונה של ה-image encoder, בשימוש חוזר כי המחלקות הופיעו באימון המקדים.", "ה-embeddings של תמונות האימון הקרובות ביותר, שנשלפות מהקורפוס בזמן הסקה.", "ה-embeddings המנורמלים של הטקסט של תיאורי המחלקות, שמדורגים מול ה-embedding של התמונה בדמיון קוסינוס."], "hint": "שאלו איזה אובייקט מספק וקטור אחד לכל מחלקה ונוצר בלי לגעת באף תמונה מתויגת.", "explanation": "CLIP מאמן encoder לתמונות ו-encoder לטקסט כך שזוגות תואמים יקבלו דמיון קוסינוס גבוה. בזמן בדיקה מקודדים prompt לכל מחלקה, ווקטורי הטקסט המנורמלים האלה מתפקדים בדיוק כשורות של מסווג לינארי הפועל על ה-embedding המנורמל של התמונה, עם טמפרטורה נלמדת. לכן ניסוח ה-prompt ושילוב כמה prompts משנים את הדיוק באופן מדיד - אתם ממש עורכים את משקלי המסווג.", "whyWrong": ["התאמת ראש על דוגמאות מתויגות היא linear probing או למידת few-shot, ולא סיווג zero-shot.", "היטל התמונה משותף לכל המחלקות ואינו נושא מידע ספציפי למחלקה.", "CLIP אינו שולף מנתוני האימון המקדים בזמן הסקה; הקורפוס אינו נשלח יחד עם המודל."]}}, {"id": "cvi-015", "area": "cv", "topic": "domain-shift-production", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["domain-shift", "monitoring", "production"], "en": {"q": "A defect detector degrades right after the line gets a new camera and LED lighting. You have no labels from the new setup yet. How do you diagnose and fix it?", "hint": "You can compare distributions without labels, and you can simulate the new sensor on old data.", "modelAnswer": "First confirm it is an input-side shift: compare simple image statistics between old and new footage - exposure and intensity histograms, white balance, sharpness, noise level, effective resolution - and run a two-sample test on backbone embeddings; unlabeled signals such as a drop in mean confidence or rising prediction entropy corroborate it. If possible, shoot a small paired set of the same parts under both setups, which turns a guess into a controlled comparison and doubles as a tiny labeled eval set. The cheapest label-free fixes are matching the preprocessing to the new sensor (white balance and gamma correction, gray-world normalization) and recalibrating normalization statistics on unlabeled new-line images. In parallel, retrain with augmentations that simulate the new sensor - color jitter, gamma, white-balance shift, blur, sensor noise - so the model becomes invariant to it rather than being patched per camera. Then label a few hundred new-line images to verify the fix, and add image-statistics monitoring so the next hardware change is caught before accuracy is.", "rubric": ["Diagnoses without labels by comparing image statistics and embedding or confidence distributions between old and new", "Suggests a controlled paired capture or small labeled sample from the new setup to validate", "Proposes photometric normalization or recalibrating normalization statistics on unlabeled new data as a fast fix", "Proposes retraining or fine-tuning with augmentations that simulate the new camera and lighting", "Adds monitoring on input statistics so future capture changes are detected early"]}, "he": {"q": "גלאי פגמים מתדרדר מיד אחרי שהותקנו בקו מצלמה חדשה ותאורת LED חדשה. אין עדיין תיוגים מהמערך החדש. איך תאבחנו ותתקנו?", "hint": "אפשר להשוות התפלגויות בלי תיוגים, ואפשר לדמות את החיישן החדש על נתונים ישנים.", "modelAnswer": "קודם כל יש לוודא שמדובר בהיסט בצד הקלט: להשוות סטטיסטיקות תמונה פשוטות בין הצילומים הישנים לחדשים - היסטוגרמות חשיפה ועוצמה, איזון לבן, חדות, רמת רעש ורזולוציה אפקטיבית - ולהריץ מבחן שתי מדגמים על ה-embeddings של רשת הבסיס; סימנים ללא תיוג כמו ירידה בביטחון הממוצע או עלייה באנטרופיית הניבוי מחזקים את האבחנה. אם אפשר, לצלם סט קטן ומזווג של אותם חלקים בשני המערכים, מה שהופך ניחוש להשוואה מבוקרת ומשמש גם כסט הערכה מתויג קטן. התיקונים הזולים ללא תיוג הם התאמת העיבוד המקדים לחיישן החדש (תיקון איזון לבן וגמא, נרמול gray-world) וכיול מחדש של סטטיסטיקות הנרמול על תמונות לא מתויגות מהקו החדש. במקביל, לאמן מחדש עם אוגמנטציות שמדמות את החיישן החדש - שינויי צבע, גמא, איזון לבן, טשטוש ורעש חיישן - כדי שהמודל יהיה אינווריאנטי לכך ולא יטולא מחדש לכל מצלמה. אחר כך לתייג כמה מאות תמונות מהקו החדש כדי לאמת את התיקון, ולהוסיף ניטור על סטטיסטיקות התמונה כך ששינוי החומרה הבא ייתפס לפני שהדיוק ייפגע.", "rubric": ["מאבחן ללא תיוגים באמצעות השוואת סטטיסטיקות תמונה והתפלגויות embedding או ביטחון בין ישן לחדש", "מציע צילום מזווג מבוקר או מדגם מתויג קטן מהמערך החדש לאימות", "מציע נרמול פוטומטרי או כיול מחדש של סטטיסטיקות נרמול על נתונים חדשים לא מתויגים כתיקון מהיר", "מציע אימון מחדש או fine-tuning עם אוגמנטציות שמדמות את המצלמה והתאורה החדשות", "מוסיף ניטור על סטטיסטיקות הקלט כדי לזהות מוקדם שינויי צילום עתידיים"]}}, {"id": "rli-001", "area": "rl", "topic": "mdp-markov", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["mdp", "markov", "fundamentals"], "answer": 0, "en": {"q": "An MDP is the tuple (S, A, P, R, gamma). What exactly does the Markov property assert about it?", "options": ["The next state and reward depend only on the current state and action, not on history.", "The reward function is stationary and does not change while the agent trains.", "Every state can be reached from every other state under some policy.", "The optimal policy is deterministic and unique for the given discount factor."], "hint": "It is a statement about what the transition distribution is allowed to condition on.", "explanation": "The Markov property says P(s', r | s, a) is independent of everything before s, so the current state is a sufficient statistic for the future. That is what licenses value functions of the state alone and the Bellman recursion. When it fails - for example with partial observability - the usual repair is to enrich the state, by stacking frames or carrying a recurrent belief.", "whyWrong": ["Stationarity of the reward is a separate assumption; a process can be Markov with a time-varying reward, and history-dependent with a fixed one.", "That describes an ergodicity or communication assumption used in some convergence proofs, not the Markov property.", "An optimal deterministic policy exists in a finite MDP, but that is a consequence of the theory, not the definition of Markov."]}, "he": {"q": "תהליך MDP מוגדר על ידי הרביעייה המורחבת (S, A, P, R, gamma). מה בדיוק קובעת תכונת מרקוב (Markov property)?", "options": ["המצב והתגמול הבאים תלויים רק במצב ובפעולה הנוכחיים, ולא בהיסטוריה.", "פונקציית התגמול סטציונרית ואינה משתנה במהלך האימון של הסוכן.", "כל מצב ניתן להשגה מכל מצב אחר תחת מדיניות כלשהי.", "המדיניות האופטימלית דטרמיניסטית ויחידה עבור מקדם ההיוון הנתון."], "hint": "זו טענה על מה שהתפלגות המעברים רשאית להתנות עליו.", "explanation": "תכונת מרקוב אומרת ש-P(s', r | s, a) בלתי תלויה בכל מה שקדם ל-s, ולכן המצב הנוכחי הוא סטטיסטי מספיק לגבי העתיד. זה מה שמאפשר פונקציות ערך של המצב בלבד ואת רקורסיית בלמן. כשהיא נשברת - למשל בתצפית חלקית - התיקון המקובל הוא להעשיר את המצב, למשל בערימת פריימים או בשמירת אמונה (belief) רקורסיבית.", "whyWrong": ["קביעות התגמול היא הנחה נפרדת; תהליך יכול להיות מרקובי עם תגמול משתנה בזמן, או תלוי היסטוריה עם תגמול קבוע.", "זו הנחת ארגודיות או קשירות שמשמשת בחלק מהוכחות ההתכנסות, ולא תכונת מרקוב.", "ב-MDP סופי קיימת מדיניות אופטימלית דטרמיניסטית, אך זו תוצאה של התאוריה ולא ההגדרה של מרקוביות."]}}, {"id": "rli-002", "area": "rl", "topic": "discounted-return", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["return", "discount", "fundamentals"], "answer": 1, "en": {"q": "An episode gives rewards 1, 2 and 3 at times t = 0, 1, 2 and nothing afterwards. With gamma = 0.5, what is the return G_0?", "options": ["6", "2.75", "4.25", "3"], "hint": "G_0 = r_0 + gamma*r_1 + gamma^2*r_2, and the first reward is undiscounted.", "explanation": "G_0 = 1 + 0.5*2 + 0.25*3 = 1 + 1 + 0.75 = 2.75. With gamma = 0.5 the third reward already counts for only a quarter of its face value, which is why a small gamma makes an agent short-sighted: at this rate anything more than a handful of steps away is practically invisible.", "whyWrong": ["6 is the undiscounted sum 1 + 2 + 3, which ignores gamma entirely.", "4.25 is 3 + 0.5*2 + 0.25*1, which applies the discounts in reverse order.", "3 is 0.5*(1 + 2 + 3), which discounts the total once instead of discounting each reward by its own time index."]}, "he": {"q": "אפיזודה מניבה תגמולים 1, 2 ו-3 בזמנים t = 0, 1, 2 ולא כלום אחר כך. עם gamma = 0.5, מהי התשואה G_0?", "options": ["6", "2.75", "4.25", "3"], "hint": "G_0 = r_0 + gamma*r_1 + gamma^2*r_2, והתגמול הראשון אינו מהוון.", "explanation": "G_0 = 1 + 0.5*2 + 0.25*3 = 1 + 1 + 0.75 = 2.75. עם gamma = 0.5 התגמול השלישי כבר נספר כרבע מערכו, ולכן gamma קטן הופך את הסוכן לקצר רואי: בקצב כזה כל מה שרחוק יותר מכמה צעדים כמעט בלתי נראה.", "whyWrong": ["6 הוא הסכום הלא מהוון 1 + 2 + 3, שמתעלם לגמרי מ-gamma.", "4.25 הוא 3 + 0.5*2 + 0.25*1, כלומר החלת ההיוון בסדר הפוך.", "3 הוא 0.5*(1 + 2 + 3), כלומר היוון הסכום פעם אחת במקום היוון כל תגמול לפי אינדקס הזמן שלו."]}}, {"id": "rli-003", "area": "rl", "topic": "discount-factor", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["discount", "horizon", "variance"], "answer": 2, "en": {"q": "You raise gamma from 0.9 to 0.99 on a dense-reward task and learning becomes far less stable. What is the main reason?", "options": ["At gamma = 0.99 the Bellman operator is no longer a contraction, so values can diverge.", "The objective becomes non-stationary, so transitions already in the replay buffer are invalid.", "The effective horizon grows from about 10 steps to about 100, so targets carry far more variance.", "Larger gamma shrinks the gaps between action values, so epsilon-greedy stops exploring."], "hint": "1/(1 - gamma) has a very concrete interpretation in steps.", "explanation": "The effective horizon is about 1/(1 - gamma): 10 steps at 0.9, 100 steps at 0.99. Returns then aggregate ten times as many noisy rewards, value magnitudes grow, and the contraction modulus rises from 0.9 to 0.99, so errors shrink far more slowly per backup. Raising gamma is a real change to the problem's difficulty, not a free accuracy knob.", "whyWrong": ["The Bellman operator is a gamma-contraction for every gamma < 1; 0.99 only makes the contraction slower, not absent.", "The MDP and its optimal values are still stationary; off-policy transitions stay reusable, which is exactly why replay works.", "The epsilon-greedy exploration rate is set by epsilon alone and does not depend on the scale or spacing of Q-values."]}, "he": {"q": "העלתם את gamma מ-0.9 ל-0.99 במשימה עם תגמולים צפופים, והלמידה הפכה הרבה פחות יציבה. מה הסיבה העיקרית?", "options": ["ב-gamma = 0.99 אופרטור בלמן כבר אינו כיווץ, ולכן הערכים עלולים להתבדר.", "פונקציית המטרה הופכת ללא-סטציונרית, ולכן מעברים שכבר נמצאים ב-replay buffer אינם תקפים.", "האופק האפקטיבי גדל מכ-10 צעדים לכ-100, ולכן ליעדי הערך יש שונות גדולה בהרבה.", "gamma גדול יותר מקטין את הפערים בין ערכי הפעולות, ולכן epsilon-greedy מפסיק לחקור."], "hint": "לביטוי 1/(1 - gamma) יש פרשנות מאוד מוחשית ביחידות של צעדים.", "explanation": "האופק האפקטיבי הוא בערך 1/(1 - gamma): כ-10 צעדים ב-0.9 וכ-100 צעדים ב-0.99. התשואות מצטברות אז מפי עשרה תגמולים רועשים, סדרי הגודל של הערכים גדלים, ומקדם הכיווץ עולה מ-0.9 ל-0.99, כך שהשגיאה קטנה הרבה יותר לאט בכל עדכון. העלאת gamma היא שינוי אמיתי בקושי הבעיה ולא כפתור דיוק חינם.", "whyWrong": ["אופרטור בלמן הוא כיווץ במקדם gamma לכל gamma קטן מ-1; 0.99 רק מאט את הכיווץ ולא מבטל אותו.", "ה-MDP והערכים האופטימליים שלו עדיין סטציונריים; מעברים off-policy נשארים שמישים, וזו בדיוק הסיבה ש-replay עובד.", "קצב החקירה ב-epsilon-greedy נקבע על ידי epsilon בלבד ואינו תלוי בסקאלה או במרווחים בין ערכי ה-Q."]}}, {"id": "rli-004", "area": "rl", "topic": "model-based-vs-model-free", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["planning", "value-iteration", "model-based"], "answer": 3, "en": {"q": "Which statement about value iteration, policy iteration and tabular Q-learning is correct?", "options": ["All three are model-free; a model only matters for planners such as Monte Carlo tree search.", "Policy iteration is model-free, because its evaluation step can be run from rollouts.", "Q-learning is model-based, because it stores a table of state-action values.", "Value iteration and policy iteration need the model; Q-learning needs only sampled transitions."], "hint": "Ask which algorithms have to sum over all possible next states.", "explanation": "Value iteration and policy iteration are dynamic programming: their backups take an expectation over P(s'|s,a), so they need the model up front. Q-learning replaces that expectation with a sampled transition and a learning rate,
