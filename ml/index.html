 מובהקות סטטיסטית למשמעות מעשית"]}}, {"id": "evl-013", "area": "evaluation", "topic": "evaluation-protocol", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["time-series-cv", "group-split", "protocol"], "en": {"q": "Design an evaluation protocol for a churn model trained on customer histories that predicts next month's churn, where customers appear in many months. Which splits and metrics would you use?", "hint": "Two different kinds of dependence are present here at the same time.", "modelAnswer": "The data breaks independence in two ways at once, repeated rows per customer and temporal ordering, so the split must respect both: hold out later periods for validation and test using rolling-origin (forward-chaining) CV, training on months up to t and evaluating on month t+1, and make sure a customer's history never crosses the boundary in a way that leaks their outcome. Every feature must be computed only from information available before the prediction date, which rules out whole-history aggregates or target encoding fit on all months. Because churn is rare, I would report average precision and precision/recall at the contact capacity of the retention team rather than accuracy or ROC-AUC alone, plus a calibration check so the probabilities can feed an expected-value calculation. Finally I would evaluate over several consecutive rolling folds to see whether performance is stable over time, and keep the most recent period as a single untouched test set.", "rubric": ["Splits by time (rolling origin / forward chaining) rather than at random", "Also handles repeated customers so one customer does not leak across the boundary", "Requires features computed only from information available before the prediction date", "Chooses imbalance-aware metrics (average precision, precision@k) over raw accuracy", "Mentions calibration or multiple rolling folds to check stability over time"]}, "he": {"q": "תכננו פרוטוקול הערכה למודל נטישה (churn) שמאומן על היסטוריות לקוחות וחוזה נטישה בחודש הבא, כאשר לקוחות מופיעים בחודשים רבים. אילו פיצולים ומדדים תבחרו?", "hint": "יש כאן שני סוגי תלות בו-זמנית.", "modelAnswer": "הנתונים מפרים אי-תלות בשתי דרכים בו-זמנית, שורות חוזרות לכל לקוח וסדר כרונולוגי, ולכן הפיצול חייב לכבד את שתיהן: מחזיקים תקופות מאוחרות יותר לוולידציה ולמבחן באמצעות CV מסוג rolling-origin (forward chaining), מאמנים על חודשים עד t ומעריכים על חודש t+1, ומוודאים שהיסטוריה של לקוח לעולם אינה חוצה את הגבול באופן שמדליף את התוצאה שלו. כל פיצ'ר חייב להיות מחושב רק ממידע שהיה זמין לפני תאריך החיזוי, מה שפוסל אגרגציות על כל ההיסטוריה או target encoding שהותאם על כל החודשים. מכיוון שנטישה נדירה, הייתי מדווח average precision ו-precision/recall בקיבולת הפניות של צוות השימור במקום accuracy או ROC-AUC בלבד, ומוסיף בדיקת כיול כדי שההסתברויות יוכלו להזין חישוב תוחלת רווח. לבסוף הייתי מעריך על כמה קפלים מתגלגלים רצופים כדי לראות אם הביצועים יציבים לאורך זמן, ושומר את התקופה האחרונה כ-test set יחיד שלא נוגעים בו.", "rubric": ["מפצל לפי זמן (rolling origin / forward chaining) ולא באקראי", "מטפל גם בלקוחות חוזרים כך שלקוח בודד אינו דולף מעבר לגבול", "דורש פיצ'רים המחושבים רק ממידע שהיה זמין לפני תאריך החיזוי", "בוחר מדדים מודעי חוסר איזון (average precision, precision@k) על פני accuracy גולמי", "מזכיר כיול או כמה קפלים מתגלגלים לבדיקת יציבות לאורך זמן"]}}, {"id": "cml-001", "area": "classical-ml", "topic": "linear-regression", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["regression", "closed-form", "rank"], "answer": 0, "en": {"q": "The OLS closed form is beta = (X^T X)^-1 X^T y. When p > n (more features than samples), what actually breaks?", "options": ["X^T X is singular, so infinitely many coefficient vectors are optimal", "The residuals stop being orthogonal to the column space of X", "The loss becomes non-convex, so gradient descent can find local minima", "The estimate stays unique but its bias grows without bound"], "hint": "Think about the rank of a p-by-p matrix built out of only n rows.", "explanation": "X^T X is p-by-p but its rank is at most n < p, so it is singular and cannot be inverted. The squared loss is still convex — there is simply a whole flat subspace of minimizers, all of which fit the training data exactly. Ridge fixes this by adding lambda*I, which makes the matrix positive definite and the solution unique.", "whyWrong": ["Orthogonality of residuals to the column space holds for any least-squares solution; it is a property of the projection, and p > n does not break it.", "Squared loss in the coefficients is always convex: the Hessian 2*X^T X is positive semidefinite for any p and n.", "Uniqueness is exactly what is lost, and OLS is unbiased wherever it exists — the problem is variance, not bias."]}, "he": {"q": "הפתרון הסגור של רגרסיה לינארית הוא beta = (X^T X)^-1 X^T y. כאשר p > n (יותר פיצ'רים מדגימות), מה בעצם נשבר?", "options": ["‏X^T X סינגולרית, ולכן אינסוף וקטורי מקדמים הם אופטימליים", "השאריות (residuals) חדלות להיות אורתוגונליות למרחב העמודות של X", "הלוס הופך ללא קמור, ולכן gradient descent עלול להיתקע במינימום מקומי", "האומד נשאר יחיד, אבל ההטיה (bias) שלו גדלה ללא גבול"], "hint": "חשבו על הדרגה (rank) של מטריצה בגודל p על p שנבנתה מ-n שורות בלבד.", "explanation": "המטריצה X^T X היא בגודל p על p, אך דרגתה לכל היותר n < p, ולכן היא סינגולרית ואינה הפיכה. הלוס הריבועי עדיין קמור — פשוט קיים תת-מרחב שלם של פתרונות אופטימליים, וכולם מתאימים בדיוק לנתוני האימון. רגרסיית ridge פותרת זאת בהוספת lambda*I, שהופכת את המטריצה למוגדרת חיובית ואת הפתרון ליחיד.", "whyWrong": ["אורתוגונליות השאריות למרחב העמודות מתקיימת עבור כל פתרון ריבועים פחותים; זו תכונה של ההיטל, ו-p > n אינו פוגע בה.", "הלוס הריבועי במקדמים תמיד קמור: ההסיאן 2*X^T X הוא חצי-מוגדר חיובי לכל p ו-n.", "דווקא היחידות היא מה שאובד, ו-OLS חסר הטיה בכל מקום שבו הוא קיים — הבעיה היא שונות, לא הטיה."]}}, {"id": "cml-002", "area": "classical-ml", "topic": "linear-regression", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["assumptions", "inference", "unbiasedness"], "answer": 3, "en": {"q": "Which assumption is NOT required for the OLS coefficient estimates to be unbiased?", "options": ["The errors have zero mean conditional on X", "The model is linear in its parameters", "No feature is an exact linear combination of the others", "The errors follow a normal distribution"], "hint": "Separate what you need for the point estimate from what you need for t-tests and confidence intervals.", "explanation": "Unbiasedness needs linearity in the parameters, E[e|X] = 0, and full column rank. Normality of the errors buys exact t and F distributions in small samples — that is inference, not unbiasedness — and homoscedasticity buys efficiency and the usual standard errors. The misconception being tested is that 'linear regression assumes the data are normal'.", "whyWrong": ["E[e|X] = 0 is exactly what makes E[beta_hat] = beta; violate it (omitted variable, endogeneity) and the estimate is biased.", "OLS is derived for a model linear in its parameters; that is what makes the normal equations valid, though the features themselves may be transformed.", "Perfect collinearity makes X^T X singular, so no unique estimate exists at all and unbiasedness is not even defined."]}, "he": {"q": "איזו הנחה אינה נדרשת כדי שאומדני המקדמים של OLS יהיו חסרי הטיה (unbiased)?", "options": ["לשגיאות יש תוחלת אפס בהינתן X", "המודל לינארי בפרמטרים שלו", "אף פיצ'ר אינו צירוף לינארי מדויק של האחרים", "השגיאות מתפלגות נורמלית"], "hint": "הפרידו בין מה שנדרש לאמידה נקודתית לבין מה שנדרש למבחני t ולרווחי סמך.", "explanation": "חוסר הטיה דורש לינאריות בפרמטרים, E[e|X] = 0 ודרגת עמודות מלאה. נורמליות השגיאות נחוצה כדי לקבל התפלגויות t ו-F מדויקות במדגמים קטנים — כלומר להסקה ולא לחוסר הטיה — והומוסקדסטיות נחוצה ליעילות ולשגיאות התקן הרגילות. התפיסה השגויה שנבחנת כאן היא ש'רגרסיה לינארית מניחה נתונים נורמליים'.", "whyWrong": ["התנאי E[e|X] = 0 הוא בדיוק מה שמבטיח E[beta_hat] = beta; הפרה שלו (משתנה מושמט, אנדוגניות) יוצרת הטיה.", "‏OLS נגזר עבור מודל שלינארי בפרמטרים שלו, וזה מה שמאפשר את משוואות הנורמל, גם אם הפיצ'רים עצמם מותמרים.", "קולינאריות מושלמת הופכת את X^T X לסינגולרית, ואז אין אומד יחיד בכלל וחוסר הטיה אפילו אינו מוגדר."]}}, {"id": "cml-003", "area": "classical-ml", "topic": "regularization", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["lasso", "ridge", "sparsity"], "answer": 3, "en": {"q": "Why does L1 (lasso) drive coefficients to exactly zero while L2 (ridge) only shrinks them?", "options": ["L1 is differentiable nowhere, so the optimizer defaults weak features to zero", "L1 penalizes large coefficients more aggressively than L2 does", "L2 is bounded below, so it cannot push a coefficient past its own minimum", "L1's gradient keeps constant magnitude near zero, so it pins a coefficient at 0"], "hint": "Compare the derivative of |b| with the derivative of b^2 as b approaches zero.", "explanation": "The derivative of |b| is sign(b) — a constant pull of size lambda even as b goes to 0 — while the derivative of b^2 is 2b and vanishes at 0. So once the data's gradient is smaller than lambda, the L1 subgradient holds the coefficient at exactly zero, whereas ridge's pull dies out and leaves a small nonzero value. Geometrically, the diamond constraint's corners sit on the axes.", "whyWrong": ["L1 is differentiable everywhere except at 0; that single kink is the whole story, and optimizers handle it with subgradients or soft-thresholding.", "For large coefficients the opposite holds: b^2 grows faster than |b|, so ridge punishes big weights harder — it just stops punishing small ones.", "Both penalties are bounded below by zero; boundedness has nothing to do with sparsity, the slope at the origin does."]}, "he": {"q": "מדוע רגולריזציית L1‏ (lasso) מאפסת מקדמים לחלוטין, בעוד L2‏ (ridge) רק מכווצת אותם?", "options": ["‏L1 אינה גזירה באף נקודה, ולכן האופטימייזר מאפס כברירת מחדל פיצ'רים חלשים", "‏L1 מענישה מקדמים גדולים בחוזקה רבה יותר מ-L2", "‏L2 חסומה מלמטה, ולכן אינה יכולה לדחוף מקדם מעבר למינימום שלה", "לגרדיאנט של L1 יש גודל קבוע ליד אפס, ולכן הוא מקבע מקדם על 0"], "hint": "השוו את הנגזרת של |b| לנגזרת של b^2 כאשר b שואף לאפס.", "explanation": "הנגזרת של |b| היא sign(b) — משיכה בעוצמה קבועה lambda גם כאשר b שואף ל-0 — בעוד הנגזרת של b^2 היא 2b ומתאפסת ב-0. לכן ברגע שהגרדיאנט של הלוס קטן מ-lambda, התת-גרדיאנט של L1 מחזיק את המקדם על אפס מדויק, ואילו המשיכה של ridge דועכת ומשאירה ערך קטן ושונה מאפס. גיאומטרית: פינות אילוץ המעוין יושבות בדיוק על הצירים.", "whyWrong": ["‏L1 גזירה בכל נקודה פרט ל-0; אותה נקודת שבירה יחידה היא כל הסיפור, והאופטימייזרים מטפלים בה עם תת-גרדיאנט או soft-thresholding.", "עבור מקדמים גדולים ההפך הוא הנכון: b^2 גדל מהר מ-|b|, ולכן ridge מענישה משקלים גדולים חזק יותר — היא פשוט מפסיקה להעניש קטנים.", "שני הקנסות חסומים מלמטה באפס; החסימות אינה קשורה לדלילות, מה שקובע הוא השיפוע בראשית."]}}, {"id": "cml-004", "area": "classical-ml", "topic": "logistic-regression", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["log-odds", "sigmoid", "classification"], "answer": 2, "en": {"q": "A logistic model gives log-odds = -2 + 0.5*x. At x = 4 the predicted probability is 0.5. What is it at x = 6?", "options": ["about 0.62", "about 0.88", "about 0.73", "exactly 0.75"], "hint": "Push the linear part through 1/(1+e^-z); a logit of 1 is a familiar value.", "explanation": "At x = 6 the log-odds are -2 + 0.5*6 = 1, so the odds are e^1 = 2.718 and p = 2.718/3.718 = 0.731. Each extra unit of x multiplies the odds by e^0.5 = 1.65 — it does not multiply the probability, which moves nonlinearly and saturates near 0 and 1.", "whyWrong": ["0.62 is sigmoid(0.5): it treats the coefficient itself as the logit instead of the full linear predictor -2 + 0.5*6 = 1.", "0.88 is sigmoid(2), which would require log-odds of 2, that is x = 8.", "That assumes probability grows linearly in x. The link is logistic, so the odds scale multiplicatively, not the probability."]}, "he": {"q": "מודל לוגיסטי נותן log-odds = -2 + 0.5*x. ב-x = 4 ההסתברות החזויה היא 0.5. מה ההסתברות ב-x = 6?", "options": ["בערך 0.62", "בערך 0.88", "בערך 0.73", "בדיוק 0.75"], "hint": "העבירו את החלק הלינארי דרך 1/(1+e^-z); ערך logit של 1 הוא ערך מוכר.", "explanation": "ב-x = 6 מתקיים log-odds = -2 + 0.5*6 = 1, ולכן הסיכויים הם e^1 = 2.718 וההסתברות היא 2.718/3.718 = 0.731. כל יחידה נוספת של x מכפילה את הסיכויים (odds) ב-e^0.5 = 1.65, ולא את ההסתברות — ההסתברות זזה באופן לא לינארי ונרווית ליד 0 ו-1.", "whyWrong": ["הערך 0.62 הוא sigmoid(0.5): הוא מתייחס למקדם עצמו כאל ה-logit במקום למנבא הלינארי המלא -2 + 0.5*6 = 1.", "הערך 0.88 הוא sigmoid(2), שדורש log-odds של 2, כלומר x = 8.", "תשובה זו מניחה שההסתברות גדלה לינארית ב-x. פונקציית הקישור לוגיסטית, ולכן הסיכויים מוכפלים ולא ההסתברות."]}}, {"id": "cml-005", "area": "classical-ml", "topic": "logistic-regression", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["log-loss", "mse", "optimization"], "answer": 3, "en": {"q": "Why is squared error a poor loss function for logistic regression?", "options": ["It is undefined when the predicted probability is exactly 0 or 1", "It cannot be minimized by gradient descent, only by a closed form", "It pushes predictions outside [0,1], which the sigmoid then clips", "It is non-convex in w and its gradient dies on confident mistakes"], "hint": "Think about the size of the gradient when the model says 0.99 and the label is 0.", "explanation": "MSE composed with a sigmoid is non-convex in w, so optimization can stall on flat regions or in local minima. Worse, the sigmoid derivative s*(1-s) multiplies into the gradient, so a confidently wrong prediction (s near 1, y = 0) produces an almost zero gradient and learns nothing. Log loss cancels that factor: its gradient is (s - y)*x, largest exactly when the model is most wrong.", "whyWrong": ["It is log loss, not squared error, that blows up at exactly 0 or 1 — which is why cross-entropy implementations clip probabilities.", "Gradient descent works fine on MSE; there is simply no closed form once a sigmoid sits in the middle.", "The sigmoid already maps any real number into (0,1); the choice of loss does not change the output range."]}, "he": {"q": "מדוע שגיאה ריבועית (MSE) היא פונקציית לוס גרועה לרגרסיה לוגיסטית?", "options": ["היא אינה מוגדרת כאשר ההסתברות החזויה היא בדיוק 0 או 1", "אי אפשר למזער אותה ב-gradient descent, רק בנוסחה סגורה", "היא דוחפת חיזויים אל מחוץ ל-[0,1], והסיגמואיד גוזם אותם", "היא אינה קמורה ב-w והגרדיאנט שלה מת בטעויות בטוחות"], "hint": "חשבו מה גודל הגרדיאנט כשהמודל אומר 0.99 והתווית היא 0.", "explanation": "הרכבה של MSE על סיגמואיד אינה קמורה ב-w, ולכן האופטימיזציה עלולה להיתקע באזורים שטוחים או במינימום מקומי. גרוע מכך, הנגזרת של הסיגמואיד, s*(1-s), מוכפלת לתוך הגרדיאנט: חיזוי בטוח ושגוי (s קרוב ל-1 מול y = 0) מייצר גרדיאנט אפסי כמעט ולא לומד דבר. log loss מבטלת את הגורם הזה — הגרדיאנט שלה הוא (s - y)*x, וגדול בדיוק כשהמודל הכי טועה.", "whyWrong": ["דווקא log loss, ולא שגיאה ריבועית, מתפוצצת ב-0 או ב-1 מדויקים; לכן מימושי cross-entropy גוזמים הסתברויות.", "‏gradient descent עובד מצוין על MSE; פשוט אין פתרון סגור כשיש סיגמואיד באמצע.", "הסיגמואיד כבר ממפה כל מספר ממשי לטווח (0,1); בחירת פונקציית הלוס אינה משנה את טווח הפלט."]}}, {"id": "cml-006", "area": "classical-ml", "topic": "decision-trees", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["gini", "impurity", "splits"], "answer": 1, "en": {"q": "A node holds 8 positives and 8 negatives. A split sends 6 pos + 2 neg left and 2 pos + 6 neg right. What is the Gini impurity decrease?", "options": ["0.375", "0.125", "0.1875", "0.0625"], "hint": "Parent impurity minus the sample-weighted average impurity of the two children.", "explanation": "The parent's Gini is 1 - 0.5^2 - 0.5^2 = 0.5. Each child is 75/25, so its Gini is 1 - 0.75^2 - 0.25^2 = 0.375, and each child holds 8 of the 16 samples, so the weighted impurity after the split is also 0.375. The decrease is 0.5 - 0.375 = 0.125.", "whyWrong": ["0.375 is the weighted impurity after the split, not the decrease — it still has to be subtracted from the parent's 0.5.", "0.1875 applies only one child's weight (0.5 times 0.375) instead of summing both weighted children, which gives 0.375.", "0.0625 is 0.25^2, the minority-class term inside one child, not an impurity decrease."]}, "he": {"q": "בצומת יש 8 חיוביים ו-8 שליליים. פיצול שולח 6 חיוביים ו-2 שליליים שמאלה, ו-2 חיוביים ו-6 שליליים ימינה. מהי ירידת אי-הטוהר לפי Gini?", "options": ["0.375", "0.125", "0.1875", "0.0625"], "hint": "אי-טוהר האב פחות הממוצע המשוקלל (לפי מספר הדגימות) של אי-הטוהר בשני הבנים.", "explanation": "‏Gini של האב הוא 1 - 0.5^2 - 0.5^2 = 0.5. כל בן הוא בהתפלגות 75/25, ולכן ה-Gini שלו הוא 1 - 0.75^2 - 0.25^2 = 0.375, וכל בן מחזיק 8 מתוך 16 הדגימות — כך שאי-הטוהר המשוקלל אחרי הפיצול הוא גם 0.375. הירידה היא 0.5 - 0.375 = 0.125.", "whyWrong": ["‏0.375 הוא אי-הטוהר המשוקלל אחרי הפיצול ולא הירידה; עדיין צריך לחסר אותו מ-0.5 של האב.", "‏0.1875 מחיל משקל של בן אחד בלבד (0.5 כפול 0.375) במקום לסכום את שני הבנים המשוקללים, שנותנים יחד 0.375.", "‏0.0625 הוא 0.25^2, האיבר של מחלקת המיעוט בתוך בן אחד, ולא ירידת אי-טוהר."]}}, {"id": "cml-007", "area": "classical-ml", "topic": "decision-trees", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["pruning", "overfitting", "complexity"], "answer": 3, "en": {"q": "In cost-complexity pruning a tree minimizes R(T) + alpha*|T|, where |T| is the number of leaves. What happens as alpha grows?", "options": ["The tree keeps growing, because each extra leaf becomes cheaper", "Training error falls while test error rises", "Only splits with zero impurity decrease get removed, whatever alpha is", "Subtrees collapse into leaves, so bias rises and variance falls"], "hint": "alpha is the price of a leaf. What does a rising price do to how many you buy?", "explanation": "alpha prices every leaf, so as it grows any subtree whose error reduction is worth less than alpha collapses into a single leaf. The result is a simpler tree with higher bias and lower variance; alpha = 0 returns the fully grown tree. The optimal alpha is picked by cross-validation, and the sequence of pruned trees is nested.", "whyWrong": ["It is the reverse: alpha is the price per leaf, so raising it makes leaves more expensive and the tree smaller.", "Pruning raises training error by construction; the hope is that test error falls, which is the entire point.", "Zero-gain splits are already removed at alpha = 0; a positive alpha also removes splits whose gain is real but smaller than alpha."]}, "he": {"q": "בגיזום לפי עלות-מורכבות (cost-complexity pruning) העץ ממזער את R(T) + alpha*|T|, כאשר |T| הוא מספר העלים. מה קורה כש-alpha גדל?", "options": ["העץ ממשיך לגדול, כי כל עלה נוסף נעשה זול יותר", "שגיאת האימון יורדת בעוד שגיאת המבחן עולה", "רק פיצולים עם ירידת אי-טוהר אפסית מוסרים, לא משנה מהו alpha", "תתי-עצים מתמוטטים לעלים, כך שההטיה עולה והשונות יורדת"], "hint": "‏alpha הוא המחיר של עלה. מה עושה מחיר עולה לכמות שקונים?", "explanation": "‏alpha מתמחר כל עלה, ולכן ככל שהוא גדל כך כל תת-עץ שהפחתת השגיאה שלו שווה פחות מ-alpha מתמוטט לעלה יחיד. התוצאה היא עץ פשוט יותר, עם הטיה גבוהה יותר ושונות נמוכה יותר; ב-alpha = 0 מתקבל העץ המלא. את alpha האופטימלי בוחרים ב-cross-validation, וסדרת העצים הגזומים מקוננת.", "whyWrong": ["ההפך הוא הנכון: alpha הוא המחיר לכל עלה, ולכן העלאתו מייקרת עלים ומקטינה את העץ.", "גיזום מעלה את שגיאת האימון מעצם הגדרתו; התקווה היא ששגיאת המבחן תרד, וזו כל המטרה.", "פיצולים עם רווח אפס מוסרים כבר ב-alpha = 0; alpha חיובי מסיר גם פיצולים שהרווח שלהם אמיתי אך קטן מ-alpha."]}}, {"id": "cml-008", "area": "classical-ml", "topic": "random-forest", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["bagging", "ensembles", "decorrelation"], "answer": 0, "en": {"q": "What does a random forest do that plain bagged decision trees do not?", "options": ["It picks a random subset of features at each split", "It draws a bootstrap sample of the rows before growing each tree", "It weights each tree's vote by that tree's own accuracy", "It grows each tree on a random subset of the classes"], "hint": "Both of them resample rows. What else is there to resample?", "explanation": "Bagging already bootstraps rows; a random forest additionally restricts every split to a random subset of features (mtry). That decorrelates the trees, so averaging cuts variance far more — if one feature dominates, bagged trees all look alike and their errors are correlated. Averaging correlated predictors reduces variance much less than averaging independent ones.", "whyWrong": ["Bootstrapping the rows is bagging itself; the forest inherits it rather than adding it.", "A random forest averages or votes with equal weight; accuracy weighting is closer to boosting's alpha.", "Every class is present in every tree — it is the feature set that gets subsampled, not the label set."]}, "he": {"q": "מה עושה random forest שעצי החלטה עם bagging בלבד אינם עושים?", "options": ["בוחר תת-קבוצה אקראית של פיצ'רים בכל פיצול", "דוגם bootstrap של השורות לפני בניית כל עץ", "משקלל את ההצבעה של כל עץ לפי הדיוק של אותו עץ", "מגדל כל עץ על תת-קבוצה אקראית של המחלקות"], "hint": "שניהם דוגמים שורות מחדש. מה עוד אפשר לדגום?", "explanation": "‏bagging כבר דוגם שורות ב-bootstrap; random forest מוסיף הגבלה של כל פיצול לתת-קבוצה אקראית של פיצ'רים (mtry). זה מפחית את המתאם בין העצים, ולכן המיצוע מקטין את השונות הרבה יותר: אם יש פיצ'ר דומיננטי אחד, כל העצים ב-bagging נראים דומים והשגיאות שלהם מתואמות. מיצוע מנבאים מתואמים מקטין שונות הרבה פחות ממיצוע מנבאים בלתי תלויים.", "whyWrong": ["דגימת bootstrap של השורות היא bagging עצמו; היער יורש אותה ולא מוסיף אותה.", "‏random forest ממצע או מצביע במשקל שווה; שקלול לפי דיוק דומה יותר ל-alpha של boosting.", "כל המחלקות נוכחות בכל עץ; מה שנדגם הוא קבוצת הפיצ'רים ולא קבוצת התוויות."]}}, {"id": "cml-009", "area": "classical-ml", "topic": "boosting", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["lightgbm", "xgboost", "tree-growth"], "answer": 1, "en": {"q": "LightGBM grows trees leaf-wise (best-first) while classic XGBoost grows level-wise. What is the practical consequence?", "options": ["Leaf-wise trees stay shallower than level-wise trees for the same number of leaves", "Leaf-wise cuts loss faster per leaf but overfits small data unless leaves are capped", "Leaf-wise growth is deterministic, while level-wise depends on the order of the features", "Level-wise growth cannot use histogram-based split finding, so it is always slower"], "hint": "Both keep adding leaves — the question is which leaf splits next, and how lopsided the tree gets.", "explanation": "Leaf-wise always splits the leaf with the largest loss reduction, so for a fixed leaf budget it drives training loss down faster than level-wise, which expands a whole level at a time. The cost is deep, unbalanced trees that can carve out tiny regions, which is why num_leaves, max_depth and min_data_in_leaf matter so much on small datasets. Both libraries support histogram-based splitting.", "whyWrong": ["The opposite: repeatedly splitting the best leaf produces deep, unbalanced trees, which is exactly why max_depth is still worth setting.", "Both growth policies are deterministic given the data and the parameters; randomness comes from row and column subsampling, not from the policy.", "Histogram binning is orthogonal to the growth policy — XGBoost's hist and approx methods use it with level-wise growth."]}, "he": {"q": "‏LightGBM מגדל עצים leaf-wise (הטוב ביותר קודם) בעוד XGBoost הקלאסי מגדל level-wise. מהי ההשלכה המעשית?", "options": ["עצי leaf-wise נשארים רדודים יותר מעצי level-wise עבור אותו מספר עלים", "‏leaf-wise מוריד לוס מהר יותר לכל עלה, אך מתאים יתר על המידה בדאטה קטן ללא הגבלת עלים", "גידול leaf-wise דטרמיניסטי, בעוד level-wise תלוי בסדר הפיצ'רים", "גידול level-wise אינו יכול להשתמש בחיפוש פיצולים מבוסס היסטוגרמות, ולכן הוא תמיד איטי יותר"], "hint": "שניהם ממשיכים להוסיף עלים — השאלה היא איזה עלה מתפצל הבא, וכמה לא מאוזן העץ נעשה.", "explanation": "‏leaf-wise מפצל תמיד את העלה עם הפחתת הלוס הגדולה ביותר, ולכן עבור תקציב עלים נתון הוא מוריד את לוס האימון מהר יותר מ-level-wise שמרחיב שכבה שלמה בכל פעם. המחיר הוא עצים עמוקים ולא מאוזנים שיכולים לבודד אזורים זעירים, ולכן num_leaves,‏ max_depth ו-min_data_in_leaf קריטיים כל כך בדאטה קטן. שתי הספריות תומכות בפיצול מבוסס היסטוגרמות.", "whyWrong": ["ההפך הוא הנכון: פיצול חוזר של העלה הטוב ביותר יוצר עצים עמוקים ולא מאוזנים, ובדיוק לכן עדיין כדאי להגדיר max_depth.", "שתי מדיניות הגידול דטרמיניסטיות בהינתן הנתונים והפרמטרים; האקראיות מגיעה מדגימת שורות ועמודות, לא ממדיניות הגידול.", "חלוקה לבינים היסטוגרמיים אינה קשורה למדיניות הגידול; השיטות hist ו-approx של XGBoost משתמשות בה עם גידול level-wise."]}}, {"id": "cml-010", "area": "classical-ml", "topic": "boosting", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["shrinkage", "early-stopping", "regularization"], "en": {"q": "Your gradient boosting model reaches near-zero training error and poor validation error. Which knobs would you turn, and how do shrinkage and early stopping interact?", "hint": "Think about how many trees, how big each tree's step is, how complex each tree is — and who decides when to stop.", "modelAnswer": "I would lower the learning rate (shrinkage) and cap tree complexity: smaller max_depth or num_leaves, larger min_child_weight or min_samples_leaf, plus row and column subsampling per tree and L1/L2 penalties on the leaf values. Learning rate and number of trees trade off directly — halving the learning rate roughly doubles the trees needed — so a small rate only helps if the ensemble is allowed to be long enough. Early stopping picks that length automatically by monitoring the metric on a held-out validation set and stopping after n rounds without improvement. Since that validation set is now part of model selection, the final generalization estimate must come from a separate test set.", "rubric": ["Names the learning rate (shrinkage) as a primary regularizer and its trade-off with the number of trees", "Names tree-complexity limits (depth, leaves, minimum samples per leaf) and/or subsampling and leaf L2", "Explains early stopping as monitoring a held-out validation metric with a patience window", "Notes that the early-stopping set is consumed by model selection, so a separate test set is needed"]}, "he": {"q": "מודל gradient boosting שלכם מגיע לשגיאת אימון אפסית כמעט ולביצועי ולידציה גרועים. אילו פרמטרים תכווננו, וכיצד shrinkage ו-early stopping משפיעים זה על זה?", "hint": "חשבו על כמה עצים, על גודל הצעד של כל עץ, על מורכבות כל עץ — ומי מחליט מתי לעצור.", "modelAnswer": "הייתי מקטין את קצב הלמידה (shrinkage) ומגביל את מורכבות העצים: max_depth או num_leaves קטנים יותר, min_child_weight גדול יותר, ובנוסף דגימת שורות ועמודות לכל עץ וקנסות L1/L2 על ערכי העלים. קצב הלמידה ומספר העצים מתחלפים ישירות — חצייה של קצב הלמידה מכפילה בערך את מספר העצים הדרוש — ולכן קצב קטן עוזר רק אם מרשים לאנסמבל להיות ארוך מספיק. early stopping בוחר את האורך הזה אוטומטית: עוקבים אחרי המדד על סט ולידציה מוחזק ועוצרים אחרי n סבבים ללא שיפור. מכיוון שסט הוולידציה הזה הפך לחלק מבחירת המודל, הערכת ההכללה הסופית חייבת להגיע מסט מבחן נפרד.", "rubric": ["מזכיר את קצב הלמידה (shrinkage) כרגולריזציה מרכזית ואת חילופי הגומלין שלו עם מספר העצים", "מזכיר הגבלת מורכבות עץ (עומק, עלים, מינימום דגימות בעלה) או דגימת שורות ועמודות וקנס L2 על עלים", "מסביר early stopping כמעקב אחרי מדד על סט ולידציה מוחזק עם חלון סבלנות", "מציין שסט ה-early stopping נצרך לבחירת מודל, ולכן דרוש סט מבחן נפרד"]}}, {"id": "cml-011", "area": "classical-ml", "topic": "adaboost", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["adaboost", "weighting", "ensembles"], "answer": 1, "en": {"q": "After every round, AdaBoost updates the training distribution. What happens to the weights?", "options": ["All weights decay geometrically, so later rounds see fewer effective samples", "Misclassified examples gain weight, so the next learner focuses on them", "Weights are reset to uniform so that every weak learner stays independent", "Examples nearest the decision boundary have their weights set to zero"], "hint": "The next weak learner should care most about whatever the ensemble just got wrong.", "explanation": "AdaBoost multiplies up the weights of misclassified points, multiplies down the weights of correct ones, and renormalizes, so the next weak learner trains on a distribution tilted toward the current mistakes. Each learner also earns a vote alpha = 0.5*ln((1-err)/err), which is large when its weighted error is small and negative if it does worse than chance.", "whyWrong": ["The weights are renormalized into a distribution each round: correct examples go down and mistakes go up, rather than everything shrinking together.", "Resetting to uniform would make every learner identical on the same data — the sequential reweighting is the whole of AdaBoost.", "That describes discarding support-vector-like points; AdaBoost never zeroes a weight, it only reweights."]}, "he": {"q": "אחרי כל סבב, AdaBoost מעדכן את התפלגות משקלי האימון. מה קורה למשקלים?", "options": ["כל המשקלים דועכים גאומטרית, כך שסבבים מאוחרים רואים פחות דגימות אפקטיביות", "משקלן של דגימות שסווגו שגוי עולה, כך שהלומד הבא מתמקד בהן", "המשקלים מאופסים לאחידים כדי שכל לומד חלש יישאר בלתי תלוי", "משקלן של הדגימות הקרובות ביותר לגבול ההחלטה מאופס"], "hint": "הלומד החלש הבא צריך להתעניין בעיקר במה שהאנסמבל בדיוק פספס.", "explanation": "‏AdaBoost מגדיל את משקלן של הדגימות שסווגו שגוי, מקטין את משקלן של הנכונות ואז מנרמל, כך שהלומד הבא מאומן על התפלגות שמוטה לטובת הטעויות הנוכחיות. כל לומד מקבל גם משקל הצבעה alpha = 0.5*ln((1-err)/err), שגדול כאשר השגיאה המשוקללת שלו קטנה ושלילי אם הוא גרוע מניחוש אקראי.", "whyWrong": ["המשקלים מנורמלים להתפלגות בכל סבב: הנכונים יורדים והשגויים עולים, ולא הכול מתכווץ יחד.", "איפוס לאחיד היה הופך את כל הלומדים לזהים על אותם נתונים; השקלול הסדרתי הוא כל מהותו של AdaBoost.", "זה תיאור של זריקת נקודות דמויות support vectors; AdaBoost לעולם אינו מאפס משקל אלא רק משקלל מחדש."]}}, {"id": "cml-012", "area": "classical-ml", "topic": "svm", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["rbf", "hyperparameters", "overfitting"], "answer": 2, "en": {"q": "You train an RBF-kernel SVM. Training accuracy is 100% and test accuracy is poor. Which change most directly reduces the overfitting?", "options": ["Increase C and decrease gamma", "Increase both C and gamma", "Decrease C and decrease gamma", "Decrease C and increase gamma"], "hint": "One parameter prices margin violations; the other sets how far a single point's influence reaches.", "explanation": "A large C penalizes slack heavily and forces a narrow, wiggly margin that fits noise, so lowering C allows more violations and a smoother boundary. A large gamma shrinks the RBF width so each support vector only influences its immediate neighbourhood, producing islands around individual points; lowering gamma widens that influence. Reducing both regularizes the model.", "whyWrong": ["Raising C punishes margin violations harder and forces an even tighter fit to the training points.", "Both changes push toward memorization: a rigid margin together with a very narrow kernel bandwidth.", "Raising gamma shrinks each support vector's radius of influence and carves islands around individual training points."]}, "he": {"q": "אימנתם SVM עם קרנל RBF. דיוק האימון הוא 100% ודיוק המבחן ירוד. איזה שינוי מפחית את התאמת היתר (overfitting) בצורה הישירה ביותר?", "options": ["להגדיל את C ולהקטין את gamma", "להגדיל גם את C וגם את gamma", "להקטין את C ולהקטין את gamma", "להקטין את C ולהגדיל את gamma"], "hint": "פרמטר אחד מתמחר הפרות מרווח; השני קובע עד כמה רחוק מגיעה ההשפעה של נקודה בודדת.", "explanation": "‏C גדול מעניש בחומרה משתני slack ומאלץ מרווח צר ומפותל שמתאים את עצמו לרעש, ולכן הקטנת C מאפשרת יותר הפרות וגבול חלק יותר. gamma גדול מצמצם את רוחב ה-RBF כך שכל support vector משפיע רק בסביבתו המיידית ונוצרים איים סביב נקודות בודדות; הקטנת gamma מרחיבה את ההשפעה. הקטנת שניהם מרגלרת את המודל.", "whyWrong": ["הגדלת C מענישה הפרות מרווח חזק יותר ומאלצת התאמה הדוקה עוד יותר לנקודות האימון.", "שני השינויים דוחפים לשינון: מרווח נוקשה יחד עם רוחב קרנל צר מאוד.", "הגדלת gamma מכווצת את רדיוס ההשפעה של כל support vector ויוצרת איים סביב נקודות אימון בודדות."]}}, {"id": "cml-013", "area": "classical-ml", "topic": "svm", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["kernel-trick", "duality", "mercer"], "en": {"q": "Explain the kernel trick to a colleague: what does it compute, why is it cheaper than an explicit feature map, and what does it require of the kernel?", "hint": "The dual formulation of an SVM touches the data through only one kind of operation.", "modelAnswer": "The dual SVM depends on the data only through inner products x_i . x_j, so replacing every inner product with K(x_i, x_j) = phi(x_i) . phi(x_j) trains the model in the feature space phi without ever computing phi(x). That is the trick: an RBF kernel corresponds to an infinite-dimensional feature map, yet each kernel evaluation costs O(d). The kernel must be symmetric and positive semidefinite (Mercer's condition) for such a phi to exist and for the problem to stay convex. The price is training that scales roughly between O(n^2) and O(n^3) in the number of samples and keeping the support vectors at prediction time, so linear models win on very large n.", "rubric": ["States that the dual depends on the data only through inner products", "K(x, x') = phi(x) . phi(x') is evaluated without ever materializing phi", "The kernel must be symmetric and positive semidefinite (Mercer) for a valid feature space and convexity", "Gives a concrete cost or example: RBF as an infinite-dimensional map, O(n^2)-O(n^3) training, support vectors at inference"]}, "he": {"q": "הסבירו לעמית מהו kernel trick: מה הוא מחשב, מדוע הוא זול יותר ממיפוי פיצ'רים מפורש, ומה נדרש מהקרנל?", "hint": "הניסוח הדואלי של SVM נוגע בנתונים רק דרך סוג אחד של פעולה.", "modelAnswer": "ה-SVM הדואלי תלוי בנתונים רק דרך מכפלות פנימיות x_i . x_j, ולכן החלפת כל מכפלה פנימית ב-K(x_i, x_j) = phi(x_i) . phi(x_j) מאמנת את המודל במרחב הפיצ'רים phi בלי לחשב את phi(x) אף פעם. זהו הטריק: קרנל RBF מתאים למיפוי למרחב אינסופי-ממדי, ובכל זאת כל חישוב קרנל עולה O(d). הקרנל חייב להיות סימטרי וחצי-מוגדר חיובי (תנאי Mercer) כדי ש-phi כזה יתקיים והבעיה תישאר קמורה. המחיר הוא אימון שמתנהג בערך בין O(n^2) ל-O(n^3) במספר הדגימות ושמירת ה-support vectors בזמן חיזוי, ולכן על n גדול מאוד מודלים לינאריים מנצחים.", "rubric": ["מציין שהניסוח הדואלי תלוי בנתונים רק דרך מכפלות פנימיות", "מסביר ש-K(x, x') = phi(x) . phi(x') מחושב בלי לבנות את phi בפועל", "דורש קרנל סימטרי וחצי-מוגדר חיובי (Mercer) לקיום מרחב פיצ'רים ולשמירת הקמירות", "נותן מחיר או דוגמה קונקרטיים: RBF כמיפוי אינסופי-ממדי, אימון O(n^2)-O(n^3), support vectors בזמן חיזוי"]}}, {"id": "cml-014", "area": "classical-ml", "topic": "knn", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["curse-of-dimensionality", "distance", "knn"], "en": {"q": "Why does k-nearest-neighbours degrade as dimensionality grows, even when the number of samples is large? What would you do about it?", "hint": "Compare the distance to the nearest neighbour with the distance to the farthest one as d grows.", "modelAnswer": "In high dimensions distances concentrate: the ratio between the nearest and the farthest neighbour distance tends to 1, so 'nearest' stops carrying information and the neighbourhood becomes nearly arbitrary. The sample requirement also explodes — keeping a fixed fraction of the volume inside a local neighbourhood needs a number of points growing exponentially in d. On top of that, every irrelevant feature adds noise to every distance, drowning out the few informative dimensions. Remedies: reduce dimension (PCA, learned embeddings) or select features, learn a metric, standardize so no unit dominates, and consider models that choose their own relevant features, such as trees.", "rubric": ["Distance concentration: nearest and farthest distances converge, so the ranking becomes uninformative", "Exponential sample requirement to keep a neighbourhood genuinely local", "Irrelevant or unscaled features dilute the distance", "Concrete remedies: dimensionality reduction, feature selection or metric learning, standardization"]}, "he": {"q": "מדוע הביצועים של k-nearest neighbours מתדרדרים ככל שהממד גדל, גם כשמספר הדגימות גדול? מה הייתם עושים בנידון?", "hint": "השוו את המרחק לשכן הקרוב ביותר למרחק לשכן הרחוק ביותר ככל ש-d גדל.", "modelAnswer": "בממד גבוה המרחקים מתרכזים: היחס בין המרחק לשכן הקרוב ביותר לבין המרחק לרחוק ביותר שואף ל-1, ולכן 'הקרוב ביותר' מפסיק לשאת מידע והשכנוּת נעשית כמעט שרירותית. גם דרישת הדגימות מתפוצצת — כדי לשמור חלק קבוע מהנפח בתוך שכנות מקומית דרוש מספר נקודות שגדל אקספוננציאלית ב-d. נוסף על כך, כל פיצ'ר לא רלוונטי מוסיף רעש לכל מרחק ומטביע את המימדים הבודדים שכן אינפורמטיביים. פתרונות: הורדת ממד (PCA, embeddings נלמדים) או בחירת פיצ'רים, למידת מטריקה, סטנדרטיזציה כדי שאף יחידת מידה לא תשתלט, ושקילת מודלים שבוחרים בעצמם את הפיצ'רים הרלוונטיים, כמו עצים.", "rubric": ["ריכוז מרחקים: המרחק הקרוב והרחוק מתכנסים זה לזה, ולכן הדירוג מאבד מידע", "דרישת דגימות אקספוננציאלית כדי שהשכנות תישאר באמת מקומית", "פיצ'רים לא רלוונטיים או לא מנורמלים מדללים את המרחק", "פתרונות קונקרטיים: הורדת ממד, בחירת פיצ'רים או למידת מטריקה, וסטנדרטיזציה"]}}, {"id": "cml-015", "area": "classical-ml", "topic": "naive-bayes", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["naive-bayes", "independence", "generative"], "answer": 2, "en": {"q": "What exactly is 'naive' about naive Bayes?", "options": ["It assumes the class prior is uniform across the classes", "It assumes every feature follows a normal distribution", "It assumes the features are conditionally independent given the class", "It assumes the classes are linearly separable somewhere in feature space"], "hint": "It is an assumption about the joint distribution of the features, not about the prior or the boundary.", "explanation": "Naive Bayes factorizes P(x|y) into a product of P(x_j|y), i.e. it assumes conditional independence of the features given the class. That is usually false — words in a document are correlated — yet the classifier often ranks classes correctly anyway, because the argmax survives badly calibrated probabilities. The Gaussian variant adds a normality assumption, but that is a choice of likelihood, not the naive assumption itself.", "whyWrong": ["The prior is estimated from class frequencies (or supplied by hand) and need not be uniform at all.", "Only the Gaussian variant assumes that; multinomial and Bernoulli naive Bayes assume no such thing.", "Naive Bayes makes no separability assumption; with shared Gaussian variances the boundary happens to come out linear, but that is a consequence."]}, "he": {"q": "מה בדיוק 'נאיבי' ב-naive Bayes?", "options": ["ההנחה שההתפלגות הפריורית של המחלקות אחידה", "ההנחה שכל פיצ'ר מתפלג נורמלית", "ההנחה שהפיצ'רים בלתי תלויים בהינתן המחלקה", "ההנחה שהמחלקות ניתנות להפרדה לינארית איפשהו במרחב הפיצ'רים"], "hint": "מדובר בהנחה על ההתפלגות המשותפת של הפיצ'רים, לא על הפריור ולא על גבול ההחלטה.", "explanation": "‏naive Bayes מפרק את P(x|y) למכפלה של P(x_j|y), כלומר מניח אי-תלות מותנית בין הפיצ'רים בהינתן המחלקה. ההנחה בדרך כלל שגויה — מילים במסמך מתואמות — ובכל זאת המסווג לרוב מדרג מחלקות נכון, כי ה-argmax שורד גם כשההסתברויות אינן מכוילות. הווריאנט הגאוסי מוסיף הנחת נורמליות, אבל זו בחירת likelihood ולא ההנחה הנאיבית עצמה.", "whyWrong": ["הפריור נאמד משכיחות המחלקות (או נקבע ידנית) ואינו חייב להיות אחיד כלל.", "רק הווריאנט הגאוסי מניח זאת; multinomial ו-Bernoulli naive Bayes אינם מניחים דבר כזה.", "‏naive Bayes אינו מניח הפרדה לינארית; בגרסה גאוסית עם שונויות משותפות הגבול יוצא לינארי, אבל זו תוצאה ולא הנחה."]}}, {"id": "cml-016", "area": "classical-ml", "topic": "k-means", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["lloyd", "convergence", "initialization"], "answer": 0, "en": {"q": "Which statement about Lloyd's algorithm for k-means is true?", "options": ["Each step weakly decreases the within-cluster sum of squares, and it halts", "Given enough iterations it converges to the global minimum of that objective", "It converges only when the true clusters are linearly separable", "Seeding with k-means++ guarantees that the global optimum is found"], "hint": "Both steps of the loop optimize the same objective — but that tells you about direction, not destination.", "explanation": "The assignment step and the centroid update step each weakly decrease the WCSS objective, and there are only finitely many possible assignments, so the algorithm halts at a local optimum. k-means is NP-hard in general, so no polynomial procedure guarantees the global optimum; k-means++ only gives an O(log k) approximation in expectation, which is why practitioners run several restarts (n_init).", "whyWrong": ["Lloyd's is a local search: different initializations converge to different local optima, which is precisely why n_init > 1 exists.", "Convergence follows from the monotone objective regardless of cluster shape; separability affects the quality of the answer, not termination.", "k-means++ improves the expected objective by an O(log k) factor — it is a smarter seed, not a global optimizer."]}, "he": {"q": "איזו טענה על אלגוריתם Lloyd עבור k-means נכונה?", "options": ["כל צעד מקטין (חלשות) את סכום הריבועים בתוך האשכולות, והאלגוריתם עוצר", "עם מספיק איטרציות הוא מתכנס למינימום הגלובלי של אותה פונקציית מטרה", "הוא מתכנס רק כאשר האשכולות האמיתיים ניתנים להפרדה לינארית", "אתחול ב-k-means++ מבטיח הגעה לאופטימום הגלובלי"], "hint": "שני שלבי הלולאה ממזערים את אותה פונקציית מטרה, אבל זה מלמד על הכיוון ולא על היעד.", "explanation": "שלב השיוך ושלב עדכון המרכזים מקטינים (חלשות) את פונקציית ה-WCSS, ומכיוון שיש מספר סופי של שיוכים אפשריים האלגוריתם עוצר באופטימום מקומי. k-means היא בעיה NP-קשה בכלליות, ולכן שום הליך פולינומי אינו מבטיח אופטימום גלובלי; k-means++ נותן רק קירוב של O(log k) בתוחלת, ובגלל זה בפועל מריצים כמה אתחולים (n_init).", "whyWrong": ["‏Lloyd הוא חיפוש מקומי: אתחולים שונים מתכנסים לאופטימומים מקומיים שונים, ובדיוק לכן קיים n_init גדול מ-1.", "ההתכנסות נובעת מהמונוטוניות של פונקציית המטרה ללא קשר לצורת האשכולות; ההפרדה משפיעה על איכות התשובה ולא על העצירה.", "‏k-means++ משפר את תוחלת פונקציית המטרה בפקטור O(log k); זהו אתחול חכם ולא פותר גלובלי."]}}, {"id": "cml-017", "area": "classical-ml", "topic": "dbscan", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["density", "clustering", "outliers"], "answer": 1, "en": {"q": "You have two interleaved crescent-shaped clusters plus scattered noise. Why does DBSCAN fit better than k-means here?", "options": ["DBSCAN scales to millions of points far better than k-means does", "It grows clusters by density, so odd shapes survive and outliers are noise", "It optimizes the same objective as k-means but from a better initialization", "It needs no hyperparameters at all, unlike k-means with its k"], "hint": "Ask what shape a k-means cluster is allowed to have, and where the outliers must end up.", "explanation": "k-means assigns every point to the nearest centroid, so its clusters are convex Voronoi cells and every outlier is forced into some cluster, dragging that centroid. DBSCAN links density-reachable points, so a crescent stays a single cluster and points in no dense region are labelled noise. It does have hyperparameters — eps and min_samples — and it struggles when cluster densities differ a lot.", "whyWrong": ["With a spatial index DBSCAN is roughly O(n log n), but k-means is famously cheap too; speed is not the reason here.", "DBSCAN has no centroid objective at all — it is a density-connectivity definition, not a variant of Lloyd's algorithm.", "It trades k for eps and min_samples, and eps is notoriously fiddly when densities vary."]}, "he": {"q": "יש לכם שני אשכולות בצורת סהר שמשתלבים זה בזה, ובנוסף רעש מפוזר. מדוע DBSCAN מתאים כאן יותר מ-k-means?", "options": ["‏DBSCAN מתרחב למיליוני נקודות הרבה יותר טוב מ-k-means", "הוא מרחיב אשכולות לפי צפיפות, ולכן צורות מוזרות שורדות וחריגים הם רעש", "הוא ממזער את אותה פונקציית מטרה כמו k-means אבל מאתחול טוב יותר", "הוא אינו דורש היפר-פרמטרים כלל, בניגוד ל-k של k-means"], "hint": "שאלו איזו צורה מותר לאשכול של k-means לקבל, ולאן חייבים החריגים להגיע.", "explanation": "‏k-means משייך כל נקודה למרכז הקרוב ביותר, ולכן האשכולות שלו הם תאי Voronoi קמורים וכל חריג נדחף לאיזשהו אשכול ומושך את המרכז שלו. DBSCAN מחבר נקודות שנגישות בצפיפות, ולכן סהר נשאר אשכול אחד, ונקודות שאינן באזור צפוף מסומנות כרעש. יש לו היפר-פרמטרים משלו — eps ו-min_samples — והוא מתקשה כשצפיפויות האשכולות שונות מאוד.", "whyWrong": ["עם אינדקס מרחבי DBSCAN הוא בערך O(n log n), אבל גם k-means ידוע כזול מאוד; המהירות אינה הסיבה כאן.", "ל-DBSCAN אין פונקציית מטרה של מרכזים כלל; הוא הגדרה של קשירות בצפיפות ולא וריאנט של אלגוריתם Lloyd.", "הוא מחליף את k ב-eps וב-min_samples, ו-eps ידוע כרגיש במיוחד כשהצפיפויות משתנות."]}}, {"id": "cml-018", "area": "classical-ml", "topic": "hierarchical-clustering", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["linkage", "chaining", "agglomerative"], "answer": 3, "en": {"q": "Agglomerative clustering with single linkage produces long, snaking clusters. Why?", "options": ["It merges the pair that minimizes the increase in within-cluster variance", "It uses the average distance over all cross-cluster pairs, which favours elongated shapes", "It merges on the largest cross-cluster distance, which outliers dominate", "It merges on the smallest cross-cluster distance, so one close pair joins two clusters"], "hint": "Single linkage looks at exactly one pair of points between two clusters. Which pair?", "explanation": "Single linkage defines cluster distance as the minimum over cross-cluster pairs, so a single bridge of nearby points merges two otherwise distant groups — the chaining effect. It is the linkage that can recover non-elliptical shapes, but it is fragile to noise sitting between clusters. Complete linkage uses the maximum and yields compact clusters, while Ward's minimizes the variance increase.", "whyWrong": ["That is Ward's linkage, which produces compact, roughly equal-sized clusters — the opposite of chaining.", "That is average linkage, a compromise between single and complete that chains far less.", "That is complete linkage; using the maximum makes compact clusters and splits elongated shapes apart."]}, "he": {"q": "אשכול היררכי צברני (agglomerative) עם single linkage מייצר אשכולות ארוכים ומתפתלים. מדוע?", "options": ["הוא מאחד את הזוג שממזער את הגידול בשונות הפנימית של האשכולות", "הוא משתמש במרחק הממוצע על פני כל הזוגות החוצים, מה שמעדיף צורות מוארכות", "הוא מאחד לפי המרחק החוצה הגדול ביותר, שנשלט על ידי חריגים", "הוא מאחד לפי המרחק החוצה הקטן ביותר, ולכן זוג קרוב אחד מחבר שני אשכולות"], "hint": "‏single linkage מסתכל על זוג נקודות אחד בדיוק בין שני אשכולות. איזה זוג?", "explanation": "ב-single linkage המרחק בין אשכולות מוגדר כמינימום על פני הזוגות החוצים, ולכן גשר יחיד של נקודות קרובות מאחד שתי קבוצות רחוקות — אפקט השרשור (chaining). זו ה-linkage שמסוגלת לשחזר צורות לא אליפטיות, אבל היא שברירית לרעש שיושב בין אשכולות. complete linkage משתמשת במקסימום ומייצרת אשכולות קומפקטיים, ו-Ward ממזערת את הגידול בשונות.", "whyWrong": ["זו ה-linkage של Ward, שמייצרת אשכולות קומפקטיים ובגודל דומה — ההפך משרשור.", "זו average linkage, פשרה בין single ל-complete שמשרשרת הרבה פחות.", "זו complete linkage; שימוש במקסימום מייצר אשכולות קומפקטיים ומפצל צורות מוארכות."]}}, {"id": "cml-019", "area": "classical-ml", "topic": "gmm-em", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["gmm", "em", "soft-assignment"], "answer": 2, "en": {"q": "How does fitting a Gaussian mixture with EM differ from k-means?", "options": ["EM maximizes a likelihood, so unlike k-means it reaches the global optimum", "EM needs the number of components up front, while k-means infers k on its own", "EM gives each point soft responsibilities and fits a covariance per component", "EM has no assignment step at all; it only updates the component means"], "hint": "Think about hard versus soft membership, and about the shape a cluster is allowed to take.", "explanation": "The E step computes posterior responsibilities — a fractional membership of each point in each component — and the M step updates the means, covariances and mixing weights weighted by them. Because the covariances are free, components can be elongated and of different sizes, whereas k-means effectively assumes spherical, equally sized clusters. k-means is the limiting case of EM on a GMM with a shared spherical covariance shrinking to zero.", "whyWrong": ["EM is also a local method: the likelihood increases monotonically, but different initializations land on different optima.", "Both need the count in advance; k-means does not infer k either (BIC on a GMM is actually one way to choose it).", "The E step is the assignment step, just a soft one, and the M step updates means, covariances and mixing weights."]}, "he": {"q": "במה התאמת Gaussian Mixture Model באמצעות EM שונה מ-k-means?", "options": ["‏EM ממקסם likelihood, ולכן בניגוד ל-k-means הוא מגיע לאופטימום הגלובלי", "‏EM דורש את מספר הרכיבים מראש, בעוד k-means מסיק את k בעצמו", "‏EM נותן לכל נקודה שיוך רך (responsibility) ומתאים מטריצת שונויות לכל רכיב", "ל-EM אין שלב שיוך כלל; הוא רק מעדכן את ממוצעי הרכיבים"], "hint": "חשבו על שיוך קשיח מול רך, ועל הצורה שמותר לאשכול לקבל.", "explanation": "שלב ה-E מחשב responsibilities פוסטריוריות — שיוך חלקי של כל נקודה לכל רכיב — ושלב ה-M מעדכן את הממוצעים, מטריצות השונויות ומשקלי הערבוב משוקללים לפיהן. מכיוון שמטריצות השונויות חופשיות, רכיבים יכולים להיות מוארכים ובגדלים שונים, בעוד k-means מניח למעשה אשכולות כדוריים ושווי גודל. k-means הוא המקרה הגבולי של EM על GMM עם שונות כדורית משותפת ששואפת לאפס.", "whyWrong": ["גם EM הוא שיטה מקומית: ה-likelihood עולה מונוטונית, אבל אתחולים שונים נוחתים על אופטימומים שונים.", "שניהם דורשים את המספר מראש; גם k-means אינו מסיק את k (בחירת k לפי BIC על GMM היא דווקא דרך אחת לעשות זאת).", "שלב ה-E הוא שלב השיוך, רק בגרסה רכה, ושלב ה-M מעדכן ממוצעים, שונויות ומשקלי ערבוב."]}}, {"id": "cml-020", "area": "classical-ml", "topic": "pca", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["pca", "scaling", "variance"], "answer": 3, "en": {"q": "You run PCA on features measured in metres, kilograms and yen without standardizing them first. What happens?", "options": ["Nothing important — PCA is invariant to the units of each feature", "The loadings stay exactly the same but the explained-variance ratios flip sign", "PCA fails to converge because the covariance matrix is ill-conditioned", "The feature with the biggest numeric variance dominates PC1 and PC2"], "hint": "PCA maximizes variance — measured in whatever units you handed it.", "explanation": "PCA looks for directions of maximum variance in the covariance matrix, and variance is not unit-free: quoting a price in yen instead of thousands of yen inflates its variance a millionfold and drags PC1 onto that axis. Standardizing (equivalently, running PCA on the correlation matrix) puts every feature on equal footing. Standardize unless all features share a unit and their relative magnitudes are meaningful.", "whyWrong": ["PCA is invariant to rotation and translation, not to rescaling a single axis — variance is measured in the square of the feature's unit.", "Explained-variance ratios are non-negative by construction and cannot flip sign.", "An eigendecomposition of a covariance matrix does not 'fail to converge'; large scale differences change the answer, not the solvability."]}, "he": {"q": "הרצתם PCA על פיצ'רים שנמדדים במטרים, בקילוגרמים ובין יפני, בלי לתקנן (standardize) אותם קודם. מה קורה?", "options": ["שום דבר מהותי — PCA אינו רגיש ליחידות המידה של כל פיצ'ר", "הטעינות (loadings) נשארות זהות בדיוק אבל יחסי השונות המוסברת מתהפכים בסימן", "‏PCA אינו מצליח להתכנס כי מטריצת השונויות מותנית גרוע", "הפיצ'ר בעל השונות המספרית הגדולה ביותר משתלט על PC1 ו-PC2"], "hint": "‏PCA ממקסם שונות — שנמדדת ביחידות שאתם הזנתם לו.", "explanation": "‏PCA מחפש כיוונים של שונות מקסימלית במטריצת השונויות, והשונות אינה חסרת יחידות: ציון מחיר בין יפני במקום באלפי ין מנפח את השונות פי מיליון ומושך את PC1 לציר הזה. תקנון (או באופן שקול, PCA על מטריצת המתאמים) מעמיד את כל הפיצ'רים על בסיס שווה. תקננו, אלא אם לכל הפיצ'רים אותה יחידה והיחס בין הגדלים שלהם משמעותי.", "whyWrong": ["‏PCA חסין לסיבוב ולהזזה, לא לשינוי סקאלה של ציר בודד; שונות נמדדת בריבוע יחידת הפיצ'ר.", "יחסי השונות המוסברת אי-שליליים מעצם הגדרתם ואינם יכולים להתהפך בסימן.", "פירוק עצמי של מטריצת שונויות אינו 'נכשל בהתכנסות'; הבדלי סקאלה גדולים משנים את התשובה, לא את הפתירוּת."]}}, {"id": "cml-021", "area": "classical-ml", "topic": "pca", "difficulty": 4, "type": "mcq", "hardnessSource": "recall", "tags": ["whitening", "eigenvalues", "preprocessing"], "answer": 0, "en": {"q": "What does 'whitening' the output of PCA do?", "options": ["It rescales each component to unit variance, giving identity covariance", "It discards the components whose eigenvalues fall below some threshold", "It re-centres the data so that every component has mean zero", "It orthogonalizes the components, which the raw PCA projection does not do"], "hint": "The name refers to the covariance matrix of the result.", "explanation": "The PCA projection already decorrelates the data: its covariance is diagonal with the eigenvalues on it. Whitening rescales each axis by 1/sqrt(eigenvalue), turning that covariance into the identity. Equalizing the directions helps some downstream models, but it also amplifies noisy low-variance directions, which is why whitening is usually paired with dropping the smallest components.", "whyWrong": ["That is truncation, i.e. dimensionality reduction, a separate choice; whitening rescales the components you keep.", "Centering happens before PCA is computed at all, so the projected components already have mean zero.", "The principal components are orthogonal by construction — they are eigenvectors of a symmetric covariance matrix."]}, "he": {"q": "מה עושה whitening לפלט של PCA?", "options": ["הוא משנה סקאלה של כל רכיב לשונות 1, וכך מטריצת השונויות היא היחידה", "מסלק את הרכיבים שהערכים העצמיים שלהם נמוכים מסף כלשהו", "ממרכז מחדש את הנתונים כך שלכל רכיב תוחלת אפס", "מבצע אורתוגונליזציה של הרכיבים, דבר שההיטל הגולמי של PCA אינו עושה"], "hint": "השם מתייחס למטריצת השונויות של התוצאה.", "explanation": "היטל ה-PCA כבר מבטל מתאם: מטריצת השונויות שלו אלכסונית עם הערכים העצמיים על האלכסון. whitening משנה סקאלה של כל ציר בחלוקה ב-sqrt של הערך העצמי, וכך מטריצת השונויות הופכת למטריצת היחידה. השוואת הכיוונים מועילה למודלים מסוימים בהמשך, אבל היא גם מגבירה כיוונים רועשים בעלי שונות נמוכה — ולכן בדרך כלל משלבים whitening עם השמטת הרכיבים הקטנים.", "whyWrong": ["זו קטימה, כלומר הורדת ממד, שהיא בחירה נפרדת לגמרי; whitening משנה את הסקאלה של הרכיבים שנשמרו.", "המרכוז מתבצע עוד לפני חישוב ה-PCA, ולכן לרכיבים המוטלים כבר יש תוחלת אפס.", "הרכיבים העיקריים אורתוגונליים מעצם הבנייה — הם וקטורים עצמיים של מטריצת שונויות סימטרית."]}}, {"id": "cml-022", "area": "classical-ml", "topic": "tsne-umap", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["tsne", "umap", "visualization"], "answer": 2, "en": {"q": "In a t-SNE plot two clusters sit far apart and one blob looks much larger than another. What can you conclude?", "options": ["The large blob has more variance in the original feature space", "The two clusters are well separated in the original space", "Very little — blob size and cluster distance are not faithful in t-SNE", "Nothing at all, since t-SNE output is random and carries no information"], "hint": "t-SNE minimizes a divergence between neighbour probabilities — which relationships does that preserve?", "explanation": "t-SNE preserves local neighbourhoods, and its per-point bandwidth (driven by perplexity) expands sparse regions and compresses dense ones, so blob areas and inter-cluster gaps are artifacts. Runs with a different seed or perplexity can look quite different. The trustworthy reading is which points are neighbours of which; UMAP carries the same caveat, though it tends to keep somewhat more global structure.", "whyWrong": ["Blob area mostly reflects the local density that the perplexity-driven bandwidth chose, not the spread in the original space.", "Between-cluster distances are the least reliable part of the map; a wide gap can be an artifact of the optimization.", "Too strong: t-SNE reliably preserves local neighbourhoods, so which points sit together really is informative."]}, "he": {"q": "בתרשים t-SNE שני אשכולות נמצאים רחוק זה מזה, וכתם אחד נראה גדול בהרבה מאחר. מה אפשר להסיק?", "options": ["לכתם הגדול יש שונות גדולה יותר במרחב הפיצ'רים המקורי", "שני האשכולות מופרדים היטב במרחב המקורי", "מעט מאוד — גודל הכתם והמרחק בין אשכולות אינם נאמנים ב-t-SNE", "שום דבר, מכיוון שהפלט של t-SNE אקראי ואינו נושא מידע"], "hint": "‏t-SNE ממזער דיברגנציה בין הסתברויות שכנות — אילו יחסים זה משמר?", "explanation": "‏t-SNE משמר שכנויות מקומיות, ורוחב הפס לכל נקודה (שנקבע לפי ה-perplexity) מרחיב אזורים דלילים ומכווץ צפופים, ולכן שטח הכתמים והמרווחים בין אשכולות הם ארטיפקטים. הרצות עם seed או perplexity שונים עשויות להיראות שונות מאוד. הקריאה האמינה היא מי שכן של מי; ל-UMAP יש אותה הסתייגות, אף שהוא נוטה לשמר מעט יותר מבנה גלובלי.", "whyWrong": ["שטח הכתם משקף בעיקר את הצפיפות המקומית שרוחב הפס בחר, ולא את הפיזור במרחב המקורי.", "המרחקים בין אשכולות הם החלק הכי פחות אמין במפה; מרווח גדול יכול להיות ארטיפקט של האופטימיזציה.", "חזק מדי: t-SNE משמר היטב שכנויות מקומיות, ולכן מי יושב עם מי כן אינפורמטיבי."]}}, {"id": "cml-023", "area": "classical-ml", "topic": "bias-variance", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["bias-variance", "ensembles", "generalization"], "answer": 1, "en": {"q": "Expected squared test error splits into bias^2 + variance + irreducible noise. Moving from a single decision tree to a random forest mainly changes what?", "options": ["It lowers bias, because the model can fit more complex decision boundaries", "It lowers variance and leaves bias near a single tree's", "It lowers the irreducible noise term by averaging out labelling errors", "It lowers all three terms by roughly the same proportion"], "hint": "What is the same about every tree in the forest, and what differs between them?", "explanation": "Each tree is grown deep — low bias, high variance — and averaging many decorrelated deep trees cancels much of that variance while keeping roughly the bias of an individual tree. The irreducible term is a property of the data-generating process (label noise) and no model can shrink it. This is why boosting, which reduces bias by sequentially fitting residuals, is the complementary strategy.", "whyWrong": ["A single deep tree already has low bias; averaging trees of similar depth does not make the model family more expressive.", "The irreducible term comes from the data-generating process, and no amount of averaging removes it.", "The three terms respond differently — that is the whole point of the decomposition, and averaging targets variance specifically."]}, "he": {"q": "שגיאת המבחן הריבועית הצפויה מתפרקת ל-bias^2 ועוד variance ועוד רעש בלתי ניתן לצמצום. מה משתנה בעיקר במעבר מעץ החלטה בודד ל-random forest?", "options": ["ההטיה יורדת, כי המודל יכול להתאים גבולות החלטה מורכבים יותר", "השונות יורדת וההטיה נשארת קרובה לזו של עץ בודד", "הרעש הבלתי ניתן לצמצום יורד, כי המיצוע מבטל שגיאות תיוג", "שלושת האיברים יורדים בערך באותו יחס"], "hint": "מה משותף לכל עץ ביער, ומה שונה בין העצים?", "explanation": "כל עץ מגודל עמוק — הטיה נמוכה ושונות גבוהה — ומיצוע של הרבה עצים לא מתואמים מבטל חלק גדול מהשונות תוך שמירה על הטיה דומה לזו של עץ בודד. האיבר הבלתי ניתן לצמצום הוא תכונה של תהליך יצירת הנתונים (רעש בתוויות) ואף מודל אינו יכול לכווץ אותו. לכן boosting, שמקטין הטיה על ידי התאמה סדרתית לשאריות, הוא האסטרטגיה המשלימה.", "whyWrong": ["לעץ עמוק בודד כבר יש הטיה נמוכה; מיצוע עצים בעומק דומה אינו הופך את משפחת המודלים לעשירה יותר.", "האיבר הבלתי ניתן לצמצום נובע מתהליך יצירת הנתונים, ושום כמות של מיצוע אינה מסלקת אותו.", "שלושת האיברים מגיבים אחרת — זו כל הנקודה בפירוק, והמיצוע מכוון ספציפית לשונות."]}}, {"id": "cml-024", "area": "classical-ml", "topic": "feature-scaling", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["scaling", "invariance", "model-families"], "answer": 0, "en": {"q": "Which of these is genuinely unaffected if you replace a feature x with 1000*x?", "options": ["A gradient-boosted decision tree", "An RBF-kernel SVM", "k-means clustering on raw features", "Ridge regression with a fixed lambda"], "hint": "Which model only ever asks 'is x above this threshold?'", "explanation": "Trees split on thresholds, so any strictly monotone rescaling of a single feature yields exactly the same partition and the same predictions, and boosted trees inherit that. Distance- and inner-product-based methods (k-means, RBF SVM, kNN) change completely, and ridge's penalty, a sum of b_j^2, is not scale-free. Note that trees are invariant to monotone transforms of one feature, not to rotations of the feature space.", "whyWrong": ["The RBF kernel exponentiates a squared distance, so scaling one axis by 1000 lets it dominate exp(-gamma*||x-x'||^2).", "k-means minimizes squared Euclidean distance, so the inflated feature decides almost every assignment by itself.", "The L2 penalty sums b_j^2, so rescaling a feature rescales its coefficient and changes how hard that feature is penalized."]}, "he": {"q": "מי מבין הבאים באמת אינו מושפע מהחלפת פיצ'ר x ב-1000*x?", "options": ["עץ החלטה מוגבר גרדיאנטית (gradient boosted tree)", "‏SVM עם קרנל RBF", "אשכול k-means על פיצ'רים גולמיים", "רגרסיית ridge עם lambda קבוע"], "hint": "איזה מודל שואל רק 'האם x מעל הסף הזה?'", "explanation": "עצים מפצלים לפי ספים, ולכן כל שינוי סקאלה מונוטוני עולה של פיצ'ר בודד נותן בדיוק אותה חלוקה ואותם חיזויים, ועצים מוגברים יורשים זאת. שיטות שמבוססות מרחק או מכפלה פנימית (k-means,‏ SVM עם RBF,‏ kNN) משתנות לגמרי, והקנס של ridge, סכום b_j^2, אינו חסר סקאלה. שימו לב: עצים חסינים לטרנספורמציה מונוטונית של פיצ'ר בודד, לא לסיבוב של מרחב הפיצ'רים.", "whyWrong": ["קרנל RBF מעלה מרחק ריבועי בחזקה, ולכן הכפלת ציר אחד פי 1000 גורמת לו להשתלט על exp(-gamma*||x-x'||^2).", "‏k-means ממזער מרחק אוקלידי ריבועי, ולכן הפיצ'ר המנופח קובע כמעט לבדו כל שיוך.", "קנס L2 מסכם את b_j^2, ולכן שינוי סקאלה של פיצ'ר משנה את המקדם שלו ואת עוצמת הענישה עליו."]}}, {"id": "cml-025", "area": "classical-ml", "topic": "categorical-encoding", "difficulty": 3, "type": "open", "hardnessSource": "trap", "tags": ["target-encoding", "leakage", "one-hot"], "en": {"q": "You replace a high-cardinality categorical column with target (mean) encoding and validation AUC jumps. Why be suspicious, and how would you do it properly?", "hint": "Ask which rows contributed to the mean that a given row now sees in its own feature.", "modelAnswer": "If the encoding is computed on the whole training set, each row's own label leaks into its own feature, and rare categories effectively memorize the target — the model looks excellent and then collapses on new data. The fix is out-of-fold encoding: compute the category means on the K-1 training folds and apply them to the held-out fold, or use leave-one-out with added noise, and always fit the encoder inside the cross-validation loop on the training portion only. Smooth each category mean toward the global mean with a weight based on the category count, so tiny categories are not trusted, and map unseen categories to the global mean. One-hot avoids the leakage entirely but explodes the dimensionality at high cardinality, and tree models often do better with native categorical handling.", "rubric": ["Identifies target leakage: the row's own label enters its own encoded value", "Rare or high-cardinality categories memorize the target and inflate the validation score", "Out-of-fold or leave-one-out encoding, fitted inside the CV loop on training data only", "Smoothing toward the global mean by category count, and handling unseen categories", "Contrasts with one-hot: no leakage but high dimensionality"]}, "he": {"q": "החלפתם עמודה קטגורית בעלת עוצמה גבוהה בקידוד לפי ממוצע היעד (target encoding), וה-AUC על הוולידציה קפץ. למה לחשוד, ואיך עושים זאת נכון?", "hint": "שאלו אילו שורות תרמו לממוצע שהשורה הזו עצמה רואה כעת בפיצ'ר שלה.", "modelAnswer": "אם הקידוד מחושב על כל סט האימון, התווית של כל שורה דולפת לתוך הפיצ'ר של אותה שורה עצמה, וקטגוריות נדירות למעשה משננות את היעד — המודל נראה מצוין ואז מתמוטט על נתונים חדשים. הפתרון הוא קידוד out-of-fold: מחשבים את ממוצעי הקטגוריות על K-1 הקפלים ומחילים אותם על הקפל המוחזק, או משתמשים ב-leave-one-out עם רעש, ותמיד מתאימים את המקודד בתוך לולאת ה-cross-validation ועל חלק האימון בלבד. בנוסף מחליקים כל ממוצע קטגוריה לכיוון הממוצע הגלובלי במשקל שתלוי בגודל הקטגוריה, כדי לא לתת אמון בקטגוריות זעירות, וממפים קטגוריות שלא נראו לממוצע הגלובלי. one-hot מונע את הדליפה לגמרי אך מנפח את הממד בעוצמה גבוהה, ולמודלי עצים לרוב עדיף טיפול קטגורי מובנה.", "rubric": ["מזהה דליפת יעד: התווית של השורה עצמה נכנסת לערך המקודד שלה", "קטגוריות נדירות או בעוצמה גבוהה משננות את היעד ומנפחות את ציון הוולידציה", "קידוד out-of-fold או leave-one-out, המותאם בתוך לולאת ה-CV ועל נתוני האימון בלבד", "החלקה לכיוון הממוצע הגלובלי לפי גודל הקטגוריה, וטיפול בקטגוריות שלא נראו", "משווה ל-one-hot: אין דליפה אך יש ניפוח ממדים"]}}, {"id": "cml-026", "area": "classical-ml", "topic": "collinearity", "difficulty": 4, "type": "open", "hardnessSource": "trap", "tags": ["collinearity", "vif", "ridge"], "en": {"q": "Two predictors in your linear regression correlate at 0.98. What breaks, what does not break, and how would you diagnose and handle it?", "hint": "Separate the fitted values from the individual coefficients.", "modelAnswer": "Near-collinearity inflates the variance of the coefficient estimates: X^T X is close to singular, so individual coefficients become large and unstable, can flip sign across resamples, and their t-statistics may be insignificant even when the pair is jointly highly significant. What does not break is prediction — fitted values and R^2 inside the observed range are essentially unaffected, because the fit only needs the combined effect, not the split between the two. I would diagnose with a correlation matrix and variance inflation factors (VIF = 1/(1-R_j^2) from regressing feature j on the rest), or the condition number of the scaled design matrix. Handling: drop or combine the redundant feature, pick one using domain knowledge, extract a component with PCA, or use ridge, whose lambda*I conditions the system and shares the effect between the correlated features at the cost of a little bias.", "rubric": ["Coefficient variance and instability, unreliable individual t-tests, possible sign flips", "Predictive accuracy and fitted values are largely unaffected — the misconception to name explicitly", "Diagnosis via VIF, correlation matrix, or condition number of the design", "Remedies: drop or combine features, PCA, or ridge/L2 to stabilize the solution"]}, "he": {"q": "שני מנבאים ברגרסיה הלינארית שלכם מתואמים ב-0.98. מה נשבר, מה לא נשבר, ואיך הייתם מאבחנים ומטפלים?", "hint": "הפרידו בין הערכים המותאמים (fitted values) לבין המקדמים הבודדים.", "modelAnswer": "קולינאריות כמעט מלאה מנפחת את השונות של אומדני המקדמים: X^T X קרובה לסינגולרית, ולכן המקדמים הבודדים נעשים גדולים ולא יציבים, עשויים להתהפך בסימן בין דגימות, וסטטיסטיקות ה-t שלהם עלולות לא להיות מובהקות גם כשהזוג מובהק מאוד במשותף. מה שלא נשבר הוא החיזוי: הערכים המותאמים ו-R^2 בתוך הטווח הנצפה כמעט אינם מושפעים, כי ההתאמה זקוקה רק להשפעה המשולבת ולא לחלוקה בין השניים. הייתי מאבחן עם מטריצת מתאמים ועם VIF‏ (VIF = 1/(1-R_j^2) מרגרסיה של פיצ'ר j על כל השאר), או עם מספר המצב של מטריצת התכנון המתוקננת. טיפול: להסיר או לאחד את הפיצ'ר המיותר, לבחור אחד לפי ידע תחום, לחלץ רכיב באמצעות PCA, או להשתמש ב-ridge — ה-lambda*I מייצב את המערכת ומחלק את ההשפעה בין הפיצ'רים המתואמים במחיר מעט הטיה.", "rubric": ["שונות ואי-יציבות של המקדמים, מבחני t בודדים לא אמינים והיפוכי סימן אפשריים", "דיוק החיזוי והערכים המותאמים כמעט אינם נפגעים — זו התפיסה השגויה שיש לציין במפורש", "אבחון באמצעות VIF, מטריצת מתאמים או מספר המצב של מטריצת התכנון", "טיפול: הסרה או איחוד של פיצ'רים, PCA, או ridge/L2 לייצוב הפתרון"]}}, {"id": "dlf-001", "area": "dl-fundamentals", "topic": "backpropagation", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["backprop", "chain-rule", "autodiff"], "answer": 2, "en": {"q": "What does backpropagation actually do that makes training a network with millions of parameters tractable?", "options": ["It approximates each gradient with finite differences of the loss", "It runs one extra forward pass per parameter to measure its effect", "It applies the chain rule backwards, reusing cached intermediates for every gradient", "It pushes derivatives forward alongside the activations, one input dimension at a time"], "hint": "Compare the cost of getting gradients for one parameter versus for a million of them.", "explanation": "Backprop is reverse-mode automatic differentiation: one forward pass caches the activations, and one backward pass applies the chain rule from the loss down to every parameter. The total cost is a small constant times a forward pass, independent of how many parameters there are. That constant-factor property, not the chain rule itself, is the reason deep learning is practical.", "whyWrong": ["Finite differences are numerically fragile and need at least one extra loss evaluation per parameter.", "That is exactly the cost proportional to the parameter count that backprop is designed to avoid.", "That describes forward-mode AD, whose cost scales with the number of inputs rather than outputs."]}, "he": {"q": "מה בעצם עושה התפשטות לאחור (backpropagation) שהופכת אימון רשת עם מיליוני פרמטרים לישימה?", "options": ["מקרבת כל גרדיאנט באמצעות הפרשים סופיים של ה-loss", "מריצה מעבר קדימה נוסף לכל פרמטר כדי למדוד את השפעתו", "מפעילה את כלל השרשרת לאחור, עם שימוש חוזר בערכי ביניים שמורים, לכל גרדיאנט", "מקדמת נגזרות קדימה יחד עם האקטיבציות, ממד קלט אחד בכל פעם"], "hint": "השוו את העלות של חישוב גרדיאנט לפרמטר אחד מול מיליון פרמטרים.", "explanation": "התפשטות לאחור היא גזירה אוטומטית במוד הפוך (reverse-mode AD): מעבר קדימה אחד שומר את האקטיבציות, ומעבר אחורה אחד מפעיל את כלל השרשרת מה-loss ועד לכל פרמטר. העלות הכוללת היא קבוע קטן כפול מעבר קדימה, ואינה תלויה במספר הפרמטרים. דווקא תכונת הקבוע הזו, ולא כלל השרשרת עצמו, היא מה שהופך למידה עמוקה למעשית.", "whyWrong": ["הפרשים סופיים אינם יציבים נומרית ודורשים לפחות חישוב loss נוסף אחד לכל פרמטר.", "זו בדיוק העלות הפרופורציונלית למספר הפרמטרים שהתפשטות לאחור נועדה למנוע.", "זה תיאור של forward-mode AD, שעלותו גדלה עם מספר הקלטים ולא עם מספר הפלטים."]}}, {"id": "dlf-002", "area": "dl-fundamentals", "topic": "vanishing-gradients", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["vanishing-gradients", "sigmoid", "depth"], "answer": 0, "en": {"q": "The derivative of the sigmoid is s(1-s). Stacking 10 sigmoid layers, how large can the product of those 10 derivative factors possibly be?", "options": ["At most 4^-10, about 1e-6 — each factor peaks at 0.25", "At most 2^-10, about 1e-3 — each factor peaks at 0.5", "Exactly 1, reached when every pre-activation equals 0", "About 0.1 — the factors partly cancel across the 10 layers"], "hint": "Maximise s(1-s) over s in (0,1) first, then raise it to the tenth power.", "explanation": "s(1-s) is maximised at s = 0.5, giving 0.25. Ten layers therefore multiply to at most 0.25^10 = 4^-10, roughly 9.5e-7, and that is the best case — real pre-activations are rarely all at 0. The gradient reaching the earliest layer is a millionth of the gradient at the top, which is the classic argument for replacing sigmoid with ReLU-family activations.", "whyWrong": ["0.5 is the maximum of the sigmoid output itself, not of its derivative.", "At a pre-activation of 0 the derivative equals 0.25, not 1.", "The factors multiply; there is no cancellation mechanism that can rescue the product."]}, "he": {"q": "הנגזרת של סיגמואיד היא s(1-s). במחסנית של 10 שכבות סיגמואיד, מהו הערך הגדול ביותר שמכפלת 10 גורמי הנגזרת יכולה לקבל?", "options": ["לכל היותר 4^-10, בערך 1e-6 — כל גורם מגיע לכל היותר ל-0.25", "לכל היותר 2^-10, בערך 1e-3 — כל גורם מגיע לכל היותר ל-0.5", "בדיוק 1, כאשר כל הקלטים לאקטיבציה שווים ל-0", "בערך 0.1 — הגורמים מתקזזים חלקית לאורך 10 השכבות"], "hint": "מצאו קודם את המקסימום של s(1-s) עבור s בין 0 ל-1, ואז העלו בחזקת עשר.", "explanation": "הביטוי s(1-s) מקסימלי כאשר s = 0.5 ואז שווה 0.25. לכן מכפלת עשר שכבות היא לכל היותר 0.25^10 = 4^-10, כלומר בערך 9.5e-7, וזה המקרה הטוב ביותר — במציאות הקלטים לאקטיבציה כמעט לעולם אינם כולם 0. הגרדיאנט שמגיע לשכבה הראשונה הוא מיליונית מהגרדיאנט בראש הרשת, וזה הנימוק הקלאסי למעבר מסיגמואיד למשפחת ReLU.", "whyWrong": ["0.5 הוא המקסימום של פלט הסיגמואיד עצמו, לא של הנגזרת שלו.", "כאשר הקלט לאקטיבציה הוא 0 הנגזרת שווה 0.25 ולא 1.", "הגורמים מוכפלים זה בזה; אין מנגנון קיזוז שיכול להציל את המכפלה."]}}, {"id": "dlf-003", "area": "dl-fundamentals", "topic": "activations", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["relu", "dying-relu", "activations"], "answer": 1, "en": {"q": "A ReLU unit outputs exactly 0 for every example in your training set. Which statement is correct?", "options": ["Its bias term still gets gradient, so the unit will self-correct over time", "It receives no gradient through its own weights and is effectively frozen", "It acts like a permanent dropout mask and mildly regularizes the layer", "Its gradient is small but nonzero, so recovery is slow rather than blocked"], "hint": "Write down ReLU'(z) for z < 0 and see what multiplies the weight gradient.", "explanation": "This is the dying-ReLU failure. Once the pre-activation is negative on all inputs, ReLU'(z) = 0, and that zero multiplies the gradient of both the weights and the bias, so the unit stops learning entirely. It can revive only if earlier layers happen to shift its inputs. Common causes are too large a learning rate or a large negative bias; smooth activations like GELU and SiLU, or leaky ReLU, never have an exactly-zero derivative.", "whyWrong": ["The bias gradient is also multiplied by ReLU'(z), which is 0 here, so it is zero too.", "Dropout resamples a fresh mask every step; a dead unit is permanently gone and simply removes capacity.", "ReLU's derivative on the negative side is exactly 0, not merely small."]}, "he": {"q": "יחידת ReLU מוציאה בדיוק 0 עבור כל דוגמה בסט האימון. איזו טענה נכונה?", "options": ["איבר ה-bias עדיין מקבל גרדיאנט, ולכן היחידה תתקן את עצמה עם הזמן", "היא אינה מקבלת גרדיאנט דרך המשקלים שלה ולמעשה קפואה", "היא מתפקדת כמסכת dropout קבועה ומספקת רגולריזציה קלה", "הגרדיאנט שלה קטן אך שונה מאפס, ולכן ההתאוששות איטית ולא חסומה"], "hint": "כתבו את הנגזרת של ReLU עבור קלט שלילי ובדקו במה מוכפל גרדיאנט המשקלים.", "explanation": "זהו הכשל המוכר של dying ReLU. ברגע שהקלט לאקטיבציה שלילי עבור כל הדוגמאות, הנגזרת של ReLU היא 0, והאפס הזה מוכפל בגרדיאנט של המשקלים וגם של ה-bias, כך שהיחידה מפסיקה ללמוד לחלוטין. היא יכולה להתעורר רק אם שכבות קודמות ישנו את הקלט שלה. הגורמים הנפוצים הם קצב למידה גבוה מדי או bias שלילי גדול; אקטיבציות חלקות כמו GELU ו-SiLU, או leaky ReLU, לעולם אינן בעלות נגזרת אפס מדויקת.", "whyWrong": ["גם גרדיאנט ה-bias מוכפל בנגזרת של ReLU, שהיא 0 כאן, ולכן הוא אפס אף הוא.", "dropout מגריל מסכה חדשה בכל צעד; יחידה מתה אבודה לצמיתות ופשוט מורידה קיבולת.", "הנגזרת של ReLU בצד השלילי היא בדיוק 0, ולא רק קטנה."]}}, {"id": "dlf-004", "area": "dl-fundamentals", "topic": "weight-init", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["initialization", "he-init", "xavier"], "en": {"q": "He initialization draws weights with variance 2/fan_in for ReLU layers, while Xavier uses roughly 1/fan_avg. Explain where the fan-in comes from and why ReLU earns the factor of 2.", "hint": "Ask what a linear layer does to the variance of its input, and then what ReLU does to a symmetric zero-mean signal.", "modelAnswer": "Both schemes aim to keep the variance of activations, and of the backpropagated gradients, roughly constant from layer to layer, so that signals neither shrink nor explode geometrically with depth. For a linear layer with independent zero-mean weights, Var(z) = fan_in * Var(w) * Var(x); setting Var(w) = 1/fan_in makes Var(z) equal Var(x), which is where the fan-in factor comes from. ReLU then zeroes the negative half of a symmetric zero-mean pre-activation, which cuts the variance roughly in half, so He compensates by doubling it: Var(w) = 2/fan_in. Xavier targets activations that are roughly linear and symmetric around zero, such as tanh, so no factor of 2 is needed, and it averages fan_in and fan_out as a compromise between stable forward activations and stable backward gradients. Get this wrong in a deep stack and activations vanish or blow up exponentially before training even starts.", "rubric": ["States the goal: keep activation and gradient variance roughly constant across layers, avoiding exponential shrink or blow-up with depth.", "Derives the fan-in factor from Var(z) = fan_in * Var(w) * Var(x).", "Explains the 2 as compensation for ReLU zeroing half of a symmetric zero-mean pre-activation, which halves the variance.", "Notes Xavier assumes a symmetric near-linear activation such as tanh and averages fan_in and fan_out to balance the forward and backward passes."]}, "he": {"q": "אתחול He מגריל משקלים עם שונות 2/fan_in עבור שכבות ReLU, בעוד Xavier משתמש בערך ב-1/fan_avg. הסבירו מהיכן מגיע ה-fan_in ומדוע ReLU מזכה בפקטור 2.", "hint": "שאלו מה שכבה לינארית עושה לשונות הקלט שלה, ואז מה ReLU עושה לאות סימטרי עם תוחלת אפס.", "modelAnswer": "שתי השיטות מנסות לשמור על שונות האקטיבציות, וגם של הגרדיאנטים החוזרים, קבועה בקירוב משכבה לשכבה, כך שהאות לא יתכווץ ולא יתפוצץ אקספוננציאלית עם העומק. בשכבה לינארית עם משקלים בלתי תלויים בעלי תוחלת אפס מתקיים Var(z) = fan_in * Var(w) * Var(x); בחירת Var(w) = 1/fan_in גורמת ל-Var(z) להיות שווה ל-Var(x), ומכאן מגיע גורם ה-fan_in. ReLU מאפסת את החצי השלילי של קלט סימטרי בעל תוחלת אפס, וכך חותכת את השונות בערך בחצי, ולכן He מפצה בהכפלה: Var(w) = 2/fan_in. Xavier מכוונת לאקטיבציות שהן בקירוב לינאריות וסימטריות סביב אפס, כמו tanh, ולכן אין צורך בפקטור 2, והיא ממצעת בין fan_in ל-fan_out כפשרה בין יציבות המעבר קדימה ליציבות המעבר אחורה. טעות באתחול ברשת עמוקה גורמת לאקטיבציות להיעלם או להתפוצץ אקספוננציאלית עוד לפני שהאימון מתחיל.", "rubric": ["מציין את המטרה: לשמור על שונות האקטיבציות והגרדיאנטים קבועה בקירוב בין שכבות, ולמנוע התכווצות או התפוצצות אקספוננציאלית עם העומק.", "גוזר את גורם ה-fan_in מתוך Var(z) = fan_in * Var(w) * Var(x).", "מסביר את הפקטור 2 כפיצוי על כך ש-ReLU מאפסת חצי מקלט סימטרי בעל תוחלת אפס וכך חוצה את השונות.", "מציין ש-Xavier מניחה אקטיבציה סימטרית וכמעט לינארית כמו tanh, וממצעת בין fan_in ל-fan_out כדי לאזן בין המעבר קדימה למעבר אחורה."]}}, {"id": "dlf-005", "area": "dl-fundamentals", "topic": "adam", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["adam", "bias-correction", "optimizers"], "answer": 3, "en": {"q": "Why does Adam divide its two moment estimates by (1 - beta^t) before using them?", "options": ["To keep every update bounded in magnitude by the learning rate", "To decay the effective learning rate smoothly over training", "To make the update invariant to the overall scale of the gradients", "Because both moments start at 0 and are biased toward 0 early on"], "hint": "What are m and v initialized to, and what does that do to the average after only two or three steps?", "explanation": "Both moving averages are initialized at zero, so for small t they systematically underestimate the true moments. Dividing by (1 - beta1^t) and (1 - beta2^t) removes that bias, and the correction fades to 1 as t grows. Without it, at t = 1 the ratio m/sqrt(v) equals (1-beta1)/sqrt(1-beta2), about 3.2 with the default betas, instead of the intended 1 — so the very first steps are badly mis-scaled.", "whyWrong": ["Boundedness comes from the m/sqrt(v) ratio; bias correction act
