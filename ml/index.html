 which is exactly what makes it model-free. A learned value table is not a model, since it cannot tell you where an unseen action leads.", "whyWrong": ["The dynamic programming pair is model-based by construction; both need P and R before a single backup.", "Monte Carlo policy evaluation is model-free, but policy iteration's improvement step still needs the model to compute the greedy action.", "A Q-table stores expected values, not transition dynamics, so it cannot be used to simulate the environment."]}, "he": {"q": "איזו טענה על value iteration, policy iteration ו-Q-learning טבלאי נכונה?", "options": ["כל השלוש חסרות מודל (model-free); מודל נדרש רק למתכננים כמו Monte Carlo tree search.", "policy iteration הוא model-free, כי שלב ההערכה שלו ניתן להרצה מתוך rollouts.", "Q-learning הוא model-based, כי הוא שומר טבלה של ערכי מצב-פעולה.", "value iteration ו-policy iteration דורשים את המודל; Q-learning זקוק רק למעברים שנדגמו."], "hint": "שאלו אילו אלגוריתמים חייבים לסכום על כל המצבים הבאים האפשריים.", "explanation": "value iteration ו-policy iteration הם תכנון דינמי: העדכונים שלהם לוקחים תוחלת על P(s'|s,a), ולכן הם דורשים את המודל מראש. Q-learning מחליף את התוחלת הזו במעבר שנדגם ובקצב למידה, וזה בדיוק מה שהופך אותו ל-model-free. טבלת ערכים אינה מודל, כי היא אינה יכולה לומר לאן מובילה פעולה שלא נוסתה.", "whyWrong": ["צמד אלגוריתמי התכנון הדינמי הוא model-based מעצם הגדרתו; שניהם זקוקים ל-P ול-R עוד לפני עדכון אחד.", "הערכת מדיניות בשיטת Monte Carlo אכן model-free, אבל שלב השיפור ב-policy iteration עדיין דורש את המודל כדי לחשב את הפעולה החמדנית.", "טבלת Q שומרת ערכים בתוחלת ולא דינמיקת מעברים, ולכן אי אפשר לדמות איתה את הסביבה."]}}, {"id": "rli-005", "area": "rl", "topic": "epsilon-greedy", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["exploration", "epsilon-greedy"], "answer": 0, "en": {"q": "An epsilon-greedy agent with 4 actions and epsilon = 0.1 explores by sampling uniformly over all 4 actions. What is the probability it takes the greedy action?", "options": ["0.925", "0.900", "0.975", "0.250"], "hint": "The exploratory draw can land on the greedy action too.", "explanation": "P(greedy) = (1 - epsilon) + epsilon/|A| = 0.9 + 0.1/4 = 0.925, and each of the other three actions gets 0.1/4 = 0.025. Note what this buys you: exploration is undirected, spending the same 2.5% on an action already known to be terrible as on a promising untried one - the reason for alternatives such as optimistic initialization or UCB.", "whyWrong": ["0.900 forgets that the uniform exploratory draw can select the greedy action as well.", "0.975 is 1 - epsilon/4, which subtracts only one exploratory slot instead of the three non-greedy ones.", "0.250 is the uniform probability over 4 actions, which is what happens only if epsilon = 1."]}, "he": {"q": "סוכן epsilon-greedy עם 4 פעולות ו-epsilon = 0.1 חוקר על ידי דגימה אחידה מכל 4 הפעולות. מה ההסתברות שיבחר בפעולה החמדנית?", "options": ["0.925", "0.900", "0.975", "0.250"], "hint": "גם הדגימה האקראית של החקירה יכולה ליפול על הפעולה החמדנית.", "explanation": "P(חמדנית) = (1 - epsilon) + epsilon/|A| = 0.9 + 0.1/4 = 0.925, וכל אחת משלוש האחרות מקבלת 0.1/4 = 0.025. שימו לב מה זה קונה: החקירה אינה מכוונת, ומשקיעה אותם 2.5% בפעולה שכבר ידוע שהיא גרועה כמו בפעולה מבטיחה שטרם נוסתה - וזו הסיבה לחלופות כמו אתחול אופטימי או UCB.", "whyWrong": ["0.900 שוכח שהדגימה האחידה בחקירה יכולה לבחור גם בפעולה החמדנית.", "0.975 הוא 1 פחות epsilon/4, כלומר החסרה של משבצת חקירה אחת במקום שלוש הפעולות הלא חמדניות.", "0.250 היא ההסתברות האחידה על 4 פעולות, מה שקורה רק אם epsilon שווה 1."]}}, {"id": "rli-006", "area": "rl", "topic": "q-learning-vs-sarsa", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["q-learning", "sarsa", "off-policy"], "answer": 2, "en": {"q": "On Cliff Walking with epsilon-greedy behaviour, SARSA learns a safe detour while Q-learning learns the optimal cliff-edge path yet earns less reward online. What explains this?", "options": ["SARSA effectively uses a larger discount factor, so it weighs the cliff penalty more heavily.", "Q-learning's replay buffer still holds stale transitions from before the cliff was discovered.", "SARSA bootstraps from the action actually taken, so exploratory falls are priced in; Q-learning takes the max.", "SARSA is on-policy, so it converges to a stochastic optimal policy that happens to avoid the cliff."], "hint": "Write down the two update targets and ask which policy each one is evaluating.", "explanation": "SARSA's target is r + gamma*Q(s', a') with a' the action epsilon-greedy will really take, so it evaluates the exploring policy and learns that walking the edge is dangerous while epsilon > 0. Q-learning's target is r + gamma*max_a Q(s', a), which evaluates the greedy policy regardless of behaviour, so it finds the shortest path but keeps falling off while still exploring. As epsilon decays to zero the two solutions coincide.", "whyWrong": ["Both algorithms use the same gamma; the difference is in the bootstrap target, not the discount.", "Tabular Q-learning on this task has no replay buffer, and staleness is not what produces the edge-hugging policy.", "SARSA converges to the optimal policy for the epsilon-greedy behaviour, which is a different objective, not to a stochastic optimum of the original MDP."]}, "he": {"q": "במשימת Cliff Walking עם התנהגות epsilon-greedy, SARSA לומד עקיפה בטוחה בעוד Q-learning לומד את המסלול האופטימלי בשפת התהום אך צובר פחות תגמול בזמן אמת. מה ההסבר?", "options": ["SARSA משתמש בפועל ב-gamma גדול יותר, ולכן משקלל חזק יותר את קנס הנפילה.", "ה-replay buffer של Q-learning עדיין מכיל מעברים ישנים מלפני שהתהום התגלתה.", "SARSA מבצע bootstrap מהפעולה שנבחרה בפועל, ולכן נפילות בחקירה מתומחרות; Q-learning לוקח את המקסימום.", "SARSA הוא on-policy, ולכן הוא מתכנס למדיניות אופטימלית סטוכסטית שבמקרה נמנעת מהתהום."], "hint": "כתבו את שני יעדי העדכון ושאלו איזו מדיניות כל אחד מהם מעריך.", "explanation": "היעד של SARSA הוא r + gamma*Q(s', a') כאשר a' היא הפעולה ש-epsilon-greedy באמת יבחר, ולכן הוא מעריך את מדיניות החקירה ולומד שהליכה בשפה מסוכנת כל עוד epsilon גדול מאפס. היעד של Q-learning הוא r + gamma*max_a Q(s', a), שמעריך את המדיניות החמדנית ללא תלות בהתנהגות, ולכן הוא מוצא את המסלול הקצר אך ממשיך ליפול כל עוד הוא חוקר. כאשר epsilon דועך לאפס שני הפתרונות מתלכדים.", "whyWrong": ["שני האלגוריתמים משתמשים באותו gamma; ההבדל הוא ביעד ה-bootstrap ולא בהיוון.", "ל-Q-learning טבלאי במשימה הזו אין replay buffer, ובכל מקרה לא התיישנות היא שמייצרת את המסלול בשפת התהום.", "SARSA מתכנס למדיניות האופטימלית עבור ההתנהגות ה-epsilon-greedy, שהיא מטרה אחרת, ולא לאופטימום סטוכסטי של ה-MDP המקורי."]}}, {"id": "rli-007", "area": "rl", "topic": "dqn-target-network", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["dqn", "target-network", "replay"], "answer": 1, "en": {"q": "DQN keeps a second copy of the network whose weights are only copied over every few thousand steps. What is that target network for?", "options": ["It gives a second opinion, and the two Q estimates are averaged to reduce overestimation.", "It freezes the regression target for a while, so the target stops chasing the weights being updated.", "It lets the agent act with an older policy, keeping the replay buffer approximately on-policy.", "It caches target values inside the replay buffer so they need not be recomputed each epoch."], "hint": "Ask what the regression target would be if both sides of the loss used the same weights.", "explanation": "The DQN loss regresses Q(s,a) towards r + gamma*max_a' Q(s',a'). With shared weights, every gradient step moves the target too, which makes the objective a moving goalpost and easily diverges. Holding the target weights fixed turns each interval into an approximate supervised regression problem. The replay buffer is the other half of the recipe, breaking temporal correlation in the samples.", "whyWrong": ["Averaging two estimates is not DQN; double DQN uses the second network to decouple action selection from evaluation, which is a different mechanism.", "The replay buffer is deliberately off-policy, and the target network does not choose the agent's actions at all.", "Targets must be recomputed with current weights every time a transition is sampled; the buffer only stores raw transitions."]}, "he": {"q": "ב-DQN שומרים עותק שני של הרשת שהמשקלים שלו מועתקים רק כל כמה אלפי צעדים. לשם מה משמשת רשת המטרה (target network)?", "options": ["היא מספקת חוות דעת שנייה, ושתי הערכות ה-Q ממוצעות כדי להקטין הערכת יתר.", "היא מקפיאה לזמן מה את יעד הרגרסיה, כך שהיעד מפסיק לרדוף אחרי המשקלים שמתעדכנים.", "היא מאפשרת לסוכן לפעול לפי מדיניות ישנה יותר, כדי שה-replay buffer יישאר בקירוב on-policy.", "היא שומרת ערכי יעד בתוך ה-replay buffer כדי שלא יהיה צורך לחשב אותם מחדש בכל epoch."], "hint": "שאלו מה היה יעד הרגרסיה אם שני צדי פונקציית ההפסד היו משתמשים באותם משקלים.", "explanation": "פונקציית ההפסד של DQN מבצעת רגרסיה של Q(s,a) לעבר r + gamma*max_a' Q(s',a'). עם משקלים משותפים כל צעד גרדיאנט מזיז גם את היעד, כך שהמטרה נעה ללא הרף והאימון מתבדר בקלות. הקפאת משקלי היעד הופכת כל מקטע לבעיית רגרסיה מפוקחת בקירוב. ה-replay buffer הוא החצי השני של המתכון, ושובר את המתאם הזמני בין הדגימות.", "whyWrong": ["מיצוע שתי הערכות אינו DQN; ב-double DQN הרשת השנייה משמשת להפרדה בין בחירת הפעולה להערכתה, וזה מנגנון אחר.", "ה-replay buffer הוא off-policy בכוונה, ורשת המטרה כלל אינה בוחרת את פעולות הסוכן.", "יש לחשב את היעדים מחדש עם המשקלים הנוכחיים בכל פעם שנדגם מעבר; ה-buffer שומר רק מעברים גולמיים."]}}, {"id": "rli-008", "area": "rl", "topic": "reinforce-baseline", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["policy-gradient", "baseline", "variance"], "answer": 3, "en": {"q": "In REINFORCE, you replace the return G with G - b(s). What does subtracting this baseline do to the gradient estimate?", "options": ["It adds a small bias that vanishes as b(s) approaches the true value function.", "It is unbiased only when b(s) equals V(s) exactly; any other baseline biases the gradient.", "It cuts variance only for discrete action spaces, where the sum over actions telescopes.", "It stays unbiased for any b that does not depend on the action, and usually cuts variance."], "hint": "What is the expectation of the score function grad log pi(a|s) under pi itself?", "explanation": "E[grad log pi(a|s)] = 0 under pi, so E[b(s) * grad log pi(a|s)] = b(s) * 0 = 0 for any action-independent b, and the gradient stays unbiased. What changes is the variance: without a baseline, a task with all-positive returns pushes up the probability of every sampled action, and only their relative magnitudes disagree. Using b(s) = V(s) turns G - b into the advantage, which is exactly the actor-critic construction.", "whyWrong": ["There is no bias to vanish; the correction term has exactly zero expectation for any action-independent baseline.", "V(s) is the variance-minimizing choice among simple baselines, but unbiasedness holds far more generally.", "The zero-expectation argument is an integral over actions and holds for continuous action spaces just as well."]}, "he": {"q": "ב-REINFORCE מחליפים את התשואה G ב-G פחות b(s). מה עושה החסרת ה-baseline הזה לאומד הגרדיאנט?", "options": ["מוסיפה הטיה קטנה שנעלמת ככל ש-b(s) מתקרב לפונקציית הערך האמיתית.", "האומד חסר הטיה רק כאשר b(s) שווה בדיוק ל-V(s); כל baseline אחר מטה את הגרדיאנט.", "מקטינה שונות רק במרחבי פעולה בדידים, שבהם הסכום על הפעולות מתקמט.", "נשאר חסר הטיה עבור כל b שאינו תלוי בפעולה, ובדרך כלל מקטין מאוד את השונות."], "hint": "מה התוחלת של פונקציית הציון grad log pi(a|s) תחת pi עצמה?", "explanation": "מתקיים E[grad log pi(a|s)] = 0 תחת pi, ולכן E[b(s) * grad log pi(a|s)] = b(s) * 0 = 0 לכל b שאינו תלוי בפעולה, והגרדיאנט נשאר חסר הטיה. מה שמשתנה הוא השונות: בלי baseline, במשימה שבה כל התשואות חיוביות מוגברת ההסתברות של כל פעולה שנדגמה, ורק היחס ביניהן מבדיל. בחירת b(s) = V(s) הופכת את G פחות b ליתרון (advantage), וזה בדיוק המבנה של actor-critic.", "whyWrong": ["אין הטיה שנעלמת; לאיבר התיקון יש תוחלת אפס בדיוק עבור כל baseline שאינו תלוי בפעולה.", "V(s) היא הבחירה שממזערת שונות בין baselines פשוטים, אך חוסר ההטיה מתקיים באופן כללי הרבה יותר.", "טיעון תוחלת האפס הוא אינטגרל על הפעולות ותקף באותה מידה גם במרחבי פעולה רציפים."]}}, {"id": "rli-009", "area": "rl", "topic": "ppo-clipping", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["ppo", "policy-gradient", "trust-region"], "en": {"q": "Explain what PPO's clipped objective actually prevents, and why it clips the probability ratio rather than clipping the gradient norm.", "hint": "Ask why the same batch of trajectories can be reused for several epochs at all.", "modelAnswer": "PPO collects a batch under pi_old and then takes several epochs of updates on it, reweighting each sample by the ratio r = pi_theta(a|s)/pi_old(a|s). That importance-weighted surrogate is only a good approximation of the true objective while pi_theta stays close to pi_old; if a few high-advantage samples drag the ratio far from 1, the surrogate stops predicting the real return and the policy can collapse in one update. The clipped objective min(r*A, clip(r, 1-eps, 1+eps)*A) makes the objective flat once the ratio leaves the trust region in the improving direction, so those samples contribute zero gradient and there is no incentive to move further; the min keeps the unclipped, pessimistic term when the move would make things worse. It is a cheap first-order stand-in for TRPO's explicit KL trust region, with no conjugate gradients or second-order machinery. Clipping the gradient norm would only shorten the step in parameter space, which says nothing about how far the action distribution moved - a small parameter step can change probabilities enormously in a saturated policy. In practice people also monitor the empirical KL and early-stop or adapt the step when it exceeds a target.", "rubric": ["Explains the importance ratio and that PPO reuses one batch for multiple epochs of off-policy updates", "States the surrogate is only trustworthy near pi_old, so unbounded ratio moves cause destructive updates", "Describes clipping as removing the gradient or incentive once the ratio leaves [1-eps, 1+eps], with the min making it pessimistic", "Frames it as a cheap approximation of a TRPO-style KL trust region", "Notes that bounding parameter-space step size (gradient clipping) does not bound the change in the policy distribution"]}, "he": {"q": "הסבירו מה בדיוק מונעת פונקציית המטרה החתוכה (clipped) של PPO, ולמה חותכים את יחס ההסתברויות ולא את נורמת הגרדיאנט.", "hint": "שאלו קודם למה בכלל אפשר לעשות שימוש חוזר באותה אצווה של מסלולים לכמה epochs.", "modelAnswer": "PPO אוסף אצווה תחת pi_old ואז מבצע עליה כמה epochs של עדכונים, כשכל דגימה משוקללת ביחס r = pi_theta(a|s)/pi_old(a|s). הפונקציה החלופית (surrogate) המשוקללת הזו מקרבת היטב את המטרה האמיתית רק כל עוד pi_theta נשארת קרובה ל-pi_old; אם כמה דגימות עם יתרון גבוה מושכות את היחס הרחק מ-1, החלופה מפסיקה לנבא את התשואה האמיתית והמדיניות עלולה לקרוס בעדכון אחד. המטרה החתוכה min(r*A, clip(r, 1-eps, 1+eps)*A) הופכת את המטרה לשטוחה ברגע שהיחס יוצא מאזור האמון בכיוון המשפר, כך שדגימות אלו תורמות גרדיאנט אפס ואין תמריץ להמשיך לזוז; ה-min שומר על האיבר הלא חתוך והפסימי כשהמהלך דווקא מרע. זהו תחליף זול מסדר ראשון לאזור האמון המפורש ב-KL של TRPO, בלי conjugate gradients ובלי מנגנון מסדר שני. חיתוך נורמת הגרדיאנט רק היה מקצר את הצעד במרחב הפרמטרים, וזה לא אומר דבר על כמה זזה התפלגות הפעולות - צעד קטן בפרמטרים יכול לשנות הסתברויות דרמטית במדיניות רוויה. בפועל נהוג גם לנטר את ה-KL האמפירי ולעצור מוקדם או להתאים את הצעד כשהוא חורג מהיעד.", "rubric": ["מסביר את יחס החשיבות ואת העובדה ש-PPO עושה שימוש חוזר באצווה אחת לכמה epochs של עדכונים off-policy", "מציין שהחלופה אמינה רק בסביבת pi_old, ולכן תזוזות יחס בלתי חסומות גורמות לעדכונים הרסניים", "מתאר שהחיתוך מבטל את הגרדיאנט או את התמריץ ברגע שהיחס יוצא מהתחום [1-eps, 1+eps], ושה-min הופך אותו לפסימי", "ממסגר זאת כקירוב זול לאזור אמון מבוסס KL בסגנון TRPO", "מציין שהגבלת גודל הצעד במרחב הפרמטרים (gradient clipping) אינה מגבילה את השינוי בהתפלגות המדיניות"]}}, {"id": "rli-010", "area": "rl", "topic": "reward-hacking", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["reward-shaping", "reward-hacking", "specification"], "answer": 2, "en": {"q": "A cleaning robot gets +1 per piece of trash placed in the bin. It learns to tip the bin over and re-collect the same trash. What is the right diagnosis?", "options": ["The agent has not converged yet; more training will find the intended behaviour.", "This is an exploration failure that a larger epsilon would have avoided.", "The policy is optimal for the reward as written; the reward is a bad proxy for the goal.", "The discount factor is too small, so the agent prefers quick repeated rewards."], "hint": "Ask whether the agent is failing at its objective or succeeding at it.", "explanation": "This is reward hacking, or specification gaming: the agent is maximizing exactly what you wrote, and your reward function was a proxy for 'the room is clean'. More compute makes it worse, not better, because it finds the loophole faster. Fixes lie in the specification - reward the state (trash on the floor at the end of an episode) rather than the transition, and if you must add shaping, use potential-based shaping, which provably preserves the optimal policy.", "whyWrong": ["The behaviour is the converged optimum of the stated reward, so more training reinforces it.", "The agent has already found the highest-reward behaviour; extra exploration would not make it prefer a lower-reward one.", "A small gamma encourages near-term reward but does not create the loophole; the same exploit is optimal at any gamma."]}, "he": {"q": "רובוט ניקיון מקבל +1 על כל פיסת אשפה שמוכנסת לפח. הוא לומד להפיל את הפח ולאסוף שוב את אותה אשפה. מה האבחנה הנכונה?", "options": ["הסוכן עדיין לא התכנס; אימון נוסף ימצא את ההתנהגות הרצויה.", "זהו כשל חקירה ש-epsilon גדול יותר היה מונע.", "המדיניות אופטימלית עבור התגמול שנוסח; התגמול הוא פרוקסי גרוע למטרה האמיתית.", "מקדם ההיוון קטן מדי, ולכן הסוכן מעדיף תגמולים מהירים וחוזרים."], "hint": "שאלו אם הסוכן נכשל במטרה שלו או דווקא מצליח בה.", "explanation": "זהו reward hacking, או specification gaming: הסוכן ממקסם בדיוק את מה שכתבתם, ופונקציית התגמול שלכם הייתה פרוקסי ל'החדר נקי'. יותר חישוב רק מחמיר זאת, כי הוא מוצא את הפרצה מהר יותר. התיקון נמצא במפרט - לתגמל על המצב (כמות האשפה על הרצפה בסוף אפיזודה) ולא על המעבר, ואם בכל זאת מוסיפים shaping, להשתמש ב-potential-based shaping שמוכח כמשמר את המדיניות האופטימלית.", "whyWrong": ["ההתנהגות היא האופטימום שאליו מתכנס התגמול שנוסח, ולכן אימון נוסף רק יחזק אותה.", "הסוכן כבר מצא את ההתנהגות בעלת התגמול הגבוה ביותר; חקירה נוספת לא תגרום לו להעדיף התנהגות בעלת תגמול נמוך יותר.", "gamma קטן אמנם מעודד תגמול מיידי אך אינו יוצר את הפרצה; אותו ניצול נשאר אופטימלי לכל gamma."]}}, {"id": "rli-011", "area": "rl", "topic": "offline-rl", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["offline-rl", "distribution-shift", "deployment"], "en": {"q": "You have a year of logged decisions and no way to experiment live. What breaks if you simply run Q-learning on the log, and when would you not reach for RL at all?", "hint": "Ask which actions the max in the Bellman backup asks about, and whether the data can answer.", "modelAnswer": "The Bellman backup takes a max over all actions, including ones the logging policy almost never took. In those out-of-distribution regions the fitted Q-values are extrapolations, function approximation error is positive on average, and the max systematically picks the most overestimated action; bootstrapping then propagates that error, and with no environment interaction nothing ever corrects it. So the learned policy drifts precisely towards the actions the data cannot validate. The standard remedies constrain the policy to the data support (BCQ, BEAR) or penalize values on unseen actions (CQL), and evaluation must be done off-policy - importance sampling, doubly robust estimators or fitted Q evaluation - with honest confidence intervals and a check on behaviour-policy coverage. I would skip RL entirely when the decisions have no real sequential effect, so a contextual bandit or plain supervised model with a good policy is enough; when the logs contain no exploration or no recorded propensities, so nothing identifies the counterfactual; when the reward is a weak proxy for what the business actually wants; or when deploying a policy that leaves the logged distribution is unsafe.", "rubric": ["Identifies the max over out-of-distribution actions plus overestimated extrapolation as the core failure", "Explains that bootstrapping propagates the error and no online interaction corrects it", "Names a remedy that constrains the policy to the data support or penalizes out-of-distribution values (BCQ, BEAR, CQL, one-step methods)", "Mentions off-policy evaluation with confidence intervals and behaviour-policy coverage as the evaluation path", "Gives concrete cases for not using RL: no sequential effect (bandit or supervised suffices), no exploration or propensities in the log, weak reward proxy, or safety constraints"]}, "he": {"q": "יש לכם שנה של החלטות מתועדות ואין אפשרות להתנסות בזמן אמת. מה יישבר אם פשוט תריצו Q-learning על הלוג, ומתי בכלל לא הייתם פונים ל-RL?", "hint": "שאלו על אילו פעולות שואל ה-max בעדכון בלמן, והאם הנתונים יכולים לענות.", "modelAnswer": "עדכון בלמן לוקח מקסימום על כל הפעולות, כולל כאלה שמדיניות התיעוד כמעט לא ביצעה. באזורים האלה, שמחוץ להתפלגות, ערכי ה-Q המותאמים הם אקסטרפולציה, שגיאת קירוב הפונקציה חיובית בממוצע, וה-max בוחר שיטתית את הפעולה שהוערכה ביתר; ה-bootstrapping מפיץ את השגיאה, ובלי אינטראקציה עם הסביבה שום דבר לא מתקן אותה. כך המדיניות הנלמדת נסחפת בדיוק אל הפעולות שהנתונים אינם יכולים לאמת. הפתרונות המקובלים מגבילים את המדיניות לתמך הנתונים (BCQ, BEAR) או מענישים ערכים על פעולות שלא נצפו (CQL), וההערכה חייבת להיות off-policy - importance sampling, אומדים doubly robust או fitted Q evaluation - עם רווחי סמך כנים ובדיקת כיסוי של מדיניות ההתנהגות. הייתי מוותר על RL לגמרי כשלהחלטות אין השפעה סדרתית אמיתית, ואז contextual bandit או מודל מפוקח עם מדיניות טובה מספיקים; כשבלוג אין חקירה או שאין תיעוד הסתברויות הבחירה, ולכן שום דבר לא מזהה את התרחיש הנגדי; כשהתגמול הוא פרוקסי חלש למה שהעסק באמת רוצה; או כשהעלאת מדיניות שיוצאת מהתפלגות הנתונים אינה בטוחה.", "rubric": ["מזהה את המקסימום על פעולות מחוץ להתפלגות ואת האקסטרפולציה בהערכת יתר ככשל המרכזי", "מסביר ש-bootstrapping מפיץ את השגיאה ושאין אינטראקציה מקוונת שתתקן אותה", "מציין פתרון שמגביל את המדיניות לתמך הנתונים או מעניש ערכים מחוץ להתפלגות (BCQ, BEAR, CQL, שיטות חד-צעד)", "מזכיר הערכה off-policy עם רווחי סמך ובדיקת כיסוי של מדיניות ההתנהגות כדרך המדידה", "נותן מקרים קונקרטיים שבהם לא משתמשים ב-RL: אין השפעה סדרתית (bandit או מודל מפוקח מספיקים), אין חקירה או הסתברויות בחירה בלוג, פרוקסי תגמול חלש, או אילוצי בטיחות"]}}, {"id": "par-001", "area": "paradigms", "topic": "learning-paradigms", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["self-supervised", "definitions"], "answer": 1, "en": {"q": "A model is trained to predict masked-out words in raw text, with no human annotation anywhere in the pipeline. Which paradigm is this, and why?", "options": ["Unsupervised — there is no target being predicted at all", "Self-supervised — the targets are generated automatically from the input", "Semi-supervised — a small labelled set anchors a large unlabelled one", "Supervised — humans wrote the text, so the text counts as annotation"], "hint": "Ask who produced the target signal, not whether a target exists.", "explanation": "Masked-token prediction defines a genuine supervised loss, but the labels are carved out of the raw input by the algorithm rather than by annotators. That is exactly self-supervision: free supervision manufactured from unlabelled data. Truly unsupervised methods like clustering or PCA have no per-example target to predict, and semi-supervised learning requires an actual human-labelled subset.", "whyWrong": ["A target does exist — the hidden token — so this is not target-free like clustering or PCA.", "Semi-supervised learning needs a genuinely human-labelled subset, and here there is none.", "Text existing is not annotation; no human decided what the output should be for each example."]}, "he": {"q": "מודל מאומן לחזות מילים ממוסכות (masked) בטקסט גולמי, בלי שום תיוג אנושי בשום שלב. באיזו פרדיגמה מדובר, ולמה?", "options": ["לא מונחית (unsupervised) — אין בכלל ערך מטרה שמנבאים", "מונחית-עצמית (self-supervised) — ערכי המטרה נוצרים אוטומטית מתוך הקלט", "מונחית-למחצה (semi-supervised) — קבוצה מתויגת קטנה מעגנת קבוצה גדולה לא מתויגת", "מונחית (supervised) — בני אדם כתבו את הטקסט, ולכן הטקסט נחשב תיוג"], "hint": "שאלו מי ייצר את אות המטרה, לא אם קיים בכלל ערך מטרה.", "explanation": "חיזוי טוקן ממוסך מגדיר פונקציית הפסד מונחית לכל דבר, אבל התוויות נחצבות מתוך הקלט הגולמי על ידי האלגוריתם ולא על ידי מתייגים. זו בדיוק הנחיה עצמית: פיקוח חינמי שמיוצר מדאטה לא מתויג. שיטות לא מונחות באמת, כמו clustering או PCA, אין להן ערך מטרה לכל דוגמה, ולמידה מונחית-למחצה מחייבת תת-קבוצה מתויגת אמיתית.", "whyWrong": ["ערך מטרה כן קיים — הטוקן המוסתר — ולכן זה לא מצב חסר-מטרה כמו clustering או PCA.", "למידה מונחית-למחצה מחייבת תת-קבוצה מתויגת בידי אדם, וכאן אין כזו.", "עצם קיומו של טקסט אינו תיוג; אף אדם לא קבע מה הפלט הרצוי עבור כל דוגמה."]}}, {"id": "par-002", "area": "paradigms", "topic": "pretext-tasks", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["self-supervised", "pretext-task"], "answer": 2, "en": {"q": "Why does a pretext task such as predicting an image's rotation angle produce features that transfer to classification?", "options": ["Because rotation prediction is harder than classification, so the features are richer", "Because the rotation labels are noisy, which regularizes the network like dropout", "Because solving it requires recognizing objects and their canonical orientation", "Because it forces the network to become invariant to object identity"], "hint": "Ask what a network must already understand about the image before it can answer.", "explanation": "A pretext task helps only when the shortcut-free way to solve it is to learn the semantics you actually care about. To tell that a cat photo is upside down, the network must first find the cat, its head and its legs, so object-level features emerge as a by-product. When a shortcut exists — border artifacts or compression cues that leak the rotation — the pretext task stops teaching semantics.", "whyWrong": ["Difficulty alone guarantees nothing: a hard task with a shortcut solution teaches nothing useful.", "The rotation labels are exact by construction, since the algorithm applied the rotation itself.", "It rewards sensitivity to orientation while still representing identity; invariance to identity would destroy the features."]}, "he": {"q": "מדוע משימת עזר (pretext task) כמו חיזוי זווית הסיבוב של תמונה מייצרת ייצוגים שמועילים לסיווג?", "options": ["כי חיזוי סיבוב קשה יותר מסיווג, ולכן הייצוגים עשירים יותר", "כי תוויות הסיבוב רועשות, וזה מרגלר את הרשת בדומה ל-dropout", "כי כדי לפתור אותה צריך לזהות אובייקטים ואת הכיוון הטבעי שלהם", "כי היא מכריחה את הרשת להיות אינווריאנטית לזהות האובייקט"], "hint": "שאלו מה הרשת חייבת להבין על התמונה לפני שהיא יכולה בכלל לענות.", "explanation": "משימת עזר מועילה רק כאשר הדרך לפתור אותה בלי קיצורי דרך היא ללמוד בדיוק את הסמנטיקה שמעניינת אתכם. כדי לקבוע שתמונת חתול הפוכה, הרשת חייבת קודם למצוא את החתול, את ראשו ואת רגליו — ולכן ייצוגים ברמת האובייקט נוצרים כתוצר לוואי. כשקיים קיצור דרך, כמו ארטיפקטים בשוליים או עקבות דחיסה שמסגירים את הסיבוב, המשימה מפסיקה ללמד סמנטיקה.", "whyWrong": ["קושי כשלעצמו לא מבטיח דבר: משימה קשה שיש לה פתרון עוקף לא מלמדת שום דבר שימושי.", "תוויות הסיבוב מדויקות לחלוטין מעצם הבנייה, שהרי האלגוריתם עצמו ביצע את הסיבוב.", "היא מתגמלת רגישות לכיוון תוך שמירה על ייצוג הזהות; אינווריאנטיות לזהות דווקא תהרוס את הייצוגים."]}}, {"id": "par-003", "area": "paradigms", "topic": "contrastive-vs-generative-ssl", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["self-supervised", "contrastive", "collapse"], "answer": 3, "en": {"q": "A colleague insists negative pairs are mathematically required in self-supervised vision, otherwise the encoder collapses to a constant. What is the accurate response?", "options": ["Correct — without negatives the InfoNCE objective is unbounded below", "Correct — collapse is avoidable only by contrasting against a memory bank of negatives", "Wrong — collapse never occurs in practice, because batch norm alone prevents it", "Wrong — asymmetric designs with a predictor and an EMA target avoid collapse without negatives"], "hint": "Think of the methods that trained happily with a stop-gradient and no negatives at all.", "explanation": "Negatives are one way to prevent representational collapse, not the only way. BYOL and SimSiam avoid the trivial constant solution with an asymmetric architecture — a prediction head on one branch plus a stop-gradient or EMA-updated target branch. Other families such as Barlow Twins and VICReg block collapse with redundancy-reduction or explicit variance terms instead.", "whyWrong": ["InfoNCE with negatives is a bounded softmax cross-entropy; the worry is collapse, not an unbounded loss.", "A memory bank is an engineering trick for cheaper negatives, not a requirement for stability.", "Collapse is a real, observed failure mode; stop-gradient asymmetry, not batch norm, is what carries these methods."]}, "he": {"q": "עמית טוען שזוגות שליליים (negatives) הכרחיים מתמטית בלמידה מונחית-עצמית בראייה ממוחשבת, אחרת ה-encoder קורס לפלט קבוע. מהי התשובה המדויקת?", "options": ["צודק — בלי negatives פונקציית ה-InfoNCE אינה חסומה מלמטה", "צודק — אפשר למנוע קריסה רק על ידי השוואה מול memory bank של negatives", "טועה — קריסה אף פעם לא קורית בפועל, כי batch norm לבדו מונע אותה", "טועה — ארכיטקטורות א-סימטריות עם predictor ומטרת EMA מונעות קריסה בלי negatives"], "hint": "חשבו על השיטות שהתאמנו בהצלחה עם stop-gradient ובלי negatives בכלל.", "explanation": "Negatives הם דרך אחת למנוע קריסת ייצוג (collapse), לא הדרך היחידה. BYOL ו-SimSiam נמנעות מהפתרון הטריוויאלי הקבוע באמצעות ארכיטקטורה א-סימטרית — ראש חיזוי בענף אחד יחד עם stop-gradient או ענף מטרה שמתעדכן ב-EMA. משפחות אחרות, כמו Barlow Twins ו-VICReg, מונעות קריסה באמצעות איברי הפחתת יתירות או איבר שונות מפורש.", "whyWrong": ["InfoNCE עם negatives היא cross-entropy מעל softmax והיא חסומה; החשש הוא קריסה ולא הפסד לא חסום.", "Memory bank הוא טריק הנדסי להשגת negatives בזול, לא תנאי הכרחי ליציבות.", "קריסה היא כשל אמיתי ומתועד, והמנגנון שמחזיק את השיטות האלה הוא הא-סימטריה עם stop-gradient ולא batch norm."]}}, {"id": "par-004", "area": "paradigms", "topic": "transfer-learning", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["transfer-learning", "finetuning"], "answer": 0, "en": {"q": "You have 400 labelled images from a domain very close to ImageNet. What is the sensible default transfer-learning recipe?", "options": ["Freeze most of the backbone, train a new head, then unfreeze the top block at low LR", "Train the whole network from random initialization, to avoid inheriting ImageNet's biases", "Fine-tune every layer at the original pretraining learning rate for many epochs", "Keep the pretrained head fixed and fine-tune only the earliest convolutional layers"], "hint": "Match the number of trainable parameters to the number of labelled examples.", "explanation": "With very little data and a close domain the pretrained features are already nearly right, so the parameter budget you can afford to fit is small: a head first, then maybe the last block at a small learning rate. Full fine-tuning at a large LR on 400 images overwrites the general features and overfits immediately. Early layers are the most generic and the least worth retraining.", "whyWrong": ["400 images cannot train a deep network from scratch; the pretrained prior is the entire advantage here.", "A large learning rate over all weights on tiny data destroys the pretrained features and overfits.", "This is backwards: the pretrained head predicts the old classes, and early layers are the most transferable part."]}, "he": {"q": "יש לכם 400 תמונות מתויגות מדומיין קרוב מאוד ל-ImageNet. מהי מתכון ברירת המחדל הנכון ללמידת העברה (transfer learning)?", "options": ["להקפיא את רוב ה-backbone, לאמן ראש חדש, ואז לשחרר את הבלוק העליון בקצב למידה נמוך", "לאמן את כל הרשת מאתחול אקראי, כדי לא לרשת את ההטיות של ImageNet", "לעשות fine-tuning לכל השכבות בקצב הלמידה המקורי של האימון המקדים, להרבה epochs", "להשאיר את הראש המאומן קפוא ולעשות fine-tuning רק לשכבות הקונבולוציה הראשונות"], "hint": "התאימו את מספר הפרמטרים הנלמדים למספר הדוגמאות המתויגות.", "explanation": "עם מעט מאוד דאטה ודומיין קרוב, הייצוגים המאומנים כבר כמעט נכונים, ולכן תקציב הפרמטרים שאפשר להרשות לעצמכם ללמוד קטן: קודם ראש, ואז אולי הבלוק האחרון בקצב למידה קטן. Fine-tuning מלא בקצב למידה גבוה על 400 תמונות דורס את הייצוגים הכלליים וגורם מיד להתאמת יתר (overfitting). השכבות המוקדמות הן הכלליות ביותר והכי פחות משתלם לאמן אותן מחדש.", "whyWrong": ["400 תמונות לא מספיקות לאימון רשת עמוקה מאפס; הפריור המאומן הוא כל היתרון כאן.", "קצב למידה גבוה על כל המשקלים עם דאטה זעיר הורס את הייצוגים המאומנים וגורם להתאמת יתר.", "זה הפוך: הראש המאומן מנבא את המחלקות הישנות, והשכבות המוקדמות הן החלק הכי ניתן להעברה."]}}, {"id": "par-005", "area": "paradigms", "topic": "domain-adaptation", "difficulty": 2, "type": "mcq", "hardnessSource": "recall", "tags": ["domain-adaptation", "generalization"], "answer": 1, "en": {"q": "What is the operational difference between domain adaptation and domain generalization?", "options": ["Adaptation changes the label space, while generalization keeps the label space fixed", "Adaptation may use target-domain data during training; generalization sees no target data", "Adaptation requires labelled target data; generalization requires unlabelled target data", "Adaptation is a vision term, while generalization is used for tabular problems"], "hint": "Ask what you are allowed to look at before deployment.", "explanation": "Domain adaptation assumes you can touch the target domain during training, usually as unlabelled target samples (unsupervised DA) and sometimes as a handful of labels. Domain generalization is stricter: you train on several source domains and must work on a domain never observed, so methods aim at domain-invariant or causally stable features instead of aligning to a known target.", "whyWrong": ["Both settings normally keep the same label space; what moves is the input or feature distribution.", "Unsupervised domain adaptation uses unlabelled target data, and domain generalization uses none at all.", "Both are general problem settings and are independent of the data modality."]}, "he": {"q": "מהו ההבדל המעשי בין התאמת דומיין (domain adaptation) לבין הכללה בין דומיינים (domain generalization)?", "options": ["התאמה משנה את מרחב התוויות, ואילו הכללה משאירה אותו קבוע", "מותר להשתמש בדאטה מדומיין היעד באימון; בהכללה לא רואים אותו כלל", "התאמה דורשת דאטה מתויג מהיעד, ואילו הכללה דורשת דאטה לא מתויג ממנו", "התאמה היא מושג מראייה ממוחשבת, והכללה משמשת בבעיות טבלאיות"], "hint": "שאלו במה מותר לכם להסתכל לפני העלייה לאוויר.", "explanation": "התאמת דומיין מניחה שאפשר לגעת בדומיין היעד בזמן האימון, בדרך כלל בדמות דגימות לא מתויגות ממנו (unsupervised DA) ולפעמים מעט תוויות. הכללה בין דומיינים מחמירה יותר: מאמנים על כמה דומייני מקור וצריך לעבוד על דומיין שמעולם לא נצפה, ולכן השיטות מכוונות לייצוגים אינווריאנטיים לדומיין או יציבים סיבתית, במקום ליישר מול יעד ידוע.", "whyWrong": ["בשני המצבים מרחב התוויות בדרך כלל נשאר זהה; מה שזז הוא התפלגות הקלט או הייצוגים.", "התאמת דומיין לא מונחית משתמשת בדאטה לא מתויג מהיעד, ובהכללה בין דומיינים לא משתמשים ביעד בכלל.", "שני המושגים הם הגדרות בעיה כלליות ואינם תלויים בסוג הדאטה."]}}, {"id": "par-006", "area": "paradigms", "topic": "in-context-learning", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["few-shot", "in-context-learning", "prompting"], "answer": 2, "en": {"q": "You put 8 labelled examples into an LLM prompt and accuracy jumps. In what sense has the model 'learned' from those examples?", "options": ["Gradient updates are applied to the last layers using the labels in the prompt", "The examples are written to a persistent memory that later conversations reuse", "No weights change — conditioning on the context alters the computation at inference time", "The model retrieves those same examples from its training data to relabel the query"], "hint": "Ask what would remain if you opened a fresh session tomorrow.", "explanation": "In-context learning is inference-time conditioning: the forward pass attends to the demonstrations while the parameters stay untouched. The misconception it targets is treating a prompt like a fine-tune — the effect disappears with the context, does not accumulate across calls, and is bounded by the context window. Fine-tuning, in contrast, edits parameters and persists.", "whyWrong": ["No backward pass or optimizer step happens during generation.", "The context is discarded after the call unless you explicitly supply it again.", "The demonstrations are new text you provided, not something looked up from the training corpus."]}, "he": {"q": "הכנסתם 8 דוגמאות מתויגות ל-prompt של מודל שפה והדיוק קפץ. באיזה מובן המודל 'למד' מהדוגמאות האלה?", "options": ["מבוצעים עדכוני גרדיאנט לשכבות האחרונות לפי התוויות שב-prompt", "הדוגמאות נכתבות לזיכרון קבוע שישמש גם שיחות עתידיות", "אף משקל לא משתנה — ההתניה על ההקשר משנה את החישוב בזמן ההרצה", "המודל מאחזר בדיוק את הדוגמאות האלה מדאטת האימון שלו כדי לתייג את השאילתה"], "hint": "שאלו מה יישאר אם תפתחו מחר שיחה חדשה לגמרי.", "explanation": "למידה בהקשר (in-context learning) היא התניה בזמן הרצה: המעבר קדימה מפעיל קשב (attention) על הדוגמאות, בעוד הפרמטרים נשארים ללא שינוי. התפיסה השגויה שהשאלה מכוונת אליה היא להתייחס ל-prompt כאילו הוא fine-tuning — ההשפעה נעלמת יחד עם ההקשר, לא מצטברת בין קריאות, ומוגבלת בגודל חלון ההקשר. Fine-tuning, לעומת זאת, משנה פרמטרים ונשאר.", "whyWrong": ["לא מתרחש מעבר אחורה ולא צעד אופטימיזציה בזמן הייצור של הפלט.", "ההקשר נזרק בתום הקריאה אלא אם אתם מספקים אותו שוב במפורש.", "הדוגמאות הן טקסט חדש שאתם סיפקתם, ולא משהו שאוחזר מקורפוס האימון."]}}, {"id": "par-007", "area": "paradigms", "topic": "meta-learning", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["meta-learning", "maml", "few-shot"], "en": {"q": "Explain the core idea of MAML and why its exact gradient involves second derivatives. What does the first-order approximation give up?", "hint": "Ask what is being optimized: the final weights, or the weights as a starting point.", "modelAnswer": "MAML optimizes an initialization rather than a solution: it looks for parameters theta such that one or a few gradient steps on a small support set produce good performance on that task. Training is a bilevel loop — an inner loop adapts theta to theta' with a few SGD steps on a sampled task, and an outer loop updates theta by the loss of theta' on held-out query data from the same task. Because theta' = theta - alpha * grad L(theta) is itself a function of theta, differentiating the outer loss through the inner step means differentiating a gradient, which produces Hessian-vector terms. First-order MAML and Reptile drop that term and treat the inner gradient as constant, which is far cheaper in memory and compute and usually loses little accuracy, but it discards the signal about how the initialization shapes the curvature the adaptation step sees. Practical costs of the exact version are memory for the unrolled graph, sensitivity to the inner learning rate, and instability when the number of inner steps grows.", "rubric": ["MAML learns an initialization optimized for fast adaptation, not for direct task performance", "Describes the inner loop (adapt on support set) and outer loop (meta-update using query loss)", "Explains that the outer gradient differentiates through the inner gradient step, giving second-order / Hessian-vector terms", "First-order MAML or Reptile drop the second-order term for cheaper compute and memory", "Mentions a practical limitation: memory of the unrolled graph, inner-LR sensitivity, or few inner steps"]}, "he": {"q": "הסבירו את הרעיון המרכזי של MAML ומדוע הגרדיאנט המדויק שלו כולל נגזרות שניות. על מה מוותר הקירוב מסדר ראשון?", "hint": "שאלו מה בעצם מבצעים עליו אופטימיזציה: את המשקלים הסופיים, או את המשקלים כנקודת התחלה.", "modelAnswer": "MAML מבצע אופטימיזציה על אתחול ולא על פתרון: הוא מחפש פרמטרים theta כך שצעד גרדיאנט אחד או כמה צעדים על קבוצת תמיכה קטנה יניבו ביצועים טובים במשימה. האימון הוא לולאה דו-שכבתית — לולאה פנימית מתאימה את theta ל-theta' בכמה צעדי SGD על משימה שנדגמה, ולולאה חיצונית מעדכנת את theta לפי ההפסד של theta' על דאטת שאילתה נפרדת מאותה משימה. מכיוון ש-theta' = theta - alpha * grad L(theta) הוא עצמו פונקציה של theta, גזירת ההפסד החיצוני דרך הצעד הפנימי משמעותה גזירה של גרדיאנט, וכך נוצרים איברי Hessian-vector. MAML מסדר ראשון ו-Reptile מוותרים על האיבר הזה ומתייחסים לגרדיאנט הפנימי כקבוע, מה שזול בהרבה בזיכרון ובחישוב ובדרך כלל מאבד מעט דיוק, אבל מאבד את האות שמסביר כיצד האתחול מעצב את העקמומיות שהצעד המתאים רואה. המחירים המעשיים של הגרסה המדויקת הם זיכרון עבור הגרף הפרוס, רגישות לקצב הלמידה הפנימי, וחוסר יציבות ככל שמספר הצעדים הפנימיים גדל.", "rubric": ["MAML לומד אתחול שממוטב להתאמה מהירה, ולא ביצועים ישירים במשימה", "מתאר את הלולאה הפנימית (התאמה על קבוצת התמיכה) ואת הלולאה החיצונית (מטא-עדכון לפי הפסד השאילתה)", "מסביר שהגרדיאנט החיצוני נגזר דרך צעד הגרדיאנט הפנימי ולכן מופיעים איברים מסדר שני / Hessian-vector", "MAML מסדר ראשון או Reptile מוותרים על האיבר מסדר שני כדי לחסוך חישוב וזיכרון", "מזכיר מגבלה מעשית: זיכרון הגרף הפרוס, רגישות לקצב הלמידה הפנימי, או מספר צעדים פנימיים קטן"]}}, {"id": "par-008", "area": "paradigms", "topic": "multi-task-learning", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["multi-task", "negative-transfer"], "en": {"q": "You add two auxiliary tasks to a shared-encoder model and your main task's accuracy drops. How would you diagnose and fix this negative transfer?", "hint": "Consider both what the tasks ask of the shared representation and how their losses compare in scale.", "modelAnswer": "First re-establish the baseline honestly: retrain the main task alone under the same schedule and capacity, so you know the drop comes from the tasks and not from a changed learning rate or head. Then inspect loss scales and gradient magnitudes on the shared encoder — an auxiliary loss that is numerically large simply dominates, and the fixes are per-task loss weights, uncertainty weighting, or GradNorm-style normalization. Next measure task conflict directly, for example the cosine similarity between per-task gradients on shared parameters; persistently negative cosines mean the tasks want opposite features, and remedies include gradient surgery such as PCGrad or reducing how much is shared: task-specific adapters, splitting the top layers, or expert routing. Also check the sampling ratio, since a much larger auxiliary dataset silently reweights training. If the tasks are genuinely unrelated, the honest conclusion is to stop sharing and train separately, or to use the auxiliary tasks only as a pretraining stage followed by fine-tuning on the main task.", "rubric": ["Re-establish a matched single-task baseline before blaming multi-task learning", "Check loss-scale and gradient-magnitude imbalance; apply task weighting, uncertainty weighting or GradNorm", "Diagnose gradient conflict directly, e.g. negative cosine between task gradients on shared parameters", "Reduce sharing: task-specific layers or adapters, partial sharing, or PCGrad-style gradient surgery", "Consider data sampling ratios, and accept separate models or auxiliary-as-pretraining when tasks truly conflict"]}, "he": {"q": "הוספתם שתי משימות עזר למודל עם encoder משותף, והדיוק במשימה הראשית ירד. כיצד תאבחנו ותתקנו את ההעברה השלילית (negative transfer)?", "hint": "חשבו גם על מה כל משימה דורשת מהייצוג המשותף וגם על סדרי הגודל של ההפסדים.", "modelAnswer": "קודם כול מקימים מחדש בסיס השוואה הוגן: מאמנים את המשימה הראשית לבדה עם אותו לוח זמנים ואותה קיבולת, כדי לוודא שהירידה נובעת מהמשימות ולא משינוי בקצב הלמידה או בראש המודל. אחר כך בודקים סדרי גודל של הפסדים ושל גרדיאנטים על ה-encoder המשותף — הפסד עזר שגדול מספרית פשוט משתלט, והפתרונות הם משקלי הפסד לכל משימה, שקלול לפי אי-ודאות, או נרמול בסגנון GradNorm. בשלב הבא מודדים ישירות ניגוד בין משימות, למשל דמיון קוסינוס בין הגרדיאנטים של המשימות על הפרמטרים המשותפים; קוסינוס שלילי באופן עקבי אומר שהמשימות רוצות ייצוגים מנוגדים, והמענה הוא ניתוח גרדיאנטים כמו PCGrad או הקטנת השיתוף: אדפטרים ייעודיים למשימה, פיצול השכבות העליונות, או ניתוב למומחים. כדאי לבדוק גם את יחסי הדגימה, כי דאטהסט עזר גדול בהרבה משקלל מחדש את האימון בשקט. אם המשימות באמת לא קשורות, המסקנה הכנה היא להפסיק לשתף ולאמן בנפרד, או להשתמש במשימות העזר רק כשלב אימון מקדים ואז לעשות fine-tuning על המשימה הראשית.", "rubric": ["הקמת בסיס השוואה של משימה בודדת בתנאים זהים לפני שמאשימים את הלמידה הרב-משימתית", "בדיקת חוסר איזון בסדרי גודל של הפסדים וגרדיאנטים, ושימוש בשקלול משימות או GradNorm", "אבחון ישיר של ניגוד גרדיאנטים, למשל קוסינוס שלילי בין גרדיאנטים של משימות על פרמטרים משותפים", "הקטנת השיתוף: שכבות או אדפטרים ייעודיים למשימה, שיתוף חלקי, או ניתוח גרדיאנטים בסגנון PCGrad", "התייחסות ליחסי דגימת הדאטה, ונכונות לאמן מודלים נפרדים או להשתמש בעזר רק כאימון מקדים"]}}, {"id": "par-009", "area": "paradigms", "topic": "active-learning", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["active-learning", "acquisition"], "answer": 0, "en": {"q": "Instead of one point at a time you label the 500 most uncertain points each round. Why does this batch version of uncertainty sampling often disappoint?", "options": ["The batch is full of near-duplicates, so 500 labels buy far less than 500 diverse ones", "Uncertainty is undefined for a batch, so the acquisition scores become arbitrary", "Larger batches lower the model's entropy, making it overconfident on the pool", "The most uncertain points always carry noisy labels, so they add no information"], "hint": "Ask how similar the 500 selected points are to each other.", "explanation": "Greedy top-k selection ignores redundancy between the chosen points: the most uncertain examples usually sit in the same ambiguous region, so once the first few are labelled the rest add almost nothing. Batch-mode acquisition therefore needs a diversity or representativeness term — core-set selection, BatchBALD, or clustering the candidates. A second classic failure is that uncertainty scores get dominated by outliers and mislabelled junk.", "whyWrong": ["Uncertainty is still computed per point exactly as before; the problem is how the points relate to each other.", "The size of the acquisition batch does not change the model's confidence on the pool in that way.", "Uncertain points are often the most informative ones; the issue is redundancy, not that they are all noise."]}, "he": {"q": "במקום לתייג נקודה אחת בכל פעם, אתם מתייגים בכל סבב את 500 הנקודות הכי לא ודאיות. מדוע גרסת ה-batch הזו של uncertainty sampling מאכזבת לעיתים קרובות?", "options": ["ה-batch מלא בנקודות כמעט זהות, ולכן 500 תוויות שוות הרבה פחות מ-500 תוויות מגוונות", "אי-ודאות אינה מוגדרת עבור batch, ולכן ציוני הבחירה נעשים שרירותיים", "batch גדול יותר מוריד את האנטרופיה של המודל והופך אותו לבטוח מדי על מאגר הדאטה", "לנקודות הכי לא ודאיות תמיד יש תוויות רועשות, ולכן הן לא מוסיפות מידע"], "hint": "שאלו עד כמה 500 הנקודות שנבחרו דומות זו לזו.", "explanation": "בחירה חמדנית של top-k מתעלמת מהיתירות בין הנקודות הנבחרות: הדוגמאות הכי לא ודאיות יושבות בדרך כלל באותו אזור מעורפל, ולכן אחרי שמתייגים את הראשונות שבהן, כל היתר כמעט לא מוסיפות מידע. לכן בחירה ב-batch מחייבת איבר של גיוון או ייצוגיות — core-set selection, BatchBALD, או אשכול המועמדים. כשל קלאסי נוסף הוא שציוני אי-הוודאות נשלטים על ידי חריגים ודוגמאות מתויגות שגוי.", "whyWrong": ["אי-הוודאות עדיין מחושבת לכל נקודה בנפרד בדיוק כמו קודם; הבעיה היא היחס בין הנקודות זו לזו.", "גודל ה-batch של הבחירה לא משנה כך את ביטחון המודל על מאגר הדאטה.", "נקודות לא ודאיות הן לעיתים קרובות המידעיות ביותר; הבעיה היא יתירות ולא רעש גורף."]}}, {"id": "par-010", "area": "paradigms", "topic": "pseudo-labeling", "difficulty": 3, "type": "open", "hardnessSource": "trap", "tags": ["semi-supervised", "pseudo-labeling", "confirmation-bias"], "en": {"q": "Pseudo-labelling raised your validation score, yet the deployed model got worse on rare classes. Explain the confirmation bias at work and how you would guard against it.", "hint": "Think about which unlabelled points receive confident predictions in the first place.", "modelAnswer": "Pseudo-labelling trains on the model's own confident predictions, so whatever bias the model already has becomes training signal and is amplified — that is confirmation bias. High-confidence points are precisely the easy, majority-class ones, so a single global confidence threshold silently oversamples frequent classes while rare classes shrink further each round, and confidently wrong labels are never corrected. Guards: keep the human-labelled data in every round and give pseudo-labels a lower loss weight, use per-class or adaptive thresholds (as in FlexMatch) instead of one global threshold, and select on agreement under strong augmentation (FixMatch style) rather than raw confidence. Calibrate before thresholding, regenerate pseudo-labels from the current model each round instead of freezing early mistakes, and above all evaluate on a clean human-labelled validation set with per-class metrics — a validation set touched by the same pseudo-labels will happily report an improvement that does not exist.", "rubric": ["Names confirmation bias: the model trains on its own predictions and reinforces its own errors", "Explains that confidence thresholds select easy majority-class points, worsening class imbalance", "Proposes per-class or adaptive thresholds and class balancing instead of one global threshold", "Proposes consistency under strong augmentation, lower weight on pseudo-labels, and calibration before thresholding", "Insists on a clean, human-labelled validation set with per-class metrics"]}, "he": {"q": "תיוג עצמי (pseudo-labeling) שיפר את הציון בוולידציה, אבל המודל בייצור החמיר דווקא במחלקות הנדירות. הסבירו את הטיית האישור (confirmation bias) שפועלת כאן וכיצד הייתם מתגוננים ממנה.", "hint": "חשבו אילו דוגמאות לא מתויגות מקבלות מלכתחילה חיזוי בטוח.", "modelAnswer": "תיוג עצמי מאמן את המודל על החיזויים הבטוחים של עצמו, ולכן כל הטיה שכבר קיימת בו הופכת לאות אימון ומתעצמת — זוהי הטיית אישור. הנקודות בעלות הביטחון הגבוה הן בדיוק הקלות ומהמחלקות הנפוצות, ולכן סף ביטחון גלובלי יחיד מגדיל בשקט את הייצוג של המחלקות השכיחות בעוד המחלקות הנדירות מצטמצמות עוד בכל סבב, ותוויות שגויות אך בטוחות לעולם לא מתוקנות. הגנות: לשמור בכל סבב את הדאטה המתויג בידי אדם ולתת לתוויות המדומות משקל הפסד נמוך יותר, להשתמש בספים לכל מחלקה או בספים אדפטיביים (כמו ב-FlexMatch) במקום סף גלובלי, ולבחור לפי הסכמה תחת אוגמנטציה חזקה (בסגנון FixMatch) ולא לפי ביטחון גולמי. כדאי לכייל (calibration) לפני קביעת הסף, לייצר את התוויות המדומות מחדש בכל סבב מהמודל הנוכחי במקום להקפיא טעויות מוקדמות, ובעיקר להעריך על סט ולידציה נקי המתויג בידי אדם עם מדדים לכל מחלקה — סט ולידציה שנגוע באותן תוויות מדומות ידווח בשמחה על שיפור שאינו קיים.", "rubric": ["מזהה את הטיית האישור: המודל מתאמן על חיזויי עצמו ומחזק את טעויותיו", "מסביר שספי ביטחון בוחרים דוגמאות קלות מהמחלקות השכיחות ומחריפים את חוסר האיזון", "מציע ספים לכל מחלקה או ספים אדפטיביים ואיזון מחלקות במקום סף גלובלי יחיד", "מציע בחירה לפי עקביות תחת אוגמנטציה חזקה, משקל נמוך לתוויות מדומות, וכיול לפני הסף", "מתעקש על סט ולידציה נקי המתויג בידי אדם עם מדדים לכל מחלקה"]}}, {"id": "dat-001", "area": "data", "topic": "temporal-leakage", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["leakage", "time-series", "splitting"], "answer": 3, "en": {"q": "You predict next-month churn from a two-year event log and split the rows uniformly at random. Why is the resulting score untrustworthy?", "options": ["Random splitting correlates the folds, which mainly inflates the variance of the estimate", "The test set ends up with a different class balance than production traffic", "Random splits break the i.i.d. assumption that gradient descent needs to converge", "Rows from the future land in training, giving information unavailable at prediction time"], "hint": "Look at the timestamps on either side of the split.", "explanation": "With time-ordered data the only honest split is chronological: train on the past, validate on a later window, ideally with a gap equal to the prediction horizon. A uniform random split scatters future rows into training, so the model can absorb seasonal shocks, promotions or incidents that a real deployment could not know yet. The symptom is the classic one — a beautiful backtest and a mediocre first month live.", "whyWrong": ["Correlated folds are a real nuisance, but the dominant effect here is directional bias, not extra variance.", "A random split actually preserves the overall class balance; chronology is what it destroys.", "Gradient descent has no such requirement; the i.i.d. concern here is about the evaluation protocol."]}, "he": {"q": "אתם מנבאים נטישה (churn) בחודש הבא מתוך יומן אירועים של שנתיים, ומחלקים את השורות לאימון ולמבחן באקראי אחיד. מדוע הציון שיתקבל אינו אמין?", "options": ["חלוקה אקראית יוצרת מתאם בין הקפלים, וזה בעיקר מנפח את השונות של ההערכה", "בסט המבחן מתקבל איזון מחלקות שונה מזה שבתעבורת הייצור", "חלוקה אקראית שוברת את הנחת ה-i.i.d. שגרדיאנט דיסנט זקוק לה כדי להתכנס", "שורות מהעתיד נכנסות לאימון ומספקות מידע שאינו זמין בזמן החיזוי"], "hint": "הסתכלו על חותמות הזמן משני צידי החלוקה.", "explanation": "בדאטה מסודר בזמן החלוקה ההוגנת היחידה היא כרונולוגית: מאמנים על העבר, מוודאים על חלון מאוחר יותר, ורצוי עם פער בגודל אופק החיזוי. חלוקה אקראית אחידה מפזרת שורות מהעתיד לתוך האימון, וכך המודל סופג זעזועים עונתיים, מבצעים או תקלות שמערכת אמיתית עדיין לא יכולה להכיר. הסימפטום קלאסי — backtest מרהיב ואחריו חודש ראשון בינוני בייצור.", "whyWrong": ["מתאם בין קפלים הוא מטרד אמיתי, אבל האפקט הדומיננטי כאן הוא הטיה מכוונת ולא תוספת שונות.", "חלוקה אקראית דווקא משמרת את איזון המחלקות הכללי; מה שהיא הורסת הוא הסדר הכרונולוגי.", "לגרדיאנט דיסנט אין דרישה כזו; עניין ה-i.i.d. כאן נוגע לפרוטוקול ההערכה."]}}, {"id": "dat-002", "area": "data", "topic": "deduplication", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["contamination", "duplicates", "evaluation"], "answer": 1, "en": {"q": "Your text classifier scores 0.94 on the test set. You then discover 12% of test documents have a near-duplicate in training. What should you expect?", "options": ["Nothing — duplicates make the task equally easier for training and test", "An inflated score: part of the test set now measures memorization", "A deflated score, because duplicated documents waste model capacity", "The ranking between models stays valid, so the comparison is still fair"], "hint": "Ask what the model must actually do to get a duplicated test document right.", "explanation": "Near-duplicates that straddle the split turn part of the evaluation into a lookup of things already seen, so the reported number blends generalization with recall of training data. Exact-hash deduplication is not enough — you need near-duplicate detection (MinHash, SimHash, embedding similarity) before splitting. It is the same mechanism as benchmark contamination for large models: a benchmark that leaked into pretraining no longer measures what it claims to.", "whyWrong": ["Duplicates inside training are relatively harmless; the ones crossing the split are what corrupts the estimate.", "Capacity is not the issue here, and the bias is upward rather than downward.", "Models that memorize more gain more from the duplicates, so even relative comparisons get distorted."]}, "he": {"q": "מסווג הטקסט שלכם מקבל 0.94 בסט המבחן. אחר כך מתגלה של-12% ממסמכי המבחן יש כמעט-כפיל (near-duplicate) בסט האימון. למה לצפות?", "options": ["לכלום — כפילויות מקלות באותה מידה גם על האימון וגם על המבחן", "ציון מנופח: חלק מסט המבחן מודד עכשיו שינון", "לציון מוקטן, כי מסמכים כפולים מבזבזים את קיבולת המודל", "לדירוג תקף בין מודלים, ולכן ההשוואה עדיין הוגנת"], "hint": "שאלו מה המודל באמת צריך לעשות כדי לענות נכון על מסמך מבחן שיש לו כפיל באימון.", "explanation": "כמעט-כפילים שמפוזרים משני צידי החלוקה הופכים חלק מההערכה לשליפה של דברים שכבר נראו, ולכן המספר המדווח מערבב הכללה עם שליפה מדאטת האימון. הסרת כפילויות לפי hash מדויק אינה מספיקה — צריך זיהוי כמעט-כפילים (MinHash, SimHash, דמיון embeddings) לפני החלוקה. זה בדיוק אותו מנגנון של זיהום מדדי השוואה (benchmark contamination) במודלים גדולים: מדד שדלף לאימון המקדים כבר לא מודד את מה שהוא מתיימר למדוד.", "whyWrong": ["כפילויות בתוך סט האימון בלבד הן יחסית לא מזיקות; מה שמקלקל את ההערכה הן אלה שחוצות את החלוקה.", "הקיבולת אינה הבעיה כאן, וההטיה היא כלפי מעלה ולא כלפי מטה.", "מודלים ששוננים יותר מרוויחים יותר מהכפילויות, ולכן גם ההשוואה היחסית מתעוותת."]}}, {"id": "dat-003", "area": "data", "topic": "target-leakage", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["leakage", "feature-engineering"], "answer": 2, "en": {"q": "A loan-default model's strongest feature is 'number of collection calls received', pulled from the same table and time window as the label. What is the diagnosis?", "options": ["Concept drift, because the relationship between calls and default changes over time", "Multicollinearity, because the feature is redundant with the other repayment features", "Target leakage, because collection calls are a consequence of the default being predicted", "Selection bias, because only customers who received calls appear in the dataset"], "hint": "Ask whether that counter could be non-zero before the outcome you are predicting has happened.", "explanation": "Target leakage is a feature that is a consequence of the label, or is recorded only after it, so at scoring time it is unavailable or always empty. The test is temporal and causal: at the moment of prediction, before the outcome exists, would this value be populated? Here the calls are triggered by delinquency, so the model reads the answer instead of predicting it — and it collapses in production, where the field is zero for everyone.", "whyWrong": ["Drift means the relationship changes over time; it does not explain a feature that encodes the outcome.", "Multicollinearity affects coefficient stability, not validity, and would not inflate the score this way.", "The population is not restricted to called customers; the defect is when the feature gets written."]}, "he": {"q": "הפיצ'ר החזק ביותר במודל חדלות פירעון להלוואות הוא 'מספר שיחות גבייה שהתקבלו', שנשלף מאותה טבלה ומאותו חלון זמן של התווית. מהו האבחון?", "options": ["סחיפת מושג (concept drift), כי הקשר בין שיחות לחדלות פירעון משתנה עם הזמן", "רב-קוליניאריות, כי הפיצ'ר יתיר ביחס לשאר פיצ'רי ההחזר", "דליפת מטרה (target leakage), כי שיחות הגבייה הן תוצאה של חדלות הפירעון שמנסים לנבא", "הטיית בחירה, כי רק לקוחות שקיבלו שיחות מופיעים בדאטה"], "hint": "שאלו האם המונה הזה יכול להיות שונה מאפס לפני שהתרחשה התוצאה שאתם מנבאים.", "explanation": "דליפת מטרה היא פיצ'ר שהוא תוצאה של התווית, או שנרשם רק אחריה, ולכן בזמן החיזוי הוא אינו זמין או תמיד ריק. המבחן הוא זמני וסיבתי: ברגע החיזוי, לפני שהתוצאה קיימת, האם השדה הזה מלא? כאן השיחות מופעלות בעקבות הפיגור בתשלום, ולכן המודל קורא את התשובה במקום לנבא אותה — ובייצור הוא קורס, כי השדה מאופס אצל כולם.", "whyWrong": ["סחיפה פירושה שהקשר משתנה עם הזמן, וזה לא מסביר פיצ'ר שמקודד בתוכו את התוצאה.", "רב-קוליניאריות משפיעה על יציבות המקדמים ולא על תקפות המודל, והיא לא הייתה מנפחת כך את הציון.", "האוכלוסייה אינה מוגבלת ללקוחות שקיבלו שיחות; הפגם הוא בעיתוי שבו הפיצ'ר נכתב."]}}, {"id": "dat-004", "area": "data", "topic": "smote-pitfalls", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["smote", "imbalance", "cross-validation"], "answer": 0, "en": {"q": "A pipeline runs SMOTE on the whole training file and then 5-fold CV. Cross-validated recall is excellent, production recall is poor. What is the primary error?", "options": ["Synthetic points interpolated from training rows can land in the validation fold", "SMOTE used too few neighbors, so its synthetic points are not realistic enough", "SMOTE was not applied to the validation folds, so the distributions do not match", "Recall is the wrong metric under imbalance; precision would have been honest"], "hint": "Follow one synthetic minority point and ask which fold its two parents were in.", "explanation": "Oversampling before splitting means a validation fold can contain synthetic points interpolated from training minority points — near-copies of data the model has already seen, so the validation score measures memorization. Resampling belongs strictly inside the training fold of the pipeline. Separately, SMOTE interpolates between neighbors, so with noisy minority points or high dimensionality it cheerfully synthesizes examples inside the majority region.", "whyWrong": ["Tuning k cannot repair an evaluation that was contaminated before the split ever happened.", "Validation and test data must keep the real deployment distribution; resampling them destroys the estimate.", "Recall is a legitimate metric here; the number was inflated by leakage, not by the choice of metric."]}, "he": {"q": "צינור עיבוד מריץ SMOTE על כל קובץ האימון ורק אחר כך 5-fold CV. ה-recall בוולידציה מצוין, ובייצור ירוד. מהי הטעות העיקרית?", "options": ["נקודות סינתטיות שנוצרו מאינטרפולציה של שורות אימון עלולות לנחות בקפל הוולידציה", "SMOTE השתמש במעט מדי שכנים, ולכן הנקודות הסינתטיות אינן מציאותיות מספיק", "SMOTE לא הופעל על קפלי הוולידציה, ולכן ההתפלגויות אינן תואמות", "recall הוא המדד הלא נכון בחוסר איזון; precision היה נותן תמונה כנה"], "hint": "עקבו אחרי נקודה סינתטית אחת ושאלו באיזה קפל נמצאו שני ה'הורים' שלה.", "explanation": "דגימת יתר לפני החלוקה משמעה שקפל הוולידציה עשוי להכיל נקודות סינתטיות שנוצרו באינטרפולציה מנקודות מיעוט שבאימון — כמעט-עותקים של דאטה שהמודל כבר ראה, ולכן ציון הוולידציה מודד שינון. איזון מחדש חייב להתבצע אך ורק בתוך קפל האימון של הצינור. בנוסף, SMOTE מבצע אינטרפולציה בין שכנים, ולכן עם נקודות מיעוט רועשות או בממד גבוה הוא מייצר בשמחה דוגמאות בתוך אזור הרוב.", "whyWrong": ["כוונון k לא מתקן הערכה שזוהמה עוד לפני שהחלוקה בכלל התבצעה.", "דאטת ולידציה ומבחן חייבת לשמר את התפלגות הייצור האמיתית; איזון מחדש שלה הורס את ההערכה.", "recall הוא מדד לגיטימי כאן; המספר נופח בגלל דליפה ולא בגלל בחירת המדד."]}}, {"id": "dat-005", "area": "data", "topic": "decision-threshold", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["imbalance", "threshold", "calibration"], "answer": 3, "en": {"q": "Your imbalanced classifier outputs well-calibrated probabilities, but at the default 0.5 cut-off it flags almost no positives. What is the cheapest first fix?", "options": ["Oversample the minority class and retrain the model from scratch", "Switch to a model family that is said to handle imbalance natively", "Generate extra minority examples with SMOTE before retraining", "Tune the decision threshold on validation data for the costs you care about"], "hint": "The model already gave you probabilities — which number in the pipeline is the arbitrary one?", "explanation": "The 0.5 cut-off is an arbitrary default, not part of the model. When the probabilities are calibrated, the ranking is already there and only the operating point is wrong, so picking the threshold on validation data using the real cost ratio or a target recall is free, reversible and keeps calibration intact. Resampling changes the base rate and forces you to recalibrate afterwards; reach for it only if the ranking itself is bad.", "whyWrong": ["Resampling distorts the predicted probabilities and need not improve the ranking you already have.", "The model family is rarely the bottleneck; the same threshold problem appears with any probabilistic model.", "SMOTE is a heavier intervention with its own failure modes, and calibrated probabilities already carry the signal."]}, "he": {"q": "המסווג שלכם על דאטה לא מאוזן מפיק הסתברויות מכוילות היטב, אבל בסף ברירת המחדל 0.5 הוא כמעט לא מסמן חיוביים. מה התיקון הזול ביותר להתחיל ממנו?", "options": ["לבצע דגימת יתר למחלקת המיעוט ולאמן את המודל מחדש מאפס", "לעבור למשפחת מודלים שנחשבת כמטפלת בחוסר איזון באופן טבעי", "לייצר דוגמאות מיעוט נוספות עם SMOTE לפני אימון מחדש", "לכוונן את סף ההחלטה על דאטת ולידציה לפי העלויות שחשובות לכם"], "hint": "המודל כבר נתן לכם הסתברויות — איזה מספר בצינור הוא בעצם השרירותי?", "explanation": "הסף 0.5 הוא ברירת מחדל שרירותית ולא חלק מהמודל. כשההסתברויות מכוילות, הדירוג כבר קיים ורק נקודת ההפעלה שגויה, ולכן בחירת הסף על דאטת ולידציה לפי יחס העלויות האמיתי או לפי recall יעד היא חינמית, הפיכה ושומרת על הכיול. איזון מחדש משנה את שיעור הבסיס ומחייב כיול מחדש אחריו; פונים אליו רק אם הדירוג עצמו גרוע.", "whyWrong": ["איזון מחדש מעוות את ההסתברויות החזויות ולא בהכרח משפר את הדירוג שכבר יש לכם.", "משפחת המודלים היא לעיתים רחוקות צוואר הבקבוק; אותה בעיית סף תופיע בכל מודל הסתברותי.", "SMOTE הוא התערבות כבדה יותר עם כשלים משלה, וההסתברויות המכוילות כבר מכילות את האות הדרוש."]}}, {"id": "dat-006", "area": "data", "topic": "missing-data", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["missing-data", "imputation"], "answer": 3, "en": {"q": "Income is missing more often for high earners, and the chance of being missing depends on the income value itself. Which mechanism is this, and what follows?", "options": ["MCAR — dropping the incomplete rows is safe and unbiased", "MAR — mean imputation recovers the true distribution of income", "MAR — multiple imputation from the observed covariates is unbiased here", "MNAR — no imputation using observed data alone can be guaranteed unbiased"], "hint": "Does the probability of being missing depend on the value you cannot see?", "explanation": "MNAR means the probability of being missing depends on the unobserved value itself, so the observed data alone cannot tell you what the missing values look like; you need an explicit model of the missingness mechanism, external data, or a sensitivity analysis. MCAR permits complete-case analysis, and MAR — missingness explained by observed variables — is the assumption behind multiple imputation. A useful hedge is adding an explicit 'is_missing' indicator, since the fact of missingness is often predictive.", "whyWrong": ["MCAR requires missingness independent of everything, whereas here it depends on income itself.", "This is not MAR, and mean imputation shrinks variance and distorts relationships even when MAR holds.", "Multiple imputation is principled under MAR, but the mechanism described here is MNAR."]}, "he": {"q": "נתוני הכנסה חסרים לעיתים קרובות יותר אצל בעלי הכנסה גבוהה, וההסתברות לחֶסֶר תלויה בערך ההכנסה עצמו. באיזה מנגנון מדובר, ומה נובע ממנו?", "options": ["MCAR — השמטת השורות החסרות בטוחה ואינה מוטה", "MAR — השלמה בממוצע משחזרת את ההתפלגות האמיתית של ההכנסה", "MAR — השלמה מרובה (multiple imputation) מהמשתנים הנצפים אינה מוטה כאן", "MNAR — אף השלמה שמסתמכת רק על הנתונים הנצפים אינה מובטחת כבלתי מוטה"], "hint": "האם ההסתברות שערך יהיה חסר תלויה בערך שאתם לא רואים?", "explanation": "MNAR פירושו שההסתברות לחֶסֶר תלויה בערך הבלתי נצפה עצמו, ולכן הנתונים הנצפים לבדם לא יכולים לומר לכם איך נראים הערכים החסרים; דרושים מודל מפורש של מנגנון החֶסֶר, מקור מידע חיצוני, או ניתוח רגישות. תחת MCAR מותר לנתח רק שורות מלאות, ותחת MAR — כשהחֶסֶר מוסבר על ידי משתנים נצפים — עובדת השלמה מרובה. גידור שימושי הוא הוספת אינדיקטור 'ערך חסר', כי עצם החֶסֶר לעיתים קרובות מנבא.", "whyWrong": ["MCAR דורש שהחֶסֶר יהיה בלתי תלוי בכל דבר, וכאן הוא תלוי בהכנסה עצמה.", "זה אינו MAR, והשלמה בממוצע מכווצת שונות ומעוותת קשרים גם כאשר MAR מתקיים.", "השלמה מרובה מוצדקת תחת MAR, אבל המנגנון המתואר כאן הוא MNAR."]}}, {"id": "dat-007", "area": "data", "topic": "selection-bias", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["sampling-bias", "feedback-loop", "labels"], "answer": 0, "en": {"q": "A credit model is trained only on applicants the old rule engine approved, since only they have repayment outcomes. What is the core problem?", "options": ["Training data covers only the old policy's accept region, so the model is untested where it must decide", "The labels are noisy, because approved applicants sometimes default for purely random reasons", "Concept drift, because repayment behavior changes between application cohorts", "Class imbalance, because approved applicants repay far more often than they default"], "hint": "Where in the input space do you have no labels at all, and who has to be scored there anyway?", "explanation": "This is selection bias with a feedback loop: labels exist only where the previous policy said yes, so the model never observes the rejected region and any claim about performance there is extrapolation. Standard remedies are reject inference, keeping a small randomized-approval holdout so unbiased labels keep arriving, and logging propensities so future policies can be evaluated off-policy.", "whyWrong": ["Label noise is a different problem; here the labels are correct but exist only for part of the population.", "Drift is about change over time, and this bias exists even if nothing about behavior changes.", "Imbalance is present, but it is not the reason the model fails on the applicants who were rejected."]}, "he": {"q": "מודל אשראי מאומן רק על מבקשים שמנוע החוקים הישן אישר, כי רק להם יש תוצאת החזר. מהי הבעיה המהותית?", "options": ["דאטת האימון מכסה רק את אזור האישור של המדיניות הישנה, ולכן המודל לא נבחן היכן שהוא נדרש להכריע", "התוויות רועשות, כי מבקשים שאושרו לפעמים מגיעים לחדלות פירעון מסיבות אקראיות לגמרי", "סחיפת מושג, כי התנהגות ההחזר משתנה בין מחזורי הגשה שונים", "חוסר איזון מחלקות, כי מבקשים שאושרו מחזירים הרבה יותר משהם נכשלים"], "hint": "היכן במרחב הקלט אין לכם תוויות בכלל, ומי בכל זאת צריך לקבל שם ציון?", "explanation": "זוהי הטיית בחירה עם לולאת משוב: תוויות קיימות רק היכן שהמדיניות הקודמת אמרה כן, ולכן המודל מעולם לא צפה באזור הדחייה וכל טענה על ביצועיו שם היא אקסטרפולציה. הפתרונות המקובלים הם reject inference, שמירה על מדגם קטן של אישורים אקראיים כדי שימשיכו להגיע תוויות בלתי מוטות, ותיעוד הסתברויות הבחירה כדי שאפשר יהיה להעריך מדיניות עתידית off-policy.", "whyWrong": ["רעש בתוויות הוא בעיה אחרת; כאן התוויות נכונות אך קיימות רק עבור חלק מהאוכלוסייה.", "סחיפה עוסקת בשינוי לאורך זמן, וההטיה הזו קיימת גם אם שום התנהגות לא משתנה.", "חוסר האיזון אכן קיים, אבל הוא לא הסיבה לכך שהמודל נכשל על המבקשים שנדחו."]}}, {"id": "dat-008", "area": "data", "topic": "dataset-shift", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["drift", "shift", "monitoring"], "answer": 0, "en": {"q": "After a policy change the input distribution looks unchanged, but the same inputs now lead to different outcomes. Which kind of shift is this?", "options": ["Concept drift — P(y|x) changed while P(x) stayed roughly fixed", "Covariate shift — P(x) changed while P(y|x) stayed fixed", "Label shift — P(y) changed while P(x|y) stayed fixed", "Sampling bias — the training set was never representative to begin with"], "hint": "Which factor of the joint distribution P(x,y) actually moved?", "explanation": "The canonical shifts differ in which piece of the factorization moved. Covariate shift moves the inputs, label (prior) shift moves the class marginal, and concept drift moves the conditional P(y|x) — the rule itself. Concept drift is the nastiest to monitor, because input-distribution monitors see nothing at all and you only learn about it once labels arrive.", "whyWrong": ["Covariate shift is defined by P(x) moving while the conditional stays intact, and here the conditional is exactly what moved.", "Label shift would appear as a changed class balance with unchanged class-conditional inputs.", "Sampling bias is a flaw at collection time, not a change that occurs after deployment."]}, "he": {"q": "לאחר שינוי מדיניות, התפלגות הקלט נראית ללא שינוי, אבל אותם קלטים מובילים כעת לתוצאות אחרות. באיזה סוג של הסחה (shift) מדובר?", "options": ["סחיפת מושג (concept drift) — P(y|x) השתנה בעוד P(x) נשאר פחות או יותר קבוע", "הסחת משתנים (covariate shift) — P(x) השתנה בעוד P(y|x) נשאר קבוע", "הסחת תוויות (label shift) — P(y) השתנה בעוד P(x|y) נשאר קבוע", "הטיית דגימה — סט האימון מעולם לא היה מייצג מלכתחילה"], "hint": "איזה גורם בפירוק של ההתפלגות המשותפת P(x,y) באמת זז?", "explanation": "סוגי ההסחה הקנוניים נבדלים בשאלה איזה חלק בפירוק זז. הסחת משתנים מזיזה את הקלטים, הסחת תוויות מזיזה את השוליות של המחלקות, וסחיפת מושג מזיזה את ההתפלגות המותנית P(y|x) — כלומר את הכלל עצמו. סחיפת מושג היא הקשה ביותר לניטור, כי מנטרי התפלגות קלט לא רואים דבר ומגלים את הבעיה רק כשהתוויות מגיעות.", "whyWrong": ["הסחת משתנים מוגדרת כתזוזה של P(x) בעוד המותנית נשארת שלמה, וכאן דווקא המותנית היא שזזה.", "הסחת תוויות הייתה מתבטאת בשינוי איזון המחלקות עם קלטים מותנים ללא שינוי.", "הטיית דגימה היא פגם בשלב האיסוף, ולא שינוי שמתרחש אחרי העלייה לאוויר."]}}, {"id": "dat-009", "area": "data", "topic": "resampling-calibration", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["imbalance", "calibration", "resampling"], "answer": 2, "en": {"q": "Training data has 1,000 positives and 99,000 negatives. You oversample positives to 10,000 and the model outputs 0.5 for a case. What is the corrected probability?", "options": ["About 50%, since oversampling does not move the decision boundary", "About 1%, which is simply the original base rate", "About 9%, obtained by dividing the odds by the oversampling factor of 10", "About 5%, the average of the base rate and the raw model output"], "hint": "Work in odds: what did multiplying the positives by 10 do to them?", "explanation": "Oversampling multiplied the positive class by 10, so the model learned odds inflated by that factor. Correcting: the resampled odds are 0.5/0.5 = 1, the true odds are 1/10 = 0.1, and the probability is 0.1/1.1, about 9%. This is why resampling quietly destroys calibration — the ranking can be fine while every probability is far too high, which matters the moment you use expected cost or a business threshold.", "whyWrong": ["The ranking may survive, but the probability scale is shifted by construction, so 0.5 is not trustworthy.", "1% is the prior; the evidence in this case does raise it, by roughly a factor of nine.", "Averaging a prior with a model output is not a valid correction; the correction is multiplicative in odds."]}, "he": {"q": "בדאטת האימון יש 1,000 חיוביים ו-99,000 שליליים. ביצעתם דגימת יתר של החיוביים ל-10,000, והמודל מוציא 0.5 עבור מקרה מסוים. מהי ההסתברות המתוקנת?", "options": ["בערך 50%, כי דגימת יתר לא מזיזה את גבול ההחלטה", "בערך 1%, שזה פשוט שיעור הבסיס המקורי", "בערך 9%, שמתקבל מחלוקת הסיכויים (odds) בפקטור דגימת היתר 10", "בערך 5%, הממוצע בין שיעור הבסיס לבין הפלט הגולמי של המודל"], "hint": "עבדו ביחסי סיכויים (odds): מה עשתה הכפלת מספר החיוביים פי 10 ליחס הזה?", "explanation": "דגימת היתר הכפילה את מחלקת החיוב פי 10, ולכן המודל למד יחסי סיכויים מנופחים בפקטור הזה. התיקון: יחס הסיכויים בדאטה המאוזן הוא 0.5/0.5 = 1, יחס הסיכויים האמיתי הוא 1/10 = 0.1, וההסתברות היא 0.1/1.1, כלומר בערך 9%. זו הסיבה שאיזון מחדש הורס בשקט את הכיול — הדירוג עשוי להיות תקין בעוד כל ההסתברויות גבוהות בהרבה מדי, וזה קריטי ברגע שמשתמשים בעלות תוחלתית או בסף עסקי.", "whyWrong": ["הדירוג אולי שורד, אבל סקאלת ההסתברות הוזזה מעצם הבנייה, ולכן אי אפשר לסמוך על 0.5.", "1% הוא הפריור; העדות במקרה הזה כן מעלה אותו, בערך פי תשעה.", "מיצוע בין פריור לפלט המודל אינו תיקון תקף; התיקון הוא כפלי ביחס הסיכויים."]}}, {"id": "dat-010", "area": "data", "topic": "train-serve-skew", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["train-serve-skew", "feature-store", "point-in-time"], "en": {"q": "Offline your model scores 0.82 AUC, online 0.71, and no drift is detected. Explain train/serve skew and how point-in-time correctness prevents one of its worst forms.", "hint": "Compare how a feature's value was computed during training with how it is computed at request time.", "modelAnswer": "Train/serve skew is a mismatch between the features a model was trained on and the features it actually receives in production: two implementations of the same transformation (a batch job versus an online service), different defaults for missing values, different units or time zones, stale aggregation windows, or features that simply cannot be computed within the request latency budget. A particularly damaging sub-case is time travel: the training row for a customer at time t used an aggregate computed over the whole table, including events that happened after t, so the model trained on information that does not exist at serving time. Point-in-time correctness means every training feature is built with an as-of join that uses only data available strictly before the label's timestamp, which is one of the main reasons feature stores exist. Practical safeguards: define each feature once and share the transformation code or the feature store between training and serving, log the exact feature vectors sent at inference and re-score them offline to compare distributions and outputs, and run a shadow deployment before shifting traffic.", "rubric": ["Defines train/serve skew as a mismatch between training-time and serving-time feature computation", "Gives concrete causes: duplicated transformation code, different defaults or units, stale or unavailable features", "Explains point-in-time correctness / as-of joins: use only data available before the label timestamp", "Recommends a single shared feature definition or a feature store used by both paths", "Recommends logging production feature vectors and re-scoring or shadow testing to detect skew"]}, "he": {"q": "אופליין המודל מקבל 0.82 AUC, אונליין 0.71, ולא מזוהה שום drift. הסבירו מהי אי-התאמה בין אימון להגשה (train/serve skew) וכיצד נכונות נקודת-זמן (point-in-time correctness) מונעת את אחת הצורות החמורות שלה.", "hint": "השוו כיצד חושב ערך הפיצ'ר בזמן האימון לעומת כיצד הוא מחושב בזמן הבקשה.", "modelAnswer": "אי-התאמה בין אימון להגשה היא פער בין הפיצ'רים שעליהם המודל התאמן לבין אלה שהוא באמת מקבל בייצור: שני מימושים של אותה טרנספורמציה (תהליך batch מול שירות אונליין), ערכי ברירת מחדל שונים לערכים חסרים, יחידות או אזורי זמן שונים, חלונות אגרגציה מיושנים, או פיצ'רים שפשוט אי אפשר לחשב בתוך תקציב זמן התגובה. תת-מקרה הרסני במיוחד הוא 'מסע בזמן': שורת האימון של לקוח בזמן t חושבה מאגרגציה על כל הטבלה, כולל אירועים שקרו אחרי t, ולכן המודל התאמן על מידע שאינו קיים בזמן ההגשה. נכונות נקודת-זמן פירושה שכל פיצ'ר אימון נבנה בעזרת as-of join שמשתמש רק בדאטה שהיה זמין ממש לפני חותמת הזמן של התווית, וזו אחת הסיבות המרכזיות לקיומם של feature stores. אמצעי הגנה מעשיים: להגדיר כל פיצ'ר פעם אחת ולשתף את קוד הטרנספורמציה או את ה-feature store בין אימון להגשה, לתעד את וקטורי הפיצ'רים המדויקים שנשלחו בזמן ההרצה ולהריץ עליהם ניקוד מחדש אופליין כדי להשוות התפלגויות ופלטים, ולהריץ shadow deployment לפני הסטת תעבורה.", "rubric": ["מגדיר train/serve skew כפער בין חישוב הפיצ'רים באימון לבין חישובם בהגשה", "נותן סיבות קונקרטיות: קוד טרנספורמציה כפול, ברירות מחדל או יחידות שונות, פיצ'רים מיושנים או לא זמינים", "מסביר נכונות נקודת-זמן / as-of join: להשתמש רק בדאטה שהיה זמין לפני חותמת הזמן של התווית", "ממליץ על הגדרת פיצ'ר אחת משותפת או feature store שמשמש את שני המסלולים", "ממליץ על תיעוד וקטורי פיצ'רים מהייצור וניקוד מחדש או shadow testing לגילוי הפער"]}}, {"id": "rai-001", "area": "responsible-ai", "topic": "fairness-metrics", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["fairness", "metrics"], "answer": 0, "en": {"q": "A lender forces the share of approved applicants to be equal across groups. Which fairness criterion does this satisfy, and what is still not guaranteed?", "options": ["Demographic parity; equal error rates across the groups are not guaranteed", "Equalized odds; demographic parity then follows automatically", "Equal opportunity; false-positive rates are therefore equal as well", "Calibration within groups; a score now means the same thing in each group"], "hint": "Ask whether the criterio
