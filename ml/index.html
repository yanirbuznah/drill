<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1017" media="(prefers-color-scheme: dark)">
<meta name="description" content="Machine learning and deep learning, from classical models to LLMs and production.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ML Drill">
<meta name="mobile-web-app-capable" content="yes">
<title>ML Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EDEFF3; --surface-3:#E3E7ED;
  --line:#D8DEE7; --line-strong:#BCC5D2;
  --ink:#131820; --muted:#5A6472; --faint:#8B94A3;
  --accent:#4338A8; --accent-ink:#FFFFFF; --accent-soft:#E9E7F8; --accent-line:#BFB8EC;
  --ok:#14724D; --ok-soft:#E1F1E9; --ok-line:#9BCFB8;
  --bad:#B02A24; --bad-soft:#FBE7E5; --bad-line:#E9AFAB;
  --warn:#8A5A00;
  --d1:#2F8F7F; --d2:#A87C1E; --d3:#C4602F; --d4:#9C2F6B;
  --shadow:0 1px 2px rgba(19,24,32,.05), 0 8px 24px -12px rgba(19,24,32,.18);
  --r:8px; --r-sm:5px;
  --sans:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1017; --surface:#151A23; --surface-2:#1C222D; --surface-3:#232B38;
    --line:#293040; --line-strong:#3A4353;
    --ink:#E8ECF3; --muted:#9AA5B5; --faint:#77808F;
    --accent:#9A8CFF; --accent-ink:#12101F; --accent-soft:#221E3C; --accent-line:#463D80;
    --ok:#48C596; --ok-soft:#12291F; --ok-line:#2A6A4F;
    --bad:#F0736B; --bad-soft:#2B1615; --bad-line:#6E332F;
    --warn:#D9A441;
    --d1:#4FBFA8; --d2:#D8A63C; --d3:#E58044; --d4:#DB6BA8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1017; --surface:#151A23; --surface-2:#1C222D; --surface-3:#232B38;
  --line:#293040; --line-strong:#3A4353;
  --ink:#E8ECF3; --muted:#9AA5B5; --faint:#77808F;
  --accent:#9A8CFF; --accent-ink:#12101F; --accent-soft:#221E3C; --accent-line:#463D80;
  --ok:#48C596; --ok-soft:#12291F; --ok-line:#2A6A4F;
  --bad:#F0736B; --bad-soft:#2B1615; --bad-line:#6E332F;
  --warn:#D9A441;
  --d1:#4FBFA8; --d2:#D8A63C; --d3:#E58044; --d4:#DB6BA8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  overflow-x:hidden; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
[hidden]{display:none !important}

/* ---------- shell ---------- */
.app{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:7px;margin-inline-end:auto;min-width:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:34px;padding:0 9px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--muted);
}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
main{flex:1;padding:16px 14px 96px}
@media(min-width:700px){ main{padding:24px 20px 110px} }

/* ---------- type ---------- */
h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
h2{font-size:17px;line-height:1.3;letter-spacing:-.01em;margin:0 0 10px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.lede{color:var(--muted);font-size:14.5px;margin:0 0 20px;max-width:60ch}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- cards / sections ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.section{margin-bottom:22px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- mode picker ---------- */
.modes{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:22px}
@media(min-width:560px){ .modes{grid-template-columns:1fr 1fr} }
.mode{
  display:flex;flex-direction:column;gap:5px;text-align:start;padding:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease;
}
.mode:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.mode strong{font-size:17px;letter-spacing:-.01em}
.mode span{font-size:13px;color:var(--muted);line-height:1.45}
.mode em{font-family:var(--mono);font-size:10px;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);
  transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.chip .n{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.chip.d1[aria-pressed="true"]{background:color-mix(in srgb,var(--d1) 15%,transparent);border-color:var(--d1);color:var(--d1)}
.chip.d2[aria-pressed="true"]{background:color-mix(in srgb,var(--d2) 15%,transparent);border-color:var(--d2);color:var(--d2)}
.chip.d3[aria-pressed="true"]{background:color-mix(in srgb,var(--d3) 15%,transparent);border-color:var(--d3);color:var(--d3)}
.chip.d4[aria-pressed="true"]{background:color-mix(in srgb,var(--d4) 15%,transparent);border-color:var(--d4);color:var(--d4)}

details.filters{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
details.filters>summary{
  list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:500;
}
details.filters>summary::-webkit-details-marker{display:none}
details.filters>summary::after{content:"+";margin-inline-start:auto;font-family:var(--mono);color:var(--faint);font-size:16px}
details.filters[open]>summary::after{content:"\2212"}
details.filters>summary .pool{font-family:var(--mono);font-size:11px;color:var(--faint);margin-inline-start:auto}
details.filters[open]>summary .pool{display:none}
.filterbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line)}
.fgroup{padding-top:14px}
.fgroup>.eyebrow{display:flex;align-items:center;gap:8px}
.fgroup .allbtn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-inline-start:auto}

/* ---------- difficulty meter ---------- */
.meter{display:inline-flex;gap:2.5px;align-items:center}
.meter i{width:5px;height:5px;border-radius:50%;background:var(--line-strong);display:block}
.meter[data-d="1"] i:nth-child(-n+1){background:var(--d1)}
.meter[data-d="2"] i:nth-child(-n+2){background:var(--d2)}
.meter[data-d="3"] i:nth-child(-n+3){background:var(--d3)}
.meter[data-d="4"] i:nth-child(-n+4){background:var(--d4)}

/* ---------- question ---------- */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.qmeta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.qmeta .area{color:var(--muted)}
.qcard{padding:20px 18px}
.qtext{font-size:19px;line-height:1.45;letter-spacing:-.01em;margin:0;text-wrap:pretty}
@media(min-width:700px){ .qtext{font-size:21px} }
.hintbox{margin-top:16px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);
  border-inline-start:3px solid var(--warn);font-size:14px;color:var(--muted)}
.hintbox b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:start;width:100%;
  padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:15px;line-height:1.45;
  transition:border-color .12s,background .12s;
}
.opt:not(.locked):hover{border-color:var(--accent-line);background:var(--accent-soft)}
.opt.locked{cursor:default}
.opt .k{
  flex:0 0 auto;width:21px;height:21px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;
  color:var(--muted);margin-top:1px;
}
.opt.correct{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.picked{border-width:2px;padding:11px 12px}
.opt.dim{opacity:.62}
.opt .why{display:block;margin-top:6px;font-size:13px;color:var(--muted);line-height:1.45}
.reveal-anim{animation:rise .22s ease both}
.opts.reveal-anim .opt:nth-child(1){animation-delay:0ms}
.opts.reveal-anim .opt:nth-child(2){animation-delay:35ms}
.opts.reveal-anim .opt:nth-child(3){animation-delay:70ms}
.opts.reveal-anim .opt:nth-child(4){animation-delay:105ms}
.opts.reveal-anim .opt{animation:rise .24s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }

.verdict{display:flex;align-items:center;gap:9px;margin-top:16px;padding:11px 13px;border-radius:var(--r-sm);
  font-size:14.5px;font-weight:500}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.verdict.no{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.verdict .g{font-family:var(--mono);font-size:15px}

.explain{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.explain .eyebrow{margin-bottom:6px}
.explain p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}

textarea.answer{width:100%;min-height:120px;padding:12px 13px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);resize:vertical;font-size:15px;line-height:1.5}
textarea.answer:focus{border-color:var(--accent);outline:none}
.rubric{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.rubric li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.rubric input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--accent);flex:0 0 auto}
.selfscore{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:12px;color:var(--muted)}
.selfscore b{font-size:20px;color:var(--ink)}

/* ---------- action bar ---------- */
.actionbar{
  position:fixed;inset-inline:0;bottom:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.actionbar .inner{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  font-size:15px;font-weight:500;color:var(--ink);min-height:46px;
}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{color:var(--muted)}
.btn.wide{flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13.5px}

/* ---------- progress ---------- */
.progress{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.progress .bar{flex:1;height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.progress .cnt{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em}
.qdots{display:flex;gap:4px;flex-wrap:wrap}
.qdots i{width:7px;height:7px;border-radius:50%;background:var(--surface-3);display:block}
.qdots i.done{background:var(--accent)}
.qdots i.now{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- stats ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:center}
.stat b{display:block;font-size:23px;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.barlist{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(90px,1fr) 2fr auto;gap:10px;align-items:center;font-size:13.5px}
.barrow .track{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.barrow .pct{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:end}

/* ---------- results ---------- */
.scorehero{text-align:center;padding:26px 18px}
.scorehero .big{font-family:var(--mono);font-size:56px;line-height:1;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.scorehero .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.reviewitem{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.reviewitem+.reviewitem{margin-top:8px}
.reviewitem .q{font-size:15px;line-height:1.45;margin:8px 0 10px}
.ansline{font-size:13.5px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.ansline .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:0 0 auto;min-width:62px;margin-top:3px}
.ansline.ok .txt{color:var(--ok)}
.ansline.no .txt{color:var(--bad)}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .lab{flex:1;min-width:0}
.setrow .lab b{display:block;font-size:14.5px;font-weight:500}
.setrow .lab span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.switch{flex:0 0 auto;width:44px;height:26px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(18px)}
[dir="rtl"] .switch[aria-pressed="true"]::after{transform:translateX(-18px)}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field input,.field select{padding:10px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:14px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:var(--r-sm)}
.note b{color:var(--ink)}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14.5px}
.ltr{direction:ltr;display:inline-block;unicode-bidi:isolate}
[dir="rtl"] .brand span,[dir="rtl"] .eyebrow,[dir="rtl"] .qmeta{letter-spacing:0}



/* ---------- cloze: the sentence under test ---------- */
.sent{
  font-size:19px;line-height:1.75;letter-spacing:-.01em;margin:0;
  direction:ltr;unicode-bidi:isolate;text-align:start;
}
[dir="rtl"] .sent{text-align:left}
@media(min-width:700px){ .sent{font-size:21px} }
.blank{
  display:inline-block;width:auto;min-width:5.5em;max-width:min(100%,15em);
  padding:2px 8px;margin:0 2px;
  border:0;border-bottom:2px solid var(--accent);border-radius:3px 3px 0 0;
  background:var(--surface-2);color:var(--ink);
  font:inherit;font-size:.95em;text-align:center;direction:ltr;
}
.blank:focus{outline:none;background:var(--accent-soft);border-bottom-width:3px}
.blank::placeholder{color:var(--faint);font-size:.85em;letter-spacing:.08em}
.blank:disabled{opacity:1;background:transparent;border-bottom-style:dotted}
.blank.good{background:var(--ok-soft);border-bottom-color:var(--ok);color:var(--ok);font-weight:600}
.blank.bad{background:var(--bad-soft);border-bottom-color:var(--bad);color:var(--bad);text-decoration:line-through}
.fix{display:block;margin-top:14px;padding:11px 13px;border-radius:var(--r-sm);
  background:var(--ok-soft);border:1px solid var(--ok-line);font-size:14.5px;color:var(--ink)}
.fix b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.fix .full{direction:ltr;unicode-bidi:isolate;display:block;line-height:1.6}
.fix .full u{text-decoration:none;color:var(--ok);font-weight:600;border-bottom:2px solid var(--ok-line)}
.alt{margin-top:7px;font-size:12.5px;color:var(--muted)}
.alt code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px;direction:ltr;unicode-bidi:isolate;display:inline-block}
/* ---------- inline math ---------- */
.mth{
  font-family:var(--mono);font-size:.93em;
  direction:ltr;unicode-bidi:isolate;
  white-space:pre-wrap;overflow-wrap:break-word;
  letter-spacing:-.005em;
}
/* ---------- glossary terms ---------- */
.term{
  display:inline;padding:0;margin:0;border:0;background:none;font:inherit;color:inherit;cursor:help;
  border-bottom:2px solid var(--accent);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
}
.term:hover,.term.on{color:var(--accent)}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.tip{
  position:fixed;top:0;inset-inline-start:0;z-index:120;
  width:max-content;max-width:min(330px,calc(100vw - 24px));
  background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--r);
  box-shadow:0 10px 34px -10px rgba(0,0,0,.5);padding:11px 13px;
  opacity:0;transform:translateY(-4px);pointer-events:none;
  transition:opacity .13s ease,transform .13s ease;
}
.tip.show{opacity:1;transform:none;pointer-events:auto}
.tip b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px}
.tip p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink)}
.tip .close{position:absolute;inset-inline-end:6px;top:5px;font-family:var(--mono);font-size:12px;
  color:var(--faint);padding:2px 5px;line-height:1}

/* ---------- glossary screen ---------- */
.gsearch{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:15px;margin-bottom:14px}
.gsearch:focus{border-color:var(--accent);outline:none}
.glist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.gitem{background:var(--surface);padding:12px 14px}
.gitem b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
.gitem span{display:block;font-size:13px;line-height:1.5;color:var(--muted)}
.gcount{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:10px}
</style>

const QUESTIONS = [{"id": "fnd-001", "area": "foundations", "topic": "bayes-rule", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["bayes", "probability", "base-rate"], "answer": 0, "en": {"q": "A disease affects 1% of a population. A test has 99% sensitivity and 95% specificity. Someone drawn at random tests positive. Roughly what is the probability they have the disease?", "options": ["About 17%", "About 50%", "About 95%", "About 99%"], "hint": "Imagine 10,000 people and count how many of the positives come from healthy people.", "explanation": "Out of 10,000 people, 100 are sick and about 99 of them test positive; 9,900 are healthy and 5% of them, 495, also test positive. So the posterior is 99/(99+495) = 1/6, about 17%. When the base rate is tiny, false positives from the huge healthy group dominate the positive pool.", "whyWrong": ["50% would require the false positives to equal the true positives; here they outnumber them 5 to 1.", "95% is the specificity, which is P(negative | healthy), not P(sick | positive).", "99% confuses the sensitivity P(positive | sick) with the posterior P(sick | positive)."]}, "he": {"q": "מחלה מופיעה ב-1% מהאוכלוסייה. לבדיקה יש רגישות (sensitivity) של 99% וסגוליות (specificity) של 95%. אדם שנבחר אקראית נבדק חיובי. מהי בקירוב ההסתברות שהוא חולה?", "options": ["בערך 17%", "בערך 50%", "בערך 95%", "בערך 99%"], "hint": "דמיינו 10,000 אנשים וספרו כמה מהתוצאות החיוביות מגיעות מאנשים בריאים.", "explanation": "מתוך 10,000 אנשים, 100 חולים וכ-99 מהם ייבדקו חיובי; 9,900 בריאים ו-5% מהם, כלומר 495, ייבדקו חיובי גם כן. לכן ההסתברות הפוסטריורית היא 99/(99+495) = 1/6, כלומר בערך 17%. כששיעור הבסיס (base rate) נמוך, ההתראות השגויות מהקבוצה הבריאה הגדולה שולטות במאגר החיוביים.", "whyWrong": ["50% היה מחייב שמספר ההתראות השגויות ישווה למספר האמיתיות; כאן הן גדולות מהן פי 5.", "95% היא הסגוליות, כלומר P(שלילי | בריא), ולא P(חולה | חיובי).", "99% מבלבל בין הרגישות P(חיובי | חולה) לבין ההסתברות הפוסטריורית P(חולה | חיובי)."]}}, {"id": "fnd-002", "area": "foundations", "topic": "entropy", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["information-theory", "entropy"], "answer": 2, "en": {"q": "What is the entropy of a coin that lands heads with probability 0.25?", "options": ["0.25 bits", "Exactly 1 bit", "About 0.81 bits", "About 0.5 bits"], "hint": "Both outcomes contribute: the rare one carries more surprise but shows up less often.", "explanation": "H = -0.25*log2(0.25) - 0.75*log2(0.75) = 0.25*2 + 0.75*0.415 = 0.5 + 0.311 = 0.811 bits. Entropy is maximal (1 bit) only for a fair coin, and falls toward 0 as the coin becomes deterministic.", "whyWrong": ["0.25 is the probability, not the entropy; entropy averages -log2(p) over both outcomes.", "1 bit is the entropy of a fair coin, the maximum possible for two outcomes.", "0.5 bits is only the heads term, 0.25*log2(4); the tails term adds another 0.311."]}, "he": {"q": "מהי האנטרופיה של מטבע שנוחת על 'עץ' בהסתברות 0.25?", "options": ["0.25 ביט", "בדיוק ביט אחד", "בערך 0.81 ביט", "בערך 0.5 ביט"], "hint": "שתי התוצאות תורמות: הנדירה נושאת יותר הפתעה אך מופיעה לעיתים רחוקות יותר.", "explanation": "H = -0.25*log2(0.25) - 0.75*log2(0.75) = 0.25*2 + 0.75*0.415 = 0.5 + 0.311 = 0.811 ביט. האנטרופיה מקסימלית (ביט אחד) רק עבור מטבע הוגן, ויורדת לכיוון 0 ככל שהמטבע נעשה דטרמיניסטי.", "whyWrong": ["0.25 היא ההסתברות ולא האנטרופיה; האנטרופיה ממצעת את -log2(p) על שתי התוצאות.", "ביט אחד הוא האנטרופיה של מטבע הוגן, המקסימום האפשרי עבור שתי תוצאות.", "0.5 ביט הוא רק האיבר של 'עץ', 0.25*log2(4); האיבר של 'פלי' מוסיף עוד 0.311."]}}, {"id": "fnd-003", "area": "foundations", "topic": "expectation", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["expectation", "probability", "independence"], "answer": 3, "en": {"q": "X and Y are strongly dependent random variables. Which statement about E[X+Y] and E[XY] is correct?", "options": ["Both E[X+Y]=E[X]+E[Y] and E[XY]=E[X]E[Y] fail", "E[X+Y]=E[X]+E[Y] fails, while E[XY]=E[X]E[Y] holds", "Both identities still hold exactly", "E[X+Y]=E[X]+E[Y] holds, while E[XY]=E[X]E[Y] may fail"], "hint": "One of these two identities needs no assumption whatsoever about the joint distribution.", "explanation": "Linearity of expectation requires no independence at all: E[X+Y]=E[X]+E[Y] is true for any joint distribution. The product rule E[XY]=E[X]E[Y] is exactly the statement Cov(X,Y)=0, which dependence can easily break. Mixing up which rule needs independence is the classic mistake here.", "whyWrong": ["Linearity of expectation holds for any joint distribution, dependent or not.", "This reverses the truth: the sum rule is unconditional, the product rule is not.", "The product rule needs zero covariance, which dependent variables frequently violate."]}, "he": {"q": "X ו-Y הם משתנים מקריים תלויים מאוד. איזו טענה על E[X+Y] ועל E[XY] נכונה?", "options": ["גם E[X+Y]=E[X]+E[Y] וגם E[XY]=E[X]E[Y] נכשלות", "E[X+Y]=E[X]+E[Y] נכשלת, ואילו E[XY]=E[X]E[Y] מתקיימת", "שתי הזהויות עדיין מתקיימות במדויק", "E[X+Y]=E[X]+E[Y] מתקיימת, ואילו E[XY]=E[X]E[Y] עלולה להיכשל"], "hint": "אחת משתי הזהויות אינה דורשת שום הנחה על ההתפלגות המשותפת.", "explanation": "לינאריות התוחלת אינה דורשת אי-תלות כלל: E[X+Y]=E[X]+E[Y] נכונה עבור כל התפלגות משותפת. כלל המכפלה E[XY]=E[X]E[Y] שקול בדיוק לטענה ש-Cov(X,Y)=0, ותלות עלולה לשבור אותו בקלות. הבלבול בשאלה איזה כלל דורש אי-תלות הוא הטעות הקלאסית כאן.", "whyWrong": ["לינאריות התוחלת מתקיימת עבור כל התפלגות משותפת, תלויה או לא.", "זה הפוך מהמצב: כלל הסכום אינו מותנה בדבר, כלל המכפלה כן.", "כלל המכפלה דורש שונות משותפת (covariance) אפס, ומשתנים תלויים מפרים זאת לעיתים קרובות."]}}, {"id": "fnd-004", "area": "foundations", "topic": "pca-eigenvectors", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["linear-algebra", "pca", "eigenvectors"], "answer": 1, "en": {"q": "For centered data, the first principal component direction is:", "options": ["The mean of the data vectors, normalized to unit length", "The eigenvector of the covariance matrix with the largest eigenvalue", "The eigenvector of the covariance matrix with the smallest eigenvalue", "The direction that minimizes the variance of the projections"], "hint": "Ask what quantity PCA maximizes, and in whose spectrum that quantity is encoded.", "explanation": "PC1 maximizes the variance of the projected data, and that maximum is attained at the top eigenvector of the covariance matrix; the eigenvalue itself equals the variance captured along that direction. After centering, the mean is the zero vector and carries no directional information at all.", "whyWrong": ["After centering the mean is the zero vector, so it defines no direction.", "The smallest eigenvector is the least informative direction and shows up in the last component.", "Minimizing projected variance describes the last principal component, not the first."]}, "he": {"q": "עבור נתונים ממורכזים, כיוון הרכיב העיקרי הראשון (PC1) הוא:", "options": ["ממוצע וקטורי הנתונים, מנורמל לאורך יחידה", "הווקטור העצמי של מטריצת השונות המשותפת בעל הערך העצמי הגדול ביותר", "הווקטור העצמי של מטריצת השונות המשותפת בעל הערך העצמי הקטן ביותר", "הכיוון שממזער את השונות של ההיטלים"], "hint": "שאלו איזה גודל PCA ממקסם, ובספקטרום של איזו מטריצה הגודל הזה מקודד.", "explanation": "PC1 ממקסם את השונות של הנתונים המוטלים, והמקסימום מושג בווקטור העצמי העליון של מטריצת השונות המשותפת; הערך העצמי עצמו שווה לשונות שנלכדת בכיוון הזה. אחרי מירכוז, הממוצע הוא וקטור האפס ואינו נושא מידע כיווני כלל.", "whyWrong": ["אחרי מירכוז הממוצע הוא וקטור האפס, ולכן אינו מגדיר כיוון.", "הווקטור העצמי הקטן ביותר הוא הכיוון הפחות אינפורמטיבי ומופיע ברכיב האחרון.", "מזעור השונות המוטלת מתאר את הרכיב העיקרי האחרון, לא את הראשון."]}}, {"id": "fnd-005", "area": "foundations", "topic": "vector-norms", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["linear-algebra", "norms"], "answer": 0, "en": {"q": "For the vector v = (3, -4, 12), which set of norms is correct?", "options": ["L1 = 19, L2 = 13, Linf = 12", "L1 = 11, L2 = 13, Linf = 12", "L1 = 19, L2 = 169, Linf = 12", "L1 = 19, L2 = 13, Linf = 4"], "hint": "L1 sums magnitudes, L2 takes a square root, Linf takes a maximum.", "explanation": "L1 = |3|+|-4|+|12| = 19, L2 = sqrt(9+16+144) = sqrt(169) = 13, and Linf = max(3,4,12) = 12. Note that 169 is the squared L2 norm, a quantity that is convenient to differentiate but is not itself a norm.", "whyWrong": ["The L1 norm sums absolute values, so the -4 contributes +4 and the total is 19, not 11.", "169 is the squared L2 norm; the norm itself is its square root, 13.", "Linf is the largest absolute entry, 12, not the middle one."]}, "he": {"q": "עבור הווקטור v = (3, -4, 12), איזו קבוצת נורמות נכונה?", "options": ["L1 = 19, L2 = 13, Linf = 12", "L1 = 11, L2 = 13, Linf = 12", "L1 = 19, L2 = 169, Linf = 12", "L1 = 19, L2 = 13, Linf = 4"], "hint": "L1 מסכמת גדלים מוחלטים, L2 מוציאה שורש, ו-Linf לוקחת מקסימום.", "explanation": "L1 = |3|+|-4|+|12| = 19, L2 = sqrt(9+16+144) = sqrt(169) = 13, ו-Linf = max(3,4,12) = 12. שימו לב ש-169 היא נורמת L2 בריבוע, גודל שנוח לגזור אך אינו נורמה בעצמו.", "whyWrong": ["נורמת L1 מסכמת ערכים מוחלטים, ולכן ה-4- תורם 4+ והסכום הוא 19 ולא 11.", "169 היא נורמת L2 בריבוע; הנורמה עצמה היא השורש שלה, 13.", "Linf הוא האיבר בעל הערך המוחלט הגדול ביותר, 12, ולא האמצעי."]}}, {"id": "fnd-006", "area": "foundations", "topic": "cross-entropy", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["information-theory", "kl-divergence", "cross-entropy"], "answer": 2, "en": {"q": "For two distributions p and q over the same outcomes, the cross-entropy H(p,q) equals:", "options": ["H(q) + KL(q||p)", "KL(p||q) - H(p)", "H(p) + KL(p||q)", "H(p) * KL(p||q)"], "hint": "Write out -sum p log q, then add and subtract sum p log p.", "explanation": "H(p,q) = -sum p log q = H(p) + KL(p||q). Since H(p) is fixed by the data distribution, minimizing cross-entropy loss over model parameters is exactly minimizing KL(p||q). It also shows cross-entropy can never drop below H(p), which is the irreducible label noise.", "whyWrong": ["The roles of p and q are swapped; cross-entropy averages -log q under p.", "KL is non-negative and equals H(p,q) - H(p), so the signs here are inverted.", "The decomposition is a sum, not a product; a product would zero out H(p,q) whenever KL is zero, which is false."]}, "he": {"q": "עבור שתי התפלגויות p ו-q מעל אותן תוצאות, האנטרופיה הצולבת (cross-entropy) H(p,q) שווה ל:", "options": ["H(q) + KL(q||p)", "KL(p||q) - H(p)", "H(p) + KL(p||q)", "H(p) * KL(p||q)"], "hint": "כתבו את -sum p log q, ואז הוסיפו וחסרו את sum p log p.", "explanation": "H(p,q) = -sum p log q = H(p) + KL(p||q). מכיוון ש-H(p) קבועה ונקבעת על ידי התפלגות הנתונים, מזעור פונקציית ההפסד cross-entropy לפי פרמטרי המודל שקול בדיוק למזעור KL(p||q). מכאן גם נובע שהאנטרופיה הצולבת לעולם אינה יורדת מתחת ל-H(p), שהוא רעש התוויות הבלתי ניתן להקטנה.", "whyWrong": ["התפקידים של p ו-q הוחלפו; האנטרופיה הצולבת ממצעת את -log q לפי p.", "KL היא אי-שלילית ושווה ל-H(p,q) - H(p), כך שהסימנים כאן הפוכים.", "הפירוק הוא סכום ולא מכפלה; מכפלה הייתה מאפסת את H(p,q) בכל פעם ש-KL מתאפסת, וזה שגוי."]}}, {"id": "fnd-007", "area": "foundations", "topic": "l1-l2-geometry", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["norms", "regularization", "convexity"], "answer": 1, "en": {"q": "Why does L1 regularization drive coefficients to exactly zero while L2 usually only shrinks them?", "options": ["L1 penalizes large weights far more heavily than L2 does", "The L1 ball has corners on the axes, where the optimum often lands", "L1 is convex while L2 is not, so it has a sharper minimum", "L1 shrinks every weight by the same multiplicative factor"], "hint": "Draw the unit ball of each penalty and ask where a smooth loss contour is likely to touch it.", "explanation": "The L1 constraint region is a cross-polytope whose corners sit on the coordinate axes, so a loss contour frequently first touches it at a corner, zeroing coordinates exactly. Equivalently, the L1 penalty has a constant-size subgradient at 0 while the L2 gradient vanishes there. The L2 ball is smooth, so exact contact on an axis essentially never happens.", "whyWrong": ["L2 penalizes large weights more, since it grows quadratically rather than linearly.", "Both penalties are convex, and L2 is even strictly convex.", "Constant multiplicative shrinkage describes ridge, and it never reaches exactly zero."]}, "he": {"q": "מדוע רגולריזציית L1 מאפסת מקדמים לחלוטין בעוד L2 בדרך כלל רק מכווצת אותם?", "options": ["L1 מענישה משקלים גדולים בחומרה רבה בהרבה מ-L2", "לכדור ה-L1 יש פינות על הצירים, ושם האופטימום נוחת לעיתים קרובות", "L1 קמורה ואילו L2 אינה קמורה, ולכן יש לה מינימום חד יותר", "L1 מכווצת כל משקל באותו גורם כפלי"], "hint": "ציירו את כדור היחידה של כל עונש ושאלו היכן קו גובה חלק של ההפסד צפוי לגעת בו.", "explanation": "אזור האילוץ של L1 הוא פוליטופ שפינותיו יושבות בדיוק על צירי הקואורדינטות, ולכן קו הגובה של ההפסד נוגע בו לעיתים קרובות דווקא בפינה ומאפס קואורדינטות במדויק. באופן שקול, לעונש L1 יש תת-גרדיאנט בגודל קבוע ב-0, בעוד הגרדיאנט של L2 מתאפס שם. כדור ה-L2 חלק, ולכן מגע מדויק על ציר כמעט לעולם אינו מתרחש.", "whyWrong": ["דווקא L2 מענישה משקלים גדולים יותר, כי היא גדלה ריבועית ולא לינארית.", "שני העונשים קמורים, ו-L2 אף קמורה ממש.", "כיווץ כפלי בגורם קבוע מתאר את ridge, והוא לעולם אינו מגיע לאפס מדויק."]}}, {"id": "fnd-008", "area": "foundations", "topic": "variance-covariance", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["variance", "covariance", "probability"], "answer": 3, "en": {"q": "Var(X) = 4, Var(Y) = 9, Cov(X, Y) = 3. What is Var(X - Y)?", "options": ["13", "19", "1", "7"], "hint": "Var(aX + bY) = a^2 Var(X) + b^2 Var(Y) + 2ab Cov(X, Y), with b = -1.", "explanation": "Var(X - Y) = Var(X) + Var(Y) - 2Cov(X, Y) = 4 + 9 - 6 = 7. The covariance term flips sign because of the minus, so positive correlation shrinks the variance of a difference. That is the whole reason paired comparisons are more powerful than unpaired ones.", "whyWrong": ["13 = 4 + 9 ignores the covariance term, which is only valid when Cov = 0.", "19 = 4 + 9 + 6 adds the covariance instead of subtracting it, which gives Var(X + Y).", "1 subtracts the variances, but the variances of a difference add rather than cancel."]}, "he": {"q": "נתון Var(X) = 4, Var(Y) = 9, Cov(X, Y) = 3. מהי Var(X - Y)?", "options": ["13", "19", "1", "7"], "hint": "Var(aX + bY) = a^2 Var(X) + b^2 Var(Y) + 2ab Cov(X, Y), עם b = -1.", "explanation": "Var(X - Y) = Var(X) + Var(Y) - 2Cov(X, Y) = 4 + 9 - 6 = 7. הסימן של איבר השונות המשותפת מתהפך בגלל המינוס, ולכן מתאם חיובי מקטין את השונות של ההפרש. זו בדיוק הסיבה שהשוואות מזווגות חזקות סטטיסטית יותר מהשוואות לא מזווגות.", "whyWrong": ["13 = 4 + 9 מתעלם מאיבר השונות המשותפת, מה שנכון רק כאשר Cov = 0.", "19 = 4 + 9 + 6 מוסיף את השונות המשותפת במקום לחסר אותה, וזו Var(X + Y).", "1 מחסר את השונויות, אבל השונויות של הפרש מתחברות ואינן מתקזזות."]}}, {"id": "fnd-009", "area": "foundations", "topic": "covariance-independence", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["covariance", "independence", "probability"], "answer": 1, "en": {"q": "X is uniform on {-1, 0, 1} and Y = X^2. Which statement is true?", "options": ["Cov(X, Y) = 0, so X and Y are independent", "Cov(X, Y) = 0, yet X and Y are dependent", "Cov(X, Y) > 0, and X and Y are dependent", "Cov(X, Y) < 0, and X and Y are independent"], "hint": "Compute E[XY] using symmetry, then ask whether knowing X tells you anything about Y.", "explanation": "E[X] = 0 and E[XY] = E[X^3] = 0, so the covariance is exactly zero. But Y is a deterministic function of X: knowing X = 0 tells you Y = 0 with certainty, so they are as dependent as two variables can be. Covariance only detects linear association, which is why 'uncorrelated' never means 'independent' outside the jointly Gaussian case.", "whyWrong": ["Zero covariance implies independence only for jointly Gaussian variables, which these are not.", "By symmetry the positive and negative contributions to E[XY] cancel exactly, giving 0.", "The covariance is 0, and a deterministic relation is the opposite of independence."]}, "he": {"q": "X מתפלג אחיד על {-1, 0, 1} ומתקיים Y = X^2. איזו טענה נכונה?", "options": ["Cov(X, Y) = 0, ולכן X ו-Y בלתי תלויים", "Cov(X, Y) = 0, ובכל זאת X ו-Y תלויים", "Cov(X, Y) > 0, ו-X ו-Y תלויים", "Cov(X, Y) < 0, ו-X ו-Y בלתי תלויים"], "hint": "חשבו את E[XY] בעזרת סימטריה, ואז שאלו אם ידיעת X מלמדת משהו על Y.", "explanation": "מתקיים E[X] = 0 וגם E[XY] = E[X^3] = 0, ולכן השונות המשותפת מתאפסת בדיוק. אבל Y היא פונקציה דטרמיניסטית של X: אם ידוע ש-X = 0 אז Y = 0 בוודאות, כך שהתלות ביניהם מקסימלית. שונות משותפת מזהה רק קשר לינארי, ולכן 'חסרי מתאם' לעולם אינו אומר 'בלתי תלויים' מחוץ למקרה הגאוסיאני המשותף.", "whyWrong": ["שונות משותפת אפס גוררת אי-תלות רק עבור משתנים גאוסיאניים משותפים, וזה אינו המקרה כאן.", "מטעמי סימטריה התרומות החיוביות והשליליות ל-E[XY] מתקזזות בדיוק ומתקבל 0.", "השונות המשותפת היא 0, וקשר דטרמיניסטי הוא ההפך הגמור מאי-תלות."]}}, {"id": "fnd-010", "area": "foundations", "topic": "svd-low-rank", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["svd", "linear-algebra", "low-rank"], "answer": 0, "en": {"q": "You keep only the top k singular triplets of a matrix A. The resulting matrix is:", "options": ["The best rank-k approximation to A in both Frobenius and spectral norm", "The best rank-k approximation only under the entrywise L1 norm", "Generally not optimal, but cheap and good enough in practice", "The projection of A onto its k smallest singular directions"], "hint": "There is a classical theorem naming truncation optimal for a whole family of norms.", "explanation": "This is the Eckart-Young-Mirsky theorem: SVD truncation is optimal for every unitarily invariant norm, which includes both the Frobenius and the spectral norm. The spectral-norm error is exactly the (k+1)-th singular value, so the singular spectrum tells you in advance how much you lose. This is why the SVD underlies PCA, low-rank compression and factorized adapters.", "whyWrong": ["The entrywise L1 norm is not unitarily invariant, and truncation is not optimal for it.", "Truncation is provably optimal, not merely a convenient heuristic.", "Keeping the smallest singular directions would throw away almost all of A's energy."]}, "he": {"q": "משאירים רק את k השלשות הסינגולריות הגדולות ביותר ב-SVD של מטריצה A. המטריצה המתקבלת היא:", "options": ["הקירוב הטוב ביותר מדרגה k ל-A גם בנורמת פרובניוס וגם בנורמה הספקטרלית", "הקירוב הטוב ביותר מדרגה k רק תחת נורמת L1 איבר-איבר", "בדרך כלל אינה אופטימלית, אבל זולה ומספיק טובה בפועל", "ההיטל של A על k הכיוונים הסינגולריים הקטנים ביותר"], "hint": "יש משפט קלאסי שקובע שהקטימה אופטימלית עבור משפחה שלמה של נורמות.", "explanation": "זהו משפט Eckart-Young-Mirsky: קטימת ה-SVD אופטימלית עבור כל נורמה אינווריאנטית אוניטרית, ובכללן נורמת פרובניוס והנורמה הספקטרלית. השגיאה בנורמה הספקטרלית שווה בדיוק לערך הסינגולרי ה-(k+1), כך שהספקטרום הסינגולרי מגלה מראש כמה מפסידים. זו הסיבה ש-SVD עומד בבסיס PCA, דחיסה בדרגה נמוכה ומתאמים מפורקים (LoRA).", "whyWrong": ["נורמת L1 איבר-איבר אינה אינווריאנטית אוניטרית, והקטימה אינה אופטימלית עבורה.", "הקטימה אופטימלית באופן מוכח, ולא רק היוריסטיקה נוחה.", "שמירת הכיוונים הסינגולריים הקטנים ביותר הייתה משליכה כמעט את כל האנרגיה של A."]}}, {"id": "fnd-011", "area": "foundations", "topic": "matrix-rank", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["linear-algebra", "rank"], "answer": 1, "en": {"q": "A is 5x3 with rank 3 and B is 3x5 with rank 3. What is true of the 5x5 product AB?", "options": ["It has rank 5 and is invertible", "It has rank exactly 3 and is singular", "Its rank is at most 3 and could be lower", "Its rank cannot be determined without the entries"], "hint": "A matrix with full column rank is an injective map, so what can it do to the dimension of B's image?", "explanation": "rank(AB) <= min(rank A, rank B) = 3, so a 5x5 matrix of rank 3 has a 2-dimensional null space and is singular. Because A has full column rank it is injective, so it cannot collapse the 3-dimensional image of B any further and the rank is exactly 3. By contrast BA is 3x3 of rank 3, hence invertible: AB and BA behave very differently.", "whyWrong": ["A 5x5 matrix of rank 3 has a 2-dimensional null space and cannot be invertible.", "The bound is right, but injectivity of A pins the rank at exactly 3, never lower.", "The ranks of A and B determine the product's rank completely in this case."]}, "he": {"q": "A היא מטריצה 5x3 מדרגה 3 ו-B היא מטריצה 3x5 מדרגה 3. מה נכון לגבי המכפלה AB בגודל 5x5?", "options": ["הדרגה שלה 5 והיא הפיכה", "הדרגה שלה בדיוק 3 והיא סינגולרית", "הדרגה שלה לכל היותר 3 ויכולה להיות נמוכה יותר", "אי אפשר לקבוע את הדרגה בלי לדעת את האיברים"], "hint": "מטריצה בעלת דרגת עמודות מלאה היא העתקה חד-חד-ערכית, אז מה היא יכולה לעשות לממד התמונה של B?", "explanation": "מתקיים rank(AB) <= min(rank A, rank B) = 3, ולכן מטריצה 5x5 מדרגה 3 היא בעלת גרעין דו-ממדי וסינגולרית. מכיוון של-A דרגת עמודות מלאה היא חד-חד-ערכית, ולכן אינה יכולה לכווץ עוד את התמונה התלת-ממדית של B והדרגה היא בדיוק 3. לעומת זאת BA היא 3x3 מדרגה 3 ולכן הפיכה: AB ו-BA מתנהגות שונה לגמרי.", "whyWrong": ["מטריצה 5x5 מדרגה 3 היא בעלת גרעין דו-ממדי ואינה יכולה להיות הפיכה.", "החסם נכון, אבל החד-חד-ערכיות של A מקבעת את הדרגה על 3 בדיוק, לעולם לא פחות.", "הדרגות של A ו-B קובעות במקרה זה את דרגת המכפלה במלואה."]}}, {"id": "fnd-012", "area": "foundations", "topic": "convexity", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["convexity", "optimization"], "answer": 2, "en": {"q": "f and g are convex on R^n. Which of these operations can produce a non-convex function?", "options": ["Their sum, f + g", "Their pointwise maximum, max(f, g)", "Their pointwise minimum, min(f, g)", "Scaling by a positive constant, 3f"], "hint": "Think about which set operation on epigraphs each one corresponds to: intersection or union.", "explanation": "Convexity survives nonnegative sums, positive scaling and pointwise maxima, because the epigraph of a max is the intersection of convex epigraphs. The pointwise minimum corresponds to a union of epigraphs and is not preserved: min((x+2)^2, (x-2)^2) has two separate minima with a bump between them. The common misconception is that 'convex in, convex out' holds for every elementwise operation.", "whyWrong": ["Sums of convex functions are convex, which is why a regularized loss stays convex.", "A pointwise max of convex functions is convex; the hinge loss is built exactly this way.", "Multiplying by a positive scalar preserves convexity."]}, "he": {"q": "f ו-g קמורות על R^n. איזו מהפעולות הבאות עלולה לייצר פונקציה לא קמורה?", "options": ["הסכום שלהן, f + g", "המקסימום הנקודתי, max(f, g)", "המינימום הנקודתי, min(f, g)", "כפל בקבוע חיובי, 3f"], "hint": "חשבו לאיזו פעולת קבוצות על האפיגרפים מתאימה כל אחת: חיתוך או איחוד.", "explanation": "קמירות נשמרת תחת סכומים אי-שליליים, כפל בסקלר חיובי ומקסימום נקודתי, כי האפיגרף של מקסימום הוא חיתוך של אפיגרפים קמורים. המינימום הנקודתי מתאים לאיחוד אפיגרפים ואינו נשמר: ל-min((x+2)^2, (x-2)^2) יש שני מינימומים נפרדים עם בליטה ביניהם. התפיסה השגויה הרווחת היא ש'קמור נכנס, קמור יוצא' נכון לכל פעולה איבר-איבר.", "whyWrong": ["סכום של פונקציות קמורות הוא קמור, ובזכות זה הפסד עם רגולריזציה נשאר קמור.", "מקסימום נקודתי של פונקציות קמורות הוא קמור; כך בדיוק בנוי hinge loss.", "כפל בסקלר חיובי שומר על קמירות."]}}, {"id": "fnd-013", "area": "foundations", "topic": "central-limit-theorem", "difficulty": 3, "type": "open", "hardnessSource": "trap", "tags": ["clt", "statistics", "probability"], "en": {"q": "A colleague says: 'the CLT guarantees my data is normal, so I can use a t-test.' Explain what the theorem actually claims, and when the normal approximation for the sample mean still fails.", "hint": "The theorem is a statement about a statistic, not about the raw observations.", "modelAnswer": "The CLT says nothing about the distribution of individual observations: it says the standardized sample mean of i.i.d. variables with finite variance converges in distribution to a normal as n grows. So the raw data can be skewed, discrete or bounded and the theorem still applies to the mean. It fails, or converges far too slowly to be useful, when the variance is infinite or the tails are very heavy (Cauchy, or power laws with alpha <= 2), when observations are strongly dependent or not identically distributed, and when n is small relative to the skewness. In those cases prefer a bootstrap, a rank-based test, or a model that actually matches the tails.", "rubric": ["States the CLT concerns the sample mean or sum, not the raw observations", "Names the i.i.d. and finite-variance conditions", "Gives a concrete failure mode: heavy tails, dependence, or small n with strong skew", "Notes convergence is asymptotic, so 'n = 30' is a rule of thumb and not a guarantee", "Suggests an alternative such as a bootstrap or a nonparametric test"]}, "he": {"q": "עמית טוען: 'משפט הגבול המרכזי (CLT) מבטיח שהנתונים שלי נורמליים, אז אפשר להשתמש במבחן t.' הסבירו מה המשפט באמת טוען, ומתי הקירוב הנורמלי לממוצע המדגם עדיין נכשל.", "hint": "המשפט הוא טענה על סטטיסטי, לא על התצפיות הגולמיות.", "modelAnswer": "ה-CLT אינו אומר דבר על התפלגות התצפיות הבודדות: הוא קובע שהממוצע המדגמי המתוקנן של משתנים בלתי תלויים ושווי התפלגות עם שונות סופית מתכנס בהתפלגות לנורמלי כאשר n גדל. לכן הנתונים הגולמיים יכולים להיות מוטים, בדידים או חסומים והמשפט עדיין חל על הממוצע. הוא נכשל, או מתכנס לאט מכדי להועיל, כאשר השונות אינסופית או הזנבות כבדים מאוד (קושי, או חוק חזקה עם alpha <= 2), כאשר התצפיות תלויות חזק או אינן שוות התפלגות, וכאשר n קטן ביחס לעוצמת ההטיה. במקרים כאלה עדיף להשתמש ב-bootstrap, במבחן מבוסס דירוגים, או במודל שמתאים באמת לזנבות.", "rubric": ["מבהיר שה-CLT עוסק בממוצע או בסכום המדגם ולא בתצפיות הגולמיות", "מזכיר את תנאי אי-התלות, שוויון ההתפלגות והשונות הסופית", "נותן מצב כשל קונקרטי: זנבות כבדים, תלות, או n קטן עם הטיה חזקה", "מציין שההתכנסות אסימפטוטית ולכן 'n = 30' הוא כלל אצבע ולא הבטחה", "מציע חלופה כמו bootstrap או מבחן א-פרמטרי"]}}, {"id": "fnd-014", "area": "foundations", "topic": "kl-divergence", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["kl-divergence", "variational-inference", "information-theory"], "answer": 3, "en": {"q": "You fit a single Gaussian q to a bimodal p by minimizing the reverse KL, KL(q||p). What behavior do you expect?", "options": ["q spreads out to cover both modes, with mass in the empty valley", "q converges to the arithmetic average of the two modal densities", "q matches the mean and variance of p exactly", "q locks onto one mode and ignores the other"], "hint": "Ask which direction of KL blows up when q puts mass where p has almost none.", "explanation": "Reverse KL, KL(q||p) = E_q[log q - log p], blows up wherever q places mass and p does not, so it is zero-forcing: q is punished for covering the low-density valley and it is safest hugging a single mode. Forward KL, KL(p||q), does the opposite, punishing missing mass under p and therefore covering modes. This asymmetry is why variational inference tends to underestimate posterior variance.", "whyWrong": ["That is the mode-covering behavior of the forward KL, KL(p||q).", "Averaging densities describes a mixture, which this objective does not encourage.", "Moment matching is what minimizing the forward KL over an exponential family does."]}, "he": {"q": "אתם מתאימים גאוסיאן יחיד q להתפלגות p דו-מודלית על ידי מזעור ה-KL ההפוך, KL(q||p). איזו התנהגות צפויה?", "options": ["q מתפרשת ומכסה את שתי המודות, עם מסה בעמק הריק שביניהן", "q מתכנסת לממוצע האריתמטי של שתי צפיפויות המודות", "q מתאימה בדיוק את התוחלת והשונות של p", "q ננעלת על מודה אחת ומתעלמת מהשנייה"], "hint": "שאלו איזה כיוון של KL מתפוצץ כאשר q שמה מסה במקום שבו ל-p כמעט אין.", "explanation": "ה-KL ההפוך, KL(q||p) = E_q[log q - log p], מתפוצץ בכל מקום שבו q שמה מסה ו-p לא, ולכן הוא zero-forcing: q נענשת על כיסוי העמק הדליל ומשתלם לה להיצמד למודה יחידה. ה-KL הישיר, KL(p||q), עושה את ההפך: הוא מעניש על מסה חסרה תחת p ולכן מכסה מודות. אי-הסימטריה הזו היא הסיבה שהסקה וריאציונית (variational inference) נוטה להעריך בחסר את שונות הפוסטריור.", "whyWrong": ["זו התנהגות כיסוי המודות של ה-KL הישיר, KL(p||q).", "מיצוע צפיפויות מתאר תערובת (mixture), והפונקציונל הזה אינו מעודד זאת.", "התאמת מומנטים היא מה שמזעור ה-KL הישיר מעל משפחה מעריכית עושה."]}}, {"id": "fnd-015", "area": "foundations", "topic": "mle-vs-map", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["mle", "map", "bayesian", "regularization"], "en": {"q": "Explain the difference between MLE and MAP estimation. Show how a zero-mean Gaussian prior on linear-regression weights turns into a familiar penalty, and say what happens as the sample size grows.", "hint": "Take the log of Bayes' rule and see which term the prior contributes.", "modelAnswer": "MLE picks the parameters maximizing the likelihood p(D|theta), while MAP maximizes the posterior p(theta|D), which is proportional to p(D|theta)p(theta), so it adds the log-prior. Taking negative logs, MAP minimizes -log p(D|theta) - log p(theta). Under Gaussian noise the first term is the sum of squared residuals, and a zero-mean Gaussian prior with variance tau^2 contributes ||w||^2/(2 tau^2), which is exactly ridge regression with lambda = sigma^2/tau^2; a Laplace prior gives L1 (lasso) instead. As n grows the log-likelihood scales with n while the log-prior stays constant, so the prior's influence washes out and MAP converges to MLE. MAP is still only a point estimate: it gives no uncertainty and, unlike the full posterior, it is not invariant to reparameterization.", "rubric": ["MLE maximizes the likelihood; MAP maximizes likelihood times prior", "Taking the negative log turns the prior into an additive penalty term", "Gaussian prior gives L2/ridge, with lambda identified as a ratio of variances (or notes Laplace gives L1)", "As n grows the likelihood dominates and MAP tends to MLE", "Notes MAP is a point estimate, unlike full Bayesian inference"]}, "he": {"q": "הסבירו את ההבדל בין אמידת MLE לאמידת MAP. הראו כיצד פריור גאוסיאני בעל תוחלת אפס על משקלי רגרסיה לינארית הופך לעונש מוכר, ומה קורה כשגודל המדגם גדל.", "hint": "קחו לוגריתם של כלל בייס וראו איזה איבר מוסיף הפריור.", "modelAnswer": "MLE בוחר את הפרמטרים הממקסמים את הנראות p(D|theta), בעוד MAP ממקסם את הפוסטריור p(theta|D) שפרופורציוני ל-p(D|theta)p(theta), ולכן מוסיף את הלוג של הפריור. אחרי לקיחת מינוס לוג, MAP ממזער את -log p(D|theta) - log p(theta). תחת רעש גאוסיאני האיבר הראשון הוא סכום ריבועי השאריות, ופריור גאוסיאני בעל תוחלת אפס ושונות tau^2 תורם ||w||^2/(2*tau^2), כלומר בדיוק ridge עם lambda = sigma^2/tau^2; פריור לפלס ייתן במקום זאת L1 (lasso). ככל ש-n גדל הלוג-נראות גדלה עם n בעוד הלוג-פריור נשאר קבוע, ולכן השפעת הפריור נשטפת ו-MAP מתכנס ל-MLE. עם זאת MAP הוא עדיין אומד נקודתי בלבד: הוא אינו נותן אי-ודאות, ובשונה מהפוסטריור המלא הוא אינו אינווריאנטי לשינוי פרמטריזציה.", "rubric": ["MLE ממקסם את הנראות; MAP ממקסם נראות כפול פריור", "לקיחת מינוס לוג הופכת את הפריור לאיבר עונש חיבורי", "פריור גאוסיאני נותן L2/ridge, עם זיהוי lambda כיחס שונויות (או ציון שפריור לפלס נותן L1)", "ככל ש-n גדל הנראות שולטת ו-MAP שואף ל-MLE", "מציין ש-MAP הוא אומד נקודתי, בשונה מהסקה בייסיאנית מלאה"]}}, {"id": "evl-001", "area": "evaluation", "topic": "precision-recall", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["confusion-matrix", "precision", "recall"], "answer": 0, "en": {"q": "A classifier produces TP = 40, FP = 10, FN = 20, TN = 930. What are its precision and recall?", "options": ["Precision 0.80, recall 0.67", "Precision 0.67, recall 0.80", "Precision 0.80, recall 0.80", "Precision 0.57, recall 0.67"], "hint": "One metric divides by everything you predicted positive, the other by everything that truly is positive.", "explanation": "Precision = TP/(TP+FP) = 40/50 = 0.80, meaning of what you flagged, how much was right. Recall = TP/(TP+FN) = 40/60 = 0.67, meaning of what was actually positive, how much you caught. Accuracy here would be 970/1000 = 0.97, a flattering number produced mostly by the dominant negative class.", "whyWrong": ["This swaps the two: the FN count enters recall's denominator, not precision's.", "Recall's denominator is 60, not 50, so it cannot coincide with precision here.", "0.57 is TP/(TP+FP+FN), a Jaccard-style overlap score rather than precision."]}, "he": {"q": "מסווג מניב TP = 40, FP = 10, FN = 20, TN = 930. מהם ה-precision וה-recall שלו?", "options": ["precision 0.80, recall 0.67", "precision 0.67, recall 0.80", "precision 0.80, recall 0.80", "precision 0.57, recall 0.67"], "hint": "מדד אחד מחלק בכל מה שסימנתם כחיובי, והשני בכל מה שבאמת חיובי.", "explanation": "precision = TP/(TP+FP) = 40/50 = 0.80, כלומר מתוך מה שסימנתם, כמה צדקתם. recall = TP/(TP+FN) = 40/60 = 0.67, כלומר מתוך מה שבאמת חיובי, כמה תפסתם. הדיוק הכולל (accuracy) כאן הוא 970/1000 = 0.97, מספר מחמיא שנובע בעיקר מהשליטה של המחלקה השלילית.", "whyWrong": ["זו החלפה בין השניים: מספר ה-FN נכנס למכנה של recall ולא של precision.", "המכנה של recall הוא 60 ולא 50, ולכן הוא אינו יכול להתלכד עם precision כאן.", "0.57 הוא TP/(TP+FP+FN), מדד חפיפה בסגנון Jaccard ולא precision."]}}, {"id": "evl-002", "area": "evaluation", "topic": "top-k-accuracy", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["top-k", "classification", "metrics"], "answer": 2, "en": {"q": "A 1000-class model reports top-1 accuracy 0.72 and top-5 accuracy 0.91. What does top-5 accuracy count as correct?", "options": ["Any case where the true class gets probability above 0.5", "Any case where the model's top 5 classes are all plausible", "Any case where the true class is among the 5 highest-scoring classes", "The average accuracy over the 5 largest classes in the dataset"], "hint": "The k refers to a position in the model's ranked output list.", "explanation": "Top-k accuracy counts a prediction as correct if the true label appears anywhere in the k highest-scoring classes, so it is always at least top-1 and increases with k. It is the right metric when several labels are genuinely confusable, or when a human will pick from a short shortlist. It says nothing about calibration: the probabilities themselves can be badly off.", "whyWrong": ["That is a confidence-threshold criterion, unrelated to the ranking of the top 5.", "Plausibility is never measured; only whether the ground-truth label is in the list.", "Top-k is about ranking within a single prediction, not averaging over class subsets."]}, "he": {"q": "מודל מעל 1000 מחלקות מדווח top-1 accuracy של 0.72 ו-top-5 accuracy של 0.91. מה top-5 סופר כנכון?", "options": ["כל מקרה שבו המחלקה האמיתית מקבלת הסתברות מעל 0.5", "כל מקרה שבו חמש המחלקות המובילות של המודל סבירות", "כל מקרה שבו המחלקה האמיתית נמצאת בין 5 המחלקות בעלות הציון הגבוה ביותר", "הדיוק הממוצע על 5 המחלקות הגדולות ביותר במערך הנתונים"], "hint": "ה-k מתייחס למיקום ברשימת הפלט המדורגת של המודל.", "explanation": "top-k accuracy סופר חיזוי כנכון אם התווית האמיתית מופיעה איפשהו בין k המחלקות בעלות הציון הגבוה ביותר, ולכן הוא תמיד לפחות כמו top-1 וגדל עם k. זהו המדד הנכון כשכמה תוויות באמת מתבלבלות זו בזו, או כשאדם יבחר מתוך רשימה קצרה. הוא אינו אומר דבר על כיול (calibration): ההסתברויות עצמן יכולות להיות שגויות לחלוטין.", "whyWrong": ["זהו קריטריון של סף ביטחון, שאינו קשור לדירוג של חמש המובילות.", "סבירות אינה נמדדת כלל; נמדד רק אם התווית האמיתית נמצאת ברשימה.", "top-k עוסק בדירוג בתוך חיזוי בודד, ולא במיצוע על תת-קבוצות של מחלקות."]}}, {"id": "evl-003", "area": "evaluation", "topic": "metric-choice", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["recall", "imbalance", "metrics"], "answer": 1, "en": {"q": "You screen for a rare but treatable cancer; a missed case is far costlier than a false alarm that triggers a cheap follow-up test. Which metric should you push hardest on?", "options": ["Precision", "Recall", "Overall accuracy", "Specificity"], "hint": "Name the confusion-matrix cell you want to shrink, then find the metric that has it in the denominator.", "explanation": "A missed case is a false negative, and recall = TP/(TP+FN) is precisely the metric that punishes false negatives. You would lower the threshold, accept worse precision, and then report the precision you land at so the follow-up workload stays feasible. Accuracy is useless here: predicting 'no cancer' for everyone already scores near 100%.", "whyWrong": ["Precision controls false alarms, which you explicitly said are the cheap error.", "With a rare positive class, accuracy is dominated by the negatives and barely moves.", "Specificity measures how well you clear healthy people, again the cheap direction."]}, "he": {"q": "אתם מסננים סרטן נדיר אך בר-טיפול; החמצת מקרה יקרה בהרבה מהתראת שווא שמובילה לבדיקת המשך זולה. באיזה מדד להתמקד?", "options": ["precision", "recall", "דיוק כולל (accuracy)", "specificity"], "hint": "נקבו בתא של מטריצת הבלבול שאתם רוצים להקטין, ואז מצאו את המדד שהתא הזה נמצא במכנה שלו.", "explanation": "מקרה שהוחמץ הוא false negative, ו-recall = TP/(TP+FN) הוא בדיוק המדד שמעניש על false negatives. תורידו את הסף, תסכימו ל-precision גרוע יותר, ואז תדווחו את ה-precision שהתקבל כדי שעומס בדיקות ההמשך יישאר בר-ביצוע. accuracy חסר תועלת כאן: חיזוי 'אין סרטן' לכולם כבר מניב כמעט 100%.", "whyWrong": ["precision שולט בהתראות שווא, שהן דווקא הטעות הזולה לפי הנתון.", "כשהמחלקה החיובית נדירה, accuracy נשלט על ידי השליליים וכמעט אינו זז.", "specificity מודד כמה טוב מזכים אנשים בריאים, ושוב זה הכיוון הזול."]}}, {"id": "evl-004", "area": "evaluation", "topic": "f1-score", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["f1", "precision", "recall"], "answer": 3, "en": {"q": "A model has precision 0.60 and recall 0.30. What is its F1 score?", "options": ["0.45", "0.30", "0.36", "0.40"], "hint": "F1 is a harmonic mean, not an arithmetic one.", "explanation": "F1 = 2PR/(P+R) = 2*0.6*0.3/0.9 = 0.36/0.9 = 0.40. The harmonic mean sits closer to the smaller of the two numbers than the arithmetic mean 0.45 does, which is exactly why F1 punishes a model that buys precision by sacrificing recall.", "whyWrong": ["0.45 is the arithmetic mean; F1 is the harmonic mean and is always at most that.", "0.30 is just the recall, but F1 lies strictly between the two values, not at the minimum.", "0.36 is the numerator 2PR before dividing by the sum P+R = 0.9."]}, "he": {"q": "למודל יש precision של 0.60 ו-recall של 0.30. מהו ציון ה-F1 שלו?", "options": ["0.45", "0.30", "0.36", "0.40"], "hint": "F1 הוא ממוצע הרמוני, לא אריתמטי.", "explanation": "F1 = 2PR/(P+R) = 2*0.6*0.3/0.9 = 0.36/0.9 = 0.40. הממוצע ההרמוני קרוב יותר לקטן מבין שני המספרים מאשר הממוצע האריתמטי 0.45, וזו בדיוק הסיבה ש-F1 מעניש מודל שקונה precision במחיר של recall.", "whyWrong": ["0.45 הוא הממוצע האריתמטי; F1 הוא ממוצע הרמוני ותמיד קטן או שווה לו.", "0.30 הוא פשוט ה-recall, אבל F1 נמצא ממש בין שני הערכים ולא במינימום.", "0.36 הוא המונה 2PR לפני החלוקה בסכום P+R = 0.9."]}}, {"id": "evl-005", "area": "evaluation", "topic": "roc-auc", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["roc-auc", "ranking", "metrics"], "answer": 0, "en": {"q": "What does an ROC-AUC of 0.85 literally mean?", "options": ["A random positive is scored above a random negative 85% of the time", "85% of the predictions are correct at the default threshold of 0.5", "The predicted probabilities are within 0.15 of the true probabilities", "85% of the positive class is recovered at the chosen threshold"], "hint": "Think of it as a statement about pairs: one positive and one negative.", "explanation": "ROC-AUC equals the probability that a randomly chosen positive gets a higher score than a randomly chosen negative, counting ties as half. It is therefore threshold-free and measures ranking quality only. Any strictly increasing transformation of the scores leaves it completely unchanged.", "whyWrong": ["That is accuracy at one threshold, while AUC integrates over all thresholds.", "That is a calibration claim, and AUC ignores the scale of the scores entirely.", "That describes recall at a particular operating point, not the area under the curve."]}, "he": {"q": "מה בדיוק אומר ROC-AUC של 0.85?", "options": ["דגימה חיובית אקראית מקבלת ציון גבוה משלילית אקראית ב-85% מהמקרים", "85% מהחיזויים נכונים בסף ברירת המחדל 0.5", "ההסתברויות החזויות מדויקות עד כדי 0.15 מההסתברויות האמיתיות", "85% מהמחלקה החיובית נתפסים בסף שנבחר"], "hint": "חשבו על זה כטענה על זוגות: אחד חיובי ואחד שלילי.", "explanation": "ROC-AUC שווה להסתברות שדגימה חיובית אקראית מקבלת ציון גבוה יותר מדגימה שלילית אקראית, כאשר תיקו נספר כחצי. לכן הוא חסר-סף ומודד אך ורק את איכות הדירוג. כל טרנספורמציה מונוטונית עולה של הציונים משאירה אותו ללא שינוי כלל.", "whyWrong": ["זהו accuracy בסף יחיד, בעוד AUC מאנטגרל על כל הספים.", "זו טענת כיול (calibration), ו-AUC מתעלם לחלוטין מהסקאלה של הציונים.", "זה מתאר recall בנקודת עבודה מסוימת, ולא את השטח מתחת לעקומה."]}}, {"id": "evl-006", "area": "evaluation", "topic": "data-leakage", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["leakage", "preprocessing", "cross-validation"], "answer": 2, "en": {"q": "You standardize the features using the mean and std of the whole dataset, and only then run 5-fold CV. What is the consequence?", "options": ["Nothing, since scaling is a deterministic transform that never touches the labels", "The folds become correlated, which mainly inflates the variance of the estimate", "Validation-fold statistics leaked into training, so the CV score is optimistically biased", "It only matters when the features are not already roughly Gaussian"], "hint": "Ask which rows contributed to the numbers used to transform the validation fold.", "explanation": "Each training fold saw summary statistics computed partly from its own validation fold, so the validation data is no longer untouched and the CV estimate drifts upward. The fix is to fit the scaler inside the CV loop, e.g. via a Pipeline, so each fold's statistics come only from its training portion. The leak is mild for plain scaling but severe for target encoding, imputation or feature selection done up front.", "whyWrong": ["Labels are not needed for a leak: any information crossing the split counts.", "The dominant effect is bias, not variance: scores move up, they do not merely wobble.", "The leak is about which rows produced the statistics, not about their distributional shape."]}, "he": {"q": "תקננתם את הפיצ'רים לפי הממוצע וסטיית התקן של כל מערך הנתונים, ורק אז הרצתם 5-fold CV. מה התוצאה?", "options": ["כלום, כי סקיילינג הוא טרנספורמציה דטרמיניסטית שאינה נוגעת בתוויות", "הקפלים נעשים מתואמים, מה שבעיקר מנפח את השונות של האומד", "סטטיסטיקות של קפל הוולידציה דלפו לאימון, ולכן ציון ה-CV מוטה כלפי מעלה", "זה משנה רק כשהפיצ'רים אינם גאוסיאניים בקירוב"], "hint": "שאלו אילו שורות תרמו למספרים ששימשו לטרנספורמציה של קפל הוולידציה.", "explanation": "כל קפל אימון ראה סטטיסטיקות שחושבו בין השאר מקפל הוולידציה שלו עצמו, ולכן נתוני הוולידציה אינם נקיים יותר ואומד ה-CV נסחף כלפי מעלה. הפתרון הוא להתאים את הסקיילר בתוך לולאת ה-CV, למשל באמצעות Pipeline, כך שכל קפל משתמש רק בסטטיסטיקות של חלק האימון שלו. הדליפה קלה יחסית בסקיילינג פשוט, אבל חמורה מאוד ב-target encoding, בהשלמת ערכים חסרים או בבחירת פיצ'רים שנעשים מראש.", "whyWrong": ["אין צורך בתוויות כדי שתהיה דליפה: כל מידע שחוצה את הפיצול נחשב.", "האפקט העיקרי הוא הטיה ולא שונות: הציונים עולים, לא רק מתנודדים.", "הדליפה נוגעת לשאלה אילו שורות ייצרו את הסטטיסטיקות, ולא לצורת ההתפלגות שלהן."]}}, {"id": "evl-007", "area": "evaluation", "topic": "pr-auc-vs-roc-auc", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["pr-auc", "roc-auc", "imbalance"], "en": {"q": "Your positive class is 0.5% of the data. Explain how ROC-AUC can look excellent while the model is useless in production, and what you would report instead.", "hint": "Look at what happens to the false-positive rate when the negative class is enormous.", "modelAnswer": "The ROC curve plots TPR against FPR, and FPR divides by the number of negatives. With 199 negatives per positive, thousands of false positives still move FPR only slightly, so the curve hugs the top-left corner and AUC stays high even when nearly every alert is wrong. Precision instead divides by the number of predicted positives, so PR-AUC (average precision) collapses as soon as false positives dominate, and its no-skill baseline is the prevalence, 0.005, rather than 0.5. I would report average precision together with precision and recall at the threshold the business will actually run at, for example precision@k for the number of cases a reviewer can handle per day, and add a cost-weighted number if the two error types have different prices.", "rubric": ["Explains that FPR has a huge denominator under imbalance so it stays small", "States that precision divides by predicted positives and so is sensitive to false positives", "Notes the PR baseline equals the positive prevalence while the ROC baseline is 0.5", "Recommends PR-AUC / average precision or precision-recall at a concrete operating point", "Mentions tying the threshold to a business capacity or an explicit cost"]}, "he": {"q": "המחלקה החיובית שלכם היא 0.5% מהנתונים. הסבירו כיצד ROC-AUC יכול להיראות מצוין בעוד המודל חסר ערך בייצור, ומה הייתם מדווחים במקום.", "hint": "בדקו מה קורה ל-false positive rate כשהמחלקה השלילית ענקית.", "modelAnswer": "עקומת ROC משרטטת TPR מול FPR, ו-FPR מחלק במספר השליליים. עם 199 שליליים לכל חיובי, גם אלפי false positives מזיזים את ה-FPR רק במעט, ולכן העקומה נצמדת לפינה השמאלית-עליונה וה-AUC נשאר גבוה גם כשכמעט כל התראה שגויה. לעומת זאת precision מחלק במספר החיזויים החיוביים, ולכן PR-AUC (average precision) קורס ברגע שה-false positives משתלטים, וקו הבסיס חסר-המיומנות שלו הוא שכיחות המחלקה החיובית, 0.005, ולא 0.5. הייתי מדווח average precision יחד עם precision ו-recall בסף שבו המערכת באמת תרוץ, למשל precision@k לפי מספר המקרים שבודק אנושי מספיק ביום, ומוסיף מדד משוקלל-עלות אם לשתי הטעויות מחירים שונים.", "rubric": ["מסביר של-FPR יש מכנה עצום תחת חוסר איזון ולכן הוא נשאר קטן", "מציין ש-precision מחלק בחיזויים החיוביים ולכן רגיש ל-false positives", "מציין שקו הבסיס של PR שווה לשכיחות החיובית בעוד קו הבסיס של ROC הוא 0.5", "ממליץ על PR-AUC / average precision או על precision-recall בנקודת עבודה קונקרטית", "מזכיר קשירת הסף לקיבולת עסקית או לעלות מפורשת"]}}, {"id": "evl-008", "area": "evaluation", "topic": "group-cross-validation", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["cross-validation", "group-kfold", "leakage"], "answer": 3, "en": {"q": "Your dataset has 200 patients with 5 to 30 X-rays each, and the label is a per-patient diagnosis. Which CV scheme is right?", "options": ["Stratified k-fold on the label, shuffling all images", "Plain k-fold over images with a fixed random seed", "Leave-one-image-out CV, to use the most data", "Group k-fold with the patient as the group"], "hint": "Ask which rows are not independent of each other, and make sure they never straddle a split.", "explanation": "The unit of independence is the patient, not the image: if two X-rays of one patient land on opposite sides of a split, the model can recognize the patient instead of the disease and the score inflates. Group k-fold keeps every patient entirely inside one fold, and stratified group k-fold additionally balances the labels. The same reasoning applies to grouping by user, session or document.", "whyWrong": ["Stratification fixes the label balance but still lets one patient's images straddle the split.", "A fixed seed makes the leak reproducible, not absent.", "That is the worst case: the patient's other 29 images are all in training."]}, "he": {"q": "במערך הנתונים שלכם 200 מטופלים, לכל אחד 5 עד 30 צילומי רנטגן, והתווית היא אבחנה ברמת המטופל. איזו סכמת CV נכונה?", "options": ["stratified k-fold לפי התווית, עם ערבוב כל הצילומים", "k-fold רגיל על הצילומים עם seed קבוע", "leave-one-image-out CV, כדי לנצל הכי הרבה נתונים", "group k-fold עם המטופל כקבוצה"], "hint": "שאלו אילו שורות אינן בלתי תלויות זו בזו, וודאו שהן לעולם אינן חוצות פיצול.", "explanation": "יחידת האי-תלות היא המטופל ולא הצילום: אם שני צילומים של אותו מטופל נופלים משני צידי הפיצול, המודל יכול לזהות את המטופל במקום את המחלה והציון מתנפח. group k-fold שומר כל מטופל בשלמותו בתוך קפל אחד, ו-stratified group k-fold גם מאזן את התוויות. אותה לוגיקה חלה על קיבוץ לפי משתמש, סשן או מסמך.", "whyWrong": ["ריבוד מתקן את איזון התוויות אך עדיין מאפשר לצילומים של מטופל אחד לחצות את הפיצול.", "seed קבוע הופך את הדליפה לשחזורית, לא לנעדרת.", "זהו המקרה הגרוע ביותר: 29 הצילומים האחרים של אותו מטופל נמצאים כולם באימון."]}}, {"id": "evl-009", "area": "evaluation", "topic": "calibration", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["calibration", "platt-scaling", "roc-auc"], "answer": 1, "en": {"q": "You apply Platt scaling, a monotone logistic fit, to a classifier's scores on a held-out set. What changes?", "options": ["ROC-AUC improves, but log loss stays exactly the same", "Log loss and Brier score can improve while ROC-AUC is unchanged", "Both ROC-AUC and log loss improve together", "Nothing changes at all, since the ranking is the same"], "hint": "Which of these metrics looks only at the order of the scores?", "explanation": "ROC-AUC depends only on the ordering of scores, and a strictly monotone map preserves that ordering, so AUC is invariant. Proper scoring rules like log loss and the Brier score depend on the actual probability values, so recalibration can improve them substantially. That is why a model can rank perfectly and still be badly calibrated, and why you should report a ranking metric and a calibration metric side by side.", "whyWrong": ["This is exactly backwards: monotone rescaling cannot change AUC but does change log loss.", "AUC cannot improve here, because the score ordering is untouched.", "The ranking is indeed unchanged, but the numbers fed into log loss are not."]}, "he": {"q": "הפעלתם Platt scaling, התאמה לוגיסטית מונוטונית, על ציוני מסווג בקבוצה מוחזקת. מה משתנה?", "options": ["ROC-AUC משתפר, אך log loss נשאר בדיוק אותו הדבר", "log loss ו-Brier score יכולים להשתפר בעוד ROC-AUC אינו משתנה", "גם ROC-AUC וגם log loss משתפרים יחד", "שום דבר אינו משתנה, כי הדירוג זהה"], "hint": "איזה מהמדדים האלה מסתכל רק על סדר הציונים?", "explanation": "ROC-AUC תלוי רק בסדר הציונים, והעתקה מונוטונית ממש שומרת על הסדר הזה, ולכן ה-AUC אינווריאנטי. כללי ניקוד נאותים (proper scoring rules) כמו log loss ו-Brier תלויים בערכי ההסתברות עצמם, ולכן כיול מחדש יכול לשפר אותם משמעותית. לכן מודל יכול לדרג מצוין ועדיין להיות מכויל גרוע, וכדאי לדווח מדד דירוג ומדד כיול זה לצד זה.", "whyWrong": ["זה בדיוק הפוך: שינוי סקאלה מונוטוני אינו יכול לשנות AUC אך כן משנה log loss.", "AUC אינו יכול להשתפר כאן, מפני שסדר הציונים אינו משתנה.", "הדירוג אכן אינו משתנה, אבל המספרים שנכנסים ל-log loss כן."]}}, {"id": "evl-010", "area": "evaluation", "topic": "regression-metrics", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["mape", "rmse", "regression"], "answer": 2, "en": {"q": "You forecast daily demand and on many days the true value is 0 or 1 unit. Which metric will behave pathologically?", "options": ["RMSE", "MAE", "MAPE", "R^2"], "hint": "One of these metrics has the true value sitting in a denominator.", "explanation": "MAPE divides each error by the true value, so it explodes as the target approaches zero and is undefined at exactly zero. It is also asymmetric: over-forecasting is penalized without bound while under-forecasting caps at 100%, which quietly biases models toward under-forecasting. With near-zero targets prefer MAE, RMSE, or a scaled error such as MASE.", "whyWrong": ["RMSE is perfectly well defined at zero; it merely weights large errors more heavily.", "MAE is well behaved at zero targets and is often the right choice here.", "R^2 can go negative for a bad model, but zero targets do not break its definition."]}, "he": {"q": "אתם חוזים ביקוש יומי, ובימים רבים הערך האמיתי הוא 0 או יחידה אחת. איזה מדד יתנהג באופן פתולוגי?", "options": ["RMSE", "MAE", "MAPE", "R^2"], "hint": "לאחד מהמדדים האלה יש את הערך האמיתי במכנה.", "explanation": "MAPE מחלק כל שגיאה בערך האמיתי, ולכן הוא מתפוצץ כשהיעד מתקרב לאפס ואינו מוגדר כלל באפס. הוא גם א-סימטרי: חיזוי יתר נענש ללא חסם בעוד חיזוי חסר חסום ב-100%, מה שמטה מודלים בשקט לכיוון חיזוי חסר. עם יעדים קרובים לאפס עדיף MAE, RMSE, או שגיאה מנורמלת כמו MASE.", "whyWrong": ["RMSE מוגדר היטב לחלוטין באפס; הוא רק נותן משקל רב יותר לשגיאות גדולות.", "MAE מתנהג היטב ביעדים אפסיים ולרוב זו הבחירה הנכונה כאן.", "R^2 יכול לצאת שלילי עבור מודל גרוע, אבל יעדים אפסיים אינם שוברים את הגדרתו."]}}, {"id": "evl-011", "area": "evaluation", "topic": "multiple-comparisons", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["model-selection", "validation", "overfitting"], "answer": 0, "en": {"q": "You evaluate 40 model variants on the same 1,000-row validation set and pick the best, at 91.2% versus a median of 88%. What is the most likely reading?", "options": ["Much of the 3.2-point gap is selection noise; confirm on a fresh test set", "The winner is significantly better, since 40 comparisons average the noise out", "The gap is real, because every variant saw exactly the same data", "Validation size stops mattering once you compare enough variants"], "hint": "Think about the expected maximum of 40 draws from the same noisy distribution.", "explanation": "Taking the maximum over 40 noisy estimates biases that maximum upward, so the winner's validation score is no longer an unbiased estimate of its true accuracy. With 1,000 rows the standard error of an accuracy near 0.9 is about 1 point, so a 3-point spread across 40 variants is roughly what pure noise produces. The remedy is an untouched test set, or nested CV with a correction for multiple comparisons.", "whyWrong": ["More comparisons increase the winner's optimistic bias; they do not average it away.", "Sharing one validation set is exactly what correlates the errors and creates the winner's curse.", "Validation size sets the standard error, so it matters more as you compare more variants."]}, "he": {"q": "בדקתם 40 וריאנטים של מודל על אותה קבוצת ולידציה בת 1,000 שורות ובחרתם את הטוב ביותר, 91.2% מול חציון של 88%. מהי הפרשנות הסבירה ביותר?", "options": ["חלק ניכר מהפער של 3.2 נקודות הוא רעש בחירה; אמתו על test set חדש", "המנצח טוב מובהקת, כי 40 השוואות ממצעות את הרעש", "הפער אמיתי, כי כל וריאנט ראה בדיוק את אותם נתונים", "גודל קבוצת הוולידציה מפסיק להיות רלוונטי כשמשווים מספיק וריאנטים"], "hint": "חשבו על התוחלת של המקסימום מתוך 40 הגרלות מאותה התפלגות רועשת.", "explanation": "לקיחת המקסימום מתוך 40 אומדים רועשים מטה את המקסימום כלפי מעלה, ולכן ציון הוולידציה של המנצח כבר אינו אומד חסר הטיה לדיוק האמיתי שלו. עם 1,000 שורות שגיאת התקן של דיוק סביב 0.9 היא כנקודה אחת, ולכן פער של 3 נקודות בין 40 וריאנטים הוא בערך מה שרעש טהור מייצר. התרופה היא test set שלא נגעו בו, או CV מקונן עם תיקון להשוואות מרובות.", "whyWrong": ["ריבוי השוואות מגדיל את ההטיה האופטימית של המנצח, ואינו ממצע אותה.", "השימוש בקבוצת ולידציה אחת הוא בדיוק מה שמתאם את השגיאות ויוצר את 'קללת המנצח'.", "גודל הוולידציה קובע את שגיאת התקן, ולכן הוא חשוב יותר ככל שמשווים יותר וריאנטים."]}}, {"id": "evl-012", "area": "evaluation", "topic": "significance-testing", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["significance", "model-comparison", "confidence-intervals"], "en": {"q": "Model B beats model A by 1.1 accuracy points on a 2,000-row test set. Describe how you would decide whether that difference is real.", "hint": "The two models were scored on the very same rows, so use that.", "modelAnswer": "Because both models are evaluated on identical examples, the comparison should be paired rather than treated as two independent samples: pairing removes the example-difficulty variance and is far more powerful. For accuracy I would build the 2x2 table of agreements and disagreements and run McNemar's test on the discordant pairs, or equivalently bootstrap the paired difference by resampling test rows and report a 95% percentile interval for B minus A. As a sanity check, the standard error of a single accuracy near 0.9 on 2,000 rows is about 0.7 points, so an unpaired 1.1-point gap is marginal and the paired analysis may go either way. I would also confirm the test set was used only once, since repeated peeking invalidates the p-value, and ask whether 1.1 points is practically meaningful before worrying about statistical significance.", "rubric": ["Recognizes the comparison is paired on the same test rows", "Names a concrete procedure: McNemar's test, paired bootstrap, or paired t-test over folds", "Reports a confidence interval on the difference, not only a p-value", "Notes that reusing the test set for many comparisons breaks the inference", "Distinguishes statistical significance from practical significance"]}, "he": {"q": "מודל B עוקף את מודל A ב-1.1 נקודות דיוק על test set בן 2,000 שורות. תארו כיצד הייתם קובעים אם ההבדל אמיתי.", "hint": "שני המודלים נוקדו על אותן שורות בדיוק, אז נצלו את זה.", "modelAnswer": "מכיוון ששני המודלים הוערכו על אותן דוגמאות בדיוק, ההשוואה צריכה להיות מזווגת ולא להיחשב כשתי דגימות בלתי תלויות: הזיווג מסלק את השונות שנובעת מקושי הדוגמאות והוא חזק סטטיסטית בהרבה. עבור דיוק הייתי בונה את טבלת ההסכמות והאי-הסכמות בגודל 2x2 ומריץ מבחן McNemar על הזוגות החולקים, או לחלופין מבצע bootstrap מזווג של ההפרש על ידי דגימה מחדש של שורות ה-test ומדווח רווח סמך של 95% ל-B פחות A. כבדיקת שפיות, שגיאת התקן של דיוק בודד סביב 0.9 על 2,000 שורות היא כ-0.7 נקודות, ולכן פער לא מזווג של 1.1 נקודות הוא גבולי והניתוח המזווג עשוי להכריע לכל כיוון. הייתי גם מוודא שה-test set שימש פעם אחת בלבד, שכן הצצות חוזרות מבטלות את תוקף ה-p-value, ושואל אם 1.1 נקודות בכלל משמעותיות מעשית לפני שדואגים למובהקות סטטיסטית.", "rubric": ["מזהה שההשוואה מזווגת על אותן שורות test", "נוקב בפרוצדורה קונקרטית: מבחן McNemar, bootstrap מזווג, או מבחן t מזווג על קפלים", "מדווח רווח סמך על ההפרש ולא רק p-value", "מציין ששימוש חוזר ב-test set להשוואות רבות שובר את ההסקה", "מבחין בין
