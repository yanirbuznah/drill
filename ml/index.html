cond moment", "aliases": ["second-moment"], "cs": false, "en": {"t": "Second moment", "d": "The expected value of a squared quantity; in Adam, the running estimate of squared gradients."}, "he": {"t": "Second moment", "d": "התוחלת של הגודל בריבוע; ב-Adam, האומדן הרץ של ריבועי הגרדיאנטים."}}, {"term": "self-supervised", "aliases": ["self supervised", "self-supervised learning", "SSL"], "cs": false, "en": {"t": "Self-supervised learning", "d": "A training paradigm that learns from raw, unannotated data; behind most large language and vision models since 2018."}, "he": {"t": "Self-supervised learning", "d": "פרדיגמת אימון שלומדת מנתונים גולמיים ולא מתויגים; עומדת בבסיס רוב מודלי השפה והראייה הגדולים מאז 2018."}}, {"term": "SentencePiece", "aliases": [], "cs": false, "en": {"t": "SentencePiece", "d": "Google's open-source subword tokenizer library (Kudo and Richardson, 2018), used by T5, LLaMA and many multilingual models."}, "he": {"t": "SentencePiece", "d": "ספריית טוקניזציה לתת-מילים בקוד פתוח של Google (Kudo ו-Richardson, 2018), בשימוש ב-T5, ב-LLaMA ובמודלים רב-לשוניים."}}, {"term": "seq2seq", "aliases": ["sequence-to-sequence", "sequence to sequence", "seq2seq attention"], "cs": false, "en": {"t": "seq2seq", "d": "Sequence-to-sequence: the encoder-decoder framework for mapping an input sequence to an output sequence (Sutskever et al., 2014)."}, "he": {"t": "seq2seq", "d": "sequence-to-sequence: מסגרת encoder-decoder למיפוי רצף קלט לרצף פלט (Sutskever ואחרים, 2014)."}}, {"term": "SFT", "aliases": ["supervised fine-tuning"], "cs": true, "en": {"t": "SFT", "d": "Supervised Fine-Tuning: the stage that adapts a pretrained LLM to follow instructions, run before preference-based alignment such as RLHF or DPO."}, "he": {"t": "SFT", "d": "Supervised Fine-Tuning: השלב שמתאים מודל שפה מאומן מראש לביצוע הוראות, לפני יישור מבוסס העדפות כמו RLHF או DPO."}}, {"term": "SGD", "aliases": ["stochastic gradient descent"], "cs": true, "en": {"t": "SGD", "d": "Stochastic Gradient Descent: the workhorse optimizer that updates parameters from gradients computed on small mini-batches."}, "he": {"t": "SGD", "d": "Stochastic Gradient Descent: האופטימייזר הבסיסי שמעדכן פרמטרים לפי גרדיאנטים המחושבים על מיני-באצ'ים קטנים."}}, {"term": "SHAP", "aliases": ["Shapley additive explanations"], "cs": true, "en": {"t": "SHAP", "d": "SHapley Additive exPlanations (Lundberg and Lee, 2017). Feature-attribution method for explaining individual model predictions."}, "he": {"t": "SHAP", "d": "SHapley Additive exPlanations (Lundberg ו-Lee, 2017): שיטת ייחוס תרומה לפיצ'רים להסבר תחזיות בודדות."}}, {"term": "shrinkage", "aliases": [], "cs": false, "en": {"t": "Shrinkage", "d": "Pulling estimates toward zero or a common mean; in boosting it is the learning-rate factor applied to each tree."}, "he": {"t": "Shrinkage", "d": "כיווץ אומדנים לכיוון אפס או לכיוון ממוצע משותף; ב-boosting זהו מקדם קצב הלמידה שמוחל על כל עץ."}}, {"term": "Siamese", "aliases": ["siamese network", "Siamese networks", "siamese contrastive"], "cs": false, "en": {"t": "Siamese network", "d": "Architecture with two identical weight-sharing branches, used for similarity and metric learning (Bromley et al., 1993)."}, "he": {"t": "Siamese network", "d": "ארכיטקטורה עם שני ענפים זהים החולקים משקלים, לשימוש בלמידת דמיון ומטריקה (Bromley ואחרים, 1993)."}}, {"term": "sigmoid", "aliases": ["logistic function"], "cs": false, "en": {"t": "Sigmoid", "d": "The logistic function 1/(1+e^-x), which squashes any real number into the open range (0,1)."}, "he": {"t": "Sigmoid", "d": "הפונקציה הלוגיסטית 1/(1+e^-x), שדוחסת כל מספר ממשי לתחום הפתוח (0,1)."}}, {"term": "skip-gram", "aliases": ["skip gram", "skipgram"], "cs": false, "en": {"t": "Skip-gram", "d": "word2vec training variant (Mikolov et al., 2013) that predicts surrounding context words from a centre word."}, "he": {"t": "Skip-gram", "d": "וריאנט אימון של word2vec (Mikolov ואחרים, 2013) שחוזה את מילות ההקשר מתוך מילת המרכז."}}, {"term": "sliding window attention", "aliases": ["sliding-window attention"], "cs": false, "en": {"t": "Sliding window attention", "d": "Attention restricted to a fixed-size local neighbourhood around each token; used in Longformer (2020) and Mistral."}, "he": {"t": "Sliding window attention", "d": "attention המוגבל לחלון מקומי בגודל קבוע סביב כל טוקן; בשימוש ב-Longformer (2020) וב-Mistral."}}, {"term": "SMOTE", "aliases": ["smote pitfalls"], "cs": false, "en": {"t": "SMOTE", "d": "Synthetic Minority Over-sampling Technique (Chawla et al., 2002). Generates synthetic minority-class examples for imbalanced datasets."}, "he": {"t": "SMOTE", "d": "Synthetic Minority Over-sampling Technique (Chawla ואחרים, 2002): יוצרת דוגמאות סינתטיות למחלקת המיעוט בנתונים לא מאוזנים."}}, {"term": "soft assignment", "aliases": ["soft assignments"], "cs": false, "en": {"t": "Soft assignment", "d": "Cluster membership expressed as probabilities over all clusters rather than one hard label, as in Gaussian mixture models."}, "he": {"t": "Soft assignment", "d": "שיוך לאשכולות כהתפלגות הסתברות על פני כל האשכולות במקום תווית קשיחה אחת, כמו במודלי תערובת גאוסיאנית."}}, {"term": "softmax", "aliases": [], "cs": false, "en": {"t": "Softmax", "d": "Function that turns a vector of real-valued scores into a probability distribution summing to one."}, "he": {"t": "Softmax", "d": "פונקציה שממירה וקטור של ציונים ממשיים להתפלגות הסתברות שסכומה אחד."}}, {"term": "softmax temperature", "aliases": ["temperature (sampling)", "sampling temperature"], "cs": false, "en": {"t": "Softmax temperature", "d": "Scaling parameter applied to logits before the softmax, controlling how peaked or flat the resulting distribution is."}, "he": {"t": "Softmax temperature", "d": "פרמטר קנה מידה המופעל על ה-logits לפני ה-softmax, ושולט בכמה ההתפלגות המתקבלת חדה או שטוחה."}}, {"term": "sparse attention", "aliases": [], "cs": false, "en": {"t": "Sparse attention", "d": "Family of efficient attention variants in which each token attends to a subset of positions in /* ============================ glossary matcher ============================ */
/* Terms are marked up at render time rather than stored in the bank, so one
   definition serves every question that drops the name. */
let _M = null;
function matcher(){
  if(_M) return _M;
  const forms = [];
  GLOSSARY.forEach((e,i) => {
    [e.term].concat(e.aliases||[]).forEach(sfc => { if(sfc) forms.push({s:sfc, i, cs:!!e.cs}); });
  });
  forms.sort((a,b) => b.s.length - a.s.length);   // longest wins: "truncated BPTT" over "BPTT"
  /* A surface form can carry several senses (MAE = mean absolute error, or masked
     autoencoder). Each sense may declare `areas`; the question's own area picks. */
  const exact = new Map(), lower = new Map();
  forms.forEach(f => {
    const map = f.cs ? exact : lower, k = f.cs ? f.s : f.s.toLowerCase();
    if(!map.has(k)) map.set(k, []);
    if(map.get(k).indexOf(f.i) < 0) map.get(k).push(f.i);
  });
  const esc2 = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const alt = forms.map(f => esc2(f.s)).join("|");
  _M = {
    re: new RegExp("(^|[^A-Za-z0-9_])(" + alt + ")(?![A-Za-z0-9_])", "gi"),
    exact, lower
  };
  return _M;
}
function pickSense(list){
  if(!list || !list.length) return -1;
  if(list.length === 1) return list[0];
  const scoped = list.filter(i => (GLOSSARY[i].areas || []).indexOf(annArea) >= 0);
  if(scoped.length) return scoped[0];
  const general = list.filter(i => !(GLOSSARY[i].areas || []).length);
  return general.length ? general[0] : list[0];
}
function lookup(word){
  const M = matcher();
  if(M.exact.has(word)) return pickSense(M.exact.get(word));
  return pickSense(M.lower.get(word.toLowerCase()));
}
/* One mark per term per screen: the stem claims it, so repeated mentions in the
   options stay clean. annReset() starts a new screen. */
let annSeen = null, annArea = null;
function annReset(area){ annSeen = new Set(); annArea = area || null; }
/* Renders one run of text: escapes HTML, sets $…$ maths in an LTR-isolated monospace
   span, and wraps known jargon in a tooltip trigger. Use everywhere text is rendered. */
const MATH_RE = /\$([^$\n]+)\$/g;
function annotateProse(text, cap, st){
  if(!S.settings.glossary) return esc(text);
  const M = matcher();
  const used = annSeen || (st.local || (st.local = new Set()));
  let out = "", last = 0, m;
  M.re.lastIndex = 0;
  while((m = M.re.exec(text)) !== null){
    if(m[0].length === 0){ M.re.lastIndex++; continue; }
    const word = m[2], start = m.index + m[1].length;
    const idx = lookup(word);
    if(idx < 0) continue;
    const key = GLOSSARY[idx].term.toLowerCase();
    if(used.has(key) || st.n >= cap) continue;
    used.add(key); st.n++;
    out += esc(text.slice(last, start));
    out += '<span class="term" role="button" tabindex="0" data-term="' + idx + '">' + esc(word) + '</span>';
    last = start + word.length;
  }
  return out + esc(text.slice(last));
}
function ann(text, cap){
  text = String(text == null ? "" : text);
  cap = cap || 6;
  const st = { n: 0 };
  if(text.indexOf("$") < 0) return annotateProse(text, cap, st);
  let out = "", last = 0, m;
  MATH_RE.lastIndex = 0;
  while((m = MATH_RE.exec(text)) !== null){
    if(m.index > last) out += annotateProse(text.slice(last, m.index), cap, st);
    out += '<span class="mth">' + esc(m[1]) + '</span>';
    last = MATH_RE.lastIndex;
  }
  return out + (last < text.length ? annotateProse(text.slice(last), cap, st) : "");
}

/* ============================ tooltip ============================ */
let tipEl = null, tipOwner = null;
function tip(){
  if(!tipEl){
    tipEl = document.createElement("div");
    tipEl.className = "tip";
    tipEl.setAttribute("role","tooltip");
    document.body.appendChild(tipEl);
  }
  return tipEl;
}
function hideTip(){
  if(tipEl) tipEl.classList.remove("show");
  if(tipOwner) tipOwner.classList.remove("on");
  tipOwner = null;
}
function showTip(el, idx){
  const e = GLOSSARY[idx];
  if(!e) return;
  const b = (e[S.lang] && e[S.lang].d) ? e[S.lang] : e.en;
  const n = tip();
  n.innerHTML = '<b>' + esc(b.t) + '</b><p>' + esc(b.d) + '</p>';
  n.classList.add("show");
  if(tipOwner && tipOwner !== el) tipOwner.classList.remove("on");
  tipOwner = el; el.classList.add("on");
  n.style.left = "0px"; n.style.top = "0px";
  /* Horizontally centred on the word, but vertically clear of the whole block it sits in,
     so the popover never covers the rest of the sentence it is explaining. */
  const block = el.closest(".qtext, .opt, .hintbox, .explain, .gitem, li, .q, .ansline") || el;
  const r = el.getBoundingClientRect(), br = block.getBoundingClientRect(), t = n.getBoundingClientRect();
  let left = r.left + r.width / 2 - t.width / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - t.width - 12));
  let top = br.bottom + 8;
  if(top + t.height > window.innerHeight - 12){
    const above = br.top - t.height - 8;
    top = above >= 12 ? above : Math.max(12, window.innerHeight - t.height - 12);
  }
  n.style.left = left + "px"; n.style.top = top + "px";
}

const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pad(n){ return n<10?"0"+n:""+n; }

/* ============================ pool & selection ============================ */
function pool(opts){
  opts = opts||{};
  const f = S.filters;
  return QUESTIONS.filter(q => {
    if(f.areas.length && !f.areas.includes(q.area)) return false;
    if(f.diffs.length && !f.diffs.includes(q.difficulty)) return false;
    if(f.hard.length && !f.hard.includes(q.hardnessSource)) return false;
    if(opts.autoOnly && q.type==="open") return false;   // only `open` needs a human
    if(f.types.length && !f.types.includes(q.type)) return false;
    return true;
  });
}
function weight(q){
  if(!S.settings.leitner) return 1;
  const r = S.stats.byId[q.id];
  if(!r || !r.seen) return 5;
  return [4,3,2,1.5,1][Math.min(r.box,4)];
}
function pick(list, n, avoidRecent){
  let cand = list.slice();
  if(avoidRecent && recent.length){
    const fresh = cand.filter(q => !recent.includes(q.id));
    if(fresh.length >= n) cand = fresh;
  }
  const out=[];
  const w = cand.map(weight);
  for(let k=0;k<n && cand.length;k++){
    let total=0; for(const x of w) total+=x;
    let r=Math.random()*total, idx=0;
    for(let i=0;i<cand.length;i++){ r-=w[i]; if(r<=0){ idx=i; break; } idx=i; }
    out.push(cand[idx]); cand.splice(idx,1); w.splice(idx,1);
  }
  return out;
}
function presentOptions(q){
  const order = q.en.options.map((_,i)=>i);
  return S.settings.shuffle ? shuffle(order) : order;
}
/* Options are stored as an order of ORIGINAL indices so a language switch
   re-reads the text in the new language without losing the chosen order. */
function optView(q, order){
  const b=L(q);
  return (order || q.en.options.map((_,i)=>i)).map(oi => ({
    text: b.options[oi],
    correct: oi === q.answer,
    why: oi === q.answer ? null : (b.whyWrong ? b.whyWrong[oi > q.answer ? oi-1 : oi] : null)
  }));
}
/* Cloze: forgiving comparison — case, surrounding space, curly quotes and a
   trailing full stop never decide whether a grammar answer is right. */
function normAns(x){
  return String(x == null ? "" : x).toLowerCase()
    .replace(/[\u2018\u2019\u02BC]/g, "'").replace(/[\u201C\u201D]/g, '"')
    .replace(/\s+/g, " ").replace(/[.,!?;:]+$/, "").trim();
}
function blankOk(q, i, typed){
  const list = (q.answers && q.answers[i]) || [];
  const t = normAns(typed);
  return !!t && list.some(x => normAns(x) === t);
}
function clozeDone(q, a){
  const n = (q.answers || []).length;
  for(let i = 0; i < n; i++){ if(!((a.typed || [])[i] || "").trim()) return false; }
  return n > 0;
}
function clozeCorrect(q, a){
  const n = (q.answers || []).length;
  for(let i = 0; i < n; i++){ if(!blankOk(q, i, (a.typed || [])[i])) return false; }
  return n > 0;
}
/* Renders the sentence with its blanks as inputs, or as the filled-in answer once checked. */
function clozeHtml(q, a, locked){
  const parts = String(q.sentence || "").split("___");
  let out = "";
  for(let i = 0; i < parts.length; i++){
    out += esc(parts[i]);     // the sentence under test stays pristine: no term marks in it
    if(i < parts.length - 1){
      const v = esc(((a.typed || [])[i]) || "");
      const cls = locked ? (blankOk(q, i, (a.typed || [])[i]) ? " good" : " bad") : "";
      const wide = Math.max(6, Math.min(16, (((q.answers[i] || [])[0]) || "").length + 3));
      out += '<input class="blank' + cls + '" data-blank="' + i + '" type="text" size="' + wide + '" value="' + v +
             '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"' +
             (locked ? " disabled" : ' placeholder="' + esc(t.typeHere) + '"') + '>';
    }
  }
  return out;
}
function clozeModel(q){
  const parts = String(q.sentence || "").split("___");
  let out = "";
  for(let i = 0; i < parts.length; i++){
    out += esc(parts[i]);
    if(i < parts.length - 1) out += "<u>" + esc(((q.answers[i] || [])[0]) || "") + "</u>";
  }
  return out;
}

function isCorrect(q, a){
  if(!a) return false;
  if(q.type === "cloze") return clozeCorrect(q, a);
  if(a.picked == null || !a.presented) return false;
  return a.presented[a.picked] === q.answer;
}
/* "answered" means something gradable was supplied, whatever the type. */
function answered(q, a){
  if(!a) return false;
  if(q.type === "cloze") return clozeDone(q, a);
  if(q.type === "open")  return !!(a.text || "").trim();
  return a.picked !== null;
}

/* ============================ scoring / stats ============================ */
function record(q, ok, hinted){
  const r = rec(q.id);
  r.seen++; r.last = Date.now();
  if(ok){ r.ok++; r.box = Math.min(4, r.box+1); S.stats.streak++; S.stats.best=Math.max(S.stats.best,S.stats.streak); }
  else { r.box = 0; S.stats.streak = 0; }
  if(hinted) r.hinted = (r.hinted||0)+1;
  saveStore();
}

function summary(){

  for(const id in S.stats.byId){ const r=S.stats.byId[id]; seen+=r.seen; ok+=r.ok; }

    const key=b.dataset.all;
    const full = key==="areas"?AREAS.slice() : key==="diffs"?[1,2,3,4] :
                 key==="hard"?["concept","distractors","computation","recall","trap"] : ["mcq","open"];
    const cur=S.filters[key];
    S.filters[key] = (key==="areas"||key==="hard") ? (cur.length?[]:full) : (cur.length===full.length?[full[0]]:full);
    saveStore(); renderHome();
  }));
}

/* ============================ RUN (practice + quiz) ============================ */
function startRun(mode, list){
  const autoOnly = (mode==="quiz" && !S.settings.includeOpenInQuiz);
  let items;
  if(list && list.length){ items = list.slice(); }
  else {
    const p = pool({autoOnly});
    if(!p.length){ view().innerHTML='<div class="empty">'+esc(t.emptyPool)+'</div>';
      setActions('<button class="btn primary" data-nav="home">'+esc(t.home)+'</button>'); wireNav(); return; }
    items = mode==="quiz" ? pick(p, Math.min(S.quizLen, p.length), true) : pick(p, p.length, true);
  }
  session = { mode, items, i:0, t0:Date.now(), answers:{}, done:false };
  renderRun();
}
function curQ(){ return session.items[session.i]; }
function ansFor(q){ return session.answers[q.id] || (session.answers[q.id]={ picked:null, text:"", typed:[], hinted:false, revealed:false, explained:false, self:null, presented:null }); }

function renderRun(){
  annReset(curQ().area);
  const q = curQ(), a = ansFor(q), b = L(q);
  if(!a.presented && q.type==="mcq") a.presented = presentOptions(q);
  const quiz = session.mode==="quiz";
  const showOpts = q.type==="mcq" && (a.revealed || !S.settings.qFirst);

  let head;
  if(quiz){
    const dots = session.items.map((it,i)=>'<i class="'+(i===session.i?"now":(answered(it, session.answers[it.id])?"done":""))+'"></i>').join("");
    head = '<div class="progress"><span class="cnt">'+(session.i+1)+' '+esc(t.quizOf)+' '+session.items.length+'</span><div class="qdots">'+dots+'</div></div>';
  } else {
    head = '<div class="progress"><div class="bar"><i style="width:'+Math.round((session.i)/session.items.length*100)+'%"></i></div><span class="cnt tnum">'+(session.i+1)+'/'+session.items.length+'</span></div>';
  }

  let body =
    '<div class="qmeta">'+meter(q.difficulty)+'<span>'+esc(t["d"+q.difficulty])+'</span><span class="dot"></span>'+
    '<span class="area">'+esc(AREA_LABEL[S.lang][q.area])+'</span><span class="dot"></span><span>'+esc(t["h_"+q.hardnessSource])+'</span>'+
    (q.type==="open"?'<span class="dot"></span><span>'+esc(t.open)+'</span>':'')+'</div>'+
    '<div class="card qcard"><p class="qtext">'+ann(b.q,5)+'</p>'+
    (a.hinted?'<div class="hintbox"><b>'+esc(t.hint)+'</b>'+ann(b.hint,3)+'</div>':'');

  if(q.type==="mcq"){
    if(showOpts){
      body += '<div class="opts'+(a.picked===null?' reveal-anim':'')+'">'+ optView(q,a.presented).map((o,i)=>{
        let cls="opt", why="";
        if(a.picked!==null && !quiz){
          if(o.correct) cls+=" correct";
          else if(i===a.picked) cls+=" wrong";
          else cls+=" dim";
          if(i===a.picked) cls+=" picked";
          if(a.explained && !o.correct && o.why) why='<span class="why">'+ann(o.why,3)+'</span>';
        } else if(a.picked===i){ cls+=" picked"; }
        if(a.picked!==null && !quiz) cls+=" locked";
        return '<div class="'+cls+'" role="button" tabindex="0" data-opt="'+i+'">'+
          '<span class="k">'+String.fromCharCode(65+i)+'</span><span>'+ann(o.text,3)+why+'</span></div>';
      }).join("")+'</div>';
    }
    if(a.picked!==null && !quiz){
      const ok = isCorrect(q,a);
      body += '<div class="verdict '+(ok?"ok":"no")+'"><span class="g">'+(ok?"✓":"✗")+'</span>'+esc(ok?t.correct:t.incorrect)+(a.hinted?' · <span class="mono" style="font-size:12px">'+esc(t.hinted)+'</span>':'')+'</div>';
      if(a.explained) body += '<div class="explain"><p class="eyebrow">'+esc(t.explanation)+'</p><p>'+ann(b.explanation,8)+'</p></div>';
    }
  } else if(q.type==="cloze"){
    const locked = a.picked!==null && !quiz;
    body += '<p class="sent" style="margin-top:4px">'+clozeHtml(q,a,locked)+'</p>';
    if(locked){
      const ok = clozeCorrect(q,a);
      body += '<div class="verdict '+(ok?"ok":"no")+'"><span class="g">'+(ok?"\u2713":"\u2717")+'</span>'+
        esc(ok?t.correct:t.incorrect)+(a.hinted?' \u00b7 <span class="mono" style="font-size:12px">'+esc(t.hinted)+'</span>':'')+'</div>';
      if(!ok){
        body += '<div class="fix"><b>'+esc(t.modelForm)+'</b><span class="full">'+clozeModel(q)+'</span></div>';
        const alts=[];
        (q.answers||[]).forEach(list => (list||[]).slice(1).forEach(x => alts.push(x)));
        if(alts.length) body += '<p class="alt">'+esc(t.alsoAccepted)+': '+
          alts.map(x=>'<code>'+esc(x)+'</code>').join(" ")+'</p>';
      }
      if(a.explained) body += '<div class="explain"><p class="eyebrow">'+esc(t.explanation)+'</p><p>'+ann(b.explanation,8)+'</p></div>';
    }
  } else {
    body += '<div style="margin-top:14px">'+
      (a.revealed?'':'<p class="eyebrow">'+esc(t.writeAnswer)+'</p>')+
      '<textarea class="answer" id="openAns" '+(a.revealed?"readonly":"")+' placeholder="…">'+esc(a.text)+'</textarea></div>';
    if(a.revealed && !quiz){
      body += '<div class="explain"><p class="eyebrow">'+esc(t.modelAnswer)+'</p><p>'+ann(b.modelAnswer,8)+'</p></div>'+
        '<div style="margin-top:14px"><p class="eyebrow">'+esc(t.rubric)+'</p><ul class="rubric">'+
        b.rubric.map((r,i)=>'<li><input type="checkbox" id="rb'+i+'" data-rb="'+i+'"'+((a.checked||[]).includes(i)?" checked":"")+'><label for="rb'+i+'">'+ann(r,3)+'</label></li>').join("")+
        '</ul><div class="selfscore"><b class="tnum" id="rbScore">'+Math.round(((a.checked||[]).length/b.rubric.length)*100)+'%</b><span>'+esc(t.covered)+'</span>'+
        '<span style="margin-inline-start:auto"></span></div>'+
        (aiReady()?'<button class="btn sm" id="aiBtn" style="margin-top:12px">'+esc(t.gradeAI)+'</button><div id="aiOut"></div>':
                   '<p class="note">'+esc(t.aiNoKey)+'</p>')+
        '</div>';
    }
  }
  body += '</div>';
  view().innerHTML = head + body;

  /* actions */
  const acts=[];
  if(q.type==="mcq"){
    if(!showOpts){
      if(!a.hinted) acts.push('<button class="btn" data-act="hint">'+esc(t.hint)+'</button>');
      acts.push('<button class="btn primary" data-act="reveal">'+esc(t.showAnswers)+'</button>');
    } else if(a.picked===null){
      if(!a.hinted) acts.push('<button class="btn" data-act="hint">'+esc(t.hint)+'</button>');
      acts.push('<button class="btn ghost wide" data-act="next">'+esc(t.skip)+'</button>');
    } else {
      if(!quiz && !a.explained) acts.push('<button class="btn" data-act="explain">'+esc(t.explain)+'</button>');
      acts.push('<button class="btn primary" data-act="next">'+esc(session.i===session.items.length-1&&quiz?t.finish:t.next)+'</button>');
    }
  } else if(q.type==="cloze"){
    if(a.picked===null || quiz){
      if(!a.hinted) acts.push('<button class="btn" data-act="hint">'+esc(t.hint)+'</button>');
      acts.push(quiz
        ? '<button class="btn primary" data-act="next">'+esc(session.i===session.items.length-1?t.finish:t.next)+'</button>'
        : '<button class="btn primary" data-act="check">'+esc(t.check)+'</button>');
    } else {
      if(!a.explained) acts.push('<button class="btn" data-act="explain">'+esc(t.explain)+'</button>');
      acts.push('<button class="btn primary" data-act="next">'+esc(t.next)+'</button>');
    }
  } else {
    if(!a.revealed){
      if(!a.hinted) acts.push('<button class="btn" data-act="hint">'+esc(t.hint)+'</button>');
      acts.push(quiz ? '<button class="btn primary" data-act="next">'+esc(session.i===session.items.length-1?t.finish:t.next)+'</button>'
                     : '<button class="btn primary" data-act="revealOpen">'+esc(t.reveal)+'</button>');
    } else {
      acts.push('<button class="btn sm" data-self="1">'+esc(t.gotIt)+'</button>');
      acts.push('<button class="btn sm" data-self="0.5">'+esc(t.partly)+'</button>');
      acts.push('<button class="btn sm" data-self="0">'+esc(t.missed)+'</button>');
      acts.push('<button class="btn primary" data-act="next">'+esc(t.next)+'</button>');
    }
  }
  if(!quiz) acts.unshift('<button class="btn ghost sm" data-nav="home">✕</button>');
  else acts.unshift('<button class="btn ghost sm" data-act="abort">✕</button>');
  setActions(acts.join(""));
  wireRun();
}

function wireRun(){
  const q=curQ(), a=ansFor(q), b=L(q);
  view().querySelectorAll("[data-opt]").forEach(btn => {
   btn.addEventListener("keydown", ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); btn.click(); } });
   btn.addEventListener("click", ()=>{
    if(a.picked!==null && session.mode!=="quiz") return;
    a.picked = +btn.dataset.opt;
    if(session.mode!=="quiz"){ record(q, isCorrect(q,a), a.hinted); recent.push(q.id); }
    renderRun();
   });
  });
  view().querySelectorAll("[data-blank]").forEach(inp => {
    inp.addEventListener("input", () => {
      a.typed = a.typed || [];
      a.typed[+inp.dataset.blank] = inp.value;
    });
    inp.addEventListener("keydown", ev => {
      if(ev.key !== "Enter") return;
      ev.preventDefault();
      const all = Array.from(view().querySelectorAll("[data-blank]"));
      const nxt = all[all.indexOf(inp) + 1];
      if(nxt){ nxt.focus(); return; }
      const go = document.querySelector('[data-act="check"],[data-act="next"]');
      if(go) go.click();
    });
  });
  const firstBlank = view().querySelector("[data-blank]:not([disabled])");
  if(firstBlank && !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) firstBlank.focus();

  const ta=document.getElementById("openAns");
  if(ta) ta.addEventListener("input", ()=>{ a.text=ta.value; });
  view().querySelectorAll("[data-rb]").forEach(cb => cb.addEventListener("change", ()=>{
    a.checked = Array.from(view().querySelectorAll("[data-rb]")).filter(x=>x.checked).map(x=>+x.dataset.rb);
    const sc=document.getElementById("rbScore"); if(sc) sc.textContent=Math.round(a.checked.length/b.rubric.length*100)+"%";
  }));
  const ai=document.getElementById("aiBtn");
  if(ai) ai.addEventListener("click", ()=> runAI(q,a,ai));
  document.querySelectorAll("[data-self]").forEach(btn => btn.addEventListener("click", ()=>{
    a.self = +btn.dataset.self;
    record(q, a.self>=0.5, a.hinted); recent.push(q.id);
    nextQ();
  }));
  document.querySelectorAll("[data-act]").forEach(btn => btn.addEventListener("click", ()=>{
    const act=btn.dataset.act;
    if(act==="check"){
      if(!clozeDone(q,a)){
        const miss=view().querySelector("[data-blank]");
        if(miss){ miss.focus(); miss.placeholder=t.blankEmpty; }
        return;
      }
      a.picked=0;                       // marks the item as answered
      record(q, clozeCorrect(q,a), a.hinted); recent.push(q.id);
      renderRun();
    }
    else if(act==="hint"){ a.hinted=true; renderRun(); }
    else if(act==="reveal"){ a.revealed=true; renderRun(); }
    else if(act==="revealOpen"){ const el2=document.getElementById("openAns"); if(el2) a.text=el2.value; a.revealed=true; renderRun(); }
    else if(act==="explain"){ a.explained=true; renderRun(); }
    else if(act==="next"){ const el2=document.getElementById("openAns"); if(el2) a.text=el2.value; nextQ(); }
    else if(act==="abort"){ if(confirm(t.leaveQuiz)) renderHome(); }
  }));
  wireNav();
}
function nextQ(){
  if(session.i >= session.items.length-1){
    if(session.mode==="quiz"){ finishQuiz(); return; }
    const p = pool(); const more = pick(p, Math.min(20,p.length), true);
    session.items = session.items.concat(more.filter(x=>!session.items.some(y=>y.id===x.id)));
    if(session.i >= session.items.length-1){ renderHome(); return; }
  }
  session.i++; renderRun();
}

/* ============================ QUIZ RESULTS ============================ */
function finishQuiz(){
  session.done=true; session.t1=Date.now();
  for(const q of session.items){
    const a=session.answers[q.id]; if(!a) continue;
    recent.push(q.id);
    if((q.type==="mcq" || q.type==="cloze") && answered(q,a)) record(q, isCorrect(q,a), a.hinted);
  }
  renderResults();
}
function quizScore(){
  let got=0, total=0, pending=0;
  for(const q of session.items){
    const a=session.answers[q.id]||{};
    total++;
    if(q.type==="mcq" || q.type==="cloze"){ if(isCorrect(q,a)) got++; }
    else { if(a.self==null) pending++; else got+=a.self; }
  }
  return {got, total, pending, pct: total? Math.round(got/total*100):0};
}
function renderResults(){
  const sc=quizScore();
  const verdict = sc.pct>=95?t.perfect : sc.pct>=75?t.good : sc.pct>=50?t.ok : t.poor;
  let html = '<div class="card scorehero"><div class="big tnum">'+ (Math.round(sc.got*10)/10) +'<span style="font-size:26px;color:var(--faint)">/'+sc.total+'</span></div>'+
    '<div class="sub">'+sc.pct+'% · '+fmtTime(session.t1-session.t0)+'</div>'+
    '<p style="margin:14px 0 0;font-size:15px;color:var(--muted)">'+esc(verdict)+'</p></div>';

  const byD={}; for(const q of session.items){ const a=session.answers[q.id]||{};
    const d=q.difficulty; byD[d]=byD[d]||{n:0,ok:0}; byD[d].n++;
    if(q.type==="open"? a.self>=0.5 : isCorrect(q,a)) byD[d].ok++; }
  html += '<div class="section" style="margin-top:22px"><p class="eyebrow">'+esc(t.byDifficulty)+'</p><div class="barlist">'+
    Object.keys(byD).sort().map(d=>{ const o=byD[d]; const p=Math.round(o.ok/o.n*100);
      return '<div class="barrow"><span>'+meter(d)+' '+esc(t["d"+d])+'</span><div class="track"><i style="width:'+p+'%;background:var(--d'+d+')"></i></div><span class="pct">'+o.ok+'/'+o.n+'</span></div>';
    }).join("")+'</div></div>';

  html += '<div class="section"><p class="eyebrow">'+esc(t.review)+'</p><div id="reviewList">'+session.items.map((q,i)=>reviewItem(q,i)).join("")+'</div></div>';
  view().innerHTML = html;
  wireReview();
  const wrong = session.items.filter(q=>{ const a=session.answers[q.id]||{};
    return q.type==="open" ? !(a.self>=0.5) : !isCorrect(q,a); });
  setActions('<button class="btn" data-nav="home">'+esc(t.home)+'</button>'+
    (wrong.length?'<button class="btn wide" id="retryWrong">'+esc(t.retryWrong)+' ('+wrong.length+')</button>':'')+
    '<button class="btn primary" id="againBtn">'+esc(t.again)+'</button>');
  const ag=document.getElementById("againBtn"); if(ag) ag.addEventListener("click", ()=>startRun("quiz"));
  const rw=document.getElementById("retryWrong"); if(rw) rw.addEventListener("click", ()=>startRun("practice", wrong));
  wireNav();
}
function reviewItem(q,i){
  annReset(q.area);
  const a=session.answers[q.id]||{}, b=L(q);
  let inner = '<div class="qmeta">'+meter(q.difficulty)+'<span>'+esc(t.q)+' '+(i+1)+'</span><span class="dot"></span><span class="area">'+esc(AREA_LABEL[S.lang][q.area])+'</span></div>'+
    '<p class="q">'+ann(b.q,5)+'</p>';
  if(q.type==="cloze"){
    const ok = isCorrect(q,a);
    inner += '<p class="sent" style="font-size:15.5px;margin:0 0 10px">'+clozeHtml(q,a,true)+'</p>';
    if(!ok) inner += '<div class="ansline ok"><span class="lab">'+esc(t.modelForm)+'</span>'+
      '<span class="txt" style="direction:ltr;unicode-bidi:isolate">'+clozeModel(q)+'</span></div>';
    inner += '<details style="margin-top:10px"><summary class="eyebrow" style="cursor:pointer">'+esc(t.explanation)+'</summary>'+
      '<p style="font-size:14px;color:var(--muted);line-height:1.6;margin:8px 0 0">'+ann(b.explanation,8)+'</p></details>';
  } else if(q.type==="mcq"){
    const ok = isCorrect(q,a);
    const ov = optView(q, a.presented);
    const correctTxt = ov.find(o=>o.correct).text;
    inner += '<div class="ansline '+(ok?"ok":"no")+'"><span class="lab">'+esc(t.yourAnswer)+'</span><span class="txt">'+
      (a.picked===null? esc(t.unanswered) : (ok?"✓ ":"✗ ")+ann(ov[a.picked].text,3))+'</span></div>';
    if(!ok) inner += '<div class="ansline ok" style="margin-top:5px"><span class="lab">'+esc(t.correctAnswer)+'</span><span class="txt">'+ann(correctTxt,3)+'</span></div>';
    inner += '<details style="margin-top:10px"><summary class="eyebrow" style="cursor:pointer">'+esc(t.explanation)+'</summary>'+
      '<p style="font-size:14px;color:var(--muted);line-height:1.6;margin:8px 0 0">'+ann(b.explanation,8)+'</p></details>';
  } else {
    inner += '<div class="ansline"><span class="lab">'+esc(t.yourAnswer)+'</span><span class="txt">'+esc(a.text||t.unanswered)+'</span></div>'+
      '<details style="margin-top:10px" open><summary class="eyebrow" style="cursor:pointer">'+esc(t.modelAnswer)+'</summary>'+
      '<p style="font-size:14px;color:var(--muted);line-height:1.6;margin:8px 0 10px">'+ann(b.modelAnswer,8)+'</p>'+
      '<ul class="rubric">'+b.rubric.map(r=>'<li><span style="color:var(--faint);font-family:var(--mono);font-size:12px">·</span>'+ann(r,3)+'</li>').join("")+'</ul>'+
      '<div class="row" style="margin-top:12px">'+
        [["1",t.gotIt],["0.5",t.partly],["0",t.missed]].map(([v,lb])=>
          '<button class="btn sm" data-rself="'+v+'" data-qid="'+q.id+'"'+(String(a.self)===v?' style="border-color:var(--accent);color:var(--accent)"':'')+'>'+esc(lb)+'</button>').join("")+
      '</div></details>';
  }
  return '<div class="reviewitem">'+inner+'</div>';
}
function wireReview(){
  view().querySelectorAll("[data-rself]").forEach(btn=>btn.addEventListener("click", ()=>{
    const q=session.items.find(x=>x.id===btn.dataset.qid);
    const a=session.answers[q.id]||(session.answers[q.id]={});
    a.self=+btn.dataset.rself; record(q, a.self>=0.5, a.hinted);
    renderResults();
  }));
}

/* ============================ STATS ============================ */
function renderStats(){
  const st=summary();
  if(!st.seen){
    view().innerHTML='<h1>'+esc(t.stats)+'</h1><div class="empty">'+esc(t.noStats)+'</div>';
    setActions('<button class="btn primary" data-nav="home">'+esc(t.home)+'</button>'); wireNav(); return;
  }
  const byA={}, byD={};
  for(const q of QUESTIONS){ const r=S.stats.byId[q.id]; if(!r||!r.seen) continue;
    (byA[q.area]=byA[q.area]||{n:0,ok:0}); byA[q.area].n+=r.seen; byA[q.area].ok+=r.ok;
    (byD[q.difficulty]=byD[q.difficulty]||{n:0,ok:0}); byD[q.difficulty].n+=r.seen; byD[q.difficulty].ok+=r.ok; }
  const wrong = QUESTIONS.filter(q=>{ const r=S.stats.byId[q.id]; return r && r.seen && r.box===0; });

  view().innerHTML='<h1>'+esc(t.stats)+'</h1>'+
   '<div class="statgrid" style="margin-bottom:22px">'+
     '<div class="stat"><b class="tnum">'+st.seen+'</b><span>'+esc(t.seen)+'</span></div>'+
     '<div class="stat"><b class="tnum">'+st.acc+'%</b><span>'+esc(t.accuracy)+'</span></div>'+
     '<div class="stat"><b class="tnum">'+S.stats.best+'</b><span>'+esc(t.streak)+'</span></div>'+
   '</div>'+
   '<div class="section"><p class="eyebrow">'+esc(t.byDifficulty)+'</p><div class="barlist">'+
     [1,2,3,4].filter(d=>byD[d]).map(d=>{const o=byD[d],p=Math.round(o.ok/o.n*100);
       return '<div class="barrow"><span>'+meter(d)+' '+esc(t["d"+d])+'</span><div class="track"><i style="width:'+p+'%;background:var(--d'+d+')"></i></div><span class="pct">'+p+'%</span></div>';}).join("")+
   '</div></div>'+
   '<div class="section"><p class="eyebrow">'+esc(t.byArea)+'</p><div class="barlist">'+
     AREAS.filter(a=>byA[a]).sort((x,y)=>byA[x].ok/byA[x].n-byA[y].ok/byA[y].n).map(a=>{const o=byA[a],p=Math.round(o.ok/o.n*100);
       return '<div class="barrow"><span>'+esc(AREA_LABEL[S.lang][a])+'</span><div class="track"><i style="width:'+p+'%"></i></div><span class="pct">'+p+'% <span style="color:var(--faint)">('+o.n+')</span></span></div>';}).join("")+
   '</div></div>';
  setActions('<button class="btn" data-nav="home">'+esc(t.home)+'</button>'+
    (wrong.length?'<button class="btn primary wide" id="drillWrong">'+esc(t.retryWrong)+' ('+wrong.length+')</button>':''));
  const dw=document.getElementById("drillWrong"); if(dw) dw.addEventListener("click", ()=>startRun("practice", shuffle(wrong.slice())));
  wireNav();
}

     sw("qFirst",t.setQFirst,t.setQFirstD)+
     sw("shuffle",t.setShuffle,t.setShuffleD)+
     sw("includeOpenInQuiz",t.setIncludeOpen,t.setIncludeOpenD)+
     sw("leitner",t.setLeitner,t.setLeitnerD)+
     sw("glossary",t.setGlossary,t.setGlossaryD)+
   '</div>'+
   '<div class="section"><button class="btn wide" id="glossBtn" style="width:100%">'+esc(t.glossary)+' · <span class="mono" style="font-size:12px;color:var(--faint)">'+GLOSSARY.length+'</span></button></div>'+
   '<div class="section"><p class="eyebrow">'+esc(t.aiGrader)+'</p>'+
     '<div class="card" style="padding:16px">'+
       '<div class="field"><label>'+esc(t.provider)+'</label><select id="provSel">'+
         ["none","gemini","openai","anthropic"].map(p=>'<option value="'+p+'"'+(s.provider===p?" selected":"")+'>'+(p==="none"?esc(t.none):p)+'</option>').join("")+
       '</select></div>'+
       (s.provider!=="none"?
         '<div class="field"><label>'+esc(t.apiKey)+'</label><input id="keyIn" type="password" value="'+esc(s.apiKey)+'" placeholder="sk-… / AIza…" autocomplete="off"><span style="font-size:11.5px;color:var(--faint)">'+esc(t.keyLocal)+'</span></div>'+
         '<div class="field"><label>'+esc(t.model)+'</label><input id="modelIn" value="'+esc(s.model||defaultModel(s.provider))+'"></div>' : '')+
       '<p class="note">'+esc(t.aiNote)+'</p>'+
     '</div>'+
   '</div>'+
   '<div class="section"><div class="card" style="padding:16px">'+
     '<div class="row"><span style="flex:1;font-size:14px">'+esc(t.progressData)+'</span>'+
     '<button class="btn sm" id="resetBtn" style="color:var(--bad);border-color:var(--bad-line)">'+esc(t.resetProgress)+'</button></div>'+
   '</div></div>';
  view().querySelectorAll("[data-set]").forEach(b=>b.addEventListener("click",()=>{
    S.settings[b.dataset.set]=!S.settings[b.dataset.set]; saveStore(); renderSettings(); }));
  const ps=document.getElementById("provSel");
  ps.addEventListener("change",()=>{ S.settings.provider=ps.value; S.settings.model=defaultModel(ps.value); saveStore(); renderSettings(); });
  const ki=document.getElementById("keyIn"); if(ki) ki.addEventListener("change",()=>{ S.settings.apiKey=ki.value.trim(); saveStore(); });
  const mi=document.getElementById("modelIn"); if(mi) mi.addEventListener("change",()=>{ S.settings.model=mi.value.trim(); saveStore(); });
  const gb=document.getElementById("glossBtn"); if(gb) gb.addEventListener("click", ()=>renderGlossary());
  document.getElementById("resetBtn").addEventListener("click",()=>{
    if(confirm(t.resetConfirm)){ S.stats={byId:{},streak:0,best:0}; saveStore(); renderSettings(); } });
  setActions('<button class="btn primary" data-nav="home">'+esc(t.home)+'</button>');
  wireNav();
}
/* ============================ GLOSSARY SCREEN ============================ */
let glossQuery = "";
function renderGlossary(){
  const q = glossQuery.trim().toLowerCase();
  /* Rank: name matches beat definition matches, so "rope" surfaces RoPE, not "proper scoring rule". */
  function rank(e){
    const b = (e[S.lang] && e[S.lang].d) ? e[S.lang] : e.en;
    const name = e.term.toLowerCase(), alias = (e.aliases||[]).join(" ").toLowerCase();
    if(name === q) return 0;
    if(name.startsWith(q)) return 1;
    if(alias.split(" ").some(w => w === q)) return 2;
    if(name.includes(q)) return 3;
    if(alias.includes(q)) return 4;
    if(b.t.toLowerCase().includes(q)) return 5;
    if(b.d.toLowerCase().includes(q)) return 6;
    return -1;
  }
  let list = GLOSSARY;
  if(q){
    list = GLOSSARY.map(e => ({e, r: rank(e)})).filter(x => x.r >= 0)
             .sort((x, y) => x.r - y.r || x.e.term.localeCompare(y.e.term)).map(x => x.e);
  }
  view().innerHTML =
    '<h1>' + esc(t.glossary) + '</h1>' +
    '<input class="gsearch" id="gq" type="search" placeholder="' + esc(t.glossarySearch) + '" value="' + esc(glossQuery) + '">' +
    '<p class="gcount">' + esc(t.glossaryCount.replace("n", list.length)) + '</p>' +
    (list.length ? '<div class="glist">' + list.map(e => {
        const b = (e[S.lang] && e[S.lang].d) ? e[S.lang] : e.en;
        return '<div class="gitem"><b>' + esc(b.t) + '</b><span>' + esc(b.d) + '</span></div>';
      }).join("") + '</div>'
    : '<div class="empty">' + esc(t.glossaryEmpty) + '</div>');
  const inp = document.getElementById("gq");
  inp.addEventListener("input", () => {
    glossQuery = inp.value;
    const pos = inp.selectionStart;
    renderGlossary();
    const ni = document.getElementById("gq");
    ni.focus(); try{ ni.setSelectionRange(pos, pos); }catch(e){}
  });
  setActions('<button class="btn wide" data-nav="settings">' + esc(t.settings) + '</button>' +
             '<button class="btn primary wide" data-nav="home">' + esc(t.home) + '</button>');
  wireNav();
}

function defaultModel(p){
  return p==="gemini"?"gemini-2.5-flash" : p==="openai"?"gpt-4o-mini" : p==="anthropic"?"claude-3-5-haiku-latest" : "";
}

/* ============================ AI GRADER (pluggable) ============================ */
function aiReady(){ const s=S.settings; return s.provider!=="none" && !!s.apiKey; }
const Grader = {
  prompt(q,userAnswer,lang){
    const b=q[lang]&&q[lang].q?q[lang]:q.en;
    return "You are grading a machine-learning practice answer. Reply with ONLY a JSON object, no prose, no code fence.\n"+
      "Schema: {\"score\": <integer 0-100>, \"covered\": [<0-based indices of rubric points the answer covers>], \"feedback\": \"<2-3 sentences, written in "+(lang==="he"?"Hebrew":"English")+", say what was missing>\"}\n\n"+
      "QUESTION: "+b.q+"\n\nRUBRIC POINTS:\n"+b.rubric.map((r,i)=>i+". "+r).join("\n")+
      "\n\nREFERENCE ANSWER: "+b.modelAnswer+"\n\nSTUDENT ANSWER: "+(userAnswer||"(empty)");
  },
  async grade(q,userAnswer,lang){
    const s=S.settings, text=this.prompt(q,userAnswer,lang);
    let url, opt;
    if(s.provider==="gemini"){
      url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(s.model||"gemini-2.5-flash")+":generateContent?key="+encodeURIComponent(s.apiKey);
      opt={method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text}]}],generationConfig:{temperature:0.2,responseMimeType:"application/json"}})};
    } else if(s.provider==="openai"){
      url="https://api.openai.com/v1/chat/completions";
      opt={method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.apiKey},
        body:JSON.stringify({model:s.model||"gpt-4o-mini",temperature:0.2,response_format:{type:"json_object"},messages:[{role:"user",content:text}]})};
    } else if(s.provider==="anthropic"){
      url="https://api.anthropic.com/v1/messages";
      opt={method:"POST",headers:{"Content-Type":"application/json","x-api-key":s.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:s.model||"claude-3-5-haiku-latest",max_tokens:600,messages:[{role:"user",content:text}]})};
    } else throw new Error("no provider");
    const res=await fetch(url,opt);
    if(!res.ok) throw new Error("HTTP "+res.status+" "+(await res.text()).slice(0,160));
    const j=await res.json();
    let raw = s.provider==="gemini" ? j.candidates[0].content.parts[0].text
            : s.provider==="openai" ? j.choices[0].message.content
            : j.content[0].text;
    raw = raw.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
    const m = raw.match(/\{[\s\S]*\}/); if(m) raw=m[0];
    return JSON.parse(raw);
  }
};
async function runAI(q,a,btn){
  const out=document.getElementById("aiOut"); const b=L(q);
  btn.disabled=true; btn.textContent=t.grading;
  try{
    const r = await Grader.grade(q, a.text, S.lang);
    a.ai=r;
    if(Array.isArray(r.covered)){
      a.checked=r.covered.filter(i=>i>=0&&i<b.rubric.length);
      view().querySelectorAll("[data-rb]").forEach(cb=>{ cb.checked=a.checked.includes(+cb.dataset.rb); });
      const sc=document.getElementById("rbScore"); if(sc) sc.textContent=Math.round(a.checked.length/b.rubric.length*100)+"%";
    }
    out.innerHTML='<div class="explain" style="margin-top:12px"><p class="eyebrow">'+esc(t.aiScore)+' · '+
      '<span class="tnum" style="color:var(--accent)">'+esc(r.score)+'%</span></p><p>'+esc(r.feedback||"")+'</p></div>';
  }catch(e){
    const blocked = /Failed to fetch|NetworkError|Load failed/i.test(String(e&&e.message));
    out.innerHTML='<p class="note" style="color:var(--bad)"><b>'+esc(t.aiError)+'</b><br>'+esc(blocked?t.aiBlocked:String(e&&e.message||e))+'</p>';
  }
  btn.disabled=false; btn.textContent=t.gradeAI;
}

/* ============================ boot ============================ */
document.getElementById("langBtn").addEventListener("click", ()=>{
  S.lang = S.lang==="en"?"he":"en"; t=T[S.lang]; saveStore(); applyChrome();
  if(session && !session.done) renderRun(); else if(session && session.done) renderResults(); else renderHome();
});
document.getElementById("themeBtn").addEventListener("click", ()=>{
  S.theme = S.theme==="auto"?"light":S.theme==="light"?"dark":"auto"; saveStore(); applyChrome();
});
document.getElementById("setBtn").addEventListener("click", ()=> renderSettings());
document.addEventListener("keydown", e=>{
  if(!session || session.done || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="textarea"||tag==="input") return;
  const q=curQ(), a=ansFor(q);
  if(/^[1-4]$/.test(e.key)){ const b=view().querySelector('[data-opt="'+(+e.key-1)+'"]'); if(b) b.click(); }
  else if(e.key===" "||e.key==="Enter"){ e.preventDefault();
    const p=document.querySelector('[data-act="reveal"],[data-act="revealOpen"],[data-act="next"]'); if(p) p.click(); }
  else if(e.key.toLowerCase()==="h"){ const p=document.querySelector('[data-act="hint"]'); if(p) p.click(); }
  else if(e.key.toLowerCase()==="e"){ const p=document.querySelector('[data-act="explain"]'); if(p) p.click(); }
});
/* ---- tooltip interaction: hover on pointer devices, tap everywhere ---- */
let hoverTimer = null;
document.addEventListener("click", e => {
  const el = e.target.closest ? e.target.closest("[data-term]") : null;
  if(el){
    e.preventDefault(); e.stopPropagation();
    if(tipOwner === el) hideTip(); else showTip(el, +el.dataset.term);
    return;
  }
  if(tipEl && !tipEl.contains(e.target)) hideTip();
}, true);
document.addEventListener("keydown", e => {
  if(e.key === "Escape") hideTip();
  const el = e.target && e.target.closest ? e.target.closest("[data-term]") : null;
  if(el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); showTip(el, +el.dataset.term); }
});
document.addEventListener("mouseover", e => {
  if(!window.matchMedia("(hover: hover)").matches) return;
  const el = e.target.closest ? e.target.closest("[data-term]") : null;
  clearTimeout(hoverTimer);
  if(el) hoverTimer = setTimeout(() => showTip(el, +el.dataset.term), 110);
});
document.addEventListener("mouseout", e => {
  if(!window.matchMedia("(hover: hover)").matches) return;
  const el = e.target.closest ? e.target.closest("[data-term]") : null;
  if(!el) return;
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => { if(tipEl && !tipEl.matches(":hover")) hideTip(); }, 180);
});
window.addEventListener("scroll", hideTip, {passive:true});
window.addEventListener("resize", hideTip);

applyChrome();
renderHome();
</script>
