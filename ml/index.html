an a metric"]}, "he": {"q": "סמנכ\"ל ללא רקע טכני שואל כיצד מודל ה-gradient boosting שלכם מחליט מי מקבל הנחת שימור. הסבירו ללא ז'רגון, ואמרו מה תציגו לו.", "hint": "הסבירו את צורת ההיגיון, ואז הציגו ראיות שאפשר להתווכח איתן.", "modelAnswer": "הייתי אומר שהמודל הוא ועדה גדולה של כללים פשוטים מאוד — כל אחד מהם שאלה כמו 'האם הלקוח הזה התחבר החודש?' — כשכל כלל חדש נוסף במיוחד כדי לתקן את הטעויות של הקודמים, והציון הסופי הוא ההצבעה המשוקללת שלהם. הוא לא מחליט דבר: הוא מדרג לקוחות לפי כמה הם נראים סבירים לעזוב, ואנחנו בוחרים את הסף לפי כמה הנחות אנחנו יכולים להרשות לעצמנו. אחר כך הייתי מציג שלושה דברים: קומץ הגורמים שמניעים את הציון בכללותו, שניים-שלושה לקוחות אמיתיים עם הסיבות הספציפיות לכך שהציון שלהם יצא גבוה, והביצועים של המודל על לקוחות מהרבעון שעבר שהוא מעולם לא ראה. הייתי מבהיר במפורש שהגורמים האלה הם דפוסים ולא סיבות — לקוח שפונה הרבה לתמיכה הוא סימן לסיכון, לא הוכחה שפניות לתמיכה גורמות לנטישה — והייתי מסכם איתו את הסף במונחים עסקיים, כתקציב וכמספר צפוי של לקוחות שיישמרו, ולא כהסתברות.", "rubric": ["משתמש באנלוגיה לא טכנית וקונקרטית ל-boosting: הרבה כללים קטנים שכל אחד מתקן שגיאות קודמות", "מבחין בין דירוג לבין החלטה, ומעביר את בחירת הסף לידי בעל העניין", "מציע להציג מניעים גלובליים לצד הסברים למקרים בודדים", "מסמן במפורש את ההבדל בין מתאם לסיבתיות ואת מגבלות המודל", "מעגן את הדיון בכמות עסקית (תקציב, מספר צפוי של שימורים) ולא במדד"]}}, {"id": "int-012", "area": "interview", "topic": "project-feasibility", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["feasibility", "scoping", "roi"], "en": {"q": "Before committing a quarter of engineering time to an ML project, how would you decide in one week whether it is feasible?", "hint": "Two questions: is the signal there, and is the lift worth anything?", "modelAnswer": "I would spend the week on three cheap tests. First, does the signal exist: can a knowledgeable human, or a simple heuristic, make the prediction from the same data a model would see? If a domain expert cannot beat chance on 50 sampled cases, a model probably cannot either. Second, does the data exist at the right time: I pull a real sample and check volume, label quality, and critically whether each feature would have been available at prediction time, since a large share of infeasible projects die on that alone. Third, is the lift worth money: I estimate what one point of improvement over the current heuristic is worth annually and compare it to the build and run cost, including serving and on-call. I would deliver a dumb baseline, a rough estimate of the headroom above it, and an explicit kill criterion agreed in advance, so that stopping becomes a planned outcome rather than a failure.", "rubric": ["Tests whether the signal exists at all (human or heuristic on the same inputs)", "Checks data volume, label quality and availability at prediction time (as-of / leakage)", "Builds a baseline and estimates the headroom above it rather than assuming it", "Converts expected lift into business value and compares it to build plus run cost", "Defines a kill criterion or decision point up front"]}, "he": {"q": "לפני שמתחייבים לרבעון של זמן פיתוח לפרויקט ML, כיצד הייתם מחליטים תוך שבוע אחד אם הוא ישים?", "hint": "שתי שאלות: האם האות בכלל קיים, והאם השיפור שווה משהו?", "modelAnswer": "הייתי מקדיש את השבוע לשלושה מבחנים זולים. ראשית, האם האות קיים: האם אדם בקיא בתחום, או היוריסטיקה פשוטה, יכולים לבצע את החיזוי מאותם נתונים שהמודל יראה? אם מומחה תחום לא מנצח ניחוש אקראי על 50 מקרים שנדגמו, כנראה שגם מודל לא ינצח. שנית, האם הנתונים קיימים בזמן הנכון: אני מושך מדגם אמיתי ובודק נפח, איכות תוויות, וקריטית — האם כל פיצ'ר היה זמין בזמן החיזוי, שכן חלק ניכר מהפרויקטים הלא ישימים מתים על זה לבדו. שלישית, האם השיפור שווה כסף: אני מעריך כמה שווה שנתית נקודת שיפור אחת מעל ההיוריסטיקה הקיימת ומשווה זאת לעלות הבנייה וההפעלה, כולל הגשה וכוננות. הייתי מספק בסיס פשוט, הערכה גסה של המרווח מעליו, וקריטריון עצירה מפורש שסוכם מראש, כך שעצירה תהיה תוצאה מתוכננת ולא כישלון.", "rubric": ["בודק האם האות בכלל קיים (אדם או היוריסטיקה על אותם קלטים)", "בודק נפח נתונים, איכות תוויות וזמינות בזמן החיזוי (as-of / דליפה)", "בונה בסיס ומעריך את המרווח מעליו במקום להניח אותו", "ממיר את השיפור הצפוי לערך עסקי ומשווה לעלות הבנייה וההפעלה", "מגדיר מראש קריטריון עצירה או נקודת החלטה"]}}, {"id": "int-013", "area": "interview", "topic": "tradeoff-decision", "difficulty": 4, "type": "open", "hardnessSource": "trap", "tags": ["interpretability", "regulation", "tradeoffs"], "en": {"q": "For a bank's loan-approval model, would you ship a logistic regression at 0.79 AUC or a gradient boosting ensemble at 0.83? Pick one and justify it.", "hint": "Ask what the model is legally required to be able to say to a rejected applicant.", "modelAnswer": "I would ship the logistic regression, and the reason is not statistical. Credit decisions require giving a declined applicant specific principal reasons, and the model has to be documented, validated and defensible to regulators and to internal model risk management; a linear model with monotone, sensible coefficients makes that a solved problem, while a 500-tree ensemble makes it a recurring argument. The 0.04 AUC gap sounds material but has to be converted into money — the change in approvals and expected losses at the actual operating threshold — and in many portfolios that is small next to the cost of a compliance finding or a model the risk committee refuses to approve. The honest middle path is a monotonically constrained gradient boosting model with reason codes, which recovers much of the gap while keeping the constraints, and I would build that next. I would also want fairness testing across protected groups and stability over time before ranking the two at all, since a model that is 0.04 better today and drifts faster is not actually better.", "rubric": ["Commits to one option instead of hedging between them", "Identifies the regulatory adverse-action explainability requirement as the decisive constraint", "Translates the AUC gap into business terms at the actual operating point", "Names a middle path (monotone-constrained boosting with reason codes) rather than a false binary", "Raises fairness testing and stability over time as prerequisites to the comparison"]}, "he": {"q": "עבור מודל אישור הלוואות בבנק, האם הייתם משחררים רגרסיה לוגיסטית עם AUC של 0.79 או אנסמבל gradient boosting עם 0.83? בחרו אחד ונמקו.", "hint": "שאלו מה המודל מחויב מבחינה רגולטורית להיות מסוגל לומר למבקש שנדחה.", "modelAnswer": "הייתי משחרר את הרגרסיה הלוגיסטית, והסיבה אינה סטטיסטית. החלטות אשראי מחייבות למסור למבקש שנדחה סיבות עיקריות ספציפיות, והמודל חייב להיות מתועד, מאומת ובר-הגנה מול הרגולטור ומול ניהול סיכוני המודלים הפנימי; מודל לינארי עם מקדמים מונוטוניים והגיוניים הופך זאת לבעיה פתורה, בעוד שאנסמבל של 500 עצים הופך זאת לוויכוח חוזר. פער של 0.04 ב-AUC נשמע מהותי אך חייב להיות מתורגם לכסף — השינוי במספר האישורים ובהפסדים הצפויים בסף התפעולי האמיתי — ובתיקים רבים זה קטן לעומת עלות של ממצא ציות או מודל שוועדת הסיכונים מסרבת לאשר. דרך הביניים הכנה היא מודל gradient boosting עם אילוצי מונוטוניות וקודי סיבה, שמחזיר חלק ניכר מהפער תוך שמירה על האילוצים, ואותו הייתי בונה בשלב הבא. הייתי גם רוצה בדיקות הוגנות על פני קבוצות מוגנות ויציבות לאורך זמן לפני שבכלל מדרגים את השניים, שכן מודל שטוב ב-0.04 היום ונסחף מהר יותר אינו באמת טוב יותר.", "rubric": ["מתחייב לאפשרות אחת במקום לגדר בין השתיים", "מזהה את דרישת ההסבר הרגולטורית למבקש שנדחה כאילוץ המכריע", "מתרגם את פער ה-AUC למונחים עסקיים בנקודת התפעול האמיתית", "מציע דרך ביניים (boosting עם אילוצי מונוטוניות וקודי סיבה) במקום בחירה בינארית מזויפת", "מעלה בדיקות הוגנות ויציבות לאורך זמן כתנאי מקדים להשוואה"]}}];
const GLOSSARY = [{"term": "1x1 convolution", "aliases": ["1x1 conv", "1×1 convolution", "1×1 conv", "one by one conv", "pointwise convolution", "1x1 convolutions"], "cs": false, "en": {"t": "1x1 convolution", "d": "A convolution with a single-pixel kernel, popularised by Network-in-Network (2013) and the Inception architectures."}, "he": {"t": "1x1 convolution", "d": "קונבולוציה עם גרעין בגודל פיקסל אחד, שהתפרסמה ב-Network-in-Network (2013) ובארכיטקטורות Inception."}}, {"term": "2-stage detector", "aliases": ["two-stage detector", "two-stage detectors", "2-stage detectors", "two stage detector"], "cs": false, "en": {"t": "2-stage detector", "d": "The R-CNN line of object detectors - R-CNN, Fast R-CNN, Faster R-CNN - the accuracy-oriented alternative to YOLO-style detectors."}, "he": {"t": "2-stage detector", "d": "משפחת גלאי האובייקטים של R-CNN — R-CNN, Fast R-CNN ו-Faster R-CNN — החלופה מוכוונת-הדיוק לגלאים בסגנון YOLO."}}, {"term": "active learning", "aliases": [], "cs": false, "en": {"t": "Active learning", "d": "A training paradigm where the model itself selects which unlabelled examples a human should label next."}, "he": {"t": "Active learning", "d": "פרדיגמת אימון שבה המודל עצמו בוחר אילו דוגמאות לא מתויגות כדאי לשלוח לתיוג אנושי."}}, {"term": "AdaBoost", "aliases": ["Adaptive Boosting"], "cs": false, "en": {"t": "AdaBoost", "d": "Adaptive Boosting (Freund and Schapire, 1995). A classic boosting ensemble built from many weak learners."}, "he": {"t": "AdaBoost", "d": "Adaptive Boosting (1995). שיטת boosting קלאסית שמשלבת סדרה של לומדים חלשים למודל אחד."}}, {"term": "Adam", "aliases": [], "cs": true, "en": {"t": "Adam", "d": "Adaptive Moment Estimation (2014). The default adaptive-learning-rate optimiser for deep networks."}, "he": {"t": "Adam", "d": "Adaptive Moment Estimation (2014). האופטימייזר הסטנדרטי לרשתות עמוקות, עם קצב למידה אדפטיבי."}}, {"term": "AdamW", "aliases": [], "cs": false, "en": {"t": "AdamW", "d": "A 2017 refinement of the Adam optimiser by area under the curve"], "cs": true, "en": {"t": "AUC", "d": "Area Under the Curve, usually of the ROC curve; a threshold-free summary score for binary classifiers."}, "he": {"t": "AUC", "d": "Area Under the Curve, בדרך כלל של עקומת ROC; ציון מסכם למסווג בינארי שאינו תלוי בסף."}}, {"term": "autodiff", "aliases": ["automatic differentiation", "auto-diff"], "cs": false, "en": {"t": "Autodiff", "d": "Automatic differentiation, the technique frameworks such as PyTorch and TensorFlow use to compute gradients of programs."}, "he": {"t": "Autodiff", "d": "Automatic differentiation, הטכניקה שבה PyTorch ו-TensorFlow מחשבים גרדיאנטים של תוכניות שרירותיות."}}, {"term": "backbone", "aliases": ["backbones"], "cs": false, "en": {"t": "Backbone", "d": "The pretrained feature-extraction network, such as ResNet or ViT, that a detection or segmentation head sits on."}, "he": {"t": "Backbone", "d": "רשת חילוץ המאפיינים המאומנת מראש, כמו ResNet או ViT, שמעליה בונים ראש detection או segmentation."}}, {"term": "bagging", "aliases": ["bootstrap aggregating"], "cs": false, "en": {"t": "Bagging", "d": "Bootstrap Aggregating (Breiman, 1996). An ensemble method training models on resampled datasets; Random Forest is the famous case."}, "he": {"t": "Bagging", "d": "Bootstrap Aggregating (1996). שיטת ensemble שמאמנת מודלים על מדגמים חוזרים; Random Forest הוא המקרה המפורסם."}}, {"term": "batch norm", "aliases": ["BatchNorm", "batch normalization", "batch normalisation", "BN"], "cs": false, "en": {"t": "Batch normalization", "d": "Batch Normalization (Ioffe and Szegedy, 2015). A normalisation layer placed between a linear or conv layer and its activation; standard in CNNs."}, "he": {"t": "Batch normalization", "d": "Batch Normalization (Ioffe ו-Szegedy, 2015). שכבת נרמול הממוקמת בין שכבה לינארית או קונבולוציונית לבין פונקציית ההפעלה; סטנדרט ב-CNN."}}, {"term": "Bayes' rule", "aliases": ["Bayes rule", "Bayes theorem", "Bayes' theorem", "Bayes's rule"], "cs": false, "en": {"t": "Bayes' rule", "d": "The formula relating the posterior to the likelihood and the prior; the foundation of Bayesian inference."}, "he": {"t": "Bayes' rule", "d": "הנוסחה שמקשרת בין posterior לבין likelihood ו-prior; הבסיס להסקה בייסיאנית."}}, {"term": "BCQ", "aliases": [], "cs": true, "en": {"t": "BCQ", "d": "Batch-Constrained deep Q-learning (2019). An offline reinforcement-learning algorithm for learning from a fixed dataset."}, "he": {"t": "BCQ", "d": "Batch-Constrained deep Q-learning (2019). אלגוריתם reinforcement learning אופליין שלומד מדאטהסט קבוע."}}, {"term": "beam search", "aliases": [], "cs": false, "en": {"t": "Beam search", "d": "A decoding strategy that keeps the k highest-scoring partial sequences at each step instead of only one."}, "he": {"t": "Beam search", "d": "אסטרטגיית decoding ששומרת בכל צעד את k הרצפים החלקיים בעלי הציון הגבוה ביותר, במקום אחד בלבד."}}, {"term": "BEAR", "aliases": [], "cs": true, "en": {"t": "BEAR", "d": "Bootstrapping Error Accumulation Reduction (2019). An offline reinforcement-learning algorithm that keeps the learned policy near the data."}, "he": {"t": "BEAR", "d": "Bootstrapping Error Accumulation Reduction (2019). אלגוריתם RL אופליין ששומר את המדיניות הנלמדת קרוב לדאטה."}}, {"term": "behaviour policy", "aliases": ["behavior policy", "behaviour-policy", "behavior-policy"], "cs": false, "en": {"t": "Behaviour policy", "d": "In reinforcement learning, the policy that actually generated the data, as opposed to the target policy being learned."}, "he": {"t": "Behaviour policy", "d": "ב-reinforcement learning, המדיניות שיצרה בפועל את הדאטה, בניגוד ל-target policy שאותה לומדים."}}, {"term": "Bellman equation", "aliases": ["Bellman", "Bellman backup", "Bellman optimality equation", "Bellman update"], "cs": false, "en": {"t": "Bellman equation", "d": "The recursive consistency condition relating a state's value to its successors' values; the basis of dynamic programming in RL."}, "he": {"t": "Bellman equation", "d": "תנאי העקביות הרקורסיבי שמקשר את ערך המצב לערכי המצבים העוקבים; הבסיס לתכנון דינמי ב-RL."}}, {"term": "BERT", "aliases": [], "cs": true, "en": {"t": "BERT", "d": "Bidirectional Encoder Representations from Transformers (Google, 2018). A pretrained encoder-only model for language understanding tasks."}, "he": {"t": "BERT", "d": "Bidirectional Encoder Representations from Transformers (Google, 2018). מודל encoder בלבד מאומן מראש למשימות הבנת שפה."}}, {"term": "bf16", "aliases": ["bfloat16", "brain float"], "cs": true, "en": {"t": "bf16", "d": "bfloat16, a 16-bit floating-point format from Google Brain, widely used when training and serving large models."}, "he": {"t": "bf16", "d": "bfloat16, פורמט נקודה צפה של 16 ביט מבית Google Brain, נפוץ באימון ובהרצה של מודלים גדולים."}}, {"term": "bias-variance tradeoff", "aliases": ["bias-variance", "bias variance", "bias-variance trade-off"], "cs": false, "en": {"t": "Bias-variance tradeoff", "d": "The classic decomposition of expected prediction error into bias, variance and irreducible noise."}, "he": {"t": "Bias-variance tradeoff", "d": "הפירוק הקלאסי של שגיאת החיזוי הצפויה ל-bias, ל-variance ולרעש שאינו ניתן לצמצום."}}, {"term": "BLEU", "aliases": [], "cs": true, "en": {"t": "BLEU", "d": "Bilingual Evaluation Understudy (IBM, 2002). The standard n-gram overlap metric for machine-translation quality."}, "he": {"t": "BLEU", "d": "Bilingual Evaluation Understudy (IBM, 2002). מדד חפיפת n-gram סטנדרטי לאיכות תרגום מכונה."}}, {"term": "blue-green deployment", "aliases": ["blue-green", "blue green deployment"], "cs": false, "en": {"t": "Blue-green deployment", "d": "A release strategy running two identical production environments and switching traffic from the old one to the new."}, "he": {"t": "Blue-green deployment", "d": "אסטרטגיית שחרור שמריצה שתי סביבות production זהות ומעבירה את התעבורה מהישנה לחדשה."}}, {"term": "boosting", "aliases": [], "cs": false, "en": {"t": "Boosting", "d": "An ensemble family that trains weak learners sequentially, each focused on term": "catastrophic forgetting", "aliases": ["catastrophic interference"], "cs": false, "en": {"t": "Catastrophic forgetting", "d": "McCloskey and Cohen, 1989. A network's loss of previously learned tasks once it is trained on new data."}, "he": {"t": "Catastrophic forgetting", "d": "McCloskey ו-Cohen, 1989 — אובדן משימות שנלמדו קודם, ברגע שהרשת מאומנת על נתונים חדשים."}}, {"term": "causal LM", "aliases": ["causal language model", "causal language modelling"], "cs": false, "en": {"t": "Causal LM", "d": "Causal language model: a decoder-only model trained to predict the next token, as in the GPT family."}, "he": {"t": "Causal LM", "d": "Causal language model: מודל decoder בלבד שמאומן לנבא את הטוקן הבא, כמו משפחת GPT."}}, {"term": "causal masking", "aliases": ["causal mask", "causal attention mask"], "cs": false, "en": {"t": "Causal masking", "d": "The attention mask that stops a position from attending to later positions in an autoregressive transformer."}, "he": {"t": "Causal masking", "d": "מסכת ה-attention שמונעת ממיקום להתייחס למיקומים מאוחרים יותר בטרנספורמר אוטורגרסיבי."}}, {"term": "CBOW", "aliases": ["continuous bag of words", "continuous bag-of-words"], "cs": true, "en": {"t": "CBOW", "d": "Continuous Bag of Words, one of word2vec's two training objectives (Mikolov, 2013), alongside skip-gram."}, "he": {"t": "CBOW", "d": "Continuous Bag of Words, אחת משתי מטרות האימון של word2vec (2013), לצד skip-gram."}}, {"term": "central limit theorem", "aliases": ["CLT"], "cs": false, "en": {"t": "Central limit theorem", "d": "A cornerstone limit theorem of probability, developed from de Moivre and Laplace to Lyapunov; the foundation of large-sample statistical inference."}, "he": {"t": "Central limit theorem", "d": "משפט יסוד בתורת ההסתברות, שהתפתח מ-de Moivre ו-Laplace ועד Lyapunov; הבסיס להסקה סטטיסטית במדגמים גדולים."}}, {"term": "chain of thought", "aliases": ["CoT"], "cs": false, "en": {"t": "Chain of thought", "d": "Chain-of-thought prompting (2022): asking a model to produce intermediate reasoning steps before its final answer."}, "he": {"t": "Chain of thought", "d": "Chain-of-thought prompting (2022): בקשה מהמודל לייצר שלבי הסקה ביניים לפני התשובה הסופית."}}, {"term": "chain-of-thought", "aliases": ["chain-of-thought prompting"], "cs": false, "en": {"t": "Chain-of-thought", "d": "Prompting style introduced by Wei et al. (Google, 2022), widely used to raise LLM accuracy on multi-step arithmetic and logic tasks."}, "he": {"t": "Chain-of-thought", "d": "סגנון prompting שהוצג על ידי Wei ואחרים (Google, 2022), נפוץ להעלאת דיוק של LLM במשימות אריתמטיקה ולוגיקה רב-שלביות."}}, {"term": "Chinchilla", "aliases": [], "cs": false, "en": {"t": "Chinchilla", "d": "A 2022 DeepMind model and scaling-law study on how to spend a fixed training-compute budget."}, "he": {"t": "Chinchilla", "d": "מודל ומחקר scaling laws של DeepMind משנת 2022, על אופן החלוקה של תקציב חישוב נתון לאימון."}}, {"term": "Chinchilla scaling", "aliases": ["Chinchilla scaling laws", "Chinchilla-optimal", "Chinchilla optimal"], "cs": false, "en": {"t": "Chinchilla scaling", "d": "DeepMind, 2022. Scaling-law result linking the compute-optimal model size to the number of training tokens."}, "he": {"t": "Chinchilla scaling", "d": "DeepMind, 2022 — תוצאת scaling law הקושרת בין גודל המודל האופטימלי לחישוב לבין מספר טוקני האימון."}}, {"term": "CI/CD", "aliases": ["CI CD", "CI/CD pipeline", "continuous integration"], "cs": false, "en": {"t": "CI/CD", "d": "Continuous Integration and Continuous Delivery: the automated build, test and release pipeline borrowed from software engineering."}, "he": {"t": "CI/CD", "d": "Continuous Integration ו-Continuous Delivery: צינור הבנייה, הבדיקות והשחרור האוטומטי שהושאל מהנדסת תוכנה."}}, {"term": "classifier-free guidance", "aliases": ["classifier free guidance"], "cs": false, "en": {"t": "Classifier-free guidance", "d": "A 2021 sampling method from Ho and Salimans, standard in text-to-image diffusion models such as Stable Diffusion."}, "he": {"t": "Classifier-free guidance", "d": "שיטת דגימה מ-2021 של Ho ו-Salimans, סטנדרטית במודלי diffusion ליצירת תמונות מטקסט כמו Stable Diffusion."}}, {"term": "CLIP", "aliases": [], "cs": true, "en": {"t": "CLIP", "d": "Contrastive Language-Image Pretraining (OpenAI, 2021). A model trained on image-text pairs that enables zero-shot classification."}, "he": {"t": "CLIP", "d": "Contrastive Language-Image Pretraining (OpenAI, 2021). מודל שאומן על זוגות תמונה-טקסט ומאפשר סיווג zero-shot."}}, {"term": "CNN", "aliases": ["ConvNet", "convolutional neural network"], "cs": true, "en": {"t": "CNN", "d": "Convolutional Neural Network, the architecture family built from convolution and pooling layers, dominant in computer vision."}, "he": {"t": "CNN", "d": "Convolutional Neural Network, משפחת הארכיטקטורות הבנויה משכבות קונבולוציה ו-pooling, דומיננטית ב-computer vision."}}, {"term": "COCO", "aliases": ["MS COCO", "MS-COCO"], "cs": true, "en": {"t": "COCO", "d": "Common Objects in Context (2014). The standard benchmark dataset for object detection, segmentation and captioning."}, "he": {"t": "COCO", "d": "Common Objects in Context (2014). דאטהסט הבנצ'מרק הסטנדרטי ל-object detection, segmentation ו-captioning."}}, {"term": "cold start", "aliases": ["cold-start", "cold start problem"], "cs": false, "en": {"t": "Cold start", "d": "The recommender-system problem of serving a user or item that has no interaction history yet."}, "he": {"t": "Cold start", "d": "הבעיה במערכות המלצה של טיפול במשתמש או פריט שאין לו עדיין היסטוריית אינטראקציות."}}, {"term": "collinearity", "aliases": [], "cs": false, "en": {"t": "Collinearity", "d": "When predictor variables are strongly linearly related, leaving individual regression coefficients unstable and hard to interpret."}, "he": {"t": "Collinearity", "d": "מצב שבו משתני החיזוי תלויים לינארית זה בזה, ומקדמי הרגרסיה נעשים בלתי יציבים וקשים לפרשנות."}}, {"term": "compute-optimal", "aliases": ["compute optimal"], "cs": false, "en": {"t": "Compute-optimal", "d": "The parameter-count and training-token combination that minimises loss for a fixed compute budget, from the Chinchilla scaling laws."}, "he": {"t": "Compute-optimal", "d": "השילוב של מספר פרמטרים וכמות טוקני אימון שממזער loss בתקציב חישוב נתון, מתוך scaling laws של Chinchilla."}}, {"term": "confusion matrix", "aliases": [], "cs": false, "en": {"t": "Confusion matrix", "d": "The table of predicted versus actual classes, from which precision, recall and related metrics are read off."}, "he": {"t": "Confusion matrix", "d": "טבלת המחלקות החזויות מול המחלקות האמיתיות, שממנה נגזרים precision, recall ומדדים נוספים."}}, {"term": "contamination", "aliases": ["data contamination", "benchmark contamination", "test set contamination"], "cs": false, "en": {"t": "Contamination", "d": "Data contamination: benchmark test examples leaking into a model's training corpus and inflating its reported scores."}, "he": {"t": "Contamination", "d": "Data contamination: דוגמאות מבחן מבנצ'מרק שדלפו לקורפוס האימון של המודל ומנפחות את הציונים המדווחים."}}, {"term": "contrastive learning", "aliases": ["contrastive"], "cs": false, "en": {"t": "Contrastive learning", "d": "Self-supervised training that pulls representations of matching pairs together and pushes non-matching ones apart; SimCLR is canonical."}, "he": {"t": "Contrastive learning", "d": "אימון self-supervised שמקרב ייצוגים של זוגות תואמים ומרחיק זוגות שאינם תואמים; SimCLR הוא הדוגמה הקנונית."}}, {"term": "covariate shift", "aliases": [], "cs": false, "en": {"t": "Covariate shift", "d": "A form of dataset shift in which the input distribution changes while the conditional label distribution stays fixed."}, "he": {"t": "Covariate shift", "d": "סוג של dataset shift שבו התפלגות הקלט משתנה בעוד התפלגות התווית המותנית נשארת קבועה."}}, {"term": "CQL", "aliases": [], "cs": true, "en": {"t": "CQL", "d": "Conservative Q-Learning (2020). An offline reinforcement-learning algorithm that penalises overestimated action values."}, "he": {"t": "CQL", "d": "Conservative Q-Learning (2020). אלגוריתם RL אופליין שמעניש הערכת יתר של ערכי פעולה."}}, {"term": "cross-entropy", "aliases": ["cross entropy"], "cs": false, "en": {"t": "Cross-entropy", "d": "The standard classification loss, measuring the gap between the predicted probability distribution and the true labels."}, "he": {"t": "Cross-entropy", "d": "ה-loss הסטנדרטי לסיווג, שמודד את הפער בין התפלגות ההסתברות החזויה לבין התוויות האמיתיות."}}, {"term": "cross-validation", "aliases": ["cross validation", "k-fold cross-validation"], "cs": false, "en": {"t": "Cross-validation", "d": "An evaluation protocol that repeatedly splits data into training and held-out folds; k-fold is the common form."}, "he": {"t": "Cross-validation", "d": "פרוטוקול הערכה שמחלק את הדאטה שוב ושוב ל-folds של אימון ובדיקה; k-fold הוא הצורה הנפוצה."}}, {"term": "curse of dimensionality", "aliases": [], "cs": false, "en": {"t": "Curse of dimensionality", "d": "The phenomenon whereby data becomes sparse and distances lose their meaning as the number of features grows."}, "he": {"t": "Curse of dimensionality", "d": "התופעה שבה הדאטה נעשה דליל והמרחקים מאבדים ממשמעותם ככל שמספר הפיצ'רים גדל."}}, {"term": "CutMix", "aliases": [], "cs": false, "en": {"t": "CutMix", "d": "A 2019 image augmentation method that pastes a patch from one image onto another and mixes their labels."}, "he": {"t": "CutMix", "d": "שיטת augmentation לתמונות משנת 2019 שמדביקה חתיכה מתמונה אחת על אחרת ומערבבת את התוויות."}}, {"term": "CV", "aliases": [], "cs": true, "en": {"t": "CV (cross-validation)", "d": "Cross-validation: splitting the data into k folds and rotating which fold is held out for evaluation."}, "he": {"t": "CV (cross-validation)", "d": "Cross-validation — אימות צולב: חלוקת הנתונים ל-k קפלים וסבב שבו כל קפל משמש בתורו לוולידציה."}, "areas": []}, {"term": "data leakage", "aliases": [], "cs": false, "en": {"t": "Data leakage", "d": "Information from the label or the test set reaching training, giving scores that collapse in production."}, "he": {"t": "Data leakage", "d": "מידע מהתווית או מסט הבדיקה שמחלחל לאימון, ומייצר ציונים שקורסים ב-production."}}, {"term": "dataset shift", "aliases": ["distribution shift", "domain shift", "data drift", "concept drift"], "cs": false, "en": {"t": "Dataset shift", "d": "Umbrella term for training and production data coming from different distributions; covariate, label and concept shift are its types."}, "he": {"t": "Dataset shift", "d": "מונח גג למצב שבו דאטת האימון וה-production מגיעים מהתפלגויות שונות; הסוגים הם covariate, label ו-concept shift."}}, {"term": "DBSCAN", "aliases": [], "cs": true, "en": {"t": "DBSCAN", "d": "A clustering algorithm from 1996 (Ester, Kriegel, Sander and Xu), widely used on spatial data as an alternative to k-means."}, "he": {"t": "DBSCAN", "d": "אלגוריתם clustering משנת 1996 (Ester, Kriegel, Sander ו-Xu), בשימוש נרחב על נתונים מרחביים כחלופה ל-k-means."}}, {"term": "DDIM", "aliases": [], "cs": true, "en": {"t": "DDIM", "d": "Denoising Diffusion Implicit Models (Song, Meng and Ermon, 2020). A fast-generation variant of DDPM, widely used in image pipelines."}, "he": {"t": "DDIM", "d": "Denoising Diffusion Implicit Models (Song ואחרים, 2020). וריאנט מהיר של DDPM, בשימוש נרחב בצינורות יצירת תמונות."}}, {"term": "DDPM", "aliases": [], "cs": true, "en": {"t": "DDPM", "d": "Denoising Diffusion Probabilistic Models (Ho et al., 2020). The paper that made diffusion-based image generation practical."}, "he": {"t": "DDPM", "d": "Denoising Diffusion Probabilistic Models (2020). המאמר שהפך יצירת תמונות מבוססת diffusion למעשית."}}, {"term": "demographic parity", "aliases": ["statistical parity"], "cs": false, "en": {"t": "Demographic parity", "d": "One of the standard group-fairness criteria (also called statistical parity), widely used when auditing lending and hiring models."}, "he": {"t": "Demographic parity", "d": "אחד מקריטריוני ההוגנות הקבוצתית הסטנדרטיים (נקרא גם statistical parity), נפוץ בביקורת מודלים של אשראי וגיוס."}}, {"term": "DenseNet", "aliases": [], "cs": false, "en": {"t": "DenseNet", "d": "Densely Connected Convolutional Networks (Huang et al., 2017); a CVPR best-paper CNN architecture often compared with ResNet."}, "he": {"t": "DenseNet", "d": "Densely Connected Convolutional Networks (Huang ואחרים, 2017); ארכיטקטורת CNN זוכת פרס המאמר הטוב ב-CVPR, שנהוג להשוות ל-ResNet."}}, {"term": "depthwise separable convolution", "aliases": ["depthwise separable", "depthwise convolution", "depthwise separable conv"], "cs": false, "en": {"t": "Depthwise separable convolution", "d": "A convolution factorised into a per-channel stage and a pointwise stage; the core block of MobileNet and Xception."}, "he": {"t": "Depthwise separable convolution", "d": "קונבולוציה שמפוצלת לשלב per-channel ולשלב pointwise; אבן הבניין המרכזית של MobileNet ו-Xception."}}, {"term": "Dice loss", "aliases": ["Dice coefficient", "Dice score"], "cs": false, "en": {"t": "Dice loss", "d": "A segmentation loss based on the Dice coefficient, an overlap measure closely related to the F1 score."}, "he": {"t": "Dice loss", "d": "loss ל-segmentation שמבוסס על מקדם Dice, מדד חפיפה שקרוב מאוד ל-F1."}}, {"term": "differential privacy", "aliases": [], "cs": false, "en": {"t": "Differential privacy", "d": "A formal privacy framework introduced by Dwork and colleagues in 2006, used in census releases and private model training."}, "he": {"t": "Differential privacy", "d": "מסגרת פרטיות פורמלית שהציגו Dwork ועמיתיה ב-2006, בשימוש בפרסומי מפקד אוכלוסין ובאימון מודלים עם הגנת פרטיות."}}, {"term": "diffusion model", "aliases": ["diffusion models", "diffusion"], "cs": false, "en": {"t": "Diffusion model", "d": "A generative family that learns to reverse a gradual noising process; behind Stable Diffusion and DALL-E 2."}, "he": {"t": "Diffusion model", "d": "משפחה גנרטיבית שלומדת להפוך תהליך הוספת רעש הדרגתי; מאחורי Stable Diffusion ו-DALL-E 2."}}, {"term": "dilated convolution", "aliases": ["dilation", "atrous convolution", "dilated conv"], "cs": false, "en": {"t": "Dilated convolution", "d": "A convolution with gaps between kernel taps, enlarging the receptive field without extra parameters. Also called atrous."}, "he": {"t": "Dilated convolution", "d": "קונבולוציה עם רווחים בין תאי הגרעין, שמגדילה את שדה הקליטה בלי פרמטרים נוספים. נקראת גם atrous."}}, {"term": "discount factor", "aliases": ["discounted return", "discounting"], "cs": false, "en": {"t": "Discount factor", "d": "The gamma parameter in reinforcement learning that weights future rewards relative to immediate ones."}, "he": {"t": "Discount factor", "d": "הפרמטר gamma ב-reinforcement learning ששוקל תגמולים עתידיים ביחס לתגמולים מיידיים."}}, {"term": "disparate impact", "aliases": [], "cs": false, "en": {"t": "Disparate impact", "d": "A notion from US anti-discrimination law that is now central to algorithmic-fairness auditing of hiring and lending models."}, "he": {"t": "Disparate impact", "d": "מושג מהדין האמריקאי נגד אפליה, שהפך מרכזי בביקורת הוגנות אלגוריתמית של מודלים לגיוס ולאשראי."}}, {"term": "domain adaptation", "aliases": [], "cs": false, "en": {"t": "Domain adaptation", "d": "A transfer-learning setting that adapts a model trained on a source domain to a different but related target domain."}, "he": {"t": "Domain adaptation", "d": "מצב של transfer learning שבו מתאימים מודל שאומן בדומיין מקור לדומיין יעד שונה אך קרוב."}}, {"term": "double descent", "aliases": ["double-descent"], "cs": false, "en": {"t": "Double descent", "d": "A phenomenon reported by Belkin et al. (2019) in overparameterised models, at odds with the textbook capacity-versus-error curve."}, "he": {"t": "Double descent", "d": "תופעה שתועדה על ידי Belkin ואחרים (2019) במודלים עם עודף פרמטרים, שאינה מתיישבת עם עקומת הקיבולת מול השגיאה מספרי הלימוד."}}, {"term": "DP-SGD", "aliases": ["DPSGD", "differentially private SGD"], "cs": false, "en": {"t": "DP-SGD", "d": "Differentially Private Stochastic Gradient Descent (2016). Training with per-example gradient clipping plus noise, for privacy guarantees."}, "he": {"t": "DP-SGD", "d": "Differentially Private SGD (2016). אימון עם חיתוך גרדיאנט לכל דוגמה והוספת רעש, לצורך הבטחות פרטיות."}}, {"term": "DPO", "aliases": ["Direct Preference Optimization"], "cs": true, "en": {"t": "DPO", "d": "Direct Preference Optimization (Rafailov et al., 2023). A widely used alignment method trained on pairs of preferred and rejected responses."}, "he": {"t": "DPO", "d": "Direct Preference Optimization (Rafailov ואחרים, 2023). שיטת alignment נפוצה המאומנת על זוגות של תשובה מועדפת ותשובה נדחית."}}, {"term": "DQN", "aliases": ["Deep Q-Network"], "cs": true, "en": {"t": "DQN", "d": "Deep Q-Network (DeepMind, 2015). The deep reinforcement-learning agent that learned to play Atari games from pixels."}, "he": {"t": "DQN", "d": "Deep Q-Network (DeepMind, 2015). סוכן deep RL שלמד לשחק במשחקי Atari ישירות מפיקסלים."}}, {"term": "Dropout", "aliases": [], "cs": false, "en": {"t": "Dropout", "d": "A 2014 regularisation technique that randomly disables units during training."}, "he": {"t": "Dropout", "d": "טכניקת רגולריזציה משנת 2014 שמכבה יחידות באופן אקראי במהלך האימון."}}, {"term": "duality", "aliases": ["dual problem", "dual formulation", "primal-dual"], "cs": false, "en": {"t": "Duality", "d": "The primal-dual view of constrained optimisation; the dual formulation is what makes the SVM kernel trick possible."}, "he": {"t": "Duality", "d": "המבט הפרימלי-דואלי באופטימיזציה עם אילוצים; הניסוח הדואלי הוא שמאפשר את kernel trick ב-SVM."}}, {"term": "dying ReLU", "aliases": ["dying relu problem", "dead ReLU"], "cs": false, "en": {"t": "Dying ReLU", "d": "The failure mode in which ReLU units output zero for every input and stop receiving any gradient."}, "he": {"t": "Dying ReLU", "d": "כשל שבו יחידות ReLU מחזירות אפס עבור כל קלט ומפסיקות לקבל גרדיאנט."}}, {"term": "dynamic batching", "aliases": ["continuous batching"], "cs": false, "en": {"t": "Dynamic batching", "d": "A serving technique that groups incoming inference requests on the fly to raise GPU utilisation."}, "he": {"t": "Dynamic batching", "d": "טכניקת serving שמקבצת בקשות inference נכנסות בזמן אמת כדי להעלות את ניצול ה-GPU."}}, {"term": "effective context", "aliases": ["effective context length", "effective context window"], "cs": false, "en": {"t": "Effective context", "d": "The portion of an LLM's advertised context window over which it actually retrieves and uses information reliably."}, "he": {"t": "Effective context", "d": "החלק מתוך חלון ההקשר המוצהר של LLM שבו המודל באמת מאתר ומנצל מידע באופן אמין."}}, {"term": "EfficientNet", "aliases": [], "cs": false, "en": {"t": "EfficientNet", "d": "A family of convolutional image classifiers (Google, 2019) built around a compound model-scaling rule."}, "he": {"t": "EfficientNet", "d": "משפחת מסווגי תמונה קונבולוציוניים (Google, 2019) שנבנתה סביב כלל סקיילינג מורכב של המודל."}}, {"term": "ELBO", "aliases": ["evidence lower bound"], "cs": true, "en": {"t": "ELBO", "d": "Evidence Lower BOund: the objective maximised in variational inference and in variational autoencoders."}, "he": {"t": "ELBO", "d": "Evidence Lower Bound: פונקציית המטרה שממקסמים באינפרנס וריאציוני ובאוטואנקודרים וריאציוניים."}}, {"term": "EM", "aliases": ["EM algorithm", "expectation-maximization", "expectation-maximisation"], "cs": true, "en": {"t": "EM", "d": "Expectation-Maximization: a classical iterative algorithm (Dempster et al., 1977) for fitting latent-variable models such as mixtures."}, "he": {"t": "EM", "d": "Expectation-Maximization: אלגוריתם איטרטיבי קלאסי (1977) להתאמת מודלים עם משתנים חבויים, כמו מודלי תערובת."}}, {"term": "EMA", "aliases": ["exponential moving average"], "cs": true, "en": {"t": "EMA", "d": "Exponential Moving Average: a running average, over training steps, that weights recent values more heavily than old ones."}, "he": {"t": "EMA", "d": "Exponential Moving Average: ממוצע רץ לאורך צעדי אימון, שנותן משקל גדול יותר לערכים עדכניים."}}, {"term": "epsilon-greedy", "aliases": ["eps-greedy", "e-greedy", "epsilon greedy"], "cs": false, "en": {"t": "Epsilon-greedy", "d": "A basic reinforcement-learning action-selection rule that trades off exploration and exploitation using a probability parameter epsilon."}, "he": {"t": "Epsilon-greedy", "d": "כלל בחירת פעולה בסיסי בלמידת חיזוק, שמאזן בין חקר לניצול באמצעות פרמטר הסתברות epsilon."}}, {"term": "equalized odds", "aliases": ["equalised odds", "equalized-odds"], "cs": false, "en": {"t": "Equalized odds", "d": "A group-fairness criterion (Hardt et al., 2016) that compares a classifier's error rates across protected groups."}, "he": {"t": "Equalized odds", "d": "קריטריון הוגנות קבוצתי (Hardt et al., 2016) שמשווה את שיעורי השגיאה של המסווג בין קבוצות מוגנות."}}, {"term": "equivariance", "aliases": ["equivariant"], "cs": false, "en": {"t": "Equivariance", "d": "A symmetry property relating transformations of a function's input to its output; central to CNNs and geometric deep learning."}, "he": {"t": "Equivariance", "d": "תכונת סימטריה שמקשרת בין טרנספורמציות על הקלט של פונקציה לבין הפלט שלה; מושג מרכזי ב-CNN ובלמידה עמוקה גאומטרית."}}, {"term": "experience replay", "aliases": ["replay buffer", "replay"], "cs": false, "en": {"t": "Experience replay", "d": "Reinforcement-learning technique (Lin, 1992; popularised by DQN) that stores past transitions in a buffer and re-samples them."}, "he": {"t": "Experience replay", "d": "טכניקה בלמידת חיזוקים (Lin, 1992; התפרסמה עם DQN) ששומרת מעברים קודמים בבאפר ודוגמת אותם מחדש."}}, {"term": "F1 score", "aliases": ["F1", "F1-score", "F-1 score", "F-measure"], "cs": true, "en": {"t": "F1 score", "d": "A standard single-number classification metric that combines precision and recall, popular under class imbalance."}, "he": {"t": "F1 score", "d": "מדד סיווג מספרי יחיד ומקובל, שמשלב precision ו-recall; נפוץ במיוחד כשיש חוסר איזון בין המחלקות."}}, {"term": "fairness impossibility", "aliases": ["impossibility theorem", "impossibility result"], "cs": false, "en": {"t": "Fairness impossibility", "d": "The result (Kleinberg et al. and Chouldechova, 2016) that common group-fairness criteria cannot all hold at once."}, "he": {"t": "Fairness impossibility", "d": "התוצאה (Kleinberg et al. ו-Chouldechova, 2016) שלפיה קריטריוני הוגנות קבוצתיים נפוצים אינם יכולים להתקיים כולם יחד."}}, {"term": "fan-in", "aliases": ["fan in", "fan-out", "fan out"], "cs": false, "en": {"t": "Fan-in / fan-out", "d": "The number of incoming (fan-in) or outgoing (fan-out) connections of a unit; used by weight-initialisation schemes."}, "he": {"t": "Fan-in / fan-out", "d": "מספר החיבורים הנכנסים (fan-in) או היוצאים (fan-out) של נוירון; משמש בשיטות אתחול משקולות."}}, {"term": "Faster R-CNN", "aliases": ["Faster RCNN"], "cs": false, "en": {"t": "Faster R-CNN", "d": "Faster R-CNN (Ren et al., 2015). The best-known detector of the R-CNN family and a long-standing detection baseline."}, "he": {"t": "Faster R-CNN", "d": "Faster R-CNN (Ren ואחרים, 2015). הגלאי המוכר ביותר במשפחת R-CNN, ששימש שנים רבות כקו בסיס לזיהוי עצמים."}}, {"term": "feature store", "aliases": ["feature stores"], "cs": false, "en": {"t": "Feature store", "d": "An MLOps component that stores, versions and serves engineered features for both training and online inference."}, "he": {"t": "Feature store", "d": "רכיב MLOps שמאחסן, מנהל גרסאות ומגיש פיצ'רים מהונדסים, גם לאימון וגם לאינפרנס בזמן אמת."}}, {"term": "federated learning", "aliases": [], "cs": false, "en": {"t": "Federated learning", "d": "A distributed training paradigm (Google, 2016) in which models train across many devices without centralising raw data."}, "he": {"t": "Federated learning", "d": "פרדיגמת אימון מבוזרת (Google, 2016) שבה מודלים מתאמנים על מכשירים רבים בלי לרכז את הנתונים הגולמיים."}}, {"term": "few-shot", "aliases": [], "cs": false, "en": {"t": "Few-shot", "d": "Adapting a model to a task from only a handful of labelled examples, rather than a full dataset."}, "he": {"t": "Few-shot", "d": "התאמת מודל למשימה , 2014). A generative model trained as a game between generator and discriminator."}, "he": {"t": "GAN", "d": "Generative Adversarial Network (Goodfellow et al., 2014). מודל גנרטיבי שמאומן כמשחק בין גנרטור לדיסקרימינטור."}}, {"term": "GAT", "aliases": ["graph attention network"], "cs": true, "en": {"t": "GAT", "d": "Graph Attention Network (Velickovic et al., 2018). A widely used graph neural network, and a standard baseline alongside GCN."}, "he": {"t": "GAT", "d": "Graph Attention Network (Velickovic ואחרים, 2018). רשת נוירונים על גרפים נפוצה, קו בסיס סטנדרטי לצד GCN."}}, {"term": "GCN", "aliases": ["graph convolutional network"], "cs": true, "en": {"t": "GCN", "d": "Graph Convolutional Network (Kipf and Welling, 2017). The standard graph neural network baseline, based on neighbourhood aggregation."}, "he": {"t": "GCN", "d": "Graph Convolutional Network (Kipf and Welling, 2017). קו הבסיס הסטנדרטי לרשתות גרפים, מבוסס אגרגציה על שכנים."}}, {"term": "Gini impurity", "aliases": ["Gini", "Gini index", "Gini criterion"], "cs": false, "en": {"t": "Gini impurity", "d": "A node-impurity measure used to choose splits in CART decision trees; the default criterion in scikit-learn."}, "he": {"t": "Gini impurity", "d": "מדד אי-טוהר בצומת, המשמש לבחירת פיצולים בעצי החלטה מסוג CART; ברירת המחדל ב-scikit-learn."}}, {"term": "GloVe", "aliases": ["Global Vectors"], "cs": false, "en": {"t": "GloVe", "d": "Global Vectors (Pennington, Socher and Manning, Stanford, 2014). A static word-embedding method, the main alternative to word2vec."}, "he": {"t": "GloVe", "d": "Global Vectors (Pennington, Socher ו-Manning, Stanford, 2014). שיטת שיכון מילים סטטית, החלופה המרכזית ל-word2vec."}}, {"term": "GMM", "aliases": ["Gaussian mixture model"], "cs": true, "en": {"t": "GMM", "d": "Gaussian Mixture Model: a probabilistic clustering and density model that represents data as a weighted mix of Gaussians."}, "he": {"t": "GMM", "d": "Gaussian Mixture Model: מודל הסתברותי לאשכול ולהערכת צפיפות, שמייצג ter the network has fitted the training set."}, "he": {"t": "Grokking", "d": "Power ואחרים, OpenAI 2022 — תופעה ידועה שבה דיוק המבחן קופץ זמן רב לאחר שהרשת כבר התאימה את עצמה לסט האימון."}}, {"term": "grounding", "aliases": ["grounded", "groundedness"], "cs": false, "en": {"t": "Grounding", "d": "Tying a generative model's statements to retrieved or verifiable external sources rather than to parametric memory alone."}, "he": {"t": "Grounding", "d": "עיגון הטענות של מודל גנרטיבי במקורות חיצוניים שאוחזרו או ניתנים לאימות, ולא רק בזיכרון הפרמטרי שלו."}}, {"term": "GroupKFold", "aliases": ["group kfold", "group k-fold", "grouped k-fold"], "cs": false, "en": {"t": "GroupKFold", "d": "A scikit-learn cross-validation splitter that keeps all samples sharing a group identifier inside the same fold."}, "he": {"t": "GroupKFold", "d": "מפצל cross-validation של scikit-learn ששומר את כל הדגימות בעלות אותו מזהה קבוצה באותו fold."}}, {"term": "GroupNorm", "aliases": ["group norm", "group normalization", "group normalisation"], "cs": false, "en": {"t": "GroupNorm", "d": "Group Normalization (Wu and He, 2018). A normalisation layer whose behaviour does not depend on batch size."}, "he": {"t": "GroupNorm", "d": "Group Normalization (Wu and He, 2018). שכבת נרמול שהתנהגותה אינה תלויה בגודל הבאץ'."}}, {"term": "GRPO", "aliases": ["Group Relative Policy Optimization"], "cs": true, "en": {"t": "GRPO", "d": "Group Relative Policy Optimization (DeepSeek, 2024). A PPO variant for language-model training that drops the learned value network."}, "he": {"t": "GRPO", "d": "Group Relative Policy Optimization (DeepSeek, 2024) — וריאנט של PPO לאימון מודלי שפה, המוותר על רשת ה-value הנלמדת."}}, {"term": "GRU", "aliases": ["gated recurrent unit"], "cs": true, "en": {"t": "GRU", "d": "Gated Recurrent Unit (Cho et al., 2014). A simplified gated recurrent architecture, lighter than the LSTM."}, "he": {"t": "GRU", "d": "Gated Recurrent Unit (Cho et al., 2014). ארכיטקטורה רקורנטית מגודרת ומפושטת, קלה יותר iant"], "cs": false, "en": {"t": "Invariance", "d": "Property of a function whose output stays unchanged when its input undergoes a given transformation."}, "he": {"t": "Invariance", "d": "תכונה של פונקציה שהפלט שלה אינו משתנה כאשר הקלט עובר טרנספורמציה מסוימת."}}, {"term": "IoU", "aliases": ["intersection over union", "Jaccard index"], "cs": true, "en": {"t": "IoU", "d": "Intersection over Union (the Jaccard index): the standard overlap measure between predicted and ground-truth boxes or masks."}, "he": {"t": "IoU", "d": "Intersection over Union (מדד Jaccard): מדד החפיפה הסטנדרטי בין תיבות או מסכות חזויות לאמת הקרקע."}}, {"term": "Jacobian", "aliases": ["Jacobian matrix"], "cs": false, "en": {"t": "Jacobian", "d": "The matrix of all first-order partial derivatives of a vector-valued function; the multivariate generalisation of the derivative."}, "he": {"t": "Jacobian", "d": "המטריצה של כל הנגזרות החלקיות מסדר ראשון של פונקציה וקטורית; ההכללה הרב-ממדית של הנגזרת."}}, {"term": "k-fold", "aliases": ["k fold", "kfold", "k-fold CV"], "cs": false, "en": {"t": "k-fold cross-validation", "d": "Resampling scheme that splits data into k parts and rotates which part is held out for evaluation."}, "he": {"t": "k-fold cross-validation", "d": "שיטת דגימה מחדש המחלקת את הנתונים ל-k חלקים, כשבכל סבב חלק אחר משמש להערכה."}}, {"term": "k-means", "aliases": ["kmeans", "k means"], "cs": false, "en": {"t": "k-means", "d": "The classic centroid-based clustering algorithm that partitions data into k clusters; the standard unsupervised baseline."}, "he": {"t": "k-means", "d": "אלגוריתם האשכול הקלאסי מבוסס מרכזים, שמחלק את הנתונים ל-k אשכולות; קו הבסיס הסטנדרטי בלמידה לא מפוקחת."}}, {"term": "k-NN", "aliases": ["k nearest neighbors", "k-nearest neighbours", "k-nearest neighbors"], "cs": false, "en": {"t": "k-NN", "d": "k-Nearest Neighbours. Non-parametric classifier or regressor that predicts from the closest training examples; Fix and Hodges, 1951."}, "he": {"t": "k-NN", "d": "k-Nearest Neighbours — מסווג או רגרסור לא-פרמטרי שמנבא לפי הדוגמאות הקרובות ביותר; Fix ו-Hodges, 1951."}}, {"term": "kernel trick", "aliases": ["kernel method"], "cs": false, "en": {"t": "Kernel trick", "d": "A classical device in kernel methods such as SVMs, kernel PCA and Gaussian processes; introduced by Aizerman and colleagues in 1964."}, "he": {"t": "Kernel trick", "d": "תחבולה קלאסית בשיטות קרנל כמו SVM, kernel PCA ותהליכים גאוסיאניים; הוצגה על ידי Aizerman ואחרים ב-1964."}}, {"term": "KL divergence", "aliases": ["KL", "Kullback-Leibler divergence", "Kullback-Leibler"], "cs": false, "en": {"t": "KL divergence", "d": "Kullback-Leibler divergence: an asymmetric measure of how much one probability distribution differs from a reference distribution."}, "he": {"t": "KL divergence", "d": "Kullback-Leibler divergence: מדד א-סימטרי לכמה התפלגות הסתברות אחת שונה מהתפלגות ייחוס."}}, {"term": "kNN", "aliases": [], "cs": true, "en": {"t": "kNN", "d": "k-Nearest Neighbours: a non-parametric method that predicts a point's label from its closest training examples."}, "he": {"t": "kNN", "d": "k-Nearest Neighbours: שיטה לא-פרמטרית שמנבאת את התווית של נקודה לפי דוגמאות האימון הקרובות אליה."}}, {"term": "KS test", "aliases": ["KS", "Kolmogorov-Smirnov test", "Kolmogorov-Smirnov"], "cs": false, "en": {"t": "KS test", "d": "Kolmogorov-Smirnov test: a classical non-parametric two-sample test from mid-20th-century statistics, based on empirical cumulative distributions."}, "he": {"t": "KS test", "d": "מבחן Kolmogorov-Smirnov: מבחן לא-פרמטרי קלאסי לשתי דגימות מאמצע המאה ה-20, המבוסס על התפלגויות מצטברות אמפיריות."}}, {"term": "KV cache", "aliases": ["key-value cache", "KV-cache"], "cs": false, "en": {"t": "KV cache", "d": "Key-Value cache: the attention keys and values of earlier tokens, stored and reused during autoregressive LLM decoding."}, "he": {"t": "KV cache", "d": "Key-Value cache: מפתחות וערכי ה-attention של טוקנים קודמים, הנשמרים ונעשה בהם שימוש חוזר בפענוח אוטורגרסיבי."}}, {"term": "label smoothing", "aliases": [], "cs": false, "en": {"t": "Label smoothing", "d": "A regularisation technique (Szegedy et al., 2016) that replaces hard one-hot targets with slightly softened ones."}, "he": {"t": "Label smoothing", "d": "טכניקת רגולריזציה (Szegedy et al., 2016) שמחליפה יעדי one-hot חדים ביעדים מרוככים מעט."}}, {"term": "Laplace smoothing", "aliases": ["Laplace", "add-one smoothing", "additive smoothing"], "cs": false, "en": {"t": "Laplace smoothing", "d": "Add-one (additive) smoothing: adding a small constant to counts so unseen events get non-zero probability. Common in Naive Bayes."}, "he": {"t": "Laplace smoothing", "d": "החלקת add-one: הוספת קבוע קטן לספירות כדי שאירועים שלא נצפו יקבלו הסתברות חיובית. נפוץ ב-Naive Bayes."}}, {"term": "lasso", "aliases": ["lasso regression"], "cs": false, "en": {"t": "Lasso", "d": "Least Absolute Shrinkage and Selection Operator (Tibshirani, 1996). L1-penalised linear regression that also performs feature selection."}, "he": {"t": "Lasso", "d": "Least Absolute Shrinkage and Selection Operator (Tibshirani, 1996). רגרסיה לינארית עם ענישת L1, שמבצעת גם בחירת פיצ'רים."}}, {"term": "LayerNorm", "aliases": ["layer norm", "layer normalization", "layer normalisation"], "cs": false, "en": {"t": "LayerNorm", "d": "Layer Normalization (Ba, Kiros and Hinton, 2016). The normalisation layer that became standard inside Transformers."}, "he": {"t": "LayerNorm", "d": "Layer Normalization (Ba, Kiros and Hinton, 2016). שכבת הנרמול שהפכה לסטנדרט בתוך Transformers."}}, {"term": "leaf-wise", "aliases": ["leaf wise"], "cs": false, "en": {"t": "Leaf-wise growth", "d": "LightGBM's tree-building strategy, which expands the single most promising leaf rather than a whole depth level."}, "he": {"t": "Leaf-wise growth", "d": "אסטרטגיית בניית העצים של LightGBM, שמרחיבה את העלה המבטיח ביותר במקום שכבת עומק שלמה."}}, {"term": "leakage", "aliases": [], "cs": false, "en": {"t": "Data leakage", "d": "Information about the target or the test set contaminating training, producing falsely optimistic offline scores."}, "he": {"t": "Data leakage", "d": "דליפת מידע על התווית או על סט הבדיקה לתוך האימון, שיוצרת תוצאות אופליין אופטימיות באופן מטעה."}}, {"term": "leave-one-out", "aliases": ["LOOCV", "leave one out", "leave-one-out cross-validation"], "cs": false, "en": {"t": "Leave-one-out", "d": "LOOCV: cross-validation with as many folds as samples, each fold holding out exactly one observation."}, "he": {"t": "Leave-one-out", "d": "LOOCV: ולידציה צולבת עם מספר folds כמספר הדגימות, כשכל fold משאיר בחוץ תצפית אחת בלבד."}}, {"term": "level-wise", "aliases": ["level wise"], "cs": false, "en": {"t": "Level-wise growth", "d": "The tree-building strategy of classic XGBoost, which expands every node of one depth level before going deeper."}, "he": {"t": "Level-wise growth", "d": "אסטרטגיית בניית העצים של XGBoost הקלאסי, שמרחיבה את כל הצמתים בשכבת עומק אחת לפני שממשיכה לעומק."}}, {"term": "LightGBM", "aliases": ["LGBM"], "cs": false, "en": {"t": "LightGBM", "d": "LightGBM (Microsoft, 2017). A fast histogram-based gradient-boosted decision tree library."}, "he": {"t": "LightGBM", "d": "LightGBM (Microsoft, 2017). ספרייה מהירה לעצי החלטה עם gradient boosting, מבוססת היסטוגרמות."}}, {"term": "LIME", "aliases": ["Local Interpretable Model-agnostic Explanations"], "cs": true, "en": {"t": "LIME", "d": "Local Interpretable Model-agnostic Explanations (Ribeiro et al., 2016). Explains individual predictions with a local surrogate model."}, "he": {"t": "LIME", "d": "Local Interpretable Model-agnostic Explanations (Ribeiro et al., 2016). מסביר ניבויים בודדים בעזרת מודל פונדקאי מקומי."}}, {"term": "linkage", "aliases": ["linkage criterion"], "cs": false, "en": {"t": "Linkage", "d": "In hierarchical clustering, the rule (single, complete, average, Ward) that defines the distance between two clusters."}, "he": {"t": "Linkage", "d": "באשכול היררכי, הכלל (single, complete, average, Ward) שמגדיר את המרחק בין שני אשכולות."}}, {"term": "Lipschitz", "aliases": ["Lipschitz continuity", "Lipschitz constant"], "cs": false, "en": {"t": "Lipschitz", "d": "A function is Lipschitz when its rate of change is bounded by a constant; used in optimisation and GAN theory."}, "he": {"t": "Lipschitz", "d": "פונקציה היא Lipschitz כאשר קצב השינוי שלה חסום בקבוע; מושג שימושי באופטימיזציה ובתאוריה של GANs."}}, {"term": "Lloyd's algorithm", "aliases": ["Lloyd", "Lloyds algorithm"], "cs": false, "en": {"t": "Lloyd's algorithm", "d": "The standard iterative procedure behind k-means clustering (Lloyd, 1957), alternating assignment and centroid-update steps."}, "he": {"t": "Lloyd's algorithm", "d": "התהליך האיטרטיבי הסטנדרטי שמאחורי אשכול k-means (Lloyd, 1957), שמחליף בין שיוך נקודות לעדכון מרכזים."}}, {"term": "log loss", "aliases": ["logloss", "logarithmic loss"], "cs": false, "en": {"t": "Log loss", "d": "Logarithmic loss, also called cross-entropy: the standard proper scoring rule for probabilistic classifiers."}, "he": {"t": "Log loss", "d": "לוס לוגריתמי, המכונה גם cross-entropy: כלל הניקוד הנאות הסטנדרטי למסווגים הסתברותיים."}}, {"term": "log-odds", "aliases": ["log odds", "logit"], "cs": false, "en": {"t": "Log-odds", "d": "The logarithm of the odds of an event, also called the logit; the natural output scale of logistic regression."}, "he": {"t": "Log-odds", "d": "הלוגריתם של יחס הסיכויים של אירוע, המכונה גם logit; סקאלת הפלט הטבעית של רגרסיה לוגיסטית."}}, {"term": "LoRA", "aliases": ["Low-Rank Adaptation"], "cs": true, "en": {"t": "LoRA", "d": "Low-Rank Adaptation (Hu et al., 2021). A parameter-efficient fine-tuning method that trains small added weight matrices."}, "he": {"t": "LoRA", "d": "Low-Rank Adaptation (Hu et al., 2021). שיטת fine-tuning חסכונית בפרמטרים, שמאמנת מטריצות משקולות קטנות שנוספות למודל."}}, {"term": "lost in the middle", "aliases": ["lost-in-the-middle"], "cs": false, "en": {"t": "Lost in the middle", "d": "A 2023 finding by Liu et al. about how reliably long-context LLMs use evidence, depending on where it sits in the prompt."}, "he": {"t": "Lost in the middle", "d": "ממצא של Liu ואחרים (2023) על מידת האמינות שבה LLMs עם הקשר ארוך מנצלים ראיה, בהתאם למיקומה ב-prompt."}}, {"term": "low-rank", "aliases": ["low rank"], "cs": false, "en": {"t": "Low-rank", "d": "Describes a matrix well approximated by a product of much smaller matrices; the basis of methods such as LoRA."}, "he": {"t": "Low-rank", "d": "תיאור של מטריצה שניתן לקרב היטב כמכפלה של מטריצות קטנות בהרבה; הבסיס לשיטות כמו LoRA."}}, {"term": "LR warmup", "aliases": ["learning-rate warmup", "learning rate warmup"], "cs": false, "en": {"t": "LR warmup", "d": "Learning-rate warmup: starting training at a very small learning rate and raising it over the first steps."}, "he": {"t": "LR warmup", "d": "חימום קצב הלמידה: התחלת האימון בקצב למידה קטן מאוד והעלאתו בהדרגה במהלך הצעדים הראשונים."}}, {"term": "LSTM", "aliases": ["long short-term memory"], "cs": true, "en": {"t": "LSTM", "d": "Long Short-Term Memory (Hochreiter and Schmidhuber, 1997). A gated recurrent architecture designed for long-range dependencies."}, "he": {"t": "LSTM", "d": "Long Short-Term Memory (Hochreiter and Schmidhuber, 1997). ארכיטקטורה רקורנטית מגודרת שתוכננה לתלויות ארוכות טווח."}}, {"term": "MAE", "aliases": ["mean absolute error", "masked autoencoder"], "cs": true, "en": {"t": "MAE (mean absolute error)", "d": "Mean Absolute Error: the average size of the errors, in the same units as the target."}, "he": {"t": "MAE (mean absolute error)", "d": "Mean Absolute Error — שגיאה מוחלטת ממוצעת: גודל השגיאה הממוצע, ביחידות של משתנה המטרה."}, "areas": []}, {"term": "MAE", "aliases": ["Masked Autoencoder"], "cs": true, "areas": ["cv", "architectures", "paradigms"], "en": {"t": "MAE (masked autoencoder)", "d": "Masked Autoencoder (He et al., 2021). A self-supervised pretraining recipe for vision Transformers."}, "he": {"t": "MAE (masked autoencoder)", "d": "Masked Autoencoder (He et al., 2021) — שיטת אימון מקדים self-supervised עבור vision transformers."}}, {"term": "Mamba", "aliases": ["mamba ssm"], "cs": false, "en": {"t": "Mamba", "d": "A selective state-space sequence model (2023), proposed as an alternative to Transformer attention for long sequences."}, "he": {"t": "Mamba", "d": "מודל רצף מבוסס state space סלקטיבי (2023), חלופה ל-attention של Transformer עבור רצפים ארוכים."}}, {"term": "MAML", "aliases": ["model-agnostic meta-learning"], "cs": true, "en": {"t": "MAML", "d": "Model-Agnostic Meta-Learning (Finn et al., 2017). A gradient-based meta-learning algorithm for fast adaptation to new tasks."}, "he": {"t": "MAML", "d": "Model-Agnostic Meta-Learning (2017). אלגוריתם meta-learning מבוסס גרדיאנטים להסתגלות מהירה למשימות חדשות."}}, {"term": "MAP", "aliases": ["maximum a posteriori"], "cs": true, "en": {"t": "MAP", "d": "Maximum A Posteriori estimation. The Bayesian point estimate that picks the most probable parameter value given the data."}, "he": {"t": "MAP", "d": "Maximum A Posteriori. אומד נקודתי בייסיאני הבוחר את ערך הפרמטר הסביר ביותר בהינתן הנתונים."}}, {"term": "MAPE", "aliases": ["mean absolute percentage error"], "cs": true, "en": {"t": "MAPE", "d": "Mean Absolute Percentage Error. A regression metric popular in demand forecasting and business reporting because it is unit-free."}, "he": {"t": "MAPE", "d": "Mean Absolute Percentage Error. מדד רגרסיה נפוץ בתחזית ביקושים ובדיווח עסקי, משום שאינו תלוי ביחידות."}}, {"term": "MAR", "aliases": ["missing at random"], "cs": true, "en": {"t": "MAR", "d": "Missing At Random. One of Rubin's three missing-data mechanisms, alongside MCAR and MNAR."}, "he": {"t": "MAR", "d": "Missing At Random. אחד משלושת מנגנוני חוסר הנתונים של Rubin, לצד MCAR ו-MNAR."}}, {"term": "Markov", "aliases": ["Markovian", "Markov property"], "cs": false, "en": {"t": "Markov / Markovian", "d": "Named for the Russian mathematician Andrey Markov (1856-1922), whose work on stochastic processes underpins MDPs, HMMs and MCMC."}, "he": {"t": "Markov / Markovian", "d": "על שם המתמטיקאי הרוסי Andrey Markov (1856-1922), שעבודתו על תהליכים סטוכסטיים עומדת בבסיס MDP, HMM ו-MCMC."}}, {"term": "MCAR", "aliases": ["missing completely at random"], "cs": true, "en": {"t": "MCAR", "d": "Missing Completely At Random. The strongest of Rubin's missing-data mechanisms, where missingness relates to nothing at all."}, "he": {"t": "MCAR", "d": "Missing Completely At Random. החזק שבמנגנוני חוסר הנתונים של Rubin, שבו ההיעדרות אינה תלויה בדבר."}}, {"term": "McNemar", "aliases": ["McNemar's test", "McNemar test"], "cs": false, "en": {"t": "McNemar's test", "d": "McNemar (1947). A paired statistical significance test for comparing two classifiers evaluated on the same examples."}, "he": {"t": "McNemar's test", "d": "McNemar (1947). מבחן מובהקות סטטיסטי מזווג להשוואת שני מסווגים שהוערכו על אותן דוגמאות."}}, {"term": "MDP", "aliases": ["Markov decision process"], "cs": true, "en": {"t": "MDP", "d": "Markov Decision Process. The standard formal framework of reinforcement learning: states, actions, transitions, rewards."}, "he": {"t": "MDP", "d": "Markov Decision Process. המסגרת הפורמלית הסטנדרטית של למידת חיזוק: מצבים, פעולות, מעברים ותגמולים."}}, {"term": "memory-bound", "aliases": ["memory bound", "memory-bandwidth bound"], "cs": false, "en": {"t": "memory-bound", "d": "A computation whose speed is limited by memory bandwidth rather than arithmetic throughput; the opposite of compute-bound."}, "he": {"t": "memory-bound", "d": "חישוב שקצבו מוגבל ברוחב פס הזיכרון ולא בכוח החישוב האריתמטי; ההפך מ-compute-bound."}}, {"term": "Mercer", "aliases": ["Mercer's theorem", "Mercer condition", "Mercer's condition"], "cs": false, "en": {"t": "Mercer's theorem", "d": "Mercer (1909). The mathematical result underpinning which functions qualify as valid kernels in kernel methods."}, "he": {"t": "Mercer's theorem", "d": "משפט Mercer (1909). התוצאה המתמטית הקובעת אילו פונקציות נחשבות קרנל תקף בשיטות קרנל."}}, {"term": "message-passing", "aliases": ["message passing"], "cs": false, "en": {"t": "message passing", "d": "The computation pattern behind graph neural networks, in which nodes iteratively exchange and aggregate information with neighbours."}, "he": {"t": "message passing", "d": "דפוס החישוב שבבסיס רשתות גרפים, שבו צמתים מחליפים ומאגדים מידע עם שכניהם באופן איטרטיבי."}}, {"term": "meta learning", "aliases": ["meta-learning", "learning to learn"], "cs": false, "en": {"t": "meta-learning", "d": "'Learning to learn': a family of methods that train models to adapt quickly to new tasks from few examples."}, "he": {"t": "meta-learning", "d": "'ללמוד ללמוד': משפחת שיטות המאמנת מודלים להסתגל במהירות למשימות חדשות ממעט דוגמאות."}}, {"term": "metric learning", "aliases": ["deep metric learning"], "cs": false, "en": {"t": "metric learning", "d": "A family of methods that learn an embedding space where distance reflects similarity; includes contrastive and triplet losses."}, "he": {"t": "metric learning", "d": "משפחת שיטות הלומדת מרחב שיכון שבו מרחק מייצג דמיון; כוללת contrastive loss ו-triplet loss."}}, {"term": "mixed precision", "aliases": ["mixed-precision", "mixed precision training"], "cs": false, "en": {"t": "mixed precision", "d": "Training that computes in low-precision formats such as fp16 or bf16 while keeping higher-precision copies of weights."}, "he": {"t": "mixed precision", "d": "אימון המחשב בפורמטים בדיוק נמוך כמו fp16 או bf16, תוך שמירת עותקי משקלים בדיוק גבוה."}}, {"term": "mixture of experts", "aliases": ["mixture-of-experts"], "cs": false, "en": {"t": "Mixture of Experts (MoE)", "d": "An architecture containing many parallel expert sub-networks, of which a learned router activates only a few per token."}, "he": {"t": "Mixture of Experts (MoE)", "d": "ארכיטקטורה עם תת-רשתות מומחים מקבילות רבות, שמתוכן נתב נלמד מפעיל רק מעטות לכל טוקן."}}, {"term": "MLE", "aliases": ["maximum likelihood estimation", "maximum likelihood"], "cs": true, "en": {"t": "MLE", "d": "Maximum Likelihood Estimation. The classical principle of choosing parameters that make the observed data most probable."}, "he": {"t": "MLE", "d": "Maximum Likelihood Estimation. העיקרון הקלאסי לבחירת פרמטרים שממקסמים את סבירות הנתונים הנצפים."}}, {"term": "MLM", "aliases": ["masked language modeling", "masked language modelling"], "cs": true, "en": {"t": "MLM", "d": "Masked Language Modelling. The BERT-style pretraining objective of predicting hidden tokens from surrounding context."}, "he": {"t": "MLM", "d": "Masked Language Modelling. מטרת קדם-האימון בסגנון BERT: ניבוי טוקנים מוסתרים מתוך ההקשר הסובב."}}, {"term": "MLP", "aliases": ["multi-layer perceptron", "multilayer perceptron"], "cs": true, "en": {"t": "MLP", "d": "Multi-Layer Perceptron. A plain feed-forward network of fully connected layers; the classic neural architecture."}, "he": {"t": "MLP", "d": "Multi-Layer Perceptron. רשת feed-forward פשוטה של שכבות fully connected; הארכיטקטורה הנוירונית הקלאסית."}}, {"term": "MNAR", "aliases": ["missing not at random"], "cs": true, "en": {"t": "MNAR", "d": "Missing Not At Random: one of the three missing-data mechanisms in Rubin's classification, alongside MCAR and MAR."}, "he": {"t": "MNAR", "d": "Missing Not At Random: אחד משלושת מנגנוני חוסר הנתונים בסיווג של Rubin, לצד MCAR ו-MAR."}}, {"term": "MobileNet", "aliases": ["MobileNets"], "cs": false, "en": {"t": "MobileNet", "d": "Google, 2017. A family of small convolutional networks designed for mobile and embedded vision workloads."}, "he": {"t": "MobileNet", "d": "Google, 2017. משפחת רשתות קונבולוציה קטנות שתוכננו לראייה ממוחשבת במכשירים ניידים ומוטמעים."}}, {"term": "mode collapse", "aliases": [], "cs": false, "en": {"t": "mode collapse", "d": "A well-known instability in GAN training; the target of fixes such as minibatch discrimination, unrolled GANs and WGAN."}, "he": {"t": "mode collapse", "d": "אי-יציבות מוכרת באימון GAN; היעד של פתרונות כמו minibatch discrimination, unrolled GANs ו-WGAN."}}, {"term": "model-based", "aliases": ["model based", "model-based RL"], "cs": false, "en": {"t": "model-based (RL)", "d": "In reinforcement learning, methods that learn or exploit an explicit model of the environment's dynamics."}, "he": {"t": "model-based (RL)", "d": "בלמידת חיזוק, שיטות הלומדות או מנצלות מודל מפורש של דינמיקת הסביבה."}}, {"term": "model-free", "aliases": ["model free", "model-free RL"], "cs": false, "en": {"t": "model-free (RL)", "d": "In reinforcement learning, methods that learn policies or value functions directly from experience, with no environment model."}, "he": {"t": "model-free (RL)", "d": "בלמידת חיזוק, שיטות הלומדות מדיניות או פונקציות ערך ישירות מניסיון, ללא מודל של הסביבה."}}, {"term": "MoE", "aliases": [], "cs": true, "en": {"t": "MoE (mixture of experts)", "d": "Mixture of Experts. Architecture holding many expert sub-networks, where a router activates only a few per input."}, "he": {"t": "MoE (mixture of experts)", "d": "Mixture of Experts — ארכיטקטורה עם תת-רשתות מומחה רבות, שבה router מפעיל רק מעטות מהן לכל קלט."}}, {"term": "momentum", "aliases": ["heavy ball", "Polyak momentum"], "cs": false, "en": {"t": "momentum", "d": "Optimiser technique (Polyak, 1964) that accumulates a running average of past gradients to smooth and accelerate updates."}, "he": {"t": "momentum", "d": "טכניקת אופטימיזציה (Polyak, 1964) הצוברת ממוצע רץ של גרדיאנטים קודמים כדי להחליק ולהאיץ עדכונים."}}, {"term": "Monte Carlo", "aliases": ["Monte-Carlo", "MC estimate"], "cs": false, "en": {"t": "Monte Carlo", "d": "Family of methods (Los Alamos, 1940s) that estimate quantities by random sampling instead of exact computation."}, "he": {"t": "Monte Carlo", "d": "משפחת שיטות (לוס אלמוס, שנות ה-40) המעריכות גדלים באמצעות דגימה אקראית במקום חישוב מדויק."}}, {"term": "MQA", "aliases": ["multi-query attention"], "cs": true, "en": {"t": "MQA", "d": "Multi-Query Attention (Shazeer, Google, 2019). An attention variant aimed at faster autoregressive decoding; the precursor to GQA."}, "he": {"t": "MQA", "d": "Multi-Query Attention (Shazeer, Google, 2019). וריאנט attention שנועד להאיץ פענוח אוטורגרסיבי; הקודם ל-GQA."}}, {"term": "MSE", "aliases": ["mean squared error"], "cs": true, "en": {"t": "MSE", "d": "Mean Squared Error. The classical squared-error loss and regression metric, penalising large errors heavily."}, "he": {"t": "MSE", "d": "Mean Squared Error. פונקציית ההפסד ומדד הרגרסיה הקלאסיים, המענישים בחומרה שגיאות גדולות."}}, {"term": "multi task learning", "aliases": ["multi-task learning", "MTL", "multitask learning"], "cs": false, "en": {"t": "multi-task learning", "d": "Training a single model on several related tasks at once so that they share representations."}, "he": {"t": "multi-task learning", "d": "אימון מודל יחיד על כמה משימות קשורות בו-זמנית, כך שיחלקו ביניהן ייצוגים משותפים."}}, {"term": "multi-head attention", "aliases": ["multi head attention", "MHA", "multi-head self-attention"], "cs": false, "en": {"t": "multi-head attention (MHA)", "d": "The Transformer's attention layer, run as several parallel attention heads with separate learned projections."}, "he": {"t": "multi-head attention (MHA)", "d": "שכבת ה-attention של ה-Transformer, המורצת ככמה ראשי attention מקבילים עם היטלים נלמדים נפרדים."}}, {"term": "multicollinearity", "aliases": [], "cs": false, "en": {"t": "multicollinearity", "d": "In regression, strong correlation among predictors, which makes individual coefficient estimates unstable and hard to interpret."}, "he": {"t": "multicollinearity", "d": "ברגרסיה, מתאם חזק בין המשתנים המסבירים, ההופך את אומדני המקדמים לבלתי יציבים וקשים לפרשנות."}}, {"term": "multiple comparisons", "aliases": ["multiple testing", "multiple comparisons problem"], "cs": false, "en": {"t": "multiple comparisons", "d": "The statistical problem that testing many hypotheses inflates false positives; handled by corrections such as Bonferroni."}, "he": {"t": "multiple comparisons", "d": "הבעיה הסטטיסטית שבדיקת השערות רבות מנפחת תוצאות חיוביות שגויות; מטופלת בתיקונים כמו Bonferroni."}}, {"term": "n-gram", "aliases": ["n-grams", "ngram", "n gram"], "cs": false, "en": {"t": "n-gram", "d": "A contiguous run of n items (characters or words) — the basic unit of classical statistical language models."}, "he": {"t": "n-gram", "d": "רצף רציף של n פריטים (תווים או מילים) — יחידת היסוד של מודלי שפה סטטיסטיים קלאסיים."}}, {"term": "naive bayes", "aliases": ["naive Bayes classifier"], "cs": false, "en": {"t": "Naive Bayes", "d": "A classical probabilistic classifier built on Bayes' rule; a fast baseline for text tasks such as spam filtering."}, "he": {"t": "Naive Bayes", "d": "מסווג הסתברותי קלאסי המבוסס על חוק Bayes; קו בסיס מהיר למשימות טקסט כמו סינון ספאם."}}, {"term": "negative transfer", "aliases": [], "cs": false, "en": {"t": "negative transfer", "d": "When transfer or multi-task learning backfires: knowledge from the source task hurts performance on the target task."}, "he": {"t": "negative transfer", "d": "מצב שבו transfer learning או למידה רב-משימתית מזיקים: ידע ממשימת המקור פוגע בביצועים במשימת היעד."}}, {"term": "Nesterov", "aliases": ["Nesterov momentum", "NAG", "Nesterov accelerated gradient"], "cs": false, "en": {"t": "Nesterov momentum", "d": "Nesterov Accelerated Gradient (Nesterov, 1983). An accelerated first-order method, offered as an option in most SGD implementations."}, "he": {"t": "Nesterov momentum", "d": "Nesterov Accelerated Gradient (Nesterov, 1983). שיטה מואצת מסדר ראשון, זמינה כאופציה ברוב מימושי SGD."}}, {"term": "NMS", "aliases": ["non-maximum suppression", "non-max suppression"], "cs": true, "en": {"t": "NMS", "d": "Non-Maximum Suppression. A standard post-processing step applied to the raw box predictions of detectors such as YOLO and Faster R-CNN."}, "he": {"t": "NMS", "d": "Non-Maximum Suppression. שלב עיבוד סטנדרטי שמופעל על תיבות הגלם שמנבאים גלאים כמו YOLO ו-Faster R-CNN."}}, {"term": "no free lunch theorem", "aliases": ["no free lunch", "NFL theorem"], "cs": false, "en": {"t": "No free lunch theorem", "d": "Wolpert and Macready, 1997. Result stating that no learner or optimiser is best across all possible problems."}, "he": {"t": "No free lunch theorem", "d": "Wolpert ו-Macready, 1997 — משפט הקובע שאין לומד או אופטימייזר הטוב ביותר על פני כל הבעיות האפשריות."}}, {"term": "novelty effect", "aliases": [], "cs": false, "en": {"t": "novelty effect", "d": "A user-behaviour phenomenon studied in online experimentation and product analytics; a standard caveat in A/B test reviews."}, "he": {"t": "novelty effect", "d": "תופעה בהתנהגות משתמשים הנחקרת בניסויים מקוונים ובאנליטיקת מוצר; הסתייגות סטנדרטית בסקירת ניסויי A/B."}}, {"term": "Occam's razor", "aliases": ["Occams razor", "Ockham's razor", "Occam"], "cs": false, "en": {"t": "Occam's razor", "d": "Principle favouring the simplest hypothesis consistent with the data; attributed to William of Ockham, 14th century."}, "he": {"t": "Occam's razor", "d": "עיקרון המעדיף את ההשערה הפשוטה ביותר שמתיישבת עם הנתונים; מיוחס ל-William of Ockham מהמאה ה-14."}}, {"term": "off-policy", "aliases": ["off policy"], "cs": false, "en": {"t": "off-policy", "d": "Reinforcement learning that improves one policy while learning from data generated by a different behaviour policy."}, "he": {"t": "off-policy", "d": "למידת חיזוק המשפרת מדיניות אחת תוך למידה מנתונים שנוצרו על ידי מדיניות התנהגות אחרת."}}, {"term": "offline rl", "aliases": ["batch RL", "offline reinforcement learning"], "cs": false, "en": {"t": "offline RL", "d": "Offline (batch) Reinforcement Learning. Learning a policy purely from a fixed logged dataset, with no environment interaction."}, "he": {"t": "offline RL", "d": "Offline (batch) Reinforcement Learning. לימוד מדיניות מתוך דאטהסט מתועד קבוע בלבד, ללא אינטראקציה עם הסביבה."}}, {"term": "OLS", "aliases": ["ordinary least squares"], "cs": true, "en": {"t": "OLS", "d": "Ordinary Least Squares. The classical linear-regression fit that minimises the sum of squared residuals."}, "he": {"t": "OLS", "d": "Ordinary Least Squares. התאמת הרגרסיה הלינארית הקלאסית הממזערת את סכום ריבועי השאריות."}}, {"term": "on-policy", "aliases": ["on policy"], "cs": false, "en": {"t": "on-policy", "d": "Reinforcement learning that learns only from data generated by the policy currently being improved."}, "he": {"t": "on-policy", "d": "למידת חיזוק הלומדת רק מנתונים שנוצרו על ידי המדיניות המשופרת כרגע."}}, {"term": "one-hot", "aliases": ["one hot", "one-hot encoding"], "cs": false, "en": {"t": "one-hot encoding", "d": "Representing a category as a vector of zeros with a single 1 at that category's index."}, "he": {"t": "one-hot encoding", "d": "ייצוג קטגוריה כווקטור של אפסים עם 1 יחיד באינדקס המתאים לאותה קטגוריה."}}, {"term": "one-stage", "aliases": ["one stage detector", "one-stage detector", "single-stage detector"], "cs": false, "en": {"t": "one-stage detector", "d": "Object detectors such as YOLO, SSD and RetinaNet, contrasted with the R-CNN family; the usual choice when detection speed matters."}, "he": {"t": "one-stage detector", "d": "גלאי עצמים כמו YOLO, SSD ו-RetinaNet, בניגוד למשפחת R-CNN; הבחירה המקובלת כשמהירות הזיהוי חשובה."}}, {"term": "OOV", "aliases": ["out-of-vocabulary", "out of vocabulary"], "cs": true, "en": {"t": "OOV", "d": "Out-Of-Vocabulary. A word or token absent from a model's fixed vocabulary; a classic problem for word-level models."}, "he": {"t": "OOV", "d": "Out-Of-Vocabulary. מילה או טוקן שאינם באוצר המילים הקבוע של המודל; בעיה קלאסית במודלים ברמת מילה."}}, {"term": "out-of-distribution", "aliases": ["OOD", "out of distribution"], "cs": false, "en": {"t": "out-of-distribution (OOD)", "d": "Input that differs from the training distribution; a central concern for robustness, detection and safe deployment."}, "he": {"t": "out-of-distribution (OOD)", "d": "קלט השונה מהתפלגות האימון; נושא מרכזי בחוסן מודלים, בזיהוי חריגות ובפריסה בטוחה."}}, {"term": "over smoothing", "aliases": ["oversmoothing"], "cs": false, "en": {"t": "over-smoothing", "d": "A failure mode of deep graph neural networks in which node representations converge and become indistinguishable."}, "he": {"t": "over-smoothing", "d": "כשל ברשתות גרפים עמוקות שבו ייצוגי הצמתים מתכנסים ונעשים בלתי ניתנים להבחנה זה מזה."}}, {"term": "over-smoothing", "aliases": [], "cs": false, "en": {"t": "Over-smoothing", "d": "A named failure mode of deep graph neural networks, studied since Li, Han and Wu (2018)."}, "he": {"t": "Over-smoothing", "d": "מצב כשל ידוע ברשתות גרפים עמוקות, שנחקר מאז Li, Han ו-Wu (2018)."}}, {"term": "p-value", "aliases": ["p-values", "p value"], "cs": false, "en": {"t": "p-value", "d": "Statistical quantity measuring how surprising the observed data would be if the null hypothesis were true."}, "he": {"t": "p-value", "d": "גודל סטטיסטי המודד עד כמה הנתונים שנצפו היו מפתיעים אילו השערת האפס הייתה נכונה."}}, {"term": "Panoptic", "aliases": ["panoptic segmentation"], "cs": false, "en": {"t": "panoptic segmentation", "d": "Panoptic segmentation (Kirillov et al., 2019): a scene-understanding task with its own benchmark metric, PQ, on COCO and Cityscapes."}, "he": {"t": "panoptic segmentation", "d": "Panoptic segmentation (Kirillov ואחרים, 2019): משימת הבנת סצנה עם מדד ייעודי משלה, PQ, על COCO ו-Cityscapes."}}, {"term": "PCA", "aliases": ["principal component analysis"], "cs": true, "en": {"t": "PCA", "d": "Principal Component Analysis (Pearson, 1901). The classical linear dimensionality-reduction method, widely used for compression and visualisation."}, "he": {"t": "PCA", "d": "Principal Component Analysis (Pearson, 1901). שיטת הורדת הממד הלינארית הקלאסית, בשימוש נרחב לדחיסה ולהצגה חזותית."}}, {"term": "peft", "aliases": ["parameter-efficient fine-tuning"], "cs": false, "en": {"t": "PEFT", "d": "Parameter-Efficient Fine-Tuning. The family of methods — LoRA, adapters, prefix tuning — that adapt large models by training few parameters."}, "he": {"t": "PEFT", "d": "Parameter-Efficient Fine-Tuning. משפחת השיטות — LoRA, adapters, prefix tuning — המכווננות מודלים גדולים באמצעות מעט פרמטרים."}}, {"term": "platt scaling", "aliases": [], "cs": activation", "aliases": ["pre-activation ResNet", "preactivation"], "cs": false, "en": {"t": "pre-activation", "d": "Pre-activation ResNet (He et al., 2016). A residual-block ordering placing normalisation and activation before the convolution."}, "he": {"t": "pre-activation", "d": "Pre-activation ResNet (He ואחרים, 2016). סידור בלוק שארית שבו הנרמול וההפעלה קודמים לקונבולוציה."}}, {"term": "pre-norm", "aliases": ["pre norm", "pre-LN"], "cs": false, "en": {"t": "pre-norm", "d": "Transformer layout applying layer normalisation inside the residual branch before each sublayer; standard in modern LLMs."}, "he": {"t": "pre-norm", "d": "פריסת Transformer שבה layer normalization מופעלת בתוך ענף השארית לפני כל תת-שכבה; סטנדרט ב-LLM מודרניים."}}, {"term": "Prefill", "aliases": [], "cs": false, "en": {"t": "prefill", "d": "The first phase of LLM inference, which processes the whole input prompt before decoding starts token by token."}, "he": {"t": "prefill", "d": "השלב הראשון בהסקה של LLM, המעבד את הפרומפט כולו לפני שמתחיל שלב הפענוח טוקן אחר טוקן."}}, {"term": "prefill vs decode", "aliases": ["prefill and decode", "prefill phase", "prefill/decode"], "cs": false, "en": {"t": "Prefill vs decode", "d": "The two phases of Transformer inference: processing the whole prompt at once, then emitting tokens one at a time."}, "he": {"t": "Prefill vs decode", "d": "שני שלבי ה-inference ב-Transformer: עיבוד כל ה-prompt בבת אחת, ולאחר מכן פליטת טוקנים אחד-אחד."}}, {"term": "pretext task", "aliases": ["pretext tasks"], "cs": false, "en": {"t": "pretext task", "d": "In self-supervised learning, an artificial task solved only in order to learn useful representations, not for itself."}, "he": {"t": "pretext task", "d": "בלמידה בפיקוח עצמי, משימה מלאכותית שנפתרת רק כדי ללמוד ייצוגים שימושיים, לא לשם עצמה."}}, {"term": "pruning", "aliases": ["model pruning", "weight pruning"], "cs": false, "en": {"t": "pruning", "d": "Model-compression technique that removes weights, neurons or channels from a ared", "r squared trap", "coefficient of determination"], "cs": false, "en": {"t": "R-squared", "d": "Coefficient of determination: the share of variance in the target that a regression model explains."}, "he": {"t": "R-squared", "d": "מקדם ההסבר: החלק מהשונות של משתנה המטרה שהמודל הרגרסיבי מסביר."}}, {"term": "R^2", "aliases": ["R2"], "cs": false, "en": {"t": "R^2", "d": "Coefficient of determination. Classical regression statistic reporting the share of target variance the model accounts for."}, "he": {"t": "R^2", "d": "מקדם ההסבר (coefficient of determination) — מדד רגרסיה קלאסי לשיעור השונות במשתנה המוסבר שהמודל מסביר."}}, {"term": "RAG", "aliases": ["Retrieval-Augmented Generation", "retrieval augmented generation"], "cs": true, "en": {"t": "RAG", "d": "Retrieval-Augmented Generation (Facebook AI, 2020). Pattern where a model conditions its answer on documents fetched from an external store."}, "he": {"t": "RAG", "d": "Retrieval-Augmented Generation (Facebook AI, 2020): דפוס שבו המודל מייצר תשובה בהתבסס על מסמכים שנשלפו ממאגר חיצוני."}}, {"term": "random forest", "aliases": ["random forests"], "cs": false, "en": {"t": "Random forest", "d": "An ensemble of decision trees introduced by Leo Breiman in 2001; a strong, low-tuning baseline for tabular data."}, "he": {"t": "Random forest", "d": "אנסמבל של עצי החלטה שהוצג על ידי Leo Breiman ב-2001; baseline חזק ודל-כוונון לנתונים טבלאיים."}}, {"term": "RBF", "aliases": ["RBF kernel", "RBF-kernel", "radial basis function"], "cs": true, "en": {"t": "RBF", "d": "Radial Basis Function: a kernel, also called the Gaussian kernel, whose value depends only on distance between points."}, "he": {"t": "RBF", "d": "Radial Basis Function: קרנל, המכונה גם קרנל גאוסיאני, שערכו תלוי רק במרחק בין שתי נקודות."}}, {"term": "receptive field", "aliases": ["receptive fields"], "cs": false, "en": {"t": "Receptive field", "d": "The region of the input that influences one particular unit or feature map in a convolutional network."}, "he": {"t"
