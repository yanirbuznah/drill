-$f=150$.", "הערך $4$ הוא הסכום המקופל לפני הכפל ב-$1/T_s$, ולכן הוא שגוי בגורם $400$.", "הערך $2$ הוא הצפיפות המקורית, כאילו הדגימה לא קיפלה את הספקטרום ולא שינתה את קנה המידה."]}}, {"id": "smp-004", "area": "sampling", "topic": "bandlimited-white-noise-at-nyquist", "difficulty": 4, "type": "mcq", "hardnessSource": "computation", "tags": ["white-noise", "nyquist-rate", "sinc", "discrete-white"], "answer": 1, "en": {"q": "Band-limited white noise has $S_X(f)=10^{-3}$ W/Hz for $|f|≤5$ kHz and $0$ outside. It is sampled at exactly the Nyquist rate $f_s=10$ kHz. Which describes $R_X[k]=R_X(kT_s)$?", "options": ["$R_X[k]=10 sinc(k)$, nonzero and slowly decaying for $k≠0$", "$R_X[k]=10 δ[k]$: uncorrelated samples of variance $10$ W", "$R_X[k]=5 δ[k]$: uncorrelated samples of variance $5$ W", "$R_X[k]=10^{-3}δ[k]$: the variance equals the PSD height"], "hint": "Inverse-transform a flat band to get a sinc, then evaluate it at the sample lags $τ=k/f_s$. Where are the zeros of $sinc$?", "explanation": "With $S_X(f)=N_0/2=10^{-3}$ on $|f|≤W=5000$: $R_X(τ)=∫_{-W}^{W}10^{-3}e^{j2πfτ}df=2·10^{-3}W sinc(2Wτ)=10 sinc(10^4τ)$. In particular $R_X(0)=2W·10^{-3}=10$ W, the total power. Sampling at $T_s=1/f_s=10^{-4}$ s gives $R_X[k]=10 sinc(10^4·k·10^{-4})=10 sinc(k)$. But $sinc(k)=sin(πk)/(πk)=0$ for every nonzero integer $k$ and equals $1$ at $k=0$, so $R_X[k]=10 δ[k]$: the samples are uncorrelated with variance $10$ W, a discrete-time white sequence. This is why Nyquist-rate sampling of band-limited white noise is the canonical way to generate white samples.", "whyWrong": ["The expression $10 sinc(k)$ is right but its value is misread: $sinc$ vanishes at every nonzero integer, so nothing survives off $k=0$.", "$5$ halves the power, as if the band were only $[0,W]$ or as if the two-sided density had been counted once.", "$10^{-3}$ is the spectral height in W/Hz; the variance is that height integrated over the $10$ kHz two-sided band."]}, "he": {"q": "רעש לבן חסום פס מקיים $S_X(f)=10^{-3}$ ואט/הרץ עבור $|f|≤5$ קילוהרץ ו-$0$ מחוץ לכך. הוא נדגם בדיוק בקצב נייקוויסט $f_s=10$ קילוהרץ. מה מתאר את $R_X[k]=R_X(kT_s)$?", "options": ["$R_X[k]=10 sinc(k)$, שונה מאפס ודועך לאט עבור $k≠0$", "$R_X[k]=10 δ[k]$: דגימות בלתי מתואמות בשונות $10$ ואט", "$R_X[k]=5 δ[k]$: דגימות בלתי מתואמות בשונות $5$ ואט", "$R_X[k]=10^{-3}δ[k]$: השונות שווה לגובה ה-PSD"], "hint": "בצע התמרה הופכית לרצועה שטוחה כדי לקבל סינק, ואז הצב את פיגורי הדגימה $τ=k/f_s$. היכן האפסים של $sinc$?", "explanation": "עם $S_X(f)=N_0/2=10^{-3}$ על $|f|≤W=5000$: ‏$R_X(τ)=∫_{-W}^{W}10^{-3}e^{j2πfτ}df=2·10^{-3}W sinc(2Wτ)=10 sinc(10^4τ)$. בפרט $R_X(0)=2W·10^{-3}=10$ ואט, ההספק הכולל. דגימה ב-$T_s=1/f_s=10^{-4}$ שנ' נותנת $R_X[k]=10 sinc(10^4·k·10^{-4})=10 sinc(k)$. אך $sinc(k)=sin(πk)/(πk)=0$ לכל שלם $k$ שונה מאפס ושווה $1$ עבור $k=0$, ולכן $R_X[k]=10 δ[k]$: הדגימות בלתי מתואמות בשונות $10$ ואט, כלומר סדרה לבנה בזמן בדיד. זו הסיבה שדגימה בקצב נייקוויסט של רעש לבן חסום פס היא הדרך הקנונית לייצר דגימות לבנות.", "whyWrong": ["הביטוי $10 sinc(k)$ נכון אך ערכו נקרא שגוי: הסינק מתאפס בכל שלם שונה מאפס, ולכן דבר אינו שורד מחוץ ל-$k=0$.", "הערך $5$ חוצה את ההספק, כאילו הרצועה הייתה $[0,W]$ בלבד או כאילו הצפיפות הדו-צדדית נספרה פעם אחת.", "הערך $10^{-3}$ הוא הגובה הספקטרלי בואט/הרץ; השונות היא אותו גובה מוכפל ברוחב הרצועה הדו-צדדית של $10$ קילוהרץ."]}}, {"id": "smp-005", "area": "sampling", "topic": "quantisation-noise-power-and-snr", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["quantisation", "uniform-noise", "snr", "decibels"], "answer": 2, "en": {"q": "A uniform quantiser has step $Δ=6$ mV and its error is modelled as uniform on $[-Δ/2,Δ/2]$. The signal power is $0.3$ W. Give the quantisation noise power and the SNR in dB.", "options": ["$36$ μW and $39.2$ dB", "$12$ μW and $44.0$ dB", "$3$ μW and $50$ dB", "$18$ μW and $42.2$ dB"], "hint": "A uniform variable on an interval of width $Δ$ has variance $Δ^2/12$, not $Δ^2$ or $Δ^2/2$. Then $SNR_{dB}=10log_{10}(P_s/P_q)$.", "explanation": "For $e∼U[-Δ/2,Δ/2]$ the mean is $0$ and the variance is the standard result $Δ^2/12$. With $Δ=6×10^{-3}$ V, $Δ^2=36×10^{-6}$ and $P_q=36×10^{-6}/12=3×10^{-6}$ W $=3$ μW. The signal-to-quantisation-noise ratio is $P_s/P_q=0.3/(3×10^{-6})=10^5$, i.e. $10log_{10}(10^5)=50$ dB exactly. This is the model behind $SNR≈6.02b+1.76$ dB for a full-scale sinusoid: each extra bit halves $Δ$, divides $P_q$ by $4$ and buys about $6$ dB.", "whyWrong": ["$36$ μW is $Δ^2$, the squared step itself, which is the variance of no distribution used here.", "$12$ μW is $Δ^2/3$, the second moment of a uniform variable on $[0,Δ]$ about the origin, not the variance about the mean.", "$18$ μW is $Δ^2/2$, a common guess that confuses the width of the interval with a standard deviation."]}, "he": {"q": "לקוונטייזר אחיד צעד $Δ=6$ מילי-וולט ושגיאתו ממודלת כאחידה על $[-Δ/2,Δ/2]$. הספק האות הוא $0.3$ ואט. תן את הספק רעש הקוונטיזציה ואת ה-SNR בדציבלים.", "options": ["$36$ מיקרו-ואט ו-$39.2$ dB", "$12$ מיקרו-ואט ו-$44.0$ dB", "$3$ מיקרו-ואט ו-$50$ dB", "$18$ מיקרו-ואט ו-$42.2$ dB"], "hint": "משתנה אחיד על קטע ברוחב $Δ$ בעל שונות $Δ^2/12$, ולא $Δ^2$ או $Δ^2/2$. לאחר מכן $SNR_{dB}=10log_{10}(P_s/P_q)$.", "explanation": "עבור $e∼U[-Δ/2,Δ/2]$ התוחלת היא $0$ והשונות היא התוצאה הסטנדרטית $Δ^2/12$. עם $Δ=6×10^{-3}$ וולט מתקבל $Δ^2=36×10^{-6}$ ולכן $P_q=36×10^{-6}/12=3×10^{-6}$ ואט, כלומר $3$ מיקרו-ואט. יחס האות לרעש הקוונטיזציה הוא $P_s/P_q=0.3/(3×10^{-6})=10^5$, כלומר $10log_{10}(10^5)=50$ dB בדיוק. זהו המודל שמאחורי $SNR≈6.02b+1.76$ dB עבור סינוס בסקאלה מלאה: כל ביט נוסף חוצה את $Δ$, מחלק את $P_q$ ב-$4$ וקונה כ-$6$ dB.", "whyWrong": ["הערך $36$ מיקרו-ואט הוא $Δ^2$, ריבוע הצעד עצמו, שאינו שונות של אף התפלגות המשמשת כאן.", "הערך $12$ מיקרו-ואט הוא $Δ^2/3$, המומנט השני של משתנה אחיד על $[0,Δ]$ סביב הראשית ולא השונות סביב התוחלת.", "הערך $18$ מיקרו-ואט הוא $Δ^2/2$, ניחוש נפוץ המבלבל בין רוחב הקטע לבין סטיית תקן."]}}, {"id": "smp-006", "area": "sampling", "topic": "narrowband-noise-representation", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["narrowband", "complex-baseband", "in-phase-quadrature", "noise-power"], "en": {"q": "Bandpass noise $n(t)$ is zero-mean WSS with $S_n(f)=N_0/2$ for $f_c-W≤|f|≤f_c+W$ and $0$ elsewhere ($W<f_c$). Derive the PSDs and powers of $n_I,n_Q$, show they are uncorrelated, and give the complex baseband PSD.", "hint": "Write $n(t)=n_I(t)cos(2πf_ct)-n_Q(t)sin(2πf_ct)$. The lowpass PSD is the sum of the two shifted copies; the cross-PSD is the difference, times $j$.", "modelAnswer": "Representation. Any bandpass WSS process can be written $n(t)=n_I(t)cos(2πf_ct)-n_Q(t)sin(2πf_ct)$ with $n_I,n_Q$ jointly WSS, zero-mean, and lowpass with bandwidth $W$. Equivalently $n(t)=Re(ñ(t)e^{j2πf_ct})$ with complex envelope $ñ(t)=n_I(t)+jn_Q(t)$. Lowpass PSDs. The standard relations are $S_{n_I}(f)=S_{n_Q}(f)=S_n(f-f_c)+S_n(f+f_c)$ for $|f|≤W$ and $0$ otherwise. Here each shifted copy contributes $N_0/2$ on $|f|≤W$: the copy $S_n(f-f_c)$ supplies the part of the spectrum originally at positive frequencies and $S_n(f+f_c)$ the part at negative frequencies. Hence $S_{n_I}(f)=S_{n_Q}(f)=N_0$ for $|f|≤W$, flat and lowpass. Powers. $E[n_I^2]=E[n_Q^2]=∫_{-W}^{W}N_0 df=2N_0W$. Compare with the bandpass power $E[n^2]=∫S_n(f)df=(N_0/2)(4W)=2N_0W$, since the passband occupies total width $4W$ counting both sides. So $E[n_I^2]=E[n_Q^2]=E[n^2]$: the components carry the same power as the bandpass process, which is the reason for the specific scaling of the representation. Uncorrelatedness. The cross-spectrum is $S_{n_In_Q}(f)=j[S_n(f+f_c)-S_n(f-f_c)]$ for $|f|≤W$. Because $S_n$ is symmetric about $f_c$ over the passband, the two shifted copies coincide and the bracket vanishes identically, so $S_{n_In_Q}(f)≡0$ and therefore $R_{n_In_Q}(τ)=0$ for every $τ$. In particular $E[n_I(t)n_Q(t)]=0$: the components are uncorrelated at all lags, and if $n$ is Gaussian they are independent processes. Symmetry of $S_n$ about $f_c$ is essential; for an asymmetric passband the cross-spectrum is nonzero and the components are correlated. Complex baseband. $R_ñ(τ)=E[ñ(t+τ)ñ^*(t)]=R_{n_I}(τ)+R_{n_Q}(τ)+j[R_{n_Qn_I}(τ)-R_{n_In_Q}(τ)]=2R_{n_I}(τ)$, so $S_ñ(f)=2N_0$ for $|f|≤W$ and $E[|ñ|^2]=4N_0W=2E[n^2]$. In this description the complex envelope is a circularly symmetric complex process whose real and imaginary parts each carry $2N_0W$.", "rubric": ["Writes the narrowband representation with $n_I,n_Q$ lowpass of bandwidth $W$, or equivalently $n(t)=Re(ñ(t)e^{j2πf_ct})$.", "Derives $S_{n_I}=S_{n_Q}=S_n(f-f_c)+S_n(f+f_c)=N_0$ on $|f|≤W$.", "Computes $E[n_I^2]=E[n_Q^2]=2N_0W$ and checks it equals the bandpass power $E[n^2]$.", "Shows the cross-spectrum vanishes because $S_n$ is symmetric about $f_c$, hence $R_{n_In_Q}(τ)=0$ for all $τ$.", "Gives $S_ñ(f)=2N_0$ on $|f|≤W$ with $E[|ñ|^2]=4N_0W$, or an equivalent correct complex-baseband statement."]}, "he": {"q": "רעש פס-מעבר $n(t)$ הוא WSS בעל תוחלת אפס עם $S_n(f)=N_0/2$ עבור $f_c-W≤|f|≤f_c+W$ ו-$0$ אחרת (‏$W<f_c$). גזור את ה-PSD וההספקים של $n_I,n_Q$, הראה שהם בלתי מתואמים, ותן את ה-PSD בפס בסיס מרוכב.", "hint": "רשום $n(t)=n_I(t)cos(2πf_ct)-n_Q(t)sin(2πf_ct)$. ה-PSD בפס בסיס הוא סכום שני העותקים המוזזים; הספקטרום ההדדי הוא ההפרש, כפול $j$.", "modelAnswer": "ייצוג. כל תהליך WSS פס-מעבר ניתן לכתיבה כ-$n(t)=n_I(t)cos(2πf_ct)-n_Q(t)sin(2πf_ct)$ כאשר $n_I,n_Q$ הם WSS במשותף, בעלי תוחלת אפס, ומסוננים נמוך ברוחב פס $W$. שקול לכך, $n(t)=Re(ñ(t)e^{j2πf_ct})$ עם מעטפת מרוכבת $ñ(t)=n_I(t)+jn_Q(t)$. ה-PSD בפס נמוך. היחסים הסטנדרטיים הם $S_{n_I}(f)=S_{n_Q}(f)=S_n(f-f_c)+S_n(f+f_c)$ עבור $|f|≤W$ ואפס אחרת. כאן כל עותק מוזז תורם $N_0/2$ על $|f|≤W$: העותק $S_n(f-f_c)$ מספק את החלק שהיה במקור בתדרים חיוביים ו-$S_n(f+f_c)$ את החלק שבתדרים שליליים. מכאן $S_{n_I}(f)=S_{n_Q}(f)=N_0$ עבור $|f|≤W$, שטוח ובפס נמוך. הספקים. $E[n_I^2]=E[n_Q^2]=∫_{-W}^{W}N_0 df=2N_0W$. להשוואה, הספק פס המעבר הוא $E[n^2]=∫S_n(f)df=(N_0/2)(4W)=2N_0W$, שכן פס המעבר תופס רוחב כולל $4W$ בספירת שני הצדדים. לכן $E[n_I^2]=E[n_Q^2]=E[n^2]$: הרכיבים נושאים אותו הספק כמו תהליך פס המעבר, וזו הסיבה לקנה המידה הספציפי של הייצוג. חוסר מתאם. הספקטרום ההדדי הוא $S_{n_In_Q}(f)=j[S_n(f+f_c)-S_n(f-f_c)]$ עבור $|f|≤W$. מכיוון ש-$S_n$ סימטרי סביב $f_c$ על פני פס המעבר, שני העותקים המוזזים מתלכדים והסוגריים מתאפסים זהותית, ולכן $S_{n_In_Q}(f)≡0$ ומכאן $R_{n_In_Q}(τ)=0$ לכל $τ$. בפרט $E[n_I(t)n_Q(t)]=0$: הרכיבים בלתי מתואמים בכל פיגור, ואם $n$ גאוסי הם תהליכים בלתי תלויים. הסימטריה של $S_n$ סביב $f_c$ חיונית; עבור פס לא סימטרי הספקטרום ההדדי אינו מתאפס והרכיבים מתואמים. פס בסיס מרוכב. $R_ñ(τ)=E[ñ(t+τ)ñ^*(t)]=R_{n_I}(τ)+R_{n_Q}(τ)+j[R_{n_Qn_I}(τ)-R_{n_In_Q}(τ)]=2R_{n_I}(τ)$, ולכן $S_ñ(f)=2N_0$ עבור $|f|≤W$ וכן $E[|ñ|^2]=4N_0W=2E[n^2]$. בתיאור זה המעטפת המרוכבת היא תהליך מרוכב סימטרי מעגלית שחלקיו הממשי והמדומה נושאים כל אחד $2N_0W$.", "rubric": ["רושם את הייצוג הצר-פס עם $n_I,n_Q$ בפס נמוך ברוחב $W$, או שקול לכך $n(t)=Re(ñ(t)e^{j2πf_ct})$.", "גוזר $S_{n_I}=S_{n_Q}=S_n(f-f_c)+S_n(f+f_c)=N_0$ על $|f|≤W$.", "מחשב $E[n_I^2]=E[n_Q^2]=2N_0W$ ומוודא שזה שווה להספק פס המעבר $E[n^2]$.", "מראה שהספקטרום ההדדי מתאפס בשל הסימטריה של $S_n$ סביב $f_c$, ומכאן $R_{n_In_Q}(τ)=0$ לכל $τ$.", "נותן $S_ñ(f)=2N_0$ על $|f|≤W$ עם $E[|ñ|^2]=4N_0W$, או טענה שקולה נכונה על פס הבסיס המרוכב."]}}, {"id": "exm-001", "area": "exam", "topic": "wss-versus-ergodic", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["wss", "ergodicity", "time-average", "counterexample"], "answer": 3, "en": {"q": "Which statement about stationarity and ergodicity is correct?", "options": ["Every WSS process is mean-ergodic, because its mean does not depend on $t$", "Ergodicity and stationarity are equivalent except for non-Gaussian processes", "If $R_X(t,t+τ)$ depends only on $τ$, time averages must converge to ensemble averages", "WSS need not be ergodic: $X(t)=A$ with random $A$ is a counterexample"], "hint": "Ergodicity is a statement about a single realisation. Ask whether one infinitely long record can reveal the whole ensemble.", "explanation": "WSS is a second-moment condition on the ensemble: $E[X(t)]=μ_X$ constant and $E[X(t)X(t+τ)]=R_X(τ)$. Ergodicity is a much stronger statement about individual sample paths, namely that the time average $(1/2T)∫_{-T}^{T}X(t)dt$ converges to $μ_X$. Take $X(t)=A$ with $A$ zero-mean of variance $σ^2$: then $E[X(t)]=0$ and $R_X(τ)=σ^2$ for all $τ$, so the process is WSS, yet each realisation is a constant and its time average is $A$, which is random and not equal to $0$. The failure is visible in the standard criterion: mean-ergodicity requires the covariance to decay, e.g. $(1/T)∫_0^{T}C_X(τ)dτ→0$, and here $C_X(τ)=σ^2$ never decays.", "whyWrong": ["A constant ensemble mean says nothing about whether one realisation explores the ensemble; the counterexample $X(t)=A$ settles it.", "The gap has nothing to do with Gaussianity: a Gaussian $X(t)=A$ with $A∼N(0,σ^2)$ is WSS and still not ergodic.", "That condition is precisely the definition of WSS, so restating it cannot deliver ergodicity; a decaying covariance is what is needed."]}, "he": {"q": "איזו טענה על סטציונריות וארגודיות נכונה?", "options": ["כל תהליך WSS ארגודי בתוחלת, כי התוחלת שלו אינה תלויה ב-$t$", "ארגודיות וסטציונריות שקולות פרט לתהליכים שאינם גאוסיים", "אם $R_X(t,t+τ)$ תלוי רק ב-$τ$, ממוצעי זמן חייבים להתכנס לממוצעי אנסמבל", "WSS אינו גורר ארגודיות: $X(t)=A$ עם $A$ אקראי הוא דוגמה נגדית"], "hint": "ארגודיות היא טענה על מימוש בודד. שאל אם רשומה אחת אינסופית באורכה יכולה לחשוף את כל האנסמבל.", "explanation": "WSS הוא תנאי מומנט שני על האנסמבל: $E[X(t)]=μ_X$ קבוע וכן $E[X(t)X(t+τ)]=R_X(τ)$. ארגודיות היא טענה חזקה בהרבה על מסלולים מדגמיים בודדים, כלומר שממוצע הזמן $(1/2T)∫_{-T}^{T}X(t)dt$ מתכנס ל-$μ_X$. ניקח $X(t)=A$ כאשר $A$ בעל תוחלת אפס ושונות $σ^2$: אז $E[X(t)]=0$ וכן $R_X(τ)=σ^2$ לכל $τ$, ולכן התהליך WSS, ובכל זאת כל מימוש הוא קבוע וממוצע הזמן שלו הוא $A$, שהוא אקראי ואינו שווה ל-$0$. הכישלון גלוי בקריטריון הסטנדרטי: ארגודיות בתוחלת דורשת דעיכה של השונות המשותפת, למשל $(1/T)∫_0^{T}C_X(τ)dτ→0$, וכאן $C_X(τ)=σ^2$ אינו דועך לעולם.", "whyWrong": ["תוחלת אנסמבל קבועה אינה אומרת דבר על כך שמימוש יחיד סורק את האנסמבל; הדוגמה הנגדית $X(t)=A$ מכריעה זאת.", "הפער אינו קשור כלל לגאוסיות: תהליך גאוסי $X(t)=A$ עם $A∼N(0,σ^2)$ הוא WSS ועדיין אינו ארגודי.", "התנאי הזה הוא בדיוק הגדרת WSS, ולכן חזרה עליו אינה יכולה לספק ארגודיות; מה שנדרש הוא דעיכה של השונות המשותפת."]}}, {"id": "exm-002", "area": "exam", "topic": "lti-output-psd-and-mean", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["lti", "output-psd", "transfer-function", "output-mean"], "answer": 0, "en": {"q": "A WSS process $X(t)$ with mean $μ_X$ enters a stable LTI filter with impulse response $h(t)$ and transfer function $H(f)$. Which statement is correct?", "options": ["$S_Y(f)=|H(f)|^2S_X(f)$ and $μ_Y=μ_XH(0)$", "$S_Y(f)=H(f)S_X(f)$ and $μ_Y=μ_XH(0)$", "$S_Y(f)=|H(f)|^2S_X(f)$ and $μ_Y(t)=(h*μ_X)(t)$ is time-varying", "$S_Y(f)=|H(f)|S_X(f)$ and $μ_Y=μ_X|H(0)|$"], "hint": "A PSD is real and non-negative, so whatever multiplies $S_X$ must be too. For the mean, push the expectation through the convolution integral.", "explanation": "In the time domain $R_Y(τ)=R_X(τ)*h(τ)*h(-τ)$, and transforming turns the two convolutions into $H(f)H^*(f)=|H(f)|^2$. So $S_Y(f)=|H(f)|^2S_X(f)$; note $S_Y$ must be real and non-negative, which $H(f)S_X(f)$ generally is not since $H$ is complex. For the mean, $E[Y(t)]=E[∫h(s)X(t-s)ds]=∫h(s)E[X(t-s)]ds=μ_X∫h(s)ds=μ_XH(0)$. The mean of the output is indeed the output of the mean, but the output of a constant input is a constant: convolving the constant $μ_X$ with $h$ gives $μ_XH(0)$, not a time-varying signal. The phase of $H$ therefore affects sample paths but neither the output PSD nor the output mean.", "whyWrong": ["$H(f)S_X(f)$ is complex in general and can even be negative on the real axis, so it cannot be a PSD; the filter acts twice, once on each factor.", "The convolution of the constant $μ_X$ with $h$ is the constant $μ_X∫h=μ_XH(0)$; a WSS input into a time-invariant filter cannot produce a time-varying mean.", "Using $|H|$ rather than $|H|^2$ loses one factor: an amplifier with $|H|=10$ raises power by $100$, not by $10$."]}, "he": {"q": "תהליך WSS בשם $X(t)$ עם תוחלת $μ_X$ נכנס למסנן LTI יציב בעל תגובת הלם $h(t)$ ופונקציית תמסורת $H(f)$. איזו טענה נכונה?", "options": ["$S_Y(f)=|H(f)|^2S_X(f)$ וכן $μ_Y=μ_XH(0)$", "$S_Y(f)=H(f)S_X(f)$ וכן $μ_Y=μ_XH(0)$", "$S_Y(f)=|H(f)|^2S_X(f)$ וכן $μ_Y(t)=(h*μ_X)(t)$ משתנה בזמן", "$S_Y(f)=|H(f)|S_X(f)$ וכן $μ_Y=μ_X|H(0)|$"], "hint": "PSD הוא ממשי ואי-שלילי, ולכן כל מה שמכפיל את $S_X$ חייב להיות כזה גם כן. עבור התוחלת, העבר את התוחלת דרך אינטגרל הקונבולוציה.", "explanation": "במישור הזמן $R_Y(τ)=R_X(τ)*h(τ)*h(-τ)$, וההתמרה הופכת את שתי הקונבולוציות ל-$H(f)H^*(f)=|H(f)|^2$. לכן $S_Y(f)=|H(f)|^2S_X(f)$; שים לב ש-$S_Y$ חייב להיות ממשי ואי-שלילי, מה ש-$H(f)S_X(f)$ בדרך כלל אינו שכן $H$ מרוכב. עבור התוחלת, $E[Y(t)]=E[∫h(s)X(t-s)ds]=∫h(s)E[X(t-s)]ds=μ_X∫h(s)ds=μ_XH(0)$. אכן תוחלת המוצא היא המוצא של התוחלת, אך המוצא של כניסה קבועה הוא קבוע: קונבולוציה של הקבוע $μ_X$ עם $h$ נותנת $μ_XH(0)$ ולא אות המשתנה בזמן. לכן הפאזה של $H$ משפיעה על מסלולים מדגמיים אך לא על ה-PSD במוצא ולא על תוחלת המוצא.", "whyWrong": ["הביטוי $H(f)S_X(f)$ מרוכב בדרך כלל ואף עשוי להיות שלילי על הציר הממשי, ולכן אינו יכול להיות PSD; המסנן פועל פעמיים, פעם על כל גורם.", "הקונבולוציה של הקבוע $μ_X$ עם $h$ היא הקבוע $μ_X∫h=μ_XH(0)$; כניסת WSS למסנן קבוע בזמן אינה יכולה לייצר תוחלת המשתנה בזמן.", "שימוש ב-$|H|$ במקום ב-$|H|^2$ מאבד גורם אחד: מגבר עם $|H|=10$ מעלה הספק פי $100$ ולא פי $10$."]}}, {"id": "exm-003", "area": "exam", "topic": "uncorrelated-independent-covariance", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["uncorrelated", "independence", "autocovariance", "orthogonality"], "answer": 1, "en": {"q": "Which statement is correct?", "options": ["Uncorrelated random variables are independent whenever both have finite variance", "$C_X(τ)=R_X(τ)-μ_X^2$, so $C_X$ and $R_X$ coincide only when $μ_X=0$", "For jointly Gaussian variables independence implies zero correlation but not conversely", "Orthogonality $E[XY]=0$ and uncorrelatedness $Cov(X,Y)=0$ mean the same for any $X,Y$"], "hint": "Three separate notions: $E[XY]=0$, $E[XY]=E[X]E[Y]$, and factorisation of the joint density. Where does the mean enter each one?", "explanation": "For a WSS process $C_X(τ)=E[(X(t)-μ_X)(X(t+τ)-μ_X)]=R_X(τ)-μ_X^2$, so the two functions differ by the constant $μ_X^2$ and agree exactly when the mean is zero. This one constant explains several exam errors: $R_X(∞)→μ_X^2$ rather than $0$, and a DC component shows up as an impulse $μ_X^2δ(f)$ in $S_X$ but not in the covariance spectrum. Uncorrelatedness is weaker than independence in general — $X∼U[-1,1]$ and $Y=X^2$ have $Cov=E[X^3]=0$ but $Y$ is a function of $X$ — and the two coincide only in the jointly Gaussian case. Orthogonality and uncorrelatedness coincide only when at least one mean is zero, since $Cov(X,Y)=E[XY]-E[X]E[Y]$.", "whyWrong": ["Finite variance is irrelevant: $X∼U[-1,1]$ with $Y=X^2$ has finite everything, zero covariance, and total dependence.", "For jointly Gaussian variables the implication runs both ways; that is the one family where zero correlation does give independence.", "They coincide only if $E[X]E[Y]=0$; with nonzero means, uncorrelated variables satisfy $E[XY]=E[X]E[Y]≠0$."]}, "he": {"q": "איזו טענה נכונה?", "options": ["משתנים אקראיים בלתי מתואמים בלתי תלויים כל עוד לשניהם שונות סופית", "$C_X(τ)=R_X(τ)-μ_X^2$, ולכן $C_X$ ו-$R_X$ מתלכדים רק כאשר $μ_X=0$", "עבור משתנים גאוסיים במשותף אי-תלות גוררת מתאם אפס אך לא להפך", "אורתוגונליות $E[XY]=0$ וחוסר מתאם $Cov(X,Y)=0$ היינו הך לכל $X,Y$"], "hint": "שלושה מושגים נפרדים: $E[XY]=0$, ‏$E[XY]=E[X]E[Y]$, ופירוק הצפיפות המשותפת. היכן נכנסת התוחלת בכל אחד?", "explanation": "עבור תהליך WSS מתקיים $C_X(τ)=E[(X(t)-μ_X)(X(t+τ)-μ_X)]=R_X(τ)-μ_X^2$, ולכן שתי הפונקציות נבדלות בקבוע $μ_X^2$ ומתלכדות בדיוק כאשר התוחלת מתאפסת. הקבוע היחיד הזה מסביר כמה שגיאות מבחן: ‏$R_X(∞)→μ_X^2$ ולא $0$, ורכיב DC מופיע כדלתא $μ_X^2δ(f)$ ב-$S_X$ אך לא בספקטרום השונות המשותפת. חוסר מתאם חלש מאי-תלות באופן כללי — עבור $X∼U[-1,1]$ ו-$Y=X^2$ מתקיים $Cov=E[X^3]=0$ אך $Y$ הוא פונקציה של $X$ — והשניים מתלכדים רק במקרה הגאוסי במשותף. אורתוגונליות וחוסר מתאם מתלכדים רק כאשר לפחות אחת התוחלות מתאפסת, שכן $Cov(X,Y)=E[XY]-E[X]E[Y]$.", "whyWrong": ["שונות סופית אינה רלוונטית: עבור $X∼U[-1,1]$ ו-$Y=X^2$ הכול סופי, השונות המשותפת מתאפסת, והתלות מוחלטת.", "עבור משתנים גאוסיים במשותף הגרירה דו-כיוונית; זו המשפחה היחידה שבה מתאם אפס אכן נותן אי-תלות.", "הם מתלכדים רק אם $E[X]E[Y]=0$; עם תוחלות שונות מאפס, משתנים בלתי מתואמים מקיימים $E[XY]=E[X]E[Y]≠0$."]}}, {"id": "exm-004", "area": "exam", "topic": "invalid-psd", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["psd", "validity", "even-symmetry", "non-negativity"], "answer": 2, "en": {"q": "Which function can NOT be the power spectral density of a real WSS process?", "options": ["$S(f)=e^{-f^2}$", "$S(f)=f^2/(1+f^4)$", "$S(f)=f/(1+f^4)$", "$S(f)=1/(1+f^2)+δ(f)$"], "hint": "A PSD must be real, non-negative and, for a real-valued process, an even function of $f$. Test each candidate at $f$ and at $-f$.", "explanation": "For a real WSS process $R_X(τ)$ is real and even, so $S_X(f)$ is real and even; and $S_X(f)≥0$ everywhere because it is a density of power. The function $f/(1+f^4)$ is odd, so it takes negative values for all $f<0$ and violates both requirements at once; no autocorrelation can transform to it. The Gaussian $e^{-f^2}$ is even and positive; $f^2/(1+f^4)$ is even and non-negative (it simply vanishes at $f=0$, which just means the process has no DC content); and $1/(1+f^2)+δ(f)$ is a legitimate mixed spectrum, the impulse representing a DC or periodic component and integrating to finite power.", "whyWrong": ["$e^{-f^2}$ is even, strictly positive and integrable; it is the PSD of a Gaussian-shaped autocorrelation.", "$f^2/(1+f^4)$ is even and non-negative; a zero at $f=0$ is allowed and simply means no power at DC.", "An impulse in the PSD is legal and standard: it carries the finite power of a DC or sinusoidal component."]}, "he": {"q": "איזו פונקציה אינה יכולה להיות צפיפות ספקטרלית של הספק (PSD) של תהליך WSS ממשי?", "options": ["$S(f)=e^{-f^2}$", "$S(f)=f^2/(1+f^4)$", "$S(f)=f/(1+f^4)$", "$S(f)=1/(1+f^2)+δ(f)$"], "hint": "PSD חייב להיות ממשי, אי-שלילי, ועבור תהליך ממשי גם פונקציה זוגית של $f$. בדוק כל מועמד ב-$f$ וב-$-f$.", "explanation": "עבור תהליך WSS ממשי הפונקציה $R_X(τ)$ ממשית וזוגית, ולכן $S_X(f)$ ממשי וזוגי; ובנוסף $S_X(f)≥0$ בכל מקום מפני שזו צפיפות של הספק. הפונקציה $f/(1+f^4)$ אי-זוגית, ולכן מקבלת ערכים שליליים לכל $f<0$ ומפרה את שתי הדרישות בבת אחת; אין פונקציית אוטוקורלציה שהתמרתה תיתן אותה. הגאוסיאן $e^{-f^2}$ זוגי וחיובי; הביטוי $f^2/(1+f^4)$ זוגי ואי-שלילי (הוא פשוט מתאפס ב-$f=0$, ומשמעות הדבר רק שאין לתהליך רכיב DC); והביטוי $1/(1+f^2)+δ(f)$ הוא ספקטרום מעורב לגיטימי, כשהדלתא מייצגת רכיב DC או מחזורי ואינטגרלה הספק סופי.", "whyWrong": ["הביטוי $e^{-f^2}$ זוגי, חיובי ממש ואינטגרבילי; זהו ה-PSD של אוטוקורלציה בצורת גאוסיאן.", "הביטוי $f^2/(1+f^4)$ זוגי ואי-שלילי; אפס ב-$f=0$ מותר ומשמעותו פשוט היעדר הספק ב-DC.", "דלתא ב-PSD חוקית וסטנדרטית: היא נושאת את ההספק הסופי של רכיב DC או סינוסואידלי."]}}];
const GLOSSARY = [{"term": "3 dB", "aliases": ["3dB", "3-dB", "half-power point"], "cs": false, "areas": [], "en": {"t": "3 dB", "d": "Half-power point: the level at which power falls to half of peak, the usual convention for defining bandwidth."}, "he": {"t": "3 dB", "d": "נקודת חצי-ההספק: הרמה שבה ההספק יורד לחצי מהשיא, המוסכמה המקובלת להגדרת רוחב-פס."}}, {"term": "absorbing state", "aliases": ["absorbing", "absorbing states"], "cs": false, "areas": [], "en": {"t": "Absorbing state", "d": "A Markov-chain state that, once entered, is never left; the chain remains there forever."}, "he": {"t": "Absorbing state", "d": "מצב בשרשרת מרקוב שברגע שנכנסים אליו לא יוצאים ממנו; השרשרת נשארת בו לתמיד."}}, {"term": "absorption time", "aliases": ["time to absorption"], "cs": false, "areas": [], "en": {"t": "Absorption time", "d": "In a Markov chain, the number of steps until the process first enters an absorbing state."}, "he": {"t": "Absorption time", "d": "בשרשרת מרקוב, מספר הצעדים עד שהתהליך נכנס לראשונה למצב בולע."}}, {"term": "AC", "aliases": ["AC component", "AC power"], "cs": true, "areas": [], "en": {"t": "AC", "d": "Alternating current: the engineers' name for the zero-mean fluctuating part of a signal, opposite of DC."}, "he": {"t": "AC", "d": "Alternating current: הכינוי ההנדסי לרכיב המשתנה בעל התוחלת האפסית של אות, בניגוד לרכיב ה-DC."}}, {"term": "aliasing", "aliases": ["aliased", "alias"], "cs": false, "areas": [], "en": {"t": "Aliasing", "d": "The corruption caused by sampling a signal too slowly, so that distinct frequencies become indistinguishable."}, "he": {"t": "Aliasing", "d": "העיוות הנוצר כשדוגמים אות בקצב נמוך מדי, כך שתדרים שונים הופכים לבלתי ניתנים להבחנה."}}, {"term": "all-pass", "aliases": ["allpass", "all pass", "all-pass filter"], "cs": false, "areas": [], "en": {"t": "All-pass filter", "d": "A filter that passes every frequency with unchanged magnitude and modifies only the phase."}, "he": {"t": "All-pass filter", "d": "מסנן שמעביר כל תדר ללא שינוי בעוצמה ומשנה רק את הפאזה."}}, {"term": "almost sure", "aliases": ["almost surely", "almost sure convergence", "a.s."], "cs": false, "areas": [], "en": {"t": "Almost sure", "d": "Measure-theoretic phrase meaning 'with probability 1'; it qualifies statements that may still fail on a negligible set of outcomes."}, "he": {"t": "Almost sure", "d": "ביטוי מתורת המידה שמשמעותו 'בהסתברות 1'; הוא מסייג טענות שעשויות עדיין להיכשל על קבוצת מאורעות זניחה."}}, {"term": "antipodal", "aliases": ["antipodal signaling", "antipodal signalling", "antipodal signals"], "cs": false, "areas": [], "en": {"t": "Antipodal signaling", "d": "Binary signalling in which the two transmitted waveforms are exact negatives of one another."}, "he": {"t": "Antipodal signaling", "d": "שידור בינארי שבו שני הגלים המשודרים הם הופכיים בסימן זה לזה."}}, {"term": "aperiodicity", "aliases": ["aperiodic"], "cs": false, "areas": [], "en": {"t": "Aperiodicity", "d": "Markov-chain property: returns to a state are not confined to multiples of some fixed period."}, "he": {"t": "Aperiodicity", "d": "תכונה של שרשרת מרקוב: החזרות למצב אינן כלואות בכפולות של מחזור קבוע כלשהו."}}, {"term": "AR", "aliases": ["autoregressive"], "cs": true, "areas": [], "en": {"t": "AR", "d": "Autoregressive: a model whose present sample is a linear combination of its own past samples plus noise."}, "he": {"t": "AR", "d": "Autoregressive: מודל שבו הדגימה הנוכחית היא צירוף לינארי של דגימות העבר שלה בתוספת רעש."}}, {"term": "AR(1)", "aliases": ["ar1", "AR-1", "first-order autoregressive"], "cs": false, "areas": [], "en": {"t": "AR(1)", "d": "First-order autoregressive process, each sample driven by the previous one plus fresh white noise; the workhorse model for spectra and prediction."}, "he": {"t": "AR(1)", "d": "תהליך אוטורגרסיבי מסדר ראשון, שבו כל דגימה מונעת מהדגימה הקודמת בתוספת רעש לבן חדש; מודל העבודה לספקטרום וניבוי."}}, {"term": "ARMA", "aliases": ["autoregressive moving average"], "cs": false, "areas": [], "en": {"t": "ARMA", "d": "Autoregressive moving-average: the Box-Jenkins model class combining past outputs with past noise inputs, yielding rational spectra."}, "he": {"t": "ARMA", "d": "Autoregressive moving average: משפחת מודלים בסגנון Box-Jenkins המשלבת פלטי עבר עם כניסות רעש קודמות ומניבה ספקטרום רציונלי."}}, {"term": "arrival average", "aliases": ["arrival-average", "arrival averages"], "cs": false, "areas": [], "en": {"t": "Arrival average", "d": "A queueing average computed over the customers who arrive, rather than over the passage of time."}, "he": {"t": "Arrival average", "d": "ממוצע בתורים המחושב על פני הלקוחות המגיעים, ולא על פני מהלך הזמן."}}, {"term": "AUC", "aliases": ["area under the ROC curve", "area under ROC"], "cs": true, "areas": [], "en": {"t": "AUC", "d": "Area Under the Curve: the area beneath a detector's ROC curve, a single-number summary of its quality."}, "he": {"t": "AUC", "d": "Area under the curve: השטח מתחת לעקומת ה-ROC של גלאי, מדד מספרי יחיד לאיכותו."}}, {"term": "auto-spectrum", "aliases": ["autospectrum", "auto spectrum"], "cs": false, "areas": [], "en": {"t": "Auto-spectrum", "d": "The power spectral density of a single process, as opposed to the cross-spectrum of a pair."}, "he": {"t": "Auto-spectrum", "d": "צפיפות ההספק הספקטרלית של תהליך יחיד, בניגוד לספקטרום ההדדי של זוג תהליכים."}}, {"term": "autocorrelation", "aliases": ["autocorrelation function", "auto-correlation"], "cs": false, "areas": [], "en": {"t": "Autocorrelation", "d": "The function $R_X(τ)$ describing the correlation between a process's values at two time instants."}, "he": {"t": "Autocorrelation", "d": "הפונקציה $R_X(τ)$ המתארת את המתאם בין ערכי התהליך בשתי נקודות זמן."}}, {"term": "autocovariance", "aliases": ["auto-covariance", "autocovariance function"], "cs": false, "areas": [], "en": {"t": "Autocovariance", "d": "The covariance between a process's values at two time instants, written $C_X$; it underlies variance and ergodicity calculations."}, "he": {"t": "Autocovariance", "d": "השונות המשותפת בין ערכי התהליך בשתי נקודות זמן, מסומנת $C_X$; עומדת בבסיס חישובי שונות ותנאי ארגודיות."}}, {"term": "AWGN", "aliases": ["additive white Gaussian noise"], "cs": false, "areas": [], "en": {"t": "AWGN", "d": "Additive White Gaussian Noise: the standard idealised channel-noise model of communication and detection theory."}, "he": {"t": "AWGN", "d": "Additive white Gaussian noise: מודל רעש הערוץ האידיאלי הסטנדרטי של תורת התקשורת והגילוי."}}, {"term": "balance equations", "aliases": ["balance equation", "global balance", "global balance equations"], "cs": false, "areas": [], "en": {"t": "Balance equations", "d": "The Markov-chain equations equating the probability flow into and out of each state in steady state."}, "he": {"t": "Balance equations", "d": "משוואות שרשרת מרקוב המשוות את זרימת ההסתברות הנכנסת והיוצאת מכל מצב במצב היציב."}}, {"term": "Bayes risk", "aliases": [], "cs": false, "areas": [], "en": {"t": "Bayes risk", "d": "The average cost of a decision rule under given priors and costs; minimising it defines the Bayes detector."}, "he": {"t": "Bayes risk", "d": "העלות הממוצעת של כלל החלטה בהינתן הסתברויות קדם ועלויות; מזעורה מגדיר את גלאי Bayes."}}, {"term": "bias-variance decomposition", "aliases": ["bias variance decomposition", "bias-variance", "bias variance", "bias-variance tradeoff"], "cs": false, "areas": [], "en": {"t": "Bias-variance decomposition", "d": "The classical split of an estimator's mean-squared error into a squared-bias term and a variance term."}, "he": {"t": "Bias-variance decomposition", "d": "הפירוק הקלאסי של שגיאת הריבועים הממוצעת של אומד לרכיב הטיה בריבוע ולרכיב שונות."}}, {"term": "birth-death process", "aliases": ["birth-death", "birth death", "birth and death process", "birth-death chain"], "cs": false, "areas": [], "en": {"t": "Birth-death process", "d": "A Markov chain on the integers whose transitions go only to neighbouring states; the backbone of queueing models."}, "he": {"t": "Birth-death process", "d": "שרשרת  = P(X ≤ x)$ that fully specifies a random variable's law."}, "he": {"t": "CDF", "d": "Cumulative distribution function: הפונקציה $F_X(x) = P(X ≤ x)$ המאפיינת באופן מלא את התפלגות המשתנה המקרי."}}, {"term": "central limit theorem", "aliases": [], "cs": false, "areas": [], "en": {"t": "Central limit theorem", "d": "The classical theorem of Laplace, Lyapunov and Lindeberg: normalised sums of many independent variables become Gaussian."}, "he": {"t": "Central limit theorem", "d": "המשפט הקלאסי של Laplace, Lyapunov ו-Lindeberg: סכומים מנורמלים של משתנים בלתי תלויים רבים מתקרבים לגאוסי."}}, {"term": "change of measure", "aliases": ["change-of-measure"], "cs": false, "areas": [], "en": {"t": "Change of measure", "d": "Reweighting probabilities from one law to another through a likelihood ratio, the Radon-Nikodym derivative."}, "he": {"t": "Change of measure", "d": "שקלול מחדש של הסתברויות מהתפלגות אחת לאחרת באמצעות יחס נראות, הנגזרת של Radon-Nikodym."}}, {"term": "Chapman-Kolmogorov", "aliases": ["chapman kolmogorov", "Chapman-Kolmogorov equations"], "cs": false, "areas": [], "en": {"t": "Chapman-Kolmogorov", "d": "The equations of Chapman and Kolmogorov linking multi-step Markov transition probabilities to shorter-step ones."}, "he": {"t": "Chapman-Kolmogorov", "d": "המשוואות של Chapman ו-Kolmogorov הקושרות הסתברויות מעבר מרקוביות בכמה צעדים לאלה של צעדים קצרים יותר."}}, {"term": "characteristic function", "aliases": [], "cs": false, "areas": [], "en": {"t": "Characteristic function", "d": "The expectation $E[exp(jωX)]$: a Fourier-domain description of a distribution that determines it uniquely."}, "he": {"t": "Characteristic function", "d": "התוחלת $E[exp(jωX)]$: תיאור של התפלגות בתחום פורייה, הקובע אותה באופן חד-ערכי."}}, {"term": "Chebyshev's inequality", "aliases": ["Chebyshev", "chebyshev inequality"], "cs": false, "areas": [], "en": {"t": "Chebyshev's inequality", "d": "Pafnuty Chebyshev's nineteenth-century bound on the probability that a random variable strays far from its mean."}, "he": {"t": "Chebyshev's inequality", "d": "החסם של Pafnuty Chebyshev מהמאה ה-19 על ההסתברות שמשתנה מקרי סוטה הרחק מתוחלתו."}}, {"term": "chi-square", "aliases": ["chi square", "chi-squared", "chi squared"], "cs": false, "areas": [], "en": {"t": "Chi-square distribution", "d": "The distribution of a sum of squared independent standard Gaussians, indexed by its degrees of freedom."}, "he": {"t": "Chi-square distribution", "d": "התפלגות של סכום ריבועים של גאוסים סטנדרטיים בלתי תלויים, המאופיינת במספר דרגות החופש."}}, {"term": "CLT", "aliases": [], "cs": true, "areas": [], "en": {"t": "CLT", "d": "Central Limit Theorem: the classical result that normalised sums of independent random variables converge to a Gaussian."}, "he": {"t": "CLT", "d": "Central limit theorem: התוצאה הקלאסית שלפיה סכומים מנורמלים של משתנים מקריים בלתי תלויים מתכנסים לגאוסי."}}, {"term": "coherence", "aliases": ["magnitude-squared coherence", "coherence function"], "cs": false, "areas": [], "en": {"t": "Coherence", "d": "Frequency-domain measure of how linearly two processes are related, normalised to lie between 0 and 1."}, "he": {"t": "Coherence", "d": "מדד בתחום התדר לרמת הקשר הלינארי בין שני תהליכים, מנורמל לתחום שבין 0 ל-1."}}, {"term": "coloured noise", "aliases": ["colored noise", "coloured", "colored"], "cs": false, "areas": [], "en": {"t": "Coloured noise", "d": "Any noise whose power spectral density is not flat, that is, anything other than white noise."}, "he": {"t": "Coloured noise", "d": "רעש שצפיפות ההספק הספקטרלית שלו אינה שטוחה, כלומר כל רעש שאינו רעש לבן."}}, {"term": "complex baseband", "aliases": ["complex envelope", "baseband equivalent"], "cs": false, "areas": [], "en": {"t": "Complex baseband", "d": "The equivalent low-frequency complex representation of a bandpass signal, standard in communications analysis."}, "he": {"t": "Complex baseband", "d": "הייצוג המרוכב שקול-הבסיס בתדר נמוך של אות פס-מעבר, ייצוג סטנדרטי בניתוח מערכות תקשורת."}}, {"term": "conditional uniformity", "aliases": [], "cs": false, "areas": [], "en": {"t": "Conditional uniformity", "d": "The Poisson-process property describing how the arrival instants are distributed once their number in an interval is fixed."}, "he": {"t": "Conditional uniformity", "d": "תכונת תהליך פואסון המתארת כיצד מתפלגים רגעי ההגעות לאחר שמספרן בקטע נתון קבוע."}}, {"term": "conjugate symmetry", "aliases": [], "cs": false, "areas": [], "en": {"t": "Conjugate symmetry", "d": "A symmetry constraint that the Fourier transform of any real signal or correlation function must satisfy; a staple of spectral derivations."}, "he": {"t": "Conjugate symmetry", "d": "אילוץ סימטריה שכל התמרת Fourier של אות ממשי או של פונקציית מתאם חייבת לקיים; כלי בסיסי בפיתוחים ספקטרליים."}}, {"term": "consistent estimator", "aliases": ["consistency", "consistent"], "cs": false, "areas": [], "en": {"t": "Consistent estimator", "d": "An estimator that converges to the true parameter value as the number of observations grows without bound."}, "he": {"t": "Consistent estimator", "d": "אומד המתכנס לערך הפרמטר האמיתי כאשר מספר התצפיות גדל ללא גבול."}}, {"term": "correlation time", "aliases": [], "cs": false, "areas": [], "en": {"t": "Correlation time", "d": "The lag beyond which a process's samples are effectively uncorrelated, a rough measure of its memory length."}, "he": {"t": "Correlation time", "d": "ההשהיה שמעבר לה דגימות התהליך כמעט בלתי מתואמות, מדד גס לאורך הזיכרון שלו."}}, {"term": "correlator", "aliases": ["correlation receiver"], "cs": false, "areas": [], "en": {"t": "Correlator", "d": "Receiver structure that multiplies the observation by a reference waveform and integrates; the classic detector implementation."}, "he": {"t": "Correlator", "d": "מבנה מקלט שמכפיל את התצפית בגל ייחוס ומבצע אינטגרציה; המימוש הקלאסי של גלאי."}}, {"term": "Cramér-Rao", "aliases": ["Cramer-Rao", "cramer rao", "Cramér-Rao bound", "Cramer-Rao bound", "Cramer-Rao lower bound", "CRLB"], "cs": false, "areas": [], "en": {"t": "Cramér-Rao bound", "d": "A 1945 result of Harald Cramér and C. R. Rao limiting the accuracy attainable in parameter estimation, stated through Fisher information."}, "he": {"t": "Cramér-Rao bound", "d": "תוצאה משנת 1945 של Harald Cramér ו-C. R. Rao המגבילה את הדיוק שניתן להשיג באמידת פרמטר, מנוסחת באמצעות אינפורמציית Fisher."}}, {"term": "cross-correlation", "aliases": ["cross correlation", "crosscorrelation"], "cs": false, "areas": [], "en": {"t": "Cross-correlation", "d": "The function $R_XY(τ)$ measuring correlation between two different processes at a relative time shift."}, "he": {"t": "Cross-correlation", "d": "הפונקציה $R_XY(τ)$ המודדת מתאם בין שני תהליכים שונים בהיסט זמן יחסי."}}, {"term": "cross-spectral density", "aliases": ["cross spectral density", "cross-spectrum", "cross spectrum", "cross-spectral"], "cs": false, "areas": [], "en": {"t": "Cross-spectral density", "d": "The frequency-domain counterpart of the cross-correlation between two processes; unlike the auto-spectrum it is complex-valued."}, "he": {"t": "Cross-spectral density", "d": "המקבילה בתחום התדר לפונקציית המתאם ההדדי בין שני תהליכים; בדרך כלל פונקציה מרוכבת."}}, {"term": "CTMC", "aliases": [], "cs": true, "areas": [], "en": {"t": "CTMC", "d": "Continuous-Time Markov Chain: a Markov process on a discrete state space that jumps at random instants."}, "he": {"t": "CTMC", "d": "Continuous-time Markov chain: תהליך מרקובי על מרחב מצבים בדיד הקופץ בין מצבים ברגעים מקריים."}}, {"term": "cyclostationary", "aliases": ["cyclostationarity", "cyclo-stationary"], "cs": false, "areas": [], "en": {"t": "Cyclostationary", "d": "A process whose statistics are periodic in time rather than constant; typical of modulated communication signals."}, "he": {"t": "Cyclostationary", "d": "תהליך שהסטטיסטיקות שלו מחזוריות בזמן במקום קבועות; אופייני לאותות תקשורת מאופננים."}}, {"term": "DC", "aliases": ["DC component", "DC gain", "DC power"], "cs": true, "areas": [], "en": {"t": "DC", "d": "Direct current: the engineers' name for the constant non-fluctuating part of a signal, that is, its mean."}, "he": {"t": "DC", "d": "Direct current: הכינוי ההנדסי לרכיב הקבוע והלא משתנה של אות, כלומר לתוחלת שלו."}}, {"term": "decibel", "aliases": ["decibels", "dB"], "cs": true, "areas": [], "en": {"t": "Decibel", "d": "Logarithmic unit, one tenth of a bel, used to express power ratios on a compressed scale."}, "he": {"t": "Decibel", "d": "יחידה לוגריתמית, עשירית של bel, המשמשת לביטוי יחסי הספק בסקאלה מכווצת."}}, {"term": "decision regions", "aliases": ["decision region"], "cs": false, "areas": [], "en": {"t": "Decision regions", "d": "The partition of the observation space induced by a detection rule, one region per hypothesis."}, "he": {"t": "Decision regions", "d": "החלוקה של מרחב התצפיות שכלל ההחלטה משרה, אזור אחד לכל השערה."}}, {"term": "detailed balance", "aliases": [], "cs": false, "areas": [], "en": {"t": "Detailed balance", "d": "The reversibility condition equating probability flow between each pair of states in both directions."}, "he": {"t": "Detailed balance", "d": "תנאי ההפיכות המשווה את זרימת ההסתברות בין כל זוג מצבים בשני הכיוונים."}}, {"term": "DTFT", "aliases": ["discrete-time Fourier transform"], "cs": true, "areas": [], "en": {"t": "DTFT", "d": "Discrete-Time Fourier Transform: the frequency-domain representation of a discrete-time sequence, the sampled-data counterpart of the Fourier transform."}, "he": {"t": "DTFT", "d": "Discrete-time Fourier transform: הייצוג בתחום התדר של סדרה בזמן בדיד, המקבילה של התמרת Fourier לאותות דגומים."}}, {"term": "efficiency", "aliases": ["efficient", "efficient estimator"], "cs": false, "areas": ["estimation"], "en": {"t": "Efficiency", "d": "Classical estimator property, alongside unbiasedness and consistency, concerning how small an estimator's variance is."}, "he": {"t": "Efficiency", "d": "תכונה קלאסית של אומדים, לצד חוסר הטיה ועקיבות, העוסקת בשאלה כמה קטנה שונות האומד."}}, {"term": "ensemble", "aliases": ["ensemble average", "ensemble averaging"], "cs": false, "areas": [], "en": {"t": "Ensemble", "d": "The whole collection of sample functions a random process can produce, one per outcome of the underlying experiment."}, "he": {"t": "Ensemble", "d": "אוסף כל פונקציות המדגם שתהליך אקראי יכול לייצר, אחת לכל תוצאה של הניסוי הבסיסי."}}, {"term": "envelope", "aliases": ["envelope process"], "cs": false, "areas": [], "en": {"t": "Envelope", "d": "The slowly varying non-negative amplitude of a bandpass signal or process, separated from its carrier phase."}, "he": {"t": "Envelope", "d": "המעטפת: המשרעת האיטית והאי-שלילית של אות או תהליך בפס-מעבר, בהפרדה מפאזת הנשא."}}, {"term": "envelope detector", "aliases": ["envelope detection", "noncoherent detector"], "cs": false, "areas": [], "en": {"t": "Envelope detector", "d": "Noncoherent receiver front end that outputs the envelope of a bandpass waveform and discards carrier phase."}, "he": {"t": "Envelope detector", "d": "גלאי לא-קוהרנטי המוציא את מעטפת האות בפס-מעבר ומתעלם מפאזת הנשא."}}, {"term": "ergodicity", "aliases": ["ergodic", "ergodicity conditions"], "cs": false, "areas": [], "en": {"t": "Ergodicity", "d": "A property of a random process, named after Boltzmann's ergodic hypothesis; a recurring assumption in signal analysis and statistical mechanics."}, "he": {"t": "Ergodicity", "d": "ארגודיות: תכונה של תהליך אקראי, על שם השערת הארגודיות של Boltzmann; הנחה חוזרת בניתוח אותות ובמכניקה סטטיסטית."}}, {"term": "Erlang", "aliases": ["Erlang distribution"], "cs": false, "areas": [], "en": {"t": "Erlang", "d": "Distribution of a sum of independent exponential times; named for A. K. Erlang, who founded queueing theory in 1909."}, "he": {"t": "Erlang", "d": "התפלגות של סכום זמנים מעריכיים בלתי תלויים; על שם A. K. Erlang, מייסד תורת התורים ב-1909."}}, {"term": "Erlang C", "aliases": ["Erlang-C", "Erlang C formula"], "cs": false, "areas": [], "en": {"t": "Erlang C formula", "d": "Classical telephone-traffic formula giving the probability that an arriving customer must wait in an M/M/c system."}, "he": {"t": "Erlang C formula", "d": "נוסחה קלאסית מתעבורת טלפוניה הנותנת את ההסתברות שלקוח מגיע ייאלץ להמתין במערכת M/M/c."}}, {"term": "false alarm", "aliases": ["false-alarm", "false alarm probability", "P_FA"], "cs": false, "areas": [], "en": {"t": "False alarm", "d": "In detection, deciding a signal is present when only noise is; the Type I error of the test."}, "he": {"t": "False alarm", "d": "בגילוי, החלטה שיש אות כאשר קיים רק רעש; שגיאה מסוג I של המבחן."}}, {"term": "FIFO", "aliases": ["first-in first-out", "first come first served", "FCFS"], "cs": true, "areas": [], "en": {"t": "FIFO", "d": "First-In-First-Out: the service discipline that serves customers in arrival order, assumed by default in queueing models."}, "he": {"t": "FIFO", "d": "First-in-first-out: משמעת שירות המשרתת לקוחות לפי סדר הגעתם, הנחת ברירת המחדל במודלי תורים."}}, {"term": "first step analysis", "aliases": ["first-step analysis", "first step conditioning"], "cs": false, "areas": [], "en": {"t": "First-step analysis", "d": "Standard Markov-chain technique that conditions on the first transition to set up equations for absorption probabilities and times."}, "he": {"t": "First-step analysis", "d": "טכניקה סטנדרטית בשרשראות מרקוב המתנה על המעבר הראשון כדי לבנות משוואות להסתברויות ולזמני בליעה."}}, {"term": "first-order distribution", "aliases": ["first order distribution", "first-order density"], "cs": false, "areas": [], "en": {"t": "First-order distribution", "d": "The distribution of a random process at a single fixed instant, i.e. its one-time marginal."}, "he": {"t": "First-order distribution", "d": "ההתפלגות של תהליך אקראי ברגע זמן בודד וקבוע, כלומר ההתפלגות השולית בנקודה אחת."}}, {"term": "Fisher information", "aliases": ["Fisher"], "cs": false, "areas": [], "en": {"t": "Fisher information", "d": "Measure of how sharply a likelihood depends on an unknown parameter; introduced by R. A. Fisher in the 1920s."}, "he": {"t": "Fisher information", "d": "מדד לחדות התלות של פונקציית הנראות בפרמטר הלא ידוע; הוצג על ידי R. A. Fisher בשנות ה-20."}}, {"term": "Fisher-Neyman", "aliases": ["Fisher Neyman", "Fisher-Neyman factorisation", "Fisher-Neyman factorization", "factorisation theorem"], "cs": false, "areas": [], "en": {"t": "Fisher-Neyman factorisation", "d": "The theorem of Fisher and Neyman that identifies sufficient statistics from the way the likelihood factorises."}, "he": {"t": "Fisher-Neyman factorisation", "d": "המשפט של Fisher ו-Neyman המזהה סטטיסטיקה מספיקה לפי אופן הפירוק של פונקציית הנראות."}}, {"term": "gambler's ruin", "aliases": ["gamblers ruin", "gambler ruin"], "cs": false, "areas": [], "en": {"t": "Gambler's ruin", "d": "Classic random-walk problem with two absorbing barriers: a gambler bets until reaching a target or losing everything."}, "he": {"t": "Gambler's ruin", "d": "בעיית הילוך מקרי קלאסית עם שני מחסומים בולעים: מהמר מהמר עד שמגיע ליעד או מאבד הכל."}}, {"term": "Gauss-Markov", "aliases": ["gauss markov", "Gauss-Markov process"], "cs": false, "areas": [], "en": {"t": "Gauss-Markov process", "d": "A process that is simultaneously Gaussian and Markov; in continuous time it is the Ornstein-Uhlenbeck process."}, "he": {"t": "Gauss-Markov process", "d": "תהליך שהוא גאוסי ומרקובי בו-זמנית; בזמן רציף זהו תהליך Ornstein-Uhlenbeck."}}, {"term": "Gaussian process", "aliases": ["Gaussian random process"], "cs": false, "areas": [], "en": {"t": "Gaussian process", "d": "A random process whose behaviour is governed by the normal distribution; the standard model for thermal noise in electronic systems."}, "he": {"t": "Gaussian process", "d": "תהליך אקראי שהתנהגותו נשלטת על ידי ההתפלגות הנורמלית; המודל הסטנדרטי לרעש תרמי במערכות אלקטרוניות."}}, {"term": "gcd", "aliases": ["greatest common divisor"], "cs": true, "areas": [], "en": {"t": "gcd", "d": "Greatest common divisor; in Markov chains it fixes a state's period from the set of possible return times."}, "he": {"t": "gcd", "d": "Greatest common divisor, המחלק המשותף הגדול ביותר; בשרשראות מרקוב הוא קובע את המחזור של מצב מתוך זמני החזרה האפשריים."}}, {"term": "generator matrix", "aliases": ["rate matrix", "infinitesimal generator", "Q matrix"], "cs": false, "areas": [], "en": {"t": "Generator matrix", "d": "The matrix Q of transition rates that specifies a continuous-time Markov chain, the analogue of a transition-probability matrix."}, "he": {"t": "Generator matrix", "d": "מטריצת הקצבים Q המגדירה שרשרת מרקוב בזמן רציף, המקבילה למטריצת הסתברויות המעבר."}}, {"term": "heavy traffic", "aliases": ["heavy-traffic", "heavy traffic regime"], "cs": false, "areas": [], "en": {"t": "Heavy traffic", "d": "Queueing regime in which the utilisation ρ approaches one, so the system nears saturation and delays grow sharply."}, "he": {"t": "Heavy traffic", "d": "משטר עומס בתורים שבו הניצולת ρ מתקרבת לאחד, המערכת מתקרבת לרוויה וההשהיות גדלות בחדות."}}, {"term": "hitting time", "aliases": ["hitting times", "first passage time"], "cs": false, "areas": [], "en": {"t": "Hitting time", "d": "The random first time at which a chain or process enters a specified state or set of states."}, "he": {"t": "Hitting time", "d": "הזמן המקרי שבו שרשרת או תהליך נכנסים לראשונה למצב מסוים או לקבוצת מצבים."}}, {"term": "holding time", "aliases": ["sojourn time", "holding times"], "cs": false, "areas": [], "en": {"t": "Holding time", "d": "The random time a continuous-time Markov chain or queue spends in one state before its next jump."}, "he": {"t": "Holding time", "d": "הזמן המקרי ששרשרת מרקוב בזמן רציף או תור שוהים במצב אחד עד הקפיצה הבאה."}}, {"term": "Hopf equation", "aliases": ["Wiener-Hopf equation", "Hopf"], "cs": false, "areas": [], "en": {"t": "Wiener-Hopf equation", "d": "The normal equation of optimal linear filtering, whose solution is the Wiener filter; from Wiener and Hopf's 1931 work."}, "he": {"t": "Wiener-Hopf equation", "d": "משוואת הנורמל של סינון לינארי אופטימלי שפתרונה הוא מסנן Wiener; מעבודתם של Wiener ו-Hopf מ-1931."}}, {"term": "hypothesis testing", "aliases": ["hypothesis test", "binary hypothesis testing"], "cs": false, "areas": [], "en": {"t": "Hypothesis testing", "d": "The statistical framework of deciding between competing hypotheses H_0 and H_1 from data; the basis of detection theory."}, "he": {"t": "Hypothesis testing", "d": "המסגרת הסטטיסטית של הכרעה בין השערות מתחרות H_0 ו-H_1 מתוך נתונים; הבסיס לתורת הגילוי."}}, {"term": "in-phase", "aliases": ["in phase", "in phase quadrature", "in-phase and quadrature", "I and Q"], "cs": false, "areas": [], "en": {"t": "In-phase component", "d": "The I part of a bandpass process's baseband representation, paired with its quadrature (Q) part."}, "he": {"t": "In-phase component", "d": "הרכיב I של הייצוג בתחום הבסיס של תהליך בפס-מעבר, יחד עם הרכיב הניצב quadrature (Q)."}}, {"term": "independent increments", "aliases": ["independent-increments", "independent increment"], "cs": false, "areas": [], "en": {"t": "Independent increments", "d": "Property of a process whose changes over disjoint time intervals are statistically independent; shared by Poisson and Wiener processes."}, "he": {"t": "Independent increments", "d": "תכונה של תהליך שבו השינויים על קטעי זמן זרים בלתי תלויים סטטיסטית; מתקיימת בתהליכי Poisson ו-Wiener."}}, {"term": "innovations", "aliases": ["innovation", "innovation process"], "cs": false, "areas": ["estimation"], "en": {"t": "Innovations", "d": "A sequence formed step by step in recursive estimation; central to Kalman filtering and to Kailath's innovations approach of the 1960s."}, "he": {"t": "Innovations", "d": "סדרה הנוצרת צעד-אחר-צעד באמידה רקורסיבית; מרכזית בסינון Kalman ובגישת ה-innovations של Kailath משנות ה-60."}}, {"term": "interarrival", "aliases": ["interarrival time", "inter-arrival", "interarrival times"], "cs": false, "areas": [], "en": {"t": "Interarrival time", "d": "The random gap between successive arrivals in a point process or queue."}, "he": {"t": "Interarrival time", "d": "המרווח המקרי בין הגעות עוקבות בתהליך נקודתי או בתור."}}, {"term": "irreducible", "aliases": ["irreducibility"], "cs": false, "areas": [], "en": {"t": "Irreducible chain", "d": "A Markov chain in which every state can eventually be reached from every other state."}, "he": {"t": "Irreducible chain", "d": "שרשרת מרקוב שבה מכל מצב אפשר להגיע בסופו של דבר לכל מצב אחר."}}, {"term": "Isserlis", "aliases": ["Isserlis theorem", "Isserlis' theorem", "Wick's theorem"], "cs": false, "areas": [], "en": {"t": "Isserlis' theorem", "d": "Isserlis' 1918 result, also called Wick's theorem, the rule for higher-order moments of jointly Gaussian variables."}, "he": {"t": "Isserlis' theorem", "d": "התוצאה של Isserlis מ-1918, המוכרת גם כ-Wick's theorem, הכלל למומנטים מסדר גבוה של משתנים גאוסיים משותפים."}}, {"term": "Jacobian", "aliases": ["Jacobian determinant"], "cs": false, "areas": [], "en": {"t": "Jacobian", "d": "Determinant of the derivative matrix of a change of variables; the correction factor when transforming probability densities."}, "he": {"t": "Jacobian", "d": "הדטרמיננטה של מטריצת הנגזרות בהחלפת משתנים; גורם התיקון בהעברת פונקציות צפיפות."}}, {"term": "jointly Gaussian", "aliases": ["joint Gaussian", "joint Gaussianity", "jointly normal"], "cs": false, "areas": [], "en": {"t": "Jointly Gaussian", "d": "Random variables that together follow a single multivariate normal law, specified by a mean vector and a covariance matrix."}, "he": {"t": "Jointly Gaussian", "d": "משתנים מקריים המתפלגים יחד לפי התפלגות נורמלית רב-ממדית אחת, הנקבעת על ידי וקטור תוחלות ומטריצת קווריאנס."}}, {"term": "jointly WSS", "aliases": ["joint stationarity", "jointly wide-sense stationary", "jointly stationary"], "cs": false, "areas": [], "en": {"t": "Jointly WSS", "d": "A joint stationarity condition on a pair of random processes; required before cross-spectral tools such as coherence and Wiener filtering apply."}, "he": {"t": "Jointly WSS", "d": "תנאי סטציונריות משותף על זוג תהליכים מקריים; נדרש כדי להשתמש בכלים ספקטרליים הדדיים כמו קוהרנטיות וסינון Wiener."}}, {"term": "Kalman filter", "aliases": ["Kalman"], "cs": false, "areas": [], "en": {"t": "Kalman filter", "d": "Recursive state estimator for linear dynamic systems driven by Gaussian noise, published by Rudolf Kálmán in 1960."}, "he": {"t": "Kalman filter", "d": "אומד מצב רקורסיבי למערכות דינמיות לינאריות עם רעש גאוסי, שפורסם על ידי Rudolf Kálmán ב-1960."}}, {"term": "Khinchin", "aliases": ["Khintchine"], "cs": false, "areas": [], "en": {"t": "Khinchin", "d": "Aleksandr Khinchin (1894-1959), Soviet probabilist; one of the two names on the Wiener-Khinchin theorem of spectral analysis."}, "he": {"t": "Khinchin", "d": "Aleksandr Khinchin (1894-1959), מתמטיקאי הסתברות סובייטי; אחד משני השמות שעל משפט Wiener-Khinchin בניתוח ספקטרלי."}}, {"term": "law of large numbers", "aliases": ["LLN", "weak law of large numbers", "strong law of large numbers"], "cs": false, "areas": [], "en": {"t": "Law of large numbers", "d": "Theorem that averages of independent identically distributed variables converge to the mean; it has weak and strong versions."}, "he": {"t": "Law of large numbers", "d": "חוק המספרים הגדולים: משפט שלפיו ממוצעים של משתנים בלתי תלויים שווי התפלגות מתכנסים לתוחלת; קיימות גרסה חלשה וחזקה."}}, {"term": "law of total variance", "aliases": ["total variance", "Eve's law", "variance decomposition"], "cs": false, "areas": [], "en": {"t": "Law of total variance", "d": "Identity, also called Eve's law, decomposing a variance into conditional-variance and conditional-mean contributions."}, "he": {"t": "Law of total variance", "d": "זהות המכונה גם Eve's law, המפרקת שונות לתרומה של השונות המותנית ולתרומה של התוחלת המותנית."}}, {"term": "least squares", "aliases": ["least-squares"], "cs": false, "areas": [], "en": {"t": "Least squares", "d": "Curve-fitting criterion minimising the summed squared residuals; introduced by Gauss and Legendre and ubiquitous in regression."}, "he": {"t": "Least squares", "d": "קריטריון התאמה הממזער את סכום ריבועי השאריות; הוצג על ידי Gauss ו-Legendre ונפוץ מאוד ברגרסיה."}}, {"term": "LIFO", "aliases": ["last-in first-out", "LCFS"], "cs": true, "areas": [], "en": {"t": "LIFO", "d": "Last-In-First-Out: a queueing discipline serving the most recent arrival first, the stack counterpart of FIFO."}, "he": {"t": "LIFO", "d": "Last-in-first-out: משמעת תורים המשרתת קודם את המגיע האחרון, המקבילה של מחסנית ל-FIFO."}}, {"term": "likelihood ratio", "aliases": ["likelihood-ratio", "likelihood ratio statistic"], "cs": false, "areas": [], "en": {"t": "Likelihood ratio", "d": "The ratio of the two hypotheses' likelihoods for the observed data, the central statistic of binary detection."}, "he": {"t": "Likelihood ratio", "d": "היחס בין הנראויות של שתי ההשערות עבור התצפית, הסטטיסטי המרכזי בגילוי בינארי."}}, {"term": "limiting distribution", "aliases": ["limiting probabilities", "limiting state distribution"], "cs": false, "areas": [], "en": {"t": "Limiting distribution", "d": "The state distribution a Markov chain approaches as time grows, when such a limit exists."}, "he": {"t": "Limiting distribution", "d": "התפלגות המצבים שאליה שרשרת מרקוב מתקרבת כאשר הזמן גדל, כאשר גבול כזה קיים."}}, {"term": "Little's law", "aliases": ["littles law", "Little law", "Little's result"], "cs": false, "areas": [], "en": {"t": "Little's law", "d": "Result of John Little (1961) tying a queue's mean number of customers to its arrival rate and mean waiting time."}, "he": {"t": "Little's law", "d": "תוצאה של John Little משנת 1961 הקושרת את מספר הלקוחות הממוצע בתור לקצב ההגעות ולזמן ההמתנה הממוצע."}}, {"term": "LMMSE", "aliases": ["linear MMSE", "linear minimum mean square error"], "cs": false, "areas": [], "en": {"t": "LMMSE", "d": "Linear Minimum Mean-Square Error: the best estimator when the estimate is restricted to affine functions of the observations."}, "he": {"t": "LMMSE", "d": "Linear minimum mean-square error: האומד הטוב ביותר כאשר מגבילים את ההערכה לפונקציות אפיניות של התצפיות."}}, {"term": "Lorentzian", "aliases": ["Lorentzians", "Lorentzian spectrum"], "cs": false, "areas": [], "en": {"t": "Lorentzian", "d": "The rational single-pole spectral shape typical of first-order processes; named after physicist Hendrik Lorentz."}, "he": {"t": "Lorentzian", "d": "צורת הספקטרום הרציונלית בעלת קוטב יחיד האופיינית לתהליכים מסדר ראשון; על שם הפיזיקאי Hendrik Lorentz."}}, {"term": "LRT", "aliases": ["likelihood ratio test"], "cs": true, "areas": [], "en": {"t": "LRT", "d": "Likelihood Ratio Test: the detection rule that compares the likelihood ratio of the data against a threshold."}, "he": {"t": "LRT", "d": "Likelihood ratio test: כלל הגילוי המשווה את יחס הנראויות של הנתונים לסף."}}, {"term": "LS", "aliases": [], "cs": true, "areas": [], "en": {"t": "LS", "d": "Least squares: fitting by minimising the summed squared residuals; the workhorse of regression and system identification."}, "he": {"t": "LS", "d": "Least squares: התאמה על ידי מזעור סכום ריבועי השאריות; כלי העבודה המרכזי ברגרסיה ובזיהוי מערכות."}}, {"term": "LTI", "aliases": ["linear time-invariant"], "cs": true, "areas": [], "en": {"t": "LTI", "d": "Linear Time-Invariant: the class of systems whose input-output relation is convolution with a fixed impulse response."}, "he": {"t": "LTI", "d": "Linear time-invariant: משפחת המערכות שבהן הקשר בין כניסה ליציאה הוא קונבולוציה עם תגובת הלם קבועה."}}, {"term": "M-ary", "aliases": ["m ary", "M-ary hypothesis testing"], "cs": false, "areas": [], "en": {"t": "M-ary", "d": "Detection or signalling with M possible alternatives instead of just two; the multi-hypothesis generalisation of binary tests."}, "he": {"t": "M-ary", "d": "גילוי או שידור עם M אפשרויות במקום שתיים בלבד; ההכללה הרב-השערתית של מבחנים בינאריים."}}, {"term": "M/M/1", "aliases": ["m m 1", "MM1"], "cs": false, "areas": [], "en": {"t": "M/M/1 queue", "d": "Kendall notation for a single-server queue with Poisson arrivals, exponential service times and an unlimited waiting room."}, "he": {"t": "M/M/1 queue", "d": "סימון Kendall לתור עם שרת יחיד, הגעות Poisson, זמני שירות מעריכיים וחדר המתנה בלתי מוגבל."}}, {"term": "M/M/1/K", "aliases": ["m m 1 k", "M/M/1/N"], "cs": false, "areas": [], "en": {"t": "M/M/1/K queue", "d": "An M/M/1 queue with room for only K customers; arrivals that find it full are blocked and lost."}, "he": {"t": "M/M/1/K queue", "d": "תור M/M/1 שבו יש מקום ל-K לקוחות בלבד; הגעות שמוצאות אותו מלא נחסמות ואובדות."}}, {"term": "M/M/c", "aliases": ["m m c", "M/M/s"], "cs": false, "areas": [], "en": {"t": "M/M/c queue", "d": "Queue with Poisson arrivals, exponential service and c parallel servers sharing a single waiting line."}, "he": {"t": "M/M/c queue", "d": "תור עם הגעות Poisson, שירות מעריכי ו-c שרתים מקבילים החולקים תור המתנה אחד."}}, {"term": "MA", "aliases": ["moving average"], "cs": true, "areas": [], "en": {"t": "MA", "d": "Moving Average: a model whose present sample is a weighted sum of current and past white-noise inputs."}, "he": {"t": "MA", "d": "Moving average: מודל שבו הדגימה הנוכחית היא סכום משוקלל של כניסות רעש לבן נוכחיות וקודמות."}}, {"term": "MA(1)", "aliases": ["ma1", "MA-1", "first-order moving average"], "cs": false, "areas": [], "en": {"t": "MA(1)", "d": "First-order moving-average process, built from the current white-noise sample and the one before it."}, "he": {"t": "MA(1)", "d": "תהליך moving average מסדר ראשון, הנבנה מדגימת הרעש הלבן הנוכחית ומזו שלפניה."}}, {"term": "MAP", "aliases": ["maximum a posteriori"], "cs": true, "areas": [], "en": {"t": "MAP", "d": "Maximum A Posteriori: the decision or estimate that maximises the posterior probability given the observation."}, "he": {"t": "MAP", "d": "Maximum a posteriori: ההחלטה או ההערכה הממקסמת את ההסתברות הפוסטריורית בהינתן התצפית."}}, {"term": "Markov property", "aliases": ["Markovian", "memorylessness", "Markov assumption"], "cs": false, "areas": [], "en": {"t": "Markov property", "d": "The defining assumption of Markov chains and processes, named for A. A. Markov (1906); it is what makes them tractable."}, "he": {"t": "Markov property", "d": "ההנחה המגדירה של שרשראות ותהליכי מרקוב, על שם A. A. Markov (1906); היא שמאפשרת את הניתוח הפשוט שלהם."}}, {"term": "Markov's inequality", "aliases": ["Markov inequality"], "cs": false, "areas": [], "en": {"t": "Markov's inequality", "d": "Bound due to A. A. Markov limiting the probability that a non-negative random variable exceeds a given threshold."}, "he": {"t": "Markov's inequality", "d": "חסם על שם A. A. Markov המגביל את ההסתברות שמשתנה מקרי אי-שלילי יעלה על סף נתון."}}, {"term": "matched filter", "aliases": ["matched filtering", "matched-filter"], "cs": false, "areas": [], "en": {"t": "Matched filter", "d": "The receiver filter maximising output signal-to-noise ratio for a known pulse in white noise; from WWII radar work."}, "he": {"t": "Matched filter", "d": "המסנן בקולט הממקסם את יחס האות לרעש ביציאה עבור פולס ידוע ברעש לבן; מקורו במכ\"ם של מלחמת העולם השנייה."}}, {"term": "maximum likelihood", "aliases": ["maximum-likelihood", "maximum likelihood estimation", "maximum likelihood rule"], "cs": false, "areas": [], "en": {"t": "Maximum likelihood", "d": "Estimation principle due to R. A. Fisher in the 1920s: choose the parameter value that makes the observed data most probable."}, "he": {"t": "Maximum likelihood", "d": "עקרון האמידה של R. A. Fisher משנות ה-20: בוחרים את ערך הפרמטר שתחתיו הנתונים הנצפים הם הסבירים ביותר."}}, {"term": "mean-ergodic", "aliases": ["mean ergodicity", "mean ergodicity condition", "mean-ergodicity", "ergodic in the mean"], "cs": false, "areas": [], "en": {"t": "Mean-ergodic", "d": "Property of a stationary process whose time average over one sample path converges to the ensemble mean."}, "he": {"t": "Mean-ergodic", "d": "תכונה של תהליך סטציונרי שבו ממוצע הזמן על מסלול דגימה יחיד מתכנס לתוחלת האנסמבל."}}, {"term": "mean-square continuity", "aliases": ["mean square continuity", "m.s. continuity", "ms continuity", "continuity in mean square"], "cs": false, "areas": [], "en": {"t": "Mean-square continuity", "d": "Continuity of a random process in the mean-square sense, judged through its autocorrelation function rather than its sample paths."}, "he": {"t": "Mean-square continuity", "d": "רציפות של תהליך אקראי במובן הריבוע הממוצע, הנבחנת דרך פונקציית האוטוקורלציה ולא דרך מסלולי הדגימה."}}, {"term": "mean-square convergence", "aliases": ["mean square convergence", "convergence in mean square", "m.s. convergence", "quadratic mean convergence"], "cs": false, "areas": [], "en": {"t": "Mean-square convergence", "d": "Mode of stochastic convergence in which the expected squared difference vanishes; also called convergence in quadratic mean."}, "he": {"t": "Mean-square convergence", "d": "אופן התכנסות סטוכסטי שבו תוחלת ריבוע ההפרש שואפת לאפס; נקרא גם התכנסות בממוצע ריבועי."}}, {"term": "mean-square derivative", "aliases": ["mean square derivative", "mean square differentiability", "mean-square differentiability", "m.s. derivative", "ms differentiability"], "cs": false, "areas": [], "en": {"t": "Mean-square derivative", "d": "Derivative of a random process defined as a mean-square limit of difference quotients; part of mean-square calculus."}, "he": {"t": "Mean-square derivative", "d": "נגזרת של תהליך אקראי המוגדרת כגבול בריבוע ממוצע של מנות הפרש; חלק מחשבון ריבוע ממוצע."}}, {"term": "mean-square integral", "aliases": ["mean square integral", "m.s. integral"], "cs": false, "areas": [], "en": {"t": "Mean-square integral", "d": "Integral of a random process defined as a mean-square limit of Riemann sums; counterpart of the mean-square derivative."}, "he": {"t": "Mean-square integral", "d": "אינטגרל של תהליך אקראי המוגדר כגבול בריבוע ממוצע של סכומי רימן; המקבילה לנגזרת בריבוע ממוצע."}}, {"term": "minimum phase", "aliases": ["minimum-phase", "minimum phase system", "minimum-phase factor"], "cs": false, "areas": [], "en": {"t": "Minimum phase", "d": "System whose poles and zeros all lie in the stable region, so both it and its inverse are causal and stable."}, "he": {"t": "Minimum phase", "d": "מערכת שכל הקטבים והאפסים שלה נמצאים באזור היציב, ולכן היא והופכיה סיבתיות ויציבות."}}, {"term": "ML", "aliases": ["MLE"], "cs": true, "areas": [], "en": {"t": "ML", "d": "Maximum likelihood: the detector or estimator choosing the hypothesis or parameter value under which the observed data are most probable."}, "he": {"t": "ML", "d": "Maximum likelihood — גלאי או אומד הבוחר את ההשערה או ערך הפרמטר שתחתיו התצפית היא הסבירה ביותר."}}, {"term": "MMSE", "aliases": ["minimum mean square error", "minimum mean-square error"], "cs": true, "areas": [], "en": {"t": "MMSE", "d": "Minimum mean square error: the estimator, or the resulting error, that minimises the expected squared estimation error."}, "he": {"t": "MMSE", "d": "Minimum mean square error — האומד, או השגיאה המתקבלת, שממזער את תוחלת ריבוע שגיאת האמידה."}}, {"term": "modes of convergence", "aliases": ["mode of convergence", "convergence modes"], "cs": false, "areas": [], "en": {"t": "Modes of convergence", "d": "Collective name for the distinct senses in which a sequence of random variables can be said to converge to a limit."}, "he": {"t": "Modes of convergence", "d": "שם כולל לאופנים השונים שבהם ניתן לומר שסדרה של משתנים מקריים מתכנסת לגבול."}}, {"term": "MSE", "aliases": ["mean squared error", "mean square error"], "cs": true, "areas": [], "en": {"t": "MSE", "d": "Mean squared error: the expected squared difference between an estimate and the quantity being estimated."}, "he": {"t": "MSE", "d": "Mean squared error — תוחלת ריבוע ההפרש בין האומד לבין הגודל שאותו הוא אומד."}}, {"term": "n-step transition matrix", "aliases": ["n step transition matrix", "n-step transition probabilities", "n-step transition probability"], "cs": false, "areas": [], "en": {"t": "n-step transition matrix", "d": "Markov chain matrix whose $(i,j)$ entry is the probability of moving from state $i$ to state $j$ in $n$ steps."}, "he": {"t": "n-step transition matrix", "d": "מטריצה בשרשרת מרקוב שאיברה $(i,j)$ הוא ההסת ": [], "en": {"t": "Noise-equivalent bandwidth", "d": "A single-number bandwidth figure for filters and receivers, quoted in noise budgets and usually contrasted with the 3 dB bandwidth."}, "he": {"t": "Noise-equivalent bandwidth", "d": "מדד רוחב-סרט יחיד למסננים ולמקלטים, המצוטט בתקציבי רעש ולרוב מושווה לרוחב הסרט של 3 dB."}}, {"term": "noncoherent", "aliases": ["non-coherent", "noncoherent detection", "noncoherent reception", "noncoherent random phase"], "cs": false, "areas": [], "en": {"t": "Noncoherent", "d": "Receiver class that neither knows nor uses the carrier phase, so it operates on the envelope instead."}, "he": {"t": "Noncoherent", "d": "מחלקת מקלטים שאינה יודעת ואינה משתמשת בפאזת הנשא, ולכן פועלת על המעטפת במקום."}}, {"term": "normal equations", "aliases": ["normal equation"], "cs": false, "areas": [], "en": {"t": "Normal equations", "d": "Linear equation set whose solution gives the optimal linear estimator; the discrete-time counterpart of the Wiener-Hopf equation."}, "he": {"t": "Normal equations", "d": "מערכת משוואות לינארית שפתרונה נותן את האומד הלינארי האופטימלי; המקבילה בזמן בדיד למשוואת Wiener-Hopf."}}, {"term": "Nyquist rate", "aliases": ["Nyquist", "Nyquist sampling rate"], "cs": false, "areas": [], "en": {"t": "Nyquist rate", "d": "Minimum sampling rate for alias-free reconstruction of a bandlimited signal, twice its highest frequency; after Harry Nyquist."}, "he": {"t": "Nyquist rate", "d": "קצב הדגימה המינימלי לשחזור ללא כשל דגימה של אות מוגבל סרט, פי שניים מהתדר הגבוה ביותר; על שם Harry Nyquist."}}, {"term": "on-off keying", "aliases": ["OOK", "on off keying", "on-off", "on off", "on-off signalling"], "cs": false, "areas": [], "en": {"t": "On-off keying", "d": "Binary modulation that transmits a pulse for one symbol and nothing for the other; the simplest amplitude-shift keying."}, "he": {"t": "On-off keying", "d": "אפנון בינארי המשדר פולס עבור סמל אחד ואינו משדר דבר עבור השני; המקרה הפשוט של amplitude-shift keying."}}, {"term": "one-sided PSD", "aliases": ["one sided psd", "one-sided spectrum", "one-sided power spectral density"], "cs": false, "areas": [], "en": {"t": "One-sided PSD", "d": "Convention for quoting the power spectral density of a noise source; standard in datasheets and receiver noise budgets."}, "he": {"t": "One-sided PSD", "d": "מוסכמה לציון צפיפות ההספק הספקטרלית של מקור רעש; מקובלת בדפי נתונים ובתקציבי רעש של מקלטים."}}, {"term": "order statistics", "aliases": ["order statistic"], "cs": false, "areas": [], "en": {"t": "Order statistics", "d": "The values of a random sample after sorting from smallest to largest; the k-th one is the k-th order statistic."}, "he": {"t": "Order statistics", "d": "ערכי מדגם אקראי לאחר מיון מהקטן לגדול; הערך ה-k נקרא סטטיסטיקת הסדר ה-k."}}, {"term": "orthogonality principle", "aliases": ["principle of orthogonality", "orthogonality condition"], "cs": false, "areas": [], "en": {"t": "Orthogonality principle", "d": "Geometric characterisation of the optimal mean-square estimator; the standard route to LMMSE, Wiener and Kalman results."}, "he": {"t": "Orthogonality principle", "d": "אפיון גאומטרי של האומד האופטימלי בריבוע ממוצע; הדרך הסטנדרטית לגזירת תוצאות LMMSE, Wiener ו-Kalman."}}, {"term": "P_D", "aliases": ["PD", "probability of detection", "detection probability"], "cs": true, "areas": [], "en": {"t": "P_D", "d": "Probability of detection: the chance that a detector declares the signal present when it truly is present."}, "he": {"t": "P_D", "d": "Probability of detection — ההסתברות שהגלאי מכריז על נוכחות האות כאשר האות אכן קיים."}}, {"term": "P_e", "aliases": ["Pe", "probability of error", "error probability"], "cs": true, "areas": [], "en": {"t": "P_e", "d": "Probability of error: the overall chance that a detector's decision is wrong, averaged over both hypotheses."}, "he": {"t": "P_e", "d": "Probability of error — ההסתברות הכוללת שהחלטת הגלאי שגויה, בממוצע על שתי ההשערות."}}, {"term": "Paley-Wiener", "aliases": ["Paley Wiener", "Paley-Wiener cond /* Terms are marked up at render time rather than stored in the bank, so one

let _M = null;
function matcher(){
  if(_M) return _M;
  const forms = [];
  GLOSSARY.forEach((e,i) => {
    [e.term].concat(e.aliases||[]).forEach(sfc => { if(sfc) forms.push({s:sfc, i, cs:!!e.cs}); });
  });
  forms.sort((a,b) => b.s.length - a.s.length);   // longest wins: "truncated BPTT" over "BPTT"
  /* A surface form can carry several senses (MAE = mean absolute error, or masked
     autoencoder). Each sense may declare `areas`; the question's own area picks. */
  const exact = new Map(), lower = new Map();
  forms.forEach(f => {
    const map = f.cs ? exact : lower, k = f.cs ? f.s : f.s.toLowerCase();
    if(!map.has(k)) map.set(k, []);
    if(map.get(k).indexOf(f.i) < 0) map.get(k).push(f.i);
  });
  const esc2 = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const alt = forms.map(f => esc2(f.s)).join("|");
  _M = {
    re: new RegExp("(^|[^A-Za-z0-9_])(" + alt + ")(?![A-Za-z0-9_])", "gi"),
    exact, lower
  };
  return _M;
}

  const general = list.filter(i => !(GLOSSARY[i].areas || []).length);

function lookup(word){
  const M = matcher();
  if(M.exact.has(word)) return pickSense(M.exact.get(word));
  return pickSense(M.lower.get(word.toLowerCase()));
}
/* One mark per term per screen: the stem claims it, so repeated mentions in the
   options stay clean. annReset() starts a new screen. */
let annSeen = null, annArea = null;
function annReset(area){ annSeen = new Set(); annArea = area || null; }
/* Renders one run of text: escapes HTML, sets $…$ maths in an LTR-isolated monospace
   span, and wraps known jargon in a tooltip trigger. Use everywhere text is rendered. */
const MATH_RE = /\$([^$\n]+)\$/g;
function annotateProse(text, cap, st){
  if(!S.settings.glossary) return esc(text);
  const M = matcher();
  const used = annSeen || (st.local || (st.local = new Set()));
  let out = "", last = 0, m;
  M.re.lastIndex = 0;
  while((m = M.re.exec(text)) !== null){
    if(m[0].length === 0){ M.re.lastIndex++; continue; }
    const word = m[2], start = m.index + m[1].length;
    const idx = lookup(word);
    if(idx < 0) continue;
    const key = GLOSSARY[idx].term.toLowerCase();
    if(used.has(key) || st.n >= cap) continue;
    used.add(key); st.n++;
    out += esc(text.slice(last, start));
    out += '<span class="term" role="button" tabindex="0" data-term="' + idx + '">' + esc(word) + '</span>';
    last = start + word.length;
  }
  return out + esc(text.slice(last));
}
function ann(text, cap){
  text = String(text == null ? "" : text);
  cap = cap || 6;
  const st = { n: 0 };
  if(text.indexOf("$") < 0) return annotateProse(text, cap, st);
  let out = "", last = 0, m;
  MATH_RE.lastIndex = 0;
  while((m = MATH_RE.exec(text)) !== null){
    if(m.index > last) out += annotateProse(text.slice(last, m.index), cap, st);
    out += '<span class="mth">' + esc(m[1]) + '</span>';
    last = MATH_RE.lastIndex;
  }
  return out + (last < text.length ? annotateProse(text.slice(last), cap, st) : "");
}

let tipEl = null, tipOwner = null;

}
function hideTip(){

function showTip(el, idx){
  const e = GLOSSARY[idx];
  if(!e) return;
  const b = (e[S.lang] && e[S.lang].d) ? e[S.lang] : e.en;
  const n = tip();
  n.innerHTML = '<b>' + esc(b.t) + '</b><p>' + esc(b.d) + '</p>';
  n.classList.add("show");
  if(tipOwner && tipOwner !== el) tipOwner.classList.remove("on");
  tipOwner = el; el.classList.add("on");
  n.style.left = "0px"; n.style.top = "0px";
  /* Horizontally centred on the word, but vertically clear of the whole block it sits in,
     so the popover never covers the rest of the sentence it is explaining. */
  const block = el.closest(".qtext, .opt, .hintbox, .explain, .gitem, li, .q, .ansline") || el;
  const r = el.getBoundingClientRect(), br = block.getBoundingClientRect(), t = n.getBoundingClientRect();
  let left = r.left + r.width / 2 - t.width / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - t.width - 12));
  let top = br.bottom + 8;
  if(top + t.height > window.innerHeight - 12){
    const above = br.top - t.height - 8;
    top = above >= 12 ? above : Math.max(12, window.innerHeight - t.height - 12);
  }
  n.style.left = left + "px"; n.style.top = top + "px";
}

function pool(opts){
  opts = opts||{};

  return QUESTIONS.filter(q => {

    if(f.diffs.length && !f.diffs.includes(q.difficulty)) return false;
    if(f.hard.length && !f.hard.includes(q.hardnessSource)) return false;
    if(opts.autoOnly && q.type==="open") return false;   // only `open` needs a human
    if(f.types.length && !f.types.includes(q.type)) return false;

function weight(q){
  if(!S.settings.leitner) return 1;

function pick(list, n, avoidRecent){
  let cand = list.slice();
  if(avoidRecent && recent.length){
    const fresh = cand.filter(q => !recent.includes(q.id));
    if(fresh.length >= n) cand = fresh;
  }
  const out=[];
  const w = cand.map(weight);
  for(let k=0;k<n && cand.length;k++){
    let total=0; for(const x of w) total+=x;
    let r=Math.random()*total, idx=0;
    for(let i=0;i<cand.length;i++){ r-=w[i]; if(r<=0){ idx=i; break; } idx=i; }
    out.push(cand[idx]); cand.splice(idx,1); w.splice(idx,1);
  }
  return out;
}

  const b=L(q);

    text: b.options[oi],
    correct: oi === q.answer,
    why: oi === q.answer ? null : (b.whyWrong ? b.whyWrong[oi > q.answer ? oi-1 : oi] : null)
  }));

/* Cloze: forgiving comparison — case, surrounding space, curly quotes and a

function normAns(x){
  return String(x == null ? "" : x).toLowerCase()
    .replace(/[\u2018\u2019\u02BC]/g, "'").replace(/[\u201C\u201D]/g, '"')
    .replace(/\s+/g, " ").replace(/[.,!?;:]+$/, "").trim();
}
function blankOk(q, i, typed){
  const list = (q.answers && q.answers[i]) || [];
  const t = normAns(typed);
  return !!t && list.some(x => normAns(x) === t);
}
function clozeDone(q, a){
  const n = (q.answers || []).length;
  for(let i = 0; i < n; i++){ if(!((a.typed || [])[i] || "").trim()) return false; }
  return n > 0;
}
function clozeCorrect(q, a){
  const n = (q.answers || []).length;
  for(let i = 0; i < n; i++){ if(!blankOk(q, i, (a.typed || [])[i])) return false; }
  return n > 0;
}
/* Renders the sentence with its blanks as inputs, or as the filled-in answer once checked. */
function clozeHtml(q, a, locked){
  const parts = String(q.sentence || "").split("___");
  let out = "";
  for(let i = 0; i < parts.length; i++){
    out += esc(parts[i]);     // the sentence under test stays pristine: no term marks in it
    if(i < parts.length - 1){
      const v = esc(((a.typed || [])[i]) || "");
      const cls = locked ? (blankOk(q, i, (a.typed || [])[i]) ? " good" : " bad") : "";
      const wide = Math.max(6, Math.min(16, (((q.answers[i] || [])[0]) || "").length + 3));
      out += '<input class="blank' + cls + '" data-blank="' + i + '" type="text" size="' + wide + '" value="' + v +
             '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"' +
             (locked ? " disabled" : ' placeholder="' + esc(t.typeHere) + '"') + '>';
    }
  }
  return out;
}
function clozeModel(q){
  const parts = String(q.sentence || "").split("___");
  let out = "";
  for(let i = 0; i < parts.length; i++){
    out += esc(parts[i]);
    if(i < parts.length - 1) out += "<u>" + esc(((q.answers[i] || [])[0]) || "") + "</u>";
  }
  return out;
}

function isCorrect(q, a){
  if(!a) return false;
  if(q.type === "cloze") return clozeCorrect(q, a);
  if(a.picked == null || !a.presented) return false;
  return a.presented[a.picked] === q.answer;
}
/* "answered" means something gradable was supplied, whatever the type. */
function answered(q, a){
  if(!a) return false;
  if(q.type === "cloze") return clozeDone(q, a);
  if(q.type === "open")  return !!(a.text || "").trim();
  return a.picked !== null;
}

  r.seen++; r.last = Date.now();
  if(ok){ r.ok++; r.box = Math.min(4, r.box+1); S.stats.streak++; S.stats.best=Math.max(S.stats.best,S.stats.streak); }
  else { r.box = 0; S.stats.streak = 0; }
  if(hinted) r.hinted = (r.hinted||0)+1;
  saveStore();
}

/* ============================ action bar ============================ */
function setActions(html){
  hideTip();
  const bar=document.getElementById("actions"), inner=document.getElementById("actionsInner");
  if(!html){ bar.hidden=true; inner.innerHTML=""; return; }
  bar.hidden=false; inner.innerHTML=html;
}

/* ============================ HOME ============================ */
