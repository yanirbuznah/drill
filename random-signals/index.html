<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1017" media="(prefers-color-scheme: dark)">
<meta name="description" content="Stochastic processes, PSD, LTI filtering, estimation, detection, Markov chains and queues.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Random Signals">
<meta name="mobile-web-app-capable" content="yes">
<title>Random Signals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EDEFF3; --surface-3:#E3E7ED;
  --line:#D8DEE7; --line-strong:#BCC5D2;
  --ink:#131820; --muted:#5A6472; --faint:#8B94A3;
  --accent:#4338A8; --accent-ink:#FFFFFF; --accent-soft:#E9E7F8; --accent-line:#BFB8EC;
  --ok:#14724D; --ok-soft:#E1F1E9; --ok-line:#9BCFB8;
  --bad:#B02A24; --bad-soft:#FBE7E5; --bad-line:#E9AFAB;
  --warn:#8A5A00;
  --d1:#2F8F7F; --d2:#A87C1E; --d3:#C4602F; --d4:#9C2F6B;
  --shadow:0 1px 2px rgba(19,24,32,.05), 0 8px 24px -12px rgba(19,24,32,.18);
  --r:8px; --r-sm:5px;
  --sans:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1017; --surface:#151A23; --surface-2:#1C222D; --surface-3:#232B38;
    --line:#293040; --line-strong:#3A4353;
    --ink:#E8ECF3; --muted:#9AA5B5; --faint:#77808F;
    --accent:#9A8CFF; --accent-ink:#12101F; --accent-soft:#221E3C; --accent-line:#463D80;
    --ok:#48C596; --ok-soft:#12291F; --ok-line:#2A6A4F;
    --bad:#F0736B; --bad-soft:#2B1615; --bad-line:#6E332F;
    --warn:#D9A441;
    --d1:#4FBFA8; --d2:#D8A63C; --d3:#E58044; --d4:#DB6BA8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1017; --surface:#151A23; --surface-2:#1C222D; --surface-3:#232B38;
  --line:#293040; --line-strong:#3A4353;
  --ink:#E8ECF3; --muted:#9AA5B5; --faint:#77808F;
  --accent:#9A8CFF; --accent-ink:#12101F; --accent-soft:#221E3C; --accent-line:#463D80;
  --ok:#48C596; --ok-soft:#12291F; --ok-line:#2A6A4F;
  --bad:#F0736B; --bad-soft:#2B1615; --bad-line:#6E332F;
  --warn:#D9A441;
  --d1:#4FBFA8; --d2:#D8A63C; --d3:#E58044; --d4:#DB6BA8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  overflow-x:hidden; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
[hidden]{display:none !important}

/* ---------- shell ---------- */
.app{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:7px;margin-inline-end:auto;min-width:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:34px;padding:0 9px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--muted);
}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
main{flex:1;padding:16px 14px 96px}
@media(min-width:700px){ main{padding:24px 20px 110px} }

/* ---------- type ---------- */
h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
h2{font-size:17px;line-height:1.3;letter-spacing:-.01em;margin:0 0 10px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.lede{color:var(--muted);font-size:14.5px;margin:0 0 20px;max-width:60ch}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- cards / sections ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.section{margin-bottom:22px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- mode picker ---------- */
.modes{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:22px}
@media(min-width:560px){ .modes{grid-template-columns:1fr 1fr} }
.mode{
  display:flex;flex-direction:column;gap:5px;text-align:start;padding:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease;
}
.mode:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.mode strong{font-size:17px;letter-spacing:-.01em}
.mode span{font-size:13px;color:var(--muted);line-height:1.45}
.mode em{font-family:var(--mono);font-size:10px;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);
  transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.chip .n{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.chip.d1[aria-pressed="true"]{background:color-mix(in srgb,var(--d1) 15%,transparent);border-color:var(--d1);color:var(--d1)}
.chip.d2[aria-pressed="true"]{background:color-mix(in srgb,var(--d2) 15%,transparent);border-color:var(--d2);color:var(--d2)}
.chip.d3[aria-pressed="true"]{background:color-mix(in srgb,var(--d3) 15%,transparent);border-color:var(--d3);color:var(--d3)}
.chip.d4[aria-pressed="true"]{background:color-mix(in srgb,var(--d4) 15%,transparent);border-color:var(--d4);color:var(--d4)}

details.filters{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
details.filters>summary{
  list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:500;
}
details.filters>summary::-webkit-details-marker{display:none}
details.filters>summary::after{content:"+";margin-inline-start:auto;font-family:var(--mono);color:var(--faint);font-size:16px}
details.filters[open]>summary::after{content:"\2212"}
details.filters>summary .pool{font-family:var(--mono);font-size:11px;color:var(--faint);margin-inline-start:auto}
details.filters[open]>summary .pool{display:none}
.filterbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line)}
.fgroup{padding-top:14px}
.fgroup>.eyebrow{display:flex;align-items:center;gap:8px}
.fgroup .allbtn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-inline-start:auto}

/* ---------- difficulty meter ---------- */
.meter{display:inline-flex;gap:2.5px;align-items:center}
.meter i{width:5px;height:5px;border-radius:50%;background:var(--line-strong);display:block}
.meter[data-d="1"] i:nth-child(-n+1){background:var(--d1)}
.meter[data-d="2"] i:nth-child(-n+2){background:var(--d2)}
.meter[data-d="3"] i:nth-child(-n+3){background:var(--d3)}
.meter[data-d="4"] i:nth-child(-n+4){background:var(--d4)}

/* ---------- question ---------- */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.qmeta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.qmeta .area{color:var(--muted)}
.qcard{padding:20px 18px}
.qtext{font-size:19px;line-height:1.45;letter-spacing:-.01em;margin:0;text-wrap:pretty}
@media(min-width:700px){ .qtext{font-size:21px} }
.hintbox{margin-top:16px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);
  border-inline-start:3px solid var(--warn);font-size:14px;color:var(--muted)}
.hintbox b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:start;width:100%;
  padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:15px;line-height:1.45;
  transition:border-color .12s,background .12s;
}
.opt:not(.locked):hover{border-color:var(--accent-line);background:var(--accent-soft)}
.opt.locked{cursor:default}
.opt .k{
  flex:0 0 auto;width:21px;height:21px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;
  color:var(--muted);margin-top:1px;
}
.opt.correct{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.picked{border-width:2px;padding:11px 12px}
.opt.dim{opacity:.62}
.opt .why{display:block;margin-top:6px;font-size:13px;color:var(--muted);line-height:1.45}
.reveal-anim{animation:rise .22s ease both}
.opts.reveal-anim .opt:nth-child(1){animation-delay:0ms}
.opts.reveal-anim .opt:nth-child(2){animation-delay:35ms}
.opts.reveal-anim .opt:nth-child(3){animation-delay:70ms}
.opts.reveal-anim .opt:nth-child(4){animation-delay:105ms}
.opts.reveal-anim .opt{animation:rise .24s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }

.verdict{display:flex;align-items:center;gap:9px;margin-top:16px;padding:11px 13px;border-radius:var(--r-sm);
  font-size:14.5px;font-weight:500}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.verdict.no{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.verdict .g{font-family:var(--mono);font-size:15px}

.explain{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.explain .eyebrow{margin-bottom:6px}
.explain p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}

textarea.answer{width:100%;min-height:120px;padding:12px 13px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);resize:vertical;font-size:15px;line-height:1.5}
textarea.answer:focus{border-color:var(--accent);outline:none}
.rubric{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.rubric li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.rubric input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--accent);flex:0 0 auto}
.selfscore{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:12px;color:var(--muted)}
.selfscore b{font-size:20px;color:var(--ink)}

/* ---------- action bar ---------- */
.actionbar{
  position:fixed;inset-inline:0;bottom:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.actionbar .inner{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  font-size:15px;font-weight:500;color:var(--ink);min-height:46px;
}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{color:var(--muted)}
.btn.wide{flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13.5px}

/* ---------- progress ---------- */
.progress{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.progress .bar{flex:1;height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.progress .cnt{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em}
.qdots{display:flex;gap:4px;flex-wrap:wrap}
.qdots i{width:7px;height:7px;border-radius:50%;background:var(--surface-3);display:block}
.qdots i.done{background:var(--accent)}
.qdots i.now{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- stats ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:center}
.stat b{display:block;font-size:23px;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.barlist{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(90px,1fr) 2fr auto;gap:10px;align-items:center;font-size:13.5px}
.barrow .track{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.barrow .pct{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:end}

/* ---------- results ---------- */
.scorehero{text-align:center;padding:26px 18px}
.scorehero .big{font-family:var(--mono);font-size:56px;line-height:1;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.scorehero .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.reviewitem{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.reviewitem+.reviewitem{margin-top:8px}
.reviewitem .q{font-size:15px;line-height:1.45;margin:8px 0 10px}
.ansline{font-size:13.5px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.ansline .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:0 0 auto;min-width:62px;margin-top:3px}
.ansline.ok .txt{color:var(--ok)}
.ansline.no .txt{color:var(--bad)}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .lab{flex:1;min-width:0}
.setrow .lab b{display:block;font-size:14.5px;font-weight:500}
.setrow .lab span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.switch{flex:0 0 auto;width:44px;height:26px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(18px)}
[dir="rtl"] .switch[aria-pressed="true"]::after{transform:translateX(-18px)}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field input,.field select{padding:10px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:14px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:var(--r-sm)}
.note b{color:var(--ink)}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14.5px}
.ltr{direction:ltr;display:inline-block;unicode-bidi:isolate}
[dir="rtl"] .brand span,[dir="rtl"] .eyebrow,[dir="rtl"] .qmeta{letter-spacing:0}



/* ---------- cloze: the sentence under test ---------- */
.sent{
  font-size:19px;line-height:1.75;letter-spacing:-.01em;margin:0;
  direction:ltr;unicode-bidi:isolate;text-align:start;
}
[dir="rtl"] .sent{text-align:left}
@media(min-width:700px){ .sent{font-size:21px} }
.blank{
  display:inline-block;width:auto;min-width:5.5em;max-width:min(100%,15em);
  padding:2px 8px;margin:0 2px;
  border:0;border-bottom:2px solid var(--accent);border-radius:3px 3px 0 0;
  background:var(--surface-2);color:var(--ink);
  font:inherit;font-size:.95em;text-align:center;direction:ltr;
}
.blank:focus{outline:none;background:var(--accent-soft);border-bottom-width:3px}
.blank::placeholder{color:var(--faint);font-size:.85em;letter-spacing:.08em}
.blank:disabled{opacity:1;background:transparent;border-bottom-style:dotted}
.blank.good{background:var(--ok-soft);border-bottom-color:var(--ok);color:var(--ok);font-weight:600}
.blank.bad{background:var(--bad-soft);border-bottom-color:var(--bad);color:var(--bad);text-decoration:line-through}
.fix{display:block;margin-top:14px;padding:11px 13px;border-radius:var(--r-sm);
  background:var(--ok-soft);border:1px solid var(--ok-line);font-size:14.5px;color:var(--ink)}
.fix b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.fix .full{direction:ltr;unicode-bidi:isolate;display:block;line-height:1.6}
.fix .full u{text-decoration:none;color:var(--ok);font-weight:600;border-bottom:2px solid var(--ok-line)}
.alt{margin-top:7px;font-size:12.5px;color:var(--muted)}
.alt code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px;direction:ltr;unicode-bidi:isolate;display:inline-block}
/* ---------- inline math ---------- */
.mth{
  font-family:var(--mono);font-size:.93em;
  direction:ltr;unicode-bidi:isolate;
  white-space:pre-wrap;overflow-wrap:break-word;
  letter-spacing:-.005em;
}
/* ---------- glossary terms ---------- */
.term{
  display:inline;padding:0;margin:0;border:0;background:none;font:inherit;color:inherit;cursor:help;
  border-bottom:2px solid var(--accent);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
}
.term:hover,.term.on{color:var(--accent)}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.tip{
  position:fixed;top:0;inset-inline-start:0;z-index:120;
  width:max-content;max-width:min(330px,calc(100vw - 24px));
  background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--r);
  box-shadow:0 10px 34px -10px rgba(0,0,0,.5);padding:11px 13px;
  opacity:0;transform:translateY(-4px);pointer-events:none;
  transition:opacity .13s ease,transform .13s ease;
}
.tip.show{opacity:1;transform:none;pointer-events:auto}
.tip b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px}
.tip p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink)}
.tip .close{position:absolute;inset-inline-end:6px;top:5px;font-family:var(--mono);font-size:12px;
  color:var(--faint);padding:2px 5px;line-height:1}

/* ---------- glossary screen ---------- */
.gsearch{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:15px;margin-bottom:14px}
.gsearch:focus{border-color:var(--accent);outline:none}
.glist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.gitem{background:var(--surface);padding:12px 14px}
.gitem b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
.gitem span{display:block;font-size:13px;line-height:1.5;color:var(--muted)}
.gcount{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:10px}
</style>

const QUESTIONS = [{"id": "prb-001", "area": "prob-review", "topic": "variance-algebra", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["variance", "covariance", "correlation-coefficient"], "answer": 1, "en": {"q": "Two random variables satisfy $Var(X)=4$, $Var(Y)=9$ and correlation coefficient $ρ_{XY}=0.5$. Compute $Var(2X-3Y)$.", "options": ["$97$", "$61$", "$133$", "$91$"], "hint": "$Var(aX+bY)=a²Var(X)+b²Var(Y)+2ab Cov(X,Y)$, and $Cov(X,Y)=ρ σ_X σ_Y$.", "explanation": "First $σ_X=2$, $σ_Y=3$, so $Cov(X,Y)=ρ σ_X σ_Y = 0.5·2·3 = 3$. With $a=2$ and $b=-3$: $Var(2X-3Y)=4·4 + 9·9 + 2·2·(-3)·3 = 16 + 81 - 36 = 61$. The cross term is negative because $a$ and $b$ have opposite signs while $Cov(X,Y)>0$.", "whyWrong": ["$97 = 16+81$ drops the covariance term, which is only legitimate when $X$ and $Y$ are uncorrelated.", "$133 = 16+81+36$ keeps the cross term positive and ignores the minus sign carried by $b=-3$.", "$91$ comes from substituting $ρ=0.5$ directly in place of $Cov(X,Y)=3$, forgetting the factor $σ_X σ_Y$."]}, "he": {"q": "שני משתנים אקראיים מקיימים $Var(X)=4$, $Var(Y)=9$ ומקדם מתאם $ρ_{XY}=0.5$. חשב את $Var(2X-3Y)$.", "options": ["$97$", "$61$", "$133$", "$91$"], "hint": "$Var(aX+bY)=a²Var(X)+b²Var(Y)+2ab Cov(X,Y)$, וכן $Cov(X,Y)=ρ σ_X σ_Y$.", "explanation": "תחילה $σ_X=2$, $σ_Y=3$, ולכן $Cov(X,Y)=ρ σ_X σ_Y = 0.5·2·3 = 3$. עם $a=2$ ו-$b=-3$: ‏$Var(2X-3Y)=4·4 + 9·9 + 2·2·(-3)·3 = 16 + 81 - 36 = 61$. האיבר המוצלב שלילי משום שלמקדמים $a$ ו-$b$ סימנים מנוגדים בעוד ש-$Cov(X,Y)>0$.", "whyWrong": ["‏$97 = 16+81$ מזניח את איבר השונות המשותפת, מהלך שמותר רק כאשר $X$ ו-$Y$ בלתי מתואמים.", "‏$133 = 16+81+36$ משאיר את האיבר המוצלב חיובי ומתעלם מהסימן השלילי של $b=-3$.", "‏$91$ מתקבל מהצבת $ρ=0.5$ במקום $Cov(X,Y)=3$, תוך שכחת המכפלה $σ_X σ_Y$."]}}, {"id": "prb-002", "area": "prob-review", "topic": "total-expectation-and-variance", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["law-of-total-variance", "conditioning", "mixture"], "answer": 0, "en": {"q": "A parameter $Θ$ equals $0$ or $6$ with probability $1/2$ each, and given $Θ$ the variable $X$ is $N(Θ,4)$. Find $E[X]$ and $Var(X)$.", "options": ["$E[X]=3$, $Var(X)=13$", "$E[X]=3$, $Var(X)=4$", "$E[X]=3$, $Var(X)=22$", "$E[X]=3$, $Var(X)=9$"], "hint": "$E[X]=E[E[X|Θ]]$ and $Var(X)=E[Var(X|Θ)]+Var(E[X|Θ])$.", "explanation": "Here $E[X|Θ]=Θ$ and $Var(X|Θ)=4$. Total expectation: $E[X]=E[Θ]=(0+6)/2=3$. Total variance: $E[Var(X|Θ)]=4$ and $Var(E[X|Θ])=Var(Θ)=E[Θ²]-E[Θ]²=18-9=9$, so $Var(X)=4+9=13$.", "whyWrong": ["$Var(X)=4$ uses only the within-group variance and ignores the spread of the conditional means.", "$Var(X)=22$ adds $E[Θ²]=18$ instead of $Var(Θ)=9$, i.e. it forgets to subtract $E[Θ]²$.", "$Var(X)=9$ keeps only $Var(Θ)$ and forgets the average conditional variance $E[Var(X|Θ)]=4$."]}, "he": {"q": "פרמטר $Θ$ שווה ל-$0$ או ל-$6$ בהסתברות $1/2$ כל אחד, ובהינתן $Θ$ המשתנה $X$ מתפלג $N(Θ,4)$. מצא את $E[X]$ ואת $Var(X)$.", "options": ["$E[X]=3$, $Var(X)=13$", "$E[X]=3$, $Var(X)=4$", "$E[X]=3$, $Var(X)=22$", "$E[X]=3$, $Var(X)=9$"], "hint": "‏$E[X]=E[E[X|Θ]]$ וכן $Var(X)=E[Var(X|Θ)]+Var(E[X|Θ])$.", "explanation": "כאן $E[X|Θ]=Θ$ וגם $Var(X|Θ)=4$. לפי נוסחת התוחלת השלמה: $E[X]=E[Θ]=(0+6)/2=3$. לפי נוסחת השונות השלמה: $E[Var(X|Θ)]=4$ וכן $Var(E[X|Θ])=Var(Θ)=E[Θ²]-E[Θ]²=18-9=9$, ולכן $Var(X)=4+9=13$.", "whyWrong": ["‏$Var(X)=4$ לוקח רק את השונות הפנימית ומתעלם מהפיזור של התוחלות המותנות.", "‏$Var(X)=22$ מוסיף את $E[Θ²]=18$ במקום את $Var(Θ)=9$, כלומר שוכח לחסר את $E[Θ]²$.", "‏$Var(X)=9$ משאיר רק את $Var(Θ)$ ושוכח את ממוצע השונויות המותנות $E[Var(X|Θ)]=4$."]}}, {"id": "prb-003", "area": "prob-review", "topic": "conditional-expectation-as-rv", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["conditional-expectation", "tower-property", "properties"], "answer": 3, "en": {"q": "$X$ and $Y$ are arbitrary random variables with finite second moments. Which statement about $E[X|Y]$ is NOT true in general?", "options": ["$E[X|Y]$ is a random variable, namely a function of $Y$.", "$E[E[X|Y]]=E[X]$, the tower property.", "$Var(E[X|Y]) ≤ Var(X)$, with equality iff $X$ is a function of $Y$.", "$E[X|Y]$ is an affine function $aY+b$ of $Y$."], "hint": "Which of these needs an extra assumption, such as joint Gaussianity?", "explanation": "$E[X|Y]=g(Y)$ where $g(y)=∫x f_{X|Y}(x|y)dx$; the function $g$ is whatever the conditional density makes it and is generally nonlinear. For example with $Y ~ N(0,1)$ and $X=Y²$ we get $E[X|Y]=Y²$. Linearity of $E[X|Y]$ in $Y$ is a special property of the jointly Gaussian case (and of the LMMSE estimator, which is only an approximation in general). The other three hold always: it is $σ(Y)$-measurable, the tower property gives $E[E[X|Y]]=E[X]$, and total variance $Var(X)=E[Var(X|Y)]+Var(E[X|Y])$ forces $Var(E[X|Y]) ≤ Var(X)$.", "whyWrong": ["$E[X|Y]$ genuinely is a random variable: it takes the value $g(y)$ when $Y=y$, so it is a function of $Y$.", "The tower property $E[E[X|Y]]=E[X]$ is the law of total expectation and always holds for integrable $X$.", "The law of total variance gives $Var(X)-Var(E[X|Y])=E[Var(X|Y)] ≥ 0$, so this inequality always holds."]}, "he": {"q": "‏$X$ ו-$Y$ הם משתנים אקראיים כלליים בעלי מומנטים שניים סופיים. איזו טענה על $E[X|Y]$ אינה נכונה באופן כללי?", "options": ["‏$E[X|Y]$ הוא משתנה אקראי, כלומר פונקציה של $Y$.", "‏$E[E[X|Y]]=E[X]$, תכונת המגדל.", "‏$Var(E[X|Y]) ≤ Var(X)$, עם שוויון אם ורק אם $X$ הוא פונקציה של $Y$.", "‏$E[X|Y]$ הוא פונקציה אפינית $aY+b$ של $Y$."], "hint": "איזו מהטענות דורשת הנחה נוספת, כמו גאוסיאניות משותפת?", "explanation": "מתקיים $E[X|Y]=g(Y)$ כאשר $g(y)=∫x f_{X|Y}(x|y)dx$; הפונקציה $g$ נקבעת על ידי הצפיפות המותנית והיא בדרך כלל אינה לינארית. למשל עבור $Y ~ N(0,1)$ ו-$X=Y²$ מתקבל $E[X|Y]=Y²$. לינאריות של $E[X|Y]$ ב-$Y$ היא תכונה מיוחדת של המקרה הגאוסי המשותף (ושל אומד ה-LMMSE, שהוא רק קירוב במקרה הכללי). שלוש הטענות האחרות תמיד נכונות: זו פונקציה מדידה של $Y$, תכונת המגדל נותנת $E[E[X|Y]]=E[X]$, ונוסחת השונות השלמה $Var(X)=E[Var(X|Y)]+Var(E[X|Y])$ כופה $Var(E[X|Y]) ≤ Var(X)$.", "whyWrong": ["‏$E[X|Y]$ אכן משתנה אקראי: הוא מקבל את הערך $g(y)$ כאשר $Y=y$, ולכן הוא פונקציה של $Y$.", "תכונת המגדל $E[E[X|Y]]=E[X]$ היא נוסחת התוחלת השלמה ומתקיימת תמיד עבור $X$ אינטגרבילי.", "נוסחת השונות השלמה נותנת $Var(X)-Var(E[X|Y])=E[Var(X|Y)] ≥ 0$, ולכן אי-השוויון תמיד מתקיים."]}}, {"id": "prb-004", "area": "prob-review", "topic": "conditional-gaussian", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["bivariate-gaussian", "conditional-density", "regression-line"], "answer": 2, "en": {"q": "$(X,Y)$ are jointly Gaussian with $μ_X=1$, $μ_Y=2$, $σ_X²=4$, $σ_Y²=9$ and $ρ=1/2$. Compute $E[X|Y=5]$ and $Var(X|Y=5)$.", "options": ["$E=2$, $Var=4$", "$E=4$, $Var=3$", "$E=2$, $Var=3$", "$E=3.25$, $Var=3$"], "hint": "$E[X|Y=y]=μ_X+ρ(σ_X/σ_Y)(y-μ_Y)$ and $Var(X|Y=y)=σ_X²(1-ρ²)$.", "explanation": "With $σ_X=2$ and $σ_Y=3$: $E[X|Y=5]=1+(1/2)(2/3)(5-2)=1+1=2$. The conditional variance does not depend on $y$: $Var(X|Y=5)=4(1-1/4)=3$. Conditioning on $Y$ removes the fraction $ρ²=1/4$ of the variance of $X$.", "whyWrong": ["$Var=4$ is the unconditional $σ_X²$; the factor $(1-ρ²)$ that conditioning contributes has been dropped.", "$E=4$ comes from $1+ρ σ_X (y-μ_Y)$, i.e. multiplying by $σ_X$ instead of dividing by $σ_Y$.", "$E=3.25$ uses the ratio $σ_Y/σ_X=3/2$ instead of $σ_X/σ_Y=2/3$ in the regression coefficient."]}, "he": {"q": "‏$(X,Y)$ גאוסיים במשותף עם $μ_X=1$, $μ_Y=2$, $σ_X²=4$, $σ_Y²=9$ ו-$ρ=1/2$. חשב את $E[X|Y=5]$ ואת $Var(X|Y=5)$.", "options": ["$E=2$, $Var=4$", "$E=4$, $Var=3$", "$E=2$, $Var=3$", "$E=3.25$, $Var=3$"], "hint": "‏$E[X|Y=y]=μ_X+ρ(σ_X/σ_Y)(y-μ_Y)$ וכן $Var(X|Y=y)=σ_X²(1-ρ²)$.", "explanation": "עם $σ_X=2$ ו-$σ_Y=3$: ‏$E[X|Y=5]=1+(1/2)(2/3)(5-2)=1+1=2$. השונות המותנית אינה תלויה ב-$y$: ‏$Var(X|Y=5)=4(1-1/4)=3$. ההתניה ב-$Y$ מסלקת את החלק $ρ²=1/4$ מהשונות של $X$.", "whyWrong": ["‏$Var=4$ היא השונות הלא-מותנית $σ_X²$; הגורם $(1-ρ²)$ שנוסף בעקבות ההתניה הושמט.", "‏$E=4$ מתקבל מ-$1+ρ σ_X (y-μ_Y)$, כלומר מכפל ב-$σ_X$ במקום חילוק ב-$σ_Y$.", "‏$E=3.25$ משתמש ביחס $σ_Y/σ_X=3/2$ במקום ב-$σ_X/σ_Y=2/3$ במקדם הרגרסיה."]}}, {"id": "prb-005", "area": "prob-review", "topic": "uncorrelated-vs-independent", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["independence", "uncorrelated", "counterexample"], "answer": 1, "en": {"q": "Let $X ~ N(0,1)$ and $Y=X²$. Which statement is correct?", "options": ["$X$ and $Y$ are independent, and therefore uncorrelated.", "$Cov(X,Y)=0$, yet $X$ and $Y$ are strongly dependent.", "$Cov(X,Y)=1$, so they are both correlated and dependent.", "$Cov(X,Y)=2$, matching $Var(Y)=2$."], "hint": "Compute $E[XY]=E[X³]$ for a symmetric density, then ask whether knowing $X$ tells you anything about $Y$.", "explanation": "$Cov(X,Y)=E[X·X²]-E[X]E[X²]=E[X³]-0=0$, since all odd moments of a zero-mean Gaussian vanish. So $ρ_{XY}=0$. But $Y$ is a deterministic function of $X$: knowing $X=x$ pins $Y$ exactly at $x²$, so they are as dependent as two variables can be. Zero correlation only kills the linear part of the relationship; here the dependence is purely quadratic.", "whyWrong": ["They cannot be independent: $Y$ is a function of $X$, so $f_{XY}$ does not factor.", "$Cov(X,Y)=E[X³]=0$ by symmetry, not $1$; the value $1$ confuses $Cov(X,X²)$ with $Var(X)$.", "$Var(Y)=E[X⁴]-1=3-1=2$ is correct, but that is the variance of $Y$, not the covariance of $X$ with $Y$."]}, "he": {"q": "יהי $X ~ N(0,1)$ ו-$Y=X²$. איזו טענה נכונה?", "options": ["‏$X$ ו-$Y$ בלתי תלויים, ולכן גם בלתי מתואמים.", "‏$Cov(X,Y)=0$, ובכל זאת $X$ ו-$Y$ תלויים מאוד.", "‏$Cov(X,Y)=1$, ולכן הם גם מתואמים וגם תלויים.", "‏$Cov(X,Y)=2$, בהתאמה ל-$Var(Y)=2$."], "hint": "חשב את $E[XY]=E[X³]$ עבור צפיפות סימטרית, ולאחר מכן שאל אם ידיעת $X$ מלמדת משהו על $Y$.", "explanation": "‏$Cov(X,Y)=E[X·X²]-E[X]E[X²]=E[X³]-0=0$, משום שכל המומנטים האי-זוגיים של גאוסי בעל תוחלת אפס מתאפסים. לכן $ρ_{XY}=0$. אך $Y$ הוא פונקציה דטרמיניסטית של $X$: ידיעת $X=x$ קובעת את $Y$ במדויק כ-$x²$, ולכן התלות ביניהם מלאה. מתאם אפס מבטל רק את החלק הלינארי בקשר; כאן התלות ריבועית לחלוטין.", "whyWrong": ["הם אינם יכולים להיות בלתי תלויים: ‏$Y$ הוא פונקציה של $X$, ולכן $f_{XY}$ אינה מתפרקת למכפלה.", "‏$Cov(X,Y)=E[X³]=0$ מטעמי סימטריה ולא $1$; הערך $1$ מבלבל בין $Cov(X,X²)$ לבין $Var(X)$.", "‏$Var(Y)=E[X⁴]-1=3-1=2$ אכן נכון, אך זו השונות של $Y$ ולא השונות המשותפת של $X$ ו-$Y$."]}}, {"id": "prb-006", "area": "prob-review", "topic": "marginal-vs-joint-gaussian", "difficulty": 4, "type": "open", "hardnessSource": "trap", "tags": ["jointly-gaussian", "uncorrelated", "counterexample"], "en": {"q": "Construct $X$ and $Y$ that are each Gaussian and uncorrelated but not independent. Explain why this does not contradict the theorem 'jointly Gaussian and uncorrelated implies independent'.", "hint": "Randomly flip the sign of one Gaussian, and then test whether $X+Y$ is Gaussian.", "modelAnswer": "Take $X ~ N(0,1)$ and an independent sign $S$ with $P(S=1)=P(S=-1)=1/2$, and set $Y=SX$. Marginally $Y$ is Gaussian: conditioned on $S=1$ it is $N(0,1)$ and conditioned on $S=-1$ it is also $N(0,1)$ by symmetry of the Gaussian density, so $Y ~ N(0,1)$. They are uncorrelated: $Cov(X,Y)=E[XY]=E[S X²]=E[S]E[X²]=0·1=0$, using independence of $S$ and $X$. They are not independent: $|Y|=|X|$ with probability one, so for instance $P(|Y|>2 | |X|<1)=0$ while $P(|Y|>2)>0$. The theorem is not violated because it requires the pair $(X,Y)$ to be jointly Gaussian, which is strictly stronger than each marginal being Gaussian. Here the pair is not jointly Gaussian: a jointly Gaussian pair makes every linear combination Gaussian, but $X+Y=X(1+S)$ equals $0$ with probability $1/2$ and equals $2X$ otherwise, a distribution with an atom at the origin, hence not Gaussian. Equivalently, the probability mass of $(X,Y)$ sits on the two lines $y=x$ and $y=-x$, so no two-dimensional Gaussian density exists.", "rubric": ["Gives an explicit construction, e.g. $Y=SX$ with a random sign $S$ independent of $X$, and argues that $Y$ is marginally $N(0,1)$.", "Shows $Cov(X,Y)=E[S]E[X²]=0$ using the independence of $S$ and $X$.", "Demonstrates dependence concretely, e.g. $|Y|=|X|$ always, so a conditional probability differs from the unconditional one.", "States that the theorem assumes joint Gaussianity, which does not follow from Gaussian marginals.", "Verifies non-joint-Gaussianity, e.g. $X+Y=X(1+S)$ is not Gaussian (it has an atom at $0$)."]}, "he": {"q": "בנה $X$ ו-$Y$ שכל אחד מהם גאוסי והם בלתי מתואמים אך תלויים. הסבר מדוע אין בכך סתירה למשפט 'גאוסיים במשותף ובלתי מתואמים גורר אי-תלות'.", "hint": "הפוך את הסימן של גאוסי אחד באופן אקראי, ולאחר מכן בדוק אם $X+Y$ גאוסי.", "modelAnswer": "ניקח $X ~ N(0,1)$ וסימן $S$ בלתי תלוי בו עם $P(S=1)=P(S=-1)=1/2$, ונגדיר $Y=SX$. שולית $Y$ גאוסי: בהינתן $S=1$ הוא $N(0,1)$, ובהינתן $S=-1$ הוא שוב $N(0,1)$ מסימטריית הצפיפות הגאוסית, ולכן $Y ~ N(0,1)$. הם בלתי מתואמים: ‏$Cov(X,Y)=E[XY]=E[S X²]=E[S]E[X²]=0·1=0$, תוך שימוש באי-התלות של $S$ ו-$X$. הם אינם בלתי תלויים: מתקיים $|Y|=|X|$ בהסתברות $1$, ולכן למשל $P(|Y|>2 | |X|<1)=0$ בעוד $P(|Y|>2)>0$. אין סתירה למשפט משום שהוא דורש שהזוג $(X,Y)$ יהיה גאוסי במשותף, דרישה חזקה ממש מכך שכל שוליה גאוסית. כאן הזוג אינו גאוסי במשותף: עבור זוג גאוסי במשותף כל צירוף לינארי גאוסי, אך $X+Y=X(1+S)$ שווה $0$ בהסתברות $1/2$ ושווה $2X$ אחרת, כלומר התפלגות עם אטום בראשית ולכן אינה גאוסית. באופן שקול, מסת ההסתברות של $(X,Y)$ מרוכזת על שני הישרים $y=x$ ו-$y=-x$, ולכן אין צפיפות גאוסית דו-ממדית.", "rubric": ["נותן בנייה מפורשת, למשל $Y=SX$ עם סימן אקראי $S$ בלתי תלוי ב-$X$, ומנמק ש-$Y$ שולית $N(0,1)$.", "מראה ש-$Cov(X,Y)=E[S]E[X²]=0$ באמצעות אי-התלות של $S$ ו-$X$.", "מדגים תלות באופן קונקרטי, למשל $|Y|=|X|$ תמיד, ולכן הסתברות מותנית שונה מהלא-מותנית.", "מציין שהמשפט מניח גאוסיאניות משותפת, שאינה נובעת מכך שהשוליות גאוסיות.", "מאמת שאין גאוסיאניות משותפת, למשל $X+Y=X(1+S)$ אינו גאוסי (יש לו אטום ב-$0$)."]}}, {"id": "prb-007", "area": "prob-review", "topic": "covariance-matrix-psd", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["covariance-matrix", "positive-semidefinite", "validity"], "answer": 0, "en": {"q": "Each option lists a symmetric $2×2$ matrix by its rows. Which one cannot be the covariance matrix of a real random vector $(X_1,X_2)$?", "options": ["$C=[[1,2],[2,3]]$", "$C=[[4,3],[3,4]]$", "$C=[[2,0],[0,5]]$", "$C=[[9,-3],[-3,2]]$"], "hint": "A covariance matrix must be symmetric and positive semi-definite; for $2×2$ check the diagonal and the determinant.", "explanation": "A valid covariance matrix needs non-negative diagonal entries and a non-negative determinant. For $[[1,2],[2,3]]$ the determinant is $1·3-2·2=-1<0$, so it has a negative eigenvalue and some linear combination $a X_1+b X_2$ would have negative variance. Equivalently $ρ=2/√(1·3)=1.15>1$, impossible. The others give determinants $7$, $10$ and $9$, all valid.", "whyWrong": ["$[[4,3],[3,4]]$ has determinant $7>0$ and $ρ=3/4$, a legitimate correlation.", "$[[2,0],[0,5]]$ is diagonal with positive entries: two uncorrelated variables with variances $2$ and $5$.", "$[[9,-3],[-3,2]]$ has determinant $18-9=9>0$; a negative off-diagonal entry is perfectly legal, it just means $ρ<0$."]}, "he": {"q": "כל אפשרות מציגה מטריצה סימטרית $2×2$ לפי שורותיה. איזו מהן אינה יכולה להיות מטריצת השונויות המשותפות של וקטור אקראי ממשי $(X_1,X_2)$?", "options": ["$C=[[1,2],[2,3]]$", "$C=[[4,3],[3,4]]$", "$C=[[2,0],[0,5]]$", "$C=[[9,-3],[-3,2]]$"], "hint": "מטריצת שונויות משותפות חייבת להיות סימטרית וחיובית למחצה; במקרה $2×2$ בדוק את האלכסון ואת הדטרמיננטה.", "explanation": "מטריצת שונויות משותפות חוקית מחייבת אלכסון אי-שלילי ודטרמיננטה אי-שלילית. עבור $[[1,2],[2,3]]$ הדטרמיננטה היא $1·3-2·2=-1<0$, ולכן יש ערך עצמי שלילי וקיים צירוף לינארי $a X_1+b X_2$ בעל שונות שלילית. באופן שקול $ρ=2/√(1·3)=1.15>1$, דבר בלתי אפשרי. הדטרמיננטות של האחרות הן $7$, $10$ ו-$9$, כולן חוקיות.", "whyWrong": ["ל-$[[4,3],[3,4]]$ דטרמיננטה $7>0$ ו-$ρ=3/4$, מתאם חוקי לחלוטין.", "‏$[[2,0],[0,5]]$ היא אלכסונית עם איברים חיוביים: שני משתנים בלתי מתואמים בעלי שונויות $2$ ו-$5$.", "ל-$[[9,-3],[-3,2]]$ דטרמיננטה $18-9=9>0$; איבר מחוץ לאלכסון שלילי חוקי לגמרי ומשמעותו רק $ρ<0$."]}}, {"id": "prb-008", "area": "prob-review", "topic": "transformation-jacobian", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["change-of-variable", "jacobian", "exponential"], "answer": 3, "en": {"q": "Let $U ~ Uniform(0,1)$ and define $Y=-2 ln U$. Find the density $f_Y(y)$ for $y>0$.", "options": ["$f_Y(y)=2e^{-2y}$", "$f_Y(y)=e^{-y/2}$", "$f_Y(y)=(1/2)e^{-2y}$", "$f_Y(y)=(1/2)e^{-y/2}$"], "hint": "$f_Y(y)=f_U(u)|du/dy|$ evaluated at the inverse $u=e^{-y/2}$.", "explanation": "The map is monotone decreasing: $y=-2 ln u$ gives $u=e^{-y/2}$ for $y>0$, and $|du/dy|=(1/2)e^{-y/2}$. Since $f_U(u)=1$ on $(0,1)$, $f_Y(y)=1·(1/2)e^{-y/2}$ for $y>0$. So $Y$ is exponential with mean $2$, which is also the $χ²$ density with two degrees of freedom. A check: $∫_0^∞ (1/2)e^{-y/2}dy=1$.", "whyWrong": ["$2e^{-2y}$ inverts the scaling: it is exponential with mean $1/2$, whereas $E[Y]=E[-2 ln U]=2$.", "$e^{-y/2}$ has the right exponent but no Jacobian factor, so it integrates to $2$, not $1$.", "$(1/2)e^{-2y}$ mixes the Jacobian of one map with the exponent of another and integrates to $1/4$."]}, "he": {"q": "יהי $U ~ Uniform(0,1)$ ונגדיר $Y=-2 ln U$. מצא את הצפיפות $f_Y(y)$ עבור $y>0$.", "options": ["$f_Y(y)=2e^{-2y}$", "$f_Y(y)=e^{-y/2}$", "$f_Y(y)=(1/2)e^{-2y}$", "$f_Y(y)=(1/2)e^{-y/2}$"], "hint": "‏$f_Y(y)=f_U(u)|du/dy|$ כאשר מציבים את ההופכית $u=e^{-y/2}$.", "explanation": "ההעתקה מונוטונית יורדת: מ-$y=-2 ln u$ מקבלים $u=e^{-y/2}$ עבור $y>0$, ולכן $|du/dy|=(1/2)e^{-y/2}$. מכיוון ש-$f_U(u)=1$ בקטע $(0,1)$, מתקבל $f_Y(y)=1·(1/2)e^{-y/2}$ עבור $y>0$. כלומר $Y$ מעריכי בעל תוחלת $2$, שהיא גם צפיפות $χ²$ עם שתי דרגות חופש. בדיקה: $∫_0^∞ (1/2)e^{-y/2}dy=1$.", "whyWrong": ["‏$2e^{-2y}$ הופך את הסקאלה: זהו מעריכי בעל תוחלת $1/2$, בעוד ש-$E[Y]=E[-2 ln U]=2$.", "ל-$e^{-y/2}$ יש המעריך הנכון אך חסר גורם היעקוביאן, ולכן האינטגרל שלו הוא $2$ ולא $1$.", "‏$(1/2)e^{-2y}$ מערבב יעקוביאן של העתקה אחת עם מעריך של אחרת, והאינטגרל שלו הוא $1/4$."]}}, {"id": "prb-009", "area": "prob-review", "topic": "convolution-of-densities", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["sum-of-independent", "convolution", "uniform"], "answer": 2, "en": {"q": "$X$ and $Y$ are independent, each $Uniform(0,2)$, and $Z=X+Y$. Compute the value of the density $f_Z(1)$.", "options": ["$1/2$", "$1$", "$1/4$", "$1/8$"], "hint": "$f_Z(z)=∫ f_X(t) f_Y(z-t) dt$; for $0<z<2$ the overlap of the two windows has length $z$.", "explanation": "Both densities equal $1/2$ on $(0,2)$. For $0<z≤2$ the integrand $f_X(t)f_Y(z-t)=1/4$ only for $0<t<z$, so $f_Z(z)=(1/4)z$. Hence $f_Z(1)=1/4$. The full density is the triangle rising as $z/4$ up to the peak $f_Z(2)=1/2$ and falling as $(4-z)/4$ afterwards; its integral is $1$.", "whyWrong": ["$1/2$ is the height of the individual uniform density (and the peak of the triangle at $z=2$), not the value at $z=1$.", "$1$ comes from convolving with unit-height densities, forgetting the two factors of $1/2$.", "$1/8$ uses an overlap length of $1/2$ instead of the correct length $z=1$."]}, "he": {"q": "‏$X$ ו-$Y$ בלתי תלויים, כל אחד $Uniform(0,2)$, ו-$Z=X+Y$. חשב את ערך הצפיפות $f_Z(1)$.", "options": ["$1/2$", "$1$", "$1/4$", "$1/8$"], "hint": "‏$f_Z(z)=∫ f_X(t) f_Y(z-t) dt$; עבור $0<z<2$ אורך החפיפה בין שני החלונות הוא $z$.", "explanation": "שתי הצפיפויות שוות $1/2$ בקטע $(0,2)$. עבור $0<z≤2$ המכפלה $f_X(t)f_Y(z-t)=1/4$ רק כאשר $0<t<z$, ולכן $f_Z(z)=(1/4)z$. מכאן $f_Z(1)=1/4$. הצפיפות המלאה היא משולש העולה כ-$z/4$ עד לשיא $f_Z(2)=1/2$ ויורד כ-$(4-z)/4$ אחריו; האינטגרל שלה הוא $1$.", "whyWrong": ["‏$1/2$ הוא גובה הצפיפות האחידה הבודדת (וגם שיא המשולש ב-$z=2$), ולא הערך ב-$z=1$.", "‏$1$ מתקבל מקונבולוציה של צפיפויות בגובה $1$, תוך שכחת שני הגורמים $1/2$.", "‏$1/8$ משתמש באורך חפיפה $1/2$ במקום באורך הנכון $z=1$."]}}, {"id": "prb-010", "area": "prob-review", "topic": "characteristic-function", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["characteristic-function", "gaussian", "moments"], "answer": 0, "en": {"q": "A random variable has characteristic function $Φ_X(ω)=exp(j2ω-8ω²)$. Find $E[X]$ and $Var(X)$.", "options": ["$E[X]=2$, $Var(X)=16$", "$E[X]=2$, $Var(X)=8$", "$E[X]=2$, $Var(X)=4$", "$E[X]=j2$, $Var(X)=16$"], "hint": "For a Gaussian, $Φ_X(ω)=exp(jμω-σ²ω²/2)$.", "explanation": "Matching $exp(jμω-σ²ω²/2)$ with $exp(j2ω-8ω²)$ gives $μ=2$ and $σ²/2=8$, hence $σ²=16$. The same result follows from the moment property: $E[X]=-j Φ'(0)=-j(j2)=2$ and $E[X²]=-Φ''(0)=20$, so $Var(X)=20-4=16$.", "whyWrong": ["$Var(X)=8$ reads the coefficient $8$ as $σ²$ and forgets the factor $1/2$ in the exponent.", "$Var(X)=4$ treats $8ω²$ as $(σω)²/2$ with $σ=4$ misread, or takes $σ$ itself as the variance.", "$E[X]=j2$ forgets the factor $-j$ in $E[X]=-jΦ'(0)$; a mean must be real."]}, "he": {"q": "למשתנה אקראי יש פונקציה אופיינית $Φ_X(ω)=exp(j2ω-8ω²)$. מצא את $E[X]$ ואת $Var(X)$.", "options": ["$E[X]=2$, $Var(X)=16$", "$E[X]=2$, $Var(X)=8$", "$E[X]=2$, $Var(X)=4$", "$E[X]=j2$, $Var(X)=16$"], "hint": "עבור גאוסי מתקיים $Φ_X(ω)=exp(jμω-σ²ω²/2)$.", "explanation": "השוואת $exp(jμω-σ²ω²/2)$ ל-$exp(j2ω-8ω²)$ נותנת $μ=2$ ו-$σ²/2=8$, ומכאן $σ²=16$. אותה תוצאה מתקבלת מתכונת המומנטים: ‏$E[X]=-j Φ'(0)=-j(j2)=2$ וכן $E[X²]=-Φ''(0)=20$, ולכן $Var(X)=20-4=16$.", "whyWrong": ["‏$Var(X)=8$ קורא את המקדם $8$ כ-$σ²$ ושוכח את הגורם $1/2$ במעריך.", "‏$Var(X)=4$ מפרש את $8ω²$ באופן שגוי ולוקח למעשה את $σ$ כשונות.", "‏$E[X]=j2$ שוכח את הגורם $-j$ בנוסחה $E[X]=-jΦ'(0)$; תוחלת חייבת להיות ממשית."]}}, {"id": "prb-011", "area": "prob-review", "topic": "linear-transform-of-gaussians", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["gaussian", "q-function", "linear-combination"], "answer": 1, "en": {"q": "$X ~ N(1,4)$ and $Y ~ N(-2,9)$ are independent, and $Z=2X-Y+3$. Express $P(Z>12)$ using the $Q$-function.", "options": ["$Q(1.39)$", "$Q(1)$", "$Q(0.2)$", "$Q(5)$"], "hint": "A linear combination of independent Gaussians is Gaussian; scale variances by the square of the coefficient.", "explanation": "$E[Z]=2·1-(-2)+3=7$ and $Var(Z)=2²·4+(-1)²·9=16+9=25$, so $Z ~ N(7,25)$ and $σ_Z=5$. Then $P(Z>12)=P((Z-7)/5>(12-7)/5)=Q(1)$. Note the variance uses $a²$, and the sign of the coefficient of $Y$ does not affect it.", "whyWrong": ["$Q(1.39)$ uses $Var(Z)=4+9=13$, forgetting to square the coefficient $2$ multiplying $X$.", "$Q(0.2)$ divides the deviation $5$ by the variance $25$ instead of by the standard deviation $5$.", "$Q(5)$ uses the raw deviation $12-7=5$ without normalising by $σ_Z$ at all."]}, "he": {"q": "‏$X ~ N(1,4)$ ו-$Y ~ N(-2,9)$ בלתי תלויים, ו-$Z=2X-Y+3$. בטא את $P(Z>12)$ באמצעות פונקציית $Q$.", "options": ["$Q(1.39)$", "$Q(1)$", "$Q(0.2)$", "$Q(5)$"], "hint": "צירוף לינארי של גאוסיים בלתי תלויים הוא גאוסי; השונויות מוכפלות בריבוע המקדם.", "explanation": "‏$E[Z]=2·1-(-2)+3=7$ וכן $Var(Z)=2²·4+(-1)²·9=16+9=25$, ולכן $Z ~ N(7,25)$ ו-$σ_Z=5$. מכאן $P(Z>12)=P((Z-7)/5>(12-7)/5)=Q(1)$. שים לב שהשונות משתמשת ב-$a²$, ולכן סימן המקדם של $Y$ אינו משפיע עליה.", "whyWrong": ["‏$Q(1.39)$ משתמש ב-$Var(Z)=4+9=13$, ושוכח להעלות בריבוע את המקדם $2$ של $X$.", "‏$Q(0.2)$ מחלק את הסטייה $5$ בשונות $25$ במקום בסטיית התקן $5$.", "‏$Q(5)$ משתמש בסטייה הגולמית $12-7=5$ ללא נרמול ב-$σ_Z$ כלל."]}}, {"id": "prb-012", "area": "prob-review", "topic": "rayleigh-from-gaussians", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["rayleigh", "exponential", "envelope"], "answer": 3, "en": {"q": "$X$ and $Y$ are independent $N(0,2)$ and $R=√(X²+Y²)$. Compute $P(R>2)$.", "options": ["$e^{-2}$", "$e^{-1/2}$", "$e^{-4}$", "$e^{-1}$"], "hint": "$R$ is Rayleigh, so $R²=X²+Y²$ is exponential with mean $2σ²$.", "explanation": "With $σ²=2$, $R$ is Rayleigh with $f_R(r)=(r/σ²)e^{-r²/(2σ²)}$ and tail $P(R>r)=e^{-r²/(2σ²)}$. Equivalently $R²$ is exponential with mean $2σ²=4$. Hence $P(R>2)=P(R²>4)=e^{-4/4}=e^{-1}≈0.368$.", "whyWrong": ["$e^{-2}$ uses $P(R>r)=e^{-r²/(2σ²)}$ with $σ²=1$, i.e. it takes $σ²=2$ as $2σ²$.", "$e^{-1/2}$ divides by $2σ²·2=8$, an extra factor of $2$ in the exponent.", "$e^{-4}$ treats $R$ itself as exponential with mean $1$, ignoring the $r²$ in the Rayleigh tail."]}, "he": {"q": "‏$X$ ו-$Y$ בלתי תלויים ומתפלגים $N(0,2)$, ו-$R=√(X²+Y²)$. חשב את $P(R>2)$.", "options": ["$e^{-2}$", "$e^{-1/2}$", "$e^{-4}$", "$e^{-1}$"], "hint": "‏$R$ מתפלג ריילי, ולכן $R²=X²+Y²$ מעריכי בעל תוחלת $2σ²$.", "explanation": "עם $σ²=2$, המשתנה $R$ מתפלג ריילי עם $f_R(r)=(r/σ²)e^{-r²/(2σ²)}$ וזנב $P(R>r)=e^{-r²/(2σ²)}$. באופן שקול $R²$ מעריכי בעל תוחלת $2σ²=4$. לכן $P(R>2)=P(R²>4)=e^{-4/4}=e^{-1}≈0.368$.", "whyWrong": ["‏$e^{-2}$ משתמש בנוסחה $P(R>r)=e^{-r²/(2σ²)}$ עם $σ²=1$, כלומר מפרש את $σ²=2$ כ-$2σ²$.", "‏$e^{-1/2}$ מחלק ב-$2σ²·2=8$, כלומר גורם $2$ עודף במעריך.", "‏$e^{-4}$ מתייחס ל-$R$ עצמו כמעריכי בעל תוחלת $1$, ומתעלם מ-$r²$ בזנב הריילי."]}}, {"id": "prb-013", "area": "prob-review", "topic": "markov-chebyshev", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["markov-inequality", "chebyshev-inequality", "tail-bound"], "answer": 2, "en": {"q": "A non-negative $X$ has $E[X]=4$ and $Var(X)=9$. Which bounds on $P(X ≥ 10)$ do the Markov and the Chebyshev inequalities give?", "options": ["Markov $0.4$, Chebyshev $0.09$", "Markov $0.9$, Chebyshev $0.25$", "Markov $0.4$, Chebyshev $0.25$", "Markov $0.4$, Chebyshev $0.5$"], "hint": "Markov uses $E[X]/a$; Chebyshev bounds $P(|X-μ| ≥ k)$ by $σ²/k²$ with $k$ the deviation from the mean.", "explanation": "Markov: $P(X ≥ 10) ≤ E[X]/10 = 4/10 = 0.4$. Chebyshev: the event $X ≥ 10$ implies $|X-4| ≥ 6$, so $P(X ≥ 10) ≤ P(|X-4| ≥ 6) ≤ 9/6² = 9/36 = 0.25$. Chebyshev is tighter here because it exploits the variance as well as the mean.", "whyWrong": ["Chebyshev $0.09=9/10²$ uses the threshold $10$ instead of the deviation $10-4=6$ from the mean.", "Markov $0.9$ substitutes the variance $9$ for the mean in $E[X]/a$.", "Chebyshev $0.5$ halves the Markov bound rather than applying $σ²/k²$."]}, "he": {"q": "משתנה אי-שלילי $X$ מקיים $E[X]=4$ ו-$Var(X)=9$. אילו חסמים על $P(X ≥ 10)$ נותנים אי-שוויון מרקוב ואי-שוויון צ'בישב?", "options": ["מרקוב $0.4$, צ'בישב $0.09$", "מרקוב $0.9$, צ'בישב $0.25$", "מרקוב $0.4$, צ'בישב $0.25$", "מרקוב $0.4$, צ'בישב $0.5$"], "hint": "מרקוב משתמש ב-$E[X]/a$; צ'בישב חוסם את $P(|X-μ| ≥ k)$ ב-$σ²/k²$ כאשר $k$ היא הסטייה מהתוחלת.", "explanation": "מרקוב: ‏$P(X ≥ 10) ≤ E[X]/10 = 4/10 = 0.4$. צ'בישב: המאורע $X ≥ 10$ גורר $|X-4| ≥ 6$, ולכן $P(X ≥ 10) ≤ P(|X-4| ≥ 6) ≤ 9/6² = 9/36 = 0.25$. צ'בישב הדוק יותר כאן משום שהוא מנצל גם את השונות ולא רק את התוחלת.", "whyWrong": ["צ'בישב $0.09=9/10²$ משתמש בסף $10$ במקום בסטייה $10-4=6$ מהתוחלת.", "מרקוב $0.9$ מציב את השונות $9$ במקום התוחלת בנוסחה $E[X]/a$.", "צ'בישב $0.5$ מחלק את חסם מרקוב בשניים במקום להפעיל את $σ²/k²$."]}}, {"id": "prb-014", "area": "prob-review", "topic": "q-function-two-sided", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["q-function", "gaussian-tail", "absolute-value"], "answer": 0, "en": {"q": "$X ~ N(3,16)$. Express $P(|X|>5)$ with the $Q$-function.", "options": ["$Q(0.5)+Q(2)$", "$2Q(0.5)$", "$Q(0.5)-Q(2)$", "$Q(2)-Q(0.5)$"], "hint": "Split into $X>5$ and $X<-5$; the density is not symmetric about $0$ because $μ=3$.", "explanation": "Standardise with $σ=4$: $P(X>5)=Q((5-3)/4)=Q(0.5)$, and $P(X<-5)=P((X-3)/4<(-5-3)/4)=P(Z<-2)=Q(2)$. The two events are disjoint, so $P(|X|>5)=Q(0.5)+Q(2)$. The lower tail is far smaller because the mean sits at $3$, not at $0$.", "whyWrong": ["$2Q(0.5)$ assumes symmetry about $0$, which holds only for a zero-mean Gaussian.", "$Q(0.5)-Q(2)$ subtracts the lower tail instead of adding it, although the two tails are disjoint events.", "$Q(2)-Q(0.5)$ is negative-oriented and even reverses which tail is larger, since $Q(2)<Q(0.5)$."]}, "he": {"q": "‏$X ~ N(3,16)$. בטא את $P(|X|>5)$ באמצעות פונקציית $Q$.", "options": ["$Q(0.5)+Q(2)$", "$2Q(0.5)$", "$Q(0.5)-Q(2)$", "$Q(2)-Q(0.5)$"], "hint": "פרק למאורעות $X>5$ ו-$X<-5$; הצפיפות אינה סימטרית סביב $0$ משום ש-$μ=3$.", "explanation": "מנרמלים עם $σ=4$: ‏$P(X>5)=Q((5-3)/4)=Q(0.5)$, וכן $P(X<-5)=P((X-3)/4<(-5-3)/4)=P(Z<-2)=Q(2)$. שני המאורעות זרים, ולכן $P(|X|>5)=Q(0.5)+Q(2)$. הזנב התחתון קטן בהרבה משום שהתוחלת היא $3$ ולא $0$.", "whyWrong": ["‏$2Q(0.5)$ מניח סימטריה סביב $0$, שמתקיימת רק עבור גאוסי בעל תוחלת אפס.", "‏$Q(0.5)-Q(2)$ מחסר את הזנב התחתון במקום לחבר אותו, בעוד ששני הזנבות מאורעות זרים שיש לחבר.", "‏$Q(2)-Q(0.5)$ אף הופך את סדר הזנבות ונותן ערך שלילי, שכן $Q(2)<Q(0.5)$."]}}, {"id": "prb-015", "area": "prob-review", "topic": "joint-marginal-density", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["joint-density", "marginal", "expectation"], "answer": 3, "en": {"q": "The joint density is $f_{XY}(x,y)=x+y$ on the unit square $0<x<1$, $0<y<1$, and zero elsewhere. Compute $E[X]$.", "options": ["$1/2$", "$2/3$", "$7/6$", "$7/12$"], "hint": "First integrate out $y$ to get $f_X(x)$, then compute $∫ x f_X(x) dx$.", "explanation": "The marginal is $f_X(x)=∫_0^1 (x+y)dy = x+1/2$ on $(0,1)$, which integrates to $1/2+1/2=1$ as required. Then $E[X]=∫_0^1 x(x+1/2)dx = 1/3+1/4 = 7/12$. By symmetry $E[Y]=7/12$ as well. Note $f_{XY}$ does not factor, so $X$ and $Y$ are dependent.", "whyWrong": ["$1/2$ is the mean of a uniform marginal; here the marginal $x+1/2$ tilts the mass towards larger $x$.", "$2/3$ is $E[X]$ for the marginal $f_X(x)=2x$, which belongs to a different joint density.", "$7/6$ is $E[X+Y]=E[X]+E[Y]$, twice the requested quantity."]}, "he": {"q": "הצפיפות המשותפת היא $f_{XY}(x,y)=x+y$ בריבוע היחידה $0<x<1$, $0<y<1$, ואפס מחוצה לו. חשב את $E[X]$.", "options": ["$1/2$", "$2/3$", "$7/6$", "$7/12$"], "hint": "תחילה בצע אינטגרציה על $y$ כדי לקבל את $f_X(x)$, ולאחר מכן חשב $∫ x f_X(x) dx$.", "explanation": "הצפיפות השולית היא $f_X(x)=∫_0^1 (x+y)dy = x+1/2$ בקטע $(0,1)$, והאינטגרל שלה הוא $1/2+1/2=1$ כנדרש. מכאן $E[X]=∫_0^1 x(x+1/2)dx = 1/3+1/4 = 7/12$. מסימטריה גם $E[Y]=7/12$. שים לב ש-$f_{XY}$ אינה מתפרקת למכפלה, ולכן $X$ ו-$Y$ תלויים.", "whyWrong": ["‏$1/2$ היא התוחלת של שוליה אחידה; כאן השוליה $x+1/2$ מטה את המסה לכיוון $x$ גדול יותר.", "‏$2/3$ היא $E[X]$ עבור השוליה $f_X(x)=2x$, השייכת לצפיפות משותפת אחרת.", "‏$7/6$ היא $E[X+Y]=E[X]+E[Y]$, פי שניים מהגודל המבוקש."]}}, {"id": "prb-016", "area": "prob-review", "topic": "square-of-a-gaussian", "difficulty": 4, "type": "open", "hardnessSource": "trap", "tags": ["transformation", "two-branch", "chi-square"], "en": {"q": "Let $X ~ N(0,σ²)$ and $Y=X²$. Derive $f_Y(y)$ from first principles, and explain exactly where the factor $2$ in the derivation comes from.", "hint": "The map $x → x²$ is not one-to-one; work through the CDF $P(Y ≤ y)=P(-√y ≤ X ≤ √y)$.", "modelAnswer": "For $y ≤ 0$, $F_Y(y)=0$ since $Y ≥ 0$. For $y>0$, $F_Y(y)=P(X² ≤ y)=P(-√y ≤ X ≤ √y)=F_X(√y)-F_X(-√y)$. Differentiating with the chain rule, $f_Y(y)=f_X(√y)·(1/(2√y)) + f_X(-√y)·(1/(2√y))$, i.e. the general two-branch formula $f_Y(y)=Σ_k f_X(x_k)/|dy/dx|_{x_k}$ summed over both roots $x_1=√y$ and $x_2=-√y$, each carrying $|dy/dx|=2|x|=2√y$. Because the $N(0,σ²)$ density is even, $f_X(√y)=f_X(-√y)=(1/√(2πσ²))e^{-y/(2σ²)}$, so the two identical branch contributions add to $f_Y(y)=(1/√(2πσ²y)) e^{-y/(2σ²)}$ for $y>0$, and $0$ otherwise. This is the $χ²$ density with one degree of freedom scaled by $σ²$; it is unbounded as $y → 0^+$ yet integrable. Checks: $E[Y]=E[X²]=σ²$ and $Var(Y)=E[X⁴]-σ⁴=3σ⁴-σ⁴=2σ⁴$. The factor $2$ is therefore not a Jacobian artefact but the count of preimages: every $y>0$ has two $x$ values mapping onto it, and both contribute probability mass.", "rubric": ["Starts from the CDF and writes $F_Y(y)=F_X(√y)-F_X(-√y)$ for $y>0$, with $f_Y(y)=0$ for $y<0$.", "Differentiates correctly, obtaining the derivative factor $1/(2√y)$ for each branch.", "States the multi-branch rule $f_Y(y)=Σ_k f_X(x_k)/|dy/dx|_{x_k}$ and identifies the two roots $±√y$.", "Reaches $f_Y(y)=(1/√(2πσ²y))e^{-y/(2σ²)}$ for $y>0$ and notes that the $2$ comes from the two preimages combined with the even symmetry of $f_X$.", "Sanity-checks the result, e.g. $∫f_Y=1$, $E[Y]=σ²$, or identifies it as a $χ²$ density with one degree of freedom."]}, "he": {"q": "יהי $X ~ N(0,σ²)$ ו-$Y=X²$. גזור את $f_Y(y)$ מהיסוד, והסבר בדיוק מהיכן מגיע הגורם $2$ בגזירה.", "hint": "ההעתקה $x → x²$ אינה חד-חד-ערכית; עבוד דרך פונקציית ההתפלגות $P(Y ≤ y)=P(-√y ≤ X ≤ √y)$.", "modelAnswer": "עבור $y ≤ 0$ מתקיים $F_Y(y)=0$ שכן $Y ≥ 0$. עבור $y>0$: ‏$F_Y(y)=P(X² ≤ y)=P(-√y ≤ X ≤ √y)=F_X(√y)-F_X(-√y)$. גזירה לפי כלל השרשרת נותנת $f_Y(y)=f_X(√y)·(1/(2√y)) + f_X(-√y)·(1/(2√y))$, כלומר הנוסחה הכללית לשני ענפים $f_Y(y)=Σ_k f_X(x_k)/|dy/dx|_{x_k}$ בסכימה על שני השורשים $x_1=√y$ ו-$x_2=-√y$, כאשר לכל אחד $|dy/dx|=2|x|=2√y$. מכיוון שהצפיפות $N(0,σ²)$ זוגית, $f_X(√y)=f_X(-√y)=(1/√(2πσ²))e^{-y/(2σ²)}$, ולכן שתי תרומות הענפים הזהות מצטברות ל-$f_Y(y)=(1/√(2πσ²y)) e^{-y/(2σ²)}$ עבור $y>0$, ואפס אחרת. זוהי צפיפות $χ²$ עם דרגת חופש אחת מוכפלת ב-$σ²$; היא אינה חסומה כאשר $y → 0^+$ אך אינטגרבילית. בדיקות: ‏$E[Y]=E[X²]=σ²$ וכן $Var(Y)=E[X⁴]-σ⁴=3σ⁴-σ⁴=2σ⁴$. הגורם $2$ אינו תוצר של היעקוביאן אלא ספירת המקורות: לכל $y>0$ יש שני ערכי $x$ הממופים אליו, ושניהם תורמים מסת הסתברות.", "rubric": ["מתחיל מפונקציית ההתפלגות וכותב $F_Y(y)=F_X(√y)-F_X(-√y)$ עבור $y>0$, עם $f_Y(y)=0$ עבור $y<0$.", "גוזר נכון ומקבל את גורם הנגזרת $1/(2√y)$ לכל ענף.", "מנסח את כלל הענפים המרובים $f_Y(y)=Σ_k f_X(x_k)/|dy/dx|_{x_k}$ ומזהה את שני השורשים $±√y$.", "מגיע ל-$f_Y(y)=(1/√(2πσ²y))e^{-y/(2σ²)}$ עבור $y>0$ ומציין שהגורם $2$ נובע משני המקורות יחד עם זוגיות $f_X$.", "מבצע בדיקת שפיות, למשל $∫f_Y=1$, ‏$E[Y]=σ²$, או זיהוי הצפיפות כ-$χ²$ עם דרגת חופש אחת."]}}, {"id": "cnv-001", "area": "convergence", "topic": "modes-of-convergence", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["almost-sure", "mean-square", "in-probability", "implications"], "answer": 1, "en": {"q": "A sequence $X_n$ converges to $X$. Which implication between modes of convergence is NOT valid in general?", "options": ["Almost sure convergence implies convergence in probability.", "Convergence in probability implies mean-square convergence.", "Mean-square convergence implies convergence in probability.", "Convergence in probability implies convergence in distribution."], "hint": "Draw the arrows: a.s. and m.s. both point to convergence in probability, which points to convergence in distribution.", "explanation": "The standard hierarchy is: almost sure $⇒$ in probability, mean square $⇒$ in probability, and in probability $⇒$ in distribution. Nothing points back up. Convergence in probability does not imply mean-square convergence because it says nothing about the size of $X_n$ on the shrinking bad set: a rare event of vanishing probability can still carry an exploding second moment. Mean square $⇒$ in probability follows from Chebyshev: $P(|X_n-X|>ε) ≤ E[|X_n-X|²]/ε² → 0$.", "whyWrong": ["Almost sure convergence does imply convergence in probability; the converse is the one that fails.", "Mean-square convergence implies convergence in probability directly by the Chebyshev/Markov inequality.", "Convergence in probability implies convergence in distribution; this is the weakest mode and sits at the bottom of the hierarchy."]}, "he": {"q": "סדרה $X_n$ מתכנסת ל-$X$. איזו גרירה בין מודי ההתכנסות אינה נכונה באופן כללי?", "options": ["התכנסות כמעט בוודאות גוררת התכנסות בהסתברות.", "התכנסות בהסתברות גוררת התכנסות בממוצע ריבועי.", "התכנסות בממוצע ריבועי גוררת התכנסות בהסתברות.", "התכנסות בהסתברות גוררת התכנסות בהתפלגות."], "hint": "שרטט את החצים: כמעט בוודאות וממוצע ריבועי מצביעים שניהם על התכנסות בהסתברות, וזו מצביעה על התכנסות בהתפלגות.", "explanation": "ההיררכיה הסטנדרטית היא: כמעט בוודאות $⇒$ בהסתברות, ממוצע ריבועי $⇒$ בהסתברות, ובהסתברות $⇒$ בהתפלגות. אין חצים בכיוון ההפוך. התכנסות בהסתברות אינה גוררת התכנסות בממוצע ריבועי משום שהיא אינה אומרת דבר על גודל $X_n$ על הקבוצה הרעה המתכווצת: מאורע נדיר בעל הסתברות מתאפסת עדיין יכול לשאת מומנט שני מתפוצץ. הגרירה ממוצע ריבועי $⇒$ בהסתברות נובעת מצ'בישב: ‏$P(|X_n-X|>ε) ≤ E[|X_n-X|²]/ε² → 0$.", "whyWrong": ["התכנסות כמעט בוודאות אכן גוררת התכנסות בהסתברות; דווקא הכיוון ההפוך אינו נכון.", "התכנסות בממוצע ריבועי גוררת התכנסות בהסתברות ישירות מאי-שוויון צ'בישב/מרקוב.", "התכנסות בהסתברות גוררת התכנסות בהתפלגות; זהו המוד החלש ביותר והוא בתחתית ההיררכיה."]}}, {"id": "cnv-002", "area": "convergence", "topic": "probability-not-mean-square", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["counterexample", "mean-square", "in-probability"], "answer": 2, "en": {"q": "Independent variables satisfy $X_n=n$ with probability $1/n$ and $X_n=0$ otherwise. Which statement is correct?", "options": ["$X_n → 0$ in mean square, because $P(X_n ≠ 0) → 0$.", "$X_n → 0$ almost surely but not in probability.", "$X_n → 0$ in probability, but not in mean square.", "$X_n$ does not converge in probability, because $E[X_n]=1$ for all $n$."], "hint": "Compute $P(|X_n|>ε)$ and $E[X_n²]$ separately; they behave very differently.", "explanation": "For any $0<ε<1$, $P(|X_n|>ε)=1/n → 0$, so $X_n → 0$ in probability. But $E[X_n²]=n²·(1/n)=n → ∞$, so the mean-square error diverges; even the first moment $E[X_n]=n·(1/n)=1$ does not go to $0$. This is the standard demonstration that convergence in probability says nothing about moments. (In fact, since $Σ 1/n$ diverges and the $X_n$ are independent, Borel-Cantelli also rules out almost sure convergence.)", "whyWrong": ["A vanishing probability of being non-zero is not enough for mean square: the value $n$ grows faster than $1/n$ shrinks, and $E[X_n²]=n$.", "Almost sure convergence fails here (the divergence of $Σ1/n$ with independence puts $X_n=n$ infinitely often), while convergence in probability does hold.", "A non-vanishing mean is compatible with convergence in probability; the two are different statements, and here $P(|X_n|>ε)=1/n → 0$."]}, "he": {"q": "משתנים בלתי תלויים מקיימים $X_n=n$ בהסתברות $1/n$ ו-$X_n=0$ אחרת. איזו טענה נכונה?", "options": ["‏$X_n → 0$ בממוצע ריבועי, משום ש-$P(X_n ≠ 0) → 0$.", "‏$X_n → 0$ כמעט בוודאות אך לא בהסתברות.", "‏$X_n → 0$ בהסתברות, אך לא בממוצע ריבועי.", "‏$X_n$ אינו מתכנס בהסתברות, משום ש-$E[X_n]=1$ לכל $n$."], "hint": "חשב בנפרד את $P(|X_n|>ε)$ ואת $E[X_n²]$; התנהגותם שונה לחלוטין.", "explanation": "לכל $0<ε<1$ מתקיים $P(|X_n|>ε)=1/n → 0$, ולכן $X_n → 0$ בהסתברות. אך $E[X_n²]=n²·(1/n)=n → ∞$, ולכן השגיאה הריבועית הממוצעת מתבדרת; אפילו המומנט הראשון $E[X_n]=n·(1/n)=1$ אינו שואף לאפס. זו ההדגמה הסטנדרטית לכך שהתכנסות בהסתברות אינה אומרת דבר על מומנטים. (למעשה, מכיוון ש-$Σ 1/n$ מתבדר והמשתנים בלתי תלויים, למת בורל-קנטלי שוללת גם התכנסות כמעט בוודאות.)", "whyWrong": ["הסתברות מתאפסת להיות שונה מאפס אינה מספיקה להתכנסות בממוצע ריבועי: הערך $n$ גדל מהר יותר מכפי ש-$1/n$ קטן, ומתקיים $E[X_n²]=n$.", "התכנסות כמעט בוודאות אינה מתקיימת כאן (התבדרות $Σ1/n$ יחד עם אי-תלות גורמת ל-$X_n=n$ אינסוף פעמים), ואילו התכנסות בהסתברות כן מתקיימת.", "תוחלת שאינה מתאפסת מתיישבת עם התכנסות בהסתברות; אלו טענות שונות, וכאן $P(|X_n|>ε)=1/n → 0$."]}}, {"id": "cnv-003", "area": "convergence", "topic": "weak-vs-strong-lln", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["law-of-large-numbers", "sample-mean", "convergence-mode"], "answer": 0, "en": {"q": "$X_1,X_2,...$ are i.i.d. with finite mean $μ$, and $M_n$ is the sample mean. What exactly distinguishes the weak law of large numbers from the strong law?", "options": ["Weak: $M_n → μ$ in probability; strong: almost surely.", "Weak: $M_n → μ$ in distribution; strong: in probability.", "Weak: $M_n → μ$ almost surely; strong: in mean square.", "Weak: $M_n → μ$ in mean square; strong: in distribution."], "hint": "Both laws have the same limit $μ$; only the mode of convergence differs.", "explanation": "Both laws state that the sample mean approaches the ensemble mean $μ$; they differ in strength of the convergence. The weak law asserts $P(|M_n - μ|>ε) → 0$ for every $ε>0$ (convergence in probability), and follows from Chebyshev when $σ²<∞$. The strong law asserts $P(lim M_n = μ)=1$ (almost sure convergence), and needs only $E|X_1|<∞$. Almost sure convergence implies convergence in probability, so the strong law indeed implies the weak one.", "whyWrong": ["Convergence in distribution to a constant is the weakest statement of all and is not how either law is stated; the strong law is about almost sure convergence.", "This reverses the hierarchy: almost sure convergence is the strong law, not the weak one.", "Mean-square convergence requires $σ²<∞$ and is not the statement of either law; convergence in distribution is weaker still."]}, "he": {"q": "‏$X_1,X_2,...$ הם משתנים בלתי תלויים שווי התפלגות בעלי תוחלת סופית $μ$, ו-$M_n$ הוא ממוצע המדגם. מה בדיוק מבדיל בין החוק החלש של המספרים הגדולים לחוק החזק?", "options": ["חלש: ‏$M_n → μ$ בהסתברות; חזק: כמעט בוודאות.", "חלש: ‏$M_n → μ$ בהתפלגות; חזק: בהסתברות.", "חלש: ‏$M_n → μ$ כמעט בוודאות; חזק: בממוצע ריבועי.", "חלש: ‏$M_n → μ$ בממוצע ריבועי; חזק: בהתפלגות."], "hint": "בשני החוקים הגבול זהה ושווה $μ$; ההבדל הוא רק במוד ההתכנסות.", "explanation": "שני החוקים קובעים שממוצע המדגם מתקרב לתוחלת האנסמבל $μ$, והם נבדלים בעוצמת ההתכנסות. החוק החלש קובע $P(|M_n - μ|>ε) → 0$ לכל $ε>0$ (התכנסות בהסתברות), והוא נובע מצ'בישב כאשר $σ²<∞$. החוק החזק קובע $P(lim M_n = μ)=1$ (התכנסות כמעט בוודאות), ודורש רק $E|X_1|<∞$. התכנסות כמעט בוודאות גוררת התכנסות בהסתברות, ולכן החוק החזק אכן גורר את החלש.", "whyWrong": ["התכנסות בהתפלגות לקבוע היא הטענה החלשה מכולן ואינה הניסוח של אף אחד מהחוקים; החוק החזק עוסק בהתכנסות כמעט בוודאות.", "זהו היפוך ההיררכיה: התכנסות כמעט בוודאות היא החוק החזק ולא החלש.", "התכנסות בממוצע ריבועי דורשת $σ²<∞$ ואינה הניסוח של אף אחד מהחוקים; התכנסות בהתפלגות חלשה עוד יותר."]}}, {"id": "cnv-004", "area": "convergence", "topic": "clt-computation", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["central-limit-theorem", "q-function", "sum-of-iid"], "answer": 3, "en": {"q": "$X_1,...,X_{100}$ are i.i.d. with $E[X_i]=2$ and $Var(X_i)=9$, and $S=Σ_{i=1}^{100} X_i$. Use the CLT to express $P(S>230)$.", "options": ["$Q(10)$", "$Q(3.33)$", "$Q(0.3)$", "$Q(1)$"], "hint": "For a sum, $E[S]=nμ$ and $Var(S)=nσ²$; the standard deviation grows like $√n$.", "explanation": "$E[S]=100·2=200$ and $Var(S)=100·9=900$, so $σ_S=30$. The CLT gives $S$ approximately $N(200,900)$, hence $P(S>230)≈Q((230-200)/30)=Q(1)≈0.159$. Note the deviation $30$ is exactly one standard deviation of the sum, even though it is ten standard deviations of a single sample.", "whyWrong": ["$Q(10)$ uses $σ=3$, the standard deviation of one sample, forgetting the factor $n$ in $Var(S)=nσ²$.", "$Q(3.33)$ divides the deviation $30$ by $σ²=9$ instead of by $σ_S=30$.", "$Q(0.3)$ divides by $n=100$, which is the scaling appropriate to the sample mean, not to the sum."]}, "he": {"q": "‏$X_1,...,X_{100}$ בלתי תלויים ושווי התפלגות עם $E[X_i]=2$ ו-$Var(X_i)=9$, ו-$S=Σ_{i=1}^{100} X_i$. השתמש במשפט הגבול המרכזי כדי לבטא את $P(S>230)$.", "options": ["$Q(10)$", "$Q(3.33)$", "$Q(0.3)$", "$Q(1)$"], "hint": "עבור סכום מתקיים $E[S]=nμ$ ו-$Var(S)=nσ²$; סטיית התקן גדלה כמו $√n$.", "explanation": "‏$E[S]=100·2=200$ וכן $Var(S)=100·9=900$, ולכן $σ_S=30$. משפט הגבול המרכזי נותן ש-$S$ מתפלג בקירוב $N(200,900)$, ומכאן $P(S>230)≈Q((230-200)/30)=Q(1)≈0.159$. שים לב שהסטייה $30$ היא בדיוק סטיית תקן אחת של הסכום, אף שהיא עשר סטיות תקן של דגימה בודדת.", "whyWrong": ["‏$Q(10)$ משתמש ב-$σ=3$, סטיית התקן של דגימה בודדת, ושוכח את הגורם $n$ ב-$Var(S)=nσ²$.", "‏$Q(3.33)$ מחלק את הסטייה $30$ ב-$σ²=9$ במקום ב-$σ_S=30$.", "‏$Q(0.3)$ מחלק ב-$n=100$, נרמול המתאים לממוצע המדגם ולא לסכום."]}}, {"id": "cnv-005", "area": "convergence", "topic": "clt-limits", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["central-limit-theorem", "misconceptions", "conditions"], "en": {"q": "State the central limit theorem precisely for i.i.d. $X_i$ with mean $μ$ and finite variance $σ²$, and name at least two things the theorem does NOT claim.", "hint": "The theorem is a statement about one specific normalised sequence and about CDFs, nothing more.", "modelAnswer": "Statement: let $X_1,X_2,...$ be i.i.d. with $E[X_i]=μ$ and $0<σ²=Var(X_i)<∞$, and let $S_n=Σ_{i=1}^n X_i$ and $M_n=S_n/n$. Then $Z_n=(S_n-nμ)/(σ√n)$ converges in distribution to $N(0,1)$: $P(Z_n ≤ z) → Φ(z)$ for every $z$. Equivalently $√n(M_n - μ)/σ → N(0,1)$ in distribution. What it does not claim: (1) It is not a statement about almost sure or mean-square convergence; $Z_n$ does not converge to any random variable in those senses, only its distribution settles. (2) It does not say $S_n$ or $M_n$ is exactly Gaussian for finite $n$; for a fixed $n$ the approximation carries an error, of order $1/√n$ in the CDF by the Berry-Esseen bound. (3) It does not guarantee accuracy in the far tails: the relative error at $z$ of order $√n$ can be huge, which is why rare-event probabilities need large-deviation methods rather than the CLT. (4) It does not claim convergence of densities or of moments; only CDFs at continuity points are covered. (5) It does not apply when $σ²=∞$ (e.g. Cauchy summands), where a different, non-Gaussian stable limit appears. Note also the limit does not require $M_n$ itself to be studied: $M_n → μ$ is the law of large numbers, and without the $√n$ magnification the limit distribution is degenerate.", "rubric": ["States the normalisation $(S_n-nμ)/(σ√n)$ and the limit $N(0,1)$, in distribution.", "Names the hypotheses: i.i.d. (or a Lindeberg-type condition) and finite non-zero variance.", "Points out that convergence in distribution is not almost sure or mean-square convergence.", "Points out that for finite $n$ the sum is not exactly Gaussian, and/or that the tails are the weak point of the approximation.", "Notes that $M_n → μ$ without the $√n$ scaling is the LLN and gives a degenerate limit, or that infinite variance breaks the theorem."]}, "he": {"q": "נסח במדויק את משפט הגבול המרכזי עבור $X_i$ בלתי תלויים שווי התפלגות עם תוחלת $μ$ ושונות סופית $σ²$, וציין לפחות שני דברים שהמשפט אינו טוען.", "hint": "המשפט הוא טענה על סדרה מנורמלת אחת ספציפית ועל פונקציות התפלגות, ולא יותר מכך.", "modelAnswer": "ניסוח: יהיו $X_1,X_2,...$ בלתי תלויים שווי התפלגות עם $E[X_i]=μ$ ו-$0<σ²=Var(X_i)<∞$, ויהי $S_n=Σ_{i=1}^n X_i$ ו-$M_n=S_n/n$. אזי $Z_n=(S_n-nμ)/(σ√n)$ מתכנס בהתפלגות ל-$N(0,1)$, כלומר $P(Z_n ≤ z) → Φ(z)$ לכל $z$. באופן שקול $√n(M_n - μ)/σ → N(0,1)$ בהתפלגות. מה שהמשפט אינו טוען: (1) אין זו טענה על התכנסות כמעט בוודאות או בממוצע ריבועי; ‏$Z_n$ אינו מתכנס לשום משתנה אקראי במובנים אלה, רק ההתפלגות שלו מתייצבת. (2) אין הוא אומר ש-$S_n$ או $M_n$ גאוסיים במדויק עבור $n$ סופי; עבור $n$ נתון לקירוב יש שגיאה, מסדר $1/√n$ בפונקציית ההתפלגות לפי חסם ברי-אסין. (3) אין הוא מבטיח דיוק בזנבות הרחוקים: השגיאה היחסית בנקודה $z$ מסדר $√n$ עלולה להיות עצומה, ולכן הסתברויות של מאורעות נדירים מחייבות שיטות סטיות גדולות ולא את משפט הגבול המרכזי. (4) אין הוא טוען התכנסות של צפיפויות או של מומנטים; מכוסות רק פונקציות התפלגות בנקודות רציפות. (5) אין הוא חל כאשר $σ²=∞$ (למשל מחוברים קושי), ואז מתקבל גבול יציב אחר שאינו גאוסי. כמו כן, $M_n → μ$ הוא חוק המספרים הגדולים, ובלי ההגדלה ב-$√n$ התפלגות הגבול מנוונת.", "rubric": ["מנסח את הנרמול $(S_n-nμ)/(σ√n)$ ואת הגבול $N(0,1)$ בהתכנסות בהתפלגות.", "מציין את ההנחות: אי-תלות ושוויון התפלגות (או תנאי מסוג לינדברג) ושונות סופית ושונה מאפס.", "מציין שהתכנסות בהתפלגות אינה התכנסות כמעט בוודאות או בממוצע ריבועי.", "מציין שעבור $n$ סופי הסכום אינו גאוסי במדויק, ו/או שהזנבות הם נקודת התורפה של הקירוב.", "מציין ש-$M_n → μ$ ללא הסקאלה $√n$ הוא חוק המספרים הגדולים ונותן גבול מנוון, או ששונות אינסופית שוברת את המשפט."]}}, {"id": "cnv-006", "area": "convergence", "topic": "mean-square-derivative", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["mean-square-derivative", "autocorrelation", "second-derivative"], "answer": 1, "en": {"q": "A mean-square differentiable WSS process has $R_X(τ)=e^{-2τ²}$. Compute $E[(X'(t))²]$.", "options": ["$2$", "$4$", "$-4$", "$0$"], "hint": "$R_{X'}(τ)=-d²R_X(τ)/dτ²$, and the mean-square value is $R_{X'}(0)$.", "explanation": "Differentiate: $R_X'(τ)=-4τ e^{-2τ²}$ and $R_X''(τ)=(-4+16τ²)e^{-2τ²}$, so $R_X''(0)=-4$. The autocorrelation of the derivative process is $R_{X'}(τ)=-R_X''(τ)$, hence $E[(X'(t))²]=R_{X'}(0)=-R_X''(0)=4$. The sign convention is what makes the answer positive, as a mean-square value must be.", "whyWrong": ["$2$ drops a factor from the chain rule, e.g. writing $R_X'(τ)=-2τe^{-2τ²}$ instead of $-4τe^{-2τ²}$.", "$-4$ is $R_X''(0)$ itself: the minus sign in $R_{X'}=-R_X''$ was omitted, and a mean-square value can never be negative.", "$0$ comes from $R_X'(0)=0$, but that is the first derivative, which vanishes at the peak of any differentiable $R_X$."]}, "he": {"q": "לתהליך WSS הגזיר בממוצע ריבועי יש $R_X(τ)=e^{-2τ²}$. חשב את $E[(X'(t))²]$.", "options": ["$2$", "$4$", "$-4$", "$0$"], "hint": "‏$R_{X'}(τ)=-d²R_X(τ)/dτ²$, והערך הריבועי הממוצע הוא $R_{X'}(0)$.", "explanation": "גוזרים: ‏$R_X'(τ)=-4τ e^{-2τ²}$ וכן $R_X''(τ)=(-4+16τ²)e^{-2τ²}$, ולכן $R_X''(0)=-4$. האוטוקורלציה של תהליך הנגזרת היא $R_{X'}(τ)=-R_X''(τ)$, ומכאן $E[(X'(t))²]=R_{X'}(0)=-R_X''(0)=4$. מוסכמת הסימן היא שמבטיחה תוצאה חיובית, כנדרש מערך ריבועי ממוצע.", "whyWrong": ["‏$2$ מאבד גורם מכלל השרשרת, למשל כתיבת $R_X'(τ)=-2τe^{-2τ²}$ במקום $-4τe^{-2τ²}$.", "‏$-4$ הוא $R_X''(0)$ עצמו: סימן המינוס בנוסחה $R_{X'}=-R_X''$ הושמט, וערך ריבועי ממוצע לעולם אינו שלילי.", "‏$0$ מתקבל מ-$R_X'(0)=0$, אך זו הנגזרת הראשונה, המתאפסת בשיא של כל $R_X$ גזירה."]}}, {"id": "cnv-007", "area": "convergence", "topic": "ms-continuity-vs-differentiability", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["mean-square-continuity", "mean-square-derivative", "exponential-autocorrelation"], "en": {"q": "$X(t)$ is WSS with $R_X(τ)=σ²e^{-α|τ|}$, $α>0$. Show that it is mean-square continuous but not mean-square differentiable, and relate this to $R_X''(0)$.", "hint": "Both properties are read off the behaviour of $R_X$ at $τ=0$: continuity there, and existence of a finite second derivative there.", "modelAnswer": "Mean-square continuity: $E[|X(t+h)-X(t)|²]=2R_X(0)-2R_X(h)=2σ²(1-e^{-α|h|})$. As $h → 0$ this tends to $0$, so $X(t+h) → X(t)$ in mean square for every $t$; the general criterion is that $X$ is m.s. continuous iff $R_X(τ)$ is continuous at $τ=0$, which holds here. Mean-square differentiability: form the difference quotient and compute $E[|(X(t+h)-X(t))/h|²]=2σ²(1-e^{-α|h|})/h²$. For small $|h|$, $1-e^{-α|h|}≈α|h|$, so the expression behaves like $2σ²α/|h| → ∞$. The quotient therefore has unbounded second moment and cannot converge in mean square, so $X'(t)$ does not exist in the m.s. sense. Equivalently, the criterion for m.s. differentiability is that $R_X''(0)$ exists and is finite. Here $R_X'(τ)=-ασ² sgn(τ) e^{-α|τ|}$ jumps from $+ασ²$ at $0^-$ to $-ασ²$ at $0^+$, so $R_X$ has a corner at the origin and $R_X''(0)$ does not exist as a finite number; in the distribution sense $R_X''(τ)=α²σ²e^{-α|τ|}-2ασ²δ(τ)$, and $E[(X')²]=-R_X''(0)=∞$. The same conclusion follows in the frequency domain: $S_X(f)=2ασ²/(α²+(2πf)²)$ decays like $1/f²$, so $∫(2πf)²S_X(f)df=∞$, and that integral is exactly the mean-square value of the derivative.", "rubric": ["Computes $E[|X(t+h)-X(t)|²]=2(R_X(0)-R_X(h))$ and shows it tends to $0$, giving m.s. continuity (equivalently, $R_X$ continuous at $0$).", "Forms the difference quotient and shows its second moment $2σ²(1-e^{-α|h|})/h²$ diverges like $1/|h|$.", "States the criterion that m.s. differentiability requires $R_X''(0)$ to exist and be finite.", "Shows $R_X$ has a corner at $τ=0$ ($R_X'(0^+)=-ασ²$, $R_X'(0^-)=+ασ²$), so the second derivative at $0$ is not finite.", "Optionally confirms via the spectrum: $S_X(f) ~ 1/f²$ makes $∫(2πf)²S_X(f)df$ diverge, i.e. $E[(X')²]=∞$."]}, "he": {"q": "‏$X(t)$ הוא תהליך WSS עם $R_X(τ)=σ²e^{-α|τ|}$, ‏$α>0$. הראה שהוא רציף בממוצע ריבועי אך אינו גזיר בממוצע ריבועי, וקשר זאת ל-$R_X''(0)$.", "hint": "שתי התכונות נקראות מהתנהגות $R_X$ סביב $τ=0$: רציפות שם, וקיום נגזרת שנייה סופית שם.", "modelAnswer": "רציפות בממוצע ריבועי: ‏$E[|X(t+h)-X(t)|²]=2R_X(0)-2R_X(h)=2σ²(1-e^{-α|h|})$. כאשר $h → 0$ ביטוי זה שואף לאפס, ולכן $X(t+h) → X(t)$ בממוצע ריבועי לכל $t$; הקריטריון הכללי הוא ש-$X$ רציף בממוצע ריבועי אם ורק אם $R_X(τ)$ רציפה ב-$τ=0$, ואכן כך כאן. גזירות בממוצע ריבועי: בונים את מנת ההפרשים ומחשבים $E[|(X(t+h)-X(t))/h|²]=2σ²(1-e^{-α|h|})/h²$. עבור $|h|$ קטן מתקיים $1-e^{-α|h|}≈α|h|$, ולכן הביטוי מתנהג כמו $2σ²α/|h| → ∞$. מכאן שלמנת ההפרשים מומנט שני בלתי חסום והיא אינה יכולה להתכנס בממוצע ריבועי, ולכן $X'(t)$ אינו קיים במובן הריבועי. באופן שקול, הקריטריון לגזירות בממוצע ריבועי הוא קיום $R_X''(0)$ סופית. כאן $R_X'(τ)=-ασ² sgn(τ) e^{-α|τ|}$ קופצת מ-$+ασ²$ ב-$0^-$ ל-$-ασ²$ ב-$0^+$, כלומר ל-$R_X$ יש נקודת שבירה בראשית ו-$R_X''(0)$ אינה קיימת כמספר סופי; במובן הפונקציות המוכללות $R_X''(τ)=α²σ²e^{-α|τ|}-2ασ²δ(τ)$, ומכאן $E[(X')²]=-R_X''(0)=∞$. אותה מסקנה מתקבלת בתחום התדר: ‏$S_X(f)=2ασ²/(α²+(2πf)²)$ דועכת כמו $1/f²$, ולכן $∫(2πf)²S_X(f)df=∞$, וזהו בדיוק הערך הריבועי הממוצע של הנגזרת.", "rubric": ["מחשב $E[|X(t+h)-X(t)|²]=2(R_X(0)-R_X(h))$ ומראה שהוא שואף לאפס, ומכאן רציפות בממוצע ריבועי (שקול לרציפות $R_X$ ב-$0$).", "בונה את מנת ההפרשים ומראה שהמומנט השני שלה $2σ²(1-e^{-α|h|})/h²$ מתבדר כמו $1/|h|$.", "מנסח את הקריטריון שגזירות בממוצע ריבועי מחייבת קיום $R_X''(0)$ סופית.", "מראה של-$R_X$ יש נקודת שבירה ב-$τ=0$ (‏$R_X'(0^+)=-ασ²$, ‏$R_X'(0^-)=+ασ²$), ולכן הנגזרת השנייה בראשית אינה סופית.", "מאשש לחלופין דרך הספקטרום: ‏$S_X(f) ~ 1/f²$ גורם ל-$∫(2πf)²S_X(f)df$ להתבדר, כלומר $E[(X')²]=∞$."]}}, {"id": "cnv-008", "area": "convergence", "topic": "sample-mean-of-correlated-samples", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["sample-mean", "correlated-samples", "variance"], "answer": 2, "en": {"q": "Three samples $X_1,X_2,X_3$ each have variance $4$, and $Cov(X_i,X_j)=1$ for every $i ≠ j$. Compute $Var((X_1+X_2+X_3)/3)$.", "options": ["$4/3$", "$5/3$", "$2$", "$18$"], "hint": "$Var(ΣX_i)=Σ_i Var(X_i)+Σ_{i≠j} Cov(X_i,X_j)$; there are $6$ ordered off-diagonal pairs for $n=3$.", "explanation": "$Var(X_1+X_2+X_3)=3·4+6·1=18$, since the three variances contribute $12$ and the six ordered pairs $(i,j)$ with $i≠j$ contribute $1$ each. Dividing by $3$ squares the factor: $Var(M)=18/9=2$. Positive correlation makes the sample mean noisier than the independent value $σ²/n=4/3$: correlated samples carry less information than independent ones.", "whyWrong": ["$4/3$ is $σ²/n$, valid only for uncorrelated samples; it ignores the positive covariances.", "$5/3$ counts each unordered pair once ($15/9$) instead of using the factor $2$ for $(i,j)$ and $(j,i)$.", "$18$ is $Var(X_1+X_2+X_3)$, the variance of the sum; the mean divides it by $n²=9$, not by $1$."]}, "he": {"q": "לשלוש דגימות $X_1,X_2,X_3$ שונות $4$ כל אחת, ומתקיים $Cov(X_i,X_j)=1$ לכל $i ≠ j$. חשב את $Var((X_1+X_2+X_3)/3)$.", "options": ["$4/3$", "$5/3$", "$2$", "$18$"], "hint": "‏$Var(ΣX_i)=Σ_i Var(X_i)+Σ_{i≠j} Cov(X_i,X_j)$; עבור $n=3$ יש $6$ זוגות סדורים מחוץ לאלכסון.", "explanation": "‏$Var(X_1+X_2+X_3)=3·4+6·1=18$, שכן שלוש השונויות תורמות $12$ וששת הזוגות הסדורים $(i,j)$ עם $i≠j$ תורמים $1$ כל אחד. החלוקה ב-$3$ מרבעת את הגורם: ‏$Var(M)=18/9=2$. מתאם חיובי הופך את ממוצע המדגם לרועש יותר מהערך הבלתי תלוי $σ²/n=4/3$: דגימות מתואמות נושאות פחות מידע מדגימות בלתי תלויות.", "whyWrong": ["‏$4/3$ הוא $σ²/n$, נכון רק עבור דגימות בלתי מתואמות; הוא מתעלם מהשונויות המשותפות החיוביות.", "‏$5/3$ סופר כל זוג לא סדור פעם אחת ($15/9$) במקום להשתמש בגורם $2$ עבור $(i,j)$ ו-$(j,i)$.", "‏$18$ הוא $Var(X_1+X_2+X_3)$, שונות הסכום; עבור הממוצע יש לחלק ב-$n²=9$ ולא ב-$1$."]}}, {"id": "cnv-009", "area": "convergence", "topic": "time-average-vs-ensemble-mean", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["ergodicity", "wss", "time-average"], "answer": 3, "en": {"q": "Define $X(t)=A$ for all $t$, where $A ~ N(0,1)$ is drawn once. Which statement is correct?", "options": ["It is not WSS, because the sample functions do not vary with $t$.", "It is WSS and mean-ergodic, because $E[X(t)]=0$ for all $t$.", "It is mean-ergodic but not WSS, since the time average exists.", "It is WSS, but not mean-ergodic."], "hint": "Compute the time average of one realisation and compare it with the ensemble mean $0$.", "explanation": "The mean $E[X(t)]=E[A]=0$ is constant and $R_X(t,t+τ)=E[A²]=1$ depends on no time argument, so the process is WSS. But each realisation is a constant line: the time average $(1/2T)∫_{-T}^{T}X(t)dt=A$ for every $T$, a random variable with variance $1$ that never settles to $0$. So the time average does not converge to the ensemble mean and the process is not mean-ergodic. Consistently, $C_X(τ)=1$ does not decay, so the memory never dies out.", "whyWrong": ["Constant sample functions are perfectly compatible with WSS: WSS constrains the mean and the autocorrelation, not the wiggliness of realisations.", "A constant mean is a requirement for WSS, not a proof of ergodicity; ergodicity is about a single realisation reproducing ensemble averages.", "It is WSS, and the mere existence of a time average says nothing: here the limit is the random variable $A$, not the constant $0$."]}, "he": {"q": "נגדיר $X(t)=A$ לכל $t$, כאשר $A ~ N(0,1)$ מוגרל פעם אחת. איזו טענה נכונה?", "options": ["התהליך אינו WSS, משום שפונקציות המדגם אינן משתנות עם $t$.", "התהליך הוא WSS וארגודי בתוחלת, משום ש-$E[X(t)]=0$ לכל $t$.", "התהליך ארגודי בתוחלת אך אינו WSS, שכן הממוצע בזמן קיים.", "התהליך הוא WSS, אך אינו ארגודי בתוחלת."], "hint": "חשב את הממוצע בזמן של מימוש בודד והשווה אותו לתוחלת האנסמבל $0$.", "explanation": "התוחלת $E[X(t)]=E[A]=0$ קבועה, ו-$R_X(t,t+τ)=E[A²]=1$ אינה תלויה באף ארגומנט זמן, ולכן התהליך WSS. אך כל מימוש הוא קו קבוע: הממוצע בזמן $(1/2T)∫_{-T}^{T}X(t)dt=A$ לכל $T$, משתנה אקראי בעל שונות $1$ שאינו מתייצב על $0$. לכן הממוצע בזמן אינו מתכנס לתוחלת האנסמבל והתהליך אינו
