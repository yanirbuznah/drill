 הפירוק הוא $bias^2 + var$.", "לגרסה חסרת ההטיה לא יכול להיות $MSE = 0.75$: בהטיה אפס ה-MSE שווה לשונות, שהוכפלה ל-$1.5$."]}}, {"id": "est-021", "area": "estimation", "topic": "unbiasedness-consistency-efficiency", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["unbiased", "consistent", "efficient", "trap"], "answer": 2, "en": {"q": "$Y_1,...,Y_N$ are i.i.d. with mean $μ$ and finite variance $σ^2$. Which statement about unbiasedness, consistency and efficiency is correct?", "options": ["An unbiased estimator is automatically consistent, since its mean is $μ$", "A consistent estimator must be unbiased at every sample size $N$", "$θ_e = Y_1$ is unbiased for $μ$ but is not consistent", "An efficient estimator is one whose bias decreases like $1/N$"], "hint": "Consistency is about the whole distribution collapsing onto $μ$ as $N$ grows, not about the mean of the estimator.", "explanation": "$E[Y_1] = μ$, so $Y_1$ is unbiased for every $N$, yet its variance stays $σ^2$ no matter how much data is collected, so it does not converge in probability to $μ$: it is not consistent. The sample mean has $E = μ$ and variance $σ^2/N → 0$, hence is unbiased and (by Chebyshev or the weak law) consistent. Efficiency is a separate notion: an unbiased estimator is efficient when its variance attains the Cramer-Rao bound.", "whyWrong": ["Unbiasedness constrains only the mean of the estimator; without variance shrinking to zero there is no convergence to $μ$.", "Consistency is asymptotic and tolerates bias at finite $N$, provided the bias vanishes as $N → ∞$; the ML estimator of $σ^2$ is the classic example.", "Efficiency refers to attaining the minimum possible variance among unbiased estimators, not to any rate of decay of the bias."]}, "he": {"q": "‏$Y_1,...,Y_N$ הם i.i.d. עם תוחלת $μ$ ושונות סופית $σ^2$. איזה משפט על חוסר הטיה, עקיבות ויעילות נכון?", "options": ["אומד חסר הטיה הוא אוטומטית עקיב, כיוון שתוחלתו $μ$", "אומד עקיב חייב להיות חסר הטיה בכל גודל מדגם $N$", "‏$θ_e = Y_1$ חסר הטיה עבור $μ$ אך אינו עקיב", "אומד יעיל הוא כזה שהטייתו דועכת כ-$1/N$"], "hint": "עקיבות עוסקת בהתכווצות ההתפלגות כולה סביב $μ$ כאשר $N$ גדל, לא בתוחלת האומד.", "explanation": "‏$E[Y_1] = μ$, ולכן $Y_1$ חסר הטיה לכל $N$, אך שונותו נשארת $σ^2$ ללא קשר לכמות הנתונים, ולכן הוא אינו מתכנס בהסתברות ל-$μ$: הוא אינו עקיב. לממוצע המדגם יש $E = μ$ ושונות $σ^2/N → 0$, ולכן הוא חסר הטיה וגם (לפי צ'בישב או החוק החלש) עקיב. יעילות היא מושג נפרד: אומד חסר הטיה יעיל כאשר שונותו משיגה את חסם קרמר-ראו.", "whyWrong": ["חוסר הטיה מגביל רק את תוחלת האומד; ללא שונות ששואפת לאפס אין התכנסות ל-$μ$.", "עקיבות היא תכונה אסימפטוטית והיא סובלת הטיה ב-$N$ סופי, ובלבד שההטיה נעלמת כאשר $N → ∞$; אומד ה-ML של $σ^2$ הוא הדוגמה הקלאסית.", "יעילות מתייחסת להשגת השונות המינימלית האפשרית בין אומדים חסרי הטיה, ולא לקצב דעיכה כלשהו של ההטיה."]}}, {"id": "est-022", "area": "estimation", "topic": "cramer-rao-statement", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["cramer-rao", "fisher-information", "efficiency"], "answer": 3, "en": {"q": "Let $I(θ) = -E[∂^2 ln f(y;θ)/∂θ^2]$ be the Fisher information. Which is the correct statement of the Cramer-Rao lower bound?", "options": ["$Var(θ_e) ≥ 1/I(θ)$ for every estimator, biased or unbiased", "$Var(θ_e) ≥ I(θ)$ for every unbiased estimator of $θ$", "$MSE(θ_e) ≥ 1/I(θ)$ for every estimator, so none can beat it", "$Var(θ_e) ≥ 1/I(θ)$ for unbiased $θ_e$, tight iff efficient"], "hint": "The bound constrains a restricted class of estimators, and involves the reciprocal of the information.", "explanation": "Under regularity conditions, any unbiased estimator satisfies $Var(θ_e) ≥ 1/I(θ)$; an unbiased estimator attaining the bound is called efficient, and it exists precisely when the score factors as $∂ln f/∂θ = I(θ)(θ_e-θ)$. More information means a tighter concentration of the likelihood around the true $θ$ and hence a smaller bound.", "whyWrong": ["Dropping unbiasedness breaks the bound: the trivial estimator $θ_e = c$ has zero variance for any constant $c$.", "$Var ≥ I(θ)$ inverts the relationship; large Fisher information must permit a small variance, not force a large one.", "In MSE terms a biased estimator can go below $1/I(θ)$; the biased-estimator form of the bound carries a $(1+db/dθ)^2$ factor and a $b^2$ term."]}, "he": {"q": "יהי $I(θ) = -E[∂^2 ln f(y;θ)/∂θ^2]$ אינפורמציית פישר. מהו הניסוח הנכון של חסם קרמר-ראו התחתון?", "options": ["‏$Var(θ_e) ≥ 1/I(θ)$ לכל אומד, מוטה או חסר הטיה", "‏$Var(θ_e) ≥ I(θ)$ לכל אומד חסר הטיה של הפרמטר $θ$", "‏$MSE(θ_e) ≥ 1/I(θ)$ לכל אומד, ולכן אף אחד אינו עובר אותו", "‏$Var(θ_e) ≥ 1/I(θ)$ לחסר הטיה, הדוק אם ורק אם יעיל"], "hint": "החסם מגביל מחלקת אומדים מצומצמת, ומערב את ההופכי של האינפורמציה.", "explanation": "תחת תנאי רגולריות, כל אומד חסר הטיה מקיים $Var(θ_e) ≥ 1/I(θ)$; אומד חסר הטיה המשיג את החסם נקרא יעיל, והוא קיים בדיוק כאשר הציון מתפרק כ-$∂ln f/∂θ = I(θ)(θ_e-θ)$. יותר אינפורמציה פירושה ריכוז חד יותר של פונקציית הנראות סביב ה-$θ$ האמיתי ולכן חסם קטן יותר.", "whyWrong": ["ויתור על חוסר הטיה שובר את החסם: האומד הטריוויאלי $θ_e = c$ בעל שונות אפס לכל קבוע $c$.", "‏$Var ≥ I(θ)$ הופך את הקשר; אינפורמציית פישר גדולה חייבת לאפשר שונות קטנה ולא לכפות שונות גדולה.", "במונחי MSE אומד מוטה יכול לרדת מתחת ל-$1/I(θ)$; צורת החסם לאומד מוטה נושאת פקטור $(1+db/dθ)^2$ ואיבר $b^2$."]}}, {"id": "est-023", "area": "estimation", "topic": "cramer-rao-computation", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["cramer-rao", "gaussian", "computation", "efficiency"], "answer": 0, "en": {"q": "$Y_i = A + N_i$, $i = 1,...,25$, with $N_i$ i.i.d. $N(0,4)$ and $A$ an unknown deterministic constant. Give the Cramer-Rao bound for unbiased estimators of $A$, and decide whether an unbiased estimator with variance $0.1$ can exist.", "options": ["$CRLB = 0.16$; variance $0.1$ is impossible", "$CRLB = 0.16$; variance $0.1$ is possible but inefficient", "$CRLB = 6.25$; variance $0.1$ is impossible", "$CRLB = 4$; variance $0.1$ is impossible"], "hint": "For $N$ i.i.d. Gaussian samples with known variance, the Fisher information about the mean is $N/σ^2$.", "explanation": "$ln f = const - Σ_i(y_i-A)^2/(2σ^2)$, so $∂^2 ln f/∂A^2 = -N/σ^2$ and $I(A) = N/σ^2 = 25/4 = 6.25$. The bound is $1/I(A) = 0.16$. Since $0.1 < 0.16$, no unbiased estimator can have that variance. The sample mean has variance $σ^2/N = 4/25 = 0.16$, so it attains the bound exactly and is efficient — nothing unbiased can do better here.", "whyWrong": ["A variance below the bound is not merely inefficient, it is forbidden: the CRLB is a hard lower limit for unbiased estimators.", "$6.25$ is the Fisher information $I(A)$ itself; the bound is its reciprocal, and the units alone rule it out as a variance.", "$4$ is the single-sample variance $σ^2$; the information adds over the $25$ independent samples, so the bound shrinks by the factor $N$."]}, "he": {"q": "‏$Y_i = A + N_i$, ‏$i = 1,...,25$, עם $N_i$ שהם i.i.d. ‏$N(0,4)$ ו-$A$ קבוע דטרמיניסטי לא ידוע. מהו חסם קרמר-ראו לאומדים חסרי הטיה של $A$, והאם יכול להתקיים אומד חסר הטיה עם שונות $0.1$?", "options": ["‏$CRLB = 0.16$; שונות $0.1$ בלתי אפשרית", "‏$CRLB = 0.16$; שונות $0.1$ אפשרית אך לא יעילה", "‏$CRLB = 6.25$; שונות $0.1$ בלתי אפשרית", "‏$CRLB = 4$; שונות $0.1$ בלתי אפשרית"], "hint": "עבור $N$ דגימות גאוסיות i.i.d. עם שונות ידועה, אינפורמציית פישר על התוחלת היא $N/σ^2$.", "explanation": "‏$ln f = const - Σ_i(y_i-A)^2/(2σ^2)$, ולכן $∂^2 ln f/∂A^2 = -N/σ^2$ ו-$I(A) = N/σ^2 = 25/4 = 6.25$. החסם הוא $1/I(A) = 0.16$. כיוון ש-$0.1 < 0.16$, לא קיים אומד חסר הטיה בעל שונות כזו. לממוצע המדגם שונות $σ^2/N = 4/25 = 0.16$, ולכן הוא משיג את החסם בדיוק והוא יעיל — שום אומד חסר הטיה לא יכול להיות טוב ממנו כאן.", "whyWrong": ["שונות מתחת לחסם אינה רק חוסר יעילות אלא אסורה: חסם קרמר-ראו הוא גבול תחתון קשיח לאומדים חסרי הטיה.", "‏$6.25$ היא אינפורמציית פישר $I(A)$ עצמה; החסם הוא ההופכי שלה, וכבר היחידות פוסלות אותה כשונות.", "‏$4$ היא שונות הדגימה הבודדת $σ^2$; האינפורמציה מתחברת על פני $25$ הדגימות הבלתי תלויות, ולכן החסם קטן בפקטור $N$."]}}, {"id": "est-024", "area": "estimation", "topic": "ml-versus-map", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["maximum-likelihood", "map", "gaussian-prior", "computation"], "answer": 1, "en": {"q": "$Y_i = θ + N_i$, $i = 1,...,4$, with $N_i$ i.i.d. $N(0,4)$ and prior $θ ~ N(0,1)$. The observed sample mean is $5$. Give the ML and the MAP estimates of $θ$.", "options": ["$θ_{ML} = 5$, $θ_{MAP} = 5$", "$θ_{ML} = 5$, $θ_{MAP} = 2.5$", "$θ_{ML} = 2.5$, $θ_{MAP} = 5$", "$θ_{ML} = 5$, $θ_{MAP} = 1$"], "hint": "Add precisions: the posterior precision is $1/σ_0^2 + N/σ_N^2$, and the posterior mean weights the prior mean and the sample mean by their precisions.", "explanation": "The likelihood is maximised by the sample mean, so $θ_{ML} = 5$. For a Gaussian prior the posterior is Gaussian with precision $1/σ_0^2 + N/σ_N^2 = 1/1 + 4/4 = 2$, hence variance $0.5$, and mean $(μ_0/σ_0^2 + (N/σ_N^2)·5)/2 = (0 + 1·5)/2 = 2.5$. Since the posterior is Gaussian the MAP estimate equals the posterior mean, so it is also the MMSE estimate. The two data sources — prior and measurements — happen to carry equal precision here, so the estimate lands halfway.", "whyWrong": ["MAP equals ML only when the prior is flat, or asymptotically as $N → ∞$; with $N = 4$ the prior still carries half the total precision.", "The ML estimate never uses the prior, so it cannot be the shrunk value $2.5$; the roles of the two estimates are reversed here.", "$1$ comes from weighting with $σ_0^2/(σ_0^2+σ_N^2) = 1/5$, i.e. forgetting that $N = 4$ measurements sharpen the noise variance to $σ_N^2/N = 1$."]}, "he": {"q": "‏$Y_i = θ + N_i$, ‏$i = 1,...,4$, עם $N_i$ שהם i.i.d. ‏$N(0,4)$ והתפלגות מוקדמת $θ ~ N(0,1)$. ממוצע המדגם הנצפה הוא $5$. מהם אומדי ה-ML וה-MAP של $θ$?", "options": ["‏$θ_{ML} = 5$, ‏$θ_{MAP} = 5$", "‏$θ_{ML} = 5$, ‏$θ_{MAP} = 2.5$", "‏$θ_{ML} = 2.5$, ‏$θ_{MAP} = 5$", "‏$θ_{ML} = 5$, ‏$θ_{MAP} = 1$"], "hint": "חבר דיוקים: דיוק ההתפלגות המאוחרת הוא $1/σ_0^2 + N/σ_N^2$, ותוחלתה משקללת את התוחלת המוקדמת ואת ממוצע המדגם לפי הדיוקים.", "explanation": "פונקציית הנראות ממוקסמת על ידי ממוצע המדגם, ולכן $θ_{ML} = 5$. עבור התפלגות מוקדמת גאוסית ההתפלגות המאוחרת גאוסית עם דיוק $1/σ_0^2 + N/σ_N^2 = 1/1 + 4/4 = 2$, ולכן שונות $0.5$, ותוחלת $(μ_0/σ_0^2 + (N/σ_N^2)·5)/2 = (0 + 1·5)/2 = 2.5$. כיוון שההתפלגות המאוחרת גאוסית, אומד ה-MAP שווה לתוחלת המאוחרת ולכן הוא גם אומד ה-MMSE. שני מקורות המידע — הידע המוקדם והמדידות — נושאים כאן דיוק שווה, ולכן האומד נוחת באמצע.", "whyWrong": ["‏MAP שווה ל-ML רק כשההתפלגות המוקדמת שטוחה, או אסימפטוטית כאשר $N → ∞$; עם $N = 4$ הידע המוקדם עדיין נושא מחצית מהדיוק הכולל.", "אומד ה-ML לעולם אינו משתמש בידע המוקדם, ולכן אינו יכול להיות הערך המכווץ $2.5$; תפקידי שני האומדים הוחלפו כאן.", "‏$1$ מתקבל משקלול עם $σ_0^2/(σ_0^2+σ_N^2) = 1/5$, כלומר שכחה ש-$N = 4$ מדידות מחדדות את שונות הרעש ל-$σ_N^2/N = 1$."]}}, {"id": "est-025", "area": "estimation", "topic": "uncorrelated-versus-independent", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["uncorrelated", "independence", "mmse", "trap"], "answer": 2, "en": {"q": "$X$ and $Y$ are zero-mean, uncorrelated ($Cov(X,Y)=0$) but not independent. Which statement is correct?", "options": ["The MMSE estimator of $X$ from $Y$ is $0$, because $Cov(X,Y) = 0$", "The LMMSE estimator is $0$ and it is optimal among all estimators", "The LMMSE estimator is $0$, but $E[X|Y]$ may depend on $Y$", "Uncorrelatedness forces $E[X|Y] = E[X]$ for finite-variance variables"], "hint": "Zero correlation only kills the linear part of the dependence; try $Y$ uniform on $(-1,1)$ and $X = Y^2 - 1/3$.", "explanation": "The LMMSE coefficient is $Cov(X,Y)/Var(Y) = 0$, so the best linear estimate is the prior mean $0$. But non-linear dependence survives. Take $Y ~ U(-1,1)$ and $X = Y^2 - 1/3$: then $E[X] = 0$ and $Cov(X,Y) = E[Y^3] = 0$, yet $E[X|Y] = Y^2 - 1/3$, which recovers $X$ exactly. Zero correlation makes linear processing useless, not the data useless.", "whyWrong": ["$Cov(X,Y) = 0$ constrains only the linear relationship; the conditional mean can still be a non-constant function of $Y$.", "The linear estimator is optimal over all estimators only when $E[X|Y]$ happens to be affine, as in the jointly Gaussian case.", "$E[X|Y] = E[X]$ is the mean-independence condition, which is strictly stronger than uncorrelatedness and strictly weaker than independence."]}, "he": {"q": "‏$X$ ו-$Y$ בעלי תוחלת אפס, חסרי מתאם ($Cov(X,Y)=0$) אך תלויים. איזה משפט נכון?", "options": ["אומד ה-MMSE של $X$ מתוך $Y$ הוא $0$, כי $Cov(X,Y) = 0$", "אומד ה-LMMSE הוא $0$ והוא אופטימלי מבין כל האומדים", "אומד ה-LMMSE הוא $0$, אך $E[X|Y]$ עשוי להיות תלוי ב-$Y$", "חוסר מתאם כופה $E[X|Y] = E[X]$ למשתנים בעלי שונות סופית"], "hint": "מתאם אפס מבטל רק את החלק הלינארי של התלות; נסה $Y$ אחיד על $(-1,1)$ ו-$X = Y^2 - 1/3$.", "explanation": "מקדם ה-LMMSE הוא $Cov(X,Y)/Var(Y) = 0$, ולכן ההערכה הלינארית הטובה ביותר היא התוחלת המוקדמת $0$. אך תלות לא-לינארית שורדת. ניקח $Y ~ U(-1,1)$ ו-$X = Y^2 - 1/3$: אז $E[X] = 0$ ו-$Cov(X,Y) = E[Y^3] = 0$, ובכל זאת $E[X|Y] = Y^2 - 1/3$, המשחזר את $X$ במדויק. מתאם אפס הופך את העיבוד הלינארי לחסר תועלת, לא את הנתונים.", "whyWrong": ["‏$Cov(X,Y) = 0$ מגביל רק את הקשר הלינארי; התוחלת המותנית עדיין יכולה להיות פונקציה לא קבועה של $Y$.", "האומד הלינארי אופטימלי מבין כל האומדים רק כאשר $E[X|Y]$ במקרה אפיני, כמו במקרה הגאוסי המשותף.", "‏$E[X|Y] = E[X]$ הוא תנאי אי-תלות בתוחלת, החזק ממש מחוסר מתאם וחלש ממש מאי-תלות."]}}, {"id": "est-026", "area": "estimation", "topic": "kalman-filter-concept", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["kalman", "recursive-lmmse", "innovations", "state-space"], "en": {"q": "For the state-space model $x[n] = Fx[n-1]+w[n]$, $y[n] = Hx[n]+v[n]$ with independent zero-mean white $w$, $v$ of covariances $Q$, $R$, describe the Kalman filter's prediction and update steps and explain why it is a recursive LMMSE estimator.", "hint": "Split the data into what was already known and the innovation $y[n]-Hx_e[n|n-1]$, and use that the innovation is orthogonal to the past.", "modelAnswer": "The filter propagates two quantities: the estimate $x_e[n|m]$ of the state given data up to time $m$, and its error covariance $P[n|m] = E[(x[n]-x_e[n|m])(·)^T]$. Prediction (time update): $x_e[n|n-1] = Fx_e[n-1|n-1]$ and $P[n|n-1] = FP[n-1|n-1]F^T + Q$ — the estimate is pushed through the dynamics and the uncertainty grows by the process noise. Update (measurement update): form the innovation $e[n] = y[n] - Hx_e[n|n-1]$ with covariance $S = HP[n|n-1]H^T + R$, the Kalman gain $K = P[n|n-1]H^TS^{-1}$, then $x_e[n|n] = x_e[n|n-1] + Ke[n]$ and $P[n|n] = (I-KH)P[n|n-1]$. Why recursive LMMSE: the estimate is the orthogonal projection of $x[n]$ onto the span of all measurements $y[1],...,y[n]$. The key fact is that the innovation $e[n]$ is orthogonal to every earlier measurement, so $span\\{y[1],...,y[n]\\} = span\\{y[1],...,y[n-1]\\} ⊕ span\\{e[n]\\}$ as an orthogonal direct sum. A projection onto an orthogonal direct sum is the sum of the projections, which is exactly why the update is additive: old estimate plus gain times innovation. Nothing but $x_e$ and $P$ needs to be stored, and the whole data history is summarised by them. The gain $K$ trades prior uncertainty against measurement noise: if $R$ is large (noisy sensor) $K → 0$ and the filter trusts the model; if $P[n|n-1]$ is large (uncertain state) $K$ grows and the filter trusts the measurement. Note that $P$ and $K$ depend only on $F$, $H$, $Q$, $R$ and not on the data, so they can be precomputed. For Gaussian $w$, $v$ and Gaussian initial state, the Kalman estimate is the exact conditional mean $E[x[n]|y[1..n]]$; otherwise it is the best linear estimate.", "rubric": ["Defines the two propagated quantities: state estimate $x_e[n|m]$ and error covariance $P[n|m]$.", "Writes the prediction step $x_e[n|n-1] = Fx_e[n-1|n-1]$, $P[n|n-1] = FP[n-1|n-1]F^T+Q$.", "Writes the update step with innovation $e[n] = y[n]-Hx_e[n|n-1]$, gain $K = P[n|n-1]H^TS^{-1}$, and the covariance update.", "Explains recursiveness via orthogonality of the innovation to past data, so the projection onto the enlarged data space decomposes additively.", "Interprets the gain as a trade-off between $P[n|n-1]$ and $R$, and notes the estimate is the exact MMSE in the Gaussian case, LMMSE otherwise."]}, "he": {"q": "עבור מודל מרחב המצב $x[n] = Fx[n-1]+w[n]$, ‏$y[n] = Hx[n]+v[n]$ עם $w$, ‏$v$ לבנים, בלתי תלויים ובעלי תוחלת אפס וקווריאנסים $Q$, ‏$R$, תאר את שלבי החיזוי והעדכון של מסנן קלמן והסבר מדוע הוא אומד LMMSE רקורסיבי.", "hint": "פצל את הנתונים למה שכבר היה ידוע ולחידוש $y[n]-Hx_e[n|n-1]$, והשתמש בכך שהחידוש אורתוגונלי לעבר.", "modelAnswer": "המסנן מקדם שני גדלים: האומד $x_e[n|m]$ של המצב בהינתן נתונים עד זמן $m$, וקווריאנס השגיאה שלו $P[n|m] = E[(x[n]-x_e[n|m])(·)^T]$. חיזוי (עדכון זמן): $x_e[n|n-1] = Fx_e[n-1|n-1]$ ו-$P[n|n-1] = FP[n-1|n-1]F^T + Q$ — האומד מועבר דרך הדינמיקה ואי-הוודאות גדלה ברעש התהליך. עדכון (עדכון מדידה): מחשבים את החידוש $e[n] = y[n] - Hx_e[n|n-1]$ עם קווריאנס $S = HP[n|n-1]H^T + R$, את הגבר קלמן $K = P[n|n-1]H^TS^{-1}$, ואז $x_e[n|n] = x_e[n|n-1] + Ke[n]$ ו-$P[n|n] = (I-KH)P[n|n-1]$. מדוע LMMSE רקורסיבי: האומד הוא ההיטל האורתוגונלי של $x[n]$ על המרחב הנפרש על ידי כל המדידות $y[1],...,y[n]$. העובדה המרכזית היא שהחידוש $e[n]$ אורתוגונלי לכל מדידה קודמת, ולכן $span\\{y[1],...,y[n]\\} = span\\{y[1],...,y[n-1]\\} ⊕ span\\{e[n]\\}$ כסכום ישר אורתוגונלי. היטל על סכום ישר אורתוגונלי הוא סכום ההיטלים, וזו בדיוק הסיבה שהעדכון הוא חיבורי: אומד ישן ועוד הגבר כפול חידוש. אין צורך לאחסן דבר מלבד $x_e$ ו-$P$, וכל היסטוריית הנתונים מסוכמת בהם. ההגבר $K$ מאזן בין אי-ודאות מוקדמת לרעש מדידה: אם $R$ גדול (חיישן רועש) אז $K → 0$ והמסנן סומך על המודל; אם $P[n|n-1]$ גדול (מצב לא ודאי) אז $K$ גדל והמסנן סומך על המדידה. שים לב ש-$P$ ו-$K$ תלויים רק ב-$F$, ‏$H$, ‏$Q$, ‏$R$ ולא בנתונים, ולכן ניתן לחשבם מראש. עבור $w$, ‏$v$ גאוסיים ומצב התחלתי גאוסי, אומד קלמן הוא התוחלת המותנית המדויקת $E[x[n]|y[1..n]]$; אחרת הוא האומד הלינארי הטוב ביותר.", "rubric": ["מגדיר את שני הגדלים המקודמים: אומד המצב $x_e[n|m]$ וקווריאנס השגיאה $P[n|m]$.", "כותב את שלב החיזוי $x_e[n|n-1] = Fx_e[n-1|n-1]$, ‏$P[n|n-1] = FP[n-1|n-1]F^T+Q$.", "כותב את שלב העדכון עם חידוש $e[n] = y[n]-Hx_e[n|n-1]$, הגבר $K = P[n|n-1]H^TS^{-1}$, ועדכון הקווריאנס.", "מסביר את הרקורסיביות דרך אורתוגונליות החידוש לנתוני העבר, כך שההיטל על מרחב הנתונים המורחב מתפרק חיבורית.", "מפרש את ההגבר כאיזון בין $P[n|n-1]$ ל-$R$, ומציין שהאומד הוא MMSE מדויק במקרה הגאוסי ו-LMMSE אחרת."]}}, {"id": "det-001", "area": "detection", "topic": "binary-hypothesis-setup", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["hypothesis-testing", "decision-regions", "error-types"], "answer": 0, "en": {"q": "In binary hypothesis testing the receiver observes $Y$ and must choose $H_0$ or $H_1$. What is a deterministic decision rule, and how do $P_{FA}$ and $P_M$ follow from it?", "options": ["A partition of the observation space into $R_0,R_1$; $P_{FA}=P(Y∈R_1|H_0)$, $P_M=P(Y∈R_0|H_1)$", "A partition of the parameter space into $R_0,R_1$; $P_{FA}=P(H_0|Y∈R_1)$, $P_M=P(H_1|Y∈R_0)$", "A map from $Y$ to a posterior probability; $P_{FA}$ and $P_M$ are the two posteriors at the threshold", "A choice of threshold $η$ alone; $P_{FA}=P(L(Y)<η|H_0)$ and $P_M=P(L(Y)>η|H_1)$"], "hint": "The rule lives in the space where the data lives, and both error probabilities are conditioned on a hypothesis, not on the data.", "explanation": "A deterministic rule splits the observation space $Γ$ into disjoint $R_0$ and $R_1$ with $R_0∪R_1=Γ$, and decides $H_1$ exactly when $Y∈R_1$. The two error probabilities are then $P_{FA}=P(Y∈R_1|H_0)$ (type I) and $P_M=P(Y∈R_0|H_1)$ (type II), with $P_D=1-P_M$. Both are conditional on a hypothesis, so they are defined without any prior. Only when priors are supplied can they be combined into $P_e=P_0P_{FA}+P_1P_M$.", "whyWrong": ["The regions are subsets of the observation space; the hypotheses are two candidate laws, and there is no parameter space to cut in two.", "Posteriors are functions of the data and need priors, whereas $P_{FA}$ and $P_M$ are error frequencies conditioned on each hypothesis.", "The inequalities are reversed: a false alarm means $L(Y)$ exceeds $η$ under $H_0$, and a miss means it falls below $η$ under $H_1$."]}, "he": {"q": "בבדיקת השערות בינארית המקלט צופה ב-$Y$ ועליו לבחור בין $H_0$ ל-$H_1$. מהו כלל החלטה דטרמיניסטי, וכיצד נובעים ממנו $P_{FA}$ ו-$P_M$?", "options": ["חלוקה של מרחב התצפיות ל-$R_0,R_1$; ‏$P_{FA}=P(Y∈R_1|H_0)$, ‏$P_M=P(Y∈R_0|H_1)$", "חלוקה של מרחב הפרמטרים ל-$R_0,R_1$; ‏$P_{FA}=P(H_0|Y∈R_1)$, ‏$P_M=P(H_1|Y∈R_0)$", "העתקה מ-$Y$ להסתברות אפוסטריורית; ‏$P_{FA}$ ו-$P_M$ הם שתי האפוסטריוריות בסף", "בחירת סף $η$ בלבד; ‏$P_{FA}=P(L(Y)<η|H_0)$ ו-$P_M=P(L(Y)>η|H_1)$"], "hint": "הכלל חי במרחב שבו חיים הנתונים, ושתי הסתברויות השגיאה מותנות בהשערה ולא בנתונים.", "explanation": "כלל דטרמיניסטי מחלק את מרחב התצפיות $Γ$ לשני אזורים זרים $R_0$ ו-$R_1$ עם $R_0∪R_1=Γ$, ומחליט $H_1$ בדיוק כאשר $Y∈R_1$. הסתברויות השגיאה הן $P_{FA}=P(Y∈R_1|H_0)$ (שגיאה מסוג I) ו-$P_M=P(Y∈R_0|H_1)$ (שגיאה מסוג II), כאשר $P_D=1-P_M$. שתיהן מותנות בהשערה ולכן מוגדרות ללא כל הסתברות אפריורית. רק כאשר נתונות אפריוריות ניתן לצרפן ל-$P_e=P_0P_{FA}+P_1P_M$.", "whyWrong": ["האזורים הם תת-קבוצות של מרחב התצפיות; ההשערות הן שתי התפלגויות מועמדות, ואין מרחב פרמטרים שיש לחצות.", "אפוסטריוריות הן פונקציות של הנתונים ודורשות אפריוריות, ואילו $P_{FA}$ ו-$P_M$ הן שכיחויות שגיאה המותנות בכל השערה.", "אי-השוויונות הפוכים: אזעקת שווא היא חציית הסף על ידי $L(Y)$ תחת $H_0$, והחטאה היא ירידה מתחת לסף תחת $H_1$."]}}, {"id": "det-002", "area": "detection", "topic": "likelihood-ratio-test-form", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["likelihood-ratio", "lrt", "threshold", "unifying-structure"], "answer": 0, "en": {"q": "MAP detection, minimum-$P_e$ detection, Bayes-risk detection and Neyman-Pearson detection all produce tests of one common structure. What is that structure?", "options": ["Compare $L(y)=p(y|H_1)/p(y|H_0)$ with a threshold $η$; only the value of $η$ changes", "Compare $p(y|H_1)$ with a threshold $η$; the density under $H_0$ never enters the rule", "Compare $P(H_1|y)$ with $1/2$; costs and constraints are absorbed inside $L(y)$ itself", "Compare $L(y)$ with $1$; priors and costs enter by rescaling the observation $y$"], "hint": "Ask what each criterion actually changes: the statistic that is computed, or the number it is compared against?", "explanation": "Every one of these criteria reduces to the likelihood ratio test: decide $H_1$ iff $L(y)=p(y|H_1)/p(y|H_0)>η$. Only $η$ differs: $η=1$ for ML, $η=P_0/P_1$ for MAP and minimum $P_e$, $η=P_0(C_{10}-C_{00})/(P_1(C_{01}-C_{11}))$ for Bayes risk, and for Neyman-Pearson $η$ is whatever makes $P_{FA}=α$. This is why $L(Y)$ is the universal decision statistic for a binary problem, and why one ROC curve describes all of them at once.", "whyWrong": ["Thresholding $p(y|H_1)$ alone is not a valid test: a value can be small under $H_1$ and yet far smaller under $H_0$.", "The posterior rule is MAP only, with fixed threshold $1/2$; costs and false-alarm constraints change the threshold, not the statistic.", "The statistic $L(y)$ is fixed by the two densities; priors and costs move the threshold and never rescale the data."]}, "he": {"q": "גילוי MAP, גילוי במינימום $P_e$, גילוי בסיכון בייס וגילוי ניימן-פירסון מובילים כולם למבחנים בעלי מבנה משותף אחד. מהו המבנה הזה?", "options": ["השוואת $L(y)=p(y|H_1)/p(y|H_0)$ לסף $η$; רק ערכו של $η$ משתנה", "השוואת $p(y|H_1)$ לסף $η$; הצפיפות תחת $H_0$ אינה נכנסת לכלל כלל", "השוואת $P(H_1|y)$ ל-$1/2$; עלויות ואילוצים נבלעים בתוך $L(y)$ עצמו", "השוואת $L(y)$ ל-$1$; אפריוריות ועלויות נכנסות דרך שינוי סקאלה של $y$"], "hint": "שאל מה כל קריטריון באמת משנה: את הסטטיסטי שמחשבים, או את המספר שאליו משווים אותו?", "explanation": "כל אחד מהקריטריונים מצטמצם למבחן יחס הנראות: החלט $H_1$ אם ורק אם $L(y)=p(y|H_1)/p(y|H_0)>η$. רק $η$ משתנה: ‏$η=1$ עבור ML, ‏$η=P_0/P_1$ עבור MAP ומינימום $P_e$, ‏$η=P_0(C_{10}-C_{00})/(P_1(C_{01}-C_{11}))$ עבור סיכון בייס, ובניימן-פירסון $η$ הוא הערך שמביא ל-$P_{FA}=α$. לכן $L(Y)$ הוא הסטטיסטי האוניברסלי לבעיה בינארית, ולכן עקומת ROC אחת מתארת את כולם יחד.", "whyWrong": ["השוואת $p(y|H_1)$ לבדה אינה מבחן תקף: ערך יכול להיות קטן תחת $H_1$ ובכל זאת קטן בהרבה תחת $H_0$.", "כלל האפוסטריורי הוא MAP בלבד, עם סף קבוע $1/2$; עלויות ואילוץ אזעקת שווא משנים את הסף ולא את הסטטיסטי.", "הסטטיסטי $L(y)$ נקבע על ידי שתי הצפיפויות; אפריוריות ועלויות מזיזות את הסף ולעולם אינן משנות סקאלה של הנתונים."]}}, {"id": "det-003", "area": "detection", "topic": "map-vs-ml-priors", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["map", "ml", "priors", "threshold"], "answer": 1, "en": {"q": "Two hypotheses have priors $P(H_0)=0.9$ and $P(H_1)=0.1$ with known densities. A student applies the ML rule, deciding $H_1$ iff $L(y)>1$. Which statement is correct?", "options": ["ML minimises $P_e$ for any priors, because the priors cancel inside the ratio $L(y)$", "ML equals MAP only for equal priors; here MAP uses $η=9$, so ML declares $H_1$ too often", "ML equals MAP here as well, because the data already carry the prior information", "ML minimises $P_e$ whenever both densities are Gaussian with the same variance"], "hint": "Write the MAP rule as a likelihood ratio test and read off the threshold it demands.", "explanation": "MAP decides $H_1$ iff $P_1p(y|H_1)>P_0p(y|H_0)$, i.e. iff $L(y)>P_0/P_1=0.9/0.1=9$. ML uses $η=1$, which is the MAP threshold only when $P_0=P_1$. Using $η=1$ when the correct threshold is $9$ enlarges $R_1$, so $P_{FA}$ grows while $P_M$ falls, and since $H_0$ is nine times more likely the net effect is a larger $P_e$ than MAP achieves. ML is the right choice when priors are genuinely unknown, but here they are given.", "whyWrong": ["The priors do not appear in $L(y)$ at all: that is precisely why they must be put back in as the threshold.", "Data cannot carry prior information; the prior is external knowledge about which hypothesis is generating the data.", "Equal Gaussian variances only make the log-likelihood ratio affine in $y$; they say nothing about the threshold."]}, "he": {"q": "לשתי השערות אפריוריות $P(H_0)=0.9$ ו-$P(H_1)=0.1$ וצפיפויות ידועות. סטודנט מיישם את כלל ML ומחליט $H_1$ אם ורק אם $L(y)>1$. איזו טענה נכונה?", "options": ["‏ML ממזער את $P_e$ עבור כל אפריוריות, כי האפריוריות מצטמצמות בתוך היחס $L(y)$", "‏ML מתלכד עם MAP רק באפריוריות שוות; כאן MAP דורש $η=9$, ולכן ML מכריז $H_1$ יותר מדי", "‏ML מתלכד עם MAP גם כאן, כי הנתונים כבר נושאים את המידע האפריורי", "‏ML ממזער את $P_e$ בכל פעם ששתי הצפיפויות גאוסיות בעלות אותה שונות"], "hint": "רשום את כלל MAP כמבחן יחס נראות וקרא ממנו את הסף שהוא דורש.", "explanation": "כלל MAP מחליט $H_1$ אם ורק אם $P_1p(y|H_1)>P_0p(y|H_0)$, כלומר אם ורק אם $L(y)>P_0/P_1=0.9/0.1=9$. כלל ML משתמש ב-$η=1$, שהוא סף MAP רק כאשר $P_0=P_1$. שימוש ב-$η=1$ כשהסף הנכון הוא $9$ מגדיל את $R_1$, ולכן $P_{FA}$ גדל ו-$P_M$ קטן; מכיוון ש-$H_0$ סביר פי תשעה, התוצאה נטו היא $P_e$ גדול מזה של MAP. ‏ML הוא הבחירה הנכונה כשהאפריוריות באמת אינן ידועות, אך כאן הן נתונות.", "whyWrong": ["האפריוריות אינן מופיעות ב-$L(y)$ כלל: בדיוק משום כך יש להחזירן פנימה כסף.", "הנתונים אינם יכולים לשאת מידע אפריורי; האפריורי הוא ידע חיצוני על ההשערה שמייצרת את הנתונים.", "שונויות גאוסיות שוות רק הופכות את לוג יחס הנראות לאפיני ב-$y$; אין בכך דבר על הסף."]}}, {"id": "det-004", "area": "detection", "topic": "minimum-error-threshold", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["map", "minimum-pe", "gaussian", "threshold-computation"], "answer": 1, "en": {"q": "$H_0: Y∼N(0,2)$ and $H_1: Y∼N(2,2)$ (the variances equal $2$), with priors $P(H_0)=2/3$ and $P(H_1)=1/3$. The rule minimising $P_e$ decides $H_1$ iff $Y>γ$. Find $γ$.", "options": ["$γ=1$", "$γ=1+ln2≈1.693$", "$γ=1-ln2≈0.307$", "$γ=1+(ln2)/2≈1.347$"], "hint": "Minimum $P_e$ is the MAP rule: compare $L(y)$ with $P_0/P_1$ and take logarithms.", "explanation": "Minimum $P_e$ is MAP, i.e. decide $H_1$ iff $L(y)>P_0/P_1=2$. With $σ^2=2$, $L(y)=exp(-(y-2)^2/4+y^2/4)=exp((4y-4)/4)=exp(y-1)$. Hence $y-1>ln2$ and $γ=1+ln2≈1.693$. This matches the general formula $γ=A/2+(σ^2/A)ln(P_0/P_1)$ with $A=2$ and $σ^2=2$, giving $1+1·ln2$. Since $H_0$ is the more likely hypothesis the threshold shifts away from $0$ and towards the mean of $H_1$, shrinking $R_1$.", "whyWrong": ["$γ=1$ is the midpoint, i.e. the ML or equal-prior threshold; it ignores that $H_0$ is twice as likely.", "$γ=1-ln2$ inverts the prior ratio: a more probable $H_0$ must push the threshold up, never down.", "$γ=1+(ln2)/2$ divides by $A^2=4$ instead of $A=2$; the correct coefficient is $σ^2/A=1$."]}, "he": {"q": "‏$H_0: Y∼N(0,2)$ ו-$H_1: Y∼N(2,2)$ (השונויות שוות ל-$2$), עם אפריוריות $P(H_0)=2/3$ ו-$P(H_1)=1/3$. הכלל הממזער את $P_e$ מחליט $H_1$ אם ורק אם $Y>γ$. מצא את $γ$.", "options": ["‏$γ=1$", "‏$γ=1+ln2≈1.693$", "‏$γ=1-ln2≈0.307$", "‏$γ=1+(ln2)/2≈1.347$"], "hint": "מינימום $P_e$ הוא כלל MAP: השווה את $L(y)$ ל-$P_0/P_1$ וקח לוגריתם.", "explanation": "מינימום $P_e$ הוא MAP, כלומר החלט $H_1$ אם ורק אם $L(y)>P_0/P_1=2$. עם $σ^2=2$ מתקבל $L(y)=exp(-(y-2)^2/4+y^2/4)=exp((4y-4)/4)=exp(y-1)$. לכן $y-1>ln2$ ו-$γ=1+ln2≈1.693$. זה תואם את הנוסחה הכללית $γ=A/2+(σ^2/A)ln(P_0/P_1)$ עם $A=2$ ו-$σ^2=2$, שנותנת $1+1·ln2$. מכיוון ש-$H_0$ היא ההשערה הסבירה יותר, הסף נע מ-$0$ לכיוון התוחלת של $H_1$ ומקטין את $R_1$.", "whyWrong": ["‏$γ=1$ הוא נקודת האמצע, כלומר סף ML או סף של אפריוריות שוות; הוא מתעלם מכך ש-$H_0$ סבירה פי שניים.", "‏$γ=1-ln2$ הופך את יחס האפריוריות: ‏$H_0$ סבירה יותר חייבת להעלות את הסף ולא להורידו.", "‏$γ=1+(ln2)/2$ מחלק ב-$A^2=4$ במקום ב-$A=2$; המקדם הנכון הוא $σ^2/A=1$."]}}, {"id": "det-005", "area": "detection", "topic": "bayes-risk-threshold", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["bayes-risk", "costs", "threshold", "lrt"], "answer": 2, "en": {"q": "A Bayes test has $P(H_0)=0.6$, $P(H_1)=0.4$, $C_{00}=C_{11}=0$, $C_{10}=1$ (false alarm) and $C_{01}=3$ (miss). The optimal rule decides $H_1$ iff $L(y)>η$. Find $η$.", "options": ["$η=1/3≈0.333$", "$η=1.5$", "$η=0.5$", "$η=2$"], "hint": "The threshold is a ratio: prior times cost increment of $H_0$, over prior times cost increment of $H_1$.", "explanation": "The Bayes threshold is $η=P_0(C_{10}-C_{00})/(P_1(C_{01}-C_{11}))=(0.6·1)/(0.4·3)=0.6/1.2=0.5$. Reading it: the prior odds alone would give $P_0/P_1=1.5$, but a miss costs three times a false alarm, which divides the threshold by $3$ and leaves $0.5$. A lower threshold enlarges $R_1$, so the detector becomes more willing to declare $H_1$ — exactly what expensive misses demand.", "whyWrong": ["$1/3$ is the cost ratio $C_{10}/C_{01}$ with the priors dropped; it is the answer for equal priors only.", "$1.5$ is the prior odds $P_0/P_1$, the MAP threshold, obtained by ignoring the unequal costs.", "$2$ is the reciprocal $P_1C_{01}/(P_0C_{10})$: priors and costs have been put on the wrong sides of the ratio."]}, "he": {"q": "במבחן בייס נתון $P(H_0)=0.6$, ‏$P(H_1)=0.4$, ‏$C_{00}=C_{11}=0$, ‏$C_{10}=1$ (אזעקת שווא) ו-$C_{01}=3$ (החטאה). הכלל האופטימלי מחליט $H_1$ אם ורק אם $L(y)>η$. מצא את $η$.", "options": ["‏$η=1/3≈0.333$", "‏$η=1.5$", "‏$η=0.5$", "‏$η=2$"], "hint": "הסף הוא יחס: אפריורי כפול תוספת העלות של $H_0$, חלקי אפריורי כפול תוספת העלות של $H_1$.", "explanation": "סף בייס הוא $η=P_0(C_{10}-C_{00})/(P_1(C_{01}-C_{11}))=(0.6·1)/(0.4·3)=0.6/1.2=0.5$. פירוש: יחס האפריוריות לבדו היה נותן $P_0/P_1=1.5$, אך החטאה יקרה פי שלושה מאזעקת שווא, וזה מחלק את הסף ב-$3$ ומשאיר $0.5$. סף נמוך יותר מגדיל את $R_1$, ולכן הגלאי נוטה יותר להכריז $H_1$ — בדיוק מה שהחטאות יקרות דורשות.", "whyWrong": ["‏$1/3$ הוא יחס העלויות $C_{10}/C_{01}$ ללא האפריוריות; זו התשובה רק עבור אפריוריות שוות.", "‏$1.5$ הוא יחס האפריוריות $P_0/P_1$, סף MAP, המתקבל מהתעלמות מהעלויות הלא שוות.", "‏$2$ הוא ההופכי $P_1C_{01}/(P_0C_{10})$: האפריוריות והעלויות הוצבו בצדדים ההפוכים של היחס."]}}, {"id": "det-006", "area": "detection", "topic": "bayes-risk-value", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["bayes-risk", "costs", "pfa-pd", "numeric"], "answer": 3, "en": {"q": "In a Bayes problem $P(H_0)=P(H_1)=0.5$, $C_{00}=C_{11}=0$, $C_{10}=2$ and $C_{01}=4$. A given detector attains $P_{FA}=0.02$ and $P_D=0.9$. What Bayes risk $R$ does it incur?", "options": ["$R=0.06$", "$R=0.14$", "$R=0.20$", "$R=0.22$"], "hint": "Average the two cost terms over the priors, remembering that the miss probability is $1-P_D$.", "explanation": "With zero cost for correct decisions, $R=P_0C_{10}P_{FA}+P_1C_{01}P_M$ where $P_M=1-P_D=0.1$. Hence $R=0.5(2)(0.02)+0.5(4)(0.1)=0.02+0.20=0.22$. The miss term dominates by a factor of ten, because a miss is twice as expensive and forty-five times more frequent than a false alarm here — a strong hint that this detector operates at too high a threshold for these costs.", "whyWrong": ["$0.06=0.5(0.02)+0.5(0.1)$ is the plain error probability, obtained by leaving the costs out.", "$0.14$ swaps the costs, charging $4$ per false alarm and $2$ per miss instead of the other way round.", "$0.20$ keeps only the miss term and drops the false-alarm contribution $0.5·2·0.02=0.02$."]}, "he": {"q": "בבעיית בייס נתון $P(H_0)=P(H_1)=0.5$, ‏$C_{00}=C_{11}=0$, ‏$C_{10}=2$ ו-$C_{01}=4$. גלאי נתון משיג $P_{FA}=0.02$ ו-$P_D=0.9$. מהו סיכון בייס $R$ שהוא צובר?", "options": ["‏$R=0.06$", "‏$R=0.14$", "‏$R=0.20$", "‏$R=0.22$"], "hint": "מצע את שני איברי העלות לפי האפריוריות, וזכור שהסתברות ההחטאה היא $1-P_D$.", "explanation": "כאשר עלות ההחלטות הנכונות אפס, $R=P_0C_{10}P_{FA}+P_1C_{01}P_M$ כאשר $P_M=1-P_D=0.1$. לכן $R=0.5(2)(0.02)+0.5(4)(0.1)=0.02+0.20=0.22$. איבר ההחטאה שולט פי עשרה, כי החטאה יקרה פי שניים ושכיחה פי ארבעים וחמישה מאזעקת שווא כאן — רמז חזק לכך שהגלאי עובד בסף גבוה מדי עבור עלויות אלה.", "whyWrong": ["‏$0.06=0.5(0.02)+0.5(0.1)$ הוא הסתברות השגיאה הפשוטה, המתקבלת מהשמטת העלויות.", "‏$0.14$ מחליף בין העלויות ומחייב $4$ לאזעקת שווא ו-$2$ להחטאה במקום להפך.", "‏$0.20$ שומר רק את איבר ההחטאה ומשמיט את תרומת אזעקת השווא $0.5·2·0.02=0.02$."]}}, {"id": "det-007", "area": "detection", "topic": "neyman-pearson-criterion", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["neyman-pearson", "constraint", "no-priors"], "answer": 2, "en": {"q": "A radar designer has no meaningful priors and no cost figures, but the specification fixes a maximum false-alarm rate. Which criterion does this describe, and what does it optimise?", "options": ["Minimise $P_{FA}$ subject to $P_D≥β$, with the threshold fixed by the prior odds", "Minimise $P_e=P_0P_{FA}+P_1P_M$, which needs both priors to be specified", "Maximise $P_D$ subject to $P_{FA}≤α$; the threshold follows from the constraint", "Minimise Bayes risk with $C_{10}=C_{01}=1$, $C_{00}=C_{11}=0$ and equal priors"], "hint": "Which of these criteria can be applied without ever writing down $P(H_0)$?", "explanation": "This is the Neyman-Pearson criterion: among all tests with $P_{FA}≤α$, choose the one maximising $P_D$. Its appeal is that it needs neither priors nor costs — only the tolerated false-alarm rate $α$, which in radar is set by how often the operator will accept a spurious alert. The solution is still a likelihood ratio test, with $η$ chosen so that $P_{FA}=α$ exactly; leaving false-alarm budget unspent would only waste achievable $P_D$.", "whyWrong": ["Constraining $P_D$ and minimising $P_{FA}$ is a valid dual problem but is not the standard form, and prior odds play no part.", "Minimum $P_e$ is the MAP criterion and requires the priors that this designer does not have.", "That Bayes risk with equal priors and unit costs is again minimum $P_e$; it uses no false-alarm constraint at all."]}, "he": {"q": "מתכנן מכ\"ם אינו יודע אפריוריות ואין לו נתוני עלות, אך המפרט קובע קצב אזעקות שווא מרבי. איזה קריטריון מתואר כאן, ומה הוא ממטב?", "options": ["מזעור $P_{FA}$ תחת $P_D≥β$, כשהסף נקבע לפי יחס האפריוריות", "מזעור $P_e=P_0P_{FA}+P_1P_M$, הדורש ששתי האפריוריות יהיו ידועות", "מקסום $P_D$ תחת $P_{FA}≤α$; הסף נובע מהאילוץ", "מזעור סיכון בייס עם $C_{10}=C_{01}=1$, ‏$C_{00}=C_{11}=0$ ואפריוריות שוות"], "hint": "איזה מהקריטריונים ניתן ליישם בלי לרשום אי פעם את $P(H_0)$?", "explanation": "זהו קריטריון ניימן-פירסון: מבין כל המבחנים עם $P_{FA}≤α$, בחר את זה הממקסם את $P_D$. יתרונו שאינו דורש לא אפריוריות ולא עלויות — רק את קצב אזעקות השווא הנסבל $α$, שבמכ\"ם נקבע לפי תדירות ההתרעות השגויות שהמפעיל מוכן לקבל. הפתרון הוא עדיין מבחן יחס נראות, עם $η$ שנבחר כך ש-$P_{FA}=α$ בדיוק; השארת תקציב אזעקות שווא בלתי מנוצל רק תבזבז $P_D$ שניתן להשיג.", "whyWrong": ["אילוץ על $P_D$ ומזעור $P_{FA}$ היא בעיה דואלית תקפה אך אינה הצורה הסטנדרטית, ויחס האפריוריות אינו משחק בה תפקיד.", "מינימום $P_e$ הוא קריטריון MAP ודורש בדיוק את האפריוריות שאין למתכנן.", "סיכון בייס עם אפריוריות שוות ועלויות יחידה הוא שוב מינימום $P_e$; אין בו כל אילוץ על אזעקות שווא."]}}, {"id": "det-008", "area": "detection", "topic": "neyman-pearson-computation", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["neyman-pearson", "gaussian", "threshold", "pd-computation"], "answer": 0, "en": {"q": "One observation, $H_0: Y∼N(0,4)$ and $H_1: Y∼N(5,4)$. Design a Neyman-Pearson test with $P_{FA}≤0.0228$, deciding $H_1$ iff $Y>γ$. Give $γ$ and the resulting $P_D$. Use $Q(2)=0.0228$, $Q(0.5)=0.3085$.", "options": ["$γ=4$, $P_D=0.6915$", "$γ=2$, $P_D=0.9332$", "$γ=4$, $P_D=0.3085$", "$γ=4$, $P_D=0.9772$"], "hint": "The variance is $4$, so the standard deviation is $2$; standardise both tails with the same $σ$.", "explanation": "Here $σ=√4=2$. The constraint gives $P_{FA}=Q((γ-0)/2)=0.0228$, so $γ/2=2$ and $γ=4$. Then $P_D=Q((γ-5)/2)=Q(-0.5)=1-Q(0.5)=1-0.3085=0.6915$. Note $γ=4$ lies below the mean of $H_1$, so $P_D$ must exceed $1/2$, and the small $α$ has cost us detection: the separation is only $d=(5-0)/2=2.5$ standard deviations.", "whyWrong": ["$γ=2$ takes $Q^{-1}(0.0228)=2$ as the threshold itself, forgetting to multiply by $σ=2$; then $P_D=Q(-1.5)=0.9332$.", "$P_D=0.3085$ evaluates $Q(+0.5)$: the sign of $(γ-μ_1)/σ$ was dropped, giving $P_D<1/2$ although $γ<μ_1$.", "$P_D=0.9772=Q(-2)$ uses the $H_0$ mean inside the $P_D$ expression; the correct argument is $(γ-5)/2=-0.5$."]}, "he": {"q": "תצפית אחת, $H_0: Y∼N(0,4)$ ו-$H_1: Y∼N(5,4)$. תכנן מבחן ניימן-פירסון עם $P_{FA}≤0.0228$, המחליט $H_1$ אם ורק אם $Y>γ$. תן את $γ$ ואת $P_D$ המתקבל. השתמש ב-$Q(2)=0.0228$, ‏$Q(0.5)=0.3085$.", "options": ["‏$γ=4$, ‏$P_D=0.6915$", "‏$γ=2$, ‏$P_D=0.9332$", "‏$γ=4$, ‏$P_D=0.3085$", "‏$γ=4$, ‏$P_D=0.9772$"], "hint": "השונות היא $4$, ולכן סטיית התקן היא $2$; נרמל את שני הזנבות עם אותו $σ$.", "explanation": "כאן $σ=√4=2$. האילוץ נותן $P_{FA}=Q((γ-0)/2)=0.0228$, ולכן $γ/2=2$ ו-$γ=4$. אז $P_D=Q((γ-5)/2)=Q(-0.5)=1-Q(0.5)=1-0.3085=0.6915$. שים לב ש-$γ=4$ נמצא מתחת לתוחלת של $H_1$, ולכן $P_D$ חייב לעלות על $1/2$; ה-$α$ הקטן עלה לנו בגילוי, שכן ההפרדה היא רק $d=(5-0)/2=2.5$ סטיות תקן.", "whyWrong": ["‏$γ=2$ לוקח את $Q^{-1}(0.0228)=2$ כסף עצמו ושוכח להכפיל ב-$σ=2$; אז $P_D=Q(-1.5)=0.9332$.", "‏$P_D=0.3085$ מחשב $Q(+0.5)$: הסימן של $(γ-μ_1)/σ$ הושמט ומתקבל $P_D<1/2$ אף ש-$γ<μ_1$.", "‏$P_D=0.9772=Q(-2)$ משתמש בתוחלת של $H_0$ בתוך ביטוי $P_D$; הארגומנט הנכון הוא $(γ-5)/2=-0.5$."]}}, {"id": "det-009", "area": "detection", "topic": "roc-properties", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["roc", "concavity", "above-diagonal", "slope"], "answer": 3, "en": {"q": "Which of the following ROC curves is impossible for an optimal likelihood-ratio detector?", "options": ["The straight line $P_D=P_{FA}$, arising when the two conditional densities coincide", "A curve reaching $P_D=1$ at $P_{FA}=0$, arising when the densities have disjoint supports", "A concave curve whose slope at $P_{FA}=0.1$ equals $3$, so the threshold there is $η=3$", "A concave curve through $(P_{FA},P_D)=(0.8,0.6)$, with slope $0.4$ at that point"], "hint": "One universal property constrains the whole curve, not just its shape: compare $P_D$ with $P_{FA}$.", "explanation": "Every LRT ROC is concave, starts at $(0,0)$, ends at $(1,1)$, has slope equal to the threshold $η$ at each operating point, and lies on or above the diagonal, so $P_D≥P_{FA}$ always. The point $(0.8,0.6)$ has $P_D<P_{FA}$ and is therefore unachievable: even ignoring the data and declaring $H_1$ with probability $0.8$ would give $P_D=0.8$, and reversing the decisions of such a test would beat it. The other three curves are all realisable.", "whyWrong": ["The diagonal is achieved when $p(y|H_0)=p(y|H_1)$: the data are useless and one may as well flip a biased coin.", "Disjoint supports make $L(Y)$ infinite or zero, giving the ideal corner point $(0,1)$; nothing forbids it.", "A slope of $3$ simply means the operating point uses threshold $η=3$; slopes above $1$ occur on the left of the curve."]}, "he": {"q": "איזו מעקומות ה-ROC הבאות בלתי אפשרית עבור גלאי יחס נראות אופטימלי?", "options": ["הישר $P_D=P_{FA}$, המתקבל כאשר שתי הצפיפויות המותנות מתלכדות", "עקומה המגיעה ל-$P_D=1$ ב-$P_{FA}=0$, המתקבלת כאשר לצפיפויות תומכים זרים", "עקומה קעורה שהשיפוע שלה ב-$P_{FA}=0.1$ שווה $3$, כלומר הסף שם הוא $η=3$", "עקומה קעורה העוברת ב-$(P_{FA},P_D)=(0.8,0.6)$, עם שיפוע $0.4$ בנקודה זו"], "hint": "תכונה אוניברסלית אחת מגבילה את כל העקומה ולא רק את צורתה: השווה בין $P_D$ ל-$P_{FA}$.", "explanation": "כל עקומת ROC של מבחן יחס נראות היא קעורה, מתחילה ב-$(0,0)$, מסתיימת ב-$(1,1)$, שיפועה בכל נקודת עבודה שווה לסף $η$, והיא נמצאת על האלכסון או מעליו, כלומר תמיד $P_D≥P_{FA}$. הנקודה $(0.8,0.6)$ מקיימת $P_D<P_{FA}$ ולכן אינה ברת השגה: אפילו התעלמות מהנתונים והכרזת $H_1$ בהסתברות $0.8$ הייתה נותנת $P_D=0.8$, והיפוך ההחלטות של מבחן כזה היה עדיף עליו. שלוש העקומות האחרות ניתנות למימוש.", "whyWrong": ["האלכסון מושג כאשר $p(y|H_0)=p(y|H_1)$: הנתונים חסרי תועלת וניתן באותה מידה להטיל מטבע מוטה.", "תומכים זרים גורמים ל-$L(Y)$ להיות אינסוף או אפס, ונותנים את נקודת הפינה האידיאלית $(0,1)$; דבר אינו אוסר זאת.", "שיפוע $3$ פירושו פשוט שנקודת העבודה משתמשת בסף $η=3$; שיפועים גדולים מ-$1$ מופיעים בצד השמאלי של העקומה."]}}, {"id": "det-010", "area": "detection", "topic": "area-under-roc", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["roc", "auc", "ranking-interpretation"], "answer": 1, "en": {"q": "For a detector based on a statistic $T$, what does the area under the ROC curve (AUC) actually measure?", "options": ["The probability of a correct decision at the threshold that minimises $P_e$", "$P(T_1>T_0)$ for independent draws of $T$ under $H_1$ and under $H_0$", "One minus the minimum Bayes risk under equal priors and unit costs", "The value of $P_D$ at the operating point where the ROC slope equals $1$"], "hint": "AUC is a property of the whole curve, so it cannot be tied to any single threshold.", "explanation": "Integrating $P_D$ over $P_{FA}$ gives $AUC=∫_0^1 P_D dP_{FA}=P(T_1>T_0)$, where $T_1$ and $T_0$ are independent draws of the statistic under $H_1$ and $H_0$. It is the probability that the detector ranks a genuine target above a genuine noise-only sample. A useless detector sits on the diagonal and gives $AUC=0.5$; a perfect one gives $AUC=1$. It is threshold-free and prior-free, which is why it is used to compare detectors before an operating point is chosen.", "whyWrong": ["A probability of correct decision refers to one threshold and needs priors; AUC uses neither.", "Minimum Bayes risk is again a single-operating-point quantity, and $1-R$ is not an area under the curve.", "The point of unit slope is the ML operating point $η=1$; it is one point on the curve, not the area beneath it."]}, "he": {"q": "עבור גלאי המבוסס על סטטיסטי $T$, מה בעצם מודדת השטח מתחת לעקומת ה-ROC (AUC)?", "options": ["הסתברות ההחלטה הנכונה בסף הממזער את $P_e$", "‏$P(T_1>T_0)$ עבור דגימות בלתי תלויות של $T$ תחת $H_1$ ותחת $H_0$", "אחד פחות סיכון בייס המינימלי עבור אפריוריות שוות ועלויות יחידה", "ערכו של $P_D$ בנקודת העבודה שבה שיפוע ה-ROC שווה $1$"], "hint": "‏AUC היא תכונה של העקומה כולה, ולכן אינה יכולה להיקשר לסף בודד כלשהו.", "explanation": "אינטגרציה של $P_D$ על פני $P_{FA}$ נותנת $AUC=∫_0^1 P_D dP_{FA}=P(T_1>T_0)$, כאשר $T_1$ ו-$T_0$ הן דגימות בלתי תלויות של הסטטיסטי תחת $H_1$ ותחת $H_0$. זו ההסתברות שהגלאי מדרג מטרה אמיתית מעל דגימת רעש בלבד. גלאי חסר תועלת יושב על האלכסון ונותן $AUC=0.5$; גלאי מושלם נותן $AUC=1$. הגודל אינו תלוי בסף ואינו תלוי באפריוריות, ולכן משמש להשוואת גלאים לפני בחירת נקודת עבודה.", "whyWrong": ["הסתברות החלטה נכונה מתייחסת לסף אחד ודורשת אפריוריות; ‏AUC אינה דורשת אף אחד מהם.", "סיכון בייס מינימלי הוא שוב גודל של נקודת עבודה יחידה, ו-$1-R$ אינו שטח מתחת לעקומה.", "נקודת השיפוע היחידני היא נקודת העבודה של ML עם $η=1$; זו נקודה אחת על העקומה ולא השטח שמתחתיה."]}}, {"id": "det-011", "area": "detection", "topic": "antipodal-awgn-pe", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["antipodal", "awgn", "q-function", "pe"], "answer": 0, "en": {"q": "Antipodal signalling in AWGN: $Y=±A+N$ with $N∼N(0,σ^2)$ and equal priors, one sample. With $A=3$ and $σ=1.5$, what is $P_e$? Use $Q(1)=0.1587$, $Q(2)=0.0228$, $Q(3)=0.00135$.", "options": ["$0.0228$", "$0.1587$", "$0.0456$", "$0.00135$"], "hint": "The two signal points are $2A$ apart; the optimal threshold sits halfway between them.", "explanation": "With equal priors and equal variances the threshold is the midpoint $0$. Conditioned on $+A$ an error needs $N<-A$, of probability $Q(A/σ)$; conditioned on $-A$ it needs $N>A$, of the same probability. Hence $P_e=Q(A/σ)=Q(3/1.5)=Q(2)=0.0228$. In distance form the separation is $d=2A=6$ and $P_e=Q(d/2σ)=Q(6/3)=Q(2)$, the same number.", "whyWrong": ["$0.1587=Q(1)=Q(A/2σ)$ is the on-off answer; for antipodal signals the separation is $2A$, so the half-distance is $A$.", "$0.0456=2Q(2)$ double-counts the tails: conditioned on either transmitted symbol only one tail can cause an error.", "$0.00135=Q(3)$ uses $A$ with $σ=1$, i.e. the noise standard deviation was dropped from the argument."]}, "he": {"q": "איתות אנטיפודלי ברעש גאוסי לבן: ‏$Y=±A+N$ עם $N∼N(0,σ^2)$ ואפריוריות שוות, דגימה אחת. עבור $A=3$ ו-$σ=1.5$, מהו $P_e$? השתמש ב-$Q(1)=0.1587$, ‏$Q(2)=0.0228$, ‏$Q(3)=0.00135$.", "options": ["‏$0.0228$", "‏$0.1587$", "‏$0.0456$", "‏$0.00135$"], "hint": "המרחק בין שתי נקודות האות הוא $2A$; הסף האופטימלי יושב באמצע ביניהן.", "explanation": "באפריוריות שוות ושונויות שוות הסף הוא נקודת האמצע $0$. בהינתן שידור $+A$, שגיאה דורשת $N<-A$ בהסתברות $Q(A/σ)$; בהינתן $-A$ היא דורשת $N>A$ באותה הסתברות. לכן $P_e=Q(A/σ)=Q(3/1.5)=Q(2)=0.0228$. בצורת מרחק, ההפרדה היא $d=2A=6$ ו-$P_e=Q(d/2σ)=Q(6/3)=Q(2)$, אותו מספר.", "whyWrong": ["‏$0.1587=Q(1)=Q(A/2σ)$ היא התשובה של on-off; באיתות אנטיפודלי ההפרדה היא $2A$ ולכן חצי המרחק הוא $A$.", "‏$0.0456=2Q(2)$ סופר את הזנבות פעמיים: בהינתן כל סמל משודר רק זנב אחד יכול לגרום לשגיאה.", "‏$0.00135=Q(3)$ משתמש ב-$A$ עם $σ=1$, כלומר סטיית התקן של הרעש הושמטה מהארגומנט."]}}, {"id": "det-012", "area": "detection", "topic": "on-off-keying", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["on-off", "threshold", "q-function", "pe"], "answer": 2, "en": {"q": "On-off keying: under $H_0$, $Y=N$; under $H_1$, $Y=A+N$, with $N∼N(0,σ^2)$ and equal priors. For $A=4$, $σ=1$, give the minimum-$P_e$ threshold $γ$ and the resulting $P_e$. Use $Q(2)=0.0228$, $Q(4)=3.2·10^{-5}$.", "options": ["$γ=4$, $P_e=0.0228$", "$γ=2$, $P_e=3.2·10^{-5}$", "$γ=2$, $P_e=0.0228$", "$γ=0$, $P_e=0.5$"], "hint": "Equal priors and equal variances always put the threshold exactly halfway between the two means.", "explanation": "The two signal points are $0$ and $A$, so with equal priors and a common $σ$ the threshold is the midpoint $γ=A/2=2$. Each conditional error probability is $Q((A/2)/σ)=Q(2)=0.0228$, and averaging two equal numbers leaves $P_e=Q(A/2σ)=0.0228$. Compare with antipodal signalling of the same peak amplitude, where the separation is $2A$ and $P_e=Q(A/σ)$ is far smaller: the point at the origin is what costs on-off its performance.", "whyWrong": ["$γ=4$ places the threshold at the mean of $H_1$, which gives $P_M=1/2$; the midpoint is $A/2=2$.", "$3.2·10^{-5}=Q(A/σ)$ is the antipodal formula; here the separation is $A$, so the argument must be $A/2σ$.", "$γ=0$ is the antipodal threshold; here the two means are $0$ and $A$, not $-A$ and $+A$."]}, "he": {"q": "איתות on-off: תחת $H_0$ מתקבל $Y=N$; תחת $H_1$ מתקבל $Y=A+N$, עם $N∼N(0,σ^2)$ ואפריוריות שוות. עבור $A=4$, ‏$σ=1$, תן את סף מינימום $P_e$ ואת $P_e$ המתקבל. השתמש ב-$Q(2)=0.0228$, ‏$Q(4)=3.2·10^{-5}$.", "options": ["‏$γ=4$, ‏$P_e=0.0228$", "‏$γ=2$, ‏$P_e=3.2·10^{-5}$", "‏$γ=2$, ‏$P_e=0.0228$", "‏$γ=0$, ‏$P_e=0.5$"], "hint": "אפריוריות שוות ושונויות שוות מציבות תמיד את הסף בדיוק באמצע הדרך בין שתי התוחלות.", "explanation": "שתי נקודות האות הן $0$ ו-$A$, ולכן באפריוריות שוות וב-$σ$ משותף הסף הוא נקודת האמצע $γ=A/2=2$. כל אחת מהסתברויות השגיאה המותנות היא $Q((A/2)/σ)=Q(2)=0.0228$, ומיצוע שני מספרים שווים משאיר $P_e=Q(A/2σ)=0.0228$. השווה לאיתות אנטיפודלי באותו משרעת שיא, שבו ההפרדה היא $2A$ ו-$P_e=Q(A/σ)$ קטן בהרבה: הנקודה בראשית היא שעולה ל-on-off בביצועים.", "whyWrong": ["‏$γ=4$ מציב את הסף בתוחלת של $H_1$ ונותן $P_M=1/2$; נקודת האמצע היא $A/2=2$.", "‏$3.2·10^{-5}=Q(A/σ)$ היא נוסחת האיתות האנטיפודלי; כאן ההפרדה היא $A$ ולכן הארגומנט חייב להיות $A/2σ$.", "‏$γ=0$ הוא הסף האנטיפודלי; כאן שתי התוחלות הן $0$ ו-$A$ ולא $-A$ ו-$+A$."]}}, {"id": "det-013", "area": "detection", "topic": "matched-filter-impulse-response", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["matched-filter", "impulse-response", "time-reversal", "causality"], "answer": 1, "en": {"q": "The pulse $s(t)=e^{-t}$ for $0≤t≤2$ (zero elsewhere) is to be detected by sampling at $t=T=2$. What is the impulse response of the matched filter?", "options": ["$h(t)=e^{-t}$ for $0≤t≤2$", "$h(t)=e^{t-2}$ for $0≤t≤2$", "$h(t)=e^{t}$ for $-2≤t≤0$", "$h(t)=e^{2-t}$ for $0≤t≤2$"], "hint": "Time-reverse the pulse, then shift it by $T$ so that the filter becomes causal.", "explanation": "By definition $h(t)=s(T-t)=s(2-t)$. Substituting into $s(u)=e^{-u}$ with $u=2-t$ gives $h(t)=e^{-(2-t)}=e^{t-2}$, supported on $0≤t≤2$ because $s$ is supported on $[0,2]$. Sanity check: $h(0)=e^{-2}=s(2)$ and $h(2)=1=s(0)$, so $h$ really is the mirror image of $s$ about $t=T/2$, and it is causal and finite-duration.", "whyWrong": ["$e^{-t}$ is the signal itself; the matched filter uses the time-reversed signal, which is a different function unless $s$ is symmetric.", "$e^{t}$ on $[-2,0]$ is $s(-t)$: reversed but never shifted, hence non-causal and matched to sampling at $t=0$.", "$e^{2-t}$ carries a sign error in the exponent; it reaches $e^{2}>1$, while any reversed copy of $s$ is bounded by $s(0)=1$."]}, "he": {"q": "את הפולס $s(t)=e^{-t}$ עבור $0≤t≤2$ (ואפס אחרת) רוצים לגלות בדגימה ב-$t=T=2$. מהי תגובת ההלם של המסנן המותאם?", "options": ["‏$h(t)=e^{-t}$ עבור $0≤t≤2$", "‏$h(t)=e^{t-2}$ עבור $0≤t≤2$", "‏$h(t)=e^{t}$ עבור $-2≤t≤0$", "‏$h(t)=e^{2-t}$ עבור $0≤t≤2$"], "hint": "הפוך את הפולס בזמן ואז הזז אותו ב-$T$ כדי שהמסנן יהיה סיבתי.", "explanation": "לפי ההגדרה $h(t)=s(T-t)=s(2-t)$. הצבה ב-$s(u)=e^{-u}$ עם $u=2-t$ נותנת $h(t)=e^{-(2-t)}=e^{t-2}$, עם תומך $0≤t≤2$ כי התומך של $s$ הוא $[0,2]$. בדיקת שפיות: ‏$h(0)=e^{-2}=s(2)$ ו-$h(2)=1=s(0)$, כלומר $h$ הוא באמת תמונת הראי של $s$ סביב $t=T/2$, והוא סיבתי ובעל משך סופי.", "whyWrong": ["‏$e^{-t}$ הוא האות עצמו; המסנן המותאם משתמש באות ההפוך בזמן, שהוא פונקציה אחרת אלא אם $s$ סימטרי.", "‏$e^{t}$ על $[-2,0]$ הוא $s(-t)$: הפוך אך ללא הזזה, ולכן לא סיבתי ומותאם לדגימה ב-$t=0$.", "‏$e^{2-t}$ נושא שגיאת סימן במעריך; הוא מגיע ל-$e^{2}>1$, בעוד כל עותק הפוך של $s$ חסום על ידי $s(0)=1$."]}}, {"id": "det-014", "area": "detection", "topic": "matched-filter-max-snr", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["matched-filter", "snr", "energy", "n0"], "answer": 3, "en": {"q": "A rectangular pulse of amplitude $1$ V and duration $T=1$ ms arrives in white noise of two-sided PSD $N_0/2=10^{-5}$ W/Hz. What is the maximum output SNR of a matched filter, sampled at $t=T$?", "options": ["$20$", "$50$", "$200$", "$100$"], "hint": "The peak SNR depends only on the pulse energy and $N_0$ — compute $E$ first, and be careful which of $N_0$ or $N_0/2$ is given.", "explanation": "The energy is $E=∫_0^T s^2 dt=(1)^2(10^{-3})=10^{-3}$ J. The two-sided PSD is $N_0/2=10^{-5}$, so $N_0=2·10^{-5}$ W/Hz. The matched-filter peak SNR is $SNR_{max}=2E/N_0=2(10^{-3})/(2·10^{-5})=100$, i.e. $20$ dB. Note the answer depends on the pulse only through its energy: a $0.5$ V pulse of duration $4$ ms would give exactly the same SNR.", "whyWrong": ["$50=E/N_0$ drops the factor $2$; the matched-filter peak is $2E/N_0$, not $E/N_0$.", "$200=E/(N_0/4)$ uses $N_0/2$ where $N_0$ belongs, doubling the correct ratio.", "$20$ is the answer expressed in dB, $10log_{10}(100)=20$ dB, reported as if it were a linear ratio."]}, "he": {"q": "פולס מלבני במשרעת $1$ וולט ובמשך $T=1$ מילישניה מגיע ברעש לבן בעל PSD דו-צדדית $N_0/2=10^{-5}$ ואט/הרץ. מהו יחס האות לרעש המרבי בפלט מסנן מותאם, בדגימה ב-$t=T$?", "options": ["‏$20$", "‏$50$", "‏$200$", "‏$100$"], "hint": "יחס האות לרעש בשיא תלוי רק באנרגיית הפולס וב-$N_0$ — חשב תחילה את $E$, והיזהר מי מבין $N_0$ ו-$N_0/2$ נתון.", "explanation": "האנרגיה היא $E=∫_0^T s^2 dt=(1)^2(10^{-3})=10^{-3}$ ג'אול. ה-PSD הדו-צדדית היא $N_0/2=10^{-5}$, ולכן $N_0=2·10^{-5}$ ואט/הרץ. יחס האות לרעש בשיא של מסנן מותאם הוא $SNR_{max}=2E/N_0=2(10^{-3})/(2·10^{-5})=100$, כלומר $20$ דציבל. שים לב שהתשובה תלויה בפולס רק דרך האנרגיה שלו: פולס של $0.5$ וולט במשך $4$ מילישניות היה נותן בדיוק את אותו יחס.", "whyWrong": ["‏$50=E/N_0$ משמיט את הפקטור $2$; שיא המסנן המותאם הוא $2E/N_0$ ולא $E/N_0$.", "‏$200=E/(N_0/4)$ משתמש ב-$N_0/2$ במקום שבו נדרש $N_0$, ומכפיל את היחס הנכון פי שניים.", "‏$20$ היא התשובה בדציבלים, $10log_{10}(100)=20$ דציבל, המדווחת כאילו הייתה יחס לינארי."]}}, {"id": "det-015", "area": "detection", "topic": "matched-filter-output-shape", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["matched-filter", "waveform-distortion", "autocorrelation", "sampling-instant"], "answer": 1, "en": {"q": "A rectangular pulse $s(t)=A$ on $[0,T]$ is passed through its own matched filter. What does the output look like, and what does that tell you about the filter?", "options": ["A rectangle of width $T$ scaled by $E$: the matched filter preserves the pulse shape", "A triangle of base $2T$ peaking at $t=T$ with height $E=A^2T$: shape is not preserved", "A rectangle of width $2T$ and height $A^2$: the filter only delays and amplifies the pulse", "A $sinc$ with first null at $1/T$: the matched filter acts as an ideal lowpass filter"], "hint": "Convolving $s$ with $s(T-t)$ is the autocorrelation of $s$, shifted by $T$ — draw it for a rectangle.", "explanation": "The noiseless output is $s*h$ with $h(t)=s(T-t)$, which equals $R_s(t-T)$, the autocorrelation of $s$ shifted so its peak lands at $t=T$. For a rectangle the autocorrelation is triangular of base $2T$, with peak $R_s(0)=∫s^2=A^2T=E$. So the output is a triangle, not a rectangle: the matched filter maximises the SNR at the single instant $t=T$ and does nothing to keep the waveform intact. Distortion is irrelevant because only the sample at $t=T$ is used; a filter that preserved shape would be an equaliser and would give a lower SNR.", "whyWrong": ["Shape preservation is the job of an equaliser; the matched filter deliberately trades waveform fidelity for peak SNR.", "The support of the convolution is $2T$ wide, but its value varies linearly over that support and is not a constant $A^2$.", "A $sinc$ output would come from an ideal brick-wall lowpass filter, which is not matched to a rectangular pulse."]}, "he": {"q": "פולס מלבני $s(t)=A$ על $[0,T]$ מועבר דרך המסנן המותאם שלו. כיצד נראה הפלט, ומה זה מלמד על המסנן?", "options": ["מלבן ברוחב $T$ מוכפל ב-$E$: המסנן המותאם משמר את צורת הפולס", "משולש בבסיס $2T$ עם שיא ב-$t=T$ בגובה $E=A^2T$: הצורה אינה נשמרת", "מלבן ברוחב $2T$ ובגובה $A^2$: המסנן רק משהה ומגביר את הפולס", "פונקציית $sinc$ עם אפס ראשון ב-$1/T$: המסנן המותאם פועל כמסנן מעביר נמוכים אידיאלי"], "hint": "קונבולוציה של $s$ עם $s(T-t)$ היא האוטוקורלציה של $s$ מוזזת ב-$T$ — שרטט אותה עבור מלבן.", "explanation": "הפלט ללא רעש הוא $s*h$ עם $h(t)=s(T-t)$, ששווה ל-$R_s(t-T)$, האוטוקורלציה של $s$ מוזזת כך שהשיא שלה נופל ב-$t=T$. עבור מלבן האוטוקורלציה משולשת בבסיס $2T$ עם שיא $R_s(0)=∫s^2=A^2T=E$. לכן הפלט הוא משולש ולא מלבן: המסנן המותאם ממקסם את יחס האות לרעש ברגע היחיד $t=T$ ואינו עושה דבר כדי לשמר את צורת הגל. העיוות אינו רלוונטי כי משתמשים רק בדגימה ב-$t=T$; מסנן שהיה משמר צורה היה משווה (אקווליזר) ונותן יחס אות לרעש נמוך יותר.", "whyWrong": ["שימור צורה הוא תפקידו של משווה; המסנן המותאם מוותר במכוון על נאמנות צורת הגל לטובת שיא יחס אות לרעש.", "התומך של הקונבולוציה אכן ברוחב $2T$, אך ערכה משתנה לינארית לאורכו ואינו קבוע $A^2$.", "פלט מסוג $sinc$ מגיע ממסנן מעביר נמוכים אידיאלי, שאינו מותאם לפולס מלבני."]}}, {"id": "det-016", "area": "detection", "topic": "correlator-equivalence", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["correlator", "matched-filter", "sampling-instant", "equivalence"], "answer": 2, "en": {"q": "A correlator forms $z=∫_0^T y(t)s(t)dt$, while a matched filter with $h(t)=s(T-t)$ is sampled at $t=T$. What is the exact relation between them?", "options": ["They are the same system: their outputs coincide as functions of $t$ for every $t$", "The matched filter is superior because it also whitens the noise before the sampler", "Their outputs agree at $t=T$ only; for $t≠T$ the filter output is a different function", "The correlator is superior because it does not require the noise to be white"], "hint": "Write the convolution integral and see what happens to the shift when you set $t=T$.", "explanation": "The filter output is $∫y(τ)h(t-τ)dτ=∫y(τ)s(T-t+τ)dτ$. Setting $t=T$ gives $∫_0^T y(τ)s(τ)dτ=z$, so the two agree at the sampling instant. At any other $t$ the reference is shifted by $T-t$ and the two are different functions of time, which is why the integrate-and-dump correlator must be read and reset exactly at $t=T$; a timing error costs SNR in both implementations equally. Neither whitens noise, and both are optimal under the same white-noise assumption.", "whyWrong": ["The outputs coincide at one instant only; the correlator does not even produce a running waveform once it is dumped.", "The matched filter does no whitening: it is derived assuming the noise is already white.", "Both rely on whiteness; for coloured noise both must be preceded by a whitening filter."]}, "he": {"q": "מתאם מחשב $z=∫_0^T y(t)s(t)dt$, ואילו מסנן מותאם עם $h(t)=s(T-t)$ נדגם ב-$t=T$. מהו הקשר המדויק ביניהם?", "options": ["הם אותה מערכת: הפלטים שלהם מתלכדים כפונקציות של $t$ עבור כל $t$", "המסנן המותאם עדיף כי הוא גם מלבין את הרעש לפני הדוגם", "הפלטים שווים ב-$t=T$ בלבד; עבור $t≠T$ פלט המסנן הוא פונקציה אחרת", "המתאם עדיף כי אינו דורש שהרעש יהיה לבן"], "hint": "רשום את אינטגרל הקונבולוציה וראה מה קורה להזזה כאשר מציבים $t=T$.", "explanation": "פלט המסנן הוא $∫y(τ)h(t-τ)dτ=∫y(τ)s(T-t+τ)dτ$. הצבת $t=T$ נותנת $∫_0^T y(τ)s(τ)dτ=z$, ולכן השניים שווים ברגע הדגימה. בכל $t$ אחר האות הייחוס מוזז ב-$T-t$ והשניים הם פונקציות זמן שונות; לכן יש לקרוא ולאפס את מתאם ה-integrate-and-dump בדיוק ב-$t=T$, ושגיאת תזמון עולה ביחס אות לרעש בשני המימושים באותה מידה. אף אחד מהם אינו מלבין רעש, ושניהם אופטימליים תחת אותה הנחת רעש לבן.", "whyWrong": ["הפלטים מתלכדים ברגע אחד בלבד; המתאם אף אינו מייצר צורת גל רציפה לאחר האיפוס.", "המסנן המותאם אינו מבצע הלבנה: הוא נגזר בהנחה שהרעש כבר לבן.", "שניהם נשענים על לובן; ברעש צבעוני יש להקדים לשניהם מסנן מלבין."]}}, {"id": "det-017", "area": "detection", "topic": "signal-distance", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["signal-distance", "correlation", "energy", "geometry"], "answer": 0, "en": {"q": "Two equally likely signals have energies $E_1=16$ and $E_2=4$ and normalised correlation $ρ=0.25$, where $ρ=∫s_1s_2dt/√(E_1E_2)$. What is $d^2=∫(s_1-s_2)^2dt$?", "options": ["$d^2=16$", "$d^2=20$", "$d^2=18$", "$d^2=24$"], "hint": "Expand the square; the cross term is $-2∫s_1s_2 dt$, and $∫s_1s_2 dt=ρ√(E_1E_2)$.", "explanation": "Expanding, $d^2=E_1+E_2-2∫s_1s_2dt=E_1+E_2-2ρ√(E_1E_2)$. Here $√(E_1E_2)=√64=8$, so $d^2=16+4-2(0.25)(8)=20-4=16$ and $d=4$. This is the only feature of the signal pair that matters: for coherent detection in white noise of PSD $N_0/2$ the optimum error probability is $P_e=Q(d/√(2N_0))$, so two very different-looking pairs with the same $d$ perform identically.", "whyWrong": ["$20=E_1+E_2$ drops the cross term entirely, which is correct only for orthogonal signals ($ρ=0$).", "$18$ keeps the cross term but loses its factor $2$: expanding $(s_1-s_2)^2$ produces $-2s_1s_2$.", "$24$ has the wrong sign: positive correlation brings the signals closer, so $d^2$ must fall below $E_1+E_2$."]}, "he": {"q": "לשני אותות שווי הסתברות אנרגיות $E_1=16$ ו-$E_2=4$ וקורלציה מנורמלת $ρ=0.25$, כאשר $ρ=∫s_1s_2dt/√(E_1E_2)$. מהו $d^2=∫(s_1-s_2)^2dt$?", "options": ["‏$d^2=16$", "‏$d^2=20$", "‏$d^2=18$", "‏$d^2=24$"], "hint": "פתח את הריבוע; האיבר המעורב הוא $-2∫s_1s_2 dt$, ומתקיים $∫s_1s_2 dt=ρ√(E_1E_2)$.", "explanation": "פיתוח נותן $d^2=E_1+E_2-2∫s_1s_2dt=E_1+E_2-2ρ√(E_1E_2)$. כאן $√(E_1E_2)=√64=8$, ולכן $d^2=16+4-2(0.25)(8)=20-4=16$ ו-$d=4$. זו התכונה היחידה של זוג האותות שמשנה: בגילוי קוהרנטי ברעש לבן בעל PSD ‏$N_0/2$ הסתברות השגיאה האופטימלית היא $P_e=Q(d/√(2N_0))$, ולכן שני זוגות שנראים שונים לגמרי אך בעלי אותו $d$ מתפקדים באופן זהה.", "whyWrong": ["‏$20=E_1+E_2$ משמיט לגמרי את האיבר המעורב, וזה נכון רק עבור אותות אורתוגונליים ($ρ=0$).", "‏$18$ שומר את האיבר המעורב אך מאבד את הפקטור $2$: פיתוח $(s_1-s_2)^2$ מייצר $-2s_1s_2$.", "‏$24$ בעל סימן שגוי: קורלציה חיובית מקרבת את האותות, ולכן $d^2$ חייב לרדת מתחת ל-$E_1+E_2$."]}}, {"id": "det-018", "area": "detection", "topic": "union-bound", "difficulty": 4, "type": "mcq", "hardnessSource": "computation", "tags": ["union-bound", "m-ary", "nearest-neighbour", "q-function"], "answer": 2, "en": {"q": "In an $M$-ary constellation the distances from $s_1$ to the three other signals are $4$, $4$ and $6$, and the noise in each dimension is $N(0,1)$. Give the union bound on $P(error|s_1)$. Use $Q(2)=0.0228$, $Q(3)=0.00135$.", "options": ["$0.0228$", "$0.000063$", "$0.047$", "$0.068$"], "hint": "Each term is the error probability of the binary test against one competitor: $Q(d/2σ)$.", "explanation": "The union bound sums the pairwise error probabilities: $P(e|s_1)≤Σ_{j≠1}Q(d_{1j}/2σ)=2Q(4/2)+Q(6/2)=2(0.0228)+0.00135=0.0470$. Each term is the exact error probability of the binary problem between $s_1$ and one competitor, and the bound over-counts the regions where two such errors overlap. At high SNR the nearest-neighbour terms dominate and the bound becomes tight; here the far competitor already contributes only three per cent of the total.", "whyWrong": ["$0.0228$ is the nearest-neighbour term alone, which is a lower bound on $P(e|s_1)$, not the union bound.", "$0.000063=2Q(4)+Q(6)$ forgets the $1/2σ$: the argument is half the distance, since the pairwise boundary is at the midpoint.", "$0.068=3Q(2)$ applies the minimum distance to all three competitors and grossly over-counts the far one."]}, "he": {"q": "בקבוצת אותות $M$-ארית המרחקים מ-$s_1$ לשלושת האותות האחרים הם $4$, ‏$4$ ו-$6$, והרעש בכל ממד הוא $N(0,1)$. תן את חסם האיחוד על $P(error|s_1)$. השתמש ב-$Q(2)=0.0228$, ‏$Q(3)=0.00135$.", "options": ["‏$0.0228$", "‏$0.000063$", "‏$0.047$", "‏$0.068$"], "hint": "כל איבר הוא הסתברות השגיאה של המבחן הבינארי מול מתחרה אחד: ‏$Q(d/2σ)$.", "explanation": "חסם האיחוד מסכם את הסתברויות השגיאה הזוגיות: ‏$P(e|s_1)≤Σ_{j≠1}Q(d_{1j}/2σ)=2Q(4/2)+Q(6/2)=2(0.0228)+0.00135=0.0470$. כל איבר הוא הסתברות השגיאה המדויקת של הבעיה הבינארית בין $s_1$ למתחרה אחד, והחסם סופר פעמיים את האזורים שבהם שתי שגיאות כאלה נחתכות. ביחס אות לרעש גבוה איברי השכן הקרוב שולטים והחסם הופך הדוק; כאן המתחרה הרחוק כבר תורם רק כשלושה אחוזים מהסכום.", "whyWrong": ["‏$0.0228$ הוא איבר השכן הקרוב לבדו, שהוא חסם תחתון על $P(e|s_1)$ ולא חסם האיחוד.", "‏$0.000063=2Q(4)+Q(6)$ שוכח את $1/2σ$: הארגומנט הוא חצי המרחק, כי גבול ההחלטה הזוגי נמצא בנקודת האמצע.", "‏$0.068=3Q(2)$ מיישם את המרחק המינימלי על שלושת המתחרים וסופר ביתר בגסות את הרחוק."]}}, {"id": "det-019", "area": "detection", "topic": "noncoherent-random-phase", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["noncoherent", "random-phase", "envelope-detector", "quadrature"], "answer": 2, "en": {"q": "A pulse $A cos(2πf_ct+θ)$ may be present, with $θ$ unknown and uniform on $[0,2π)$. After averaging the likelihood over $θ$, what does the optimal detector compute?", "options": ["The in-phase correlation with $cos(2πf_ct)$ alone, compared with a threshold", "An ML estimate of $θ$, then the coherent rule with that estimate plugged in", "The envelope $√(I^2+Q^2)$ from two quadrature correlators, compared with a threshold", "The sum $I+Q$ of the two quadrature correlations, compared with a threshold"], "hint": "Averaging $exp(a cos θ)$ over a uniform $θ$ produces a Bessel function of what quantity?", "explanation": "Correlate the received signal against $cos(2πf_ct)$ and $sin(2πf_ct)$ to get $I$ and $Q$. The conditional likelihood contains $exp((I cosθ+Q sinθ)·const)$, and averaging over a uniform $θ$ gives $I_0(const·√(I^2+Q^2))$, a monotone function of the envelope $R=√(I^2+Q^2)$. So the LRT reduces to $R$ against a threshold — a noncoherent or envelope detector. Under $H_0$, $R$ is Rayleigh; under $H_1$ it is Rician. The cost of not knowing $θ$ is roughly $1$ dB at useful error rates.", "whyWrong": ["The in-phase branch alone can be near zero for an unlucky $θ$; discarding $Q$ throws away half the energy at random.", "Estimate-then-detect is a reasonable heuristic but is not the LRT here; averaging over the prior on $θ$ is, and it yields the envelope.", "$I+Q$ is still phase-dependent: it is the projection onto one fixed direction, and it can be negative or cancel."]}, "he": {"q": "ייתכן שנוכח פולס $A cos(2πf_ct+θ)$, כאשר $θ$ אינו ידוע ומתפלג אחיד על $[0,2π)$. לאחר מיצוע הנראות על פני $θ$, מה מחשב הגלאי האופטימלי?", "options": ["את קורלציית המופע בלבד מול $cos(2πf_ct)$, ומשווה אותה לסף", "אומד ML ל-$θ$, ואז את הכלל הקוהרנטי עם האומד המוצב בו", "את המעטפת $√(I^2+Q^2)$ משני מתאמים בריבוע, ומשווה אותה לסף", "את הסכום $I+Q$ של שתי קורלציות הריבוע, ומשווה אותו לסף"], "hint": "מיצוע של $exp(a cos θ)$ על $θ$ אחיד מייצר פונקציית בסל של איזה גודל?", "explanation": "מבצעים קורלציה של האות המתקבל מול $cos(2πf_ct)$ ומול $sin(2πf_ct)$ ומקבלים $I$ ו-$Q$. הנראות המותנית מכילה $exp((I cosθ+Q sinθ)·const)$, ומיצוע על $θ$ אחיד נותן $I_0(const·√(I^2+Q^2))$, פונקציה מונוטונית של המעטפת $R=√(I^2+Q^2)$. לכן מבחן יחס הנראות מצטמצם להשוואת $R$ לסף — גלאי לא קוהרנטי או גלאי מעטפת. תחת $H_0$ ההתפלגות של $R$ היא ריילי, ותחת $H_1$ היא רייס. המחיר של אי ידיעת $θ$ הוא כדציבל אחד בקצבי שגיאה שימושיים.", "whyWrong": ["ענף המופע לבדו יכול להיות קרוב לאפס עבור $θ$ ביש מזל; השמטת $Q$ מבזבזת חצי מהאנרגיה באקראי.", "אמידה ואז גילוי היא היוריסטיקה סבירה אך אינה מבחן יחס הנראות כאן; המיצוע על ההתפלגות של $θ$ הוא זה, והוא מוביל למעטפת.", "‏$I+Q$ עדיין תלוי מופע: זו הטלה על כיוון קבוע אחד, והיא יכולה להיות שלילית או להתאפס."]}}, {"id": "det-020", "area": "detection", "topic": "coloured-noise-whitening", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["coloured-noise", "whitening", "matched-filter", "optimality-conditions"], "answer": 3, "en": {"q": "Under exactly which condition is $h(t)=s(T-t)$ the SNR-maximising filter, and what replaces it when that condition fails?", "options": ["Whenever the noise is zero mean; colour changes only the value of the maximum SNR", "Only for Gaussian noise; against non-Gaussian noise no linear filter can help at all", "Whenever the noise is WSS; a whitening stage merely reduces implementation cost", "Only for white noise; in general $H(f)=S^*(f)e^{-j2πfT}/S_n(f)$, i.e. whiten, then match"], "hint": "Redo the Cauchy-Schwarz step with the noise power spectrum as a weight and see what survives.", "explanation": "Maximising $|∫H(f)S(f)e^{j2πfT}df|^2/∫|H(f)|^2S_n(f)df$ by Cauchy-Schwarz with weight $S_n(f)$ gives $H(f)∝S^*(f)e^{-j2πfT}/S_n(f)$, and the maximum becomes $SNR=∫|S(f)|^2/S_n(f)df$. This collapses to $s(T-t)$ exactly when $S_n(f)$ is constant, i.e. white. Equivalently: first pass $y$ through $1/√(S_n(f))$ to whiten, then match to the whitened signal. Note that $s(T-t)$ maximises SNR for any white noise, Gaussian or not; Gaussianity is what makes maximum SNR coincide with the likelihood ratio test.", "whyWrong": ["Zero mean is far too weak: colouring changes which filter is optimal, not merely the SNR it achieves.", "Against white non-Gaussian noise $s(T-t)$ still maximises SNR; Gaussianity is needed for LRT optimality, not for the SNR result.", "WSS is also too weak — white noise is one special WSS noise; whitening changes the optimum rather than saving cost."]}, "he": {"q": "תחת איזה תנאי בדיוק $h(t)=s(T-t)$ הוא המסנן הממקסם את יחס האות לרעש, ומה מחליף אותו כאשר התנאי אינו מתקיים?", "options": ["בכל פעם שהרעש בעל תוחלת אפס; הצבע משנה רק את ערך יחס האות לרעש המרבי", "רק ברעש גאוסי; מול רעש לא גאוסי שום מסנן לינארי אינו יכול לעזור כלל", "בכל פעם שהרעש WSS; שלב ההלבנה רק מוזיל את עלות המימוש", "רק ברעש לבן; באופן כללי $H(f)=S^*(f)e^{-j2πfT}/S_n(f)$, כלומר הלבן ואז התאם"], "hint": "בצע מחדש את שלב קושי-שוורץ עם ספקטרום הרעש כמשקל וראה מה נשאר.", "explanation": "מקסום של $|∫H(f)S(f)e^{j2πfT}df|^2/∫|H(f)|^2S_n(f)df$ באמצעות קושי-שוורץ עם משקל $S_n(f)$ נותן $H(f)∝S^*(f)e^{-j2πfT}/S_n(f)$, והמקסימום הופך ל-$SNR=∫|S(f)|^2/S_n(f)df$. זה מצטמצם ל-$s(T-t)$ בדיוק כאשר $S_n(f)$ קבועה, כלומר ברעש לבן. באופן שקול: תחילה מעבירים את $y$ דרך $1/√(S_n(f))$ להלבנה, ואז מתאימים לאות המולבן. שים לב ש-$s(T-t)$ ממקסם יחס אות לרעש עבור כל רעש לבן, גאוסי או לא; הגאוסיות היא שגורמת למקסום יחס אות לרעש להתלכד עם מבחן יחס הנראות.", "whyWrong": ["תוחלת אפס היא דרישה חלשה מדי: הצביעה משנה איזה מסנן אופטימלי ולא רק את יחס האות לרעש שהוא משיג.", "מול רעש לבן לא גאוסי $s(T-t)$ עדיין ממקסם יחס אות לרעש; הגאוסיות נדרשת לאופטימליות מבחן יחס הנראות ולא לתוצאת ה-SNR.", "‏WSS גם הוא חלש מדי — רעש לבן הוא מקרה פרטי של רעש WSS; ההלבנה משנה את האופטימום ולא חוסכת עלות."]}}, {"id": "det-021", "area": "detection", "topic": "pfa-pd-gaussian-threshold", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["pfa", "pd", "gaussian", "q-function"], "answer": 3, "en": {"q": "A detector decides $H_1$ iff $T>4$. Under $H_0$, $T∼N(0,4)$; under $H_1$, $T∼N(6,4)$. Give $(P_{FA},P_D)$. Use $Q(0.5)=0.3085$, $Q(1)=0.1587$, $Q(2)=0.0228$.", "options": ["$(0.0228, 0.1587)$", "$(0.1587, 0.6915)$", "$(0.0228, 0.9772)$", "$(0.0228, 0.8413)$"], "hint": "The variance is $4$, so divide by $σ=2$; for $P_D$ the argument is $(γ-μ_1)/σ$ and it comes out negative.", "explanation": "Here $σ=√4=2$. Then $P_{FA}=P(T>4|H_0)=Q((4-0)/2)=Q(2)=0.0228$ and $P_D=P(T>4|H_1)=Q((4-6)/2)=Q(-1)=1-Q(1)=1-0.1587=0.8413$. The threshold sits one standard deviation below the mean of $H_1$ and two above the mean of $H_0$, which is exactly why $P_{FA}$ is small while $P_D$ is comfortably above $1/2$.", "whyWrong": ["$P_D=0.1587=Q(1)$ drops the minus sign; since $γ<μ_1$, more than half the $H_1$ mass lies above the threshold.", "$(0.1587,0.6915)$ divides by the variance $4$ instead of the standard deviation $2$ in both tails.", "$P_D=0.9772=Q(-2)$ uses the $H_0$ mean inside $P_D$; the correct argument is $(4-6)/2=-1$."]}, "he": {"q": "גלאי מחליט $H_1$ אם ורק אם $T>4$. תחת $H_0$ מתקיים $T∼N(0,4)$; תחת $H_1$ מתקיים $T∼N(6,4)$. תן את $(P_{FA},P_D)$. השתמש ב-$Q(0.5)=0.3085$, ‏$Q(1)=0.1587$, ‏$Q(2)=0.0228$.", "options": ["‏$(0.0228, 0.1587)$", "‏$(0.1587, 0.6915)$", "‏$(0.0228, 0.9772)$", "‏$(0.0228, 0.8413)$"], "hint": "השונות היא $4$, ולכן יש לחלק ב-$σ=2$; עבור $P_D$ הארגומנט הוא $(γ-μ_1)/σ$ והוא יוצא שלילי.", "explanation": "כאן $σ=√4=2$. לכן $P_{FA}=P(T>4|H_0)=Q((4-0)/2)=Q(2)=0.0228$ וכן $P_D=P(T>4|H_1)=Q((4-6)/2)=Q(-1)=1-Q(1)=1-0.1587=0.8413$. הסף נמצא סטיית תקן אחת מתחת לתוחלת של $H_1$ ושתי סטיות מעל התוחלת של $H_0$, ובדיוק לכן $P_{FA}$ קטן בעוד $P_D$ גדול בנוחות מ-$1/2$.", "whyWrong": ["‏$P_D=0.1587=Q(1)$ משמיט את סימן המינוס; מכיוון ש-$γ<μ_1$, יותר מחצי מהמסה של $H_1$ נמצאת מעל הסף.", "‏$(0.1587,0.6915)$ מחלק בשונות $4$ במקום בסטיית התקן $2$ בשני הזנבות.", "‏$P_D=0.9772=Q(-2)$ משתמש בתוחלת של $H_0$ בתוך $P_D$; הארגומנט הנכון הוא $(4-6)/2=-1$."]}}, {"id": "det-022", "area": "detection", "topic": "roc-slope-equals-threshold", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["roc", "slope", "concavity", "proof"], "en": {"q": "Show that the slope of an LRT ROC at the operating point generated by threshold $η$ equals $η$. Deduce that the ROC is concave and never falls below the diagonal.", "hint": "Write $P_D$ and $P_{FA}$ as tail integrals of the density of $L(Y)$, and use the change-of-measure identity $p_{L|H_1}(l)=l·p_{L|H_0}(l)$.", "modelAnswer": "Let $L=L(Y)=p_1(Y)/p_0(Y)$ and let $p_{L|H_i}$ denote its density under $H_i$. The test decides $H_1$ iff $L>η$, so $P_D(η)=∫_η^∞ p_{L|H_1}(l)dl$ and $P_{FA}(η)=∫_η^∞ p_{L|H_0}(l)dl$. Key identity: for any Borel set $A$ of the real line, $P(L∈A|H_1)=∫ 1(L(y)∈A) p_1(y)dy = ∫ 1(L(y)∈A) L(y)p_0(y)dy = E_0[L·1(L∈A)]$. Since this holds for every $A$, the density of $L$ under $H_1$ is $l$ times its density under $H_0$: $p_{L|H_1}(l)=l·p_{L|H_0}(l)$. Now differentiate the two tail integrals with respect to $η$: $dP_D/dη=-p_{L|H_1}(η)=-η·p_{L|H_0}(η)$ and $dP_{FA}/dη=-p_{L|H_0}(η)$. Dividing (valid wherever $p_{L|H_0}(η)>0$) gives $dP_D/dP_{FA}=η$, the claim. Consequences. (i) Raising $η$ moves the operating point down and to the left, so as $P_{FA}$ increases the threshold $η$ decreases; the slope is therefore non-increasing along the curve, i.e. the ROC is concave. (ii) The curve joins $(0,0)$ (take $η=∞$) to $(1,1)$ (take $η=0$); a concave function lying on those two endpoints stays on or above the chord between them, which is exactly the diagonal, so $P_D≥P_{FA}$ everywhere. Independently: the diagonal is achievable by ignoring the data and declaring $H_1$ with probability $α$, and the LRT is optimal, so it can never do worse. (iii) The slope reads off the criterion in use: slope $1$ marks the ML point, slope $P_0/P_1$ the minimum-$P_e$ point, and the Neyman-Pearson point is wherever the vertical line $P_{FA}=α$ cuts the curve.", "rubric": ["Writes $P_D(η)$ and $P_{FA}(η)$ as tail integrals of $p_{L|H_1}$ and $p_{L|H_0}$ over $(η,∞)$.", "States and justifies the change-of-measure identity $p_{L|H_1}(l)=l·p_{L|H_0}(l)$.", "Differentiates both with respect to $η$ and forms the ratio to obtain $dP_D/dP_{FA}=η$.", "Argues concavity from the fact that $η$ decreases as $P_{FA}$ grows, so the slope is non-increasing.", "Concludes $P_D≥P_{FA}$, either from concavity with endpoints $(0,0)$ and $(1,1)$ or by comparison with a randomised coin-flip rule."]}, "he": {"q": "הראה ששיפוע עקומת ה-ROC של מבחן יחס נראות בנקודת העבודה הנוצרת מסף $η$ שווה ל-$η$. הסק שהעקומה קעורה ואינה יורדת מתחת לאלכסון.", "hint": "רשום את $P_D$ ואת $P_{FA}$ כאינטגרלי זנב של צפיפות $L(Y)$, והשתמש בזהות החלפת המידה $p_{L|H_1}(l)=l·p_{L|H_0}(l)$.", "modelAnswer": "נסמן $L=L(Y)=p_1(Y)/p_0(Y)$ ותהי $p_{L|H_i}$ צפיפותו תחת $H_i$. המבחן מחליט $H_1$ אם ורק אם $L>η$, ולכן $P_D(η)=∫_η^∞ p_{L|H_1}(l)dl$ וכן $P_{FA}(η)=∫_η^∞ p_{L|H_0}(l)dl$. הזהות המרכזית: לכל קבוצת בורל $A$ על הישר, $P(L∈A|H_1)=∫ 1(L(y)∈A) p_1(y)dy = ∫ 1(L(y)∈A) L(y)p_0(y)dy = E_0[L·1(L∈A)]$. מכיוון שזה נכון לכל $A$, צפיפות $L$ תחת $H_1$ שווה ל-$l$ כפול צפיפותו תחת $H_0$: ‏$p_{L|H_1}(l)=l·p_{L|H_0}(l)$. כעת נגזור את שני אינטגרלי הזנב לפי $η$: ‏$dP_D/dη=-p_{L|H_1}(η)=-η·p_{L|H_0}(η)$ וכן $dP_{FA}/dη=-p_{L|H_0}(η)$. חלוקה (תקפה בכל מקום שבו $p_{L|H_0}(η)>0$) נותנת $dP_D/dP_{FA}=η$, כנדרש. מסקנות. (א) העלאת $η$ מזיזה את נקודת העבודה שמאלה ולמטה, ולכן ככל ש-$P_{FA}$ גדל הסף $η$ קטן; השיפוע אינו עולה לאורך העקומה, כלומר העקומה קעורה. (ב) העקומה מחברת את $(0,0)$ (עבור $η=∞$) עם $(1,1)$ (עבור $η=0$); פונקציה קעורה העוברת בשתי נקודות אלה נשארת על המיתר ביניהן או מעליו, והמיתר הזה הוא בדיוק האלכסון, ולכן $P_D≥P_{FA}$ בכל נקודה. באופן בלתי תלוי: האלכסון מושג על ידי התעלמות מהנתונים והכרזת $H_1$ בהסתברות $α$, ומבחן יחס הנראות אופטימלי ולכן לעולם אינו גרוע יותר. (ג) השיפוע מסגיר את הקריטריון שבשימוש: שיפוע $1$ מסמן את נקודת ML, שיפוע $P_0/P_1$ את נקודת מינימום $P_e$, ונקודת ניימן-פירסון היא המקום שבו הישר $P_{FA}=α$ חותך את העקומה.", "rubric": ["רושם את $P_D(η)$ ואת $P_{FA}(η)$ כאינטגרלי זנב של $p_{L|H_1}$ ושל $p_{L|H_0}$ על $(η,∞)$.", "מנסח ומנמק את זהות החלפת המידה $p_{L|H_1}(l)=l·p_{L|H_0}(l)$.", "גוזר את שניהם לפי $η$ ומרכיב את היחס כדי לקבל $dP_D/dP_{FA}=η$.", "מנמק קעירות מכך ש-$η$ קטן כאשר $P_{FA}$ גדל, ולכן השיפוע אינו עולה.", "מסיק $P_D≥P_{FA}$, מקעירות עם הקצוות $(0,0)$ ו-$(1,1)$ או מהשוואה לכלל אקראי של הטלת מטבע."]}}, {"id": "det-023", "area": "detection", "topic": "antipodal-vs-onoff-3db", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["antipodal", "on-off", "3db", "energy-per-bit"], "en": {"q": "Antipodal signalling uses the points $±√E_b$; on-off keying uses $√E$ and $0$. Show both satisfy $P_e=Q(√(d^2/(2N_0)))$, and that on-off needs $3$ dB more average energy per bit for the same $P_e$.", "hint": "Work in the one-dimensional signal space at the matched-filter output, and compute $d^2$ and the average energy per bit separately for each scheme.", "modelAnswer": "After the matched filter or correlator the problem is one-dimensional: the statistic is $r=s+n$ where $s$ is one of the two signal points and $n∼N(0,N_0/2)$. With equal priors and a common noise variance the optimal threshold is the midpoint of the two points, and the error probability is $P_e=Q((d/2)/σ)$ with $σ=√(N_0/2)$, i.e. $P_e=Q(√(d^2/(2N_0)))$, where $d$ is the Euclidean distance between the points. This form already shows that only $d$ matters. Antipodal: the points are $+√E_b$ and $-√E_b$, each of energy $E_b$, so the average energy per bit is $E_b$ and $d^2=(2√E_b)^2=4E_b$. Hence $P_e=Q(√(4E_b/(2N_0)))=Q(√(2E_b/N_0))$. On-off: the points are $√E$ and $0$, of energies $E$ and $0$; with equal priors the average energy per bit is $E_b=E/2$, and $d^2=E=2E_b$. Hence $P_e=Q(√(2E_b/(2N_0)))=Q(√(E_b/N_0))$. Equating the two error probabilities requires the on-off scheme to use twice the average energy per bit, and $10log_{10}2≈3.01$ dB. The reason is geometric: for a fixed average energy, placing the two points symmetrically about the origin buys the largest possible separation, whereas on-off spends half its budget on a point at the origin that contributes nothing to $d$. A final remark: the penalty is $3$ dB in average energy but $6$ dB in peak energy, since the on-off scheme must transmit amplitude $2√E_b$ on its on symbol.", "rubric": ["Reduces to a one-dimensional test with $n∼N(0,N_0/2)$ and derives $P_e=Q(d/(2σ))=Q(√(d^2/(2N_0)))$.", "For antipodal: average energy per bit $E_b$, $d^2=4E_b$, hence $P_e=Q(√(2E_b/N_0))$.", "For on-off: average energy per bit $E_b=E/2$, $d^2=2E_b$, hence $P_e=Q(√(E_b/N_0))$.", "Concludes that equal $P_e$ requires an energy ratio of exactly $2$, i.e. $3.01$ dB.", "Explains geometrically that antipodal maximises separation per unit average energy (optionally noting the $6$ dB peak-energy penalty)."]}, "he": {"q": "איתות אנטיפודלי משתמש בנקודות $±√E_b$; איתות on-off משתמש ב-$√E$ וב-$0$. הראה ששניהם מקיימים $P_e=Q(√(d^2/(2N_0)))$, ושאיתות on-off דורש $3$ דציבל יותר אנרגיה ממוצעת לסיבית עבור אותו $P_e$.", "hint": "עבוד במרחב האותות החד-ממדי בפלט המסנן המותאם, וחשב בנפרד לכל שיטה את $d^2$ ואת האנרגיה הממוצעת לסיבית.", "modelAnswer": "לאחר המסנן המותאם או המתאם הבעיה חד-ממדית: הסטטיסטי הוא $r=s+n$ כאשר $s$ היא אחת משתי נקודות האות ו-$n∼N(0,N_0/2)$. באפריוריות שוות ובשונות רעש משותפת הסף האופטימלי הוא נקודת האמצע בין שתי הנקודות, והסתברות השגיאה היא $P_e=Q((d/2)/σ)$ עם $σ=√(N_0/2)$, כלומר $P_e=Q(√(d^2/(2N_0)))$, כאשר $d$ הוא המרחק האוקלידי בין הנקודות. צורה זו כבר מראה שרק $d$ משנ
