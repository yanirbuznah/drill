ארגודי בתוחלת. בהתאמה, $C_X(τ)=1$ אינה דועכת, כלומר הזיכרון אינו נעלם לעולם.", "whyWrong": ["פונקציות מדגם קבועות מתיישבות היטב עם WSS: ‏WSS מגבילה את התוחלת ואת האוטוקורלציה, לא את מידת ההשתנות של המימושים.", "תוחלת קבועה היא דרישה ל-WSS ולא הוכחה לארגודיות; ארגודיות עוסקת בשאלה אם מימוש בודד משחזר ממוצעי אנסמבל.", "התהליך כן WSS, וקיום ממוצע בזמן כשלעצמו אינו מלמד דבר: כאן הגבול הוא המשתנה האקראי $A$ ולא הקבוע $0$."]}}, {"id": "cnv-010", "area": "convergence", "topic": "mean-ergodicity-condition", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["mean-ergodicity", "mean-square-integral", "variance-of-time-average"], "en": {"q": "$X(t)$ is WSS with mean $μ$ and autocovariance $C_X(τ)$. For $m_T=(1/2T)∫_{-T}^{T}X(t)dt$, derive $Var(m_T)$ as a single integral in $τ$ and state the condition for mean-ergodicity.", "hint": "Write the variance as a double integral of $C_X(t-s)$ over the square $[-T,T]²$ and change variables to $τ=t-s$.", "modelAnswer": "The mean-square integral exists because $R_X$ is continuous, and $E[m_T]=(1/2T)∫_{-T}^{T}E[X(t)]dt=μ$, so the estimator is unbiased. For the variance, exchange expectation and integration (legitimate in the m.s. sense): $Var(m_T)=E[((1/2T)∫_{-T}^{T}(X(t)-μ)dt)²]=(1/4T²)∫_{-T}^{T}∫_{-T}^{T}C_X(t-s) dt ds$. Substituting $τ=t-s$: for a fixed $τ$ in $[-2T,2T]$ the set of pairs $(t,s)$ in the square with $t-s=τ$ has length measure $2T-|τ|$, so the double integral collapses to $∫_{-2T}^{2T}(2T-|τ|)C_X(τ)dτ$. Hence $Var(m_T)=(1/4T²)∫_{-2T}^{2T}(2T-|τ|)C_X(τ)dτ=(1/2T)∫_{-2T}^{2T}(1-|τ|/(2T))C_X(τ)dτ$, a triangular (Bartlett) weighting of the autocovariance. Condition: the process is mean-ergodic in the mean-square sense exactly when $Var(m_T) → 0$ as $T → ∞$, since $E[|m_T-μ|²]=Var(m_T)$. Practical sufficient conditions: $∫_{-∞}^{∞}|C_X(τ)|dτ<∞$, or more simply $C_X(τ) → 0$ as $|τ| → ∞$ (samples far apart become uncorrelated), because then the weighted average of $C_X$ vanishes like $1/T$. The counterexample $X(t)=A$ has $C_X(τ)=Var(A)$ constant, giving $Var(m_T)=Var(A)$ for every $T$: no decay of correlation, no ergodicity.", "rubric": ["Shows the estimator is unbiased, $E[m_T]=μ$, using the m.s. integral and interchange of $E$ with $∫$.", "Writes $Var(m_T)=(1/4T²)∫∫C_X(t-s)dt ds$ over $[-T,T]²$.", "Performs the change of variable $τ=t-s$ and obtains the triangular weight $2T-|τ|$, giving $(1/2T)∫_{-2T}^{2T}(1-|τ|/(2T))C_X(τ)dτ$.", "States that mean-ergodicity in m.s. holds iff this variance tends to $0$ as $T → ∞$.", "Gives a usable sufficient condition such as $∫|C_X(τ)|dτ<∞$ or $C_X(τ) → 0$, and/or a counterexample like $X(t)=A$ with non-decaying $C_X$."]}, "he": {"q": "‏$X(t)$ הוא תהליך WSS עם תוחלת $μ$ ואוטוקווריאנס $C_X(τ)$. עבור $m_T=(1/2T)∫_{-T}^{T}X(t)dt$, גזור את $Var(m_T)$ כאינטגרל יחיד ב-$τ$ ונסח את התנאי לארגודיות בתוחלת.", "hint": "כתוב את השונות כאינטגרל כפול של $C_X(t-s)$ על הריבוע $[-T,T]²$ ובצע החלפת משתנה $τ=t-s$.", "modelAnswer": "האינטגרל בממוצע ריבועי קיים משום ש-$R_X$ רציפה, ומתקיים $E[m_T]=(1/2T)∫_{-T}^{T}E[X(t)]dt=μ$, כלומר האומד חסר הטיה. עבור השונות מחליפים סדר תוחלת ואינטגרציה (מהלך חוקי במובן הריבועי): ‏$Var(m_T)=E[((1/2T)∫_{-T}^{T}(X(t)-μ)dt)²]=(1/4T²)∫_{-T}^{T}∫_{-T}^{T}C_X(t-s) dt ds$. בהצבה $τ=t-s$: עבור $τ$ קבוע בתחום $[-2T,2T]$, אורך קבוצת הזוגות $(t,s)$ בריבוע המקיימים $t-s=τ$ הוא $2T-|τ|$, ולכן האינטגרל הכפול מצטמצם ל-$∫_{-2T}^{2T}(2T-|τ|)C_X(τ)dτ$. מכאן $Var(m_T)=(1/4T²)∫_{-2T}^{2T}(2T-|τ|)C_X(τ)dτ=(1/2T)∫_{-2T}^{2T}(1-|τ|/(2T))C_X(τ)dτ$, כלומר שקלול משולשי (ברטלט) של האוטוקווריאנס. התנאי: התהליך ארגודי בתוחלת במובן הריבועי בדיוק כאשר $Var(m_T) → 0$ עבור $T → ∞$, שכן $E[|m_T-μ|²]=Var(m_T)$. תנאים מספיקים שימושיים: ‏$∫_{-∞}^{∞}|C_X(τ)|dτ<∞$, או פשוט $C_X(τ) → 0$ כאשר $|τ| → ∞$ (דגימות רחוקות נעשות בלתי מתואמות), ואז הממוצע המשוקלל של $C_X$ דועך כמו $1/T$. הדוגמה הנגדית $X(t)=A$ נותנת $C_X(τ)=Var(A)$ קבועה, ומכאן $Var(m_T)=Var(A)$ לכל $T$: אין דעיכת מתאם ואין ארגודיות.", "rubric": ["מראה שהאומד חסר הטיה, $E[m_T]=μ$, תוך שימוש באינטגרל בממוצע ריבועי ובהחלפת סדר בין $E$ ל-$∫$.", "כותב $Var(m_T)=(1/4T²)∫∫C_X(t-s)dt ds$ על הריבוע $[-T,T]²$.", "מבצע החלפת משתנה $τ=t-s$ ומקבל את המשקל המשולשי $2T-|τ|$, ומכאן $(1/2T)∫_{-2T}^{2T}(1-|τ|/(2T))C_X(τ)dτ$.", "מציין שארגודיות בתוחלת במובן הריבועי מתקיימת אם ורק אם שונות זו שואפת לאפס כאשר $T → ∞$.", "נותן תנאי מספיק שימושי כגון $∫|C_X(τ)|dτ<∞$ או $C_X(τ) → 0$, ו/או דוגמה נגדית כמו $X(t)=A$ עם $C_X$ שאינה דועכת."]}}, {"id": "prc-001", "area": "processes", "topic": "ensemble-vs-sample-function", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["random-process", "ensemble", "sample-function"], "answer": 0, "en": {"q": "A random process is written $X(t,ζ)$, where $ζ$ is the outcome of a random experiment. Which statement is correct?", "options": ["Fixing $t=t_0$ gives a random variable; fixing $ζ=ζ_0$ gives a sample function.", "Fixing $t=t_0$ gives a deterministic number; fixing $ζ=ζ_0$ gives a random variable.", "Fixing either $t$ or $ζ$ still leaves a random variable in the other argument.", "The ensemble is the set of time instants $t$ at which $X$ is observed."], "hint": "Ask which of the two arguments you are freezing, and what randomness is left afterwards.", "explanation": "$X(t,ζ)$ is a function of two arguments. Freezing $t=t_0$ leaves a function of $ζ$ alone, i.e. an ordinary random variable $X(t_0)$. Freezing $ζ=ζ_0$ leaves an ordinary function of time — one sample function (realisation). The collection of all sample functions over all $ζ$ is the ensemble.", "whyWrong": ["Fixing $t$ does not remove the randomness: $X(t_0)$ still changes from experiment to experiment, so it is a random variable.", "Once $ζ=ζ_0$ is fixed the experiment has been performed, so $X(t,ζ_0)$ is a deterministic waveform with no randomness left.", "The ensemble is the collection of all sample functions, one per outcome $ζ$, not a set of time instants."]}, "he": {"q": "תהליך אקראי נרשם כ-$X(t,ζ)$, כאשר $ζ$ הוא תוצאת הניסוי האקראי. איזו טענה נכונה?", "options": ["קיבוע $t=t_0$ נותן משתנה אקראי; קיבוע $ζ=ζ_0$ נותן פונקציית מדגם.", "קיבוע $t=t_0$ נותן מספר דטרמיניסטי; קיבוע $ζ=ζ_0$ נותן משתנה אקראי.", "קיבוע של $t$ או של $ζ$ עדיין משאיר משתנה אקראי בארגומנט השני.", "האנסמבל הוא קבוצת רגעי הזמן $t$ שבהם נמדד $X$."], "hint": "שאל איזה מבין שני הארגומנטים אתה מקבע, ואיזו אקראיות נותרת אחר כך.", "explanation": "$X(t,ζ)$ היא פונקציה של שני ארגומנטים. קיבוע $t=t_0$ משאיר פונקציה של $ζ$ בלבד, כלומר משתנה אקראי רגיל $X(t_0)$. קיבוע $ζ=ζ_0$ משאיר פונקציית זמן רגילה — פונקציית מדגם (מימוש) אחת. אוסף כל פונקציות המדגם עבור כל $ζ$ הוא האנסמבל.", "whyWrong": ["קיבוע $t$ אינו מסלק את האקראיות: $X(t_0)$ עדיין משתנה מניסוי לניסוי, ולכן הוא משתנה אקראי.", "לאחר קיבוע $ζ=ζ_0$ הניסוי כבר בוצע, ולכן $X(t,ζ_0)$ היא צורת גל דטרמיניסטית ללא אקראיות.", "האנסמבל הוא אוסף כל פונקציות המדגם, אחת לכל תוצאה $ζ$, ולא קבוצת רגעי זמן."]}}, {"id": "prc-002", "area": "processes", "topic": "mean-function", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["mean-function", "linearity-of-expectation"], "answer": 2, "en": {"q": "$X(t) = At^2 + Bt + 1$, where $A$ and $B$ are random variables with $E[A]=2$ and $E[B]=-3$. Compute the value of the mean function at $t=2$, i.e. $μ_X(2)$.", "options": ["$-1$", "$2$", "$3$", "$15$"], "hint": "Expectation is linear and acts only on $A$ and $B$; $t$ is a deterministic parameter.", "explanation": "$μ_X(t) = E[A]t^2 + E[B]t + 1 = 2t^2 - 3t + 1$. At $t=2$: $2(4) - 3(2) + 1 = 8 - 6 + 1 = 3$. Note that $μ_X(t)$ depends on $t$, so this process is not WSS.", "whyWrong": ["$-1$ comes from evaluating $2t - 3t + 1$, i.e. treating the $t^2$ term as linear in $t$.", "$2$ drops the deterministic constant $1$, which survives the expectation unchanged.", "$15$ uses $E[B] = +3$ instead of $-3$, a sign error in the linear term."]}, "he": {"q": "$X(t) = At^2 + Bt + 1$, כאשר $A$ ו-$B$ הם משתנים אקראיים עם $E[A]=2$ ו-$E[B]=-3$. חשב את ערך פונקציית התוחלת ב-$t=2$, כלומר $μ_X(2)$.", "options": ["$-1$", "$2$", "$3$", "$15$"], "hint": "התוחלת לינארית ופועלת רק על $A$ ועל $B$; $t$ הוא פרמטר דטרמיניסטי.", "explanation": "$μ_X(t) = E[A]t^2 + E[B]t + 1 = 2t^2 - 3t + 1$. עבור $t=2$: ‏$2(4) - 3(2) + 1 = 8 - 6 + 1 = 3$. שים לב ש-$μ_X(t)$ תלויה ב-$t$, ולכן התהליך אינו WSS.", "whyWrong": ["$-1$ מתקבל מהצבה ב-$2t - 3t + 1$, כלומר מהתייחסות לאיבר $t^2$ כאילו היה לינארי ב-$t$.", "$2$ משמיט את הקבוע הדטרמיניסטי $1$, שנשאר ללא שינוי תחת התוחלת.", "$15$ משתמש ב-$E[B] = +3$ במקום $-3$, כלומר שגיאת סימן באיבר הלינארי."]}}, {"id": "prc-003", "area": "processes", "topic": "first-and-second-order-distributions", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["first-order-distribution", "second-order-distribution"], "answer": 1, "en": {"q": "The first-order distribution $F_X(x;t) = P(X(t) ≤ x)$ of a process is known for every $t$. Which quantity can be computed from this information alone?", "options": ["The autocorrelation $R_X(t_1,t_2)$ for every pair $t_1,t_2$.", "The mean function $μ_X(t)$ and the second moment $E[X^2(t)]$.", "The joint probability $P(X(t_1)>0 , X(t_2)>0)$ for $t_1 ≠ t_2$.", "Whether the process has independent increments."], "hint": "Which of these needs the joint behaviour of the process at two different times?", "explanation": "The first-order distribution describes $X$ at one time instant. Any expectation of the form $E[g(X(t))]$ — in particular $μ_X(t)$ and $E[X^2(t)]$ — follows from it. Anything involving two or more time instants (autocorrelation, joint probabilities, increments) requires at least the second-order distribution $F_X(x_1,x_2;t_1,t_2)$.", "whyWrong": ["$R_X(t_1,t_2) = E[X(t_1)X(t_2)]$ is an expectation over a pair of times, so it needs the second-order distribution.", "A joint probability at two distinct instants cannot be recovered from the two marginals; the dependence structure is missing.", "Independent increments is a statement about joint distributions of differences, i.e. an even higher-order property."]}, "he": {"q": "ההתפלגות מסדר ראשון $F_X(x;t) = P(X(t) ≤ x)$ של תהליך ידועה לכל $t$. איזה גודל ניתן לחשב מנתון זה בלבד?", "options": ["האוטוקורלציה $R_X(t_1,t_2)$ לכל זוג $t_1,t_2$.", "פונקציית התוחלת $μ_X(t)$ והמומנט השני $E[X^2(t)]$.", "ההסתברות המשותפת $P(X(t_1)>0 , X(t_2)>0)$ עבור $t_1 ≠ t_2$.", "האם לתהליך יש תוספות בלתי תלויות."], "hint": "איזה מהגדלים דורש את ההתנהגות המשותפת של התהליך בשני זמנים שונים?", "explanation": "ההתפלגות מסדר ראשון מתארת את $X$ ברגע זמן יחיד. כל תוחלת מהצורה $E[g(X(t))]$ — ובפרט $μ_X(t)$ ו-$E[X^2(t)]$ — נובעת ממנה. כל גודל המערב שני רגעי זמן או יותר (אוטוקורלציה, הסתברויות משותפות, תוספות) דורש לפחות את ההתפלגות מסדר שני $F_X(x_1,x_2;t_1,t_2)$.", "whyWrong": ["$R_X(t_1,t_2) = E[X(t_1)X(t_2)]$ היא תוחלת על זוג זמנים, ולכן דורשת את ההתפלגות מסדר שני.", "הסתברות משותפת בשני רגעים שונים אינה ניתנת לשחזור מהשוליות בלבד; מבנה התלות חסר.", "תוספות בלתי תלויות היא טענה על ההתפלגויות המשותפות של הפרשים, כלומר תכונה מסדר גבוה עוד יותר."]}}, {"id": "prc-004", "area": "processes", "topic": "sss-vs-wss", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["strict-sense-stationary", "wss", "implication"], "en": {"q": "Define strict-sense stationarity (SSS) and wide-sense stationarity (WSS). Show that an SSS process with finite second moments is WSS, and describe a process that is WSS but not SSS.", "hint": "SSS is a statement about all joint distributions; WSS only about the first two moments.", "modelAnswer": "SSS: for every $n$, every set of times $t_1,...,t_n$ and every shift $c$, the joint distribution of $(X(t_1),...,X(t_n))$ is identical to that of $(X(t_1+c),...,X(t_n+c))$. The statistics are invariant under time shift to all orders. WSS: $E[X^2(t)] < ∞$, $E[X(t)] = μ_X$ is a constant, and $E[X(t)X(t+τ)] = R_X(τ)$ depends on the lag only. SSS implies WSS when second moments are finite: taking $n=1$, $F_X(x;t) = F_X(x;t+c)$ for all $c$, so the first-order distribution does not depend on $t$ and therefore $μ_X(t)$ is constant; taking $n=2$ with $c=-t_1$, the joint distribution of $(X(t_1),X(t_2))$ equals that of $(X(0),X(t_2-t_1))$, so $R_X(t_1,t_2)$ depends only on $τ = t_2-t_1$. Finiteness of $E[X^2]$ is needed because SSS says nothing about whether the moments exist — a stationary Cauchy process is SSS with no mean or correlation, hence not WSS. The converse fails because WSS constrains only the first two moments. Counterexample: let $X(t)$ be independent across disjoint unit intervals, equal to a $±1$ symmetric Bernoulli variable on $[2n,2n+1)$ and to a uniform variable on $[-√3,√3]$ on $[2n+1,2n+2)$. Both have mean $0$ and variance $1$, and independence gives $R_X(t_1,t_2)=0$ for $t_1,t_2$ in different intervals, so the process is WSS; but the first-order distribution at $t=0.5$ is discrete while at $t=1.5$ it is continuous, so it is not SSS.", "rubric": ["States SSS as shift invariance of the joint distribution of every finite collection of samples, for every order $n$.", "States WSS as constant mean, autocorrelation depending only on $τ$, and finite second moment.", "Derives constant mean from the $n=1$ case and $R_X$ depending only on $τ$ from the $n=2$ case.", "Notes that finite second moments are an extra assumption (e.g. a stationary Cauchy process is SSS but not WSS).", "Gives a WSS-but-not-SSS example in which the first two moments are time-invariant but a higher-order distribution is not."]}, "he": {"q": "הגדר סטציונריות במובן הצר (SSS) וסטציונריות במובן הרחב (WSS). הראה שתהליך SSS בעל מומנטים שניים סופיים הוא WSS, ותאר תהליך שהוא WSS אך אינו SSS.", "hint": "SSS היא טענה על כל ההתפלגויות המשותפות; WSS עוסקת רק בשני המומנטים הראשונים.", "modelAnswer": "SSS: לכל $n$, לכל קבוצת זמנים $t_1,...,t_n$ ולכל הזזה $c$, ההתפלגות המשותפת של $(X(t_1),...,X(t_n))$ זהה לזו של $(X(t_1+c),...,X(t_n+c))$. הסטטיסטיקה אינווריאנטית להזזה בזמן בכל הסדרים. WSS: ‏$E[X^2(t)] < ∞$, ‏$E[X(t)] = μ_X$ קבועה, ו-$E[X(t)X(t+τ)] = R_X(τ)$ תלויה בהשהיה בלבד. SSS גורר WSS כאשר המומנטים השניים סופיים: עבור $n=1$ מתקיים $F_X(x;t) = F_X(x;t+c)$ לכל $c$, ולכן ההתפלגות מסדר ראשון אינה תלויה ב-$t$ ומכאן ש-$μ_X(t)$ קבועה; עבור $n=2$ עם $c=-t_1$, ההתפלגות המשותפת של $(X(t_1),X(t_2))$ שווה לזו של $(X(0),X(t_2-t_1))$, ולכן $R_X(t_1,t_2)$ תלויה רק ב-$τ = t_2-t_1$. סופיות $E[X^2]$ נדרשת משום ש-SSS אינה מבטיחה קיום מומנטים — תהליך קושי סטציונרי הוא SSS ללא תוחלת וללא קורלציה, ולכן אינו WSS. הכיוון ההפוך אינו נכון משום ש-WSS מגבילה רק את שני המומנטים הראשונים. דוגמה נגדית: יהי $X(t)$ בלתי תלוי בין קטעי יחידה זרים, השווה למשתנה ברנולי סימטרי $±1$ על $[2n,2n+1)$ ולמשתנה אחיד על $[-√3,√3]$ על $[2n+1,2n+2)$. לשניהם תוחלת $0$ ושונות $1$, והאי-תלות נותנת $R_X(t_1,t_2)=0$ עבור זמנים בקטעים שונים, ולכן התהליך WSS; אך ההתפלגות מסדר ראשון ב-$t=0.5$ בדידה ואילו ב-$t=1.5$ היא רציפה, ולכן הוא אינו SSS.", "rubric": ["מנסח SSS כאינווריאנטיות להזזה של ההתפלגות המשותפת של כל אוסף סופי של דגימות, לכל סדר $n$.", "מנסח WSS כתוחלת קבועה, אוטוקורלציה התלויה ב-$τ$ בלבד, ומומנט שני סופי.", "מסיק תוחלת קבועה מהמקרה $n=1$ ותלות ב-$τ$ בלבד של $R_X$ מהמקרה $n=2$.", "מציין שסופיות המומנטים השניים היא הנחה נוספת (למשל תהליך קושי סטציונרי הוא SSS אך לא WSS).", "נותן דוגמה לתהליך WSS שאינו SSS, שבו שני המומנטים הראשונים קבועים בזמן אך התפלגות מסדר גבוה יותר אינה."]}}, {"id": "prc-005", "area": "processes", "topic": "gaussian-wss-implies-sss", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["gaussian-process", "wss", "sss"], "answer": 3, "en": {"q": "$X(t)$ is WSS. Which single additional assumption guarantees that $X(t)$ is also strict-sense stationary?", "options": ["$X(t)$ is ergodic in the mean and in autocorrelation.", "$X(t)$ has zero mean and finite variance for all $t$.", "$R_X(τ)$ is absolutely integrable, $∫|R_X(τ)|dτ < ∞$.", "$X(t)$ is a Gaussian process."], "hint": "Which family of processes is completely specified by its mean vector and covariance matrix?", "explanation": "Every finite-dimensional distribution of a Gaussian process is determined by the mean vector and the covariance matrix of the samples. WSS makes the mean constant and every covariance $C_X(t_i,t_j)$ a function of $t_i-t_j$ only, and time differences are unchanged by a shift. Hence all joint distributions are shift invariant, which is exactly SSS. For non-Gaussian processes the higher moments are free and may vary with $t$.", "whyWrong": ["Ergodicity is about time averages converging to ensemble averages; it says nothing about higher-order distributions being shift invariant.", "Zero mean and finite variance are constraints on the first two moments only, exactly what WSS already controls.", "Absolute integrability of $R_X$ only guarantees that the PSD is an ordinary function; it constrains no distribution beyond order two."]}, "he": {"q": "$X(t)$ הוא WSS. איזו הנחה נוספת יחידה מבטיחה ש-$X(t)$ הוא גם סטציונרי במובן הצר (SSS)?", "options": ["$X(t)$ ארגודי בתוחלת ובאוטוקורלציה.", "ל-$X(t)$ תוחלת אפס ושונות סופית לכל $t$.", "$R_X(τ)$ אינטגרבילית בהחלט, $∫|R_X(τ)|dτ < ∞$.", "$X(t)$ הוא תהליך גאוסי."], "hint": "איזו משפחת תהליכים מאופיינת לחלוטין על ידי וקטור התוחלות ומטריצת השונויות המשותפות?", "explanation": "כל התפלגות מממד סופי של תהליך גאוסי נקבעת על ידי וקטור התוחלות ומטריצת הקווריאנס של הדגימות. WSS הופכת את התוחלת לקבועה ואת כל $C_X(t_i,t_j)$ לפונקציה של $t_i-t_j$ בלבד, והפרשי זמנים אינם משתנים תחת הזזה. לכן כל ההתפלגויות המשותפות אינווריאנטיות להזזה, וזו בדיוק SSS. בתהליכים לא-גאוסיים המומנטים הגבוהים חופשיים ועשויים להשתנות עם $t$.", "whyWrong": ["ארגודיות עוסקת בהתכנסות ממוצעי זמן לממוצעי אנסמבל; היא אינה אומרת דבר על אינווריאנטיות להזזה של התפלגויות מסדר גבוה.", "תוחלת אפס ושונות סופית הן אילוצים על שני המומנטים הראשונים בלבד — בדיוק מה ש-WSS כבר קובעת.", "אינטגרביליות מוחלטת של $R_X$ מבטיחה רק שה-PSD היא פונקציה רגילה, ואינה מגבילה התפלגות כלשהי מעבר לסדר שני."]}}, {"id": "prc-006", "area": "processes", "topic": "jointly-wss", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["jointly-wss", "cross-correlation", "definition"], "answer": 0, "en": {"q": "Two real processes $X(t)$ and $Y(t)$ are said to be jointly WSS. Which set of conditions is exactly what this requires?", "options": ["Each of $X$ and $Y$ is WSS, and $E[X(t)Y(t+τ)]$ depends on $τ$ only.", "$E[X(t)Y(t+τ)]$ depends on $τ$ only, with no separate condition on $X$ and $Y$.", "Each of $X$ and $Y$ is WSS, and $X$ and $Y$ are statistically independent.", "Each of $X$ and $Y$ is WSS, and $R_{XY}(τ) = R_{YX}(τ)$ for every $τ$."], "hint": "Joint WSS asks for the marginal condition on each process plus one condition linking them.", "explanation": "Joint wide-sense stationarity requires three things: $X$ is WSS, $Y$ is WSS, and the cross-correlation $R_{XY}(t,t+τ) = E[X(t)Y(t+τ)]$ is a function of $τ$ alone. Without the individual WSS conditions the pair can have time-varying means while the cross-correlation is still shift invariant.", "whyWrong": ["Shift invariance of the cross-correlation alone is not enough; each process must also be WSS on its own.", "Independence is far stronger than needed and is not part of the definition; jointly WSS processes are usually correlated.", "$R_{XY}(τ) = R_{YX}(τ)$ is not required and is generally false; the correct identity is $R_{XY}(τ) = R_{YX}(-τ)$."]}, "he": {"q": "שני תהליכים ממשיים $X(t)$ ו-$Y(t)$ נקראים סטציונריים במובן הרחב במשותף (jointly WSS). איזו קבוצת תנאים היא בדיוק הדרישה?", "options": ["כל אחד מ-$X$ ו-$Y$ הוא WSS, ו-$E[X(t)Y(t+τ)]$ תלויה ב-$τ$ בלבד.", "$E[X(t)Y(t+τ)]$ תלויה ב-$τ$ בלבד, ללא תנאי נפרד על $X$ ועל $Y$.", "כל אחד מ-$X$ ו-$Y$ הוא WSS, ו-$X$ ו-$Y$ בלתי תלויים סטטיסטית.", "כל אחד מ-$X$ ו-$Y$ הוא WSS, ומתקיים $R_{XY}(τ) = R_{YX}(τ)$ לכל $τ$."], "hint": "סטציונריות משותפת דורשת את התנאי השולי על כל תהליך בנפרד ועוד תנאי אחד המקשר ביניהם.", "explanation": "סטציונריות במובן הרחב במשותף דורשת שלושה דברים: $X$ הוא WSS, ‏$Y$ הוא WSS, ופונקציית הקורלציה ההדדית $R_{XY}(t,t+τ) = E[X(t)Y(t+τ)]$ תלויה ב-$τ$ בלבד. ללא תנאי ה-WSS הפרטניים ייתכן שלזוג יהיו תוחלות משתנות בזמן בעוד הקורלציה ההדדית אינווריאנטית להזזה.", "whyWrong": ["אינווריאנטיות של הקורלציה ההדדית בלבד אינה מספיקה; כל תהליך חייב להיות WSS בפני עצמו.", "אי-תלות היא דרישה חזקה בהרבה ואינה חלק מההגדרה; תהליכים סטציונריים במשותף בדרך כלל מתואמים.", "$R_{XY}(τ) = R_{YX}(τ)$ אינה נדרשת ובדרך כלל שגויה; הזהות הנכונה היא $R_{XY}(τ) = R_{YX}(-τ)$."]}}, {"id": "prc-007", "area": "processes", "topic": "cyclostationarity", "difficulty": 4, "type": "mcq", "hardnessSource": "computation", "tags": ["cyclostationary", "period", "autocorrelation"], "answer": 1, "en": {"q": "$X(t) = A cos(2πf_0t)$, where $f_0>0$ is a fixed frequency and $A$ is a random variable with $E[A]=0$ and $Var(A)=σ²$. The process is cyclostationary. What is the smallest period $T$ in $t$ of its autocorrelation $R_X(t,t+τ)$?", "options": ["$T = 1/(4f_0)$", "$T = 1/(2f_0)$", "$T = 1/f_0$", "$T = 2/f_0$"], "hint": "Expand the product of two cosines and look at which term still contains $t$.", "explanation": "$R_X(t,t+τ) = σ² cos(2πf_0t)cos(2πf_0(t+τ)) = (σ²/2)[cos(2πf_0τ) + cos(2πf_0(2t+τ))]$. The first term is independent of $t$; the second oscillates in $t$ at frequency $2f_0$, so its period is $1/(2f_0)$. The mean $μ_X(t)=0$ is constant, so the smallest common period of mean and autocorrelation is $T = 1/(2f_0)$.", "whyWrong": ["$1/(4f_0)$ would require a term at frequency $4f_0$ in $t$; the product of two cosines only produces $2f_0$.", "$1/f_0$ is the period of the sinusoid itself; the product of two sinusoids doubles the frequency, halving the period.", "$2/f_0$ is a period of $R_X(t,t+τ)$ but not the smallest one, and the question asks for the smallest."]}, "he": {"q": "$X(t) = A cos(2πf_0t)$, כאשר $f_0>0$ תדר קבוע ו-$A$ משתנה אקראי עם $E[A]=0$ ו-$Var(A)=σ²$. התהליך ציקלוסטציונרי. מהו המחזור הקטן ביותר $T$ ב-$t$ של האוטוקורלציה $R_X(t,t+τ)$?", "options": ["$T = 1/(4f_0)$", "$T = 1/(2f_0)$", "$T = 1/f_0$", "$T = 2/f_0$"], "hint": "פתח את מכפלת שני הקוסינוסים ובדוק איזה איבר עדיין מכיל את $t$.", "explanation": "$R_X(t,t+τ) = σ² cos(2πf_0t)cos(2πf_0(t+τ)) = (σ²/2)[cos(2πf_0τ) + cos(2πf_0(2t+τ))]$. האיבר הראשון אינו תלוי ב-$t$; השני מתנודד ב-$t$ בתדר $2f_0$, ולכן מחזורו $1/(2f_0)$. התוחלת $μ_X(t)=0$ קבועה, ולכן המחזור המשותף הקטן ביותר של התוחלת והאוטוקורלציה הוא $T = 1/(2f_0)$.", "whyWrong": ["$1/(4f_0)$ היה מחייב איבר בתדר $4f_0$ ב-$t$; מכפלת שני קוסינוסים מייצרת רק $2f_0$.", "$1/f_0$ הוא מחזור הסינוס עצמו; מכפלת שני סינוסים מכפילה את התדר ולכן מקצרת את המחזור פי שניים.", "$2/f_0$ אכן מחזור של $R_X(t,t+τ)$ אך אינו הקטן ביותר, והשאלה מבקשת את הקטן ביותר."]}}, {"id": "prc-008", "area": "processes", "topic": "wss-test-random-phase", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["random-phase", "wss-test", "mean-function"], "answer": 2, "en": {"q": "$X(t) = A cos(ω_0t + Θ)$, where $A>0$ and $ω_0$ are deterministic constants and $Θ$ is uniform on $[0,π/2]$. Which statement is correct?", "options": ["It is WSS, with $μ_X = 0$ and $R_X(τ) = (A²/2)cos(ω_0τ)$.", "It is WSS, because a uniformly distributed phase always makes such a process WSS.", "It is not WSS: $μ_X(t) = (2A/π)[cos(ω_0t) - sin(ω_0t)]$ is not constant.", "It is not WSS: the mean is constant but $E[X^2(t)]$ depends on $t$."], "hint": "Compute $E[cos(ω_0t + Θ)]$ by integrating over the actual support of $Θ$, not over a full period.", "explanation": "$μ_X(t) = A(2/π)∫_0^{π/2} cos(ω_0t+θ)dθ = (2A/π)[sin(ω_0t+π/2) - sin(ω_0t)] = (2A/π)[cos(ω_0t) - sin(ω_0t)]$, which oscillates in $t$. The zero-mean, lag-only result holds only when $Θ$ covers a whole period, e.g. $Θ$ uniform on $[0,2π]$, so that $E[e^{jΘ}] = 0$. Here $E[X^2(t)]$ also varies with $t$, but the mean alone already rules out WSS.", "whyWrong": ["$μ_X=0$ and $R_X(τ)=(A²/2)cos(ω_0τ)$ are the results for $Θ$ uniform on a full period $[0,2π]$, not on $[0,π/2]$.", "Uniformity is not what matters; the phase must be uniform over a full period so that $E[cos(ω_0t+Θ)]$ vanishes for every $t$.", "The premise is wrong in its first half: the mean is not constant here, so this cannot be the reason WSS fails."]}, "he": {"q": "$X(t) = A cos(ω_0t + Θ)$, כאשר $A>0$ ו-$ω_0$ קבועים דטרמיניסטיים ו-$Θ$ מתפלג אחיד על $[0,π/2]$. איזו טענה נכונה?", "options": ["התהליך WSS, עם $μ_X = 0$ ו-$R_X(τ) = (A²/2)cos(ω_0τ)$.", "התהליך WSS, משום שפאזה בעלת התפלגות אחידה תמיד הופכת תהליך כזה ל-WSS.", "התהליך אינו WSS: ‏$μ_X(t) = (2A/π)[cos(ω_0t) - sin(ω_0t)]$ אינה קבועה.", "התהליך אינו WSS: התוחלת קבועה אך $E[X^2(t)]$ תלויה ב-$t$."], "hint": "חשב את $E[cos(ω_0t + Θ)]$ באינטגרציה על התומך האמיתי של $Θ$, ולא על מחזור שלם.", "explanation": "$μ_X(t) = A(2/π)∫_0^{π/2} cos(ω_0t+θ)dθ = (2A/π)[sin(ω_0t+π/2) - sin(ω_0t)] = (2A/π)[cos(ω_0t) - sin(ω_0t)]$, שמתנודדת ב-$t$. התוצאה של תוחלת אפס ותלות בהשהיה בלבד מתקיימת רק כאשר $Θ$ מכסה מחזור שלם, למשל אחיד על $[0,2π]$, כך ש-$E[e^{jΘ}] = 0$. כאן גם $E[X^2(t)]$ תלויה ב-$t$, אך התוחלת לבדה כבר שוללת WSS.", "whyWrong": ["$μ_X=0$ ו-$R_X(τ)=(A²/2)cos(ω_0τ)$ הן התוצאות עבור $Θ$ אחיד על מחזור שלם $[0,2π]$, לא על $[0,π/2]$.", "האחידות אינה העיקר; הפאזה חייבת להיות אחידה על מחזור שלם כדי ש-$E[cos(ω_0t+Θ)]$ יתאפס לכל $t$.", "החלק הראשון של הטענה שגוי: התוחלת כאן אינה קבועה, ולכן זו אינה הסיבה לכישלון ה-WSS."]}}, {"id": "prc-009", "area": "processes", "topic": "wss-test-random-slope", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["autocorrelation", "non-stationary", "second-moment"], "answer": 3, "en": {"q": "$X(t) = At$ for $t ≥ 0$, where $A$ is a random variable with $E[A]=1$ and $Var(A)=4$. Compute $R_X(2,5) = E[X(2)X(5)]$.", "options": ["$10$", "$25$", "$40$", "$50$"], "hint": "$R_X$ uses the second moment of $A$, not its variance.", "explanation": "$R_X(t_1,t_2) = E[A^2]t_1t_2$ and $E[A^2] = Var(A) + E[A]^2 = 4 + 1 = 5$. Hence $R_X(2,5) = 5·2·5 = 50$. Since $R_X$ depends on $t_1$ and $t_2$ separately (and $μ_X(t)=t$ is not constant), this process is not WSS.", "whyWrong": ["$10$ uses $E[A]^2 = 1$ instead of $E[A^2] = 5$, i.e. it ignores the randomness of the slope entirely.", "$25$ multiplies $E[A^2]$ by only one of the two time arguments instead of by their product.", "$40$ uses $Var(A) = 4$, which gives the autocovariance $C_X(2,5)$, not the autocorrelation."]}, "he": {"q": "$X(t) = At$ עבור $t ≥ 0$, כאשר $A$ משתנה אקראי עם $E[A]=1$ ו-$Var(A)=4$. חשב את $R_X(2,5) = E[X(2)X(5)]$.", "options": ["$10$", "$25$", "$40$", "$50$"], "hint": "$R_X$ משתמשת במומנט השני של $A$, לא בשונות שלו.", "explanation": "$R_X(t_1,t_2) = E[A^2]t_1t_2$ ומתקיים $E[A^2] = Var(A) + E[A]^2 = 4 + 1 = 5$. לכן $R_X(2,5) = 5·2·5 = 50$. מכיוון ש-$R_X$ תלויה ב-$t_1$ וב-$t_2$ בנפרד (וגם $μ_X(t)=t$ אינה קבועה), התהליך אינו WSS.", "whyWrong": ["$10$ משתמש ב-$E[A]^2 = 1$ במקום ב-$E[A^2] = 5$, כלומר מתעלם לחלוטין מאקראיות השיפוע.", "$25$ מכפיל את $E[A^2]$ רק באחד משני הזמנים במקום במכפלתם.", "$40$ משתמש ב-$Var(A) = 4$, וזה נותן את האוטוקווריאנס $C_X(2,5)$ ולא את האוטוקורלציה."]}}, {"id": "prc-010", "area": "processes", "topic": "independent-uncorrelated-orthogonal", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["orthogonal", "uncorrelated", "independent"], "answer": 0, "en": {"q": "$X(t)$ and $Y(t)$ are jointly WSS with means $μ_X$ and $μ_Y$. Which statement is correct?", "options": ["Orthogonal is $R_{XY}(τ)=0$, uncorrelated is $C_{XY}(τ)=0$; they agree iff $μ_Xμ_Y=0$.", "Uncorrelated implies independent, and independent processes are always orthogonal.", "Orthogonal implies uncorrelated, and uncorrelated implies independent for any pair.", "Independent implies orthogonal, and orthogonal implies independent when both means vanish."], "hint": "Write $C_{XY}(τ) = R_{XY}(τ) - μ_Xμ_Y$ and ask when the two definitions coincide.", "explanation": "By definition $C_{XY}(τ) = R_{XY}(τ) - μ_Xμ_Y$. Orthogonality is $R_{XY} ≡ 0$ and uncorrelatedness is $C_{XY} ≡ 0$, so the two conditions are equivalent exactly when $μ_Xμ_Y = 0$. Independence implies uncorrelatedness (so $R_{XY}(τ)=μ_Xμ_Y$), but never the reverse in general, and independence gives orthogonality only if one of the means is zero.", "whyWrong": ["Uncorrelated does not imply independent — that implication holds only in special cases such as jointly Gaussian processes.", "The second half fails for the same reason: zero covariance constrains second-order moments only, not the full joint law.", "Independent processes with $μ_Xμ_Y ≠ 0$ satisfy $R_{XY}=μ_Xμ_Y ≠ 0$, so they are not orthogonal; and orthogonality never implies independence."]}, "he": {"q": "$X(t)$ ו-$Y(t)$ סטציונריים במשותף במובן הרחב, עם תוחלות $μ_X$ ו-$μ_Y$. איזו טענה נכונה?", "options": ["אורתוגונליות היא $R_{XY}(τ)=0$, אי-מתואמות היא $C_{XY}(τ)=0$; הן מתלכדות אם ורק אם $μ_Xμ_Y=0$.", "אי-מתואמות גוררת אי-תלות, ותהליכים בלתי תלויים הם תמיד אורתוגונליים.", "אורתוגונליות גוררת אי-מתואמות, ואי-מתואמות גוררת אי-תלות עבור כל זוג תהליכים.", "אי-תלות גוררת אורתוגונליות, ואורתוגונליות גוררת אי-תלות כאשר שתי התוחלות מתאפסות."], "hint": "רשום $C_{XY}(τ) = R_{XY}(τ) - μ_Xμ_Y$ ושאל מתי שתי ההגדרות מתלכדות.", "explanation": "לפי ההגדרה $C_{XY}(τ) = R_{XY}(τ) - μ_Xμ_Y$. אורתוגונליות היא $R_{XY} ≡ 0$ ואי-מתואמות היא $C_{XY} ≡ 0$, ולכן שני התנאים שקולים בדיוק כאשר $μ_Xμ_Y = 0$. אי-תלות גוררת אי-מתואמות (ואז $R_{XY}(τ)=μ_Xμ_Y$), אך לא להפך באופן כללי, ואי-תלות גוררת אורתוגונליות רק אם אחת התוחלות מתאפסת.", "whyWrong": ["אי-מתואמות אינה גוררת אי-תלות — הגרירה הזו נכונה רק במקרים מיוחדים כמו תהליכים גאוסיים במשותף.", "המחצית השנייה נכשלת מאותה סיבה: קווריאנס אפס מגביל מומנטים מסדר שני בלבד ולא את ההתפלגות המשותפת.", "תהליכים בלתי תלויים עם $μ_Xμ_Y ≠ 0$ מקיימים $R_{XY}=μ_Xμ_Y ≠ 0$ ולכן אינם אורתוגונליים; ואורתוגונליות לעולם אינה גוררת אי-תלות."]}}, {"id": "prc-011", "area": "processes", "topic": "independent-increments", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["wiener-process", "independent-increments", "autocorrelation"], "answer": 1, "en": {"q": "$W(t)$, $t≥0$, is a Wiener process: $W(0)=0$, zero-mean independent increments, and $Var(W(t)) = 2t$. Compute $E[W(3)W(7)]$.", "options": ["$0$", "$6$", "$8$", "$14$"], "hint": "Split $W(7) = W(3) + [W(7)-W(3)]$ and use independence of the increment from $W(3)$.", "explanation": "$E[W(3)W(7)] = E[W(3)^2] + E[W(3)]E[W(7)-W(3)] = 2·3 + 0 = 6$. In general $E[W(t_1)W(t_2)] = α·min(t_1,t_2)$ with $α=2$ here, so the answer is $2·3 = 6$. The process is not WSS: the autocorrelation depends on $min(t_1,t_2)$, not on the lag.", "whyWrong": ["$0$ assumes $W(3)$ and $W(7)$ are independent; only the non-overlapping increments are independent, and the intervals here overlap.", "$8$ is $Var(W(7)-W(3)) = 2(7-3)$, the variance of the increment rather than the correlation of the two values.", "$14$ uses $max(t_1,t_2)$ instead of $min(t_1,t_2)$ in $α·min(t_1,t_2)$."]}, "he": {"q": "$W(t)$, ‏$t≥0$, הוא תהליך וינר: ‏$W(0)=0$, תוספות בלתי תלויות בעלות תוחלת אפס, ו-$Var(W(t)) = 2t$. חשב את $E[W(3)W(7)]$.", "options": ["$0$", "$6$", "$8$", "$14$"], "hint": "פרק $W(7) = W(3) + [W(7)-W(3)]$ והשתמש באי-תלות התוספת ב-$W(3)$.", "explanation": "$E[W(3)W(7)] = E[W(3)^2] + E[W(3)]E[W(7)-W(3)] = 2·3 + 0 = 6$. באופן כללי $E[W(t_1)W(t_2)] = α·min(t_1,t_2)$ עם $α=2$ כאן, ולכן התוצאה $2·3 = 6$. התהליך אינו WSS: האוטוקורלציה תלויה ב-$min(t_1,t_2)$ ולא בהשהיה.", "whyWrong": ["$0$ מניח ש-$W(3)$ ו-$W(7)$ בלתי תלויים; רק תוספות על קטעים זרים בלתי תלויות, וכאן הקטעים חופפים.", "$8$ הוא $Var(W(7)-W(3)) = 2(7-3)$, שונות התוספת ולא הקורלציה בין שני הערכים.", "$14$ משתמש ב-$max(t_1,t_2)$ במקום ב-$min(t_1,t_2)$ בנוסחה $α·min(t_1,t_2)$."]}}, {"id": "prc-012", "area": "processes", "topic": "sum-of-processes", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["sum-of-processes", "uncorrelated", "average-power"], "answer": 2, "en": {"q": "$X$ and $Y$ are jointly WSS and uncorrelated, with positive means, $R_X(τ) = 4 + 9e^{-|τ|}$ and $R_Y(τ) = 9 + 16e^{-2|τ|}$. For $Z(t) = X(t)+Y(t)$, compute $E[Z^2(t)]$.", "options": ["$25$", "$38$", "$50$", "$63$"], "hint": "Uncorrelated means $C_{XY}=0$, i.e. $R_{XY}(τ)=μ_Xμ_Y$ — not $R_{XY}=0$.", "explanation": "From $R_X(∞)=4$ and $R_Y(∞)=9$ with positive means, $μ_X=2$ and $μ_Y=3$; the variances are $σ_X^2 = 13-4 = 9$ and $σ_Y^2 = 25-9 = 16$. Uncorrelatedness gives $R_{XY}(τ)=μ_Xμ_Y=6$, so $R_Z(τ)=R_X(τ)+R_Y(τ)+12$ and $R_Z(0)=13+25+12=50$. Check: $μ_Z=5$, $σ_Z^2=9+16=25$, and $E[Z^2]=25+25=50$.", "whyWrong": ["$25$ adds only the variances, $9+16$, forgetting that $E[Z^2] = σ_Z^2 + μ_Z^2$.", "$38$ is $R_X(0)+R_Y(0)$, dropping the cross term $2μ_Xμ_Y=12$ by treating uncorrelated as orthogonal.", "$63$ adds $(μ_X+μ_Y)^2 = 25$ to $38$, double-counting the mean power already contained in $R_X$ and $R_Y$."]}, "he": {"q": "$X$ ו-$Y$ סטציונריים במשותף במובן הרחב ובלתי מתואמים, בעלי תוחלות חיוביות, עם $R_X(τ) = 4 + 9e^{-|τ|}$ ו-$R_Y(τ) = 9 + 16e^{-2|τ|}$. עבור $Z(t) = X(t)+Y(t)$, חשב את $E[Z^2(t)]$.", "options": ["$25$", "$38$", "$50$", "$63$"], "hint": "אי-מתואמות פירושה $C_{XY}=0$, כלומר $R_{XY}(τ)=μ_Xμ_Y$ — ולא $R_{XY}=0$.", "explanation": "מתוך $R_X(∞)=4$ ו-$R_Y(∞)=9$ ותוחלות חיוביות נקבל $μ_X=2$ ו-$μ_Y=3$; השונויות הן $σ_X^2 = 13-4 = 9$ ו-$σ_Y^2 = 25-9 = 16$. אי-מתואמות נותנת $R_{XY}(τ)=μ_Xμ_Y=6$, ולכן $R_Z(τ)=R_X(τ)+R_Y(τ)+12$ ו-$R_Z(0)=13+25+12=50$. בדיקה: ‏$μ_Z=5$, ‏$σ_Z^2=9+16=25$, ולכן $E[Z^2]=25+25=50$.", "whyWrong": ["$25$ מחבר רק את השונויות, $9+16$, ושוכח ש-$E[Z^2] = σ_Z^2 + μ_Z^2$.", "$38$ הוא $R_X(0)+R_Y(0)$, ומשמיט את האיבר ההדדי $2μ_Xμ_Y=12$ מתוך בלבול בין אי-מתואמות לאורתוגונליות.", "$63$ מוסיף $(μ_X+μ_Y)^2 = 25$ ל-$38$, וסופר פעמיים את הספק ה-DC שכבר כלול ב-$R_X$ וב-$R_Y$."]}}, {"id": "prc-013", "area": "processes", "topic": "product-of-processes", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["product-of-processes", "independence", "autocorrelation"], "answer": 3, "en": {"q": "$X(t)$ and $Y(t)$ are independent, each zero-mean and WSS, with $R_X(τ)=2e^{-|τ|}$ and $R_Y(τ)=3cos(πτ)$. Find the autocorrelation of $Z(t)=X(t)Y(t)$.", "options": ["$R_Z(τ) = 2e^{-|τ|} + 3cos(πτ)$", "$R_Z(τ) = 6e^{-|τ|}$", "$R_Z(τ) = ∫_{-∞}^{∞} R_X(u)R_Y(τ-u) du$", "$R_Z(τ) = 6e^{-|τ|}cos(πτ)$"], "hint": "Independence lets the expectation of the product factor into a product of expectations.", "explanation": "$R_Z(τ) = E[X(t)Y(t)X(t+τ)Y(t+τ)] = E[X(t)X(t+τ)]E[Y(t)Y(t+τ)] = R_X(τ)R_Y(τ) = 6e^{-|τ|}cos(πτ)$. Multiplication of independent processes multiplies autocorrelations in the time domain, which is why in the frequency domain the PSDs get convolved.", "whyWrong": ["Adding the autocorrelations is the rule for the sum of two uncorrelated zero-mean processes, not for their product.", "$6e^{-|τ|}$ keeps only $R_Y(0)=3$ as a constant factor, which is valid at $τ=0$ but not for general lag.", "The convolution of $R_X$ and $R_Y$ is the time-domain image of multiplying the PSDs; here the PSDs are convolved instead."]}, "he": {"q": "$X(t)$ ו-$Y(t)$ בלתי תלויים, כל אחד WSS בעל תוחלת אפס, עם $R_X(τ)=2e^{-|τ|}$ ו-$R_Y(τ)=3cos(πτ)$. מצא את האוטוקורלציה של $Z(t)=X(t)Y(t)$.", "options": ["$R_Z(τ) = 2e^{-|τ|} + 3cos(πτ)$", "$R_Z(τ) = 6e^{-|τ|}$", "$R_Z(τ) = ∫_{-∞}^{∞} R_X(u)R_Y(τ-u) du$", "$R_Z(τ) = 6e^{-|τ|}cos(πτ)$"], "hint": "אי-תלות מאפשרת לפרק את תוחלת המכפלה למכפלת תוחלות.", "explanation": "$R_Z(τ) = E[X(t)Y(t)X(t+τ)Y(t+τ)] = E[X(t)X(t+τ)]E[Y(t)Y(t+τ)] = R_X(τ)R_Y(τ) = 6e^{-|τ|}cos(πτ)$. מכפלת תהליכים בלתי תלויים מכפילה את פונקציות האוטוקורלציה במישור הזמן, ולכן במישור התדר ה-PSD-ים נכרכים בקונבולוציה.", "whyWrong": ["חיבור פונקציות האוטוקורלציה הוא הכלל עבור סכום שני תהליכים בלתי מתואמים בעלי תוחלת אפס, ולא עבור מכפלתם.", "$6e^{-|τ|}$ שומר רק את $R_Y(0)=3$ כמקדם קבוע, מה שנכון ב-$τ=0$ אך לא להשהיה כללית.", "הקונבולוציה של $R_X$ ו-$R_Y$ מתאימה למכפלת ה-PSD-ים; כאן דווקא ה-PSD-ים הם שנכרכים בקונבולוציה."]}}, {"id": "prc-014", "area": "processes", "topic": "modulation-and-wss", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["modulation", "random-phase", "cyclostationary"], "en": {"q": "$X(t)$ is zero-mean WSS with autocorrelation $R_X(τ)$, and $Θ$ is uniform on $[0,2π]$ and independent of $X$. Show that $Y(t) = X(t)cos(2πf_0t + Θ)$ is WSS and find $R_Y(τ)$. What changes if $Θ$ is a fixed constant?", "hint": "Use the product-to-sum identity, then take the expectation over $Θ$ separately from the expectation over $X$.", "modelAnswer": "Mean: $μ_Y(t) = E[X(t)]E[cos(2πf_0t+Θ)] = 0$, constant, since $X$ is zero-mean and independent of $Θ$. Autocorrelation: $E[Y(t)Y(t+τ)] = E[X(t)X(t+τ)]·E[cos(2πf_0t+Θ)cos(2πf_0(t+τ)+Θ)]$ by independence. Using $cos A cos B = (1/2)[cos(A-B) + cos(A+B)]$, the second factor is $(1/2)E[cos(2πf_0τ) + cos(2πf_0(2t+τ)+2Θ)]$. Because $Θ$ is uniform over a full period, $2Θ$ is uniform over two full periods and $E[cos(φ+2Θ)] = 0$ for every deterministic $φ$. Hence $R_Y(t,t+τ) = (1/2)R_X(τ)cos(2πf_0τ)$, which depends on $τ$ only, so $Y$ is WSS with $R_Y(τ) = (1/2)R_X(τ)cos(2πf_0τ)$. In particular $E[Y^2(t)] = R_X(0)/2$: modulation halves the average power. If instead $Θ$ is a fixed constant, the term $cos(2πf_0(2t+τ)+2Θ)$ no longer averages to zero and $R_Y(t,t+τ) = (1/2)R_X(τ)[cos(2πf_0τ) + cos(2πf_0(2t+τ)+2Θ)]$ depends on $t$. The mean is still constant (zero), but $Y$ is not WSS; it is cyclostationary, its autocorrelation being periodic in $t$ with period $1/(2f_0)$.", "rubric": ["Shows $μ_Y(t)=0$ using independence of $Θ$ and $X$.", "Factors $E[Y(t)Y(t+τ)]$ into the product of an $X$-expectation and a $Θ$-expectation and applies the product-to-sum identity.", "Argues that $E[cos(φ+2Θ)]=0$ because $Θ$ is uniform over a full period, killing the $t$-dependent term.", "Concludes $R_Y(τ) = (1/2)R_X(τ)cos(2πf_0τ)$, hence WSS (and notes the factor $1/2$ in the power).", "States that with deterministic $Θ$ the $t$-dependent term survives, so $Y$ is cyclostationary rather than WSS."]}, "he": {"q": "$X(t)$ הוא WSS בעל תוחלת אפס עם אוטוקורלציה $R_X(τ)$, ו-$Θ$ מתפלג אחיד על $[0,2π]$ ובלתי תלוי ב-$X$. הראה ש-$Y(t) = X(t)cos(2πf_0t + Θ)$ הוא WSS ומצא את $R_Y(τ)$. מה משתנה אם $Θ$ הוא קבוע דטרמיניסטי?", "hint": "השתמש בזהות המכפלה-לסכום, ולאחר מכן קח את התוחלת לפי $Θ$ בנפרד מהתוחלת לפי $X$.", "modelAnswer": "תוחלת: ‏$μ_Y(t) = E[X(t)]E[cos(2πf_0t+Θ)] = 0$, קבועה, שכן $X$ בעל תוחלת אפס ובלתי תלוי ב-$Θ$. אוטוקורלציה: מהאי-תלות, ‏$E[Y(t)Y(t+τ)] = E[X(t)X(t+τ)]·E[cos(2πf_0t+Θ)cos(2πf_0(t+τ)+Θ)]$. לפי הזהות $cos A cos B = (1/2)[cos(A-B) + cos(A+B)]$, הגורם השני שווה ל-$(1/2)E[cos(2πf_0τ) + cos(2πf_0(2t+τ)+2Θ)]$. מכיוון ש-$Θ$ אחיד על מחזור שלם, $2Θ$ אחיד על שני מחזורים שלמים ולכן $E[cos(φ+2Θ)] = 0$ לכל $φ$ דטרמיניסטי. מכאן $R_Y(t,t+τ) = (1/2)R_X(τ)cos(2πf_0τ)$, התלוי ב-$τ$ בלבד, ולכן $Y$ הוא WSS עם $R_Y(τ) = (1/2)R_X(τ)cos(2πf_0τ)$. בפרט $E[Y^2(t)] = R_X(0)/2$: האפנון מקטין את ההספק הממוצע פי שניים. אם לעומת זאת $Θ$ קבוע דטרמיניסטי, האיבר $cos(2πf_0(2t+τ)+2Θ)$ אינו מתאפס בתוחלת ומתקבל $R_Y(t,t+τ) = (1/2)R_X(τ)[cos(2πf_0τ) + cos(2πf_0(2t+τ)+2Θ)]$ התלוי ב-$t$. התוחלת עדיין קבועה (אפס), אך $Y$ אינו WSS; הוא ציקלוסטציונרי, והאוטוקורלציה שלו מחזורית ב-$t$ עם מחזור $1/(2f_0)$.", "rubric": ["מראה ש-$μ_Y(t)=0$ תוך שימוש באי-התלות בין $Θ$ ל-$X$.", "מפרק את $E[Y(t)Y(t+τ)]$ למכפלת תוחלת לפי $X$ ותוחלת לפי $Θ$ ומפעיל את זהות המכפלה-לסכום.", "מנמק ש-$E[cos(φ+2Θ)]=0$ משום ש-$Θ$ אחיד על מחזור שלם, ובכך מבטל את האיבר התלוי ב-$t$.", "מסיק $R_Y(τ) = (1/2)R_X(τ)cos(2πf_0τ)$ ומכאן WSS (ומציין את הפקטור $1/2$ בהספק).", "קובע שעם $Θ$ דטרמיניסטי האיבר התלוי ב-$t$ שורד, ולכן $Y$ ציקלוסטציונרי ולא WSS."]}}, {"id": "cor-001", "area": "correlation", "topic": "autocorrelation-vs-autocovariance", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["autocovariance", "variance", "mean"], "answer": 0, "en": {"q": "A WSS process has mean $μ_X = 5$ and autocorrelation $R_X(τ) = 25 + 9e^{-2|τ|}$. Which pair gives its autocovariance and its variance?", "options": ["$C_X(τ) = 9e^{-2|τ|}$ and $Var(X(t)) = 9$", "$C_X(τ) = 25 + 9e^{-2|τ|}$ and $Var(X(t)) = 34$", "$C_X(τ) = 20 + 9e^{-2|τ|}$ and $Var(X(t)) = 29$", "$C_X(τ) = 9e^{-2|τ|} - 25$ and $Var(X(t)) = -16$"], "hint": "The autocovariance subtracts the square of the mean, and the variance is the autocovariance at zero lag.", "explanation": "$C_X(τ) = R_X(τ) - μ_X^2 = 25 + 9e^{-2|τ|} - 25 = 9e^{-2|τ|}$, and $Var(X(t)) = C_X(0) = 9$. Consistency check: $R_X(0) = 34 = σ_X^2 + μ_X^2 = 9 + 25$, and $R_X(τ) → μ_X^2 = 25$ as $|τ| → ∞$, as it must for a process with no periodic component.", "whyWrong": ["Leaving $R_X$ unchanged confuses autocorrelation with autocovariance; the constant $25$ is exactly the DC power $μ_X^2$ that must be removed.", "Subtracting $μ_X = 5$ instead of $μ_X^2 = 25$ is the classic slip; the units alone show that a squared quantity must be removed.", "Subtracting $25$ from the fluctuating part only gives a negative variance, which is impossible."]}, "he": {"q": "לתהליך WSS יש תוחלת $μ_X = 5$ ואוטוקורלציה $R_X(τ) = 25 + 9e^{-2|τ|}$. איזה זוג נותן את האוטוקווריאנס ואת השונות שלו?", "options": ["$C_X(τ) = 9e^{-2|τ|}$ ו-$Var(X(t)) = 9$", "$C_X(τ) = 25 + 9e^{-2|τ|}$ ו-$Var(X(t)) = 34$", "$C_X(τ) = 20 + 9e^{-2|τ|}$ ו-$Var(X(t)) = 29$", "$C_X(τ) = 9e^{-2|τ|} - 25$ ו-$Var(X(t)) = -16$"], "hint": "האוטוקווריאנס מחסיר את ריבוע התוחלת, והשונות היא האוטוקווריאנס בהשהיה אפס.", "explanation": "$C_X(τ) = R_X(τ) - μ_X^2 = 25 + 9e^{-2|τ|} - 25 = 9e^{-2|τ|}$, ולכן $Var(X(t)) = C_X(0) = 9$. בדיקת עקביות: ‏$R_X(0) = 34 = σ_X^2 + μ_X^2 = 9 + 25$, וכן $R_X(τ) → μ_X^2 = 25$ כאשר $|τ| → ∞$, כנדרש מתהליך ללא רכיב מחזורי.", "whyWrong": ["השארת $R_X$ ללא שינוי מבלבלת בין אוטוקורלציה לאוטוקווריאנס; הקבוע $25$ הוא בדיוק הספק ה-DC ‏$μ_X^2$ שיש להסיר.", "חיסור $μ_X = 5$ במקום $μ_X^2 = 25$ הוא הטעות הקלאסית; אפילו היחידות מראות שיש להסיר גודל בריבוע.", "חיסור $25$ מהחלק המתנודד בלבד נותן שונות שלילית, וזה בלתי אפשרי."]}}, {"id": "cor-002", "area": "correlation", "topic": "autocorrelation-properties", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["properties", "even-function", "positive-semidefinite"], "answer": 1, "en": {"q": "$X(t)$ is a real WSS process. Which of the following statements about $R_X(τ)$ is FALSE in general?", "options": ["$R_X(-τ) = R_X(τ)$ for every $τ$.", "$R_X(τ) ≥ 0$ for every $τ$.", "$R_X(0) ≥ |R_X(τ)|$ for every $τ$.", "$R_X$ is positive semi-definite, so its Fourier transform is non-negative."], "hint": "Non-negativity is required of the spectrum, not of the correlation function itself.", "explanation": "The autocorrelation of a real WSS process is even, is maximised in magnitude at $τ=0$, and is positive semi-definite (equivalently $S_X(f) ≥ 0$ by Bochner). It need not be non-negative: $R_X(τ) = σ² cos(ω_0τ)$ and $R_X(τ) = σ²e^{-α|τ|}cos(ω_0τ)$ both take negative values, meaning samples one half-period apart are negatively correlated.", "whyWrong": ["Evenness follows directly from $R_X(τ)=E[X(t)X(t+τ)]$ and stationarity, so this is always true.", "$R_X(0) ≥ |R_X(τ)|$ follows from $E[(X(t) ± X(t+τ))^2] ≥ 0$, so this is always true.", "Positive semi-definiteness is equivalent to $S_X(f) ≥ 0$ and holds for every valid autocorrelation."]}, "he": {"q": "$X(t)$ הוא תהליך ממשי WSS. איזו מהטענות הבאות על $R_X(τ)$ שגויה באופן כללי?", "options": ["$R_X(-τ) = R_X(τ)$ לכל $τ$.", "$R_X(τ) ≥ 0$ לכל $τ$.", "$R_X(0) ≥ |R_X(τ)|$ לכל $τ$.", "$R_X$ חיובית למחצה בהגדרה, ולכן התמרת פורייה שלה אי-שלילית."], "hint": "האי-שליליות נדרשת מהספקטרום, לא מפונקציית הקורלציה עצמה.", "explanation": "האוטוקורלציה של תהליך ממשי WSS היא זוגית, מקבלת את הערך המוחלט המרבי ב-$τ=0$, וחיובית למחצה בהגדרה (שקול ל-$S_X(f) ≥ 0$ לפי בוכנר). היא אינה חייבת להיות אי-שלילית: ‏$R_X(τ) = σ² cos(ω_0τ)$ וגם $R_X(τ) = σ²e^{-α|τ|}cos(ω_0τ)$ מקבלות ערכים שליליים, כלומר דגימות במרחק חצי מחזור מתואמות שלילית.", "whyWrong": ["הזוגיות נובעת ישירות מ-$R_X(τ)=E[X(t)X(t+τ)]$ ומהסטציונריות, ולכן היא תמיד נכונה.", "$R_X(0) ≥ |R_X(τ)|$ נובע מ-$E[(X(t) ± X(t+τ))^2] ≥ 0$, ולכן תמיד נכון.", "חיוביות למחצה שקולה ל-$S_X(f) ≥ 0$ ומתקיימת עבור כל אוטוקורלציה חוקית."]}}, {"id": "cor-003", "area": "correlation", "topic": "physical-meaning-of-r0-and-rinf", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["average-power", "dc-power", "interpretation"], "answer": 2, "en": {"q": "For a real WSS process $X(t)$ whose correlation dies out (no periodic component), what do $R_X(0)$ and $lim_{|τ|→∞} R_X(τ)$ represent physically?", "options": ["$R_X(0)$ is the variance $σ_X^2$; the limit is the total average power.", "$R_X(0)$ is the DC power; the limit is the AC power $σ_X^2$.", "$R_X(0)$ is the total average power; the limit is the DC power $μ_X^2$.", "$R_X(0)$ is the mean $μ_X$; the limit is the variance $σ_X^2$."], "hint": "Set $τ=0$ in the definition, then ask what remains when the two samples become independent.", "explanation": "$R_X(0)=E[X^2(t)]$ is the total average power (into $1$ Ω). As $|τ|→∞$ the two samples decorrelate, so $R_X(τ) → E[X(t)]E[X(t+τ)] = μ_X^2$, the DC power. The difference $R_X(0) - R_X(∞) = σ_X^2$ is the AC (fluctuation) power.", "whyWrong": ["$R_X(0)$ is the second moment, which equals the variance only when the mean is zero; and the limit is not the total power.", "This swaps the two: DC power is the tail value $μ_X^2$, and the AC power is the difference between the two, not the limit itself.", "$R_X(0)$ has the units of power, i.e. of $X^2$, so it cannot be the mean $μ_X$."]}, "he": {"q": "עבור תהליך ממשי WSS ‏$X(t)$ שהקורלציה שלו דועכת (ללא רכיב מחזורי), מה מייצגים פיזיקלית $R_X(0)$ ו-$lim_{|τ|→∞} R_X(τ)$?", "options": ["$R_X(0)$ היא השונות $σ_X^2$; הגבול הוא ההספק הממוצע הכולל.", "$R_X(0)$ היא הספק ה-DC; הגבול הוא הספק ה-AC ‏$σ_X^2$.", "$R_X(0)$ היא ההספק הממוצע הכולל; הגבול הוא הספק ה-DC ‏$μ_X^2$.", "$R_X(0)$ היא התוחלת $μ_X$; הגבול הוא השונות $σ_X^2$."], "hint": "הצב $τ=0$ בהגדרה, ואז שאל מה נשאר כאשר שתי הדגימות הופכות בלתי תלויות.", "explanation": "$R_X(0)=E[X^2(t)]$ הוא ההספק הממוצע הכולל (על התנגדות של $1$ אוהם). כאשר $|τ|→∞$ שתי הדגימות מתנתקות בקורלציה, ולכן $R_X(τ) → E[X(t)]E[X(t+τ)] = μ_X^2$, שהוא הספק ה-DC. ההפרש $R_X(0) - R_X(∞) = σ_X^2$ הוא הספק ה-AC (הספק התנודות).", "whyWrong": ["$R_X(0)$ הוא המומנט השני, השווה לשונות רק כאשר התוחלת אפס; וגם הגבול אינו ההספק הכולל.", "כאן הוחלפו התפקידים: הספק ה-DC הוא ערך הזנב $μ_X^2$, והספק ה-AC הוא ההפרש בין השניים ולא הגבול עצמו.", "ל-$R_X(0)$ יש יחידות של הספק, כלומר של $X^2$, ולכן היא אינה יכולה להיות התוחלת $μ_X$."]}}, {"id": "cor-004", "area": "correlation", "topic": "peak-at-zero-lag-proof", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["proof", "cauchy-schwarz", "cross-correlation-bound"], "en": {"q": "Prove that $R_X(0) ≥ |R_X(τ)|$ for every $τ$ for a real WSS process, and explain what this means physically. Does the same bound, with $R_{XY}(0)$ on the left, hold for the cross-correlation of two jointly WSS processes?", "hint": "Start from the fact that the expectation of a square is non-negative, using $X(t) ± X(t+τ)$.", "modelAnswer": "For any $τ$, $E[(X(t) - X(t+τ))^2] ≥ 0$ expands to $E[X^2(t)] - 2E[X(t)X(t+τ)] + E[X^2(t+τ)] = 2R_X(0) - 2R_X(τ) ≥ 0$, using stationarity so that both second moments equal $R_X(0)$. Hence $R_X(τ) ≤ R_X(0)$. Repeating with the plus sign, $E[(X(t) + X(t+τ))^2] = 2R_X(0) + 2R_X(τ) ≥ 0$ gives $R_X(τ) ≥ -R_X(0)$. Together, $|R_X(τ)| ≤ R_X(0)$. (Equivalently apply Cauchy-Schwarz: $|E[X(t)X(t+τ)]| ≤ √(E[X^2(t)]E[X^2(t+τ)]) = R_X(0)$.) Physically, no lag can be more strongly correlated than zero lag: a sample is most like itself, and the total average power $R_X(0)$ bounds every correlation value. Equality at some $τ_0 ≠ 0$ means $X(t+τ_0) = ±X(t)$ with probability one, i.e. the process is periodic in mean square. For the cross-correlation the analogous bound at zero lag is FALSE. $R_{XY}(τ)$ need not peak at $τ=0$ — if $Y(t)=X(t-t_0)$ the peak of $R_{XY}$ sits at $τ=-t_0$, which is exactly why cross-correlation is used for delay estimation. What does hold, by Cauchy-Schwarz, is $|R_{XY}(τ)| ≤ √(R_X(0)R_Y(0))$, and consequently $|R_{XY}(τ)| ≤ (1/2)[R_X(0)+R_Y(0)]$ by the AM-GM inequality.", "rubric": ["Uses $E[(X(t) ∓ X(t+τ))^2] ≥ 0$ (or Cauchy-Schwarz) and expands correctly.", "Invokes stationarity to replace both second moments by $R_X(0)$, obtaining $|R_X(τ)| ≤ R_X(0)$ from both signs.", "Interprets the result: zero lag is maximally correlated, and the bound is the total average power.", "States that the analogous bound at zero lag fails for $R_{XY}$, with the delay example $Y(t)=X(t-t_0)$.", "Gives the correct cross bound $|R_{XY}(τ)| ≤ √(R_X(0)R_Y(0))$."]}, "he": {"q": "הוכח כי $R_X(0) ≥ |R_X(τ)|$ לכל $τ$ עבור תהליך ממשי WSS, והסבר את משמעות התוצאה פיזיקלית. האם אותו חסם, עם $R_{XY}(0)$ באגף שמאל, מתקיים עבור הקורלציה ההדדית של שני תהליכים סטציונריים במשותף?", "hint": "התחל מכך שתוחלת של ריבוע אינה שלילית, עם הביטוי $X(t) ± X(t+τ)$.", "modelAnswer": "לכל $τ$, הפיתוח של $E[(X(t) - X(t+τ))^2] ≥ 0$ נותן $E[X^2(t)] - 2E[X(t)X(t+τ)] + E[X^2(t+τ)] = 2R_X(0) - 2R_X(τ) ≥ 0$, תוך שימוש בסטציונריות כך ששני המומנטים השניים שווים ל-$R_X(0)$. מכאן $R_X(τ) ≤ R_X(0)$. חזרה על אותו שיקול עם סימן פלוס, $E[(X(t) + X(t+τ))^2] = 2R_X(0) + 2R_X(τ) ≥ 0$, נותנת $R_X(τ) ≥ -R_X(0)$. יחד: ‏$|R_X(τ)| ≤ R_X(0)$. (לחלופין קושי-שוורץ: ‏$|E[X(t)X(t+τ)]| ≤ √(E[X^2(t)]E[X^2(t+τ)]) = R_X(0)$.) פיזיקלית: אף השהיה אינה יכולה להיות מתואמת יותר מהשהיה אפס — דגימה דומה לעצמה יותר מכל, וההספק הממוצע הכולל $R_X(0)$ חוסם כל ערך קורלציה. שוויון עבור $τ_0 ≠ 0$ פירושו $X(t+τ_0) = ±X(t)$ בהסתברות אחד, כלומר תהליך מחזורי בממוצע ריבועי. עבור הקורלציה ההדדית החסם המקביל בהשהיה אפס אינו נכון. ‏$R_{XY}(τ)$ אינה חייבת למקסם ב-$τ=0$ — אם $Y(t)=X(t-t_0)$ אז השיא של $R_{XY}$ נמצא ב-$τ=-t_0$, וזו בדיוק הסיבה שמשתמשים בקורלציה הדדית לאמידת השהיה. מה שכן מתקיים, לפי קושי-שוורץ, הוא $|R_{XY}(τ)| ≤ √(R_X(0)R_Y(0))$, ומכאן גם $|R_{XY}(τ)| ≤ (1/2)[R_X(0)+R_Y(0)]$ לפי אי-שוויון הממוצעים.", "rubric": ["משתמש ב-$E[(X(t) ∓ X(t+τ))^2] ≥ 0$ (או בקושי-שוורץ) ומפתח נכון.", "מפעיל את הסטציונריות כדי להחליף את שני המומנטים השניים ב-$R_X(0)$, ומקבל $|R_X(τ)| ≤ R_X(0)$ משני הסימנים.", "מפרש את התוצאה: השהיה אפס היא בעלת הקורלציה המרבית, והחסם הוא ההספק הממוצע הכולל.", "קובע שהחסם המקביל בהשהיה אפס אינו נכון עבור $R_{XY}$, עם דוגמת ההשהיה $Y(t)=X(t-t_0)$.", "נותן את החסם ההדדי הנכון $|R_{XY}(τ)| ≤ √(R_X(0)R_Y(0))$."]}}, {"id": "cor-005", "area": "correlation", "topic": "cross-correlation-symmetry", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["cross-correlation", "symmetry"], "answer": 3, "en": {"q": "$X(t)$ and $Y(t)$ are jointly WSS, with $R_{XY}(τ) = E[X(t)Y(t+τ)]$. Which relation always holds?", "options": ["$R_{XY}(τ) = R_{XY}(-τ)$", "$R_{XY}(τ) = R_{YX}(τ)$", "$R_{XY}(0) ≥ |R_{XY}(τ)|$", "$R_{XY}(τ) = R_{YX}(-τ)$"], "hint": "Substitute $t' = t - τ$ in $R_{YX}(-τ) = E[Y(t)X(t-τ)]$.", "explanation": "$R_{YX}(-τ) = E[Y(t)X(t-τ)]$; putting $t' = t-τ$ gives $E[X(t')Y(t'+τ)] = R_{XY}(τ)$. So the cross-correlation is not even in $τ$ — reflecting it also swaps the roles of the two processes. This is the identity that becomes $S_{XY}(f) = S_{YX}^*(f)$ in the frequency domain.", "whyWrong": ["Evenness holds for the autocorrelation of a real process, not for a cross-correlation; reversing the lag swaps which process is delayed.", "$R_{XY}(τ) = R_{YX}(τ)$ would say the order of the two processes never matters, which fails already for $Y(t) = X(t-t_0)$.", "The peak of $R_{XY}$ need not be at zero lag: for $Y(t)=X(t-t_0)$ it sits at $τ=-t_0$, which is how delays are estimated."]}, "he": {"q": "$X(t)$ ו-$Y(t)$ סטציונריים במשותף במובן הרחב, עם $R_{XY}(τ) = E[X(t)Y(t+τ)]$. איזה קשר מתקיים תמיד?", "options": ["$R_{XY}(τ) = R_{XY}(-τ)$", "$R_{XY}(τ) = R_{YX}(τ)$", "$R_{XY}(0) ≥ |R_{XY}(τ)|$", "$R_{XY}(τ) = R_{YX}(-τ)$"], "hint": "הצב $t' = t - τ$ בביטוי $R_{YX}(-τ) = E[Y(t)X(t-τ)]$.", "explanation": "$R_{YX}(-τ) = E[Y(t)X(t-τ)]$; הצבת $t' = t-τ$ נותנת $E[X(t')Y(t'+τ)] = R_{XY}(τ)$. לכן הקורלציה ההדדית אינה זוגית ב-$τ$ — היפוך ההשהיה מחליף גם את תפקידי שני התהליכים. זו הזהות שהופכת במישור התדר ל-$S_{XY}(f) = S_{YX}^*(f)$.", "whyWrong": ["הזוגיות מתקיימת עבור אוטוקורלציה של תהליך ממשי, לא עבור קורלציה הדדית; היפוך ההשהיה מחליף איזה תהליך מושהה.", "$R_{XY}(τ) = R_{YX}(τ)$ היה אומר שסדר התהליכים לעולם אינו משנה, וזה נכשל כבר עבור $Y(t) = X(t-t_0)$.", "השיא של $R_{XY}$ אינו חייב להיות בהשהיה אפס: עבור $Y(t)=X(t-t_0)$ הוא נמצא ב-$τ=-t_0$, וכך אומדים השהיות."]}}, {"id": "cor-006", "area": "correlation", "topic": "cross-correlation-of-delayed-process", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["cross-correlation", "delay", "computation"], "answer": 0, "en": {"q": "$X(t)$ is WSS with $R_X(τ)=e^{-|τ|}$, and $Y(t) = X(t-3)$. Using the convention $R_{XY}(τ)=E[X(t)Y(t+τ)]$, compute $R_{XY}(2)$.", "options": ["$e^{-1}$", "$e^{-2}$", "$e^{-3}$", "$e^{-5}$"], "hint": "Write $Y(t+τ)$ explicitly in terms of $X$ before taking the expectation.", "explanation": "$Y(t+τ) = X(t+τ-3)$, so $R_{XY}(τ) = E[X(t)X(t+τ-3)] = R_X(τ-3)$: the delay shifts the whole cross-correlation. At $τ=2$: $R_X(2-3) = R_X(-1) = e^{-|-1|} = e^{-1}$. Note the peak of $R_{XY}$ is at $τ=3$, which recovers the delay.", "whyWrong": ["$e^{-2}$ ignores the delay altogether and evaluates $R_X(2)$.", "$e^{-3}$ evaluates $R_X$ at the delay itself rather than at the shifted lag $τ-3$.", "$e^{-5}$ comes from the sign error $R_X(τ+3) = R_X(5)$, shifting in the wrong direction."]}, "he": {"q": "$X(t)$ הוא WSS עם $R_X(τ)=e^{-|τ|}$, ו-$Y(t) = X(t-3)$. לפי הקונבנציה $R_{XY}(τ)=E[X(t)Y(t+τ)]$, חשב את $R_{XY}(2)$.", "options": ["$e^{-1}$", "$e^{-2}$", "$e^{-3}$", "$e^{-5}$"], "hint": "רשום את $Y(t+τ)$ במפורש באמצעות $X$ לפני לקיחת התוחלת.", "explanation": "$Y(t+τ) = X(t+τ-3)$, ולכן $R_{XY}(τ) = E[X(t)X(t+τ-3)] = R_X(τ-3)$: ההשהיה מזיזה את כל הקורלציה ההדדית. עבור $τ=2$: ‏$R_X(2-3) = R_X(-1) = e^{-|-1|} = e^{-1}$. שים לב שהשיא של $R_{XY}$ נמצא ב-$τ=3$, ומשחזר את ההשהיה.", "whyWrong": ["$e^{-2}$ מתעלם מההשהיה לחלוטין ומחשב את $R_X(2)$.", "$e^{-3}$ מציב ב-$R_X$ את ההשהיה עצמה במקום את ההשהיה המוזזת $τ-3$.", "$e^{-5}$ נובע משגיאת סימן $R_X(τ+3) = R_X(5)$, כלומר הזזה בכיוון ההפוך."]}}, {"id": "cor-007", "area": "correlation", "topic": "mean-square-continuity", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["mean-square-continuity", "autocorrelation"], "answer": 1, "en": {"q": "Under exactly which condition is a WSS process $X(t)$ mean-square continuous at every $t$?", "options": ["Its sample functions are continuous with probability one.", "$R_X(τ)$ is continuous at $τ=0$.", "$R_X(τ)$ is differentiable at every $τ$.", "$R_X(τ) → 0$ as $|τ| → ∞$."], "hint": "Expand $E[(X(t+τ)-X(t))^2]$ in terms of $R_X$ and let $τ → 0$.", "explanation": "$E[(X(t+τ)-X(t))^2] = 2[R_X(0) - R_X(τ)]$, which tends to $0$ as $τ→0$ exactly when $R_X$ is continuous at the origin. Moreover continuity of $R_X$ at $τ=0$ forces continuity of $R_X$ everywhere, so MS continuity at one point gives it at all points.", "whyWrong": ["Sample-path continuity is a different (stronger, path-wise) notion: the Poisson process is mean-square continuous yet every realisation has jumps.", "Differentiability of $R_X$ is the condition for mean-square differentiability, which is strictly stronger than continuity.", "Decay of $R_X$ at infinity concerns loss of memory (and mean-ergodicity), not the behaviour at $τ=0$."]}, "he": {"q": "תחת איזה תנאי בדיוק תהליך WSS ‏$X(t)$ רציף בממוצע ריבועי בכל $t$?", "options": ["פונקציות המדגם שלו רציפות בהסתברות אחד.", "$R_X(τ)$ רציפה ב-$τ=0$.", "$R_X(τ)$ גזירה בכל $τ$.", "$R_X(τ) → 0$ כאשר $|τ| → ∞$."], "hint": "פתח את $E[(X(t+τ)-X(t))^2]$ באמצעות $R_X$ והשאף $τ → 0$.", "explanation": "$E[(X(t+τ)-X(t))^2] = 2[R_X(0) - R_X(τ)]$, וביטוי זה שואף ל-$0$ כאשר $τ→0$ בדיוק כאשר $R_X$ רציפה בראשית. יתרה מזו, רציפות $R_X$ ב-$τ=0$ גוררת את רציפותה בכל מקום, ולכן רציפות בממוצע ריבועי בנקודה אחת נותנת אותה בכל הנקודות.", "whyWrong": ["רציפות מסלולים היא מושג אחר (חזק יותר, לכל מסלול): תהליך פואסון רציף בממוצע ריבועי ובכל זאת לכל מימוש שלו יש קפיצות.", "גזירות $R_X$ היא התנאי לגזירות בממוצע ריבועי, שהיא דרישה חזקה ממש מרציפות.", "דעיכת $R_X$ באינסוף עוסקת באובדן זיכרון (ובארגודיות בתוחלת), ולא בהתנהגות ב-$τ=0$."]}}, {"id": "cor-008", "area": "correlation", "topic": "mean-square-derivative", "difficulty": 4, "type": "mcq", "hardnessSource": "computation", "tags": ["mean-square-derivative", "second-derivative", "power"], "answer": 2, "en": {"q": "$X(t)$ is WSS and mean-square differentiable, with $R_X(τ) = e^{-τ²}$. Compute the average power of the derivative, $E[(X'(t))^2]$.", "options": ["$0$", "$-2$", "$2$", "$4$"], "hint": "For a WSS process $R_{X'}(τ) = -R_X''(τ)$; evaluate at $τ=0$.", "explanation": "$R_X'(τ) = -2τe^{-τ²}$ and $R_X''(τ) = (4τ² - 2)e^{-τ²}$, so $R_X''(0) = -2$. Since $R_{X'}(τ) = -R_X''(τ)$, we get $E[(X'(t))^2] = R_{X'}(0) = -R_X''(0) = 2$. The sign works out because $R_X$ has a maximum at $τ=0$, so $R_X''(0) ≤ 0$ and the power comes out non-negative.", "whyWrong": ["$0$ uses the first derivative $R_X'(0)=0$; that value is zero for every valid autocorrelation and carries no information.", "$-2$ is $R_X''(0)$ without the minus sign of $R_{X'}(τ) = -R_X''(τ)$, and a negative average power is impossible.", "$4$ reads the coefficient in $R_X''(τ) = (4τ²-2)e^{-τ²}$ instead of evaluating the expression at $τ=0$."]}, "he": {"q": "$X(t)$ הוא WSS וגזיר בממוצע ריבועי, עם $R_X(τ) = e^{-τ²}$. חשב את ההספק הממוצע של הנגזרת, $E[(X'(t))^2]$.", "options": ["$0$", "$-2$", "$2$", "$4$"], "hint": "עבור תהליך WSS מתקיים $R_{X'}(τ) = -R_X''(τ)$; הצב $τ=0$.", "explanation": "$R_X'(τ) = -2τe^{-τ²}$ ו-$R_X''(τ) = (4τ² - 2)e^{-τ²}$, ולכן $R_X''(0) = -2$. מכיוון ש-$R_{X'}(τ) = -R_X''(τ)$, מתקבל $E[(X'(t))^2] = R_{X'}(0) = -R_X''(0) = 2$. הסימן יוצא נכון משום של-$R_X$ יש מקסימום ב-$τ=0$, ולכן $R_X''(0) ≤ 0$ וההספק אי-שלילי.", "whyWrong": ["$0$ משתמש בנגזרת הראשונה $R_X'(0)=0$; ערך זה מתאפס עבור כל אוטוקורלציה חוקית ואינו נושא מידע.", "$-2$ הוא $R_X''(0)$ ללא סימן המינוס שבקשר $R_{X'}(τ) = -R_X''(τ)$, והספק ממוצע שלילי אינו אפשרי.", "$4$ קורא את המקדם בביטוי $R_X''(τ) = (4τ²-2)e^{-τ²}$ במקום להציב בו $τ=0$."]}}, {"id": "cor-009", "area": "correlation", "topic": "valid-autocorrelation", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["validity-test", "positive-semidefinite", "properties"], "answer": 3, "en": {"q": "Which of the following functions can be the autocorrelation of a real WSS process?", "options": ["$R(τ) = τ^2 e^{-|τ|}$", "$R(τ) = τ e^{-τ^2}$", "$R(τ) = 1$ for $|τ| ≤ 1$ and $R(τ) = 0$ otherwise", "$R(τ) = e^{-|τ|}cos(4πτ)$"], "hint": "Check evenness, then the peak at $τ=0$, then whether the Fourier transform stays non-negative.", "explanation": "A valid autocorrelation must be even, satisfy $R(0) ≥ |R(τ)|$, and have a non-negative Fourier transform. $e^{-|τ|}cos(4πτ)$ passes all three: its transform is $(1/2)[L(f-2)+L(f+2)]$ with $L(f) = 2/(1+4π²f²) ≥ 0$, a pair of shifted Lorentzians.", "whyWrong": ["$τ^2e^{-|τ|}$ has $R(0)=0$ while $R(1)=e^{-1}>0$, violating $R(0) ≥ |R(τ)|$.", "$τe^{-τ^2}$ is an odd function, but the autocorrelation of a real WSS process must be even.", "The rectangle is even with its peak at zero, but its transform $2sinc(2f)$ takes negative values, so it is not positive semi-definite (the triangle, not the rectangle, is the valid one)."]}, "he": {"q": "איזו מהפונקציות הבאות יכולה להיות פונקציית האוטוקורלציה של תהליך ממשי WSS?", "options": ["$R(τ) = τ^2 e^{-|τ|}$", "$R(τ) = τ e^{-τ^2}$", "$R(τ) = 1$ עבור $|τ| ≤ 1$ ו-$R(τ) = 0$ אחרת", "$R(τ) = e^{-|τ|}cos(4πτ)$"], "hint": "בדוק זוגיות, אחר כך שיא ב-$τ=0$, ולבסוף אם התמרת פורייה נשארת אי-שלילית.", "explanation": "אוטוקורלציה חוקית חייבת להיות זוגית, לקיים $R(0) ≥ |R(τ)|$, ולהיות בעלת התמרת פורייה אי-שלילית. הפונקציה $e^{-|τ|}cos(4πτ)$ עומדת בשלושת התנאים: התמרתה היא $(1/2)[L(f-2)+L(f+2)]$ עם $L(f) = 2/(1+4π²f²) ≥ 0$, כלומר זוג לורנציאנים מוזזים.", "whyWrong": ["עבור $τ^2e^{-|τ|}$ מתקיים $R(0)=0$ בעוד $R(1)=e^{-1}>0$, בסתירה ל-$R(0) ≥ |R(τ)|$.", "$τe^{-τ^2}$ היא פונקציה אי-זוגית, אך האוטוקורלציה של תהליך ממשי WSS חייבת להיות זוגית.", "המלבן זוגי ובעל שיא באפס, אך התמרתו $2sinc(2f)$ מקבלת ערכים שליליים ולכן אינה חיובית למחצה (המשולש, ולא המלבן, הוא החוקי)."]}}, {"id": "cor-010", "area": "correlation", "topic": "time-vs-ensemble-averages", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["time-average", "ensemble-average", "ergodicity"], "en": {"q": "Explain the difference between the ensemble average $E[X(t)]$ and the time average $⟨x⟩_T = (1/2T)∫_{-T}^{T} x(t)dt$ of a single realisation. When may the two be used interchangeably, and why does this matter in the laboratory?", "hint": "One average runs across the ensemble at a fixed time; the other runs along time for one fixed outcome.", "modelAnswer": "The ensemble average $E[X(t)]$ is taken across the ensemble at a fixed time instant: it integrates over the outcomes $ζ$ weighted by the probability law, and for each $t$ it is a deterministic number. The time average is taken along the time axis for one fixed outcome $ζ$, so $⟨x⟩_T$ is itself a random variable — a different realisation gives a different number. For a WSS process the time average is unbiased for any $T$: $E[⟨X⟩_T] = (1/2T)∫_{-T}^{T}μ_X dt = μ_X$. But being unbiased is not enough; the two may be identified only if the estimator also concentrates, i.e. $Var(⟨X⟩_T) → 0$ as $T→∞$, so that $⟨X⟩_T → μ_X$ in mean square. That property is precisely ergodicity in the mean, and it requires the memory of the process to die out, e.g. $C_X(τ)→0$ fast enough. This matters because in a laboratory or a receiver we normally observe one long record of one realisation, never the ensemble; without an ergodicity assumption, statistics estimated from that record say nothing about $E[·]$. Ergodicity is a strictly stronger assumption than stationarity, and it is an assumption about the model, not something a single measured record can prove.", "rubric": ["Defines the ensemble average as an average over outcomes at fixed $t$ and the time average as an average over $t$ for a fixed realisation.", "Notes that the time average is itself a random variable, while $E[X(t)]$ is deterministic.", "States that for WSS the time average is unbiased ($E[⟨X⟩_T] = μ_X$) but need not converge to $μ_X$.", "Identifies mean-ergodicity ($Var(⟨X⟩_T) → 0$) as the exact condition for interchanging the two.", "Explains the practical relevance: only one realisation is normally observable, so ergodicity is what licenses estimation."]}, "he": {"q": "הסבר את ההבדל בין ממוצע האנסמבל $E[X(t)]$ לבין ממוצע הזמן $⟨x⟩_T = (1/2T)∫_{-T}^{T} x(t)dt$ של מימוש בודד. מתי מותר להשתמש בשניהם לסירוגין, ומדוע זה חשוב במעבדה?", "hint": "ממוצע אחד רץ על פני האנסמבל בזמן קבוע; השני רץ לאורך הזמן עבור תוצאה קבועה אחת.", "modelAnswer": "ממוצע האנסמבל $E[X(t)]$ נלקח על פני האנסמבל ברגע זמן קבוע: הוא אינטגרציה על התוצאות $ζ$ במשקל ההתפלגות, ולכל $t$ הוא מספר דטרמיניסטי. ממוצע הזמן נלקח לאורך ציר הזמן עבור תוצאה קבועה אחת $ζ$, ולכן $⟨x⟩_T$ הוא בעצמו משתנה אקראי — מימוש אחר ייתן מספר אחר. עבור תהליך WSS ממוצע הזמן חסר הטיה לכל $T$: ‏$E[⟨X⟩_T] = (1/2T)∫_{-T}^{T}μ_X dt = μ_X$. אך היעדר הטיה אינו מספיק; מותר לזהות בין השניים רק אם האומד גם מתרכז, כלומר $Var(⟨X⟩_T) → 0$ כאשר $T→∞$, כך ש-$⟨X⟩_T → μ_X$ בממוצע ריבועי. זו בדיוק ארגודיות בתוחלת, והיא דורשת שזיכרון התהליך ידעך, למשל $C_X(τ)→0$ מספיק מהר. החשיבות המעשית: במעבדה או במקלט מתבוננים בדרך כלל ברשומה ארוכה אחת של מימוש יחיד ולעולם לא באנסמבל; ללא הנחת ארגודיות, סטטיסטיקות שנאמדו מהרשומה אינן אומרות דבר על $E[·]$. ארגודיות היא הנחה חזקה ממש מסטציונריות, והיא הנחה על המודל — לא משהו שרשומה נמדדת אחת יכולה להוכיח.", "rubric": ["מגדיר את ממוצע האנסמבל כממוצע על התוצאות בזמן קבוע ואת ממוצע הזמן כממוצע על $t$ עבור מימוש קבוע.", "מציין שממוצע הזמן הוא בעצמו משתנה אקראי, בעוד $E[X(t)]$ דטרמיניסטי.", "קובע שעבור WSS ממוצע הזמן חסר הטיה ($E[⟨X⟩_T] = μ_X$) אך אינו חייב להתכנס ל-$μ_X$.", "מזהה ארגודיות בתוחלת ($Var(⟨X⟩_T) → 0$) כתנאי המדויק להחלפה בין השניים.", "מסביר את הרלוונטיות המעשית: בדרך כלל ניתן להתבונן במימוש אחד בלבד, ולכן הארגודיות היא שמאפשרת אמידה."]}}, {"id": "cor-011", "area": "correlation", "topic": "ergodicity-conditions", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["ergodicity", "slutsky", "fourth-moments"], "en": {"q": "State precisely what it means for a WSS process to be ergodic in the mean and ergodic in autocorrelation, and give a usable sufficient condition for each. Why is the second requirement much stronger than the first?", "hint": "Write the variance of the estimator in each case; for the autocorrelation the estimator is itself a process.", "modelAnswer": "Ergodic in the mean: the estimator $⟨X⟩_T = (1/2T)∫_{-T}^{T}X(t)dt$ converges to $μ_X$ in mean square as $T→∞$. It is always unbiased, so the requirement is $Var(⟨X⟩_T) → 0$, and a direct computation gives $Var(⟨X⟩_T) = (1/2T)∫_{-2T}^{2T}(1 - |τ|/(2T))C_X(τ)dτ$. Slutsky's condition: the process is mean-ergodic if and only if this expression tends to zero, equivalently $lim_{T→∞}(1/2T)∫_{0}^{2T}C_X(τ)dτ = 0$. A convenient sufficient condition is $∫_{-∞}^{∞}|C_X(τ)|dτ < ∞$ (in particular $C_X(τ)→0$ fast enough), in which case $Var(⟨X⟩_T) = O(1/T)$. Ergodic in autocorrelation: for each fixed $τ$, $(1/2T)∫_{-T}^{T}X(t)X(t+τ)dt → R_X(τ)$ in mean square. This is exactly mean-ergodicity of the auxiliary process $Z_τ(t) = X(t)X(t+τ)$, so the condition is that the covariance of $Z_τ$ satisfy the same Slutsky condition. But $C_{Z_τ}$ involves $E[X(t)X(t+τ)X(t+u)X(t+u+τ)]$, i.e. fourth-order moments, which second-order theory does not supply — this is why the requirement is much stronger and cannot be checked from $R_X$ alone for a general process. For a zero-mean Gaussian process the Isserlis (moment-factorisation) formula gives $C_{Z_τ}(u) = R_X^2(u) + R_X(u+τ)R_X(u-τ)$, so $∫|R_X(u)|du < ∞$ (or simply $R_X(u)→0$ fast enough) is sufficient for ergodicity in autocorrelation as well.", "rubric": ["Defines mean-ergodicity as mean-square convergence of the time average to $μ_X$, noting it is unbiased so only the variance matters.", "Gives $Var(⟨X⟩_T) = (1/2T)∫_{-2T}^{2T}(1-|τ|/2T)C_X(τ)dτ$ or the equivalent Slutsky condition, plus a sufficient condition such as $∫|C_X|dτ < ∞$.", "Defines autocorrelation-ergodicity as convergence of $(1/2T)∫X(t)X(t+τ)dt$ to $R_X(τ)$ for each $τ$.", "Identifies it as mean-ergodicity of $Z_τ(t)=X(t)X(t+τ)$ and explains that this involves fourth-order moments.", "Gives the Gaussian special case $C_{Z_τ}(u) = R_X^2(u) + R_X(u+τ)R_X(u-τ)$ and the resulting sufficient condition."]}, "he": {"q": "נסח במדויק מה פירוש הדבר שתהליך WSS ארגודי בתוחלת וארגודי באוטוקורלציה, ותן תנאי מספיק שימושי לכל אחד. מדוע הדרישה השנייה חזקה בהרבה מהראשונה?", "hint": "רשום את שונות האומד בכל מקרה; באוטוקורלציה האומד הוא בעצמו תהליך.", "modelAnswer": "ארגודיות בתוחלת: האומד $⟨X⟩_T = (1/2T)∫_{-T}^{T}X(t)dt$ מתכנס ל-$μ_X$ בממוצע ריבועי כאשר $T→∞$. הוא תמיד חסר הטיה, ולכן הדרישה היא $Var(⟨X⟩_T) → 0$, וחישוב ישיר נותן $Var(⟨X⟩_T) = (1/2T)∫_{-2T}^{2T}(1 - |τ|/(2T))C_X(τ)dτ$. תנאי סלוצקי: התהליך ארגודי בתוחלת אם ורק אם ביטוי זה שואף לאפס, שקול ל-$lim_{T→∞}(1/2T)∫_{0}^{2T}C_X(τ)dτ = 0$. תנאי מספיק נוח הוא $∫_{-∞}^{∞}|C_X(τ)|dτ < ∞$ (ובפרט $C_X(τ)→0$ מספיק מהר), ואז $Var(⟨X⟩_T) = O(1/T)$. ארגודיות באוטוקורלציה: לכל $τ$ קבוע, ‏$(1/2T)∫_{-T}^{T}X(t)X(t+τ)dt → R_X(τ)$ בממוצע ריבועי. זוהי בדיוק ארגודיות בתוחלת של התהליך העזר $Z_τ(t) = X(t)X(t+τ)$, ולכן התנאי הוא שהקווריאנס של $Z_τ$ יקיים את אותו תנאי סלוצקי. אלא ש-$C_{Z_τ}$ מערב את $E[X(t)X(t+τ)X(t+u)X(t+u+τ)]$, כלומר מומנטים מסדר רביעי, שתורת הסדר השני אינה מספקת — ולכן הדרישה חזקה בהרבה ואינה ניתנת לבדיקה מ-$R_X$ בלבד עבור תהליך כללי. עבור תהליך גאוסי בעל תוחלת אפס נוסחת איסרליס (פירוק מומנטים) נותנת $C_{Z_τ}(u) = R_X^2(u) + R_X(u+τ)R_X(u-τ)$, ולכן $∫|R_X(u)|du < ∞$ (או פשוט $R_X(u)→0$ מספיק מהר) מספיק גם לארגודיות באוטוקורלציה.", "rubric": ["מגדיר ארגודיות בתוחלת כהתכנסות בממוצע ריבועי של ממוצע הזמן ל-$μ_X$, ומציין שהאומד חסר הטיה ולכן רק השונות קובעת.", "נותן את $Var(⟨X⟩_T) = (1/2T)∫_{-2T}^{2T}(1-|τ|/2T)C_X(τ)dτ$ או את תנאי סלוצקי השקול, ובנוסף תנאי מספיק כגון $∫|C_X|dτ < ∞$.", "מגדיר ארגודיות באוטוקורלציה כהתכנסות של $(1/2T)∫X(t)X(t+τ)dt$ ל-$R_X(τ)$ לכל $τ$.", "מזהה זאת כארגודיות בתוחלת של $Z_τ(t)=X(t)X(t+τ)$ ומסביר שהדבר מערב מומנטים מסדר רביעי.", "נותן את המקרה הגאוסי $C_{Z_τ}(u) = R_X^2(u) + R_X(u+τ)R_X(u-τ)$ ואת התנאי המספיק הנובע ממנו."]}}, {"id": "cor-012", "area": "correlation", "topic": "wss-does-not-imply-ergodic", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["ergodicity", "counterexample", "random-constant"], "answer": 0, "en": {"q": "$X(t) = A$ for all $t$, where $A$ is uniform on $[-1,1]$. Which statement is correct?", "options": ["It is WSS with $R_X(τ)=1/3$, but it is not ergodic in the mean.", "It is WSS with $R_X(τ)=1/3$ and ergodic, because $μ_X = 0$.", "It is not WSS, because every sample function is a constant in time.", "It is WSS with $R_X(τ)=(1/3)δ(τ)$, so it is white and therefore ergodic."], "hint": "Compute the time average of one realisation and compare it with $μ_X$.", "explanation": "$μ_X = E[A] = 0$ and $R_X(t_1,t_2) = E[A^2] = 1/3$ for all $t_1,t_2$, so the process is WSS. But a realisation is the constant $a$, so its time average is $a$ for every $T$, and $Var(⟨X⟩_T) = 1/3$ never decays. The time average converges to $A$, a random variable, not to $μ_X=0$: WSS does not imply ergodic. Slutsky's condition fails since $C_X(τ)=1/3$ does not decay.", "whyWrong": ["A zero mean does not help: the time average equals $A$, which is $0$ only with probability zero.", "Constant sample functions are perfectly compatible with stationarity; the mean and correlation are the same at every time.", "$R_X(τ)=1/3$ is a constant, not an impulse; the process is maximally correlated at all lags, the exact opposite of white."]}, "he": {"q": "$X(t) = A$ לכל $t$, כאשר $A$ מתפלג אחיד על $[-1,1]$. איזו טענה נכונה?", "options": ["התהליך WSS עם $R_X(τ)=1/3$, אך אינו ארגודי בתוחלת.", "התהליך WSS עם $R_X(τ)=1/3$ וארגודי, משום ש-$μ_X = 0$.", "התהליך אינו WSS, משום שכל פונקציית מדגם היא קבועה בזמן.", "התהליך WSS עם $R_X(τ)=(1/3)δ(τ)$, ולכן הוא לבן ומכאן ארגודי."], "hint": "חשב את ממוצע הזמן של מימוש בודד והשווה אותו ל-$μ_X$.", "explanation": "$μ_X = E[A] = 0$ וכן $R_X(t_1,t_2) = E[A^2] = 1/3$ לכל $t_1,t_2$, ולכן התהליך WSS. אך מימוש הוא הקבוע $a$, כך שממוצע הזמן שלו הוא $a$ לכל $T$, ו-$Var(⟨X⟩_T) = 1/3$ אינו דועך לעולם. ממוצע הזמן מתכנס ל-$A$, שהוא משתנה אקראי, ולא ל-$μ_X=0$: ‏WSS אינו גורר ארגודיות. תנאי סלוצקי נכשל שכן $C_X(τ)=1/3$ אינו דועך.", "whyWrong": ["תוחלת אפס אינה עוזרת: ממוצע הזמן שווה ל-$A$, שהוא $0$ רק בהסתברות אפס.", "פונקציות מדגם קבועות מתיישבות היטב עם סטציונריות; התוחלת והקורלציה זהות בכל זמן.", "$R_X(τ)=1/3$ הוא קבוע ולא אימפולס; התהליך מתואם מקסימלית בכל ההשהיות, ההפך הגמור מרעש לבן."]}}, {"id": "cor-013", "area": "correlation", "topic": "estimating-autocorrelation", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["estimator", "biased-estimate", "single-realisation"], "answer": 1, "en": {"q": "From one realisation you record the samples $x = [1, 2, 3, 4]$, so $N=4$. Compute the standard biased autocorrelation estimate at lag $1$, $R_e[1] = (1/N)Σ_{n=1}^{N-1} x[n]x[n+1]$.", "options": ["$20/3 ≈ 6.67$", "$5$", "$6$", "$20$"], "hint": "Only three products exist at lag $1$, but the biased estimator still divides by $N$.", "explanation": "The products are $1·2 + 2·3 + 3·4 = 2+6+12 = 20$, and the biased estimator divides by $N=4$: $R_e[1] = 20/4 = 5$. Dividing instead by the number of terms $N-|k| = 3$ gives the unbiased estimate $20/3$. The biased version is usually preferred because it has smaller variance at large lags and always yields a positive semi-definite estimated sequence.", "whyWrong": ["$20/3$ is the unbiased estimate, which divides by the number of available products $N-|k| = 3$ instead of by $N$.", "$6$ comes from a circular estimate that wraps around and adds the extra product $x[4]x[1] = 4$ before dividing by $4$.", "$20$ is the raw sum of products with no normalisation at all."]}, "he": {"q": "ממימוש בודד נרשמו הדגימות $x = [1, 2, 3, 4]$, כלומר $N=4$. חשב את האומד המוטה הסטנדרטי של האוטוקורלציה בהשהיה $1$, ‏$R_e[1] = (1/N)Σ_{n=1}^{N-1} x[n]x[n+1]$.", "options": ["$20/3 ≈ 6.67$", "$5$", "$6$", "$20$"], "hint": "קיימות רק שלוש מכפלות בהשהיה $1$, אך האומד המוטה עדיין מחלק ב-$N$.", "explanation": "המכפלות הן $1·2 + 2·3 + 3·4 = 2+6+12 = 20$, והאומד המוטה מחלק ב-$N=4$: ‏$R_e[1] = 20/4 = 5$. חלוקה במספר האיברים $N-|k| = 3$ הייתה נותנת את האומד חסר ההטיה $20/3$. הגרסה המוטה מועדפת בדרך כלל משום שיש לה שונות קטנה יותר בהשהיות גדולות והיא תמיד מניבה סדרה מוערכת חיובית למחצה.", "whyWrong": ["$20/3$ הוא האומד חסר ההטיה, המחלק במספר המכפלות הזמינות $N-|k| = 3$ במקום ב-$N$.", "$6$ נובע מאומד מעגלי שעוטף את הסדרה ומוסיף את המכפלה הנוספת $x[4]x[1] = 4$ לפני החלוקה ב-$4$.", "$20$ הוא סכום המכפלות הגולמי ללא נרמול כלל."]}}, {"id": "cor-014", "area": "correlation", "topic": "correlation-time", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["correlation-time", "exponential-correlation"], "answer": 2, "en": {"q": "A zero-mean WSS process has $R_X(τ) = 4e^{-5|τ|}$ (time in seconds). Using the definition $τ_c = (1/R_X(0))∫_0^{∞}R_X(τ)dτ$, compute the correlation time.", "options": ["$0.05$ s", "$0.4$ s", "$0.2$ s", "$5$ s"], "hint": "$∫_0^{∞}e^{-ατ}dτ = 1/α$, and the normalisation divides by $R_X(0)$.", "explanation": "$R_X(0)=4$ and $∫_0^{∞}4e^{-5τ}dτ = 4/5$, so $τ_c = (1/4)(4/5) = 1/5 = 0.2$ s. For an exponential correlation the correlation time is simply $1/α$, the time constant of the decay: beyond a few $τ_c$ the samples are effectively uncorrelated.", "whyWrong": ["$0.05$ s divides by $R_X(0)=4$ a second time, i.e. normalises twice.", "$0.4$ s integrates over $(-∞,∞)$ instead of $(0,∞)$, doubling the result.", "$5$ s is the decay rate $α$ itself; the correlation time is its reciprocal."]}, "he": {"q": "לתהליך WSS בעל תוחלת אפס יש $R_X(τ) = 4e^{-5|τ|}$ (זמן בשניות). לפי ההגדרה $τ_c = (1/R_X(0))∫_0^{∞}R_X(τ)dτ$, חשב את זמן הקורלציה.", "options": ["$0.05$ שניות", "$0.4$ שניות", "$0.2$ שניות", "$5$ שניות"], "hint": "$∫_0^{∞}e^{-ατ}dτ = 1/α$, והנרמול מחלק ב-$R_X(0)$.", "explanation": "$R_X(0)=4$ וכן $∫_0^{∞}4e^{-5τ}dτ = 4/5$, ולכן $τ_c = (1/4)(4/5) = 1/5 = 0.2$ שניות. עבור קורלציה מעריכית זמן הקורלציה הוא פשוט $1/α$, קבוע הזמן של הדעיכה: מעבר לכמה $τ_c$ הדגימות בלתי מתואמות למעשה.", "whyWrong": ["$0.05$ שניות מחלק ב-$R_X(0)=4$ פעם נוספת, כלומר מנרמל פעמיים.", "$0.4$ שניות נובע מאינטגרציה על $(-∞,∞)$ במקום על $(0,∞)$, ומכפיל את התוצאה פי שניים.", "$5$ שניות הוא קצב הדעיכה $α$ עצמו; זמן הקורלציה הוא ההופכי שלו."]}}, {"id": "psd-001", "area": "psd", "topic": "psd-definition", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["psd", "fourier-transform", "definition"], "answer": 0, "en": {"q": "$X(t)$ is real and WSS with autocorrelation $R_X(τ)$. Which integral defines its two-sided power spectral density $S_X(f)$ in the frequency-in-hertz convention?", "options": ["$S_X(f) = ∫_{-∞}^{∞} R_X(τ) e^{-j2πfτ} dτ$", "$S_X(f) = ∫_{-∞}^{∞} R_X(τ) e^{-jfτ} dτ$", "$S_X(f) = ∫_{-∞}^{∞} R_X(τ) e^{-j2πfτ} df$", "$S_X(f) = (1/2π)∫_{-∞}^{∞} R_X(τ) e^{-j2πfτ} dτ$"], "hint": "The transform is taken over the lag variable $τ$, and in the $f$ convention the kernel already carries the $2π$.", "explanation": "The PSD is the Fourier transform of the autocorrelation with respect to the lag: $S_X(f) = ∫R_X(τ)e^{-j2πfτ}dτ$. The inverse is $R_X(τ) = ∫S_X(f)e^{j2πfτ}df$, so setting $τ=0$ gives $R_X(0) = ∫S_X(f)df$, the total average power.", "whyWrong": ["$e^{-jfτ}$ is the kernel of the $ω$ convention with $ω$ replaced by $f$; it mixes the two conventions and gets the frequency scale wrong by $2π$.", "Integrating $df$ while the integrand depends on $τ$ is dimensionally impossible: the transform variable of integration must be the lag $τ$.", "The $1/2π$ factor belongs to the inverse transform in the $ω$ convention, not to the forward transform in the $f$ convention."]}, "he": {"q": "$X(t)$ ממשי וסטציונרי במובן הרחב (WSS) עם פונקציית אוטוקורלציה $R_X(τ)$. איזה אינטגרל מגדיר את הצפיפות הספקטרלית של ההספק (PSD) הדו-צדדית $S_X(f)$ בקונבנציית התדר בהרץ?", "options": ["$S_X(f) = ∫_{-∞}^{∞} R_X(τ) e^{-j2πfτ} dτ$", "$S_X(f) = ∫_{-∞}^{∞} R_X(τ) e^{-jfτ} dτ$", "$S_X(f) = ∫_{-∞}^{∞} R_X(τ) e^{-j2πfτ} df$", "$S_X(f) = (1/2π)∫_{-∞}^{∞} R_X(τ) e^{-j2πfτ} dτ$"], "hint": "ההתמרה נלקחת לפי משתנה ההשהיה $τ$, ובקונבנציית $f$ הגרעין כבר נושא את ה-$2π$.", "explanation": "ה-PSD היא התמרת פורייה של האוטוקורלציה לפי ההשהיה: $S_X(f) = ∫R_X(τ)e^{-j2πfτ}dτ$. ההתמרה ההפוכה היא $R_X(τ) = ∫S_X(f)e^{j2πfτ}df$, ולכן הצבת $τ=0$ נותנת $R_X(0) = ∫S_X(f)df$, שהוא ההספק הממוצע הכולל.", "whyWrong": ["$e^{-jfτ}$ הוא הגרעין של קונבנציית $ω$ כאשר $ω$ הוחלף ב-$f$; זהו ערבוב קונבנציות שמשבש את סקאלת התדר בפקטור $2π$.", "אינטגרציה לפי $df$ כאשר המבוטא תלוי ב-$τ$ אינה אפשרית ממדית: משתנה האינטגרציה חייב להיות ההשהיה $τ$.", "הפקטור $1/2π$ שייך להתמרה ההפוכה בקונבנציית $ω$, ולא להתמרה הישרה בקונבנציית $f$."]}}, {"id": "psd-002", "area": "psd", "topic": "wiener-khinchin", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["wiener-khinchin", "conditions", "distributions"], "en": {"q": "State the Wiener-Khinchin theorem for a WSS process $X(t)$ and list the conditions it needs. Then explain why it is still usable when $R_X(τ)$ is not absolutely integrable, as for $R_X(τ) = cos(2πf_0τ)$.", "hint": "Think about what guarantees the transform exists at all, and what changes when the transform is only a distribution.", "modelAnswer": "Wiener-Khinchin: for a WSS process the power spectral density, defined physically as $S_X(f) = lim_{T→∞} E[|X_T(f)|^2]/T$ where $X_T$ is the truncated transform, equals the Fourier transform of the autocorrelation: $S_X(f) = ∫R_X(τ)e^{-j2πfτ}dτ$, with inverse $R_X(τ) = ∫S_X(f)e^{j2πfτ}df$. Conditions: (i) $X(t)$ is wide-sense stationary, so $R_X$ depends on $τ$ only; (ii) $R_X(τ)$ is continuous at $τ=0$ (mean-square continuity); (iii) $R_X$ is positive semi-definite, which by Bochner's theorem is exactly equivalent to the existence of a non-negative spectral measure. Absolute integrability, $∫|R_X(τ)|dτ < ∞$, is only a sufficient condition for $S_X$ to be an ordinary function. When it fails, the process has DC or periodic components and the transform is taken in the distributional sense: $S_X$ then contains impulses. For $R_X(τ) = cos(2πf_0τ)$ we get $S_X(f) = (1/2)[δ(f-f_0) + δ(f+f_0)]$. In full generality the spectral distribution function $F(f)$ always exists and is non-decreasing, with $S_X(f) = dF/df$ interpreted as a measure.", "rubric": ["States the pair $S_X(f) = ∫R_X(τ)e^{-j2πfτ}dτ$ and its inverse, or the equivalent limit definition of $S_X$.", "Requires wide-sense stationarity and continuity of $R_X$ at $τ=0$.", "Notes that $R_X$ must be positive semi-definite, equivalently $S_X ≥ 0$ (Bochner).", "Explains that absolute integrability is only sufficient, and that impulses appear when it fails.", "Gives the concrete pair $cos(2πf_0τ) ⇔ (1/2)[δ(f-f_0) + δ(f+f_0)]$."]}, "he": {"q": "נסח את משפט וינר-חינצ'ין עבור תהליך אקראי WSS ‏$X(t)$ ומנה את התנאים הנדרשים. לאחר מכן הסבר מדוע הוא עדיין שימושי כאשר $R_X(τ)$ אינה אינטגרבילית בהחלט, כמו במקרה $R_X(τ) = cos(2πf_0τ)$.", "hint": "חשוב מה מבטיח שההתמרה בכלל קיימת, ומה משתנה כשההתמרה היא רק פונקציה מוכללת.", "modelAnswer": "וינר-חינצ'ין: עבור תהליך WSS, הצפיפות הספקטרלית של ההספק המוגדרת פיזיקלית כ-$S_X(f) = lim_{T→∞} E[|X_T(f)|^2]/T$ (כאשר $X_T$ היא ההתמרה של הקטע הקטום) שווה להתמרת פורייה של האוטוקורלציה: $S_X(f) = ∫R_X(τ)e^{-j2πfτ}dτ$, עם התמרה הפוכה $R_X(τ) = ∫S_X(f)e^{j2πfτ}df$. התנאים: (i) התהליך WSS, כלומר $R_X$ תלויה רק ב-$τ$; (ii) $R_X(τ)$ רציפה ב-$τ=0$ (רציפות בממוצע ריבועי); (iii) $R_X$ חיובית למחצה בהגדרה, ולפי משפט בוכנר זה שקול בדיוק לקיום מידה ספקטרלית אי-שלילית. אינטגרביליות מוחלטת, $∫|R_X(τ)|dτ < ∞$, היא רק תנאי מספיק לכך ש-$S_X$ תהיה פונקציה רגילה. כאשר היא אינה מתקיימת יש לתהליך רכיבי DC או רכיבים מחזוריים, וההתמרה נלקחת במובן של פונקציות מוכללות: אז $S_X$ מכילה אימפולסים. עבור $R_X(τ) = cos(2πf_0τ)$ מקבלים $S_X(f) = (1/2)[δ(f-f_0) + δ(f+f_0)]$. באופן כללי פונקציית ההתפלגות הספקטרלית $F(f)$ תמיד קיימת ואינה יורדת, ו-$S_X(f) = dF/df$ במובן של מידה.", "rubric": ["מנסח א
