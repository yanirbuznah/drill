ה. אנטיפודלי: הנקודות הן $+√E_b$ ו-$-√E_b$, כל אחת באנרגיה $E_b$, ולכן האנרגיה הממוצעת לסיבית היא $E_b$ ומתקיים $d^2=(2√E_b)^2=4E_b$. מכאן $P_e=Q(√(4E_b/(2N_0)))=Q(√(2E_b/N_0))$. ‏On-off: הנקודות הן $√E$ ו-$0$, באנרגיות $E$ ו-$0$; באפריוריות שוות האנרגיה הממוצעת לסיבית היא $E_b=E/2$ ומתקיים $d^2=E=2E_b$. מכאן $P_e=Q(√(2E_b/(2N_0)))=Q(√(E_b/N_0))$. השוואת שתי הסתברויות השגיאה דורשת שאיתות ה-on-off ישתמש בפי שניים אנרגיה ממוצעת לסיבית, ו-$10log_{10}2≈3.01$ דציבל. הסיבה גיאומטרית: עבור אנרגיה ממוצעת נתונה, מיקום שתי הנקודות סימטרית סביב הראשית קונה את ההפרדה הגדולה ביותר האפשרית, בעוד on-off מוציא חצי מתקציבו על נקודה בראשית שאינה תורמת דבר ל-$d$. הערה אחרונה: הקנס הוא $3$ דציבל באנרגיה ממוצעת אך $6$ דציבל באנרגיית שיא, שכן שיטת on-off חייבת לשדר משרעת $2√E_b$ בסמל הדלוק שלה.", "rubric": ["מצמצם למבחן חד-ממדי עם $n∼N(0,N_0/2)$ ומקבל $P_e=Q(d/(2σ))=Q(√(d^2/(2N_0)))$.", "עבור אנטיפודלי: אנרגיה ממוצעת לסיבית $E_b$, ‏$d^2=4E_b$, ולכן $P_e=Q(√(2E_b/N_0))$.", "עבור on-off: אנרגיה ממוצעת לסיבית $E_b=E/2$, ‏$d^2=2E_b$, ולכן $P_e=Q(√(E_b/N_0))$.", "מסיק ששוויון $P_e$ דורש יחס אנרגיות של בדיוק $2$, כלומר $3.01$ דציבל.", "מסביר גיאומטרית שאיתות אנטיפודלי ממקסם הפרדה ליחידת אנרגיה ממוצעת (ואפשר לציין גם את קנס $6$ הדציבל באנרגיית שיא)."]}}, {"id": "det-024", "area": "detection", "topic": "matched-filter-derivation", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["matched-filter", "cauchy-schwarz", "snr", "derivation"], "en": {"q": "A filter $h(t)$ receives $s(t)+w(t)$, with $w$ white of two-sided PSD $N_0/2$. Show that the output SNR at $t=T$ is maximised by $h(t)=c·s(T-t)$, and that the maximum equals $2E/N_0$ with $E=∫_0^T s^2dt$.", "hint": "Write the sampled signal component as an inner product of $h$ with $v(τ)=s(T-τ)$, the output noise power as $(N_0/2)‖h‖^2$, and apply the Cauchy-Schwarz inequality.", "modelAnswer": "At the sampling instant the signal component of the output is $s_o(T)=∫_{-∞}^{∞}h(τ)s(T-τ)dτ=⟨h,v⟩$, where $v(τ)=s(T-τ)$ is the time-reversed, shifted signal. The noise component is $n_o(T)=∫h(τ)w(T-τ)dτ$, a zero-mean Gaussian variable with $E[n_o^2]=∫∫h(τ)h(u)R_w(τ-u)dτdu=(N_0/2)∫h^2(τ)dτ=(N_0/2)‖h‖^2$, using $R_w(τ)=(N_0/2)δ(τ)$. Hence the output SNR is $SNR=|⟨h,v⟩|^2/((N_0/2)‖h‖^2)$. By the Cauchy-Schwarz inequality $|⟨h,v⟩|^2≤‖h‖^2‖v‖^2$, with equality if and only if $h=c·v$ for some constant $c$. Substituting, $SNR≤‖h‖^2‖v‖^2/((N_0/2)‖h‖^2)=‖v‖^2/(N_0/2)=2E/N_0$, since $‖v‖^2=∫s^2(T-τ)dτ=E$. The bound is attained exactly for $h(τ)=c·s(T-τ)$, the matched filter; $c$ scales signal and noise identically and is therefore irrelevant, and it is usually taken as $1$. Three remarks. (1) The maximum depends on $s$ only through its energy, not its shape: a long weak pulse and a short strong one of equal energy perform identically. (2) Whiteness entered only through $E[n_o^2]=(N_0/2)‖h‖^2$; for coloured noise the Cauchy-Schwarz step must be redone with the weight $S_n(f)$, giving $H(f)∝S^*(f)e^{-j2πfT}/S_n(f)$. (3) Maximum SNR is not by itself an optimality criterion for detection; it coincides with the likelihood ratio test because the noise is Gaussian, and the sampled output is then a sufficient statistic.", "rubric": ["Expresses the sampled signal component as $∫h(τ)s(T-τ)dτ$ and identifies $v(τ)=s(T-τ)$.", "Computes the output noise power as $(N_0/2)∫h^2dτ$ from $R_w(τ)=(N_0/2)δ(τ)$.", "Applies Cauchy-Schwarz and states the equality condition $h=c·v$.", "Obtains $SNR_{max}=2E/N_0$ and notes it depends on the pulse only through $E$.", "Identifies where whiteness was used, or notes that Gaussianity is what links maximum SNR to the LRT."]}, "he": {"q": "מסנן $h(t)$ מקבל $s(t)+w(t)$, כאשר $w$ לבן בעל PSD דו-צדדית $N_0/2$. הראה שיחס האות לרעש בפלט ב-$t=T$ ממוקסם על ידי $h(t)=c·s(T-t)$, ושהמקסימום שווה $2E/N_0$ עם $E=∫_0^T s^2dt$.", "hint": "רשום את רכיב האות הנדגם כמכפלה פנימית של $h$ עם $v(τ)=s(T-τ)$, את הספק הרעש בפלט כ-$(N_0/2)‖h‖^2$, והפעל את אי-שוויון קושי-שוורץ.", "modelAnswer": "ברגע הדגימה רכיב האות בפלט הוא $s_o(T)=∫_{-∞}^{∞}h(τ)s(T-τ)dτ=⟨h,v⟩$, כאשר $v(τ)=s(T-τ)$ הוא האות ההפוך בזמן והמוזז. רכיב הרעש הוא $n_o(T)=∫h(τ)w(T-τ)dτ$, משתנה גאוסי בעל תוחלת אפס עם $E[n_o^2]=∫∫h(τ)h(u)R_w(τ-u)dτdu=(N_0/2)∫h^2(τ)dτ=(N_0/2)‖h‖^2$, תוך שימוש ב-$R_w(τ)=(N_0/2)δ(τ)$. לכן יחס האות לרעש בפלט הוא $SNR=|⟨h,v⟩|^2/((N_0/2)‖h‖^2)$. לפי אי-שוויון קושי-שוורץ $|⟨h,v⟩|^2≤‖h‖^2‖v‖^2$, עם שוויון אם ורק אם $h=c·v$ עבור קבוע $c$ כלשהו. הצבה נותנת $SNR≤‖h‖^2‖v‖^2/((N_0/2)‖h‖^2)=‖v‖^2/(N_0/2)=2E/N_0$, שכן $‖v‖^2=∫s^2(T-τ)dτ=E$. החסם מושג בדיוק עבור $h(τ)=c·s(T-τ)$, הוא המסנן המותאם; הקבוע $c$ משנה סקאלה של האות ושל הרעש באותה מידה ולכן אינו רלוונטי, ובדרך כלל בוחרים $c=1$. שלוש הערות. (1) המקסימום תלוי ב-$s$ רק דרך האנרגיה שלו ולא דרך צורתו: פולס ארוך וחלש ופולס קצר וחזק בעלי אותה אנרגיה מתפקדים זהה. (2) הלובן נכנס רק דרך $E[n_o^2]=(N_0/2)‖h‖^2$; ברעש צבעוני יש לבצע מחדש את שלב קושי-שוורץ עם המשקל $S_n(f)$, ומתקבל $H(f)∝S^*(f)e^{-j2πfT}/S_n(f)$. (3) מקסום יחס אות לרעש אינו כשלעצמו קריטריון אופטימליות לגילוי; הוא מתלכד עם מבחן יחס הנראות משום שהרעש גאוסי, ואז הפלט הנדגם הוא סטטיסטי מספיק.", "rubric": ["מבטא את רכיב האות הנדגם כ-$∫h(τ)s(T-τ)dτ$ ומזהה את $v(τ)=s(T-τ)$.", "מחשב את הספק הרעש בפלט כ-$(N_0/2)∫h^2dτ$ מתוך $R_w(τ)=(N_0/2)δ(τ)$.", "מפעיל את קושי-שוורץ ומנסח את תנאי השוויון $h=c·v$.", "מקבל $SNR_{max}=2E/N_0$ ומציין שהתוצאה תלויה בפולס רק דרך $E$.", "מזהה היכן נעשה שימוש בלובן, או מציין שהגאוסיות היא שקושרת בין מקסום יחס אות לרעש למבחן יחס הנראות."]}}, {"id": "det-025", "area": "detection", "topic": "neyman-pearson-lemma", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["neyman-pearson", "lemma", "proof", "optimality"], "en": {"q": "Prove that among all tests with $P_{FA}≤α$, the likelihood ratio test whose threshold $η$ gives $P_{FA}=α$ maximises $P_D$. State where randomisation is needed.", "hint": "Compare the LRT with an arbitrary test through the sign of the product $(φ^*(y)-φ(y))(p_1(y)-ηp_0(y))$, pointwise in $y$.", "modelAnswer": "Represent an arbitrary test by a decision function $φ(y)$ taking values in $[0,1]$, interpreted as the probability of deciding $H_1$ after observing $y$; deterministic tests are the case $φ∈0,1$. Then $P_{FA}(φ)=∫φ(y)p_0(y)dy$ and $P_D(φ)=∫φ(y)p_1(y)dy$. Let $φ^*$ be the likelihood ratio test: $φ^*(y)=1$ where $p_1(y)>ηp_0(y)$, $φ^*(y)=0$ where $p_1(y)<ηp_0(y)$, and a constant in $[0,1]$ where $p_1(y)=ηp_0(y)$, with $η$ and that constant chosen so that $P_{FA}(φ^*)=α$. Pointwise inequality: for every $y$, $(φ^*(y)-φ(y))(p_1(y)-ηp_0(y))≥0$. Indeed where $p_1>ηp_0$ we have $φ^*=1≥φ$, so both factors are non-negative; where $p_1<ηp_0$ we have $φ^*=0≤φ$, so both are non-positive; where $p_1=ηp_0$ the second factor is zero. Integrating over $y$ preserves the inequality: $∫(φ^*-φ)(p_1-ηp_0)dy≥0$, that is $P_D(φ^*)-P_D(φ)≥η(P_{FA}(φ^*)-P_{FA}(φ))=η(α-P_{FA}(φ))$. If $φ$ obeys the constraint $P_{FA}(φ)≤α$, the right-hand side is non-negative because $η≥0$, and therefore $P_D(φ^*)≥P_D(φ)$. That is the lemma. Three comments. (i) Nothing was assumed about the densities: no Gaussianity, no symmetry, not even continuity, so the likelihood ratio is the optimal statistic for every binary problem. (ii) The argument also shows the constraint should be met with equality: unused false-alarm budget could be spent to raise $P_D$, which is why the ROC is increasing. (iii) Randomisation on the set $p_1=ηp_0$ is needed only when $L(Y)$ has an atom at $η$, as with discrete observations; then a deterministic test cannot hit $P_{FA}=α$ exactly, and randomising there interpolates linearly between the two neighbouring deterministic operating points.", "rubric": ["Introduces the decision function $φ$ with $P_{FA}=∫φp_0$ and $P_D=∫φp_1$, and defines the LRT $φ^*$ with $P_{FA}(φ^*)=α$.", "States and verifies by cases the pointwise inequality $(φ^*-φ)(p_1-ηp_0)≥0$.", "Integrates to obtain $P_D(φ^*)-P_D(φ)≥η(α-P_{FA}(φ))$.", "Uses $P_{FA}(φ)≤α$ and $η≥0$ to conclude $P_D(φ^*)≥P_D(φ)$.", "Notes that no distributional assumption is made, and that randomisation is needed only when $L(Y)$ has an atom at $η$."]}, "he": {"q": "הוכח שמבין כל המבחנים עם $P_{FA}≤α$, מבחן יחס הנראות שסִפּוֹ $η$ מקיים $P_{FA}=α$ ממקסם את $P_D$. ציין היכן נדרשת הגרלה.", "hint": "השווה בין מבחן יחס הנראות למבחן שרירותי דרך סימן המכפלה $(φ^*(y)-φ(y))(p_1(y)-ηp_0(y))$, נקודתית ב-$y$.", "modelAnswer": "נייצג מבחן שרירותי על ידי פונקציית החלטה $φ(y)$ בעלת ערכים ב-$[0,1]$, המתפרשת כהסתברות להחליט $H_1$ לאחר תצפית $y$; מבחנים דטרמיניסטיים הם המקרה שבו $φ$ מקבלת רק $0$ או $1$. אז $P_{FA}(φ)=∫φ(y)p_0(y)dy$ וכן $P_D(φ)=∫φ(y)p_1(y)dy$. יהי $φ^*$ מבחן יחס הנראות: ‏$φ^*(y)=1$ במקום שבו $p_1(y)>ηp_0(y)$, ‏$φ^*(y)=0$ במקום שבו $p_1(y)<ηp_0(y)$, וקבוע ב-$[0,1]$ במקום שבו $p_1(y)=ηp_0(y)$, כאשר $η$ והקבוע נבחרים כך ש-$P_{FA}(φ^*)=α$. אי-שוויון נקודתי: לכל $y$ מתקיים $(φ^*(y)-φ(y))(p_1(y)-ηp_0(y))≥0$. אכן, במקום שבו $p_1>ηp_0$ מתקיים $φ^*=1≥φ$ ולכן שני הגורמים אי-שליליים; במקום שבו $p_1<ηp_0$ מתקיים $φ^*=0≤φ$ ולכן שניהם אי-חיוביים; ובמקום שבו $p_1=ηp_0$ הגורם השני מתאפס. אינטגרציה על $y$ שומרת על אי-השוויון: ‏$∫(φ^*-φ)(p_1-ηp_0)dy≥0$, כלומר $P_D(φ^*)-P_D(φ)≥η(P_{FA}(φ^*)-P_{FA}(φ))=η(α-P_{FA}(φ))$. אם $φ$ מקיים את האילוץ $P_{FA}(φ)≤α$, האגף הימני אי-שלילי משום ש-$η≥0$, ולכן $P_D(φ^*)≥P_D(φ)$. זו הלמה. שלוש הערות. (א) לא הונח דבר על הצפיפויות: לא גאוסיות, לא סימטריה ואף לא רציפות, ולכן יחס הנראות הוא הסטטיסטי האופטימלי לכל בעיה בינארית. (ב) הטיעון גם מראה שיש לקיים את האילוץ בשוויון: תקציב אזעקות שווא שלא נוצל היה יכול לשמש להעלאת $P_D$, ולכן עקומת ה-ROC עולה. (ג) הגרלה על הקבוצה $p_1=ηp_0$ נדרשת רק כאשר ל-$L(Y)$ יש אטום ב-$η$, כמו בתצפיות בדידות; אז מבחן דטרמיניסטי אינו יכול לפגוע ב-$P_{FA}=α$ בדיוק, וההגרלה משרשרת לינארית בין שתי נקודות העבודה הדטרמיניסטיות השכנות.", "rubric": ["מציג את פונקציית ההחלטה $φ$ עם $P_{FA}=∫φp_0$ ו-$P_D=∫φp_1$, ומגדיר את מבחן יחס הנראות $φ^*$ עם $P_{FA}(φ^*)=α$.", "מנסח ומאמת לפי מקרים את אי-השוויון הנקודתי $(φ^*-φ)(p_1-ηp_0)≥0$.", "מבצע אינטגרציה ומקבל $P_D(φ^*)-P_D(φ)≥η(α-P_{FA}(φ))$.", "משתמש ב-$P_{FA}(φ)≤α$ וב-$η≥0$ כדי להסיק $P_D(φ^*)≥P_D(φ)$.", "מציין שלא נעשתה הנחה התפלגותית, ושהגרלה נדרשת רק כאשר ל-$L(Y)$ יש אטום ב-$η$."]}}, {"id": "det-026", "area": "detection", "topic": "sufficient-statistic", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["sufficient-statistic", "orthonormal-basis", "white-gaussian-noise", "factorisation"], "en": {"q": "On $[0,T]$ we receive $y(t)=θs(t)+w(t)$, where $θ$ is $0$ or $1$ and $w$ is white Gaussian noise of PSD $N_0/2$. Explain why $z=∫_0^T y(t)s(t)dt$ is a sufficient statistic, and what is lost by discarding the rest of $y$.", "hint": "Expand $y$ in an orthonormal basis whose first element is $s/√E$, and look at how $θ$ enters each coefficient.", "modelAnswer": "Choose an orthonormal basis $φ_1,φ_2,...$ of the signal space with $φ_1(t)=s(t)/√E$, where $E=∫_0^T s^2dt$, and set $y_k=∫y(t)φ_k(t)dt$. Since $∫sφ_1=√E$ and $∫sφ_k=0$ for $k≥2$, we get $y_1=θ√E+w_1$ and $y_k=w_k$ for every $k≥2$. For white Gaussian noise the coefficients $w_k$ in any orthonormal basis are uncorrelated with common variance $N_0/2$, and being jointly Gaussian they are therefore independent. The joint density thus factorises as $p(y|θ)=p(y_1|θ)·∏_{k≥2}p(w_k)$, where the product does not involve $θ$. Forming the likelihood ratio, every factor with $k≥2$ appears identically in numerator and denominator and cancels: $L(y)=p(y_1|θ=1)/p(y_1|θ=0)$. So the optimal test depends on the data only through $y_1$, equivalently through $z=√E·y_1$, and this is exactly the Fisher-Neyman factorisation $p(y|θ)=g(z,θ)h(y)$ that defines a sufficient statistic. Nothing is lost by discarding the other coordinates: they are independent of $y_1$ and their distribution does not depend on $θ$, so no function of them can improve any decision rule; they are pure noise living in directions orthogonal to the signal. Two caveats show where the argument bites. (i) Independence of the $w_k$ used both whiteness and Gaussianity. If the noise were coloured, the coefficients along other basis functions would be correlated with $w_1$ and could be used to predict and partly subtract it — which is precisely what a whitening filter exploits, and why $z$ alone is then not sufficient. (ii) If the noise were white but non-Gaussian, uncorrelatedness would not imply independence, the factorisation would fail, and the discarded coordinates could still carry information about $θ$.", "rubric": ["Builds an orthonormal basis with $φ_1=s/√E$ and writes $y_1=θ√E+w_1$, $y_k=w_k$ for $k≥2$.", "States that white Gaussian noise gives independent $N(0,N_0/2)$ coefficients in any orthonormal basis.", "Shows the likelihood ratio depends only on $y_1$ (equivalently $z$) because the $k≥2$ factors cancel — Fisher-Neyman factorisation.", "Concludes nothing is lost: the discarded coordinates are independent of $z$ and their law does not depend on $θ$.", "Notes the argument rests on whiteness and Gaussianity, and identifies what changes for coloured or non-Gaussian noise."]}, "he": {"q": "על $[0,T]$ מתקבל $y(t)=θs(t)+w(t)$, כאשר $θ$ שווה $0$ או $1$ ו-$w$ הוא רעש גאוסי לבן בעל PSD ‏$N_0/2$. הסבר מדוע $z=∫_0^T y(t)s(t)dt$ הוא סטטיסטי מספיק, ומה אובד בהשלכת שאר $y$.", "hint": "פתח את $y$ בבסיס אורתונורמלי שאיברו הראשון הוא $s/√E$, ובחן כיצד $θ$ נכנס לכל מקדם.", "modelAnswer": "נבחר בסיס אורתונורמלי $φ_1,φ_2,...$ של מרחב האותות עם $φ_1(t)=s(t)/√E$, כאשר $E=∫_0^T s^2dt$, ונגדיר $y_k=∫y(t)φ_k(t)dt$. מכיוון ש-$∫sφ_1=√E$ ו-$∫sφ_k=0$ לכל $k≥2$, מתקבל $y_1=θ√E+w_1$ ו-$y_k=w_k$ לכל $k≥2$. עבור רעש גאוסי לבן המקדמים $w_k$ בכל בסיס אורתונורמלי הם בלתי מתואמים בעלי שונות משותפת $N_0/2$, ומכיוון שהם גאוסיים במשותף הם גם בלתי תלויים. לכן הצפיפות המשותפת מתפרקת ל-$p(y|θ)=p(y_1|θ)·∏_{k≥2}p(w_k)$, כאשר המכפלה אינה תלויה ב-$θ$. בבניית יחס הנראות כל גורם עם $k≥2$ מופיע זהה במונה ובמכנה ומצטמצם: ‏$L(y)=p(y_1|θ=1)/p(y_1|θ=0)$. לכן המבחן האופטימלי תלוי בנתונים רק דרך $y_1$, ובאופן שקול דרך $z=√E·y_1$, וזוהי בדיוק פירוק פישר-ניימן $p(y|θ)=g(z,θ)h(y)$ המגדיר סטטיסטי מספיק. דבר אינו אובד בהשלכת יתר הקואורדינטות: הן בלתי תלויות ב-$y_1$ והתפלגותן אינה תלויה ב-$θ$, ולכן שום פונקציה שלהן אינה יכולה לשפר כלל החלטה כלשהו; הן רעש טהור החי בכיוונים אורתוגונליים לאות. שתי הסתייגויות מראות היכן הטיעון נשען. (א) אי-התלות של $w_k$ השתמשה גם בלובן וגם בגאוסיות. אילו הרעש היה צבעוני, המקדמים לאורך פונקציות בסיס אחרות היו מתואמים עם $w_1$ וניתן היה להשתמש בהם כדי לחזות ולחסר אותו חלקית — וזה בדיוק מה שמסנן מלבין מנצל, ולכן אז $z$ לבדו אינו מספיק. (ב) אילו הרעש היה לבן אך לא גאוסי, חוסר תיאום לא היה גורר אי-תלות, הפירוק היה נכשל, והקואורדינטות שהושלכו היו עשויות עדיין לשאת מידע על $θ$.", "rubric": ["בונה בסיס אורתונורמלי עם $φ_1=s/√E$ ורושם $y_1=θ√E+w_1$, ‏$y_k=w_k$ לכל $k≥2$.", "מציין שרעש גאוסי לבן נותן מקדמים בלתי תלויים $N(0,N_0/2)$ בכל בסיס אורתונורמלי.", "מראה שיחס הנראות תלוי רק ב-$y_1$ (ובאופן שקול ב-$z$) כי הגורמים עם $k≥2$ מצטמצמים — פירוק פישר-ניימן.", "מסיק שדבר אינו אובד: הקואורדינטות שהושלכו בלתי תלויות ב-$z$ והתפלגותן אינה תלויה ב-$θ$.", "מציין שהטיעון נשען על לובן ועל גאוסיות, ומזהה מה משתנה ברעש צבעוני או לא גאוסי."]}}, {"id": "mkv-001", "area": "markov", "topic": "markov-property", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["markov-property", "conditional-independence", "definition"], "answer": 0, "en": {"q": "Let $X_0,X_1,X_2,…$ be a discrete-time chain on a finite state space. Which equation is exactly the Markov property?", "options": ["$P(X_{n+1}=j|X_n=i,X_{n-1},…,X_0)=P(X_{n+1}=j|X_n=i)$", "$P(X_{n+1}=j|X_n=i)=P(X_{n+1}=j)$, so successive states are independent", "$P(X_{n+1}=j|X_n=i)$ is the same for every $n$, so the chain is homogeneous", "$P(X_n=i|X_{n+1}=j,…,X_N)=P(X_n=i)$, so the past ignores the future"], "hint": "The property says the present state screens off the whole past; it says nothing about the transition probabilities being constant in time.", "explanation": "The Markov property is a conditional-independence statement: given the present state $X_n=i$, the next state is conditionally independent of the entire history $X_{n-1},…,X_0$. That is $P(X_{n+1}=j|X_n=i,X_{n-1},…,X_0)=P(X_{n+1}=j|X_n=i)=p_{ij}$. It does not make consecutive states independent (they are strongly dependent through $p_{ij}$), and it is logically separate from time-homogeneity, which is the extra assumption that $p_{ij}$ does not depend on $n$. A chain can be Markov and inhomogeneous.", "whyWrong": ["That is full independence of consecutive states, which would make the transition matrix have identical rows; a Markov chain is normally strongly dependent from step to step.", "That is time-homogeneity, an additional assumption. A chain whose transition matrix changes with $n$ is still Markov.", "Conditioning on the future does not remove the dependence: the chain is Markov in both time directions, but the reversed statement still keeps a conditioning on $X_{n+1}$."]}, "he": {"q": "יהי $X_0,X_1,X_2,…$ שרשרת בזמן בדיד על מרחב מצבים סופי. איזו משוואה היא בדיוק תכונת מרקוב?", "options": ["$P(X_{n+1}=j|X_n=i,X_{n-1},…,X_0)=P(X_{n+1}=j|X_n=i)$", "$P(X_{n+1}=j|X_n=i)=P(X_{n+1}=j)$, ולכן מצבים עוקבים בלתי תלויים", "$P(X_{n+1}=j|X_n=i)$ זהה לכל $n$, ולכן השרשרת הומוגנית בזמן", "$P(X_n=i|X_{n+1}=j,…,X_N)=P(X_n=i)$, ולכן העבר מתעלם מהעתיד"], "hint": "התכונה אומרת שהמצב הנוכחי חוסם את כל העבר; היא אינה אומרת דבר על כך שהסתברויות המעבר קבועות בזמן.", "explanation": "תכונת מרקוב היא טענת אי-תלות מותנית: בהינתן המצב הנוכחי $X_n=i$, המצב הבא בלתי תלוי מותנית בכל ההיסטוריה $X_{n-1},…,X_0$. כלומר $P(X_{n+1}=j|X_n=i,X_{n-1},…,X_0)=P(X_{n+1}=j|X_n=i)=p_{ij}$. היא אינה הופכת מצבים עוקבים לבלתי תלויים (הם תלויים מאוד דרך $p_{ij}$), והיא נפרדת לוגית מהומוגניות בזמן, שהיא ההנחה הנוספת ש-$p_{ij}$ אינו תלוי ב-$n$. שרשרת יכולה להיות מרקובית ולא הומוגנית.", "whyWrong": ["זו אי-תלות מלאה בין מצבים עוקבים, שהייתה מאלצת שורות זהות במטריצת המעבר; שרשרת מרקוב בדרך כלל תלויה מאוד מצעד לצעד.", "זו הומוגניות בזמן, הנחה נוספת. שרשרת שמטריצת המעבר שלה משתנה עם $n$ עדיין מרקובית.", "התניה על העתיד אינה מבטלת את התלות: השרשרת מרקובית בשני כיווני הזמן, אך הטענה ההפוכה עדיין שומרת התניה על $X_{n+1}$."]}}, {"id": "mkv-002", "area": "markov", "topic": "n-step-transition-matrix", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["transition-matrix", "matrix-power", "two-step"], "answer": 2, "en": {"q": "A two-state chain has transition matrix rows $(0.8,0.2)$ and $(0.4,0.6)$ (states $1,2$). The initial distribution is $π_0=(0.5,0.5)$. Compute $P(X_2=1)$.", "options": ["$0.60$", "$0.72$", "$0.64$", "$0.56$"], "hint": "Either square $P$ and take the first column, or propagate the row vector twice: $π_2=π_0P^2$.", "explanation": "Propagate once: $π_1=π_0P=(0.5·0.8+0.5·0.4, 0.5·0.2+0.5·0.6)=(0.6,0.4)$. Propagate again: $π_2=π_1P=(0.6·0.8+0.4·0.4, 0.6·0.2+0.4·0.6)=(0.48+0.16, 0.12+0.24)=(0.64,0.36)$. So $P(X_2=1)=0.64$. Equivalently $P^2$ has rows $(0.72,0.28)$ and $(0.56,0.44)$, and $P(X_2=1)=0.5(0.72)+0.5(0.56)=0.64$.", "whyWrong": ["$0.60$ is $P(X_1=1)$: one propagation step only, stopping at $π_1=(0.6,0.4)$.", "$0.72$ is $p_{11}^{(2)}$, the two-step probability conditioned on starting in state $1$; it ignores the initial distribution.", "$0.56$ is $p_{21}^{(2)}$, the two-step probability from state $2$, again ignoring that both starts are equally likely."]}, "he": {"q": "לשרשרת דו-מצבית מטריצת מעבר עם שורות $(0.8,0.2)$ ו-$(0.4,0.6)$ (מצבים $1,2$). ההתפלגות ההתחלתית היא $π_0=(0.5,0.5)$. חשב את $P(X_2=1)$.", "options": ["$0.60$", "$0.72$", "$0.64$", "$0.56$"], "hint": "אפשר להעלות את $P$ בריבוע ולקחת את העמודה הראשונה, או להתקדם פעמיים עם וקטור השורה: $π_2=π_0P^2$.", "explanation": "צעד ראשון: $π_1=π_0P=(0.5·0.8+0.5·0.4, 0.5·0.2+0.5·0.6)=(0.6,0.4)$. צעד שני: $π_2=π_1P=(0.6·0.8+0.4·0.4, 0.6·0.2+0.4·0.6)=(0.48+0.16, 0.12+0.24)=(0.64,0.36)$. לכן $P(X_2=1)=0.64$. שקול לכך, $P^2$ הוא בעל שורות $(0.72,0.28)$ ו-$(0.56,0.44)$, ולכן $P(X_2=1)=0.5(0.72)+0.5(0.56)=0.64$.", "whyWrong": ["הערך $0.60$ הוא $P(X_1=1)$: צעד התקדמות אחד בלבד, עצירה ב-$π_1=(0.6,0.4)$.", "הערך $0.72$ הוא $p_{11}^{(2)}$, הסתברות דו-צעדית בהתניה על התחלה במצב $1$; היא מתעלמת מההתפלגות ההתחלתית.", "הערך $0.56$ הוא $p_{21}^{(2)}$, ההסתברות הדו-צעדית ממצב $2$, ושוב תוך התעלמות מכך ששתי ההתחלות שוות סיכוי."]}}, {"id": "mkv-003", "area": "markov", "topic": "chapman-kolmogorov", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["chapman-kolmogorov", "n-step", "matrix-product"], "answer": 1, "en": {"q": "For a homogeneous chain, which identity is the Chapman-Kolmogorov equation for the $(m+n)$-step transition probabilities?", "options": ["$p_{ij}^{(m+n)}=p_{ij}^{(m)}·p_{ij}^{(n)}$", "$p_{ij}^{(m+n)}=Σ_k p_{ik}^{(m)}p_{kj}^{(n)}$", "$p_{ij}^{(m+n)}=Σ_k p_{ik}^{(m)}p_{jk}^{(n)}$", "$p_{ij}^{(m+n)}=Σ_k p_{ki}^{(m)}p_{kj}^{(n)}$"], "hint": "Condition on where the chain is at the intermediate time $m$, and sum over all possibilities. In matrix form it is simply $P^{m+n}=P^mP^n$.", "explanation": "Split the journey at time $m$: $P(X_{m+n}=j|X_0=i)=Σ_k P(X_m=k|X_0=i)P(X_{m+n}=j|X_m=k)$, where the Markov property lets the second factor forget the start. Hence $p_{ij}^{(m+n)}=Σ_k p_{ik}^{(m)}p_{kj}^{(n)}$, which is exactly the $(i,j)$ entry of the matrix product, i.e. $P^{m+n}=P^mP^n$. The intermediate index $k$ must be the column index of the first factor and the row index of the second.", "whyWrong": ["There is no sum over the intermediate state, and a product of two entries with the same pair $(i,j)$ has no probabilistic meaning.", "The second factor is transposed: $p_{jk}^{(n)}$ starts at $j$ instead of ending at $j$, so the indices do not chain together.", "The first factor is transposed: $p_{ki}^{(m)}$ ends at $i$ rather than starting there, so the path never leaves $i$ correctly."]}, "he": {"q": "עבור שרשרת הומוגנית, איזו זהות היא משוואת צ'פמן-קולמוגורוב עבור הסתברויות המעבר ב-$(m+n)$ צעדים?", "options": ["$p_{ij}^{(m+n)}=p_{ij}^{(m)}·p_{ij}^{(n)}$", "$p_{ij}^{(m+n)}=Σ_k p_{ik}^{(m)}p_{kj}^{(n)}$", "$p_{ij}^{(m+n)}=Σ_k p_{ik}^{(m)}p_{jk}^{(n)}$", "$p_{ij}^{(m+n)}=Σ_k p_{ki}^{(m)}p_{kj}^{(n)}$"], "hint": "התנה על מיקום השרשרת בזמן הביניים $m$, וסכום על כל האפשרויות. בצורה מטריצית זה פשוט $P^{m+n}=P^mP^n$.", "explanation": "נפצל את המסלול בזמן $m$: ‏$P(X_{m+n}=j|X_0=i)=Σ_k P(X_m=k|X_0=i)P(X_{m+n}=j|X_m=k)$, כאשר תכונת מרקוב מאפשרת לגורם השני לשכוח את נקודת ההתחלה. לכן $p_{ij}^{(m+n)}=Σ_k p_{ik}^{(m)}p_{kj}^{(n)}$, וזהו בדיוק האיבר $(i,j)$ של מכפלת המטריצות, כלומר $P^{m+n}=P^mP^n$. אינדקס הביניים $k$ חייב להיות אינדקס העמודה של הגורם הראשון ואינדקס השורה של השני.", "whyWrong": ["אין סכימה על מצב הביניים, ומכפלה של שני איברים עם אותו זוג $(i,j)$ חסרת משמעות הסתברותית.", "הגורם השני משוחלף: ‏$p_{jk}^{(n)}$ מתחיל ב-$j$ במקום להסתיים ב-$j$, ולכן האינדקסים אינם משתרשרים.", "הגורם הראשון משוחלף: ‏$p_{ki}^{(m)}$ מסתיים ב-$i$ במקום להתחיל בו, ולכן המסלול אינו יוצא מ-$i$ כראוי."]}}, {"id": "mkv-004", "area": "markov", "topic": "state-classification", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["transient", "recurrent", "absorbing", "gamblers-ruin"], "answer": 3, "en": {"q": "A chain on ${1,2,3,4}$ has $p_{11}=1$, $p_{44}=1$, $p_{21}=p_{23}=1/2$, $p_{32}=p_{34}=1/2$. Classify the states.", "options": ["All four are recurrent, because a finite chain always returns to every state", "States $2,3$ are recurrent; states $1,4$ are transient and absorbing", "State $1$ is absorbing, $2,3,4$ are transient, and the chain is irreducible", "States $1,4$ are absorbing hence recurrent; states $2,3$ are transient"], "hint": "From $2$ or $3$ there is a strictly positive probability of leaving forever. From $1$ or $4$ the chain can never leave at all.", "explanation": "This is gambler's ruin on ${1,2,3,4}$. States $1$ and $4$ satisfy $p_{ii}=1$: once entered they are never left, so they are absorbing and therefore recurrent (return probability $1$). From state $2$ there is probability $1/2$ of moving to $1$ and being trapped forever, so the probability of ever returning to $2$ is strictly less than $1$; state $2$ is transient, and the same argument applies to $3$ via state $4$. A finite chain must have at least one recurrent class, but individual states can certainly be transient. The chain is reducible: it has three communicating classes ${1},{2,3},{4}$.", "whyWrong": ["Finiteness only guarantees that some state is recurrent, not all of them; here $2$ and $3$ are escaped from with probability $1$.", "The classification is exactly inverted: absorbing states are the extreme case of recurrent, never transient.", "State $4$ is absorbing too, and a chain with two absorbing states cannot be irreducible since $1$ and $4$ do not communicate."]}, "he": {"q": "לשרשרת על ${1,2,3,4}$ מתקיים $p_{11}=1$, $p_{44}=1$, $p_{21}=p_{23}=1/2$, $p_{32}=p_{34}=1/2$. סווג את המצבים.", "options": ["כל הארבעה נשנים, כי שרשרת סופית תמיד חוזרת לכל מצב", "המצבים $2,3$ נשנים; המצבים $1,4$ חולפים ובולעים", "מצב $1$ בולע, $2,3,4$ חולפים, והשרשרת אי-פריקה", "המצבים $1,4$ בולעים ולכן נשנים; המצבים $2,3$ חולפים"], "hint": "מ-$2$ או מ-$3$ יש הסתברות חיובית ממש לעזוב לתמיד. מ-$1$ או מ-$4$ השרשרת אינה יכולה לעזוב כלל.", "explanation": "זוהי בעיית הימורי המהמר על ${1,2,3,4}$. המצבים $1$ ו-$4$ מקיימים $p_{ii}=1$: לאחר הכניסה אליהם לא עוזבים אותם, ולכן הם בולעים ומכאן נשנים (הסתברות חזרה $1$). ממצב $2$ יש הסתברות $1/2$ לעבור ל-$1$ ולהילכד לתמיד, ולכן ההסתברות לחזור אי פעם ל-$2$ קטנה ממש מ-$1$; מצב $2$ חולף, ואותו נימוק חל על $3$ דרך מצב $4$. בשרשרת סופית חייבת להיות לפחות מחלקה נשנית אחת, אך מצבים בודדים בהחלט יכולים להיות חולפים. השרשרת פריקה: יש בה שלוש מחלקות תקשורת ${1},{2,3},{4}$.", "whyWrong": ["סופיות מבטיחה רק שקיים מצב נשנה, לא שכולם נשנים; כאן בורחים מ-$2$ ומ-$3$ בהסתברות $1$.", "הסיווג הפוך בדיוק: מצב בולע הוא המקרה הקיצוני של נשנה, ולעולם אינו חולף.", "גם מצב $4$ בולע, ושרשרת עם שני מצבים בולעים אינה יכולה להיות אי-פריקה שכן $1$ ו-$4$ אינם מתקשרים."]}}, {"id": "mkv-005", "area": "markov", "topic": "period-of-a-state", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["periodicity", "aperiodicity", "gcd", "irreducible"], "answer": 0, "en": {"q": "An irreducible chain on ${A,B,C}$ has $p_{AB}=1$, $p_{BC}=1$, $p_{CA}=p_{CB}=1/2$. What is the period of state $A$?", "options": ["Period $1$; the chain is aperiodic", "Period $2$; the chain is periodic", "Period $3$, fixed by the cycle $A→B→C→A$", "Undefined, because no state has a self-loop"], "hint": "The period is the gcd of all $n$ with $p_{AA}^{(n)}>0$. Find two return lengths whose greatest common divisor is $1$.", "explanation": "The period of $i$ is $d(i)=gcd{n≥1: p_{ii}^{(n)}>0}$. From $A$ the path $A→B→C→A$ returns in $3$ steps, so $3$ is a return time. The path $A→B→C→B→C→A$ returns in $5$ steps, using the extra $C→B$ edge. Since $gcd(3,5)=1$, we get $d(A)=1$ and $A$ is aperiodic. Period is a class property, so in this irreducible chain every state is aperiodic; being irreducible and aperiodic (and finite), the chain has a limiting distribution equal to its unique stationary distribution.", "whyWrong": ["Period $2$ would require every return length to be even, but $A$ returns in $3$ steps.", "The $3$-cycle is only one of the available loops; the extra edge $C→B$ creates returns of length $5$, and $gcd(3,5)=1$.", "Self-loops make aperiodicity obvious but are not necessary; the period is defined for every state of every chain."]}, "he": {"q": "לשרשרת אי-פריקה על ${A,B,C}$ מתקיים $p_{AB}=1$, $p_{BC}=1$, $p_{CA}=p_{CB}=1/2$. מהי המחזוריות של מצב $A$?", "options": ["מחזוריות $1$; השרשרת אי-מחזורית", "מחזוריות $2$; השרשרת מחזורית", "מחזוריות $3$, שנקבעת על ידי המעגל $A→B→C→A$", "לא מוגדרת, כי לאף מצב אין לולאה עצמית"], "hint": "המחזוריות היא המחלק המשותף המרבי של כל $n$ שעבורם $p_{AA}^{(n)}>0$. מצא שני אורכי חזרה שהמחלק המשותף המרבי שלהם הוא $1$.", "explanation": "המחזוריות של $i$ היא $d(i)=gcd{n≥1: p_{ii}^{(n)}>0}$. מ-$A$ המסלול $A→B→C→A$ חוזר ב-$3$ צעדים, ולכן $3$ הוא זמן חזרה אפשרי. המסלול $A→B→C→B→C→A$ חוזר ב-$5$ צעדים, תוך שימוש בקשת הנוספת $C→B$. מכיוון ש-$gcd(3,5)=1$, מתקבל $d(A)=1$ ומצב $A$ אי-מחזורי. מחזוריות היא תכונת מחלקה, ולכן בשרשרת אי-פריקה זו כל המצבים אי-מחזוריים; בהיותה אי-פריקה, אי-מחזורית וסופית, יש לשרשרת התפלגות גבולית השווה להתפלגות הסטציונרית היחידה שלה.", "whyWrong": ["מחזוריות $2$ הייתה דורשת שכל אורכי החזרה יהיו זוגיים, אך $A$ חוזר גם ב-$3$ צעדים.", "המעגל באורך $3$ הוא רק אחת הלולאות האפשריות; הקשת הנוספת $C→B$ יוצרת חזרות באורך $5$, ו-$gcd(3,5)=1$.", "לולאות עצמיות הופכות אי-מחזוריות למובנת מאליה אך אינן הכרחיות; המחזוריות מוגדרת לכל מצב בכל שרשרת."]}}, {"id": "mkv-006", "area": "markov", "topic": "stationary-distribution-2state", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["stationary-distribution", "balance-equations", "two-state"], "answer": 2, "en": {"q": "A two-state chain has rows $(0.7,0.3)$ and $(0.4,0.6)$. Solve $πP=π$ with $π_1+π_2=1$.", "options": ["$π=(0.5,0.5)$", "$π=(3/7,4/7)$", "$π=(4/7,3/7)$", "$π=(0.7,0.3)$"], "hint": "For a two-state chain the flow out of state $1$ must equal the flow into it: $π_1p_{12}=π_2p_{21}$.", "explanation": "The first balance equation is $π_1=0.7π_1+0.4π_2$, i.e. $0.3π_1=0.4π_2$, so $π_1/π_2=4/3$. With $π_1+π_2=1$ this gives $π=(4/7,3/7)≈(0.571,0.429)$. Check: $0.7(4/7)+0.4(3/7)=2.8/7+1.2/7=4/7$ and $0.3(4/7)+0.6(3/7)=1.2/7+1.8/7=3/7$. In general a two-state chain with $p_{12}=a$, $p_{21}=b$ has $π=(b,a)/(a+b)$; here $a=0.3$, $b=0.4$, giving $(0.4,0.3)/0.7=(4/7,3/7)$.", "whyWrong": ["$(0.5,0.5)$ would be stationary only if $P$ were doubly stochastic, i.e. if $p_{12}=p_{21}$; here $0.3≠0.4$.", "$(3/7,4/7)$ swaps the two rates: it uses $π∝(p_{12},p_{21})$ instead of $π∝(p_{21},p_{12})$.", "$(0.7,0.3)$ is just the first row of $P$; a row of $P$ is a conditional distribution, not a fixed point of $πP=π$."]}, "he": {"q": "לשרשרת דו-מצבית שורות $(0.7,0.3)$ ו-$(0.4,0.6)$. פתור את $πP=π$ עם $π_1+π_2=1$.", "options": ["$π=(0.5,0.5)$", "$π=(3/7,4/7)$", "$π=(4/7,3/7)$", "$π=(0.7,0.3)$"], "hint": "בשרשרת דו-מצבית הזרימה החוצה ממצב $1$ חייבת להיות שווה לזרימה פנימה אליו: $π_1p_{12}=π_2p_{21}$.", "explanation": "משוואת האיזון הראשונה היא $π_1=0.7π_1+0.4π_2$, כלומר $0.3π_1=0.4π_2$, ולכן $π_1/π_2=4/3$. עם $π_1+π_2=1$ מתקבל $π=(4/7,3/7)≈(0.571,0.429)$. בדיקה: $0.7(4/7)+0.4(3/7)=2.8/7+1.2/7=4/7$ וכן $0.3(4/7)+0.6(3/7)=1.2/7+1.8/7=3/7$. באופן כללי, לשרשרת דו-מצבית עם $p_{12}=a$ ו-$p_{21}=b$ מתקיים $π=(b,a)/(a+b)$; כאן $a=0.3$, $b=0.4$, ולכן $(0.4,0.3)/0.7=(4/7,3/7)$.", "whyWrong": ["הווקטור $(0.5,0.5)$ היה סטציונרי רק אילו $P$ הייתה סטוכסטית כפולה, כלומר $p_{12}=p_{21}$; כאן $0.3≠0.4$.", "הווקטור $(3/7,4/7)$ מחליף בין שני הקצבים: הוא משתמש ב-$π∝(p_{12},p_{21})$ במקום ב-$π∝(p_{21},p_{12})$.", "הווקטור $(0.7,0.3)$ הוא פשוט השורה הראשונה של $P$; שורה של $P$ היא התפלגות מותנית ולא נקודת שבת של $πP=π$."]}}, {"id": "mkv-007", "area": "markov", "topic": "birth-death-detailed-balance", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["birth-death", "detailed-balance", "stationary-distribution"], "answer": 1, "en": {"q": "A birth-death chain on ${0,1,2}$ has rows $(1/2,1/2,0)$, $(1/4,1/2,1/4)$ and $(0,1/2,1/2)$. Find the stationary distribution.", "options": ["$π=(1/3,1/3,1/3)$", "$π=(1/4,1/2,1/4)$", "$π=(1/2,1/4,1/4)$", "$π=(2/5,2/5,1/5)$"], "hint": "A birth-death chain is reversible, so use the detailed-balance relations $π_0p_{01}=π_1p_{10}$ and $π_1p_{12}=π_2p_{21}$.", "explanation": "Detailed balance across the cut between $0$ and $1$: $π_0(1/2)=π_1(1/4)$, so $π_1=2π_0$. Across the cut between $1$ and $2$: $π_1(1/4)=π_2(1/2)$, so $π_2=π_1/2=π_0$. Hence $π∝(1,2,1)$ and normalising gives $π=(1/4,1/2,1/4)$. Verify with $πP$: first entry $(1/4)(1/2)+(1/2)(1/4)=1/4$; second $(1/4)(1/2)+(1/2)(1/2)+(1/4)(1/2)=1/2$; third $(1/2)(1/4)+(1/4)(1/2)=1/4$. All match.", "whyWrong": ["The uniform vector is stationary only for a doubly stochastic matrix; here the columns of $P$ do not sum to $1$.", "$(1/2,1/4,1/4)$ inverts the balance ratio at the first cut, using $π_1=π_0/2$ instead of $π_1=2π_0$.", "$(2/5,2/5,1/5)$ breaks the symmetry of the chain: states $0$ and $2$ have mirror-image dynamics, so $π_0$ must equal $π_2$."]}, "he": {"q": "לשרשרת לידה-מוות על ${0,1,2}$ שורות $(1/2,1/2,0)$, ‏$(1/4,1/2,1/4)$ ו-$(0,1/2,1/2)$. מצא את ההתפלגות הסטציונרית.", "options": ["$π=(1/3,1/3,1/3)$", "$π=(1/4,1/2,1/4)$", "$π=(1/2,1/4,1/4)$", "$π=(2/5,2/5,1/5)$"], "hint": "שרשרת לידה-מוות הפיכה, ולכן השתמש ביחסי האיזון המפורט $π_0p_{01}=π_1p_{10}$ ו-$π_1p_{12}=π_2p_{21}$.", "explanation": "איזון מפורט על החתך בין $0$ ל-$1$: ‏$π_0(1/2)=π_1(1/4)$, ולכן $π_1=2π_0$. על החתך בין $1$ ל-$2$: ‏$π_1(1/4)=π_2(1/2)$, ולכן $π_2=π_1/2=π_0$. מכאן $π∝(1,2,1)$ ולאחר נרמול $π=(1/4,1/2,1/4)$. אימות באמצעות $πP$: הרכיב הראשון $(1/4)(1/2)+(1/2)(1/4)=1/4$; השני $(1/4)(1/2)+(1/2)(1/2)+(1/4)(1/2)=1/2$; השלישי $(1/2)(1/4)+(1/4)(1/2)=1/4$. הכול מתאים.", "whyWrong": ["הווקטור האחיד סטציונרי רק עבור מטריצה סטוכסטית כפולה; כאן העמודות של $P$ אינן מסתכמות ל-$1$.", "הווקטור $(1/2,1/4,1/4)$ הופך את יחס האיזון בחתך הראשון, ומשתמש ב-$π_1=π_0/2$ במקום ב-$π_1=2π_0$.", "הווקטור $(2/5,2/5,1/5)$ שובר את סימטריית השרשרת: למצבים $0$ ו-$2$ דינמיקה מראה, ולכן חייב להתקיים $π_0=π_2$."]}}, {"id": "mkv-008", "area": "markov", "topic": "expected-absorption-time", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["absorption-time", "hitting-time", "first-step-analysis"], "answer": 3, "en": {"q": "A symmetric walk on ${0,1,2,3,4}$ moves $±1$ with probability $1/2$ from interior states; $0$ and $4$ are absorbing. Starting at $1$, what is the expected number of steps to absorption?", "options": ["$2$ steps", "$6$ steps", "$4$ steps", "$3$ steps"], "hint": "First-step analysis: $h_k=1+(h_{k-1}+h_{k+1})/2$ for $k=1,2,3$, with $h_0=h_4=0$. Or recall $h_k=k(N-k)$.", "explanation": "Let $h_k$ be the expected time to absorption from $k$. First-step analysis gives $h_k=1+(1/2)h_{k-1}+(1/2)h_{k+1}$ for $k=1,2,3$, with $h_0=h_4=0$. By symmetry $h_1=h_3$, so $h_1=1+h_2/2$ and $h_2=1+h_1$. Substituting, $h_1=1+(1+h_1)/2$, giving $h_1/2=3/2$ and $h_1=3$; then $h_2=4$ and $h_3=3$. Checks: $h_2=1+(3+3)/2=4$ and $h_1=1+(0+4)/2=3$. This matches the general formula $h_k=k(N-k)$ with $N=4$: $h_1=1·3=3$.", "whyWrong": ["$2$ is the expected number of steps only if absorption from $1$ needed just the single step to $0$ or a single excursion; the walk can wander for many steps.", "$6$ would be the answer for $N=6$ starting at $1$ ($1·5$), or from mis-setting the boundary at $5$ instead of $4$.", "$4$ is $h_2$, the absorption time from the middle state, not from state $1$."]}, "he": {"q": "הילוך סימטרי על ${0,1,2,3,4}$ זז ב-$±1$ בהסתברות $1/2$ ממצבים פנימיים; המצבים $0$ ו-$4$ בולעים. בהתחלה ממצב $1$, מהו מספר הצעדים הצפוי עד בליעה?", "options": ["$2$ צעדים", "$6$ צעדים", "$4$ צעדים", "$3$ צעדים"], "hint": "ניתוח צעד ראשון: $h_k=1+(h_{k-1}+h_{k+1})/2$ עבור $k=1,2,3$, עם $h_0=h_4=0$. או היזכר בנוסחה $h_k=k(N-k)$.", "explanation": "יהי $h_k$ הזמן הצפוי לבליעה מ-$k$. ניתוח צעד ראשון נותן $h_k=1+(1/2)h_{k-1}+(1/2)h_{k+1}$ עבור $k=1,2,3$, עם $h_0=h_4=0$. מסימטריה $h_1=h_3$, ולכן $h_1=1+h_2/2$ וכן $h_2=1+h_1$. הצבה נותנת $h_1=1+(1+h_1)/2$, ומכאן $h_1/2=3/2$ ו-$h_1=3$; לאחר מכן $h_2=4$ ו-$h_3=3$. בדיקות: $h_2=1+(3+3)/2=4$ וכן $h_1=1+(0+4)/2=3$. זה תואם לנוסחה הכללית $h_k=k(N-k)$ עם $N=4$: ‏$h_1=1·3=3$.", "whyWrong": ["הערך $2$ מתאים רק אילו הבליעה מ-$1$ דרשה צעד בודד ל-$0$ או סיור יחיד; ההילוך יכול לנדוד צעדים רבים.", "הערך $6$ מתאים ל-$N=6$ בהתחלה ממצב $1$ (כלומר $1·5$), או לקביעה שגויה של הגבול ב-$5$ במקום ב-$4$.", "הערך $4$ הוא $h_2$, זמן הבליעה מהמצב האמצעי ולא ממצב $1$."]}}, {"id": "mkv-009", "area": "markov", "topic": "ctmc-generator-holding-times", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["continuous-time", "generator-matrix", "holding-time", "stationary"], "answer": 0, "en": {"q": "A two-state CTMC has generator rows $(-2, 2)$ and $(3, -3)$ (rates per second). Give the mean holding time in state $1$ and the long-run fraction of time spent in state $1$.", "options": ["mean $1/2$ s, fraction $3/5$", "mean $2$ s, fraction $3/5$", "mean $1/2$ s, fraction $2/5$", "mean $1/3$ s, fraction $2/5$"], "hint": "The holding time in state $i$ is exponential with rate $q_i=-q_{ii}$. The stationary vector solves $πQ=0$, not $πQ=π$.", "explanation": "The exit rate from state $1$ is $q_1=-q_{11}=2$ per second, so the holding time is $Exp(2)$ with mean $1/q_1=1/2$ s. For the stationary distribution solve $πQ=0$: the first component gives $-2π_1+3π_2=0$, so $π_1=(3/2)π_2$; with $π_1+π_2=1$ this yields $π=(3/5,2/5)$. Check: $(3/5)(-2)+(2/5)(3)=-6/5+6/5=0$. Equivalently each $π_i$ is proportional to the mean holding time times the visit frequency; here the embedded chain alternates, so $π∝(1/2,1/3)∝(3,2)$.", "whyWrong": ["A mean of $2$ s inverts the rate: the rate is $2$ per second, so the mean holding time is its reciprocal.", "The fraction $2/5$ belongs to state $2$; the state with the slower exit rate is the one occupied more of the time.", "$1/3$ is the mean holding time in state $2$ (rate $3$), and $2/5$ is that state's stationary probability."]}, "he": {"q": "לשרשרת מרקוב רציפה בזמן בעלת שני מצבים מטריצת יוצר עם שורות $(-2, 2)$ ו-$(3, -3)$ (קצבים לשנייה). מהו זמן השהייה הממוצע במצב $1$ ומהו החלק היחסי של הזמן בו נמצאים במצב $1$?", "options": ["ממוצע $1/2$ שנ', חלק יחסי $3/5$", "ממוצע $2$ שנ', חלק יחסי $3/5$", "ממוצע $1/2$ שנ', חלק יחסי $2/5$", "ממוצע $1/3$ שנ', חלק יחסי $2/5$"], "hint": "זמן השהייה במצב $i$ מתפלג מעריכית עם קצב $q_i=-q_{ii}$. הווקטור הסטציונרי פותר $πQ=0$, ולא $πQ=π$.", "explanation": "קצב היציאה ממצב $1$ הוא $q_1=-q_{11}=2$ לשנייה, ולכן זמן השהייה מתפלג $Exp(2)$ עם תוחלת $1/q_1=1/2$ שנ'. עבור ההתפלגות הסטציונרית פותרים $πQ=0$: הרכיב הראשון נותן $-2π_1+3π_2=0$, ולכן $π_1=(3/2)π_2$; עם $π_1+π_2=1$ מתקבל $π=(3/5,2/5)$. בדיקה: $(3/5)(-2)+(2/5)(3)=-6/5+6/5=0$. שקול לכך, $π_i$ פרופורציוני למכפלת זמן השהייה הממוצע בתדירות הביקורים; כאן השרשרת המשובצת מתחלפת, ולכן $π∝(1/2,1/3)∝(3,2)$.", "whyWrong": ["ממוצע של $2$ שנ' הופך את הקצב: הקצב הוא $2$ לשנייה, ולכן זמן השהייה הממוצע הוא ההופכי שלו.", "החלק היחסי $2/5$ שייך למצב $2$; המצב עם קצב היציאה האיטי יותר הוא זה שנמצאים בו יותר זמן.", "הערך $1/3$ הוא זמן השהייה הממוצע במצב $2$ (קצב $3$), והערך $2/5$ הוא ההסתברות הסטציונרית של אותו מצב."]}}, {"id": "mkv-010", "area": "markov", "topic": "limiting-vs-stationary", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["stationary-distribution", "limiting-distribution", "irreducibility", "aperiodicity"], "en": {"q": "For a finite chain, state the condition that makes the stationary distribution unique and the extra condition that makes $π_n→π$ for every initial distribution. Give a chain with a unique $π$ but no limiting distribution.", "hint": "Irreducibility and aperiodicity do two different jobs. Look for a chain that keeps swapping between two states.", "modelAnswer": "Write $π_n$ for the distribution of $X_n$, so $π_n=π_0P^n$. A stationary distribution is any probability vector with $πP=π$, i.e. a left eigenvector of $P$ for eigenvalue $1$ with non-negative entries summing to $1$. Existence: every finite stochastic matrix has at least one such $π$ (Perron-Frobenius, or a fixed-point argument), so existence needs no assumptions at all. Uniqueness: if the chain is irreducible (every state reachable from every other), the eigenvalue $1$ is simple and $π$ is unique and strictly positive, with $π_j=1/E_j[T_j]$, the reciprocal of the mean return time. Reducibility is exactly what destroys uniqueness: a chain with two absorbing states $a$ and $b$ has $π=(α,1-α)$ supported on ${a,b}$ stationary for every $α∈[0,1]$, an entire line segment of solutions. Convergence: irreducibility alone does not give $π_n→π$. Adding aperiodicity ($d(i)=gcd{n:p_{ii}^{(n)}>0}=1$, a class property) gives the ergodic theorem $p_{ij}^{(n)}→π_j$ for all $i,j$, i.e. $P^n→1π$, so $π_n→π$ for every $π_0$. Counterexample. Take $P$ with rows $(0,1)$ and $(1,0)$: the chain deterministically alternates. It is irreducible, so $π=(1/2,1/2)$ is the unique stationary distribution and it is genuinely stationary — start from it and you stay there. But every state has period $2$, and $P^n$ alternates between $I$ and $P$; from $π_0=(1,0)$ the distribution cycles $(1,0),(0,1),(1,0),…$ and never converges. What survives periodicity is the Cesàro (time-average) statement: $(1/n)Σ_{m<n}π_m→π$, and the long-run fraction of time in state $j$ is $π_j$ with probability $1$. So aperiodicity is needed only for the pointwise limit, not for the interpretation of $π$ as an occupancy frequency.", "rubric": ["States that a finite chain always has at least one stationary distribution, so existence is free.", "Identifies irreducibility as the condition for uniqueness, and mentions $π_j=1/E_j[T_j]$ or strict positivity.", "Identifies aperiodicity as the extra condition for $P^n→1π$ and hence $π_n→π$ from every $π_0$.", "Gives an explicit periodic counterexample such as rows $(0,1),(1,0)$ with unique $π=(1/2,1/2)$ but oscillating $π_n$.", "Notes that even in the periodic case the time-average (Cesàro) limit and the occupancy interpretation still hold."]}, "he": {"q": "עבור שרשרת סופית, נסח את התנאי ההופך את ההתפלגות הסטציונרית ליחידה ואת התנאי הנוסף המבטיח $π_n→π$ לכל התפלגות התחלתית. תן שרשרת עם $π$ יחיד אך ללא התפלגות גבולית.", "hint": "אי-פריקות ואי-מחזוריות ממלאות שני תפקידים שונים. חפש שרשרת שמתחלפת שוב ושוב בין שני מצבים.", "modelAnswer": "נסמן ב-$π_n$ את התפלגות $X_n$, כך ש-$π_n=π_0P^n$. התפלגות סטציונרית היא כל וקטור הסתברות המקיים $πP=π$, כלומר וקטור עצמי שמאלי של $P$ לערך עצמי $1$ עם רכיבים אי-שליליים שסכומם $1$. קיום: לכל מטריצה סטוכסטית סופית יש לפחות $π$ אחד כזה (פרון-פרוביניוס, או טיעון נקודת שבת), ולכן הקיום אינו דורש הנחות כלל. יחידות: אם השרשרת אי-פריקה (כל מצב נגיש מכל מצב), הערך העצמי $1$ פשוט ו-$π$ יחיד וחיובי ממש, עם $π_j=1/E_j[T_j]$, ההופכי של זמן החזרה הממוצע. פריקות היא בדיוק מה שהורס את היחידות: לשרשרת עם שני מצבים בולעים $a$ ו-$b$ כל וקטור $π=(α,1-α)$ הנתמך על ${a,b}$ הוא סטציונרי לכל $α∈[0,1]$, כלומר קטע שלם של פתרונות. התכנסות: אי-פריקות לבדה אינה נותנת $π_n→π$. הוספת אי-מחזוריות ($d(i)=gcd{n:p_{ii}^{(n)}>0}=1$, תכונת מחלקה) נותנת את משפט הארגודיות $p_{ij}^{(n)}→π_j$ לכל $i,j$, כלומר $P^n→1π$, ולכן $π_n→π$ לכל $π_0$. דוגמה נגדית. ניקח $P$ עם שורות $(0,1)$ ו-$(1,0)$: השרשרת מתחלפת דטרמיניסטית. היא אי-פריקה, ולכן $π=(1/2,1/2)$ היא ההתפלגות הסטציונרית היחידה והיא אכן סטציונרית — אם מתחילים ממנה נשארים בה. אך לכל מצב מחזוריות $2$, ו-$P^n$ מתחלף בין $I$ ל-$P$; מ-$π_0=(1,0)$ ההתפלגות מחזורית $(1,0),(0,1),(1,0),…$ ואינה מתכנסת לעולם. מה שכן שורד מחזוריות הוא הטענה בממוצע צ'זארו: $(1/n)Σ_{m<n}π_m→π$, וחלקו היחסי של הזמן במצב $j$ הוא $π_j$ בהסתברות $1$. לכן אי-מחזוריות נחוצה רק לגבול הנקודתי, ולא לפרשנות של $π$ כתדירות שהייה.", "rubric": ["מציין ששרשרת סופית תמיד בעלת התפלגות סטציונרית אחת לפחות, ולכן הקיום מובטח.", "מזהה אי-פריקות כתנאי ליחידות, ומזכיר את $π_j=1/E_j[T_j]$ או חיוביות ממש.", "מזהה אי-מחזוריות כתנאי הנוסף ל-$P^n→1π$ ומכאן $π_n→π$ מכל $π_0$.", "נותן דוגמה נגדית מחזורית מפורשת כגון שורות $(0,1),(1,0)$ עם $π=(1/2,1/2)$ יחיד אך $π_n$ מתנדנד.", "מציין שגם במקרה המחזורי הגבול בממוצע (צ'זארו) ופרשנות שהיית הזמן עדיין תקפים."]}}, {"id": "que-001", "area": "queues", "topic": "mm1-stability-and-distribution", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["m-m-1", "utilisation", "stability", "geometric"], "answer": 1, "en": {"q": "An M/M/1 queue has Poisson arrivals at rate $λ$ and exponential service at rate $μ$. Which statement is correct?", "options": ["Stable for all $λ,μ$; then $P(N=n)=e^{-ρ}ρ^n/n!$ with $ρ=λ/μ$", "Stable iff $ρ=λ/μ<1$; then $P(N=n)=(1-ρ)ρ^n$ for $n≥0$", "Stable iff $ρ=λ/μ<1$; then $P(N=n)=(1-ρ)^nρ$ for $n≥0$", "Stable iff $λ<1$ job/s; then $P(N=n)=ρ^n(1-ρ)^n$ for $n≥0$"], "hint": "The state $N$ is a birth-death chain with constant birth rate $λ$ and constant death rate $μ$; its stationary law is geometric.", "explanation": "The number in system is a birth-death CTMC with birth rate $λ$ in every state and death rate $μ$ in every state $n≥1$. Detailed balance gives $λP_{n-1}=μP_n$, so $P_n=ρ^nP_0$ with $ρ=λ/μ$. Normalising, $Σ_nρ^n$ converges only if $ρ<1$, which is exactly the stability condition, and then $P_0=1-ρ$ so $P(N=n)=(1-ρ)ρ^n$: a geometric law on ${0,1,2,…}$. Its mean is $E[N]=ρ/(1-ρ)$. If $ρ≥1$ no stationary distribution exists and the queue grows without bound.", "whyWrong": ["The Poisson law describes the number of arrivals in a fixed interval, not the number in system; and no $λ,μ$ with $ρ≥1$ is stable.", "The exponents are swapped: the decaying factor must be $ρ^n$, since each extra customer costs one more factor of $ρ$.", "Stability compares $λ$ with $μ$, not with $1$; rates are not dimensionless, and $ρ^n(1-ρ)^n$ does not sum to $1$."]}, "he": {"q": "לתור M/M/1 הגעות פואסון בקצב $λ$ ושירות מעריכי בקצב $μ$. איזו טענה נכונה?", "options": ["יציב לכל $λ,μ$; ואז $P(N=n)=e^{-ρ}ρ^n/n!$ עם $ρ=λ/μ$", "יציב אם ורק אם $ρ=λ/μ<1$; ואז $P(N=n)=(1-ρ)ρ^n$ עבור $n≥0$", "יציב אם ורק אם $ρ=λ/μ<1$; ואז $P(N=n)=(1-ρ)^nρ$ עבור $n≥0$", "יציב אם ורק אם $λ<1$ לקוח/שנ'; ואז $P(N=n)=ρ^n(1-ρ)^n$ עבור $n≥0$"], "hint": "המצב $N$ הוא שרשרת לידה-מוות עם קצב לידה קבוע $λ$ וקצב מוות קבוע $μ$; ההתפלגות הסטציונרית שלה גאומטרית.", "explanation": "מספר הלקוחות במערכת הוא שרשרת מרקוב רציפה מסוג לידה-מוות עם קצב לידה $λ$ בכל מצב וקצב מוות $μ$ בכל מצב $n≥1$. איזון מפורט נותן $λP_{n-1}=μP_n$, ולכן $P_n=ρ^nP_0$ עם $ρ=λ/μ$. בנרמול, הטור $Σ_nρ^n$ מתכנס רק אם $ρ<1$, וזהו בדיוק תנאי היציבות, ואז $P_0=1-ρ$ ולכן $P(N=n)=(1-ρ)ρ^n$: התפלגות גאומטרית על ${0,1,2,…}$. תוחלתה $E[N]=ρ/(1-ρ)$. אם $ρ≥1$ אין התפלגות סטציונרית והתור גדל ללא גבול.", "whyWrong": ["התפלגות פואסון מתארת את מספר ההגעות בקטע זמן נתון ולא את מספר הלקוחות במערכת; ובנוסף אף $λ,μ$ עם $ρ≥1$ אינם יציבים.", "המעריכים הוחלפו: הגורם הדועך חייב להיות $ρ^n$, שכן כל לקוח נוסף עולה גורם נוסף של $ρ$.", "היציבות משווה את $λ$ ל-$μ$ ולא ל-$1$; קצבים אינם חסרי יחידות, ובנוסף $ρ^n(1-ρ)^n$ אינו מסתכם ל-$1$."]}}, {"id": "que-002", "area": "queues", "topic": "mm1-mean-number-and-delay", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["m-m-1", "mean-number", "sojourn-time", "littles-law"], "answer": 2, "en": {"q": "An M/M/1 server receives jobs at $λ=8$ per second and serves at $μ=10$ per second. Compute the mean number in system $E[N]$ and the mean time in system $E[T]$.", "options": ["$E[N]=0.8$ jobs, $E[T]=0.1$ s", "$E[N]=5$ jobs, $E[T]=0.5$ s", "$E[N]=4$ jobs, $E[T]=0.5$ s", "$E[N]=4$ jobs, $E[T]=0.4$ s"], "hint": "$ρ=λ/μ$, then $E[N]=ρ/(1-ρ)$ and $E[T]=1/(μ-λ)$. Little's law $E[N]=λE[T]$ is a free consistency check.", "explanation": "$ρ=8/10=0.8<1$, so the queue is stable. Then $E[N]=ρ/(1-ρ)=0.8/0.2=4$ jobs and $E[T]=1/(μ-λ)=1/(10-8)=0.5$ s. Little's law confirms it: $λE[T]=8×0.5=4=E[N]$. For reference the queueing-only quantities are $E[N_q]=ρ^2/(1-ρ)=3.2$ and $E[W_q]=ρ/(μ-λ)=0.4$ s, and the two differ by exactly the job in service, $ρ=0.8$, and by one service time, $1/μ=0.1$ s.", "whyWrong": ["$0.8$ is the utilisation $ρ$ (the mean number in service, not in system) and $0.1$ s is the mean service time $1/μ$.", "$5$ comes from $1/(1-ρ)$ instead of $ρ/(1-ρ)$; that expression counts an extra phantom job and would not be $0$ when $λ=0$.", "$0.4$ s is the mean waiting time in queue $E[W_q]$; the time in system adds the service time $1/μ=0.1$ s."]}, "he": {"q": "שרת M/M/1 מקבל עבודות בקצב $λ=8$ לשנייה ומשרת בקצב $μ=10$ לשנייה. חשב את המספר הממוצע במערכת $E[N]$ ואת הזמן הממוצע במערכת $E[T]$.", "options": ["$E[N]=0.8$ עבודות, ‏$E[T]=0.1$ שנ'", "$E[N]=5$ עבודות, ‏$E[T]=0.5$ שנ'", "$E[N]=4$ עבודות, ‏$E[T]=0.5$ שנ'", "$E[N]=4$ עבודות, ‏$E[T]=0.4$ שנ'"], "hint": "$ρ=λ/μ$, ואז $E[N]=ρ/(1-ρ)$ וכן $E[T]=1/(μ-λ)$. חוק ליטל $E[N]=λE[T]$ הוא בדיקת עקביות חינם.", "explanation": "מתקיים $ρ=8/10=0.8<1$, ולכן התור יציב. אז $E[N]=ρ/(1-ρ)=0.8/0.2=4$ עבודות וכן $E[T]=1/(μ-λ)=1/(10-8)=0.5$ שנ'. חוק ליטל מאשש: $λE[T]=8×0.5=4=E[N]$. לשם השוואה, הגדלים בתור בלבד הם $E[N_q]=ρ^2/(1-ρ)=3.2$ וכן $E[W_q]=ρ/(μ-λ)=0.4$ שנ', וההפרשים הם בדיוק העבודה שבשירות, $ρ=0.8$, וזמן שירות אחד, $1/μ=0.1$ שנ'.", "whyWrong": ["הערך $0.8$ הוא הניצולת $ρ$ (המספר הממוצע בשירות ולא במערכת), והערך $0.1$ שנ' הוא זמן השירות הממוצע $1/μ$.", "הערך $5$ נובע מ-$1/(1-ρ)$ במקום מ-$ρ/(1-ρ)$; ביטוי זה סופר עבודת רפאים נוספת ולא היה מתאפס עבור $λ=0$.", "הערך $0.4$ שנ' הוא זמן ההמתנה הממוצע בתור $E[W_q]$; הזמן במערכת מוסיף את זמן השירות $1/μ=0.1$ שנ'."]}}, {"id": "que-003", "area": "queues", "topic": "littles-law-generality", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["littles-law", "generality", "steady-state"], "answer": 3, "en": {"q": "Which statement about Little's law $L=λW$ is correct?", "options": ["It requires Poisson arrivals and exponential service times in order to hold", "It holds only under FIFO; LIFO and priority disciplines violate it", "It holds only for one server; with $c$ servers it becomes $L=cλW$", "It holds for any stable system in steady state, whatever the discipline"], "hint": "The proof is essentially a bookkeeping identity relating an area under a sample path to arrivals and to time; nothing distributional enters.", "explanation": "Little's law is a sample-path identity, proved by counting the shaded area under the plot of the number in system in two ways: as time-average occupancy $L$ times the horizon, or as the number of arrivals $λ$ per unit time times the mean time each spends inside, $W$. It needs only that the system be well defined and stable (long-run averages exist and nothing accumulates). It is indifferent to the arrival process, the service-time distribution, the number of servers, and the service discipline, and it applies to any consistently chosen subsystem: taking the waiting room alone gives $L_q=λW_q$, taking the servers alone gives $cρ=λ/μ$.", "whyWrong": ["Poisson and exponential assumptions are needed for the specific M/M/1 formulas, not for $L=λW$, which holds for G/G/c as well.", "Discipline reshuffles who waits how long but not the average; FIFO, LIFO and priority all give the same $L$ and $W$ for the same $λ$.", "The number of servers is already inside $L$ and $W$; applying the law to the whole system needs no factor $c$."]}, "he": {"q": "איזו טענה על חוק ליטל $L=λW$ נכונה?", "options": ["הוא דורש הגעות פואסון וזמני שירות מעריכיים כדי להתקיים", "הוא מתקיים רק בשירות FIFO; משמעות LIFO ועדיפויות מפרות אותו", "הוא מתקיים רק לשרת יחיד; עם $c$ שרתים הוא הופך ל-$L=cλW$", "הוא מתקיים לכל מערכת יציבה במצב מתמיד, בכל משמעת שירות"], "hint": "ההוכחה היא בעצם זהות ספירה המקשרת שטח מתחת למסלול מדגמי להגעות ולזמן; שום הנחה התפלגותית אינה נכנסת.", "explanation": "חוק ליטל הוא זהות של מסלול מדגמי, המוכחת על ידי ספירת השטח מתחת לגרף מספר הלקוחות במערכת בשתי דרכים: כתפוסה ממוצעת בזמן $L$ כפול אורך האופק, או כמספר ההגעות ליחידת זמן $λ$ כפול הזמן הממוצע ששוהה כל אחת בפנים, $W$. הוא דורש רק שהמערכת תהיה מוגדרת היטב ויציבה (ממוצעים ארוכי טווח קיימים ודבר אינו נצבר). הוא אדיש לתהליך ההגעות, להתפלגות זמני השירות, למספר השרתים ולמשמעת השירות, והוא חל על כל תת-מערכת שנבחרת בעקביות: חדר ההמתנה לבדו נותן $L_q=λW_q$, והשרתים לבדם נותנים $cρ=λ/μ$.", "whyWrong": ["הנחות פואסון ומעריכי נחוצות לנוסחאות M/M/1 הספציפיות ולא ל-$L=λW$, המתקיים גם עבור G/G/c.", "משמעת השירות מסדרת מחדש מי ממתין כמה זמן אך אינה משנה את הממוצע; FIFO, LIFO ועדיפויות נותנים אותם $L$ ו-$W$ עבור אותו $λ$.", "מספר השרתים כבר נכלל בתוך $L$ ו-$W$; החלת החוק על המערכת כולה אינה דורשת גורם $c$."]}}, {"id": "que-004", "area": "queues", "topic": "scaling-lambda-and-mu", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["m-m-1", "scaling", "littles-law", "time-units"], "en": {"q": "In a stable M/M/1 queue both $λ$ and $μ$ are doubled. Determine what happens to $ρ$, to $E[N]$ and to $E[T]$, and explain why the number and the delay behave differently.", "hint": "$ρ$ is dimensionless, $E[N]$ is a pure count, but $E[T]$ has units of time. Then check your answer against Little's law.", "modelAnswer": "Let the new rates be $λ'=2λ$ and $μ'=2μ$. Utilisation: $ρ'=λ'/μ'=2λ/2μ=λ/μ=ρ$, unchanged. Since the stationary law is $P(N=n)=(1-ρ)ρ^n$ and depends on the rates only through $ρ$, the whole distribution of $N$ is unchanged, and in particular $E[N]'=ρ/(1-ρ)=E[N]$. Delay: $E[T]'=1/(μ'-λ')=1/(2μ-2λ)=(1/2)·1/(μ-λ)=(1/2)E[T]$, exactly halved. The same holds for $E[W_q]=ρ/(μ-λ)$ and for the mean service time $1/μ$. Consistency with Little: $L=λW$ gives $L'=λ'W'=(2λ)(W/2)=λW=L$, which is precisely the statement that $E[N]$ does not move. Why the difference. $N$ is a dimensionless count and $ρ$ is a dimensionless load, so no quantity that is a pure number can change when the only thing done is a uniform change of clock speed. $T$ carries units of seconds, so it must scale like the reciprocal of a rate: doubling both rates is exactly running the same stochastic process on a clock that ticks twice as fast, so every time interval — interarrival times, service times, busy periods, sojourn times — is halved while every count is untouched. Formally, the CTMC for $N$ with rates $(2λ,2μ)$ is the time-change $N(2t)$ of the original chain; a time-change leaves the stationary distribution alone and divides all holding and passage times by $2$. Engineering reading: buying a server twice as fast buys you nothing in queue occupancy if the traffic doubles too, but each individual job still finishes in half the time.", "rubric": ["Shows $ρ'=ρ$ and concludes the whole distribution of $N$, hence $E[N]$, is unchanged.", "Computes $E[T]'=1/(2μ-2λ)=E[T]/2$ and notes the same halving for $E[W_q]$ and $1/μ$.", "Verifies consistency with Little's law: $L=λW$ with $λ$ doubled and $W$ halved leaves $L$ fixed.", "Explains the asymmetry by dimensions or by the time-change argument: counts are dimensionless, times scale as the reciprocal of a rate.", "Draws the practical conclusion that only the load $ρ$ controls congestion, while absolute speed controls latency."]}, "he": {"q": "בתור M/M/1 יציב מכפילים פי שניים גם את $λ$ וגם את $μ$. קבע מה קורה ל-$ρ$, ל-$E[N]$ ול-$E[T]$, והסבר מדוע המספר וההשהיה מתנהגים אחרת.", "hint": "$ρ$ חסר יחידות, $E[N]$ הוא ספירה טהורה, אך ל-$E[T]$ יחידות של זמן. לאחר מכן בדוק את התשובה מול חוק ליטל.", "modelAnswer": "יהיו הקצבים החדשים $λ'=2λ$ ו-$μ'=2μ$. ניצולת: $ρ'=λ'/μ'=2λ/2μ=λ/μ=ρ$, ללא שינוי. מכיוון שההתפלגות הסטציונרית היא $P(N=n)=(1-ρ)ρ^n$ ותלויה בקצבים רק דרך $ρ$, כל התפלגות $N$ אינה משתנה, ובפרט $E[N]'=ρ/(1-ρ)=E[N]$. השהיה: $E[T]'=1/(μ'-λ')=1/(2μ-2λ)=(1/2)·1/(μ-λ)=(1/2)E[T]$, בדיוק חצי. אותו דבר נכון עבור $E[W_q]=ρ/(μ-λ)$ ועבור זמן השירות הממוצע $1/μ$. עקביות עם ליטל: מ-$L=λW$ נקבל $L'=λ'W'=(2λ)(W/2)=λW=L$, וזו בדיוק הטענה ש-$E[N]$ אינו זז. מדוע ההבדל. הגודל $N$ הוא ספירה חסרת יחידות ו-$ρ$ הוא עומס חסר יחידות, ולכן שום גודל שהוא מספר טהור אינו יכול להשתנות כאשר כל מה שנעשה הוא שינוי אחיד של קצב השעון. הגודל $T$ נושא יחידות של שניות, ולכן הוא חייב להשתנות כמו ההופכי של קצב: הכפלת שני הקצבים היא בדיוק הרצת אותו תהליך אקראי על שעון המתקתק כפליים, ולכן כל מרווח זמן — זמני בין-הגעות, זמני שירות, תקופות עומס וזמני שהייה — נחצה, בעוד כל ספירה נשארת. פורמלית, שרשרת המרקוב הרציפה של $N$ עם קצבים $(2λ,2μ)$ היא שינוי הזמן $N(2t)$ של השרשרת המקורית; שינוי זמן אינו נוגע בהתפלגות הסטציונרית ומחלק את כל זמני השהייה והמעבר ב-$2$. קריאה הנדסית: רכישת שרת מהיר פי שניים אינה קונה דבר בתפוסת התור אם גם התעבורה מוכפלת, אך כל עבודה בודדת עדיין מסתיימת בחצי מהזמן.", "rubric": ["מראה ש-$ρ'=ρ$ ומסיק שכל התפלגות $N$, ומכאן $E[N]$, אינה משתנה.", "מחשב $E[T]'=1/(2μ-2λ)=E[T]/2$ ומציין את אותה חציה עבור $E[W_q]$ ועבור $1/μ$.", "מאמת עקביות עם חוק ליטל: ב-$L=λW$ עם $λ$ כפול ו-$W$ חצי, הגודל $L$ נשאר קבוע.", "מסביר את חוסר הסימטריה לפי יחידות או לפי טיעון שינוי הזמן: ספירות חסרות יחידות, זמנים משתנים כמו ההופכי של קצב.", "מסיק את המסקנה המעשית שרק העומס $ρ$ שולט בגודש, בעוד המהירות המוחלטת שולטת בהשהיה."]}}, {"id": "que-005", "area": "queues", "topic": "delay-blowup-near-saturation", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["m-m-1", "heavy-traffic", "nonlinearity", "utilisation"], "answer": 0, "en": {"q": "An M/M/1 link with fixed $μ$ is loaded harder, so its utilisation rises from $ρ=0.80$ to $ρ=0.95$. By what factor does the mean number in system $E[N]$ grow?", "options": ["$4.75$", "$4.0$", "$1.19$", "$19$"], "hint": "Compute $ρ/(1-ρ)$ at both loads and take the ratio. The denominator $1-ρ$ is what does the damage.", "explanation": "At $ρ=0.80$: $E[N]=0.80/0.20=4$. At $ρ=0.95$: $E[N]=0.95/0.05=19$. The ratio is $19/4=4.75$. A 19% increase in offered load multiplies congestion almost fivefold, because $E[N]$ is controlled by the reciprocal of the spare capacity $1-ρ$, which fell by a factor of $4$. Note that $E[T]=1/(μ(1-ρ))$ grows by only $0.20/0.05=4$, not $4.75$: the extra factor $0.95/0.80$ in $E[N]$ comes from the numerator $ρ$, exactly as Little's law demands since $λ$ also rose by $0.95/0.80$.", "whyWrong": ["$4.0$ is the growth factor of $E[T]$, which is $(1-0.80)/(1-0.95)$; $E[N]$ additionally carries the factor $0.95/0.80$.", "$1.19$ is just $0.95/0.80$, the increase in $λ$; it ignores the shrinking of the spare capacity entirely.", "$19$ is the new value of $E[N]$, not the factor of growth relative to $4$."]}, "he": {"q": "ערוץ M/M/1 עם $μ$ קבוע מועמס יותר, כך שהניצולת שלו עולה מ-$ρ=0.80$ ל-$ρ=0.95$. בכמה גדל פי כמה המספר הממוצע במערכת $E[N]$?", "options": ["$4.75$", "$4.0$", "$1.19$", "$19$"], "hint": "חשב את $ρ/(1-ρ)$ בשני העומסים וקח את היחס. המכנה $1-ρ$ הוא זה שגורם לנזק.", "explanation": "עבור $ρ=0.80$: ‏$E[N]=0.80/0.20=4$. עבור $ρ=0.95$: ‏$E[N]=0.95/0.05=19$. היחס הוא $19/4=4.75$. עלייה של 19% בעומס המוצע מכפילה את הגודש כמעט פי חמישה, מכיוון ש-$E[N]$ נשלט על ידי ההופכי של הקיבולת הפנויה $1-ρ$, שירדה פי $4$. שים לב ש-$E[T]=1/(μ(1-ρ))$ גדל רק פי $0.20/0.05=4$ ולא פי $4.75$: הגורם הנוסף $0.95/0.80$ ב-$E[N]$ מגיע מהמונה $ρ$, בדיוק כפי שחוק ליטל דורש שכן גם $λ$ עלה פי $0.95/0.80$.", "whyWrong": ["הערך $4.0$ הוא גורם הגידול של $E[T]$, שהוא $(1-0.80)/(1-0.95)$; ב-$E[N]$ נוסף גם הגורם $0.95/0.80$.", "הערך $1.19$ הוא רק $0.95/0.80$, כלומר הגידול ב-$λ$; הוא מתעלם לחלוטין מהצטמקות הקיבולת הפנויה.", "הערך $19$ הוא הערך החדש של $E[N]$ ולא גורם הגידול ביחס ל-$4$."]}}, {"id": "que-006", "area": "queues", "topic": "mm1k-blocking-probability", "difficulty": 4, "type": "mcq", "hardnessSource": "computation", "tags": ["m-m-1-k", "blocking", "finite-buffer", "truncated-geometric"], "answer": 1, "en": {"q": "An M/M/1/K queue holds at most $K=3$ customers (buffer plus server) and has $λ/μ=1/2$. An arrival finding the system full is lost. Compute the blocking probability.", "options": ["$1/8$", "$1/15$", "$1/16$", "$8/15$"], "hint": "The stationary law is the geometric law truncated at $K$ and renormalised. By PASTA the blocking probability equals $P_K$.", "explanation": "Detailed balance still gives $P_n=ρ^nP_0$ for $n=0,…,K$ with $ρ=λ/μ=1/2$, but the normalising sum is now finite: $Σ_{n=0}^{3}(1/2)^n=1+1/2+1/4+1/8=15/8$. Hence $P_n=(8/15)(1/2)^n$, giving $P=(8/15,4/15,2/15,1/15)$. Since arrivals are Poisson, PASTA says an arriving customer sees the time-stationary distribution, so the blocking probability is $P_3=1/15≈0.067$. Note $ρ<1$ is no longer needed for stability: the finite buffer makes the chain stable for any $ρ$.", "whyWrong": ["$1/8$ is the unnormalised weight $ρ^3$; it forgets to divide by the truncated sum $15/8$.", "$1/16$ is $(1-ρ)ρ^3$, the infinite-buffer M/M/1 value; the finite buffer changes the normalising constant.", "$8/15$ is $P_0$, the probability that the system is empty, which is the opposite extreme of the state space."]}, "he": {"q": "תור M/M/1/K מכיל לכל היותר $K=3$ לקוחות (חוצץ ושרת) ומקיים $λ/μ=1/2$. הגעה המוצאת את המערכת מלאה אובדת. חשב את הסתברות החסימה.", "options": ["$1/8$", "$1/15$", "$1/16$", "$8/15$"], "hint": "ההתפלגות הסטציונרית היא ההתפלגות הגאומטרית הקטומה ב-$K$ ומנורמלת מחדש. לפי PASTA הסתברות החסימה שווה ל-$P_K$.", "explanation": "איזון מפורט עדיין נותן $P_n=ρ^nP_0$ עבור $n=0,…,K$ עם $ρ=λ/μ=1/2$, אך סכום הנרמול סופי כעת: $Σ_{n=0}^{3}(1/2)^n=1+1/2+1/4+1/8=15/8$. מכאן $P_n=(8/15)(1/2)^n$, כלומר $P=(8/15,4/15,2/15,1/15)$. מכיוון שההגעות פואסוניות, PASTA קובע שלקוח מגיע רואה את ההתפלגות הסטציונרית בזמן, ולכן הסתברות החסימה היא $P_3=1/15≈0.067$. שים לב ש-$ρ<1$ אינו נדרש עוד ליציבות: החוצץ הסופי הופך את השרשרת ליציבה לכל $ρ$.", "whyWrong": ["הערך $1/8$ הוא המשקל הלא מנורמל $ρ^3$; הוא שוכח לחלק בסכום הקטום $15/8$.", "הערך $1/16$ הוא $(1-ρ)ρ^3$, הערך של M/M/1 עם חוצץ אינסופי; החוצץ הסופי משנה את קבוע הנרמול.", "הערך $8/15$ הוא $P_0$, ההסתברות שהמערכת ריקה, שהיא הקצה ההפוך של מרחב המצבים."]}}, {"id": "que-007", "area": "queues", "topic": "mmc-versus-one-fast-server", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["m-m-c", "server-pooling", "erlang-c", "delay-comparison"], "answer": 2, "en": {"q": "Compare an M/M/$c$ system ($c$ servers of rate $μ$) with an M/M/1 system whose single server has rate $cμ$, both fed by the same Poisson rate $λ<cμ$. Which statement is correct?", "options": ["The $c$ servers give lower delay, since parallelism stops one job blocking others", "Both give the same $E[T]$, since total capacity $cμ$ and load $ρ$ are identical", "One server of rate $cμ$ gives lower $E[T]$; slow servers idle while work waits", "The $c$ servers give lower $E[T]$ when $ρ>1/2$, and a higher delay otherwise"], "hint": "Ask when capacity is wasted. With $c$ servers and only $1$ customer present, $c-1$ servers sit idle even though work is waiting behind.", "explanation": "Both systems are stable under the same condition and have the same $ρ=λ/(cμ)$, but they are not equivalent. In M/M/$c$, whenever fewer than $c$ customers are present some servers are idle, so the instantaneous service capacity is below $cμ$; the single fast server always applies its full rate $cμ$ whenever anything is in the system, so it never wastes capacity. Quantitatively $E[T]_{M/M/c}=1/μ+C(c,λ/μ)/(cμ-λ)$ with Erlang-C $C≤1$, versus $E[T]_{M/M/1}=1/(cμ-λ)$. For $c=2$, $μ=1$, $λ=1$: $C=1/3$, so $E[T]=1+1/3=1.333$ against $1.0$ for the fast server. The intuition that parallel servers help applies to variable (non-exponential) service times or when a single fast server is unavailable.", "whyWrong": ["With exponential service there are no pathologically long jobs to block the queue, and the head-of-line job is served either way.", "Equal capacity is not equal performance: capacity that sits idle while customers wait does not contribute to throughput.", "The fast server wins at every load; the gap actually shrinks as $ρ→1$, where both systems become congestion-dominated."]}, "he": {"q": "השווה מערכת M/M/$c$ (‏$c$ שרתים בקצב $μ$) למערכת M/M/1 ששרתה היחיד פועל בקצב $cμ$, כששתיהן ניזונות מאותו קצב פואסון $λ<cμ$. איזו טענה נכונה?", "options": ["השרתים המרובים נותנים השהיה נמוכה יותר, שכן מקביליות מונעת חסימה בידי עבודה אחת", "שתיהן נותנות אותו $E[T]$, שכן הקיבולת הכוללת $cμ$ והעומס $ρ$ זהים", "שרת אחד בקצב $cμ$ נותן $E[T]$ נמוך יותר; שרתים איטיים בטלים בזמן שיש עבודה", "השרתים המרובים נותנים $E[T]$ נמוך יותר כאשר $ρ>1/2$ והשהיה גבוהה יותר אחרת"], "hint": "שאל מתי מבוזבזת קיבולת. עם $c$ שרתים ולקוח אחד בלבד במערכת, $c-1$ שרתים מבטלים אף שיש עבודה שממתינה מאחור.", "explanation": "שתי המערכות יציבות תחת אותו תנאי ובעלות אותו $ρ=λ/(cμ)$, אך אינן שקולות. ב-M/M/$c$, בכל פעם שנוכחים פחות מ-$c$ לקוחות חלק מהשרתים בטלים, ולכן קיבולת השירות הרגעית נמוכה מ-$cμ$; השרת המהיר היחיד מפעיל תמיד את מלוא קצבו $cμ$ כל עוד יש משהו במערכת, ולכן אינו מבזבז קיבולת. כמותית $E[T]_{M/M/c}=1/μ+C(c,λ/μ)/(cμ-λ)$ עם ארלנג-C המקיים $C≤1$, לעומת $E[T]_{M/M/1}=1/(cμ-λ)$. עבור $c=2$, $μ=1$, $λ=1$: ‏$C=1/3$, ולכן $E[T]=1+1/3=1.333$ מול $1.0$ עבור השרת המהיר. האינטואיציה ששרתים מקביליים עוזרים חלה על זמני שירות משתנים (לא מעריכיים) או כאשר שרת מהיר יחיד אינו זמין.", "whyWrong": ["בשירות מעריכי אין עבודות ארוכות באופן חריג שיחסמו את התור, והעבודה בראש התור מקבלת שירות כך או כך.", "קיבולת שווה אינה ביצועים שווים: קיבולת הבטלה בזמן שלקוחות ממתינים אינה תורמת לתפוקה.", "השרת המהיר מנצח בכל עומס; הפער דווקא מצטמצם כאשר $ρ→1$, שם שתי המערכות נשלטות על ידי גודש."]}}, {"id": "que-008", "area": "queues", "topic": "pasta", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["pasta", "poisson-arrivals", "time-averages", "counterexample"], "en": {"q": "State the PASTA property precisely, explain why Poisson arrivals are what make it work, and give a concrete non-Poisson counterexample where the arrival-average and the time-average disagree.", "hint": "Two different averages are being compared: one over time, one over arriving customers. Try deterministic arrivals with deterministic service.", "modelAnswer": "Statement. Let $N(t)$ be the state of a queueing system and let $A_k$ be the state seen just before the $k$-th arrival. PASTA (Poisson Arrivals See Time Averages) says that if the arrival process is Poisson and satisfies the lack-of-anticipation assumption — future increments of the arrival process are independent of the current system state — then the arrival-average distribution equals the time-average distribution: $lim_K (1/K)Σ_{k≤K}1{A_k=n} = lim_T (1/T)∫_0^T 1{N(t)=n} dt = P_n$. Why Poisson. A Poisson process has independent increments and is memoryless, so the event 'an arrival occurs in $[t,t+dt)$' has probability $λ dt$ regardless of the history of the system up to $t$; conditioning on it therefore does not tilt the state distribution. Any non-Poisson process carries information about the time since the last arrival, and the system state is correlated with exactly that quantity, so conditioning on an arrival biases the state. Consequences. In M/M/1 the queue length seen by an arriving customer is geometric with the same $P_n$; in M/M/1/K the fraction of arrivals blocked equals the time-stationary $P_K$; the mean waiting time is $E[W_q]=E[N]/μ$ by conditioning on what the arrival sees. Counterexample. Take D/D/1: arrivals exactly every $1$ s, service exactly $0.5$ s. Each arrival finds the system empty, so the arrival-average of $1{N=0}$ is $1$. But the server is busy for half of every second, so the time-average of $1{N=0}$ is $0.5$. The two averages differ maximally, and the blocking or delay conclusions one would draw from them are completely different. A less extreme version: with Erlang-$k$ interarrivals ($k>1$) arrivals still see less congestion than the time average, since a long time has typically elapsed since the previous arrival.", "rubric": ["States PASTA as the equality of the arrival-average and the time-average state distributions.", "Attributes it to memorylessness / independent increments plus lack of anticipation, so conditioning on an arrival does not bias the state.", "Names at least one consequence, e.g. blocking probability in M/M/1/K equals $P_K$, or $E[W_q]=E[N]/μ$.", "Gives an explicit non-Poisson counterexample such as D/D/1 with period $1$ and service $0.5$.", "Computes both averages in the counterexample and shows they differ ($1$ versus $0.5$)."]}, "he": {"q": "נסח במדויק את תכונת PASTA, הסבר מדוע דווקא הגעות פואסון גורמות לה לעבוד, ותן דוגמה נגדית קונקרטית שאינה פואסונית שבה הממוצע על פני הגעות והממוצע על פני זמן אינם מסכימים.", "hint": "משווים שני ממוצעים שונים: אחד על פני זמן ואחד על פני לקוחות מגיעים. נסה הגעות דטרמיניסטיות עם שירות דטרמיניסטי.", "modelAnswer": "ניסוח. יהי $N(t)$ מצב מערכת התורים ויהי $A_k$ המצב הנראה מיד לפני ההגעה ה-$k$. PASTA (הגעות פואסון רואות ממוצעי זמן) קובעת שאם תהליך ההגעות פואסוני ומקיים את הנחת אי-הצפייה — תוספות עתידיות של תהליך ההגעות בלתי תלויות במצב המערכת הנוכחי — אזי התפלגות הממוצע על פני הגעות שווה להתפלגות הממוצע על פני זמן: $lim_K (1/K)Σ_{k≤K}1{A_k=n} = lim_T (1/T)∫_0^T 1{N(t)=n} dt = P_n$. מדוע פואסון. לתהליך פואסון תוספות בלתי תלויות והוא חסר זיכרון, ולכן להתרחשות הגעה ב-$[t,t+dt)$ הסתברות $λ dt$ ללא תלות בהיסטוריית המערכת עד $t$; לכן התניה עליה אינה מטה את התפלגות המצב. כל תהליך שאינו פואסוני נושא מידע על הזמן שחלף מההגעה האחרונה, ומצב המערכת מתואם בדיוק עם גודל זה, ולכן התניה על הגעה מטה את המצב. השלכות. ב-M/M/1 אורך התור שרואה לקוח מגיע הוא גאומטרי עם אותו $P_n$; ב-M/M/1/K חלק ההגעות הנחסמות שווה ל-$P_K$ הסטציונרי בזמן; זמן ההמתנה הממוצע הוא $E[W_q]=E[N]/μ$ מהתניה על מה שרואה ההגעה. דוגמה נגדית. ניקח D/D/1: הגעות בדיוק כל $1$ שנ', שירות בדיוק $0.5$ שנ'. כל הגעה מוצאת את המערכת ריקה, ולכן הממוצע על פני הגעות של $1{N=0}$ הוא $1$. אך השרת עסוק מחצית מכל שנייה, ולכן הממוצע על פני זמן של $1{N=0}$ הוא $0.5$. שני הממוצעים נבדלים מקסימלית, והמסקנות על חסימה או השהיה שהיו נגזרות מהם שונות לחלוטין. גרסה פחות קיצונית: עם זמני בין-הגעות ארלנג-$k$ (‏$k>1$) ההגעות עדיין רואות פחות גודש מהממוצע בזמן, שכן בדרך כלל חלף זמן רב מההגעה הקודמת.", "rubric": ["מנסח את PASTA כשוויון בין התפלגות המצב בממוצע על פני הגעות לבין ההתפלגות בממוצע על פני זמן.", "מייחס זאת לחוסר זיכרון / תוספות בלתי תלויות יחד עם אי-צפייה, כך שהתניה על הגעה אינה מטה את המצב.", "מציין לפחות השלכה אחת, למשל שהסתברות החסימה ב-M/M/1/K שווה ל-$P_K$, או $E[W_q]=E[N]/μ$.", "נותן דוגמה נגדית מפורשת שאינה פואסונית כגון D/D/1 עם מחזור $1$ ושירות $0.5$.", "מחשב את שני הממוצעים בדוגמה הנגדית ומראה שהם שונים ($1$ מול $0.5$)."]}}, {"id": "smp-001", "area": "sampling", "topic": "psd-of-sampled-process", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["sampling", "aliasing", "dtft", "psd"], "answer": 3, "en": {"q": "A WSS process $X(t)$ with PSD $S_X(f)$ is sampled at rate $f_s=1/T_s$, giving $X[n]=X(nT_s)$ with $R_X[k]=R_X(kT_s)$. Which expression is the DTFT of $R_X[k]$?", "options": ["$S_d(f)=Σ_m S_X(f-mf_s)$", "$S_d(f)=(1/T_s)S_X(f)$ for $|f|<f_s/2$", "$S_d(f)=Σ_m S_X(f-mT_s)$", "$S_d(f)=(1/T_s)Σ_m S_X(f-mf_s)$"], "hint": "Sampling in time periodises in frequency with period $f_s$, and the Fourier pair for a sampled sequence carries a $1/T_s$ scaling.", "explanation": "Sampling $R_X(τ)$ on the lattice $τ=kT_s$ replaces the continuous transform by its periodic repetition: $Σ_k R_X(kT_s)e^{-j2πfkT_s}=(1/T_s)Σ_m S_X(f-mf_s)$, periodic with period $f_s$. The $1/T_s$ factor is exactly what makes the power come out right, because the inverse DTFT carries a compensating $T_s$: $R_X[0]=T_s∫_{-f_s/2}^{f_s/2}S_d(f)df=∫_{-∞}^{∞}S_X(f)df=R_X(0)$, as it must, since $R_X[0]$ and $R_X(0)$ are the same number. If $S_X$ vanishes outside $|f|<f_s/2$ only the $m=0$ image survives inside the band and there is no aliasing; otherwise the images fold in and add.", "whyWrong": ["The periodisation is right but the $1/T_s$ scaling is missing, so the recovered power is wrong by a factor $T_s$.", "This is the no-aliasing special case written as if it always held; images at $f±f_s$ generally overlap the baseband.", "The shift is $mf_s$, a frequency, not $mT_s$, a time; shifting a spectrum by a time has no meaning dimensionally."]}, "he": {"q": "תהליך WSS בשם $X(t)$ עם PSD בשם $S_X(f)$ נדגם בקצב $f_s=1/T_s$, ומתקבל $X[n]=X(nT_s)$ עם $R_X[k]=R_X(kT_s)$. איזה ביטוי הוא ה-DTFT של $R_X[k]$?", "options": ["$S_d(f)=Σ_m S_X(f-mf_s)$", "$S_d(f)=(1/T_s)S_X(f)$ עבור $|f|<f_s/2$", "$S_d(f)=Σ_m S_X(f-mT_s)$", "$S_d(f)=(1/T_s)Σ_m S_X(f-mf_s)$"], "hint": "דגימה בזמן יוצרת מחזוריות בתדר עם מחזור $f_s$, וזוג פורייה של סדרה דגומה נושא קנה מידה של $1/T_s$.", "explanation": "דגימת $R_X(τ)$ על הסריג $τ=kT_s$ מחליפה את ההתמרה הרציפה בשכפול המחזורי שלה: $Σ_k R_X(kT_s)e^{-j2πfkT_s}=(1/T_s)Σ_m S_X(f-mf_s)$, מחזורי עם מחזור $f_s$. הגורם $1/T_s$ הוא בדיוק מה שגורם להספק לצאת נכון, שכן ה-DTFT ההופכי נושא $T_s$ מפצה: $R_X[0]=T_s∫_{-f_s/2}^{f_s/2}S_d(f)df=∫_{-∞}^{∞}S_X(f)df=R_X(0)$, כפי שחייב להיות, שכן $R_X[0]$ ו-$R_X(0)$ הם אותו מספר. אם $S_X$ מתאפס מחוץ ל-$|f|<f_s/2$, רק התמונה $m=0$ שורדת בתוך הרצועה ואין קיפול; אחרת התמונות מתקפלות פנימה ומתחברות.", "whyWrong": ["המחזוריות נכונה אך חסר קנה המידה $1/T_s$, ולכן ההספק המשוחזר שגוי בגורם $T_s$.", "זהו המקרה הפרטי של היעדר קיפול הכתוב כאילו הוא תמיד תקף; התמונות ב-$f±f_s$ בדרך כלל חופפות את פס הבסיס.", "ההזזה היא ב-$mf_s$, שהוא תדר, ולא ב-$mT_s$ שהוא זמן; הזזת ספקטרום בזמן חסרת משמעות מבחינת יחידות."]}}, {"id": "smp-002", "area": "sampling", "topic": "sampling-theorem-mean-square", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["sampling-theorem", "band-limited", "mean-square-convergence", "reconstruction"], "en": {"q": "State the sampling theorem for a band-limited WSS process and prove the reconstruction, being precise about the sense in which it holds. Why is a sure-convergence statement not available?", "hint": "$R_X(τ)$ is an ordinary band-limited deterministic function, so the classical theorem applies to it. Expand $E[|X(t)-X_r(t)|^2]$ and use that expansion three times.", "modelAnswer": "Statement. Let $X(t)$ be zero-mean WSS with $S_X(f)=0$ for $|f|>W$, and let $T_s≤1/(2W)$. Define $s_n(t)=sinc((t-nT_s)/T_s)$ and $X_r(t)=Σ_n X(nT_s)s_n(t)$. Then for every $t$, $E[|X(t)-X_r(t)|^2]=0$: the reconstruction holds in the mean-square sense. Step 1: the autocorrelation is itself band-limited. $R_X(τ)$ is a deterministic function whose Fourier transform is $S_X$, which vanishes outside $[-W,W]$. The classical (deterministic) sampling theorem therefore gives $R_X(τ)=Σ_n R_X(nT_s)sinc((τ-nT_s)/T_s)$, valid for every real $τ$ since $T_s≤1/(2W)$. Note the expansion holds for any band-limited function of the same band, a fact used twice below. Step 2: expand the error. $E[|X(t)-Σ_n X(nT_s)s_n(t)|^2] = R_X(0) - 2Σ_n s_n(t)R_X(t-nT_s) + Σ_nΣ_m s_n(t)s_m(t)R_X((n-m)T_s)$. Step 3: the cross term. Fix $t$ and apply the Step-1 expansion to the band-limited function $h(τ)=R_X(t-τ)$, whose samples are $h(nT_s)=R_X(t-nT_s)$: $h(τ)=Σ_n R_X(t-nT_s)sinc((τ-nT_s)/T_s)$. Evaluating at $τ=t$ gives $R_X(0)=Σ_n R_X(t-nT_s)s_n(t)$, so the cross term equals $R_X(0)$. Step 4: the quadratic term. Apply the expansion to $g(τ)=R_X(τ-mT_s)$, with samples $g(nT_s)=R_X((n-m)T_s)$, and evaluate at $τ=t$: $Σ_n R_X((n-m)T_s)s_n(t)=R_X(t-mT_s)$. Hence the double sum collapses to $Σ_m s_m(t)R_X(t-mT_s)=R_X(0)$ by Step 3. Step 5: combine. The error equals $R_X(0)-2R_X(0)+R_X(0)=0$. Sense of convergence. Only second-moment information about $X$ was used, so only a second-moment conclusion is available: the partial sums converge to $X(t)$ in $L^2$, i.e. in mean square, for each fixed $t$. Nothing here forces convergence for every sample path, and there is no assumption (such as sample-path continuity or a rate of spectral decay) from which a sure or uniform statement could follow; mean-square convergence does give convergence in probability and hence an a.s. convergent subsequence, but not more. Finally, if $T_s>1/(2W)$ the deterministic expansion of $R_X$ fails, aliasing folds power into the baseband, and the mean-square error is strictly positive.", "rubric": ["States the hypotheses ($S_X$ vanishes outside $[-W,W]$, $T_s≤1/(2W)$) and the sinc interpolation formula.", "Observes that $R_X(τ)$ is a deterministic band-limited function and expands it by the classical sampling theorem.", "Expands $E[|X(t)-X_r(t)|^2]$ into the three terms $R_X(0)$, cross term and double sum.", "Shows both the cross term and the double sum equal $R_X(0)$, so the error is zero.", "Explains that only mean-square convergence follows, because only second-order statistics were assumed."]}, "he": {"q": "נסח את משפט הדגימה לתהליך WSS חסום פס והוכח את השחזור, תוך דיוק במובן שבו הוא מתקיים. מדוע אין בנמצא טענת התכנסות ודאית?", "hint": "הפונקציה $R_X(τ)$ היא פונקציה דטרמיניסטית חסומת פס רגילה, ולכן המשפט הקלאסי חל עליה. פתח את $E[|X(t)-X_r(t)|^2]$ והשתמש בפיתוח הזה שלוש פעמים.", "modelAnswer": "ניסוח. יהי $X(t)$ תהליך WSS בעל תוחלת אפס עם $S_X(f)=0$ עבור $|f|>W$, ויהי $T_s≤1/(2W)$. נגדיר $s_n(t)=sinc((t-nT_s)/T_s)$ וכן $X_r(t)=Σ_n X(nT_s)s_n(t)$. אזי לכל $t$ מתקיים $E[|X(t)-X_r(t)|^2]=0$: השחזור מתקיים במובן הריבועי הממוצע. שלב 1: פונקציית האוטוקורלציה עצמה חסומת פס. הפונקציה $R_X(τ)$ היא פונקציה דטרמיניסטית שהתמרת פורייה שלה היא $S_X$, המתאפסת מחוץ ל-$[-W,W]$. לכן משפט הדגימה הקלאסי (הדטרמיניסטי) נותן $R_X(τ)=Σ_n R_X(nT_s)sinc((τ-nT_s)/T_s)$, תקף לכל $τ$ ממשי שכן $T_s≤1/(2W)$. שים לב שהפיתוח תקף לכל פונקציה חסומת פס באותה רצועה, עובדה שתשמש פעמיים בהמשך. שלב 2: פיתוח השגיאה. $E[|X(t)-Σ_n X(nT_s)s_n(t)|^2] = R_X(0) - 2Σ_n s_n(t)R_X(t-nT_s) + Σ_nΣ_m s_n(t)s_m(t)R_X((n-m)T_s)$. שלב 3: האיבר המעורב. נקבע $t$ ונחיל את הפיתוח משלב 1 על הפונקציה חסומת הפס $h(τ)=R_X(t-τ)$, שדגימותיה $h(nT_s)=R_X(t-nT_s)$: ‏$h(τ)=Σ_n R_X(t-nT_s)sinc((τ-nT_s)/T_s)$. הצבת $τ=t$ נותנת $R_X(0)=Σ_n R_X(t-nT_s)s_n(t)$, ולכן האיבר המעורב שווה ל-$R_X(0)$. שלב 4: האיבר הריבועי. נחיל את הפיתוח על $g(τ)=R_X(τ-mT_s)$, שדגימותיה $g(nT_s)=R_X((n-m)T_s)$, ונציב $τ=t$: ‏$Σ_n R_X((n-m)T_s)s_n(t)=R_X(t-mT_s)$. מכאן הסכום הכפול מתכווץ ל-$Σ_m s_m(t)R_X(t-mT_s)=R_X(0)$ לפי שלב 3. שלב 5: צירוף. השגיאה שווה ל-$R_X(0)-2R_X(0)+R_X(0)=0$. מובן ההתכנסות. השתמשנו רק במידע מומנט שני על $X$, ולכן זמינה רק מסקנת מומנט שני: הסכומים החלקיים מתכנסים ל-$X(t)$ ב-$L^2$, כלומר בריבוע ממוצע, לכל $t$ קבוע. דבר כאן אינו מאלץ התכנסות עבור כל מסלול מדגמי, ואין הנחה (כגון רציפות מסלולים או קצב דעיכה ספקטרלי) שממנה תנבע טענה ודאית או אחידה; התכנסות בריבוע ממוצע אכן גוררת התכנסות בהסתברות ולכן תת-סדרה המתכנסת כמעט תמיד, אך לא יותר מכך. לבסוף, אם $T_s>1/(2W)$ הפיתוח הדטרמיניסטי של $R_X$ נכשל, הקיפול מקפל הספק לפס הבסיס, והשגיאה הריבועית הממוצעת חיובית ממש.", "rubric": ["מנסח את ההנחות (‏$S_X$ מתאפס מחוץ ל-$[-W,W]$, ‏$T_s≤1/(2W)$) ואת נוסחת האינטרפולציה בסינק.", "מבחין ש-$R_X(τ)$ היא פונקציה דטרמיניסטית חסומת פס ומפתח אותה לפי משפט הדגימה הקלאסי.", "מפתח את $E[|X(t)-X_r(t)|^2]$ לשלושת האיברים $R_X(0)$, האיבר המעורב והסכום הכפול.", "מראה ששני האיברים, המעורב והכפול, שווים ל-$R_X(0)$, ולכן השגיאה מתאפסת.", "מסביר שנובעת רק התכנסות בריבוע ממוצע, שכן הונחו רק סטטיסטיקות מסדר שני."]}}, {"id": "smp-003", "area": "sampling", "topic": "aliased-psd-computation", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["aliasing", "psd", "sampling", "noise-power"], "answer": 0, "en": {"q": "$X(t)$ has $S_X(f)=2$ W/Hz for $|f|≤300$ Hz and $0$ elsewhere. It is sampled at $f_s=400$ Hz. Using $S_d(f)=(1/T_s)Σ_m S_X(f-mf_s)$, evaluate $S_d$ at $f=150$ Hz.", "options": ["$1600$ W/Hz", "$800$ W/Hz", "$4$ W/Hz", "$2$ W/Hz"], "hint": "List the shifted arguments $150-mf_s$ for $m=…,-1,0,1,…$ and keep only those falling inside $[-300,300]$.", "explanation": "The shifted arguments are $150-400m$: for $m=0$ we get $150$, inside the band, contributing $2$; for $m=1$ we get $-250$, also inside the band, contributing $2$; for $m=-1$ we get $550$, outside; all other $m$ are outside. The sum is $4$ W/Hz, and multiplying by $1/T_s=f_s=400$ gives $S_d(150)=1600$ W/Hz. The band $|f|<100$ Hz receives only one image and sits at $800$, so undersampling has raised the density non-uniformly. Power check: $T_s∫_{-200}^{200}S_d df=(1/400)(800·200+1600·200)=1200$ W, which equals $∫_{-300}^{300}2 df=1200$ W, as it must.", "whyWrong": ["$800$ keeps only the $m=0$ image; it is the correct value for $|f|<100$ Hz but misses the folded contribution at $f=150$.", "$4$ is the aliased sum before the $1/T_s$ scaling, so it is wrong by a factor of $400$.", "$2$ is the original density, as if sampling neither folded the spectrum nor rescaled it."]}, "he": {"q": "לתהליך $X(t)$ מתקיים $S_X(f)=2$ ואט/הרץ עבור $|f|≤300$ הרץ ו-$0$ אחרת. הוא נדגם ב-$f_s=400$ הרץ. בעזרת $S_d(f)=(1/T_s)Σ_m S_X(f-mf_s)$, חשב את $S_d$ ב-$f=150$ הרץ.", "options": ["$1600$ ואט/הרץ", "$800$ ואט/הרץ", "$4$ ואט/הרץ", "$2$ ואט/הרץ"], "hint": "רשום את הארגומנטים המוזזים $150-mf_s$ עבור $m=…,-1,0,1,…$ והשאר רק את אלה הנופלים בתוך $[-300,300]$.", "explanation": "הארגומנטים המוזזים הם $150-400m$: עבור $m=0$ מקבלים $150$, בתוך הרצועה, ותרומתו $2$; עבור $m=1$ מקבלים $-250$, גם בתוך הרצועה, ותרומתו $2$; עבור $m=-1$ מקבלים $550$, מחוץ לרצועה; כל שאר ערכי $m$ מחוץ לרצועה. הסכום הוא $4$ ואט/הרץ, וכפל ב-$1/T_s=f_s=400$ נותן $S_d(150)=1600$ ואט/הרץ. הרצועה $|f|<100$ הרץ מקבלת תמונה אחת בלבד ויושבת על $800$, כך שתת-דגימה העלתה את הצפיפות באופן לא אחיד. בדיקת הספק: $T_s∫_{-200}^{200}S_d df=(1/400)(800·200+1600·200)=1200$ ואט, השווה ל-$∫_{-300}^{300}2 df=1200$ ואט, כנדרש.", "whyWrong": ["הערך $800$ שומר רק את התמונה $m=0$; הוא הערך הנכון עבור $|f|<100$ הרץ אך מפספס את התרומה המקופלת ב
