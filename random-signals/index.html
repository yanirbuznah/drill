ind $R_X[0]$ and $R_X[2]$.", "options": ["$R_X[0]=3$, $R_X[2]=0.75$", "$R_X[0]=4$, $R_X[2]=1$", "$R_X[0]=4$, $R_X[2]=2$", "$R_X[0]=12$, $R_X[2]=3$"], "hint": "Square the recursion and use $E[X[n-1]W[n]] = 0$; then propagate with $R_X[k] = a R_X[k-1]$.", "explanation": "Squaring gives $R_X[0] = a^2R_X[0] + σ_W^2$, so $R_X[0] = 3/(1-0.25) = 4$. Multiplying the recursion by $X[n-k]$ and taking expectations gives $R_X[k] = 0.5 R_X[k-1]$, hence $R_X[k] = 4(0.5)^{|k|}$ and $R_X[2] = 4(0.25) = 1$.", "whyWrong": ["$R_X[0]=3$ takes the driving-noise variance as the process variance, ignoring the amplification factor $1/(1-a^2)$.", "$R_X[2]=2$ decays by only one factor of $a$; the lag-2 value needs $a^2 = 0.25$, not $a = 0.5$.", "$R_X[0]=12$ uses $σ_W^2/(1-a)$ instead of $σ_W^2/(1-a^2)$, a very common slip in the Yule-Walker step."]}, "he": {"q": "תהליך AR(1) סטציונרי מקיים $X[n] = 0.5X[n-1] + W[n]$, כאשר $W[n]$ לבן בעל תוחלת אפס ושונות $3$. מצא את $R_X[0]$ ואת $R_X[2]$.", "options": ["$R_X[0]=3$, $R_X[2]=0.75$", "$R_X[0]=4$, $R_X[2]=1$", "$R_X[0]=4$, $R_X[2]=2$", "$R_X[0]=12$, $R_X[2]=3$"], "hint": "העלה את רקורסיית העדכון בריבוע והשתמש ב-$E[X[n-1]W[n]] = 0$; אחר כך המשך עם $R_X[k] = a R_X[k-1]$.", "explanation": "העלאה בריבוע נותנת $R_X[0] = a^2R_X[0] + σ_W^2$, ולכן $R_X[0] = 3/(1-0.25) = 4$. הכפלת הרקורסיה ב-$X[n-k]$ ולקיחת תוחלת נותנת $R_X[k] = 0.5 R_X[k-1]$, ומכאן $R_X[k] = 4(0.5)^{|k|}$ ו-$R_X[2] = 4(0.25) = 1$.", "whyWrong": ["$R_X[0]=3$ מזהה את שונות רעש ההנעה עם שונות התהליך, ומתעלם מפקטור ההגברה $1/(1-a^2)$.", "$R_X[2]=2$ דועך בפקטור $a$ אחד בלבד; ערך ההשהיה $2$ דורש $a^2 = 0.25$ ולא $a = 0.5$.", "$R_X[0]=12$ משתמש ב-$σ_W^2/(1-a)$ במקום ב-$σ_W^2/(1-a^2)$, טעות נפוצה מאוד בשלב יול-ווקר."]}}, {"id": "lti-016", "area": "lti", "topic": "ma1-autocorrelation", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["ma1", "discrete-time", "autocorrelation", "finite-support"], "answer": 2, "en": {"q": "$X[n]$ is zero-mean white with variance $4$, and $Y[n] = X[n] + 0.5X[n-1]$. What are $R_Y[0]$, $R_Y[1]$ and $R_Y[2]$?", "options": ["$R_Y[0]=4$, $R_Y[1]=2$, $R_Y[2]=0$", "$R_Y[0]=5$, $R_Y[1]=2$, $R_Y[2]=1$", "$R_Y[0]=5$, $R_Y[1]=2$, $R_Y[2]=0$", "$R_Y[0]=6$, $R_Y[1]=4$, $R_Y[2]=0$"], "hint": "Expand $E[Y[n]Y[n+k]]$ and keep only the terms whose white-noise indices coincide.", "explanation": "$R_Y[0] = σ^2(1+0.5^2) = 4(1.25) = 5$. $R_Y[1] = σ^2(0.5) = 2$. For $|k| ≥ 2$ no white-noise indices coincide, so $R_Y[2] = 0$. An MA(q) process always has autocorrelation identically zero beyond lag $q$; here $q = 1$.", "whyWrong": ["$R_Y[0]=4$ forgets the contribution $b^2σ^2 = 1$ from the delayed term; the total power is $σ^2(1+b^2)$.", "$R_Y[2]=1$ would require an infinite-memory model; an MA(1) has strictly finite correlation length, so lag $2$ must vanish.", "$R_Y[0]=6$, $R_Y[1]=4$ uses $σ^2(1+2b) $ and $2bσ^2$, i.e. crosses the coefficients linearly instead of squaring where needed."]}, "he": {"q": "‏$X[n]$ לבן בעל תוחלת אפס ושונות $4$, ו-$Y[n] = X[n] + 0.5X[n-1]$. מהם $R_Y[0]$, ‏$R_Y[1]$ ו-$R_Y[2]$?", "options": ["$R_Y[0]=4$, $R_Y[1]=2$, $R_Y[2]=0$", "$R_Y[0]=5$, $R_Y[1]=2$, $R_Y[2]=1$", "$R_Y[0]=5$, $R_Y[1]=2$, $R_Y[2]=0$", "$R_Y[0]=6$, $R_Y[1]=4$, $R_Y[2]=0$"], "hint": "פתח את $E[Y[n]Y[n+k]]$ והשאר רק את האיברים שבהם אינדקסי הרעש הלבן מתלכדים.", "explanation": "$R_Y[0] = σ^2(1+0.5^2) = 4(1.25) = 5$. ‏$R_Y[1] = σ^2(0.5) = 2$. עבור $|k| ≥ 2$ אף אינדקסי רעש אינם מתלכדים, ולכן $R_Y[2] = 0$. לתהליך MA(q) האוטוקורלציה מתאפסת זהותית מעבר להשהיה $q$; כאן $q = 1$.", "whyWrong": ["$R_Y[0]=4$ שוכח את התרומה $b^2σ^2 = 1$ מהאיבר המושהה; ההספק הכולל הוא $σ^2(1+b^2)$.", "$R_Y[2]=1$ היה דורש מודל בעל זיכרון אינסופי; ל-MA(1) יש אורך קורלציה סופי לחלוטין, ולכן השהיה $2$ חייבת להתאפס.", "$R_Y[0]=6$, $R_Y[1]=4$ משתמש ב-$σ^2(1+2b)$ וב-$2bσ^2$, כלומר מערבב את המקדמים לינארית במקום להעלות בריבוע היכן שצריך."]}}, {"id": "lti-017", "area": "lti", "topic": "moving-average-smoother", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["moving-average", "smoothing", "white-noise", "discrete-time"], "answer": 3, "en": {"q": "$X[n]$ is white with variance $σ^2$ and is smoothed by $Y[n] = (1/3)(X[n]+X[n-1]+X[n-2])$. What are $R_Y[0]$ and $R_Y[2]$?", "options": ["$R_Y[0]=σ^2$, $R_Y[2]=σ^2/3$", "$R_Y[0]=σ^2/9$, $R_Y[2]=σ^2/27$", "$R_Y[0]=3σ^2$, $R_Y[2]=σ^2$", "$R_Y[0]=σ^2/3$, $R_Y[2]=σ^2/9$"], "hint": "For white input, $R_Y[k] = σ^2 Σ_m h[m]h[m+k]$; count how many taps overlap at each lag.", "explanation": "With $h = (1/3,1/3,1/3)$: $R_Y[0] = σ^2·3·(1/9) = σ^2/3$, $R_Y[1] = σ^2·2·(1/9) = 2σ^2/9$, $R_Y[2] = σ^2·1·(1/9) = σ^2/9$, and $R_Y[k] = 0$ for $|k| ≥ 3$. The smoother cuts the power to a third and creates correlation over two lags — it trades variance for memory.", "whyWrong": ["$R_Y[0]=σ^2$ ignores the $1/3$ normalisation entirely; averaging three independent samples must reduce the variance.", "$R_Y[0]=σ^2/9$ applies $1/9$ once but forgets that three taps each contribute $σ^2/9$, giving $3σ^2/9 = σ^2/3$.", "$R_Y[0]=3σ^2$ sums the three variances without the $1/3$ gain; a normalised smoother cannot increase the power of white input."]}, "he": {"q": "‏$X[n]$ לבן עם שונות $σ^2$ ומוחלק על ידי $Y[n] = (1/3)(X[n]+X[n-1]+X[n-2])$. מהם $R_Y[0]$ ו-$R_Y[2]$?", "options": ["$R_Y[0]=σ^2$, $R_Y[2]=σ^2/3$", "$R_Y[0]=σ^2/9$, $R_Y[2]=σ^2/27$", "$R_Y[0]=3σ^2$, $R_Y[2]=σ^2$", "$R_Y[0]=σ^2/3$, $R_Y[2]=σ^2/9$"], "hint": "עבור כניסה לבנה, $R_Y[k] = σ^2 Σ_m h[m]h[m+k]$; ספור כמה מקדמים חופפים בכל השהיה.", "explanation": "עם $h = (1/3,1/3,1/3)$: ‏$R_Y[0] = σ^2·3·(1/9) = σ^2/3$, ‏$R_Y[1] = σ^2·2·(1/9) = 2σ^2/9$, ‏$R_Y[2] = σ^2·1·(1/9) = σ^2/9$, ו-$R_Y[k] = 0$ עבור $|k| ≥ 3$. המחליק מקטין את ההספק לשליש ויוצר קורלציה על שתי השהיות — הוא מחליף שונות בזיכרון.", "whyWrong": ["$R_Y[0]=σ^2$ מתעלם לגמרי מהנרמול $1/3$; מיצוע של שלוש דגימות בלתי תלויות חייב להקטין את השונות.", "$R_Y[0]=σ^2/9$ מפעיל $1/9$ פעם אחת אך שוכח ששלושה מקדמים תורמים כל אחד $σ^2/9$, ובסך הכל $3σ^2/9 = σ^2/3$.", "$R_Y[0]=3σ^2$ מסכם את שלוש השונויות ללא ההגבר $1/3$; מחליק מנורמל אינו יכול להגדיל את הספק הכניסה הלבנה."]}}, {"id": "lti-018", "area": "lti", "topic": "discrete-spectral-relation", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["discrete-time", "psd", "transfer-function"], "answer": 0, "en": {"q": "A WSS discrete-time process $X[n]$ with PSD $S_X(e^{jω})$ is filtered by a stable LTI system with frequency response $H(e^{jω})$. What is the PSD of the output?", "options": ["$S_Y(e^{jω}) = |H(e^{jω})|^2 S_X(e^{jω})$", "$S_Y(e^{jω}) = H(e^{jω}) S_X(e^{jω})$", "$S_Y(e^{jω}) = |H(e^{jω})|^2 S_X(e^{jω})/2π$", "$S_Y(e^{jω}) = |H(e^{jω})| S_X(e^{jω})$"], "hint": "The discrete-time relation is the exact analogue of the continuous-time one; the DTFT of $h[-n]$ is $H^*(e^{jω})$.", "explanation": "$R_Y[k] = h[k] * h[-k] * R_X[k]$, and the DTFT of $h[-k]$ for real $h$ is $H^*(e^{jω})$. Hence $S_Y(e^{jω}) = H(e^{jω})H^*(e^{jω})S_X(e^{jω}) = |H(e^{jω})|^2 S_X(e^{jω})$, which is real and non-negative, as a PSD must be.", "whyWrong": ["$H(e^{jω})S_X$ is complex-valued for a general filter, so it cannot be a power spectral density.", "The factor $1/2π$ belongs to the inverse DTFT $R_X[k] = (1/2π)∫S_X(e^{jω})e^{jωk}dω$, not to the filtering relation.", "$|H(e^{jω})|$ without the square is a voltage-type gain; power scales as the square of amplitude."]}, "he": {"q": "תהליך בזמן בדיד $X[n]$ מסוג WSS עם PSD ‏$S_X(e^{jω})$ מסונן על ידי מערכת LTI יציבה עם תגובת תדר $H(e^{jω})$. מהי ה-PSD של המוצא?", "options": ["$S_Y(e^{jω}) = |H(e^{jω})|^2 S_X(e^{jω})$", "$S_Y(e^{jω}) = H(e^{jω}) S_X(e^{jω})$", "$S_Y(e^{jω}) = |H(e^{jω})|^2 S_X(e^{jω})/2π$", "$S_Y(e^{jω}) = |H(e^{jω})| S_X(e^{jω})$"], "hint": "היחס בזמן בדיד הוא האנלוג המדויק של היחס בזמן רציף; ה-DTFT של $h[-n]$ הוא $H^*(e^{jω})$.", "explanation": "$R_Y[k] = h[k] * h[-k] * R_X[k]$, וה-DTFT של $h[-k]$ עבור $h$ ממשי הוא $H^*(e^{jω})$. לכן $S_Y(e^{jω}) = H(e^{jω})H^*(e^{jω})S_X(e^{jω}) = |H(e^{jω})|^2 S_X(e^{jω})$, שהוא ממשי ואי-שלילי כנדרש מ-PSD.", "whyWrong": ["$H(e^{jω})S_X$ הוא מרוכב עבור מסנן כללי, ולכן אינו יכול להיות צפיפות ספקטרלית של הספק.", "הפקטור $1/2π$ שייך ל-DTFT ההפוכה $R_X[k] = (1/2π)∫S_X(e^{jω})e^{jωk}dω$, ולא ליחס הסינון.", "$|H(e^{jω})|$ ללא ריבוע הוא הגבר מסוג מתח; ההספק משתנה כריבוע המשרעת."]}}, {"id": "lti-019", "area": "lti", "topic": "ar1-spectrum", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["ar1", "psd", "discrete-time", "magnitude-squared"], "answer": 1, "en": {"q": "White noise of variance $σ^2$ drives $H(z) = 1/(1-0.9z^{-1})$. What is the ratio $S_Y(e^{j0})/S_Y(e^{jπ})$ of the output PSD at DC to its value at $ω = π$?", "options": ["$19$", "$361$", "$100$", "$3.61$"], "hint": "$S_Y(e^{jω}) = σ^2/|1-0.9e^{-jω}|^2$; evaluate the denominator at $ω=0$ and $ω=π$ before dividing.", "explanation": "$S_Y(e^{jω}) = σ^2/|1-0.9e^{-jω}|^2$. At $ω=0$ the denominator is $(1-0.9)^2 = 0.01$, giving $100σ^2$. At $ω=π$ it is $(1+0.9)^2 = 3.61$, giving $σ^2/3.61$. The ratio is $3.61/0.01 = 361$, a $25.6$ dB tilt — the pole near $z=1$ makes the process strongly low-pass.", "whyWrong": ["$19 = 1.9/0.1$ compares the magnitudes $|1-0.9e^{-jω}|$ without squaring them, i.e. omits the $|H|^2$ step.", "$100$ is $S_Y(e^{j0})/σ^2$ alone: the DC value was computed but never divided by the value at $ω=π$.", "$3.61$ is the denominator at $ω=π$; it is the reciprocal-style factor, not the ratio of the two PSD values."]}, "he": {"q": "רעש לבן בעל שונות $σ^2$ מוזן ל-$H(z) = 1/(1-0.9z^{-1})$. מהו היחס $S_Y(e^{j0})/S_Y(e^{jπ})$ בין ה-PSD של המוצא ב-DC לערכה ב-$ω = π$?", "options": ["$19$", "$361$", "$100$", "$3.61$"], "hint": "$S_Y(e^{jω}) = σ^2/|1-0.9e^{-jω}|^2$; חשב את המכנה ב-$ω=0$ וב-$ω=π$ לפני החילוק.", "explanation": "$S_Y(e^{jω}) = σ^2/|1-0.9e^{-jω}|^2$. ב-$ω=0$ המכנה הוא $(1-0.9)^2 = 0.01$, ומתקבל $100σ^2$. ב-$ω=π$ המכנה הוא $(1+0.9)^2 = 3.61$, ומתקבל $σ^2/3.61$. היחס הוא $3.61/0.01 = 361$, כלומר הטיה של כ-$25.6$ dB — הקוטב הקרוב ל-$z=1$ הופך את התהליך למעביר-נמוכים מובהק.", "whyWrong": ["$19 = 1.9/0.1$ משווה את הגדלים $|1-0.9e^{-jω}|$ בלי להעלותם בריבוע, כלומר מדלג על שלב $|H|^2$.", "$100$ הוא $S_Y(e^{j0})/σ^2$ בלבד: ערך ה-DC חושב אך מעולם לא חולק בערך ב-$ω=π$.", "$3.61$ הוא המכנה ב-$ω=π$; זהו פקטור הפוך במהותו ולא היחס בין שני ערכי ה-PSD."]}}, {"id": "lti-020", "area": "lti", "topic": "whitening-filter-innovations", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["whitening", "innovations", "spectral-factorization", "ar1"], "en": {"q": "$X[n]$ is the stationary AR(1) process $X[n] = 0.8X[n-1] + W[n]$ with $W[n]$ white of variance $σ_W^2$. Give the whitening filter, explain what the innovations are, and state the general condition for such a filter to exist and be usable.", "hint": "The whitening filter undoes the shaping filter; think about what $1/H(z)$ must satisfy to be stable and causal.", "modelAnswer": "The process is white noise shaped by $H(z) = 1/(1-0.8z^{-1})$, so $S_X(e^{jω}) = σ_W^2/|1-0.8e^{-jω}|^2$. The whitening filter is the inverse, $G(z) = 1/H(z) = 1-0.8z^{-1}$: feeding $X$ through it gives $X[n] - 0.8X[n-1] = W[n]$, which is white with flat PSD $σ_W^2$. The innovation at time $n$ is $W[n] = X[n] - 0.8X[n-1]$, i.e. the part of $X[n]$ that cannot be linearly predicted from the past; $0.8X[n-1]$ is the one-step linear prediction and $σ_W^2$ is the minimum mean-square prediction error. In general, if $S_X(e^{jω}) = σ^2|H(e^{jω})|^2$ with $H$ the minimum-phase (causal, causally invertible) spectral factor, then $G = 1/H$ is a stable causal whitening filter. This requires a spectral factorization to exist, i.e. the Paley-Wiener condition $∫_{-π}^{π} |ln S_X(e^{jω})|dω < ∞$, so $S_X$ must not vanish on a set of positive measure; and all zeros and poles of $H(z)$ must lie strictly inside the unit circle, which holds here since the only pole is at $z = 0.8$. A process with an ideally band-limited spectrum, for instance, is deterministic in this sense and admits no such whitening filter.", "rubric": ["Identifies the whitening filter as $G(z) = 1-0.8z^{-1}$ and shows its output is $W[n]$, white with PSD $σ_W^2$.", "Defines the innovation as the unpredictable part $X[n]$ minus its best linear prediction from the past.", "Links the innovation variance $σ_W^2$ to the minimum one-step prediction error.", "States that whitening needs a minimum-phase spectral factor $S_X = σ^2|H|^2$ with $1/H$ stable and causal.", "Mentions the Paley-Wiener / non-vanishing-spectrum condition (or equivalently that a purely deterministic process cannot be whitened)."]}, "he": {"q": "‏$X[n]$ הוא תהליך AR(1) סטציונרי $X[n] = 0.8X[n-1] + W[n]$ עם $W[n]$ לבן בעל שונות $σ_W^2$. תן את מסנן ההלבנה, הסבר מהן החדשנויות (innovations), ונסח את התנאי הכללי לקיומו ולשימושיותו של מסנן כזה.", "hint": "מסנן ההלבנה מבטל את מסנן העיצוב; חשוב מה $1/H(z)$ צריך לקיים כדי להיות יציב וסיבתי.", "modelAnswer": "התהליך הוא רעש לבן שעוצב על ידי $H(z) = 1/(1-0.8z^{-1})$, ולכן $S_X(e^{jω}) = σ_W^2/|1-0.8e^{-jω}|^2$. מסנן ההלבנה הוא ההופכי, $G(z) = 1/H(z) = 1-0.8z^{-1}$: העברת $X$ דרכו נותנת $X[n] - 0.8X[n-1] = W[n]$, שהוא לבן עם PSD שטוחה $σ_W^2$. החדשנות בזמן $n$ היא $W[n] = X[n] - 0.8X[n-1]$, כלומר החלק של $X[n]$ שאינו ניתן לחיזוי לינארי מהעבר; $0.8X[n-1]$ הוא החיזוי הלינארי לצעד אחד ו-$σ_W^2$ הוא שגיאת החיזוי המינימלית בממוצע ריבועי. באופן כללי, אם $S_X(e^{jω}) = σ^2|H(e^{jω})|^2$ כאשר $H$ הוא הגורם הספקטרלי בעל פאזה מינימלית (סיבתי והפיך סיבתית), אז $G = 1/H$ הוא מסנן הלבנה יציב וסיבתי. לשם כך נדרש קיום פירוק ספקטרלי, כלומר תנאי פיילי-וינר $∫_{-π}^{π} |ln S_X(e^{jω})|dω < ∞$, ולכן $S_X$ אינה יכולה להתאפס על קבוצה בעלת מידה חיובית; וכן כל האפסים והקטבים של $H(z)$ חייבים להיות ממש בתוך מעגל היחידה, וזה מתקיים כאן כי הקוטב היחיד הוא ב-$z = 0.8$. תהליך בעל ספקטרום חסום סרט אידיאלי, למשל, הוא דטרמיניסטי במובן זה ואינו מאפשר מסנן הלבנה כזה.", "rubric": ["מזהה את מסנן ההלבנה כ-$G(z) = 1-0.8z^{-1}$ ומראה שהמוצא שלו הוא $W[n]$, לבן עם PSD ‏$σ_W^2$.", "מגדיר את החדשנות כחלק הבלתי ניתן לחיזוי: $X[n]$ פחות החיזוי הלינארי הטוב ביותר מהעבר.", "מקשר בין שונות החדשנות $σ_W^2$ לבין שגיאת החיזוי המינימלית לצעד אחד.", "מציין שהלבנה מחייבת גורם ספקטרלי בעל פאזה מינימלית $S_X = σ^2|H|^2$ כאשר $1/H$ יציב וסיבתי.", "מזכיר את תנאי פיילי-וינר או את אי-התאפסות הספקטרום (או שקול לכך: תהליך דטרמיניסטי לחלוטין אינו ניתן להלבנה)."]}}, {"id": "lti-021", "area": "lti", "topic": "output-snr", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["snr", "bandpass", "white-noise", "sinusoid"], "answer": 2, "en": {"q": "The signal $2cos(2π·1000t)$ plus white noise of two-sided PSD $10^{-4}$ W/Hz enters an ideal unit-gain band-pass filter passing $900 ≤ |f| ≤ 1100$ Hz. What is the output SNR?", "options": ["$100$ (20 dB)", "$25$ (14 dB)", "$50$ (17 dB)", "$200$ (23 dB)"], "hint": "Signal power of $Acos(·)$ is $A^2/2$; noise power counts both the positive and negative passbands.", "explanation": "The tone at $1000$ Hz lies in the passband and is unattenuated, so signal power is $A^2/2 = 4/2 = 2$ W. The filter passes $200$ Hz on each side of the origin, a total of $400$ Hz, so noise power is $400·10^{-4} = 0.04$ W. Hence $SNR = 2/0.04 = 50$, about $17$ dB.", "whyWrong": ["$100$ counts only the positive-frequency band, halving the noise to $0.02$ W and doubling the reported SNR.", "$25$ takes the signal power as $A^2/4$ instead of $A^2/2$, a factor-of-two slip in the sinusoid's mean-square value.", "$200$ uses $A^2 = 4$ W as the signal power, forgetting that a cosine has mean-square value $A^2/2$."]}, "he": {"q": "האות $2cos(2π·1000t)$ בתוספת רעש לבן עם PSD דו-צדדית $10^{-4}$ ואט/הרץ נכנס למסנן מעביר-סרט אידיאלי בעל הגבר יחידה המעביר $900 ≤ |f| ≤ 1100$ הרץ. מהו יחס אות לרעש במוצא?", "options": ["$100$ (20 dB)", "$25$ (14 dB)", "$50$ (17 dB)", "$200$ (23 dB)"], "hint": "הספק של $Acos(·)$ הוא $A^2/2$; הספק הרעש נספר גם בסרט החיובי וגם בשלילי.", "explanation": "הטון ב-$1000$ הרץ נמצא בתחום המעבר ואינו מוחלש, ולכן הספק האות הוא $A^2/2 = 4/2 = 2$ ואט. המסנן מעביר $200$ הרץ בכל צד של הראשית, בסך הכל $400$ הרץ, ולכן הספק הרעש הוא $400·10^{-4} = 0.04$ ואט. מכאן $SNR = 2/0.04 = 50$, כלומר כ-$17$ dB.", "whyWrong": ["$100$ סופר רק את סרט התדרים החיוביים, מקטין את הרעש ל-$0.02$ ואט ומכפיל את ה-SNR המדווח.", "$25$ לוקח את הספק האות כ-$A^2/4$ במקום $A^2/2$, טעות של פקטור שתיים בערך הריבועי הממוצע של הסינוס.", "$200$ משתמש ב-$A^2 = 4$ ואט כהספק האות, ושוכח שלקוסינוס יש ערך ריבועי ממוצע $A^2/2$."]}}, {"id": "lti-022", "area": "lti", "topic": "output-power-gain", "difficulty": 4, "type": "open", "hardnessSource": "trap", "tags": ["output-power", "gain", "psd", "bounds"], "en": {"q": "A student claims that filtering can never increase power, so $R_Y(0) ≤ R_X(0)$ always. Explain why this is false, give a concrete example with numbers, and state the correct bound on $R_Y(0)$.", "hint": "Write $R_Y(0)$ as an integral and ask what happens if $|H(f)|$ exceeds $1$ where $S_X$ has its mass.", "modelAnswer": "The claim confuses a filter with an attenuator. The correct statement is $R_Y(0) = ∫|H(f)|^2 S_X(f)df$, a weighted integral of the input spectrum with weight $|H(f)|^2$. If $|H(f)| > 1$ over the band where $S_X$ carries its power, the output power exceeds the input power. Example: let $X(t) = Acos(2πf_0t+Θ)$ with $Θ$ uniform, so $R_X(0) = A^2/2$ and $S_X(f) = (A^2/4)[δ(f-f_0)+δ(f+f_0)]$. An amplifier with $|H(f_0)| = 10$ gives $S_Y(f) = 100S_X(f)$ and $R_Y(0) = 100·A^2/2$, a hundred-fold power increase. Even a passive-looking filter can raise power if it has resonant gain above unity. The correct bounds are $R_Y(0) ≤ (sup_f |H(f)|^2)·R_X(0)$ and $R_Y(0) ≥ (inf_f |H(f)|^2)·R_X(0)$, both immediate from the integral. Only when $|H(f)| ≤ 1$ for all $f$ — a genuinely non-amplifying filter — does $R_Y(0) ≤ R_X(0)$ hold. Note that the inequality $|R_Y(τ)| ≤ R_Y(0)$ is a separate fact about a single autocorrelation and says nothing about comparing input and output.", "rubric": ["Writes $R_Y(0) = ∫|H(f)|^2 S_X(f)df$ and identifies $|H(f)|^2$ as the weight.", "Explains that $|H(f)| > 1$ on the support of $S_X$ makes $R_Y(0) > R_X(0)$.", "Gives a concrete numeric example (e.g. a sinusoid or narrowband process through a gain of $10$, giving a factor $100$).", "States the correct bound $R_Y(0) ≤ (sup_f|H(f)|^2)R_X(0)$, with equality of the claim only when $|H| ≤ 1$ everywhere.", "Does not confuse this with the valid inequality $|R_Y(τ)| ≤ R_Y(0)$ inside a single process."]}, "he": {"q": "סטודנט טוען שסינון לעולם אינו יכול להגדיל הספק, ולכן תמיד $R_Y(0) ≤ R_X(0)$. הסבר מדוע הטענה שגויה, תן דוגמה מספרית קונקרטית, ונסח את החסם הנכון על $R_Y(0)$.", "hint": "כתוב את $R_Y(0)$ כאינטגרל ושאל מה קורה אם $|H(f)|$ גדול מ-$1$ במקום שבו מרוכזת המסה של $S_X$.", "modelAnswer": "הטענה מבלבלת בין מסנן לבין מנחת. הניסוח הנכון הוא $R_Y(0) = ∫|H(f)|^2 S_X(f)df$, אינטגרל משוקלל של ספקטרום הכניסה עם משקל $|H(f)|^2$. אם $|H(f)| > 1$ בתחום שבו $S_X$ נושאת את ההספק שלה, הספק המוצא גדול מהספק הכניסה. דוגמה: יהי $X(t) = Acos(2πf_0t+Θ)$ עם $Θ$ אחיד, ולכן $R_X(0) = A^2/2$ ו-$S_X(f) = (A^2/4)[δ(f-f_0)+δ(f+f_0)]$. מגבר עם $|H(f_0)| = 10$ נותן $S_Y(f) = 100S_X(f)$ ו-$R_Y(0) = 100·A^2/2$, כלומר גידול פי מאה בהספק. גם מסנן שנראה פסיבי יכול להגדיל הספק אם יש לו הגבר תהודה מעל היחידה. החסמים הנכונים הם $R_Y(0) ≤ (sup_f |H(f)|^2)·R_X(0)$ וכן $R_Y(0) ≥ (inf_f |H(f)|^2)·R_X(0)$, ושניהם נובעים מיד מהאינטגרל. רק כאשר $|H(f)| ≤ 1$ לכל $f$ — מסנן שאינו מגביר באמת — מתקיים $R_Y(0) ≤ R_X(0)$. יש לשים לב שאי-השוויון $|R_Y(τ)| ≤ R_Y(0)$ הוא עובדה נפרדת על אוטוקורלציה יחידה ואינו אומר דבר על השוואת כניסה למוצא.", "rubric": ["כותב $R_Y(0) = ∫|H(f)|^2 S_X(f)df$ ומזהה את $|H(f)|^2$ כמשקל.", "מסביר ש-$|H(f)| > 1$ על תומך $S_X$ גורם ל-$R_Y(0) > R_X(0)$.", "נותן דוגמה מספרית קונקרטית (למשל סינוס או תהליך צר-סרט דרך הגבר $10$, ומכאן פקטור $100$).", "מנסח את החסם הנכון $R_Y(0) ≤ (sup_f|H(f)|^2)R_X(0)$, כאשר טענת הסטודנט נכונה רק אם $|H| ≤ 1$ בכל מקום.", "אינו מבלבל זאת עם אי-השוויון התקף $|R_Y(τ)| ≤ R_Y(0)$ בתוך תהליך יחיד."]}}, {"id": "lti-023", "area": "lti", "topic": "delay-element", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["delay", "psd", "allpass", "phase"], "answer": 3, "en": {"q": "$X(t)$ is WSS and $Y(t) = X(t-t_0)$ for a fixed delay $t_0 > 0$. Which statement about the second-order statistics of $Y$ is correct?", "options": ["$S_Y(f) = e^{-j2πft_0}S_X(f)$, a phase-shifted spectrum.", "$R_Y(τ) = R_X(τ-t_0)$, the autocorrelation is shifted.", "$S_Y(f) = S_X(f)cos(2πft_0)$, with a cosine weighting.", "$R_Y(τ) = R_X(τ)$, hence $S_Y(f) = S_X(f)$."], "hint": "Compute $E[Y(t)Y(t+τ)]$ directly: both copies of $X$ are shifted by the same amount.", "explanation": "$R_Y(τ) = E[X(t-t_0)X(t+τ-t_0)] = R_X(τ)$, since the common shift cancels. Equivalently $H(f) = e^{-j2πft_0}$ has $|H(f)|^2 = 1$, so $S_Y(f) = S_X(f)$. Pure delay is all-pass: it changes phase, and phase is invisible to the PSD. Note $R_{XY}(τ) = R_X(τ-t_0)$ does shift — the cross-correlation is where the delay shows up.", "whyWrong": ["The phase factor appears in $H(f)$, but the PSD relation uses $|H(f)|^2 = 1$, so no phase survives in $S_Y$.", "$R_X(τ-t_0)$ is the cross-correlation $R_{XY}(τ)$, not $R_Y(τ)$; in $R_Y$ both arguments are delayed and the shift cancels.", "A cosine weighting would come from adding $X(t)$ and $X(t-t_0)$, which is a comb filter, not from a pure delay."]}, "he": {"q": "‏$X(t)$ הוא WSS ו-$Y(t) = X(t-t_0)$ עבור השהיה קבועה $t_0 > 0$. איזו טענה על הסטטיסטיקה מסדר שני של $Y$ נכונה?", "options": ["$S_Y(f) = e^{-j2πft_0}S_X(f)$, ספקטרום מוסט בפאזה.", "$R_Y(τ) = R_X(τ-t_0)$, האוטוקורלציה מוסטת.", "$S_Y(f) = S_X(f)cos(2πft_0)$, עם שקלול קוסינוסי.", "$R_Y(τ) = R_X(τ)$, ומכאן $S_Y(f) = S_X(f)$."], "hint": "חשב ישירות את $E[Y(t)Y(t+τ)]$: שני העותקים של $X$ מוסטים באותה מידה.", "explanation": "$R_Y(τ) = E[X(t-t_0)X(t+τ-t_0)] = R_X(τ)$, מפני שההסטה המשותפת מתבטלת. באופן שקול, ל-$H(f) = e^{-j2πft_0}$ יש $|H(f)|^2 = 1$, ולכן $S_Y(f) = S_X(f)$. השהיה טהורה היא מעביר-כול: היא משנה פאזה, והפאזה בלתי נראית ל-PSD. שים לב ש-$R_{XY}(τ) = R_X(τ-t_0)$ כן מוסטת — הקורלציה ההדדית היא המקום שבו ההשהיה מתגלה.", "whyWrong": ["גורם הפאזה מופיע ב-$H(f)$, אך יחס ה-PSD משתמש ב-$|H(f)|^2 = 1$, ולכן שום פאזה אינה שורדת ב-$S_Y$.", "$R_X(τ-t_0)$ היא הקורלציה ההדדית $R_{XY}(τ)$ ולא $R_Y(τ)$; ב-$R_Y$ שני הארגומנטים מושהים וההסטה מתבטלת.", "שקלול קוסינוסי היה נובע מחיבור $X(t)$ ו-$X(t-t_0)$, כלומר ממסנן מסרק, ולא מהשהיה טהורה."]}}, {"id": "lti-024", "area": "lti", "topic": "arma-spectrum", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["arma", "psd", "discrete-time", "rational-spectrum"], "answer": 0, "en": {"q": "An ARMA(1,1) process satisfies $Y[n] - 0.5Y[n-1] = X[n] + 0.4X[n-1]$ with $X[n]$ white of variance $σ^2$. What is $S_Y(e^{jω})$?", "options": ["$σ^2(1.16+0.8cos ω)/(1.25-cos ω)$", "$σ^2(1.16-0.8cos ω)/(1.25+cos ω)$", "$σ^2(1+0.4e^{-jω})/(1-0.5e^{-jω})$", "$σ^2(1.16+0.8cos ω)/(1.25+cos ω)$"], "hint": "Use $|1+be^{-jω}|^2 = 1+b^2+2b cos ω$ separately for the numerator and the denominator.", "explanation": "$H(e^{jω}) = (1+0.4e^{-jω})/(1-0.5e^{-jω})$, so $S_Y = σ^2|H|^2$. Numerator: $|1+0.4e^{-jω}|^2 = 1+0.16+0.8cos ω = 1.16+0.8cos ω$. Denominator: $|1-0.5e^{-jω}|^2 = 1+0.25-cos ω = 1.25-cos ω$. Hence $S_Y(e^{jω}) = σ^2(1.16+0.8cos ω)/(1.25-cos ω)$.", "whyWrong": ["Flipping both signs of the cosine terms swaps the roles of the zero and the pole, turning a low-pass spectrum into a high-pass one.", "$σ^2 H(e^{jω})$ omits the squared magnitude: it is complex, so it cannot be a PSD.", "$(1.25+cos ω)$ in the denominator uses $+2a cos ω$ for $|1-ae^{-jω}|^2$; the minus sign in the recursion must carry through."]}, "he": {"q": "תהליך ARMA(1,1) מקיים $Y[n] - 0.5Y[n-1] = X[n] + 0.4X[n-1]$ כאשר $X[n]$ לבן בעל שונות $σ^2$. מהו $S_Y(e^{jω})$?", "options": ["$σ^2(1.16+0.8cos ω)/(1.25-cos ω)$", "$σ^2(1.16-0.8cos ω)/(1.25+cos ω)$", "$σ^2(1+0.4e^{-jω})/(1-0.5e^{-jω})$", "$σ^2(1.16+0.8cos ω)/(1.25+cos ω)$"], "hint": "השתמש ב-$|1+be^{-jω}|^2 = 1+b^2+2b cos ω$ בנפרד עבור המונה והמכנה.", "explanation": "$H(e^{jω}) = (1+0.4e^{-jω})/(1-0.5e^{-jω})$, ולכן $S_Y = σ^2|H|^2$. מונה: $|1+0.4e^{-jω}|^2 = 1+0.16+0.8cos ω = 1.16+0.8cos ω$. מכנה: $|1-0.5e^{-jω}|^2 = 1+0.25-cos ω = 1.25-cos ω$. מכאן $S_Y(e^{jω}) = σ^2(1.16+0.8cos ω)/(1.25-cos ω)$.", "whyWrong": ["היפוך שני סימני הקוסינוס מחליף את תפקידי האפס והקוטב, והופך ספקטרום מעביר-נמוכים לספקטרום מעביר-גבוהים.", "$σ^2 H(e^{jω})$ משמיט את הערך המוחלט בריבוע: הביטוי מרוכב ולכן אינו יכול להיות PSD.", "$(1.25+cos ω)$ במכנה משתמש ב-$+2a cos ω$ עבור $|1-ae^{-jω}|^2$; סימן המינוס שברקורסיה חייב לעבור הלאה."]}}, {"id": "lti-025", "area": "lti", "topic": "spectral-relation-derivation", "difficulty": 2, "type": "open", "hardnessSource": "concept", "tags": ["derivation", "psd", "conjugate-symmetry"], "en": {"q": "Starting from $R_Y(τ) = h(τ) * h(-τ) * R_X(τ)$, derive $S_Y(f) = |H(f)|^2 S_X(f)$ for a real impulse response. Explain precisely where the squared magnitude comes from, and why the result must be non-negative.", "hint": "What is the Fourier transform of the time-reversal $h(-τ)$ when $h$ is real?", "modelAnswer": "Fourier-transform both sides. Convolution in the lag becomes multiplication in $f$, so $S_Y(f) = H(f)·H(-f)·S_X(f)$. For the reflected term, $∫h(-τ)e^{-j2πfτ}dτ = ∫h(u)e^{j2πfu}du = H(-f)$. Because $h$ is real, $H(-f) = H^*(f)$ (conjugate symmetry). Hence $S_Y(f) = H(f)H^*(f)S_X(f) = |H(f)|^2 S_X(f)$. The squared magnitude therefore comes from the second, time-reversed copy of $h$ that appears because both arguments of $E[Y(t)Y(t+τ)]$ are filtered — one contributes $H(f)$ and the other its conjugate. Non-negativity: $|H(f)|^2 ≥ 0$ and $S_X(f) ≥ 0$ (a PSD is non-negative by Bochner's theorem), so $S_Y(f) ≥ 0$, as any PSD must be. This is exactly what would fail if one wrote $S_Y = H(f)S_X(f)$: that expression is complex for a general filter and can have negative real part. Setting $τ=0$ in the inverse transform gives the power formula $R_Y(0) = ∫|H(f)|^2 S_X(f)df$. If $h$ were complex the same steps give $S_Y = H(f)H^*(f)S_X(f)$ with $R_Y(τ) = h(τ)*h^*(-τ)*R_X(τ)$.", "rubric": ["Transforms the double convolution into a product of three transforms.", "Shows $H(-f)$ and, using that $h$ is real, $H(-f) = H^*(f)$.", "Concludes $S_Y(f) = H(f)H^*(f)S_X(f) = |H(f)|^2S_X(f)$.", "Explains non-negativity: $|H|^2 ≥ 0$ and $S_X ≥ 0$, and notes $H(f)S_X(f)$ would be complex.", "Optionally derives $R_Y(0) = ∫|H(f)|^2S_X(f)df$ by setting $τ = 0$."]}, "he": {"q": "החל מ-$R_Y(τ) = h(τ) * h(-τ) * R_X(τ)$, פתח את $S_Y(f) = |H(f)|^2 S_X(f)$ עבור תגובת הלם ממשית. הסבר במדויק מהיכן מגיע הערך המוחלט בריבוע, ומדוע התוצאה חייבת להיות אי-שלילית.", "hint": "מהי התמרת פורייה של השיקוף בזמן $h(-τ)$ כאשר $h$ ממשית?", "modelAnswer": "נבצע התמרת פורייה לשני האגפים. קונבולוציה בהשהיה הופכת למכפלה ב-$f$, ולכן $S_Y(f)$ שווה למכפלת ההתמרות של $h(τ)$, של $h(-τ)$ ושל $R_X(τ)$. עבור האיבר המשוקף, $∫h(-τ)e^{-j2πfτ}dτ = ∫h(u)e^{j2πfu}du = H(-f)$. מכיוון ש-$h$ ממשית מתקיים $H(-f) = H^*(f)$ (סימטריה צמודה). לכן $S_Y(f) = H(f)H^*(f)S_X(f) = |H(f)|^2 S_X(f)$. הערך המוחלט בריבוע מגיע אפוא מהעותק השני והמשוקף של $h$, שמופיע מפני ששני הארגומנטים של $E[Y(t)Y(t+τ)]$ מסוננים — אחד תורם $H(f)$ והשני את הצמוד שלו. אי-שליליות: $|H(f)|^2 ≥ 0$ וכן $S_X(f) ≥ 0$ (‏PSD אי-שלילית לפי משפט בוכנר), ולכן $S_Y(f) ≥ 0$, כנדרש מכל PSD. זה בדיוק מה שהיה נכשל אילו כתבנו $S_Y = H(f)S_X(f)$: ביטוי זה מרוכב עבור מסנן כללי ויכול להיות בעל חלק ממשי שלילי. הצבת $τ=0$ בהתמרה ההפוכה נותנת את נוסחת ההספק $R_Y(0) = ∫|H(f)|^2 S_X(f)df$. אילו $h$ הייתה מרוכבת, אותם צעדים נותנים $S_Y = H(f)H^*(f)S_X(f)$ עם $R_Y(τ) = h(τ)*h^*(-τ)*R_X(τ)$.", "rubric": ["מתמיר את הקונבולוציה הכפולה למכפלה של שלוש התמרות.", "מראה שההתמרה של $h(-τ)$ היא $H(-f)$, ובעזרת ממשיות $h$ מקבל $H(-f) = H^*(f)$.", "מסיק $S_Y(f) = H(f)H^*(f)S_X(f) = |H(f)|^2S_X(f)$.", "מסביר אי-שליליות: $|H|^2 ≥ 0$ וגם $S_X ≥ 0$, ומציין ש-$H(f)S_X(f)$ היה מרוכב.", "לחלופין מפתח $R_Y(0) = ∫|H(f)|^2S_X(f)df$ על ידי הצבת $τ = 0$."]}}, {"id": "lti-026", "area": "lti", "topic": "gaussianity-and-nonlinearity", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["gaussian", "nonlinear-system", "joint-gaussianity", "counterexample"], "en": {"q": "Explain why a stable LTI filter driven by a stationary Gaussian process produces a Gaussian output, and why the same argument collapses for the memoryless nonlinearity $Z(t) = X^2(t)$. What survives for $Z$, and what does not?", "hint": "Gaussianity is closed under linear combinations and mean-square limits; ask which of the two steps the squarer breaks.", "modelAnswer": "LTI case: $Y(t) = ∫h(λ)X(t-λ)dλ$ is the mean-square limit of finite sums $Σ_k h(λ_k)X(t-λ_k)Δλ$. Each sum is a linear combination of jointly Gaussian variables, hence Gaussian; and a mean-square limit of Gaussian variables is Gaussian, since the characteristic functions converge to a Gaussian one. The same holds for any finite collection $Y(t_1),...,Y(t_n)$, so $Y$ is a Gaussian process and $X,Y$ are jointly Gaussian. Only the mean and the autocorrelation change, via $μ_Y = μ_X H(0)$ and $S_Y = |H|^2S_X$, and these fully determine the law of $Y$. Squarer: $Z(t) = X^2(t)$ is not a linear combination of the $X$'s, so the closure argument does not apply, and it is provably false — for zero-mean $X$, $Z ≥ 0$ with a chi-square (one degree of freedom) marginal, which is skewed and one-sided, so $Z$ is not Gaussian. What does survive: $Z$ is still strict-sense stationary (a fixed memoryless map of a stationary process is stationary), hence WSS provided $E[Z^2] < ∞$, and for zero-mean Gaussian $X$ one still gets a clean second-order description, $R_Z(τ) = R_X^2(0) + 2R_X^2(τ)$ by the Gaussian moment (Isserlis) formula, so $S_Z = R_X^2(0)δ(f) + 2(S_X * S_X)(f)$. What does not survive: Gaussianity, the sufficiency of second-order statistics to describe the law, and the equivalence of uncorrelatedness with independence; also the spectrum is spread by self-convolution, so $Z$ occupies twice the bandwidth of $X$.", "rubric": ["Argues LTI output is a mean-square limit of linear combinations of jointly Gaussian variables, hence Gaussian.", "States that $X$ and $Y$ remain jointly Gaussian and that $μ_Y = μ_XH(0)$, $S_Y = |H|^2S_X$ determine the law.", "Explains that $X^2$ is not a linear operation and gives the concrete failure (non-negative, chi-square, skewed).", "Notes that stationarity survives the memoryless nonlinearity, so $Z$ is still (strictly and hence widely) stationary.", "Gives a correct second-order consequence for $Z$, e.g. $R_Z(τ) = R_X^2(0)+2R_X^2(τ)$ or the spectral self-convolution."]}, "he": {"q": "הסבר מדוע מסנן LTI יציב המוזן בתהליך גאוסי סטציונרי מייצר מוצא גאוסי, ומדוע אותו טיעון קורס עבור אי-לינאריות חסרת זיכרון $Z(t) = X^2(t)$. מה שורד עבור $Z$ ומה לא?", "hint": "גאוסיות סגורה תחת צירופים לינאריים וגבולות בממוצע ריבועי; שאל איזה משני השלבים המרבע שובר.", "modelAnswer": "המקרה הלינארי: $Y(t) = ∫h(λ)X(t-λ)dλ$ הוא גבול בממוצע ריבועי של סכומים סופיים $Σ_k h(λ_k)X(t-λ_k)Δλ$. כל סכום כזה הוא צירוף לינארי של משתנים גאוסיים במשותף ולכן גאוסי; וגבול בממוצע ריבועי של משתנים גאוסיים הוא גאוסי, שכן הפונקציות האופייניות מתכנסות לפונקציה אופיינית גאוסית. הדבר נכון גם לכל אוסף סופי $Y(t_1),...,Y(t_n)$, ולכן $Y$ הוא תהליך גאוסי ו-$X,Y$ גאוסיים במשותף. רק התוחלת והאוטוקורלציה משתנות, לפי $μ_Y = μ_X H(0)$ ו-$S_Y = |H|^2S_X$, ואלה קובעות במלואן את ההתפלגות של $Y$. המרבע: $Z(t) = X^2(t)$ אינו צירוף לינארי של ה-$X$-ים, ולכן טיעון הסגירות אינו חל, וניתן להוכיח שהוא שגוי — עבור $X$ בעל תוחלת אפס מתקיים $Z ≥ 0$ עם התפלגות שולית כי-ריבוע (דרגת חופש אחת), שהיא א-סימטרית וחד-צדדית, ולכן $Z$ אינו גאוסי. מה שורד: $Z$ עדיין סטציונרי במובן הצר (העתקה קבועה וחסרת זיכרון של תהליך סטציונרי היא סטציונרית), ולכן גם WSS בהינתן $E[Z^2] < ∞$; ועבור $X$ גאוסי בעל תוחלת אפס עדיין מתקבל תיאור נקי מסדר שני, $R_Z(τ) = R_X^2(0) + 2R_X^2(τ)$ לפי נוסחת המומנטים הגאוסית (איסרליס), ומכאן $S_Z = R_X^2(0)δ(f) + 2(S_X * S_X)(f)$. מה שאינו שורד: הגאוסיות, ההספקה של סטטיסטיקה מסדר שני לתיאור ההתפלגות, והשקילות בין אי-מתאם לאי-תלות; כמו כן הספקטרום מתפרש עקב הקונבולוציה העצמית, ולכן $Z$ תופס רוחב סרט כפול מזה של $X$.", "rubric": ["מנמק שמוצא LTI הוא גבול בממוצע ריבועי של צירופים לינאריים של משתנים גאוסיים במשותף, ולכן גאוסי.", "מציין ש-$X$ ו-$Y$ נשארים גאוסיים במשותף ושהתוצאות $μ_Y = μ_XH(0)$, ‏$S_Y = |H|^2S_X$ קובעות את ההתפלגות.", "מסביר ש-$X^2$ אינה פעולה לינארית ונותן את הכשל הקונקרטי (אי-שלילי, כי-ריבוע, א-סימטרי).", "מציין שהסטציונריות שורדת את האי-לינאריות חסרת הזיכרון, ולכן $Z$ עדיין סטציונרי.", "נותן תוצאה נכונה מסדר שני עבור $Z$, למשל $R_Z(τ) = R_X^2(0)+2R_X^2(τ)$ או הקונבולוציה הספקטרלית העצמית."]}}, {"id": "gau-001", "area": "gaussian", "topic": "gaussian-process-definition", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["gaussian", "definition", "joint-density"], "answer": 2, "en": {"q": "Which of the following is the correct definition of a Gaussian random process $X(t)$?", "options": ["At every fixed $t$ the first-order density $f_X(x;t)$ is Gaussian", "The mean $μ_X(t)$ and the variance $σ_X^2(t)$ do not depend on $t$", "Every finite set of samples $(X(t_1),...,X(t_n))$ is jointly Gaussian", "The autocorrelation $R_X(t_1,t_2)$ has the shape of a Gaussian bell curve"], "hint": "A Gaussian density at each single time instant is not enough; the definition constrains all joint densities.", "explanation": "$X(t)$ is Gaussian iff every finite collection of samples $(X(t_1),...,X(t_n))$ has a jointly Gaussian (multivariate normal) density, determined by the mean vector and the covariance matrix. Marginal Gaussianity at each $t$ follows from this but is much weaker: one can construct non-Gaussian processes whose one-dimensional densities are all Gaussian.", "whyWrong": ["Gaussian marginals do not force the joint density to be Gaussian; e.g. $Y = SX$ with $S = ±1$ independent of $X ~ N(0,1)$ has Gaussian marginals but a non-Gaussian pair.", "Constant mean and variance is the definition of a (weakly) stationary process, not of a Gaussian one; a Gaussian process may be strongly non-stationary, like the Wiener process.", "The shape of $R_X$ in $τ$ is unrelated to Gaussianity: white Gaussian noise has $R_X(τ) = (N_0/2)δ(τ)$, which is not a Gaussian curve."]}, "he": {"q": "איזו מהאפשרויות הבאות היא ההגדרה הנכונה של תהליך אקראי גאוסי $X(t)$?", "options": ["בכל $t$ קבוע הצפיפות מסדר ראשון $f_X(x;t)$ היא גאוסית", "התוחלת $μ_X(t)$ והשונות $σ_X^2(t)$ אינן תלויות ב-$t$", "כל אוסף סופי של דגימות $(X(t_1),...,X(t_n))$ גאוסי במשותף", "פונקציית האוטוקורלציה $R_X(t_1,t_2)$ היא בעלת צורת פעמון גאוסית"], "hint": "צפיפות גאוסית בכל רגע זמן בודד אינה מספיקה; ההגדרה מגבילה את כל הצפיפויות המשותפות.", "explanation": "‏$X(t)$ הוא גאוסי אם ורק אם לכל אוסף סופי של דגימות $(X(t_1),...,X(t_n))$ יש צפיפות גאוסית משותפת (נורמלית רב-ממדית), הנקבעת על ידי וקטור התוחלות ומטריצת השונויות המשותפות. גאוסיות של הצפיפויות השוליות בכל $t$ נובעת מכך, אך היא תנאי חלש בהרבה: ניתן לבנות תהליכים לא-גאוסיים שכל הצפיפויות החד-ממדיות שלהם גאוסיות.", "whyWrong": ["צפיפויות שוליות גאוסיות אינן כופות צפיפות משותפת גאוסית; למשל $Y = SX$ עם $S = ±1$ בלתי תלוי ב-$X ~ N(0,1)$ בעל שוליים גאוסיים אך הזוג אינו גאוסי.", "תוחלת ושונות קבועות הן ההגדרה של תהליך סטציונרי (במובן הרחב) ולא של תהליך גאוסי; תהליך גאוסי יכול להיות לא-סטציונרי לחלוטין, כמו תהליך וינר.", "צורת $R_X$ כפונקציה של $τ$ אינה קשורה לגאוסיות: לרעש לבן גאוסי יש $R_X(τ) = (N_0/2)δ(τ)$, שאינה עקומה גאוסית."]}}, {"id": "gau-002", "area": "gaussian", "topic": "full-specification", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["gaussian", "moments", "specification"], "answer": 0, "en": {"q": "Two Gaussian processes satisfy $μ_X(t) = μ_Y(t)$ and $R_X(t_1,t_2) = R_Y(t_1,t_2)$ for all times. What follows?", "options": ["All their finite-dimensional distributions are identical", "Only their first two moments agree; higher moments may differ", "They agree in distribution only if both are also WSS", "They agree in distribution only if both are zero-mean"], "hint": "Write down the multivariate normal density of a sample vector and ask what it depends on.", "explanation": "The joint density of $(X(t_1),...,X(t_n))$ is normal, hence fixed once the mean vector $[μ_X(t_i)]$ and the covariance matrix $C_{ij} = R_X(t_i,t_j) - μ_X(t_i)μ_X(t_j)$ are given. Both are determined by $μ_X$ and $R_X$, so every finite-dimensional distribution matches, and all higher moments follow from the first two (Isserlis' rule).", "whyWrong": ["For a general process that is true, but for Gaussians the first two moments determine the whole density, hence every higher moment as well.", "Stationarity plays no role: the argument uses only that each sample vector is normal, which holds for non-stationary Gaussian processes too.", "A non-zero mean is simply subtracted to form the covariance matrix; it does not weaken the specification in any way."]}, "he": {"q": "שני תהליכים גאוסיים מקיימים $μ_X(t) = μ_Y(t)$ ו-$R_X(t_1,t_2) = R_Y(t_1,t_2)$ לכל הזמנים. מה נובע מכך?", "options": ["כל ההתפלגויות מהממד הסופי שלהם זהות", "רק שני המומנטים הראשונים מתלכדים; מומנטים גבוהים עשויים להיבדל", "הם מתלכדים בהתפלגות רק אם שניהם גם WSS", "הם מתלכדים בהתפלגות רק אם לשניהם תוחלת אפס"], "hint": "רשום את הצפיפות הנורמלית הרב-ממדית של וקטור דגימות ושאל במה היא תלויה.", "explanation": "הצפיפות המשותפת של $(X(t_1),...,X(t_n))$ היא נורמלית, ולכן נקבעת לחלוטין ברגע שנתונים וקטור התוחלות $[μ_X(t_i)]$ ומטריצת השונויות המשותפות $C_{ij} = R_X(t_i,t_j) - μ_X(t_i)μ_X(t_j)$. שניהם נקבעים על ידי $μ_X$ ו-$R_X$, ולכן כל התפלגות מממד סופי מתלכדת, וכל המומנטים הגבוהים נובעים משני הראשונים (כלל איסרליס).", "whyWrong": ["עבור תהליך כללי זה נכון, אך עבור גאוסי שני המומנטים הראשונים קובעים את כל הצפיפות ולכן גם כל מומנט גבוה יותר.", "לסטציונריות אין כאן תפקיד: הטיעון מסתמך רק על כך שכל וקטור דגימות נורמלי, וזה נכון גם לתהליכים גאוסיים לא-סטציונריים.", "תוחלת שונה מאפס פשוט מוחסרת לצורך בניית מטריצת השונויות המשותפות; היא אינה מחלישה את הקביעה כלל."]}}, {"id": "gau-003", "area": "gaussian", "topic": "wss-implies-sss", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["gaussian", "stationarity", "sss", "wss"], "answer": 1, "en": {"q": "A Gaussian process $X(t)$ is known to be WSS. Why does this already make it strict-sense stationary?", "options": ["Because a constant mean forces every joint moment to be constant in time", "Because joint densities depend only on shift-invariant $μ_X$ and covariances", "Because a WSS Gaussian process is automatically ergodic in mean and covariance", "Because the Gaussian density is symmetric about its own mean value"], "hint": "Shift all sample times by $Δ$ and ask which quantities in the joint density can change.", "explanation": "For a Gaussian process the joint density of $(X(t_1+Δ),...,X(t_n+Δ))$ is determined by the means $μ_X(t_i+Δ)$ and the covariances $C_X(t_i+Δ,t_j+Δ)$. WSS gives $μ_X(t_i+Δ) = μ_X$ and $C_X(t_i+Δ,t_j+Δ) = C_X(t_i-t_j)$, so the density does not depend on $Δ$ at all. That is exactly strict-sense stationarity. Note the implication holds only for Gaussian processes.", "whyWrong": ["A constant mean fixes only the first moment; for a non-Gaussian process the third-order density can still drift with time even when the mean is constant.", "Ergodicity is about time averages of a single realisation and is neither implied by nor needed for stationarity; a Gaussian WSS process can fail to be ergodic.", "Symmetry of the one-dimensional density says nothing about how the joint density behaves under a time shift, which is what SSS demands."]}, "he": {"q": "ידוע שתהליך גאוסי $X(t)$ הוא WSS. מדוע די בכך כדי שיהיה סטציונרי במובן הצר (SSS)?", "options": ["מכיוון שתוחלת קבועה כופה שכל מומנט משותף יהיה קבוע בזמן", "מכיוון שהצפיפויות המשותפות תלויות רק ב-$μ_X$ ובקווריאנסים חסיני ההזזה", "מכיוון שתהליך גאוסי WSS הוא אוטומטית ארגודי בתוחלת ובקווריאנס", "מכיוון שהצפיפות הגאוסית סימטרית סביב ערך התוחלת שלה עצמה"], "hint": "הזז את כל זמני הדגימה ב-$Δ$ ושאל אילו גדלים בצפיפות המשותפת יכולים להשתנות.", "explanation": "בתהליך גאוסי הצפיפות המשותפת של $(X(t_1+Δ),...,X(t_n+Δ))$ נקבעת על ידי התוחלות $μ_X(t_i+Δ)$ והקווריאנסים $C_X(t_i+Δ,t_j+Δ)$. תכונת WSS נותנת $μ_X(t_i+Δ) = μ_X$ וכן $C_X(t_i+Δ,t_j+Δ) = C_X(t_i-t_j)$, ולכן הצפיפות אינה תלויה ב-$Δ$ כלל. זו בדיוק סטציונריות במובן הצר. שימו לב שהגרירה הזו תקפה רק לתהליכים גאוסיים.", "whyWrong": ["תוחלת קבועה קובעת רק את המומנט הראשון; בתהליך לא-גאוסי הצפיפות מסדר שלישי עדיין יכולה להשתנות עם הזמן גם כשהתוחלת קבועה.", "ארגודיות עוסקת בממוצעי זמן של מימוש בודד, ואינה נובעת מסטציונריות ואף אינה נדרשת לה; תהליך גאוסי WSS יכול להיות לא ארגודי.", "סימטריה של הצפיפות החד-ממדית אינה אומרת דבר על התנהגות הצפיפות המשותפת תחת הזזה בזמן, וזו הדרישה של SSS."]}}, {"id": "gau-004", "area": "gaussian", "topic": "linear-operations", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["gaussian", "linearity", "filtering", "nonlinearity"], "answer": 3, "en": {"q": "$X(t)$ is a Gaussian process. Which of the following outputs is in general NOT a Gaussian process?", "options": ["$Y(t) = ∫_0^t X(λ) dλ$", "$Y(t) = ∫_{-∞}^{∞} h(λ)X(t-λ)dλ$ with $h$ stable", "$Y(t) = 3X(t) - 2X(t-1) + 5$", "$Y(t) = X^2(t)$"], "hint": "Gaussianity survives any operation that is linear (plus a constant); it does not survive nonlinear ones.", "explanation": "Integration, convolution with a stable $h$, differentiation and finite linear combinations are all limits of linear combinations of samples of $X$, and any linear combination of jointly Gaussian variables is Gaussian; adding the constant $5$ only shifts the mean. Squaring is nonlinear: for zero-mean $X$ with variance $σ^2$, $X^2(t)/σ^2$ is chi-square with one degree of freedom, which is one-sided and strongly skewed.", "whyWrong": ["An integral is a mean-square limit of Riemann sums $ΣX(t_k)Δ$, i.e. of Gaussian variables, and such a limit is again Gaussian.", "Filtering is convolution, again a limit of linear combinations of samples; only the mean and the covariance change, not the family.", "A finite linear combination plus a deterministic constant is Gaussian by definition of joint Gaussianity."]}, "he": {"q": "‏$X(t)$ הוא תהליך גאוסי. איזה מהמוצאים הבאים אינו, בדרך כלל, תהליך גאוסי?", "options": ["$Y(t) = ∫_0^t X(λ) dλ$", "$Y(t) = ∫_{-∞}^{∞} h(λ)X(t-λ)dλ$ עבור $h$ יציב", "$Y(t) = 3X(t) - 2X(t-1) + 5$", "$Y(t) = X^2(t)$"], "hint": "גאוסיות נשמרת תחת כל פעולה לינארית (בתוספת קבוע), ואינה נשמרת תחת פעולה לא-לינארית.", "explanation": "אינטגרציה, קונבולוציה עם $h$ יציב, גזירה וצירופים לינאריים סופיים הם כולם גבולות של צירופים לינאריים של דגימות $X$, וכל צירוף לינארי של משתנים גאוסיים במשותף הוא גאוסי; הוספת הקבוע $5$ רק מזיזה את התוחלת. העלאה בריבוע אינה לינארית: עבור $X$ בעל תוחלת אפס ושונות $σ^2$, הגודל $X^2(t)/σ^2$ מתפלג חי-בריבוע עם דרגת חופש אחת, התפלגות חד-צדדית ואסימטרית מאוד.", "whyWrong": ["אינטגרל הוא גבול בממוצע ריבועי של סכומי רימן $ΣX(t_k)Δ$, כלומר של משתנים גאוסיים, וגבול כזה הוא שוב גאוסי.", "סינון הוא קונבולוציה, שוב גבול של צירופים לינאריים של דגימות; רק התוחלת והקווריאנס משתנים, לא המשפחה.", "צירוף לינארי סופי בתוספת קבוע דטרמיניסטי הוא גאוסי לפי עצם ההגדרה של גאוסיות משותפת."]}}, {"id": "gau-005", "area": "gaussian", "topic": "uncorrelated-vs-independent", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["gaussian", "independence", "correlation", "joint-gaussian"], "answer": 1, "en": {"q": "$X$ and $Y$ are each Gaussian random variables and $Cov(X,Y) = 0$. Which statement is correct?", "options": ["They are independent, because zero correlation always implies independence for Gaussians", "They are independent only if the pair $(X,Y)$ is jointly Gaussian", "They are independent only if both of them have zero mean", "They are dependent unless their variances are also equal"], "hint": "The theorem you remember is stated for a jointly Gaussian vector, not for two separately Gaussian variables.", "explanation": "If $(X,Y)$ is jointly Gaussian, a diagonal covariance matrix makes the joint density factor into the product of the marginals, so uncorrelated implies independent. Marginal Gaussianity alone is not enough: take $X ~ N(0,1)$ and $S = ±1$ equally likely and independent of $X$, and set $Y = SX$. Then $Y ~ N(0,1)$ and $E[XY] = E[S]E[X^2] = 0$, yet $|Y| = |X|$, so $X$ and $Y$ are strongly dependent and the pair is not jointly Gaussian.", "whyWrong": ["This drops the joint-Gaussianity hypothesis; the counterexample $Y = SX$ has Gaussian marginals, zero covariance and complete dependence of magnitudes.", "The means only shift the density; the factorisation argument works for any means once the covariance matrix is diagonal.", "Equal variances are irrelevant: independent Gaussians with very different variances are still independent."]}, "he": {"q": "‏$X$ ו-$Y$ הם משתנים אקראיים גאוסיים כל אחד בנפרד, ומתקיים $Cov(X,Y) = 0$. איזו טענה נכונה?", "options": ["הם בלתי תלויים, כי חוסר קורלציה תמיד גורר אי-תלות עבור גאוסיים", "הם בלתי תלויים רק אם הזוג $(X,Y)$ גאוסי במשותף", "הם בלתי תלויים רק אם לשניהם תוחלת אפס", "הם תלויים אלא אם גם השונויות שלהם שוות"], "hint": "המשפט שאתם זוכרים מנוסח עבור וקטור גאוסי במשותף, ולא עבור שני משתנים גאוסיים בנפרד.", "explanation": "אם $(X,Y)$ גאוסי במשותף, מטריצת קווריאנס אלכסונית גורמת לצפיפות המשותפת להתפרק למכפלת השוליות, ולכן חוסר קורלציה גורר אי-תלות. גאוסיות של השוליות בלבד אינה מספיקה: ניקח $X ~ N(0,1)$ ו-$S = ±1$ בהסתברות שווה ובלתי תלוי ב-$X$, ונגדיר $Y = SX$. אז $Y ~ N(0,1)$ וגם $E[XY] = E[S]E[X^2] = 0$, אך $|Y| = |X|$, כך ש-$X$ ו-$Y$ תלויים מאוד והזוג אינו גאוסי במשותף.", "whyWrong": ["כאן הושמטה הנחת הגאוסיות המשותפת; בדוגמה הנגדית $Y = SX$ יש שוליים גאוסיים, קווריאנס אפס ותלות מלאה בין הגדלים המוחלטים.", "התוחלות רק מזיזות את הצפיפות; טיעון הפירוק למכפלה עובד עבור כל תוחלת ברגע שמטריצת הקווריאנס אלכסונית.", "שוויון השונויות אינו רלוונטי: משתנים גאוסיים בלתי תלויים בעלי שונויות שונות מאוד הם עדיין בלתי תלויים."]}}, {"id": "gau-006", "area": "gaussian", "topic": "covariance-matrix", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["gaussian", "covariance-matrix", "wss", "sampling"], "answer": 2, "en": {"q": "A zero-mean WSS Gaussian process has $R_X(τ) = 9(1 - |τ|/3)$ for $|τ| ≤ 3$ and $0$ otherwise. What is the covariance matrix of the samples $(X(0), X(1), X(2))$?", "options": ["Diagonal $(9,9,9)$, since samples of a Gaussian process are independent", "Rows $(9,3,0)$, $(3,9,3)$, $(0,3,9)$", "Rows $(9,6,3)$, $(6,9,6)$, $(3,6,9)$", "Rows $(9,6,3)$, $(6,9,3)$, $(3,3,9)$"], "hint": "With zero mean $C_{ij} = R_X(t_i - t_j)$, and for a WSS process the matrix must be symmetric Toeplitz.", "explanation": "Zero mean gives $C_{ij} = R_X(t_i-t_j)$. From the triangular $R_X$: $R_X(0) = 9$, $R_X(±1) = 9(1-1/3) = 6$, $R_X(±2) = 9(1-2/3) = 3$. Sample spacings are $0, 1, 2$, so the matrix is symmetric Toeplitz with first row $(9,6,3)$, i.e. rows $(9,6,3)$, $(6,9,6)$, $(3,6,9)$.", "whyWrong": ["Gaussian samples are independent only when they are uncorrelated; here $R_X(1) = 6 ≠ 0$, so the off-diagonal entries do not vanish.", "These are the values $9|τ|/3$ read off the wrong slope: it gives $R_X(1)=3$ and $R_X(2)=0$ instead of $6$ and $3$.", "This matrix is not Toeplitz: the $(2,3)$ entry corresponds to spacing $1$ and must equal $6$, not $3$."]}, "he": {"q": "לתהליך גאוסי WSS בעל תוחלת אפס יש $R_X(τ) = 9(1 - |τ|/3)$ עבור $|τ| ≤ 3$ ו-$0$ אחרת. מהי מטריצת השונויות המשותפות של הדגימות $(X(0), X(1), X(2))$?", "options": ["אלכסונית $(9,9,9)$, שכן דגימות של תהליך גאוסי בלתי תלויות", "שורות $(9,3,0)$, $(3,9,3)$, $(0,3,9)$", "שורות $(9,6,3)$, $(6,9,6)$, $(3,6,9)$", "שורות $(9,6,3)$, $(6,9,3)$, $(3,3,9)$"], "hint": "עם תוחלת אפס $C_{ij} = R_X(t_i - t_j)$, ועבור תהליך WSS המטריצה חייבת להיות סימטרית מסוג טפליץ.", "explanation": "תוחלת אפס נותנת $C_{ij} = R_X(t_i-t_j)$. מתוך ה-$R_X$ המשולשי: $R_X(0) = 9$, $R_X(±1) = 9(1-1/3) = 6$, $R_X(±2) = 9(1-2/3) = 3$. מרווחי הדגימה הם $0, 1, 2$, ולכן המטריצה סימטרית מסוג טפליץ עם שורה ראשונה $(9,6,3)$, כלומר שורות $(9,6,3)$, $(6,9,6)$, $(3,6,9)$.", "whyWrong": ["דגימות גאוסיות בלתי תלויות רק כאשר הן חסרות קורלציה; כאן $R_X(1) = 6 ≠ 0$, ולכן האיברים מחוץ לאלכסון אינם מתאפסים.", "אלה הערכים $9|τ|/3$ שנקראו עם השיפוע ההפוך: מתקבל $R_X(1)=3$ ו-$R_X(2)=0$ במקום $6$ ו-$3$.", "המטריצה הזו אינה טפליץ: האיבר $(2,3)$ מתאים למרווח $1$ וחייב להיות $6$ ולא $3$."]}}, {"id": "gau-007", "area": "gaussian", "topic": "wiener-increments", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["wiener", "brownian-motion", "variance", "increments"], "answer": 0, "en": {"q": "$W(t)$ is a Wiener process with $W(0)=0$, independent increments and $Var(W(t)) = σ^2 t$, with $σ^2 = 4$. Compute $Var(W(9)-W(4))$ and $Var(W(9)+W(4))$.", "options": ["$20$ and $84$", "$20$ and $52$", "$52$ and $52$", "$5$ and $21$"], "hint": "The difference is a single increment; for the sum write $W(9)+W(4) = 2W(4) + [W(9)-W(4)]$.", "explanation": "The increment on $(4,9]$ has variance $σ^2(9-4) = 4·5 = 20$. For the sum, $W(9)+W(4) = 2W(4) + [W(9)-W(4)]$ with the two terms independent, so $Var = 4·Var(W(4)) + 20 = 4·16 + 20 = 84$. Equivalently $Var(W(9))+Var(W(4))+2Cov = 36+16+2·16 = 84$, using $Cov = σ^2 min(9,4) = 16$.", "whyWrong": ["$52 = 36+16$ treats $W(9)$ and $W(4)$ as uncorrelated; they are strongly correlated, $Cov = σ^2 min(t_1,t_2) = 16$.", "Using $52$ for the difference as well adds the variances again instead of subtracting twice the covariance, $36+16-2·16 = 20$.", "$5$ and $21$ drop the factor $σ^2 = 4$; the increment variance is $σ^2(t-s)$, not $(t-s)$."]}, "he": {"q": "‏$W(t)$ הוא תהליך וינר עם $W(0)=0$, תוספות בלתי תלויות ו-$Var(W(t)) = σ^2 t$, כאשר $σ^2 = 4$. חשב את $Var(W(9)-W(4))$ ואת $Var(W(9)+W(4))$.", "options": ["$20$ ו-$84$", "$20$ ו-$52$", "$52$ ו-$52$", "$5$ ו-$21$"], "hint": "ההפרש הוא תוספת בודדת; עבור הסכום רשום $W(9)+W(4) = 2W(4) + [W(9)-W(4)]$.", "explanation": "לתוספת על $(4,9]$ יש שונות $σ^2(9-4) = 4·5 = 20$. עבור הסכום, $W(9)+W(4) = 2W(4) + [W(9)-W(4)]$ כאשר שני האיברים בלתי תלויים, ולכן $Var = 4·Var(W(4)) + 20 = 4·16 + 20 = 84$. באופן שקול $Var(W(9))+Var(W(4))+2Cov = 36+16+2·16 = 84$, תוך שימוש ב-$Cov = σ^2 min(9,4) = 16$.", "whyWrong": ["‏$52 = 36+16$ מתייחס ל-$W(9)$ ול-$W(4)$ כחסרי קורלציה; בפועל הם מתואמים חזק, $Cov = σ^2 min(t_1,t_2) = 16$.", "שימוש ב-$52$ גם עבור ההפרש מחבר שוב את השונויות במקום להחסיר פעמיים את הקווריאנס, $36+16-2·16 = 20$.", "‏$5$ ו-$21$ משמיטים את הגורם $σ^2 = 4$; שונות התוספת היא $σ^2(t-s)$ ולא $(t-s)$."]}}, {"id": "gau-008", "area": "gaussian", "topic": "wiener-nonstationarity", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["wiener", "stationarity", "independent-increments"], "answer": 3, "en": {"q": "$W(t)$ is a Wiener process with $W(0)=0$ and parameter $σ^2$. Which of the following statements is FALSE?", "options": ["Increments over disjoint time intervals are independent", "$E[W(t)] = 0$ and $Var(W(t)) = σ^2 t$ for $t ≥ 0$", "$W(t) - W(s)$ is Gaussian for every $t > s ≥ 0$", "$W(t)$ is WSS, because its increments are stationary"], "hint": "WSS requires a second moment that does not depend on absolute time.", "explanation": "The first three are part of the definition of the Wiener process. The last is false: $Var(W(t)) = σ^2 t$ grows without bound, so the second moment depends on absolute time and $W$ is not WSS (its autocorrelation $σ^2 min(t_1,t_2)$ is not a function of $t_1-t_2$). Stationary increments and a stationary process are different notions.", "whyWrong": ["Independence of increments over disjoint intervals is one of the defining properties of the process.", "Zero mean and variance growing linearly in $t$ are exactly the Wiener specification, hence true.", "Every increment is Gaussian, $W(t)-W(s) ~ N(0, σ^2(t-s))$, so this statement is true as well."]}, "he": {"q": "‏$W(t)$ הוא תהליך וינר עם $W(0)=0$ ופרמטר $σ^2$. איזו מהטענות הבאות אינה נכונה?", "options": ["תוספות על קטעי זמן זרים הן בלתי תלויות", "$E[W(t)] = 0$ וגם $Var(W(t)) = σ^2 t$ עבור $t ≥ 0$", "$W(t) - W(s)$ הוא גאוסי לכל $t > s ≥ 0$", "$W(t)$ הוא WSS, מכיוון שהתוספות שלו סטציונריות"], "hint": "תכונת WSS דורשת מומנט שני שאינו תלוי בזמן המוחלט.", "explanation": "שלוש הטענות הראשונות הן חלק מהגדרת תהליך וינר. האחרונה שגויה: $Var(W(t)) = σ^2 t$ גדל ללא גבול, ולכן המומנט השני תלוי בזמן המוחלט ו-$W$ אינו WSS (האוטוקורלציה שלו $σ^2 min(t_1,t_2)$ אינה פונקציה של $t_1-t_2$). תוספות סטציונריות ותהליך סטציונרי הם מושגים שונים.", "whyWrong": ["אי-תלות של תוספות על קטעים זרים היא אחת מתכונות ההגדרה של התהליך.", "תוחלת אפס ושונות הגדלה לינארית ב-$t$ הן בדיוק אפיון וינר, ולכן הטענה נכונה.", "כל תוספת היא גאוסית, $W(t)-W(s) ~ N(0, σ^2(t-s))$, ולכן גם טענה זו נכונה."]}}, {"id": "gau-009", "area": "gaussian", "topic": "white-noise-as-derivative", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["wiener", "white-noise", "derivative", "mean-square"], "answer": 1, "en": {"q": "For a Wiener process with $Var(W(t)) = σ^2 t$, consider the difference quotient $D_Δ = [W(t+Δ)-W(t)]/Δ$. What is $Var(D_Δ)$, and what does $Δ→0$ show?", "options": ["$σ^2 Δ → 0$: the derivative exists and equals zero", "$σ^2/Δ → ∞$: no mean-square derivative, formally white noise", "$σ^2$, independent of $Δ$: the derivative has finite power", "$σ^2/Δ^2 → ∞$: the derivative diverges like $1/Δ^2$"], "hint": "The numerator is an increment of variance $σ^2Δ$; dividing a random variable by $Δ$ divides its variance by $Δ^2$.", "explanation": "$Var(W(t+Δ)-W(t)) = σ^2Δ$, so $Var(D_Δ) = σ^2Δ/Δ^2 = σ^2/Δ$, which blows up as $Δ→0$. Hence $W$ has no mean-square derivative; the derivative exists only as a generalised process, white Gaussian noise, with the flat PSD $S_N(f) = σ^2$, the autocorrelation $R_N(τ) = σ^2δ(τ)$ and infinite average power.", "whyWrong": ["$σ^2Δ$ is the variance of the increment itself, before dividing by $Δ$; the quotient has a much larger variance, not a vanishing one.", "A finite $Δ$-independent variance would make $W$ differentiable in mean square, which contradicts the $1/Δ$ growth.", "Dividing by $Δ^2$ once too often: the numerator variance is $σ^2Δ$, not $σ^2$, so one power of $Δ$ cancels."]}, "he": {"q": "עבור תהליך וינר עם $Var(W(t)) = σ^2 t$, נתבונן במנת ההפרש $D_Δ = [W(t+Δ)-W(t)]/Δ$. מהו $Var(D_Δ)$, ומה מראה הגבול $Δ→0$?", "options": ["$σ^2 Δ → 0$: הנגזרת קיימת ושווה לאפס", "$σ^2/Δ → ∞$: אין נגזרת בממוצע ריבועי, פורמלית רעש לבן", "$σ^2$, ללא תלות ב-$Δ$: לנגזרת יש הספק סופי", "$σ^2/Δ^2 → ∞$: הנגזרת מתבדרת כמו $1/Δ^2$"], "hint": "המונה הוא תוספת בעלת שונות $σ^2Δ$; חלוקת משתנה אקראי ב-$Δ$ מחלקת את שונותו ב-$Δ^2$.", "explanation": "מתקיים $Var(W(t+Δ)-W(t)) = σ^2Δ$, ולכן $Var(D_Δ) = σ^2Δ/Δ^2 = σ^2/Δ$, המתבדר כאשר $Δ→0$. לכן ל-$W$ אין נגזרת בממוצע ריבועי; הנגזרת קיימת רק כתהליך מוכלל, רעש לבן גאוסי, בעל PSD שטוח $S_N(f) = σ^2$, אוטוקורלציה $R_N(τ) = σ^2δ(τ)$ והספק ממוצע אינסופי.", "whyWrong": ["‏$σ^2Δ$ היא שונות התוספת עצמה, לפני החלוקה ב-$Δ$; למנה שונות גדולה בהרבה ולא שונות מתאפסת.", "שונות סופית שאינה תלויה ב-$Δ$ הייתה הופכת את $W$ לגזיר בממוצע ריבועי, בסתירה לגידול כמו $1/Δ$.", "חלוקה ב-$Δ^2$ פעם אחת יותר מדי: שונות המונה היא $σ^2Δ$ ולא $σ^2$, ולכן חזקה אחת של $Δ$ מצטמצמת."]}}, {"id": "gau-010", "area": "gaussian", "topic": "filtered-noise-probability", "difficulty": 4, "type": "mcq", "hardnessSource": "computation", "tags": ["gaussian", "rc-filter", "q-function", "output-power"], "answer": 2, "en": {"q": "White Gaussian noise with two-sided PSD $S_X(f) = 4.5$ W/Hz drives the RC filter $H(f) = 1/(1+j2πfRC)$ with $RC = 0.25$ s. The output $Y(t)$ is zero-mean Gaussian. Compute $P(Y(t) > 6)$.", "options": ["$Q(2/3) ≈ 0.252$", "$Q(6) ≈ 10^{-9}$", "$Q(2) ≈ 0.0228$", "$Q(1.41) ≈ 0.079$"], "hint": "First get the output power $∫S_X|H(f)|^2 df$ over all $f$, then standardise by the standard deviation, not the variance.", "explanation": "$|H(f)|^2 = 1/(1+(2πfRC)^2)$ and $∫_{-∞}^{∞} df/(1+(2πfRC)^2) = 1/(2RC)$. So $Var(Y) = 4.5/(2·0.25) = 9$ and $σ_Y = 3$. Then $P(Y>6) = Q(6/σ_Y) = Q(2) ≈ 0.0228$.", "whyWrong": ["$Q(6/9)$ divides by the variance instead of the standard deviation; the argument of $Q$ must be dimensionless in units of $σ_Y$.", "$Q(6)$ ignores the filtering altogether and uses $σ_Y = 1$; the noise power at the output is $9$, not $1$.", "$Q(1.41)$ comes from $Var = S_X/RC = 18$, i.e. from dropping the factor $2$ in $∫|H|^2 df = 1/(2RC)$."]}, "he": {"q": "רעש לבן גאוסי בעל PSD דו-צדדי $S_X(f) = 4.5$ ואט/הרץ מוזן למסנן RC ‏$H(f) = 1/(1+j2πfRC)$ עם $RC = 0.25$ שניות. המוצא $Y(t)$ גאוסי בעל תוחלת אפס. חשב את $P(Y(t) > 6)$.", "options": ["$Q(2/3) ≈ 0.252$", "$Q(6) ≈ 10^{-9}$", "$Q(2) ≈ 0.0228$", "$Q(1.41) ≈ 0.079$"], "hint": "תחילה חשב את הספק המוצא $∫S_X|H(f)|^2 df$ על כל $f$, ורק אז נרמל לפי סטיית התקן ולא לפי השונות.", "explanation": "מתקיים $|H(f)|^2 = 1/(1+(2πfRC)^2)$ וכן $∫_{-∞}^{∞} df/(1+(2πfRC)^2) = 1/(2RC)$. לכן $Var(Y) = 4.5/(2·0.25) = 9$ ו-$σ_Y = 3$. מכאן $P(Y>6) = Q(6/σ_Y) = Q(2) ≈ 0.0228$.", "whyWrong": ["‏$Q(6/9)$ מחלק בשונות במקום בסטיית התקן; הארגומנט של $Q$ חייב להיות חסר יחידות ביחידות של $σ_Y$.", "‏$Q(6)$ מתעלם לגמרי מהסינון ומשתמש ב-$σ_Y = 1$; הספק הרעש במוצא הוא $9$ ולא $1$.", "‏$Q(1.41)$ נובע מ-$Var = S_X/RC = 18$, כלומר מהשמטת הגורם $2$ בביטוי $∫|H|^2 df = 1/(2RC)$."]}}, {"id": "gau-011", "area": "gaussian", "topic": "narrowband-noise", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["narrowband", "in-phase", "quadrature", "rayleigh"], "en": {"q": "Narrowband zero-mean Gaussian noise of power $σ^2$ is written $N(t) = N_c(t)cos(ω_0t) - N_s(t)sin(ω_0t)$. State the statistical properties of $N_c$ and $N_s$, and explain why the envelope is Rayleigh and the phase uniform.", "hint": "$N_c$ and $N_s$ are obtained from $N$ by linear operations (mixing and low-pass filtering), so start from what linearity guarantees.", "modelAnswer": "$N_c$ and $N_s$ are produced from $N$ by multiplication with deterministic sinusoids followed by low-pass filtering, all linear operations, so they are jointly Gaussian processes together with $N$. Their properties: (i) both are zero-mean; (ii) both are low-pass, WSS, with the same autocorrelation $R_{N_c}(τ) = R_{N_s}(τ)$ and hence the same power, $R_{N_c}(0) = R_{N_s}(0) = R_N(0) = σ^2$ — the components carry the same power as the bandpass noise; (iii) their PSD is the low-pass equivalent, $S_{N_c}(f) = S_{N_s}(f) = S_N(f-f_0) + S_N(f+f_0)$ restricted to the baseband; (iv) the cross-correlation is odd, $R_{N_cN_s}(τ) = -R_{N_sN_c}(τ)$, so $R_{N_cN_s}(0) = 0$: sampled at the same instant the two components are always uncorrelated, and being jointly Gaussian they are then independent. If in addition $S_N(f)$ is symmetric about $f_0$, then $R_{N_cN_s}(τ) ≡ 0$ and the two are independent processes at all lags. Envelope and phase: at a fixed $t$, $N_c$ and $N_s$ are independent $N(0,σ^2)$ variables, so their joint density $(1/(2πσ^2))e^{-(x^2+y^2)/(2σ^2)}$ is circularly symmetric. Transforming to polar coordinates $x = r cos θ$, $y = r sin θ$ with Jacobian $r$ gives $f_{R,Θ}(r,θ) = (r/(2πσ^2))e^{-r^2/(2σ^2)}$ for $r ≥ 0$, $0 ≤ θ < 2π$. This factors, so $R$ and $Θ$ are independent, with $f_R(r) = (r/σ^2)e^{-r^2/(2σ^2)}$ (Rayleigh) and $f_Θ(θ) = 1/(2π)$ (uniform). The circular symmetry, i.e. the equality of the two component variances plus their independence, is exactly what makes the phase uniform.", "rubric": ["States that $N_c$, $N_s$ are jointly Gaussian, zero-mean, low-pass and WSS, because they are obtained by linear operations on $N$.", "States the equal-power property $R_{N_c}(0) = R_{N_s}(0) = R_N(0) = σ^2$.", "Shows $R_{N_cN_s}(0) = 0$, hence the components are uncorrelated at the same instant and therefore independent (jointly Gaussian); notes that symmetry of $S_N$ about $f_0$ gives independence at all lags.", "Carries out the polar transformation with Jacobian $r$ to obtain $f_{R,Θ}(r,θ) = (r/(2πσ^2))e^{-r^2/(2σ^2)}$.", "Concludes $f_R(r) = (r/σ^2)e^{-r^2/(2σ^2)}$ (Rayleigh), $Θ$ uniform on $[0,2π)$, and $R$, $Θ$ independent."]}, "he": {"q": "רעש גאוסי צר-סרט בעל תוחלת אפס והספק $σ^2$ נרשם כ-$N(t) = N_c(t)cos(ω_0t) - N_s(t)sin(ω_0t)$. פרט את התכונות הסטטיסטיות של $N_c$ ו-$N_s$, והסבר מדוע המעטפת היא ריילי והפאזה אחידה.", "hint": "‏$N_c$ ו-$N_s$ מתקבלים מ-$N$ בפעולות לינאריות (הכפלה וסינון מעביר-נמוכים), אז התחל ממה שהלינאריות מבטיחה.", "modelAnswer": "‏$N_c$ ו-$N_s$ מתקבלים מ-$N$ על ידי הכפלה בסינוסים דטרמיניסטיים ולאחריה סינון מעביר-נמוכים, כולן פעולות לינאריות, ולכן הם תהליכים גאוסיים במשותף יחד עם $N$. התכונות: (א) לשניהם תוחלת אפס; (ב) שניהם מעבירי-נמוכים, WSS, בעלי אותה אוטוקורלציה $R_{N_c}(τ) = R_{N_s}(τ)$ ולכן אותו הספק, $R_{N_c}(0) = R_{N_s}(0) = R_N(0) = σ^2$ — הרכיבים נושאים את אותו הספק כמו רעש הפס; (ג) ה-PSD שלהם הוא המקבילה מעבירת-הנמוכים, $S_{N_c}(f) = S_{N_s}(f) = S_N(f-f_0) + S_N(f+f_0)$ בתחום הבסיס; (ד) הקורלציה ההדדית אי-זוגית, $R_{N_cN_s}(τ) = -R_{N_sN_c}(τ)$, ולכן $R_{N_cN_s}(0) = 0$: בדגימה באותו רגע שני הרכיבים תמיד חסרי קורלציה, ובהיותם גאוסיים במשותף הם גם בלתי תלויים. אם בנוסף $S_N(f)$ סימטרי סביב $f_0$, אז $R_{N_cN_s}(τ) ≡ 0$ והשניים בלתי תלויים כתהליכים בכל הזזה. מעטפת ופאזה: ב-$t$ קבוע $N_c$ ו-$N_s$ הם משתנים בלתי תלויים $N(0,σ^2)$, ולכן הצפיפות המשותפת $(1/(2πσ^2))e^{-(x^2+y^2)/(2σ^2)}$ בעלת סימטריה מעגלית. מעבר לקואורדינטות קוטביות $x = r cos θ$, $y = r sin θ$ עם יעקוביאן $r$ נותן $f_{R,Θ}(r,θ) = (r/(2πσ^2))e^{-r^2/(2σ^2)}$ עבור $r ≥ 0$, $0 ≤ θ < 2π$. הביטוי מתפרק למכפלה, ולכן $R$ ו-$Θ$ בלתי תלויים, עם $f_R(r) = (r/σ^2)e^{-r^2/(2σ^2)}$ (ריילי) ו-$f_Θ(θ) = 1/(2π)$ (אחידה). הסימטריה המעגלית, כלומר שוויון השונויות של שני הרכיבים יחד עם אי-תלותם, היא בדיוק מה שהופך את הפאזה לאחידה.", "rubric": ["מציין ש-$N_c$, $N_s$ גאוסיים במשותף, בעלי תוחלת אפס, מעבירי-נמוכים ו-WSS, משום שהם מתקבלים בפעולות לינאריות על $N$.", "מציין את תכונת שוויון ההספקים $R_{N_c}(0) = R_{N_s}(0) = R_N(0) = σ^2$.", "מראה ש-$R_{N_cN_s}(0) = 0$, ולכן הרכיבים חסרי קורלציה באותו רגע ומכאן בלתי תלויים (גאוסיים במשותף); מציין שסימטריה של $S_N$ סביב $f_0$ נותנת אי-תלות בכל הזזה.", "מבצע את המעבר לקואורדינטות קוטביות עם יעקוביאן $r$ ומקבל $f_{R,Θ}(r,θ) = (r/(2πσ^2))e^{-r^2/(2σ^2)}$.", "מסיק $f_R(r) = (r/σ^2)e^{-r^2/(2σ^2)}$ (ריילי), $Θ$ אחידה על $[0,2π)$, ו-$R$, $Θ$ בלתי תלויים."]}}, {"id": "gau-012", "area": "gaussian", "topic": "rayleigh-envelope", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["rayleigh", "envelope", "narrowband", "probability"], "answer": 0, "en": {"q": "The in-phase and quadrature components of narrowband Gaussian noise are independent and zero-mean, each with variance $σ^2 = 2$. The envelope is $R = √(N_c^2+N_s^2)$. Compute $P(R > 2)$.", "options": ["$e^{-1} ≈ 0.368$", "$e^{-2} ≈ 0.135$", "$e^{-1/2} ≈ 0.607$", "$2Q(√2) ≈ 0.157$"], "hint": "For a Rayleigh envelope the tail probability has a closed form; no numerical integration is needed.", "explanation": "$R$ is Rayleigh with $f_R(r) = (r/σ^2)e^{-r^2/(2σ^2)}$, so $P(R>r) = e^{-r^2/(2σ^2)}$. With $σ^2 = 2$ and $r = 2$: $P = e^{-4/4} = e^{-1} ≈ 0.368$.", "whyWrong": ["$e^{-2}$ uses $e^{-r^2/σ^2}$, dropping the factor $2$ in the exponent $r^2/(2σ^2)$.", "$e^{-1/2}$ substitutes the total $N_c^2+N_s^2$ power $2σ^2 = 4$ in place of $σ^2$ in the exponent.", "$2Q(√2)$ treats the envelope as a zero-mean Gaussian variable; $R$ is non-negative and Rayleigh, not Gaussian."]}, "he": {"q": "רכיבי הסינפאזה והריבוע של רעש גאוסי צר-סרט בלתי תלויים ובעלי תוחלת אפס, כל אחד בעל שונות $σ^2 = 2$. המעטפת היא $R = √(N_c^2+N_s^2)$. חשב את $P(R > 2)$.", "options": ["$e^{-1} ≈ 0.368$", "$e^{-2} ≈ 0.135$", "$e^{-1/2} ≈ 0.607$", "$2Q(√2) ≈ 0.157$"], "hint": "למעטפת ריילי יש נוסחה סגורה להסתברות הזנב; אין צורך באינטגרציה נומרית.", "explanation": "‏$R$ מתפלגת ריילי עם $f_R(r) = (r/σ^2)e^{-r^2/(2σ^2)}$, ולכן $P(R>r) = e^{-r^2/(2σ^2)}$. עם $σ^2 = 2$ ו-$r = 2$ מתקבל $P = e^{-4/4} = e^{-1} ≈ 0.368$.", "whyWrong": ["‏$e^{-2}$ משתמש ב-$e^{-r^2/σ^2}$ ומשמיט את הגורם $2$ במעריך $r^2/(2σ^2)$.", "‏$e^{-1/2}$ מציב את ההספק הכולל $2σ^2 = 4$ במקום $σ^2$ במעריך.", "‏$2Q(√2)$ מתייחס למעטפת כאל משתנה גאוסי בעל תוחלת אפס; $R$ אי-שלילית ומתפלגת ריילי ולא גאוסית."]}}, {"id": "gau-013", "area": "gaussian", "topic": "wiener-autocorrelation", "difficulty": 3, "type": "open", "hardnessSource": "computation", "tags": ["wiener", "autocorrelation", "min-rule", "nonstationary"], "en": {"q": "A Wiener process has $W(0)=0$, independent increments, and $W(t)-W(s) ~ N(0,σ^2(t-s))$ for $t>s$. Derive $R_W(t_1,t_2) = σ^2 min(t_1,t_2)$, and explain precisely why $W(t)$ is not WSS.", "hint": "For $t_2 > t_1$ split $W(t_2)$ into $W(t_1)$ plus an increment over an interval disjoint from $[0,t_1]$.", "modelAnswer": "Take $t_2 > t_1 ≥ 0$ and write $W(t_2) = W(t_1) + [W(t_2)-W(t_1)]$. Then $R_W(t_1,t_2) = E[W(t_1)W(t_2)] = E[W^2(t_1)] + E[W(t_1)(W(t_2)-W(t_1))]$. The first term is $Var(W(t_1)) = σ^2 t_1$, since $E[W(t_1)] = 0$. In the second term $W(t_1) = W(t_1)-W(0)$ is the increment over $[0,t_1]$ and $W(t_2)-W(t_1)$ is the increment over $(t_1,t_2]$; the intervals are disjoint, so the two are independent, and both have zero mean, giving $E[·] = E[W(t_1)]E[W(t_2)-W(t_1)] = 0$. Hence $R_W(t_1,t_2) = σ^2 t_1$. Interchanging the roles for $t_1 > t_2$ gives $σ^2 t_2$, so in general $R_W(t_1,t_2) = σ^2 min(t_1,t_2)$. Not WSS: the mean $E[W(t)] = 0$ is constant, so the first condition holds, but the second fails. $R_W$ depends on $t_1$ and $t_2$ separately, not through $τ = t_1-t_2$: with $σ^2 = 1$, $R_W(1,3) = 1$ while $R_W(3,5) = 3$, although both pairs have $τ = -2$. Equivalently, $Var(W(t)) = σ^2 t$ grows without bound, so the average power is not even finite in the limit. The process does have stationary and independent increments, which is a different and weaker statement.", "rubric": ["Splits $W(t_2) = W(t_1) + [W(t_2)-W(t_1)]$ for $t_2 > t_1$ and expands the expectation.", "Identifies $E[W^2(t_1)] = σ^2 t_1$ using $W(0)=0$ and zero mean.", "Argues the cross term vanishes because the increments over $[0,t_1]$ and $(t_1,t_2]$ are independent with zero mean.", "Concludes $R_W(t_1,t_2) = σ^2 min(t_1,t_2)$ by symmetry in $t_1, t_2$.", "Explains non-stationarity: $R_W$ is not a function of $t_1-t_2$ (numerical example) and $Var(W(t)) = σ^2t$ is time-dependent, while stationary increments are a different property."]}, "he": {"q": "לתהליך וינר מתקיים $W(0)=0$, תוספות בלתי תלויות, ו-$W(t)-W(s) ~ N(0,σ^2(t-s))$ עבור $t>s$. גזור את $R_W(t_1,t_2) = σ^2 min(t_1,t_2)$, והסבר במדויק מדוע $W(t)$ אינו WSS.", "hint": "עבור $t_2 > t_1$ פרק את $W(t_2)$ ל-$W(t_1)$ ועוד תוספת על קטע זר ל-$[0,t_1]$.", "modelAnswer": "ניקח $t_2 > t_1 ≥ 0$ ונרשום $W(t_2) = W(t_1) + [W(t_2)-W(t_1)]$. אז $R_W(t_1,t_2) = E[W(t_1)W(t_2)] = E[W^2(t_1)] + E[W(t_1)(W(t_2)-W(t_1))]$. האיבר הראשון הוא $Var(W(t_1)) = σ^2 t_1$, שכן $E[W(t_1)] = 0$. באיבר השני $W(t_1) = W(t_1)-W(0)$ הוא התוספת על $[0,t_1]$ ו-$W(t_2)-W(t_1)$ היא התוספת על $(t_1,t_2]$; הקטעים זרים ולכן השניים בלתי תלויים, ולשניהם תוחלת אפס, כך ש-$E[·] = E[W(t_1)]E[W(t_2)-W(t_1)] = 0$. מכאן $R_W(t_1,t_2) = σ^2 t_1$. החלפת התפקידים עבור $t_1 > t_2$ נותנת $σ^2 t_2$, ולכן בכלליות $R_W(t_1,t_2) = σ^2 min(t_1,t_2)$. אינו WSS: התוחלת $E[W(t)] = 0$ קבועה ולכן התנאי הראשון מתקיים, אך התנאי השני נכשל. $R_W$ תלוי ב-$t_1$ וב-$t_2$ בנפרד ולא דרך $τ = t_1-t_2$: עם $σ^2 = 1$ מתקבל $R_W(1,3) = 1$ ואילו $R_W(3,5) = 3$, אף ששני הזוגות מקיימים $τ = -2$. באופן שקול, $Var(W(t)) = σ^2 t$ גדל ללא גבול ולכן ההספק הממוצע אף אינו סופי בגבול. לתהליך אמנם יש תוספות סטציונריות ובלתי תלויות, וזו טענה שונה וחלשה יותר.", "rubric": ["מפרק $W(t_2) = W(t_1) + [W(t_2)-W(t_1)]$ עבור $t_2 > t_1$ ומפתח את התוחלת.", "מזהה ש-$E[W^2(t_1)] = σ^2 t_1$ תוך שימוש ב-$W(0)=0$ ובתוחלת אפס.", "מנמק שהאיבר המעורב מתאפס כי התוספות על $[0,t_1]$ ועל $(t_1,t_2]$ בלתי תלויות ובעלות תוחלת אפס.", "מסיק $R_W(t_1,t_2) = σ^2 min(t_1,t_2)$ מתוך סימטריה ב-$t_1, t_2$.", "מסביר את אי-הסטציונריות: $R_W$ אינו פונקציה של $t_1-t_2$ (עם דוגמה מספרית) ו-$Var(W(t)) = σ^2t$ תלוי בזמן, בעוד שתוספות סטציונריות הן תכונה אחרת."]}}, {"id": "gau-014", "area": "gaussian", "topic": "integrated-white-noise", "difficulty": 4, "type": "open", "hardnessSource": "computation", "tags": ["gaussian", "integration", "white-noise", "q-function"], "en": {"q": "Let $Y = ∫_0^T X(t)dt$, where $X(t)$ is zero-mean Gaussian white noise with $R_X(τ) = (N_0/2)δ(τ)$. Show that $Y$ is Gaussian, find $Var(Y)$, and compute $P(Y > 6)$ for $N_0/2 = 2$ and $T = 8$.", "hint": "Write the integral as a mean-square limit of Riemann sums, then push the expectation inside a double integral.", "modelAnswer": "Gaussianity: the integral is the mean-square limit of the Riemann sums $Σ_k X(t_k)Δ$. Each sum is a finite linear combination of samples of a Gaussian process, hence Gaussian, and a mean-square limit of Gaussian variables is Gaussian (the characteristic functions $e^{jωμ_n - ω^2σ_n^2/2}$ converge to one of the same form). So $Y$ is Gaussian and is fully described by its first two moments. Mean: $E[Y] = ∫_0^T E[X(t)]dt = 0$. Variance: $Var(Y) = E[Y^2] = E[∫_0^T∫_0^T X(t)X(s)dt ds] = ∫_0^T∫_0^T R_X(t-s)dt ds = ∫_0^T∫_0^T (N_0/2)δ(t-s)dt ds$. The inner integral over $t$ picks up $(N_0/2)$ for every $s$ in $(0,T)$, so $Var(Y) = (N_0/2)T$ — the variance grows linearly with $T$, exactly the Wiener behaviour, as expected since $Y = W(T)$ for the Wiener process built from this white noise. Numbers: $Var(Y) = 2·8 = 16$, so $σ_Y = 4$ and $P(Y>6) = Q(6/4) = Q(1.5) ≈ 0.0668$.", "rubric": ["Argues Gaussianity via Riemann sums (linear combinations of jointly Gaussian samples) and the mean-square limit.", "States $E[Y] = 0$.", "Sets up $Var(Y) = ∫_0^T∫_0^T R_X(t-s)dt ds$ and evaluates the delta to get $Var(Y) = (N_0/2)T$.", "Substitutes to get $Var(Y) = 16$ and $σ_Y = 4$.", "Computes $P(Y>6) = Q(1.5) ≈ 0.0668$ using the standard deviation, not the variance."]}, "he": {"q": "נגדיר $Y = ∫_0^T X(t)dt$, כאשר $X(t)$ הוא רעש לבן גאוסי בעל תוחלת אפס עם $R_X(τ) = (N_0/2)δ(τ)$. הראה ש-$Y$ גאוסי, מצא את $Var(Y)$, וחשב את $P(Y > 6)$ עבור $N_0/2 = 2$ ו-$T = 8$.", "hint": "רשום את האינטגרל כגבול בממוצע ריבועי של סכומי רימן, ולאחר מכן הכנס את התוחלת אל תוך אינטגרל כפול.", "modelAnswer": "גאוסיות: האינטגרל הוא הגבול בממוצע ריבועי של סכומי רימן $Σ_k X(t_k)Δ$. כל סכום כזה הוא צירוף לינארי סופי של דגימות תהליך גאוסי ולכן גאוסי, וגבול בממוצע ריבועי של משתנים גאוסיים הוא גאוסי (הפונקציות האופייניות $e^{jωμ_n - ω^2σ_n^2/2}$ מתכנסות לפונקציה מאותה צורה). לכן $Y$ גאוסי ומאופיין לחלוטין בשני המומנטים הראשונים. תוחלת: $E[Y] = ∫_0^T E[X(t)]dt = 0$. שונות: $Var(Y) = E[Y^2] = E[∫_0^T∫_0^T X(t)X(s)dt ds] = ∫_0^T∫_0^T R_X(t-s)dt ds = ∫_0^T∫_0^T (N_0/2)δ(t-s)dt ds$. האינטגרל הפנימי לפי $t$ אוסף $(N_0/2)$ עבור כל $s$ בתחום $(0,T)$, ולכן $Var(Y) = (N_0/2)T$ — השונות גדלה לינארית ב-$T$, בדיוק התנהגות וינר, כצפוי שכן $Y = W(T)$ עבור תהליך וינר הנבנה מרעש לבן זה. מספרים: $Var(Y) = 2·8 = 16$, ולכן $σ_Y = 4$ ומתקבל $P(Y>6) = Q(6/4) = Q(1.5) ≈ 0.0668$.", "rubric": ["מנמק גאוסיות באמצעות סכומי רימן (צירופים לינאריים של דגימות גאוסיות במשותף) והגבול בממוצע ריבועי.", "מציין $E[Y] = 0$.", "בונה את $Var(Y) = ∫_0^T∫_0^T R_X(t-s)dt ds$ ומחשב את הדלתא לקבלת $Var(Y) = (N_0/2)T$.", "מציב ומקבל $Var(Y) = 16$ וכן $σ_Y = 4$.", "מחשב $P(Y>6) = Q(1.5) ≈ 0.0668$ תוך שימוש בסטיית התקן ולא בשונות."]}}, {"id": "spc-001", "area": "special", "topic": "poisson-counting", "difficulty": 1, "type": "mcq", "hardnessSource": "computation", "tags": ["poisson", "counting", "pmf"], "answer": 3, "en": {"q": "Customers arrive as a Poisson process with rate $λ = 2$ per minute. Compute the probability of exactly $2$ arrivals during a $1.5$-minute interval.", "options": ["$2e^{-2} ≈ 0.271$", "$e^{-3} ≈ 0.050$", "$9e^{-3} ≈ 0.448$", "$4.5e^{-3} ≈ 0.224$"], "hint": "The Poisson parameter for an interval of length $t$ is $λt$, not $λ$.", "explanation": "$N(t)$ is Poisson with parameter $λt = 2·1.5 = 3$, so $P(N=2) = e^{-3}3^2/2! = 4.5e^{-3} ≈ 0.224$.", "whyWrong": ["$2e^{-2}$ uses $λt = 2$, i.e. a one-minute interval, ignoring the length $1.5$ of the observation window.", "$e^{-3}$ is $P(N=0)$, the probability of no arrival at all, not of exactly two.", "$9e^{-3}$ forgets the $2! = 2$ in the denominator of the Poisson pmf."]}, "he": {"q": "לקוחות מגיעים לפי תהליך פואסון בקצב $λ = 2$ לדקה. חשב את ההסתברות לבדיוק $2$ הגעות במהלך קטע של $1.5$ דקות.", "options": ["$2e^{-2} ≈ 0.271$", "$e^{-3} ≈ 0.050$", "$9e^{-3} ≈ 0.448$", "$4.5e^{-3} ≈ 0.224$"], "hint": "הפרמטר של פואסון בקטע באורך $t$ הוא $λt$ ולא $λ$.", "explanation": "‏$N(t)$ מתפלג פואסון עם פרמטר $λt = 2·1.5 = 3$, ולכן $P(N=2) = e^{-3}3^2/2! = 4.5e^{-3} ≈ 0.224$.", "whyWrong": ["‏$2e^{-2}$ משתמש ב-$λt = 2$, כלומר בקטע של דקה אחת, ומתעלם מאורך חלון התצפית $1.5$.", "‏$e^{-3}$ הוא $P(N=0)$, ההסתברות שלא תהיה אף הגעה, ולא לבדיוק שתיים.", "‏$9e^{-3}$ שוכח את $2! = 2$ במכנה של פונקציית ההסתברות של פואסון."]}}, {"id": "spc-002", "area": "special", "topic": "memorylessness", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["poisson", "exponential", "memoryless", "interarrival"], "answer": 2, "en": {"q": "Arrivals follow a Poisson process of rate $λ$. Given that no arrival has occurred during the last $5$ minutes, what is the distribution of the remaining waiting time $W$ until the next arrival?", "options": ["Exponential with rate $λ/5$, since the wait has already stretched", "Erlang of order $2$ with rate $λ$", "Exponential with rate $λ$, exactly as from a fresh start", "Exponential with rate $λ$ shifted so that $E[W] = 1/λ - 5$"], "hint": "Compute the probability that the wait exceeds $5+w$ given that it already exceeded $5$, directly from the exponential law, and see what cancels.", "explanation": "Interarrival times are exponential, and the exponential law is memoryless: $P(T > 5+w | T > 5) = e^{-λ(5+w)}/e^{-λ5} = e^{-λw}$. So $W$ is exponential with the same rate $λ$ and $E[W] = 1/λ$; the elapsed $5$ minutes carry no information. Equivalently, the Poisson process restarts probabilistically at every fixed time.", "whyWrong": ["Waiting does not slow the process down; the rate parameter of the residual time stays $λ$, and $λ/5$ has the wrong units of time as well.", "An Erlang of order $2$ is the time until the second arrival; here we wait for one arrival only.", "Subtracting the elapsed time from the mean is the deterministic intuition; memorylessness says the residual mean is again $1/λ$, and $1/λ - 5$ could even be negative."]}, "he": {"q": "הגעות מתרחשות לפי תהליך פואסון בקצב $λ$. בהינתן שלא הייתה אף הגעה ב-$5$ הדקות האחרונות, מהי התפלגות זמן ההמתנה הנותר $W$ עד ההגעה הבאה?", "options": ["מעריכי בקצב $λ/5$, שכן ההמתנה כבר התארכה", "ארלנג מסדר $2$ בקצב $λ$", "מעריכי בקצב $λ$, בדיוק כמו מהתחלה חדשה", "מעריכי בקצב $λ$ מוזז כך ש-$E[W] = 1/λ - 5$"], "hint": "חשב ישירות את ההסתברות המותנית מתוך חוק זמני הבין-הגעות וראה מה מצטמצם.", "explanation": "זמני הבין-הגעות מתפלגים מעריכית, ולהתפלגות המעריכית אין זיכרון: $P(T > 5+w | T > 5) = e^{-λ(5+w)}/e^{-λ5} = e^{-λw}$. לכן $W$ מעריכי עם אותו קצב $λ$ ו-$E[W] = 1/λ$; חמש הדקות שחלפו אינן נושאות שום מידע. באופן שקול, תהליך פואסון מתחיל מחדש מבחינה הסתברותית בכל זמן קבוע.", "whyWrong": ["ההמתנה אינה מאטה את התהליך; פרמטר הקצב של הזמן הנותר נשאר $λ$, וגם ליחידות של $λ/5$ אין משמעות נכונה.", "ארלנג מסדר $2$ הוא הזמן עד ההגעה השנייה; כאן ממתינים להגעה אחת בלבד.", "החסרת הזמן שחלף מהתוחלת היא האינטואיציה הדטרמיניסטית; חוסר הזיכרון אומר שתוחלת הזמן הנותר היא שוב $1/λ$, ו-$1/λ - 5$ עלול אף להיות שלילי."]}}, {"id": "spc-003", "area": "special", "topic": "superposition-thinning", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["poisson", "superposition", "thinning", "rate"], "answer": 0, "en": {"q": "Two independent Poisson streams of rates $4$/hour and $6$/hour are merged. Each merged arrival is independently labelled 'urgent' with probability $0.3$. How is the number of urgent arrivals in $30$ minutes distributed?", "options": ["Poisson with mean $1.5$", "Poisson with mean $5$", "Binomial with $n = 10$, $p = 0.3$", "Poisson with mean $3$"], "hint": "Superposition adds the rates; independent thinning multiplies the rate by $p$ and keeps the process Poisson.", "explanation": "Superposition of independent Poisson processes is Poisson with rate $4+6 = 10$/hour. Independent thinning with $p = 0.3$ leaves a Poisson process of rate $0.3·10 = 3$/hour (and the discarded stream is Poisson too, independent of it). Over $t = 0.5$ hour the count is Poisson with mean $3·0.5 = 1.5$, and its variance is $1.5$ as well.", "whyWrong": ["Mean $5$ is the merged count over half an hour without applying the thinning probability $0.3$.", "The number of merged arrivals is itself random and Poisson, not a fixed $n = 10$, so the urgent count is Poisson and not binomial.", "Mean $3$ is the urgent rate per hour; the window is only half an hour, so the mean must be halved."]}, "he": {"q": "שני זרמי פואסון בלתי תלויים בקצבים $4$ לשעה ו-$6$ לשעה מאוחדים. כל הגעה בזרם המאוחד מסומנת 'דחופה' באופן בלתי תלוי בהסתברות $0.3$. כיצד מתפלג מספר ההגעות הדחופות ב-$30$ דקות?", "options": ["פואסון בתוחלת $1.5$", "פואסון בתוחלת $5$", "בינומי עם $n = 10$, $p = 0.3$", "פואסון בתוחלת $3$"], "hint": "איחוד מחבר את הקצבים; דילול בלתי תלוי מכפיל את הקצב ב-$p$ ומשאיר את התהליך פואסוני.", "explanation": "איחוד תהליכי פואסון בלתי תלויים הוא פואסון בקצב $4+6 = 10$ לשעה. דילול בלתי תלוי בהסתברות $p = 0.3$ משאיר תהליך פואסון בקצב $0.3·10 = 3$ לשעה (וגם הזרם שנפסל פואסוני ובלתי תלוי בו). על פני $t = 0.5$ שעה המונה מתפלג פואסון בתוחלת $3·0.5 = 1.5$, וגם השונות שלו $1.5$.", "whyWrong": ["תוחלת $5$ היא מונה הזרם המאוחד בחצי שעה, ללא הפעלת הסתברות הדילול $0.3$.", "מספר ההגעות בזרם המאוחד הוא עצמו אקראי ופואסוני ולא $n = 10$ קבוע, ולכן מונה הדחופות פואסוני ולא בינומי.", "תוחלת $3$ היא קצב הדחופות לשעה; חלון התצפית הוא חצי שעה בלבד ולכן יש לחצות את התוחלת."]}}, {"id": "spc-004", "area": "special", "topic": "poisson-mean-variance", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["poisson", "mean", "variance"], "answer": 1, "en": {"q": "$N(t)$ is a Poisson counting process with rate $λ = 5$ arrivals per second. What are $E[N(4)]$ and $Var(N(4))$?", "options": ["$E = 20$, $Var = 400$", "$E = 20$, $Var = 20$", "$E = 20$, $Var ≈ 4.47$", "$E = 5$, $Var = 5$"], "hint": "For a Poisson variable the mean and the variance are the same number.", "explanation": "$N(4)$ is Poisson with parameter $λt = 5·4 = 20$. A Poisson variable has mean and variance both equal to its parameter, so $E[N(4)] = Var(N(4)) = 20$ (and $E[N^2(4)] = 20 + 400 = 420$).", "whyWrong": ["$400$ is the square of the mean, i.e. $(λt)^2 = E^2[N]$; the variance equals $λt$, not $E^2[N]$.", "$4.47 = √20$ is the standard deviation, not the variance.", "$E = Var = 5$ uses the rate $λ$ instead of $λt$; the interval length $t = 4$ was dropped."]}, "he": {"q": "‏$N(t)$ הוא תהליך מונה פואסון בקצב $λ = 5$ הגעות לשנייה. מהם $E[N(4)]$ ו-$Var(N(4))$?", "options": ["$E = 20$, $Var = 400$", "$E = 20$, $Var = 20$", "$E = 20$, $Var ≈ 4.47$", "$E = 5$, $Var = 5$"], "hint": "עבור משתנה פואסוני התוחלת והשונות הן אותו מספר.", "explanation": "‏$N(4)$ מתפלג פואסון עם פרמטר $λt = 5·4 = 20$. למשתנה פואסוני התוחלת והשונות שוות שתיהן לפרמטר, ולכן $E[N(4)] = Var(N(4)) = 20$ (וכן $E[N^2(4)] = 20 + 400 = 420$).", "whyWrong": ["‏$400$ הוא ריבוע התוחלת, כלומר $(λt)^2 = E^2[N]$; השונות שווה ל-$λt$ ולא ל-$E^2[N]$.", "‏$4.47 = √20$ היא סטיית התקן ולא השונות.", "‏$E = Var = 5$ משתמש בקצב $λ$ במקום ב-$λt$; אורך הקטע $t = 4$ הושמט."]}}, {"id": "spc-005", "area": "special", "topic": "conditional-uniformity", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["poisson", "order-statistics", "conditional", "uniform"], "en": {"q": "A Poisson process of rate $λ$ produces exactly one arrival in $[0,T]$. Show that the arrival time $S_1$ is uniform on $[0,T]$, and state the generalisation to $N(T) = n$ arrivals.", "hint": "Split $[0,T]$ into $[0,t]$ and $(t,T]$ and use independence of counts on disjoint intervals.", "modelAnswer": "For $0 ≤ t ≤ T$, the event that $S_1 ≤ t$ together with $N(T)=1$ is exactly the event that $N(t)=1$ and $N(T)-N(t)=0$, and these two counts are independent because the intervals are disjoint. Hence $P(S_1 ≤ t | N(T)=1) = P(N(t)=1)P(N(T)-N(t)=0)/P(N(T)=1) = [λt e^{-λt}][e^{-λ(T-t)}]/[λT e^{-λT}] = t/T$. This is the CDF of a uniform variable on $[0,T]$, with density $1/T$; note that
