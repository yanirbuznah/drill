$λ$ has cancelled completely, so the conditional law does not depend on the rate. Intuitively, the Poisson process has no preferred instant: its increments are stationary and independent, so once we know one point fell in the window, it is equally likely to be anywhere in it. Generalisation: given $N(T)=n$, the unordered arrival times are distributed as $n$ i.i.d. uniform variables on $[0,T]$; equivalently the ordered times $(S_1,...,S_n)$ have the joint density $n!/T^n$ on $0 < s_1 < ... < s_n < T$, i.e. they are the order statistics of $n$ i.i.d. $U[0,T]$ variables. This is the basis of the standard method for simulating a Poisson process on a fixed window: draw $N ~ Poisson(λT)$, then scatter $N$ independent uniform points.", "rubric": ["Writes the event $S_1 ≤ t$ together with $N(T)=1$ as the intersection of $N(t)=1$ and $N(T)-N(t)=0$, invoking independent increments.", "Substitutes the Poisson probabilities and simplifies the exponentials to obtain $P(S_1 ≤ t | N(T)=1) = t/T$.", "Identifies this as the uniform CDF on $[0,T]$, density $1/T$, and notes that $λ$ cancels.", "States the generalisation: given $N(T)=n$ the arrival times are the order statistics of $n$ i.i.d. $U[0,T]$ variables, joint density $n!/T^n$.", "Connects the result to stationary independent increments (no preferred instant) or to the simulation recipe."]}, "he": {"q": "תהליך פואסון בקצב $λ$ מייצר בדיוק הגעה אחת בקטע $[0,T]$. הראה שזמן ההגעה $S_1$ מתפלג אחיד על $[0,T]$, ונסח את ההכללה למקרה $N(T) = n$ הגעות.", "hint": "פצל את $[0,T]$ ל-$[0,t]$ ול-$(t,T]$ והשתמש באי-תלות של המונים בקטעים זרים.", "modelAnswer": "עבור $0 ≤ t ≤ T$, המאורע שבו $S_1 ≤ t$ ובמקביל $N(T)=1$ הוא בדיוק החיתוך של $N(t)=1$ עם $N(T)-N(t)=0$, ושני המונים בלתי תלויים כי הקטעים זרים. לכן $P(S_1 ≤ t | N(T)=1) = P(N(t)=1)P(N(T)-N(t)=0)/P(N(T)=1) = [λt e^{-λt}][e^{-λ(T-t)}]/[λT e^{-λT}] = t/T$. זו פונקציית ההתפלגות המצטברת של משתנה אחיד על $[0,T]$, בעל צפיפות $1/T$; שימו לב ש-$λ$ הצטמצם לחלוטין, ולכן ההתפלגות המותנית אינה תלויה בקצב. אינטואיטיבית, לתהליך פואסון אין רגע מועדף: התוספות שלו סטציונריות ובלתי תלויות, ולכן ברגע שידוע שנקודה אחת נפלה בחלון, סביר באותה מידה שהיא בכל מקום בתוכו. הכללה: בהינתן $N(T)=n$, זמני ההגעה ללא סדר מתפלגים כמו $n$ משתנים אחידים בלתי תלויים על $[0,T]$; באופן שקול, לזמנים המסודרים $(S_1,...,S_n)$ יש צפיפות משותפת $n!/T^n$ בתחום $0 < s_1 < ... < s_n < T$, כלומר הם סטטיסטיקות הסדר של $n$ משתנים בלתי תלויים $U[0,T]$. זהו הבסיס לשיטה הסטנדרטית לסימולציה של תהליך פואסון בחלון קבוע: הגרל $N ~ Poisson(λT)$ ואז פזר $N$ נקודות אחידות בלתי תלויות.", "rubric": ["רושם את המאורע $S_1 ≤ t$ יחד עם $N(T)=1$ כחיתוך של $N(t)=1$ ושל $N(T)-N(t)=0$ ומשתמש בתוספות בלתי תלויות.", "מציב את הסתברויות פואסון ומצמצם את המעריכים לקבלת $P(S_1 ≤ t | N(T)=1) = t/T$.", "מזהה זאת כפונקציית ההתפלגות האחידה על $[0,T]$ בעלת צפיפות $1/T$, ומציין ש-$λ$ מצטמצם.", "מנסח את ההכללה: בהינתן $N(T)=n$ זמני ההגעה הם סטטיסטיקות הסדר של $n$ משתנים בלתי תלויים $U[0,T]$, בעלי צפיפות משותפת $n!/T^n$.", "מקשר את התוצאה לתוספות סטציונריות ובלתי תלויות (אין רגע מועדף) או למתכון הסימולציה."]}}, {"id": "spc-006", "area": "special", "topic": "shot-noise-campbell", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["shot-noise", "campbell", "poisson", "variance"], "answer": 3, "en": {"q": "Shot noise $X(t) = Σ_i h(t-t_i)$ is driven by a Poisson process of rate $λ = 100$/s, where $h(t) = 5$ for $0 ≤ t ≤ 0.01$ s and $0$ elsewhere. Using Campbell's theorem, compute $E[X(t)]$ and $Var(X(t))$.", "options": ["$E = 5$, $Var = 5$", "$E = 5$, $Var = 0.25$", "$E = 0.05$, $Var = 0.25$", "$E = 5$, $Var = 25$"], "hint": "Campbell: the mean uses $∫h(t)dt$ and the variance uses $∫h^2(t)dt$, both multiplied by $λ$.", "explanation": "Campbell's theorem gives $E[X] = λ∫h(t)dt$ and $Var(X) = λ∫h^2(t)dt$. Here $∫h = 5·0.01 = 0.05$ and $∫h^2 = 25·0.01 = 0.25$. Hence $E[X] = 100·0.05 = 5$ and $Var(X) = 100·0.25 = 25$ (standard deviation $5$).", "whyWrong": ["$Var = 5$ copies the mean; that identity holds for the Poisson count itself, not for the filtered shot-noise amplitude.", "$Var = 0.25$ is $∫h^2$ without the factor $λ = 100$.", "$E = 0.05$ is $∫h$ without the factor $λ$; the mean must scale with the arrival rate."]}, "he": {"q": "רעש ירי $X(t) = Σ_i h(t-t_i)$ מונע על ידי תהליך פואסון בקצב $λ = 100$ לשנייה, כאשר $h(t) = 5$ עבור $0 ≤ t ≤ 0.01$ שניות ו-$0$ אחרת. בעזרת משפט קמפבל, חשב את $E[X(t)]$ ואת $Var(X(t))$.", "options": ["$E = 5$, $Var = 5$", "$E = 5$, $Var = 0.25$", "$E = 0.05$, $Var = 0.25$", "$E = 5$, $Var = 25$"], "hint": "קמפבל: התוחלת משתמשת ב-$∫h(t)dt$ והשונות ב-$∫h^2(t)dt$, שתיהן מוכפלות ב-$λ$.", "explanation": "משפט קמפבל נותן $E[X] = λ∫h(t)dt$ וכן $Var(X) = λ∫h^2(t)dt$. כאן $∫h = 5·0.01 = 0.05$ וגם $∫h^2 = 25·0.01 = 0.25$. מכאן $E[X] = 100·0.05 = 5$ וכן $Var(X) = 100·0.25 = 25$ (סטיית תקן $5$).", "whyWrong": ["‏$Var = 5$ מעתיק את התוחלת; הזהות הזו נכונה למונה הפואסוני עצמו ולא למשרעת רעש הירי המסונן.", "‏$Var = 0.25$ הוא $∫h^2$ ללא הגורם $λ = 100$.", "‏$E = 0.05$ הוא $∫h$ ללא הגורם $λ$; התוחלת חייבת לגדול עם קצב ההגעות."]}}, {"id": "spc-007", "area": "special", "topic": "random-telegraph", "difficulty": 3, "type": "open", "hardnessSource": "computation", "tags": ["telegraph", "poisson", "autocorrelation", "psd"], "en": {"q": "The random telegraph signal $X(t)$ takes the values $±1$, equally likely at $t=0$, and flips sign at the arrivals of a Poisson process of rate $λ$. Derive $R_X(τ)$, evaluate it at $τ = 2$ s for $λ = 0.5$/s, and give $S_X(f)$.", "hint": "$X(t)X(t+τ) = +1$ exactly when the number of flips in the interval is even.", "modelAnswer": "Mean: by symmetry $P(X(t)=+1) = P(X(t)=-1) = 1/2$, so $E[X(t)] = 0$ for all $t$. Autocorrelation: the product $X(t)X(t+τ)$ equals $+1$ if the number of flips $K$ in $(t,t+τ]$ is even, and $-1$ if it is odd, and $K$ is Poisson with parameter $λτ$ (for $τ>0$), independent of $X(t)$ because $X(t)$ depends only on flips before $t$. Hence $R_X(τ) = P(K even) - P(K odd) = Σ_k (-1)^k e^{-λτ}(λτ)^k/k! = e^{-λτ}e^{-λτ} = e^{-2λτ}$, using $Σ(-x)^k/k! = e^{-x}$. Since $R_X$ must be even, $R_X(τ) = e^{-2λ|τ|}$ for all $τ$. Check: $R_X(0)=1$, the power of a $±1$ signal. Numerically, $λ = 0.5$ and $τ = 2$ give $R_X(2) = e^{-2·0.5·2} = e^{-2} ≈ 0.135$. PSD: with $a = 2λ$, the transform pair $e^{-a|τ|} ⇔ 2a/(a^2+(2πf)^2)$ gives $S_X(f) = 4λ/(4λ^2 + 4π^2f^2) = λ/(λ^2 + π^2f^2)$, a Lorentzian of $3$ dB bandwidth $λ/π$ Hz. Sanity check: $∫_{-∞}^{∞}S_X(f)df = 1 = R_X(0)$.", "rubric": ["Establishes $E[X(t)] = 0$ from the equally likely $±1$ values.", "Identifies $X(t)X(t+τ) = ±1$ according to the parity of the Poisson number of flips in the interval, and uses independence from $X(t)$.", "Sums the alternating Poisson series to get $R_X(τ) = e^{-2λ|τ|}$, noting the evenness in $τ$.", "Evaluates $R_X(2) = e^{-2} ≈ 0.135$ for $λ = 0.5$.", "Gives $S_X(f) = 4λ/(4λ^2+4π^2f^2)$ (equivalently $λ/(λ^2+π^2f^2)$) and checks $R_X(0)=1$."]}, "he": {"q": "אות הטלגרף האקראי $X(t)$ מקבל את הערכים $±1$, בהסתברות שווה ב-$t=0$, ומחליף סימן בזמני ההגעה של תהליך פואסון בקצב $λ$. גזור את $R_X(τ)$, חשב אותו עבור $τ = 2$ שניות עם $λ = 0.5$ לשנייה, ומצא את $S_X(f)$.", "hint": "המכפלה $X(t)X(t+τ)$ שווה ל-$+1$ בדיוק כאשר מספר החלפות הסימן בקטע הוא זוגי.", "modelAnswer": "תוחלת: מסימטריה $P(X(t)=+1) = P(X(t)=-1) = 1/2$, ולכן $E[X(t)] = 0$ לכל $t$. אוטוקורלציה: המכפלה $X(t)X(t+τ)$ שווה $+1$ אם מספר ההחלפות $K$ בקטע $(t,t+τ]$ זוגי, ו-$-1$ אם הוא אי-זוגי, כאשר $K$ מתפלג פואסון בפרמטר $λτ$ (עבור $τ>0$) ובלתי תלוי ב-$X(t)$, שכן $X(t)$ תלוי רק בהחלפות שלפני $t$. לכן $R_X(τ) = P(K זוגי) - P(K אי-זוגי) = Σ_k (-1)^k e^{-λτ}(λτ)^k/k! = e^{-λτ}e^{-λτ} = e^{-2λτ}$, תוך שימוש ב-$Σ(-x)^k/k! = e^{-x}$. מכיוון ש-$R_X$ חייבת להיות זוגית, מתקבל $R_X(τ) = e^{-2λ|τ|}$ לכל $τ$. בדיקה: $R_X(0)=1$, ההספק של אות $±1$. מספרית, $λ = 0.5$ ו-$τ = 2$ נותנים $R_X(2) = e^{-2·0.5·2} = e^{-2} ≈ 0.135$. ה-PSD: עם $a = 2λ$, זוג ההתמרות $e^{-a|τ|} ⇔ 2a/(a^2+(2πf)^2)$ נותן $S_X(f) = 4λ/(4λ^2 + 4π^2f^2) = λ/(λ^2 + π^2f^2)$, פונקציית לורנץ בעלת רוחב סרט $3$ dB של $λ/π$ הרץ. בדיקת שפיות: $∫_{-∞}^{∞}S_X(f)df = 1 = R_X(0)$.", "rubric": ["מבסס $E[X(t)] = 0$ מתוך הערכים $±1$ בהסתברות שווה.", "מזהה ש-$X(t)X(t+τ) = ±1$ לפי זוגיות מספר ההחלפות הפואסוני בקטע, ומשתמש באי-תלות ב-$X(t)$.", "מסכם את הטור הפואסוני המתחלף ומקבל $R_X(τ) = e^{-2λ|τ|}$, תוך ציון הזוגיות ב-$τ$.", "מחשב $R_X(2) = e^{-2} ≈ 0.135$ עבור $λ = 0.5$.", "נותן $S_X(f) = 4λ/(4λ^2+4π^2f^2)$ (או באופן שקול $λ/(λ^2+π^2f^2)$) ובודק $R_X(0)=1$."]}}, {"id": "spc-008", "area": "special", "topic": "random-walk", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["random-walk", "binomial", "variance"], "answer": 2, "en": {"q": "A symmetric random walk is $S_n = X_1+...+X_n$ with $X_i = ±1$ equally likely and independent. Compute $P(S_4 = 2)$ and $Var(S_4)$.", "options": ["$1/4$ and $2$", "$1/16$ and $4$", "$1/4$ and $4$", "$3/8$ and $4$"], "hint": "$S_4 = 2$ needs three $+1$ steps and one $-1$; count the arrangements out of $2^4$ equally likely paths.", "explanation": "To reach $S_4 = 2$ we need $u$ up-steps and $4-u$ down-steps with $u-(4-u) = 2$, i.e. $u = 3$. There are $C(4,3) = 4$ such paths out of $2^4 = 16$ equally likely ones, so $P = 4/16 = 1/4$. Each step has $E[X_i]=0$ and $Var(X_i) = E[X_i^2] = 1$; independence gives $Var(S_4) = 4·1 = 4$.", "whyWrong": ["$Var = 2$ uses $Var(X_i) = 1/2$; for $X_i = ±1$ the second moment is $1$, not $1/2$.", "$1/16$ counts only one path (say up-up-up-down) and forgets the $C(4,3) = 4$ arrangements.", "$3/8 = 6/16$ is $P(S_4 = 0)$, the two-up-two-down case, not $P(S_4 = 2)$."]}, "he": {"q": "הילוך מקרי סימטרי הוא $S_n = X_1+...+X_n$ כאשר $X_i = ±1$ בהסתברות שווה ובלתי תלויים. חשב את $P(S_4 = 2)$ ואת $Var(S_4)$.", "options": ["$1/4$ ו-$2$", "$1/16$ ו-$4$", "$1/4$ ו-$4$", "$3/8$ ו-$4$"], "hint": "‏$S_4 = 2$ דורש שלושה צעדי $+1$ וצעד $-1$ אחד; ספור את הסידורים מתוך $2^4$ מסלולים שווי הסתברות.", "explanation": "כדי להגיע ל-$S_4 = 2$ דרושים $u$ צעדים למעלה ו-$4-u$ למטה עם $u-(4-u) = 2$, כלומר $u = 3$. יש $C(4,3) = 4$ מסלולים כאלה מתוך $2^4 = 16$ שווי הסתברות, ולכן $P = 4/16 = 1/4$. לכל צעד $E[X_i]=0$ ו-$Var(X_i) = E[X_i^2] = 1$; אי-התלות נותנת $Var(S_4) = 4·1 = 4$.", "whyWrong": ["‏$Var = 2$ משתמש ב-$Var(X_i) = 1/2$; עבור $X_i = ±1$ המומנט השני הוא $1$ ולא $1/2$.", "‏$1/16$ סופר מסלול יחיד בלבד (נניח מעלה-מעלה-מעלה-מטה) ושוכח את $C(4,3) = 4$ הסידורים.", "‏$3/8 = 6/16$ הוא $P(S_4 = 0)$, המקרה של שניים למעלה ושניים למטה, ולא $P(S_4 = 2)$."]}}, {"id": "spc-009", "area": "special", "topic": "random-phase-sinusoid", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["sinusoid", "random-phase", "autocorrelation"], "answer": 0, "en": {"q": "$X(t) = A cos(ω_0 t + Θ)$, where $A$ and $ω_0$ are deterministic constants and $Θ$ is uniform on $[0,2π)$. What is $R_X(τ)$?", "options": ["$(A^2/2)cos(ω_0τ)$", "$A^2 cos(ω_0τ)$", "$(A^2/2)cos(ω_0(t_1+t_2))$", "$(A^2/2)cos(ω_0τ) + A^2/2$"], "hint": "Use the product-to-sum identity; the double-frequency term averages to zero over a uniform phase.", "explanation": "$R_X(t_1,t_2) = A^2E[cos(ω_0t_1+Θ)cos(ω_0t_2+Θ)] = (A^2/2)cos(ω_0(t_1-t_2)) + (A^2/2)E[cos(ω_0(t_1+t_2)+2Θ)]$. The second expectation vanishes because $Θ$ is uniform over a full period, so $R_X(τ) = (A^2/2)cos(ω_0τ)$, and the process is WSS with power $R_X(0) = A^2/2$.", "whyWrong": ["$A^2cos(ω_0τ)$ drops the factor $1/2$ from the product-to-sum identity and would give the impossible power $A^2$ for a sinusoid of amplitude $A$.", "The $cos(ω_0(t_1+t_2))$ term is exactly the part that averages to zero; keeping it would also destroy stationarity.", "The extra $A^2/2$ is a DC term; here $E[X(t)] = 0$, so $R_X(τ)$ must decay to zero on average and contains no constant."]}, "he": {"q": "‏$X(t) = A cos(ω_0 t + Θ)$, כאשר $A$ ו-$ω_0$ קבועים דטרמיניסטיים ו-$Θ$ מתפלג אחיד על $[0,2π)$. מהי $R_X(τ)$?", "options": ["$(A^2/2)cos(ω_0τ)$", "$A^2 cos(ω_0τ)$", "$(A^2/2)cos(ω_0(t_1+t_2))$", "$(A^2/2)cos(ω_0τ) + A^2/2$"], "hint": "השתמש בזהות מכפלה-לסכום; איבר התדר הכפול מתאפס בממוצע על פאזה אחידה.", "explanation": "מתקיים $R_X(t_1,t_2) = A^2E[cos(ω_0t_1+Θ)cos(ω_0t_2+Θ)] = (A^2/2)cos(ω_0(t_1-t_2)) + (A^2/2)E[cos(ω_0(t_1+t_2)+2Θ)]$. התוחלת השנייה מתאפסת כי $Θ$ אחיד על מחזור שלם, ולכן $R_X(τ) = (A^2/2)cos(ω_0τ)$, והתהליך WSS בעל הספק $R_X(0) = A^2/2$.", "whyWrong": ["‏$A^2cos(ω_0τ)$ משמיט את הגורם $1/2$ מזהות המכפלה-לסכום, ונותן הספק $A^2$ שאינו אפשרי לסינוס במשרעת $A$.", "האיבר $cos(ω_0(t_1+t_2))$ הוא בדיוק החלק שמתאפס בממוצע; שמירתו גם הייתה הורסת את הסטציונריות.", "התוספת $A^2/2$ היא איבר DC; כאן $E[X(t)] = 0$, ולכן $R_X(τ)$ אינה מכילה קבוע."]}}, {"id": "spc-010", "area": "special", "topic": "random-binary-waveform", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["pam", "binary-waveform", "triangular-autocorrelation", "random-delay"], "answer": 1, "en": {"q": "A random binary waveform takes the values $±3$ V on consecutive intervals of length $T = 3$ ms, the signs being i.i.d. and equally likely, with the interval boundaries offset by a delay uniform on $[0,T)$. Compute $R_X(τ)$ at $τ = 1$ ms and at $τ = 4$ ms.", "options": ["$6$ and $-3$", "$6$ and $0$", "$9$ and $0$", "$3$ and $0$"], "hint": "$R_X(τ)$ is $A^2$ times the probability that both samples fall in the same symbol interval, and that probability falls linearly to zero at $|τ| = T$.", "explanation": "For $|τ| < T$ the two samples lie in the same symbol with probability $1-|τ|/T$ (thanks to the uniform delay) and then their product is $A^2$; otherwise they lie in different symbols, whose signs are independent and zero-mean, contributing $0$. So $R_X(τ) = A^2(1-|τ|/T)$ for $|τ| ≤ T$ and $0$ beyond, a triangle. With $A^2 = 9$ and $T = 3$ ms: $R_X(1 ms) = 9(1-1/3) = 6$ V$^2$, and $R_X(4 ms) = 0$ since $4 > T$.", "whyWrong": ["$-3$ comes from applying $9(1-|τ|/T)$ outside its range, $9(1-4/3)$; beyond $|τ| = T$ the samples are always in different symbols and $R_X$ is exactly $0$.", "$9$ at $τ = 1$ ms ignores the triangular taper and treats $R_X$ as flat over the whole symbol, which would make the PSD a sinc rather than a sinc squared.", "$3$ evaluates $9|τ|/T$ instead of $9(1-|τ|/T)$: the taper is inverted, and it would wrongly give $R_X(0)=0$."]}, "he": {"q": "אות בינארי אקראי מקבל את הערכים $±3$ וולט בקטעים רצופים באורך $T = 3$ מילישניות, כאשר הסימנים בלתי תלויים ושווי הסתברות, וגבולות הקטעים מוזזים בהשהיה אחידה על $[0,T)$. חשב את $R_X(τ)$ עבור $τ = 1$ מילישניה ועבור $τ = 4$ מילישניות.", "options": ["$6$ ו-$-3$", "$6$ ו-$0$", "$9$ ו-$0$", "$3$ ו-$0$"], "hint": "‏$R_X(τ)$ שווה ל-$A^2$ כפול ההסתברות ששתי הדגימות נופלות באותו קטע סמל, והסתברות זו יורדת לינארית לאפס ב-$|τ| = T$.", "explanation": "עבור $|τ| < T$ שתי הדגימות נמצאות באותו סמל בהסתברות $1-|τ|/T$ (הודות להשהיה האחידה) ואז מכפלתן היא $A^2$; אחרת הן בסמלים שונים, שסימניהם בלתי תלויים ובעלי תוחלת אפס, והתרומה $0$. לכן $R_X(τ) = A^2(1-|τ|/T)$ עבור $|τ| ≤ T$ ו-$0$ מעבר לכך, כלומר משולש. עם $A^2 = 9$ ו-$T = 3$ מילישניות: $R_X(1) = 9(1-1/3) = 6$ וולט בריבוע, וכן $R_X(4) = 0$ שכן $4 > T$.", "whyWrong": ["‏$-3$ מתקבל מהפעלת $9(1-|τ|/T)$ מחוץ לתחום התקף, $9(1-4/3)$; מעבר ל-$|τ| = T$ הדגימות תמיד בסמלים שונים ו-$R_X$ מתאפסת בדיוק.", "‏$9$ עבור $τ = 1$ מתעלם מהדעיכה המשולשת ומתייחס ל-$R_X$ כשטוחה על פני הסמל, מה שהיה נותן PSD מסוג sinc במקום sinc בריבוע.", "‏$3$ מחשב $9|τ|/T$ במקום $9(1-|τ|/T)$: הדעיכה הפוכה, וזה היה נותן בטעות $R_X(0)=0$."]}}, {"id": "spc-011", "area": "special", "topic": "random-amplitude", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["random-amplitude", "stationarity", "sinusoid", "trap"], "answer": 3, "en": {"q": "$X(t) = A cos(ω_0 t)$, where $ω_0$ is a fixed constant and $A$ is a zero-mean random variable of variance $σ_A^2$ (there is no random phase). Which statement is correct?", "options": ["$X$ is WSS with autocorrelation $R_X(τ) = (σ_A^2/2)cos(ω_0τ)$", "$X$ is WSS, because $E[X(t)] = 0$ holds for every time $t$", "$X$ is WSS provided that the amplitude $A$ is Gaussian", "$X$ is not WSS: $R_X(t_1,t_2) = σ_A^2 cos(ω_0t_1)cos(ω_0t_2)$"], "hint": "WSS needs two conditions; check the second one by computing $Var(X(t))$ at $t = 0$ and at $ω_0t = π/2$.", "explanation": "$E[X(t)] = E[A]cos(ω_0t) = 0$, so the first WSS condition holds. But $R_X(t_1,t_2) = E[A^2]cos(ω_0t_1)cos(ω_0t_2) = σ_A^2cos(ω_0t_1)cos(ω_0t_2)$, which depends on $t_1$ and $t_2$ separately. In particular $Var(X(t)) = σ_A^2cos^2(ω_0t)$ equals $σ_A^2$ at $t=0$ and $0$ at $ω_0t = π/2$, so the power is time-varying and $X$ is not WSS. It is the random phase, not a random amplitude, that makes a sinusoid stationary.", "whyWrong": ["$(σ_A^2/2)cos(ω_0τ)$ is the answer for a randomly phased sinusoid; the factor $1/2$ comes from averaging over $Θ$, which is absent here.", "A constant mean is only the first of the two WSS conditions; the second-moment condition fails here.", "The distribution of $A$ is irrelevant: only $E[A]$ and $E[A^2]$ enter, and the time dependence of $R_X$ remains for any law of $A$."]}, "he": {"q": "‏$X(t) = A cos(ω_0 t)$, כאשר $ω_0$ קבוע ו-$A$ משתנה אקראי בעל תוחלת אפס ושונות $σ_A^2$ (אין פאזה אקראית). איזו טענה נכונה?", "options": ["$X$ הוא WSS עם אוטוקורלציה $R_X(τ) = (σ_A^2/2)cos(ω_0τ)$", "$X$ הוא WSS, מכיוון ש-$E[X(t)] = 0$ מתקיים לכל זמן $t$", "$X$ הוא WSS בתנאי שהמשרעת $A$ מתפלגת גאוסית", "$X$ אינו WSS: $R_X(t_1,t_2) = σ_A^2 cos(ω_0t_1)cos(ω_0t_2)$"], "hint": "‏WSS דורש שני תנאים; בדוק את השני על ידי חישוב $Var(X(t))$ ב-$t = 0$ וב-$ω_0t = π/2$.", "explanation": "מתקיים $E[X(t)] = E[A]cos(ω_0t) = 0$, ולכן התנאי הראשון של WSS מתקיים. אך $R_X(t_1,t_2) = E[A^2]cos(ω_0t_1)cos(ω_0t_2) = σ_A^2cos(ω_0t_1)cos(ω_0t_2)$, התלוי ב-$t_1$ וב-$t_2$ בנפרד. בפרט $Var(X(t)) = σ_A^2cos^2(ω_0t)$ שווה $σ_A^2$ ב-$t=0$ ו-$0$ ב-$ω_0t = π/2$, כך שההספק משתנה בזמן ו-$X$ אינו WSS. הפאזה האקראית, ולא משרעת אקראית, היא זו שהופכת סינוס לסטציונרי.", "whyWrong": ["‏$(σ_A^2/2)cos(ω_0τ)$ היא התשובה עבור סינוס בעל פאזה אקראית; הגורם $1/2$ נובע מהמיצוע על $Θ$, שאינו קיים כאן.", "תוחלת קבועה היא רק הראשון מבין שני תנאי WSS; תנאי המומנט השני נכשל כאן.", "התפלגות $A$ אינה רלוונטית: רק $E[A]$ ו-$E[A^2]$ נכנסים לחישוב, והתלות בזמן של $R_X$ נשארת לכל התפלגות של $A$."]}}, {"id": "spc-012", "area": "special", "topic": "signal-plus-noise", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["signal-plus-noise", "autocorrelation", "psd", "independence"], "answer": 0, "en": {"q": "$Z(t) = S(t) + N(t)$, where $S$ and $N$ are independent, zero-mean and jointly WSS. What are $R_Z(τ)$ and $S_Z(f)$?", "options": ["$R_Z = R_S + R_N$ and $S_Z = S_S + S_N$", "$R_Z = R_S + R_N + 2R_{SN}$ with $R_{SN}(τ) ≠ 0$", "$R_Z = R_S R_N$ and $S_Z = S_S$ convolved with $S_N$", "$R_Z = R_S + R_N + μ_Sμ_N$ for every $τ$"], "hint": "Expand $E[(S(t)+N(t))(S(t+τ)+N(t+τ))]$ and check what independence does to the two cross terms.", "explanation": "Expanding gives $R_Z(τ) = R_S(τ) + R_N(τ) + R_{SN}(τ) + R_{NS}(τ)$. Independence makes $R_{SN}(τ) = E[S(t)]E[N(t+τ)] = μ_Sμ_N$, which is $0$ here since both means are zero. Hence $R_Z = R_S + R_N$, and by linearity of the Fourier transform $S_Z(f) = S_S(f) + S_N(f)$: powers of independent zero-mean components add.", "whyWrong": ["The cross-correlation of independent zero-mean processes is identically zero, so this term cannot survive.", "Autocorrelations of a sum add; they multiply only for a product of processes, and the PSD of a sum is a sum, not a convolution.", "$μ_Sμ_N$ would appear only if the means were non-zero, and then the cross terms contribute $2μ_Sμ_N$; here both means vanish."]}, "he": {"q": "‏$Z(t) = S(t) + N(t)$, כאשר $S$ ו-$N$ בלתי תלויים, בעלי תוחלת אפס ו-WSS במשותף. מהם $R_Z(τ)$ ו-$S_Z(f)$?", "options": ["$R_Z = R_S + R_N$ וגם $S_Z = S_S + S_N$", "$R_Z = R_S + R_N + 2R_{SN}$ כאשר $R_{SN}(τ) ≠ 0$", "$R_Z = R_S R_N$ ו-$S_Z$ הוא הקונבולוציה של $S_S$ עם $S_N$", "$R_Z = R_S + R_N + μ_Sμ_N$ לכל $τ$"], "hint": "פתח את $E[(S(t)+N(t))(S(t+τ)+N(t+τ))]$ ובדוק מה עושה אי-התלות לשני האיברים המעורבים.", "explanation": "הפיתוח נותן $R_Z(τ) = R_S(τ) + R_N(τ) + R_{SN}(τ) + R_{NS}(τ)$. אי-התלות גורמת ל-$R_{SN}(τ) = E[S(t)]E[N(t+τ)] = μ_Sμ_N$, וזה $0$ כאן כי שתי התוחלות אפס. לכן $R_Z = R_S + R_N$, ומלינאריות התמרת פורייה $S_Z(f) = S_S(f) + S_N(f)$: הספקים של רכיבים בלתי תלויים בעלי תוחלת אפס מתחברים.", "whyWrong": ["הקורלציה ההדדית של תהליכים בלתי תלויים בעלי תוחלת אפס מתאפסת זהותית, ולכן איבר זה אינו יכול לשרוד.", "אוטוקורלציות של סכום מתחברות; הן מוכפלות רק עבור מכפלה של תהליכים, וה-PSD של סכום הוא סכום ולא קונבולוציה.", "‏$μ_Sμ_N$ היה מופיע רק אם התוחלות שונות מאפס, ואז האיברים המעורבים תורמים $2μ_Sμ_N$; כאן שתי התוחלות מתאפסות."]}}, {"id": "est-001", "area": "estimation", "topic": "mmse-conditional-mean", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["mmse", "conditional-mean", "definition"], "answer": 2, "en": {"q": "$X$ and $Y$ are jointly distributed with finite second moments. Among all (possibly non-linear) functions $g$, which $g(Y)$ minimises $E[(X-g(Y))^2]$?", "options": ["$g(Y) = E[X]$, the prior mean, which ignores the data", "$g(Y) = ρ(σ_X/σ_Y)(Y-μ_Y)+μ_X$, the best linear rule", "$g(Y) = E[X|Y]$, the conditional mean of $X$ given $Y$", "$g(Y) = argmax_x f_{X|Y}(x|Y)$, the conditional mode"], "hint": "The minimiser is a property of the whole conditional distribution; ask which functional of it minimises a squared-error cost.", "explanation": "Writing $E[(X-g(Y))^2] = E[E[(X-g(Y))^2 | Y]]$, the inner conditional expectation is minimised for each value of $Y$ separately by $g(Y) = E[X|Y]$, since for a fixed conditional law the constant closest in mean square is the conditional mean. The resulting minimum is $E[Var(X|Y)]$. No linearity or Gaussianity is assumed anywhere.", "whyWrong": ["$E[X]$ is the best constant estimator when no data is used; using $Y$ can only lower the MSE, strictly so whenever $Var(E[X|Y]) > 0$.", "The linear rule is optimal only within the class of affine functions of $Y$; it matches $E[X|Y]$ only in special cases such as jointly Gaussian $X,Y$.", "The conditional mode is the MAP estimate, which minimises a $0-1$ (hit-or-miss) cost, not the mean-square cost."]}, "he": {"q": "‏$X$ ו-$Y$ בעלי התפלגות משותפת עם מומנטים שניים סופיים. מבין כל הפונקציות (גם לא-לינאריות) $g$, איזו $g(Y)$ ממזערת את $E[(X-g(Y))^2]$?", "options": ["‏$g(Y) = E[X]$, תוחלת מוקדמת, שמתעלמת מהמדידה", "‏$g(Y) = ρ(σ_X/σ_Y)(Y-μ_Y)+μ_X$, הכלל הלינארי הטוב ביותר", "‏$g(Y) = E[X|Y]$, התוחלת המותנית של $X$ בהינתן $Y$", "‏$g(Y) = argmax_x f_{X|Y}(x|Y)$, השכיח המותנה"], "hint": "הממזער הוא תכונה של ההתפלגות המותנית כולה; שאל איזה פונקציונל שלה ממזער עלות ריבועית.", "explanation": "מרישום $E[(X-g(Y))^2] = E[E[(X-g(Y))^2 | Y]]$, התוחלת המותנית הפנימית ממוזערת עבור כל ערך של $Y$ בנפרד על ידי $g(Y) = E[X|Y]$, שכן עבור התפלגות מותנית קבועה הקבוע הקרוב ביותר במובן ריבועי הוא התוחלת המותנית. המינימום המתקבל הוא $E[Var(X|Y)]$. אין כאן שום הנחת לינאריות או גאוסיות.", "whyWrong": ["‏$E[X]$ הוא האומד הקבוע הטוב ביותר כשלא משתמשים במדידה כלל; שימוש ב-$Y$ יכול רק להקטין את ה-MSE, וממש להקטין כאשר $Var(E[X|Y]) > 0$.", "הכלל הלינארי אופטימלי רק בתוך מחלקת הפונקציות האפיניות של $Y$; הוא מתלכד עם $E[X|Y]$ רק במקרים מיוחדים כמו $X,Y$ גאוסיים במשותף.", "השכיח המותנה הוא אומד MAP, הממזער עלות $0-1$ (פגיעה או החטאה) ולא עלות ריבועית."]}}, {"id": "est-002", "area": "estimation", "topic": "mmse-optimality-proof", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["mmse", "proof", "orthogonality", "conditional-variance"], "en": {"q": "Show that for any function $g$ with $E[g(Y)^2] < ∞$, $E[(X-g(Y))^2] ≥ E[(X-E[X|Y])^2]$, with equality only for $g(Y)=E[X|Y]$. Identify the value of the minimum.", "hint": "Add and subtract $E[X|Y]$ inside the square and use the tower property on the cross term.", "modelAnswer": "Write $M = E[X|Y]$ and decompose $X - g(Y) = (X - M) + (M - g(Y))$. Squaring and taking expectations gives $E[(X-g(Y))^2] = E[(X-M)^2] + 2E[(X-M)(M-g(Y))] + E[(M-g(Y))^2]$. For the cross term, condition on $Y$: the factor $M - g(Y)$ is a function of $Y$, so it may be pulled out of the inner expectation, and $E[X - M | Y] = E[X|Y] - E[X|Y] = 0$. Hence $E[(X-M)(M-g(Y))] = E[(M-g(Y))·E[X-M|Y]] = 0$. This is the orthogonality principle in its general form: the MMSE error $X - E[X|Y]$ is orthogonal to every square-integrable function of the data. Therefore $E[(X-g(Y))^2] = E[(X-M)^2] + E[(M-g(Y))^2] ≥ E[(X-M)^2]$, since the second term is non-negative. Equality holds iff $E[(M-g(Y))^2] = 0$, i.e. $g(Y) = E[X|Y]$ with probability one. The minimum value is $E[(X-E[X|Y])^2] = E[E[(X-M)^2|Y]] = E[Var(X|Y)]$, the expected conditional variance. By the law of total variance $Var(X) = E[Var(X|Y)] + Var(E[X|Y])$, so the MMSE is $Var(X)$ reduced by exactly the variance that the data explains — it can never exceed $Var(X)$.", "rubric": ["Decomposes the error as $(X - E[X|Y]) + (E[X|Y] - g(Y))$ and expands the square.", "Kills the cross term correctly by conditioning on $Y$, using that $E[X|Y]-g(Y)$ is $Y$-measurable and $E[X-E[X|Y]|Y]=0$.", "Concludes the inequality and states that equality requires $g(Y)=E[X|Y]$ almost surely.", "Identifies the minimum MSE as $E[Var(X|Y)]$.", "Relates it to $Var(X) = E[Var(X|Y)] + Var(E[X|Y])$, so the MMSE never exceeds $Var(X)$."]}, "he": {"q": "הראה שלכל פונקציה $g$ עם $E[g(Y)^2] < ∞$ מתקיים $E[(X-g(Y))^2] ≥ E[(X-E[X|Y])^2]$, עם שוויון רק עבור $g(Y)=E[X|Y]$. זהה את ערך המינימום.", "hint": "הוסף וחסר $E[X|Y]$ בתוך הריבוע והשתמש בתכונת המגדל על האיבר המעורב.", "modelAnswer": "נסמן $M = E[X|Y]$ ונפרק $X - g(Y) = (X - M) + (M - g(Y))$. העלאה בריבוע ולקיחת תוחלת נותנות $E[(X-g(Y))^2] = E[(X-M)^2] + 2E[(X-M)(M-g(Y))] + E[(M-g(Y))^2]$. עבור האיבר המעורב נתנה ב-$Y$: הגורם $M - g(Y)$ הוא פונקציה של $Y$ ולכן ניתן להוציאו מהתוחלת הפנימית, ומתקיים $E[X - M | Y] = E[X|Y] - E[X|Y] = 0$. לכן $E[(X-M)(M-g(Y))] = E[(M-g(Y))·E[X-M|Y]] = 0$. זהו עקרון האורתוגונליות בצורתו הכללית: שגיאת ה-MMSE ‏$X - E[X|Y]$ אורתוגונלית לכל פונקציה אינטגרבילית-ריבועית של הנתונים. מכאן $E[(X-g(Y))^2] = E[(X-M)^2] + E[(M-g(Y))^2] ≥ E[(X-M)^2]$, שכן האיבר השני אי-שלילי. שוויון מתקיים אם ורק אם $E[(M-g(Y))^2] = 0$, כלומר $g(Y) = E[X|Y]$ בהסתברות 1. ערך המינימום הוא $E[(X-E[X|Y])^2] = E[E[(X-M)^2|Y]] = E[Var(X|Y)]$, השונות המותנית הממוצעת. לפי חוק השונות הכוללת $Var(X) = E[Var(X|Y)] + Var(E[X|Y])$, ולכן ה-MMSE הוא $Var(X)$ פחות בדיוק השונות שהנתונים מסבירים — והוא לעולם אינו גדול מ-$Var(X)$.", "rubric": ["מפרק את השגיאה ל-$(X - E[X|Y]) + (E[X|Y] - g(Y))$ ומפתח את הריבוע.", "מאפס נכון את האיבר המעורב על ידי התניה ב-$Y$, בעזרת כך ש-$E[X|Y]-g(Y)$ מדיד ביחס ל-$Y$ ו-$E[X-E[X|Y]|Y]=0$.", "מסיק את אי-השוויון ומציין ששוויון דורש $g(Y)=E[X|Y]$ כמעט תמיד.", "מזהה את ה-MSE המינימלי כ-$E[Var(X|Y)]$.", "קושר זאת ל-$Var(X) = E[Var(X|Y)] + Var(E[X|Y])$, ולכן ה-MMSE לעולם אינו עולה על $Var(X)$."]}}, {"id": "est-003", "area": "estimation", "topic": "gaussian-mmse-linear", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["gaussian", "mmse", "lmmse", "linearity"], "answer": 3, "en": {"q": "$X$ and $Y$ are jointly Gaussian with correlation coefficient $ρ$, $0 < |ρ| < 1$. Which statement about the MMSE estimator $E[X|Y]$ is correct?", "options": ["It is generally non-linear, so the LMMSE estimator is strictly worse", "It is affine in $Y$, but its MSE exceeds the LMMSE MSE", "It is affine in $Y$ only if in addition $σ_X = σ_Y$", "It is affine in $Y$, so it coincides with the LMMSE estimator"], "hint": "Compute the conditional density of $X$ given $Y=y$ for a bivariate normal and look at where $y$ appears.", "explanation": "For a bivariate normal, $f_{X|Y}(x|y)$ is again normal with mean $μ_X + ρ(σ_X/σ_Y)(y-μ_Y)$ and variance $σ_X^2(1-ρ^2)$. The conditional mean is affine in $y$, so the globally optimal estimator already lies inside the affine class searched by the LMMSE design; the two therefore coincide, and the conditional variance does not depend on $y$. This is the one classical case where restricting to linear processing costs nothing.", "whyWrong": ["Non-linearity is what happens for general distributions; the bivariate normal conditional mean is exactly affine in $y$.", "The MMSE estimator can never have larger MSE than the LMMSE one, since the affine class is contained in the class of all functions.", "The affine form holds for any $σ_X$, $σ_Y$; the ratio $σ_X/σ_Y$ only sets the slope, it does not have to equal $1$."]}, "he": {"q": "‏$X$ ו-$Y$ גאוסיים במשותף עם מקדם מתאם $ρ$, ‏$0 < |ρ| < 1$. איזה משפט על אומד ה-MMSE ‏$E[X|Y]$ נכון?", "options": ["הוא בדרך כלל לא-לינארי, ולכן אומד ה-LMMSE גרוע ממנו ממש", "הוא אפיני ב-$Y$, אך ה-MSE שלו גדול מזה של ה-LMMSE", "הוא אפיני ב-$Y$ רק אם בנוסף $σ_X = σ_Y$", "הוא אפיני ב-$Y$, ולכן מתלכד עם אומד ה-LMMSE"], "hint": "חשב את הצפיפות המותנית של $X$ בהינתן $Y=y$ עבור נורמלי דו-ממדי ובדוק היכן מופיע $y$.", "explanation": "עבור נורמלי דו-ממדי, $f_{X|Y}(x|y)$ היא שוב נורמלית עם תוחלת $μ_X + ρ(σ_X/σ_Y)(y-μ_Y)$ ושונות $σ_X^2(1-ρ^2)$. התוחלת המותנית אפינית ב-$y$, ולכן האומד האופטימלי הגלובלי כבר נמצא בתוך מחלקת הפונקציות האפיניות שעליה מחפש תכן ה-LMMSE; השניים מתלכדים, והשונות המותנית אינה תלויה ב-$y$. זהו המקרה הקלאסי היחיד שבו הגבלה לעיבוד לינארי אינה עולה דבר.", "whyWrong": ["אי-לינאריות היא מה שקורה בהתפלגויות כלליות; התוחלת המותנית בנורמלי דו-ממדי היא אפינית ב-$y$ בדיוק.", "ל-MMSE לעולם לא יכול להיות MSE גדול משל ה-LMMSE, כיוון שמחלקת הפונקציות האפיניות מוכלת במחלקת כל הפונקציות.", "הצורה האפינית מתקיימת לכל $σ_X$, ‏$σ_Y$; היחס $σ_X/σ_Y$ קובע רק את השיפוע ואינו חייב להיות $1$."]}}, {"id": "est-004", "area": "estimation", "topic": "gaussian-conditional-mean", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["gaussian", "mmse", "computation", "conditional-variance"], "answer": 0, "en": {"q": "$X$ and $Y$ are jointly Gaussian with $μ_X = 2$, $μ_Y = 1$, $σ_X = 4$, $σ_Y = 2$, $ρ = 0.5$. Compute the MMSE estimate of $X$ given the observation $Y = 3$, and the resulting mean-square error.", "options": ["estimate $= 4$, $MSE = 12$", "estimate $= 4$, $MSE = 8$", "estimate $= 2.5$, $MSE = 12$", "estimate $= 3$, $MSE = 4$"], "hint": "The slope is $ρσ_X/σ_Y$, not $ρσ_Y/σ_X$, and the conditional variance carries $ρ^2$.", "explanation": "$E[X|Y=y] = μ_X + ρ(σ_X/σ_Y)(y-μ_Y) = 2 + 0.5·(4/2)·(3-1) = 2 + 1·2 = 4$. The conditional variance is $σ_X^2(1-ρ^2) = 16·(1-0.25) = 12$, and it does not depend on the observed value, so the MSE is $12$. Note the sanity check: $12 < 16 = σ_X^2$, so the observation did reduce the uncertainty, but only by the factor $1-ρ^2 = 0.75$.", "whyWrong": ["$MSE = 8$ comes from $σ_X^2(1-ρ)$ instead of $σ_X^2(1-ρ^2)$: the correlation enters the conditional variance squared.", "The estimate $2.5$ uses the inverted ratio $ρ(σ_Y/σ_X)(y-μ_Y) = 0.5·0.5·2 = 0.5$; the slope must have units of $X$ per unit of $Y$.", "Estimate $3$ with $MSE = 4$ ignores the means and uses $σ_Y^2$ as the error, mixing up which variable is being estimated."]}, "he": {"q": "‏$X$ ו-$Y$ גאוסיים במשותף עם $μ_X = 2$, ‏$μ_Y = 1$, ‏$σ_X = 4$, ‏$σ_Y = 2$, ‏$ρ = 0.5$. חשב את אומד ה-MMSE של $X$ בהינתן המדידה $Y = 3$, ואת שגיאת הריבועים הממוצעת המתקבלת.", "options": ["אומד $= 4$, ‏$MSE = 12$", "אומד $= 4$, ‏$MSE = 8$", "אומד $= 2.5$, ‏$MSE = 12$", "אומד $= 3$, ‏$MSE = 4$"], "hint": "השיפוע הוא $ρσ_X/σ_Y$ ולא $ρσ_Y/σ_X$, ובשונות המותנית מופיע $ρ^2$.", "explanation": "‏$E[X|Y=y] = μ_X + ρ(σ_X/σ_Y)(y-μ_Y) = 2 + 0.5·(4/2)·(3-1) = 2 + 1·2 = 4$. השונות המותנית היא $σ_X^2(1-ρ^2) = 16·(1-0.25) = 12$, והיא אינה תלויה בערך הנמדד, ולכן ה-MSE הוא $12$. בדיקת שפיות: $12 < 16 = σ_X^2$, כלומר המדידה אכן הקטינה את אי-הוודאות, אך רק בפקטור $1-ρ^2 = 0.75$.", "whyWrong": ["‏$MSE = 8$ מתקבל מ-$σ_X^2(1-ρ)$ במקום $σ_X^2(1-ρ^2)$: המתאם נכנס לשונות המותנית בריבוע.", "האומד $2.5$ משתמש ביחס ההפוך $ρ(σ_Y/σ_X)(y-μ_Y) = 0.5·0.5·2 = 0.5$; לשיפוע חייבות להיות יחידות של $X$ ליחידת $Y$.", "אומד $3$ עם $MSE = 4$ מתעלם מהתוחלות ומשתמש ב-$σ_Y^2$ כשגיאה, ומבלבל איזה משתנה מוערך."]}}, {"id": "est-005", "area": "estimation", "topic": "lmmse-single-observation", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["lmmse", "signal-plus-noise", "computation"], "answer": 3, "en": {"q": "A zero-mean $X$ with $σ_X^2 = 9$ is observed as $Y = X + N$, where $N$ is zero-mean with $σ_N^2 = 3$ and independent of $X$. Give the LMMSE estimator of $X$ from $Y$ and its MSE.", "options": ["estimator $= 0.25Y$, $MSE = 2.25$", "estimator $= 0.75Y$, $MSE = 6.75$", "estimator $= 0.75Y$, $MSE = 3$", "estimator $= 0.75Y$, $MSE = 2.25$"], "hint": "The gain is the fraction of the observation power that is signal; the error is the parallel combination of the two variances.", "explanation": "Orthogonality requires $E[(X-aY)Y] = 0$, i.e. $a = E[XY]/E[Y^2] = σ_X^2/(σ_X^2+σ_N^2) = 9/12 = 0.75$. The MSE is $E[(X-aY)X] = σ_X^2 - aσ_X^2 = σ_X^2(1-a) = 9·0.25 = 2.25$, which is also $σ_X^2σ_N^2/(σ_X^2+σ_N^2) = 27/12 = 2.25$. Sanity check: the estimate power $a^2E[Y^2] = 0.5625·12 = 6.75$ plus the MSE $2.25$ gives $σ_X^2 = 9$, as orthogonality demands.", "whyWrong": ["$0.25Y$ uses $σ_N^2/(σ_X^2+σ_N^2)$: that is the weight on the noise, i.e. the shrinkage factor $1-a$, not the gain.", "$6.75$ is the power of the estimate $E[(aY)^2]$, not the error power; the two add up to $σ_X^2$ rather than being equal.", "$MSE = 3$ is the noise variance $σ_N^2$; filtering must do better than that, because it also exploits the prior on $X$."]}, "he": {"q": "משתנה $X$ בעל תוחלת אפס ו-$σ_X^2 = 9$ נמדד כ-$Y = X + N$, כאשר ל-$N$ תוחלת אפס, $σ_N^2 = 3$, והוא בלתי תלוי ב-$X$. מהו אומד ה-LMMSE של $X$ מתוך $Y$ ומהו ה-MSE שלו?", "options": ["אומד $= 0.25Y$, ‏$MSE = 2.25$", "אומד $= 0.75Y$, ‏$MSE = 6.75$", "אומד $= 0.75Y$, ‏$MSE = 3$", "אומד $= 0.75Y$, ‏$MSE = 2.25$"], "hint": "ההגבר הוא חלק הספק המדידה שהוא אות; השגיאה היא החיבור המקבילי של שתי השונויות.", "explanation": "אורתוגונליות דורשת $E[(X-aY)Y] = 0$, כלומר $a = E[XY]/E[Y^2] = σ_X^2/(σ_X^2+σ_N^2) = 9/12 = 0.75$. ה-MSE הוא $E[(X-aY)X] = σ_X^2 - aσ_X^2 = σ_X^2(1-a) = 9·0.25 = 2.25$, שהוא גם $σ_X^2σ_N^2/(σ_X^2+σ_N^2) = 27/12 = 2.25$. בדיקת שפיות: הספק האומד $a^2E[Y^2] = 0.5625·12 = 6.75$ ועוד ה-MSE ‏$2.25$ נותנים $σ_X^2 = 9$, כנדרש מהאורתוגונליות.", "whyWrong": ["‏$0.25Y$ משתמש ב-$σ_N^2/(σ_X^2+σ_N^2)$: זהו המשקל של הרעש, כלומר פקטור הכיווץ $1-a$, ולא ההגבר.", "‏$6.75$ הוא הספק האומד $E[(aY)^2]$ ולא הספק השגיאה; שניהם מסתכמים ל-$σ_X^2$ ואינם שווים זה לזה.", "‏$MSE = 3$ הוא שונות הרעש $σ_N^2$; הסינון חייב להיות טוב מכך, כיוון שהוא מנצל גם את הידע המוקדם על $X$."]}}, {"id": "est-006", "area": "estimation", "topic": "orthogonality-principle", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["orthogonality", "lmmse", "projection"], "answer": 2, "en": {"q": "Let $X$ and the zero-mean data $Y_1,...,Y_N$ be zero mean, and let $X_e$ be the LMMSE estimator of $X$ from the data. The orthogonality principle states that at the optimum:", "options": ["$E[X Y_k] = 0$ for every $k$, so the data carry no bias", "$E[X_e(X-X_e)] ≠ 0$ unless the variables are Gaussian", "$E[(X-X_e)Y_k] = 0$ for every $k = 1,...,N$", "$E[(X-X_e)^2] = 0$, so the estimate is exact at the optimum"], "hint": "Think of $E[UV]$ as an inner product; the optimum is a projection onto the subspace spanned by the data.", "explanation": "With the inner product $⟨U,V⟩ = E[UV]$, the LMMSE estimate is the orthogonal projection of $X$ onto $span\\{Y_1,...,Y_N\\}$. The error is therefore orthogonal to every basis vector: $E[(X-X_e)Y_k] = 0$ for all $k$. Since $X_e$ is a linear combination of the $Y_k$, it follows that $E[(X-X_e)X_e] = 0$ as well, which is what makes the MSE reduce to $σ_X^2 - E[X_e^2]$.", "whyWrong": ["$E[XY_k] = 0$ would mean the data are useless for estimating $X$; it is the error, not $X$ itself, that must be orthogonal.", "$E[X_e(X-X_e)] = 0$ holds for the LMMSE estimator regardless of distribution; Gaussianity is needed only to make it globally optimal.", "A zero MSE would mean perfect estimation; the optimum only minimises the error, it does not annihilate it."]}, "he": {"q": "יהיו $X$ והנתונים $Y_1,...,Y_N$ בעלי תוחלת אפס, ויהי $X_e$ אומד ה-LMMSE של $X$ מתוך הנתונים. עקרון האורתוגונליות קובע שבאופטימום:", "options": ["‏$E[X Y_k] = 0$ לכל $k$, ולכן הנתונים חסרי הטיה", "‏$E[X_e(X-X_e)] ≠ 0$ אלא אם המשתנים גאוסיים", "‏$E[(X-X_e)Y_k] = 0$ לכל $k = 1,...,N$", "‏$E[(X-X_e)^2] = 0$, ולכן האומד מדויק באופטימום"], "hint": "חשוב על $E[UV]$ כמכפלה פנימית; האופטימום הוא היטל על התת-מרחב הנפרש על ידי הנתונים.", "explanation": "עם המכפלה הפנימית $⟨U,V⟩ = E[UV]$, אומד ה-LMMSE הוא ההיטל האורתוגונלי של $X$ על $span\\{Y_1,...,Y_N\\}$. לכן השגיאה אורתוגונלית לכל וקטור בסיס: $E[(X-X_e)Y_k] = 0$ לכל $k$. כיוון ש-$X_e$ הוא צירוף לינארי של ה-$Y_k$, נובע גם $E[(X-X_e)X_e] = 0$, וזה מה שמצמצם את ה-MSE ל-$σ_X^2 - E[X_e^2]$.", "whyWrong": ["‏$E[XY_k] = 0$ פירושו שהנתונים חסרי תועלת להערכת $X$; דווקא השגיאה, ולא $X$ עצמו, חייבת להיות אורתוגונלית.", "‏$E[X_e(X-X_e)] = 0$ מתקיים לאומד ה-LMMSE ללא תלות בהתפלגות; גאוסיות דרושה רק כדי שיהיה אופטימלי גלובלית.", "‏$MSE$ אפס פירושו הערכה מושלמת; האופטימום רק ממזער את השגיאה ואינו מאפס אותה."]}}, {"id": "est-007", "area": "estimation", "topic": "normal-equations", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["normal-equations", "lmmse", "two-observations", "computation"], "answer": 1, "en": {"q": "Zero-mean $X$ with $σ_X^2 = 3$ is observed as $Y_1 = X+N_1$ and $Y_2 = X+N_2$, with $N_1$, $N_2$ zero mean, mutually independent and independent of $X$, $σ_{N1}^2 = 1$, $σ_{N2}^2 = 3$. Solve the normal equations for $X_e = a_1Y_1 + a_2Y_2$.", "options": ["$a_1 = 0.5$, $a_2 = 0.5$", "$a_1 = 0.6$, $a_2 = 0.2$", "$a_1 = 0.75$, $a_2 = 0.25$", "$a_1 = 0.2$, $a_2 = 0.6$"], "hint": "Build $R_Y = E[YY^T]$ and $p = E[XY]$ and solve $R_Ya = p$; the coefficients need not sum to one.", "explanation": "$R_Y = [[σ_X^2+σ_{N1}^2, σ_X^2],[σ_X^2, σ_X^2+σ_{N2}^2]] = [[4,3],[3,6]]$ and $p = (3,3)^T$. Solving $4a_1+3a_2 = 3$ and $3a_1+6a_2 = 3$ gives $a_1 = 0.6$, $a_2 = 0.2$. Equivalently $a_i = (σ_X^2/σ_{Ni}^2)/(1+σ_X^2Σ_j 1/σ_{Nj}^2) = (3/1)/5$ and $(3/3)/5$. The MMSE is $σ_X^2 - a^Tp = 3 - 2.4 = 0.6$, matching $1/(1/σ_X^2 + Σ_j 1/σ_{Nj}^2) = 1/(5/3)$.", "whyWrong": ["Equal weights $0.5, 0.5$ average the two observations, ignoring that $Y_1$ is three times less noisy than $Y_2$.", "$0.75, 0.25$ are the inverse-noise-variance weights normalised to sum to one; that is the ML combination, which discards the prior on $X$.", "$0.2, 0.6$ swaps the roles: the larger weight must go to the cleaner observation $Y_1$."]}, "he": {"q": "משתנה $X$ בעל תוחלת אפס עם $σ_X^2 = 3$ נמדד כ-$Y_1 = X+N_1$ ו-$Y_2 = X+N_2$, כאשר $N_1$, ‏$N_2$ בעלי תוחלת אפס, בלתי תלויים זה בזה וב-$X$, ‏$σ_{N1}^2 = 1$, ‏$σ_{N2}^2 = 3$. פתור את משוואות הנורמל עבור $X_e = a_1Y_1 + a_2Y_2$.", "options": ["‏$a_1 = 0.5$, ‏$a_2 = 0.5$", "‏$a_1 = 0.6$, ‏$a_2 = 0.2$", "‏$a_1 = 0.75$, ‏$a_2 = 0.25$", "‏$a_1 = 0.2$, ‏$a_2 = 0.6$"], "hint": "בנה את $R_Y = E[YY^T]$ ואת $p = E[XY]$ ופתור $R_Ya = p$; המקדמים אינם חייבים להסתכם ל-1.", "explanation": "‏$R_Y = [[σ_X^2+σ_{N1}^2, σ_X^2],[σ_X^2, σ_X^2+σ_{N2}^2]] = [[4,3],[3,6]]$ ו-$p = (3,3)^T$. פתרון $4a_1+3a_2 = 3$ ו-$3a_1+6a_2 = 3$ נותן $a_1 = 0.6$, ‏$a_2 = 0.2$. באופן שקול $a_i = (σ_X^2/σ_{Ni}^2)/(1+σ_X^2Σ_j 1/σ_{Nj}^2) = (3/1)/5$ ו-$(3/3)/5$. ה-MMSE הוא $σ_X^2 - a^Tp = 3 - 2.4 = 0.6$, בהתאמה ל-$1/(1/σ_X^2 + Σ_j 1/σ_{Nj}^2) = 1/(5/3)$.", "whyWrong": ["משקלים שווים $0.5, 0.5$ ממצעים את שתי המדידות, ומתעלמים מכך ש-$Y_1$ רועש פי שלושה פחות מ-$Y_2$.", "‏$0.75, 0.25$ הם משקלי היפוך-שונות-הרעש מנורמלים לסכום 1; זהו שילוב ה-ML, שמזניח את הידע המוקדם על $X$.", "‏$0.2, 0.6$ מחליף את התפקידים: המשקל הגדול חייב להינתן למדידה הנקייה יותר $Y_1$."]}}, {"id": "est-008", "area": "estimation", "topic": "orthogonality-derivation", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["orthogonality", "normal-equations", "derivation", "minimum-mse"], "en": {"q": "For zero-mean $X$ and zero-mean data $Y = (Y_1,...,Y_N)^T$, take $X_e = a^TY$. Minimise the MSE over $a$, state the resulting equations, show they are equivalent to the orthogonality principle, and derive the minimum MSE.", "hint": "Expand $J(a) = E[(X-a^TY)^2]$ into $σ_X^2$, a cross term and a quadratic form, then differentiate.", "modelAnswer": "Let $R_Y = E[YY^T]$ (the $N×N$ data correlation matrix) and $p = E[XY]$ (the cross-correlation vector). Then $J(a) = E[(X - a^TY)^2] = σ_X^2 - 2a^Tp + a^TR_Ya$. Since $R_Y$ is symmetric positive semidefinite, $J$ is convex, so a stationary point is a global minimum. Setting the gradient to zero, $∂J/∂a = -2p + 2R_Ya = 0$, gives the normal equations $R_Ya = p$ (the discrete-time Wiener-Hopf equations). If $R_Y$ is invertible, $a = R_Y^{-1}p$. Reading the $k$-th row of $R_Ya = p$: $Σ_j a_jE[Y_jY_k] = E[XY_k]$, i.e. $E[(X - Σ_j a_jY_j)Y_k] = 0$, i.e. $E[(X-X_e)Y_k] = 0$ for every $k$. This is exactly the orthogonality principle: the error is orthogonal to each datum, hence, by linearity, to every linear combination of the data, in particular to $X_e$ itself. Geometrically, $X_e$ is the orthogonal projection of $X$ onto $span\\{Y_1,...,Y_N\\}$ under the inner product $⟨U,V⟩ = E[UV]$. Minimum MSE: $J_{min} = E[(X-X_e)(X-X_e)] = E[(X-X_e)X] - E[(X-X_e)X_e]$, and the second term vanishes by orthogonality, so $J_{min} = E[(X-X_e)X] = σ_X^2 - a^Tp = σ_X^2 - p^TR_Y^{-1}p$. Equivalently $σ_X^2 = E[X_e^2] + J_{min}$ (Pythagoras), so adding data can only increase $E[X_e^2]$ and decrease $J_{min}$, never the reverse.", "rubric": ["Writes $J(a) = σ_X^2 - 2a^Tp + a^TR_Ya$ with $R_Y = E[YY^T]$, $p = E[XY]$, and notes convexity.", "Differentiates to obtain the normal equations $R_Ya = p$ (equivalently $a = R_Y^{-1}p$).", "Shows row-by-row that these equations are precisely $E[(X-X_e)Y_k] = 0$ for all $k$, and hence $E[(X-X_e)X_e] = 0$.", "Uses orthogonality to obtain $J_{min} = σ_X^2 - a^Tp = σ_X^2 - p^TR_Y^{-1}p$.", "Gives the projection / Pythagoras interpretation $σ_X^2 = E[X_e^2] + J_{min}$, and concludes extra data cannot hurt."]}, "he": {"q": "עבור $X$ בעל תוחלת אפס ונתונים $Y = (Y_1,...,Y_N)^T$ בעלי תוחלת אפס, ניקח $X_e = a^TY$. מזער את ה-MSE לפי $a$, נסח את המשוואות המתקבלות, הראה שהן שקולות לעקרון האורתוגונליות, וגזור את ה-MSE המינימלי.", "hint": "פתח את $J(a) = E[(X-a^TY)^2]$ ל-$σ_X^2$, איבר מעורב ותבנית ריבועית, ואז גזור.", "modelAnswer": "נסמן $R_Y = E[YY^T]$ (מטריצת קורלציית הנתונים בגודל $N×N$) ו-$p = E[XY]$ (וקטור הקורלציה ההדדית). אז $J(a) = E[(X - a^TY)^2] = σ_X^2 - 2a^Tp + a^TR_Ya$. כיוון ש-$R_Y$ סימטרית ואי-שלילית מוגדרת, $J$ קמורה, ולכן נקודה סטציונרית היא מינימום גלובלי. איפוס הגרדיאנט, $∂J/∂a = -2p + 2R_Ya = 0$, נותן את משוואות הנורמל $R_Ya = p$ (משוואות וינר-הופף בזמן בדיד). אם $R_Y$ הפיכה, $a = R_Y^{-1}p$. קריאת השורה ה-$k$ של $R_Ya = p$ נותנת $Σ_j a_jE[Y_jY_k] = E[XY_k]$, כלומר $E[(X - Σ_j a_jY_j)Y_k] = 0$, כלומר $E[(X-X_e)Y_k] = 0$ לכל $k$. זהו בדיוק עקרון האורתוגונליות: השגיאה אורתוגונלית לכל נתון, ומכאן, מלינאריות, לכל צירוף לינארי של הנתונים, ובפרט ל-$X_e$ עצמו. גאומטרית, $X_e$ הוא ההיטל האורתוגונלי של $X$ על $span\\{Y_1,...,Y_N\\}$ עם המכפלה הפנימית $⟨U,V⟩ = E[UV]$. ה-MSE המינימלי: $J_{min} = E[(X-X_e)(X-X_e)] = E[(X-X_e)X] - E[(X-X_e)X_e]$, והאיבר השני מתאפס מהאורתוגונליות, ולכן $J_{min} = E[(X-X_e)X] = σ_X^2 - a^Tp = σ_X^2 - p^TR_Y^{-1}p$. באופן שקול $σ_X^2 = E[X_e^2] + J_{min}$ (פיתגורס), ולכן הוספת נתונים יכולה רק להגדיל את $E[X_e^2]$ ולהקטין את $J_{min}$, לעולם לא להפך.", "rubric": ["כותב $J(a) = σ_X^2 - 2a^Tp + a^TR_Ya$ עם $R_Y = E[YY^T]$, ‏$p = E[XY]$, ומציין קמירות.", "גוזר ומקבל את משוואות הנורמל $R_Ya = p$ (שקול ל-$a = R_Y^{-1}p$).", "מראה שורה-שורה שמשוואות אלו הן בדיוק $E[(X-X_e)Y_k] = 0$ לכל $k$, ומכאן $E[(X-X_e)X_e] = 0$.", "משתמש באורתוגונליות כדי לקבל $J_{min} = σ_X^2 - a^Tp = σ_X^2 - p^TR_Y^{-1}p$.", "נותן את הפרשנות של היטל / פיתגורס $σ_X^2 = E[X_e^2] + J_{min}$, ומסיק שנתונים נוספים אינם יכולים להזיק."]}}, {"id": "est-009", "area": "estimation", "topic": "minimum-mse-expression", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["minimum-mse", "orthogonality", "computation"], "answer": 0, "en": {"q": "Zero-mean $X$ has $σ_X^2 = 10$. Its LMMSE estimate from zero-mean data $Y$ is $X_e = a^TY$ with $a = (0.4, 0.2)^T$ and $p = E[XY] = (15, 10)^T$. Find the minimum MSE and the power $E[X_e^2]$.", "options": ["$MSE = 2$, $E[X_e^2] = 8$", "$MSE = 8$, $E[X_e^2] = 2$", "$MSE = 2$, $E[X_e^2] = 10$", "$MSE = 18$, $E[X_e^2] = 8$"], "hint": "Use $R_Ya = p$ to evaluate $a^TR_Ya$ without ever forming $R_Y$.", "explanation": "At the optimum $R_Ya = p$, so $E[X_e^2] = a^TR_Ya = a^Tp = 0.4·15 + 0.2·10 = 6+2 = 8$. The minimum MSE is $σ_X^2 - a^Tp = 10 - 8 = 2$. The two numbers must satisfy the orthogonal decomposition $σ_X^2 = E[X_e^2] + MSE$, i.e. $10 = 8+2$, which is the Pythagoras identity for the projection.", "whyWrong": ["Swapping the two values violates nothing arithmetically but reverses the roles: $a^Tp$ is the explained power, and what is left over is the error.", "$E[X_e^2] = 10$ would mean the estimate carries all the power of $X$, which forces zero MSE — impossible here since $a^Tp < σ_X^2$.", "$MSE = 18$ comes from $σ_X^2 + a^Tp$; the cross term enters the MSE with a minus sign, as $σ_X^2 - 2a^Tp + a^TR_Ya$."]}, "he": {"q": "למשתנה $X$ בעל תוחלת אפס יש $σ_X^2 = 10$. אומד ה-LMMSE שלו מנתונים $Y$ בעלי תוחלת אפס הוא $X_e = a^TY$ עם $a = (0.4, 0.2)^T$ ו-$p = E[XY] = (15, 10)^T$. מצא את ה-MSE המינימלי ואת ההספק $E[X_e^2]$.", "options": ["‏$MSE = 2$, ‏$E[X_e^2] = 8$", "‏$MSE = 8$, ‏$E[X_e^2] = 2$", "‏$MSE = 2$, ‏$E[X_e^2] = 10$", "‏$MSE = 18$, ‏$E[X_e^2] = 8$"], "hint": "השתמש ב-$R_Ya = p$ כדי לחשב את $a^TR_Ya$ מבלי לבנות כלל את $R_Y$.", "explanation": "באופטימום $R_Ya = p$, ולכן $E[X_e^2] = a^TR_Ya = a^Tp = 0.4·15 + 0.2·10 = 6+2 = 8$. ה-MSE המינימלי הוא $σ_X^2 - a^Tp = 10 - 8 = 2$. שני המספרים חייבים לקיים את הפירוק האורתוגונלי $σ_X^2 = E[X_e^2] + MSE$, כלומר $10 = 8+2$, שהיא זהות פיתגורס עבור ההיטל.", "whyWrong": ["החלפת שני הערכים אינה סותרת חשבונית אך הופכת את התפקידים: $a^Tp$ הוא ההספק המוסבר, והשארית היא השגיאה.", "‏$E[X_e^2] = 10$ פירושו שהאומד נושא את כל הספק $X$, מה שכופה MSE אפס — בלתי אפשרי כאן כי $a^Tp < σ_X^2$.", "‏$MSE = 18$ מתקבל מ-$σ_X^2 + a^Tp$; האיבר המעורב נכנס ל-MSE בסימן מינוס, כמו ב-$σ_X^2 - 2a^Tp + a^TR_Ya$."]}}, {"id": "est-010", "area": "estimation", "topic": "n-observations-mmse", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["repeated-measurements", "mmse", "gaussian", "computation"], "answer": 3, "en": {"q": "$X ~ N(0,4)$ is observed as $Y_i = X + N_i$, $i = 1,...,N$, with $N_i$ i.i.d. $N(0,12)$, independent of $X$. Let $M = (1/N)Σ_i Y_i$. For $N = 9$, give the MMSE estimator of $X$ and its MSE.", "options": ["estimator $= 0.75M$, $MSE = 4/3$", "estimator $= 0.25M$, $MSE = 1$", "estimator $= M$, $MSE = 4/3$", "estimator $= 0.75M$, $MSE = 1$"], "hint": "$M$ is a sufficient statistic: it is $X$ plus noise of variance $σ_N^2/N$. Then apply the one-observation result.", "explanation": "$M = X + (1/N)Σ_iN_i$, and the averaged noise has variance $σ_N^2/N = 12/9 = 4/3$. Applying the scalar result with signal variance $4$ and noise variance $4/3$: the gain is $4/(4+4/3) = 4/(16/3) = 0.75$, and the MSE is $4·(4/3)/(16/3) = 1$. Equivalently $MSE = σ_X^2σ_N^2/(Nσ_X^2+σ_N^2) = 48/48 = 1$. Since $X$ and the noises are Gaussian, this LMMSE estimator is the full MMSE estimator $E[X|Y]$.", "whyWrong": ["$MSE = 4/3$ is the variance of the averaged noise, i.e. the accuracy of the ML estimate $M$; the Bayesian estimator does better by shrinking toward the prior mean.", "Gain $0.25$ uses $(σ_N^2/N)/(σ_X^2+σ_N^2/N)$, the shrinkage factor, instead of the signal fraction.", "Using $M$ itself is the ML/unbiased estimator; it ignores the prior $N(0,4)$ and so has MSE $4/3 > 1$."]}, "he": {"q": "‏$X ~ N(0,4)$ נמדד כ-$Y_i = X + N_i$, ‏$i = 1,...,N$, כאשר $N_i$ הם i.i.d. ‏$N(0,12)$, בלתי תלויים ב-$X$. נסמן $M = (1/N)Σ_i Y_i$. עבור $N = 9$, מהו אומד ה-MMSE של $X$ ומהו ה-MSE שלו?", "options": ["אומד $= 0.75M$, ‏$MSE = 4/3$", "אומד $= 0.25M$, ‏$MSE = 1$", "אומד $= M$, ‏$MSE = 4/3$", "אומד $= 0.75M$, ‏$MSE = 1$"], "hint": "‏$M$ היא סטטיסטיקה מספקת: היא $X$ ועוד רעש בשונות $σ_N^2/N$. אחר כך הפעל את תוצאת המדידה הבודדת.", "explanation": "‏$M = X + (1/N)Σ_iN_i$, ולרעש הממוצע שונות $σ_N^2/N = 12/9 = 4/3$. הפעלת התוצאה הסקלרית עם שונות אות $4$ ושונות רעש $4/3$: ההגבר הוא $4/(4+4/3) = 4/(16/3) = 0.75$, וה-MSE הוא $4·(4/3)/(16/3) = 1$. באופן שקול $MSE = σ_X^2σ_N^2/(Nσ_X^2+σ_N^2) = 48/48 = 1$. כיוון ש-$X$ והרעשים גאוסיים, אומד LMMSE זה הוא אומד ה-MMSE המלא $E[X|Y]$.", "whyWrong": ["‏$MSE = 4/3$ היא שונות הרעש הממוצע, כלומר הדיוק של אומד ה-ML ‏$M$; האומד הבייסיאני טוב יותר כי הוא מכווץ לכיוון התוחלת המוקדמת.", "הגבר $0.25$ משתמש ב-$(σ_N^2/N)/(σ_X^2+σ_N^2/N)$, פקטור הכיווץ, במקום בחלק האות.", "שימוש ב-$M$ עצמו הוא אומד ה-ML/חסר ההטיה; הוא מתעלם מהידע המוקדם $N(0,4)$ ולכן ה-MSE שלו $4/3 > 1$."]}}, {"id": "est-011", "area": "estimation", "topic": "mse-scaling-with-n", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["asymptotics", "repeated-measurements", "trap"], "answer": 1, "en": {"q": "In the model $Y_i = X + N_i$ with i.i.d. zero-mean noises, the MMSE of estimating zero-mean $X$ from $N$ observations is $σ_X^2σ_N^2/(Nσ_X^2+σ_N^2)$. Which statement about its behaviour in $N$ is correct?", "options": ["For large $N$ the MSE approaches $σ_X^2$, the prior variance", "For large $N$ the MSE behaves like $σ_N^2/N$ and tends to $0$", "The MSE decays like $1/N^2$, since $N$ appears twice", "The MSE saturates at $σ_X^2σ_N^2/(σ_X^2+σ_N^2)$, its $N=1$ value"], "hint": "Divide numerator and denominator by $N$ and see which term survives as $N → ∞$.", "explanation": "Write the MSE as $σ_X^2σ_N^2/(Nσ_X^2+σ_N^2)$. For $Nσ_X^2 ≫ σ_N^2$ the denominator is dominated by $Nσ_X^2$, so the MSE $≈ σ_N^2/N → 0$: the prior variance cancels and the accuracy is set by the noise alone, exactly as for the ML estimate. For small $N$ (or very weak prior information relative to the noise) the prior matters and the MSE is below $σ_X^2$ from the start.", "whyWrong": ["$σ_X^2$ is the MSE with no data at all ($N = 0$); more data can only reduce the MSE, never push it back up to the prior variance.", "$N$ appears only in the denominator, so the decay is $1/N$, not $1/N^2$; a $1/N^2$ law would beat the $σ_N^2/N$ accuracy of averaging.", "There is no saturation floor: the expression is strictly decreasing in $N$ and has limit $0$, since the observations are conditionally independent given $X$."]}, "he": {"q": "במודל $Y_i = X + N_i$ עם רעשים i.i.d. בעלי תוחלת אפס, ה-MMSE של הערכת $X$ (תוחלת אפס) מ-$N$ מדידות הוא $σ_X^2σ_N^2/(Nσ_X^2+σ_N^2)$. איזה משפט על התנהגותו ב-$N$ נכון?", "options": ["עבור $N$ גדול ה-MSE שואף ל-$σ_X^2$, השונות המוקדמת", "עבור $N$ גדול ה-MSE מתנהג כ-$σ_N^2/N$ ושואף ל-$0$", "ה-MSE דועך כ-$1/N^2$, כיוון ש-$N$ מופיע פעמיים", "ה-MSE נרווה בערך $σ_X^2σ_N^2/(σ_X^2+σ_N^2)$, ערכו ב-$N=1$"], "hint": "חלק מונה ומכנה ב-$N$ ובדוק איזה איבר שורד כאשר $N → ∞$.", "explanation": "נרשום את ה-MSE כ-$σ_X^2σ_N^2/(Nσ_X^2+σ_N^2)$. כאשר $Nσ_X^2 ≫ σ_N^2$ המכנה נשלט על ידי $Nσ_X^2$, ולכן $MSE ≈ σ_N^2/N → 0$: השונות המוקדמת מצטמצמת והדיוק נקבע על ידי הרעש בלבד, בדיוק כמו באומד ה-ML. עבור $N$ קטן (או מידע מוקדם חלש יחסית לרעש) הידע המוקדם משמעותי וה-MSE קטן מ-$σ_X^2$ כבר מלכתחילה.", "whyWrong": ["‏$σ_X^2$ הוא ה-MSE ללא נתונים כלל ($N = 0$); נתונים נוספים יכולים רק להקטין את ה-MSE ולעולם לא להחזירו לשונות המוקדמת.", "‏$N$ מופיע רק במכנה, ולכן הדעיכה היא $1/N$ ולא $1/N^2$; חוק $1/N^2$ היה עולה על דיוק המיצוע $σ_N^2/N$.", "אין רצפת רוויה: הביטוי יורד ממש ב-$N$ וגבולו $0$, כיוון שהמדידות בלתי תלויות מותנית בהינתן $X$."]}}, {"id": "est-012", "area": "estimation", "topic": "wiener-filter-noncausal", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["wiener-filter", "non-causal", "psd"], "answer": 3, "en": {"q": "$X(t)$ is estimated from a jointly WSS observation $Y(t)$ by an unconstrained (non-causal) LTI filter that minimises $E[(X(t)-X_e(t))^2]$. The optimal frequency response is:", "options": ["$H(f) = S_Y(f)/S_{XY}(f)$", "$H(f) = S_{XY}(f)/S_X(f)$", "$|H(f)|^2 = S_{XY}(f)/S_Y(f)$", "$H(f) = S_{XY}(f)/S_Y(f)$"], "hint": "Fourier-transform the Wiener-Hopf equation $∫h(u)R_Y(τ-u)du = R_{XY}(τ)$, valid for all $τ$ when no causality is imposed.", "explanation": "Orthogonality gives $E[(X(t)-X_e(t))Y(t-τ)] = 0$ for all $τ$, i.e. $(h * R_Y)(τ) = R_{XY}(τ)$ on the whole line. Transforming, $H(f)S_Y(f) = S_{XY}(f)$, hence $H(f) = S_{XY}(f)/S_Y(f)$. For $Y = X+N$ with $X$ and $N$ independent and zero mean, $S_{XY} = S_X$ and $S_Y = S_X+S_N$, giving the familiar $H(f) = S_X(f)/(S_X(f)+S_N(f))$.", "whyWrong": ["$S_Y/S_{XY}$ is the reciprocal; it would blow up where the data are noisiest, exactly where the filter should attenuate.", "Dividing by $S_X$ instead of $S_Y$ ignores the noise: the denominator must be the PSD of what is actually observed.", "The Wiener solution specifies $H(f)$ itself, including its phase; $|H|^2$ appears only when propagating a PSD through a filter."]}, "he": {"q": "‏$X(t)$ מוערך ממדידה $Y(t)$ סטציונרית במשותף באמצעות מסנן LTI לא-סיבתי (ללא אילוץ) הממזער $E[(X(t)-X_e(t))^2]$. תגובת התדר האופטימלית היא:", "options": ["‏$H(f) = S_Y(f)/S_{XY}(f)$", "‏$H(f) = S_{XY}(f)/S_X(f)$", "‏$|H(f)|^2 = S_{XY}(f)/S_Y(f)$", "‏$H(f) = S_{XY}(f)/S_Y(f)$"], "hint": "בצע התמרת פורייה למשוואת וינר-הופף $∫h(u)R_Y(τ-u)du = R_{XY}(τ)$, התקפה לכל $τ$ כשאין אילוץ סיבתיות.", "explanation": "אורתוגונליות נותנת $E[(X(t)-X_e(t))Y(t-τ)] = 0$ לכל $τ$, כלומר $(h * R_Y)(τ) = R_{XY}(τ)$ על כל הישר. לאחר התמרה, $H(f)S_Y(f) = S_{XY}(f)$, ומכאן $H(f) = S_{XY}(f)/S_Y(f)$. עבור $Y = X+N$ עם $X$ ו-$N$ בלתי תלויים ובעלי תוחלת אפס, $S_{XY} = S_X$ ו-$S_Y = S_X+S_N$, ומתקבל $H(f) = S_X(f)/(S_X(f)+S_N(f))$ המוכר.", "whyWrong": ["‏$S_Y/S_{XY}$ הוא ההופכי; הוא היה מתפוצץ בדיוק בתדרים הרועשים ביותר, שם המסנן אמור להחליש.", "חלוקה ב-$S_X$ במקום ב-$S_Y$ מתעלמת מהרעש: המכנה חייב להיות ה-PSD של מה שנמדד בפועל.", "פתרון וינר מגדיר את $H(f)$ עצמו, כולל הפאזה; $|H|^2$ מופיע רק בהעברת PSD דרך מסנן."]}}, {"id": "est-013", "area": "estimation", "topic": "wiener-signal-plus-noise", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["wiener-filter", "signal-plus-noise", "computation", "psd"], "answer": 0, "en": {"q": "$Y(t) = X(t)+N(t)$ with $X$, $N$ independent and zero mean. $S_X(f) = 3$ for $|f| ≤ 2$ Hz and $0$ elsewhere; $S_N(f) = 1$ for all $f$. Give the non-causal Wiener filter and the resulting minimum MSE.", "options": ["$H = 3/4$ on $|f| ≤ 2$, $0$ elsewhere; $MSE = 3$", "$H = 3/4$ on $|f| ≤ 2$, $0$ elsewhere; $MSE = 12$", "$H = 1/4$ on $|f| ≤ 2$, $0$ elsewhere; $MSE = 3$", "$H = 3/4$ for all $f$; $MSE = 4$"], "hint": "$MSE = ∫ S_X(f)S_N(f)/(S_X(f)+S_N(f)) df$; note the integrand vanishes wherever $S_X = 0$.", "explanation": "$H(f) = S_X/(S_X+S_N)$ equals $3/(3+1) = 3/4$ inside the band and $0/(0+1) = 0$ outside — the filter blocks the out-of-band frequencies, where only noise lives. The MSE is $∫_{-2}^{2}(3·1)/(3+1)df = 0.75·4 = 3$; outside the band the integrand is $0$. Sanity check: the signal power is $3·4 = 12$, so the filter removes $9$ of the $12$ units of uncertainty, and $3 < 12$ as required.", "whyWrong": ["$MSE = 12$ is the signal power $∫S_X df$, i.e. the error of the trivial estimate $X_e = 0$; the filter must do strictly better.", "$H = 1/4$ is $S_N/(S_X+S_N)$, the transfer function of the error path $1-H$, not of the estimator.", "Keeping $H = 3/4$ outside the band would pass pure noise; there $S_X = 0$, so the optimal gain is exactly $0$, and $4$ is just the in-band noise power."]}, "he": {"q": "‏$Y(t) = X(t)+N(t)$ עם $X$, ‏$N$ בלתי תלויים ובעלי תוחלת אפס. ‏$S_X(f) = 3$ עבור $|f| ≤ 2$ Hz ו-$0$ אחרת; $S_N(f) = 1$ לכל $f$. מהו מסנן וינר הלא-סיבתי ומהו ה-MSE המינימלי?", "options": ["‏$H = 3/4$ ב-$|f| ≤ 2$, ‏$0$ אחרת; $MSE = 3$", "‏$H = 3/4$ ב-$|f| ≤ 2$, ‏$0$ אחרת; $MSE = 12$", "‏$H = 1/4$ ב-$|f| ≤ 2$, ‏$0$ אחרת; $MSE = 3$", "‏$H = 3/4$ לכל $f$; ‏$MSE = 4$"], "hint": "‏$MSE = ∫ S_X(f)S_N(f)/(S_X(f)+S_N(f)) df$; שים לב שהאינטגרנד מתאפס בכל מקום שבו $S_X = 0$.", "explanation": "‏$H(f) = S_X/(S_X+S_N)$ שווה $3/(3+1) = 3/4$ בתוך הפס ו-$0/(0+1) = 0$ מחוצה לו — המסנן חוסם את התדרים שמחוץ לפס, שבהם יש רק רעש. ה-MSE הוא $∫_{-2}^{2}(3·1)/(3+1)df = 0.75·4 = 3$; מחוץ לפס האינטגרנד $0$. בדיקת שפיות: הספק האות הוא $3·4 = 12$, ולכן המסנן מסיר $9$ מתוך $12$ יחידות אי-הוודאות, ו-$3 < 12$ כנדרש.", "whyWrong": ["‏$MSE = 12$ הוא הספק האות $∫S_X df$, כלומר שגיאת האומד הטריוויאלי $X_e = 0$; המסנן חייב להיות טוב ממנו ממש.", "‏$H = 1/4$ הוא $S_N/(S_X+S_N)$, פונקציית התמסורת של מסלול השגיאה $1-H$ ולא של האומד.", "שמירת $H = 3/4$ מחוץ לפס תעביר רעש טהור; שם $S_X = 0$ ולכן ההגבר האופטימלי הוא בדיוק $0$, ו-$4$ הוא רק הספק הרעש בתוך הפס."]}}, {"id": "est-014", "area": "estimation", "topic": "causal-wiener-spectral-factorization", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["causal-wiener", "spectral-factorization", "whitening", "innovations"], "en": {"q": "Explain why the non-causal solution $H(f) = S_{XY}(f)/S_Y(f)$ cannot simply be truncated to $t ≥ 0$ when causality is required, and describe how spectral factorisation produces the causal Wiener filter.", "hint": "The Wiener-Hopf equation holds only for $τ ≥ 0$ under a causality constraint, so it is not a convolution identity on the whole line.", "modelAnswer": "Under a causality constraint the orthogonality condition $E[(X(t)-X_e(t))Y(t-τ)] = 0$ can only be imposed for the lags actually available, $τ ≥ 0$. The Wiener-Hopf equation therefore reads $∫_0^{∞}h(u)R_Y(τ-u)du = R_{XY}(τ)$ for $τ ≥ 0$ only, with $h(u) = 0$ for $u < 0$. This is not a convolution identity on the whole line, so one cannot Fourier-transform it and divide: for $τ < 0$ the two sides differ by an unknown function. Truncating the non-causal $h$ to $τ ≥ 0$ is not optimal either, because after truncation the error is no longer orthogonal to the past data — the discarded tail is correlated with the observations that remain. The standard construction: (1) Factor $S_Y(f) = G(f)G^*(f) = |G(f)|^2$ with $G$ causal, stable and minimum phase, so that $1/G$ is also causal and stable. Such a factorisation exists when the Paley-Wiener condition $∫|ln S_Y(f)|/(1+f^2)df < ∞$ holds. (2) Filter $Y$ by the whitening filter $1/G(f)$ to obtain an innovations process $I$ with $S_I(f) = 1$, white and causally equivalent to $Y$ (no information is lost, because $1/G$ and $G$ are both causal). (3) For white data the Wiener-Hopf equation becomes trivial: the optimal impulse response equals the cross-correlation $R_{XI}(τ)$ for $τ ≥ 0$ and $0$ for $τ < 0$, i.e. in the frequency domain one keeps only the causal part, written $[S_{XY}(f)/G^*(f)]_+$. (4) Cascade: $H_c(f) = (1/G(f))·[S_{XY}(f)/G^*(f)]_+$. If the bracket is not truncated one recovers exactly $S_{XY}/S_Y$, the non-causal filter, which shows precisely where causality enters. Because the causal filter optimises over a strictly smaller class, its MMSE is always greater than or equal to the non-causal MMSE, with equality only when $S_{XY}/G^*$ happens to be causal already.", "rubric": ["States that with causality the Wiener-Hopf equation holds only for $τ ≥ 0$, so it is not a convolution on the whole line and cannot be inverted by Fourier transform.", "Explains that truncating the non-causal $h(τ)$ destroys orthogonality of the error to the past data, hence is suboptimal.", "Describes the factorisation $S_Y = |G|^2$ with $G$ causal, stable, minimum phase (so $1/G$ is causal), citing the Paley-Wiener condition.", "Describes whitening to innovations and taking the causal part, giving $H_c(f) = (1/G(f))[S_{XY}(f)/G^*(f)]_+$.", "Notes that the causal MMSE is never smaller than the non-causal MMSE, with equality only in the degenerate case."]}, "he": {"q": "הסבר מדוע לא ניתן פשוט לקטום את הפתרון הלא-סיבתי $H(f) = S_{XY}(f)/S_Y(f)$ ל-$t ≥ 0$ כאשר נדרשת סיבתיות, ותאר כיצד פירוק ספקטרלי מייצר את מסנן וינר הסיבתי.", "hint": "תחת אילוץ סיבתיות משוואת וינר-הופף מתקיימת רק עבור $τ ≥ 0$, ולכן היא אינה זהות קונבולוציה על כל הישר.", "modelAnswer": "תחת אילוץ סיבתיות ניתן לכפות את תנאי האורתוגונליות $E[(X(t)-X_e(t))Y(t-τ)] = 0$ רק עבור ההזזות הזמינות בפועל, $τ ≥ 0$. לכן משוואת וינר-הופף היא $∫_0^{∞}h(u)R_Y(τ-u)du = R_{XY}(τ)$ עבור $τ ≥ 0$ בלבד, עם $h(u) = 0$ עבור $u < 0$. זו אינה זהות קונבולוציה על כל הישר, ולכן אי אפשר להתמיר ולחלק: עבור $τ < 0$ שני האגפים נבדלים בפונקציה לא ידועה. גם קטימת ה-$h$ הלא-סיבתי ל-$τ ≥ 0$ אינה אופטימלית, כי לאחר הקטימה השגיאה כבר אינה אורתוגונלית לנתוני העבר — הזנב שנזרק מתואם עם המדידות שנשארו. הבנייה הסטנדרטית: (1) פרק $S_Y(f) = G(f)G^*(f) = |G(f)|^2$ עם $G$ סיבתי, יציב ובעל פאזה מינימלית, כך ש-$1/G$ אף הוא סיבתי ויציב. פירוק כזה קיים כאשר מתקיים תנאי פיילי-וינר $∫|ln S_Y(f)|/(1+f^2)df < ∞$. (2) העבר את $Y$ במסנן ההלבנה $1/G(f)$ ותקבל תהליך חידושים $I$ עם $S_I(f) = 1$, לבן ושקול סיבתית ל-$Y$ (לא אובד מידע, כי גם $1/G$ וגם $G$ סיבתיים). (3) עבור נתונים לבנים משוואת וינר-הופף הופכת טריוויאלית: תגובת ההלם האופטימלית שווה לקורלציה ההדדית $R_{XI}(τ)$ עבור $τ ≥ 0$ ו-$0$ עבור $τ < 0$, כלומר בתחום התדר שומרים רק את החלק הסיבתי, המסומן $[S_{XY}(f)/G^*(f)]_+$. (4) שרשור: $H_c(f) = (1/G(f))·[S_{XY}(f)/G^*(f)]_+$. אם לא קוטמים את הסוגריים מתקבל בדיוק $S_{XY}/S_Y$, המסנן הלא-סיבתי, וזה מראה היכן בדיוק נכנסת הסיבתיות. כיוון שהמסנן הסיבתי ממטב על מחלקה קטנה ממש, ה-MMSE שלו תמיד גדול או שווה ל-MMSE הלא-סיבתי, עם שוויון רק כאשר $S_{XY}/G^*$ ממילא סיבתי.", "rubric": ["מציין שתחת סיבתיות משוואת וינר-הופף מתקיימת רק עבור $τ ≥ 0$, ולכן אינה קונבולוציה על כל הישר ואינה ניתנת להיפוך בהתמרת פורייה.", "מסביר שקטימת $h(τ)$ הלא-סיבתי הורסת את האורתוגונליות של השגיאה לנתוני העבר, ולכן אינה אופטימלית.", "מתאר את הפירוק $S_Y = |G|^2$ עם $G$ סיבתי, יציב ובעל פאזה מינימלית (כך ש-$1/G$ סיבתי), ומזכיר את תנאי פיילי-וינר.", "מתאר הלבנה לחידושים ולקיחת החלק הסיבתי, ומקבל $H_c(f) = (1/G(f))[S_{XY}(f)/G^*(f)]_+$.", "מציין שה-MMSE הסיבתי לעולם אינו קטן מה-MMSE הלא-סיבתי, עם שוויון רק במקרה המנוון."]}}, {"id": "est-015", "area": "estimation", "topic": "wiener-hopf-equation", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["wiener-hopf", "causality", "trap"], "answer": 1, "en": {"q": "A causal filter $h(τ)$, $h(τ)=0$ for $τ<0$, estimates $X(t)$ from $Y(t)$. Which statement about the Wiener-Hopf equation it must satisfy is correct?", "options": ["$∫_0^{∞}h(u)R_Y(τ-u)du = R_{XY}(τ)$ for all $τ$, so Fourier inversion solves it", "$∫_0^{∞}h(u)R_Y(τ-u)du = R_{XY}(τ)$ for $τ ≥ 0$ only, so Fourier inversion fails", "$∫_{-∞}^{∞}h(u)R_Y(τ-u)du = R_X(τ)$ for $τ ≥ 0$, with $R_X$ on the right", "$∫_0^{∞}h(u)R_X(τ-u)du = R_{XY}(τ)$ for all $τ$, using $R_X$ in the kernel"], "hint": "Orthogonality can only be imposed against data the filter is actually allowed to see.", "explanation": "Causality means the estimate uses $Y(t-τ)$ only for $τ ≥ 0$, so the orthogonality conditions $E[(X(t)-X_e(t))Y(t-τ)] = 0$ can be written only for $τ ≥ 0$. This gives $(h*R_Y)(τ) = R_{XY}(τ)$ for $τ ≥ 0$ with $h$ supported on $[0,∞)$. Because the identity is not valid for $τ<0$, the equation is not a plain convolution and cannot be solved by dividing transforms; one must whiten $Y$ by spectral factorisation and then take the causal part.", "whyWrong": ["Requiring the identity for all $τ$ is the non-causal problem; there the solution is $H = S_{XY}/S_Y$, which is generally two-sided in time.", "The kernel must be $R_Y$, the correlation of the observed process, and the right-hand side $R_{XY}$; putting $R_X$ on the right ignores the noise entirely.", "Replacing $R_Y$ by $R_X$ inside the integral is the same error: the filter operates on $Y$, so it is $Y$'s second-order statistics that appear in the kernel."]}, "he": {"q": "מסנן סיבתי $h(τ)$, עם $h(τ)=0$ עבור $τ<0$, מעריך את $X(t)$ מתוך $Y(t)$. איזה משפט על משוואת וינר-הופף שהוא חייב לקיים נכון?", "options": ["‏$∫_0^{∞}h(u)R_Y(τ-u)du = R_{XY}(τ)$ לכל $τ$, ולכן היפוך פורייה פותר", "‏$∫_0^{∞}h(u)R_Y(τ-u)du = R_{XY}(τ)$ עבור $τ ≥ 0$ בלבד, ופורייה נכשל", "‏$∫_{-∞}^{∞}h(u)R_Y(τ-u)du = R_X(τ)$ עבור $τ ≥ 0$, עם $R_X$ באגף ימין", "‏$∫_0^{∞}h(u)R_X(τ-u)du = R_{XY}(τ)$ לכל $τ$, עם $R_X$ בגרעין"], "hint": "אפשר לכפות אורתוגונליות רק מול נתונים שהמסנן באמת רשאי לראות.", "explanation": "סיבתיות פירושה שהאומד משתמש ב-$Y(t-τ)$ רק עבור $τ ≥ 0$, ולכן תנאי האורתוגונליות $E[(X(t)-X_e(t))Y(t-τ)] = 0$ ניתנים לכתיבה רק עבור $τ ≥ 0$. מכאן $(h*R_Y)(τ) = R_{XY}(τ)$ עבור $τ ≥ 0$ כאשר תומך $h$ הוא $[0,∞)$. כיוון שהזהות אינה תקפה עבור $τ<0$, המשוואה אינה קונבולוציה רגילה ולא ניתן לפתור אותה בחלוקת התמרות; יש להלבין את $Y$ בפירוק ספקטרלי ואז לקחת את החלק הסיבתי.", "whyWrong": ["דרישת הזהות לכל $τ$ היא הבעיה הלא-סיבתית; שם הפתרון הוא $H = S_{XY}/S_Y$, שהוא בדרך כלל דו-צדדי בזמן.", "הגרעין חייב להיות $R_Y$, הקורלציה של התהליך הנמדד, ואגף ימין $R_{XY}$; הצבת $R_X$ באגף ימין מתעלמת לחלוטין מהרעש.", "החלפת $R_Y$ ב-$R_X$ בתוך האינטגרל היא אותה שגיאה: המסנן פועל על $Y$, ולכן הסטטיסטיקות מסדר שני של $Y$ הן המופיעות בגרעין."]}}, {"id": "est-016", "area": "estimation", "topic": "ar1-two-step-prediction", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["ar1", "prediction", "computation", "markov"], "answer": 2, "en": {"q": "$X[n] = 0.5X[n-1] + W[n]$, with $W$ zero-mean white, $σ_W^2 = 3$, independent of the past. Give the best linear two-step-ahead predictor of $X[n+2]$ from $\\{X[k], k ≤ n\\}$ and its error variance.", "options": ["predictor $= 0.5X[n]$, $MSE = 3$", "predictor $= 0.25X[n]$, $MSE = 3$", "predictor $= 0.25X[n]$, $MSE = 3.75$", "predictor $= 0.25X[n]$, $MSE = 4$"], "hint": "Iterate the recursion twice: $X[n+2] = a^2X[n] + aW[n+1] + W[n+2]$, then take expectations given the past.", "explanation": "Iterating, $X[n+2] = a^2X[n] + aW[n+1] + W[n+2]$ with $a = 0.5$. The two innovations $W[n+1]$, $W[n+2]$ are orthogonal to all $X[k]$, $k ≤ n$, so the projection is $a^2X[n] = 0.25X[n]$ and the error is $aW[n+1]+W[n+2]$, of variance $σ_W^2(1+a^2) = 3·1.25 = 3.75$. Consistency check: $σ_X^2 = σ_W^2/(1-a^2) = 3/0.75 = 4$, and $σ_X^2(1-a^4) = 4(1-0.0625) = 3.75$, the same value, and it is below $σ_X^2$ as it must be.", "whyWrong": ["$0.5X[n]$ is the one-step gain; predicting two steps ahead requires the coefficient $a^2$, since the correlation decays as $a^{|k|}$.", "$MSE = 3$ is the one-step error $σ_W^2$; two steps ahead there are two innovations to miss, not one.", "$MSE = 4$ is the full process variance $σ_X^2$, the error of predicting infinitely far ahead; at lag $2$ the sample $X[n]$ is still informative."]}, "he": {"q": "‏$X[n] = 0.5X[n-1] + W[n]$, כאשר $W$ לבן בעל תוחלת אפס, $σ_W^2 = 3$, בלתי תלוי בעבר. מהו החזאי הלינארי הטוב ביותר לשני צעדים קדימה של $X[n+2]$ מתוך $\\{X[k], k ≤ n\\}$ ומהי שונות השגיאה?", "options": ["חזאי $= 0.5X[n]$, ‏$MSE = 3$", "חזאי $= 0.25X[n]$, ‏$MSE = 3$", "חזאי $= 0.25X[n]$, ‏$MSE = 3.75$", "חזאי $= 0.25X[n]$, ‏$MSE = 4$"], "hint": "הפעל את הרקורסיה פעמיים: $X[n+2] = a^2X[n] + aW[n+1] + W[n+2]$, ואז קח תוחלת בהינתן העבר.", "explanation": "מהפעלה חוזרת, $X[n+2] = a^2X[n] + aW[n+1] + W[n+2]$ עם $a = 0.5$. שני החידושים $W[n+1]$, ‏$W[n+2]$ אורתוגונליים לכל $X[k]$, ‏$k ≤ n$, ולכן ההיטל הוא $a^2X[n] = 0.25X[n]$ והשגיאה היא $aW[n+1]+W[n+2]$, בעלת שונות $σ_W^2(1+a^2) = 3·1.25 = 3.75$. בדיקת עקביות: $σ_X^2 = σ_W^2/(1-a^2) = 3/0.75 = 4$, ו-$σ_X^2(1-a^4) = 4(1-0.0625) = 3.75$, אותו ערך, והוא קטן מ-$σ_X^2$ כנדרש.", "whyWrong": ["‏$0.5X[n]$ הוא ההגבר לצעד אחד; חיזוי שני צעדים קדימה דורש מקדם $a^2$, כיוון שהקורלציה דועכת כ-$a^{|k|}$.", "‏$MSE = 3$ היא שגיאת הצעד הבודד $σ_W^2$; לשני צעדים קדימה מפספסים שני חידושים ולא אחד.", "‏$MSE = 4$ היא שונות התהליך המלאה $σ_X^2$, שגיאת חיזוי לאינסוף צעדים קדימה; בהזזה $2$ הדגימה $X[n]$ עדיין אינפורמטיבית."]}}, {"id": "est-017", "area": "estimation", "topic": "ar1-one-step-prediction", "difficulty": 3, "type": "open", "hardnessSource": "computation", "tags": ["ar1", "prediction", "orthogonality", "innovations"], "en": {"q": "For $X[n] = aX[n-1] + W[n]$ with $|a| < 1$ and $W$ zero-mean white of variance $σ_W^2$ independent of the past, use the orthogonality principle to find the best linear one-step predictor of $X[n]$ from the entire past, and its error variance. Discuss the limits $a → 0$ and $|a| → 1$.", "hint": "Guess the predictor from the recursion and then verify orthogonality of the resulting error to every past sample.", "modelAnswer": "The process is WSS with $σ_X^2 = σ_W^2/(1-a^2)$ and $R_X(k) = σ_X^2a^{|k|}$. Guess the predictor $P[n] = aX[n-1]$. Its error is $X[n] - P[n] = W[n]$. Because $W[n]$ is independent of (in particular orthogonal to) $X[n-k]$ for every $k ≥ 1$ — those samples are built from $W[n-1], W[n-2], ...$ — the orthogonality condition $E[(X[n]-P[n])X[n-k]] = E[W[n]X[n-k]] = 0$ holds for all $k ≥ 1$. By the orthogonality principle (and uniqueness of the projection) $P[n] = aX[n-1]$ is the LMMSE predictor, and the prediction error variance is $E[W[n]^2] = σ_W^2$. Cross-check via the one-tap normal equation: with a single past sample the optimal coefficient is $c = R_X(1)/R_X(0) = a$ and the MSE is $R_X(0) - cR_X(1) = σ_X^2(1-a^2) = σ_W^2$ — the same value, confirming that samples older than $X[n-1]$ add nothing (the Markov property of AR(1)). Limits: as $a → 0$ the process becomes white, the predictor collapses to $0$ and the MSE tends to $σ_W^2 = σ_X^2$, i.e. no predictability at all. As $|a| → 1$ the ratio $MSE/σ_X^2 = 1-a^2 → 0$: the process is nearly a random walk, extremely smooth, and almost perfectly predictable one step ahead relative to its own (large) variance. Finally, if $W$ is Gaussian then $X$ is a Gaussian process and this linear predictor is also the full MMSE predictor $E[X[n] | past]$.", "rubric": ["States $σ_X^2 = σ_W^2/(1-a^2)$ and $R_X(k) = σ_X^2a^{|k|}$.", "Proposes $P[n] = aX[n-1]$ and verifies $E[(X[n]-P[n])X[n-k]] = 0$ for all $k ≥ 1$ using independence of $W[n]$ from the past.", "Concludes the prediction error variance is $σ_W^2$, and checks it against $R_X(0) - R_X(1)^2/R_X(0) = σ_X^2(1-a^2)$.", "Observes that older samples are useless (Markov property), so one tap suffices.", "Discusses the limits: $a → 0$ gives $MSE = σ_X^2$ (unpredictable), $|a| → 1$ gives $MSE/σ_X^2 → 0$; notes the Gaussian case makes it globally MMSE."]}, "he": {"q": "עבור $X[n] = aX[n-1] + W[n]$ עם $|a| < 1$ ו-$W$ לבן בעל תוחלת אפס ושונות $σ_W^2$ בלתי תלוי בעבר, השתמש בעקרון האורתוגונליות כדי למצוא את החזאי הלינארי הטוב ביותר לצעד אחד של $X[n]$ מכל העבר, ואת שונות השגיאה. דון בגבולות $a → 0$ ו-$|a| → 1$.", "hint": "נחש את החזאי מתוך הרקורסיה ואז ודא אורתוגונליות של השגיאה לכל דגימת עבר.", "modelAnswer": "התהליך הוא WSS עם $σ_X^2 = σ_W^2/(1-a^2)$ ו-$R_X(k) = σ_X^2a^{|k|}$. ננחש את החזאי $P[n] = aX[n-1]$. שגיאתו היא $X[n] - P[n] = W[n]$. כיוון ש-$W[n]$ בלתי תלוי (ובפרט אורתוגונלי) ל-$X[n-k]$ לכל $k ≥ 1$ — דגימות אלו בנויות מ-$W[n-1], W[n-2], ...$ — מתקיים תנאי האורתוגונליות $E[(X[n]-P[n])X[n-k]] = E[W[n]X[n-k]] = 0$ לכל $k ≥ 1$. לפי עקרון האורתוגונליות (ויחידות ההיטל) $P[n] = aX[n-1]$ הוא חזאי ה-LMMSE, ושונות שגיאת החיזוי היא $E[W[n]^2] = σ_W^2$. בדיקה חוזרת דרך משוואת נורמל עם מקדם יחיד: עם דגימת עבר אחת המקדם האופטימלי הוא $c = R_X(1)/R_X(0) = a$ וה-MSE הוא $R_X(0) - cR_X(1) = σ_X^2(1-a^2) = σ_W^2$ — אותו ערך, מה שמאשר שדגימות ישנות מ-$X[n-1]$ אינן מוסיפות דבר (תכונת מרקוב של AR(1)). גבולות: כאשר $a → 0$ התהליך הופך ללבן, החזאי מתאפס וה-MSE שואף ל-$σ_W^2 = σ_X^2$, כלומר אין שום יכולת חיזוי. כאשר $|a| → 1$ היחס $MSE/σ_X^2 = 1-a^2 → 0$: התהליך קרוב להילוך מקרי, חלק מאוד, וניתן לחיזוי כמעט מושלם לצעד אחד יחסית לשונותו (הגדולה). לבסוף, אם $W$ גאוסי אז $X$ תהליך גאוסי וחזאי לינארי זה הוא גם חזאי ה-MMSE המלא $E[X[n] | עבר]$.", "rubric": ["מציין $σ_X^2 = σ_W^2/(1-a^2)$ ו-$R_X(k) = σ_X^2a^{|k|}$.", "מציע $P[n] = aX[n-1]$ ומאמת $E[(X[n]-P[n])X[n-k]] = 0$ לכל $k ≥ 1$ בעזרת אי-תלות $W[n]$ בעבר.", "מסיק ששונות שגיאת החיזוי היא $σ_W^2$, ומאמת מול $R_X(0) - R_X(1)^2/R_X(0) = σ_X^2(1-a^2)$.", "מבחין שדגימות ישנות יותר חסרות תועלת (תכונת מרקוב), ולכן מקדם אחד מספיק.", "דן בגבולות: $a → 0$ נותן $MSE = σ_X^2$ (חסר חיזוי), $|a| → 1$ נותן $MSE/σ_X^2 → 0$; מציין שבמקרה הגאוסי זהו MMSE גלובלי."]}}, {"id": "est-018", "area": "estimation", "topic": "estimation-taxonomy", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["filtering", "smoothing", "prediction", "interpolation"], "answer": 3, "en": {"q": "Data $Y(t)$ is observed up to time $t_0$ and $X(t_1)$ is to be estimated. Which statement about filtering ($t_1 = t_0$), prediction ($t_1 > t_0$) and smoothing ($t_1 < t_0$) is correct?", "options": ["Filtering uses future data, whereas smoothing uses only past data", "Interpolation and prediction both require $t_1 > t_0$", "Smoothing is a causal operation while prediction is non-causal", "Smoothing has MSE no larger than filtering at the same $t_1$"], "hint": "Compare the sets of observations available to each task; a larger data set can only shrink the projection error.", "explanation": "Smoothing estimates $X(t_1)$ with $t_1 < t_0$, so it uses everything the filter at time $t_1$ had plus all the data collected between $t_1$ and $t_0$. Since the LMMSE estimate is a projection, enlarging the data subspace can only reduce (never increase) the error, so $MSE_{smoothing} ≤ MSE_{filtering} ≤ MSE_{prediction}$ for the same target instant. Interpolation is the discrete-data version of smoothing: recovering a missing sample from samples on both sides of it.", "whyWrong": ["It is the other way round: filtering uses data only up to the present, while smoothing is allowed to look at later data.", "Interpolation reconstructs a value surrounded by data, i.e. inside the observation record; only prediction needs $t_1 > t_0$.", "Smoothing is non-causal (it uses future observations); prediction is causal in the sense that it uses only past data."]}, "he": {"q": "נתונים $Y(t)$ נצפים עד זמן $t_0$ ורוצים להעריך את $X(t_1)$. איזה משפט על סינון ($t_1 = t_0$), חיזוי ($t_1 > t_0$) והחלקה ($t_1 < t_0$) נכון?", "options": ["סינון משתמש בנתוני עתיד, בעוד החלקה משתמשת רק בנתוני עבר", "אינטרפולציה וחיזוי דורשים שניהם $t_1 > t_0$", "החלקה היא פעולה סיבתית בעוד חיזוי הוא לא-סיבתי", "להחלקה יש MSE שאינו גדול משל סינון באותו $t_1$"], "hint": "השווה את קבוצות המדידות הזמינות לכל משימה; קבוצת נתונים גדולה יותר יכולה רק להקטין את שגיאת ההיטל.", "explanation": "החלקה מעריכה את $X(t_1)$ עם $t_1 < t_0$, ולכן היא משתמשת בכל מה שהיה למסנן בזמן $t_1$ ובנוסף בכל הנתונים שנאספו בין $t_1$ ל-$t_0$. כיוון שאומד ה-LMMSE הוא היטל, הגדלת תת-מרחב הנתונים יכולה רק להקטין (לעולם לא להגדיל) את השגיאה, ולכן $MSE_{החלקה} ≤ MSE_{סינון} ≤ MSE_{חיזוי}$ עבור אותו רגע מטרה. אינטרפולציה היא הגרסה הבדידה של החלקה: שחזור דגימה חסרה מדגימות משני צדדיה.", "whyWrong": ["ההפך הוא הנכון: סינון משתמש בנתונים עד ההווה בלבד, בעוד החלקה רשאית להסתכל על נתונים מאוחרים יותר.", "אינטרפולציה משחזרת ערך המוקף בנתונים, כלומר בתוך רשומת המדידות; רק חיזוי דורש $t_1 > t_0$.", "החלקה היא לא-סיבתית (היא משתמשת במדידות עתידיות); חיזוי הוא סיבתי במובן שהוא משתמש רק בנתוני עבר."]}}, {"id": "est-019", "area": "estimation", "topic": "least-squares-vs-lmmse", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["least-squares", "lmmse", "normal-equations"], "answer": 0, "en": {"q": "The deterministic least-squares fit solves $(A^TA)θ_e = A^Ty$. How does it relate to the LMMSE estimator, which solves $R_Ya = p$?", "options": ["LS uses data averages where LMMSE uses ensemble moments", "LS needs the prior mean and covariance of $θ$, exactly as LMMSE does", "LS minimises $E[(θ-θ_e)^2]$, while LMMSE minimises the residual sum of squares", "LS is always biased, whereas the LMMSE estimator is always unbiased"], "hint": "Compare $A^TA$ with $R_Y$ and $A^Ty$ with $p$: both pairs are the same objects, computed differently.", "explanation": "Both are normal equations obtained by projecting: LS projects the data vector $y$ onto the column space of $A$ using the Euclidean inner product, LMMSE projects the random variable $X$ onto the span of the data using $⟨U,V⟩ = E[UV]$. $A^TA$ and $A^Ty$ are sample (time-average) correlations, while $R_Y$ and $p$ are ensemble correlations. When the sample averages converge to the true moments — for instance for an ergodic process with a long record — the LS solution converges to the LMMSE one. LS itself needs no probabilistic model at all.", "whyWrong": ["LS is purely deterministic: it needs only $A$ and $y$, and uses no prior distribution for $θ$.", "The cost functions are swapped: LS minimises $||y-Aθ||^2$, LMMSE minimises the statistical mean-square error.", "LS is unbiased under the standard linear model with zero-mean noise; conversely the Bayesian LMMSE estimator is deliberately shrunk toward the prior mean and is biased for a given $θ$."]}, "he": {"q": "התאמת ריבועים פחותים דטרמיניסטית פותרת $(A^TA)θ_e = A^Ty$. כיצד היא קשורה לאומד ה-LMMSE, הפותר $R_Ya = p$?", "options": ["‏LS משתמש בממוצעי נתונים ו-LMMSE במומנטים על פני האנסמבל", "‏LS דורש את התוחלת והשונות המוקדמות של $θ$, בדיוק כמו LMMSE", "‏LS ממזער את $E[(θ-θ_e)^2]$, בעוד LMMSE ממזער את סכום ריבועי השאריות", "‏LS תמיד מוטה, בעוד אומד ה-LMMSE תמיד חסר הטיה"], "hint": "השווה $A^TA$ עם $R_Y$ ו-$A^Ty$ עם $p$: שני הזוגות הם אותם עצמים, המחושבים אחרת.", "explanation": "שניהם משוואות נורמל המתקבלות מהיטל: $LS$ מטיל את וקטור הנתונים $y$ על מרחב העמודות של $A$ עם המכפלה הפנימית האוקלידית, ו-LMMSE מטיל את המשתנה האקראי $X$ על המרחב הנפרש על ידי הנתונים עם $⟨U,V⟩ = E[UV]$. ‏$A^TA$ ו-$A^Ty$ הם קורלציות מדגמיות (ממוצעי זמן), בעוד $R_Y$ ו-$p$ הם קורלציות על פני האנסמבל. כאשר הממוצעים המדגמיים מתכנסים למומנטים האמיתיים — למשל בתהליך ארגודי עם רשומה ארוכה — פתרון ה-LS מתכנס לפתרון ה-LMMSE. ‏LS עצמו אינו זקוק למודל הסתברותי כלל.", "whyWrong": ["‏LS דטרמיניסטי לחלוטין: הוא זקוק רק ל-$A$ ול-$y$, ואינו משתמש בהתפלגות מוקדמת של $θ$.", "פונקציות המחיר הוחלפו: $LS$ ממזער את $||y-Aθ||^2$, ו-LMMSE ממזער שגיאה ריבועית ממוצעת סטטיסטית.", "‏LS חסר הטיה במודל הלינארי הסטנדרטי עם רעש בעל תוחלת אפס; להפך, אומד ה-LMMSE הבייסיאני מכווץ בכוונה לכיוון התוחלת המוקדמת ולכן מוטה עבור $θ$ נתון."]}}, {"id": "est-020", "area": "estimation", "topic": "bias-variance-decomposition", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["bias-variance", "mse", "computation"], "answer": 1, "en": {"q": "An estimator of $θ = 4$ satisfies $E[θ_e] = 3.5$ and $Var(θ_e) = 0.75$. Give its MSE, and the MSE of a modified estimator that is unbiased but has twice the variance.", "options": ["$MSE = 0.75$; unbiased version $1.5$", "$MSE = 1$; unbiased version $1.5$", "$MSE = 1.25$; unbiased version $1.5$", "$MSE = 1$; unbiased version $0.75$"], "hint": "$MSE = bias^2 + variance$ — the bias enters squared, so its sign is irrelevant.", "explanation": "The bias is $E[θ_e]-θ = 3.5-4 = -0.5$, so $bias^2 = 0.25$ and $MSE = 0.25+0.75 = 1$. The unbiased alternative has zero bias but variance $2·0.75 = 1.5$, hence $MSE = 1.5$. The biased estimator is therefore better in mean square: insisting on unbiasedness is not always the right objective, which is exactly the trade-off Bayesian shrinkage estimators exploit.", "whyWrong": ["$0.75$ is the variance alone; it equals the MSE only for an unbiased estimator.", "$1.25$ adds the bias itself ($0.5$) rather than its square ($0.25$); the decomposition is $bias^2 + var$.", "The unbiased version cannot have MSE $0.75$: with zero bias its MSE equals its variance, which was doubled to $1.5$."]}, "he": {"q": "אומד של $θ = 4$ מקיים $E[θ_e] = 3.5$ ו-$Var(θ_e) = 0.75$. מהו ה-MSE שלו, ומהו ה-MSE של אומד מתוקן שהוא חסר הטיה אך בעל שונות כפולה?", "options": ["‏$MSE = 0.75$; הגרסה חסרת ההטיה $1.5$", "‏$MSE = 1$; הגרסה חסרת ההטיה $1.5$", "‏$MSE = 1.25$; הגרסה חסרת ההטיה $1.5$", "‏$MSE = 1$; הגרסה חסרת ההטיה $0.75$"], "hint": "‏$MSE = bias^2 + variance$ — ההטיה נכנסת בריבוע, ולכן סימנה אינו משנה.", "explanation": "ההטיה היא $E[θ_e]-θ = 3.5-4 = -0.5$, ולכן $bias^2 = 0.25$ ו-$MSE = 0.25+0.75 = 1$. לחלופה חסרת ההטיה אין הטיה אך שונותה $2·0.75 = 1.5$, ומכאן $MSE = 1.5$. לכן האומד המוטה טוב יותר במובן הריבועי: התעקשות על חוסר הטיה אינה תמיד המטרה הנכונה, וזהו בדיוק ה-trade-off שאומדים בייסיאניים מכווצים מנצלים.", "whyWrong": ["‏$0.75$ היא השונות בלבד; היא שווה ל-MSE רק עבור אומד חסר הטיה.", "‏$1.25$ מחבר את ההטיה עצמה ($0.5$) במקום את ריבועה ($0.25$);
