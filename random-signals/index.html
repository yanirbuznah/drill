ת הזוג $S_X(f) = ∫R_X(τ)e^{-j2πfτ}dτ$ ואת ההתמרה ההפוכה, או את הגדרת הגבול השקולה.", "דורש סטציונריות במובן הרחב ורציפות של $R_X$ ב-$τ=0$.", "מציין ש-$R_X$ חייבת להיות חיובית למחצה, כלומר $S_X ≥ 0$ (בוכנר).", "מסביר שאינטגרביליות מוחלטת היא תנאי מספיק בלבד, ושאימפולסים מופיעים כאשר היא נכשלת.", "נותן את הזוג הקונקרטי $cos(2πf_0τ) ⇔ (1/2)[δ(f-f_0) + δ(f+f_0)]$."]}}, {"id": "psd-003", "area": "psd", "topic": "psd-properties", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["psd", "properties", "real-processes"], "answer": 1, "en": {"q": "$X(t)$ is a real WSS process. Which set of properties must its two-sided PSD $S_X(f)$ satisfy for every $f$?", "options": ["Real-valued, odd in $f$, non-negative", "Real-valued, even in $f$, non-negative", "Complex in general, even in $f$, non-negative", "Real-valued, even in $f$, may be negative"], "hint": "$R_X(τ)$ is real and even, so its Fourier transform inherits two of these; the third comes from the physical meaning of power.", "explanation": "For a real process $R_X(τ)$ is real and even, so $S_X(f) = ∫R_X(τ)cos(2πfτ)dτ$ is real and even. Non-negativity is forced by the interpretation of $S_X(f)df$ as the average power in a band: negative power in any band is impossible, which is Bochner's theorem in disguise.", "whyWrong": ["An odd $S_X$ would have to be negative somewhere, and it would also contradict the evenness of $R_X$ for a real process.", "The transform of a real even function is real; a complex $S_X$ can only arise for cross-spectra or complex processes.", "$S_X(f)$ can never be negative: $S_X(f)df$ is the average power in an infinitesimal band."]}, "he": {"q": "$X(t)$ הוא תהליך WSS ממשי. איזו קבוצת תכונות חייבת ה-PSD הדו-צדדית $S_X(f)$ לקיים עבור כל $f$?", "options": ["ממשית, אי-זוגית ב-$f$, אי-שלילית", "ממשית, זוגית ב-$f$, אי-שלילית", "מרוכבת באופן כללי, זוגית ב-$f$, אי-שלילית", "ממשית, זוגית ב-$f$, עשויה להיות שלילית"], "hint": "$R_X(τ)$ ממשית וזוגית, ולכן התמרת פורייה שלה יורשת שתיים מהתכונות; השלישית נובעת מהמשמעות הפיזיקלית של הספק.", "explanation": "עבור תהליך ממשי $R_X(τ)$ ממשית וזוגית, ולכן $S_X(f) = ∫R_X(τ)cos(2πfτ)dτ$ ממשית וזוגית. האי-שליליות נכפית מהפרשנות של $S_X(f)df$ כהספק ממוצע ברצועה: הספק שלילי ברצועה כלשהי אינו אפשרי, וזהו למעשה משפט בוכנר.", "whyWrong": ["$S_X$ אי-זוגית תהיה בהכרח שלילית באיזור כלשהו, וגם תסתור את הזוגיות של $R_X$ עבור תהליך ממשי.", "התמרה של פונקציה ממשית וזוגית היא ממשית; $S_X$ מרוכבת יכולה להתקבל רק בספקטרום צולב או בתהליכים מרוכבים.", "$S_X(f)$ לעולם אינה שלילית: $S_X(f)df$ הוא ההספק הממוצע ברצועה אינפיניטסימלית."]}}, {"id": "psd-004", "area": "psd", "topic": "total-power", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["total-power", "lorentzian", "integration"], "answer": 2, "en": {"q": "A zero-mean WSS process has $S_X(f) = 10/(25 + 4π²f²)$ W/Hz. What is its total average power $E[X^2(t)]$?", "options": ["$0.2$ W", "$0.4$ W", "$1$ W", "$2$ W"], "hint": "Compare with the standard pair $σ²e^{-α|τ|} ⇔ 2ασ²/(α² + 4π²f²)$, or substitute $u = 2πf$ and use $∫du/(α²+u²) = π/α$.", "explanation": "Matching $2ασ²/(α² + 4π²f²)$ gives $α = 5$ and $2ασ² = 10$, so $σ² = 1$. Directly: with $u = 2πf$, $df = du/2π$, the integral is $(1/2π)∫10/(25+u²)du = (1/2π)(10)(π/5) = 1$. So $E[X^2(t)] = R_X(0) = 1$ W.", "whyWrong": ["$0.2$ W is $10/(2·25)$, from mistakenly using $α²$ where $α$ belongs in $∫du/(α²+u²) = π/α$.", "$0.4$ W drops the factor $2$ in the numerator convention $2ασ²$ and then divides by $α$ again.", "$2$ W is the result of forgetting the $1/2π$ produced by the substitution $u = 2πf$ only partially, i.e. a spurious factor of $2$."]}, "he": {"q": "תהליך WSS בעל תוחלת אפס מקיים $S_X(f) = 10/(25 + 4π²f²)$ W/Hz. מהו ההספק הממוצע הכולל $E[X^2(t)]$?", "options": ["$0.2$ W", "$0.4$ W", "$1$ W", "$2$ W"], "hint": "השווה לזוג הסטנדרטי $σ²e^{-α|τ|} ⇔ 2ασ²/(α² + 4π²f²)$, או הצב $u = 2πf$ והשתמש ב-$∫du/(α²+u²) = π/α$.", "explanation": "השוואה ל-$2ασ²/(α² + 4π²f²)$ נותנת $α = 5$ ו-$2ασ² = 10$, ולכן $σ² = 1$. ישירות: עם $u = 2πf$, ‏$df = du/2π$, האינטגרל הוא $(1/2π)∫10/(25+u²)du = (1/2π)(10)(π/5) = 1$. לכן $E[X^2(t)] = R_X(0) = 1$ W.", "whyWrong": ["$0.2$ W הוא $10/(2·25)$, משימוש שגוי ב-$α²$ במקום ב-$α$ בנוסחה $∫du/(α²+u²) = π/α$.", "$0.4$ W מפיל את הפקטור $2$ במונה $2ασ²$ ואז מחלק שוב ב-$α$.", "$2$ W נובע מהתעלמות חלקית מהפקטור $1/2π$ שנוצר בהצבה $u = 2πf$, כלומר פקטור $2$ מיותר."]}}, {"id": "psd-005", "area": "psd", "topic": "dc-and-periodic-lines", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["impulses", "dc-component", "sinusoid"], "answer": 3, "en": {"q": "$X(t) = 3 + 4cos(200πt + Θ)$ with $Θ ~ U[0,2π)$. In the two-sided PSD $S_X(f)$, what is the weight (area) of the impulse located at $f = 100$ Hz?", "options": ["$16$", "$9$", "$8$", "$4$"], "hint": "First write $R_X(τ)$, then transform each term separately; a cosine of amplitude $A$ splits its power between $+f_0$ and $-f_0$.", "explanation": "$R_X(τ) = 9 + 8cos(200πτ)$, since $E[X] = 3$ contributes $9$ and the sinusoid contributes $A²/2 = 8$ times $cos(2π·100τ)$. Transforming: $S_X(f) = 9δ(f) + 4[δ(f-100) + δ(f+100)]$. Each sinusoidal line carries $A²/4 = 4$.", "whyWrong": ["$16$ is $A²$, the squared amplitude, which is twice the sinusoid's total power and four times one line.", "$9$ is the weight of the DC impulse at $f = 0$, not of the line at $100$ Hz.", "$8$ is $A²/2$, the sinusoid's total power, which is split equally between the lines at $+100$ and $-100$ Hz."]}, "he": {"q": "$X(t) = 3 + 4cos(200πt + Θ)$ כאשר $Θ ~ U[0,2π)$. ב-PSD הדו-צדדית $S_X(f)$, מהו המשקל (השטח) של האימפולס בתדר $f = 100$ Hz?", "options": ["$16$", "$9$", "$8$", "$4$"], "hint": "כתוב תחילה את $R_X(τ)$ ואז התמר כל איבר בנפרד; קוסינוס בעל אמפליטודה $A$ מחלק את הספקו בין $+f_0$ ל-$-f_0$.", "explanation": "$R_X(τ) = 9 + 8cos(200πτ)$, שכן $E[X] = 3$ תורם $9$ והסינוס תורם $A²/2 = 8$ כפול $cos(2π·100τ)$. לאחר התמרה: $S_X(f) = 9δ(f) + 4[δ(f-100) + δ(f+100)]$. כל קו ספקטרלי נושא $A²/4 = 4$.", "whyWrong": ["$16$ הוא $A²$, ריבוע האמפליטודה, שהוא פי שניים מהספק הסינוס ופי ארבעה מקו בודד.", "$9$ הוא משקל אימפולס ה-DC בתדר $f = 0$, ולא של הקו בתדר $100$ Hz.", "$8$ הוא $A²/2$, ההספק הכולל של הסינוס, המתחלק שווה בשווה בין הקווים ב-$+100$ וב-$-100$ Hz."]}}, {"id": "psd-006", "area": "psd", "topic": "white-noise", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["white-noise", "impulse-autocorrelation", "power"], "answer": 0, "en": {"q": "Ideal white noise has two-sided PSD $S_X(f) = N_0/2$ for all $f$. Which statement is correct?", "options": ["$R_X(τ) = (N_0/2)δ(τ)$ and the total average power is infinite", "$R_X(τ) = N_0 δ(τ)$ and the total average power equals $N_0$", "$R_X(τ) = (N_0/2)δ(τ)$ and the total average power is $N_0/2$", "$R_X(τ) = N_0/2$ for all $τ$ and the total average power is infinite"], "hint": "The inverse transform of a constant is an impulse; then ask what $∫S_X(f)df$ gives.", "explanation": "The inverse Fourier transform of the constant $N_0/2$ is $(N_0/2)δ(τ)$. The total power is $∫_{-∞}^{∞}(N_0/2)df = ∞$, so ideal white noise is a mathematical idealisation, not a physical process; real sources are band-limited.", "whyWrong": ["$N_0δ(τ)$ is the one-sided constant $N_0$ read as if it were two-sided, a factor-of-2 slip.", "$N_0/2$ is the PSD height, not a power; the power is the area under a constant over the whole line, which diverges.", "A constant $R_X(τ)$ describes a fully correlated process with a DC line, the exact opposite of white noise."]}, "he": {"q": "רעש לבן אידיאלי מקיים $S_X(f) = N_0/2$ לכל $f$ (PSD דו-צדדית). איזו טענה נכונה?", "options": ["$R_X(τ) = (N_0/2)δ(τ)$ וההספק הממוצע הכולל אינסופי", "$R_X(τ) = N_0 δ(τ)$ וההספק הממוצע הכולל שווה ל-$N_0$", "$R_X(τ) = (N_0/2)δ(τ)$ וההספק הממוצע הכולל הוא $N_0/2$", "$R_X(τ) = N_0/2$ לכל $τ$ וההספק הממוצע הכולל אינסופי"], "hint": "ההתמרה ההפוכה של קבוע היא אימפולס; לאחר מכן שאל מה נותן $∫S_X(f)df$.", "explanation": "ההתמרה ההפוכה של הקבוע $N_0/2$ היא $(N_0/2)δ(τ)$. ההספק הכולל הוא $∫_{-∞}^{∞}(N_0/2)df = ∞$, ולכן רעש לבן אידיאלי הוא אידיאליזציה מתמטית ולא תהליך פיזיקלי; מקורות אמיתיים חסומי סרט.", "whyWrong": ["$N_0δ(τ)$ נובע מקריאת הקבוע החד-צדדי $N_0$ כאילו היה דו-צדדי, שגיאת פקטור $2$.", "$N_0/2$ הוא גובה ה-PSD ולא הספק; ההספק הוא השטח מתחת לקבוע על כל הישר, והוא מתבדר.", "$R_X(τ)$ קבועה מתארת תהליך מתואם לחלוטין עם קו DC, ההפך הגמור מרעש לבן."]}}, {"id": "psd-007", "area": "psd", "topic": "bandlimited-white-noise", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["bandlimited", "sinc", "autocorrelation"], "answer": 1, "en": {"q": "Band-limited white noise has $S_X(f) = N_0/2$ for $|f| ≤ B$ and $0$ otherwise, with $B = 500$ Hz. What is the smallest lag $τ > 0$ at which $R_X(τ) = 0$?", "options": ["$0.5$ ms", "$1$ ms", "$2$ ms", "$4$ ms"], "hint": "Invert the rectangle: $R_X(τ) = N_0 B sinc(2Bτ)$ with $sinc(x) = sin(πx)/(πx)$, whose first zero is at $x = 1$.", "explanation": "$R_X(τ) = ∫_{-B}^{B}(N_0/2)e^{j2πfτ}df = (N_0/2)sin(2πBτ)/(πτ) = N_0 B sinc(2Bτ)$. The first zero occurs when $2Bτ = 1$, i.e. $τ = 1/(2B) = 1/1000 = 1$ ms. Note also $R_X(0) = N_0 B$, the finite total power.", "whyWrong": ["$0.5$ ms is $1/(4B)$, the half-lag where $sinc$ is still positive, not a zero.", "$2$ ms is $1/B$, obtained by dropping the factor $2$ inside $sinc(2Bτ)$; that is the second zero, not the first.", "$4$ ms is $2/B$, a further doubling of the same dropped-factor error."]}, "he": {"q": "רעש לבן חסום-סרט מקיים $S_X(f) = N_0/2$ עבור $|f| ≤ B$ ו-$0$ אחרת, עם $B = 500$ Hz. מהי ההשהיה הקטנה ביותר $τ > 0$ שבה $R_X(τ) = 0$?", "options": ["$0.5$ ms", "$1$ ms", "$2$ ms", "$4$ ms"], "hint": "התמר הפוך את המלבן: $R_X(τ) = N_0 B sinc(2Bτ)$ כאשר $sinc(x) = sin(πx)/(πx)$, שאפסה הראשון ב-$x = 1$.", "explanation": "$R_X(τ) = ∫_{-B}^{B}(N_0/2)e^{j2πfτ}df = (N_0/2)sin(2πBτ)/(πτ) = N_0 B sinc(2Bτ)$. האפס הראשון מתקבל כאשר $2Bτ = 1$, כלומר $τ = 1/(2B) = 1/1000 = 1$ ms. כמו כן $R_X(0) = N_0 B$, ההספק הכולל הסופי.", "whyWrong": ["$0.5$ ms הוא $1/(4B)$, השהיה שבה ה-$sinc$ עדיין חיובי ואינו מתאפס.", "$2$ ms הוא $1/B$, ומתקבל מהפלת הפקטור $2$ בתוך $sinc(2Bτ)$; זהו האפס השני ולא הראשון.", "$4$ ms הוא $2/B$, הכפלה נוספת של אותה שגיאת פקטור."]}}, {"id": "psd-008", "area": "psd", "topic": "sinusoid-random-phase", "difficulty": 3, "type": "open", "hardnessSource": "computation", "tags": ["sinusoid", "random-phase", "wss", "impulses"], "en": {"q": "Let $X(t) = A cos(2πf_0 t + Θ)$ with $A$ and $f_0$ deterministic constants and $Θ ~ U[0,2π)$. Show that $X(t)$ is WSS, derive $R_X(τ)$, and give $S_X(f)$ together with the total average power.", "hint": "Use $cos u · cos v = (1/2)[cos(u-v) + cos(u+v)]$ and note that $E[cos(φ + 2Θ)] = 0$ for any deterministic $φ$.", "modelAnswer": "Mean: $E[X(t)] = A E[cos(2πf_0t + Θ)] = (A/2π)∫_0^{2π}cos(2πf_0t + θ)dθ = 0$, independent of $t$. Correlation: $E[X(t+τ)X(t)] = A²E[cos(2πf_0(t+τ)+Θ)cos(2πf_0t+Θ)] = (A²/2)E[cos(2πf_0τ)] + (A²/2)E[cos(2πf_0(2t+τ) + 2Θ)]$. The second expectation vanishes because $Θ$ uniform on a full period makes $2Θ$ uniform over an integer number of periods, so $E[cos(φ+2Θ)] = 0$. Hence $R_X(τ) = (A²/2)cos(2πf_0τ)$, which depends on $τ$ only; with a constant zero mean the process is WSS. Transforming, $S_X(f) = (A²/4)[δ(f-f_0) + δ(f+f_0)]$. Total power $= ∫S_X(f)df = A²/4 + A²/4 = A²/2 = R_X(0)$, matching the familiar $A²/2$ for a sinusoid. Note the process is WSS but not ergodic in any distributional sense beyond the mean, since each realisation is a pure tone.", "rubric": ["Shows $E[X(t)] = 0$ by integrating the cosine over a full period of $Θ$.", "Applies the product-to-sum identity and argues the double-frequency term has zero expectation.", "Concludes $R_X(τ) = (A²/2)cos(2πf_0τ)$ and states that the $t$-independence plus constant mean gives WSS.", "Gives $S_X(f) = (A²/4)[δ(f-f_0) + δ(f+f_0)]$ with the correct $A²/4$ per line.", "Checks total power $∫S_X(f)df = A²/2 = R_X(0)$."]}, "he": {"q": "יהי $X(t) = A cos(2πf_0 t + Θ)$ כאשר $A$ ו-$f_0$ קבועים דטרמיניסטיים ו-$Θ ~ U[0,2π)$. הראה ש-$X(t)$ הוא WSS, גזור את $R_X(τ)$, ומצא את $S_X(f)$ ואת ההספק הממוצע הכולל.", "hint": "השתמש ב-$cos u · cos v = (1/2)[cos(u-v) + cos(u+v)]$ ושים לב ש-$E[cos(φ + 2Θ)] = 0$ עבור כל $φ$ דטרמיניסטי.", "modelAnswer": "תוחלת: $E[X(t)] = A E[cos(2πf_0t + Θ)] = (A/2π)∫_0^{2π}cos(2πf_0t + θ)dθ = 0$, בלתי תלויה ב-$t$. קורלציה: $E[X(t+τ)X(t)] = A²E[cos(2πf_0(t+τ)+Θ)cos(2πf_0t+Θ)] = (A²/2)E[cos(2πf_0τ)] + (A²/2)E[cos(2πf_0(2t+τ) + 2Θ)]$. התוחלת השנייה מתאפסת מכיוון ש-$Θ$ אחידה על מחזור שלם, ולכן $2Θ$ אחידה על מספר שלם של מחזורים ו-$E[cos(φ+2Θ)] = 0$. מכאן $R_X(τ) = (A²/2)cos(2πf_0τ)$, התלויה ב-$τ$ בלבד; יחד עם תוחלת קבועה התהליך הוא WSS. לאחר התמרה: $S_X(f) = (A²/4)[δ(f-f_0) + δ(f+f_0)]$. ההספק הכולל $= ∫S_X(f)df = A²/4 + A²/4 = A²/2 = R_X(0)$, בהתאם ל-$A²/2$ המוכר עבור סינוס. שים לב שהתהליך WSS אך אינו ארגודי מעבר לתוחלת, שכן כל מימוש הוא טון טהור.", "rubric": ["מראה ש-$E[X(t)] = 0$ באמצעות אינטגרציה של הקוסינוס על מחזור שלם של $Θ$.", "מפעיל את זהות המכפלה-לסכום ומנמק שלאיבר בתדר הכפול תוחלת אפס.", "מסיק $R_X(τ) = (A²/2)cos(2πf_0τ)$ ומציין שאי-התלות ב-$t$ יחד עם תוחלת קבועה נותנות WSS.", "נותן $S_X(f) = (A²/4)[δ(f-f_0) + δ(f+f_0)]$ עם $A²/4$ נכון לכל קו.", "מאמת שההספק הכולל $∫S_X(f)df = A²/2 = R_X(0)$."]}}, {"id": "psd-009", "area": "psd", "topic": "exponential-autocorrelation", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["fourier-pair", "exponential", "lorentzian"], "answer": 2, "en": {"q": "A WSS process has $R_X(τ) = 4e^{-2|τ|}$. Using $S_X(f) = ∫R_X(τ)e^{-j2πfτ}dτ$, what is $S_X(f)$?", "options": ["$8/(4 + 4π²f²)$", "$16/(2 + 4π²f²)$", "$16/(4 + 4π²f²)$", "$16/(4 + f²)$"], "hint": "Split the integral at $τ = 0$: $∫_0^{∞}e^{-(α+j2πf)τ}dτ + ∫_0^{∞}e^{-(α-j2πf)τ}dτ$ and add the two fractions.", "explanation": "The standard pair is $σ²e^{-α|τ|} ⇔ 2ασ²/(α² + 4π²f²)$. Here $σ² = 4$ and $α = 2$, so $S_X(f) = 2(2)(4)/(4 + 4π²f²) = 16/(4 + 4π²f²) = 4/(1 + π²f²)$. Check: $∫S_X(f)df = σ² = 4 = R_X(0)$.", "whyWrong": ["$8/(4 + 4π²f²)$ drops the factor $2$ in the numerator $2ασ²$, so its integral gives power $2$ instead of $4$.", "$16/(2 + 4π²f²)$ puts $α$ instead of $α²$ in the denominator, breaking the units and the power check.", "$16/(4 + f²)$ is the $ω$-convention answer $2ασ²/(α² + ω²)$ with $ω$ relabelled $f$, the classic $2π$ slip."]}, "he": {"q": "תהליך WSS מקיים $R_X(τ) = 4e^{-2|τ|}$. בעזרת $S_X(f) = ∫R_X(τ)e^{-j2πfτ}dτ$, מהי $S_X(f)$?", "options": ["$8/(4 + 4π²f²)$", "$16/(2 + 4π²f²)$", "$16/(4 + 4π²f²)$", "$16/(4 + f²)$"], "hint": "פצל את האינטגרל ב-$τ = 0$: ‏$∫_0^{∞}e^{-(α+j2πf)τ}dτ + ∫_0^{∞}e^{-(α-j2πf)τ}dτ$ וחבר את שתי השברים.", "explanation": "הזוג הסטנדרטי הוא $σ²e^{-α|τ|} ⇔ 2ασ²/(α² + 4π²f²)$. כאן $σ² = 4$ ו-$α = 2$, ולכן $S_X(f) = 2(2)(4)/(4 + 4π²f²) = 16/(4 + 4π²f²) = 4/(1 + π²f²)$. בדיקה: $∫S_X(f)df = σ² = 4 = R_X(0)$.", "whyWrong": ["$8/(4 + 4π²f²)$ מפיל את הפקטור $2$ במונה $2ασ²$, ולכן האינטגרל שלו נותן הספק $2$ במקום $4$.", "$16/(2 + 4π²f²)$ מציב $α$ במקום $α²$ במכנה, מה שהורס את הממדים ואת בדיקת ההספק.", "$16/(4 + f²)$ היא התשובה בקונבנציית $ω$, ‏$2ασ²/(α² + ω²)$, כאשר $ω$ הוחלף ב-$f$ — שגיאת ה-$2π$ הקלאסית."]}}, {"id": "psd-010", "area": "psd", "topic": "inverse-lorentzian", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["fourier-pair", "inverse-transform", "random-telegraph"], "answer": 3, "en": {"q": "The output of a random telegraph source has $S_X(f) = 12/(9 + 4π²f²)$. What is its autocorrelation $R_X(τ)$?", "options": ["$12e^{-3|τ|}$", "$2e^{-9|τ|}$", "$4e^{-3|τ|}$", "$2e^{-3|τ|}$"], "hint": "Match against $2ασ²/(α² + 4π²f²)$: the denominator fixes $α$, then the numerator fixes $σ²$ including the factor $2α$.", "explanation": "From $α² = 9$ we get $α = 3$. Then $2ασ² = 12$ gives $σ² = 12/6 = 2$, so $R_X(τ) = 2e^{-3|τ|}$. Sanity check: $R_X(0) = 2$ must equal $∫S_X(f)df = σ² = 2$, which it does.", "whyWrong": ["$12e^{-3|τ|}$ reads the numerator directly as $σ²$, ignoring the $2α$ factor, and gives six times too much power.", "$2e^{-9|τ|}$ takes the decay rate from $α²$ rather than $α$, so the correlation time is wrong by a factor of $3$.", "$4e^{-3|τ|}$ uses $σ² = 12/α = 4$, the classic dropped factor of $2$ in $2ασ²$."]}, "he": {"q": "מוצא של מקור טלגרף אקראי מקיים $S_X(f) = 12/(9 + 4π²f²)$. מהי פונקציית האוטוקורלציה $R_X(τ)$?", "options": ["$12e^{-3|τ|}$", "$2e^{-9|τ|}$", "$4e^{-3|τ|}$", "$2e^{-3|τ|}$"], "hint": "השווה ל-$2ασ²/(α² + 4π²f²)$: המכנה קובע את $α$, ואז המונה קובע את $σ²$ כולל הפקטור $2α$.", "explanation": "מ-$α² = 9$ נקבל $α = 3$. אז $2ασ² = 12$ נותן $σ² = 12/6 = 2$, ולכן $R_X(τ) = 2e^{-3|τ|}$. בדיקת שפיות: $R_X(0) = 2$ חייב להיות שווה ל-$∫S_X(f)df = σ² = 2$, וכך אכן.", "whyWrong": ["$12e^{-3|τ|}$ קורא את המונה ישירות כ-$σ²$, מתעלם מהפקטור $2α$, ונותן הספק גדול פי שישה.", "$2e^{-9|τ|}$ לוקח את קצב הדעיכה מ-$α²$ במקום מ-$α$, ולכן זמן הקורלציה שגוי בפקטור $3$.", "$4e^{-3|τ|}$ משתמש ב-$σ² = 12/α = 4$, כלומר הפלת הפקטור $2$ הקלאסית ב-$2ασ²$."]}}, {"id": "psd-011", "area": "psd", "topic": "omega-vs-f-convention", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["conventions", "2pi-factor", "parseval"], "answer": 0, "en": {"q": "A textbook defines $S_X(ω) = ∫R_X(τ)e^{-jωτ}dτ$. Which expression then recovers the average power $R_X(0)$?", "options": ["$R_X(0) = (1/2π)∫_{-∞}^{∞} S_X(ω) dω$", "$R_X(0) = ∫_{-∞}^{∞} S_X(ω) dω$", "$R_X(0) = 2π∫_{-∞}^{∞} S_X(ω) dω$", "$R_X(0) = (1/2π)∫_{0}^{∞} S_X(ω) dω$"], "hint": "In the $ω$ convention the $2π$ lives in the inverse transform; also ask whether the integral is over all $ω$ or only positive $ω$.", "explanation": "The inverse transform is $R_X(τ) = (1/2π)∫S_X(ω)e^{jωτ}dω$, so $R_X(0) = (1/2π)∫S_X(ω)dω$. The two conventions are linked by $S_X(ω) = S_X(f)|_{f = ω/2π}$, and the $1/2π$ is exactly the Jacobian $df = dω/2π$ that keeps the total power the same in both.", "whyWrong": ["Omitting the $1/2π$ is the $ω$-versus-$f$ trap and overstates the power by a factor of $2π$.", "Multiplying by $2π$ instead of dividing compounds the same error, giving a factor of $4π²$ too much.", "Integrating only over $ω > 0$ halves a two-sided spectrum; that would need the one-sided PSD, which is twice as large."]}, "he": {"q": "ספר לימוד מגדיר $S_X(ω) = ∫R_X(τ)e^{-jωτ}dτ$. איזה ביטוי משחזר אז את ההספק הממוצע $R_X(0)$?", "options": ["$R_X(0) = (1/2π)∫_{-∞}^{∞} S_X(ω) dω$", "$R_X(0) = ∫_{-∞}^{∞} S_X(ω) dω$", "$R_X(0) = 2π∫_{-∞}^{∞} S_X(ω) dω$", "$R_X(0) = (1/2π)∫_{0}^{∞} S_X(ω) dω$"], "hint": "בקונבנציית $ω$ ה-$2π$ יושב בהתמרה ההפוכה; שאל גם אם האינטגרציה היא על כל $ω$ או רק על $ω$ חיובי.", "explanation": "ההתמרה ההפוכה היא $R_X(τ) = (1/2π)∫S_X(ω)e^{jωτ}dω$, ולכן $R_X(0) = (1/2π)∫S_X(ω)dω$. שתי הקונבנציות קשורות ע\"י $S_X(ω) = S_X(f)|_{f = ω/2π}$, וה-$1/2π$ הוא בדיוק היעקוביאן $df = dω/2π$ ששומר על ההספק הכולל זהה בשתיהן.", "whyWrong": ["השמטת ה-$1/2π$ היא מלכודת $ω$ מול $f$, ומנפחת את ההספק בפקטור $2π$.", "הכפלה ב-$2π$ במקום חלוקה מחמירה את אותה שגיאה ונותנת פקטור $4π²$ עודף.", "אינטגרציה רק על $ω > 0$ חוצה ספקטרום דו-צדדי; לשם כך נדרשת ה-PSD החד-צדדית שגדולה פי שניים."]}}, {"id": "psd-012", "area": "psd", "topic": "one-sided-vs-two-sided", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["one-sided-psd", "factor-of-2", "noise-power"], "answer": 1, "en": {"q": "A noise source is specified by its one-sided PSD $G_X(f) = 4×10^{-9}$ V²/Hz. It drives an ideal filter that passes $0$ to $10$ kHz and blocks everything else. What is the output average power?", "options": ["$2×10^{-5}$ V²", "$4×10^{-5}$ V²", "$8×10^{-5}$ V²", "$4×10^{-9}$ V²"], "hint": "One-sided means all the power has already been folded onto $f ≥ 0$, so integrate $G_X$ over positive frequencies only.", "explanation": "By definition $G_X(f) = 2S_X(f)$ for $f ≥ 0$, so the two-sided height is $2×10^{-9}$ over $|f| ≤ 10^4$. Either way: $P = ∫_0^{10^4}G_X(f)df = 4×10^{-9}×10^4 = 4×10^{-5}$ V², or $P = 2×10^{-9}×2×10^4 = 4×10^{-5}$ V². The two computations must agree, which is the point of the factor of 2.", "whyWrong": ["$2×10^{-5}$ V² converts to the two-sided height and then still integrates over positive frequencies only, halving the answer.", "$8×10^{-5}$ V² doubles a one-sided density and then integrates over the two-sided band, applying the factor of 2 twice.", "$4×10^{-9}$ V² is the density itself; a power needs the density multiplied by a bandwidth."]}, "he": {"q": "מקור רעש מאופיין ע\"י ה-PSD החד-צדדית שלו $G_X(f) = 4×10^{-9}$ V²/Hz. הוא מזין מסנן אידיאלי המעביר $0$ עד $10$ kHz וחוסם את השאר. מהו ההספק הממוצע במוצא?", "options": ["$2×10^{-5}$ V²", "$4×10^{-5}$ V²", "$8×10^{-5}$ V²", "$4×10^{-9}$ V²"], "hint": "חד-צדדית פירושה שכל ההספק כבר קופל אל $f ≥ 0$, ולכן יש לאנטגרל את $G_X$ על תדרים חיוביים בלבד.", "explanation": "בהגדרה $G_X(f) = 2S_X(f)$ עבור $f ≥ 0$, ולכן הגובה הדו-צדדי הוא $2×10^{-9}$ על $|f| ≤ 10^4$. בשתי הדרכים: $P = ∫_0^{10^4}G_X(f)df = 4×10^{-9}×10^4 = 4×10^{-5}$ V², או $P = 2×10^{-9}×2×10^4 = 4×10^{-5}$ V². שני החישובים חייבים להסכים, וזו כל מהות פקטור ה-2.", "whyWrong": ["$2×10^{-5}$ V² ממיר לגובה הדו-צדדי ואז עדיין מאנטגרל על תדרים חיוביים בלבד, ומקטין את התוצאה בחצי.", "$8×10^{-5}$ V² מכפיל צפיפות חד-צדדית ואז מאנטגרל על הרצועה הדו-צדדית, כלומר מפעיל את פקטור ה-2 פעמיים.", "$4×10^{-9}$ V² היא הצפיפות עצמה; הספק מתקבל רק מהכפלת הצפיפות ברוחב סרט."]}}, {"id": "psd-013", "area": "psd", "topic": "cross-spectral-density", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["cross-spectrum", "conjugate-symmetry", "jointly-wss"], "answer": 2, "en": {"q": "$X(t)$ and $Y(t)$ are real and jointly WSS, with $S_{XY}(f)$ the Fourier transform of $R_{XY}(τ) = E[X(t+τ)Y(t)]$. Which relation always holds?", "options": ["$S_{XY}(f) = S_{YX}(f)$", "$S_{XY}(f)$ is real and non-negative for all $f$", "$S_{XY}(f) = S_{YX}^*(f)$", "$S_{XY}(f) = -S_{YX}(f)$"], "hint": "Start from $R_{YX}(τ) = R_{XY}(-τ)$ and remember that time reversal of a real function conjugates its transform.", "explanation": "$R_{YX}(τ) = R_{XY}(-τ)$, and for a real function reversal maps to conjugation in frequency, so $S_{YX}(f) = S_{XY}^*(f)$, i.e. $S_{XY}(f) = S_{YX}^*(f)$. Unlike an auto-spectrum, $S_{XY}(f)$ is complex in general; its phase carries the average lead or lag between the processes.", "whyWrong": ["Equality without conjugation would force $S_{XY}$ to be real, which is false whenever $R_{XY}$ is not even.", "$S_{XY}$ is generally complex, and even its real part may be negative; only auto-spectra are non-negative.", "A sign flip describes an odd relation; the correct symmetry is conjugation, which affects the phase and not the sign."]}, "he": {"q": "$X(t)$ ו-$Y(t)$ ממשיים וסטציונריים במשותף (jointly WSS), ו-$S_{XY}(f)$ היא התמרת פורייה של $R_{XY}(τ) = E[X(t+τ)Y(t)]$. איזה קשר מתקיים תמיד?", "options": ["$S_{XY}(f) = S_{YX}(f)$", "$S_{XY}(f)$ ממשית ואי-שלילית לכל $f$", "$S_{XY}(f) = S_{YX}^*(f)$", "$S_{XY}(f) = -S_{YX}(f)$"], "hint": "התחל מ-$R_{YX}(τ) = R_{XY}(-τ)$ וזכור שהיפוך זמן של פונקציה ממשית מצמיד את ההתמרה שלה.", "explanation": "$R_{YX}(τ) = R_{XY}(-τ)$, ועבור פונקציה ממשית היפוך מתורגם להצמדה בתדר, ולכן $S_{YX}(f) = S_{XY}^*(f)$, כלומר $S_{XY}(f) = S_{YX}^*(f)$. בניגוד לספקטרום עצמי, $S_{XY}(f)$ מרוכבת באופן כללי; הפאזה שלה נושאת את ההקדמה או הפיגור הממוצעים בין התהליכים.", "whyWrong": ["שוויון ללא הצמדה היה כופה ש-$S_{XY}$ ממשית, וזה שגוי בכל מקרה שבו $R_{XY}$ אינה זוגית.", "$S_{XY}$ מרוכבת בדרך כלל, ואפילו חלקה הממשי עשוי להיות שלילי; רק ספקטרום עצמי הוא אי-שלילי.", "היפוך סימן מתאר קשר אי-זוגי; הסימטריה הנכונה היא הצמדה, המשפיעה על הפאזה ולא על הסימן."]}}, {"id": "psd-014", "area": "psd", "topic": "coherence", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["coherence", "cross-spectrum", "normalisation"], "answer": 3, "en": {"q": "At frequency $f_0$ two jointly WSS processes satisfy $S_X(f_0) = 4$, $S_Y(f_0) = 9$ and $|S_{XY}(f_0)| = 3$ in consistent units. What is the magnitude-squared coherence $γ²_{XY}(f_0)$?", "options": ["$0.083$", "$0.5$", "$0.75$", "$0.25$"], "hint": "Coherence is the frequency-domain analogue of a squared correlation coefficient, so both numerator and denominator must be powers.", "explanation": "$γ²_{XY}(f) = |S_{XY}(f)|²/(S_X(f)S_Y(f)) = 3²/(4·9) = 9/36 = 0.25$. The Cauchy-Schwarz inequality guarantees $0 ≤ γ² ≤ 1$; $γ² = 1$ at a frequency means $Y$ is an exact linear filtering of $X$ at that frequency.", "whyWrong": ["$0.083$ is $|S_{XY}|/(S_XS_Y) = 3/36$, mixing an unsquared numerator with a product denominator.", "$0.5$ is $|S_{XY}|/√(S_XS_Y) = 3/6$, the coherence magnitude $γ$ rather than the magnitude-squared coherence.", "$0.75$ comes from dividing $9$ by $12$, i.e. squaring the numerator but not forming the full product $S_XS_Y$."]}, "he": {"q": "בתדר $f_0$ שני תהליכים סטציונריים במשותף מקיימים $S_X(f_0) = 4$, ‏$S_Y(f_0) = 9$ ו-$|S_{XY}(f_0)| = 3$ ביחידות עקביות. מהי הקוהרנטיות בריבוע $γ²_{XY}(f_0)$?", "options": ["$0.083$", "$0.5$", "$0.75$", "$0.25$"], "hint": "קוהרנטיות היא המקבילה במישור התדר למקדם מתאם בריבוע, ולכן גם המונה וגם המכנה חייבים להיות הספקים.", "explanation": "$γ²_{XY}(f) = |S_{XY}(f)|²/(S_X(f)S_Y(f)) = 3²/(4·9) = 9/36 = 0.25$. אי-שוויון קושי-שוורץ מבטיח $0 ≤ γ² ≤ 1$; ‏$γ² = 1$ בתדר מסוים פירושו ש-$Y$ הוא סינון לינארי מדויק של $X$ באותו תדר.", "whyWrong": ["$0.083$ הוא $|S_{XY}|/(S_XS_Y) = 3/36$, ערבוב של מונה לא מרובע עם מכנה שהוא מכפלה.", "$0.5$ הוא $|S_{XY}|/√(S_XS_Y) = 3/6$, כלומר גודל הקוהרנטיות $γ$ ולא הקוהרנטיות בריבוע.", "$0.75$ מתקבל מחלוקת $9$ ב-$12$, כלומר ריבוע המונה ללא בניית המכפלה המלאה $S_XS_Y$."]}}, {"id": "psd-015", "area": "psd", "topic": "psd-of-sum-uncorrelated", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["sum-of-processes", "uncorrelated", "superposition"], "answer": 0, "en": {"q": "$X(t)$ and $Y(t)$ are jointly WSS, zero-mean and uncorrelated, so $R_{XY}(τ) = 0$ for all $τ$. For $Z(t) = X(t) + Y(t)$, what is $S_Z(f)$?", "options": ["$S_X(f) + S_Y(f)$", "$S_X(f) · S_Y(f)$", "$(S_X(f) + S_Y(f))/2$", "$|√(S_X(f)) + √(S_Y(f))|²$"], "hint": "Expand $R_Z(τ) = E[(X+Y)(t+τ)(X+Y)(t)]$ into four terms and see which survive.", "explanation": "$R_Z(τ) = R_X(τ) + R_Y(τ) + R_{XY}(τ) + R_{YX}(τ) = R_X(τ) + R_Y(τ)$ when the cross-correlations vanish. Transforming term by term gives $S_Z(f) = S_X(f) + S_Y(f)$: uncorrelated zero-mean contributions add in power, not in amplitude.", "whyWrong": ["Multiplication would correspond to convolving the autocorrelations, which is what filtering does, not adding signals.", "Averaging the two spectra loses half the power and would not reduce correctly when one process is zero.", "Adding square roots means adding amplitudes coherently; that only applies to deterministic in-phase signals, not to uncorrelated noise."]}, "he": {"q": "$X(t)$ ו-$Y(t)$ סטציונריים במשותף, בעלי תוחלת אפס ובלתי מתואמים, כלומר $R_{XY}(τ) = 0$ לכל $τ$. עבור $Z(t) = X(t) + Y(t)$, מהי $S_Z(f)$?", "options": ["$S_X(f) + S_Y(f)$", "$S_X(f) · S_Y(f)$", "$(S_X(f) + S_Y(f))/2$", "$|√(S_X(f)) + √(S_Y(f))|²$"], "hint": "פתח את $R_Z(τ) = E[(X+Y)(t+τ)(X+Y)(t)]$ לארבעה איברים ובדוק אילו שורדים.", "explanation": "$R_Z(τ) = R_X(τ) + R_Y(τ) + R_{XY}(τ) + R_{YX}(τ) = R_X(τ) + R_Y(τ)$ כאשר הקורלציות הצולבות מתאפסות. התמרה איבר-איבר נותנת $S_Z(f) = S_X(f) + S_Y(f)$: תרומות בלתי מתואמות בעלות תוחלת אפס מתחברות בהספק ולא באמפליטודה.", "whyWrong": ["מכפלה מתאימה לקונבולוציה של פונקציות האוטוקורלציה, וזה מה שסינון עושה ולא חיבור אותות.", "מיצוע שני הספקטרומים מאבד מחצית מההספק ואינו מצטמצם נכון כאשר אחד התהליכים מתאפס.", "חיבור שורשים פירושו חיבור אמפליטודות בקוהרנטיות; זה תקף רק לאותות דטרמיניסטיים בפאזה, לא לרעש בלתי מתואם."]}}, {"id": "psd-016", "area": "psd", "topic": "psd-of-sum-correlated", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["sum-of-processes", "cross-term", "correlated"], "answer": 1, "en": {"q": "$X$ and $Y$ are jointly WSS and correlated. At $f_0$: $S_X(f_0) = 4$, $S_Y(f_0) = 9$ and $S_{XY}(f_0) = 2 + j$. For $Z = X + Y$, what is $S_Z(f_0)$?", "options": ["$13$", "$17$", "$15$", "$13 + 2j$"], "hint": "There are two cross terms, and they are conjugates of each other, so their sum is real.", "explanation": "$S_Z = S_X + S_Y + S_{XY} + S_{YX} = S_X + S_Y + 2Re(S_{XY})$ because $S_{YX}(f) = S_{XY}^*(f)$. Here $S_Z(f_0) = 4 + 9 + 2(2) = 17$. Note $S_Z$ comes out real and non-negative, as any auto-spectrum must.", "whyWrong": ["$13$ assumes PSDs simply add, which is only valid when the processes are uncorrelated.", "$15$ counts the cross term once instead of twice, forgetting that $S_{XY}$ and $S_{YX}$ both appear.", "$13 + 2j$ adds $S_{XY}$ alone and leaves an imaginary part, which an auto-spectrum can never have."]}, "he": {"q": "$X$ ו-$Y$ סטציונריים במשותף ומתואמים. בתדר $f_0$: ‏$S_X(f_0) = 4$, ‏$S_Y(f_0) = 9$ ו-$S_{XY}(f_0) = 2 + j$. עבור $Z = X + Y$, מהי $S_Z(f_0)$?", "options": ["$13$", "$17$", "$15$", "$13 + 2j$"], "hint": "יש שני איברים צולבים, והם צמודים זה לזה, ולכן סכומם ממשי.", "explanation": "$S_Z = S_X + S_Y + S_{XY} + S_{YX} = S_X + S_Y + 2Re(S_{XY})$ מכיוון ש-$S_{YX}(f) = S_{XY}^*(f)$. כאן $S_Z(f_0) = 4 + 9 + 2(2) = 17$. שים לב ש-$S_Z$ יוצאת ממשית ואי-שלילית, כנדרש מכל ספקטרום עצמי.", "whyWrong": ["$13$ מניח שצפיפויות ההספק פשוט מתחברות, וזה נכון רק כאשר התהליכים בלתי מתואמים.", "$15$ סופר את האיבר הצולב פעם אחת במקום פעמיים, ושוכח ש-$S_{XY}$ ו-$S_{YX}$ שניהם מופיעים.", "$13 + 2j$ מוסיף את $S_{XY}$ לבדו ומשאיר חלק מדומה, דבר שספקטרום עצמי לעולם אינו יכול להכיל."]}}, {"id": "psd-017", "area": "psd", "topic": "invalid-psd-negativity", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["validity", "non-negativity", "bochner"], "answer": 2, "en": {"q": "Which of the following functions cannot be the two-sided PSD of a real WSS process?", "options": ["$S(f) = e^{-f²}$", "$S(f) = 1/(1 + f⁴)$", "$S(f) = (1 - f²)/(1 + f⁴)$", "$S(f) = 2/(4 + f²)$"], "hint": "All four are real and even, so the discriminating test is the one property that is left.", "explanation": "A valid PSD must be real, even and non-negative for every $f$. The function $(1 - f²)/(1 + f⁴)$ is negative for all $|f| > 1$; at $f = 2$ it equals $-3/17$. Negative power in a band is impossible, so it is not a PSD. The other three are even, positive everywhere and integrable.", "whyWrong": ["$e^{-f²}$ is even, strictly positive and integrable; it pairs with a Gaussian autocorrelation.", "$1/(1 + f⁴)$ is even and positive everywhere, and it is a standard rational spectrum.", "$2/(4 + f²)$ is even and positive, the Lorentzian shape of an exponentially correlated process."]}, "he": {"q": "איזו מהפונקציות הבאות אינה יכולה להיות PSD דו-צדדית של תהליך WSS ממשי?", "options": ["$S(f) = e^{-f²}$", "$S(f) = 1/(1 + f⁴)$", "$S(f) = (1 - f²)/(1 + f⁴)$", "$S(f) = 2/(4 + f²)$"], "hint": "כל הארבע ממשיות וזוגיות, ולכן המבחן המבחין הוא התכונה היחידה שנותרה.", "explanation": "PSD תקפה חייבת להיות ממשית, זוגית ואי-שלילית לכל $f$. הפונקציה $(1 - f²)/(1 + f⁴)$ שלילית לכל $|f| > 1$; בתדר $f = 2$ ערכה $-3/17$. הספק שלילי ברצועה אינו אפשרי, ולכן אין זו PSD. שלוש האחרות זוגיות, חיוביות בכל מקום ואינטגרביליות.", "whyWrong": ["$e^{-f²}$ זוגית, חיובית ממש ואינטגרבילית; היא מזווגת עם אוטוקורלציה גאוסית.", "$1/(1 + f⁴)$ זוגית וחיובית בכל מקום, וזהו ספקטרום רציונלי סטנדרטי.", "$2/(4 + f²)$ זוגית וחיובית, צורת לורנץ של תהליך בעל קורלציה מעריכית."]}}, {"id": "psd-018", "area": "psd", "topic": "invalid-psd-symmetry", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["validity", "evenness", "real-processes"], "answer": 3, "en": {"q": "For a real WSS process, consider the candidate two-sided spectra $S(f) = 4e^{-2|f|}$ and $T(f) = 4e^{-2f}u(f)$, where $u(f)$ is the unit step. Which statement is true?", "options": ["Both are valid PSDs of real WSS processes", "Only $T$ is valid; $S$ is not integrable over the whole line", "Neither is valid, because a PSD must be a rational function of $f$", "Only $S$ is valid; $T$ is not an even function of $f$"], "hint": "Check integrability first, then the symmetry that a real-valued autocorrelation forces on the spectrum.", "explanation": "$S$ is real, even, non-negative and integrable ($∫S = 4$), so by Bochner it is a legitimate PSD; its inverse transform is $16/(4 + 4π²τ²)$, which is real, even and maximal at $τ = 0$. $T$ vanishes for $f < 0$, so $T(-f) ≠ T(f)$; its inverse transform is complex, which cannot be the autocorrelation of a real process.", "whyWrong": ["$T$ fails evenness, so the two cannot both be valid; only $S$ survives the test.", "$S$ is perfectly integrable: $∫4e^{-2|f|}df = 4$, a finite total power.", "Rationality is not required at all; Gaussian and exponential spectra are valid non-rational examples."]}, "he": {"q": "עבור תהליך WSS ממשי, נתונים המועמדים לספקטרום דו-צדדי $S(f) = 4e^{-2|f|}$ ו-$T(f) = 4e^{-2f}u(f)$, כאשר $u(f)$ היא פונקציית המדרגה. איזו טענה נכונה?", "options": ["שתיהן PSD תקפות של תהליכי WSS ממשיים", "רק $T$ תקפה; ‏$S$ אינה אינטגרבילית על כל הישר", "אף אחת אינה תקפה, כי PSD חייבת להיות פונקציה רציונלית של $f$", "רק $S$ תקפה; ‏$T$ אינה פונקציה זוגית של $f$"], "hint": "בדוק תחילה אינטגרביליות, ואחר כך את הסימטריה שאוטוקורלציה ממשית כופה על הספקטרום.", "explanation": "$S$ ממשית, זוגית, אי-שלילית ואינטגרבילית ($∫S = 4$), ולכן לפי בוכנר זוהי PSD לגיטימית; ההתמרה ההפוכה שלה היא $16/(4 + 4π²τ²)$, שהיא ממשית, זוגית ומקסימלית ב-$τ = 0$. ‏$T$ מתאפסת עבור $f < 0$, ולכן $T(-f) ≠ T(f)$; ההתמרה ההפוכה שלה מרוכבת, ואינה יכולה להיות אוטוקורלציה של תהליך ממשי.", "whyWrong": ["$T$ נכשלת בזוגיות, ולכן לא ייתכן ששתיהן תקפות; רק $S$ עוברת את המבחן.", "$S$ אינטגרבילית לחלוטין: $∫4e^{-2|f|}df = 4$, הספק כולל סופי.", "רציונליות אינה נדרשת כלל; ספקטרום גאוסי או מעריכי הם דוגמאות תקפות שאינן רציונליות."]}}, {"id": "psd-019", "area": "psd", "topic": "invalid-autocorrelation-max", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["validity", "autocorrelation", "maximum-at-zero"], "answer": 0, "en": {"q": "Which function cannot be the autocorrelation $R_X(τ)$ of a real WSS process?", "options": ["$R(τ) = τe^{-|τ|}$", "$R(τ) = e^{-|τ|}cos(2πτ)$", "$R(τ) = 4e^{-τ²}$", "$R(τ) = 1/(1 + τ²)$"], "hint": "Two necessary conditions are $R(-τ) = R(τ)$ and $|R(τ)| ≤ R(0)$; check them before doing any transform.", "explanation": "$τe^{-|τ|}$ is odd, so it violates the required evenness, and $R(0) = 0$ while $R(1) = e^{-1} > 0$, violating $|R(τ)| ≤ R(0)$. The others are even with a genuine maximum at $0$ and non-negative transforms: $e^{-|τ|}cos(2πτ)$ transforms to a sum of two shifted Lorentzians, $4e^{-τ²}$ to a Gaussian, and $1/(1+τ²)$ to $πe^{-2π|f|}$.", "whyWrong": ["$e^{-|τ|}cos(2πτ)$ is even, peaks at $τ = 0$, and its spectrum is a pair of positive Lorentzians centred at $±1$ Hz.", "$4e^{-τ²}$ is even with maximum $4$ at $τ = 0$ and a strictly positive Gaussian spectrum.", "$1/(1 + τ²)$ is even, maximal at $0$, and its transform $πe^{-2π|f|}$ is positive everywhere."]}, "he": {"q": "איזו פונקציה אינה יכולה להיות פונקציית האוטוקורלציה $R_X(τ)$ של תהליך WSS ממשי?", "options": ["$R(τ) = τe^{-|τ|}$", "$R(τ) = e^{-|τ|}cos(2πτ)$", "$R(τ) = 4e^{-τ²}$", "$R(τ) = 1/(1 + τ²)$"], "hint": "שני תנאים הכרחיים הם $R(-τ) = R(τ)$ ו-$|R(τ)| ≤ R(0)$; בדוק אותם לפני כל התמרה.", "explanation": "$τe^{-|τ|}$ אי-זוגית ולכן מפרה את דרישת הזוגיות, וגם $R(0) = 0$ בעוד $R(1) = e^{-1} > 0$, בסתירה ל-$|R(τ)| ≤ R(0)$. האחרות זוגיות עם מקסימום אמיתי ב-$0$ והתמרות אי-שליליות: $e^{-|τ|}cos(2πτ)$ מותמרת לסכום שתי לורנציאניות מוזזות, $4e^{-τ²}$ לגאוסיאן, ו-$1/(1+τ²)$ ל-$πe^{-2π|f|}$.", "whyWrong": ["$e^{-|τ|}cos(2πτ)$ זוגית, מקסימלית ב-$τ = 0$, והספקטרום שלה הוא זוג לורנציאניות חיוביות סביב $±1$ Hz.", "$4e^{-τ²}$ זוגית עם מקסימום $4$ ב-$τ = 0$ וספקטרום גאוסי חיובי ממש.", "$1/(1 + τ²)$ זוגית, מקסימלית ב-$0$, וההתמרה שלה $πe^{-2π|f|}$ חיובית בכל מקום."]}}, {"id": "psd-020", "area": "psd", "topic": "positive-semidefiniteness", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["validity", "positive-semidefinite", "bochner"], "en": {"q": "Explain why $R(τ) = 1$ for $|τ| ≤ 1$ and $R(τ) = 0$ otherwise cannot be the autocorrelation of a WSS process, even though it is real, even and maximal at $τ = 0$.", "hint": "Evenness and a maximum at the origin are necessary but not sufficient; compute the spectrum this $R$ would imply.", "modelAnswer": "By Wiener-Khinchin the candidate spectrum is $S(f) = ∫_{-1}^{1}e^{-j2πfτ}dτ = sin(2πf)/(πf)$, i.e. $2sinc(2f)$. This function is negative on whole intervals: at $f = 0.75$, $sin(1.5π) = -1$, so $S(0.75) = -1/(0.75π) ≈ -0.42 < 0$. A PSD may never be negative, since $S(f)df$ is the average power in a band, so $R$ is not a valid autocorrelation. Equivalently, $R$ fails to be positive semi-definite: by Bochner's theorem a function is an autocorrelation exactly when it is positive semi-definite, which is equivalent to a non-negative spectral measure. One can exhibit the failure directly: for a valid $R$ the quantity $Var(Σ_k a_k X(t_k)) = Σ_j Σ_k a_j a_k R(t_j - t_k)$ must be non-negative for every choice of coefficients and times, but with this $R$ one can pick sample times spaced just over the correlation width and alternating signs so that the double sum is negative, implying a negative variance. So the necessary conditions of evenness and $|R(τ)| ≤ R(0)$ are far from sufficient.", "rubric": ["Computes the transform $S(f) = sin(2πf)/(πf) = 2sinc(2f)$.", "Exhibits a frequency where $S(f) < 0$, for example $f = 0.75$.", "States that a PSD must be non-negative because $S(f)df$ is power in a band.", "Names positive semi-definiteness (Bochner) as the real criterion, of which evenness and $|R(τ)| ≤ R(0)$ are only consequences.", "Connects the failure to a negative variance of a finite linear combination $Σ a_k X(t_k)$."]}, "he": {"q": "הסבר מדוע $R(τ) = 1$ עבור $|τ| ≤ 1$ ו-$R(τ) = 0$ אחרת אינה יכולה להיות פונקציית האוטוקורלציה של תהליך WSS, אף שהיא ממשית, זוגית ומקסימלית ב-$τ = 0$.", "hint": "זוגיות ומקסימום בראשית הם תנאים הכרחיים אך לא מספיקים; חשב את הספקטרום ש-$R$ זו הייתה מחייבת.", "modelAnswer": "לפי וינר-חינצ'ין הספקטרום המועמד הוא $S(f) = ∫_{-1}^{1}e^{-j2πfτ}dτ = sin(2πf)/(πf)$, כלומר $2sinc(2f)$. פונקציה זו שלילית בקטעים שלמים: בתדר $f = 0.75$ מתקיים $sin(1.5π) = -1$, ולכן $S(0.75) = -1/(0.75π) ≈ -0.42 < 0$. PSD אינה יכולה להיות שלילית, שכן $S(f)df$ הוא ההספק הממוצע ברצועה, ולכן $R$ אינה אוטוקורלציה תקפה. באופן שקול, $R$ אינה חיובית למחצה: לפי משפט בוכנר פונקציה היא אוטוקורלציה בדיוק כאשר היא חיובית למחצה בהגדרה, וזה שקול למידה ספקטרלית אי-שלילית. אפשר להדגים את הכישלון ישירות: עבור $R$ תקפה הגודל $Var(Σ_k a_k X(t_k)) = Σ_j Σ_k a_j a_k R(t_j - t_k)$ חייב להיות אי-שלילי לכל בחירת מקדמים וזמנים, אך עם $R$ זו ניתן לבחור זמני דגימה במרווח מעט גדול מרוחב הקורלציה ובסימנים מתחלפים כך שהסכום הכפול יוצא שלילי, כלומר שונות שלילית. לכן התנאים ההכרחיים של זוגיות ו-$|R(τ)| ≤ R(0)$ רחוקים מלהספיק.", "rubric": ["מחשב את ההתמרה $S(f) = sin(2πf)/(πf) = 2sinc(2f)$.", "מציג תדר שבו $S(f) < 0$, לדוגמה $f = 0.75$.", "מציין ש-PSD חייבת להיות אי-שלילית משום ש-$S(f)df$ הוא הספק ברצועה.", "נוקב בחיוביות-למחצה (בוכנר) כקריטריון האמיתי, שממנו נובעות זוגיות ו-$|R(τ)| ≤ R(0)$.", "מקשר את הכישלון לשונות שלילית של צירוף לינארי סופי $Σ a_k X(t_k)$."]}}, {"id": "psd-021", "area": "psd", "topic": "rms-bandwidth", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["bandwidth", "rms-bandwidth", "moments"], "answer": 1, "en": {"q": "A process has $S_X(f) = S_0$ for $|f| ≤ B$ and $0$ elsewhere. Its RMS bandwidth is defined by $B_{rms}² = ∫f²S_X(f)df / ∫S_X(f)df$, both integrals over all $f$. What is $B_{rms}$?", "options": ["$B/3$", "$B/√3$", "$B/√2$", "$B$"], "hint": "This is the standard deviation of a uniform distribution on $[-B, B]$, since the normalised PSD is exactly that density.", "explanation": "Numerator: $S_0∫_{-B}^{B}f²df = 2S_0B³/3$. Denominator: $2S_0B$. So $B_{rms}² = B²/3$ and $B_{rms} = B/√3 ≈ 0.577B$. This is the second moment of the normalised spectrum, so it is always smaller than the edge frequency $B$.", "whyWrong": ["$B/3$ forgets to take the square root after computing $B_{rms}² = B²/3$.", "$B/√2$ is the RMS of a uniform density on $[0, B]$ mis-normalised, not the two-sided second moment.", "$B$ is the edge of the band, not an RMS value; the second moment is always strictly less for a spread-out spectrum."]}, "he": {"q": "תהליך מקיים $S_X(f) = S_0$ עבור $|f| ≤ B$ ו-$0$ אחרת. רוחב הסרט ה-RMS מוגדר ע\"י $B_{rms}² = ∫f²S_X(f)df / ∫S_X(f)df$, כששני האינטגרלים על כל $f$. מהו $B_{rms}$?", "options": ["$B/3$", "$B/√3$", "$B/√2$", "$B$"], "hint": "זוהי סטיית התקן של התפלגות אחידה על $[-B, B]$, שכן ה-PSD המנורמלת היא בדיוק צפיפות זו.", "explanation": "מונה: $S_0∫_{-B}^{B}f²df = 2S_0B³/3$. מכנה: $2S_0B$. לכן $B_{rms}² = B²/3$ ו-$B_{rms} = B/√3 ≈ 0.577B$. זהו המומנט השני של הספקטרום המנורמל, ולכן הוא תמיד קטן מתדר הקצה $B$.", "whyWrong": ["$B/3$ שוכח להוציא שורש לאחר חישוב $B_{rms}² = B²/3$.", "$B/√2$ הוא ערך RMS של צפיפות אחידה על $[0, B]$ בנרמול שגוי, ולא המומנט השני הדו-צדדי.", "$B$ הוא קצה הרצועה ולא ערך RMS; המומנט השני תמיד קטן ממנו ממש עבור ספקטרום פרוש."]}}, {"id": "psd-022", "area": "psd", "topic": "noise-equivalent-bandwidth", "difficulty": 4, "type": "mcq", "hardnessSource": "computation", "tags": ["bandwidth", "noise-equivalent", "3db"], "answer": 2, "en": {"q": "White noise passes through a filter with $|H(f)|² = 1/(1 + (f/f_c)²)$. Using $B_N = ∫_0^{∞}|H(f)|²df / |H(0)|²$, what is the noise-equivalent bandwidth, and how does it compare with the $3$ dB bandwidth?", "options": ["$B_N = f_c$, equal to the $3$ dB bandwidth", "$B_N = (π/4)f_c$, smaller than the $3$ dB bandwidth", "$B_N = (π/2)f_c$, larger than the $3$ dB bandwidth", "$B_N = 2f_c$, larger than the $3$ dB bandwidth"], "hint": "Substitute $u = f/f_c$ and use $∫_0^{∞}du/(1 + u²) = π/2$; then find where $|H|²$ drops to one half.", "explanation": "$B_N = f_c∫_0^{∞}du/(1 + u²) = (π/2)f_c ≈ 1.571f_c$, while $|H(f)|² = 1/2$ at $f = f_c$, so the $3$ dB bandwidth is exactly $f_c$. The gentle tail of the single-pole response contributes extra noise power, so $B_N$ exceeds the $3$ dB bandwidth by the factor $π/2$.", "whyWrong": ["$B_N = f_c$ equates the two bandwidths, ignoring the noise power collected beyond the $3$ dB point.", "$(π/4)f_c$ halves the correct integral, as if $∫_0^{∞}du/(1+u²)$ were $π/4$ rather than $π/2$.", "$2f_c$ is a rough rule of thumb with no derivation; the exact single-pole result is the factor $π/2$."]}, "he": {"q": "רעש לבן עובר דרך מסנן עם $|H(f)|² = 1/(1 + (f/f_c)²)$. בעזרת $B_N = ∫_0^{∞}|H(f)|²df / |H(0)|²$, מהו רוחב הסרט שקול-הרעש, וכיצד הוא משתווה לרוחב הסרט ב-$3$ dB?", "options": ["$B_N = f_c$, שווה לרוחב הסרט ב-$3$ dB", "$B_N = (π/4)f_c$, קטן מרוחב הסרט ב-$3$ dB", "$B_N = (π/2)f_c$, גדול מרוחב הסרט ב-$3$ dB", "$B_N = 2f_c$, גדול מרוחב הסרט ב-$3$ dB"], "hint": "הצב $u = f/f_c$ והשתמש ב-$∫_0^{∞}du/(1 + u²) = π/2$; לאחר מכן מצא היכן $|H|²$ יורד למחצית.", "explanation": "$B_N = f_c∫_0^{∞}du/(1 + u²) = (π/2)f_c ≈ 1.571f_c$, בעוד $|H(f)|² = 1/2$ בתדר $f = f_c$, ולכן רוחב הסרט ב-$3$ dB הוא בדיוק $f_c$. הזנב המתון של תגובת הקוטב היחיד תורם הספק רעש נוסף, ולכן $B_N$ גדול מרוחב ה-$3$ dB בפקטור $π/2$.", "whyWrong": ["$B_N = f_c$ משווה בין שני רוחבי הסרט ומתעלם מהספק הרעש הנאסף מעבר לנקודת ה-$3$ dB.", "$(π/4)f_c$ מקטין בחצי את האינטגרל הנכון, כאילו $∫_0^{∞}du/(1+u²)$ שווה $π/4$ ולא $π/2$.", "$2f_c$ הוא כלל אצבע גס ללא גזירה; התוצאה המדויקת לקוטב יחיד היא הפקטור $π/2$."]}}, {"id": "psd-023", "area": "psd", "topic": "differentiator-output-power", "difficulty": 4, "type": "mcq", "hardnessSource": "computation", "tags": ["differentiator", "lti-filtering", "output-power"], "answer": 3, "en": {"q": "$X(t)$ is WSS with $S_X(f) = 1$ W/Hz for $|f| ≤ 3$ Hz and $0$ elsewhere. Let $Y(t) = dX(t)/dt$. What is $E[Y^2(t)]$?", "options": ["$18$", "$36π²$", "$144π²$", "$72π²$"], "hint": "Differentiation is an LTI filter with $H(f) = j2πf$, so the spectrum is multiplied by $|H(f)|²$, not by $H(f)$.", "explanation": "$S_Y(f) = |j2πf|²S_X(f) = 4π²f²$ on $|f| ≤ 3$. Then $E[Y^2] = ∫_{-3}^{3}4π²f²df = 4π²[f³/3]_{-3}^{3} = 4π²(9 + 9) = 72π² ≈ 710.6$. Equivalently $E[Y^2] = -R_X''(0)$, which is finite here because the band is limited.", "whyWrong": ["$18$ is $∫_{-3}^{3}f²df$, the result of forgetting the $4π²$ that comes from $|H(f)|² = |j2πf|²$.", "$36π²$ integrates only over $0 ≤ f ≤ 3$, treating a two-sided PSD as if it were one-sided.", "$144π²$ doubles the correct answer, applying the one-sided correction on top of an already two-sided integral."]}, "he": {"q": "$X(t)$ הוא WSS עם $S_X(f) = 1$ W/Hz עבור $|f| ≤ 3$ Hz ו-$0$ אחרת. יהי $Y(t) = dX(t)/dt$. מהו $E[Y^2(t)]$?", "options": ["$18$", "$36π²$", "$144π²$", "$72π²$"], "hint": "גזירה היא מסנן LTI עם $H(f) = j2πf$, ולכן הספקטרום מוכפל ב-$|H(f)|²$ ולא ב-$H(f)$.", "explanation": "$S_Y(f) = |j2πf|²S_X(f) = 4π²f²$ על $|f| ≤ 3$. לכן $E[Y^2] = ∫_{-3}^{3}4π²f²df = 4π²[f³/3]_{-3}^{3} = 4π²(9 + 9) = 72π² ≈ 710.6$. באופן שקול $E[Y^2] = -R_X''(0)$, שסופי כאן משום שהסרט חסום.", "whyWrong": ["$18$ הוא $∫_{-3}^{3}f²df$, תוצאה של שכחת ה-$4π²$ הנובע מ-$|H(f)|² = |j2πf|²$.", "$36π²$ מאנטגרל רק על $0 ≤ f ≤ 3$, ומתייחס ל-PSD דו-צדדית כאילו הייתה חד-צדדית.", "$144π²$ מכפיל פי שניים את התשובה הנכונה, ומחיל תיקון חד-צדדי על אינטגרל שכבר דו-צדדי."]}}, {"id": "psd-024", "area": "psd", "topic": "spectral-factorisation", "difficulty": 4, "type": "open", "hardnessSource": "concept", "tags": ["spectral-factorisation", "minimum-phase", "innovations"], "en": {"q": "The PSD $S_X(f) = 16/(16 + 4π²f²)$ is to be written as $S_X(f) = |H(f)|²$ where $H$ is causal, stable and minimum-phase. Find such an $H(f)$ and state the general conditions on $S_X$ under which this factorisation is possible.", "hint": "Write $4π²f² = -(j2πf)²$, set $s = j2πf$, factor the denominator over $s$, and keep the left-half-plane root.", "modelAnswer": "Put $s = j2πf$, so $4π²f² = -s²$ and $S_X = 16/(16 - s²) = 16/((4 + s)(4 - s))$. Assign the factor with the left-half-plane pole to $H$: $H(s) = 4/(s + 4)$, i.e. $H(f) = 4/(4 + j2πf)$. This is causal and stable (pole at $s = -4$) and minimum-phase (no right-half-plane zeros), and $|H(f)|² = 16/(16 + 4π²f²) = S_X(f)$ as required. Interpretation: $X$ can be generated by driving $H$ with unit-height white noise, which is the innovations representation. General conditions: $S_X$ must be real, even and non-negative (so it is a legitimate PSD); it must be integrable, i.e. finite average power; and it must satisfy the Paley-Wiener condition $∫|ln S_X(f)|/(1 + 4π²f²)df < ∞$, which excludes spectra that vanish on an interval, such as an ideal band-limited spectrum. For rational $S_X$ these conditions reduce to: poles and zeros occur in quadruples symmetric about both axes, none on the imaginary axis, and $H$ takes the left-half-plane poles and zeros while $H^*(-s)$ takes the rest. The factorisation is unique up to an all-pass factor, and the minimum-phase choice fixes it up to a sign.", "rubric": ["Substitutes $s = j2πf$ and factors the denominator as $(4 + s)(4 - s)$.", "Selects the left-half-plane pole to obtain $H(f) = 4/(4 + j2πf)$ and verifies $|H(f)|² = S_X(f)$.", "States that $S_X$ must be real, even, non-negative and integrable.", "Cites the Paley-Wiener condition $∫|ln S_X(f)|/(1 + 4π²f²)df < ∞$ for a causal factor to exist.", "Notes uniqueness only up to an all-pass factor, resolved by requiring minimum phase, and mentions the white-noise/innovations interpretation."]}, "he": {"q": "יש לכתוב את ה-PSD ‏$S_X(f) = 16/(16 + 4π²f²)$ בצורה $S_X(f) = |H(f)|²$ כאשר $H$ סיבתי, יציב ובעל פאזה מינימלית. מצא $H(f)$ כזה ונסח את התנאים הכלליים על $S_X$ שתחתם פירוק כזה אפשרי.", "hint": "כתוב $4π²f² = -(j2πf)²$, הצב $s = j2πf$, פרק את המכנה לפי $s$, ושמור את השורש שבחצי המישור השמאלי.", "modelAnswer": "נציב $s = j2πf$, ואז $4π²f² = -s²$ ולכן $S_X = 16/(16 - s²) = 16/((4 + s)(4 - s))$. נשייך ל-$H$ את הגורם עם הקוטב בחצי המישור השמאלי: $H(s) = 4/(s + 4)$, כלומר $H(f) = 4/(4 + j2πf)$. זהו מסנן סיבתי ויציב (קוטב ב-$s = -4$) ובעל פאזה מינימלית (אין אפסים בחצי המישור הימני), ומתקיים $|H(f)|² = 16/(16 + 4π²f²) = S_X(f)$ כנדרש. פרשנות: אפשר לייצר את $X$ ע\"י הזנת $H$ ברעש לבן בגובה יחידה, וזהו ייצוג החידושים (innovations). התנאים הכלליים: $S_X$ חייבת להיות ממשית, זוגית ואי-שלילית (כלומר PSD לגיטימית); היא חייבת להיות אינטגרבילית, כלומר הספק ממוצע סופי; ועליה לקיים את תנאי פיילי-וינר $∫|ln S_X(f)|/(1 + 4π²f²)df < ∞$, הפוסל ספקטרומים המתאפסים על קטע שלם, כמו ספקטרום חסום-סרט אידיאלי. עבור $S_X$ רציונלית התנאים מצטמצמים ל: קטבים ואפסים מופיעים ברביעיות סימטריות סביב שני הצירים, אף אחד מהם אינו על הציר המדומה, ו-$H$ לוקח את קטבי ואפסי חצי המישור השמאלי בעוד $H^*(-s)$ לוקח את השאר. הפירוק יחיד עד כדי גורם כל-מעביר, ובחירת הפאזה המינימלית קובעת אותו עד כדי סימן.", "rubric": ["מציב $s = j2πf$ ומפרק את המכנה ל-$(4 + s)(4 - s)$.", "בוחר את הקוטב בחצי המישור השמאלי ומקבל $H(f) = 4/(4 + j2πf)$, ומאמת $|H(f)|² = S_X(f)$.", "מציין ש-$S_X$ חייבת להיות ממשית, זוגית, אי-שלילית ואינטגרבילית.", "מצטט את תנאי פיילי-וינר $∫|ln S_X(f)|/(1 + 4π²f²)df < ∞$ לקיום גורם סיבתי.", "מציין יחידות רק עד כדי גורם כל-מעביר, הנפתרת ע\"י דרישת פאזה מינימלית, ומזכיר את פרשנות רעש לבן/חידושים."]}}, {"id": "lti-001", "area": "lti", "topic": "output-mean", "difficulty": 1, "type": "mcq", "hardnessSource": "recall", "tags": ["lti", "output-mean", "dc-gain"], "answer": 0, "en": {"q": "A WSS process $X(t)$ with mean $μ_X$ drives a stable LTI filter with impulse response $h(t)$ and frequency response $H(f)$. What is the mean of the output $Y(t)$?", "options": ["$μ_Y = μ_X H(0)$", "$μ_Y = μ_X |H(0)|^2$", "$μ_Y = μ_X h(0)$", "$μ_Y = μ_X ∫_{-∞}^{∞} |H(f)|^2 df$"], "hint": "Push the expectation through the convolution integral: a constant sees only the total area of $h$.", "explanation": "$E[Y(t)] = E[∫h(λ)X(t-λ)dλ] = ∫h(λ)μ_X dλ = μ_X ∫h(λ)dλ$. Since $H(f) = ∫h(λ)e^{-j2πfλ}dλ$, the area of $h$ is exactly $H(0)$, the DC gain. So $μ_Y = μ_X H(0)$, and the mean is constant in $t$.", "whyWrong": ["$|H(0)|^2$ is a power gain; it belongs in the PSD relation $S_Y = |H|^2 S_X$, not in the first-moment relation, which is linear in $H$.", "$h(0)$ is one sample of the impulse response, not its integral; the mean responds to the total area of $h$, not to its value at the origin.", "$∫|H(f)|^2 df$ is the energy of $h$ (Parseval); it multiplies power, and using it here gives the wrong units entirely."]}, "he": {"q": "תהליך WSS ‏$X(t)$ בעל תוחלת $μ_X$ מוזן למסנן LTI יציב עם תגובת הלם $h(t)$ ותגובת תדר $H(f)$. מהי התוחלת של המוצא $Y(t)$?", "options": ["$μ_Y = μ_X H(0)$", "$μ_Y = μ_X |H(0)|^2$", "$μ_Y = μ_X h(0)$", "$μ_Y = μ_X ∫_{-∞}^{∞} |H(f)|^2 df$"], "hint": "הכנס את התוחלת אל תוך אינטגרל הקונבולוציה: קבוע רואה רק את השטח הכולל של $h$.", "explanation": "$E[Y(t)] = E[∫h(λ)X(t-λ)dλ] = ∫h(λ)μ_X dλ = μ_X ∫h(λ)dλ$. מכיוון ש-$H(f) = ∫h(λ)e^{-j2πfλ}dλ$, השטח של $h$ הוא בדיוק $H(0)$, הגבר ה-DC. לכן $μ_Y = μ_X H(0)$, והתוחלת קבועה ב-$t$.", "whyWrong": ["$|H(0)|^2$ הוא הגבר הספק; מקומו ביחס ה-PSD ‏$S_Y = |H|^2 S_X$, ולא ביחס למומנט הראשון, שהוא לינארי ב-$H$.", "$h(0)$ הוא ערך בודד של תגובת ההלם ולא האינטגרל שלה; התוחלת מגיבה לשטח הכולל של $h$ ולא לערכה בראשית.", "$∫|H(f)|^2 df$ הוא האנרגיה של $h$ (פרסבל); הוא מכפיל הספק, ושימוש בו כאן נותן יחידות שגויות לחלוטין."]}}, {"id": "lti-002", "area": "lti", "topic": "output-mean-computation", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["lti", "output-mean", "rectangular-filter"], "answer": 1, "en": {"q": "$X(t)$ is WSS with $μ_X = 5$. It passes through an LTI filter whose impulse response is $h(t) = 2$ for $0 ≤ t ≤ 3$ and $0$ otherwise. What is $μ_Y$?", "options": ["$6$", "$30$", "$10$", "$180$"], "hint": "Only the area under $h(t)$ matters, and the area of a rectangle is height times width.", "explanation": "$H(0) = ∫_0^3 2 dt = 6$. Then $μ_Y = μ_X H(0) = 5·6 = 30$. Note that the shape of $h$ is irrelevant to the mean; only its total area, the DC gain, enters.", "whyWrong": ["$6$ is $H(0)$ alone: the DC gain was computed correctly but never multiplied by the input mean $μ_X = 5$.", "$10$ uses the height $h = 2$ as the gain, forgetting that the filter integrates the input over a window of length $3$.", "$180 = 5·6^2$ applies the power gain $|H(0)|^2$ to the mean; squaring is only correct for second moments."]}, "he": {"q": "‏$X(t)$ הוא WSS עם $μ_X = 5$. הוא עובר במסנן LTI שתגובת ההלם שלו היא $h(t) = 2$ עבור $0 ≤ t ≤ 3$ ו-$0$ אחרת. מהו $μ_Y$?", "options": ["$6$", "$30$", "$10$", "$180$"], "hint": "רק השטח מתחת ל-$h(t)$ קובע, ושטח מלבן הוא גובה כפול רוחב.", "explanation": "$H(0) = ∫_0^3 2 dt = 6$. לכן $μ_Y = μ_X H(0) = 5·6 = 30$. שים לב שצורת $h$ אינה רלוונטית לתוחלת; רק השטח הכולל, כלומר הגבר ה-DC, נכנס לחישוב.", "whyWrong": ["$6$ הוא $H(0)$ בלבד: הגבר ה-DC חושב נכון אך לא הוכפל בתוחלת הכניסה $μ_X = 5$.", "$10$ משתמש בגובה $h = 2$ כהגבר, ומתעלם מכך שהמסנן מבצע אינטגרציה על חלון באורך $3$.", "$180 = 5·6^2$ מפעיל את הגבר ההספק $|H(0)|^2$ על התוחלת; העלאה בריבוע נכונה רק למומנטים שניים."]}}, {"id": "lti-003", "area": "lti", "topic": "input-output-crosscorrelation", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["lti", "cross-correlation", "convolution"], "answer": 2, "en": {"q": "$X(t)$ is WSS and $Y(t) = ∫h(λ)X(t-λ)dλ$. With the convention $R_{XY}(τ) = E[X(t)Y(t+τ)]$, which expression is correct?", "options": ["$R_{XY}(τ) = h(-τ) * R_X(τ)$", "$R_{XY}(τ) = h(τ) · R_X(τ)$", "$R_{XY}(τ) = h(τ) * R_X(τ)$", "$R_{XY}(τ) = h(τ) * h(-τ) * R_X(τ)$"], "hint": "Substitute the convolution for $Y(t+τ)$ and take the expectation inside; the remaining lag is $τ-λ$.", "explanation": "$R_{XY}(τ) = E[X(t)∫h(λ)X(t+τ-λ)dλ] = ∫h(λ)R_X(τ-λ)dλ = h(τ) * R_X(τ)$. Only one copy of $h$ appears, because only one of the two factors has been filtered. In frequency, $S_{XY}(f) = H(f)S_X(f)$.", "whyWrong": ["$h(-τ) * R_X(τ)$ is the answer under the opposite convention $R_{XY}(τ) = E[X(t+τ)Y(t)]$; with the stated definition the reflection does not appear.", "A pointwise product of $h$ and $R_X$ is not a valid operation here: filtering acts on the process by convolution, and correlation inherits that convolution.", "Two copies of $h$ appear only in $R_Y$, where both arguments are filtered outputs; the cross-correlation filters one side only."]}, "he": {"q": "‏$X(t)$ הוא WSS ו-$Y(t) = ∫h(λ)X(t-λ)dλ$. בקונבנציה $R_{XY}(τ) = E[X(t)Y(t+τ)]$, איזה ביטוי נכון?", "options": ["$R_{XY}(τ) = h(-τ) * R_X(τ)$", "$R_{XY}(τ) = h(τ) · R_X(τ)$", "$R_{XY}(τ) = h(τ) * R_X(τ)$", "$R_{XY}(τ) = h(τ) * h(-τ) * R_X(τ)$"], "hint": "הצב את הקונבולוציה במקום $Y(t+τ)$ והכנס את התוחלת פנימה; ההשהיה שנותרת היא $τ-λ$.", "explanation": "$R_{XY}(τ) = E[X(t)∫h(λ)X(t+τ-λ)dλ] = ∫h(λ)R_X(τ-λ)dλ = h(τ) * R_X(τ)$. מופיע עותק אחד בלבד של $h$, מפני שרק אחד משני הגורמים סונן. בתדר: $S_{XY}(f) = H(f)S_X(f)$.", "whyWrong": ["$h(-τ) * R_X(τ)$ היא התשובה בקונבנציה ההפוכה $R_{XY}(τ) = E[X(t+τ)Y(t)]$; בהגדרה שניתנה השיקוף אינו מופיע.", "מכפלה נקודתית של $h$ ו-$R_X$ אינה פעולה חוקית כאן: הסינון פועל על התהליך בקונבולוציה, והקורלציה יורשת את הקונבולוציה הזו.", "שני עותקים של $h$ מופיעים רק ב-$R_Y$, שם שני הארגומנטים הם מוצאים מסוננים; בקורלציה ההדדית מסננים צד אחד בלבד."]}}, {"id": "lti-004", "area": "lti", "topic": "output-autocorrelation", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["lti", "autocorrelation", "double-convolution"], "answer": 3, "en": {"q": "$X(t)$ is WSS with autocorrelation $R_X(τ)$ and is filtered by a real, stable $h(t)$. Which expression gives the autocorrelation of the output $Y(t)$?", "options": ["$R_Y(τ) = h(τ) * R_X(τ)$", "$R_Y(τ) = |h(τ)|^2 · R_X(τ)$", "$R_Y(τ) = h(τ) * h(τ) * R_X(τ)$", "$R_Y(τ) = h(τ) * h(-τ) * R_X(τ)$"], "hint": "Both arguments of $E[Y(t)Y(t+τ)]$ are filtered, and the two convolutions run in opposite directions in the lag.", "explanation": "$R_Y(τ) = E[Y(t)Y(t+τ)] = ∫∫h(λ)h(ν)R_X(τ+λ-ν)dλdν = R_X(τ) * h(τ) * h(-τ)$. The reflected copy $h(-τ)$ is what makes the transform $H(f)H^*(f) = |H(f)|^2$, guaranteeing $S_Y(f) ≥ 0$.", "whyWrong": ["One copy of $h$ gives the cross-correlation $R_{XY}$, not $R_Y$; the output is correlated with itself, so $h$ must act twice.", "A pointwise product with $|h(τ)|^2$ is not a filtering operation at all, and its transform would be a convolution of spectra, not $|H(f)|^2 S_X(f)$.", "$h(τ) * h(τ)$ transforms to $H(f)^2$, which is complex for a causal filter and would let $S_Y(f)$ be negative or complex — impossible for a PSD."]}, "he": {"q": "‏$X(t)$ הוא WSS עם אוטוקורלציה $R_X(τ)$ ומסונן על ידי $h(t)$ ממשי ויציב. איזה ביטוי נותן את האוטוקורלציה של המוצא $Y(t)$?", "options": ["$R_Y(τ) = h(τ) * R_X(τ)$", "$R_Y(τ) = |h(τ)|^2 · R_X(τ)$", "$R_Y(τ) = h(τ) * h(τ) * R_X(τ)$", "$R_Y(τ) = h(τ) * h(-τ) * R_X(τ)$"], "hint": "שני הארגומנטים של $E[Y(t)Y(t+τ)]$ מסוננים, ושתי הקונבולוציות פועלות בכיוונים מנוגדים בהשהיה.", "explanation": "$R_Y(τ) = E[Y(t)Y(t+τ)] = ∫∫h(λ)h(ν)R_X(τ+λ-ν)dλdν = R_X(τ) * h(τ) * h(-τ)$. העותק המשוקף $h(-τ)$ הוא שיוצר בהתמרה את $H(f)H^*(f) = |H(f)|^2$, ומבטיח $S_Y(f) ≥ 0$.", "whyWrong": ["עותק יחיד של $h$ נותן את הקורלציה ההדדית $R_{XY}$ ולא את $R_Y$; המוצא מקורלט עם עצמו, ולכן $h$ חייב לפעול פעמיים.", "מכפלה נקודתית ב-$|h(τ)|^2$ אינה פעולת סינון כלל, וההתמרה שלה תהיה קונבולוציה של ספקטרומים ולא $|H(f)|^2 S_X(f)$.", "$h(τ) * h(τ)$ מותמר ל-$H(f)^2$, שהוא מרוכב עבור מסנן סיבתי ויאפשר ל-$S_Y(f)$ להיות שלילי או מרוכב — בלתי אפשרי עבור PSD."]}}, {"id": "lti-005", "area": "lti", "topic": "spectral-relation-trap", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["lti", "psd", "magnitude-squared", "trap"], "answer": 0, "en": {"q": "White noise with $S_X(f) = 2$ W/Hz drives a filter with $H(f) = 1/(1+j2πf)$. A student writes $S_Y(f) = 2/(1+j2πf)$. What is the correct output PSD?", "options": ["$S_Y(f) = 2/(1+4π^2f^2)$", "$S_Y(f) = 2/(1+j2πf)$", "$S_Y(f) = 2/(1+2πf)^2$", "$S_Y(f) = 4/(1+4π^2f^2)^2$"], "hint": "A PSD is real and non-negative; anything with a $j$ left in it cannot be one.", "explanation": "$S_Y(f) = |H(f)|^2 S_X(f)$. Here $|H(f)|^2 = H(f)H^*(f) = 1/[(1+j2πf)(1-j2πf)] = 1/(1+4π^2f^2)$, so $S_Y(f) = 2/(1+4π^2f^2)$. The student's expression is complex-valued and would give a complex 'power', which is meaningless.", "whyWrong": ["$2/(1+j2πf)$ uses $H(f)$ instead of $|H(f)|^2$: it is complex, so it cannot be a power spectral density.", "$(1+2πf)^2$ squares the real sum instead of taking the squared magnitude; it introduces a spurious cross term $4πf$ and is not even.", "$4/(1+4π^2f^2)^2$ squares the whole product $|H|^2S_X$, i.e. applies the filter twice and squares the input PSD as well."]}, "he": {"q": "רעש לבן עם $S_X(f) = 2$ ואט/הרץ מוזן למסנן עם $H(f) = 1/(1+j2πf)$. סטודנט כותב $S_Y(f) = 2/(1+j2πf)$. מהי ה-PSD הנכונה של המוצא?", "options": ["$S_Y(f) = 2/(1+4π^2f^2)$", "$S_Y(f) = 2/(1+j2πf)$", "$S_Y(f) = 2/(1+2πf)^2$", "$S_Y(f) = 4/(1+4π^2f^2)^2$"], "hint": "‏PSD היא ממשית ואי-שלילית; ביטוי שנשאר בו $j$ אינו יכול להיות PSD.", "explanation": "$S_Y(f) = |H(f)|^2 S_X(f)$. כאן $|H(f)|^2 = H(f)H^*(f) = 1/[(1+j2πf)(1-j2πf)] = 1/(1+4π^2f^2)$, ולכן $S_Y(f) = 2/(1+4π^2f^2)$. הביטוי של הסטודנט מרוכב והיה נותן 'הספק' מרוכב, וזה חסר משמעות.", "whyWrong": ["$2/(1+j2πf)$ משתמש ב-$H(f)$ במקום ב-$|H(f)|^2$: הוא מרוכב, ולכן אינו יכול להיות צפיפות ספקטרלית של הספק.", "$(1+2πf)^2$ מעלה בריבוע את הסכום הממשי במקום לקחת ערך מוחלט בריבוע; נוצר איבר מוצלב מדומה $4πf$ והביטוי אינו זוגי.", "$4/(1+4π^2f^2)^2$ מעלה בריבוע את כל המכפלה $|H|^2S_X$, כלומר מפעיל את המסנן פעמיים וגם מרבע את PSD הכניסה."]}}, {"id": "lti-006", "area": "lti", "topic": "white-noise-rc-filter", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["lti", "rc-filter", "white-noise", "output-power"], "answer": 1, "en": {"q": "White noise with two-sided PSD $S_X(f) = N_0/2$ drives an RC low-pass filter, $H(f) = 1/(1+j2πfRC)$. What is the average output power $R_Y(0)$?", "options": ["$N_0/(2RC)$", "$N_0/(4RC)$", "$N_0/(8RC)$", "$N_0 RC/4$"], "hint": "Use $∫_{-∞}^{∞} df/(1+a^2f^2) = π/a$ with $a = 2πRC$.", "explanation": "$R_Y(0) = ∫|H(f)|^2 S_X(f) df = (N_0/2)∫df/(1+(2πfRC)^2)$. With $a = 2πRC$ the integral is $π/a = π/(2πRC) = 1/(2RC)$. Hence $R_Y(0) = (N_0/2)(1/(2RC)) = N_0/(4RC)$. Equivalently $R_Y(0) = N_0 B_N$ with $B_N = 1/(4RC)$.", "whyWrong": ["$N_0/(2RC)$ drops the factor $1/2$ from the two-sided PSD, i.e. treats $N_0$ itself as the height of $S_X(f)$.", "$N_0/(8RC)$ arises from integrating only over positive frequencies while still using the two-sided height $N_0/2$.", "$N_0 RC/4$ inverts the dependence on $RC$: a wider bandwidth means smaller $RC$, so the power must grow as $RC$ shrinks."]}, "he": {"q": "רעש לבן עם PSD דו-צדדית $S_X(f) = N_0/2$ מוזן למסנן RC מסוג מעביר-נמוכים, $H(f) = 1/(1+j2πfRC)$. מהו הספק המוצא הממוצע $R_Y(0)$?", "options": ["$N_0/(2RC)$", "$N_0/(4RC)$", "$N_0/(8RC)$", "$N_0 RC/4$"], "hint": "השתמש ב-$∫_{-∞}^{∞} df/(1+a^2f^2) = π/a$ עם $a = 2πRC$.", "explanation": "$R_Y(0) = ∫|H(f)|^2 S_X(f) df = (N_0/2)∫df/(1+(2πfRC)^2)$. עם $a = 2πRC$ האינטגרל הוא $π/a = π/(2πRC) = 1/(2RC)$. לכן $R_Y(0) = (N_0/2)(1/(2RC)) = N_0/(4RC)$. באופן שקול $R_Y(0) = N_0 B_N$ כאשר $B_N = 1/(4RC)$.", "whyWrong": ["$N_0/(2RC)$ משמיט את הפקטור $1/2$ של ה-PSD הדו-צדדית, כלומר מתייחס ל-$N_0$ עצמו כגובה של $S_X(f)$.", "$N_0/(8RC)$ נובע מאינטגרציה על תדרים חיוביים בלבד תוך שימוש בגובה הדו-צדדי $N_0/2$.", "$N_0 RC/4$ הופך את התלות ב-$RC$: רוחב סרט גדול יותר פירושו $RC$ קטן יותר, ולכן ההספק חייב לגדול כאשר $RC$ קטן."]}}, {"id": "lti-007", "area": "lti", "topic": "noise-equivalent-bandwidth", "difficulty": 3, "type": "open", "hardnessSource": "concept", "tags": ["lti", "noise-bandwidth", "rc-filter", "3db"], "en": {"q": "Define the noise-equivalent bandwidth $B_N$ of a low-pass filter. Compute it for the RC filter $H(f) = 1/(1+j2πfRC)$, compare it with the 3 dB bandwidth, and explain why the two differ.", "hint": "Replace the real filter by an ideal brick-wall filter that passes the same white-noise power at the same DC gain.", "modelAnswer": "Definition: $B_N$ is the one-sided bandwidth of an ideal rectangular filter with the same DC gain that passes the same power from white noise: $B_N = (1/|H(0)|^2)∫_0^{∞}|H(f)|^2 df$. Then for white input of two-sided height $N_0/2$ the output power is exactly $N_0 B_N |H(0)|^2$. For the RC filter, $|H(f)|^2 = 1/(1+(2πfRC)^2)$ and $|H(0)|^2 = 1$, so $∫_0^{∞}|H|^2 df = (1/2)(1/(2RC)) = 1/(4RC)$, giving $B_N = 1/(4RC)$. The 3 dB bandwidth solves $(2πf_{3dB}RC)^2 = 1$, so $f_{3dB} = 1/(2πRC)$. The ratio is $B_N/f_{3dB} = (1/(4RC))(2πRC) = π/2 ≈ 1.57$, so $B_N$ is about 57% larger. The reason: $f_{3dB}$ is a single-point descriptor (where the power gain has fallen to $1/2$), while $B_N$ is an integral of the whole $|H(f)|^2$ curve. The RC response rolls off only as $1/f^2$ in power, so the tail beyond $f_{3dB}$ still passes a large amount of noise, and this outweighs the power lost in the band below $f_{3dB}$ where $|H|^2 < 1$. Only a brick-wall filter has $B_N = f_{3dB}$; the sharper the roll-off, the closer the ratio approaches 1.", "rubric": ["Gives the definition $B_N = (1/|H(0)|^2)∫_0^{∞}|H(f)|^2 df$ (or the equivalent equal-noise-power statement).", "Computes $∫_0^{∞}|H|^2 df = 1/(4RC)$, hence $B_N = 1/(4RC)$.", "States $f_{3dB} = 1/(2πRC)$ and the ratio $B_N/f_{3dB} = π/2 ≈ 1.57$.", "Explains that $f_{3dB}$ is a single point while $B_N$ integrates the whole $|H(f)|^2$, so the slow $1/f^2$ tail adds noise.", "Notes the two coincide only for an ideal rectangular filter, and converge as the roll-off sharpens."]}, "he": {"q": "הגדר את רוחב הסרט השקול לרעש $B_N$ של מסנן מעביר-נמוכים. חשב אותו עבור מסנן RC ‏$H(f) = 1/(1+j2πfRC)$, השווה לרוחב הסרט של 3 dB, והסבר מדוע השניים נבדלים.", "hint": "החלף את המסנן האמיתי במסנן אידיאלי מלבני שמעביר את אותו הספק רעש לבן ובעל אותו הגבר DC.", "modelAnswer": "הגדרה: $B_N$ הוא רוחב הסרט החד-צדדי של מסנן מלבני אידיאלי בעל אותו הגבר DC שמעביר את אותו הספק מרעש לבן: $B_N = (1/|H(0)|^2)∫_0^{∞}|H(f)|^2 df$. אז עבור כניסה לבנה בגובה דו-צדדי $N_0/2$ הספק המוצא הוא בדיוק $N_0 B_N |H(0)|^2$. עבור מסנן RC מתקיים $|H(f)|^2 = 1/(1+(2πfRC)^2)$ ו-$|H(0)|^2 = 1$, ולכן $∫_0^{∞}|H|^2 df = (1/2)(1/(2RC)) = 1/(4RC)$, כלומר $B_N = 1/(4RC)$. רוחב הסרט של 3 dB מקיים $(2πf_{3dB}RC)^2 = 1$, ולכן $f_{3dB} = 1/(2πRC)$. היחס הוא $B_N/f_{3dB} = (1/(4RC))(2πRC) = π/2 ≈ 1.57$, כלומר $B_N$ גדול בכ-57 אחוז. הסיבה: $f_{3dB}$ הוא מאפיין של נקודה בודדת (שבה הגבר ההספק ירד ל-$1/2$), בעוד $B_N$ הוא אינטגרל על כל עקומת $|H(f)|^2$. תגובת ה-RC דועכת בהספק רק כמו $1/f^2$, ולכן הזנב מעבר ל-$f_{3dB}$ עדיין מעביר רעש רב, וזה גובר על ההספק שאבד בתחום שמתחת ל-$f_{3dB}$ שבו $|H|^2 < 1$. רק מסנן מלבני אידיאלי מקיים $B_N = f_{3dB}$; ככל שהדעיכה חדה יותר, היחס מתקרב ל-1.", "rubric": ["נותן את ההגדרה $B_N = (1/|H(0)|^2)∫_0^{∞}|H(f)|^2 df$ (או ניסוח שקול של שוויון הספק רעש).", "מחשב $∫_0^{∞}|H|^2 df = 1/(4RC)$, ולכן $B_N = 1/(4RC)$.", "מציין $f_{3dB} = 1/(2πRC)$ ואת היחס $B_N/f_{3dB} = π/2 ≈ 1.57$.", "מסביר ש-$f_{3dB}$ הוא נקודה בודדת בעוד $B_N$ מבצע אינטגרציה על כל $|H(f)|^2$, ולכן הזנב האיטי $1/f^2$ מוסיף רעש.", "מציין שהשניים מתלכדים רק במסנן מלבני אידיאלי, ומתכנסים ככל שהדעיכה חדה יותר."]}}, {"id": "lti-008", "area": "lti", "topic": "ideal-bandpass-white-noise", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["lti", "bandpass", "white-noise", "two-sided-psd"], "answer": 2, "en": {"q": "White noise with two-sided PSD $S_X(f) = 10^{-8}$ W/Hz passes through an ideal band-pass filter of unit gain over $10 kHz ≤ |f| ≤ 14 kHz$ and zero elsewhere. What is the output power?", "options": ["$4×10^{-5}$ W", "$1.6×10^{-4}$ W", "$8×10^{-5}$ W", "$2×10^{-5}$ W"], "hint": "The two-sided PSD must be integrated over both the positive and the negative passband.", "explanation": "$R_Y(0) = ∫|H(f)|^2 S_X(f) df$ equals $10^{-8}$ times the total pass width. The filter passes $4000$ Hz on the positive side and $4000$ Hz on the negative side, so the total measure is $8000$ Hz. Hence $R_Y(0) = 10^{-8}·8000 = 8×10^{-5}$ W.", "whyWrong": ["$4×10^{-5}$ W integrates only over $10$–$14$ kHz, forgetting that a two-sided PSD contributes an equal amount at negative frequencies.", "$1.6×10^{-4}$ W doubles once too often, e.g. by using $N_0 = 2×10^{-8}$ as the height and also counting both sides.", "$2×10^{-5}$ W uses half the one-sided width, as if the bandwidth were $2$ kHz rather than $4$ kHz."]}, "he": {"q": "רעש לבן עם PSD דו-צדדית $S_X(f) = 10^{-8}$ ואט/הרץ עובר במסנן מעביר-סרט אידיאלי בעל הגבר יחידה בתחום $10 kHz ≤ |f| ≤ 14 kHz$ ואפס אחרת. מהו הספק המוצא?", "options": ["$4×10^{-5}$ W", "$1.6×10^{-4}$ W", "$8×10^{-5}$ W", "$2×10^{-5}$ W"], "hint": "יש לבצע אינטגרציה של ה-PSD הדו-צדדית גם על תחום המעבר החיובי וגם על השלילי.", "explanation": "$R_Y(0) = ∫|H(f)|^2 S_X(f) df$ שווה ל-$10^{-8}$ כפול רוחב המעבר הכולל. המסנן מעביר $4000$ הרץ בצד החיובי ו-$4000$ הרץ בצד השלילי, כך שהמידה הכוללת היא $8000$ הרץ. לכן $R_Y(0) = 10^{-8}·8000 = 8×10^{-5}$ ואט.", "whyWrong": ["$4×10^{-5}$ ואט מבצע אינטגרציה רק על $10$–$14$ קילוהרץ, ומתעלם מכך ש-PSD דו-צדדית תורמת אותו הספק בתדרים שליליים.", "$1.6×10^{-4}$ ואט מכפיל פי שניים פעם אחת יותר מדי, למשל בשימוש ב-$N_0 = 2×10^{-8}$ כגובה וגם בספירת שני הצדדים.", "$2×10^{-5}$ ואט משתמש בחצי מהרוחב החד-צדדי, כאילו רוחב הסרט היה $2$ קילוהרץ במקום $4$ קילוהרץ."]}}, {"id": "lti-009", "area": "lti", "topic": "differentiator", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["lti", "differentiator", "psd", "magnitude-squared"], "answer": 3, "en": {"q": "$X(t)$ is WSS and mean-square differentiable, and $Y(t) = dX/dt$. What is $S_Y(f)$?", "options": ["$S_Y(f) = j2πf·S_X(f)$", "$S_Y(f) = 2πf·S_X(f)$", "$S_Y(f) = -(2πf)^2 S_X(f)$", "$S_Y(f) = (2πf)^2 S_X(f)$"], "hint": "Differentiation is an LTI operation with $H(f) = j2πf$; the PSD relation uses the squared magnitude.", "explanation": "The differentiator has $H(f) = j2πf$, so $|H(f)|^2 = (2πf)^2$ and $S_Y(f) = (2πf)^2 S_X(f)$. Equivalently $R_Y(τ) = -R_X''(τ)$; setting $τ = 0$ gives $E[(X')^2] = -R_X''(0) ≥ 0$, consistent with a non-negative PSD.", "whyWrong": ["$j2πf·S_X(f)$ uses $H(f)$ directly; the result is complex and odd, so it cannot be a power spectral density.", "$2πf·S_X(f)$ takes the magnitude but forgets the square; it is negative for $f<0$, again impossible for a PSD.", "$-(2πf)^2 S_X(f)$ comes from squaring $j2πf$ as $(j2πf)^2$ instead of forming $H(f)H^*(f)$; the sign is wrong."]}, "he": {"q": "‏$X(t)$ הוא WSS וגזיר בממוצע ריבועי, ו-$Y(t) = dX/dt$. מהו $S_Y(f)$?", "options": ["$S_Y(f) = j2πf·S_X(f)$", "$S_Y(f) = 2πf·S_X(f)$", "$S_Y(f) = -(2πf)^2 S_X(f)$", "$S_Y(f) = (2πf)^2 S_X(f)$"], "hint": "גזירה היא פעולת LTI עם $H(f) = j2πf$; יחס ה-PSD משתמש בערך המוחלט בריבוע.", "explanation": "לגוזר יש $H(f) = j2πf$, ולכן $|H(f)|^2 = (2πf)^2$ ו-$S_Y(f) = (2πf)^2 S_X(f)$. באופן שקול $R_Y(τ) = -R_X''(τ)$; הצבת $τ = 0$ נותנת $E[(X')^2] = -R_X''(0) ≥ 0$, בהתאמה ל-PSD אי-שלילית.", "whyWrong": ["$j2πf·S_X(f)$ משתמש ב-$H(f)$ ישירות; התוצאה מרוכבת ואי-זוגית, ולכן אינה יכולה להיות צפיפות ספקטרלית של הספק.", "$2πf·S_X(f)$ לוקח את הגודל אך שוכח את הריבוע; הביטוי שלילי עבור $f<0$, ושוב בלתי אפשרי כ-PSD.", "$-(2πf)^2 S_X(f)$ נובע מהעלאת $j2πf$ בריבוע כ-$(j2πf)^2$ במקום יצירת $H(f)H^*(f)$; הסימן שגוי."]}}, {"id": "lti-010", "area": "lti", "topic": "mean-square-differentiability", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["lti", "differentiator", "gauss-markov", "divergence"], "answer": 0, "en": {"q": "$X(t)$ is WSS with $R_X(τ) = σ^2 e^{-α|τ|}$, so $S_X(f) = 2ασ^2/(α^2+4π^2f^2)$. It is passed through an ideal differentiator. What is the output power?", "options": ["Infinite: $S_Y(f) → 2ασ^2$, so $∫S_Y(f)df$ diverges.", "$2ασ^2$, the high-frequency limit of $S_Y(f)$.", "$α^2σ^2/2$, obtained from $R_Y(0) = -R_X''(0)$.", "$ασ^2$, half the input power multiplied by $α$."], "hint": "Look at how fast $S_Y(f) = (2πf)^2 S_X(f)$ decays as $f → ∞$, and check whether $R_X''(0)$ exists.", "explanation": "$S_Y(f) = (2πf)^2 S_X(f) = 2ασ^2(2πf)^2/(α^2+4π^2f^2) → 2ασ^2$ as $|f| → ∞$: the output spectrum does not decay, so $∫S_Y(f)df = ∞$. Equivalently $R_X(τ)$ has a corner at $τ = 0$, so $R_X''(0)$ does not exist and $X(t)$ is not mean-square differentiable.", "whyWrong": ["$2ασ^2$ is the asymptotic height of $S_Y(f)$, not an integral; a flat non-zero spectrum over all $f$ carries infinite power.", "$α^2σ^2/2$ applies $-R_X''(0)$ mechanically to $σ^2e^{-α|τ|}$, ignoring that the two one-sided second derivatives at $τ=0$ do not agree.", "$ασ^2$ mixes the slope $|R_X'(0^+)| = ασ^2$ with a second moment; the first derivative of $R_X$ is not the output power."]}, "he": {"q": "‏$X(t)$ הוא WSS עם $R_X(τ) = σ^2 e^{-α|τ|}$, ולכן $S_X(f) = 2ασ^2/(α^2+4π^2f^2)$. הוא מוזן לגוזר אידיאלי. מהו הספק המוצא?", "options": ["אינסופי: $S_Y(f) → 2ασ^2$, ולכן $∫S_Y(f)df$ מתבדר.", "$2ασ^2$, הגבול בתדר גבוה של $S_Y(f)$.", "$α^2σ^2/2$, המתקבל מ-$R_Y(0) = -R_X''(0)$.", "$ασ^2$, מחצית הספק הכניסה כפול $α$."], "hint": "בדוק כמה מהר $S_Y(f) = (2πf)^2 S_X(f)$ דועך כאשר $f → ∞$, ובדוק אם $R_X''(0)$ קיימת.", "explanation": "$S_Y(f) = (2πf)^2 S_X(f) = 2ασ^2(2πf)^2/(α^2+4π^2f^2) → 2ασ^2$ כאשר $|f| → ∞$: ספקטרום המוצא אינו דועך, ולכן $∫S_Y(f)df = ∞$. באופן שקול, ל-$R_X(τ)$ יש נקודת שבירה ב-$τ = 0$, ולכן $R_X''(0)$ אינה קיימת ו-$X(t)$ אינו גזיר בממוצע ריבועי.", "whyWrong": ["$2ασ^2$ הוא הגובה האסימפטוטי של $S_Y(f)$ ולא אינטגרל; ספקטרום שטוח ושונה מאפס על כל $f$ נושא הספק אינסופי.", "$α^2σ^2/2$ מפעיל את $-R_X''(0)$ באופן מכני על $σ^2e^{-α|τ|}$, ומתעלם מכך ששתי הנגזרות השניות החד-צדדיות ב-$τ=0$ אינן שוות.", "$ασ^2$ מערבב את השיפוע $|R_X'(0^+)| = ασ^2$ עם מומנט שני; הנגזרת הראשונה של $R_X$ אינה הספק המוצא."]}}, {"id": "lti-011", "area": "lti", "topic": "integrator-wiener", "difficulty": 3, "type": "mcq", "hardnessSource": "computation", "tags": ["lti", "integrator", "wiener-process", "nonstationary"], "answer": 1, "en": {"q": "White noise with two-sided PSD $S_X(f) = 3$ W/Hz is applied to an integrator, $Y(t) = ∫_0^t X(s)ds$, with $Y(0)=0$. What is $Var(Y(5))$?", "options": ["$7.5$", "$15$", "$30$", "$75$"], "hint": "Write the double integral of $R_X(u-v) = 3δ(u-v)$ over the square $[0,t]×[0,t]$.", "explanation": "$E[Y(t)^2] = ∫_0^t∫_0^t R_X(u-v)dudv = ∫_0^t∫_0^t 3δ(u-v)dudv = ∫_0^t 3 du = 3t$. At $t = 5$ this is $15$. The output is a Wiener process: its variance grows linearly with $t$, so $Y$ is not WSS even though $X$ is.", "whyWrong": ["$7.5$ uses the one-sided height $N_0 = 3$ halved, i.e. treats $3$ as $N_0$ rather than as the two-sided $S_X(f)$ actually given.", "$30$ doubles the delta's weight, as if $∫δ(u-v)du = 2$ over the square; the integral of a delta through the interior is $1$.", "$75 = 3·5^2$ treats the variance as growing like $t^2$, which is what happens for a deterministic ramp, not for integrated white noise."]}, "he": {"q": "רעש לבן עם PSD דו-צדדית $S_X(f) = 3$ ואט/הרץ מוזן לאינטגרטור, $Y(t) = ∫_0^t X(s)ds$, עם $Y(0)=0$. מהו $Var(Y(5))$?", "options": ["$7.5$", "$15$", "$30$", "$75$"], "hint": "כתוב את האינטגרל הכפול של $R_X(u-v) = 3δ(u-v)$ על הריבוע $[0,t]×[0,t]$.", "explanation": "$E[Y(t)^2] = ∫_0^t∫_0^t R_X(u-v)dudv = ∫_0^t∫_0^t 3δ(u-v)dudv = ∫_0^t 3 du = 3t$. עבור $t = 5$ מתקבל $15$. המוצא הוא תהליך ווינר: השונות שלו גדלה לינארית ב-$t$, ולכן $Y$ אינו WSS אף ש-$X$ כן.", "whyWrong": ["$7.5$ מחלק את $3$ בשתיים, כלומר מתייחס ל-$3$ כאל $N_0$ ולא כאל ה-PSD הדו-צדדית שניתנה בפועל.", "$30$ מכפיל פי שניים את משקל הדלתא, כאילו $∫δ(u-v)du = 2$ בתוך הריבוע; אינטגרל של דלתא דרך הפנים שווה $1$.", "$75 = 3·5^2$ מניח ששונות גדלה כמו $t^2$, וזה מה שקורה לרמפה דטרמיניסטית ולא לאינטגרל של רעש לבן."]}}, {"id": "lti-012", "area": "lti", "topic": "cascade-filters", "difficulty": 4, "type": "mcq", "hardnessSource": "computation", "tags": ["lti", "cascade", "white-noise", "output-power"], "answer": 2, "en": {"q": "White noise with two-sided PSD $N_0/2$ drives a cascade of $h_1(t) = e^{-t}u(t)$ followed by $h_2(t) = e^{-2t}u(t)$. What is the average output power?", "options": ["$N_0/12$", "$N_0/6$", "$N_0/24$", "$N_0/48$"], "hint": "Find the equivalent $h(t) = h_1 * h_2$, then use $R_Y(0) = (N_0/2)∫h^2(t)dt$.", "explanation": "$h(t) = ∫_0^t e^{-λ}e^{-2(t-λ)}dλ = e^{-2t}(e^t-1) = (e^{-t}-e^{-2t})u(t)$. Then $∫_0^{∞}h^2 dt = ∫_0^{∞}(e^{-2t}-2e^{-3t}+e^{-4t})dt = 1/2 - 2/3 + 1/4 = 1/12$. So $R_Y(0) = (N_0/2)(1/12) = N_0/24$.", "whyWrong": ["$N_0/12$ is $∫h^2 dt$ multiplied by $N_0$ instead of by the two-sided height $N_0/2$.", "$N_0/6$ comes from cascading incorrectly, e.g. multiplying the impulse responses to get $e^{-3t}u(t)$ and using $∫e^{-6t}dt$ scaled wrongly.", "$N_0/48$ halves once too often, typically by integrating $|H(f)|^2$ over positive frequencies only while keeping the two-sided height."]}, "he": {"q": "רעש לבן עם PSD דו-צדדית $N_0/2$ מוזן לשרשור של $h_1(t) = e^{-t}u(t)$ ואחריו $h_2(t) = e^{-2t}u(t)$. מהו הספק המוצא הממוצע?", "options": ["$N_0/12$", "$N_0/6$", "$N_0/24$", "$N_0/48$"], "hint": "מצא את התגובה השקולה $h(t) = h_1 * h_2$, ואז השתמש ב-$R_Y(0) = (N_0/2)∫h^2(t)dt$.", "explanation": "$h(t) = ∫_0^t e^{-λ}e^{-2(t-λ)}dλ = e^{-2t}(e^t-1) = (e^{-t}-e^{-2t})u(t)$. לכן $∫_0^{∞}h^2 dt = ∫_0^{∞}(e^{-2t}-2e^{-3t}+e^{-4t})dt = 1/2 - 2/3 + 1/4 = 1/12$. ומכאן $R_Y(0) = (N_0/2)(1/12) = N_0/24$.", "whyWrong": ["$N_0/12$ הוא $∫h^2 dt$ מוכפל ב-$N_0$ במקום בגובה הדו-צדדי $N_0/2$.", "$N_0/6$ נובע משרשור שגוי, למשל הכפלת תגובות ההלם לקבלת $e^{-3t}u(t)$ ושימוש ב-$∫e^{-6t}dt$ בקנה מידה לא נכון.", "$N_0/48$ מחלק בשתיים פעם אחת יותר מדי, בדרך כלל באינטגרציה של $|H(f)|^2$ על תדרים חיוביים בלבד תוך שמירה על הגובה הדו-צדדי."]}}, {"id": "lti-013", "area": "lti", "topic": "gaussian-preservation", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["lti", "gaussian", "linearity"], "answer": 3, "en": {"q": "A stationary Gaussian process $X(t)$ is passed through a stable LTI filter. What can be said about the distribution of the output $Y(t)$?", "options": ["Gaussian only if $h(t)$ is causal and non-negative.", "Gaussian only if $X(t)$ is white Gaussian noise.", "Not Gaussian: convolution mixes many samples.", "Gaussian, for any stable LTI filter $h(t)$."], "hint": "The output is a mean-square limit of finite linear combinations of the input samples.", "explanation": "$Y(t) = ∫h(λ)X(t-λ)dλ$ is a mean-square limit of Riemann sums $Σh(λ_k)X(t-λ_k)Δλ$, each of which is a linear combination of jointly Gaussian variables and hence Gaussian. Gaussianity is preserved under linear combination and under mean-square limits, so $Y$ is Gaussian, and $X,Y$ are jointly Gaussian.", "whyWrong": ["Causality and positivity of $h$ are irrelevant to the distribution; they affect realizability, not Gaussianity.", "Whiteness of the input is not needed: any jointly Gaussian input works, since only linear operations are involved.", "Convolution is exactly the operation Gaussianity is closed under; mixing many jointly Gaussian samples linearly keeps the result Gaussian."]}, "he": {"q": "תהליך גאוסי סטציונרי $X(t)$ עובר במסנן LTI יציב. מה ניתן לומר על ההתפלגות של המוצא $Y(t)$?", "options": ["גאוסי רק אם $h(t)$ סיבתי ואי-שלילי.", "גאוסי רק אם $X(t)$ הוא רעש לבן גאוסי.", "לא גאוסי: הקונבולוציה מערבבת דגימות רבות.", "גאוסי, עבור כל מסנן LTI יציב $h(t)$."], "hint": "המוצא הוא גבול בממוצע ריבועי של צירופים לינאריים סופיים של דגימות הכניסה.", "explanation": "$Y(t) = ∫h(λ)X(t-λ)dλ$ הוא גבול בממוצע ריבועי של סכומי רימן $Σh(λ_k)X(t-λ_k)Δλ$, שכל אחד מהם צירוף לינארי של משתנים גאוסיים במשותף ולכן גאוסי. גאוסיות נשמרת תחת צירוף לינארי ותחת גבולות בממוצע ריבועי, ולכן $Y$ גאוסי, ו-$X,Y$ גאוסיים במשותף.", "whyWrong": ["סיבתיות ואי-שליליות של $h$ אינן רלוונטיות להתפלגות; הן משפיעות על מימושיות ולא על גאוסיות.", "אין צורך שהכניסה תהיה לבנה: כל כניסה גאוסית במשותף מתאימה, שכן מדובר בפעולות לינאריות בלבד.", "קונבולוציה היא בדיוק הפעולה שגאוסיות סגורה תחתיה; ערבוב לינארי של דגימות גאוסיות במשותף משאיר את התוצאה גאוסית."]}}, {"id": "lti-014", "area": "lti", "topic": "wss-preservation", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["lti", "wss", "joint-stationarity"], "answer": 0, "en": {"q": "$X(t)$ is WSS and passes through a stable LTI filter, producing $Y(t)$. Which statement is correct?", "options": ["$Y(t)$ is WSS, and $X,Y$ are jointly WSS.", "$Y(t)$ is WSS only if the filter is causal.", "$Y(t)$ is WSS only if $X(t)$ is white.", "$Y(t)$ is generally non-stationary after filtering."], "hint": "Check whether $μ_Y$ and $R_Y(t_1,t_2)$ depend on absolute time once the convolution is written out.", "explanation": "$μ_Y = μ_X H(0)$ is constant, and $E[Y(t)Y(t+τ)] = ∫∫h(λ)h(ν)R_X(τ+λ-ν)dλdν$ depends only on $τ$. Both $R_Y$ and $R_{XY}$ are functions of the lag alone, so $Y$ is WSS and $X,Y$ are jointly WSS. Stability guarantees the integrals converge.", "whyWrong": ["Causality plays no role: a non-causal $h$ still shifts the correlation by lags only, so stationarity is preserved.", "Whiteness is irrelevant; the derivation uses only that $R_X$ depends on the lag, which is the definition of WSS.", "Time-invariance of the filter is exactly what prevents absolute time from entering; a time-varying filter would break stationarity."]}, "he": {"q": "‏$X(t)$ הוא WSS ועובר במסנן LTI יציב, ומתקבל $Y(t)$. איזו טענה נכונה?", "options": ["$Y(t)$ הוא WSS, ו-$X,Y$ סטציונריים במשותף.", "$Y(t)$ הוא WSS רק אם המסנן סיבתי.", "$Y(t)$ הוא WSS רק אם $X(t)$ לבן.", "$Y(t)$ בדרך כלל אינו סטציונרי לאחר הסינון."], "hint": "בדוק אם $μ_Y$ ו-$R_Y(t_1,t_2)$ תלויים בזמן המוחלט לאחר פתיחת הקונבולוציה.", "explanation": "$μ_Y = μ_X H(0)$ קבוע, ו-$E[Y(t)Y(t+τ)] = ∫∫h(λ)h(ν)R_X(τ+λ-ν)dλdν$ תלוי ב-$τ$ בלבד. גם $R_Y$ וגם $R_{XY}$ הן פונקציות של ההשהיה בלבד, ולכן $Y$ הוא WSS ו-$X,Y$ סטציונריים במשותף. היציבות מבטיחה שהאינטגרלים מתכנסים.", "whyWrong": ["לסיבתיות אין תפקיד: גם $h$ לא-סיבתי מזיז את הקורלציה בהשהיות בלבד, ולכן הסטציונריות נשמרת.", "הלבנוּת אינה רלוונטית; הפיתוח משתמש רק בכך ש-$R_X$ תלויה בהשהיה, וזו הגדרת WSS.", "אי-תלות המסנן בזמן היא בדיוק מה שמונע מהזמן המוחלט להיכנס; מסנן משתנה בזמן היה שובר את הסטציונריות."]}}, {"id": "lti-015", "area": "lti", "topic": "ar1-autocorrelation", "difficulty": 2, "type": "mcq", "hardnessSource": "computation", "tags": ["ar1", "discrete-time", "autocorrelation"], "answer": 1, "en": {"q": "A stationary AR(1) process satisfies $X[n] = 0.5X[n-1] + W[n]$, where $W[n]$ is zero-mean white with variance $3$. F
