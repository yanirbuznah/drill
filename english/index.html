<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1017" media="(prefers-color-scheme: dark)">
<meta name="description" content="Inversion, subject-verb agreement and tenses — fill in the blank or pick the right form.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Grammar">
<meta name="mobile-web-app-capable" content="yes">
<title>English Grammar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EDEFF3; --surface-3:#E3E7ED;
  --line:#D8DEE7; --line-strong:#BCC5D2;
  --ink:#131820; --muted:#5A6472; --faint:#8B94A3;
  --accent:#4338A8; --accent-ink:#FFFFFF; --accent-soft:#E9E7F8; --accent-line:#BFB8EC;
  --ok:#14724D; --ok-soft:#E1F1E9; --ok-line:#9BCFB8;
  --bad:#B02A24; --bad-soft:#FBE7E5; --bad-line:#E9AFAB;
  --warn:#8A5A00;
  --d1:#2F8F7F; --d2:#A87C1E; --d3:#C4602F; --d4:#9C2F6B;
  --shadow:0 1px 2px rgba(19,24,32,.05), 0 8px 24px -12px rgba(19,24,32,.18);
  --r:8px; --r-sm:5px;
  --sans:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1017; --surface:#151A23; --surface-2:#1C222D; --surface-3:#232B38;
    --line:#293040; --line-strong:#3A4353;
    --ink:#E8ECF3; --muted:#9AA5B5; --faint:#77808F;
    --accent:#9A8CFF; --accent-ink:#12101F; --accent-soft:#221E3C; --accent-line:#463D80;
    --ok:#48C596; --ok-soft:#12291F; --ok-line:#2A6A4F;
    --bad:#F0736B; --bad-soft:#2B1615; --bad-line:#6E332F;
    --warn:#D9A441;
    --d1:#4FBFA8; --d2:#D8A63C; --d3:#E58044; --d4:#DB6BA8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1017; --surface:#151A23; --surface-2:#1C222D; --surface-3:#232B38;
  --line:#293040; --line-strong:#3A4353;
  --ink:#E8ECF3; --muted:#9AA5B5; --faint:#77808F;
  --accent:#9A8CFF; --accent-ink:#12101F; --accent-soft:#221E3C; --accent-line:#463D80;
  --ok:#48C596; --ok-soft:#12291F; --ok-line:#2A6A4F;
  --bad:#F0736B; --bad-soft:#2B1615; --bad-line:#6E332F;
  --warn:#D9A441;
  --d1:#4FBFA8; --d2:#D8A63C; --d3:#E58044; --d4:#DB6BA8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  overflow-x:hidden; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
[hidden]{display:none !important}

/* ---------- shell ---------- */
.app{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:7px;margin-inline-end:auto;min-width:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:34px;padding:0 9px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--muted);
}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
main{flex:1;padding:16px 14px 96px}
@media(min-width:700px){ main{padding:24px 20px 110px} }

/* ---------- type ---------- */
h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
h2{font-size:17px;line-height:1.3;letter-spacing:-.01em;margin:0 0 10px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.lede{color:var(--muted);font-size:14.5px;margin:0 0 20px;max-width:60ch}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- cards / sections ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.section{margin-bottom:22px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- mode picker ---------- */
.modes{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:22px}
@media(min-width:560px){ .modes{grid-template-columns:1fr 1fr} }
.mode{
  display:flex;flex-direction:column;gap:5px;text-align:start;padding:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease;
}
.mode:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.mode strong{font-size:17px;letter-spacing:-.01em}
.mode span{font-size:13px;color:var(--muted);line-height:1.45}
.mode em{font-family:var(--mono);font-size:10px;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);
  transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.chip .n{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.chip.d1[aria-pressed="true"]{background:color-mix(in srgb,var(--d1) 15%,transparent);border-color:var(--d1);color:var(--d1)}
.chip.d2[aria-pressed="true"]{background:color-mix(in srgb,var(--d2) 15%,transparent);border-color:var(--d2);color:var(--d2)}
.chip.d3[aria-pressed="true"]{background:color-mix(in srgb,var(--d3) 15%,transparent);border-color:var(--d3);color:var(--d3)}
.chip.d4[aria-pressed="true"]{background:color-mix(in srgb,var(--d4) 15%,transparent);border-color:var(--d4);color:var(--d4)}

details.filters{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
details.filters>summary{
  list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:500;
}
details.filters>summary::-webkit-details-marker{display:none}
details.filters>summary::after{content:"+";margin-inline-start:auto;font-family:var(--mono);color:var(--faint);font-size:16px}
details.filters[open]>summary::after{content:"\2212"}
details.filters>summary .pool{font-family:var(--mono);font-size:11px;color:var(--faint);margin-inline-start:auto}
details.filters[open]>summary .pool{display:none}
.filterbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line)}
.fgroup{padding-top:14px}
.fgroup>.eyebrow{display:flex;align-items:center;gap:8px}
.fgroup .allbtn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-inline-start:auto}

/* ---------- difficulty meter ---------- */
.meter{display:inline-flex;gap:2.5px;align-items:center}
.meter i{width:5px;height:5px;border-radius:50%;background:var(--line-strong);display:block}
.meter[data-d="1"] i:nth-child(-n+1){background:var(--d1)}
.meter[data-d="2"] i:nth-child(-n+2){background:var(--d2)}
.meter[data-d="3"] i:nth-child(-n+3){background:var(--d3)}
.meter[data-d="4"] i:nth-child(-n+4){background:var(--d4)}

/* ---------- question ---------- */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.qmeta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.qmeta .area{color:var(--muted)}
.qcard{padding:20px 18px}
.qtext{font-size:19px;line-height:1.45;letter-spacing:-.01em;margin:0;text-wrap:pretty}
@media(min-width:700px){ .qtext{font-size:21px} }
.hintbox{margin-top:16px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);
  border-inline-start:3px solid var(--warn);font-size:14px;color:var(--muted)}
.hintbox b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);margin-bottom:4px}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:start;width:100%;
  padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:15px;line-height:1.45;
  transition:border-color .12s,background .12s;
}
.opt:not(.locked):hover{border-color:var(--accent-line);background:var(--accent-soft)}
.opt.locked{cursor:default}
.opt .k{
  flex:0 0 auto;width:21px;height:21px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;
  color:var(--muted);margin-top:1px;
}
.opt.correct{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.picked{border-width:2px;padding:11px 12px}
.opt.dim{opacity:.62}
.opt .why{display:block;margin-top:6px;font-size:13px;color:var(--muted);line-height:1.45}
.reveal-anim{animation:rise .22s ease both}
.opts.reveal-anim .opt:nth-child(1){animation-delay:0ms}
.opts.reveal-anim .opt:nth-child(2){animation-delay:35ms}
.opts.reveal-anim .opt:nth-child(3){animation-delay:70ms}
.opts.reveal-anim .opt:nth-child(4){animation-delay:105ms}
.opts.reveal-anim .opt{animation:rise .24s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }

.verdict{display:flex;align-items:center;gap:9px;margin-top:16px;padding:11px 13px;border-radius:var(--r-sm);
  font-size:14.5px;font-weight:500}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.verdict.no{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.verdict .g{font-family:var(--mono);font-size:15px}

.explain{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.explain .eyebrow{margin-bottom:6px}
.explain p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}

textarea.answer{width:100%;min-height:120px;padding:12px 13px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);resize:vertical;font-size:15px;line-height:1.5}
textarea.answer:focus{border-color:var(--accent);outline:none}
.rubric{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.rubric li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.rubric input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--accent);flex:0 0 auto}
.selfscore{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:12px;color:var(--muted)}
.selfscore b{font-size:20px;color:var(--ink)}

/* ---------- action bar ---------- */
.actionbar{
  position:fixed;inset-inline:0;bottom:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.actionbar .inner{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  font-size:15px;font-weight:500;color:var(--ink);min-height:46px;
}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{color:var(--muted)}
.btn.wide{flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13.5px}

/* ---------- progress ---------- */
.progress{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.progress .bar{flex:1;height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.progress .cnt{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em}
.qdots{display:flex;gap:4px;flex-wrap:wrap}
.qdots i{width:7px;height:7px;border-radius:50%;background:var(--surface-3);display:block}
.qdots i.done{background:var(--accent)}
.qdots i.now{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- stats ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:center}
.stat b{display:block;font-size:23px;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.barlist{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(90px,1fr) 2fr auto;gap:10px;align-items:center;font-size:13.5px}
.barrow .track{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.barrow .pct{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:end}

/* ---------- results ---------- */
.scorehero{text-align:center;padding:26px 18px}
.scorehero .big{font-family:var(--mono);font-size:56px;line-height:1;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.scorehero .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.reviewitem{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.reviewitem+.reviewitem{margin-top:8px}
.reviewitem .q{font-size:15px;line-height:1.45;margin:8px 0 10px}
.ansline{font-size:13.5px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.ansline .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:0 0 auto;min-width:62px;margin-top:3px}
.ansline.ok .txt{color:var(--ok)}
.ansline.no .txt{color:var(--bad)}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .lab{flex:1;min-width:0}
.setrow .lab b{display:block;font-size:14.5px;font-weight:500}
.setrow .lab span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.switch{flex:0 0 auto;width:44px;height:26px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(18px)}
[dir="rtl"] .switch[aria-pressed="true"]::after{transform:translateX(-18px)}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field input,.field select{padding:10px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:14px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:var(--r-sm)}
.note b{color:var(--ink)}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14.5px}
.ltr{direction:ltr;display:inline-block;unicode-bidi:isolate}
[dir="rtl"] .brand span,[dir="rtl"] .eyebrow,[dir="rtl"] .qmeta{letter-spacing:0}



/* ---------- cloze: the sentence under test ---------- */
.sent{
  font-size:19px;line-height:1.75;letter-spacing:-.01em;margin:0;
  direction:ltr;unicode-bidi:isolate;text-align:start;
}
[dir="rtl"] .sent{text-align:left}
@media(min-width:700px){ .sent{font-size:21px} }
.blank{
  display:inline-block;width:auto;min-width:5.5em;max-width:min(100%,15em);
  padding:2px 8px;margin:0 2px;
  border:0;border-bottom:2px solid var(--accent);border-radius:3px 3px 0 0;
  background:var(--surface-2);color:var(--ink);
  font:inherit;font-size:.95em;text-align:center;direction:ltr;
}
.blank:focus{outline:none;background:var(--accent-soft);border-bottom-width:3px}
.blank::placeholder{color:var(--faint);font-size:.85em;letter-spacing:.08em}
.blank:disabled{opacity:1;background:transparent;border-bottom-style:dotted}
.blank.good{background:var(--ok-soft);border-bottom-color:var(--ok);color:var(--ok);font-weight:600}
.blank.bad{background:var(--bad-soft);border-bottom-color:var(--bad);color:var(--bad);text-decoration:line-through}
.fix{display:block;margin-top:14px;padding:11px 13px;border-radius:var(--r-sm);
  background:var(--ok-soft);border:1px solid var(--ok-line);font-size:14.5px;color:var(--ink)}
.fix b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.fix .full{direction:ltr;unicode-bidi:isolate;display:block;line-height:1.6}
.fix .full u{text-decoration:none;color:var(--ok);font-weight:600;border-bottom:2px solid var(--ok-line)}
.alt{margin-top:7px;font-size:12.5px;color:var(--muted)}
.alt code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px;direction:ltr;unicode-bidi:isolate;display:inline-block}
/* ---------- inline math ---------- */
.mth{
  font-family:var(--mono);font-size:.93em;
  direction:ltr;unicode-bidi:isolate;
  white-space:pre-wrap;overflow-wrap:break-word;
  letter-spacing:-.005em;
}
/* ---------- glossary terms ---------- */
.term{
  display:inline;padding:0;margin:0;border:0;background:none;font:inherit;color:inherit;cursor:help;
  border-bottom:2px solid var(--accent);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
}
.term:hover,.term.on{color:var(--accent)}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.tip{
  position:fixed;top:0;inset-inline-start:0;z-index:120;
  width:max-content;max-width:min(330px,calc(100vw - 24px));
  background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--r);
  box-shadow:0 10px 34px -10px rgba(0,0,0,.5);padding:11px 13px;
  opacity:0;transform:translateY(-4px);pointer-events:none;
  transition:opacity .13s ease,transform .13s ease;
}
.tip.show{opacity:1;transform:none;pointer-events:auto}
.tip b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px}
.tip p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink)}
.tip .close{position:absolute;inset-inline-end:6px;top:5px;font-family:var(--mono);font-size:12px;
  color:var(--faint);padding:2px 5px;line-height:1}

/* ---------- glossary screen ---------- */
.gsearch{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:15px;margin-bottom:14px}
.gsearch:focus{border-color:var(--accent);outline:none}
.glist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.gitem{background:var(--surface);padding:12px 14px}
.gitem b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
.gitem span{display:block;font-size:13px;line-height:1.5;color:var(--muted)}
.gcount{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:10px}
</style>

, {"id": "tense-conditional", "en": "Conditionals & wishes", "he": "משפטי תנאי ומשאלות"}, {"id": "exam", "en": "Mixed traps", "he": "מלכודות מעורבות"}]};
const QUESTIONS = [{"id": "ivn-001", "area": "inversion-negative", "topic": "never-inversion", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["inversion", "negative-adverbial", "present-perfect", "word-order"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["Never have I seen such a mess.", "Never I have seen such a mess.", "Never I saw such a mess.", "Never did I have seen such a mess."], "hint": "After a negative adverbial at the front, the auxiliary jumps in front of the subject.", "explanation": "A fronted negative adverbial forces subject-auxiliary inversion: the auxiliary comes before the subject, exactly as in a question. 'I have never seen' becomes 'Never have I seen'.", "whyWrong": ["Keeps ordinary word order ('I have') after a fronted negative - the classic mistake.", "Keeps ordinary word order and also drops the present perfect that this sentence needs.", "You cannot add 'did' to a clause that already has the auxiliary 'have'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Never have I seen such a mess.", "Never I have seen such a mess.", "Never I saw such a mess.", "Never did I have seen such a mess."], "hint": "אחרי negative adverbial בראש המשפט, ה-auxiliary עובר לפני הנושא.", "explanation": "מילת שלילה בראש המשפט מחייבת inversion בין הנושא ל-auxiliary: ה-auxiliary בא לפני הנושא, בדיוק כמו בשאלה. מ-'I have never seen' מקבלים 'Never have I seen'.", "whyWrong": ["שומר על סדר המילים הרגיל ('I have') אחרי מילת שלילה בראש המשפט - הטעות הקלאסית.", "שומר על סדר מילים רגיל, וגם מוותר על ה-present perfect שהמשפט דורש.", "אי אפשר להוסיף 'did' למשפט שיש בו כבר auxiliary 'have'."]}}, {"id": "ivn-002", "area": "inversion-negative", "topic": "rarely-do-support", "difficulty": 2, "type": "cloze", "hardnessSource": "concept", "tags": ["inversion", "do-support", "rarely", "present-simple"], "sentence": "Rarely ___ us about his work.", "answers": [["does he tell"]], "en": {"q": "Complete the sentence with the inverted present simple of 'tell', subject 'he'.", "hint": "'He tells us' has no auxiliary, so the inversion has to borrow one.", "explanation": "When a fronted negative adverbial is followed by a simple tense with no auxiliary, English supplies do-support and inverts that: 'He rarely tells us' becomes 'Rarely does he tell us'. The main verb goes back to the bare form 'tell'."}, "he": {"q": "השלימו את המשפט ב-present simple הפוך של הפועל 'tell', כשהנושא הוא 'he'.", "hint": "במשפט 'He tells us' אין auxiliary, ולכן ה-inversion חייב להביא אחד.", "explanation": "כשאחרי מילת השלילה בראש המשפט בא זמן פשוט בלי auxiliary, האנגלית מוסיפה do-support, והיא זו שמתהפכת: 'He rarely tells us' הופך ל-'Rarely does he tell us'. הפועל העיקרי חוזר לצורת הבסיס 'tell'."}}, {"id": "ivn-003", "area": "inversion-negative", "topic": "do-support-third-person-s", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["inversion", "do-support", "seldom", "third-person-s"], "answer": 1, "en": {"q": "Choose the correct sentence.", "options": ["Seldom she admits that she is wrong.", "Seldom does she admit that she is wrong.", "Seldom does she admits that she is wrong.", "Seldom she does admit that she is wrong."], "hint": "Only one word in the clause can carry the third-person -s.", "explanation": "In an inverted clause the auxiliary 'does' carries the third-person -s, and the main verb stays in the bare form: 'Seldom does she admit'. You never mark the -s twice.", "whyWrong": ["A fronted 'seldom' requires inversion, so 'she admits' is the wrong order.", "The -s is already on 'does', so the main verb must be the bare 'admit'.", "The subject cannot stand before 'does' - the auxiliary comes first in an inverted clause."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Seldom she admits that she is wrong.", "Seldom does she admit that she is wrong.", "Seldom does she admits that she is wrong.", "Seldom she does admit that she is wrong."], "hint": "רק מילה אחת במשפט יכולה לשאת את ה-s של גוף שלישי.", "explanation": "במשפט הפוך ה-auxiliary 'does' נושא את ה-s של גוף שלישי, והפועל העיקרי נשאר בצורת הבסיס: 'Seldom does she admit'. לא מסמנים את ה-s פעמיים.", "whyWrong": ["'Seldom' בראש המשפט מחייב inversion, ולכן 'she admits' הוא סדר שגוי.", "ה-s כבר מופיע על 'does', ולכן הפועל העיקרי חייב להיות 'admit' בצורת הבסיס.", "הנושא לא יכול להקדים את 'does' - במשפט הפוך ה-auxiliary ראשון."]}}, {"id": "ivn-004", "area": "inversion-negative", "topic": "little-did-he-know", "difficulty": 2, "type": "cloze", "hardnessSource": "form", "tags": ["inversion", "little", "fixed-phrase", "past-simple"], "sentence": "___ that the company was already bankrupt.", "answers": [["Little did he know"]], "en": {"q": "Complete with the fixed inverted phrase meaning 'he had no idea at the time'. Begin with 'Little' and use the past of 'know'.", "hint": "Four words: the negative degree adverb, the auxiliary, the subject, the bare verb.", "explanation": "'Little' is a negative degree adverbial, so it triggers inversion with do-support: 'Little did he know'. The phrase is almost fixed and is used with verbs of knowing, realising and suspecting."}, "he": {"q": "השלימו בביטוי ההפוך הקבוע שמשמעותו 'הוא לא תיאר לעצמו באותו רגע'. התחילו ב-'Little' והשתמשו בעבר של 'know'.", "hint": "ארבע מילים: תואר הפועל השלילי, ה-auxiliary, הנושא והפועל בצורת הבסיס.", "explanation": "'Little' הוא negative adverbial של מידה, ולכן הוא מחייב inversion עם do-support: 'Little did he know'. זהו ביטוי כמעט קבוע, ומשתמשים בו עם פעלים של ידיעה והבנה."}}, {"id": "ivn-005", "area": "inversion-negative", "topic": "hardly-when", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["inversion", "hardly-when", "past-perfect", "sequence"], "answer": 2, "en": {"q": "Choose the correct beginning: '___ when the fire alarm went off.'", "options": ["Hardly I had sat down", "Hardly did I sit down", "Hardly had I sat down", "Hardly I sat down"], "hint": "Which tense describes the earlier of the two events?", "explanation": "The pattern 'hardly ... when' puts the earlier event in the past perfect and inverts it: 'Hardly had I sat down when the alarm went off.' The 'when' clause stays in the past simple.", "whyWrong": ["A fronted 'hardly' requires inversion, so 'I had' is the wrong order.", "The 'hardly ... when' pattern needs the past perfect, not do-support with the past simple.", "No inversion and no past perfect - both halves of the structure are missing."]}, "he": {"q": "בחרו את הפתיחה הנכונה: '___ when the fire alarm went off.'", "options": ["Hardly I had sat down", "Hardly did I sit down", "Hardly had I sat down", "Hardly I sat down"], "hint": "איזה זמן מתאר את המוקדם מבין שני המאורעות?", "explanation": "התבנית 'hardly ... when' מציבה את המאורע המוקדם ב-past perfect ומהפכת אותו: 'Hardly had I sat down when the alarm went off.' פסוקית ה-'when' נשארת ב-past simple.", "whyWrong": ["'Hardly' בראש המשפט מחייב inversion, ולכן 'I had' הוא סדר שגוי.", "התבנית 'hardly ... when' דורשת past perfect, ולא do-support עם past simple.", "אין כאן לא inversion ולא past perfect - שני המרכיבים של המבנה חסרים."]}}, {"id": "ivn-006", "area": "inversion-negative", "topic": "no-sooner-than", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["inversion", "no-sooner-than", "conjunction", "comparative"], "answer": 3, "en": {"q": "Complete the sentence: 'No sooner had we left the house ___ it started to rain.'", "options": ["when", "that", "then", "than"], "hint": "'Sooner' is a comparative form. Which conjunction follows a comparative?", "explanation": "'No sooner' contains the comparative 'sooner', so the second clause is introduced by 'than': 'No sooner had we left the house than it started to rain.' Only 'hardly' and 'scarcely' take 'when'.", "whyWrong": ["'When' belongs with 'hardly' and 'scarcely', not with the comparative 'no sooner'.", "'That' is not used to link the two clauses of this structure.", "'Then' is an adverb, not a conjunction, and is often confused with 'than' in writing."]}, "he": {"q": "השלימו את המשפט: 'No sooner had we left the house ___ it started to rain.'", "options": ["when", "that", "then", "than"], "hint": "'Sooner' היא צורת השוואה. איזה מילת חיבור באה אחרי comparative?", "explanation": "בביטוי 'no sooner' מופיעה צורת ההשוואה 'sooner', ולכן הפסוקית השנייה נפתחת ב-'than': 'No sooner had we left the house than it started to rain.' רק 'hardly' ו-'scarcely' מקבלים 'when'.", "whyWrong": ["'When' משתלב עם 'hardly' ו-'scarcely', לא עם צורת ההשוואה 'no sooner'.", "'That' לא מחבר בין שתי הפסוקיות במבנה הזה.", "'Then' הוא תואר פועל ולא מילת חיבור, ומתבלבלים בו לעתים קרובות עם 'than' בכתיבה."]}}, {"id": "ivn-007", "area": "inversion-negative", "topic": "not-only-but-also", "difficulty": 1, "type": "cloze", "hardnessSource": "transform", "tags": ["inversion", "not-only-but-also", "do-support", "past-simple"], "sentence": "Not only ___ the exam, but he also got the highest mark.", "answers": [["did he pass"]], "en": {"q": "Complete with the inverted past simple of 'pass', subject 'he'.", "hint": "'He passed' has no auxiliary, so the past form of 'do' appears instead.", "explanation": "'Not only' at the front of a clause is a negative adverbial and triggers inversion: 'He not only passed the exam' becomes 'Not only did he pass the exam'. The second clause keeps ordinary word order."}, "he": {"q": "השלימו ב-past simple הפוך של הפועל 'pass', כשהנושא הוא 'he'.", "hint": "ב-'He passed' אין auxiliary, ולכן מופיעה צורת העבר של 'do'.", "explanation": "'Not only' בראש הפסוקית הוא negative adverbial ומחייב inversion: 'He not only passed the exam' הופך ל-'Not only did he pass the exam'. הפסוקית השנייה שומרת על סדר מילים רגיל."}}, {"id": "ivn-008", "area": "inversion-negative", "topic": "not-until-main-clause", "difficulty": 3, "type": "cloze", "hardnessSource": "concept", "tags": ["inversion", "not-until", "main-clause", "do-support"], "sentence": "Not until the following morning ___ what had really happened.", "answers": [["did we realise", "did we realize"]], "en": {"q": "Complete with the inverted past simple of 'realise', subject 'we'. Either spelling is accepted.", "hint": "The time clause 'the following morning' is not where the inversion goes.", "explanation": "After a fronted 'not until', the inversion appears in the main clause, not in the time expression itself: 'Not until the following morning did we realise...'. The clause after 'not until' keeps ordinary word order."}, "he": {"q": "השלימו ב-past simple הפוך של הפועל 'realise', כשהנושא הוא 'we'. שני האיותים קבילים.", "hint": "ציון הזמן 'the following morning' אינו המקום שבו מתרחש ה-inversion.", "explanation": "אחרי 'not until' בראש המשפט, ה-inversion מתרחש בפסוקית העיקרית ולא בביטוי הזמן עצמו: 'Not until the following morning did we realise...'. הפסוקית שאחרי 'not until' שומרת על סדר מילים רגיל."}}, {"id": "ivn-009", "area": "inversion-negative", "topic": "only-when-which-clause-inverts", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["inversion", "only-when", "main-clause", "subordinate-clause"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["Only when he apologised did she forgive him.", "Only when did he apologise she forgave him.", "Only when he apologised she forgave him.", "Only when did he apologise did she forgive him."], "hint": "Count the clauses, then decide which one changes its word order.", "explanation": "'Only when...' is a restrictive adverbial clause. The clause after 'only when' keeps ordinary word order, and the inversion lands in the main clause that follows: 'Only when he apologised did she forgive him.'", "whyWrong": ["Inverts the 'only when' clause and leaves the main clause uninverted - exactly the wrong way round.", "Keeps ordinary word order in the main clause, where the inversion belongs.", "Inverts both clauses, but only the main clause inverts."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Only when he apologised did she forgive him.", "Only when did he apologise she forgave him.", "Only when he apologised she forgave him.", "Only when did he apologise did she forgive him."], "hint": "ספרו את הפסוקיות, ואז החליטו באיזו מהן משתנה סדר המילים.", "explanation": "'Only when...' היא פסוקית מצמצמת. הפסוקית שאחרי 'only when' שומרת על סדר מילים רגיל, וה-inversion מתרחש בפסוקית העיקרית שבאה אחריה: 'Only when he apologised did she forgive him.'", "whyWrong": ["מהפך את פסוקית ה-'only when' ומשאיר את הפסוקית העיקרית רגילה - בדיוק הפוך.", "שומר על סדר מילים רגיל בפסוקית העיקרית, שבה אמור להתרחש ה-inversion.", "מהפך את שתי הפסוקיות, אבל רק הפסוקית העיקרית מתהפכת."]}}, {"id": "ivn-010", "area": "inversion-negative", "topic": "under-no-circumstances", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["inversion", "under-no-circumstances", "modal", "word-order"], "answer": 1, "en": {"q": "Complete the sentence: 'Under no circumstances ___ the safety barrier.'", "options": ["you should remove", "should you remove", "should you removing", "should remove you"], "hint": "The subject belongs between the modal and the main verb.", "explanation": "'Under no circumstances' is a negative adverbial phrase, so the modal moves in front of the subject: modal + subject + bare infinitive, 'should you remove'.", "whyWrong": ["Ordinary word order after a fronted negative phrase - inversion is obligatory here.", "A modal is always followed by the bare infinitive, so '-ing' is impossible.", "Inverts the wrong pair: the subject must come between the modal and the main verb."]}, "he": {"q": "השלימו את המשפט: 'Under no circumstances ___ the safety barrier.'", "options": ["you should remove", "should you remove", "should you removing", "should remove you"], "hint": "מקום הנושא הוא בין ה-modal לפועל העיקרי.", "explanation": "'Under no circumstances' הוא ביטוי adverbial שלילי, ולכן ה-modal עובר לפני הנושא: modal ואחריו נושא ואחריו הפועל בצורת הבסיס - 'should you remove'.", "whyWrong": ["סדר מילים רגיל אחרי ביטוי שלילה בראש המשפט - כאן ה-inversion הוא חובה.", "אחרי modal בא תמיד הפועל בצורת הבסיס, ולכן '-ing' אינו אפשרי.", "מהפך את הזוג הלא נכון: הנושא חייב להופיע בין ה-modal לפועל העיקרי."]}}, {"id": "ivn-011", "area": "inversion-negative", "topic": "on-no-account-modal-passive", "difficulty": 3, "type": "cloze", "hardnessSource": "form", "tags": ["inversion", "on-no-account", "modal", "passive"], "sentence": "On no account ___ unattended.", "answers": [["must the keys be left"]], "en": {"q": "Complete with the inverted form of 'must be left', subject 'the keys'.", "hint": "Modal, then subject, then the passive infinitive.", "explanation": "In an inverted clause only the first auxiliary moves in front of the subject; the rest of the verb phrase stays together behind it: 'must the keys be left'. 'On no account' is a formal negative adverbial used for strict prohibitions."}, "he": {"q": "השלימו בצורה ההפוכה של 'must be left', כשהנושא הוא 'the keys'.", "hint": "קודם ה-modal, אחריו הנושא, ואחריו הפועל בצורת passive.", "explanation": "במשפט הפוך רק ה-auxiliary הראשון עובר לפני הנושא, ושאר צירוף הפועל נשאר אחריו: 'must the keys be left'. 'On no account' הוא negative adverbial פורמלי המשמש לאיסורים חמורים."}}, {"id": "ivn-012", "area": "inversion-negative", "topic": "at-no-time-be-inverts-alone", "difficulty": 2, "type": "cloze", "hardnessSource": "transform", "tags": ["inversion", "at-no-time", "passive", "no-do-support"], "sentence": "At no time ___ of the risks involved.", "answers": [["was I informed"]], "en": {"q": "Complete with the inverted past passive of 'inform', subject 'I'.", "hint": "There is already a form of 'be' here, so no 'did' is needed.", "explanation": "'Be' is itself an auxiliary, so it inverts directly and do-support is impossible: 'I was never informed' becomes 'At no time was I informed'. 'Did I informed' is not an English form."}, "he": {"q": "השלימו בצורת ה-passive בעבר של הפועל 'inform' בסדר הפוך, כשהנושא הוא 'I'.", "hint": "יש כאן כבר צורה של 'be', ולכן אין צורך ב-'did'.", "explanation": "'Be' הוא auxiliary בעצמו, ולכן הוא מתהפך ישירות ואי אפשר להוסיף do-support: 'I was never informed' הופך ל-'At no time was I informed'. הצורה 'did I informed' אינה קיימת באנגלית."}}, {"id": "ivn-013", "area": "inversion-negative", "topic": "in-no-way-only-auxiliary-inverts", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["inversion", "in-no-way", "prepositional-phrase", "main-verb"], "answer": 2, "en": {"q": "Which sentence is correct in standard written English?", "options": ["In no way this decision reflects our policy.", "In no way this decision does reflect our policy.", "In no way does this decision reflect our policy.", "In no way reflects this decision our policy."], "hint": "A prepositional phrase containing 'no' counts as a negative adverbial.", "explanation": "A prepositional phrase built on 'no' behaves like a negative adverb and triggers inversion. Modern English inverts only the auxiliary, never the main verb, so do-support appears: 'does this decision reflect'.", "whyWrong": ["No inversion at all, although the fronted phrase is negative.", "'Does' must stand before the subject, not after it.", "The main verb itself never inverts with the subject in modern English."]}, "he": {"q": "איזה משפט נכון באנגלית כתובה תקנית?", "options": ["In no way this decision reflects our policy.", "In no way this decision does reflect our policy.", "In no way does this decision reflect our policy.", "In no way reflects this decision our policy."], "hint": "צירוף יחס שמכיל את המילה 'no' נחשב negative adverbial.", "explanation": "צירוף יחס הבנוי על 'no' מתנהג כמו תואר פועל שלילי ומחייב inversion. באנגלית מודרנית מתהפך רק ה-auxiliary ולעולם לא הפועל העיקרי, ולכן נוסף do-support: 'does this decision reflect'.", "whyWrong": ["אין כאן inversion כלל, אף שהצירוף בראש המשפט שלילי.", "'Does' חייב לעמוד לפני הנושא ולא אחריו.", "הפועל העיקרי עצמו לעולם אינו מתהפך עם הנושא באנגלית מודרנית."]}}, {"id": "ivn-014", "area": "inversion-negative", "topic": "nowhere-existential-there", "difficulty": 4, "type": "cloze", "hardnessSource": "concept", "tags": ["inversion", "nowhere", "there-construction", "academic-register"], "sentence": "Nowhere in the report ___ any mention of the missing funds.", "answers": [["is there"]], "en": {"q": "Complete with the inverted present simple of the existential 'there is', agreeing with 'any mention'.", "hint": "In an existential clause, 'there' is the grammatical subject that the verb inverts with.", "explanation": "'Nowhere' is a negative adverbial, so the verb of the existential clause moves in front of its subject 'there': 'There is no mention' becomes 'Nowhere ... is there any mention'. 'Mention' is uncountable here, so the verb is singular."}, "he": {"q": "השלימו בצורת ה-present simple ההפוכה של existential 'there is', בהתאמה ל-'any mention'.", "hint": "במשפט existential, 'there' הוא הנושא הדקדוקי שאיתו מתהפך הפועל.", "explanation": "'Nowhere' הוא negative adverbial, ולכן הפועל של המשפט ה-existential עובר לפני הנושא 'there': 'There is no mention' הופך ל-'Nowhere ... is there any mention'. 'Mention' כאן הוא שם עצם שאינו ניתן למנייה, ולכן הפועל ביחיד."}}, {"id": "ivn-015", "area": "inversion-negative", "topic": "never-before-perfect-passive", "difficulty": 4, "type": "cloze", "hardnessSource": "form", "tags": ["inversion", "never-before", "past-perfect", "passive"], "sentence": "Never before ___ in peacetime.", "answers": [["had such a measure been taken"]], "en": {"q": "Complete with the inverted past perfect passive of 'take', subject 'such a measure'.", "hint": "Only the first auxiliary moves; 'been taken' stays behind the subject.", "explanation": "The auxiliary that inverts is the first one in the verb phrase: 'had' goes before the subject and the rest follows it - 'Never before had such a measure been taken'. The irregular participle is 'taken'."}, "he": {"q": "השלימו בצורת ה-past perfect passive ההפוכה של הפועל 'take', כשהנושא הוא 'such a measure'.", "hint": "רק ה-auxiliary הראשון זז; 'been taken' נשאר אחרי הנושא.", "explanation": "ה-auxiliary שמתהפך הוא הראשון בצירוף הפועל: 'had' עובר לפני הנושא והשאר בא אחריו - 'Never before had such a measure been taken'. צורת ה-participle היוצאת דופן היא 'taken'."}}, {"id": "ivn-016", "area": "inversion-negative", "topic": "only-by-inversion", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["inversion", "only-by", "modal", "restrictive-adverbial"], "sentence": "Only by working together ___ this deadline.", "answers": [["can we meet"]], "en": {"q": "Complete with the inverted form of 'can meet', subject 'we'.", "hint": "The modal goes before the subject, as it does in a question.", "explanation": "'Only by ...' is a restrictive adverbial, so the main clause inverts: modal before subject, 'can we meet'. The phrase after 'only by' is not a clause, so nothing inverts inside it."}, "he": {"q": "השלימו בצורה ההפוכה של 'can meet', כשהנושא הוא 'we'.", "hint": "ה-modal בא לפני הנושא, בדיוק כמו בשאלה.", "explanation": "'Only by ...' הוא adverbial מצמצם, ולכן הפסוקית העיקרית מתהפכת: ה-modal לפני הנושא, 'can we meet'. הצירוף שאחרי 'only by' אינו פסוקית, ולכן שום דבר אינו מתהפך בתוכו."}}, {"id": "ivn-017", "area": "inversion-negative", "topic": "only-is-the-trigger", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["inversion", "only-after", "restrictive-adverbial", "do-support"], "answer": 3, "en": {"q": "Choose the correct sentence.", "options": ["After the meeting did we discuss the budget.", "Only after the meeting we discussed the budget.", "Only after the meeting did we discussed the budget.", "Only after the meeting did we discuss the budget."], "hint": "What exactly triggers the inversion here - the time phrase, or the word in front of it?", "explanation": "Fronting a time phrase changes nothing on its own; it is the restrictive 'only' that triggers inversion. 'After the meeting we discussed the budget' is normal, while 'Only after the meeting did we discuss the budget' must invert.", "whyWrong": ["A plain fronted time phrase does not trigger inversion, so this order is wrong.", "The restrictive 'only' is there, so the main clause must invert.", "'Did' is always followed by the bare infinitive 'discuss', not by a past form."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["After the meeting did we discuss the budget.", "Only after the meeting we discussed the budget.", "Only after the meeting did we discussed the budget.", "Only after the meeting did we discuss the budget."], "hint": "מה בדיוק מפעיל כאן את ה-inversion - ביטוי הזמן, או המילה שלפניו?", "explanation": "הקדמת ביטוי זמן לראש המשפט אינה משנה דבר בפני עצמה; מה שמפעיל את ה-inversion הוא המילה המצמצמת 'only'. המשפט 'After the meeting we discussed the budget' רגיל לגמרי, ואילו 'Only after the meeting did we discuss the budget' חייב inversion.", "whyWrong": ["ביטוי זמן רגיל בראש המשפט אינו מפעיל inversion, ולכן הסדר הזה שגוי.", "המילה המצמצמת 'only' נמצאת כאן, ולכן הפסוקית העיקרית חייבת להתהפך.", "אחרי 'did' בא תמיד הפועל בצורת הבסיס 'discuss' ולא צורת עבר."]}}, {"id": "ivn-018", "area": "inversion-negative", "topic": "only-then", "difficulty": 1, "type": "cloze", "hardnessSource": "form", "tags": ["inversion", "only-then", "do-support", "past-simple"], "sentence": "Only then ___ what she had really meant.", "answers": [["did I understand"]], "en": {"q": "Complete with the inverted past simple of 'understand', subject 'I'.", "hint": "Three words: the past of 'do', the subject, the bare verb.", "explanation": "'Only then' is a restrictive adverbial and takes inversion with do-support: 'Only then did I understand'. Because 'did' carries the tense, the main verb stays in the bare form."}, "he": {"q": "השלימו ב-past simple הפוך של הפועל 'understand', כשהנושא הוא 'I'.", "hint": "שלוש מילים: צורת העבר של 'do', הנושא, והפועל בצורת הבסיס.", "explanation": "'Only then' הוא adverbial מצמצם ולכן מחייב inversion עם do-support: 'Only then did I understand'. מכיוון ש-'did' נושא את הזמן, הפועל העיקרי נשאר בצורת הבסיס."}}, {"id": "ivn-019", "area": "inversion-negative", "topic": "fronted-negative-object", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["inversion", "negative-object", "subject-no-inversion", "do-support"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["Not a word did he say about the accident.", "Not a word he said about the accident.", "Not a word said he about the accident.", "Not a word he did say about the accident."], "hint": "Here the negative phrase is the object of 'say', not the subject.", "explanation": "A fronted negative object triggers inversion with do-support: 'Not a word did he say'. Compare a negative phrase that is the subject - 'Not a single passenger complained' - where nothing is fronted and there is no inversion at all.", "whyWrong": ["Ordinary word order after a fronted negative object, where inversion is obligatory.", "The main verb never inverts with the subject; the auxiliary 'did' has to appear.", "The auxiliary must stand before the subject: 'did he', not 'he did'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Not a word did he say about the accident.", "Not a word he said about the accident.", "Not a word said he about the accident.", "Not a word he did say about the accident."], "hint": "כאן הצירוף השלילי הוא המושא של 'say' ולא הנושא.", "explanation": "מושא שלילי שהוקדם לראש המשפט מחייב inversion עם do-support: 'Not a word did he say'. השוו לצירוף שלילי שהוא הנושא - 'Not a single passenger complained' - שבו שום דבר לא הוקדם ואין inversion בכלל.", "whyWrong": ["סדר מילים רגיל אחרי מושא שלילי שהוקדם, שבו ה-inversion הוא חובה.", "הפועל העיקרי לעולם אינו מתהפך עם הנושא; חייב להופיע ה-auxiliary 'did'.", "ה-auxiliary חייב לעמוד לפני הנושא: 'did he' ולא 'he did'."]}}, {"id": "ivn-020", "area": "inversion-negative", "topic": "fronting-required-for-inversion", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["inversion", "rarely", "mid-position", "word-order"], "answer": 1, "en": {"q": "Which sentence is correct?", "options": ["Rarely he calls his parents.", "He rarely calls his parents.", "Rarely calls he his parents.", "He rarely does calling his parents."], "hint": "Inversion depends on where the adverb stands in the sentence.", "explanation": "An adverb such as 'rarely' in its normal mid position needs no inversion: 'He rarely calls his parents.' Only when it is moved to the front does the clause invert: 'Rarely does he call his parents.'", "whyWrong": ["Once 'rarely' is fronted, the clause must invert: 'Rarely does he call'.", "The main verb never inverts with the subject in modern English.", "'Does' is followed by the bare infinitive, so 'does calling' is not a possible form."]}, "he": {"q": "איזה משפט נכון?", "options": ["Rarely he calls his parents.", "He rarely calls his parents.", "Rarely calls he his parents.", "He rarely does calling his parents."], "hint": "ה-inversion תלוי במקום שבו עומד תואר הפועל במשפט.", "explanation": "תואר פועל כמו 'rarely' במקומו הרגיל באמצע המשפט אינו דורש inversion: 'He rarely calls his parents.' רק כשהוא מוקדם לראש המשפט הפסוקית מתהפכת: 'Rarely does he call his parents.'", "whyWrong": ["ברגע ש-'rarely' עובר לראש המשפט, הפסוקית חייבת להתהפך: 'Rarely does he call'.", "הפועל העיקרי לעולם אינו מתהפך עם הנושא באנגלית מודרנית.", "אחרי 'does' בא הפועל בצורת הבסיס, ולכן 'does calling' אינה צורה אפשרית."]}}, {"id": "ivc-001", "area": "inversion-conditional", "topic": "had-i-known-type3", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["inverted-conditional", "type-3", "had", "drop-if"], "answer": 2, "en": {"q": "Which sentence rewrites 'If I had known, I would have come' with inversion?", "options": ["If I would have known, I would have come.", "Would I have known, I would have come.", "Had I known, I would have come.", "If had I known, I would have come."], "hint": "You take out 'if' and move one auxiliary to the front.", "explanation": "A type 3 conditional can drop 'if' and invert instead: 'If I had known' becomes 'Had I known'. The auxiliary that moves is the one from the if-clause, which is 'had'.", "whyWrong": ["'Would' never appears in the if-clause of a conditional.", "'Would' belongs to the result clause; the auxiliary that inverts is 'had'.", "When you invert you must drop 'if' completely - the two cannot appear together."]}, "he": {"q": "איזה משפט כותב מחדש את 'If I had known, I would have come' בעזרת inversion?", "options": ["If I would have known, I would have come.", "Would I have known, I would have come.", "Had I known, I would have come.", "If had I known, I would have come."], "hint": "מוציאים את 'if' ומעבירים auxiliary אחד לראש המשפט.", "explanation": "ב-conditional type 3 אפשר להשמיט את 'if' ולהשתמש ב-inversion במקומו: 'If I had known' הופך ל-'Had I known'. ה-auxiliary שעובר לראש הוא זה של פסוקית ה-if, כלומר 'had'.", "whyWrong": ["'Would' לא מופיע לעולם בפסוקית ה-if של משפט תנאי.", "'Would' שייך לפסוקית התוצאה; ה-auxiliary שמתהפך הוא 'had'.", "כשמשתמשים ב-inversion חייבים להשמיט את 'if' לגמרי - השניים אינם יכולים להופיע יחד."]}}, {"id": "ivc-002", "area": "inversion-conditional", "topic": "were-i-you", "difficulty": 1, "type": "cloze", "hardnessSource": "form", "tags": ["inverted-conditional", "type-2", "were", "advice"], "sentence": "___, I would not sign that contract.", "answers": [["Were I you"]], "en": {"q": "Complete with the inverted form of 'If I were you' (three words).", "hint": "Drop 'if' and put the subjunctive form of 'be' first.", "explanation": "A type 2 conditional with 'be' inverts by dropping 'if' and putting 'were' before the subject: 'If I were you' becomes 'Were I you'. The form is 'were' for every person, never 'was'."}, "he": {"q": "השלימו בצורה ההפוכה של 'If I were you' (שלוש מילים).", "hint": "משמיטים את 'if' ומציבים בראש את צורת ה-subjunctive של 'be'.", "explanation": "משפט תנאי type 2 עם 'be' מתהפך על ידי השמטת 'if' והצבת 'were' לפני הנושא: 'If I were you' הופך ל-'Were I you'. הצורה היא 'were' בכל הגופים, לעולם לא 'was'."}}, {"id": "ivc-003", "area": "inversion-conditional", "topic": "should-you-need", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["inverted-conditional", "should", "type-1", "polite-register"], "answer": 3, "en": {"q": "Which sentence means 'If you need any help, call this number'?", "options": ["Do you need any help, call this number.", "Would you need any help, call this number.", "If should you need any help, call this number.", "Should you need any help, call this number."], "hint": "One particular modal is used to invert an open condition.", "explanation": "An open (type 1) condition can be inverted with 'should' + subject + bare infinitive: 'Should you need any help, call this number.' It sounds slightly more formal and makes the condition feel less likely.", "whyWrong": ["'Do' is never used to introduce an inverted conditional.", "'Would' belongs to the result clause and cannot open a conditional.", "'If' must be dropped when you invert; the two are never combined."]}, "he": {"q": "איזה משפט מביע את המשמעות של 'If you need any help, call this number'?", "options": ["Do you need any help, call this number.", "Would you need any help, call this number.", "If should you need any help, call this number.", "Should you need any help, call this number."], "hint": "יש modal אחד מסוים שמשמש להיפוך תנאי פתוח.", "explanation": "תנאי פתוח (type 1) יכול להתהפך בעזרת 'should' ואחריו הנושא והפועל בצורת הבסיס: 'Should you need any help, call this number.' הצורה פורמלית יותר ומציגה את התנאי כפחות סביר.", "whyWrong": ["'Do' לא משמש לעולם לפתיחת משפט תנאי הפוך.", "'Would' שייך לפסוקית התוצאה ואינו יכול לפתוח משפט תנאי.", "חייבים להשמיט את 'if' כשמשתמשים ב-inversion; השניים לא באים יחד."]}}, {"id": "ivc-004", "area": "inversion-conditional", "topic": "if-to-inverted-transform", "difficulty": 2, "type": "cloze", "hardnessSource": "transform", "tags": ["inverted-conditional", "type-3", "transform", "had"], "sentence": "___ earlier, we would have avoided the traffic.", "answers": [["Had we left"]], "en": {"q": "Rewrite 'If we had left earlier' without 'if'. Start with 'Had'.", "hint": "'Had' takes the place of 'if', and the subject follows it.", "explanation": "Inverting a type 3 conditional means deleting 'if' and moving 'had' in front of the subject: 'If we had left' becomes 'Had we left'. The past participle 'left' does not change."}, "he": {"q": "כתבו מחדש את 'If we had left earlier' בלי 'if'. התחילו ב-'Had'.", "hint": "'Had' תופס את מקומו של 'if', והנושא בא אחריו.", "explanation": "היפוך של conditional type 3 פירושו מחיקת 'if' והעברת 'had' לפני הנושא: 'If we had left' הופך ל-'Had we left'. צורת ה-participle, 'left', אינה משתנה."}}, {"id": "ivc-005", "area": "inversion-conditional", "topic": "no-contraction-in-inversion", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["inverted-conditional", "negative", "contraction", "had-i-not"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["Had I not seen the contract, I would have refused.", "Hadn't I seen the contract, I would have refused.", "Have I not seen the contract, I would have refused.", "Did I not see the contract, I would have refused."], "hint": "Where does 'not' go, and can it be glued to the auxiliary?", "explanation": "In an inverted conditional the negative is never contracted: you write 'Had I not seen', with 'not' after the subject. 'Hadn't I...' can only be a question.", "whyWrong": ["The auxiliary is never contracted with 'not' in an inverted conditional.", "'Have' gives a present perfect, which cannot express an unreal past condition.", "'Did' is never used to open an inverted conditional clause."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Had I not seen the contract, I would have refused.", "Hadn't I seen the contract, I would have refused.", "Have I not seen the contract, I would have refused.", "Did I not see the contract, I would have refused."], "hint": "איפה ממוקמת המילה 'not', והאם אפשר להצמיד אותה ל-auxiliary?", "explanation": "במשפט תנאי הפוך אין קיצור של השלילה: כותבים 'Had I not seen', כש-'not' בא אחרי הנושא. הצורה 'Hadn't I...' יכולה להיות שאלה בלבד.", "whyWrong": ["ה-auxiliary לא מתקצר עם 'not' במשפט תנאי הפוך.", "'Have' יוצר present perfect, שאינו יכול לבטא תנאי לא ממשי בעבר.", "'Did' לא משמש לעולם לפתיחת פסוקית תנאי הפוכה."]}}, {"id": "ivc-006", "area": "inversion-conditional", "topic": "were-it-not-for", "difficulty": 2, "type": "cloze", "hardnessSource": "form", "tags": ["inverted-conditional", "were-it-not-for", "fixed-phrase", "type-2"], "sentence": "___ it not for your support, I would have given up long ago.", "answers": [["Were"]], "en": {"q": "Complete with the single word that turns 'if it were not for' into its inverted form.", "hint": "The subjunctive of 'be', used for every person.", "explanation": "'If it were not for X' inverts to 'Were it not for X'. The fixed phrase introduces the one thing that keeps the unreal result from happening, and it uses 'were' regardless of the subject."}, "he": {"q": "השלימו במילה אחת שהופכת את 'if it were not for' לצורתו ההפוכה.", "hint": "צורת ה-subjunctive של 'be', שמשמשת בכל הגופים.", "explanation": "'If it were not for X' הופך ל-'Were it not for X'. הביטוי הקבוע מציג את הדבר האחד שמונע את התוצאה הלא ממשית, ומשתמשים בו ב-'were' ללא קשר לנושא."}}, {"id": "ivc-007", "area": "inversion-conditional", "topic": "which-auxiliaries-can-invert", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["inverted-conditional", "were-had-should", "main-verb", "restriction"], "answer": 1, "en": {"q": "Which sentence is a correct inverted conditional?", "options": ["Knew I the answer, I would tell you.", "Should the weather improve, we will go ahead.", "Came he earlier, we would have started.", "Wanted you to join us, you would be welcome."], "hint": "Only three words in English can open a conditional this way.", "explanation": "Only 'were', 'had' and 'should' can replace 'if' by inversion. An ordinary main verb can never be fronted this way, so you must keep 'if': 'If I knew the answer...'.", "whyWrong": ["'Knew' is a main verb, and main verbs cannot open an inverted conditional.", "'Came' is a main verb; this needs 'Had he come earlier'.", "'Wanted' is a main verb; this needs 'Should you wish to join us'."]}, "he": {"q": "איזה משפט הוא משפט תנאי הפוך תקני?", "options": ["Knew I the answer, I would tell you.", "Should the weather improve, we will go ahead.", "Came he earlier, we would have started.", "Wanted you to join us, you would be welcome."], "hint": "רק שלוש מילים באנגלית יכולות לפתוח משפט תנאי בדרך הזאת.", "explanation": "רק 'were', 'had' ו-'should' יכולים להחליף את 'if' באמצעות inversion. פועל עיקרי רגיל לא יכול לעבור לראש המשפט כך, ולכן חייבים לשמור על 'if': 'If I knew the answer...'.", "whyWrong": ["'Knew' הוא פועל עיקרי, ופעלים עיקריים אינם יכולים לפתוח משפט תנאי הפוך.", "'Came' הוא פועל עיקרי; כאן נדרש 'Had he come earlier'.", "'Wanted' הוא פועל עיקרי; כאן נדרש 'Should you wish to join us'."]}}, {"id": "ivc-008", "area": "inversion-conditional", "topic": "had-it-not-been-for", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["inverted-conditional", "had-it-not-been-for", "type-3", "result-clause"], "sentence": "Had it not been for the rain, we ___ the match.", "answers": [["would have finished", "would've finished"]], "en": {"q": "Complete the result clause with 'finish' in the form required by a type 3 conditional.", "hint": "An unreal past result uses 'would' plus a perfect infinitive.", "explanation": "'Had it not been for X' is the inverted form of 'If it had not been for X' and sets up an unreal past. The result clause therefore takes 'would have' plus the past participle: 'would have finished'."}, "he": {"q": "השלימו את פסוקית התוצאה בפועל 'finish' בצורה שנדרשת ב-conditional type 3.", "hint": "תוצאה לא ממשית בעבר משתמשת ב-'would' ואחריו perfect infinitive.", "explanation": "'Had it not been for X' היא הצורה ההפוכה של 'If it had not been for X' ומציבה עבר לא ממשי. לכן פסוקית התוצאה מקבלת 'would have' ואחריו ה-participle: 'would have finished'."}}, {"id": "ivc-009", "area": "inversion-conditional", "topic": "mixed-conditional-inverted", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["inverted-conditional", "mixed-conditional", "present-result", "had"], "answer": 2, "en": {"q": "Complete the sentence: 'Had she taken the job in Madrid, she ___ there now.'", "options": ["would have lived", "has been living", "would be living", "is living"], "hint": "The condition is in the past, but the result belongs to today.", "explanation": "A mixed conditional can also be inverted: 'Had she taken the job' is an unreal past, while 'now' places the result in the present, so the result clause is 'would be living'.", "whyWrong": ["'Would have lived' puts the result in the past, which clashes with 'now'.", "A present perfect cannot be the result of an unreal condition.", "A plain present tense cannot be the result of an unreal condition - 'would' is needed."]}, "he": {"q": "השלימו את המשפט: 'Had she taken the job in Madrid, she ___ there now.'", "options": ["would have lived", "has been living", "would be living", "is living"], "hint": "התנאי בעבר, אבל התוצאה שייכת להיום.", "explanation": "גם mixed conditional יכול להתהפך: 'Had she taken the job' הוא עבר לא ממשי, והמילה 'now' ממקמת את התוצאה בהווה, ולכן פסוקית התוצאה היא 'would be living'.", "whyWrong": ["'Would have lived' מציב את התוצאה בעבר, וזה מתנגש עם 'now'.", "present perfect אינו יכול להיות התוצאה של תנאי לא ממשי.", "זמן הווה פשוט אינו יכול להיות התוצאה של תנאי לא ממשי - נדרש 'would'."]}}, {"id": "ivc-010", "area": "inversion-conditional", "topic": "result-clause-stays-direct", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["inverted-conditional", "result-clause", "over-application", "word-order"], "answer": 3, "en": {"q": "Choose the correct sentence.", "options": ["Had we left earlier, would we have arrived on time.", "Had we left earlier, we had arrived on time.", "Would we have left earlier, we would have arrived.", "Had we left earlier, we would have arrived on time."], "hint": "Only one of the two clauses changes its word order.", "explanation": "The inversion replaces 'if' in the condition only. The result clause keeps ordinary subject-verb order: 'we would have arrived', never 'would we have arrived'.", "whyWrong": ["The result clause is not a question, so it keeps ordinary word order.", "The result clause needs 'would have', not a second past perfect.", "'Would' cannot replace 'had' in the inverted condition."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Had we left earlier, would we have arrived on time.", "Had we left earlier, we had arrived on time.", "Would we have left earlier, we would have arrived.", "Had we left earlier, we would have arrived on time."], "hint": "רק אחת משתי הפסוקיות משנה את סדר המילים שלה.", "explanation": "ה-inversion מחליף את 'if' בפסוקית התנאי בלבד. פסוקית התוצאה שומרת על סדר רגיל של נושא ופועל: 'we would have arrived' ולא 'would we have arrived'.", "whyWrong": ["פסוקית התוצאה אינה שאלה, ולכן היא שומרת על סדר מילים רגיל.", "פסוקית התוצאה דורשת 'would have' ולא past perfect נוסף.", "'Would' אינו יכול להחליף את 'had' בפסוקית התנאי ההפוכה."]}}, {"id": "ivc-011", "area": "inversion-conditional", "topic": "should-negative-inverted", "difficulty": 3, "type": "cloze", "hardnessSource": "form", "tags": ["inverted-conditional", "should", "negative", "formal-notice"], "sentence": "___ you not wish to attend, please notify the office in advance.", "answers": [["Should"]], "en": {"q": "Complete with the single auxiliary that gives the inverted form of 'if you do not wish'.", "hint": "The same modal is used for open conditions in formal notices.", "explanation": "'If you do not wish' inverts to 'Should you not wish': the modal comes first, then the subject, then 'not' and the bare infinitive. As always in inverted conditionals, there is no contraction."}, "he": {"q": "השלימו ב-auxiliary אחד שיוצר את הצורה ההפוכה של 'if you do not wish'.", "hint": "אותו modal משמש לתנאים פתוחים בהודעות פורמליות.", "explanation": "'If you do not wish' הופך ל-'Should you not wish': קודם ה-modal, אחריו הנושא, ואחריו 'not' והפועל בצורת הבסיס. כמו בכל משפט תנאי הפוך, אין כאן קיצור."}}, {"id": "ivc-012", "area": "inversion-conditional", "topic": "register-formality", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["inverted-conditional", "register", "formal-writing", "should"], "answer": 0, "en": {"q": "You are writing a formal letter to a client. Which sentence fits that register?", "options": ["Should you require further information, please contact us.", "If you'll need more info, just give us a ring.", "Do you require further information, please contact us.", "You require further information, please contact us."], "hint": "Inverted conditionals belong to careful, formal writing.", "explanation": "Inversion without 'if' raises the register, which is why 'Should you require...' is standard in formal correspondence. The same idea with 'if' is perfectly correct but noticeably more everyday.", "whyWrong": ["Informal vocabulary, and 'will' cannot be used inside an if-clause.", "'Do' cannot introduce a conditional clause.", "Two clauses joined with no conjunction and no inversion - the condition is unmarked."]}, "he": {"q": "אתם כותבים מכתב פורמלי ללקוח. איזה משפט מתאים למשלב הזה?", "options": ["Should you require further information, please contact us.", "If you'll need more info, just give us a ring.", "Do you require further information, please contact us.", "You require further information, please contact us."], "hint": "משפטי תנאי הפוכים שייכים לכתיבה פורמלית ומוקפדת.", "explanation": "inversion בלי 'if' מעלה את המשלב, ולכן 'Should you require...' הוא הנוסח המקובל בהתכתבות פורמלית. אותו תוכן עם 'if' תקין לחלוטין אך יומיומי בהרבה.", "whyWrong": ["אוצר מילים לא פורמלי, ובנוסף אי אפשר להשתמש ב-'will' בתוך פסוקית if.", "'Do' אינו יכול לפתוח פסוקית תנאי.", "שתי פסוקיות שחוברו בלי מילת חיבור ובלי inversion - התנאי אינו מסומן."]}}, {"id": "ivc-013", "area": "inversion-conditional", "topic": "were-to-infinitive", "difficulty": 4, "type": "cloze", "hardnessSource": "form", "tags": ["inverted-conditional", "were-to", "hypothetical", "formal-register"], "sentence": "Were the government ___ income tax, the protests would spread.", "answers": [["to raise"]], "en": {"q": "Complete with 'raise' in the form required after 'were' in a hypothetical inverted conditional.", "hint": "'Were' is followed here by an infinitive with 'to'.", "explanation": "'If the government were to raise taxes' inverts to 'Were the government to raise taxes'. The 'were + to-infinitive' pattern presents a future event as purely hypothetical and belongs to formal register."}, "he": {"q": "השלימו בפועל 'raise' בצורה הנדרשת אחרי 'were' במשפט תנאי הפוך היפותטי.", "hint": "אחרי 'were' בא כאן infinitive עם 'to'.", "explanation": "'If the government were to raise taxes' הופך ל-'Were the government to raise taxes'. התבנית 'were + to-infinitive' מציגה מאורע עתידי כהיפותטי לגמרי ושייכת למשלב פורמלי."}}, {"id": "ivc-014", "area": "inversion-conditional", "topic": "mixed-inverted-present-result", "difficulty": 4, "type": "cloze", "hardnessSource": "transform", "tags": ["inverted-conditional", "mixed-conditional", "result-clause", "present-result"], "sentence": "Had the merger gone ahead, thousands of jobs ___ at risk today.", "answers": [["would be"]], "en": {"q": "Complete with 'be' in the form required for a present result (mixed conditional).", "hint": "'Today' tells you the result is not in the past.", "explanation": "The inverted 'Had the merger gone ahead' sets up an unreal past, but 'today' places the result in the present, so the result clause is 'would be' rather than 'would have been'."}, "he": {"q": "השלימו בפועל 'be' בצורה הנדרשת לתוצאה בהווה (mixed conditional).", "hint": "המילה 'today' מלמדת שהתוצאה אינה בעבר.", "explanation": "הפתיחה ההפוכה 'Had the merger gone ahead' מציבה עבר לא ממשי, אבל 'today' ממקם את התוצאה בהווה, ולכן פסוקית התוצאה היא 'would be' ולא 'would have been'."}}, {"id": "ivo-001", "area": "inversion-other", "topic": "here-pronoun-no-inversion", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["inversion", "here-there", "pronoun-subject", "word-order"], "answer": 1, "en": {"q": "Choose the correct sentence.", "options": ["Here comes she, right on time.", "Here she comes, right on time.", "Here does she come, right on time.", "Here is coming she, right on time."], "hint": "What kind of subject is 'she'?", "explanation": "After 'here' and 'there' a full noun subject follows the verb - 'Here comes the bus' - but a pronoun subject stays in front of it: 'Here she comes.' This exception applies to all fronted place adverbials.", "whyWrong": ["A pronoun subject is never placed after the verb in this pattern.", "Do-support is not used in this kind of inversion at all.", "Both the word order and the continuous form are impossible here."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Here comes she, right on time.", "Here she comes, right on time.", "Here does she come, right on time.", "Here is coming she, right on time."], "hint": "איזה סוג של נושא היא המילה 'she'?", "explanation": "אחרי 'here' ו-'there' נושא שהוא שם עצם מלא בא אחרי הפועל - 'Here comes the bus' - אבל נושא שהוא כינוי גוף נשאר לפניו: 'Here she comes.' החריג הזה תקף בכל התיאורים המקומיים שהוקדמו לראש המשפט.", "whyWrong": ["נושא שהוא כינוי גוף לא מופיע לעולם אחרי הפועל בתבנית הזאת.", "do-support אינו משמש כלל ב-inversion מהסוג הזה.", "גם סדר המילים וגם צורת ה-continuous בלתי אפשריים כאן."]}}, {"id": "ivo-002", "area": "inversion-other", "topic": "neither-do-i", "difficulty": 1, "type": "cloze", "hardnessSource": "form", "tags": ["inversion", "neither-nor", "short-answer", "agreement"], "sentence": "A: I do not like horror films. B: ___.", "answers": [["Neither do I", "Nor do I"]], "en": {"q": "Complete B's reply with a three-word inverted agreement meaning 'I also do not'.", "hint": "The reply copies the auxiliary from A's sentence and puts it before the subject.", "explanation": "To agree with a negative statement you use 'Neither' or 'Nor' plus the inverted auxiliary: 'Neither do I.' The auxiliary matches A's sentence, so 'do' here, and no second negative word is added."}, "he": {"q": "השלימו את תשובתו של B בשלוש מילים בסדר הפוך, במשמעות 'גם אני לא'.", "hint": "התשובה לוקחת את ה-auxiliary מהמשפט של A ומציבה אותו לפני הנושא.", "explanation": "להסכמה עם משפט שלילי משתמשים ב-'Neither' או ב-'Nor' ואחריהם ה-auxiliary בסדר הפוך: 'Neither do I.' ה-auxiliary מותאם למשפט של A, כאן 'do', ואין מוסיפים מילת שלילה נוספת."}}, {"id": "ivo-003", "area": "inversion-other", "topic": "matching-the-auxiliary", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["inversion", "neither", "modal", "short-answer"], "answer": 2, "en": {"q": "A says: 'I can't drive.' Choose B's reply meaning 'me neither'.", "options": ["So can I.", "Neither do I.", "Neither can I.", "Neither I can."], "hint": "Copy the auxiliary that A actually used.", "explanation": "These short replies repeat A's own auxiliary and invert it. A used the modal 'can', so the reply is 'Neither can I.' 'So' is used for agreeing with positive statements only.", "whyWrong": ["'So' agrees with a positive statement, but A's sentence is negative.", "'Do' does not match A's auxiliary, which is the modal 'can'.", "The auxiliary must come before the subject: 'Neither can I'."]}, "he": {"q": "A אומר: 'I can't drive.' בחרו את תשובתו של B במשמעות 'גם אני לא'.", "options": ["So can I.", "Neither do I.", "Neither can I.", "Neither I can."], "hint": "העתיקו את ה-auxiliary שהופיע בפועל אצל A.", "explanation": "התשובות הקצרות האלה חוזרות על ה-auxiliary של A ומהפכות אותו. A השתמש ב-modal 'can', ולכן התשובה היא 'Neither can I.' המילה 'so' משמשת להסכמה עם משפטים חיוביים בלבד.", "whyWrong": ["'So' מביע הסכמה עם משפט חיובי, אבל המשפט של A שלילי.", "'Do' אינו מתאים ל-auxiliary של A, שהוא ה-modal 'can'.", "ה-auxiliary חייב לבוא לפני הנושא: 'Neither can I'."]}}, {"id": "ivo-004", "area": "inversion-other", "topic": "fronted-place-adverbial", "difficulty": 1, "type": "cloze", "hardnessSource": "concept", "tags": ["inversion", "place-adverbial", "past-simple", "verb-subject-order"], "sentence": "On the hill ___ an old stone castle.", "answers": [["stood"]], "en": {"q": "Complete with the past simple of 'stand'. Note the order: the subject comes after the verb.", "hint": "No auxiliary is added in this kind of inversion.", "explanation": "After a fronted place adverbial the whole verb can precede the subject: 'An old stone castle stood on the hill' becomes 'On the hill stood an old stone castle'. No do-support is used in this pattern."}, "he": {"q": "השלימו ב-past simple של הפועל 'stand'. שימו לב לסדר: הנושא בא אחרי הפועל.", "hint": "ב-inversion מהסוג הזה לא מוסיפים auxiliary.", "explanation": "אחרי תיאור מקום שהוקדם לראש המשפט, הפועל כולו יכול להקדים את הנושא: 'An old stone castle stood on the hill' הופך ל-'On the hill stood an old stone castle'. בתבנית הזאת אין do-support."}}, {"id": "ivo-005", "area": "inversion-other", "topic": "embedded-question-no-inversion", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["embedded-question", "no-inversion", "indirect-question", "word-order"], "answer": 3, "en": {"q": "Choose the correct sentence.", "options": ["Do you know where is the station?", "Do you know where is it the station?", "I wonder where is he now.", "Do you know where the station is?"], "hint": "The inversion belongs to the main question only, not to the clause after 'where'.", "explanation": "An embedded question is a noun clause, not a question, so it keeps ordinary subject-verb order: 'where the station is', 'where he is now'. Only the outer question inverts.", "whyWrong": ["The embedded clause must keep ordinary order: 'where the station is'.", "Adds both an inversion and a repeated subject in the embedded clause.", "The same mistake after 'I wonder' - it should be 'where he is now'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Do you know where is the station?", "Do you know where is it the station?", "I wonder where is he now.", "Do you know where the station is?"], "hint": "ה-inversion שייך לשאלה הראשית בלבד, לא לפסוקית שאחרי 'where'.", "explanation": "שאלה משובצת (embedded question) היא פסוקית שם ולא שאלה, ולכן היא שומרת על סדר רגיל של נושא ופועל: 'where the station is', 'where he is now'. רק השאלה החיצונית מתהפכת.", "whyWrong": ["הפסוקית המשובצת חייבת לשמור על סדר רגיל: 'where the station is'.", "מוסיף גם inversion וגם נושא כפול בפסוקית המשובצת.", "אותה טעות אחרי 'I wonder' - צריך להיות 'where he is now'."]}}, {"id": "ivo-006", "area": "inversion-other", "topic": "fronted-direction-verb-subject", "difficulty": 2, "type": "cloze", "hardnessSource": "transform", "tags": ["inversion", "direction-adverbial", "verb-subject-order", "past-simple"], "sentence": "Round the corner ___ on bicycles.", "answers": [["came two police officers"]], "en": {"q": "Complete with the past simple of 'come' and the subject 'two police officers', in the order required after a fronted direction phrase.", "hint": "Verb first, subject second - with no auxiliary.", "explanation": "A fronted direction phrase puts the whole verb before its subject: 'Two police officers came round the corner' becomes 'Round the corner came two police officers'. This narrative pattern is used with verbs of movement and position."}, "he": {"q": "השלימו ב-past simple של הפועל 'come' ובנושא 'two police officers', בסדר הנדרש אחרי ביטוי כיוון שהוקדם לראש המשפט.", "hint": "קודם הפועל, אחריו הנושא - ובלי auxiliary.", "explanation": "ביטוי כיוון בראש המשפט מציב את הפועל כולו לפני הנושא: 'Two police officers came round the corner' הופך ל-'Round the corner came two police officers'. התבנית הסיפורית הזאת משמשת עם פעלי תנועה ומצב."}}, {"id": "ivo-007", "area": "inversion-other", "topic": "so-adjective-that", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["inversion", "so-that", "fronting", "result-clause"], "answer": 3, "en": {"q": "Which sentence is correct?", "options": ["So loud the music was that nobody could sleep.", "So loud was that the music nobody could sleep.", "So the music was loud that nobody could sleep.", "So loud was the music that nobody could sleep."], "hint": "'So' and the adjective travel to the front together, and the verb follows them.", "explanation": "When 'so + adjective' is fronted for emphasis, the verb comes before the subject: 'The music was so loud that...' becomes 'So loud was the music that...'. The 'that' clause stays at the end.", "whyWrong": ["The fronting is right, but the clause is not inverted.", "'That' is in the wrong place - it introduces the result clause at the end.", "'So' has been separated from the adjective it belongs to."]}, "he": {"q": "איזה משפט נכון?", "options": ["So loud the music was that nobody could sleep.", "So loud was that the music nobody could sleep.", "So the music was loud that nobody could sleep.", "So loud was the music that nobody could sleep."], "hint": "'So' ושם התואר עוברים יחד לראש המשפט, והפועל בא אחריהם.", "explanation": "כשמקדימים 'so + adjective' לראש המשפט לשם הדגשה, הפועל בא לפני הנושא: 'The music was so loud that...' הופך ל-'So loud was the music that...'. פסוקית ה-'that' נשארת בסוף.", "whyWrong": ["ההקדמה נכונה, אבל הפסוקית לא התהפכה.", "'That' במקום הלא נכון - הוא פותח את פסוקית התוצאה בסוף.", "'So' הופרד משם התואר שאליו הוא שייך."]}}, {"id": "ivo-008", "area": "inversion-other", "topic": "such-was-that", "difficulty": 2, "type": "cloze", "hardnessSource": "form", "tags": ["inversion", "such-that", "be", "agreement"], "sentence": "Such ___ his anger that he walked out of the meeting.", "answers": [["was"]], "en": {"q": "Complete with the past simple of 'be', agreeing with 'his anger'.", "hint": "The real subject stands after the verb, so check its number there.", "explanation": "'Such + be + subject + that' is an emphatic fronting pattern: 'His anger was such that...' becomes 'Such was his anger that...'. The verb agrees with the postponed subject 'his anger', which is singular."}, "he": {"q": "השלימו ב-past simple של הפועל 'be', בהתאמה ל-'his anger'.", "hint": "הנושא האמיתי עומד אחרי הפועל, ולכן שם צריך לבדוק את המספר.", "explanation": "'Such + be + subject + that' היא תבנית הקדמה מודגשת: 'His anger was such that...' הופך ל-'Such was his anger that...'. הפועל מותאם לנושא שנדחה לאחור, 'his anger', שהוא יחיד."}}, {"id": "ivo-009", "area": "inversion-other", "topic": "nor-clause-inversion", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["inversion", "nor", "double-negative", "do-support"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["She did not phone, nor did she write.", "She did not phone, nor she wrote.", "She did not phone, nor she did write.", "She did not phone, nor did not she write."], "hint": "'Nor' already carries the negative meaning.", "explanation": "'Nor' joins a second negative clause and forces inversion with an auxiliary: 'nor did she write'. Since 'nor' is itself negative, no further 'not' is used.", "whyWrong": ["'Nor' requires inversion, so 'she wrote' is the wrong order.", "The subject cannot stand before the auxiliary in a 'nor' clause.", "'Nor' is already negative, so adding 'not' creates a double negative."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["She did not phone, nor did she write.", "She did not phone, nor she wrote.", "She did not phone, nor she did write.", "She did not phone, nor did not she write."], "hint": "המילה 'nor' נושאת בעצמה את משמעות השלילה.", "explanation": "'Nor' מחבר פסוקית שלילית שנייה ומחייב inversion עם auxiliary: 'nor did she write'. מכיוון ש-'nor' שלילי בעצמו, לא מוסיפים 'not' נ
