וסף.", "whyWrong": ["'Nor' מחייב inversion, ולכן 'she wrote' הוא סדר שגוי.", "הנושא אינו יכול לעמוד לפני ה-auxiliary בפסוקית 'nor'.", "'Nor' שלילי כבר, ולכן הוספת 'not' יוצרת שלילה כפולה."]}}, {"id": "ivo-010", "area": "inversion-other", "topic": "there-construction-agreement", "difficulty": 3, "type": "cloze", "hardnessSource": "concept", "tags": ["there-construction", "agreement", "real-subject", "present-simple"], "sentence": "There ___ several questions that the report leaves unanswered.", "answers": [["remain"]], "en": {"q": "Complete with the present simple of 'remain', agreeing with the real subject of the sentence.", "hint": "'There' is only a placeholder; find the noun that the verb really agrees with.", "explanation": "In a there-construction the real subject follows the verb, and agreement is with that subject, not with 'there'. 'Several questions' is plural, so the verb is 'remain'."}, "he": {"q": "השלימו ב-present simple של הפועל 'remain', בהתאמה לנושא האמיתי של המשפט.", "hint": "'There' הוא רק מחזיק מקום; מצאו את שם העצם שאיתו הפועל באמת מותאם.", "explanation": "במבנה there-construction הנושא האמיתי בא אחרי הפועל, וההתאמה היא אליו ולא ל-'there'. 'Several questions' הוא רבים, ולכן הפועל הוא 'remain'."}}, {"id": "ivo-011", "area": "inversion-other", "topic": "subject-question-no-do-support", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["questions", "subject-question", "do-support", "who"], "answer": 2, "en": {"q": "Choose the correct question.", "options": ["Who did wrote this report?", "Who this report wrote?", "Who wrote this report?", "Whom did write this report?"], "hint": "Is 'who' the subject or the object of 'write' here?", "explanation": "When the question word is the subject, there is nothing to invert and no 'do' is added: 'Who wrote this report?' Do-support appears only in object questions, such as 'What did she write?'.", "whyWrong": ["'Did' is followed by the bare infinitive, and a subject question needs no 'did' at all.", "No English question uses this word order.", "'Whom' marks an object, and the subject question takes no 'did'."]}, "he": {"q": "בחרו את השאלה הנכונה.", "options": ["Who did wrote this report?", "Who this report wrote?", "Who wrote this report?", "Whom did write this report?"], "hint": "האם 'who' הוא הנושא או המושא של 'write' כאן?", "explanation": "כשמילת השאלה היא הנושא, אין מה להפוך ולא מוסיפים 'do': 'Who wrote this report?' do-support מופיע רק בשאלות על המושא, כמו 'What did she write?'.", "whyWrong": ["אחרי 'did' בא הפועל בצורת הבסיס, ובשאלה על הנושא אין צורך ב-'did' כלל.", "אין באנגלית שאלה בסדר המילים הזה.", "'Whom' מסמן מושא, ובשאלה על הנושא אין 'did'."]}}, {"id": "ivo-012", "area": "inversion-other", "topic": "so-adverb-do-support", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["inversion", "so-that", "adverb-fronting", "do-support"], "sentence": "So fiercely ___ that the tent collapsed.", "answers": [["did the wind blow"]], "en": {"q": "Complete with the inverted past simple of 'blow', subject 'the wind'.", "hint": "There is no auxiliary in 'the wind blew', so one has to be supplied.", "explanation": "Fronting 'so + adverb' triggers inversion, and because the clause has no auxiliary, do-support is added: 'The wind blew so fiercely' becomes 'So fiercely did the wind blow'. With 'so + adjective + be' no 'do' is needed."}, "he": {"q": "השלימו ב-past simple הפוך של הפועל 'blow', כשהנושא הוא 'the wind'.", "hint": "ב-'the wind blew' אין auxiliary, ולכן צריך לספק אחד.", "explanation": "הקדמת 'so + adverb' מחייבת inversion, ומכיוון שאין בפסוקית auxiliary מוסיפים do-support: 'The wind blew so fiercely' הופך ל-'So fiercely did the wind blow'. בתבנית 'so + adjective + be' אין צורך ב-'do'."}}, {"id": "ivo-013", "area": "inversion-other", "topic": "comparative-inversion", "difficulty": 4, "type": "cloze", "hardnessSource": "form", "tags": ["inversion", "comparative", "than", "academic-register"], "sentence": "The treated group recovered far more quickly than ___ the control group.", "answers": [["did"]], "en": {"q": "Complete with the one auxiliary that produces formal inversion after 'than' (past simple).", "hint": "The auxiliary stands for the repeated verb 'recovered'.", "explanation": "In formal and academic writing the clause after 'than' may invert: 'than did the control group' instead of 'than the control group did'. The auxiliary replaces the repeated verb, and the subject follows it."}, "he": {"q": "השלימו ב-auxiliary אחד שיוצר inversion פורמלי אחרי 'than' (past simple).", "hint": "ה-auxiliary מחליף את הפועל החוזר 'recovered'.", "explanation": "בכתיבה פורמלית ואקדמית הפסוקית שאחרי 'than' יכולה להתהפך: 'than did the control group' במקום 'than the control group did'. ה-auxiliary מחליף את הפועל החוזר, והנושא בא אחריו."}}, {"id": "ivo-014", "area": "inversion-other", "topic": "so-am-i-vs-so-i-am", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["inversion", "so", "meaning-contrast", "short-answer"], "answer": 0, "en": {"q": "A says: 'Daniel is very generous.' Which reply means that YOU are generous too?", "options": ["So am I.", "So he is.", "So I am.", "So is he."], "hint": "Here the inversion changes the meaning, not just the style.", "explanation": "With 'so', inversion adds a new subject to the statement ('So am I' = I am generous too), while direct order confirms what was said ('So he is' = yes, that is true of him).", "whyWrong": ["'So he is' confirms what A said about Daniel; it adds nobody.", "'So I am' confirms a remark made about you; it does not add you to A's statement.", "'So is he' points at Daniel again rather than at you."]}, "he": {"q": "A אומר: 'Daniel is very generous.' איזו תשובה אומרת שגם אתם נדיבים?", "options": ["So am I.", "So he is.", "So I am.", "So is he."], "hint": "כאן ה-inversion משנה את המשמעות, לא רק את הסגנון.", "explanation": "עם 'so', ה-inversion מוסיף נושא חדש למשפט ('So am I' = גם אני נדיב), ואילו סדר מילים רגיל מאשר את מה שנאמר ('So he is' = נכון, זה אכן כך לגביו).", "whyWrong": ["'So he is' מאשר את מה ש-A אמר על דניאל ואינו מוסיף אף אחד.", "'So I am' מאשר הערה שנאמרה עליכם ואינו מצרף אתכם למשפט של A.", "'So is he' מצביע שוב על דניאל ולא עליכם."]}}, {"id": "ivo-015", "area": "inversion-other", "topic": "there-with-other-verbs", "difficulty": 4, "type": "cloze", "hardnessSource": "form", "tags": ["there-construction", "seem", "formal-register", "present-simple"], "sentence": "There ___ to be little doubt that the policy has failed.", "answers": [["seems"]], "en": {"q": "Complete with the present simple of 'seem' in the existential 'there' pattern.", "hint": "In this pattern the verb agrees with 'there' plus the singular 'little doubt'.", "explanation": "The existential 'there' is not limited to 'be': verbs such as 'seem', 'appear', 'exist' and 'remain' also occur, often with a following infinitive - 'There seems to be little doubt'. 'Doubt' is uncountable here, so the verb is singular."}, "he": {"q": "השלימו ב-present simple של הפועל 'seem' בתבנית ה-existential של 'there'.", "hint": "בתבנית הזאת הפועל מותאם ל-'little doubt' שביחיד.", "explanation": "ה-'there' ה-existential אינו מוגבל ל-'be': מופיעים אחריו גם פעלים כמו 'seem', 'appear', 'exist' ו-'remain', לעתים עם infinitive - 'There seems to be little doubt'. 'Doubt' כאן אינו ניתן למנייה, ולכן הפועל ביחיד."}}, {"id": "ivo-016", "area": "inversion-other", "topic": "fronted-participle-inversion", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["inversion", "fronted-participle", "agreement", "formal-email"], "answer": 1, "en": {"q": "Choose the correct sentence for a formal email.", "options": ["Attached the documents you requested are.", "Attached are the documents you requested.", "Attached is the documents you requested.", "Are attached the documents you requested."], "hint": "The subject is everything that follows the verb.", "explanation": "A fronted participle such as 'attached' or 'enclosed' is followed by the verb and then the real subject: 'Attached are the documents you requested.' The verb agrees with that postponed subject.", "whyWrong": ["The verb must follow the fronted participle, not close the sentence.", "Wrong agreement: the real subject 'the documents' is plural.", "Verb-first order belongs to questions, not to this pattern."]}, "he": {"q": "בחרו את המשפט הנכון למייל פורמלי.", "options": ["Attached the documents you requested are.", "Attached are the documents you requested.", "Attached is the documents you requested.", "Are attached the documents you requested."], "hint": "הנושא הוא כל מה שבא אחרי הפועל.", "explanation": "אחרי participle שהוקדם לראש המשפט, כמו 'attached' או 'enclosed', בא הפועל ואחריו הנושא האמיתי: 'Attached are the documents you requested.' הפועל מותאם לנושא שנדחה לאחור.", "whyWrong": ["הפועל חייב לבוא אחרי ה-participle שהוקדם, ולא לסגור את המשפט.", "התאמה שגויה: הנושא האמיתי 'the documents' הוא רבים.", "סדר שמתחיל בפועל שייך לשאלות ולא לתבנית הזאת."]}}, {"id": "agb-001", "area": "agreement-basics", "topic": "third-person-s", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["agreement", "present-simple", "third-person-s"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["My brother works at a bank in Haifa.", "My brother work at a bank in Haifa.", "My brother is work at a bank in Haifa.", "My brother working at a bank in Haifa."], "hint": "In the present simple a third-person singular subject adds -s to the verb.", "explanation": "In the present simple, 'he', 'she', 'it' and every singular noun take the -s form: 'my brother works'. The bare form 'work' belongs to I, you, we and they.", "whyWrong": ["Drops the third-person -s, which a singular subject always requires.", "'is' plus a bare verb is not a tense in English: use 'works' or 'is working'.", "An -ing form cannot be the verb on its own; it needs 'is' in front of it."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["My brother works at a bank in Haifa.", "My brother work at a bank in Haifa.", "My brother is work at a bank in Haifa.", "My brother working at a bank in Haifa."], "hint": "ב-present simple נושא בגוף שלישי יחיד מקבל -s בפועל.", "explanation": "ב-present simple הנושאים 'he', 'she', 'it' וכל שם עצם ביחיד מקבלים את צורת ה-s: 'my brother works'. צורת הבסיס 'work' שייכת ל-I, you, we, they.", "whyWrong": ["משמיט את ה-s של גוף שלישי, שנושא ביחיד תמיד דורש.", "'is' עם צורת הבסיס איננו זמן קיים באנגלית: צריך 'works' או 'is working'.", "צורת -ing אינה יכולה לשמש פועל לבד; היא דורשת 'is' לפניה."]}}, {"id": "agb-002", "area": "agreement-basics", "topic": "there-is-there-are", "difficulty": 1, "type": "cloze", "hardnessSource": "concept", "tags": ["agreement", "there-is", "there-are", "existential"], "sentence": "There ___ three new restaurants on our street.", "answers": [["are"]], "en": {"q": "Complete the sentence with the present simple of 'be'.", "hint": "In a 'there' sentence the verb agrees with the noun that comes after it.", "explanation": "'There' is only a placeholder, so the verb takes its number from the real subject that follows: 'three new restaurants' is plural, so the verb is 'are'. Compare 'There is one new restaurant'."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'be'.", "hint": "במשפט עם 'there' הפועל מתאים לשם העצם שבא אחריו.", "explanation": "'There' הוא רק מילת פתיחה, ולכן הפועל מקבל את המספר מהנושא האמיתי שבא אחריו: 'three new restaurants' הוא רבים, ולכן 'are'. השוו: 'There is one new restaurant'."}}, {"id": "agb-003", "area": "agreement-basics", "topic": "subject-plus-prepositional-phrase", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["agreement", "prepositional-phrase", "head-noun"], "answer": 1, "en": {"q": "Choose the correct sentence.", "options": ["The box of old letters were in the attic.", "The box of old letters was in the attic.", "The box of old letters are in the attic.", "The boxes of old letters was in the attic."], "hint": "Find the head noun: what exactly was in the attic?", "explanation": "The verb agrees with the head noun of the subject, not with the last noun before it. The subject here is 'the box' (singular); 'of old letters' is only a modifier, so the verb is 'was'.", "whyWrong": ["Agrees with 'letters', the nearest noun, instead of with the real subject 'the box'.", "Same mistake in the present: the plural 'are' is pulled in by 'letters'.", "Here the subject really is plural ('boxes'), so the singular 'was' is wrong."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["The box of old letters were in the attic.", "The box of old letters was in the attic.", "The box of old letters are in the attic.", "The boxes of old letters was in the attic."], "hint": "זהו את גרעין הנושא: מה בדיוק היה בעליית הגג?", "explanation": "הפועל מתאים לגרעין הנושא ולא לשם העצם הקרוב אליו. הנושא כאן הוא 'the box' ביחיד, ו-'of old letters' הוא רק תיאור, ולכן הפועל הוא 'was'.", "whyWrong": ["מתאים את הפועל ל-'letters', שם העצם הקרוב, במקום לנושא האמיתי 'the box'.", "אותה טעות בהווה: הרבים 'are' נגרר אחרי 'letters'.", "כאן הנושא אכן ברבים ('boxes'), ולכן 'was' ביחיד שגוי."]}}, {"id": "agb-004", "area": "agreement-basics", "topic": "do-does-questions", "difficulty": 1, "type": "cloze", "hardnessSource": "form", "tags": ["agreement", "questions", "auxiliary", "do-support"], "sentence": "___ your sister still work at the hospital?", "answers": [["does"]], "en": {"q": "Complete the question with the correct present simple auxiliary (do / does).", "hint": "The -s moves to the auxiliary, so the main verb stays in its bare form.", "explanation": "In present simple questions the auxiliary carries the agreement: a third-person singular subject takes 'does', and the main verb then stays bare - 'Does your sister work?', never 'Does your sister works?'."}, "he": {"q": "השלימו את השאלה ב-auxiliary הנכון של ה-present simple (do / does).", "hint": "ה-s עובר ל-auxiliary, ולכן הפועל העיקרי נשאר בצורת הבסיס.", "explanation": "בשאלות ב-present simple ה-auxiliary הוא זה שנושא את ההתאמה: נושא בגוף שלישי יחיד דורש 'does', והפועל העיקרי נשאר בצורת הבסיס - 'Does your sister work?' ולא 'Does your sister works?'."}}, {"id": "agb-005", "area": "agreement-basics", "topic": "doesnt-dont-negatives", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "negatives", "auxiliary", "present-simple"], "answer": 2, "en": {"q": "Choose the correct sentence.", "options": ["My neighbour don't speak English at all.", "My neighbour doesn't speaks English at all.", "My neighbour doesn't speak English at all.", "My neighbour not speaks English at all."], "hint": "Only one word in the sentence may show the agreement.", "explanation": "A present simple negative needs 'do/does' + 'not' + the bare verb. The singular subject puts the -s on the auxiliary ('doesn't'), so the main verb stays 'speak'.", "whyWrong": ["'don't' goes with I, you, we and they; a singular subject takes 'doesn't'.", "Marks the agreement twice: after 'doesn't' the verb must be bare.", "A present simple negative cannot be built without the auxiliary 'does'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["My neighbour don't speak English at all.", "My neighbour doesn't speaks English at all.", "My neighbour doesn't speak English at all.", "My neighbour not speaks English at all."], "hint": "רק מילה אחת במשפט רשאית לסמן את ההתאמה.", "explanation": "שלילה ב-present simple בנויה מ-'do/does' + 'not' + צורת הבסיס. הנושא ביחיד מעביר את ה-s ל-auxiliary ('doesn't'), ולכן הפועל נשאר 'speak'.", "whyWrong": ["'don't' מתאים ל-I, you, we, they; נושא ביחיד דורש 'doesn't'.", "מסמן את ההתאמה פעמיים: אחרי 'doesn't' הפועל חייב להיות בצורת הבסיס.", "אי אפשר לבנות שלילה ב-present simple בלי ה-auxiliary 'does'."]}}, {"id": "agb-006", "area": "agreement-basics", "topic": "has-have-questions", "difficulty": 2, "type": "cloze", "hardnessSource": "transform", "tags": ["agreement", "questions", "present-perfect", "auxiliary"], "sentence": "___ the list of approved candidates been published yet?", "answers": [["has"]], "en": {"q": "Turn this into a present perfect question: complete it with the correct auxiliary (have / has).", "hint": "The subject is 'the list', not 'candidates'.", "explanation": "In a present perfect question the auxiliary comes first and agrees with the head noun of the subject. 'The list' is singular, so it is 'Has the list ... been published?' - the plural 'candidates' inside the modifier changes nothing."}, "he": {"q": "הפכו את המשפט לשאלה ב-present perfect: השלימו את ה-auxiliary הנכון (have / has).", "hint": "הנושא הוא 'the list' ולא 'candidates'.", "explanation": "בשאלה ב-present perfect ה-auxiliary בא ראשון ומתאים לגרעין הנושא. 'The list' הוא יחיד, ולכן 'Has the list ... been published?' - הרבים 'candidates' שבתוך התיאור לא משנה דבר."}}, {"id": "agb-007", "area": "agreement-basics", "topic": "gerund-subject", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["agreement", "gerund-subject", "singular-verb"], "answer": 3, "en": {"q": "Choose the correct sentence.", "options": ["Reading long novels in English are good practice.", "Reading long novels in English were good practice.", "To read long novels in English are good practice.", "Reading long novels in English is good practice."], "hint": "The subject is one activity, however many nouns it mentions.", "explanation": "A gerund (-ing) subject names a single activity and always takes a singular verb, even when a plural noun follows it: 'Reading long novels is good practice'.", "whyWrong": ["Agrees with 'novels'; the subject is the activity 'reading', which is singular.", "Same number mistake, and the past tense does not fit a general statement.", "An infinitive subject is also singular, so 'are' is wrong here too."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Reading long novels in English are good practice.", "Reading long novels in English were good practice.", "To read long novels in English are good practice.", "Reading long novels in English is good practice."], "hint": "הנושא הוא פעולה אחת, גם אם מוזכרים בו שמות עצם ברבים.", "explanation": "נושא שהוא gerund (צורת -ing) מתאר פעולה אחת ותמיד דורש פועל ביחיד, גם כשאחריו שם עצם ברבים: 'Reading long novels is good practice'.", "whyWrong": ["מתאים את הפועל ל-'novels'; הנושא הוא הפעולה 'reading', שהיא יחיד.", "אותה טעות במספר, ובנוסף זמן עבר שאינו מתאים לקביעה כללית.", "גם נושא בצורת infinitive הוא יחיד, ולכן 'are' שגוי גם כאן."]}}, {"id": "agb-008", "area": "agreement-basics", "topic": "infinitive-subject", "difficulty": 3, "type": "cloze", "hardnessSource": "concept", "tags": ["agreement", "infinitive-subject", "singular-verb"], "sentence": "To admit a serious mistake in public ___ real courage.", "answers": [["takes"]], "en": {"q": "Complete the sentence with the present simple of 'take'.", "hint": "An infinitive subject behaves like 'it', not like the nouns inside it.", "explanation": "An infinitive phrase used as a subject counts as one thing and takes a singular verb: 'To admit a mistake takes courage'. The nouns inside the phrase never control the verb."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'take'.", "hint": "נושא בצורת infinitive מתנהג כמו 'it' ולא כמו שמות העצם שבתוכו.", "explanation": "צירוף infinitive בתפקיד נושא נחשב דבר אחד ודורש פועל ביחיד: 'To admit a mistake takes courage'. שמות העצם שבתוך הצירוף אינם קובעים את הפועל."}}, {"id": "agb-009", "area": "agreement-basics", "topic": "subject-not-complement", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["agreement", "complement", "linking-verb"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["The main problem with the plan is the costs.", "The main problem with the plan are the costs.", "The main problem with the plan were the costs.", "The main problem with the plan have been the costs."], "hint": "A linking verb agrees with the subject on its left, never with the complement.", "explanation": "With 'be' the verb agrees with the subject, not with the complement that follows. 'The main problem' is singular, so it stays 'is' even though 'the costs' is plural. You may of course reverse it: 'The costs are the main problem'.", "whyWrong": ["Agrees with the complement 'the costs' instead of the subject 'the problem'.", "The same mistake in the past tense; the subject still needs a singular verb.", "Plural 'have been' again follows the complement; 'has been' would be the correct form."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["The main problem with the plan is the costs.", "The main problem with the plan are the costs.", "The main problem with the plan were the costs.", "The main problem with the plan have been the costs."], "hint": "פועל מקשר מתאים לנושא שלפניו ולא להשלמה שאחריו.", "explanation": "עם הפועל 'be' ההתאמה היא לנושא ולא להשלמה שבאה אחריו. 'The main problem' הוא יחיד, ולכן נשאר 'is' גם כש-'the costs' ברבים. אפשר כמובן להפוך: 'The costs are the main problem'.", "whyWrong": ["מתאים את הפועל להשלמה 'the costs' במקום לנושא 'the problem'.", "אותה טעות בזמן עבר; הנושא עדיין דורש פועל ביחיד.", "שוב רבים 'have been' בעקבות ההשלמה; הצורה הנכונה היא 'has been'."]}}, {"id": "agb-010", "area": "agreement-basics", "topic": "inverted-order-fronted-phrase", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["agreement", "inversion", "fronted-phrase", "word-order"], "sentence": "Behind the old library ___ two small cafés.", "answers": [["are"]], "en": {"q": "Complete the sentence with the present simple of 'be'. Note that the subject comes after the verb.", "hint": "Ask yourself what 'is' or 'are' there: the answer is the subject.", "explanation": "When a place phrase is fronted, the subject moves behind the verb, but it still controls the agreement. The subject is 'two small cafés' (plural), so the verb is 'are', not the singular pulled in by 'library'."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'be'. שימו לב שהנושא בא אחרי הפועל.", "hint": "שאלו את עצמכם מה נמצא שם: התשובה היא הנושא.", "explanation": "כשצירוף מקום עובר לראש המשפט, הנושא עובר אל מאחורי הפועל אך ממשיך לקבוע את ההתאמה. הנושא הוא 'two small cafés' ברבים, ולכן 'are' ולא צורת היחיד שנגררת אחרי 'library'."}}, {"id": "agb-011", "area": "agreement-basics", "topic": "as-well-as-additive", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "as-well-as", "additive-phrase"], "answer": 1, "en": {"q": "Choose the correct sentence.", "options": ["The manager, as well as her assistants, are late.", "The manager, as well as her assistants, is late.", "The manager, as well as her assistants, were late.", "The manager, as well as her assistants, have left."], "hint": "'as well as' is not the same as 'and'.", "explanation": "Phrases such as 'as well as', 'along with', 'together with' and 'in addition to' add information but do not make the subject plural. The subject stays 'the manager', so the verb is singular. Only 'and' would give you 'The manager and her assistants are late'.", "whyWrong": ["Treats 'as well as her assistants' like 'and her assistants' and makes the verb plural.", "The same number mistake in the past tense.", "Plural 'have' again; with this subject it would have to be 'has left'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["The manager, as well as her assistants, are late.", "The manager, as well as her assistants, is late.", "The manager, as well as her assistants, were late.", "The manager, as well as her assistants, have left."], "hint": "'as well as' אינו שווה ל-'and'.", "explanation": "צירופים כמו 'as well as', 'along with', 'together with' ו-'in addition to' מוסיפים מידע אך אינם הופכים את הנושא לרבים. הנושא נשאר 'the manager', ולכן הפועל ביחיד. רק 'and' היה נותן 'The manager and her assistants are late'.", "whyWrong": ["מתייחס ל-'as well as her assistants' כאילו היה 'and her assistants' ומרבה את הפועל.", "אותה טעות במספר, בזמן עבר.", "שוב רבים 'have'; עם נושא כזה הצורה הנדרשת היא 'has left'."]}}, {"id": "agb-012", "area": "agreement-basics", "topic": "long-modifier-between-subject-and-verb", "difficulty": 4, "type": "cloze", "hardnessSource": "transform", "tags": ["agreement", "participial-modifier", "academic-register", "present-simple"], "sentence": "The conclusions presented in the final chapter of the report ___ the earlier findings.", "answers": [["contradict"]], "en": {"q": "Complete the sentence with the present simple of 'contradict'.", "hint": "Strip out everything between the subject and the verb and the number becomes obvious.", "explanation": "A long participial modifier ('presented in the final chapter of the report') does not change the subject. The head noun is the plural 'the conclusions', so the verb takes no -s: 'The conclusions ... contradict'."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'contradict'.", "hint": "הורידו בדמיון את כל מה שמופיע בין הנושא לפועל, והמספר יתברר מיד.", "explanation": "תיאור ארוך בצורת participle ('presented in the final chapter of the report') אינו משנה את הנושא. גרעין הנושא הוא 'the conclusions' ברבים, ולכן הפועל בלי -s: 'The conclusions ... contradict'."}}, {"id": "agb-013", "area": "agreement-basics", "topic": "there-has-there-have-been", "difficulty": 4, "type": "mcq", "hardnessSource": "form", "tags": ["agreement", "there-is", "present-perfect", "form"], "answer": 2, "en": {"q": "Choose the correct sentence.", "options": ["There has been three serious accidents this year.", "There was three serious accidents this year.", "There have been three serious accidents this year.", "There has had three serious accidents this year."], "hint": "The noun after the verb decides between 'has been' and 'have been'.", "explanation": "The existential 'there' takes its number from the following noun phrase, in every tense. 'Three serious accidents' is plural, so the present perfect form is 'there have been'. Compare 'There has been one accident'.", "whyWrong": ["Singular 'has been' with a plural noun phrase - the most common slip in this structure.", "The same number mistake in the past simple, and the period 'this year' calls for the present perfect.", "'there' is never followed by 'has had' in this sense; the verb must be a form of 'be'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["There has been three serious accidents this year.", "There was three serious accidents this year.", "There have been three serious accidents this year.", "There has had three serious accidents this year."], "hint": "שם העצם שאחרי הפועל הוא שמכריע בין 'has been' ל-'have been'.", "explanation": "ה-'there' הקיומי מקבל את המספר מצירוף השם שבא אחריו, בכל זמן. 'Three serious accidents' הוא רבים, ולכן הצורה ב-present perfect היא 'there have been'. השוו: 'There has been one accident'.", "whyWrong": ["יחיד 'has been' מול צירוף שם ברבים - הטעות הנפוצה ביותר במבנה הזה.", "אותה טעות במספר ב-past simple, ובנוסף 'this year' מחייב present perfect.", "אחרי 'there' במשמעות הזאת לא בא 'has had'; הפועל חייב להיות צורה של 'be'."]}}, {"id": "agb-014", "area": "agreement-basics", "topic": "compound-subject-with-and", "difficulty": 2, "type": "cloze", "hardnessSource": "trap", "tags": ["agreement", "compound-subject", "negatives", "auxiliary"], "sentence": "The director and the lead actor ___ not agree about the ending.", "answers": [["do"]], "en": {"q": "Complete the negative sentence with the present simple auxiliary 'do'.", "hint": "Count the people: two singular nouns joined by 'and' make a plural subject.", "explanation": "Two singular nouns joined by 'and' form a plural subject, so the auxiliary is 'do', not 'does' - the singular noun standing next to the verb must not mislead you."}, "he": {"q": "השלימו את משפט השלילה ב-auxiliary 'do' ב-present simple.", "hint": "ספרו את האנשים: שני שמות עצם ביחיד המחוברים ב-'and' יוצרים נושא ברבים.", "explanation": "שני שמות עצם ביחיד המחוברים ב-'and' יוצרים נושא ברבים, ולכן ה-auxiliary הוא 'do' ולא 'does' - אל תיתנו לשם העצם ביחיד שצמוד לפועל להטעות אתכם."}}, {"id": "agt-001", "area": "agreement-tricky", "topic": "news-singular", "difficulty": 1, "type": "cloze", "hardnessSource": "trap", "tags": ["agreement", "uncountable", "news", "false-plural"], "sentence": "The news from the hospital ___ encouraging this morning.", "answers": [["is"]], "en": {"q": "Complete the sentence with the present simple of 'be'.", "hint": "'news' ends in -s but is not a plural noun.", "explanation": "'News' is uncountable and always takes a singular verb: 'The news is good'. There is no form 'a news' or 'newses'; for one item you say 'a piece of news'."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'be'.", "hint": "'news' מסתיים ב-s אך אינו שם עצם ברבים.", "explanation": "'News' הוא שם עצם שאינו ניתן למנייה ותמיד דורש פועל ביחיד: 'The news is good'. אין צורה 'a news' או 'newses'; לידיעה אחת אומרים 'a piece of news'."}}, {"id": "agt-002", "area": "agreement-tricky", "topic": "information-uncountable", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["agreement", "uncountable", "information"], "answer": 3, "en": {"q": "Choose the correct sentence.", "options": ["The informations you sent me were very useful.", "The informations you sent me was very useful.", "The information you sent me were very useful.", "The information you sent me was very useful."], "hint": "This noun has no plural form at all in English.", "explanation": "'Information' is uncountable: it has no plural -s and takes a singular verb. For a countable unit use 'a piece of information' or 'two pieces of information'.", "whyWrong": ["'informations' does not exist, and the verb has been made plural to match it.", "'informations' does not exist, even though the verb here is singular.", "The noun is right, but an uncountable noun cannot take the plural verb 'were'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["The informations you sent me were very useful.", "The informations you sent me was very useful.", "The information you sent me were very useful.", "The information you sent me was very useful."], "hint": "לשם העצם הזה אין בכלל צורת רבים באנגלית.", "explanation": "'Information' אינו ניתן למנייה: אין לו -s של רבים והוא דורש פועל ביחיד. ליחידה בודדת אומרים 'a piece of information' או 'two pieces of information'.", "whyWrong": ["הצורה 'informations' אינה קיימת, והפועל הורבה בעקבותיה.", "הצורה 'informations' אינה קיימת, גם אם הפועל כאן ביחיד.", "שם העצם נכון, אבל שם עצם שאינו ניתן למנייה אינו יכול לקבל את פועל הרבים 'were'."]}}, {"id": "agt-003", "area": "agreement-tricky", "topic": "people-plural-verb", "difficulty": 1, "type": "cloze", "hardnessSource": "concept", "tags": ["agreement", "people", "irregular-plural"], "sentence": "Many people ___ that the law will be changed next year.", "answers": [["believe"]], "en": {"q": "Complete the sentence with the present simple of 'believe'.", "hint": "'people' is the plural of 'person', so it needs a plural verb.", "explanation": "'People' is an irregular plural and takes a plural verb with no -s: 'people believe', 'people are'. 'The people is' is always wrong; 'peoples' exists only in the sense of nations."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'believe'.", "hint": "'people' הוא צורת הרבים של 'person', ולכן הוא דורש פועל ברבים.", "explanation": "'People' הוא רבים חריג ודורש פועל ברבים בלי -s: 'people believe', 'people are'. הצורה 'the people is' שגויה תמיד, ו-'peoples' קיים רק במשמעות של עמים."}}, {"id": "agt-004", "area": "agreement-tricky", "topic": "police-plural-verb", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["agreement", "police", "collective-noun"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["The police are still looking for the driver.", "The police is still looking for the driver.", "The polices are still looking for the driver.", "The police still looking for the driver."], "hint": "This noun refers to the officers, so English counts it as plural.", "explanation": "'The police' always takes a plural verb in English: 'The police are investigating'. For one officer you say 'a police officer'; the form 'polices' does not exist.", "whyWrong": ["'The police is' is one of the most frequent agreement errors; the noun is plural.", "'police' has no plural -s, because the word is already plural in meaning.", "The sentence has no auxiliary: a continuous form needs 'are' before 'looking'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["The police are still looking for the driver.", "The police is still looking for the driver.", "The polices are still looking for the driver.", "The police still looking for the driver."], "hint": "שם העצם מתייחס לשוטרים, ולכן האנגלית מתייחסת אליו כרבים.", "explanation": "'The police' דורש תמיד פועל ברבים באנגלית: 'The police are investigating'. לשוטר אחד אומרים 'a police officer', והצורה 'polices' אינה קיימת.", "whyWrong": ["'The police is' היא אחת מטעויות ההתאמה הנפוצות ביותר; שם העצם הוא רבים.", "ל-'police' אין -s של רבים, כי המילה כבר רבים מבחינת המשמעות.", "במשפט אין auxiliary: צורת continuous דורשת 'are' לפני 'looking'."]}}, {"id": "agt-005", "area": "agreement-tricky", "topic": "collective-noun-british-american", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "collective-noun", "british-american", "government"], "answer": 1, "en": {"q": "Which sentence follows standard American usage?", "options": ["The government have decided to raise taxes.", "The government has decided to raise taxes.", "The governments has decided to raise taxes.", "The government having decided to raise taxes."], "hint": "American English treats a collective noun as one body.", "explanation": "Collective nouns such as 'government', 'team', 'staff' and 'committee' take a singular verb in American English and may take a plural one in British English, where the members are in focus. In an American text, write 'The government has decided'.", "whyWrong": ["This is the British option; American English prefers the singular verb here.", "The plural noun 'governments' cannot take the singular verb 'has'.", "'having decided' is a participle, so this is a fragment with no finite verb."]}, "he": {"q": "איזה משפט מתאים לשימוש התקני באנגלית אמריקאית?", "options": ["The government have decided to raise taxes.", "The government has decided to raise taxes.", "The governments has decided to raise taxes.", "The government having decided to raise taxes."], "hint": "באנגלית אמריקאית שם עצם קולקטיבי נתפס כגוף אחד.", "explanation": "שמות עצם קולקטיביים כמו 'government', 'team', 'staff' ו-'committee' דורשים פועל ביחיד באנגלית אמריקאית, ויכולים לקבל פועל ברבים באנגלית בריטית, כשהדגש הוא על החברים. בטקסט אמריקאי כתבו 'The government has decided'.", "whyWrong": ["זו האפשרות הבריטית; אנגלית אמריקאית מעדיפה כאן פועל ביחיד.", "שם העצם ברבים 'governments' אינו יכול לקבל את פועל היחיד 'has'.", "'having decided' הוא participle, ולכן זהו שבר משפט בלי פועל נטוי."]}}, {"id": "agt-006", "area": "agreement-tricky", "topic": "each-of-plus-plural", "difficulty": 2, "type": "cloze", "hardnessSource": "concept", "tags": ["agreement", "quantifier", "each", "every"], "sentence": "Each of the applicants ___ a short written test before the interview.", "answers": [["takes"]], "en": {"q": "Complete the sentence with the present simple of 'take'.", "hint": "'each' picks out the members one at a time.", "explanation": "'Each' and 'every' are singular, even when a plural noun follows: 'Each of the applicants takes a test', 'Every student has a number'. The plural noun after 'of' never controls the verb."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'take'.", "hint": "'each' מתייחס לחברי הקבוצה אחד-אחד.", "explanation": "'Each' ו-'every' הם יחיד, גם כשבא אחריהם שם עצם ברבים: 'Each of the applicants takes a test', 'Every student has a number'. שם העצם ברבים שאחרי 'of' אינו קובע את הפועל."}}, {"id": "agt-007", "area": "agreement-tricky", "topic": "neither-of-singular", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "quantifier", "neither", "double-negation"], "answer": 2, "en": {"q": "Choose the sentence that is correct in formal written English.", "options": ["Neither of my brothers haven't finished school.", "Neither of my brothers have finished school.", "Neither of my brothers has finished school.", "Neither of my brothers has finish school."], "hint": "'neither' means 'not one of the two'.", "explanation": "'Neither of' and 'either of' are singular in formal written English, because they refer to one member at a time: 'Neither of my brothers has finished'. 'Neither' is also already negative, so no second negative is needed.", "whyWrong": ["Double negation: 'neither' is already negative, so 'haven't' is one negative too many.", "The plural verb is heard in speech, but formal written English requires the singular after 'neither of'.", "After 'has' you need the past participle 'finished', not the bare form."]}, "he": {"q": "בחרו את המשפט הנכון באנגלית כתובה ופורמלית.", "options": ["Neither of my brothers haven't finished school.", "Neither of my brothers have finished school.", "Neither of my brothers has finished school.", "Neither of my brothers has finish school."], "hint": "'neither' פירושו 'אף אחד מהשניים לא'.", "explanation": "'Neither of' ו-'either of' הם יחיד באנגלית כתובה ופורמלית, כי הם מתייחסים לחבר אחד בכל פעם: 'Neither of my brothers has finished'. בנוסף, 'neither' כבר שולל, ולכן אין צורך בשלילה נוספת.", "whyWrong": ["שלילה כפולה: 'neither' כבר שולל, ולכן 'haven't' הוא שלילה מיותרת.", "פועל הרבים נשמע בדיבור, אך באנגלית כתובה ופורמלית נדרש יחיד אחרי 'neither of'.", "אחרי 'has' נדרש past participle, כלומר 'finished' ולא צורת הבסיס."]}}, {"id": "agt-008", "area": "agreement-tricky", "topic": "plural-only-nouns", "difficulty": 2, "type": "cloze", "hardnessSource": "form", "tags": ["agreement", "plural-only", "scissors", "trousers"], "sentence": "These scissors ___ too blunt to cut thick p : 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "statistics", "academic-register", "meaning-based"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["Statistics is hard, but his statistics are unreliable.", "Statistics are hard, but his statistics is unreliable.", "Statistics are hard, but his statistics are unreliable.", "Statistics is hard, but his statistics is unreliable."], "hint": "The same word can name a field or a set of figures.", "explanation": "'Statistics' is singular when it names the discipline and plural when it means the individual figures: 'Statistics is a hard subject' but 'These statistics are unreliable'. 'Politics' behaves the same way: 'Politics is dirty' against 'His politics are extreme'.", "whyWrong": ["Reverses both uses: the discipline needs a singular verb and the figures a plural one.", "Treats the name of the discipline as plural.", "Treats the countable figures as if they were the name of the discipline."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Statistics is hard, but his statistics are unreliable.", "Statistics are hard, but his statistics is unreliable.", "Statistics are hard, but his statistics are unreliable.", "Statistics is hard, but his statistics is unreliable."], "hint": "אותה מילה יכולה לציין תחום ידע או אוסף נתונים.", "explanation": "'Statistics' הוא יחיד כשהוא שם של תחום הידע, ורבים כשהכוונה לנתונים עצמם: 'Statistics is a hard subject' אבל 'These statistics are unreliable'. 'Politics' מתנהג באותו אופן: 'Politics is dirty' מול 'His politics are extreme'.", "whyWrong": ["הופך את שני השימושים: התחום דורש פועל ביחיד והנתונים פועל ברבים.", "מתייחס לשם תחום הידע כאילו היה רבים.", "מתייחס לנתונים הניתנים למנייה כאילו היו שם של תחום ידע."]}}, {"id": "agt-018", "area": "agreement-tricky", "topic": "uncountable-research-academic", "difficulty": 4, "type": "cloze", "hardnessSource": "form", "tags": ["agreement", "uncountable", "research", "academic-register"], "sentence": "Very little research ___ been carried out on this question so far.", "answers": [["has"]], "en": {"q": "Complete the sentence with the present perfect auxiliary (have / has).", "hint": "'little' goes with uncountable nouns, and so does the verb.", "explanation": "'Research' is uncountable in academic English: no plural 'researches', and a singular verb - 'Little research has been carried out'. To count studies, write 'two studies have been carried out'."}, "he": {"q": "השלימו את המשפט ב-auxiliary של ה-present perfect (have / has).", "hint": "'little' מצטרף לשמות עצם שאינם ניתנים למנייה, וכך גם הפועל.", "explanation": "'Research' אינו ניתן למנייה באנגלית אקדמית: אין 'researches', והפועל ביחיד - 'Little research has been carried out'. כדי לספור מחקרים כותבים 'two studies have been carried out'."}}, {"id": "agc-001", "area": "agreement-coordination", "topic": "compound-subject-with-and", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["agreement", "compound-subject", "and"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["My sister and her husband live in Tel Aviv.", "My sister and her husband lives in Tel Aviv.", "My sister and her husband has lived in Tel Aviv.", "My sister and her husband is living in Tel Aviv."], "hint": "Two subjects joined by 'and' count as more than one.", "explanation": "Two nouns joined by 'and' form a plural subject, so the verb takes the plural form: 'my sister and her husband live'. Only a single subject would give 'lives'.", "whyWrong": ["Uses the singular -s form, as if the subject were one person.", "'has lived' is singular; a compound subject needs 'have lived'.", "Singular 'is'; with two people the form would be 'are living'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["My sister and her husband live in Tel Aviv.", "My sister and her husband lives in Tel Aviv.", "My sister and her husband has lived in Tel Aviv.", "My sister and her husband is living in Tel Aviv."], "hint": "שני נושאים המחוברים ב-'and' נחשבים ליותר מאחד.", "explanation": "שני שמות עצם המחוברים ב-'and' יוצרים נושא ברבים, ולכן הפועל בצורת הרבים: 'my sister and her husband live'. רק נושא ביחיד היה נותן 'lives'.", "whyWrong": ["משתמש בצורת ה-s של היחיד, כאילו הנושא הוא אדם אחד.", "'has lived' הוא יחיד; נושא מחובר דורש 'have lived'.", "'is' ביחיד; עם שני אנשים הצורה היא 'are living'."]}}, {"id": "agc-002", "area": "agreement-coordination", "topic": "compound-subject-including-i", "difficulty": 1, "type": "cloze", "hardnessSource": "trap", "tags": ["agreement", "compound-subject", "and", "be"], "sentence": "My parents and I ___ flying to Rome next week.", "answers": [["are"]], "en": {"q": "Complete the sentence with the present simple of 'be'.", "hint": "The subject is 'my parents and I', not just 'I'.", "explanation": "A subject joined by 'and' is plural, so it takes 'are' even when one part of it is 'I': 'My parents and I are...'. The form 'am' belongs to 'I' standing alone."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'be'.", "hint": "הנושא הוא 'my parents and I', לא רק 'I'.", "explanation": "נושא המחובר ב-'and' הוא רבים, ולכן מקבל 'are' גם כאשר אחד מחלקיו הוא 'I'. הצורה 'am' שייכת ל-'I' כשהוא עומד לבדו."}}, {"id": "agc-003", "area": "agreement-coordination", "topic": "or-joining-two-singulars", "difficulty": 1, "type": "cloze", "hardnessSource": "concept", "tags": ["agreement", "either-or", "or", "have"], "sentence": "Either Dana or Noa ___ the key to the storeroom.", "answers": [["has", "has got"]], "en": {"q": "Complete the sentence with the present simple of 'have'.", "hint": "'or' does not add the two subjects together.", "explanation": "'or' (and 'either ... or') offers one subject or the other, not both, so two singular nouns still take a singular verb: 'Either Dana or Noa has the key'. Compare 'Dana and Noa have the keys'."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'have'.", "hint": "'or' אינו מחבר את שני הנושאים יחד.", "explanation": "'or' (וגם 'either ... or') מציג נושא אחד או אחר, לא את שניהם, ולכן שני שמות עצם ביחיד מקבלים פועל ביחיד: 'Either Dana or Noa has the key'. השוו: 'Dana and Noa have the keys'."}}, {"id": "agc-004", "area": "agreement-coordination", "topic": "pronoun-after-compound-subject", "difficulty": 1, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "compound-subject", "pronoun-agreement"], "answer": 2, "en": {"q": "Choose the correct sentence.", "options": ["Dan and Yossi has lost their tickets.", "Dan and Yossi have lost his tickets.", "Dan and Yossi have lost their tickets.", "Dan and Yossi has lost his tickets."], "hint": "Check both the verb and the possessive.", "explanation": "A subject joined by 'and' is plural, so it needs the plural verb 'have' and the plural possessive 'their'.", "whyWrong": ["The possessive is right, but 'has' is singular; a compound subject takes 'have'.", "The verb is right, but 'his' refers to one person only; use 'their'.", "Both the verb and the possessive are singular, though the subject is two people."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Dan and Yossi has lost their tickets.", "Dan and Yossi have lost his tickets.", "Dan and Yossi have lost their tickets.", "Dan and Yossi has lost his tickets."], "hint": "בדקו גם את הפועל וגם את כינוי הקניין.", "explanation": "נושא המחובר ב-'and' הוא רבים, ולכן דרושים גם הפועל ברבים 'have' וגם כינוי הקניין ברבים 'their'.", "whyWrong": ["הכינוי נכון, אבל 'has' הוא יחיד; נושא מחובר דורש 'have'.", "הפועל נכון, אבל 'his' מתייחס לאדם אחד בלבד; צריך 'their'.", "גם הפועל וגם הכינוי ביחיד, אף שהנושא הוא שני אנשים."]}}, {"id": "agc-005", "area": "agreement-coordination", "topic": "every-before-compound-subject", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["agreement", "every", "compound-subject", "exception"], "answer": 1, "en": {"q": "Choose the correct sentence.", "options": ["Every boy and girl in the class were praised.", "Every boy and girl in the class was praised.", "Every boy and girl in the class are praised.", "Every boy and girl in the class have been praised."], "hint": "'every' looks at the members one by one.", "explanation": "'and' normally makes a subject plural, but when the nouns are preceded by 'each' or 'every' they are counted separately and the verb is singular: 'Every boy and girl was praised.' The same happens in 'Each man and woman has a vote.'", "whyWrong": ["Plural 'were', although 'every' makes the subject singular.", "Plural 'are'; with 'every' the members are counted one at a time.", "'have been' is plural; with 'every' the form is 'has been praised'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Every boy and girl in the class were praised.", "Every boy and girl in the class was praised.", "Every boy and girl in the class are praised.", "Every boy and girl in the class have been praised."], "hint": "'every' מסתכל על החברים אחד-אחד.", "explanation": "בדרך כלל 'and' הופך את הנושא לרבים, אבל כאשר שמות העצם באים אחרי 'each' או 'every' הם נמנים בנפרד והפועל ביחיד: 'Every boy and girl was praised'. כך גם 'Each man and woman has a vote'.", "whyWrong": ["'were' ברבים, אף ש-'every' הופך את הנושא ליחיד.", "'are' ברבים; עם 'every' מתייחסים לכל אחד בנפרד.", "'have been' ברבים; עם 'every' הצורה היא 'has been praised'."]}}, {"id": "agc-006", "area": "agreement-coordination", "topic": "or-with-singular-and-plural", "difficulty": 2, "type": "cloze", "hardnessSource": "transform", "tags": ["agreement", "or", "proximity-rule"], "sentence": "The receptionist or the security guards ___ the front door at night.", "answers": [["lock"]], "en": {"q": "Complete the sentence with the present simple of 'lock'.", "hint": "With 'or', the verb follows the subject closest to it.", "explanation": "When 'or' joins a singular and a plural subject, the verb agrees with the one nearer to it. Here 'the security guards' stands next to the verb, so the form is 'lock'; reverse the order and you would write 'The security guards or the receptionist locks the front door'."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'lock'.", "hint": "עם 'or' הפועל מתאים לנושא הקרוב אליו.", "explanation": "כאשר 'or' מחבר נושא ביחיד ונושא ברבים, הפועל מתאים לנושא הקרוב אליו. כאן 'the security guards' צמוד לפועל, ולכן 'lock'; בסדר ההפוך נכתוב 'The security guards or the receptionist locks the front door'."}}, {"id": "agc-007", "area": "agreement-coordination", "topic": "together-with-additive-phrase", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["agreement", "together-with", "additive-phrase"], "answer": 3, "en": {"q": "Choose the correct sentence.", "options": ["The headmaster, together with the parents, have complained.", "The headmaster, together with the parents, are complaining.", "The headmaster, together with the parents, were complaining.", "The headmaster, together with the parents, has complained."], "hint": "'together with' is not 'and'.", "explanation": "'together with', 'along with' and 'accompanied by' add information between commas; they do not make the subject plural. The subject is still the singular 'the headmaster', so the verb is 'has complained'.", "whyWrong": ["Plural 'have', as if the parents were part of the subject.", "Plural 'are'; the phrase between commas does not change the number.", "Plural 'were'; only 'and' could make this subject plural."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["The headmaster, together with the parents, have complained.", "The headmaster, together with the parents, are complaining.", "The headmaster, together with the parents, were complaining.", "The headmaster, together with the parents, has complained."], "hint": "'together with' אינו 'and'.", "explanation": "הצירופים 'together with', 'along with' ו-'accompanied by' מוסיפים מידע בין פסיקים, אך אינם הופכים את הנושא לרבים. הנושא נשאר 'the headmaster' ביחיד, ולכן 'has complained'.", "whyWrong": ["'have' ברבים, כאילו ההורים חלק מהנושא.", "'are' ברבים; הצירוף שבין הפסיקים אינו משנה את המספר.", "'were' ברבים; רק 'and' היה הופך את הנושא לרבים."]}}, {"id": "agc-008", "area": "agreement-coordination", "topic": "there-with-compound-subject", "difficulty": 2, "type": "cloze", "hardnessSource": "concept", "tags": ["agreement", "there-is", "compound-subject"], "sentence": "There ___ two pens and a notebook on my desk.", "answers": [["are"]], "en": {"q": "Complete the sentence with the present simple of 'be'.", "hint": "In a 'there' sentence the verb looks at what comes immediately after it.", "explanation": "'there' is not the subject; the verb agrees with the first element of the list that follows, and here that is the plural 'two pens', so it is 'are'. (With the order reversed, writers normally say 'There is a notebook and two pens'.)"}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'be'.", "hint": "במשפט עם 'there' הפועל מתאים למה שבא מיד אחריו.", "explanation": "'there' אינו הנושא; הפועל מתאים לאיבר הראשון ברשימה שאחריו, וכאן זה 'two pens' ברבים, ולכן 'are'. (בסדר ההפוך נהוג לכתוב 'There is a notebook and two pens'.)"}}, {"id": "agc-009", "area": "agreement-coordination", "topic": "compound-subject-naming-one-thing", "difficulty": 3, "type": "cloze", "hardnessSource": "trap", "tags": ["agreement", "compound-subject", "single-unit", "exception"], "sentence": "Fish and chips ___ my favourite meal, and I order it every Friday.", "answers": [["is"]], "en": {"q": "Complete the sentence with the present simple of 'be'.", "hint": "'Fish and chips' names one dish here - notice the 'it' later in the sentence.", "explanation": "A subject joined by 'and' is normally plural, but when the two nouns name a single thing it counts as one and takes a singular verb: 'Fish and chips is my favourite meal', just like 'Bread and butter is all I had for breakfast'."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'be'.", "hint": "'Fish and chips' הוא כאן מנה אחת - שימו לב ל-'it' בהמשך המשפט.", "explanation": "נושא המחובר ב-'and' הוא בדרך כלל רבים, אבל כששני שמות העצם מציינים דבר אחד הוא נחשב יחיד ומקבל פועל ביחיד: 'Fish and chips is my favourite meal', בדיוק כמו 'Bread and butter is all I had for breakfast'."}}, {"id": "agc-010", "area": "agreement-coordination", "topic": "not-only-but-also-proximity", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "not-only-but-also", "proximity-rule"], "answer": 1, "en": {"q": "Choose the correct sentence.", "options": ["Not only the students but also the teacher have signed it.", "Not only the students but also the teacher has signed it.", "Not only the students but also the teacher are signing it.", "Not only the students but also the teacher were signing it."], "hint": "Which subject stands next to the verb?", "explanation": "With 'not only ... but also', as with 'either ... or' and 'neither ... nor', the verb agrees with the subject nearer to it. That subject is the singular 'the teacher', so 'has signed' is correct.", "whyWrong": ["Agrees with 'the students', which is not the nearer subject.", "Plural 'are' again, though 'the teacher' is next to the verb.", "Plural 'were'; the nearer subject is singular."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Not only the students but also the teacher have signed it.", "Not only the students but also the teacher has signed it.", "Not only the students but also the teacher are signing it.", "Not only the students but also the teacher were signing it."], "hint": "איזה נושא עומד צמוד לפועל?", "explanation": "עם 'not only ... but also', כמו עם 'either ... or' ו-'neither ... nor', הפועל מתאים לנושא הקרוב אליו. הנושא הקרוב הוא 'the teacher' ביחיד, ולכן 'has signed'.", "whyWrong": ["מתאים את הפועל ל-'the students', שאינו הנושא הקרוב.", "שוב 'are' ברבים, אף ש-'the teacher' צמוד לפועל.", "'were' ברבים; הנושא הקרוב הוא ביחיד."]}}, {"id": "agc-011", "area": "agreement-coordination", "topic": "accompanied-by-additive-phrase", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["agreement", "accompanied-by", "additive-phrase", "present-perfect"], "sentence": "The ambassador, accompanied by two aides, ___ the hall before the vote.", "answers": [["has left"]], "en": {"q": "Complete the sentence with the present perfect of 'leave' (auxiliary plus participle).", "hint": "'accompanied by' does not add a second subject.", "explanation": "'accompanied by' is a modifier, not a coordinator, so the subject stays the singular 'the ambassador' and the auxiliary is 'has': 'has left'. Only 'The ambassador and two aides' would give 'have left'."}, "he": {"q": "השלימו את המשפט ב-present perfect של הפועל 'leave' (auxiliary יחד עם participle).", "hint": "'accompanied by' אינו מוסיף נושא שני.", "explanation": "'accompanied by' הוא צירוף תיאורי ולא מילת חיבור, ולכן הנושא נשאר 'the ambassador' ביחיד וה-auxiliary הוא 'has': 'has left'. רק 'The ambassador and two aides' היה נותן 'have left'."}}, {"id": "agc-012", "area": "agreement-coordination", "topic": "two-nouns-one-person", "difficulty": 4, "type": "cloze", "hardnessSource": "trap", "tags": ["agreement", "compound-subject", "single-referent", "present-perfect"], "sentence": "My friend and colleague Dr. Levi ___ agreed to review the paper.", "answers": [["has"]], "en": {"q": "Complete the sentence with the auxiliary that forms the present perfect.", "hint": "How many people does 'my friend and colleague Dr. Levi' refer to?", "explanation": "When 'and' joins two descriptions of the same person - note the single name and the single 'my' - the subject is singular and takes 'has'. 'My friend and my colleague have agreed' would refer to two people."}, "he": {"q": "השלימו את המשפט ב-auxiliary שיוצר את ה-present perfect.", "hint": "לכמה אנשים מתייחס 'my friend and colleague Dr. Levi'?", "explanation": "כאשר 'and' מחבר שני תיאורים של אותו אדם - שימו לב לשם היחיד ולמילה 'my' שמופיעה פעם אחת - הנושא הוא יחיד ומקבל 'has'. 'My friend and my colleague have agreed' היה מתייחס לשני אנשים."}}, {"id": "agc-013", "area": "agreement-coordination", "topic": "in-addition-to-with-long-modifier", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "in-addition-to", "additive-phrase", "academic-register"], "answer": 2, "en": {"q": "Choose the correct sentence.", "options": ["This regulation, in addition to the three amendments, require registration.", "This regulation, in addition to the three amendments, are requiring registration.", "This regulation, in addition to the three amendments, requires registration.", "This regulation, in addition to the three amendments, have required registration."], "hint": "Find the real subject, then ignore everything between the commas.", "explanation": "'in addition to' introduces a modifier, not a second subject. The subject is the singular 'this regulation', so the verb keeps the -s: 'requires'. Academic writing often hides the agreement behind a long phrase like this one.", "whyWrong": ["Drops the -s, agreeing with 'amendments' instead of the real subject.", "Plural 'are'; the phrase between commas cannot change the number.", "Plural 'have'; with this singular subject it would be 'has required'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["This regulation, in addition to the three amendments, require registration.", "This regulation, in addition to the three amendments, are requiring registration.", "This regulation, in addition to the three amendments, requires registration.", "This regulation, in addition to the three amendments, have required registration."], "hint": "מצאו את הנושא האמיתי והתעלמו מכל מה שבין הפסיקים.", "explanation": "'in addition to' פותח צירוף תיאורי ולא נושא שני. הנושא הוא 'this regulation' ביחיד, ולכן הפועל שומר על ה-s: 'requires'. בכתיבה אקדמית נהוג לשתול צירוף ארוך בין הנושא לפועל, וזה מה שמסתיר את ההתאמה.", "whyWrong": ["משמיט את ה-s ומתאים את הפועל ל-'amendments' במקום לנושא האמיתי.", "'are' ברבים; הצירוף שבין הפסיקים אינו יכול לשנות את המספר.", "'have' ברבים; עם נושא יחיד כזה הצורה היא 'has required'."]}}, {"id": "agc-014", "area": "agreement-coordination", "topic": "neither-nor-verb-and-pronoun", "difficulty": 4, "type": "cloze", "hardnessSource": "transform", "tags": ["agreement", "neither-nor", "proximity-rule", "pronoun-agreement"], "sentence": "Neither the author nor her editors ___ willing to explain ___ decision in public.", "answers": [["are"], ["their"]], "en": {"q": "Complete the first blank with the present simple of 'be' and the second with a possessive pronoun.", "hint": "Both the verb and the pronoun follow the nearer subject, 'her editors'.", "explanation": "With 'neither ... nor' the verb and any pronoun that refers back agree with the subject nearer the verb. 'her editors' is plural, so we get 'are' and 'their'. With the order reversed you would write 'Neither the editors nor the author is willing to explain her decision'."}, "he": {"q": "השלימו את המקום הראשון ב-present simple של הפועל 'be' ואת השני בכינוי קניין.", "hint": "גם הפועל וגם הכינוי מתאימים לנושא הקרוב, 'her editors'.", "explanation": "עם 'neither ... nor' הפועל והכינוי שמתייחס אחורה מתאימים לנושא הקרוב לפועל. 'her editors' הוא רבים, ולכן 'are' ו-'their'. בסדר ההפוך נכתוב 'Neither the editors nor the author is willing to explain her decision'."}}, {"id": "ags-001", "area": "agreement-special", "topic": "everyone-singular-verb", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["agreement", "indefinite-pronoun", "everyone"], "answer": 3, "en": {"q": "Choose the correct sentence.", "options": ["Everyone in the class have finished the test.", "Everyone in the class are finishing the test.", "Everyone in the class finish the test quickly.", "Everyone in the class has finished the test."], "hint": "'everyone' feels plural but behaves like 'every one'.", "explanation": "Indefinite pronouns ending in -one, -body and -thing ('everyone', 'somebody', 'nothing', 'no one') are grammatically singular, so they take a singular verb: 'Everyone has finished'. The phrase 'in the class' does not change that.", "whyWrong": ["'everyone' is singular, so the auxiliary must be 'has'.", "Plural 'are'; 'everyone' takes a singular verb even though it means many people.", "Missing the third-person -s: it would have to be 'finishes'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Everyone in the class have finished the test.", "Everyone in the class are finishing the test.", "Everyone in the class finish the test quickly.", "Everyone in the class has finished the test."], "hint": "'everyone' נשמע רבים אך מתנהג כמו 'every one'.", "explanation": "כינויים בלתי מוגדרים המסתיימים ב--one, -body ו--thing ('everyone', 'somebody', 'nothing', 'no one') הם יחיד מבחינה דקדוקית ולכן מקבלים פועל ביחיד: 'Everyone has finished'. הצירוף 'in the class' אינו משנה זאת.", "whyWrong": ["'everyone' הוא יחיד, ולכן ה-auxiliary צריך להיות 'has'.", "'are' ברבים; 'everyone' מקבל פועל ביחיד אף שמשמעותו רבים.", "חסר ה-s של גוף שלישי: צריך 'finishes'."]}}, {"id": "ags-002", "area": "agreement-special", "topic": "nobody-singular-verb", "difficulty": 1, "type": "cloze", "hardnessSource": "concept", "tags": ["agreement", "indefinite-pronoun", "nobody", "third-person-s"], "sentence": "Nobody ___ why the meeting was cancelled.", "answers": [["knows"]], "en": {"q": "Complete the sentence with the present simple of 'know'.", "hint": "'nobody' is singular, like 'he'.", "explanation": "'nobody', 'no one', 'somebody' and 'everybody' are singular pronouns, so the verb takes the third-person -s: 'Nobody knows'. The -s is easy to drop here because the meaning feels plural."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'know'.", "hint": "'nobody' הוא יחיד, כמו 'he'.", "explanation": "'nobody', 'no one', 'somebody' ו-'everybody' הם כינויים ביחיד, ולכן הפועל מקבל את ה-s של גוף שלישי: 'Nobody knows'. דוברי עברית נוטים להשמיט כאן את ה-s כי המשמעות נשמעת רבים."}}, {"id": "ags-003", "area": "agreement-special", "topic": "singular-they-reference", "difficulty": 1, "type": "cloze", "hardnessSource": "concept", "tags": ["agreement", "indefinite-pronoun", "singular-they", "pronoun-agreement"], "sentence": "Somebody has left ___ umbrella in the hall.", "answers": [["their", "his or her", "his/her"]], "en": {"q": "Complete the sentence with the possessive that refers back to 'somebody'.", "hint": "English uses a plural-looking possessive for a single unidentified person.", "explanation": "The verb after 'somebody' is singular ('has left'), but the possessive that refers back to it is normally 'their' - the singular 'they' - because the person's gender is unknown. The formal alternative is 'his or her'."}, "he": {"q": "השלימו את המשפט בכינוי הקניין המתייחס ל-'somebody'.", "hint": "באנגלית משתמשים בכינוי שנראה רבים כדי להתייחס לאדם אחד לא מזוהה.", "explanation": "הפועל אחרי 'somebody' הוא יחיד ('has left'), אבל הכינוי שמתייחס אליו הוא בדרך כלל 'their' - ה-singular they - כי איננו יודעים את מינו של האדם. החלופה הפורמלית היא 'his or her'."}}, {"id": "ags-004", "area": "agreement-special", "topic": "titles-of-works-singular", "difficulty": 2, "type": "mcq", "hardnessSource": "form", "tags": ["agreement", "titles", "singular-verb"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["'Great Expectations' is one of Dickens's finest novels.", "'Great Expectations' are one of Dickens's finest novels.", "'Great Expectations' were one of Dickens's finest novels.", "'Great Expectations' have been one of Dickens's finest novels."], "hint": "The title names one book, whatever its own form.", "explanation": "The title of a single work takes a singular verb even when the title itself looks plural: 'Great Expectations' is one novel, so 'is'. The same applies to films, newspapers and albums.", "whyWrong": ["Treats the plural-looking title as a plural subject.", "The same number mistake in the past tense.", "'have been' is plural; one book takes 'has been' or simply 'is'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["'Great Expectations' is one of Dickens's finest novels.", "'Great Expectations' are one of Dickens's finest novels.", "'Great Expectations' were one of Dickens's finest novels.", "'Great Expectations' have been one of Dickens's finest novels."], "hint": "השם מציין ספר אחד, גם אם הוא נראה רבים.", "explanation": "שם של יצירה אחת מקבל פועל ביחיד גם כאשר השם עצמו נראה רבים: 'Great Expectations' הוא רומן אחד, ולכן 'is'. אותו כלל חל על סרטים, עיתונים ואלבומים.", "whyWrong": ["מתייחס לשם שנראה רבים כאל נושא ברבים.", "אותה טעות במספר, בזמן עבר.", "'have been' ברבים; ספר אחד מקבל 'has been' או פשוט 'is'."]}}, {"id": "ags-005", "area": "agreement-special", "topic": "organisation-names-singular", "difficulty": 2, "type": "mcq", "hardnessSource": "form", "tags": ["agreement", "organisations", "plural-form-singular-meaning"], "answer": 1, "en": {"q": "Choose the correct sentence.", "options": ["The United Nations have adopted a new resolution.", "The United Nations has adopted a new resolution.", "The United Nations are adopting a new resolution.", "The United Nations were adopting a new resolution."], "hint": "The name is plural in form but names one organisation.", "explanation": "Names of organisations and countries that look plural - 'the United Nations', 'the United States', 'the Philippines' - take a singular verb: 'The United Nations has adopted a new resolution'.", "whyWrong": ["Agrees with the plural form of the name instead of the single organisation.", "Plural 'are'; with this subject it would be 'is adopting'.", "Plural 'were'; one organisation takes 'was'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["The United Nations have adopted a new resolution.", "The United Nations has adopted a new resolution.", "The United Nations are adopting a new resolution.", "The United Nations were adopting a new resolution."], "hint": "השם ברבים בצורתו אך מציין ארגון אחד.", "explanation": "שמות של ארגונים ומדינות שנראים רבים - 'the United Nations', 'the United States', 'the Philippines' - מקבלים פועל ביחיד: 'The United Nations has adopted a new resolution'.", "whyWrong": ["מתאים את הפועל לצורת הרבים של השם במקום לארגון האחד.", "'are' ברבים; עם נושא כזה הצורה היא 'is adopting'.", "'were' ברבים; ארגון אחד מקבל 'was'."]}}, {"id": "ags-006", "area": "agreement-special", "topic": "what-clause-as-subject", "difficulty": 2, "type": "cloze", "hardnessSource": "concept", "tags": ["agreement", "what-clause", "subject-clause", "be"], "sentence": "What I really need ___ a long holiday.", "answers": [["is"]], "en": {"q": "Complete the sentence with the present simple of 'be'.", "hint": "A 'what'-clause counts as one thing.", "explanation": "A clause beginning with 'what' works as a singular subject, so the verb after it is singular: 'What I really need is...'. Compare 'The things I really need are...'."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'be'.", "hint": "פסוקית שפותחת ב-'what' נחשבת לדבר אחד.", "explanation": "פסוקית שמתחילה ב-'what' מתפקדת כנושא ביחיד, ולכן הפועל שאחריה ביחיד: 'What I really need is...'. השוו: 'The things I really need are...'."}}, {"id": "ags-007", "area": "agreement-special", "topic": "a-series-of-singular", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "quantity-expression", "a-series-of", "head-noun"], "answer": 2, "en": {"q": "Choose the correct sentence.", "options": ["A series of mistakes have delayed the whole project.", "A series of mistakes are delaying the whole project.", "A series of mistakes has delayed the whole project.", "A series of mistakes delay the whole project."], "hint": "The subject is 'a series', not 'mistakes'.", "explanation": "In 'a series of', 'a pair of' and 'a set of' the head noun is singular, so the verb is singular: 'A series of mistakes has delayed...'. The plural noun after 'of' belongs to the modifier only.", "whyWrong": ["Agrees with 'mistakes', the nearest noun, instead of the head noun 'a series'.", "Plural 'are' with a singular head noun.", "Drops the -s; 'a series' needs 'delays'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["A series of mistakes have delayed the whole project.", "A series of mistakes are delaying the whole project.", "A series of mistakes has delayed the whole project.", "A series of mistakes delay the whole project."], "hint": "הנושא הוא 'a series', לא 'mistakes'.", "explanation": "בצירופים 'a series of', 'a pair of' ו-'a set of' שם העצם הראשי ביחיד, ולכן הפועל ביחיד: 'A series of mistakes has delayed...'. שם העצם ברבים שאחרי 'of' הוא רק חלק מהתיאור.", "whyWrong": ["מתאים את הפועל ל-'mistakes', שם העצם הקרוב, במקום לנושא 'a series'.", "'are' ברבים עם נושא ראשי ביחיד.", "משמיט את ה-s; 'a series' דורש 'delays'."]}}, {"id": "ags-008", "area": "agreement-special", "topic": "one-of-the-x-who-plural", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "relative-clause", "one-of-the", "antecedent"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["She is one of the employees who work from home.", "She is one of the employees who works from home.", "She is one of the employees who is working from home.", "She is one of the employees that works from home."], "hint": "Ask who the relative clause describes: her, or all those employees?", "explanation": "In 'one of the + plural noun + who', the relative clause describes the whole group, so its verb is plural: 'the employees who work from home'. The singular 'she is' belongs to the main clause only.", "whyWrong": ["Makes the verb in the relative clause agree with 'one' instead of with 'the employees'.", "The same mistake with a continuous form: the antecedent is still plural.", "'that' is acceptable here, but the verb must still be plural: 'that work'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["She is one of the employees who work from home.", "She is one of the employees who works from home.", "She is one of the employees who is working from home.", "She is one of the employees that works from home."], "hint": "שאלו את מי מתארת הפסוקית: אותה, או את כל אותם עובדים?", "explanation": "בתבנית 'one of the + שם עצם ברבים + who' הפסוקית מתארת את כל הקבוצה, ולכן הפועל שבה ברבים: 'the employees who work from home'. היחיד 'she is' שייך רק לפסוקית העיקרית.", "whyWrong": ["מתאים את הפועל שבפסוקית ל-'one' במקום ל-'the employees'.", "אותה טעות בצורה המתמשכת: ה-antecedent עדיין ברבים.", "'that' תקין כאן, אבל הפועל חייב להיות ברבים: 'that work'."]}}, {"id": "ags-009", "area": "agreement-special", "topic": "the-only-one-of-who-singular", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["agreement", "relative-clause", "the-only-one-of", "antecedent"], "sentence": "She is the only one of the applicants who ___ a second language.", "answers": [["speaks"]], "en": {"q": "Complete the sentence with the present simple of 'speak'.", "hint": "'the only one' points at one person, not at the group.", "explanation": "With 'the only one of the ... who', the relative clause describes that single person, so the verb is singular: 'who speaks'. Without 'the only' - 'one of the applicants who speak a second language' - the clause would describe the group and take a plural verb."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'speak'.", "hint": "'the only one' מצביע על אדם אחד, לא על הקבוצה.", "explanation": "בתבנית 'the only one of the ... who' הפסוקית מתארת את אותו אדם יחיד, ולכן הפועל ביחיד: 'who speaks'. בלי 'the only' - 'one of the applicants who speak a second language' - הפסוקית הייתה מתארת את הקבוצה ומקבלת פועל ברבים."}}, {"id": "ags-010", "area": "agreement-special", "topic": "those-of-us-who-relative-agreement", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "relative-clause", "those-of-us", "antecedent"], "answer": 3, "en": {"q": "Choose the correct sentence.", "options": ["Those of us who lives in the north pay more.", "Those of us who live in the north pays more.", "Those of us who lives in the north pays more.", "Those of us who live in the north pay more."], "hint": "Both verbs answer to the plural 'those'.", "explanation": "In 'those of us who', the antecedent of 'who' is the plural 'those', so the verb inside the relative clause is plural ('live'), and the main verb agrees with 'those' as well ('pay').", "whyWrong": ["The main verb is right, but the antecedent of 'who' is the plural 'those', so it needs 'live'.", "The relative clause is right, but the main verb must be the plural 'pay'.", "Both verbs are singular, although 'those of us' is plural."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Those of us who lives in the north pay more.", "Those of us who live in the north pays more.", "Those of us who lives in the north pays more.", "Those of us who live in the north pay more."], "hint": "שני הפעלים כפופים ל-'those' ברבים.", "explanation": "בצירוף 'those of us who' ה-antecedent של 'who' הוא 'those' ברבים, ולכן הפועל בתוך הפסוקית ברבים ('live'), וגם הפועל של המשפט העיקרי מתאים ל-'those' ('pay').", "whyWrong": ["הפועל העיקרי נכון, אבל ה-antecedent של 'who' הוא 'those' ברבים, ולכן צריך 'live'.", "הפסוקית נכונה, אבל הפועל העיקרי צריך להיות 'pay' ברבים.", "שני הפעלים ביחיד, אף ש-'those of us' הוא רבים."]}}, {"id": "ags-011", "area": "agreement-special", "topic": "majority-of-plural", "difficulty": 3, "type": "mcq", "hardnessSource": "form", "tags": ["agreement", "quantity-expression", "majority-of"], "answer": 1, "en": {"q": "Choose the correct sentence.", "options": ["The majority of the students has signed the petition.", "The majority of the students have signed the petition.", "The majority of the students is signing the petition.", "The majority of the students was signing the petition."], "hint": "With 'the majority of', look at the noun after 'of'.", "explanation": "'the majority of', 'a lot of' and 'half of' take their number from the noun after 'of'. 'the students' is plural, so the verb is plural: 'have signed'. With 'the majority of the money' it would be 'has'.", "whyWrong": ["Singular 'has' with a plural noun after 'of'.", "Singular 'is'; the number comes from 'the students'.", "Singular 'was'; it would have to be 'were signing'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["The majority of the students has signed the petition.", "The majority of the students have signed the petition.", "The majority of the students is signing the petition.", "The majority of the students was signing the petition."], "hint": "עם 'the majority of' מסתכלים על שם העצם שאחרי 'of'.", "explanation": "הצירופים 'the majority of', 'a lot of' ו-'half of' מקבלים את מספרם משם העצם שאחרי 'of'. 'the students' הוא רבים, ולכן הפועל ברבים: 'have signed'. עם 'the majority of the money' היינו כותבים 'has'.", "whyWrong": ["'has' ביחיד, אף ששם העצם שאחרי 'of' הוא רבים.", "'is' ביחיד; המספר נקבע לפי 'the students'.", "'was' ביחיד; הצורה הנדרשת היא 'were signing'."]}}, {"id": "ags-012", "area": "agreement-special", "topic": "what-as-subject-inside-clause", "difficulty": 4, "type": "cloze", "hardnessSource": "form", "tags": ["agreement", "what-clause", "third-person-s", "academic-register"], "sentence": "What ___ me most about the report is the lack of any explanation.", "answers": [["worries"]], "en": {"q": "Complete the sentence with the present simple of 'worry'.", "hint": "Inside the clause, 'what' is itself the subject.", "explanation": "In a 'what'-clause, 'what' is the subject of the clause and counts as singular, so the verb takes -s: 'What worries me most ... is ...'. The main verb 'is' is singular for the same reason."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'worry'.", "hint": "בתוך הפסוקית 'what' הוא עצמו הנושא.", "explanation": "בפסוקית 'what' המילה 'what' היא הנושא של הפסוקית ונחשבת יחיד, ולכן הפועל מקבל -s: 'What worries me most ... is ...'. גם הפועל העיקרי 'is' ביחיד מאותה סיבה."}}, {"id": "ags-013", "area": "agreement-special", "topic": "every-one-of-singular", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["agreement", "every-one-of", "quantity-expression", "formal-register"], "answer": 2, "en": {"q": "Choose the correct sentence.", "options": ["Every one of the reports have been checked twice.", "Every one of the reports were checked twice.", "Every one of the reports has been checked twice.", "Every one of the reports are checked twice."], "hint": "'every one' means 'each single one'.", "explanation": "'every one of' and 'each of' are followed by a plural noun but stay singular in meaning, so the verb is singular: 'Every one of the reports has been checked'. Written as one word, 'everyone' is singular too.", "whyWrong": ["Plural 'have', agreeing with 'the reports' rather than with 'every one'.", "Plural 'were'; the subject 'every one' is singular.", "Plural 'are'; it would have to be 'is checked'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["Every one of the reports have been checked twice.", "Every one of the reports were checked twice.", "Every one of the reports has been checked twice.", "Every one of the reports are checked twice."], "hint": "'every one' פירושו 'כל אחד בנפרד'.", "explanation": "הצירופים 'every one of' ו-'each of' באים לפני שם עצם ברבים אך נשארים יחיד במשמעותם, ולכן הפועל ביחיד: 'Every one of the reports has been checked'. גם 'everyone' במילה אחת הוא יחיד.", "whyWrong": ["'have' ברבים, בהתאמה ל-'the reports' ולא ל-'every one'.", "'were' ברבים; הנושא 'every one' הוא יחיד.", "'are' ברבים; הצורה הנדרשת היא 'is checked'."]}}, {"id": "ags-014", "area": "agreement-special", "topic": "more-than-one-singular", "difficulty": 4, "type": "cloze", "hardnessSource": "transform", "tags": ["agreement", "more-than-one", "quantity-expression", "present-perfect"], "sentence": "More than one student ___ about the new timetable this week.", "answers": [["has complained"]], "en": {"q": "Complete the sentence with the present perfect of 'complain' (auxiliary plus participle).", "hint": "The noun after 'more than one' stays singular - and so does the verb.", "explanation": "Although 'more than one' means several, the noun after it is singular and the verb agrees with that singular noun: 'More than one student has complained'. Compare 'Many students have complained', where a plural noun forces a plural verb."}, "he": {"q": "השלימו את המשפט ב-present perfect של הפועל 'complain' (auxiliary יחד עם participle).", "hint": "שם העצם שאחרי 'more than one' נשאר ביחיד - וכך גם הפועל.", "explanation": "אף ש-'more than one' מתאר כמה אנשים, שם העצם שאחריו ביחיד והפועל מתאים לו: 'More than one student has complained'. השוו: 'Many students have complained', שבו שם העצם ברבים כופה פועל ברבים."}}, {"id": "tpr-001", "area": "tense-present", "topic": "stative-verb-understand", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["present-simple", "stative-verbs", "continuous"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["I understand what you mean now.", "I am understanding what you mean now.", "I am understand what you mean now.", "I understanding what you mean now."], "hint": "'understand' describes a state, not an activity in progress.", "explanation": "Stative verbs such as 'understand', 'know' and 'believe' are not normally used in the continuous, so the present simple 'I understand' is the only natural form here.", "whyWrong": ["'understand' is a stative verb; English does not say 'I am understanding'.", "Puts the auxiliary 'am' in front of a bare base form, which is not a tense.", "An -ing form cannot be the finite verb on its own; it needs a form of 'be'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["I understand what you mean now.", "I am understanding what you mean now.", "I am understand what you mean now.", "I understanding what you mean now."], "hint": "הפועל 'understand' מתאר מצב, לא פעולה שמתרחשת כרגע.", "explanation": "פעלי מצב (stative verbs) כמו 'understand', 'know' ו-'believe' אינם מופיעים בדרך כלל ב-continuous, ול
