כן הצורה הטבעית היחידה כאן היא present simple: 'I understand'.", "whyWrong": ["'understand' הוא פועל מצב; באנגלית לא אומרים 'I am understanding'.", "מציב את ה-auxiliary 'am' לפני צורת הבסיס, וזה אינו זמן קיים באנגלית.", "צורת ing אינה יכולה לשמש כפועל הראשי לבדה; היא זקוקה לצורה של 'be'."]}}, {"id": "tpr-002", "area": "tense-present", "topic": "present-simple-timetable", "difficulty": 2, "type": "cloze", "hardnessSource": "concept", "tags": ["present-simple", "timetable", "future-reference"], "sentence": "The last train to Haifa ___ at 11:40 tomorrow night.", "answers": [["leaves"]], "en": {"q": "Complete the sentence with the present simple of 'leave'.", "hint": "Timetables take the present simple, even when they refer to the future.", "explanation": "A published timetable or schedule is reported in the present simple even about future time: 'The last train leaves at 11:40 tomorrow night'. The future 'will leave' is not used for fixed schedules."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'leave'.", "hint": "לוחות זמנים מקבלים present simple, גם כשמדובר בעתיד.", "explanation": "לוח זמנים קבוע מתואר ב-present simple גם כאשר הוא מתייחס לעתיד: 'The last train leaves at 11:40 tomorrow night'. הצורה 'will leave' אינה משמשת ללוחות זמנים קבועים."}}, {"id": "tpr-003", "area": "tense-present", "topic": "present-continuous-temporary", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["present-continuous", "temporary-situation"], "answer": 1, "en": {"q": "Complete the sentence: 'Right now Dana ___ with the marketing team, while her own manager is abroad.'", "options": ["works", "is working", "has worked", "worked"], "hint": "The arrangement is temporary and true at the moment of speaking.", "explanation": "The present continuous describes a temporary situation in progress: 'Right now Dana is working with the marketing team'. The present simple 'works' would present it as her permanent job.", "whyWrong": ["'works' states a permanent arrangement, which contradicts 'right now'.", "'has worked' looks back over a period; it does not say what is happening now.", "'worked' places a finished action in the past, but the situation is current."]}, "he": {"q": "השלימו את המשפט: 'Right now Dana ___ with the marketing team, while her own manager is abroad.'", "options": ["works", "is working", "has worked", "worked"], "hint": "מדובר בהסדר זמני שנכון ברגע הדיבור.", "explanation": "ה-present continuous מתאר מצב זמני שמתרחש כרגע: 'Right now Dana is working with the marketing team'. הצורה 'works' ב-present simple היתה מציגה זאת כתפקידה הקבוע.", "whyWrong": ["'works' מציג הסדר קבוע, וזה מתנגש עם 'right now'.", "'has worked' מסכם תקופה; הוא אינו מתאר מה קורה כרגע.", "'worked' ממקם פעולה שהסתיימה בעבר, אך המצב מתרחש בהווה."]}}, {"id": "tpr-004", "area": "tense-present", "topic": "third-person-s-spelling", "difficulty": 1, "type": "cloze", "hardnessSource": "form", "tags": ["present-simple", "third-person-s", "spelling"], "sentence": "My cousin ___ biology at Tel Aviv University.", "answers": [["studies"]], "en": {"q": "Complete the sentence with the present simple of 'study'.", "hint": "The subject is third person singular.", "explanation": "In the present simple a third-person singular subject adds -s, and a verb ending in consonant + -y changes the -y to -ies: study -> studies. Dropping the ending ('my cousin study') is a very common slip."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'study'.", "hint": "הנושא הוא גוף שלישי יחיד.", "explanation": "ב-present simple נושא בגוף שלישי יחיד מקבל s, ופועל שמסתיים בעיצור + y משנה את ה-y ל-ies: study -> studies. השמטת הסיומת ('my cousin study') היא טעות נפוצה מאוד."}}, {"id": "tpr-005", "area": "tense-present", "topic": "always-continuous-complaint", "difficulty": 2, "type": "mcq", "hardnessSource": "form", "tags": ["present-continuous", "always", "adverb-position"], "answer": 2, "en": {"q": "Complete the sentence: 'My neighbour ___ complaining about the noise, and it is getting tiring.'", "options": ["always is", "always", "is always", "has always"], "hint": "The adverb sits between 'be' and the -ing form.", "explanation": "To complain about a repeated, irritating habit English uses the present continuous with 'always', and 'always' goes between 'be' and the -ing form: 'He is always complaining'.", "whyWrong": ["Puts the adverb in front of 'be'; the normal order is 'is always complaining'.", "Leaves the sentence with no auxiliary, so there is no finite verb at all.", "'has always complaining' joins 'have' to an -ing form, which is not a possible tense."]}, "he": {"q": "השלימו את המשפט: 'My neighbour ___ complaining about the noise, and it is getting tiring.'", "options": ["always is", "always", "is always", "has always"], "hint": "תואר הפועל ממוקם בין 'be' לצורת ה-ing.", "explanation": "כדי להתלונן על הרגל חוזר ומעצבן אנגלית משתמשת ב-present continuous עם 'always', וה-always ממוקם בין 'be' לצורת ה-ing: 'He is always complaining'.", "whyWrong": ["מציב את תואר הפועל לפני 'be'; הסדר הרגיל הוא 'is always complaining'.", "משאיר את המשפט בלי auxiliary, כך שאין בו פועל מוטה בכלל.", "'has always complaining' מחבר 'have' לצורת ing, וזה אינו זמן אפשרי."]}}, {"id": "tpr-006", "area": "tense-present", "topic": "present-simple-after-time-conjunction", "difficulty": 2, "type": "cloze", "hardnessSource": "trap", "tags": ["present-simple", "time-conjunction", "no-will"], "sentence": "Call me as soon as he ___ at the airport.", "answers": [["arrives"]], "en": {"q": "Complete the sentence with the present simple of 'arrive'.", "hint": "No 'will' after 'as soon as'.", "explanation": "After time conjunctions such as 'when', 'as soon as', 'until' and 'before', future time is expressed with the present simple: 'as soon as he arrives', never 'as soon as he will arrive'."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'arrive'.", "hint": "אחרי 'as soon as' לא מופיע 'will'.", "explanation": "אחרי מילות זמן כמו 'when', 'as soon as', 'until' ו-'before' מביעים זמן עתיד באמצעות present simple: 'as soon as he arrives', ולעולם לא 'as soon as he will arrive'."}}, {"id": "tpr-007", "area": "tense-present", "topic": "zero-conditional", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["present-simple", "zero-conditional", "no-will-in-if-clause"], "answer": 3, "en": {"q": "Choose the correct sentence.", "options": ["If you heat ice, it melted.", "If you will heat ice, it melts.", "If you will heat ice, it will melt.", "If you heat ice, it melts."], "hint": "A general truth keeps both halves in the present simple.", "explanation": "A zero conditional states a general truth, so both clauses take the present simple: 'If you heat ice, it melts'. 'will' never appears in the if-clause.", "whyWrong": ["The main clause slips into the past simple, but the sentence states a timeless fact.", "Puts 'will' inside the if-clause; after 'if' English uses the present simple.", "'will' is wrong in the if-clause, and a permanent fact does not need 'will melt'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["If you heat ice, it melted.", "If you will heat ice, it melts.", "If you will heat ice, it will melt.", "If you heat ice, it melts."], "hint": "אמת כללית שומרת על present simple בשני חלקי המשפט.", "explanation": "ב-zero conditional מביעים אמת כללית, ולכן שתי הפסוקיות ב-present simple: 'If you heat ice, it melts'. ה-will לא מופיע אף פעם בפסוקית ה-if.", "whyWrong": ["הפסוקית העיקרית עוברת ל-past simple, אך המשפט מביע עובדה שאינה תלויה בזמן.", "מכניס 'will' לפסוקית ה-if; אחרי 'if' משתמשים ב-present simple.", "ה-will שגוי בפסוקית ה-if, ועובדה קבועה אינה זקוקה ל-'will melt'."]}}, {"id": "tpr-008", "area": "tense-present", "topic": "have-change-of-meaning", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["present-continuous", "have", "change-of-meaning"], "sentence": "Please don't phone at eight — we ___ dinner then.", "answers": [["are having", "'re having"]], "en": {"q": "Complete the sentence with the present continuous of 'have'.", "hint": "Here 'have' means an activity, not possession.", "explanation": "'have' resists the continuous when it means possession ('I have two sisters'), but in activity expressions such as 'have dinner', 'have a shower' or 'have a meeting' the continuous is normal: 'we are having dinner'."}, "he": {"q": "השלימו את המשפט ב-present continuous של הפועל 'have'.", "hint": "כאן 'have' מביע פעולה, לא בעלות.", "explanation": "הפועל 'have' אינו מופיע ב-continuous כשהוא מביע בעלות ('I have two sisters'), אבל בביטויי פעולה כמו 'have dinner', 'have a shower' או 'have a meeting' ה-continuous טבעי לגמרי: 'we are having dinner'."}}, {"id": "tpr-009", "area": "tense-present", "topic": "think-change-of-meaning", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["present-simple", "think", "change-of-meaning", "stative-verbs"], "answer": 1, "en": {"q": "Complete the sentence: 'I ___ this plan is too expensive, and I always have.'", "options": ["am thinking", "think", "have been thinking", "am think"], "hint": "Here 'think' means 'hold an opinion'.", "explanation": "'think' meaning 'hold an opinion' is stative and stays in the present simple: 'I think this plan is too expensive'. The continuous 'I am thinking' refers to the mental process of considering something.", "whyWrong": ["'am thinking' reports the process of considering, not an opinion already held.", "The continuous again describes an activity, and it clashes with 'I always have'.", "'am think' joins an auxiliary to a bare base form; no such tense exists."]}, "he": {"q": "השלימו את המשפט: 'I ___ this plan is too expensive, and I always have.'", "options": ["am thinking", "think", "have been thinking", "am think"], "hint": "כאן 'think' במשמעות של החזקת דעה.", "explanation": "הפועל 'think' במשמעות 'להחזיק בדעה' הוא פועל מצב ונשאר ב-present simple: 'I think this plan is too expensive'. הצורה 'I am thinking' מתייחסת לתהליך החשיבה וההתלבטות.", "whyWrong": ["'am thinking' מתאר תהליך של התלבטות, לא דעה שכבר קיימת.", "ה-continuous מתאר שוב פעולה מתמשכת, והוא מתנגש עם 'I always have'.", "'am think' מחבר auxiliary לצורת בסיס; זמן כזה אינו קיים."]}}, {"id": "tpr-010", "area": "tense-present", "topic": "stative-verb-belong", "difficulty": 1, "type": "cloze", "hardnessSource": "trap", "tags": ["present-simple", "stative-verbs", "belong"], "sentence": "This notebook ___ to Dana, not to me.", "answers": [["belongs"]], "en": {"q": "Complete the sentence with the present simple of 'belong'.", "hint": "'belong' names a state, so it has no continuous form.", "explanation": "'belong' is a stative verb and is not used in the continuous: 'This notebook belongs to Dana'. 'is belonging' does not exist in standard English, and the third-person -s must not be dropped."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'belong'.", "hint": "'belong' מביע מצב, ולכן אין לו צורת continuous.", "explanation": "'belong' הוא פועל מצב ואינו מופיע ב-continuous: 'This notebook belongs to Dana'. הצורה 'is belonging' אינה קיימת באנגלית תקנית, ואסור להשמיט את ה-s של גוף שלישי."}}, {"id": "tpr-011", "area": "tense-present", "topic": "correlative-comparative-present-simple", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["present-simple", "the-more-the-more", "no-will"], "answer": 0, "en": {"q": "Choose the correct sentence.", "options": ["The more she practises, the better she plays.", "The more she will practise, the better she will play.", "The more she practises, the better she will playing.", "The more she practise, the better she plays."], "hint": "Both halves of 'the more..., the better...' behave like a general rule.", "explanation": "In the correlative pattern 'the more..., the better...' both clauses take the present simple, because the sentence states a general relationship: 'The more she practises, the better she plays'.", "whyWrong": ["'will' does not belong in either half of this pattern; the present simple states the rule.", "'will playing' is not a possible form, and the pattern does not take 'will' anyway.", "Drops the third-person -s from 'practise'; the subject 'she' requires 'practises'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["The more she practises, the better she plays.", "The more she will practise, the better she will play.", "The more she practises, the better she will playing.", "The more she practise, the better she plays."], "hint": "שני חלקי התבנית 'the more..., the better...' מתנהגים כמו כלל כללי.", "explanation": "בתבנית 'the more..., the better...' שתי הפסוקיות ב-present simple, מפני שהמשפט מביע קשר כללי וקבוע: 'The more she practises, the better she plays'.", "whyWrong": ["ה-will אינו שייך לאף אחד מחלקי התבנית; ה-present simple הוא שמביע את הכלל.", "'will playing' אינה צורה אפשרית, ובכל מקרה התבנית אינה לוקחת 'will'.", "משמיט את ה-s של גוף שלישי; הנושא 'she' דורש 'practises'."]}}, {"id": "tpr-012", "area": "tense-present", "topic": "see-change-of-meaning", "difficulty": 4, "type": "cloze", "hardnessSource": "concept", "tags": ["present-continuous", "see", "change-of-meaning"], "sentence": "The minister ___ the ambassador at four, so she cannot take any calls.", "answers": [["is seeing", "'s seeing"]], "en": {"q": "Complete the sentence with the present continuous of 'see'.", "hint": "Here 'see' means 'meet by appointment'.", "explanation": "'see' is stative when it means perception ('I see a light'), but when it means 'meet by appointment' it behaves like an activity and takes the continuous: 'The minister is seeing the ambassador at four'."}, "he": {"q": "השלימו את המשפט ב-present continuous של הפועל 'see'.", "hint": "כאן 'see' במשמעות של פגישה מתוכננת.", "explanation": "'see' הוא פועל מצב כשהוא מביע תפיסה חושית ('I see a light'), אבל כשהוא מביע פגישה שנקבעה הוא מתנהג כפועל פעולה ומקבל continuous: 'The minister is seeing the ambassador at four'."}}, {"id": "tpr-013", "area": "tense-present", "topic": "taste-change-of-meaning", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["present-simple", "present-continuous", "taste", "change-of-meaning"], "answer": 3, "en": {"q": "Complete the sentence: 'The sauce ___ too salty, and right now the chef ___ it again.'", "options": ["is tasting / tastes", "is tasting / is tasting", "tastes / tastes", "tastes / is tasting"], "hint": "One gap describes a quality, the other a deliberate action.", "explanation": "When 'taste' describes a quality it is stative and takes the present simple ('the sauce tastes salty'); when it describes someone deliberately tasting something it is an action and takes the continuous ('the chef is tasting it').", "whyWrong": ["Reverses the two senses: the quality takes the simple and the action the continuous.", "The sauce performs no action, so 'is tasting' cannot fill the first gap.", "'right now' requires the continuous for the chef's deliberate action."]}, "he": {"q": "השלימו את המשפט: 'The sauce ___ too salty, and right now the chef ___ it again.'", "options": ["is tasting / tastes", "is tasting / is tasting", "tastes / tastes", "tastes / is tasting"], "hint": "חסר אחד מתאר תכונה, והשני פעולה מכוונת.", "explanation": "כאשר 'taste' מתאר תכונה הוא פועל מצב ומקבל present simple ('the sauce tastes salty'); כאשר הוא מתאר אדם שטועם בכוונה הוא פועל פעולה ומקבל continuous ('the chef is tasting it').", "whyWrong": ["הופך את שתי המשמעויות: התכונה מקבלת simple והפעולה מקבלת continuous.", "הרוטב אינו מבצע פעולה, ולכן 'is tasting' אינו מתאים לחסר הראשון.", "הביטוי 'right now' דורש continuous עבור הפעולה המכוונת של השף."]}}, {"id": "tpr-014", "area": "tense-present", "topic": "present-simple-negative-auxiliary", "difficulty": 1, "type": "cloze", "hardnessSource": "trap", "tags": ["present-simple", "negative", "auxiliary-do", "need"], "sentence": "Dana ___ a visa to work in Portugal — she has an EU passport.", "answers": [["does not need", "doesn't need"]], "en": {"q": "Complete the sentence with the negative present simple of 'need'.", "hint": "A present simple negative needs the auxiliary 'do'.", "explanation": "The present simple negative is 'do/does + not + base form': 'Dana does not need a visa'. Note that the -s moves to the auxiliary, so 'doesn't needs' is wrong, and 'Dana not need' has no auxiliary at all."}, "he": {"q": "השלימו את המשפט בשלילה ב-present simple של הפועל 'need'.", "hint": "שלילה ב-present simple דורשת את ה-auxiliary 'do'.", "explanation": "השלילה ב-present simple נבנית כך: 'do/does + not + צורת בסיס': 'Dana does not need a visa'. ה-s עובר ל-auxiliary, ולכן 'doesn't needs' שגוי, ו-'Dana not need' נותר בלי auxiliary."}}, {"id": "tpa-001", "area": "tense-past", "topic": "past-continuous-interrupted-action", "difficulty": 1, "type": "mcq", "hardnessSource": "form", "tags": ["past-continuous", "interrupted-action", "was-were"], "answer": 2, "en": {"q": "Choose the correct sentence.", "options": ["I was cook dinner when the lights went out.", "I cooking dinner when the lights went out.", "I was cooking dinner when the lights went out.", "I were cooking dinner when the lights went out."], "hint": "The past continuous is 'was/were' + -ing.", "explanation": "The longer action that was already in progress goes in the past continuous ('was cooking'), and the short event that interrupts it goes in the past simple ('went out'). The continuous is built from 'was/were' + the -ing form.", "whyWrong": ["'was cook' uses the base form; the past continuous needs the -ing form.", "There is no auxiliary, so 'cooking' cannot act as the verb of the sentence.", "'were' does not agree with 'I'; the correct past form here is 'was'."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["I was cook dinner when the lights went out.", "I cooking dinner when the lights went out.", "I was cooking dinner when the lights went out.", "I were cooking dinner when the lights went out."], "hint": "ה-past continuous נבנה מ-'was/were' + צורת ing.", "explanation": "הפעולה הארוכה שכבר התרחשה מקבלת past continuous ('was cooking'), והאירוע הקצר שקוטע אותה מקבל past simple ('went out'). ה-continuous נבנה מ-'was/were' + צורת ה-ing.", "whyWrong": ["'was cook' משתמש בצורת הבסיס; ה-past continuous דורש צורת ing.", "אין auxiliary, ולכן 'cooking' אינו יכול לשמש כפועל המשפט.", "'were' אינו מתאים ל-'I'; הצורה הנכונה כאן היא 'was'."]}}, {"id": "tpa-002", "area": "tense-past", "topic": "past-simple-negative-base-form", "difficulty": 1, "type": "cloze", "hardnessSource": "trap", "tags": ["past-simple", "negative", "auxiliary-did", "bring"], "sentence": "He ___ his passport with him, so they stopped him at the gate.", "answers": [["did not bring", "didn't bring"]], "en": {"q": "Complete the sentence with the negative past simple of 'bring'.", "hint": "After 'did' the main verb returns to its base form.", "explanation": "A past simple negative is 'did + not + base form', so the past tense is carried by 'did' alone: 'He did not bring his passport'. 'He didn't brought' marks the past twice and is wrong."}, "he": {"q": "השלימו את המשפט בשלילה ב-past simple של הפועל 'bring'.", "hint": "אחרי 'did' הפועל הראשי חוזר לצורת הבסיס.", "explanation": "שלילה ב-past simple נבנית כך: 'did + not + צורת בסיס', כך שהעבר מסומן ב-'did' בלבד: 'He did not bring his passport'. הצורה 'He didn't brought' מסמנת את העבר פעמיים והיא שגויה."}}, {"id": "tpa-003", "area": "tense-past", "topic": "background-plus-event", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["past-continuous", "past-simple", "background-vs-event"], "answer": 1, "en": {"q": "Complete the sentence: 'The students ___ quietly when the principal ___ in.'", "options": ["were work / came", "were working / came", "were working / was coming", "worked / was coming"], "hint": "One action was already in progress; the other happened at a single moment.", "explanation": "The situation already under way takes the past continuous ('were working'), and the single event that cuts into it takes the past simple ('came in').", "whyWrong": ["'were work' is not a possible form; the past continuous needs 'working'.", "The principal's entry is a single moment, so it needs the past simple 'came'.", "Reverses the pattern: the ongoing background is in the simple and the moment in the continuous."]}, "he": {"q": "השלימו את המשפט: 'The students ___ quietly when the principal ___ in.'", "options": ["were work / came", "were working / came", "were working / was coming", "worked / was coming"], "hint": "פעולה אחת כבר התרחשה, והשנייה קרתה ברגע אחד.", "explanation": "המצב שכבר התרחש מקבל past continuous ('were working'), והאירוע החד-פעמי שקוטע אותו מקבל past simple ('came in').", "whyWrong": ["'were work' אינה צורה אפשרית; ה-past continuous דורש 'working'.", "כניסת המנהל היא רגע בודד, ולכן היא דורשת past simple: 'came'.", "הופך את התבנית: הרקע המתמשך ב-simple והרגע הבודד ב-continuous."]}}, {"id": "tpa-004", "area": "tense-past", "topic": "past-continuous-scene-setting", "difficulty": 2, "type": "cloze", "hardnessSource": "concept", "tags": ["past-continuous", "scene-setting", "narrative"], "sentence": "The sun ___ brightly when we finally left the house.", "answers": [["was shining"]], "en": {"q": "Complete the sentence with the past continuous of 'shine'.", "hint": "The weather is the background; leaving the house is the event.", "explanation": "The past continuous sets the scene that was already in progress, and the past simple reports the event inside that scene: 'The sun was shining when we left'."}, "he": {"q": "השלימו את המשפט ב-past continuous של הפועל 'shine'.", "hint": "מצב מזג האוויר הוא הרקע; היציאה מהבית היא האירוע.", "explanation": "ה-past continuous מצייר את הרקע שכבר התרחש, וה-past simple מדווח על האירוע שקרה בתוך אותו רקע: 'The sun was shining when we left'."}}, {"id": "tpa-005", "area": "tense-past", "topic": "used-to-vs-would-for-states", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["used-to", "would", "past-state"], "answer": 0, "en": {"q": "Complete the sentence: 'When I was a student, I ___ long hair and a beard.'", "options": ["used to have", "would have", "was used to have", "use to have"], "hint": "The sentence describes a past state, not a repeated action.", "explanation": "'used to' covers both past habits and past states, so a state such as having long hair takes 'used to have'. 'would' is limited to repeated actions and cannot express a past state.", "whyWrong": ["'would' cannot express a past state; it only reports repeated past actions.", "'be used to' means 'be accustomed to' and is followed by an -ing form, not an infinitive.", "In the affirmative the form keeps its -d: 'used to', not 'use to'."]}, "he": {"q": "השלימו את המשפט: 'When I was a student, I ___ long hair and a beard.'", "options": ["used to have", "would have", "was used to have", "use to have"], "hint": "המשפט מתאר מצב בעבר, לא פעולה חוזרת.", "explanation": "הצורה 'used to' מתאימה גם להרגלים וגם למצבים בעבר, ולכן מצב כמו שיער ארוך מקבל 'used to have'. ה-'would' מוגבל לפעולות חוזרות ואינו יכול להביע מצב בעבר.", "whyWrong": ["'would' אינו יכול להביע מצב בעבר; הוא מדווח רק על פעולות חוזרות.", "'be used to' פירושו 'להיות רגיל ל-' והוא מקבל צורת ing, לא שם פועל.", "בחיווי הצורה שומרת על ה-d: 'used to' ולא 'use to'."]}}, {"id": "tpa-006", "area": "tense-past", "topic": "used-to-form", "difficulty": 1, "type": "cloze", "hardnessSource": "form", "tags": ["used-to", "past-habit", "form"], "sentence": "We ___ in Beer Sheva before my father changed jobs.", "answers": [["used to live"]], "en": {"q": "Complete the sentence with 'used to' and the verb 'live'.", "hint": "The structure is 'used to' + base form.", "explanation": "A past habit or situation that no longer holds is expressed with 'used to' + base form: 'We used to live in Beer Sheva'. The -d belongs to 'used', so the main verb stays in the base form."}, "he": {"q": "השלימו את המשפט בעזרת 'used to' והפועל 'live'.", "hint": "המבנה הוא 'used to' + צורת בסיס.", "explanation": "הרגל או מצב בעבר שאינו קיים עוד מובע בעזרת 'used to' + צורת בסיס: 'We used to live in Beer Sheva'. ה-d שייך ל-'used', ולכן הפועל הראשי נשאר בצורת הבסיס."}}, {"id": "tpa-007", "area": "tense-past", "topic": "single-event-needs-past-simple", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["past-simple", "used-to", "would", "single-occasion"], "answer": 3, "en": {"q": "Complete the sentence: 'Last Tuesday he ___ the train.'", "options": ["would miss", "used to miss", "would missed", "missed"], "hint": "'used to' and 'would' both need repetition.", "explanation": "A single, dated event takes the past simple: 'Last Tuesday he missed the train'. 'used to' and 'would' describe something that happened again and again, so they cannot report one occasion.", "whyWrong": ["'would' reports a repeated past action, which clashes with the single date.", "'used to' also requires repetition over a period, not one Tuesday.", "'would missed' is not a possible form; after 'would' the verb stays in the base form."]}, "he": {"q": "השלימו את המשפט: 'Last Tuesday he ___ the train.'", "options": ["would miss", "used to miss", "would missed", "missed"], "hint": "גם 'used to' וגם 'would' דורשים חזרתיות.", "explanation": "אירוע חד-פעמי עם תאריך מוגדר מקבל past simple: 'Last Tuesday he missed the train'. הצורות 'used to' ו-'would' מתארות משהו שקרה שוב ושוב, ולכן אינן מתאימות לפעם אחת.", "whyWrong": ["'would' מדווח על פעולה חוזרת בעבר, וזה מתנגש עם התאריך היחיד.", "גם 'used to' דורש חזרתיות על פני תקופה, לא יום שלישי אחד.", "'would missed' אינה צורה אפשרית; אחרי 'would' הפועל נשאר בצורת בסיס."]}}, {"id": "tpa-008", "area": "tense-past", "topic": "past-continuous-tentative-request", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["past-continuous", "politeness", "tentative-request"], "sentence": "I ___ whether you could sign this form today.", "answers": [["was wondering"]], "en": {"q": "Complete the sentence with the past continuous of 'wonder' so that the request sounds tentative.", "hint": "The past continuous softens a request.", "explanation": "English makes a request more tentative by putting the introducing verb in the past continuous: 'I was wondering whether you could...'. The present simple 'I wonder' is more direct, and the past simple 'I wondered' sounds abrupt."}, "he": {"q": "השלימו את המשפט ב-past continuous של הפועל 'wonder', כך שהבקשה תישמע מהוססת ומנומסת.", "hint": "ה-past continuous מרכך בקשה.", "explanation": "באנגלית מרככים בקשה על ידי הצבת הפועל הפותח ב-past continuous: 'I was wondering whether you could...'. הצורה 'I wonder' ישירה יותר, והצורה 'I wondered' נשמעת חדה ומנותקת."}}, {"id": "tpa-009", "area": "tense-past", "topic": "there-were-plural", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["there-was-were", "past-simple", "agreement"], "answer": 2, "en": {"q": "Complete the sentence: 'There ___ too many people in the hall for everyone to sit down.'", "options": ["was", "has been", "were", "is"], "hint": "In a there-construction the verb agrees with the noun that follows it.", "explanation": "In 'there is / there are' sentences the verb agrees with the noun after it. 'people' is plural, and the sentence is set in the past, so the correct form is 'there were'.", "whyWrong": ["'was' is singular; standard written English requires 'were' with 'people'.", "'has been' is both singular and present perfect, which does not fit a past description.", "'is' is present and singular, so it fits neither the time nor the plural noun."]}, "he": {"q": "השלימו את המשפט: 'There ___ too many people in the hall for everyone to sit down.'", "options": ["was", "has been", "were", "is"], "hint": "במבנה there הפועל מתאים לשם העצם שבא אחריו.", "explanation": "במשפטי 'there is / there are' הפועל מתאים לשם העצם שבא אחריו. המילה 'people' היא רבים והמשפט בעבר, ולכן הצורה הנכונה היא 'there were'.", "whyWrong": ["'was' הוא יחיד; באנגלית כתובה תקנית נדרש 'were' עם 'people'.", "'has been' הוא יחיד וגם present perfect, ולכן אינו מתאים לתיאור בעבר.", "'is' הוא הווה ויחיד, ולכן אינו מתאים לא לזמן ולא לשם העצם ברבים."]}}, {"id": "tpa-010", "area": "tense-past", "topic": "there-was-uncountable", "difficulty": 2, "type": "cloze", "hardnessSource": "concept", "tags": ["there-was-were", "uncountable-nouns", "information"], "sentence": "There ___ very little information about the delay at the time.", "answers": [["was"]], "en": {"q": "Complete the sentence with the past simple of 'be'.", "hint": "'information' is uncountable.", "explanation": "'information', like 'advice' and 'news', is uncountable and therefore grammatically singular, so the past form is 'there was very little information'. There is no plural 'informations'."}, "he": {"q": "השלימו את המשפט ב-past simple של הפועל 'be'.", "hint": "המילה 'information' אינה ניתנת לספירה.", "explanation": "המילה 'information', כמו 'advice' ו-'news', אינה ניתנת לספירה ולכן היא יחיד מבחינה דקדוקית: 'there was very little information'. אין צורת רבים 'informations'."}}, {"id": "tpa-011", "area": "tense-past", "topic": "was-going-to-unrealised-plan", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["was-going-to", "future-in-the-past", "unrealised-plan"], "answer": 0, "en": {"q": "Complete the sentence: 'We ___ at six, but the flight was cancelled.'", "options": ["were going to leave", "are going to leave", "will be leaving", "was going to leave"], "hint": "The plan belonged to the past and never happened.", "explanation": "'was/were going to' + base form reports a past intention that was not carried out: 'We were going to leave at six, but the flight was cancelled'.", "whyWrong": ["'are going to' states a present plan, while the rest of the sentence is in the past.", "'will be leaving' points forward to the future, not back to a cancelled plan.", "'was' does not agree with 'we'; a plural subject needs 'were'."]}, "he": {"q": "השלימו את המשפט: 'We ___ at six, but the flight was cancelled.'", "options": ["were going to leave", "are going to leave", "will be leaving", "was going to leave"], "hint": "התכנית הייתה בעבר ולא התממשה.", "explanation": "המבנה 'was/were going to' + צורת בסיס מדווח על כוונה בעבר שלא יצאה לפועל: 'We were going to leave at six, but the flight was cancelled'.", "whyWrong": ["'are going to' מביע תכנית בהווה, בעוד שאר המשפט בעבר.", "'will be leaving' מצביע קדימה אל העתיד, לא אחורה אל תכנית שבוטלה.", "'was' אינו מתאים ל-'we'; נושא ברבים דורש 'were'."]}}, {"id": "tpa-012", "area": "tense-past", "topic": "narrative-sequence-past-simple", "difficulty": 3, "type": "cloze", "hardnessSource": "concept", "tags": ["past-simple", "narrative-sequence", "no-perfect-needed"], "sentence": "He ___ his coffee and then ___ the office without a word.", "answers": [["finished"], ["left"]], "en": {"q": "Complete both blanks with the past simple of 'finish' and 'leave'.", "hint": "The events are told in the order in which they happened.", "explanation": "When past events are narrated in the order they occurred, the past simple is enough for all of them: 'He finished his coffee and then left the office'. A past perfect is only needed when you step back to an earlier event."}, "he": {"q": "השלימו את שני החסרים ב-past simple של הפעלים 'finish' ו-'leave'.", "hint": "האירועים מסופרים בסדר שבו הם קרו.", "explanation": "כאשר אירועי עבר מסופרים בסדר שבו התרחשו, ה-past simple מספיק לכולם: 'He finished his coffee and then left the office'. ה-past perfect נחוץ רק כשחוזרים אחורה לאירוע מוקדם יותר."}}, {"id": "tpa-013", "area": "tense-past", "topic": "was-about-to", "difficulty": 4, "type": "mcq", "hardnessSource": "form", "tags": ["was-about-to", "imminent-past-action", "form"], "answer": 1, "en": {"q": "Complete the sentence: 'I ___ the house when the phone rang.'", "options": ["am about to leave", "was about to leave", "was about leaving", "was about leave"], "hint": "The action was on the point of happening at a past moment.", "explanation": "'be about to' + base form describes an action on the point of happening; in a past narrative it becomes 'was/were about to': 'I was about to leave the house when the phone rang'.", "whyWrong": ["'am about to' is present, but the phone rang in the past.", "'about' is followed by 'to' + base form, never by an -ing form.", "The 'to' is missing; the fixed structure is 'was about to leave'."]}, "he": {"q": "השלימו את המשפט: 'I ___ the house when the phone rang.'", "options": ["am about to leave", "was about to leave", "was about leaving", "was about leave"], "hint": "הפעולה הייתה עומדת לקרות ברגע מסוים בעבר.", "explanation": "המבנה 'be about to' + צורת בסיס מתאר פעולה שעומדת לקרות ממש; בסיפור בעבר הוא הופך ל-'was/were about to': 'I was about to leave the house when the phone rang'.", "whyWrong": ["'am about to' הוא הווה, אבל הטלפון צלצל בעבר.", "אחרי 'about' מופיע 'to' + צורת בסיס ולא צורת ing.", "חסר ה-'to'; המבנה הקבוע הוא 'was about to leave'."]}}, {"id": "tpa-014", "area": "tense-past", "topic": "irregular-past-choose", "difficulty": 1, "type": "cloze", "hardnessSource": "form", "tags": ["past-simple", "irregular-verbs", "choose"], "sentence": "The committee ___ a new chairman last March.", "answers": [["chose"]], "en": {"q": "Complete the sentence with the past simple of 'choose'.", "hint": "'choose' is irregular.", "explanation": "'choose' has the irregular past simple 'chose' (and the past participle 'chosen'). The past simple is required because 'last March' names a finished period of time."}, "he": {"q": "השלימו את המשפט ב-past simple של הפועל 'choose'.", "hint": "הפועל 'choose' הוא פועל יוצא דופן.", "explanation": "לפועל 'choose' יש צורת past simple יוצאת דופן: 'chose' (וצורת ה-participle היא 'chosen'). נדרש past simple מפני ש-'last March' מציין זמן שהסתיים."}}, {"id": "tpf-001", "area": "tense-perfect", "topic": "finished-time-needs-past-simple", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["present-perfect", "past-simple", "yesterday", "finished-time"], "answer": 1, "en": {"q": "Choose the correct sentence.", "options": ["I have seen him yesterday at the station.", "I saw him yesterday at the station.", "I have saw him yesterday at the station.", "I had seen him yesterday at the station."], "hint": "'yesterday' names a time that is over.", "explanation": "A time expression that names a finished period ('yesterday', 'last week', 'in 2019', 'two hours ago') requires the past simple: 'I saw him yesterday'. The present perfect never combines with such expressions.", "whyWrong": ["The present perfect cannot be used with 'yesterday', which names a finished time.", "'have saw' uses the past simple instead of the participle 'seen', and 'yesterday' blocks the perfect anyway.", "The past perfect needs a second, later past event to look back from; there is none here."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["I have seen him yesterday at the station.", "I saw him yesterday at the station.", "I have saw him yesterday at the station.", "I had seen him yesterday at the station."], "hint": "המילה 'yesterday' מציינת זמן שנגמר.", "explanation": "ביטוי זמן שמציין תקופה שהסתיימה ('yesterday', 'last week', 'in 2019', 'two hours ago') מחייב past simple: 'I saw him yesterday'. ה-present perfect אינו מצטרף לביטויים כאלה.", "whyWrong": ["אי אפשר להשתמש ב-present perfect עם 'yesterday', שמציין זמן שהסתיים.", "'have saw' משתמש ב-past simple במקום ב-participle 'seen', ומלבד זאת 'yesterday' חוסם את ה-perfect.", "ה-past perfect דורש אירוע עבר מאוחר יותר שממנו מביטים אחורה, וכאן אין אירוע כזה."]}}, {"id": "tpf-002", "area": "tense-perfect", "topic": "since-with-situation-still-true", "difficulty": 1, "type": "cloze", "hardnessSource": "trap", "tags": ["present-perfect", "since", "unfinished-period"], "sentence": "I ___ in Haifa since 2019, and I am still there.", "answers": [["have lived", "'ve lived", "have been living", "'ve been living"]], "en": {"q": "Complete the sentence with a present perfect form of 'live' — the situation is still true today.", "hint": "A period that started in the past and continues now cannot take the present simple.", "explanation": "A situation that began in the past and is still true takes the present perfect: 'I have lived in Haifa since 2019'. With 'live' the continuous 'have been living' is equally good. 'I live here since 2019' is the classic mistake."}, "he": {"q": "השלימו את המשפט בצורת present perfect של הפועל 'live' — המצב נכון גם היום.", "hint": "תקופה שהתחילה בעבר ונמשכת עד עכשיו אינה יכולה לקבל present simple.", "explanation": "מצב שהתחיל בעבר ועודנו נכון מקבל present perfect: 'I have lived in Haifa since 2019'. עם הפועל 'live' גם הצורה 'have been living' טובה בדיוק באותה מידה. הצורה 'I live here since 2019' היא הטעות הקלאסית."}}, {"id": "tpf-003", "area": "tense-perfect", "topic": "ever-experience-question", "difficulty": 1, "type": "mcq", "hardnessSource": "concept", "tags": ["present-perfect", "ever", "been-to", "questions"], "answer": 2, "en": {"q": "Choose the correct question.", "options": ["Are you ever been to Greece?", "Did you ever be to Greece?", "Have you ever been to Greece?", "Have you ever being to Greece?"], "hint": "The question asks about experience at any time up to now.", "explanation": "Experience at an unspecified time up to now is asked with the present perfect and 'ever': 'Have you ever been to Greece?'. 'been to' is the fixed expression for visiting a place.", "whyWrong": ["The present perfect is formed with 'have', not with 'be': 'have you been'.", "After 'did' the verb takes its base form, and the perfect idea needs 'have', not 'did'.", "'being' is the -ing form; the present perfect needs the past participle 'been'."]}, "he": {"q": "בחרו את השאלה הנכונה.", "options": ["Are you ever been to Greece?", "Did you ever be to Greece?", "Have you ever been to Greece?", "Have you ever being to Greece?"], "hint": "השאלה עוסקת בניסיון חיים בזמן לא מוגדר עד עכשיו.", "explanation": "שאלה על ניסיון בזמן לא מוגדר עד עכשיו נשאלת ב-present perfect עם 'ever': 'Have you ever been to Greece?'. הביטוי 'been to' הוא הצורה הקבועה לביקור במקום.", "whyWrong": ["ה-present perfect נבנה עם 'have' ולא עם 'be': 'have you been'.", "אחרי 'did' הפועל בצורת בסיס, ובכל מקרה רעיון ה-perfect דורש 'have' ולא 'did'.", "'being' היא צורת ה-ing; ה-present perfect דורש את ה-participle 'been'."]}}, {"id": "tpf-004", "area": "tense-perfect", "topic": "for-vs-since", "difficulty": 2, "type": "cloze", "hardnessSource": "trap", "tags": ["present-perfect", "for", "since"], "sentence": "She has worked here ___ five years, and ___ last spring she has led the team.", "answers": [["for"], ["since"]], "en": {"q": "Complete each blank with 'for' or 'since'.", "hint": "One marks a length of time, the other a starting point.", "explanation": "'for' introduces how long a period lasts ('for five years'); 'since' introduces the point at which the period began ('since last spring'). Both are used with the present perfect."}, "he": {"q": "השלימו כל חסר במילה 'for' או 'since'.", "hint": "אחת מהן מציינת אורך של זמן והשנייה נקודת התחלה.", "explanation": "המילה 'for' מציינת כמה זמן נמשכת התקופה ('for five years'), והמילה 'since' מציינת את הנקודה שבה התקופה התחילה ('since last spring'). שתיהן משמשות עם present perfect."}}, {"id": "tpf-005", "area": "tense-perfect", "topic": "yet-in-negatives", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["present-perfect", "yet", "already", "adverbs"], "answer": 3, "en": {"q": "Complete the sentence: 'I haven't spoken to him ___.'", "options": ["already", "just", "ago", "yet"], "hint": "The expected action has not happened up to now.", "explanation": "In negatives and in questions about something expected, the present perfect takes 'yet' at the end: 'I haven't spoken to him yet'. 'already' belongs in affirmative sentences, and 'just' goes before the participle.", "whyWrong": ["'already' is used in affirmative sentences, not after a negative present perfect.", "'just' is placed between 'have' and the participle: 'I have just spoken to him'.", "'ago' follows a length of time ('two days ago') and goes with the past simple."]}, "he": {"q": "השלימו את המשפט: 'I haven't spoken to him ___.'", "options": ["already", "just", "ago", "yet"], "hint": "הפעולה המצופה לא התרחשה עד עכשיו.", "explanation": "בשלילה ובשאלות על משהו מצופה, ה-present perfect מקבל 'yet' בסוף המשפט: 'I haven't spoken to him yet'. המילה 'already' שייכת למשפטי חיווי, ו-'just' ממוקמת לפני ה-participle.", "whyWrong": ["'already' משמשת במשפטי חיווי, לא אחרי present perfect בשלילה.", "'just' ממוקמת בין 'have' ל-participle: 'I have just spoken to him'.", "'ago' באה אחרי יחידת זמן ('two days ago') ומצטרפת ל-past simple."]}}, {"id": "tpf-006", "area": "tense-perfect", "topic": "present-perfect-negative-participle", "difficulty": 2, "type": "cloze", "hardnessSource": "form", "tags": ["present-perfect", "negative", "irregular-participle", "write"], "sentence": "She ___ to me since May, and I am starting to worry.", "answers": [["has not written", "hasn't written"]], "en": {"q": "Complete the sentence with the negative present perfect of 'write'.", "hint": "The participle of 'write' is irregular.", "explanation": "The present perfect is 'have/has + past participle', and the participle of 'write' is 'written': 'She has not written to me since May'. 'has not wrote' uses the past simple form and is wrong."}, "he": {"q": "השלימו את המשפט בשלילה ב-present perfect של הפועל 'write'.", "hint": "צורת ה-participle של 'write' יוצאת דופן.", "explanation": "ה-present perfect נבנה מ-'have/has + past participle', וצורת ה-participle של 'write' היא 'written': 'She has not written to me since May'. הצורה 'has not wrote' משתמשת בצורת העבר הפשוט והיא שגויה."}}, {"id": "tpf-007", "area": "tense-perfect", "topic": "quantity-needs-perfect-simple", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["present-perfect", "present-perfect-continuous", "quantity"], "answer": 0, "en": {"q": "Complete the sentence: 'I ___ three books since the start of the holiday.'", "options": ["have read", "have been reading", "am reading", "read"], "hint": "The sentence counts completed results, not time spent.", "explanation": "When you state how much or how many has been completed, English uses the present perfect simple: 'I have read three books'. The continuous describes the activity itself and does not take a finished quantity.", "whyWrong": ["The present perfect continuous describes ongoing activity and cannot take 'three books' as a completed count.", "'am reading' describes this moment, not a result accumulated since the holiday began.", "The past simple cannot be used with 'since', which opens a period reaching up to now."]}, "he": {"q": "השלימו את המשפט: 'I ___ three books since the start of the holiday.'", "options": ["have read", "have been reading", "am reading", "read"], "hint": "המשפט מונה תוצאות שהושלמו, לא זמן שעבר.", "explanation": "כאשר מציינים כמה דברים הושלמו, אנגלית משתמשת ב-present perfect simple: 'I have read three books'. ה-continuous מתאר את הפעולה עצמה ואינו מצטרף לכמות מוגמרת.", "whyWrong": ["ה-present perfect continuous מתאר פעולה מתמשכת ואינו יכול לקבל 'three books' כמספר מוגמר.", "'am reading' מתאר את הרגע הזה, לא תוצאה שהצטברה מתחילת החופשה.", "אי אפשר להשתמש ב-past simple עם 'since', שפותח תקופה שנמשכת עד עכשיו."]}}, {"id": "tpf-008", "area": "tense-perfect", "topic": "present-perfect-continuous-duration", "difficulty": 3, "type": "cloze", "hardnessSource": "concept", "tags": ["present-perfect-continuous", "duration", "since"], "sentence": "They ___ for the results since nine o'clock this morning.", "answers": [["have been waiting", "'ve been waiting"]], "en": {"q": "Complete the sentence with the present perfect continuous of 'wait'.", "hint": "The waiting began in the past and is still going on.", "explanation": "The present perfect continuous ('have been' + -ing) stresses how long an activity has been going on and that it has not finished: 'They have been waiting since nine o'clock'."}, "he": {"q": "השלימו את המשפט ב-present perfect continuous של הפועל 'wait'.", "hint": "ההמתנה התחילה בעבר ונמשכת גם עכשיו.", "explanation": "ה-present perfect continuous (צורת 'have been' + ing) מדגיש כמה זמן הפעולה נמשכת ושהיא עדיין לא הסתיימה: 'They have been waiting since nine o'clock'."}}, {"id": "tpf-009", "area": "tense-perfect", "topic": "how-long-question", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["present-perfect-continuous", "how-long", "questions"], "answer": 2, "en": {"q": "Complete the question: 'How long ___ English?'", "options": ["are you learning", "do you learn", "have you been learning", "you are learning"], "hint": "The question asks about a period that reaches up to now.", "explanation": "'How long...?' asks about a period that began in the past and continues now, so it takes the present perfect (continuous with activity verbs): 'How long have you been learning English?'.", "whyWrong": ["The present continuous cannot measure a period reaching back into the past.", "The present simple describes a habit, not the length of time up to now.", "A question needs the auxiliary before the subject; 'you are' is statement order."]}, "he": {"q": "השלימו את השאלה: 'How long ___ English?'", "options": ["are you learning", "do you learn", "have you been learning", "you are learning"], "hint": "השאלה עוסקת בתקופה שנמשכת עד עכשיו.", "explanation": "השאלה 'How long...?' עוסקת בתקופה שהתחילה בעבר ונמשכת בהווה, ולכן היא דורשת present perfect (ובפעלי פעולה בעיקר continuous): 'How long have you been learning English?'.", "whyWrong": ["ה-present continuous אינו יכול למדוד תקופה שמתחילה בעבר.", "ה-present simple מתאר הרגל, לא את משך הזמן עד עכשיו.", "בשאלה ה-auxiliary בא לפני הנושא; 'you are' הוא סדר של משפט חיווי."]}}, {"id": "tpf-010", "area": "tense-perfect", "topic": "period-still-open", "difficulty": 2, "type": "cloze", "hardnessSource": "concept", "tags": ["present-perfect", "so-far", "unfinished-period"], "sentence": "So far this week we ___ three fire drills, and it is only Tuesday.", "answers": [["have had", "'ve had"]], "en": {"q": "Complete the sentence with the present perfect of 'have'.", "hint": "The week is not over yet.", "explanation": "When the period mentioned is still running ('so far this week', 'today', 'this month'), the result up to now is reported in the present perfect: 'we have had three fire drills'."}, "he": {"q": "השלימו את המשפט ב-present perfect של הפועל 'have'.", "hint": "השבוע עוד לא נגמר.", "explanation": "כאשר התקופה שמוזכרת עדיין נמשכת ('so far this week', 'today', 'this month'), מדווחים על התוצאה עד עכשיו ב-present perfect: 'we have had three fire drills'."}}, {"id": "tpf-011", "area": "tense-perfect", "topic": "when-question-past-simple", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["past-simple", "present-perfect", "when-questions"], "answer": 0, "en": {"q": "Complete the question: 'When ___ the car?'", "options": ["did you buy", "have you bought", "you bought", "have you buy"], "hint": "'When...?' asks for a specific point in past time.", "explanation": "A 'When...?' question asks for a definite past time, and a definite past time requires the past simple: 'When did you buy the car?'. The present perfect cannot be pinned to a point in the past.", "whyWrong": ["The present perfect cannot answer 'when', because it never names a definite past time.", "A question needs the auxiliary 'did' before the subject; 'you bought' is statement order.", "'have you buy' mixes 'have' with the base form instead of the participle 'bought'."]}, "he": {"q": "השלימו את השאלה: 'When ___ the car?'", "options": ["did you buy", "have you bought", "you bought", "have you buy"], "hint": "שאלת 'When...?' מבקשת נקודת זמן מוגדרת בעבר.", "explanation": "שאלה בפתיח 'When...?' מבקשת זמן מוגדר בעבר, וזמן מוגדר בעבר מחייב past simple: 'When did you buy the car?'. ה-present perfect אינו יכול להתחבר לנקודת זמן בעבר.", "whyWrong": ["ה-present perfect אינו יכול לענות על 'when', מפני שהוא לעולם אינו מציין זמן מוגדר בעבר.", "בשאלה נדרש ה-auxiliary 'did' לפני הנושא; 'you bought' הוא סדר של משפט חיווי.", "'have you buy' מחבר 'have' לצורת בסיס במקום ל-participle 'bought'."]}}, {"id": "tpf-012", "area": "tense-perfect", "topic": "past-perfect-earlier-event", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["past-perfect", "by-the-time", "sequence"], "sentence": "By the time we reached the hall, the lecture ___.", "answers": [["had started", "'d started", "had already started", "'d already started"]], "en": {"q": "Complete the sentence with the past perfect of 'start'.", "hint": "Which of the two past events happened first?", "explanation": "The past perfect marks the earlier of two past events: the lecture began before we reached the hall, so 'the lecture had started'. The later event stays in the past simple ('we reached')."}, "he": {"q": "השלימו את המשפט ב-past perfect של הפועל 'start'.", "hint": "איזה משני אירועי העבר קרה קודם?", "explanation": "ה-past perfect מסמן את המוקדם מבין שני אירועי עבר: ההרצאה התחילה לפני שהגענו לאולם, ולכן 'the lecture had started'. האירוע המאוחר נשאר ב-past simple ('we reached')."}}, {"id": "tpf-013", "area": "tense-perfect", "topic": "past-perfect-only-on-earlier-event", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["past-perfect", "past-simple", "after-clause", "sequence"], "answer": 2, "en": {"q": "Choose the correct sentence.", "options": ["After he had eaten, he had gone out.", "After he ate, he had gone out.", "After he had eaten, he went out.", "After he has eaten, he went out."], "hint": "Only one of the two actions can carry the past perfect.", "explanation": "The past perfect belongs to the earlier action only; the action that follows stays in the past simple: 'After he had eaten, he went out'.", "whyWrong": ["Puts both verbs in the past perfect, although only the earlier action needs it.", "Reverses the order: the past perfect lands on the later action and the simple on the earlier one.", "The present perfect cannot be used inside a narrative that is set in the past."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["After he had eaten, he had gone out.", "After he ate, he had gone out.", "After he had eaten, he went out.", "After he has eaten, he went out."], "hint": "רק אחת משתי הפעולות יכולה לקבל past perfect.", "explanation": "ה-past perfect שייך רק לפעולה המוקדמת; הפעולה שבאה אחריה נשארת ב-past simple: 'After he had eaten, he went out'.", "whyWrong": ["מציב את שני הפעלים ב-past perfect, אף שרק הפעולה המוקדמת זקוקה לו.", "הופך את הסדר: ה-past perfect נופל על הפעולה המאוחרת וה-simple על המוקדמת.", "אי אפשר להשתמש ב-present perfect בתוך סיפור שממוקם בעבר."]}}, {"id": "tpf-014", "area": "tense-perfect", "topic": "first-time-pattern", "difficulty": 3, "type": "cloze", "hardnessSource": "form", "tags": ["present-perfect", "first-time", "fixed-pattern"], "sentence": "This is the first time I ___ an automatic car.", "answers": [["have driven", "'ve driven"]], "en": {"q": "Complete the sentence with the present perfect of 'drive'.", "hint": "'This is the first time...' is followed by a fixed tense.", "explanation": "After 'This is the first / second / third time...' English uses the present perfect: 'This is the first time I have driven an automatic car'. The past simple 'I drove' does not fit this pattern."}, "he": {"q": "השלימו את המשפט ב-present perfect של הפועל 'drive'.", "hint": "אחרי 'This is the first time...' בא זמן קבוע.", "explanation": "אחרי 'This is the first / second / third time...' אנגלית משתמשת ב-present perfect: 'This is the first time I have driven an automatic car'. הצורה 'I drove' אינה מתאימה לתבנית הזו."}}, {"id": "tpf-015", "area": "tense-perfect", "topic": "it-has-been-x-since", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["present-perfect", "since-clause", "past-simple"], "answer": 3, "en": {"q": "Choose the correct sentence.", "options": ["It's three years since he has left.", "It's been three years since he has left.", "It has been three years since he is leaving.", "It has been three years since he left."], "hint": "The two halves of the sentence do not take the same tense.", "explanation": "In this pattern the main clause takes the present perfect ('It has been three years') and the 'since'-clause takes the past simple for the point at which the period began ('since he left').", "whyWrong": ["The 'since'-clause names the starting point, so it needs the past simple 'left'.", "The main clause is right, but 'since he has left' still has the wrong tense after 'since'.", "'since he is leaving' puts a present continuous after 'since', which cannot mark a past starting point."]}, "he": {"q": "בחרו את המשפט הנכון.", "options": ["It's three years since he has left.", "It's been three years since he has left.", "It has been three years since he is leaving.", "It has been three years since he left."], "hint": "שני חלקי המשפט אינם מקבלים אותו זמן.", "explanation": "בתבנית הזו הפסוקית העיקרית מקבלת present perfect ('It has been three years'), ופסוקית ה-since מקבלת past simple לציון הנקודה שבה התקופה התחילה ('since he left').", "whyWrong": ["פסוקית ה-since מציינת את נקודת ההתחלה, ולכן היא דורשת past simple: 'left'.", "הפסוקית העיקרית נכונה, אבל 'since he has left' עדיין בזמן שגוי אחרי 'since'.", "'since he is leaving' מציב present continuous אחרי 'since', והוא אינו יכול לסמן נקודת התחלה בעבר."]}}, {"id": "tpf-016", "area": "tense-perfect", "topic": "past-perfect-continuous", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["past-perfect-continuous", "duration-before-past-event"], "sentence": "He ___ for two hours before anyone came to the desk.", "answers": [["had been waiting", "'d been waiting"]], "en": {"q": "Complete the sentence with the past perfect continuous of 'wait'.", "hint": "The waiting filled the time up to a later past event.", "explanation": "The past perfect continuous ('had been' + -ing) shows how long an activity had been going on before a later past event: 'He had been waiting for two hours before anyone came'."}, "he": {"q": "השלימו את המשפט ב-past perfect continuous של הפועל 'wait'.", "hint": "ההמתנה מילאה את הזמן עד לאירוע מאוחר יותר בעבר.", "explanation": "ה-past perfect continuous (צורת 'had been' + ing) מראה כמה זמן נמשכה פעולה לפני אירוע מאוחר יותר בעבר: 'He had been waiting for two hours before anyone came'."}}, {"id": "tpf-017", "area": "tense-perfect", "topic": "closed-period-this-morning", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["present-perfect", "past-simple", "closed-period"], "answer": 1, "en": {"q": "It is now evening. Complete the sentence: 'I ___ three cups of coffee this morning.'", "options": ["have had", "had", "have been having", "am having"], "hint": "Is the morning still going on?", "explanation": "'this morning' is an unfinished period only while it lasts. Spoken in the evening it names a closed period, so the past simple is required: 'I had three cups of coffee this morning'.", "whyWrong": ["The present perfect would be right during the morning, but by the evening that period is closed.", "The continuous cannot take a completed quantity such as 'three cups of coffee'.", "'am having' describes this moment, which is no longer the morning."]}, "he": {"q": "השעה כרגע היא שעת ערב. השלימו את המשפט: 'I ___ three cups of coffee this morning.'", "options": ["have had", "had", "have been having", "am having"], "hint": "האם הבוקר עוד נמשך?", "explanation": "הביטוי 'this morning' מציין תקופה פתוחה רק כל זמן שהבוקר נמשך. כשהמשפט נאמר בערב, מדובר בתקופה שהסתיימה, ולכן נדרש past simple: 'I had three cups of coffee this morning'.", "whyWrong": ["ה-present perfect היה נכון במהלך הבוקר, אבל בערב התקופה הזו כבר סגורה.", "ה-continuous אינו יכול לקבל כמות מוגמרת כמו 'three cups of coffee'.", "'am having' מתאר את הרגע הזה, והרגע הזה אינו הבוקר."]}}, {"id": "tpf-018", "area": "tense-perfect", "topic": "reported-speech-backshift", "difficulty": 4, "type": "cloze", "hardnessSource": "transform", "tags": ["past-perfect", "reported-speech", "backshift"], "sentence": "She told me that she ___ her passport the day before.", "answers": [["had lost", "'d lost"]], "en": {"q": "Report the words 'I lost my passport yesterday': complete the sentence with the past perfect of 'lose'.", "hint": "Reported speech moves a past simple one step further back.", "explanation": "When a past simple statement is reported after a past reporting verb, it shifts to the past perfect: 'I lost my passport' -> 'She told me that she had lost her passport the day before'."}, "he": {"q": "העבירו את המשפט 'I lost my passport yesterday' לדיבור עקיף: השלימו ב-past perfect של הפועל 'lose'.", "hint": "בדיבור עקיף ה-past simple נסוג צעד אחד אחורה.", "explanation": "כאשר מדווחים אמירה שהיתה ב-past simple אחרי פועל דיווח בעבר, הזמן נסוג ל-past perfect: 'I lost my passport' -> 'She told me that she had lost her passport the day before'."}}, {"id": "tfu-001", "area": "tense-future", "topic": "will-spontaneous-decision", "difficulty": 1, "type": "cloze", "hardnessSource": "concept", "tags": ["future", "will", "spontaneous-decision"], "sentence": "The phone is ringing. Don't get up — I ___ it.", "answers": [["will answer", "'ll answer"]], "en": {"q": "Complete the sentence with 'will' + 'answer': a decision made at the moment of speaking.", "hint": "A decision taken right now, while you are speaking, takes 'will'.", "explanation": "English uses 'will' (often contracted to 'll) for a decision made at the moment of speaking: 'I'll answer it'. A plan made earlier would take 'be going to'."}, "he": {"q": "השלימו את המשפט ב-'will' + הפועל 'answer' — החלטה שנופלת ברגע הדיבור.", "hint": "החלטה שמתקבלת עכשו, בזמן הדיבור, מקבלת 'will'.", "explanation": "להחלטה שמתקבלת ברגע הדיבור משתמשים ב-'will' (לרוב בקיצור 'll): 'I'll answer it'. תוכנית שנקבעה מראש הייתה מקבלת 'be going to'."}}, {"id": "tfu-002", "area": "tense-future", "topic": "be-going-to-evidence", "difficulty": 1, "type": "mcq", "hardnessSource": "form", "tags": ["future", "be-going-to", "prediction-from-evidence"], "answer": 2, "en": {"q": "Look at those black clouds — it ___ rain. Choose the correct form.", "options": ["is going to raining", "goes to rain", "is going to rain", "will going to rain"], "hint": "'be going to' is followed by the base form of the verb.", "explanation": "Evidence we can see now points to 'be going to': the structure is 'be' + 'going to' + base form, so 'it is going to rain'.", "whyWrong": ["After 'going to' English uses the base form 'rain', not 'raining'.", "'goes to rain' is not a future form; the structure needs 'be' + 'going to'.", "'will' and 'going to' are two different futures and cannot be combined."]}, "he": {"q": "Look at those black clouds — it ___ rain. בחרו את הצורה הנכונה.", "options": ["is going to raining", "goes to rain", "is going to rain", "will going to rain"], "hint": "אחרי 'be going to' באה צורת הבסיס של הפועל.", "explanation": "כשיש עדות גלויה לעין משתמשים ב-'be going to', והמבנה הוא 'be' + 'going to' + צורת בסיס: 'it is going to rain'.", "whyWrong": ["אחרי 'going to' באה צורת הבסיס 'rain' ולא 'raining'.", "'goes to rain' אינה צורת עתיד; המבנה דורש 'be' + 'going to'.", "'will' ו-'going to' הם שתי צורות עתיד שונות ואין לשלב ביניהן."]}}, {"id": "tfu-003", "area": "tense-future", "topic": "be-about-to", "difficulty": 1, "type": "mcq", "hardnessSource": "form", "tags": ["future", "be-about-to", "imminent"], "answer": 0, "en": {"q": "Please be quiet — the lecture ___ begin. Choose the correct form.", "options": ["is about to", "is about", "about to", "is about for"], "hint": "The fixed phrase for 'in a moment' is 'be about to' + base form.", "explanation": "'be about to' + base form means that something will happen in a moment: 'the lecture is about to begin'.", "whyWrong": ["'is about' without 'to' cannot be followed by a verb.", "The phrase needs a form of 'be': 'is about to begin'.", "The fixed phrase is 'about to', never 'about for'."]}, "he": {"q": "Please be quiet — the lecture ___ begin. בחרו את הצורה הנכונה.", "options": ["is about to", "is about", "about to", "is about for"], "hint": "הצירוף הקבוע למשמעות 'עוד רגע' הוא 'be about to' + צורת בסיס.", "explanation": "המבנה 'be about to' + צורת בסיס מביע פעולה שעומדת להתרחש מיד: 'the lecture is about to begin'.", "whyWrong": ["'is about' ללא 'to' אינו יכול לבוא לפני פועל.", "הצירוף דורש צורה של 'be': 'is about to begin'.", "הצירוף הקבוע הוא 'about to' ולא 'about for'."]}}, {"id": "tfu-004", "area": "tense-future", "topic": "going-to-prior-intention", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["future", "be-going-to", "will", "intention"], "answer": 1, "en": {"q": "I bought all this flour yesterday because I ___ a cake tomorrow. Choose the correct completion.", "options": ["will make", "am going to make", "make", "will have made"], "hint": "The flour was bought yesterday, so the plan is older than this sentence.", "explanation": "An intention formed before the moment of speaking takes 'be going to': the flour was already bought, so 'I am going to make a cake tomorrow'.", "whyWrong": ["'will' marks a decision taken at the moment of speaking, but this plan already existed yesterday.", "The present simple 'I make' states a habit or a timetable, not a personal plan.", "The future perfect describes an action already completed before a point in the future."]}, "he": {"q": "I bought all this flour yesterday because I ___ a cake tomorrow. בחרו את ההשלמה הנכונה.", "options": ["will make", "am going to make", "make", "will have made"], "hint": "הקמח נקנה אתמול, ולכן התוכנית מוקדמת למשפט הזה.", "explanation": "כוונה שגובשה לפני רגע הדיבור מקבלת 'be going to': הקמח כבר נקנה, ולכן 'I am going to make a cake tomorrow'.", "whyWrong": ["'will' מסמן החלטה שנופלת ברגע הדיבור, אבל התוכנית הזו כבר הייתה קיימת אתמול.", "ה-present simple 'I make' מביע הרגל או לוח זמנים, לא תוכנית אישית.", "ה-future perfect מתאר פעולה שתושלם לפני נקודת זמן בעתיד."]}}, {"id": "tfu-005", "area": "tense-future", "topic": "present-continuous-arrangement", "difficulty": 2, "type": "cloze", "hardnessSource": "concept", "tags": ["future", "present-continuous", "arrangement"], "sentence": "I can't come on Thursday — I ___ my supervisor at four.", "answers": [["am meeting", "'m meeting"]], "en": {"q": "Complete with the present continuous of 'meet': a fixed arrangement already in the diary.", "hint": "Arrangements already made with another person take the present continuous.", "explanation": "The present continuous expresses a fixed future arrangement: 'I am meeting my supervisor at four'. The time and the other person are already settled, so no 'will' is needed."}, "he": {"q": "השלימו ב-present continuous של הפועל 'meet' — סידור שכבר נקבע ביומן.", "hint": "סידורים שנקבעו מראש עם אדם אחר מקבלים present continuous.", "explanation": "ה-present continuous מביע סידור עתידי קבוע: 'I am meeting my supervisor at four'. השעה והצד השני כבר סוכמו, ולכן אין צורך ב-'will'."}}, {"id": "tfu-006", "area": "tense-future", "topic": "no-future-after-time-conjunction", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["future", "time-clause", "as-soon-as", "trap"], "answer": 3, "en": {"q": "I'll phone you as soon as I ___ at the hotel. Choose the correct completion.", "options": ["will arrive", "will be arriving", "am arriving", "arrive"], "hint": "Look at the clause after 'as soon as', not at the main clause.", "explanation": "After time conjunctions such as 'when', 'as soon as', 'until', 'before' and 'after', English uses a present form even though the meaning is future: 'as soon as I arrive'.", "whyWrong": ["A time clause with 'as soon as' never takes 'will', even when the meaning is future.", "'will be arriving' is also a future form, and futures are not used after 'as soon as'.", "The present continuous would describe an arrangement in progress, not the point of arrival."]}, "he": {"q": "I'll phone you as soon as I ___ at the hotel. בחרו את ההשלמה הנכונה.", "options": ["will arrive", "will be arriving", "am arriving", "arrive"], "hint": "הסתכלו על הפסוקית שאחרי 'as soon as', לא על המשפט העיקרי.", "explanation": "אחרי מילות זמן כמו 'when', 'as soon as', 'until', 'before' ו-'after' משתמשים באנגלית בזמן הווה, גם כשהמשמעות עתידית: 'as soon as I arrive'.", "whyWrong": ["פסוקית זמן עם 'as soon as' אינה מקבלת 'will', גם כשהמשמעות עתידית.", "גם 'will be arriving' היא צורת עתיד, וצורות עתיד אינן באות אחרי 'as soon as'.", "ה-present continuous היה מתאר סידור בהתרחשות ולא את רגע ההגעה."]}}, {"id": "tfu-007", "area": "tense-future", "topic": "be-due-to", "difficulty": 2, "type": "cloze", "hardnessSource": "form", "tags": ["future", "be-due-to", "schedule", "agreement"], "sentence": "The new safety regulations ___ to come into force in January.", "answers": [["are due"]], "en": {"q": "Complete with the correct form of 'be due' (two words): a scheduled, officially expected event.", "hint": "'be due to' + base form reports an official schedule; the subject here is plural.", "explanation": "'be due to' + base form says that something is scheduled or officially expected: 'The regulations are due to come into force in January'. The plural subject 'regulations' takes 'are'."}, "he": {"q": "השלימו בצורה הנכונה של 'be due' (שתי מילים) — אירוע מתוכנן וצפוי באופן רשמי.", "hint": "המבנה 'be due to' + צורת בסיס מדווח על לוח זמנים רשמי; הנושא כאן ברבים.", "explanation": "המבנה 'be due to' + צורת בסיס מביע שמשהו מתוכנן או צפוי רשמית: 'The regulations are due to come into force in January'. הנושא ברבים 'regulations' דורש 'are'."}}, {"id": "tfu-008", "area": "tense-future", "topic": "timetable-vs-arrangement", "difficulty": 3, "type": "cloze", "hardnessSource": "concept", "tags": ["future", "present-simple", "present-continuous", "timetable"], "sentence": "Our flight ___ at 6:30, so we ___ dinner at the airport beforehand.", "answers": [["takes off"], ["are having", "'re having"]], "en": {"q": "First blank: the present simple of 'take off' (a published timetable). Second blank: the present continuous of 'have' (an arrangement we have made).", "hint": "Timetables take the present simple; personal arrangements take the present continuous.", "explanation": "A published timetable is reported in the present simple even about future time ('the flight takes off at 6:30'), while an arrangement that people themselves have made takes the present continuous ('we are having dinner')."}, "he": {"q": "במקום הריק הראשון: present simple של 'take off' (לוח זמנים רשמי). בשני: present continuous של 'have' (סידור שקבענו).", "hint": "לוחות זמנים מקבלים present simple; סידורים אישיים מקבלים present continuous.", "explanation": "לוח זמנים מתואר ב-present simple גם כשמדובר בעתיד ('the flight takes off at 6:30'), אבל סידור שאנשים קבעו בעצמם מקבל present continuous ('we are having dinner')."}}, {"id": "tfu-009", "area": "tense-future", "topic": "future-continuous", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["future-continuous", "progressive", "distractors"], "answer": 0, "en": {"q": "Don't call at eight — we ___ dinner at that time. Choose the correct completion.", "options": ["will be having", "will have been having", "will having", "will be had"], "hint": "The meal will be in progress at one particular future moment.", "explanation": "The future continuous 'will be' + -ing describes an action in progress at a given moment in the future: at eight the meal will already be under way.", "whyWrong": ["The future perfect continuous looks back over a duration up to a future point, not at one moment in progress.", "'will having' is not a form; the future continuous needs 'be' between 'will' and the -ing form.", "'will be had' is a passive, and 'we' are not the thing being eaten."]}, "he": {"q": "Don't call at eight — we ___ dinner at that time. בחרו את ההשלמה הנכונה.", "options": ["will be having", "will have been having", "will having", "will be had"], "hint": "הארוחה תהיה באמצע התרחשות בנקודת זמן מסוימת בעתיד.", "explanation": "ה-future continuous ('will be' + ing) מתאר פעולה שתהיה בהתרחשות ברגע מסוים בעתיד: בשמונה הארוחה כבר תהיה בעיצומה.", "whyWrong": ["ה-future perfect continuous מודד משך זמן עד נקודה בעתיד, ולא רגע בודד של התרחשות.", "'will having' אינה צורה קיימת; ב-future continuous חייב להופיע 'be' בין 'will' לצורת ה-ing.", "'will be had' היא צורה פסיבית, ו-'we' אינם הדבר שנאכל."]}}, {"id": "tfu-010", "area": "tense-future", "topic": "future-perfect", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["future-perfect", "time-clause", "transform"], "sentence": "By the time you get back from the meeting, I ___ the whole report.", "answers": [["will have finished", "'ll have finished", "shall have finished"]], "en": {"q": "Complete with the future perfect of 'finish'.", "hint": "'will have' + past participle = completed before a point in the future.", "explanation": "The future perfect 'will have finished' presents the action as complete before a future point ('by the time you get back'). Note that the time clause itself stays in the present simple."}, "he": {"q": "השלימו ב-future perfect של הפועל 'finish'.", "hint": "'will have' + צורת participle = הושלם לפני נקודת זמן בעתיד.", "explanation": "ה-future perfect 'will have finished' מציג את הפעולה כמושלמת לפני נקודה בעתיד ('by the time you get back'). שימו לב שפסוקית הזמן עצמה נשארת ב-present simple."}}, {"id": "tfu-011", "area": "tense-future", "topic": "shall-offer", "difficulty": 3, "type": "cloze", "hardnessSource": "concept", "tags": ["shall", "offer", "formal-register"], "sentence": "___ I carry that box for you? It looks heavy.", "answers": [["shall"]], "en": {"q": "Complete with the one modal used with 'I' and 'we' in formal English to make an offer or a suggestion.", "hint": "In formal usage the offer form with 'I' is not 'will'.", "explanation": "Questions with 'I' or 'we' that offer help or make a suggestion use 'shall': 'Shall I carry that box for you?', 'Shall we begin?'. 'Will I' does not express an offer in standard written English."}, "he": {"q": "השלימו במודאלי המשמש באנגלית רשמית עם 'I' ו-'we' כדי להציע עזרה או הצעה.", "hint": "במשלב רשמי, צורת ההצעה עם 'I' אינה 'will'.", "explanation": "שאלות עם 'I' או 'we' שמביעות הצעת עזרה או הצעה מקבלות 'shall': 'Shall I carry that box for you?', 'Shall we begin?'. הצורה 'Will I' אינה מביעה הצעה באנגלית תקנית כתובה."}}, {"id": "tfu-012", "area": "tense-future", "topic": "future-perfect-vs-perfect-continuous", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["future-perfect", "future-perfect-continuous", "academic"], "answer": 1, "en": {"q": "By the end of the month we ___ all the data, so we can start writing. Choose the correct completion.", "options": ["will have been collecting", "will have collected", "will be collecting", "will have been collected"], "hint": "The second clause shows that the work is over by that point.", "explanation": "'so we can start writing' shows that the collecting is finished by the end of the month, and completion before a future point is exactly what the future perfect expresses.", "whyWrong": ["The future perfect continuous presents the activity as still going on at that point, which contradicts 'so we can start writing'.", "The future continuous describes an action in progress at that moment, not one completed by then.", "This is a passive form, and 'we' are not the data that is collected."]}, "he": {"q": "By the end of the month we ___ all the data, so we can start writing. בחרו את ההשלמה הנכונה.", "options": ["will have been collecting", "will have collected", "will be collecting", "will have been collected"], "hint": "הפסוקית השנייה מלמדת שהעבודה מסתיימת עד אותה נקודה.", "explanation": "הצירוף 'so we can start writing' מלמד שאיסוף הנתונים יסתיים עד סוף החודש, ובדיוק את ההשלמה לפני נקודה בעתיד מביע ה-future perfect.", "whyWrong": ["ה-future perfect continuous מציג את הפעילות כממשיכה באותה נקודה, בניגוד ל-'so we can start writing'.", "ה-future continuous מתאר פעולה בהתרחשות באותו רגע, לא פעולה שהושלמה עד אז.", "זו צורה פסיבית, ו-'we' אינם הנתונים שנאספים."]}}, {"id": "tfu-013", "area": "tense-future", "topic": "future-perfect-continuous", "difficulty": 4, "type": "cloze", "hardnessSource": "transform", "tags": ["future-perfect-continuous", "duration", "transform"], "sentence": "When the project closes in May, the team ___ on it for three years.", "answers": [["will have been working", "'ll have been working"]], "en": {"q": "Complete with the future perfect continuous of 'work'.", "hint": "'will have been' + -ing stresses how long an activity has gone on up to a future point.", "explanation": "The future perfect continuous 'will have been working' measures the duration of an activity up to a point in the future: three years by May. The time clause keeps the present simple ('when the project closes')."}, "he": {"q": "השלימו ב-future perfect continuous של הפועל 'work'.", "hint": "'will have been' + צורת ing מדגישה כמה זמן נמשכת הפעילות עד נקודה בעתיד.", "explanation": "ה-future perfect continuous 'will have been working' מודד את משך הפעילות עד נקודה בעתיד: שלוש שנים עד מאי. פסוקית הזמן נשארת ב-present simple ('when the project closes')."}}, {"id": "tfu-014", "area": "tense-future", "topic": "present-perfect-in-time-clause", "difficulty": 4, "type": "mcq", "hardnessSource": "trap", "tags": ["time-clause", "present-perfect", "until", "trap"], "answer": 2, "en": {"q": "We will not submit the application until we ___ the dean's signature. Choose the correct completion.", "options": ["will have obtained", "will obtain", "have obtained", "are obtaining"], "hint": "The clause after 'until' must show completion, but without any future form.", "explanation": "A clause introduced by 'until', 'when' or 'by the time' takes a present form even when the main clause is future; where completion must come first, that present form is the present perfect: 'until we have obtained'.", "whyWrong": ["'will have obtained' is a future perfect, and no future form is possible after 'until'.", "The same mistake with a simple future: 'until we will obtain' does not exist in English.", "The present continuous describes an activity in progress and cannot express completion before the main action."]}, "he": {"q": "We will not submit the application until we ___ the dean's signature. בחרו את ההשלמה הנכונה.", "options": ["will have obtained", "will obtain", "have obtained", "are obtaining"], "hint": "הפסוקית שאחרי 'until' צריכה להביע השלמה — אבל ללא צורת עתיד.", "explanation": "פסוקית זמן הנפתחת ב-'until', 'when' או 'by the time' מקבלת זמן הווה גם כשהמשפט העיקרי בעתיד; כאשר יש להדגיש השלמה, זה ה-present perfect: 'until we have obtained'.", "whyWrong": ["'will have obtained' הוא future perfect, ואין צורת עתיד אחרי 'until'.", "אותה טעות עם עתיד פשוט: הצורה 'until we will obtain' אינה קיימת באנגלית.", "ה-present continuous מתאר פעולה בהתרחשות ואינו יכול להביע השלמה לפני הפעולה העיקרית."]}}, {"id": "tsq-001", "area": "tense-sequence", "topic": "backshift-present-to-past", "difficulty": 1, "type": "cloze", "hardnessSource": "transform", "tags": ["reported-speech", "backshift", "present-to-past"], "sentence": "'I am very tired,' she said. → She said that she ___ very tired.", "answers": [["was"]], "en": {"q": "Complete the reported sentence with the backshifted form of 'am'.", "hint": "After a past reporting verb, a present tense moves one step back into the past.", "explanation": "Reported speech after 'said' backshifts the present into the past: 'I am tired' becomes 'she said that she was tired'."}, "he": {"q": "השלימו את המשפט בדיבור עקיף בצורת ה-backshift של 'am'.", "hint": "אחרי פועל דיווח בעבר, זמן הווה נסוג צעד אחד לעבר.", "explanation": "בדיבור עקיף אחרי 'said' מבצעים backshift מהווה לעבר: 'I am tired' הופך ל-'she said that she was tired'."}}, {"id": "tsq-002", "area": "tense-sequence", "topic": "say-vs-tell", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["reported-speech", "say", "tell", "trap"], "answer": 3, "en": {"q": "She ___ me that the meeting had been postponed. Choose the correct verb.", "options": ["said", "spoke", "talked", "told"], "hint": "Which of these verbs takes the listener directly as its object?", "explanation": "'tell' takes a person as its direct object ('told me that...'), while 'say' does not: 'she said that...' or 'she said to me that...'.", "whyWrong": ["'say' is not followed directly by the listener; it would have to be 'said to me'.", "'speak' needs a preposition: 'spoke to me'.", "'talk' also needs 'to', and it does not introduce a that-clause."]}, "he": {"q": "She ___ me that the meeting had been postponed. בחרו את הפועל הנכון.", "options": ["said", "spoke", "talked", "told"], "hint": "איזה מהפעלים האלה מקבל את המאזין כמושא ישיר?", "explanation": "הפועל 'tell' מקבל מושא של אדם ('told me that...'), ולעומתו 'say' לא: אומרים 'she said that...' או 'she said to me that...'.", "whyWrong": ["אחרי 'say' לא בא המאזין ישירות; היה צריך להיות 'said to me'.", "הפועל 'speak' דורש מילת יחס: 'spoke to me'.", "גם 'talk' דורש 'to', והוא אינו פותח פסוקית that."]}}, {"id": "tsq-003", "area": "tense-sequence", "topic": "time-word-shift", "difficulty": 1, "type": "mcq", "hardnessSource": "form", "tags": ["reported-speech", "time-words", "today-that-day"], "answer": 0, "en": {"q": "'The shop is closed today,' she explained. Choose the correct completion: 'She explained that the shop was closed ___.'", "options": ["that day", "this day", "today day", "in that day"], "hint": "Time words move away from the original speaker's 'now'.", "explanation": "Time words shift in reported speech: 'today' becomes 'that day', 'tomorrow' becomes 'the next day', and 'yesterday' becomes 'the day before'.", "whyWrong": ["'this' becomes 'that' in reported speech, so 'this day' keeps the original speaker's point of view.", "'today day' is not an English phrase.", "Days take 'on' rather than 'in', and the reported form here is simply 'that day'."]}, "he": {"q": "'The shop is closed today,' she explained. בחרו את ההשלמה הנכונה: 'She explained that the shop was closed ___.'", "options": ["that day", "this day", "today day", "in that day"], "hint": "מילות זמן מתרחקות מה'עכשו' של הדובר המקורי.", "explanation": "בדיבור עקיף מילות הזמן משתנות: 'today' הופך ל-'that day', 'tomorrow' ל-'the next day' ו-'yesterday' ל-'the day before'.", "whyWrong": ["בדיבור עקיף 'this' הופך ל-'that', ולכן 'this day' נשאר בנקודת המבט של הדובר.", "'today day' אינו צירוף קיים באנגלית.", "לפני ימים באה 'on' ולא 'in', והצורה הנדרשת כאן היא פשוט 'that day'."]}}, {"id": "tsq-004", "area": "tense-sequence", "topic": "reported-request-infinitive", "difficulty": 1, "type": "cloze", "hardnessSource": "form", "tags": ["reported-speech", "request", "infinitive"], "sentence": "'Please wait outside,' the nurse said to us. → The nurse asked us ___ outside.", "answers": [["to wait"]], "en": {"q": "Complete the reported request with the infinitive of 'wait' (two words).", "hint": "Reported requests and commands use 'ask/tell someone' + to + verb.", "explanation": "Requests and commands are reported with an object plus the infinitive: 'asked us to wait'. The negative form is 'asked us not to wait'."}, "he": {"q": "השלימו את הבקשה בדיבור עקיף בצורת ה-infinitive של 'wait' (שתי מילים).", "hint": "בקשות והוראות בדיבור עקיף מקבלות 'ask/tell someone' + to + פועל.", "explanation": "בקשות והוראות מדווחות במבנה של מושא + infinitive: 'asked us to wait'. השלילה היא 'asked us not to wait'."}}, {"id": "tsq-005", "area": "tense-sequence", "topic": "backshift-past-to-past-perfect", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["reported-speech", "backshift", "past-perfect"], "answer": 1, "en": {"q": "'I lost my keys,' he said. Choose the correct report: 'He said that he ___ his keys.'", "options": ["has lost", "had lost", "had lose", "was lost"], "hint": "A past simple in direct speech has one more step ba
