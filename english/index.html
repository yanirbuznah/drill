ck to go.", "explanation": "A past simple in direct speech backshifts to the past perfect: 'I lost' becomes 'he said that he had lost'.", "whyWrong": ["A present perfect cannot stand after a past reporting verb; it too backshifts to 'had lost'.", "After 'had' English needs the past participle 'lost', not the base form.", "'was lost' is a passive and would mean that he himself could not find his way."]}, "he": {"q": "'I lost my keys,' he said. בחרו את הדיווח הנכון: 'He said that he ___ his keys.'", "options": ["has lost", "had lost", "had lose", "was lost"], "hint": "זמן עבר פשוט בדיבור הישיר נסוג עוד צעד אחד אחורה.", "explanation": "זמן past simple בדיבור ישיר הופך ב-backshift ל-past perfect: 'I lost' הופך ל-'he said that he had lost'.", "whyWrong": ["present perfect אינו יכול לבוא אחרי פועל דיווח בעבר; גם הוא נסוג ל-'had lost'.", "אחרי 'had' נדרשת צורת ה-participle 'lost' ולא צורת הבסיס.", "'was lost' היא צורה פסיבית ומשמעותה שהוא עצמו הלך לאיבוד."]}}, {"id": "tsq-006", "area": "tense-sequence", "topic": "will-to-would", "difficulty": 2, "type": "cloze", "hardnessSource": "transform", "tags": ["reported-speech", "backshift", "would"], "sentence": "'I will phone you tomorrow,' she promised. → She promised that she ___ phone me the next day.", "answers": [["would", "'d"]], "en": {"q": "Complete with the backshifted form of 'will' (one word).", "hint": "'will' has a past form that is used in reported speech.", "explanation": "'will' backshifts to 'would' after a past reporting verb: 'I will phone' becomes 'she promised that she would phone'. In the same way 'can' becomes 'could' and 'may' becomes 'might'."}, "he": {"q": "השלימו בצורת ה-backshift של 'will' (מילה אחת).", "hint": "ל-'will' יש צורת עבר המשמשת בדיבור עקיף.", "explanation": "אחרי פועל דיווח בעבר 'will' הופך ל-'would': 'I will phone' הופך ל-'she promised that she would phone'. באותו אופן 'can' הופך ל-'could' ו-'may' ל-'might'."}}, {"id": "tsq-007", "area": "tense-sequence", "topic": "must-to-had-to", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["reported-speech", "modals", "had-to"], "answer": 2, "en": {"q": "'You must sign here,' the clerk told me. Choose the correct report: 'The clerk told me that I ___ sign there.'", "options": ["must to", "musted", "had to", "have must"], "hint": "'must' has no past form of its own.", "explanation": "Because 'must' has no past form, reported speech normally replaces it with 'had to': 'he told me that I had to sign'. In the same way 'can' becomes 'could'.", "whyWrong": ["'must' is never followed by 'to'.", "'must' is a modal and has no -ed form.", "Two modal elements cannot be stacked; the past of 'must' is 'had to'."]}, "he": {"q": "'You must sign here,' the clerk told me. בחרו את הדיווח הנכון: 'The clerk told me that I ___ sign there.'", "options": ["must to", "musted", "had to", "have must"], "hint": "ל-'must' אין צורת עבר משלו.", "explanation": "מכיוון של-'must' אין צורת עבר, בדיבור עקיף מחליפים אותו ב-'had to': 'he told me that I had to sign'. באותו אופן 'can' הופך ל-'could'.", "whyWrong": ["אחרי 'must' אינה באה המילה 'to'.", "'must' הוא מודאלי ואין לו צורת ed.", "אין לשרשר שני רכיבים מודאליים ככה; צורת העבר של 'must' היא 'had to'."]}}, {"id": "tsq-008", "area": "tense-sequence", "topic": "reported-question-no-inversion", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["reported-speech", "questions", "word-order", "trap"], "answer": 3, "en": {"q": "'Where are you going?' he asked me. Choose the correct reported question.", "options": ["He asked me where was I going.", "He asked me where am I going.", "He asked me where did I go.", "He asked me where I was going."], "hint": "A reported question is not a question any more: it has statement word order.", "explanation": "In a reported question the subject comes before the verb, with no inversion and no added auxiliary: 'He asked me where I was going.'", "whyWrong": ["It keeps the inverted question order; reported questions are never inverted.", "It keeps both the inversion and the present tense, which must backshift to 'was going'.", "It adds the auxiliary 'did' and changes the meaning to a completed journey."]}, "he": {"q": "'Where are you going?' he asked me. בחרו את השאלה המדווחת הנכונה.", "options": ["He asked me where was I going.", "He asked me where am I going.", "He asked me where did I go.", "He asked me where I was going."], "hint": "שאלה בדיבור עקיף אינה שאלה עוד: סדר המילים הוא של משפט חיווי.", "explanation": "בשאלה מדווחת הנושא בא לפני הפועל, בלי inversion ובלי תוספת auxiliary: 'He asked me where I was going.'", "whyWrong": ["שומר על סדר השאלה ההפוך; בשאלה מדווחת אין inversion.", "שומר גם על ה-inversion וגם על זמן ההווה, שחייב לעבור backshift ל-'was going'.", "מוסיף את ה-auxiliary 'did' ומשנה את המשמעות לנסיעה שהסתיימה."]}}, {"id": "tsq-009", "area": "tense-sequence", "topic": "can-to-could-here-to-there", "difficulty": 3, "type": "cloze", "hardnessSource": "trap", "tags": ["reported-speech", "backshift", "place-words"], "sentence": "'I can meet you here at noon,' she said. → She said that she ___ meet me ___ at noon.", "answers": [["could"], ["there"]], "en": {"q": "First blank: the backshifted form of 'can'. Second blank: the word that replaces 'here' in reported speech.", "hint": "Modals backshift, and place words move away from the original speaker.", "explanation": "'can' backshifts to 'could', and the place word 'here' becomes 'there' because the report is made somewhere else: 'she said that she could meet me there at noon'."}, "he": {"q": "במקום הריק הראשון: צורת ה-backshift של 'can'. בשני: המילה המחליפה את 'here' בדיבור עקיף.", "hint": "מודאלים עוברים backshift, ומילות מקום מתרחקות מהדובר המקורי.", "explanation": "המודאלי 'can' הופך ל-'could', ומילת המקום 'here' הופכת ל-'there' כיוון שהדיווח נעשה במקום אחר: 'she said that she could meet me there at noon'."}}, {"id": "tsq-010", "area": "tense-sequence", "topic": "this-that-tomorrow-shift", "difficulty": 3, "type": "cloze", "hardnessSource": "transform", "tags": ["reported-speech", "demonstratives", "time-words"], "sentence": "'I will finish this chapter tomorrow,' he said. → He said that he would finish ___ chapter ___.", "answers": [["that"], ["the next day", "the following day", "the day after"]], "en": {"q": "First blank: the word that replaces 'this'. Second blank: the three-word phrase that replaces 'tomorrow'.", "hint": "Both the demonstrative and the time word move away from the speaker's here and now.", "explanation": "In reported speech 'this' becomes 'that' and 'tomorrow' becomes 'the next day' (or 'the following day'): 'he said that he would finish that chapter the next day'."}, "he": {"q": "במקום הריק הראשון: המילה המחליפה את 'this'. בשני: הצירוף בן שלוש המילים המחליף את 'tomorrow'.", "hint": "גם כינוי הרמז וגם מילת הזמן מתרחקים מה'כאן ועכשו' של הדובר.", "explanation": "בדיבור עקיף 'this' הופך ל-'that' ו-'tomorrow' הופך ל-'the next day' (או 'the following day'): 'he said that he would finish that chapter the next day'."}}, {"id": "tsq-011", "area": "tense-sequence", "topic": "no-backshift-present-reporting-verb", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["reported-speech", "no-backshift", "reporting-verb"], "answer": 0, "en": {"q": "He says he ___ coming at six, so let's wait for him. Choose the correct completion.", "options": ["is", "was", "had been", "were"], "hint": "Look at the tense of the reporting verb itself.", "explanation": "Backshift is triggered by a past reporting verb. Here the reporting verb 'says' is in the present, so the original present tense is kept: 'he says he is coming'.", "whyWrong": ["'was' would only follow a past reporting verb such as 'said'.", "The past perfect belongs to a report of an earlier statement, not to 'he says'.", "'he were' does not agree with a singular subject in any case."]}, "he": {"q": "He says he ___ coming at six, so let's wait for him. בחרו את ההשלמה הנכונה.", "options": ["is", "was", "had been", "were"], "hint": "הסתכלו על הזמן של פועל הדיווח עצמו.", "explanation": "ה-backshift נגרם על ידי פועל דיווח בעבר. כאן פועל הדיווח 'says' הוא בהווה, ולכן זמן ההווה המקורי נשמר: 'he says he is coming'.", "whyWrong": ["הצורה 'was' הייתה באה רק אחרי פועל דיווח בעבר כמו 'said'.", "ה-past perfect מתאים לדיווח על אמירה מוקדמת, לא ל-'he says'.", "'he were' אינו מתאים לנושא ביחיד בכל מקרה."]}}, {"id": "tsq-012", "area": "tense-sequence", "topic": "reported-yes-no-question", "difficulty": 3, "type": "cloze", "hardnessSource": "trap", "tags": ["reported-speech", "whether", "auxiliary-do", "trap"], "sentence": "'Do you know the answer?' she asked me. → She asked me ___ the answer.", "answers": [["whether I knew", "if I knew"]], "en": {"q": "Complete the reported yes/no question with 'whether' (or 'if') + subject + the backshifted form of 'know' — three words.", "hint": "A reported yes/no question needs 'if' or 'whether', statement order, and no 'do'.", "explanation": "Yes/no questions are reported with 'if' or 'whether' and statement word order; the auxiliary 'do' disappears and the verb backshifts: 'She asked me whether I knew the answer'."}, "he": {"q": "השלימו את השאלה המדווחת ב-'whether' (או 'if') + נושא + צורת ה-backshift של 'know' — שלוש מילים.", "hint": "שאלת כן/לא בדיבור עקיף דורשת 'if' או 'whether', סדר של משפט חיווי, ובלי 'do'.", "explanation": "שאלות כן/לא מדווחות באמצעות 'if' או 'whether' ובסדר של משפט חיווי; ה-auxiliary 'do' נעלם והפועל עובר backshift: 'She asked me whether I knew the answer'."}}, {"id": "tsq-013", "area": "tense-sequence", "topic": "narrative-past-perfect", "difficulty": 3, "type": "cloze", "hardnessSource": "concept", "tags": ["past-perfect", "narrative", "sequence"], "sentence": "Halfway to the airport she realised that she ___ her passport at home.", "answers": [["had left", "'d left"]], "en": {"q": "Complete with the past perfect of 'leave': the earlier of the two past events.", "hint": "The event that happened first takes the past perfect.", "explanation": "In a past narrative the earlier event takes the past perfect and the later one the past simple: she realised (later) that she had left the passport (earlier)."}, "he": {"q": "השלימו ב-past perfect של הפועל 'leave' — המוקדם מבין שני האירועים בעבר.", "hint": "האירוע שהתרחש ראשון מקבל past perfect.", "explanation": "בסיפור בעבר, האירוע המוקדם מקבל past perfect והמאוחר מקבל past simple: היא הבינה (מאוחר) שהשאירה את הדרכון (מוקדם)."}}, {"id": "tsq-014", "area": "tense-sequence", "topic": "tense-sequence-consistency", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["sequence-of-tenses", "past-perfect", "consistency"], "answer": 1, "en": {"q": "Choose the sentence in which the sequence of tenses is correct.", "options": ["By the time the police arrived, the thieves have disappeared.", "By the time the police arrived, the thieves had disappeared.", "By the time the police had arrived, the thieves disappeared.", "By the time the police arrive, the thieves had disappeared."], "hint": "Which event happened first, and which tense marks it?", "explanation": "Both events lie in the past, so the earlier one (the disappearance) takes the past perfect and the later one the past simple.", "whyWrong": ["The present perfect links a past event to now and cannot sit in a past narrative beside 'arrived'.", "It puts the past perfect on the later event; the past perfect marks what happened first.", "'arrive' is a present form and clashes with the past perfect in the main clause."]}, "he": {"q": "בחרו את המשפט שבו רצף הזמנים נכון.", "options": ["By the time the police arrived, the thieves have disappeared.", "By the time the police arrived, the thieves had disappeared.", "By the time the police had arrived, the thieves disappeared.", "By the time the police arrive, the thieves had disappeared."], "hint": "איזה אירוע קרה ראשון, ואיזה זמן מסמן אותו?", "explanation": "שני האירועים בעבר, ולכן המוקדם מביניהם (ההיעלמות) מקבל past perfect והמאוחר מקבל past simple.", "whyWrong": ["ה-present perfect מקשר אירוע בעבר להווה ואינו יכול לשבת בסיפור בעבר ליד 'arrived'.", "המשפט מצמיד את ה-past perfect לאירוע המאוחר; ה-past perfect מסמן את מה שקרה קודם.", "'arrive' היא צורת הווה והיא מתנגשת עם ה-past perfect במשפט העיקרי."]}}, {"id": "tsq-015", "area": "tense-sequence", "topic": "multiple-backshift-consistency", "difficulty": 4, "type": "cloze", "hardnessSource": "transform", "tags": ["reported-speech", "backshift", "consistency", "academic"], "sentence": "The clerk admitted that he ___ the file, and promised that he ___ for it again.", "answers": [["had lost", "'d lost"], ["would look", "'d look"]], "en": {"q": "First blank: the past perfect of 'lose'. Second blank: the backshifted form of 'will look' (two words).", "hint": "Each reported clause keeps its own backshift: past → past perfect, 'will' → 'would'.", "explanation": "Both clauses depend on past reporting verbs, so each backshifts separately: the earlier past becomes 'had lost' and 'will look' becomes 'would look'. The tenses must stay consistent across the whole sentence."}, "he": {"q": "במקום הריק הראשון: past perfect של 'lose'. בשני: צורת ה-backshift של 'will look' (שתי מילים).", "hint": "כל פסוקית מדווחת עוברת backshift בנפרד: עבר ← past perfect, 'will' ← 'would'.", "explanation": "שתי הפסוקיות תלויות בפעלי דיווח בעבר, ולכן כל אחת עוברת backshift בנפרד: העבר המוקדם הופך ל-'had lost' ו-'will look' הופך ל-'would look'. הזמנים חייבים להישאר עקביים בכל המשפט."}}, {"id": "tsq-016", "area": "tense-sequence", "topic": "will-have-to-would-have", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["reported-speech", "backshift", "future-perfect", "distractors"], "answer": 2, "en": {"q": "'The experiment will have finished by noon,' the director said. Choose the correct report.", "options": ["He said the experiment will have finished by noon.", "He said the experiment would had finished by noon.", "He said the experiment would have finished by noon.", "He said the experiment had finished by noon."], "hint": "Only the modal changes; the perfect infinitive after it stays as it is.", "explanation": "'will have finished' backshifts to 'would have finished': 'will' becomes 'would', and the perfect infinitive 'have finished' does not change.", "whyWrong": ["It keeps 'will' after the past reporting verb 'said', where 'would' is required.", "'would' is a modal and is followed by the base form 'have', never by 'had'.", "'had finished' reports a plain past perfect and loses the meaning 'finished by a future point'."]}, "he": {"q": "'The experiment will have finished by noon,' the director said. בחרו את הדיווח הנכון.", "options": ["He said the experiment will have finished by noon.", "He said the experiment would had finished by noon.", "He said the experiment would have finished by noon.", "He said the experiment had finished by noon."], "hint": "רק המודאלי משתנה; ה-perfect infinitive שאחריו נשאר כמו שהוא.", "explanation": "הצורה 'will have finished' עוברת backshift ל-'would have finished': 'will' הופך ל-'would', וה-perfect infinitive 'have finished' אינו משתנה.", "whyWrong": ["משאיר 'will' אחרי פועל הדיווח בעבר 'said', ושם נדרש 'would'.", "'would' הוא מודאלי ואחריו באה צורת הבסיס 'have', לעולם לא 'had'.", "'had finished' מדווח past perfect רגיל ומאבד את המשמעות של השלמה עד נקודה בעתיד."]}}, {"id": "tcd-001", "area": "tense-conditional", "topic": "zero-conditional-general-fact", "difficulty": 1, "type": "cloze", "hardnessSource": "concept", "tags": ["conditionals", "zero-conditional", "present-simple"], "sentence": "If you heat water to 100 degrees, it ___.", "answers": [["boils"]], "en": {"q": "Complete the sentence with the present simple of 'boil'. This is a zero conditional — a general fact.", "hint": "In a zero conditional both halves take the present simple.", "explanation": "A zero conditional states a general or scientific fact, and both halves take the present simple: 'If you heat water to 100 degrees, it boils'. 'will' and 'would' belong to other conditional types."}, "he": {"q": "השלימו את המשפט ב-present simple של הפועל 'boil'. זהו zero conditional — עובדה כללית.", "hint": "ב-zero conditional שני חלקי המשפט מקבלים present simple.", "explanation": "zero conditional מתאר עובדה כללית או מדעית, ולכן שתי הפסוקיות מקבלות present simple: 'If you heat water to 100 degrees, it boils'. 'will' ו-'would' שייכים לסוגי תנאי אחרים."}}, {"id": "tcd-002", "area": "tense-conditional", "topic": "first-conditional-no-will-in-if", "difficulty": 1, "type": "mcq", "hardnessSource": "trap", "tags": ["conditionals", "first-conditional", "if-clause"], "answer": 0, "en": {"q": "___, we will cancel the trip. Choose the correct form.", "options": ["If it rains tomorrow", "If it will rain tomorrow", "If it would rain tomorrow", "If it rained tomorrow"], "hint": "The future is not expressed twice; the if-clause stays in a present form.", "explanation": "In a first conditional the condition takes the present simple and the result takes 'will': 'If it rains tomorrow, we will cancel the trip'. The future meaning of the if-clause is already clear from the result.", "whyWrong": ["'will' does not belong in the if-clause; the condition takes the present simple.", "'would' never appears in the if-clause of a conditional.", "'If it rained' is a second-conditional condition and does not fit the result 'we will cancel'."]}, "he": {"q": "___, we will cancel the trip. בחרו את הצורה הנכונה.", "options": ["If it rains tomorrow", "If it will rain tomorrow", "If it would rain tomorrow", "If it rained tomorrow"], "hint": "העתיד לא מסומן פעמיים; פסוקית ה-if נשארת בצורת הווה.", "explanation": "ב-first conditional פסוקית התנאי מקבלת present simple והתוצאה מקבלת 'will': 'If it rains tomorrow, we will cancel the trip'. משמעות העתיד כבר ברורה מפסוקית התוצאה.", "whyWrong": ["'will' אינו נכנס לפסוקית ה-if; התנאי מקבל present simple.", "'would' לא מופיע לעולם בפסוקית ה-if של משפט תנאי.", "'If it rained' הוא תנאי של second conditional ואינו מתאים לתוצאה 'we will cancel'."]}}, {"id": "tcd-003", "area": "tense-conditional", "topic": "second-conditional-result-clause", "difficulty": 1, "type": "cloze", "hardnessSource": "form", "tags": ["conditionals", "second-conditional", "would"], "sentence": "If I had more time, I ___ Spanish.", "answers": [["would learn", "'d learn"]], "en": {"q": "Complete the result clause with 'would' + the verb 'learn' (second conditional).", "hint": "The result half of a second conditional uses 'would' + base form.", "explanation": "A second conditional imagines an unreal present: 'if' + past simple in the condition, 'would' + base form in the result — 'If I had more time, I would learn Spanish'."}, "he": {"q": "השלימו את פסוקית התוצאה ב-'would' + הפועל 'learn' (second conditional).", "hint": "פסוקית התוצאה של second conditional מקבלת 'would' + צורת בסיס.", "explanation": "second conditional מתאר הווה לא-מציאותי: בתנאי 'if' + past simple, ובתוצאה 'would' + צורת בסיס — 'If I had more time, I would learn Spanish'."}}, {"id": "tcd-004", "area": "tense-conditional", "topic": "third-conditional-form", "difficulty": 2, "type": "mcq", "hardnessSource": "form", "tags": ["conditionals", "third-conditional", "would-have"], "answer": 1, "en": {"q": "If she had left earlier, she ___ the train. Choose the correct form.", "options": ["would catch", "would have caught", "would had caught", "had caught"], "hint": "An unreal past result is built with 'would have' + past participle.", "explanation": "A third conditional talks about a past that did not happen: 'if' + past perfect in the condition, 'would have' + past participle in the result — 'she would have caught the train'.", "whyWrong": ["'would catch' is a second-conditional result and cannot follow 'had left'.", "'would' is followed by 'have' + past participle, never by 'had'.", "'had caught' is a past perfect, which belongs to the condition, not to the result."]}, "he": {"q": "If she had left earlier, she ___ the train. בחרו את הצורה הנכונה.", "options": ["would catch", "would have caught", "would had caught", "had caught"], "hint": "תוצאה לא-מציאותית בעבר נבנית ב-'would have' + past participle.", "explanation": "third conditional מדבר על עבר שלא התרחש: בתנאי 'if' + past perfect, ובתוצאה 'would have' + past participle — 'she would have caught the train'.", "whyWrong": ["'would catch' היא תוצאה של second conditional ואינה יכולה לבוא אחרי 'had left'.", "אחרי 'would' בא 'have' + past participle, ולא 'had'.", "'had caught' הוא past perfect, השייך לפסוקית התנאי ולא לפסוקית התוצאה."]}}, {"id": "tcd-005", "area": "tense-conditional", "topic": "if-i-would-have-error", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["conditionals", "third-conditional", "hebrew-interference"], "answer": 2, "en": {"q": "Which sentence is correct?", "options": ["If I would have known, I would have told you.", "If I would know, I would have told you.", "If I had known, I would have told you.", "If I have known, I would have told you."], "hint": "'would' belongs only to the result half of a conditional.", "explanation": "The unreal past condition is 'If I had known'; only the result takes 'would have told'. Hebrew uses one and the same conditional form in both halves, which is why 'If I would have known' feels natural to Hebrew speakers - and is still wrong.", "whyWrong": ["'would have' cannot stand in the if-clause; the condition must be 'had known'.", "'would' never appears in the if-clause, and 'would know' does not match a past result.", "The present perfect 'have known' cannot express an unreal past condition."]}, "he": {"q": "איזה משפט נכון?", "options": ["If I would have known, I would have told you.", "If I would know, I would have told you.", "If I had known, I would have told you.", "If I have known, I would have told you."], "hint": "'would' שייך רק לחצי התוצאה של משפט התנאי.", "explanation": "התנאי הלא-מציאותי בעבר הוא 'If I had known', ורק התוצאה מקבלת 'would have told'. בעברית שני החלקים משתמשים באותה צורה ('הייתי'), ולכן 'If I would have known' נשמע טבעי לדוברי עברית — אבל הוא שגוי.", "whyWrong": ["'would have' אינו יכול לעמוד בפסוקית ה-if; התנאי חייב להיות 'had known'.", "'would' לא מופיע בפסוקית ה-if, ו-'would know' גם אינו מתאים לתוצאה בעבר.", "ה-present perfect 'have known' אינו יכול לבטא תנאי לא-מציאותי בעבר."]}}, {"id": "tcd-006", "area": "tense-conditional", "topic": "mixed-conditional-past-condition-present-result", "difficulty": 3, "type": "cloze", "hardnessSource": "concept", "tags": ["conditionals", "mixed-conditional", "would"], "sentence": "If I had taken that job in Berlin, I ___ in Germany now.", "answers": [["would be living", "would live", "'d be living", "'d live"]], "en": {"q": "Complete the result clause with 'would' + the verb 'live' — a past condition with a present result.", "hint": "The condition is in the past, but the result is about today.", "explanation": "A mixed conditional joins a past condition ('if' + past perfect) to a present result ('would' + base form). The job was not taken back then, so the speaker is not in Germany now; 'would have lived' would wrongly put the result in the past."}, "he": {"q": "השלימו את פסוקית התוצאה ב-'would' + הפועל 'live' — תנאי בעבר עם תוצאה בהווה.", "hint": "התנאי בעבר, אבל התוצאה מתייחסת לעכשיו.", "explanation": "mixed conditional מחבר תנאי בעבר ('if' + past perfect) לתוצאה בהווה ('would' + צורת בסיס). העבודה לא נלקחה אז, ולכן הדובר אינו גר בגרמניה עכשיו; 'would have lived' היה מעביר את התוצאה לעבר שלא בצדק."}}, {"id": "tcd-007", "area": "tense-conditional", "topic": "mixed-conditional-present-condition-past-result", "difficulty": 3, "type": "mcq", "hardnessSource": "concept", "tags": ["conditionals", "mixed-conditional", "would-have"], "answer": 3, "en": {"q": "If he weren't so careless, he ___ the keys last night. Choose the correct form.", "options": ["wouldn't lose", "hadn't lost", "wouldn't losing", "wouldn't have lost"], "hint": "The condition is a permanent trait; the result is one finished event.", "explanation": "A mixed conditional can also run the other way: a present condition ('if' + past simple or 'were') with a past result ('would have' + past participle). The carelessness is permanent, but the losing happened once, last night.", "whyWrong": ["'wouldn't lose' points to the present or the future, not to keys already lost.", "'hadn't lost' is a condition form; the result clause needs 'would'.", "After 'would' English uses 'have' + past participle, never an -ing form."]}, "he": {"q": "If he weren't so careless, he ___ the keys last night. בחרו את הצורה הנכונה.", "options": ["wouldn't lose", "hadn't lost", "wouldn't losing", "wouldn't have lost"], "hint": "התנאי הוא תכונה קבועה; התוצאה היא אירוע אחד שנגמר.", "explanation": "mixed conditional יכול לעבוד גם בכיוון ההפוך: תנאי בהווה ('if' + past simple או 'were') עם תוצאה בעבר ('would have' + past participle). חוסר הזהירות הוא תכונה קבועה, אבל איבוד המפתחות קרה פעם אחת, אתמול בלילה.", "whyWrong": ["'wouldn't lose' מצביע על ההווה או העתיד, ולא על מפתחות שכבר אבדו.", "'hadn't lost' היא צורה של פסוקית תנאי; פסוקית התוצאה דורשת 'would'.", "אחרי 'would' באה הצורה 'have' + past participle, ולא צורת -ing."]}}, {"id": "tcd-008", "area": "tense-conditional", "topic": "were-all-persons-if-i-were-you", "difficulty": 1, "type": "cloze", "hardnessSource": "form", "tags": ["conditionals", "second-conditional", "subjunctive-were"], "sentence": "If I ___ you, I would apologise immediately.", "answers": [["were"]], "en": {"q": "Complete with the past subjunctive form of 'be' required in the fixed advice phrase 'If I ___ you'.", "hint": "This form is the same for every person, including 'I' and 'he'.", "explanation": "In a second conditional the past subjunctive 'were' is used for every person — 'if I were', 'if he were', 'if the company were' — and the advice formula 'If I were you' is fixed in that form."}, "he": {"q": "השלימו בצורת ה-past subjunctive של 'be' הנדרשת בביטוי הקבוע למתן עצה: 'If I ___ you'.", "hint": "הצורה הזו זהה לכל הגופים, כולל 'I' ו-'he'.", "explanation": "ב-second conditional משתמשים ב-past subjunctive 'were' בכל הגופים — 'if I were', 'if he were', 'if the company were' — והנוסחה למתן עצה 'If I were you' קבועה בצורה הזו."}}, {"id": "tcd-009", "area": "tense-conditional", "topic": "unless-already-negative", "difficulty": 2, "type": "mcq", "hardnessSource": "trap", "tags": ["conditionals", "unless", "double-negation"], "answer": 0, "en": {"q": "Which sentence is correct?", "options": ["You will fail unless you hand in the essay.", "You will fail unless you won't hand in the essay.", "You will fail unless you don't hand in the essay.", "You will fail unless you would hand in the essay."], "hint": "'unless' already carries a negative meaning of its own.", "explanation": "'unless' means 'if not', so the clause after it stays positive and in a present form: 'unless you hand in the essay'. Adding another negative reverses the sense.", "whyWrong": ["'will' does not belong in an 'unless' clause, exactly as it does not in an if-clause.", "'unless' already means 'if not', so 'don't' creates a double negative and reverses the meaning.", "'would' cannot appear in a conditional clause introduced by 'unless'."]}, "he": {"q": "איזה משפט נכון?", "options": ["You will fail unless you hand in the essay.", "You will fail unless you won't hand in the essay.", "You will fail unless you don't hand in the essay.", "You will fail unless you would hand in the essay."], "hint": "ל-'unless' יש משמעות שלילית משל עצמו.", "explanation": "'unless' פירושו 'if not', ולכן הפסוקית שאחריו נשארת חיובית ובצורת הווה: 'unless you hand in the essay'. הוספת שלילה נוספת הופכת את המשמעות.", "whyWrong": ["'will' אינו נכנס לפסוקית 'unless', בדיוק כפי שאינו נכנס לפסוקית if.", "'unless' כבר אומר 'if not', ולכן 'don't' יוצר שלילה כפולה והופך את המשמעות.", "'would' אינו יכול להופיע בפסוקית תנאי הנפתחת ב-'unless'."]}}, {"id": "tcd-010", "area": "tense-conditional", "topic": "provided-that-as-long-as", "difficulty": 2, "type": "cloze", "hardnessSource": "transform", "tags": ["conditionals", "conditional-linkers", "provided-that"], "sentence": "You may borrow the car ___ you fill the tank before you return it.", "answers": [["provided that", "provided", "providing that", "providing", "as long as", "so long as", "on condition that", "only if", "assuming that", "assuming"]], "en": {"q": "Fill the blank with a conditional linker of two or three words meaning 'only if this condition is met'.", "hint": "Think of the formal alternatives to 'if' that stress a condition being met.", "explanation": "'provided (that)', 'as long as', 'so long as' and 'on condition that' all introduce a condition that must be met, and like 'if' they take a present form — never 'will'."}, "he": {"q": "השלימו את החסר במקשר תנאי של שתיים-שלוש מילים שפירושו 'רק אם התנאי מתקיים'.", "hint": "חשבו על החלופות הפורמליות ל-'if' שמדגישות תנאי שחייב להתקיים.", "explanation": "'provided (that)', 'as long as', 'so long as' ו-'on condition that' כולם פותחים תנאי שחייב להתקיים, ובדומה ל-'if' הם מקבלים צורת הווה — לעולם לא 'will'."}}, {"id": "tcd-011", "area": "tense-conditional", "topic": "in-case-precaution", "difficulty": 3, "type": "mcq", "hardnessSource": "distractors", "tags": ["conditionals", "in-case", "precaution"], "answer": 1, "en": {"q": "Take an umbrella ___ it rains later. Choose the option that means 'as a precaution'.", "options": ["if", "in case", "unless", "even if"], "hint": "You take the umbrella first, before you know whether it will rain.", "explanation": "'in case' introduces a precaution against something that may happen: you act in advance. Like 'if', it is never followed by 'will' — 'in case it rains', not 'in case it will rain'.", "whyWrong": ["'if' makes the umbrella depend on rain that is already falling, so it is not a precaution.", "'unless' means 'if not' and reverses the sense of the sentence.", "'even if' concedes the rain rather than guarding against it."]}, "he": {"q": "Take an umbrella ___ it rains later. בחרו את האפשרות שמשמעותה 'לשם זהירות, מראש'.", "options": ["if", "in case", "unless", "even if"], "hint": "לוקחים את המטרייה מראש, לפני שיודעים אם ירד גשם.", "explanation": "'in case' פותח צעד מונע מפני משהו שעלול לקרות: פועלים מראש. כמו 'if', גם אחריו לא בא 'will' — 'in case it rains' ולא 'in case it will rain'.", "whyWrong": ["'if' הופך את המטרייה לתלויה בגשם שכבר יורד, ולכן אין כאן זהירות מראש.", "'unless' פירושו 'if not' והוא הופך את משמעות המשפט.", "'even if' מודה בגשם במקום להיערך מפניו."]}}, {"id": "tcd-012", "area": "tense-conditional", "topic": "even-if-vs-even-though", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["conditionals", "even-if", "concession"], "answer": 2, "en": {"q": "___ you offered me twice the money, I would still refuse. Choose the correct option.", "options": ["Even though", "Even so", "Even if", "Even that"], "hint": "The offer is imaginary, and it would change nothing.", "explanation": "'even if' introduces a hypothetical condition that would make no difference to the result, which is why it fits 'I would still refuse'. 'even though' introduces a real fact and would need a real result.", "whyWrong": ["'even though' concedes a fact, so it clashes with the hypothetical result 'I would still refuse'.", "'even so' is an adverb and cannot introduce a clause with its own subject and verb.", "'even that' is not a conjunction of concession in English."]}, "he": {"q": "___ you offered me twice the money, I would still refuse. בחרו את האפשרות הנכונה.", "options": ["Even though", "Even so", "Even if", "Even that"], "hint": "ההצעה היא היפותטית, והיא לא תשנה דבר.", "explanation": "'even if' פותח תנאי היפותטי שלא ישנה את התוצאה, ולכן הוא מתאים ל-'I would still refuse'. 'even though' פותח עובדה ממשית והיה דורש תוצאה ממשית.", "whyWrong": ["'even though' מודה בעובדה, ולכן הוא מתנגש עם התוצאה ההיפותטית 'I would still refuse'.", "'even so' הוא תואר הפועל ואינו יכול לפתוח פסוקית עם נושא ונשוא.", "'even that' אינו מילת ויתור באנגלית."]}}, {"id": "tcd-013", "area": "tense-conditional", "topic": "wish-past-simple-present-regret", "difficulty": 1, "type": "cloze", "hardnessSource": "concept", "tags": ["wish", "unreal-past", "present-regret"], "sentence": "I wish I ___ how to drive — I have to take taxis everywhere.", "answers": [["knew"]], "en": {"q": "Complete with the past simple of 'know' — a wish about the speaker's present situation.", "hint": "The meaning is present, but the form is past.", "explanation": "A wish about a present situation takes 'wish' + past simple: 'I wish I knew' means 'I don't know, and I regret it'. The past form marks the situation as unreal, not as past time."}, "he": {"q": "השלימו ב-past simple של הפועל 'know' — משאלה על המצב הנוכחי של הדובר.", "hint": "המשמעות היא בהווה, אבל הצורה היא בעבר.", "explanation": "משאלה על מצב בהווה מקבלת 'wish' + past simple: 'I wish I knew' פירושו 'אני לא יודע, וחבל לי'. צורת העבר מסמנת שהמצב אינו מציאותי, ולא שמדובר בזמן עבר."}}, {"id": "tcd-014", "area": "tense-conditional", "topic": "wish-past-perfect-past-regret", "difficulty": 2, "type": "mcq", "hardnessSource": "concept", "tags": ["wish", "past-perfect", "past-regret"], "answer": 3, "en": {"q": "I failed the exam. I wish I ___ harder. Choose the correct form.", "options": ["studied", "would study", "have studied", "had studied"], "hint": "The exam is over, so the regret is about finished time.", "explanation": "A regret about something already finished takes 'wish' + past perfect: 'I wish I had studied harder'. The extra step back in tense is what marks the past as unchangeable.", "whyWrong": ["'wish' + past simple refers to a present situation, not to a finished past one.", "'wish' + 'would' asks for a future change and cannot undo a past exam.", "The present perfect never follows 'wish'."]}, "he": {"q": "I failed the exam. I wish I ___ harder. בחרו את הצורה הנכונה.", "options": ["studied", "would study", "have studied", "had studied"], "hint": "המבחן נגמר, ולכן החרטה מתייחסת לזמן שנסגר.", "explanation": "חרטה על משהו שכבר נגמר מקבלת 'wish' + past perfect: 'I wish I had studied harder'. הצעד הנוסף אחורה בזמן הוא שמסמן שהעבר אינו בר-שינוי.", "whyWrong": ["'wish' + past simple מתייחס למצב בהווה ולא לעבר שנגמר.", "'wish' + 'would' מבקש שינוי בעתיד ואינו יכול לבטל מבחן שכבר היה.", "present perfect לא בא אחרי 'wish' לעולם."]}}, {"id": "tcd-015", "area": "tense-conditional", "topic": "if-only-would-complaint", "difficulty": 3, "type": "cloze", "hardnessSource": "distractors", "tags": ["if-only", "wish", "would"], "sentence": "If only he ___ interrupting me every two minutes!", "answers": [["would stop", "'d stop"]], "en": {"q": "Complete with 'would' + the verb 'stop' — a complaint about someone else's behaviour.", "hint": "This form asks for behaviour to change, rather than describing a state.", "explanation": "'if only' and 'wish' + 'would' complain about behaviour the speaker wants changed: 'If only he would stop'. 'wish' + past simple would describe an unreal present state instead, and 'wish' + past perfect a past regret."}, "he": {"q": "השלימו ב-'would' + הפועל 'stop' — תלונה על התנהגות של מישהו אחר.", "hint": "הצורה הזו מבקשת שהתנהגות תשתנה, ולא מתארת מצב.", "explanation": "'if only' ו-'wish' + 'would' מביעים תלונה על התנהגות שהדובר רוצה לשנות: 'If only he would stop'. 'wish' + past simple היה מתאר מצב לא-מציאותי בהווה, ו-'wish' + past perfect חרטה על העבר."}}, {"id": "tcd-016", "area": "tense-conditional", "topic": "its-time-past-form", "difficulty": 3, "type": "cloze", "hardnessSource": "form", "tags": ["its-time", "unreal-past", "fixed-structure"], "sentence": "It's time we ___ home — it's almost midnight.", "answers": [["went"]], "en": {"q": "Complete with the past simple of 'go', as the structure 'It's time + subject' requires.", "hint": "After 'It's time' plus a subject, English uses an unreal past form.", "explanation": "'It's time' followed by a subject takes an unreal past form: 'It's time we went home'. The alternative is an infinitive with no new subject — 'It's time to go home' — while 'It's time we go' is wrong."}, "he": {"q": "השלימו ב-past simple של הפועל 'go', כנדרש במבנה 'It's time + נושא'.", "hint": "אחרי 'It's time' עם נושא משתמשים בצורת עבר לא-מציאותית.", "explanation": "'It's time' שאחריו נושא מקבל צורת עבר לא-מציאותית: 'It's time we went home'. החלופה היא infinitive בלי נושא חדש — 'It's time to go home' — ואילו 'It's time we go' שגוי."}}, {"id": "tcd-017", "area": "tense-conditional", "topic": "would-rather-change-of-subject", "difficulty": 4, "type": "mcq", "hardnessSource": "concept", "tags": ["would-rather", "unreal-past", "formal-register"], "answer": 0, "en": {"q": "I'd rather you ___ anything to her about the letter. Choose the correct form.", "options": ["didn't say", "don't say", "wouldn't say", "not to say"], "hint": "The subject after 'would rather' has changed, so the clause takes an unreal past form.", "explanation": "When 'would rather' is followed by a different subject, that clause takes an unreal past form: 'I'd rather you didn't say anything'. With the same subject it takes a bare infinitive: 'I'd rather not say anything'.", "whyWrong": ["'would rather' + a new subject takes an unreal past form, not the present simple.", "'would' is not repeated inside the clause that follows 'would rather'.", "An infinitive follows 'would rather' only when the subject does not change."]}, "he": {"q": "I'd rather you ___ anything to her about the letter. בחרו את הצורה הנכונה.", "options": ["didn't say", "don't say", "wouldn't say", "not to say"], "hint": "הנושא אחרי 'would rather' התחלף, ולכן הפסוקית מקבלת צורת עבר לא-מציאותית.", "explanation": "כאשר אחרי 'would rather' בא נושא אחר, הפסוקית מקבלת צורת עבר לא-מציאותית: 'I'd rather you didn't say anything'. כשהנושא נשאר אותו נושא בא infinitive בלי 'to': 'I'd rather not say anything'.", "whyWrong": ["'would rather' עם נושא חדש מקבל צורת עבר לא-מציאותית ולא present simple.", "'would' אינו חוזר בתוך הפסוקית שאחרי 'would rather'.", "infinitive בא אחרי 'would rather' רק כאשר הנושא אינו מתחלף."]}}, {"id": "tcd-018", "area": "tense-conditional", "topic": "present-subjunctive-after-insist", "difficulty": 4, "type": "cloze", "hardnessSource": "form", "tags": ["subjunctive", "insist-that", "formal-register"], "sentence": "The committee insisted that every applicant ___ interviewed twice.", "answers": [["be"]], "en": {"q": "Complete with the present subjunctive of 'be', the bare base form required after 'insist that'.", "hint": "The form is the same for every person and is not marked for tense.", "explanation": "Verbs of demand — 'suggest', 'insist', 'demand', 'recommend', 'require' — are followed by 'that' + the base form for every person: 'that every applicant be interviewed'. British English also allows 'should be', but the base form is the subjunctive the structure calls for."}, "he": {"q": "השלימו ב-present subjunctive של 'be' — צורת הבסיס הנדרשת אחרי 'insist that'.", "hint": "הצורה זהה בכל הגופים ואינה מסומנת בזמן.", "explanation": "פעלים של דרישה — 'suggest', 'insist', 'demand', 'recommend', 'require' — מקבלים 'that' + צורת בסיס בכל הגופים: 'that every applicant be interviewed'. באנגלית בריטית מתקבל גם 'should be', אבל צורת הבסיס היא ה-subjunctive שהמבנה דורש."}}, {"id": "exm-001", "area": "exam", "topic": "fronted-negative-direct-word-order", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["inversion", "negative-adverbial", "word-order"], "answer": 1, "en": {"q": "One of these sentences is correct. Which one?", "options": ["Never I have seen such a mess.", "Never have I seen such a mess.", "Never I had seen such a mess.", "Never did I saw such a mess."], "hint": "A negative adverbial at the front of a sentence forces inversion.", "explanation": "When a negative adverbial such as 'never', 'rarely' or 'under no circumstances' is fronted, the auxiliary moves in front of the subject: 'Never have I seen such a mess'. Hebrew keeps direct word order here, which is why 'Never I have seen' feels natural and is wrong.", "whyWrong": ["After a fronted 'never' the subject and auxiliary must swap: 'have I seen'.", "The word order is still direct; the auxiliary 'had' has to come before 'I'.", "After the auxiliary 'did' English uses the base form 'see', not the past 'saw'."]}, "he": {"q": "אחד המשפטים האלה נכון. איזה?", "options": ["Never I have seen such a mess.", "Never have I seen such a mess.", "Never I had seen such a mess.", "Never did I saw such a mess."], "hint": "תואר פועל שלילי בראש המשפט מחייב inversion.", "explanation": "כאשר תואר פועל שלילי כמו 'never', 'rarely' או 'under no circumstances' מוקדם לראש המשפט, ה-auxiliary עובר לפני הנושא: 'Never have I seen such a mess'. בעברית סדר המילים נשאר ישר, ולכן 'Never I have seen' נשמע טבעי אך שגוי.", "whyWrong": ["אחרי 'never' בראש המשפט הנושא וה-auxiliary מתחלפים: 'have I seen'.", "סדר המילים כאן עדיין ישר; ה-auxiliary 'had' חייב לבוא לפני 'I'.", "אחרי ה-auxiliary 'did' באה צורת הבסיס 'see' ולא צורת העבר 'saw'."]}}, {"id": "exm-002", "area": "exam", "topic": "no-will-in-time-clause", "difficulty": 1, "type": "cloze", "hardnessSource": "trap", "tags": ["time-clause", "future", "as-soon-as"], "sentence": "I will call you as soon as I ___ at the hotel.", "answers": [["arrive"]], "en": {"q": "Complete with the present simple of 'arrive' — the future is not used after 'as soon as'.", "hint": "The time clause stays in a present form even though the meaning is future.", "explanation": "Time clauses after 'when', 'as soon as', 'before', 'after' and 'until' take a present form even when they refer to the future: 'as soon as I arrive'. 'as soon as I will arrive' is wrong, exactly as 'if I will arrive' is."}, "he": {"q": "השלימו ב-present simple של הפועל 'arrive' — אחרי 'as soon as' לא משתמשים בעתיד.", "hint": "פסוקית הזמן נשארת בצורת הווה גם כשהמשמעות היא עתיד.", "explanation": "פסוקיות זמן אחרי 'when', 'as soon as', 'before', 'after' ו-'until' מקבלות צורת הווה גם כשהן מתייחסות לעתיד: 'as soon as I arrive'. 'as soon as I will arrive' שגוי, בדיוק כמו 'if I will arrive'."}}, {"id": "exm-003", "area": "exam", "topic": "present-perfect-with-finished-time", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["present-perfect", "past-simple", "time-expressions"], "answer": 2, "en": {"q": "Which sentence is correct?", "options": ["I have seen him yesterday at the station.", "I have seen him last week at the station.", "I saw him yesterday at the station.", "I have been seeing him yesterday at the station."], "hint": "Look at the time expression before you choose the tense.", "explanation": "The present perfect links a past event to now, so it cannot appear with a time expression that closes the period off — 'yesterday', 'last week', 'in 2019', 'two hours ago'. Those require the past simple.", "whyWrong": ["A finished-time expression such as 'yesterday' requires the past simple, not the present perfect.", "'last week' is finished time too, so the present perfect is still impossible.", "The continuous makes it worse: 'yesterday' rules out any perfect form, and seeing someone once is not an ongoing activity."]}, "he": {"q": "איזה משפט נכון?", "options": ["I have seen him yesterday at the station.", "I have seen him last week at the station.", "I saw him yesterday at the station.", "I have been seeing him yesterday at the station."], "hint": "בדקו את ביטוי הזמן לפני שאתם בוחרים את הזמן הדקדוקי.", "explanation": "ה-present perfect מקשר אירוע מהעבר להווה, ולכן הוא אינו יכול להופיע עם ביטוי זמן שסוגר את התקופה — 'yesterday', 'last week', 'in 2019', 'two hours ago'. אלה דורשים past simple.", "whyWrong": ["ביטוי של זמן שנגמר כמו 'yesterday' דורש past simple ולא present perfect.", "גם 'last week' הוא זמן שנגמר, ולכן present perfect עדיין בלתי אפשרי.", "הצורה הממושכת רק מחמירה: 'yesterday' פוסל כל צורת perfect, וראייה חד-פעמית אינה פעולה מתמשכת."]}}, {"id": "exm-004", "area": "exam", "topic": "agreement-with-nearest-noun", "difficulty": 1, "type": "cloze", "hardnessSource": "trap", "tags": ["subject-verb-agreement", "prepositional-phrase", "real-subject"], "sentence": "The box of old photographs ___ on the top shelf.", "answers": [["is"]], "en": {"q": "Complete with the present simple of 'be' that agrees with the real subject of the sentence.", "hint": "Find the head noun of the subject, not the noun closest to the verb.", "explanation": "The subject is 'the box', not 'photographs'. A prepositional phrase between the subject and the verb never changes the agreement, so the verb stays singular: 'The box of old photographs is on the top shelf'."}, "he": {"q": "השלימו ב-present simple של 'be' שמתאים לנושא האמיתי של המשפט.", "hint": "חפשו את גרעין הנושא, ולא את שם העצם הקרוב לפועל.", "explanation": "הנושא הוא 'the box' ולא 'photographs'. צירוף יחס שנמצא בין הנושא לפועל אינו משנה את ה-subject-verb agreement, ולכן הפועל נשאר ביחיד: 'The box of old photographs is on the top shelf'."}}, {"id": "exm-005", "area": "exam", "topic": "uncountable-information", "difficulty": 1, "type": "mcq", "hardnessSource": "form", "tags": ["uncountable-nouns", "quantifiers", "articles"], "answer": 3, "en": {"q": "The lecturer gave us ___ about the exam. Choose the correct option.", "options": ["many useful informations", "a useful information", "some useful informations", "some useful information"], "hint": "One of these nouns has no plural and takes no 'a'.", "explanation": "'information', 'advice', 'news', 'furniture' and 'knowledge' are uncountable in English: no plural -s, no article 'a', and quantifiers such as 'some', 'much' or 'a piece of' instead of 'many'.", "whyWrong": ["'information' is uncountable, so it has no plural form and does not take 'many'.", "An uncountable noun cannot take the indefinite article 'a'.", "The quantifier 'some' is fine, but 'informations' does not exist — the noun must stay singular."]}, "he": {"q": "The lecturer gave us ___ about the exam. בחרו את האפשרות הנכונה.", "options": ["many useful informations", "a useful information", "some useful informations", "some useful information"], "hint": "לאחד משמות העצם האלה אין צורת רבים והוא אינו מקבל 'a'.", "explanation": "'information', 'advice', 'news', 'furniture' ו-'knowledge' הם uncountable באנגלית: בלי -s של רבים, בלי התווית 'a', ועם כמתים כמו 'some', 'much' או 'a piece of' במקום 'many'.", "whyWrong": ["'information' הוא uncountable, ולכן אין לו צורת רבים והוא אינו מקבל 'many'.", "שם עצם uncountable אינו יכול לקבל את התווית הסתמית 'a'.", "הכמת 'some' תקין, אבל 'informations' אינו קיים — שם העצם חייב להישאר ביחיד."]}}, {"id": "exm-006", "area": "exam", "topic": "people-plural-verb", "difficulty": 1, "type": "cloze", "hardnessSource": "concept", "tags": ["subject-verb-agreement", "people", "irregular-plural"], "sentence": "The people in the waiting room ___ getting impatient.", "answers": [["are"]], "en": {"q": "Complete with the present simple of 'be' that agrees with 'people'.", "hint": "'people' is already a plural noun, not a singular collective.", "explanation": "'people' is the plural of 'person', so it takes a plural verb: 'the people are'. 'the people is' is one of the commonest Hebrew-speaker errors, because Hebrew treats the equivalent noun as singular."}, "he": {"q": "השלימו ב-present simple של 'be' שמתאים ל-'people'.", "hint": "'people' הוא שם עצם בצורת רבים, ולא שם קיבוצי ביחיד.", "explanation": "'people' הוא צורת הרבים של 'person', ולכן הוא מקבל פועל ברבים: 'the people are'. 'the people is' היא אחת הטעויות הנפוצות ביותר אצל דוברי עברית, כי בעברית שם העצם המקביל נתפס כיחיד."}}, {"id": "exm-007", "area": "exam", "topic": "missing-auxiliary-in-question", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["auxiliary", "question-formation", "negation"], "answer": 0, "en": {"q": "Which sentence is correct?", "options": ["Why didn't she tell you about the meeting?", "Why she didn't tell you about the meeting?", "Why not she told you about the meeting?", "Why she not told you about the meeting?"], "hint": "An English question needs an auxiliary, and it stands before the subject.", "explanation": "English questions and negatives both need an auxiliary. 'did' carries the tense and the negation, and in a question it comes before the subject: 'Why didn't she tell you?'", "whyWrong": ["The auxiliary 'didn't' must come before the subject in a direct question.", "A negative question needs 'did' and 'not' together, with the subject after them.", "'not' cannot negate a main verb on its own; English needs the auxiliary 'did'."]}, "he": {"q": "איזה משפט נכון?", "options": ["Why didn't she tell you about the meeting?", "Why she didn't tell you about the meeting?", "Why not she told you about the meeting?", "Why she not told you about the meeting?"], "hint": "שאלה באנגלית דורשת auxiliary, והוא עומד לפני הנושא.", "explanation": "שאלות ושלילות באנגלית דורשות auxiliary. 'did' נושא את הזמן ואת השלילה, ובשאלה הוא בא לפני הנושא: 'Why didn't she tell you?'", "whyWrong": ["ה-auxiliary 'didn't' חייב לבוא לפני הנושא בשאלה ישירה.", "שאלה שלילית דורשת 'did' ו-'not' יחד, כשהנושא בא אחריהם.", "'not' אינו יכול לשלול פועל עיקרי לבדו; האנגלית דורשת את ה-auxiliary 'did'."]}}, {"id": "exm-008", "area": "exam", "topic": "double-negation", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["double-negation", "any-forms", "standard-written-english"], "answer": 1, "en": {"q": "Which sentence is correct in standard written English?", "options": ["I didn't see nobody in the corridor.", "I didn't see anybody in the corridor.", "I didn't see nothing in the corridor.", "I don't never see anybody in the corridor."], "hint": "Count the negative words in each clause.", "explanation": "Standard written English allows one negative element per clause. After a negative auxiliary the indefinite words switch to 'any-' forms — 'anybody', 'anything', 'ever'. Hebrew doubles the negation, which is why 'I didn't see nobody' feels right and is wrong.", "whyWrong": ["'didn't' already negates the clause, so the object must be 'anybody'.", "'didn't ... nothing' is a double negative; standard English requires 'anything'.", "'don't never' doubles the negation; write 'never see anybody' or 'don't ever see anybody'."]}, "he": {"q": "איזה משפט נכון באנגלית כתובה תקנית?", "options": ["I didn't see nobody in the corridor.", "I didn't see anybody in the corridor.", "I didn't see nothing in the corridor.", "I don't never see anybody in the corridor."], "hint": "ספרו את מילות השלילה בכל פסוקית.", "explanation": "אנגלית כתובה תקנית מתירה אלמנט שלילה אחד בכל פסוקית. אחרי auxiliary שלילי המילים הסתמיות עוברות לצורות 'any-' — 'anybody', 'anything', 'ever'. בעברית השלילה כפולה, ולכן 'I didn't see nobody' נשמע נכון אך שגוי.", "whyWrong": ["'didn't' כבר שולל את הפסוקית, ולכן המושא חייב להיות 'anybody'.", "'didn't ... nothing' היא שלילה כפולה; האנגלית התקנית דורשת 'anything'.", "'don't never' כופל את השלילה; כתבו 'never see anybody' או 'don't ever see anybody'."]}}, {"id": "exm-009", "area": "exam", "topic": "reported-speech-backshift-will", "difficulty": 4, "type": "cloze", "hardnessSource": "transform", "tags": ["reported-speech", "backshift", "would"], "sentence": "\"We will publish the findings tomorrow,\" the dean announced. The dean announced that they ___ the findings the following day.", "answers": [["would publish"]], "en": {"q": "Rewrite 'will publish' in reported speech after the past reporting verb 'announced'.", "hint": "A past reporting verb pushes every tense in the quotation one step back.", "explanation": "After a past reporting verb 'will' backshifts to 'would', and 'tomorrow' becomes 'the following day'. Leaving 'will publish' in the reported clause is the error markers see most often in reported speech."}, "he": {"q": "כתבו מחדש את 'will publish' ב-reported speech אחרי פועל הדיווח בעבר 'announced'.", "hint": "פועל דיווח בעבר מזיז כל זמן בציטוט צעד אחד אחורה.", "explanation": "אחרי פועל דיווח בעבר 'will' עובר backshift ל-'would', ו-'tomorrow' הופך ל-'the following day'. השארת 'will publish' בפסוקית המדווחת היא הטעות הנפוצה ביותר ב-reported speech."}}, {"id": "exm-010", "area": "exam", "topic": "no-inversion-in-embedded-question", "difficulty": 3, "type": "mcq", "hardnessSource": "trap", "tags": ["embedded-question", "word-order", "inversion"], "answer": 2, "en": {"q": "Which sentence is correct?", "options": ["I wonder where is the station.", "Do you know where is the station?", "Do you know where the station is?", "Can you tell me where is the station?"], "hint": "Only the main question is inverted, never the clause inside it.", "explanation": "Inversion belongs to the main question only. A question embedded inside another clause — after 'I wonder', 'Do you know', 'Can you tell me' — keeps direct word order, subject before verb: 'where the station is'.", "whyWrong": ["An embedded question keeps direct word order: 'where the station is'.", "The main question is inverted correctly, but the embedded clause needs 'where the station is'.", "Same error again: after 'Can you tell me' the clause takes direct word order."]}, "he": {"q": "איזה משפט נכון?", "options": ["I wonder where is the station.", "Do you know where is the station?", "Do you know where the station is?", "Can you tell me where is the station?"], "hint": "רק השאלה הראשית הופכת סדר, ולעולם לא הפסוקית שבתוכה.", "explanation": "ה-inversion שייך לשאלה הראשית בלבד. שאלה המשובצת בתוך פסוקית אחרת — אחרי 'I wonder', 'Do you know', 'Can you tell me' — שומרת על סדר מילים ישר, נושא לפני פועל: 'where the station is'.", "whyWrong": ["שאלה משובצת שומרת על סדר מילים ישר: 'where the station is'.", "השאלה הראשית הפוכה כראוי, אבל הפסוקית המשובצת דורשת 'where the station is'.", "אותה טעות שוב: אחרי 'Can you tell me' הפסוקית מקבלת סדר מילים ישר."]}}, {"id": "exm-011", "area": "exam", "topic": "each-of-singular-verb", "difficulty": 3, "type": "cloze", "hardnessSource": "trap", "tags": ["subject-verb-agreement", "each-of", "quantifier"], "sentence": "Each of the new students ___ assigned a personal tutor.", "answers": [["is"]], "en": {"q": "Complete with the present simple of 'be' that agrees with 'each'.", "hint": "The quantifier, not the noun after 'of', decides the number.", "explanation": "'each', 'every', 'either' and 'neither' are grammatically singular however plural the noun after 'of' is: 'Each of the new students is assigned a tutor'. The plural noun standing next to the verb is what pulls writers into 'are'."}, "he": {"q": "השלימו ב-present simple של 'be' שמתאים ל-'each'.", "hint": "הכמת, ולא שם העצם שאחרי 'of', הוא שקובע את המספר.", "explanation": "'each', 'every', 'either' ו-'neither' הם יחיד מבחינה דקדוקית, גם כששם העצם שאחרי 'of' הוא ברבים: 'Each of the new students is assigned a tutor'. שם העצם ברבים שנמצא ליד הפועל הוא שמשך את הכותבים ל-'are'."}}, {"id": "exm-012", "area": "exam", "topic": "stative-verb-no-continuous", "difficulty": 4, "type": "cloze", "hardnessSource": "concept", "tags": ["stative-verbs", "continuous", "academic-register"], "sentence": "The report ___ of three chapters and a short appendix.", "answers": [["consists"]], "en": {"q": "Complete with the present simple of 'consist' — a stative verb with no continuous form.", "hint": "This verb describes a state, so the continuous is not available.", "explanation": "Stative verbs — 'consist', 'comprise', 'contain', 'belong', 'know', 'own' — describe a state rather than an activity and are not used in the continuous: 'The report consists of three chapters', never 'is consisting of'."}, "he": {"q": "השלימו ב-present simple של הפועל 'consist' — פועל stative שאין לו צורה ממושכת.", "hint": "הפועל הזה מתאר מצב, ולכן הצורה הממושכת אינה אפשרית.", "explanation": "פעלים stative — 'consist', 'comprise', 'contain', 'belong', 'know', 'own' — מתארים מצב ולא פעולה, ולכן אינם מופיעים בצורה ממושכת: 'The report consists of three chapters' ולעולם לא 'is consisting of'."}}, {"id": "exm-013", "area": "exam", "topic": "inverted-third-conditional", "difficulty": 4, "type": "mcq", "hardnessSource": "distractors", "tags": ["inversion", "third-conditional", "formal-register"], "answer": 3, "en": {"q": "Which sentence is correct?", "options": ["Had I have known, I would have warned you.", "If I would have known, I had warned you.", "Would I have known, I would have warned you.", "Had I known, I would have warned you."], "hint": "The formal conditional without 'if' is built on 'had', and 'have' is not doubled.", "explanation": "Formal English can drop 'if' and invert instead: 'If I had known' becomes 'Had I known'. The result clause is unchanged — 'would have' + past participle — and 'would' never appears in the condition.", "whyWrong": ["The inverted condition is 'Had I known'; 'Had I have known' adds a second 'have'.", "'would have' cannot stand in the if-clause, and the result needs 'would have warned', not 'had warned'.", "Inversion in a third conditional is built on 'had', not on 'would'."]}, "he": {"q": "איזה משפט נכון?", "options": ["Had I have known, I would have warned you.", "If I would have known, I had warned you.", "Would I have known, I would have warned you.", "Had I known, I would have warned you."], "hint": "התנאי הפורמלי בלי 'if' נבנה על 'had', ו-'have' אינו מופיע פעמיים.", "explanation": "אנגלית פורמלית יכולה להשמיט את 'if' ולהפוך את סדר המילים: 'If I had known' הופך ל-'Had I known'. פסוקית התוצאה אינה משתנה — 'would have' + past participle — ו-'would' לא מופיע בפסוקית התנאי.", "whyWrong": ["התנאי ההפוך הוא 'Had I known'; הצורה 'Had I have known' מוסיפה 'have' שני.", "'would have' אינו יכול לעמוד בפסוקית ה-if, והתוצאה דורשת 'would have warned' ולא 'had warned'.", "ה-inversion ב-third conditional נבנה על 'had' ולא על 'would'."]}}, {"id": "exm-014", "area": "exam", "topic": "uncountable-advice-plus-agreement", "difficulty": 2, "type": "mcq", "hardnessSource": "distractors", "tags": ["uncountable-nouns", "subject-verb-agreement", "find-the-error"], "answer": 3, "en": {"q": "Which sentence contains no error?", "options": ["The advices he gave us was not very helpful.", "The advice he gave us were not very helpful.", "The advices he gave us were not very helpful.", "The advice he gave us was not very helpful."], "hint": "Two things are being tested at once: the noun's form and the verb's number.", "explanation": "'advice' is uncountable: it takes no plural -s and agrees with a singular verb — 'the advice ... was not very helpful'. When you need to count it, use 'a piece of advice' or 'two pieces of advice'.", "whyWrong": ["'advice' is uncountable and has no plural form 'advices'.", "'advice' is singular, so the verb must be 'was', not 'were'.", "Both errors at once: there is no plural 'advices', and the verb has to be singular."]}, "he": {"q": "באיזה משפט אין שגיאה?", "options": ["The advices he gave us was not very helpful.", "The advice he gave us were not very helpful.", "The advices he gave us were not very helpful.", "The advice he gave us was not very helpful."], "hint": "נבדקים כאן שני דברים בבת אחת: צורת שם העצם ומספר הפועל.", "explanation": "'advice' הוא uncountable: אין לו -s של רבים והוא מקבל פועל ביחיד — 'the advice ... was not very helpful'. כשרוצים לספור, אומרים 'a piece of advice' או 'two pieces of advice'.", "whyWrong": ["'advice' הוא uncountable ואין לו צורת רבים 'advices'.", "'advice' הוא יחיד, ולכן הפועל חייב להיות 'was' ולא 'were'.", "שתי השגיאות יחד: אין 'advices' ברבים, והפועל חייב להיות ביחיד."]}}, {"id": "exm-015", "area": "exam", "topic": "were-to-inversion-result-clause", "difficulty": 4, "type": "cloze", "hardnessSource": "transform", "tags": ["inversion", "conditionals", "formal-register"], "sentence": "Were the committee to reject the proposal, none of the funds ___ released this year.", "answers": [["would be", "'d be"]], "en": {"q": "Complete the result clause with 'would' + 'be', to finish this formal inverted conditional in the passive.", "hint": "The condition is already inverted, so only the result half is missing.", "explanation": "'Were the committee to reject...' is the formal inverted version of 'If the committee were to reject...'. The result clause is unaffected by the inversion and keeps 'would' + base form, here the passive 'would be released'."}, "he": {"q": "השלימו את פסוקית התוצאה ב-'would' + 'be', כדי לסיים את משפט התנאי הפורמלי ההפוך הזה בצורת סביל.", "hint": "פסוקית התנאי כבר הפוכה, ולכן חסר רק חצי התוצאה.", "explanation": "'Were the committee to reject...' היא הגרסה הפורמלית ההפוכה של 'If the committee were to reject...'. פסוקית התוצאה אינה מושפעת מה-inversion ושומרת על 'would' + צורת בסיס, כאן בסביל 'would be released'."}}, {"id": "exm-016", "area": "exam", "topic": "neither-of-plus-present-perfect", "difficulty": 4, "type": "cloze", "hardnessSource": "trap", "tags": ["subject-verb-agreement", "present-perfect", "neither-of"], "sentence": "Neither of the two studies ___ the hypothesis so far.", "answers": [["has supported"]], "en": {"q": "Complete with the present perfect of 'support', agreeing with the subject 'neither'.", "hint": "Two decisions here: the number of the auxiliary, and the tense that 'so far' requires.", "explanation": "'neither of' is grammatically singular, so the auxiliary is 'has', not 'have'; and 'so far' marks unfinished time, which calls for the present perfect rather than the past simple."}, "he": {"q": "השלימו ב-present perfect של הפועל 'support', בהתאמה לנושא 'neither'.", "hint": "שתי החלטות כאן: מספר ה-auxiliary, והזמן שהביטוי 'so far' מחייב.", "explanation": "'neither of' הוא יחיד מבחינה דקדוקית, ולכן ה-auxiliary הוא 'has' ולא 'have'; והביטוי 'so far' מסמן זמן שלא נגמר, ולכן נדרש present perfect ולא past simple."}}];
const GLOSSARY = [{"term": "active voice", "aliases": ["active form"], "cs": false, "areas": [], "en": {"t": "Active voice", "d": "The form in which the subject performs the action, as in 'she sent the letter'."}, "he": {"t": "Active voice (צורה פעילה)", "d": "הצורה שבה הנושא הוא זה שמבצע את הפעולה, למשל 'she sent the letter'."}}, {"term": "adjunct", "aliases": ["adjuncts"], "cs": false, "areas": [], "en": {"t": "Adjunct", "d": "An optional element that adds information to a clause and can be removed without breaking it."}, "he": {"t": "Adjunct", "d": "רכיב לא חובה שמוסיף מידע לפסוקית וניתן להסירו בלי לפגוע במשפט."}}, {"term": "adverbial", "aliases": ["adverbials"], "cs": false, "areas": [], "en": {"t": "Adverbial", "d": "A word, phrase or clause that functions as an adverb, telling when, where or how."}, "he": {"t": "Adverbial", "d": "מילה, צירוף או פסוקית שממלאים תפקיד של תואר הפועל ומציינים מתי, איפה או איך."}}, {"term": "anaphora", "aliases": ["anaphoric", "anaphoric reference"], "cs": false, "areas": [], "en": {"t": "Anaphora", "d": "The use of a word that points back to something already mentioned in the text."}, "he": {"t": "Anaphora", "d": "שימוש במילה שמצביעה אחורה על משהו שהוזכר קודם בטקסט."}}, {"term": "antecedent", "aliases": ["antecedents"], "cs": false, "areas": [], "en": {"t": "Antecedent", "d": "The noun or phrase that a later pronoun or relative word refers back to."}, "he": {"t": "Antecedent (מילת ייחוס)", "d": "שם העצם או הצירוף שאליו מתייחס בהמשך כינוי גוף או מילת זיקה."}}, {"term": "as long as", "aliases": ["so long as"], "cs": false, "areas": [], "en": {"t": "As long as", "d": "A fixed link introducing a condition on which the main statement depends."}, "he": {"t": "As long as", "d": "חיבור קבוע שפותח תנאי שהאמירה המרכזית תלויה בו."}}, {"term": "aspect", "aliases": ["aspects"], "cs": false, "areas": [], "en": {"t": "Aspect", "d": "The part of a verb form that shows how an action unfolds: simple, continuous or perfect."}, "he": {"t": "Aspect (אספקט)", "d": "החלק בצורת הפועל שמראה כיצד הפעולה מתרחשת: simple, continuous או perfect."}}, {"term": "attraction", "aliases": ["agreement attraction"], "cs": false, "areas": [], "en": {"t": "Attraction", "d": "The pull that a nearby noun exerts on the form of the verb instead of the subject."}, "he": {"t": "Attraction", "d": "המשיכה שמפעיל שם עצם סמוך על צורת הפועל, במקום הנושא עצמו."}}, {"term": "auxiliary verb", "aliases": ["auxiliary", "auxiliaries", "auxiliary verbs", "helping verb"], "cs": false, "areas": [], "en": {"t": "Auxiliary verb", "d": "A verb such as 'be', 'have' or 'do' that combines with a main verb to build tenses, questions and negatives."}, "he": {"t": "Auxiliary verb (פועל עזר)", "d": "פועל כמו 'be', 'have' או 'do' שמצטרף לפועל העיקרי כדי לבנות זמנים, שאלות ושלילה."}}, {"term": "backshift", "aliases": ["back-shift", "backshifting", "backshifted"], "cs": false, "areas": [], "en": {"t": "Backshift", "d": "The shift of a verb one step further into the past when speech is reported."}, "he": {"t": "Backshift (הזזת זמן לאחור)", "d": "הזזת הפועל צעד אחד אחורה בזמן כאשר מדווחים על דברים שנאמרו."}}, {"term": "bare infinitive", "aliases": ["bare infinitives"], "cs": false, "areas": [], "en": {"t": "Bare infinitive", "d": "The infinitive without 'to', as 'go' is in 'she can go'."}, "he": {"t": "Bare infinitive (שם הפועל בלי to)", "d": "שם הפועל בלי 'to', כמו 'go' במשפט 'she can go'."}}, {"term": "base form", "aliases": ["base forms"], "cs": false, "areas": [], "en": {"t": "Base form", "d": "The dictionary form of a verb, with no ending added, such as 'walk' or 'be'."}, "he": {"t": "Base form (צורת הבסיס)", "d": "צורת המילון של הפועל, בלי שום סיומת, למשל 'walk' או 'be'."}}, {"term": "be about to", "aliases": ["about to"], "cs": false, "areas": [], "en": {"t": "Be about to", "d": "The form 'be about to' plus a verb, naming an action on the point of happening."}, "he": {"t": "Be about to", "d": "המבנה 'be about to' בתוספת פועל, שמציין פעולה שעומדת להתרחש ממש עכשיו."}}, {"term": "be due to", "aliases": ["is due to"], "cs": false, "areas": [], "en": {"t": "Be due to", "d": "The form 'be due to' plus a verb, naming something scheduled or expected to happen."}, "he": {"t": "Be due to", "d": "המבנה 'be due to' בתוספת פועל, שמציין משהו שמתוכנן או צפוי להתרחש."}}, {"term": "clause", "aliases": ["clauses"], "cs": false, "areas": [], "en": {"t": "Clause", "d": "A group of words with a subject and a verb, forming part or all of a sentence."}, "he": {"t": "Clause (פסוקית / משפט פשוט)", "d": "קבוצת מילים שיש בה נושא ופועל, והיא מהווה חלק ממשפט או משפט שלם."}}, {"term": "cleft sentence", "aliases": ["cleft sentences", "cleft", "clefts", "it-cleft"], "cs": false, "areas": [], "en": {"t": "Cleft sentence", "d": "A sentence split into two parts so that one element is highlighted; 'It was Dan who called'."}, "he": {"t": "Cleft sentence", "d": "משפט שמפוצל לשני חלקים כדי להדגיש רכיב אחד, למשל 'It was Dan who called'."}}, {"term": "collective noun", "aliases": ["collective nouns", "group noun", "group nouns"], "cs": false, "areas": [], "en": {"t": "Collective noun", "d": "A noun that names a whole group of members as a single unit."}, "he": {"t": "Collective noun", "d": "שם עצם שמציין קבוצה שלמה של פרטים כיחידה אחת."}}, {"term": "complement", "aliases": ["complements", "subject complement"], "cs": false, "areas": [], "en": {"t": "Complement", "d": "A word or phrase that completes the meaning of a verb by describing the subject or object."}, "he": {"t": "Complement (משלים)", "d": "מילה או צירוף שמשלימים את משמעות הפועל על ידי תיאור הנושא או המושא."}}, {"term": "compound subject", "aliases": ["compound subjects"], "cs": false, "areas": [], "en": {"t": "Compound subject", "d": "A subject made of two or more nouns or pronouns joined by a conjunction; 'Tom and Lisa'."}, "he": {"t": "Compound subject", "d": "נושא המורכב משני שמות עצם או יותר המחוברים במילת חיבור, למשל 'Tom and Lisa'."}}, {"term": "concord", "aliases": ["grammatical concord"], "cs": false, "areas": [], "en": {"t": "Concord", "d": "Another name for grammatical agreement between words that must match in form."}, "he": {"t": "Concord (התאמה)", "d": "שם נוסף להתאמה דקדוקית בין מילים שצריכות להיות באותה צורה."}}, {"term": "conditional", "aliases": ["conditionals", "conditional sentence", "conditional sentences"], "cs": false, "areas": [], "en": {"t": "Conditional", "d": "A sentence pattern that links a condition to its consequence, usually using 'if'."}, "he": {"t": "Conditional (משפט תנאי)", "d": "תבנית משפט שמקשרת בין תנאי לבין התוצאה שלו, לרוב בעזרת 'if'."}}, {"term": "conjunction", "aliases": ["conjunctions"], "cs": false, "areas": [], "en": {"t": "Conjunction", "d": "A word that joins words, phrases or clauses to one another."}, "he": {"t": "Conjunction (מילת חיבור)", "d": "מילה שמחברת בין מילים, בין צירופים או בין פסוקיות במשפט."}}, {"term": "contraction", "aliases": ["contractions", "contracted form"], "cs": false, "areas": [], "en": {"t": "Contraction", "d": "A shortened spelling in which two words join with an apostrophe, such as 'don't' or 'she's'."}, "he": {"t": "Contraction (צורה מקוצרת)", "d": "כתיב מקוצר שבו שתי מילים מתאחדות עם גרש, למשל 'don't' או 'she's'."}}, {"term": "coordinating conjunction", "aliases": ["coordinating conjunctions", "coordinator", "coordinators"], "cs": false, "areas": [], "en": {"t": "Coordinating conjunction", "d": "A conjunction joining two elements of equal rank, such as 'and', 'but' or 'or'."}, "he": {"t": "Coordinating conjunction", "d": "מילת חיבור שמחברת שני חלקים שווי מעמד, למשל 'and', 'but' או 'or'."}}, {"term": "copula", "aliases": ["copulas", "copular verb"], "cs": false, "areas": [], "en": {"t": "Copula", "d": "The grammatical name for a linking verb, most often 'be', joining a subject to its description."}, "he": {"t": "Copula (אוגד)", "d": "השם הדקדוקי לפועל מקשר, לרוב 'be', שמחבר את הנושא לתיאור שלו."}}, {"term": "correlative conjunction", "aliases": ["correlative conjunctions", "correlative", "correlatives", "paired conjunction"], "cs": false, "areas": [], "en": {"t": "Correlative conjunction", "d": "A conjunction that comes as a linked pair of parts, such as 'both … and'."}, "he": {"t": "Correlative conjunction", "d": "מילת חיבור שמופיעה כזוג חלקים קשורים, למשל 'both … and'."}}, {"term": "countable noun", "aliases": ["countable nouns", "countable", "count noun", "count nouns"], "cs": false, "areas": [], "en": {"t": "Countable noun", "d": "A noun naming things that can be counted one by one and that has a plural form."}, "he": {"t": "Countable noun", "d": "שם עצם שניתן למנות אחד-אחד ושיש לו צורת רבים."}}, {"term": "counterfactual", "aliases": ["counterfactuals", "counter-factual"], "cs": false, "areas": [], "en": {"t": "Counterfactual", "d": "A statement about something contrary to the facts: what would be true had things gone differently."}, "he": {"t": "Counterfactual (היפותטי נגדי)", "d": "אמירה על משהו שאינו תואם את המציאות: מה היה נכון אילו הדברים היו מתרחשים אחרת."}}, {"term": "defining relative clause", "aliases": ["defining relative clauses", "restrictive relative clause"], "cs": false, "areas": [], "en": {"t": "Defining relative clause", "d": "A relative clause that identifies which person or thing the sentence is talking about."}, "he": {"t": "Defining relative clause (פסוקית זיקה מגדירה)", "d": "פסוקית זיקה שמזהה על איזה אדם או דבר בדיוק מדובר במשפט."}}, {"term": "determiner", "aliases": ["determiners"], "cs": false, "areas": [], "en": {"t": "Determiner", "d": "A word placed before a noun to show which one or how many, such as 'the' or 'this'."}, "he": {"t": "Determiner", "d": "מילה שמופיעה לפני שם עצם ומציינת איזה או כמה, למשל 'the' או 'this'."}}, {"term": "direct object", "aliases": ["direct objects"], "cs": false, "areas": [], "en": {"t": "Direct object", "d": "The thing or person acted on directly by the verb, as 'the book' in 'she read the book'."}, "he": {"t": "Direct object (מושא ישיר)", "d": "הדבר או האדם שהפועל פועל עליו ישירות, כמו 'the book' במשפט 'she read the book'."}}, {"term": "direct speech", "aliases": ["quoted speech", "direct quotation"], "cs": false, "areas": [], "en": {"t": "Direct speech", "d": "Someone's exact words, shown inside quotation marks just as they were spoken."}, "he": {"t": "Direct speech (דיבור ישיר)", "d": "המילים המדויקות של הדובר, מוצגות בתוך מירכאות בדיוק כפי שנאמרו."}}, {"term": "do-support", "aliases": ["do support", "dummy do"], "cs": false, "areas": [], "en": {"t": "Do-support", "d": "The use of 'do', 'does' or 'did' as an auxiliary where a sentence needs one."}, "he": {"t": "Do-support (שימוש בפועל העזר do)", "d": "השימוש ב-'do', 'does' או 'did' כפועל עזר במשפט שזקוק לפועל עזר."}}, {"term": "dummy subject", "aliases": ["dummy subjects", "expletive subject", "empty subject"], "cs": false, "areas": [], "en": {"t": "Dummy subject", "d": "A subject with no meaning of its own that only fills the subject slot; 'it is raining'."}, "he": {"t": "Dummy subject", "d": "נושא ריק מתוכן שרק ממלא את מקום הנושא, כמו ה-'it' ב-'it is raining'."}}, {"term": "dynamic verb", "aliases": ["dynamic verbs", "action verb"], "cs": false, "areas": [], "en": {"t": "Dynamic verb", "d": "A verb that describes an action or process, such as 'run', 'build' or 'eat'."}, "he": {"t": "Dynamic verb (פועל פעולה)", "d": "פועל שמתאר פעולה או תהליך, למשל 'run', 'build' או 'eat'."}}, {"term": "either or", "aliases": ["either … or", "either ... or", "either...or", "either/or"], "cs": false, "areas": [], "en": {"t": "Either … or", "d": "A paired structure presenting two alternatives, of which one applies."}, "he": {"t": "Either … or", "d": "מבנה זוגי שמציג שתי אפשרויות, שרק אחת מהן מתקיימת."}}, {"term": "ellipsis", "aliases": ["elliptical"], "cs": false, "areas": [], "en": {"t": "Ellipsis", "d": "Leaving out words the listener can recover from what was already said, as in 'yes, I have'."}, "he": {"t": "Ellipsis (השמטה)", "d": "השמטת מילים שהשומע משחזר ממה שנאמר קודם, למשל 'yes, I have'."}}, {"term": "embedded question", "aliases": ["embedded questions", "embedded clause question"], "cs": false, "areas": [], "en": {"t": "Embedded question", "d": "A question contained inside a larger sentence instead of standing on its own."}, "he": {"t": "Embedded question (שאלה משובצת)", "d": "שאלה שמשובצת בתוך משפט גדול יותר במקום לעמוד בפני עצמה."}}, {"term": "even if", "aliases": [], "cs": false, "areas": [], "en": {"t": "Even if", "d": "A link introducing a condition that makes no difference to the main statement."}, "he": {"t": "Even if", "d": "חיבור שפותח תנאי שאינו משנה את האמירה המרכזית."}}, {"term": "existential there", "aliases": ["existential 'there'", "there-construction", "existential construction"], "cs": false, "areas": [], "en": {"t": "Existential there", "d": "The use of 'there' as a placeholder subject in order to state that something exists."}, "he": {"t": "Existential there", "d": "שימוש ב-'there' כנושא מלאכותי שתפקידו להצהיר על קיומו של משהו."}}, {"term": "finite verb", "aliases": ["finite", "finite verbs"], "cs": false, "areas": [], "en": {"t": "Finite verb", "d": "A verb form that shows tense and agrees with its subject, like 'goes' in 'he goes'."}, "he": {"t": "Finite verb (פועל נטוי)", "d": "צורת פועל שמסמנת זמן ומתאימה לנושא, כמו 'goes' במשפט 'he goes'."}}, {"term": "first conditional", "aliases": ["conditional type 1", "type 1 conditional", "conditional 1"], "cs": false, "areas": [], "en": {"t": "First conditional", "d": "The conditional pattern used for a real future possibility and what would follow from it."}, "he": {"t": "First conditional (תנאי מסוג 1)", "d": "תבנית התנאי המשמשת לאפשרות אמיתית בעתיד ולמה שינבע ממנה."}}, {"term": "formal register", "aliases": ["formal style", "formal language", "formal English"], "cs": false, "areas": [], "en": {"t": "Formal register", "d": "The careful, impersonal style of language used in official, academic and professional contexts."}, "he": {"t": "Formal register", "d": "סגנון לשון מוקפד ולא אישי, המשמש בהקשרים רש ses": ["going-to future", "be going to", "going to"], "cs": false, "areas": [], "en": {"t": "Going to future", "d": "The form 'am/is/are going to' plus a verb, as in 'she is going to leave'."}, "he": {"t": "Going to future", "d": "המבנה 'am/is/are going to' בתוספת פועל, למשל 'she is going to leave'."}}, {"term": "habitual past", "aliases": ["past habit"], "cs": false, "areas": [], "en": {"t": "Habitual past", "d": "A past action that happened repeatedly or regularly rather than only once."}, "he": {"t": "Habitual past (עבר הרגלי)", "d": "פעולה בעבר שהתרחשה שוב ושוב או באופן קבוע, ולא פעם אחת בלבד."}}, {"term": "habitual would", "aliases": ["would (habitual)"], "cs": false, "areas": [], "en": {"t": "Habitual would", "d": "'Would' plus a verb, describing something that happened repeatedly in the past."}, "he": {"t": "Habitual would", "d": "'Would' בתוספת פועל, לתיאור משהו שהתרחש שוב ושוב בעבר."}}, {"term": "hardly when", "aliases": ["hardly … when", "hardly ... when", "hardly...when", "scarcely when", "scarcely … when", "barely when"], "cs": false, "areas": [], "en": {"t": "Hardly … when", "d": "A fixed pattern marking one event as barely finished when the next one happened."}, "he": {"t": "Hardly … when", "d": "תבנית קבועה שמסמנת שמקרה אחד בקושי הסתיים כשהתרחש המקרה הבא."}}, {"term": "head noun", "aliases": ["head nouns", "head of the noun phrase", "head"], "cs": false, "areas": [], "en": {"t": "Head noun", "d": "The central noun of a noun phrase; the other words in the phrase describe it."}, "he": {"t": "Head noun", "d": "שם העצם המרכזי בצירוף השמני; שאר המילים בצירוף מתארות אותו."}}, {"term": "hypothetical", "aliases": ["hypothetically"], "cs": false, "areas": [], "en": {"t": "Hypothetical", "d": "Describing a situation imagined for the sake of discussion rather than presented as real."}, "he": {"t": "Hypothetical (היפותטי)", "d": "תיאור של מצב שמדמיינים אותו לצורך הדיון, ולא מציגים אותו כמצב ממשי."}}, {"term": "if only", "aliases": [], "cs": false, "areas": [], "e   });

let tipEl = null, tipOwner = null;

    document.body.appendChild(tipEl);
  }
  return tipEl;
}
function hideTip(){
  if(tipEl) tipEl.classList.remove("show");
  if(tipOwner) tipOwner.classList.remove("on");
  tipOwner = null;
}
function showTip(el, idx){
  const e = GLOSSARY[idx];
  if(!e) return;
  const b = (e[S.lang] && e[S.lang].d) ? e[S.lang] : e.en;
  const n = tip();
  n.innerHTML = '<b>' + esc(b.t) + '</b><p>' + esc(b.d) + '</p>';
  n.classList.add("show");
  if(tipOwner && tipOwner !== el) tipOwner.classList.remove("on");
  tipOwner = el; el.classList.add("on");
  n.style.left = "0px"; n.style.top = "0px";
  /* Horizontally centred on the word, but vertically clear of the whole block it sits in,
     so the popover never covers the rest of the sentence it is explaining. */
  const block = el.closest(".qtext, .opt, .hintbox, .explain, .gitem, li, .q, .ansline") || el;
  const r = el.getBoundingClientRect(), br = block.getBoundingClientRect(), t = n.getBoundingClientRect();
  let left = r.left + r.width / 2 - t.width / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - t.width - 12));
  let top = br.bottom + 8;
  if(top + t.height > window.innerHeight - 12){
    const above = br.top - t.height - 8;
    top = above >= 12 ? above : Math.max(12, window.innerHeight - t.height - 12);
  }
  n.style.left = left + "px"; n.style.top = top + "px";
}
